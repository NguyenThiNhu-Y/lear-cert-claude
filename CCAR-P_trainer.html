ý lại các token đó, nên giảm cả chi phí input lẫn thời gian xử lý.<br><b>B.</b> <b>Model routing</b>: đưa truy vấn đơn giản sang mô hình nhỏ, nhanh, rẻ hơn (ví dụ Haiku) và giữ mô hình lớn cho ca phức tạp — giảm cả giá mỗi token lẫn độ trễ, với điều kiện chính sách định tuyến được kiểm chứng bằng eval đại diện.","elim":["<b>C.</b> Tăng <code>max_tokens</code> cho phép sinh output dài hơn, làm tăng chi phí output và thời gian sinh; nó chỉ tránh cắt cụt chứ không giảm chi phí/độ trễ của ca phổ biến.","<b>D.</b> Nạp toàn bộ corpus vào context window làm phình input token, tăng cả chi phí lẫn độ trễ — ngược với mục tiêu.","<b>E.</b> Thêm few-shot vào mọi request làm tăng số input token mỗi lần gọi, nên tăng chi phí và độ trễ thay vì giảm."]}},{"id":"ccarp-q042","n":42,"topic":3,"type":"mcq","stem":{"en":"You are evaluating a Claude-based deployment for adherence to a specific regulation. Which two steps must be completed BEFORE mapping deployment data flows to specific regulatory clauses? (Select two.) Each correct answer presents part of the solution.  [Chọn 2 đáp án]","vi":"Bạn đang đánh giá việc triển khai dựa trên Claude để tuân thủ một quy định cụ thể. Hai bước nào phải được hoàn thành TRƯỚC KHI ánh xạ các luồng dữ liệu triển khai tới các điều khoản quy định cụ thể? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một phần của giải pháp.  [Chọn 2 đáp án]","jp":"あなたは、クロードベースの展開が特定の規制に準拠しているかどうかを評価しています。 導入データ フローを特定の規制条項にマッピングする前に完了する必要がある 2 つの手順はどれですか? (2 つ選択してください。) それぞれの正解は、解決策の一部を示しています。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Compare the in-place controls against the regulatory requirements to identify any compliance gaps.","vi":"So sánh các biện pháp kiểm soát tại chỗ với các yêu cầu quy định để xác định mọi thiếu sót về tuân thủ.","jp":"インプレース管理を規制要件と比較して、コンプライアンスのギャップを特定します。"}},{"k":"B","t":{"en":"Identify the applicability of the regulation based on data types, jurisdiction, and audience.","vi":"Xác định khả năng áp dụng quy định dựa trên loại dữ liệu, quyền tài phán và đối tượng.","jp":"データの種類、管轄区域、対象者に基づいて規制の適用可能性を特定します。"}},{"k":"C","t":{"en":"Schedule the remediation work with the engineering team based on the prioritized gap findings.","vi":"Lên lịch công việc khắc phục với nhóm kỹ thuật dựa trên những phát hiện còn thiếu được ưu tiên.","jp":"優先順位付けされたギャップの発見に基づいて、エンジニアリング チームと協力して修復作業のスケジュールを立てます。"}},{"k":"D","t":{"en":"Document the identified gaps along with recommended remediations and residual risk for signoff.","vi":"Ghi lại các lỗ hổng đã xác định cùng với các biện pháp khắc phục được đề xuất và rủi ro còn lại để phê duyệt.","jp":"特定されたギャップを、承認のための推奨される改善策および残留リスクとともに文書化します。"}},{"k":"E","t":{"en":"Inventory the vendor-provided compliance tooling and confirm which compliance affordances are in place.","vi":"Kiểm kê công cụ tuân thủ do nhà cung cấp cung cấp và xác nhận xem có đủ khả năng tuân thủ hay không.","jp":"ベンダーが提供するコンプライアンス ツールの一覧を作成し、どのコンプライアンス アフォーダンスが導入されているかを確認します。"}}],"answer":["B","E"],"multi":true,"explain":{"key":"<b>Đáp án B, E.</b> Trước khi ánh xạ luồng dữ liệu vào từng điều khoản, phải xác lập <b>phạm vi</b> và <b>đường cơ sở kiểm soát</b>.<br><b>B.</b> Xác định <b>tính áp dụng</b> của quy định dựa trên loại dữ liệu, khu vực pháp lý và đối tượng người dùng — nếu bỏ qua, việc mapping có thể áp nghĩa vụ không liên quan hoặc sót nghĩa vụ áp dụng.<br><b>E.</b> Kiểm kê các công cụ/khả năng tuân thủ mà nhà cung cấp đã có (audit log, kiểm soát lưu trữ, quản trị truy cập, data residency, khả năng xuất dữ liệu tuân thủ) để biết control nào đang tồn tại trước khi đối chiếu với điều khoản.","elim":["<b>A.</b> So sánh control hiện có với yêu cầu để tìm gap là bước <i>sau</i> khi đã ánh xạ luồng dữ liệu vào điều khoản — không thể tìm gap khi chưa biết điều khoản nào áp cho luồng nào.","<b>C.</b> Lên lịch remediation dựa trên gap đã ưu tiên là bước hạ nguồn, phụ thuộc vào kết quả gap analysis.","<b>D.</b> Lập tài liệu gap, khuyến nghị khắc phục và rủi ro tồn dư để ký duyệt là bước cuối của đánh giá, không phải điều kiện tiên quyết cho việc mapping."]}},{"id":"ccarp-q043","n":43,"topic":3,"type":"mcq","stem":{"en":"A research summarization assistant has been deployed for six months. A user has flagged that a generated summary contained a fabricated citation. The product team has asked whether the incident requires architectural action or whether it is an isolated case. Which two Diligence-competency actions should you take? (Select two.) Each correct answer presents part of the solution.  [Chọn 2 đáp án]","vi":"Một trợ lý tóm tắt nghiên cứu đã được triển khai trong sáu tháng. Một người dùng đã gắn cờ rằng bản tóm tắt được tạo có chứa trích dẫn bịa đặt. Nhóm sản phẩm đã hỏi liệu sự cố có cần đến biện pháp kiến ​​trúc hay không hay đó chỉ là một trường hợp cá biệt. Bạn nên thực hiện hai hành động Siêng năng-năng lực nào? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một phần của giải pháp.  [Chọn 2 đáp án]","jp":"研究要約アシスタントが 6 か月間配置されました。ユーザーは、生成された概要に捏造された引用が含まれていると報告しました。製品チームは、このインシデントにアーキテクチャ上のアクションが必要か、それとも個別のケースなのかを尋ねました。 勤勉コンピテンシーに関する 2 つのアクションのうち、どれを実行する必要がありますか? (2 つ選択してください。) それぞれの正解は、解決策の一部を示しています。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Sample recent summaries to estimate the fabrication frequency across the population.","vi":"Lấy mẫu các bản tóm tắt gần đây để ước tính tần suất bịa đặt trên tổng thể.","jp":"最近の概要をサンプリングして、母集団全体の製造頻度を推定します。"}},{"k":"B","t":{"en":"Disable the assistant immediately for all current users without any prior diagnostic analysis.","vi":"Vô hiệu hóa trợ lý ngay lập tức đối với tất cả người dùng hiện tại mà không có bất kỳ phân tích chẩn đoán nào trước đó.","jp":"事前の診断分析を行わずに、現在のすべてのユーザーに対してアシスタントをただちに無効にします。"}},{"k":"C","t":{"en":"Review whether citation-grounding controls exist anywhere in the current generation pipeline.","vi":"Xem xét liệu các biện pháp kiểm soát căn cứ trích dẫn có tồn tại ở bất kỳ đâu trong quy trình tạo ra hiện tại hay không.","jp":"現在の生成パイプラインのどこかに引用根拠のコントロールが存在するかどうかを確認します。"}},{"k":"D","t":{"en":"Communicate to users that the assistant does not fabricate output as a matter of design.","vi":"Thông báo cho người dùng rằng trợ lý không tạo ra kết quả đầu ra theo thiết kế.","jp":"アシスタントは設計上の問題として出力を捏造するものではないことをユーザーに伝えます。"}},{"k":"E","t":{"en":"Treat the incident as an anecdotal isolated case and take no further investigative action.","vi":"Hãy coi vụ việc như một trường hợp cá biệt mang tính giai thoại và không thực hiện hành động điều tra nào thêm.","jp":"この事件を個別の事例として扱い、それ以上の調査行動は行わないでください。"}}],"answer":["A","C"],"multi":true,"explain":{"key":"<b>Đáp án A, C.</b> Năng lực <b>Diligence</b> đòi hỏi điều tra có hệ thống trước khi kết luận sự cố là cá biệt hay mang tính kiến trúc.<br><b>A.</b> <b>Lấy mẫu các bản tóm tắt gần đây</b> để ước lượng tần suất bịa trích dẫn trên toàn quần thể — một ca được xác nhận không cho biết tỷ lệ lỗi, cũng không cho biết lỗi có tương quan với loại tài liệu, prompt hay phiên bản mô hình hay không.<br><b>C.</b> <b>Rà soát kiểm soát grounding trích dẫn</b> trong pipeline (sinh nội dung giới hạn theo nguồn, đối chiếu claim–nguồn, yêu cầu trích dẫn nguyên văn, từ chối nhận định không có nguồn) — nếu không có, đó là lỗ hổng kiến trúc chứ không phải sự cố ngẫu nhiên.","elim":["<b>B.</b> Tắt trợ lý cho toàn bộ người dùng khi chưa có bất kỳ phân tích chẩn đoán nào là phản ứng thái quá, không dựa trên bằng chứng về mức độ phổ biến của lỗi.","<b>D.</b> Tuyên bố trợ lý không bao giờ bịa đặt là sai sự thật — LLM có thể hallucinate và đã có một ca được xác nhận; thông điệp này còn làm mất lòng tin.","<b>E.</b> Coi đây là ca cá biệt và không điều tra là bỏ qua đúng câu hỏi đội sản phẩm đặt ra, trái với tinh thần Diligence."]},"cite":"Hướng dẫn ôn tập — §12.1 Vấn đề Mất Quy kết Nguồn; Lĩnh vực 5.6"},{"id":"ccarp-q044","n":44,"topic":3,"type":"mcq","stem":{"en":"A security team is evaluating two proposed controls. Control A adds an outbound tool allowlist with destination restrictions and per-call review. Control B scores responses against a stable adversarial evaluation set after each model-version change. Which two risk categories are correctly matched to these controls? (Select two.)  [Chọn 2 đáp án]","vi":"Một nhóm bảo mật đang đánh giá hai biện pháp kiểm soát được đề xuất. Kiểm soát A thêm danh sách cho phép công cụ gửi đi với các hạn chế về đích đến và đánh giá mỗi cuộc gọi. Kiểm soát B chấm điểm các phản hồi dựa trên bộ đánh giá đối thủ ổn định sau mỗi lần thay đổi phiên bản mô hình. Hai loại rủi ro nào phù hợp chính xác với các biện pháp kiểm soát này? (Chọn 2.) [Chọn 2 đáp án]","jp":"セキュリティ チームは、提案された 2 つの制御を評価しています。コントロール A は、宛先制限と通話ごとのレビューを含む送信ツール許可リストを追加します。コントロール B は、モデル バージョンが変更されるたびに、安定した敵対的評価セットに対して応答をスコア付けします。 これらのコントロールに正しく一致する 2 つのリスク カテゴリはどれですか? (2 つ選択してください。) [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Control A - prompt injection from adversarial content in retrieved data","vi":"Kiểm soát A - đưa nội dung đối nghịch vào dữ liệu được truy xuất","jp":"コントロール A - 取得したデータ内の敵対的なコンテンツからのプロンプト インジェクション"}},{"k":"B","t":{"en":"Control A - silent quality drift after a model-version upgrade","vi":"Kiểm soát A - trôi dạt chất lượng im lặng sau khi nâng cấp phiên bản mô hình","jp":"コントロール A - モデル バージョンのアップグレード後のサイレント品質ドリフト"}},{"k":"C","t":{"en":"Control A - data exfiltration via outbound tool calls","vi":"Kiểm soát A - lọc dữ liệu thông qua các lệnh gọi công cụ gửi đi","jp":"コントロール A - アウトバウンド ツール呼び出しによるデータ漏洩"}},{"k":"D","t":{"en":"Control B - data exfiltration via outbound tool calls","vi":"Kiểm soát B - lọc dữ liệu thông qua các lệnh gọi công cụ gửi đi","jp":"コントロール B - アウトバウンド ツール呼び出しによるデータ漏洩"}},{"k":"E","t":{"en":"Control B - silent quality drift after a model-version upgrade","vi":"Kiểm soát B - trôi dạt chất lượng im lặng sau khi nâng cấp phiên bản mô hình","jp":"コントロール B - モデル バージョンのアップグレード後のサイレント品質ドリフト"}}],"answer":["C","E"],"multi":true,"explain":{"key":"<b>Đáp án C, E.</b> Mỗi control phải được ghép với rủi ro mà nó trực tiếp giảm thiểu.<br><b>C.</b> Control A (<b>allowlist tool gửi ra ngoài</b> + giới hạn đích đến + review từng lời gọi) thu hẹp bề mặt hành động đi ra, tạo ranh giới phê duyệt trước khi dữ liệu rời môi trường — chính là biện pháp chống <b>rò rỉ dữ liệu qua outbound tool call</b>.<br><b>E.</b> Control B (<b>chấm điểm trên tập eval adversarial ổn định</b> sau mỗi lần đổi phiên bản mô hình) là cơ chế regression giúp phát hiện <b>trôi chất lượng âm thầm</b> sau nâng cấp mô hình.","elim":["<b>A.</b> Allowlist outbound chỉ hạn chế hậu quả, không ngăn nội dung độc hại trong dữ liệu truy xuất thao túng mô hình; prompt injection cần xử lý dữ liệu như không tin cậy, classifier đầu vào, tách quyền.","<b>B.</b> Allowlist tool và review từng lời gọi không đo chất lượng đầu ra qua các phiên bản mô hình, nên không phát hiện được drift.","<b>D.</b> Eval định kỳ chỉ đo và phát hiện, không chặn được lời gọi outbound đang diễn ra — không phải control phòng ngừa exfiltration."]}},{"id":"ccarp-q045","n":45,"topic":3,"type":"mcq","stem":{"en":"You are selecting a model for a new production workload and must complete the upstream steps before testing candidate models empirically. Which two steps must be completed BEFORE running a representative sample on a candidate model? (Select two.) Each correct answer presents part of the solution.  [Chọn 2 đáp án]","vi":"Bạn đang chọn một mô hình cho khối lượng công việc sản xuất mới và phải hoàn thành các bước ngược dòng trước khi thử nghiệm các mô hình ứng cử viên theo kinh nghiệm. Hai bước nào phải được hoàn thành TRƯỚC KHI chạy mẫu đại diện trên mô hình ứng cử viên? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một phần của giải pháp.  [Chọn 2 đáp án]","jp":"新しい実稼働ワークロードのモデルを選択しているため、候補モデルを実証的にテストする前に、上流のステップを完了する必要があります。 候補モデルで代表的なサンプルを実行する前に完了する必要がある 2 つの手順はどれですか? (2 つ選択してください。) それぞれの正解は、解決策の一部を示しています。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Select the lightest model that consistently meets the quality bar across the sample.","vi":"Chọn mô hình nhẹ nhất đáp ứng tiêu chuẩn chất lượng một cách nhất quán trên toàn bộ mẫu.","jp":"サンプル全体で一貫して品質バーを満たす最も軽量のモデルを選択します。"}},{"k":"B","t":{"en":"Retest the model choice when a new model version becomes available.","vi":"Kiểm tra lại lựa chọn kiểu máy khi có phiên bản kiểu máy mới.","jp":"新しいモデル バージョンが利用可能になったら、モデルの選択を再テストします。"}},{"k":"C","t":{"en":"Choose a candidate model based on the requirements profile and known capabilities.","vi":"Chọn mô hình ứng viên dựa trên hồ sơ yêu cầu và khả năng đã biết.","jp":"要件プロファイルと既知の機能に基づいて候補モデルを選択します。"}},{"k":"D","t":{"en":"Define the quality bar, latency tolerance, and expected volume for the workload.","vi":"Xác định thanh chất lượng, dung sai độ trễ và khối lượng dự kiến ​​cho khối lượng công việc.","jp":"ワークロードの品質基準、待ち時間許容値、および予想される量を定義します。"}},{"k":"E","t":{"en":"Sign off the production rollout plan with the platform and security teams.","vi":"Ký kết kế hoạch triển khai sản xuất với nền tảng và nhóm bảo mật.","jp":"プラットフォームおよびセキュリティ チームと実稼働展開計画を承認します。"}}],"answer":["C","D"],"multi":true,"explain":{"key":"<b>Đáp án C, D.</b> Thử nghiệm thực nghiệm chỉ có ý nghĩa khi có <b>khung quyết định</b> và một <b>ứng viên hợp lý</b>.<br><b>D.</b> Phải định nghĩa trước <b>ngưỡng chất lượng, độ trễ chấp nhận được và lưu lượng dự kiến</b> — đây là tiêu chí để biết kết quả chạy mẫu đạt hay không; thiếu nó thì đo được số liệu nhưng không ra quyết định có căn cứ.<br><b>C.</b> Sau đó chọn <b>mô hình ứng viên</b> dựa trên hồ sơ yêu cầu và năng lực đã biết của các mô hình, thay vì thử tùy tiện — rồi mới chạy mẫu đại diện trên ứng viên đó.","elim":["<b>A.</b> Chọn mô hình nhẹ nhất đạt chất lượng ổn định trên tập mẫu là bước <i>sau</i> khi đã chạy mẫu, vì cần kết quả thử nghiệm để so sánh.","<b>B.</b> Thử lại khi có phiên bản mô hình mới là hoạt động vận hành định kỳ sau khi đã đưa vào production, không phải bước tiên quyết.","<b>E.</b> Ký duyệt kế hoạch rollout production với platform/security diễn ra sau khi đã chọn xong mô hình qua thử nghiệm."]}},{"id":"ccarp-q046","n":46,"topic":3,"type":"mcq","stem":{"en":"You are preparing an operational runbook for a Claude-based service. Which content is essential to include in the runbook?","vi":"Bạn đang chuẩn bị sổ sách hoạt động cho dịch vụ có trụ sở tại Claude. Nội dung nào là cần thiết để đưa vào runbook?","jp":"あなたは、Claude ベースのサービスの運用 Runbook を準備しています。 Runbook に含める必要があるコンテンツはどれですか?"},"options":[{"k":"A","t":{"en":"Dashboard and log references only, without alert definitions, triage steps, escalation paths, or rollback procedures for the on-call engineer to act on.","vi":"Chỉ tham chiếu bảng thông tin và nhật ký, không có định nghĩa cảnh báo, các bước phân loại, đường dẫn báo cáo hoặc quy trình khôi phục để kỹ sư đang hoạt động thực hiện.","jp":"ダッシュボードとログ参照のみ。アラート定義、トリアージ手順、エスカレーション パス、オンコール エンジニアが対応するロールバック手順は含まれません。"}},{"k":"B","t":{"en":"Common alerts and their triage steps, escalation paths, rollback procedures, and references to the relevant dashboards and logs.","vi":"Các cảnh báo phổ biến và các bước phân loại, đường dẫn báo cáo, quy trình khôi phục cũng như các tham chiếu đến bảng thông tin và nhật ký có liên quan.","jp":"一般的なアラートとそのトリアージ手順、エスカレーション パス、ロールバック手順、関連するダッシュボードとログへの参照。"}},{"k":"C","t":{"en":"Alert definitions and triage steps only, without escalation paths, rollback procedures, or references to dashboards and logs for on-call use.","vi":"Chỉ các định nghĩa cảnh báo và các bước phân loại, không có đường dẫn báo cáo, quy trình khôi phục hoặc tham chiếu đến bảng thông tin và nhật ký để sử dụng khi cần thiết.","jp":"アラート定義とトリアージ手順のみ。エスカレーション パス、ロールバック手順、またはオンコールで使用するためのダッシュボードとログへの参照はありません。"}},{"k":"D","t":{"en":"Escalation paths and rollback procedures only, without alert definitions, triage steps, or dashboard references to guide initial incident response.","vi":"Chỉ có đường dẫn leo thang và quy trình khôi phục, không có định nghĩa cảnh báo, các bước phân loại hoặc tham chiếu bảng thông tin để hướng dẫn ứng phó sự cố ban đầu.","jp":"エスカレーション パスとロールバック手順のみ。アラート定義、トリアージ手順、または初期インシデント対応をガイドするダッシュボード参照はありません。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Một runbook vận hành phải <b>hành động được</b>, nối liền chuỗi phát hiện → chẩn đoán → khoanh vùng → khôi phục → leo thang. <b>Alert phổ biến + bước triage</b> giúp kỹ sư on-call biết điều gì bất thường và bắt đầu từ đâu; <b>dashboard và log</b> cung cấp bằng chứng; <b>escalation path</b> chỉ rõ ai có thẩm quyền; <b>rollback</b> đưa hệ thống về trạng thái an toàn đã biết. Với dịch vụ dựa trên Claude, các tình huống cần bao phủ gồm lỗi API, rate limit, độ trễ tăng, lỗi tool, regression prompt, chi phí bất thường.","elim":["<b>A.</b> Chỉ có tham chiếu dashboard/log thì kỹ sư có dữ liệu nhưng không biết alert nào quan trọng, triage thế nào, gọi ai hay rollback ra sao.","<b>C.</b> Có alert và triage nhưng thiếu escalation, rollback và nguồn bằng chứng — on-call không thể khôi phục hay chuyển giao khi vượt khả năng.","<b>D.</b> Chỉ có escalation và rollback mà không có định nghĩa alert/triage thì không có hướng dẫn cho giai đoạn phản ứng ban đầu, dễ rollback hoặc leo thang sai lúc."]}},{"id":"ccarp-q047","n":47,"topic":3,"type":"mcq","stem":{"en":"You are designing a feedback session for a deployment in flight. Which structure best supports productive stakeholder feedback?","vi":"Bạn đang thiết kế một phiên phản hồi cho việc triển khai trên chuyến bay. Cấu trúc nào hỗ trợ tốt nhất cho phản hồi hiệu quả của các bên liên quan?","jp":"あなたは、進行中のデプロイメントのフィードバック セッションを設計しています。 利害関係者の生産的なフィードバックを最もよくサポートする構造はどれですか?"},"options":[{"k":"A","t":{"en":"Hold an open-ended meeting with no pre-distributed agenda or artifacts, and rely on participants' memory to carry decisions and follow-up owners forward.","vi":"Tổ chức một cuộc họp mở mà không có chương trình nghị sự hoặc đồ tạo tác được phân phối trước và dựa vào trí nhớ của những người tham gia để đưa ra các quyết định và chủ sở hữu theo dõi tiếp theo.","jp":"事前に配布された議題や成果物のない自由形式の会議を開催し、参加者の記憶に頼って意思決定を進め、オーナーをフォローアップします。"}},{"k":"B","t":{"en":"Define a focused agenda, share the artifacts in advance, capture decisions and follow-ups in writing, and confirm action owners and dates.","vi":"Xác định chương trình nghị sự tập trung, chia sẻ trước các nội dung, nắm bắt các quyết định và theo dõi bằng văn bản, đồng thời xác nhận chủ sở hữu hành động và ngày tháng.","jp":"焦点を絞った議題を定義し、成果物を事前に共有し、決定事項とフォローアップを書面で記録し、アクションの所有者と日付を確認します。"}},{"k":"C","t":{"en":"Distribute artifacts at the session start rather than in advance, so stakeholders review materials in real time without preparation before the discussion begins.","vi":"Phân phối các hiện vật ngay khi bắt đầu phiên thay vì trước, để các bên liên quan xem xét tài liệu theo thời gian thực mà không cần chuẩn bị trước khi cuộc thảo luận bắt đầu.","jp":"アーティファクトを事前ではなくセッション開始時に配布することで、関係者はディスカッション開始前の準備なしでリアルタイムで資料を確認できます。"}},{"k":"D","t":{"en":"End the session without recording decisions, follow-up items, action owners, or dates, relying on participant memory to carry the session's outcomes forward.","vi":"Kết thúc phiên mà không ghi lại các quyết định, mục tiếp theo, chủ sở hữu hành động hoặc ngày tháng, dựa vào trí nhớ của người tham gia để chuyển tiếp kết quả của phiên.","jp":"決定事項、フォローアップ項目、アクション所有者、または日付を記録せずにセッションを終了し、参加者の記憶に頼ってセッションの結果を進めます。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Buổi feedback hiệu quả cần <b>chuẩn bị có thông tin</b>, <b>quyết định có thể truy vết</b> và <b>trách nhiệm rõ ràng</b>. <b>Agenda tập trung</b> giữ thảo luận bám vào các quyết định cần đưa ra; <b>gửi tài liệu trước</b> (sơ đồ kiến trúc, kết quả eval, risk register) để stakeholder xem xét kỹ; <b>ghi lại quyết định và follow-up bằng văn bản</b> tránh mỗi người hiểu một kiểu; <b>xác nhận owner và hạn chót</b> biến feedback thành công việc thực thi được cho một deployment đang chạy.","elim":["<b>A.</b> Họp mở không agenda, không tài liệu, dựa vào trí nhớ người tham dự — quyết định và người phụ trách dễ bị thất lạc hoặc hiểu khác nhau.","<b>C.</b> Phát tài liệu ngay đầu buổi khiến stakeholder phản hồi vội, không có thời gian chuẩn bị nên chất lượng feedback thấp.","<b>D.</b> Không ghi lại quyết định, follow-up, owner và hạn chót thì kết quả buổi họp không thể truy vết hay thực thi."]}},{"id":"ccarp-q048","n":48,"topic":3,"type":"mcq","stem":{"en":"You are integrating AI-assisted tooling into the team's documentation workflow. The team wants generated documentation that stays grounded in the actual code. Which integration approach best fits this requirement?","vi":"Bạn đang tích hợp công cụ được hỗ trợ bởi AI vào quy trình làm việc về tài liệu của nhóm. Nhóm muốn tài liệu được tạo dựa trên mã thực tế. Phương pháp tích hợp nào phù hợp nhất với yêu cầu này?","jp":"あなたは、AI 支援ツールをチームのドキュメント ワークフローに統合しています。チームは、実際のコードに基づいたドキュメントを生成したいと考えています。 この要件に最も適した統合アプローチはどれですか?"},"options":[{"k":"A","t":{"en":"Generate documentation from the model's training-data recall without reading any of the actual repository code, accepting that the output will not reflect the current implementation.","vi":"Tạo tài liệu từ việc thu hồi dữ liệu đào tạo của mô hình mà không cần đọc bất kỳ mã kho lưu trữ thực tế nào, chấp nhận rằng đầu ra sẽ không phản ánh việc triển khai hiện tại.","jp":"実際のリポジトリ コードを一切読み込まずに、出力が現在の実装を反映しないことを受け入れ、モデルのトレーニング データの呼び出しからドキュメントを生成します。"}},{"k":"B","t":{"en":"Have the subagents publish generated documentation directly to the public-facing site without passing through the team's normal review workflow or any human approval step.","vi":"Yêu cầu các đại lý phụ xuất bản tài liệu được tạo trực tiếp lên trang web công khai mà không cần thông qua quy trình đánh giá thông thường của nhóm hoặc bất kỳ bước phê duyệt nào của con người.","jp":"サブエージェントには、チームの通常のレビュー ワークフローや人による承認ステップを経由せずに、生成されたドキュメントを公開サイトに直接公開します。"}},{"k":"C","t":{"en":"Configure subagents that read the relevant code files via filesystem and code-search tools, generate the documentation, and emit changes through the team's normal review workflow.","vi":"Định cấu hình các tác nhân phụ đọc các tệp mã có liên quan thông qua hệ thống tệp và các công cụ tìm kiếm mã, tạo tài liệu và đưa ra các thay đổi thông qua quy trình đánh giá thông thường của nhóm.","jp":"ファイルシステムおよびコード検索ツールを介して関連するコード ファイルを読み取り、ドキュメントを生成し、チームの通常のレビュー ワークフローを通じて変更を発行するサブエージェントを構成します。"}},{"k":"D","t":{"en":"Disable all filesystem and code-search tools so the subagents cannot read any repository code, accepting that documentation generation will be entirely disconnected from the actual implementation.","vi":"Vô hiệu hóa tất cả các công cụ tìm kiếm mã và hệ thống tệp để các tác nhân phụ không thể đọc bất kỳ mã kho lưu trữ nào, chấp nhận rằng việc tạo tài liệu sẽ hoàn toàn bị ngắt kết nối với quá trình triển khai thực tế.","jp":"すべてのファイルシステムとコード検索ツールを無効にして、サブエージェントがリポジトリ コードを読み取れないようにします。ドキュメントの生成が実際の実装から完全に切り離されることを受け入れます。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Tài liệu chỉ <b>bám sát code</b> khi agent sinh tài liệu được đọc chính mã nguồn hiện hành. Cấu hình <b>subagent</b> có tool đọc file và tìm kiếm code (<code>Read</code>, <code>Grep</code>, <code>Glob</code>) để xác định module, interface, cấu hình, test liên quan rồi viết tài liệu từ bằng chứng đó; việc khám phá repo diễn ra trong context riêng của subagent nên context chính không bị phình. Cuối cùng thay đổi đi qua <b>quy trình review bình thường</b> của nhóm, giữ được kiểm soát con người.","elim":["<b>A.</b> Sinh tài liệu từ trí nhớ dữ liệu huấn luyện không phản ánh code private hay thay đổi gần đây — trái với yêu cầu grounding.","<b>B.</b> Xuất bản thẳng lên site công khai bỏ qua review và phê duyệt con người, rủi ro đưa tài liệu sai hoặc lộ thông tin nội bộ ra ngoài.","<b>D.</b> Tắt tool đọc file/tìm code khiến subagent không thể xem implementation, nên tài liệu hoàn toàn tách rời code thực tế."]},"cite":"Hướng dẫn ôn tập — §11.5 Ủy quyền cho Subagent để Bảo vệ Context; §13.1 Tham chiếu Lựa chọn Tool"},{"id":"ccarp-q049","n":49,"topic":3,"type":"mcq","stem":{"en":"You are reviewing a peer's end-to-end design for a Claude-based platform expected to scale to thousands of concurrent users. For each statement, indicate Yes if it reflects sound architectural practice. Otherwise, select No.","vi":"Bạn đang xem xét thiết kế toàn diện của một đối tác ngang hàng cho nền tảng dựa trên Claude dự kiến ​​sẽ mở rộng tới hàng nghìn người dùng đồng thời. Đối với mỗi câu, hãy cho biết Có nếu nó phản ánh thực tiễn kiến ​​trúc đúng đắn. Ngược lại chọn Không.","jp":"あなたは、数千人の同時ユーザーに拡張することが予想されるクロードベースのプラットフォームのピアのエンドツーエンド設計をレビューしています。 各ステートメントについて、健全なアーキテクチャの実践を反映している場合は「はい」と示してください。それ以外の場合は、「いいえ」を選択します。"},"options":[{"k":"A","t":{"en":"No - Yes - Yes - No","vi":"Không - Có - Có - Không","jp":"いいえ - はい - はい - いいえ"}},{"k":"B","t":{"en":"Yes - No - No - Yes","vi":"Có - Không - Không - Có","jp":"はい - いいえ - いいえ - はい"}},{"k":"C","t":{"en":"Yes - Yes - No - No","vi":"Có - Có - Không - Không","jp":"はい - はい - いいえ - いいえ"}},{"k":"D","t":{"en":"No - No - Yes - Yes","vi":"Không - Không - Có - Có","jp":"いいえ - いいえ - はい - はい"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C (Yes – Yes – No – No).</b><br>1. <b>Yes</b> — Xác thực và phân quyền chạy <b>trước retrieval</b> để retrieval lọc theo danh tính, dữ liệu không được phép không bao giờ vào context mô hình.<br>2. <b>Yes</b> — <b>Hàng đợi bất đồng bộ</b> giữa tầng tiếp nhận và tầng gọi mô hình hấp thụ lưu lượng đột biến, tạo backpressure, kiểm soát concurrency và retry — cần thiết khi có hàng nghìn người dùng đồng thời.<br>3. <b>No</b> — Tính thuế là phép tính xác định, phải nằm trong <b>code</b> (có thể gọi qua tool), không mã hóa trong system prompt vốn mang tính xác suất.<br>4. <b>No</b> — Log chứa số định danh chính phủ chưa che (unredacted) vi phạm nguyên tắc tối thiểu hóa dữ liệu và tạo rủi ro lộ PII.","elim":["<b>A.</b> (No – Yes – Yes – No) sai ở mục 1 và 3: auth trước retrieval là đúng, còn tính thuế trong prompt là sai.","<b>B.</b> (Yes – No – No – Yes) sai ở mục 2 và 4: hàng đợi async là thực hành tốt khi scale, còn log PII chưa che là sai.","<b>D.</b> (No – No – Yes – Yes) đảo ngược toàn bộ: bác bỏ hai thực hành đúng và chấp nhận hai thực hành sai."]}},{"id":"ccarp-q050","n":50,"topic":3,"type":"mcq","stem":{"en":"You are presenting an architectural decision to a mixed audience that includes an executive sponsor and the engineering leads who will implement the decision. Which presentation strategy best serves both audiences?","vi":"Bạn đang trình bày một quyết định về kiến ​​trúc cho nhiều đối tượng, bao gồm nhà tài trợ điều hành và các trưởng nhóm kỹ thuật, những người sẽ thực hiện quyết định đó. Chiến lược trình bày nào phục vụ tốt nhất cho cả hai đối tượng?","jp":"あなたは、エグゼクティブ スポンサーとその決定を実装するエンジニアリング リーダーを含むさまざまな聴衆にアーキテクチャ上の決定を提示します。 どちらのプレゼンテーション戦略が両方の聴衆に最も役立つでしょうか?"},"options":[{"k":"A","t":{"en":"Open with a deep dive into low-level implementation details targeted at engineering leads, and stop there without addressing the business outcomes or trade-offs the executive sponsor needs.","vi":"Mở đầu bằng việc đi sâu vào các chi tiết triển khai cấp thấp nhắm vào các trưởng nhóm kỹ thuật và dừng ở đó mà không giải quyết các kết quả kinh doanh hoặc sự đánh đổi mà nhà tài trợ điều hành cần.","jp":"エンジニアリング リーダーを対象とした低レベルの実装の詳細を深く掘り下げることから始めますが、エグゼクティブ スポンサーが必要とするビジネスの成果やトレードオフに対処せずにそこで終了します。"}},{"k":"B","t":{"en":"Lead with the decision, the business outcomes it serves, and the trade-offs accepted; follow with the technical rationale, alternatives, and implementation implications for the engineering audience.","vi":"Dẫn đầu bằng quyết định, kết quả kinh doanh mà nó mang lại và những đánh đổi được chấp nhận; tuân theo lý do kỹ thuật, các lựa chọn thay thế và ý nghĩa triển khai đối với đối tượng kỹ thuật.","jp":"意思決定、それがもたらすビジネス上の成果、および受け入れられるトレードオフを主導します。次に、技術的根拠、代替案、およびエンジニアリング関係者向けの実装への影響について説明します。"}},{"k":"C","t":{"en":"Skip the rationale, alternatives, and trade-off discussion entirely and simply announce the chosen decision, leaving both audiences without the context needed to implement or validate it.","vi":"Bỏ qua hoàn toàn lý do cơ bản, các lựa chọn thay thế và thảo luận đánh đổi và chỉ công bố quyết định đã chọn, khiến cả hai đối tượng không có bối cảnh cần thiết để thực hiện hoặc xác nhận quyết định đó.","jp":"理論的根拠、代替案、トレードオフの議論を完全にスキップし、選択した決定を単に発表するだけで、両方の聴衆にはそれを実装または検証するために必要なコンテキストが与えられません。"}},{"k":"D","t":{"en":"Present a single undifferentiated narrative that addresses technical and business concerns with equal weight throughout, treating both audiences as requiring the same depth on every section.","vi":"Trình bày một câu chuyện không phân biệt duy nhất nhằm giải quyết các mối quan tâm về kỹ thuật và kinh doanh với trọng lượng như nhau xuyên suốt, coi cả hai đối tượng đều yêu cầu có cùng độ sâu trên mọi phần.","jp":"技術的な問題とビジネス上の懸念を全体を通して同じ重みで扱う、単一の区別のない物語を提示し、両方の聴衆がすべてのセクションについて同じ深さを必要としているものとして扱います。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Dùng <b>tiết lộ dần (progressive disclosure)</b>: mở đầu bằng <b>quyết định, kết quả kinh doanh và các đánh đổi chấp nhận</b> — đủ để executive sponsor đánh giá sự phù hợp chiến lược, chi phí và rủi ro; sau đó đi sâu vào <b>lý do kỹ thuật, phương án đã loại và hệ quả triển khai</b> mà engineering lead cần để thực hiện và kiểm chứng. Một bài trình bày phục vụ đúng độ sâu cho từng nhóm khán giả mà không bỏ ai.","elim":["<b>A.</b> Chỉ đi sâu chi tiết triển khai bỏ rơi executive sponsor, người cần biết kết quả kinh doanh và đánh đổi để phê duyệt.","<b>C.</b> Chỉ công bố quyết định mà không có lý do, phương án thay thế, đánh đổi thì cả hai nhóm đều thiếu context để thực thi hoặc thẩm định.","<b>D.</b> Một mạch trình bày đồng đều cho mọi phần khiến executive bị ngập chi tiết kỹ thuật và engineer thiếu chiều sâu cần thiết — không phân tầng theo nhu cầu khán giả."]}},{"id":"ccarp-q051","n":51,"topic":3,"type":"mcq","stem":{"en":"You are selecting a pattern for a compliance Q &amp; A assistant that must answer policy questions with citations to the authoritative internal source set. Latency, cost, and audit predictability are prioritized. Which pattern is the best fit?","vi":"Bạn đang chọn một mẫu cho trợ lý Hỏi &amp; Đáp tuân thủ phải trả lời các câu hỏi về chính sách kèm theo các trích dẫn đến bộ nguồn nội bộ có thẩm quyền. Độ trễ, chi phí và khả năng dự đoán kiểm toán được ưu tiên. Mẫu nào phù hợp nhất?","jp":"信頼できる内部ソース セットを引用してポリシーの質問に答える必要があるコンプライアンス Q&amp;A アシスタントのパターンを選択しています。レイテンシ、コスト、監査の予測可能性が優先されます。 どのパターンが最も適合しますか?"},"options":[{"k":"A","t":{"en":"Augmented LLM with retrieval-augmented generation over the indexed authoritative corpus and citation rendering on each answer.","vi":"LLM tăng cường với thế hệ tăng cường truy xuất trên kho dữ liệu có thẩm quyền được lập chỉ mục và hiển thị trích dẫn trên mỗi câu trả lời.","jp":"インデックス付きの信頼できるコーパスに対する検索拡張生成と各回答の引用レンダリングを備えた拡張 LLM。"}},{"k":"B","t":{"en":"Multi-agent orchestration with a planner, researcher, and writer agent for every query.","vi":"Phối hợp nhiều tác nhân với tác nhân lập kế hoạch, nhà nghiên cứu và tác giả cho mọi truy vấn.","jp":"すべてのクエリに対してプランナー、リサーチャー、ライター エージェントによるマルチエージェント オーケストレーション。"}},{"k":"C","t":{"en":"A pure agent loop with open web-browsing tools to surface the most current policy information, without constraining retrieval to the authoritative internal corpus.","vi":"Một vòng lặp tác nhân thuần túy với các công cụ duyệt web mở để hiển thị thông tin chính sách mới nhất mà không hạn chế việc truy xuất vào kho dữ liệu nội bộ có thẩm quyền.","jp":"オープンな Web ブラウジング ツールを備えた純粋なエージェント ループにより、権威ある内部コーパスへの検索を制限することなく、最新のポリシー情報を表示できます。"}},{"k":"D","t":{"en":"A static prompt with the entire policy corpus concatenated into every request.","vi":"Một lời nhắc tĩnh chứa toàn bộ kho chính sách được nối vào mọi yêu cầu.","jp":"ポリシー コーパス全体が各リクエストに連結された静的プロンプト。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Yêu cầu là trả lời có <b>trích dẫn từ tập nguồn nội bộ chính thức</b>, ưu tiên độ trễ, chi phí và khả năng audit. Mẫu <b>augmented LLM + RAG</b> trên corpus đã index: mỗi truy vấn chỉ lấy vài đoạn liên quan kèm định danh nguồn ổn định, Claude trả lời và <b>render trích dẫn</b> về các đoạn đó. Đây là luồng một lượt, đơn giản, chi phí và độ trễ dự đoán được, mỗi câu trả lời truy vết được về nguồn — phù hợp nhất cho compliance Q&amp;A.","elim":["<b>B.</b> Orchestration nhiều agent (planner, researcher, writer) cho mọi truy vấn làm tăng số lời gọi mô hình, độ trễ và chi phí, đồng thời khó audit hơn — dư thừa cho hỏi đáp chính sách.","<b>C.</b> Agent duyệt web mở lấy thông tin ngoài tập nguồn chính thức, phá vỡ yêu cầu chỉ trích dẫn nguồn nội bộ có thẩm quyền và khó dự đoán.","<b>D.</b> Nhồi toàn bộ corpus vào mọi request tốn rất nhiều input token, tăng độ trễ/chi phí, có thể vượt context window và làm trích dẫn kém chính xác."]},"cite":"Hướng dẫn ôn tập — §12.1 Vấn đề Mất Quy kết Nguồn"},{"id":"ccarp-q052","n":52,"topic":3,"type":"mcq","stem":{"en":"You are a platform architect designing an internal Claude-based assistant that serves both finance analysts and external auditors. Each population must access only documents permitted by its role. Where should role-based access control be enforced in the pipeline?","vi":"Bạn là kiến ​​trúc sư nền tảng đang thiết kế một trợ lý nội bộ dựa trên Claude để phục vụ cả nhà phân tích tài chính và kiểm toán viên bên ngoài. Mỗi quần thể chỉ được truy cập những tài liệu được phép bởi vai trò của nó. Kiểm soát quyền truy cập dựa trên vai trò nên được thực thi ở đâu trong quy trình?","jp":"あなたは、財務アナリストと外部監査人の両方にサービスを提供するクロードベースの社内アシスタントを設計するプラットフォーム アーキテクトです。各集団は、その役割によって許可されたドキュメントのみにアクセスする必要があります。 ロールベースのアクセス制御はパイプラインのどこに適用する必要がありますか?"},"options":[{"k":"A","t":{"en":"Inside the system prompt as a natural-language instruction for Claude to ignore unauthorized documents.","vi":"Lời nhắc bên trong hệ thống là hướng dẫn bằng ngôn ngữ tự nhiên để Claude bỏ qua các tài liệu trái phép.","jp":"システム内では、クロードに対する自然言語の指示として、未承認の文書を無視するようプロンプトが表示されます。"}},{"k":"B","t":{"en":"At the retrieval layer, before any role-restricted content reaches the prompt-construction step or the model.","vi":"Ở lớp truy xuất, trước khi bất kỳ nội dung bị giới hạn vai trò nào đạt đến bước xây dựng lời nhắc hoặc mô hình.","jp":"取得層では、役割が制限されたコンテンツがプロンプト構築ステップまたはモデルに到達する前に行われます。"}},{"k":"C","t":{"en":"Nowhere in the pipeline; rely on the model's general refusal behavior to reject unauthorized document access without any enforced access control.","vi":"Không có nơi nào trong đường ống; dựa vào hành vi từ chối chung của mô hình để từ chối truy cập tài liệu trái phép mà không có bất kỳ biện pháp kiểm soát truy cập nào được thực thi.","jp":"パイプラインのどこにもありません。モデルの一般的な拒否動作に依存して、強制的なアクセス制御なしで不正なドキュメント アクセスを拒否します。"}},{"k":"D","t":{"en":"After the response is generated, by post-filtering content that should not have been retrieved.","vi":"Sau khi phản hồi được tạo ra, bằng cách lọc nội dung sau đó mà lẽ ra không nên truy xuất.","jp":"応答が生成された後、取得すべきではないコンテンツを事後フィルタリングすることによって行われます。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Phân quyền phải được thực thi <b>tại tầng retrieval</b>, trước khi nội dung bị hạn chế tới bước dựng prompt hoặc mô hình. Dịch vụ retrieval xác thực người dùng, xác định vai trò (finance analyst hay auditor bên ngoài) và lọc tài liệu theo quyền — nhờ vậy dữ liệu trái phép không bao giờ xuất hiện trong prompt, trace, cache hay câu trả lời. Đây là <b>kiểm soát xác định (deterministic)</b>, không phụ thuộc vào việc mô hình có tuân thủ hay không.","elim":["<b>A.</b> Chỉ dẫn trong system prompt chỉ là hướng dẫn hành vi mang tính xác suất, có thể bị bỏ qua hoặc bị prompt injection vượt qua — không phải ranh giới kiểm soát truy cập.","<b>C.</b> Dựa vào hành vi từ chối chung của mô hình không phải cơ chế phân quyền; mô hình không biết người dùng nào được xem tài liệu nào.","<b>D.</b> Lọc sau khi sinh là quá muộn: mô hình đã nhận và xử lý dữ liệu hạn chế, có thể rò rỉ qua diễn đạt lại hoặc suy luận mà bộ lọc không bắt được."]}},{"id":"ccarp-q053","n":53,"topic":3,"type":"mcq","stem":{"en":"You are designing a content moderation classifier that processes high volumes of usergenerated comments under a tight per-message latency budget using well-defined classification labels. Which model selection best aligns with the workload?","vi":"Bạn đang thiết kế một trình phân loại kiểm duyệt nội dung để xử lý khối lượng lớn nhận xét do người dùng tạo với ngân sách độ trễ cho mỗi tin nhắn eo hẹp bằng cách sử dụng nhãn phân loại được xác định rõ. Lựa chọn mô hình nào phù hợp nhất với khối lượng công việc?","jp":"あなたは、明確に定義された分類ラベルを使用して、メッセージごとの遅延バジェットの下でユーザーが作成した大量のコメントを処理するコンテンツ モデレーション分類子を設計しています。 どのモデルを選択するのがワークロードに最も適していますか?"},"options":[{"k":"A","t":{"en":"Opus, because every moderation decision requires maximum reasoning depth regardless of classification complexity.","vi":"Rất tiếc, vì mọi quyết định kiểm duyệt đều yêu cầu độ sâu lý luận tối đa bất kể độ phức tạp của phân loại.","jp":"おっと、分類の複雑さに関係なく、すべてのモデレーション決定には最大限の推論の深さが必要となるためです。"}},{"k":"B","t":{"en":"Haiku, because its latency and cost profile align with high-volume classification workloads that require limited reasoning depth.","vi":"Haiku, vì độ trễ và hồ sơ chi phí của nó phù hợp với khối lượng công việc phân loại khối lượng lớn đòi hỏi độ sâu lý luận hạn chế.","jp":"Haiku は、そのレイテンシとコスト プロファイルが、限られた推論の深さを必要とする大量の分類ワークロードに適合しているためです。"}},{"k":"C","t":{"en":"Sonnet, because larger general-purpose models are preferred even when workload latency requirements are strict.","vi":"Sonnet, vì các mô hình có mục đích chung lớn hơn được ưa thích ngay cả khi yêu cầu nghiêm ngặt về độ trễ khối lượng công việc.","jp":"Sonnet。ワークロードのレイテンシ要件が厳しい場合でも、より大きな汎用モデルが優先されるためです。"}},{"k":"D","t":{"en":"Sonnet with extended thinking enabled, because deeper reasoning should be applied to every moderation request to improve edge-case handling.","vi":"Sonnet với khả năng tư duy mở rộng được kích hoạt, vì lý luận sâu hơn nên được áp dụng cho mọi yêu cầu kiểm duyệt để cải thiện khả năng xử lý các trường hợp phức tạp.","jp":"拡張思考を有効にしたソネット。エッジケースの処理を改善するには、すべてのモデレーション リクエストにより深い推論を適用する必要があるためです。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Workload có ba đặc điểm: <b>khối lượng lớn</b>, <b>ngân sách độ trễ chặt mỗi tin nhắn</b>, và <b>nhãn phân loại rõ ràng</b> (cần ít suy luận). <b>Haiku</b> là mô hình nhanh và rẻ nhất trong dòng Claude, phù hợp cho phân loại khối lượng lớn với tập nhãn cố định; Anthropic cũng nêu Haiku là lựa chọn tiết kiệm cho content moderation. Chọn mô hình phải cân bằng năng lực, tốc độ và chi phí, không mặc định chọn mô hình mạnh nhất.","elim":["<b>A.</b> Opus cho độ sâu suy luận tối đa nhưng chậm và đắt hơn nhiều — lãng phí cho phân loại nhãn rõ ràng và vi phạm ngân sách độ trễ.","<b>C.</b> Lập luận ưu tiên mô hình lớn hơn ngay cả khi yêu cầu độ trễ nghiêm ngặt là ngược với đặc điểm workload.","<b>D.</b> Bật extended thinking cho mọi request làm tăng thêm token và độ trễ, không cần thiết cho phân loại đơn giản."]}},{"id":"ccarp-q054","n":54,"topic":3,"type":"mcq","stem":{"en":"A Claude architect is implementing safety controls for a customer-facing advice assistant that must never provide regulated investment recommendations. Which two guardrail implementations most directly enforce this constraint? (Select two.)  [Chọn 2 đáp án]","vi":"Một kiến ​​trúc sư Claude đang triển khai các biện pháp kiểm soát an toàn cho trợ lý tư vấn trực tiếp với khách hàng, người không bao giờ được đưa ra các khuyến nghị đầu tư theo quy định. Hai cách triển khai lan can nào thực thi ràng buộc này một cách trực tiếp nhất? (Chọn 2.) [Chọn 2 đáp án]","jp":"クロード アーキテクトは、規制された投資推奨を決して提供してはいけない顧客対応のアドバイス アシスタントの安全管理を実装しています。 この制約を最も直接的に強制する 2 つのガードレール実装はどれですか? (2 つ選択してください。) [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Increase response temperature to introduce variability that reduces the likelihood of specific recommendations.","vi":"Tăng nhiệt độ phản hồi để tạo ra sự thay đổi làm giảm khả năng đưa ra các khuyến nghị cụ thể.","jp":"応答温度を上げて変動性を導入すると、特定の推奨事項が提示される可能性が低くなります。"}},{"k":"B","t":{"en":"Add an output classifier that detects and blocks responses containing regulated investmentrecommendation language.","vi":"Thêm trình phân loại đầu ra để phát hiện và chặn các phản hồi có chứa ngôn ngữ đề xuất đầu tư được quy định.","jp":"規制された投資推奨文言を含む応答を検出してブロックする出力分類子を追加します。"}},{"k":"C","t":{"en":"Limit session length to reduce the volume of queries processed per user per day.","vi":"Giới hạn độ dài phiên để giảm khối lượng truy vấn được xử lý mỗi người dùng mỗi ngày.","jp":"セッションの長さを制限して、ユーザーごとに 1 日に処理されるクエリの量を減らします。"}},{"k":"D","t":{"en":"Log all user queries to a SIEM for post-hoc compliance review.","vi":"Ghi lại tất cả các truy vấn của người dùng vào SIEM để đánh giá tuân thủ sau này.","jp":"事後のコンプライアンス レビューのために、すべてのユーザー クエリを SIEM に記録します。"}},{"k":"E","t":{"en":"Define explicit out-of-scope categories in the system prompt with fixed refusal phrasing for investment advice requests.","vi":"Xác định rõ ràng các danh mục nằm ngoài phạm vi trong lời nhắc của hệ thống với cụm từ từ chối cố định đối với các yêu cầu tư vấn đầu tư.","jp":"投資アドバイスのリクエストに対する固定の拒否表現を使用して、システム プロンプトで明示的な範囲外のカテゴリを定義します。"}}],"answer":["B","E"],"multi":true,"explain":{"key":"<b>Đáp án B, E.</b> Ràng buộc nghiêm ngặt cần <b>phòng ngừa nhiều lớp</b>.<br><b>E.</b> <b>Định nghĩa rõ các nhóm ngoài phạm vi trong system prompt</b> kèm câu từ chối cố định cho yêu cầu tư vấn đầu tư: cho mô hình tiêu chí rõ ràng và một phản hồi thay thế nhất quán khi người dùng hỏi trực tiếp hay diễn đạt lại.<br><b>B.</b> <b>Output classifier</b> phát hiện và chặn ngôn ngữ khuyến nghị đầu tư có quản lý <i>sau khi sinh, trước khi gửi</i> — lớp thực thi độc lập, bắt được các trường hợp lọt qua chỉ dẫn prompt.","elim":["<b>A.</b> Tăng temperature chỉ làm đầu ra ngẫu nhiên hơn, không ngăn được khuyến nghị đầu tư mà còn khiến hành vi kém ổn định.","<b>C.</b> Giới hạn độ dài phiên chỉ giảm số truy vấn, không ngăn một câu trả lời đơn lẻ chứa khuyến nghị bị cấm.","<b>D.</b> Ghi log lên SIEM để review sau là kiểm soát phát hiện hậu kiểm; khuyến nghị đã tới tay khách hàng trước khi bị phát hiện."]},"cite":"Hướng dẫn ôn tập — §6.2 Tiêu chí rõ ràng so với chỉ dẫn mơ hồ"},{"id":"ccarp-q055","n":55,"topic":3,"type":"mcq","stem":{"en":"You are responding to a stakeholder request that adds significant scope to a deployment already in flight. Which response best aligns expectations while respecting the stakeholder's underlying need?","vi":"Bạn đang phản hồi yêu cầu của bên liên quan nhằm bổ sung phạm vi đáng kể cho hoạt động triển khai đang được triển khai. Phản ứng nào phù hợp nhất với kỳ vọng đồng thời tôn trọng nhu cầu cơ bản của các bên liên quan?","jp":"あなたは、すでに進行中の展開に重要な範囲を追加する関係者の要求に対応しています。 利害関係者の根本的なニーズを尊重しながら、期待に最も合致する対応はどれでしょうか?"},"options":[{"k":"A","t":{"en":"Hide the scope-addition request from the broader delivery team to avoid a difficult conversation, allowing the change to proceed without team awareness of its timeline implications.","vi":"Ẩn yêu cầu bổ sung phạm vi khỏi nhóm phân phối rộng hơn để tránh một cuộc trò chuyện khó khăn, cho phép thay đổi tiếp tục mà nhóm không nhận thức được tác động của tiến trình.","jp":"難しい会話を避けるために、広範な配信チームからのスコープ追加リクエストを非表示にし、タイムラインへの影響をチームが意識せずに変更を進めることができるようにします。"}},{"k":"B","t":{"en":"Decline the request outright without acknowledging the stakeholder's underlying need or offering alternatives such as deferral, descoping, or timeline extension.","vi":"Từ chối hoàn toàn yêu cầu mà không thừa nhận nhu cầu cơ bản của các bên liên quan hoặc đưa ra các lựa chọn thay thế như trì hoãn, giải quyết hoặc gia hạn dòng thời gian.","jp":"利害関係者の根本的なニーズを認識したり、延期、デスコーピング、スケジュールの延長などの代替案を提示したりすることなく、要求を完全に拒否します。"}},{"k":"C","t":{"en":"Acknowledge the request, describe the scope and timeline implications transparently, and propose options-defer it, descope something else, or extend the timeline-for the stakeholder to choose.","vi":"Xác nhận yêu cầu, mô tả phạm vi và thời gian một cách minh bạch, đồng thời đề xuất các phương án - trì hoãn yêu cầu, xem xét nội dung khác hoặc kéo dài thời gian - để các bên liên quan lựa chọn.","jp":"リクエストを承認し、スコープとタイムラインへの影響を透過的に説明し、利害関係者が選択できるオプション（延期するか、別のスコープを外すか、タイムラインを延長する）を提案します。"}},{"k":"D","t":{"en":"Accept the additional scope into the current release without describing the timeline or descoping implications, allowing the delivery plan to absorb unacknowledged changes until they surface as delays.","vi":"Chấp nhận phạm vi bổ sung trong bản phát hành hiện tại mà không cần mô tả dòng thời gian hoặc giải thích các hàm ý, cho phép kế hoạch phân phối tiếp thu những thay đổi chưa được xác nhận cho đến khi chúng xuất hiện dưới dạng độ trễ.","jp":"タイムラインや詳細な影響を説明することなく、現在のリリースへの追加範囲を受け入れ、遅延として表面化するまで未確認の変更を配信計画で吸収できるようにします。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Cách phản hồi đúng vừa <b>minh bạch</b> vừa <b>tôn trọng quyền quyết định</b> của stakeholder: ghi nhận nhu cầu thực sự, nêu rõ tác động lên phạm vi và tiến độ, rồi đưa ra các lựa chọn có kiểm soát — <b>hoãn lại, cắt bớt phạm vi khác, hoặc kéo dài timeline</b> — để stakeholder chọn. Yêu cầu không giới hạn được chuyển thành một quyết định có quản trị, sau đó ghi nhận lại tiêu chí thành công, rủi ro và phê duyệt.","elim":["<b>A.</b> Giấu yêu cầu khỏi nhóm delivery khiến kế hoạch sai lệch và tạo rủi ro không được quản lý; vi phạm minh bạch.","<b>B.</b> Từ chối thẳng mà không ghi nhận nhu cầu hay đưa phương án thay thế bỏ qua nhu cầu thật và làm tổn hại quan hệ với stakeholder.","<b>D.</b> Nhận thêm phạm vi mà không nói rõ tác động khiến chậm trễ xuất hiện bất ngờ về sau — scope creep không được quản lý."]}},{"id":"ccarp-q056","n":56,"topic":3,"type":"mcq","stem":{"en":"You are assessing data-exfiltration risk in a Claude-based assistant that has tools for both internal-document retrieval and outbound HTTP calls. Which scenario most directly indicates a data-exfiltration risk?","vi":"Bạn đang đánh giá rủi ro đánh cắp dữ liệu trong một trợ lý dựa trên Claude có các công cụ cho cả truy xuất tài liệu nội bộ và cuộc gọi HTTP đi. Tình huống nào trực tiếp nhất cho thấy nguy cơ đánh cắp dữ liệu?","jp":"あなたは、内部ドキュメントの取得とアウトバウンド HTTP 呼び出しの両方のツールを備えたクロードベースのアシスタントでデータ漏洩のリスクを評価しています。 データ漏洩のリスクを最も直接的に示すシナリオはどれですか?"},"options":[{"k":"A","t":{"en":"The outbound HTTP tool returns a 200 response when the assistant calls an allow-listed domain to fulfil a user-initiated data-lookup request.","vi":"Công cụ HTTP gửi đi trả về phản hồi 200 khi trợ lý gọi một miền trong danh sách cho phép để thực hiện yêu cầu tra cứu dữ liệu do người dùng thực hiện.","jp":"アシスタントがユーザーが開始したデータ検索リクエストを満たすために許可リストに登録されたドメインを呼び出すと、アウトバウンド HTTP ツールは 200 応答を返します。"}},{"k":"B","t":{"en":"The user submits a routine question and receives a routine answer.","vi":"Người dùng gửi một câu hỏi thông thường và nhận được câu trả lời thông thường.","jp":"ユーザーは日常的な質問を送信し、日常的な回答を受け取ります。"}},{"k":"C","t":{"en":"Adversarial content in a retrieved document instructs the model to call the outbound HTTP tool and send sensitive content to an attacker-controlled URL.","vi":"Nội dung đối nghịch trong tài liệu được truy xuất sẽ hướng dẫn mô hình gọi công cụ HTTP gửi đi và gửi nội dung nhạy cảm đến URL do kẻ tấn công kiểm soát.","jp":"取得されたドキュメント内の敵対的なコンテンツは、アウトバウンド HTTP ツールを呼び出し、攻撃者が制御する URL に機密コンテンツを送信するようにモデルに指示します。"}},{"k":"D","t":{"en":"The internal-document retrieval tool returns a document that the user is authorized to view.","vi":"Công cụ truy xuất tài liệu nội bộ trả về một tài liệu mà người dùng được phép xem.","jp":"内部ドキュメント取得ツールは、ユーザーが表示を許可されているドキュメントを返します。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Đây là <b>indirect prompt injection</b> kết hợp với một <b>kênh truyền ra ngoài</b>: nội dung độc hại nằm trong tài liệu được truy xuất ra lệnh cho mô hình gọi HTTP tool để gửi dữ liệu nhạy cảm tới URL do kẻ tấn công kiểm soát. Có quyền đọc tài liệu không đồng nghĩa với quyền tiết lộ ra ngoài. Biện pháp: coi nội dung truy xuất là <b>không tin cậy</b>, giới hạn domain outbound, tách quyền truy cập dữ liệu khỏi quyền giao tiếp bên ngoài, áp least privilege và yêu cầu phê duyệt cho hành động gửi dữ liệu.","elim":["<b>A.</b> Gọi tới domain trong allowlist để phục vụ yêu cầu do người dùng khởi tạo và nhận 200 là hành vi bình thường, đúng chính sách.","<b>B.</b> Câu hỏi thường lệ nhận câu trả lời thường lệ không có dấu hiệu dữ liệu bị đưa ra ngoài.","<b>D.</b> Trả về tài liệu mà người dùng được phép xem là đúng phân quyền, không có luồng dữ liệu ra ngoài trái phép."]}},{"id":"ccarp-q057","n":57,"topic":3,"type":"mcq","stem":{"en":"You are building an ethics-review checklist for deployments supported by artificial intelligence. Which two checks belong on the list? (Select two.) Each correct answer presents a complete solution.  [Chọn 2 đáp án]","vi":"Bạn đang xây dựng danh sách kiểm tra đánh giá đạo đức cho các hoạt động triển khai được trí tuệ nhân tạo hỗ trợ. Hai kiểm tra nào thuộc danh sách? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một giải pháp hoàn chỉnh.  [Chọn 2 đáp án]","jp":"あなたは、人工知能によってサポートされる展開のための倫理レビュー チェックリストを作成しています。 リストに含まれる 2 つのチェックはどれですか? (2 つ選択してください。) それぞれの正解は完全な解決策を示します。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Confirm that vendor licensing terms permit the planned production use of the model.","vi":"Xác nhận rằng các điều khoản cấp phép của nhà cung cấp cho phép sử dụng mô hình trong sản xuất theo kế hoạch.","jp":"ベンダーのライセンス条項により、モデルの計画された実稼働使用が許可されていることを確認します。"}},{"k":"B","t":{"en":"Verify that outputs do not rely on generalizations about people that the underlying data does not support.","vi":"Xác minh rằng kết quả đầu ra không dựa vào những khái quát hóa về con người mà dữ liệu cơ bản không hỗ trợ.","jp":"出力が、基礎となるデータがサポートしていない人々に関する一般化に依存していないことを確認します。"}},{"k":"C","t":{"en":"Confirm that high-impact decisions retain human accountability rather than being attributed to the model.","vi":"Xác nhận rằng các quyết định có tác động cao vẫn duy trì trách nhiệm giải trình của con người thay vì được quy cho mô hình.","jp":"影響の大きい決定は、モデルに起因するものではなく、人間の責任が維持されることを確認します。"}},{"k":"D","t":{"en":"Restrict ethics review to outputs that exceed a defined model-confidence threshold.","vi":"Hạn chế đánh giá đạo đức ở những kết quả đầu ra vượt quá ngưỡng tin cậy của mô hình đã xác định.","jp":"倫理レビューを、定義されたモデル信頼性しきい値を超える出力に制限します。"}},{"k":"E","t":{"en":"Confirm that latency and throughput targets are met across supported user populations.","vi":"Xác nhận rằng các mục tiêu về độ trễ và thông lượng đều được đáp ứng trên các nhóm người dùng được hỗ trợ.","jp":"サポートされているユーザー集団全体でレイテンシとスループットの目標が満たされていることを確認します。"}}],"answer":["B","C"],"multi":true,"explain":{"key":"<b>Đáp án B, C.</b> Checklist đạo đức phải kiểm tra tác động lên con người và trách nhiệm giải trình.<br><b>B.</b> Xác minh đầu ra <b>không dựa vào khái quát hóa về con người</b> mà dữ liệu không hỗ trợ — chống định kiến, đối xử phân biệt và kết luận thiếu căn cứ về cá nhân hay nhóm.<br><b>C.</b> Đảm bảo <b>quyết định có tác động lớn vẫn do con người chịu trách nhiệm</b>, không đổ cho mô hình — trách nhiệm không thể chuyển cho một hệ thống xác suất.","elim":["<b>A.</b> Điều khoản license của nhà cung cấp là vấn đề pháp lý/thương mại, quan trọng nhưng không phải kiểm tra đạo đức về tác động của đầu ra.","<b>D.</b> Chỉ review đạo đức cho đầu ra vượt ngưỡng confidence bỏ sót phần lớn đầu ra; mô hình có thể tự tin mà vẫn thiên lệch.","<b>E.</b> Mục tiêu độ trễ và throughput là yêu cầu vận hành/hiệu năng, không phải tiêu chí đạo đức."]}},{"id":"ccarp-q058","n":58,"topic":3,"type":"mcq","stem":{"en":"You are listing characteristics of robust guardrail design for an enterprise deployment. Which two characteristics belong on the list? (Select two.) Each correct answer presents a complete solution.  [Chọn 2 đáp án]","vi":"Bạn đang liệt kê các đặc điểm của thiết kế lan can chắc chắn để triển khai cho doanh nghiệp. Hai đặc điểm nào thuộc về danh sách? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một giải pháp hoàn chỉnh.  [Chọn 2 đáp án]","jp":"あなたは、エンタープライズ展開向けの堅牢なガードレール設計の特徴を列挙しています。 リストに含まれる 2 つの特性はどれですか? (2 つ選択してください。) それぞれの正解は完全な解決策を示します。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Centralized log retention for guardrail violations with quarterly review by the security team.","vi":"Lưu giữ nhật ký tập trung đối với các hành vi vi phạm lan can được đội ngũ an ninh xem xét hàng quý.","jp":"セキュリティ チームによる四半期ごとのレビューにより、ガードレール違反のログを一元的に保持します。"}},{"k":"B","t":{"en":"Per-role tool allow-lists enforced at the orchestration layer before any tool call executes.","vi":"Danh sách cho phép công cụ theo vai trò được thực thi ở lớp điều phối trước khi thực thi bất kỳ lệnh gọi công cụ nào.","jp":"ロールごとのツール許可リストは、ツール呼び出しが実行される前にオーケストレーション層で適用されます。"}},{"k":"C","t":{"en":"User feedback channels that route reported guardrail failures into the product backlog for triage.","vi":"Các kênh phản hồi của người dùng định tuyến đã báo cáo lỗi lan can vào phần tồn đọng của sản phẩm để phân loại.","jp":"報告されたガードレールの障害をトリアージのために製品バックログにルーティングするユーザー フィードバック チャネル。"}},{"k":"D","t":{"en":"Periodic refresh of the system prompt wording to keep refusal language current and clear.","vi":"Làm mới định kỳ lời nhắc của hệ thống để giữ cho ngôn ngữ từ chối luôn cập nhật và rõ ràng.","jp":"システム プロンプトの文言を定期的に更新して、拒否の文言を最新かつ明確に保ちます。"}},{"k":"E","t":{"en":"Adversarial-input coverage in the evaluation set with regression tracking on guardrail performance.","vi":"Phạm vi đầu vào đối nghịch trong bộ đánh giá với tính năng theo dõi hồi quy về hiệu suất của lan can.","jp":"評価セット内の敵対的入力カバレッジと、ガードレールのパフォーマンスの回帰追跡。"}}],"answer":["B","E"],"multi":true,"explain":{"key":"<b>Đáp án B, E.</b> Guardrail vững chắc cần cả <b>thực thi phòng ngừa</b> lẫn <b>kiểm chứng thực nghiệm liên tục</b>.<br><b>B.</b> <b>Allowlist tool theo vai trò</b> được thực thi ở tầng orchestration <i>trước khi</i> tool chạy — đây là ranh giới xác định, không dựa vào mô hình tự quyết lời gọi có hợp lệ không (tương tự cơ chế permission và hook pre-tool-use chặn lời gọi).<br><b>E.</b> <b>Bao phủ đầu vào adversarial trong eval set</b> kèm theo dõi regression cho thấy guardrail còn hiệu quả sau mỗi thay đổi prompt, mô hình hay tool.","elim":["<b>A.</b> Lưu log vi phạm tập trung và review hàng quý là kiểm soát phát hiện chậm, không ngăn vi phạm hay đo hiệu quả guardrail liên tục.","<b>C.</b> Kênh phản hồi người dùng hữu ích nhưng mang tính phản ứng, phụ thuộc người dùng phát hiện lỗi sau khi đã xảy ra.","<b>D.</b> Làm mới câu chữ system prompt định kỳ chỉ là chỉnh hướng dẫn mang tính xác suất, không phải cơ chế thực thi hay kiểm chứng."]},"cite":"Hướng dẫn ôn tập — §3.5 Hooks trong Agent SDK; Lĩnh vực 1.5"},{"id":"ccarp-q059","n":59,"topic":3,"type":"mcq","stem":{"en":"You are integrating human review into a high-volume classification pipeline where reviewing every output is infeasible. Which sampling strategy best balances throughput with quality oversight?","vi":"Bạn đang tích hợp đánh giá của con người vào một quy trình phân loại khối lượng lớn, trong đó việc xem xét mọi đầu ra là không khả thi. Chiến lược lấy mẫu nào cân bằng tốt nhất thông lượng với giám sát chất lượng?","jp":"すべての出力をレビューするのは不可能な大量の分類パイプラインに人間によるレビューを統合しています。 スループットと品質監視のバランスを最もよくとれるサンプリング戦略はどれですか?"},"options":[{"k":"A","t":{"en":"No sampling, relying entirely on user complaints to reveal quality and safety problems after they affect users.","vi":"Không lấy mẫu, hoàn toàn dựa vào khiếu nại của người dùng để phát hiện vấn đề về chất lượng, an toàn sau khi ảnh hưởng đến người dùng.","jp":"サンプリングは行わず、品質と安全性の問題がユーザーに影響を与えた後に明らかにするために、ユーザーの苦情に完全に依存しています。"}},{"k":"B","t":{"en":"Risk-stratified sampling that reviews all low-confidence and high-impact outputs and a smaller random sample of high-confidence routine outputs.","vi":"Lấy mẫu phân tầng rủi ro xem xét tất cả các kết quả đầu ra có độ tin cậy thấp và tác động cao và một mẫu ngẫu nhiên nhỏ hơn gồm các kết quả đầu ra thường quy có độ tin cậy cao.","jp":"信頼性が低く影響の大きい出力をすべてレビューするリスク層別サンプリングと、信頼性の高いルーチン出力の小規模なランダム サンプル。"}},{"k":"C","t":{"en":"Inverse sampling that reviews only high-confidence routine outputs and skips low-confidence and high- impact outputs.","vi":"Lấy mẫu nghịch đảo chỉ đánh giá các kết quả đầu ra thông thường có độ tin cậy cao và bỏ qua các kết quả đầu ra có độ tin cậy thấp và tác động cao.","jp":"逆サンプリング。信頼性の高いルーチン出力のみをレビューし、信頼性の低い出力や影響の大きい出力をスキップします。"}},{"k":"D","t":{"en":"Universal review of every output regardless of confidence or throughput impact.","vi":"Đánh giá chung về mọi đầu ra bất kể tác động đến độ tin cậy hoặc thông lượng.","jp":"信頼性やスループットへの影響に関係なく、すべての出力を普遍的にレビューします。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> <b>Lấy mẫu phân tầng theo rủi ro</b> dồn năng lực reviewer có hạn vào nơi bất định và hậu quả lớn nhất: <b>review toàn bộ đầu ra confidence thấp và tác động cao</b>, cộng thêm <b>mẫu ngẫu nhiên nhỏ</b> từ đầu ra routine confidence cao. Phần ngẫu nhiên này cho tín hiệu không thiên lệch để phát hiện drift, lỗi mới và các ca mô hình tự tin nhưng sai — cân bằng giữa throughput và giám sát chất lượng.","elim":["<b>A.</b> Không lấy mẫu, chờ khiếu nại thì lỗi chỉ được phát hiện sau khi đã gây hại cho người dùng.","<b>C.</b> Lấy mẫu ngược chỉ review ca tự tin, routine và bỏ qua đúng các ca rủi ro nhất — sai về mặt phân bổ giám sát.","<b>D.</b> Review mọi đầu ra mâu thuẫn trực tiếp với ràng buộc throughput mà đề nêu là không khả thi."]},"cite":"Hướng dẫn ôn tập — §9.4 Hiệu chỉnh độ tin cậy và giám sát của con người; Lĩnh vực 5.5"},{"id":"ccarp-q060","n":60,"topic":3,"type":"mcq","stem":{"en":"A business sponsor has requested an AI solution to \"improve customer experience.\" The sponsor cannot articulate which customer journey is failing, which metric reflects the failure, or which decisions the AI should support. The sponsor is asking you to begin design work next week. Which delegation-competency action should you take first?","vi":"Một nhà tài trợ kinh doanh đã yêu cầu giải pháp AI để \"cải thiện trải nghiệm của khách hàng\". Nhà tài trợ không thể nói rõ hành trình của khách hàng nào đang thất bại, số liệu nào phản ánh sự thất bại hoặc AI nên hỗ trợ những quyết định nào. Nhà tài trợ đang yêu cầu bạn bắt đầu công việc thiết kế vào tuần tới. Bạn nên thực hiện hành động ủy quyền nào trước tiên?","jp":"ビジネス スポンサーは、「顧客エクスペリエンスを向上させる」ために AI ソリューションを要求しました。スポンサーは、どのカスタマー ジャーニーが失敗しているのか、どの指標が失敗を反映しているのか、AI がどの決定をサポートする必要があるのか​​を明確に表現できません。スポンサーはあなたに来週からデザイン作業を開始するよう求めています。 最初にどの委任コンピテンシーアクションを実行する必要がありますか?"},"options":[{"k":"A","t":{"en":"Recommend that the sponsor revise the request and resubmit it later for evaluation.","vi":"Đề nghị nhà tài trợ sửa lại yêu cầu và gửi lại sau để đánh giá.","jp":"スポンサーにリクエストを修正し、評価のために後で再送信することを推奨します。"}},{"k":"B","t":{"en":"Begin prototyping a generic assistant against the broad request before the next deadline.","vi":"Bắt đầu tạo nguyên mẫu một trợ lý chung theo yêu cầu rộng rãi trước thời hạn tiếp theo.","jp":"次の締め切りまでに、広範な要求に対して汎用アシスタントのプロトタイピングを開始します。"}},{"k":"C","t":{"en":"Propose a fixed scope that you commit to by default based on your own assumptions.","vi":"Đề xuất một phạm vi cố định mà bạn cam kết theo mặc định dựa trên các giả định của riêng bạn.","jp":"独自の仮定に基づいて、デフォルトでコミットする固定スコープを提案します。"}},{"k":"D","t":{"en":"Facilitate a structured discovery to define the failing decision and the target metric.","vi":"Tạo điều kiện thuận lợi cho việc khám phá có cấu trúc để xác định quyết định không thành công và chỉ số mục tiêu.","jp":"構造化された検出を促進して、失敗した意思決定と目標指標を定義します。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Yêu cầu chưa sẵn sàng để thiết kế: chưa biết hành trình khách hàng nào hỏng, metric nào phản ánh, AI hỗ trợ quyết định gì. Năng lực <b>Delegation</b> đòi hỏi xác định rõ vấn đề trước khi giao việc cho AI, nên bước đầu là <b>discovery có cấu trúc</b> cùng sponsor để xác định <b>quyết định/điểm thất bại</b> và <b>metric mục tiêu</b>, từ đó có baseline, ngưỡng mục tiêu và ràng buộc trước khi chọn pattern hay mô hình.","elim":["<b>A.</b> Bảo sponsor tự sửa và nộp lại đẩy trách nhiệm đi; sponsor đã không tự xác định được vấn đề, kiến trúc sư cần hỗ trợ làm rõ.","<b>B.</b> Prototype trợ lý chung chung cho yêu cầu mơ hồ có nguy cơ giải sai bài toán và lãng phí công sức.","<b>C.</b> Tự áp phạm vi cố định theo giả định của mình bỏ qua bối cảnh kinh doanh thật và có thể không giải quyết vấn đề của sponsor."]}}]},{"n":4,"title":{"en":"Practice Set 4","vi":"Bộ đề số 4","jp":"練習問題 4"},"questions":[{"id":"ccarp-q061","n":61,"topic":4,"type":"mcq","stem":{"en":"A loan pre-qualification assistant shows 94 percent approval recommendations that match the human underwriter decision. The fairness team has reviewed approval rate parity across protected groups and reported no significant difference. A board member has asked whether this evidence is sufficient to declare the assistant fair. Which two Discernment-competency findings should you report? (Select two.) Each correct answer presents part of the solution.  [Chọn 2 đáp án]","vi":"Trợ lý sơ tuyển khoản vay hiển thị 94% đề xuất phê duyệt phù hợp với quyết định bảo lãnh của con người. Nhóm công bằng đã xem xét sự ngang bằng về tỷ lệ phê duyệt giữa các nhóm được bảo vệ và báo cáo rằng không có sự khác biệt đáng kể nào. Một thành viên hội đồng đã hỏi liệu bằng chứng này có đủ để tuyên bố trợ lý hội chợ hay không. Bạn nên báo cáo hai phát hiện về Năng lực nhận thức nào? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một phần của giải pháp.  [Chọn 2 đáp án]","jp":"ローン事前審査アシスタントは、人間の引受会社の決定と一致する 94% の承認推奨を示します。公平性チームは、保護されたグループ間の支持率の同等性を調査しましたが、大きな違いはないと報告しました。理事会メンバーは、この証拠がアシスタントフェアを宣言するのに十分であるかどうかを尋ねました。 識別能力に関する調査結果を 2 つ報告する必要があるのはどれですか? (2 つ選択してください。) それぞれの正解は、解決策の一部を示しています。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Approval rate parity does not by itself assess error rate parity across protected groups.","vi":"Tỷ lệ phê duyệt tương đương không tự nó đánh giá tỷ lệ lỗi tương đương giữa các nhóm được bảo vệ.","jp":"承認率のパリティ自体は、保護されたグループ全体のエラー率のパリティを評価しません。"}},{"k":"B","t":{"en":"Match with human underwriters does not establish freedom from underwriter-introduced bias.","vi":"Sự phù hợp với các nhà bảo lãnh là con người không tạo ra sự tự do khỏi sự thiên vị do người bảo lãnh đưa ra.","jp":"人間の引受会社とのマッチングは、引受会社によってもたらされるバイアスからの自由を確立するものではありません。"}},{"k":"C","t":{"en":"The 94 percent match rate is sufficient evidence of fairness for the assistant's decisions.","vi":"Tỷ lệ trùng khớp 94% là đủ bằng chứng về sự công bằng cho các quyết định của trợ lý.","jp":"94 パーセントの一致率は、アシスタントの決定が公平であることの十分な証拠です。"}},{"k":"D","t":{"en":"The fairness team's review process likely missed at least some of the protected groups studied.","vi":"Quá trình xem xét của nhóm công bằng có thể đã bỏ sót ít nhất một số nhóm được bảo vệ được nghiên cứu.","jp":"公平性チームの審査プロセスでは、調査対象となった保護グループの少なくとも一部が見逃された可能性があります。"}},{"k":"E","t":{"en":"A larger sample is needed before any meaningful fairness claim can be made about the model.","vi":"Cần có một mẫu lớn hơn trước khi đưa ra bất kỳ tuyên bố công bằng có ý nghĩa nào về mô hình.","jp":"モデルに関して意味のある公平性を主張するには、より大きなサンプルが必要です。"}}],"answer":["A","B"],"multi":true,"explain":{"key":"<b>Đáp án A, B.</b> Năng lực <b>Discernment</b> là đánh giá phê phán xem bằng chứng có thực sự chứng minh kết luận hay không.<br><b>A.</b> <b>Ngang bằng tỷ lệ chấp thuận</b> không đánh giá <b>ngang bằng tỷ lệ lỗi</b> (false approval, false denial, calibration) giữa các nhóm được bảo vệ — hệ thống vẫn có thể gây gánh nặng lỗi khác nhau dù tỷ lệ chấp thuận bằng nhau.<br><b>B.</b> Khớp 94% với underwriter chỉ đo <b>độ trung thành với quyết định con người</b>; nếu underwriter có thiên lệch, mô hình khớp với họ cũng tái tạo thiên lệch đó.","elim":["<b>C.</b> Tỷ lệ khớp 94% là chỉ số đồng thuận, không phải chỉ số công bằng; nó không nói gì về phân bổ lỗi giữa các nhóm.","<b>D.</b> Không có bằng chứng nào trong đề cho thấy quy trình review bỏ sót nhóm được bảo vệ — đây là suy đoán thiếu căn cứ.","<b>E.</b> Đề không nêu kích thước mẫu là vấn đề; thiếu sót chính là sai loại metric, không phải thiếu dữ liệu, và mẫu lớn hơn với cùng metric vẫn không trả lời được câu hỏi công bằng."]}},{"id":"ccarp-q062","n":62,"topic":4,"type":"mcq","stem":{"en":"You are operating an interactive assistant whose dominant performance constraint is perturn latency. Quality on routine turns is already acceptable. Which configuration adjustment most directly improves latency without disproportionately damaging quality?","vi":"Bạn đang vận hành một trợ lý tương tác có hạn chế về hiệu suất chủ yếu là độ trễ hoàn toàn. Chất lượng ở các lượt quay thường lệ đã có thể chấp nhận được. Điều chỉnh cấu hình nào trực tiếp cải thiện độ trễ nhất mà không làm giảm chất lượng một cách tương xứng?","jp":"あなたは対話型アシスタントを操作していますが、その主なパフォーマンス制約はターン レイテンシです。ルーチンターンの品質はすでに許容範囲内です。 品質を過度に損なうことなく、遅延を最も直接的に改善する設定調整はどれですか?"},"options":[{"k":"A","t":{"en":"Disable prompt caching entirely to ensure fresh context processing on every request, preventing stale prefix content from affecting latency-sensitive interactions.","vi":"Tắt hoàn toàn bộ nhớ đệm nhắc nhở để đảm bảo xử lý ngữ cảnh mới cho mọi yêu cầu, ngăn nội dung tiền tố cũ ảnh hưởng đến các tương tác nhạy cảm với độ trễ.","jp":"プロンプト キャッシュを完全に無効にして、すべてのリクエストで新しいコンテキストが処理されるようにし、古いプレフィックス コンテンツがレイテンシの影響を受けやすい対話に影響を与えるのを防ぎます。"}},{"k":"B","t":{"en":"Reduce retrieval depth to the top-k passages that historically cover the answer, and cache stable system- prompt content.","vi":"Giảm độ sâu truy xuất xuống các đoạn văn hàng đầu bao gồm câu trả lời về mặt lịch sử và lưu vào bộ nhớ đệm nội dung nhắc nhở hệ thống ổn định.","jp":"検索の深さを歴史的に答えをカバーしている上位 k 個のパッセージまで減らし、安定したシステム プロンプト コンテンツをキャッシュします。"}},{"k":"C","t":{"en":"Increase retrieval depth to the corpus maximum to improve recall regardless of latency.","vi":"Tăng độ sâu truy xuất lên mức tối đa của kho văn bản để cải thiện khả năng thu hồi bất kể độ trễ.","jp":"検索深度をコーパスの最大値まで増やすと、待ち時間に関係なく再現率が向上します。"}},{"k":"D","t":{"en":"Switch every turn to the heaviest available model to maximize output quality, accepting that the increased model latency will worsen the per-turn SLO rather than improve it.","vi":"Chuyển từng lượt sang mô hình nặng nhất hiện có để tối đa hóa chất lượng đầu ra, chấp nhận rằng độ trễ của mô hình tăng lên sẽ làm SLO mỗi lượt trở nên tồi tệ hơn thay vì cải thiện nó.","jp":"出力品質を最大化するには、ターンごとに利用可能な最も重いモデルに切り替えます。モデルのレイテンシが増加すると、ターンごとの SLO が改善されるのではなく悪化することを受け入れます。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Hai yếu tố chính của độ trễ mỗi lượt là <b>kích thước context truy xuất</b> và <b>xử lý lặp lại prompt</b>. <b>Giảm retrieval xuống top-k</b> đã được kiểm chứng là đủ bao phủ câu trả lời làm giảm số token phải xử lý mà vẫn giữ chất lượng; <b>cache phần system prompt ổn định</b> (prompt caching) tránh xử lý lại cùng tiền tố mỗi lượt, giảm cả độ trễ và chi phí. Cả hai đều nhắm thẳng vào latency mà không động tới chất lượng các lượt routine vốn đã đạt.","elim":["<b>A.</b> Tắt prompt caching buộc xử lý lại toàn bộ tiền tố mỗi lượt, làm độ trễ tăng; cache tiền tố không gây nội dung cũ vì tiền tố vốn tĩnh.","<b>C.</b> Tăng độ sâu retrieval tới tối đa làm phình context, tăng độ trễ — ngược với ràng buộc chủ đạo.","<b>D.</b> Chuyển sang mô hình nặng nhất làm mỗi lượt chậm hơn, trong khi chất lượng routine đã chấp nhận được."]}},{"id":"ccarp-q063","n":63,"topic":4,"type":"mcq","stem":{"en":"You are building a feedback-and-alignment routine for a multi-stakeholder deployment. Which two practices belong in the routine? (Select two.) Each correct answer presents a complete solution.  [Chọn 2 đáp án]","vi":"Bạn đang xây dựng quy trình phản hồi và điều chỉnh cho quá trình triển khai có nhiều bên liên quan. Hai thực hành nào thuộc về thói quen? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một giải pháp hoàn chỉnh.  [Chọn 2 đáp án]","jp":"あなたは、複数の関係者による展開のためのフィードバックと調整のルーチンを構築しています。 ルーチンに属する 2 つの実践はどれですか? (2 つ選択してください。) それぞれの正解は完全な解決策を示します。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Record each session and distribute the recording to stakeholders who could not attend live.","vi":"Ghi lại từng phiên và phân phối bản ghi cho các bên liên quan không thể tham dự trực tiếp.","jp":"各セッションを録画し、ライブに参加できなかった関係者に録画を配布します。"}},{"k":"B","t":{"en":"Escalate any disagreement among stakeholders to the executive sponsor for binding resolution.","vi":"Chuyển bất kỳ sự bất đồng nào giữa các bên liên quan lên nhà tài trợ điều hành để có giải pháp ràng buộc.","jp":"利害関係者間の意見の相違をエグゼクティブスポンサーにエスカレートし、拘束力のある解決を求めます。"}},{"k":"C","t":{"en":"Rotate facilitation among the participating stakeholder groups to share ownership of the routine.","vi":"Luân phiên tạo điều kiện cho các nhóm bên liên quan tham gia để chia sẻ quyền sở hữu quy trình.","jp":"参加する利害関係者グループ間で円滑化を進め、ルーチンの所有権を共有します。"}},{"k":"D","t":{"en":"Set a regular cadence for revisiting expectations and assumptions as conditions evolve over time.","vi":"Đặt ra một lịch trình thường xuyên để xem xét lại các kỳ vọng và giả định khi các điều kiện phát triển theo thời gian.","jp":"時間の経過とともに状況が変化するにつれて、期待と仮定を再検討するための定期的な頻度を設定します。"}},{"k":"E","t":{"en":"Reconcile divergent stakeholder positions explicitly rather than papering over them in the moment.","vi":"Điều chỉnh các quan điểm khác nhau của các bên liên quan một cách rõ ràng thay vì chỉ ghi lại chúng vào lúc này.","jp":"利害関係者の異なる立場をその場で紙に書き出すのではなく、明確に調整します。"}}],"answer":["D","E"],"multi":true,"explain":{"key":"<b>Đáp án D, E.</b> Alignment là quá trình quản trị liên tục, không phải phê duyệt một lần.<br><b>D.</b> <b>Nhịp định kỳ</b> để xem lại kỳ vọng và giả định khi điều kiện kinh doanh/kỹ thuật thay đổi — mục tiêu, ràng buộc, rủi ro, SLA được đánh giá lại có chủ đích.<br><b>E.</b> <b>Hòa giải tường minh các quan điểm khác nhau</b> thay vì lấp liếm: bất đồng được nêu ra và giải quyết, quyết định có thể truy vết, tránh xung đột chưa giải quyết tái xuất hiện khi triển khai.","elim":["<b>A.</b> Ghi hình và gửi bản ghi chỉ là phương tiện chia sẻ thông tin thụ động, không tạo ra alignment hay giải quyết bất đồng.","<b>B.</b> Đẩy mọi bất đồng lên executive sponsor để phán quyết khiến sponsor quá tải và bỏ qua việc các bên tự hòa giải dựa trên dữ kiện.","<b>C.</b> Luân phiên người điều phối có thể tăng cảm giác sở hữu nhưng không phải thực hành cốt lõi bảo đảm kỳ vọng được cập nhật và bất đồng được giải quyết."]}},{"id":"ccarp-q064","n":64,"topic":4,"type":"mcq","stem":{"en":"An architect is reviewing a set of architecture documentation packages before handing off a Claude-based pipeline to an implementation team. Which two characteristics indicate that a documentation package is sufficient to support implementation without ongoing architect involvement? (Select two.)  [Chọn 2 đáp án]","vi":"Một kiến ​​trúc sư đang xem xét một bộ gói tài liệu kiến ​​trúc trước khi bàn giao quy trình dựa trên Claude cho nhóm triển khai. Hai đặc điểm nào chỉ ra rằng gói tài liệu là đủ để hỗ trợ việc thực hiện mà không cần sự tham gia liên tục của kiến ​​trúc sư? (Chọn 2.) [Chọn 2 đáp án]","jp":"アーキテクトは、クロード ベースのパイプラインを実装チームに引き渡す前に、一連のアーキテクチャ ドキュメント パッケージをレビューしています。 アーキテクトが継続的に関与しなくても、ドキュメント パッケージだけで実装をサポートできることを示す 2 つの特性はどれですか? (2 つ選択してください。) [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"The document specifies integration contracts, configuration schemas, and expected input/output shapes for each component.","vi":"Tài liệu chỉ định các hợp đồng tích hợp, lược đồ cấu hình và hình dạng đầu vào/đầu ra dự kiến ​​cho từng thành phần.","jp":"この文書では、統合契約、構成スキーマ、および各コンポーネントの予想される入出力形状を指定します。"}},{"k":"B","t":{"en":"The document includes a decision log that records the rationale for key architectural choices and the alternatives rejected.","vi":"Tài liệu này bao gồm nhật ký quyết định ghi lại cơ sở lý luận cho các lựa chọn kiến ​​trúc quan trọng và các phương án thay thế bị từ chối.","jp":"この文書には、主要なアーキテクチャ上の選択の根拠と拒否された代替案を記録する意思決定ログが含まれています。"}},{"k":"C","t":{"en":"The document provides a high-level narrative description of the business problem without component- level detail.","vi":"Tài liệu này cung cấp mô tả tường thuật ở cấp độ cao về vấn đề kinh doanh mà không có chi tiết ở cấp độ thành phần.","jp":"この文書では、コンポーネント レベルの詳細は省略して、ビジネス上の問題について高レベルの説明を提供します。"}},{"k":"D","t":{"en":"The document includes the architect's contact information for questions arising during implementation.","vi":"Tài liệu bao gồm thông tin liên hệ của kiến ​​trúc sư đối với các câu hỏi phát sinh trong quá trình thực hiện.","jp":"この文書には、実装中に発生した質問に対する建築家の連絡先情報が含まれています。"}},{"k":"E","t":{"en":"The document lists all Claude models that were evaluated but does not specify which was selected or why.","vi":"Tài liệu liệt kê tất cả các mô hình Claude đã được đánh giá nhưng không nêu rõ mô hình nào được chọn hoặc tại sao.","jp":"この文書には、評価されたすべてのクロード モデルがリストされていますが、どれが選択されたのか、またその理由は明記されていません。"}}],"answer":["A","B"],"multi":true,"explain":{"key":"<b>Đáp án A, B.</b> Tài liệu đủ để bàn giao mà không cần kiến trúc sư phải có cả <b>đặc tả thực thi được</b> và <b>lập luận kiến trúc được lưu lại</b>.<br><b>A.</b> <b>Integration contract, configuration schema và hình dạng input/output</b> của từng thành phần cho phép đội triển khai xây độc lập mà không tự đoán cấu trúc dữ liệu, hành vi tool hay xử lý lỗi.<br><b>B.</b> <b>Decision log</b> ghi lý do các lựa chọn chính và phương án đã loại, giúp đội xử lý tình huống chưa lường trước mà không vô tình phá vỡ ràng buộc thiết kế hay mở lại các phương án đã bị loại.","elim":["<b>C.</b> Mô tả câu chuyện kinh doanh cấp cao không có chi tiết cấp thành phần thì không đủ để xây dựng.","<b>D.</b> Thông tin liên hệ kiến trúc sư thực chất ngầm thừa nhận cần kiến trúc sư tham gia tiếp — trái với tiêu chí độc lập.","<b>E.</b> Liệt kê các mô hình đã đánh giá mà không nói chọn mô hình nào và tại sao để lại một quyết định cốt lõi bỏ ngỏ."]}},{"id":"ccarp-q065","n":65,"topic":4,"type":"mcq","stem":{"en":"You are reviewing a peer's draft system prompt that contains contradictory instructions: one section says never to speculate beyond the supplied source, while another says to confidently fill in any gaps. Which response is most appropriate?","vi":"Bạn đang xem xét lời nhắc hệ thống dự thảo của một người ngang hàng có chứa các hướng dẫn trái ngược nhau: một phần nói rằng không bao giờ suy đoán vượt quá nguồn được cung cấp, trong khi một phần khác nói rằng hãy tự tin điền vào bất kỳ khoảng trống nào. Phản ứng nào là phù hợp nhất?","jp":"あなたは、相反する指示を含む同僚のドラフト システム プロンプトをレビューしています。あるセクションでは、提供されたソースを超えて推測しないようにと書かれている一方、別のセクションでは、ギャップを自信を持って埋めるようにと書かれています。 どの対応が最も適切でしょうか?"},"options":[{"k":"A","t":{"en":"Add a priority instruction directing the model to evaluate all instructions and apply whichever appears most contextually appropriate on each request.","vi":"Thêm hướng dẫn ưu tiên hướng dẫn mô hình đánh giá tất cả hướng dẫn và áp dụng bất kỳ hướng dẫn nào phù hợp nhất với từng yêu cầu.","jp":"すべての命令を評価し、各リクエストのコンテキスト上最も適切と思われる命令を適用するようにモデルに指示する優先命令を追加します。"}},{"k":"B","t":{"en":"Remove or rewrite the gap-filling instruction so the prompt consistently constrains the model to source- supported content.","vi":"Xóa hoặc viết lại hướng dẫn điền vào chỗ trống để lời nhắc ràng buộc mô hình một cách nhất quán với nội dung được nguồn hỗ trợ.","jp":"ギャップを埋める命令を削除するか書き換えて、プロンプトがモデルをソースでサポートされているコンテンツに一貫して制限するようにします。"}},{"k":"C","t":{"en":"Increase temperature so output randomness masks the contradiction.","vi":"Tăng nhiệt độ để tính ngẫu nhiên đầu ra che giấu sự mâu thuẫn.","jp":"出力のランダム性が矛盾を隠すように温度を上げます。"}},{"k":"D","t":{"en":"Keep both instructions and rely on the model to decide which one to follow on each request.","vi":"Giữ cả hai hướng dẫn và dựa vào mô hình để quyết định nên làm theo hướng dẫn nào cho mỗi yêu cầu.","jp":"両方の指示を保持し、モデルに依存して各リクエストでどちらに従うかを決定します。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Prompt chứa hai yêu cầu <b>mâu thuẫn trực tiếp</b> (không suy đoán ngoài nguồn vs. tự tin lấp mọi khoảng trống). Cách đúng là <b>loại bỏ hoặc viết lại chỉ dẫn lấp khoảng trống</b> để mô hình nhận một chính sách grounding nhất quán: chỉ dùng nội dung có nguồn hỗ trợ, cho phép trả lời ‘không đủ bằng chứng’ và yêu cầu trích dẫn. Chỉ dẫn rõ ràng, nhất quán cho hành vi ổn định hơn nhiều so với để mô hình tự đoán ý người viết prompt.","elim":["<b>A.</b> Thêm chỉ dẫn ưu tiên mơ hồ (‘áp dụng cái phù hợp nhất’) vẫn giữ nguyên mâu thuẫn và đẩy quyết định cho mô hình, hành vi không nhất quán.","<b>C.</b> Tăng temperature chỉ làm đầu ra biến thiên hơn, che giấu chứ không sửa mâu thuẫn và có thể tăng hallucination.","<b>D.</b> Giữ cả hai và để mô hình tự chọn mỗi lần dẫn tới hành vi khó dự đoán, đôi khi bịa nội dung không có nguồn."]},"cite":"Hướng dẫn ôn tập — §6.2 Tiêu chí rõ ràng so với chỉ dẫn mơ hồ; Lĩnh vực 4.1"},{"id":"ccarp-q066","n":66,"topic":4,"type":"mcq","stem":{"en":"You are comparing patterns for a batch document-classification job that follows fixed steps: extract metadata, classify, summarize, and persist. Which pattern is the best fit and why?","vi":"Bạn đang so sánh các mẫu cho công việc phân loại tài liệu theo lô theo các bước cố định: trích xuất siêu dữ liệu, phân loại, tóm tắt và lưu giữ. Mẫu nào phù hợp nhất và tại sao?","jp":"固定手順に従ったバッチ文書分類ジョブのパターンを比較しています。 メタデータを抽出し、分類し、要約し、永続化します。 どのパターンが最適ですか?またその理由は何ですか?"},"options":[{"k":"A","t":{"en":"A workflow pattern, because agentic patterns do not support tool invocations and therefore cannot execute the persist step that writes results to the downstream store.","vi":"Một mẫu quy trình làm việc, vì các mẫu tác nhân không hỗ trợ lệnh gọi công cụ và do đó không thể thực thi bước lưu giữ ghi kết quả vào kho lưu trữ phía dưới.","jp":"ワークフロー パターン。エージェント パターンはツールの呼び出しをサポートしていないため、結果をダウンストリーム ストアに書き込む永続化ステップを実行できません。"}},{"k":"B","t":{"en":"An agentic pattern, because the open-ended planning capability of agents produces more consistent structured outputs than a fixed workflow graph on classification tasks.","vi":"Một mẫu tác nhân, vì khả năng lập kế hoạch mở của các tác nhân tạo ra kết quả đầu ra có cấu trúc nhất quán hơn so với biểu đồ quy trình làm việc cố định về các nhiệm vụ phân loại.","jp":"エージェントのパターン。エージェントの無制限の計画機能により、分類タスクに関する固定ワークフロー グラフよりも一貫した構造化された出力が生成されます。"}},{"k":"C","t":{"en":"An agentic pattern, because agents are categorically more accurate than workflows and therefore always preferable regardless of step predictability.","vi":"Một mẫu tác nhân, vì các tác nhân có độ chính xác cao hơn về mặt phân loại so với quy trình làm việc và do đó luôn được ưu tiên hơn bất kể khả năng dự đoán bước.","jp":"エージェント パターン。エージェントはワークフローよりも断然正確であるため、ステップの予測可能性に関係なく常に推奨されます。"}},{"k":"D","t":{"en":"A workflow pattern, because the steps are well-defined and predictable per-request token cost is preferred over flexibility.","vi":"Mẫu quy trình làm việc vì các bước được xác định rõ ràng và chi phí mã thông báo theo yêu cầu có thể dự đoán được được ưu tiên hơn là tính linh hoạt.","jp":"ワークフロー パターン。ステップが明確に定義されており、要求ごとのトークン コストが予測可能なため、柔軟性よりも優先されます。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Các bước đã biết trước và cố định (trích metadata → phân loại → tóm tắt → lưu), nên <b>workflow</b> — nơi đường đi được định nghĩa sẵn bằng code — là phù hợp. Mỗi bước là một node xác định với schema, validation, retry rõ ràng, cho <b>chi phí token mỗi request dự đoán được</b>, dễ quan sát và kiểm thử, không tốn chi phí cho việc mô hình tự lập kế hoạch. Theo <i>Building Effective Agents</i>, agent chỉ đáng dùng khi số bước và hướng đi không thể biết trước.","elim":["<b>A.</b> Kết luận đúng (workflow) nhưng lý do sai: agentic pattern hoàn toàn hỗ trợ gọi tool, kể cả tool ghi xuống store.","<b>B.</b> Khả năng lập kế hoạch mở của agent không làm đầu ra có cấu trúc nhất quán hơn; ngược lại nó tăng biến thiên so với pipeline cố định.","<b>C.</b> Agent không ‘luôn chính xác hơn’ workflow; với bước dễ đoán, agent chỉ thêm chi phí, độ trễ và độ khó dự đoán."]},"cite":"Hướng dẫn
