exposed and additional tools are loaded on demand based on the task.","vi":"Áp dụng khám phá công cụ lũy tiến để hiển thị tập hợp con ban đầu được quản lý và các công cụ bổ sung được tải theo yêu cầu dựa trên tác vụ.","jp":"プログレッシブ ツール ディスカバリを適用すると、厳選された初期サブセットが公開され、タスクに基づいて追加のツールがオンデマンドで読み込まれます。"}},{"k":"B","t":{"en":"Use a separate model call to summarize all 60 tool definitions before each user turn.","vi":"Sử dụng lệnh gọi mô hình riêng để tóm tắt tất cả 60 định nghĩa công cụ trước mỗi lượt người dùng.","jp":"各ユーザーが順番を変える前に、別のモデル呼び出しを使用して 60 個のツール定義すべてを要約します。"}},{"k":"C","t":{"en":"Increase the maximum context length and load all 60 tool definitions on every request, accepting the higher token cost and latency as necessary for full capability.","vi":"Tăng độ dài ngữ cảnh tối đa và tải tất cả 60 định nghĩa công cụ theo mọi yêu cầu, chấp nhận chi phí mã thông báo và độ trễ cao hơn nếu cần để có được toàn bộ khả năng.","jp":"最大コンテキスト長を増やし、すべてのリクエストで 60 個のツール定義をすべてロードし、完全な機能を実現するために必要なトークン コストとレイテンシの増加を受け入れます。"}},{"k":"D","t":{"en":"Hard-code a fixed set of five tools per request to reduce token usage, regardless of whether those tools are relevant to the current task.","vi":"Mã hóa cứng một bộ năm công cụ cố định cho mỗi yêu cầu để giảm mức sử dụng mã thông báo, bất kể những công cụ đó có liên quan đến nhiệm vụ hiện tại hay không.","jp":"それらのツールが現在のタスクに関連しているかどうかに関係なく、リクエストごとに 5 つのツールの固定セットをハードコーディングして、トークンの使用量を削減します。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> <b>Progressive tool discovery</b> giữ nguyên toàn bộ danh mục năng lực nhưng chỉ đưa vào context một <b>tập tool phổ biến được tuyển chọn</b> cùng cơ chế khám phá; khi tác vụ cần, Claude tìm và <b>nạp định nghĩa tool liên quan theo nhu cầu</b> (Tool Search của Anthropic hiện thực mẫu này qua deferred loading). Cách này giảm token và thời gian phản hồi đầu tiên, đồng thời cải thiện độ chính xác chọn tool vì model không phải cân nhắc 60 tool cùng lúc.","elim":["<b>B.</b> Thêm một lời gọi model để tóm tắt 60 định nghĩa tool mỗi lượt làm tăng chi phí và độ trễ, lại làm mất chi tiết schema cần cho việc gọi tool chính xác.","<b>C.</b> Nạp cả 60 tool mỗi request chính là vấn đề cần giải quyết; tăng context không giảm token hay độ trễ và còn làm giảm độ chính xác chọn tool.","<b>D.</b> Cố định 5 tool bất kể liên quan hay không hy sinh độ rộng năng lực — tool cần thiết có thể không có mặt."]},"cite":"Hướng dẫn ôn tập — Lĩnh vực 2.3 Phân bổ Tool Giữa các Agent và Cấu hình tool_choice"},{"id":"ccarp-q093","n":93,"topic":5,"type":"mcq","stem":{"en":"The compliance team at a firm has approved a Claude Skill that generates client-facing investment summaries. The Skill includes the firm's required disclaimers and prohibited-language list. A product manager has asked whether additional guardrails are needed at the application layer or whether the Skill alone is sufficient. Which two guardrail responsibilities should remain at the application layer rather than the Skill? (Select two.) Each correct answer presents part of the solution.  [Chọn 2 đáp án]","vi":"Nhóm tuân thủ tại một công ty đã phê duyệt Claude Skill để tạo ra các bản tóm tắt đầu tư hướng tới khách hàng. Kỹ năng bao gồm các tuyên bố từ chối trách nhiệm bắt buộc của công ty và danh sách ngôn ngữ bị cấm. Người quản lý sản phẩm đã hỏi liệu có cần thêm lan can ở lớp ứng dụng hay chỉ Kỹ năng là đủ. Hai trách nhiệm lan can nào sẽ được giữ nguyên ở lớp ứng dụng thay vì Kỹ năng? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một phần của giải pháp.  [Chọn 2 đáp án]","jp":"企業のコンプライアンス チームは、顧客向けの投資概要を生成するクロード スキルを承認しました。このスキルには、会社の必須の免責事項と禁止言語リストが含まれています。 プロダクト マネージャーは、アプリケーション層に追加のガードレールが必要かどうか、それともスキルだけで十分かどうかを尋ねました。 スキルではなくアプリケーション層に残すべき 2 つのガードレールの責任はどれですか? (2 つ選択してください。) それぞれの正解は、解決策の一部を示しています。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Log every generated summary to the firm's compliance audit trail for retention.","vi":"Ghi lại mọi bản tóm tắt được tạo vào hồ sơ kiểm tra tuân thủ của công ty để lưu giữ.","jp":"生成されたすべての概要を会社のコンプライアンス監査証跡に記録し、保存します。"}},{"k":"B","t":{"en":"Verify the requesting user is authorized to generate investment summaries at all.","vi":"Xác minh rằng người dùng yêu cầu được phép tạo các bản tóm tắt đầu tư.","jp":"要求しているユーザーに投資概要を生成する権限があることを確認してください。"}},{"k":"C","t":{"en":"Format output sections according to the firm's standardized house style guidelines.","vi":"Định dạng các phần đầu ra theo hướng dẫn về kiểu dáng ngôi nhà tiêu chuẩn của công ty.","jp":"会社の標準化されたハウス スタイル ガイドラインに従って出力セクションをフォーマットします。"}},{"k":"D","t":{"en":"Apply the disclaimer template that the compliance team has standardized firm-wide.","vi":"Áp dụng mẫu tuyên bố từ chối trách nhiệm mà nhóm tuân thủ đã chuẩn hóa trên toàn công ty.","jp":"コンプライアンス チームが全社的に標準化した免責事項テンプレートを適用します。"}},{"k":"E","t":{"en":"Apply the prohibited-language list that the compliance team maintains and updates.","vi":"Áp dụng danh sách ngôn ngữ bị cấm mà nhóm tuân thủ duy trì và cập nhật.","jp":"コンプライアンス チームが維持および更新する禁止言語リストを適用します。"}}],"answer":["A","B"],"multi":true,"explain":{"key":"<b>Đáp án A, B.</b><br><b>B:</b> <b>Phân quyền</b> phải do tầng ứng dụng thực thi: xác thực người yêu cầu, tra vai trò/quyền và từ chối nếu không đủ quyền. Skill chỉ hướng dẫn Claude cách hành xử, <b>không phải ranh giới bảo mật</b> đáng tin cậy.<br><b>A:</b> <b>Ghi audit trail tuân thủ</b> cũng thuộc tầng ứng dụng: hệ thống phải tạo bản ghi có thẩm quyền (người yêu cầu, thời điểm, phiên bản Skill/model, đầu ra) và lưu giữ theo chính sách — việc này phải xảy ra một cách xác định, không phụ thuộc vào việc model có làm theo chỉ dẫn hay không.","elim":["<b>C.</b> Định dạng theo house style là quy tắc sinh nội dung, phù hợp đặt trong Skill cùng với chỉ dẫn viết.","<b>D.</b> Mẫu disclaimer đã được compliance chuẩn hóa và đóng gói sẵn trong Skill đã phê duyệt — đây là trách nhiệm hợp lý của Skill.","<b>E.</b> Danh sách ngôn ngữ cấm do compliance duy trì cũng đã nằm trong Skill; áp dụng nó khi sinh nội dung là việc của Skill."]},"cite":"Hướng dẫn ôn tập — §3.5 Hooks trong Agent SDK; Lĩnh vực 1.5"},{"id":"ccarp-q094","n":94,"topic":5,"type":"mcq","stem":{"en":"You are supporting an EU-based deployment with GDPR obligations. Which combination of measures best supports the deployment's GDPR posture?","vi":"Bạn đang hỗ trợ triển khai tại EU với các nghĩa vụ GDPR. Sự kết hợp các biện pháp nào hỗ trợ tốt nhất cho tình trạng GDPR của quá trình triển khai?","jp":"あなたは、GDPR 義務を伴う EU ベースの展開をサポートしています。 導入の GDPR 体制を最もよくサポートする対策の組み合わせはどれですか?"},"options":[{"k":"A","t":{"en":"enterprise-tier deployment with a signed Data Processing Addendum, defined data-retention configuration, redaction of personal data not needed for the task, and documented data-subjectrights handling","vi":"triển khai ở cấp doanh nghiệp với Phụ lục xử lý dữ liệu đã ký, cấu hình lưu giữ dữ liệu được xác định, loại bỏ dữ liệu cá nhân không cần thiết cho nhiệm vụ và xử lý quyền chủ thể dữ liệu được ghi lại","jp":"署名されたデータ処理追加条項、定義されたデータ保持構成、タスクに不要な個人データの編集、および文書化されたデータ主体の権利処理を伴うエンタープライズ層の展開"}},{"k":"B","t":{"en":"disabling all data-retention configuration, redaction controls, and data-subject-rights handling to simplify day-to-day operations, accepting the resulting GDPR compliance exposure","vi":"vô hiệu hóa tất cả cấu hình lưu giữ dữ liệu, kiểm soát biên tập và xử lý quyền đối với chủ thể dữ liệu để đơn giản hóa các hoạt động hàng ngày, chấp nhận rủi ro tuân thủ GDPR","jp":"すべてのデータ保持構成、秘匿化制御、およびデータ主体の権利処理を無効にして、日常業務を簡素化し、その結果として生じる GDPR コンプライアンスの危険性を受け入れる"}},{"k":"C","t":{"en":"using a personal Claude account tier for processing EU personal data at scale, with no signed Data Processing Addendum and no documented data-subject-rights handling procedure","vi":"sử dụng cấp tài khoản Claude cá nhân để xử lý dữ liệu cá nhân của EU trên quy mô lớn mà không có Phụ lục xử lý dữ liệu đã ký và không có quy trình xử lý quyền đối tượng dữ liệu được ghi lại","jp":"EU の個人データを大規模に処理するために個人クロード アカウント層を使用しており、署名されたデータ処理追加条項や文書化されたデータ主体の権利処理手順はありません"}},{"k":"D","t":{"en":"pasting full EU personal data into every prompt to \"give Claude complete context\" without considering purpose limitation, data minimization, or the organization's Data Processing Addendum obligations","vi":"dán toàn bộ dữ liệu cá nhân của EU vào mọi lời nhắc để \"cung cấp cho Claude bối cảnh hoàn chỉnh\" mà không xem xét giới hạn mục đích, giảm thiểu dữ liệu hoặc nghĩa vụ Phụ lục xử lý dữ liệu của tổ chức","jp":"目的の制限、データの最小化、または組織のデータ処理追加条項の義務を考慮せずに、「クロードに完全なコンテキストを提供する」ためにすべてのプロンプトに完全な EU 個人データを貼り付ける"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Tư thế GDPR vững chắc cần kết hợp biện pháp <b>hợp đồng, kỹ thuật và vận hành</b>: triển khai cấp doanh nghiệp với <b>Data Processing Addendum (DPA)</b> đã ký xác định nghĩa vụ bên xử lý; <b>cấu hình lưu giữ dữ liệu</b> rõ ràng để dữ liệu cá nhân không bị giữ vô thời hạn; <b>che/loại bỏ dữ liệu cá nhân không cần thiết</b> (tối thiểu hóa dữ liệu, giới hạn mục đích); và quy trình xử lý <b>quyền của chủ thể dữ liệu</b> (truy cập, xóa, đính chính) được tài liệu hóa.","elim":["<b>B.</b> Tắt cấu hình lưu giữ, redaction và xử lý quyền chủ thể dữ liệu là chủ động chấp nhận vi phạm GDPR để đổi lấy sự tiện lợi.","<b>C.</b> Dùng tài khoản cá nhân xử lý dữ liệu cá nhân EU quy mô lớn, không DPA và không quy trình quyền chủ thể dữ liệu là thiếu nền tảng hợp đồng lẫn vận hành.","<b>D.</b> Dán toàn bộ dữ liệu cá nhân vào mọi prompt vi phạm trực tiếp nguyên tắc tối thiểu hóa dữ liệu và giới hạn mục đích."]}},{"id":"ccarp-q095","n":95,"topic":5,"type":"mcq","stem":{"en":"You are reviewing instrumentation in a multi-agent system. Which two findings constitute valid observability gaps in the instrumentation? (Select two.) Each correct answer presents a complete solution.  [Chọn 2 đáp án]","vi":"Bạn đang xem xét thiết bị trong hệ thống đa tác nhân. Hai phát hiện nào tạo thành khoảng trống có thể quan sát được trong thiết bị đo đạc? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một giải pháp hoàn chỉnh.  [Chọn 2 đáp án]","jp":"マルチエージェント システムのインストルメンテーションをレビューしています。 計測における有効な可観測性ギャップを構成する 2 つの発見はどれですか? (2 つ選択してください。) それぞれの正解は完全な解決策を示します。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Trace spans for each agent step are exported to the shared distributed-tracing backend.","vi":"Khoảng theo dõi cho từng bước tác nhân được xuất sang phần phụ trợ theo dõi phân tán được chia sẻ.","jp":"各エージェント ステップのトレース スパンは、共有分散トレーシング バックエンドにエクスポートされます。"}},{"k":"B","t":{"en":"Latency and token usage on every span are emitted to the central metrics pipeline.","vi":"Độ trễ và mức sử dụng mã thông báo trên mỗi khoảng thời gian được chuyển đến quy trình số liệu trung tâm.","jp":"すべてのスパンでのレイテンシとトークンの使用状況は、中央のメトリクス パイプラインに出力されます。"}},{"k":"C","t":{"en":"Tool-call payloads and outcomes are recorded with redaction applied to known sensitive fields.","vi":"Tải trọng và kết quả của cuộc gọi công cụ được ghi lại bằng cách áp dụng tính năng chỉnh sửa cho các trường nhạy cảm đã biết.","jp":"ツール呼び出しのペイロードと結果は、既知の機密フィールドに適用された編集とともに記録されます。"}},{"k":"D","t":{"en":"Model identity and version on each turn are not recorded with the turn artifacts.","vi":"Nhận dạng mô hình và phiên bản ở mỗi lượt không được ghi lại cùng với các tạo phẩm ở lượt.","jp":"各ターンのモデル ID とバージョンは、ターン アーティファクトには記録されません。"}},{"k":"E","t":{"en":"Request-scoped correlation identifiers do not propagate across agent and tool calls.","vi":"Giá trị nhận dạng tương quan trong phạm vi yêu cầu không được truyền qua các lệnh gọi tác nhân và công cụ.","jp":"リクエスト スコープの相関識別子は、エージェント呼び出しとツール呼び出しの間では伝播されません。"}}],"answer":["D","E"],"multi":true,"explain":{"key":"<b>Đáp án D, E.</b> Đề hỏi những phát hiện là <b>lỗ hổng</b> quan sát, tức điều đang thiếu.<br><b>D:</b> Không ghi <b>danh tính và phiên bản model</b> mỗi lượt khiến không thể liên hệ thay đổi hành vi với việc chuyển model, tái lập lượt lỗi, so sánh giữa các phiên bản hay phân biệt model drift với lỗi prompt/retrieval.<br><b>E:</b> Hệ multi-agent đi qua nhiều ranh giới (orchestrator, agent, MCP, tool); nếu <b>correlation ID theo request không được lan truyền</b>, không thể nối các span/log thành một chuỗi thực thi để truy vết nguyên nhân gốc.","elim":["<b>A.</b> Trace span cho từng bước agent được xuất về backend tracing chung là thực hành tốt đã có, không phải lỗ hổng.","<b>B.</b> Latency và token usage trên mọi span được đẩy về pipeline metric trung tâm là instrumentation đầy đủ, không phải lỗ hổng.","<b>C.</b> Ghi payload và kết quả tool call có redaction trường nhạy cảm là cân bằng đúng giữa khả năng quan sát và quyền riêng tư, không phải lỗ hổng."]}},{"id":"ccarp-q096","n":96,"topic":5,"type":"mcq","stem":{"en":"When communicating an architectural decision to a security and compliance reviewer, which content set is most aligned with that audience's primary concerns?","vi":"Khi truyền đạt một quyết định về kiến ​​trúc cho người đánh giá về bảo mật và tuân thủ, bộ nội dung nào phù hợp nhất với mối quan tâm chính của khán giả đó?","jp":"アーキテクチャ上の決定をセキュリティおよびコンプライアンスのレビュー担当者に伝えるとき、どのコンテンツ セットがその対象者の主な関心事に最も一致しているでしょうか?"},"options":[{"k":"A","t":{"en":"Feature delivery schedule, roadmap dependencies, and scope boundaries for the product manager.","vi":"Lịch trình phân phối tính năng, sự phụ thuộc của lộ trình và ranh giới phạm vi cho người quản lý sản phẩm.","jp":"プロダクト マネージャー向けの機能提供スケジュール、ロードマップの依存関係、範囲の境界。"}},{"k":"B","t":{"en":"Implementation timeline, component interfaces, and deployment sequence for the engineering team.","vi":"Tiến trình triển khai, giao diện thành phần và trình tự triển khai cho nhóm kỹ thuật.","jp":"エンジニアリング チームの実装タイムライン、コンポーネント インターフェイス、導入シーケンス。"}},{"k":"C","t":{"en":"Threat model, control mappings, residual-risk acceptance criteria, and audit traceability.","vi":"Mô hình mối đe dọa, ánh xạ kiểm soát, tiêu chí chấp nhận rủi ro còn lại và khả năng truy xuất nguồn gốc kiểm toán.","jp":"脅威モデル、制御マッピング、残留リスクの許容基準、および監査のトレーサビリティ。"}},{"k":"D","t":{"en":"Decision rationale, business outcomes, and high-level risk summary for executive review.","vi":"Cơ sở đưa ra quyết định, kết quả kinh doanh và tóm tắt rủi ro cấp cao để ban điều hành xem xét.","jp":"エグゼクティブレビューのための意思決定の根拠、ビジネスの成果、および高レベルのリスクの概要。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Người review bảo mật và tuân thủ cần xác định: các mối đe dọa trọng yếu đã được nhận diện chưa (<b>threat model</b> — tài sản, ranh giới tin cậy, kẻ tấn công, đường tấn công), kiểm soát nào xử lý chúng (<b>control mapping</b> tới chính sách, quy định, khung đảm bảo), rủi ro còn lại được chấp nhận theo tiêu chí nào (<b>residual-risk acceptance</b>) và quyết định có chứng minh được khi audit không (<b>audit traceability</b>). Nội dung C khớp đúng các mối quan tâm đó.","elim":["<b>A.</b> Lịch giao tính năng, phụ thuộc roadmap và phạm vi là mối quan tâm của product manager, không phải của reviewer bảo mật.","<b>B.</b> Timeline triển khai, interface thành phần và trình tự deploy phục vụ đội kỹ thuật thực thi, không trả lời câu hỏi về rủi ro và kiểm soát.","<b>D.</b> Lý do, kết quả kinh doanh và tóm tắt rủi ro mức cao dành cho lãnh đạo; quá sơ lược so với nhu cầu bằng chứng chi tiết của reviewer bảo mật."]}},{"id":"ccarp-q097","n":97,"topic":5,"type":"mcq","stem":{"en":"You are defining when to introduce a project subagent versus relying on Claude Code's general capabilities. Which scenario most directly justifies a dedicated subagent?","vi":"Bạn đang xác định thời điểm giới thiệu tác nhân phụ của dự án thay vì dựa vào khả năng chung của Claude Code. Kịch bản nào trực tiếp biện minh nhất cho một tác nhân phụ chuyên dụng?","jp":"クロード コードの一般的な機能に依存するのではなく、プロジェクト サブエージェントをいつ導入するかを定義します。 専用サブエージェントを最も直接的に正当化するシナリオはどれですか?"},"options":[{"k":"A","t":{"en":"The team has a recurring specialized task, such as database schema review, that requires a focused system prompt, narrow tool permissions, and a specific model selection across many sessions.","vi":"Nhóm có một nhiệm vụ chuyên biệt định kỳ, chẳng hạn như xem xét lược đồ cơ sở dữ liệu, yêu cầu lời nhắc hệ thống tập trung, thu hẹp quyền đối với công cụ và lựa chọn mô hình cụ thể trong nhiều phiên.","jp":"チームには、データベース スキーマのレビューなど、集中的なシステム プロンプト、狭いツール権限、多くのセッションにわたる特定のモデルの選択が必要な、定期的な特殊なタスクがあります。"}},{"k":"B","t":{"en":"The team has a one-time ad hoc question that will not recur and does not require a focused system prompt, narrow tool permissions, or dedicated model selection.","vi":"Nhóm có một câu hỏi đặc biệt một lần sẽ không lặp lại và không yêu cầu lời nhắc hệ thống tập trung, quyền truy cập công cụ hẹp hoặc lựa chọn mô hình chuyên dụng.","jp":"チームには、繰り返されることのない 1 回限りのアドホックな質問があり、集中的なシステム プロンプト、狭いツール権限、専用モデルの選択は必要ありません。"}},{"k":"C","t":{"en":"The team has no recurring specialized tasks and uses Claude Code only for isolated generalpurpose work that does not justify a dedicated system prompt or tool scope.","vi":"Nhóm không có nhiệm vụ chuyên biệt định kỳ và chỉ sử dụng Mã Claude cho công việc có mục đích chung riêng biệt mà không cần đến lời nhắc hệ thống hoặc phạm vi công cụ chuyên dụng.","jp":"チームには繰り返しの特殊なタスクはなく、専用のシステム プロンプトやツールの範囲が正当化されない、個別の汎用作業にのみクロード コードを使用します。"}},{"k":"D","t":{"en":"The team wants every Claude Code interaction to use the same generic system prompt with no task- specific specialization, narrow tool permissions, or dedicated model selection.","vi":"Nhóm muốn mọi tương tác với Mã Claude đều sử dụng cùng một lời nhắc hệ thống chung mà không có chuyên môn về nhiệm vụ cụ thể, quyền hạn chế đối với công cụ hoặc lựa chọn mô hình chuyên dụng.","jp":"チームは、すべての Claude Code インタラクションで、タスク固有の特殊化、狭いツール権限、または専用モデルの選択を行わずに、同じ汎用システム プロンプトを使用することを望んでいます。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Subagent chuyên dụng xứng đáng khi việc chuyên biệt hóa <b>lặp lại và có giá trị vận hành</b>. Review schema cơ sở dữ liệu là tác vụ <b>định kỳ, chuyên biệt</b>, cần <b>system prompt tập trung</b>, <b>quyền tool hẹp</b> và <b>chọn model cụ thể</b> qua nhiều session — subagent cho phép mã hóa vai trò này một lần, đảm bảo nhất quán, cô lập context chuyên biệt và áp dụng least privilege bằng cách loại bỏ tool không liên quan.","elim":["<b>B.</b> Câu hỏi ad hoc một lần, không lặp lại và không cần prompt/tool/model riêng — khả năng chung của Claude Code đủ xử lý.","<b>C.</b> Không có tác vụ chuyên biệt định kỳ nào thì không có gì để đóng gói thành subagent.","<b>D.</b> Muốn mọi tương tác dùng cùng prompt chung, không chuyên biệt hóa là đúng điều ngược lại với lý do tạo subagent."]},"cite":"Hướng dẫn ôn tập — §3.2 Cấu hình AgentDefinition; Lĩnh vực 1.3"},{"id":"ccarp-q098","n":98,"topic":5,"type":"mcq","stem":{"en":"You are identifying signals that a deployment should re-enter design rather than continue iterating in place. Which signal most directly indicates the need for a new design cycle?","vi":"Bạn đang xác định các tín hiệu cho thấy quá trình triển khai nên thực hiện lại thiết kế thay vì tiếp tục lặp lại tại chỗ. Tín hiệu nào trực tiếp nhất cho thấy sự cần thiết của một chu trình thiết kế mới?","jp":"デプロイメントをその場で反復し続けるのではなく、設計に再導入する必要があるというシグナルを特定しています。 新しい設計サイクルの必要性を最も直接的に示す信号はどれですか?"},"options":[{"k":"A","t":{"en":"A minor copy edit is requested in a customer-facing string within the existing UI, which can be handled as a localized content change without altering component responsibilities or contracts.","vi":"Một chỉnh sửa bản sao nhỏ được yêu cầu trong chuỗi hướng tới khách hàng trong giao diện người dùng hiện có. Việc chỉnh sửa này có thể được xử lý dưới dạng thay đổi nội dung đã bản địa hóa mà không làm thay đổi trách nhiệm hoặc hợp đồng của thành phần.","jp":"既存の UI 内の顧客向けの文字列でマイナーなコピー編集が要求されます。これは、コンポーネントの責任や契約を変更することなく、ローカライズされたコンテンツの変更として処理できます。"}},{"k":"B","t":{"en":"A dashboard alert threshold needs a small numerical adjustment to reduce false-positive noise, which can be handled as an operational configuration change without a new design cycle.","vi":"Ngưỡng cảnh báo trên bảng điều khiển cần được điều chỉnh bằng số nhỏ để giảm tiếng ồn dương tính giả. Điều này có thể được xử lý dưới dạng thay đổi cấu hình vận hành mà không cần chu trình thiết kế mới.","jp":"ダッシュボードのアラートしきい値には、誤検知ノイズを減らすために小さな数値調整が必要ですが、これは新しい設計サイクルを必要とせずに運用構成の変更として処理できます。"}},{"k":"C","t":{"en":"A runbook step requires a clarification edit to improve on-call guidance accuracy, which can be handled as a documentation update without changes to component responsibilities or core contracts.","vi":"Một bước trong sổ tay yêu cầu chỉnh sửa làm rõ để cải thiện độ chính xác của hướng dẫn theo yêu cầu, có thể được xử lý dưới dạng cập nhật tài liệu mà không thay đổi trách nhiệm thành phần hoặc hợp đồng cốt lõi.","jp":"ランブックのステップでは、オンコール ガイダンスの精度を向上させるために明確化編集が必要ですが、コンポーネントの責任やコア契約を変更することなく、ドキュメントの更新として処理できます。"}},{"k":"D","t":{"en":"The system's current architecture cannot meet the new requirements without changes to component responsibilities or core contracts.","vi":"Kiến trúc hiện tại của hệ thống không thể đáp ứng các yêu cầu mới nếu không có những thay đổi về trách nhiệm thành phần hoặc hợp đồng cốt lõi.","jp":"システムの現在のアーキテクチャは、コンポーネントの責任やコア契約を変更しない限り、新しい要件を満たすことはできません。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Chu kỳ thiết kế mới cần thiết khi thay đổi <b>vượt qua ranh giới kiến trúc</b>: kiến trúc hiện tại không thể đáp ứng yêu cầu mới nếu không <b>phân bổ lại trách nhiệm thành phần</b> hoặc <b>thay đổi contract cốt lõi</b>. Những thay đổi như vậy ảnh hưởng ownership, luồng dữ liệu, interface tích hợp, ranh giới bảo mật và chiến lược đánh giá, nên cần discovery, phân tích tác động, review thiết kế và kế hoạch regression mới — không thể chỉ lặp tại chỗ.","elim":["<b>A.</b> Sửa một chuỗi hiển thị là thay đổi nội dung cục bộ, chính phương án đã nói rõ không đổi trách nhiệm thành phần hay contract.","<b>B.</b> Chỉnh ngưỡng cảnh báo để giảm false positive là thay đổi cấu hình vận hành, xử lý được trong vòng lặp hiện tại.","<b>C.</b> Làm rõ một bước runbook là cập nhật tài liệu, không chạm tới kiến trúc."]}},{"id":"ccarp-q099","n":99,"topic":5,"type":"mcq","stem":{"en":"You are rolling out monitoring for a Claude-based deployment and must complete the specification steps before instrumenting the deployment. Which two steps must be completed BEFORE instrumenting the deployment to emit metrics and traces? (Select two.) Each correct answer presents part of the solution.  [Chọn 2 đáp án]","vi":"Bạn đang triển khai giám sát quá trình triển khai dựa trên Claude và phải hoàn thành các bước đặc tả trước khi trang bị công cụ triển khai. Hai bước nào phải được hoàn thành TRƯỚC KHI triển khai công cụ để phát ra số liệu và dấu vết? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một phần của giải pháp.  [Chọn 2 đáp án]","jp":"クロードベースの展開の監視をロールアウトしているため、展開を計測する前に仕様の手順を完了する必要があります。 メトリクスとトレースを出力するようにデプロイメントをインストルメント化する前に、次の 2 つの手順を完了する必要がありますか? (2 つ選択してください。) それぞれの正解は、解決策の一部を示しています。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Define the metrics and the slices the deployment will monitor across normal and adversarial traffic.","vi":"Xác định các số liệu và các phần mà quá trình triển khai sẽ giám sát trên lưu lượng truy cập thông thường và đối nghịch.","jp":"デプロイメントが通常のトラフィックと敵対的なトラフィックにわたって監視するメトリクスとスライスを定義します。"}},{"k":"B","t":{"en":"Tune the alert thresholds based on observed normal-state distributions to reduce false positives.","vi":"Điều chỉnh các ngưỡng cảnh báo dựa trên phân bố trạng thái bình thường được quan sát để giảm kết quả dương tính giả.","jp":"観察された正常状態の分布に基づいてアラートのしきい値を調整し、誤検知を減らします。"}},{"k":"C","t":{"en":"Define the service-level objectives (SLOs) and the error budgets the deployment will be held to.","vi":"Xác định các mục tiêu cấp độ dịch vụ (SLO) và mức độ lỗi mà việc triển khai sẽ được đảm bảo.","jp":"サービス レベル目標 (SLO) と、展開で維持されるエラー バジェットを定義します。"}},{"k":"D","t":{"en":"Build the dashboards that surface metrics across slices at the cadence the team operates on.","vi":"Xây dựng các trang tổng quan hiển thị số liệu trên các phần theo nhịp độ hoạt động của nhóm.","jp":"チームが運営するペースでスライス全体のメトリクスを表示するダッシュボードを構築します。"}},{"k":"E","t":{"en":"Document the dashboards, alerts, and runbooks for the on-call rotation that will respond.","vi":"Ghi lại các bảng thông tin, cảnh báo và sổ ghi chép để luân chuyển theo cuộc gọi sẽ phản hồi.","jp":"対応するオンコールローテーションのダッシュボード、アラート、ランブックを文書化します。"}}],"answer":["A","C"],"multi":true,"explain":{"key":"<b>Đáp án A, C.</b> Instrumentation phải được dẫn dắt bởi một <b>đặc tả đo lường</b> có trước.<br><b>A:</b> Định nghĩa <b>metric và slice</b> (traffic đại diện, đầu vào đối kháng, phân khúc người dùng, tool) quyết định cần phát ra tín hiệu gì để phát hiện lỗi chất lượng, chi phí, an toàn, độ tin cậy.<br><b>C:</b> <b>SLO và error budget</b> quyết định phép đo cần thiết, cửa sổ tổng hợp và mức lỗi chấp nhận được — phải có trước để instrumentation đo đúng thứ sẽ được dùng để đánh giá deployment.","elim":["<b>B.</b> Tinh chỉnh ngưỡng cảnh báo dựa trên phân phối trạng thái bình thường đã quan sát cần dữ liệu từ instrumentation, nên chỉ làm được SAU khi đã instrument.","<b>D.</b> Dashboard hiển thị metric đã được phát ra, nên xây sau instrumentation.","<b>E.</b> Tài liệu hóa dashboard, alert và runbook cho on-call phụ thuộc vào các thành phần đó đã tồn tại — bước sau cùng."]}},{"id":"ccarp-q100","n":100,"topic":5,"type":"mcq","stem":{"en":"You are integrating Claude Code into a team workflow and must complete the design and configuration steps before piloting the integrated workflow with a small group. Which two steps must be completed BEFORE piloting the integrated workflow? (Select two.) Each correct answer presents part of the solution.  [Chọn 2 đáp án]","vi":"Bạn đang tích hợp Claude Code vào quy trình làm việc của nhóm và phải hoàn thành các bước thiết kế và cấu hình trước khi thử nghiệm quy trình làm việc tích hợp với một nhóm nhỏ. Hai bước nào phải được hoàn thành TRƯỚC KHI thử nghiệm quy trình làm việc tích hợp? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một phần của giải pháp.  [Chọn 2 đáp án]","jp":"Claude Code をチーム ワークフローに統合しているため、小さなグループで統合ワークフローを試験運用する前に、設計と構成の手順を完了する必要があります。 統合ワークフローを試験運用する前に完了する必要がある 2 つの手順はどれですか? (2 つ選択してください。) それぞれの正解は、解決策の一部を示しています。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Document the integrated workflow with handoff criteria, permission boundaries, and on-call runbooks.","vi":"Ghi lại quy trình làm việc tích hợp với các tiêu chí bàn giao, ranh giới quyền và sổ tay theo yêu cầu.","jp":"引き継ぎ基準、権限の境界、オンコールのランブックを含む統合ワークフローを文書化します。"}},{"k":"B","t":{"en":"Identify the workflow steps where AI-assisted tooling adds value and where human authority must remain.","vi":"Xác định các bước trong quy trình công việc trong đó công cụ được hỗ trợ bởi AI sẽ tăng thêm giá trị và nơi quyền hạn của con người phải được duy trì.","jp":"AI 支援ツールが価値を追加するワークフローのステップと、人間の権限を残すべきステップを特定します。"}},{"k":"C","t":{"en":"Negotiate the workflow change with affected teams and obtain formal sign-off from each manager.","vi":"Đàm phán thay đổi quy trình làm việc với các nhóm bị ảnh hưởng và nhận được sự phê duyệt chính thức từ mỗi người quản lý.","jp":"ワークフローの変更について影響を受けるチームと交渉し、各マネージャーから正式な承認を得ます。"}},{"k":"D","t":{"en":"Iterate the integrated workflow based on pilot findings before broader rollout to the team.","vi":"Lặp lại quy trình làm việc tích hợp dựa trên những phát hiện thí điểm trước khi triển khai rộng rãi hơn cho nhóm.","jp":"チームに広範に展開する前に、パイロットの結果に基づいて統合ワークフローを繰り返します。"}},{"k":"E","t":{"en":"Configure the project-scope MCP servers, permissions, subagents, and persistent project context.","vi":"Định cấu hình máy chủ MCP, quyền, tác nhân phụ và bối cảnh dự án liên tục ở phạm vi dự án.","jp":"プロジェクト スコープの MCP サーバー、権限、サブエージェント、および永続的なプロジェクト コンテキストを構成します。"}}],"answer":["B","E"],"multi":true,"explain":{"key":"<b>Đáp án B, E.</b> Pilot phải kiểm nghiệm một workflow được thiết kế có chủ đích.<br><b>B:</b> Xác định <b>bước nào AI tạo giá trị</b> và <b>bước nào thẩm quyền phải thuộc về con người</b> (phê duyệt, trách nhiệm giải trình, quyết định hệ trọng) — đây là ranh giới vai trò mà pilot cần kiểm chứng.<br><b>E:</b> Cấu hình môi trường kỹ thuật ở project scope: MCP server dùng chung, permission có phạm vi, subagent chuyên biệt và context dự án bền vững (ví dụ <code>CLAUDE.md</code>) để nhóm pilot chạy nhất quán.","elim":["<b>A.</b> Tài liệu hóa đầy đủ kèm runbook on-call thường hoàn thiện sau khi pilot xác nhận workflow; không phải bước thiết kế/cấu hình tiên quyết.","<b>C.</b> Đàm phán và lấy sign-off chính thức từ mọi quản lý là quá rộng cho một pilot nhóm nhỏ, trừ khi quản trị nội bộ yêu cầu.","<b>D.</b> Lặp lại dựa trên kết quả pilot chỉ có thể diễn ra SAU pilot."]},"cite":"Hướng dẫn ôn tập — §4.3 Cấu hình MCP Server; Lĩnh vực 3.1"}]},{"n":6,"title":{"en":"Practice Set 6","vi":"Bộ đề số 6","jp":"練習問題 6"},"questions":[{"id":"ccarp-q101","n":101,"topic":6,"type":"mcq","stem":{"en":"You are preparing a HIPAA-eligible deployment for a healthcare customer. Which configuration supports HIPAA compliance using Anthropic-offered tools?","vi":"Bạn đang chuẩn bị triển khai đủ điều kiện theo HIPAA cho khách hàng chăm sóc sức khỏe. Cấu hình nào hỗ trợ tuân thủ HIPAA bằng các công cụ do Anthropic cung cấp?","jp":"あなたは、ヘルスケアの顧客向けに HIPAA 準拠の展開を準備しています。 Anthropic が提供するツールを使用して HIPAA 準拠をサポートする構成はどれですか?"},"options":[{"k":"A","t":{"en":"Claude Free with no contractual addendum, since consumer products meet HIPAA requirements out of the box.","vi":"Claude Free không có phụ lục hợp đồng vì sản phẩm tiêu dùng đáp ứng ngay các yêu cầu của HIPAA.","jp":"Claude Free は、消費者向け製品がすぐに HIPAA 要件を満たしているため、契約上の追加条項がありません。"}},{"k":"B","t":{"en":"Claude Enterprise with a signed Business Associate Agreement, Zero Data Retention enabled, and audit logging configured for compliance tracking.","vi":"Claude Enterprise với Thỏa thuận liên kết kinh doanh đã ký, bật tính năng Không lưu giữ dữ liệu và ghi nhật ký kiểm tra được định cấu hình để theo dõi tuân thủ.","jp":"ビジネスアソシエート契約に署名し、ゼロデータ保持が有効になっており、コンプライアンス追跡用に監査ログが構成されている Claude Enterprise。"}},{"k":"C","t":{"en":"Disabling all audit logging so that no PHI is recorded in any log store, on the assumption that the absence of logs satisfies HIPAA requirements without a signed BAA.","vi":"Vô hiệu hóa tất cả ghi nhật ký kiểm tra để không có PHI nào được ghi lại trong bất kỳ kho lưu trữ nhật ký nào, với giả định rằng việc không có nhật ký đáp ứng các yêu cầu của HIPAA mà không có BAA được ký.","jp":"署名された BAA がなくてもログがないことが HIPAA 要件を満たすことを前提として、すべての監査ログを無効にして、どのログ ストアにも PHI が記録されないようにします。"}},{"k":"D","t":{"en":"An ad-hoc personal Claude account used by individual clinicians for PHI-related tasks, with no Business Associate Agreement, no Zero Data Retention, and no audit logging configured.","vi":"Tài khoản Claude cá nhân đặc biệt được các bác sĩ lâm sàng sử dụng cho các nhiệm vụ liên quan đến PHI, không có Thỏa thuận liên kết kinh doanh, không lưu giữ dữ liệu và không có cấu hình ghi nhật ký kiểm tra.","jp":"個々の臨床医が PHI 関連のタスクに使用するアドホック個人クロード アカウント。業務提携契約、ゼロ データ保持、監査ログの設定はありません。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Đây là cấu hình duy nhất thiết lập đủ nền tảng <b>hợp đồng, xử lý dữ liệu và audit</b> cho triển khai đủ điều kiện HIPAA: gói thương mại doanh nghiệp với <b>Business Associate Agreement (BAA)</b> đã ký (bắt buộc khi bên thứ ba xử lý PHI), <b>Zero Data Retention</b> để giảm dữ liệu PHI được lưu giữ phía nhà cung cấp, và <b>audit logging</b> để theo dõi tuân thủ ai đã truy cập gì, khi nào.","elim":["<b>A.</b> Sản phẩm tiêu dùng miễn phí không có BAA nên không đáp ứng HIPAA khi xử lý PHI.","<b>C.</b> Tắt audit logging làm mất khả năng truy vết mà HIPAA yêu cầu, và không có BAA thì vẫn không được xử lý PHI.","<b>D.</b> Tài khoản cá nhân của từng bác sĩ không có BAA, ZDR hay audit log — vi phạm trên mọi phương diện."]}},{"id":"ccarp-q102","n":102,"topic":6,"type":"mcq","stem":{"en":"You are listing characteristics of strong architectural-decision communication. Which two characteristics belong on the list? (Select two.) Each correct answer presents a complete solution.  [Chọn 2 đáp án]","vi":"Bạn đang liệt kê các đặc điểm của giao tiếp quyết định kiến ​​trúc mạnh mẽ. Hai đặc điểm nào thuộc về danh sách? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một giải pháp hoàn chỉnh.  [Chọn 2 đáp án]","jp":"あなたは、強力なアーキテクチャ決定コミュニケーションの特徴を列挙しています。 リストに含まれる 2 つの特性はどれですか? (2 つ選択してください。) それぞれの正解は完全な解決策を示します。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Ownership and review cadence for revisiting the decision when conditions or assumptions change.","vi":"Quyền sở hữu và nhịp độ xem xét để xem xét lại quyết định khi các điều kiện hoặc giả định thay đổi.","jp":"状況や前提が変化したときに決定を再考するための所有権とレビューの頻度。"}},{"k":"B","t":{"en":"Distribution to a standing review forum with mandatory attendance from senior engineering leaders.","vi":"Phân phối tới một diễn đàn đánh giá thường trực với sự tham dự bắt buộc của các nhà lãnh đạo kỹ thuật cấp cao.","jp":"シニアエンジニアリングリーダーの必須の出席を伴う常設レビューフォーラムへの配布。"}},{"k":"C","t":{"en":"Omission of rejected alternatives to keep the decision document focused and concise for readers.","vi":"Bỏ qua các lựa chọn thay thế bị từ chối để giữ cho tài liệu quyết định tập trung và ngắn gọn cho người đọc.","jp":"決定文書を読者にとって焦点を絞った簡潔なものにするために、拒否された代替案を省略します。"}},{"k":"D","t":{"en":"Alternatives considered along with the criteria that were used to evaluate each alternative.","vi":"Các phương án thay thế được xem xét cùng với các tiêu chí được sử dụng để đánh giá từng phương án.","jp":"検討された代替案と、各代替案の評価に使用された基準。"}},{"k":"E","t":{"en":"Use of a consistent template across the team to standardize the visual presentation of decisions.","vi":"Sử dụng một mẫu nhất quán trong toàn nhóm để chuẩn hóa việc trình bày các quyết định bằng hình ảnh.","jp":"チーム全体で一貫したテンプレートを使用して、意思決定の視覚的な表示を標準化します。"}}],"answer":["A","D"],"multi":true,"explain":{"key":"<b>Đáp án A, D.</b><br><b>D:</b> Nêu <b>các phương án đã cân nhắc và tiêu chí đánh giá</b> từng phương án cho phép người review kiểm chứng rằng năng lực, chi phí, độ trễ, bảo mật, khả năng bảo trì được đánh giá nhất quán chứ không chọn lọc.<br><b>A:</b> Gán <b>người chịu trách nhiệm và chu kỳ review</b> để xem lại quyết định khi điều kiện hay giả định thay đổi (model mới, quy định mới, khối lượng thay đổi) — đảm bảo trách nhiệm suốt vòng đời quyết định.","elim":["<b>B.</b> Bắt buộc lãnh đạo cấp cao tham dự diễn đàn review là cơ chế phân phối/quy trình họp, không phải đặc điểm của nội dung truyền đạt quyết định tốt.","<b>C.</b> Bỏ qua phương án bị loại làm mất lý do vì sao chọn phương án hiện tại, khiến quyết định khó kiểm chứng và dễ bị tranh luận lại.","<b>E.</b> Template thống nhất chỉ chuẩn hóa hình thức trình bày, không đảm bảo chất lượng lập luận hay trách nhiệm."]}},{"id":"ccarp-q103","n":103,"topic":6,"type":"mcq","stem":{"en":"You are integrating Claude Code into a workflow that runs against a production database. Which guardrail design most directly preserves safety on data-modifying operations?","vi":"Bạn đang tích hợp Mã Claude vào quy trình làm việc chạy trên cơ sở dữ liệu sản xuất. Thiết kế lan can nào trực tiếp bảo vệ sự an toàn trong các hoạt động sửa đổi dữ liệu?","jp":"クロード コードを実稼働データベースに対して実行されるワークフローに統合しています。 データ変更操作の安全を最も直接的に保護するガードレールの設計はどれですか?"},"options":[{"k":"A","t":{"en":"Allow Claude Code to write directly to the production database without subagent scoping, readonly credential defaults, or human confirmation gates on data-modifying operations.","vi":"Cho phép Mã Claude ghi trực tiếp vào cơ sở dữ liệu sản xuất mà không cần xác định phạm vi tác nhân phụ, mặc định thông tin xác thực chỉ đọc hoặc cổng xác nhận của con người đối với các hoạt động sửa đổi dữ liệu.","jp":"Claude Code が、サブエージェントのスコープ設定、読み取り専用資格情報のデフォルト、またはデータ変更操作における人間による確認ゲートを使用せずに、運用データベースに直接書き込むことができるようにします。"}},{"k":"B","t":{"en":"Configure the database MCP server with a fully privileged credential that can perform any read or write operation, and allow all operations to proceed without explicit human confirmation.","vi":"Định cấu hình máy chủ MCP cơ sở dữ liệu với thông tin xác thực đặc quyền đầy đủ có thể thực hiện bất kỳ thao tác đọc hoặc ghi nào và cho phép tất cả các hoạt động được tiến hành mà không cần xác nhận rõ ràng của con người.","jp":"あらゆる読み取りまたは書き込み操作を実行できる完全な特権資格情報を使用してデータベース MCP サーバーを構成し、人間による明示的な確認なしですべての操作を続行できるようにします。"}},{"k":"C","t":{"en":"Disable all logging and auditing on database operations through the MCP server to reduce alert noise, removing the observability needed to detect unintended data modifications.","vi":"Vô hiệu hóa tất cả việc ghi nhật ký và kiểm tra các hoạt động cơ sở dữ liệu thông qua máy chủ MCP để giảm tiếng ồn cảnh báo, loại bỏ khả năng quan sát cần thiết để phát hiện các sửa đổi dữ liệu ngoài ý muốn.","jp":"MCP サーバーを介したデータベース操作のすべてのログ記録と監査を無効にして、アラート ノイズを減らし、意図しないデータ変更を検出するために必要な可観測性を排除します。"}},{"k":"D","t":{"en":"Configure the database MCP server with a read-only credential by default, restrict the subagent's tool list to read-only operations, and require explicit human confirmation on any operation that would modify data.","vi":"Định cấu hình máy chủ MCP cơ sở dữ liệu với thông tin xác thực chỉ đọc theo mặc định, hạn chế danh sách công cụ của tác nhân phụ ở các hoạt động chỉ đọc và yêu cầu xác nhận rõ ràng của con người đối với bất kỳ hoạt động nào có thể sửa đổi dữ liệu.","jp":"データベース MCP サーバーをデフォルトで読み取り専用資格情報で構成し、サブエージェントのツール リストを読み取り専用操作に制限し、データを変更する操作については明示的な人間による確認を要求します。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Phương án áp dụng <b>phòng thủ nhiều lớp</b>: (1) <b>credential read-only mặc định</b> tạo ranh giới phân quyền nằm ngoài model — chỉ dẫn trong prompt không thể biến nó thành quyền ghi; (2) <b>giới hạn tool list của subagent</b> ở thao tác đọc, giảm năng lực bị lộ; (3) <b>xác nhận tường minh của con người</b> trước mọi thao tác sửa dữ liệu tạo cổng phê duyệt có chủ đích. Nếu Claude hiểu sai yêu cầu hoặc bị tiêm chỉ dẫn độc hại, các lớp này vẫn chặn được thay đổi ngoài ý muốn trên production.","elim":["<b>A.</b> Cho ghi thẳng vào production không có scoping, credential read-only hay cổng xác nhận là loại bỏ mọi guardrail.","<b>B.</b> Credential toàn quyền và không cần xác nhận khiến một lỗi hiểu sai hay prompt injection có thể sửa/xóa dữ liệu production.","<b>C.</b> Tắt logging và audit xóa khả năng phát hiện thay đổi ngoài ý muốn — đi ngược mục tiêu an toàn."]},"cite":"Hướng dẫn ôn tập — §3.5 Hooks trong Agent SDK; Lĩnh vực 2.3"},{"id":"ccarp-q104","n":104,"topic":6,"type":"mcq","stem":{"en":"You are building an evaluation pipeline for a Claude-based deployment and must complete the specification steps before running the deployment against the dataset. Which two steps must be completed BEFORE running the deployment against the evaluation dataset? (Select two.) Each correct answer presents part of the solution.  [Chọn 2 đáp án]","vi":"Bạn đang xây dựng quy trình đánh giá cho hoạt động triển khai dựa trên Claude và phải hoàn thành các bước đặc tả trước khi triển khai dựa trên tập dữ liệu. Hai bước nào phải được hoàn thành TRƯỚC KHI triển khai dựa trên tập dữ liệu đánh giá? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một phần của giải pháp.  [Chọn 2 đáp án]","jp":"クロードベースのデプロイメント用の評価パイプラインを構築しているため、データセットに対してデプロイメントを実行する前に仕様手順を完了する必要があります。 評価データセットに対してデプロイメントを実行する前に完了する必要がある 2 つの手順はどれですか? (2 つ選択してください。) それぞれの正解は、解決策の一部を示しています。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Publish the aggregated metrics to a dashboard and gate releases on threshold checks.","vi":"Xuất bản các số liệu tổng hợp lên trang tổng quan và các bản phát hành cổng khi kiểm tra ngưỡng.","jp":"集約されたメトリクスをダッシュ​​ボードに公開し、しきい値チェックでリリースをゲートします。"}},{"k":"B","t":{"en":"Curate and label the evaluation dataset to match the defined slices.","vi":"Sắp xếp và gắn nhãn cho tập dữ liệu đánh giá để khớp với các phần được xác định.","jp":"定義されたスライスと一致するように評価データセットをキュレートし、ラベルを付けます。"}},{"k":"C","t":{"en":"Review failure cases with subject matter experts to refine the scoring rubric.","vi":"Cùng các chuyên gia về chủ đề xem xét các trường hợp thất bại để tinh chỉnh thang đánh giá cho điểm.","jp":"対象分野の専門家と失敗事例をレビューして、スコアリングのルーブリックを改良します。"}},{"k":"D","t":{"en":"Define the metrics and slices the framework will report across representative, edge, and adversarial cases.","vi":"Xác định các số liệu và phân chia khung sẽ báo cáo theo các trường hợp đại diện, cạnh và đối nghịch.","jp":"フレームワークが代表的なケース、エッジケース、敵対的なケースにわたってレポートするメトリクスとスライスを定義します。"}},{"k":"E","t":{"en":"Score the deployment outputs against the reference labels and aggregate the metrics.","vi":"Đánh giá kết quả triển khai dựa trên nhãn tham chiếu và tổng hợp các số liệu.","jp":"参照ラベルに対してデプロイメント出力をスコアリングし、メトリクスを集計します。"}}],"answer":["B","D"],"multi":true,"explain":{"key":"<b>Đáp án B, D.</b> Đặc tả đánh giá phải tồn tại trước khi chạy inference.<br><b>D:</b> Định nghĩa <b>metric và slice</b> sẽ báo cáo trên các ca <b>đại diện, biên và đối kháng</b> — xác định đánh giá đo cái gì và phân tách kết quả thế nào.<br><b>B:</b> <b>Tuyển chọn và gán nhãn dataset</b> khớp với các slice đó. Nhãn, kết quả kỳ vọng và phiên bản dataset phải cố định trước khi deployment sinh output; nếu không, người đánh giá có nguy cơ chỉnh tiêu chí sau khi đã thấy kết quả.","elim":["<b>A.</b> Đăng metric tổng hợp lên dashboard và gate release cần có kết quả chấm điểm, nên chỉ làm được sau khi chạy đánh giá.","<b>C.</b> Review các ca lỗi với chuyên gia để tinh chỉnh rubric cần có ca lỗi từ lần chạy, tức diễn ra sau.","<b>E.</b> Chấm output so với nhãn tham chiếu và tổng hợp metric chính là bước chạy đánh giá, không thể làm trước khi chạy."]}},{"id":"ccarp-q105","n":105,"topic":6,"type":"mcq","stem":{"en":"You are identifying signals that a deployment should re-enter design rather than continue iterating in place. Which signal most directly indicates the need for a new design cycle?","vi":"Bạn đang xác định các tín hiệu cho thấy quá trình triển khai nên thực hiện lại thiết kế thay vì tiếp tục lặp lại tại chỗ. Tín hiệu nào trực tiếp nhất cho thấy sự cần thiết của một chu trình thiết kế mới?","jp":"デプロイメントをその場で反復し続けるのではなく、設計に再導入する必要があるというシグナルを特定しています。 新しい設計サイクルの必要性を最も直接的に示す信号はどれですか?"},"options":[{"k":"A","t":{"en":"A runbook step requires a clarification edit to improve on-call guidance accuracy, which can be handled as a documentation update without changes to component responsibilities or core contracts.","vi":"Một bước trong sổ tay yêu cầu chỉnh sửa làm rõ để cải thiện độ chính xác của hướng dẫn theo yêu cầu, có thể được xử lý dưới dạng cập nhật tài liệu mà không thay đổi trách nhiệm thành phần hoặc hợp đồng cốt lõi.","jp":"ランブックのステップでは、オンコール ガイダンスの精度を向上させるために明確化編集が必要ですが、コンポーネントの責任やコア契約を変更することなく、ドキュメントの更新として処理できます。"}},{"k":"B","t":{"en":"A dashboard alert threshold needs a small numerical adjustment to reduce false-positive noise, which can be handled as an operational configuration change without a new design cycle.","vi":"Ngưỡng cảnh báo trên bảng điều khiển cần được điều chỉnh bằng số nhỏ để giảm tiếng ồn dương tính giả. Điều này có thể được xử lý dưới dạng thay đổi cấu hình vận hành mà không cần chu trình thiết kế mới.","jp":"ダッシュボードのアラートしきい値には、誤検知ノイズを減らすために小さな数値調整が必要ですが、これは新しい設計サイクルを必要とせずに運用構成の変更として処理できます。"}},{"k":"C","t":{"en":"A minor copy edit is requested in a customer-facing string within the existing UI, which can be handled as a localized content change without altering component responsibilities or contracts.","vi":"Một chỉnh sửa bản sao nhỏ được yêu cầu trong chuỗi hướng tới khách hàng trong giao diện người dùng hiện có. Việc chỉnh sửa này có thể được xử lý dưới dạng thay đổi nội dung đã bản địa hóa mà không làm thay đổi trách nhiệm hoặc hợp đồng của thành phần.","jp":"既存の UI 内の顧客向けの文字列でマイナーなコピー編集が要求されます。これは、コンポーネントの責任や契約を変更することなく、ローカライズされたコンテンツの変更として処理できます。"}},{"k":"D","t":{"en":"The system's current architecture cannot meet the new requirements without changes to component responsibilities or core contracts.","vi":"Kiến trúc hiện tại của hệ thống không thể đáp ứng các yêu cầu mới nếu không có những thay đổi về trách nhiệm thành phần hoặc hợp đồng cốt lõi.","jp":"システムの現在のアーキテクチャは、コンポーネントの責任やコア契約を変更しない限り、新しい要件を満たすことはできません。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Tín hiệu cần chu kỳ thiết kế mới là khi thay đổi <b>vượt qua ranh giới kiến trúc</b>: kiến trúc hiện tại không thể đáp ứng yêu cầu mới nếu không <b>đổi trách nhiệm thành phần</b> hoặc <b>contract cốt lõi</b>. Điều này ảnh hưởng ownership, điều phối, luồng dữ liệu, interface, ranh giới bảo mật và cách đánh giá, nên cần discovery, phân tích tác động, review thiết kế, phê duyệt và kế hoạch regression mới thay vì lặp tại chỗ.","elim":["<b>A.</b> Làm rõ một bước runbook là cập nhật tài liệu cục bộ, chính phương án nói rõ không đổi trách nhiệm thành phần hay contract.","<b>B.</b> Chỉnh ngưỡng cảnh báo để giảm nhiễu là thay đổi cấu hình vận hành, xử lý trong vòng lặp hiện tại.","<b>C.</b> Sửa câu chữ hiển thị cho khách hàng là thay đổi nội dung nhỏ, không chạm tới kiến trúc."]}},{"id":"ccarp-q106","n":106,"topic":6,"type":"mcq","stem":{"en":"You are rolling out a standardized Claude Code configuration to an engineering team and must complete the planning steps before piloting the configuration. Which two steps must be completed BEFORE piloting the configuration with a small group of engineers? (Select two.) Each correct answer presents part of the solution.  [Chọn 2 đáp án]","vi":"Bạn đang triển khai cấu hình Mã Claude được tiêu chuẩn hóa cho nhóm kỹ thuật và phải hoàn thành các bước lập kế hoạch trước khi thử nghiệm cấu hình. Hai bước nào phải được hoàn thành TRƯỚC KHI thí điểm cấu hình với một nhóm nhỏ kỹ sư? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một phần của giải pháp.  [Chọn 2 đáp án]","jp":"標準化されたクロード コード構成をエンジニアリング チームに展開しようとしているため、構成を試験運用する前に計画手順を完了する必要があります。 少人数のエンジニア グループで構成を試験運用する前に、完了する必要がある 2 つの手順はどれですか? (2 つ選択してください。) それぞれの正解は、解決策の一部を示しています。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Define the project-scope baseline covering Model Context Protocol (MCP) servers, permission rules, and subagents.","vi":"Xác định đường cơ sở của phạm vi dự án bao gồm các máy chủ Giao thức bối cảnh mô hình (MCP), quy tắc cấp phép và tác nhân phụ.","jp":"モデル コンテキスト プロトコル (MCP) サーバー、権限ルール、およびサブエージェントを対象とするプロジェクト スコープのベースラインを定義します。"}},{"k":"B","t":{"en":"Onboard every engineer in the organization to the new configuration through mandatory training sessions.","vi":"Đưa mọi kỹ sư trong tổ chức vào cấu hình mới thông qua các buổi đào tạo bắt buộc.","jp":"必須のトレーニング セッションを通じて、組織内のすべてのエンジニアを新しい構成に慣れさせます。"}},{"k":"C","t":{"en":"Roll out the stabilized configuration to additional teams with documentation and a defined support channel.","vi":"Triển khai cấu hình ổn định cho các nhóm bổ sung kèm theo tài liệu và kênh hỗ trợ được xác định.","jp":"ドキュメントと定義されたサポート チャネルを使用して、安定した構成を追加のチームに展開します。"}},{"k":"D","t":{"en":"Identify the team workflows, security boundaries, and which decisions belong to managed configuration versus project scope.","vi":"Xác định quy trình làm việc của nhóm, ranh giới bảo mật và quyết định nào thuộc về cấu hình được quản lý so với phạm vi dự án.","jp":"チームのワークフロー、セキュリティ境界、および管理対象の構成とプロジェクトの範囲に属する決定を特定します。"}},{"k":"E","t":{"en":"Iterate the configuration based on the pilot findings and stabilize the baseline before broader rollout.","vi":"Lặp lại cấu hình dựa trên những phát hiện thí điểm và ổn định đường cơ sở trước khi triển khai rộng hơn.","jp":"パイロットの結果に基づいて構成を繰り返し、より広範囲に展開する前にベースラインを安定させます。"}}],"answer":["A","D"],"multi":true,"explain":{"key":"<b>Đáp án A, D.</b><br><b>D:</b> Trước pilot phải hiểu <b>workflow của nhóm</b>, <b>ranh giới bảo mật</b> và <b>quyết định nào thuộc managed configuration</b> (kiểm soát toàn tổ chức, không thể ghi đè) so với <b>project scope</b> (MCP server, permission, subagent theo repo).<br><b>A:</b> Từ các quyết định đó, xây <b>baseline project scope</b> ban đầu — MCP server được phê duyệt, permission rule tối thiểu, subagent — để nhóm pilot sử dụng và đánh giá.","elim":["<b>B.</b> Đào tạo bắt buộc toàn bộ kỹ sư trong tổ chức là bước rollout rộng, không phải chuẩn bị cho pilot nhóm nhỏ.","<b>C.</b> Mở rộng cấu hình đã ổn định sang các nhóm khác là bước sau pilot và sau khi đã ổn định baseline.","<b>E.</b> Lặp lại dựa trên kết quả pilot chỉ có thể diễn ra sau khi pilot đã chạy."]},"cite":"Hướng dẫn ôn tập — §4.3 Cấu hình MCP Server; Lĩnh vực 3.1"},{"id":"ccarp-q107","n":107,"topic":6,"type":"mcq","stem":{"en":"A healthcare organization is evaluating two Claude-powered AI architectures for a clinical documentation assistant. Architecture X produces higher output quality scores but costs $0.18 per documentation session and averages 4.2 seconds per response. Architecture Y scores slightly lower on quality metrics but costs $0.09 per session and averages 2.1 seconds per response. The stated SLA requires responses under 3 seconds, and the annual volume is projected at 2 million documentation sessions. Which evaluation approach correctly applies business value pillar analysis to this decision?","vi":"Một tổ chức chăm sóc sức khỏe đang đánh giá hai kiến ​​trúc AI do Claude cung cấp cho vai trò trợ lý tài liệu lâm sàng. Kiến trúc X tạo ra điểm chất lượng đầu ra cao hơn nhưng có giá 0,18 USD cho mỗi phiên tài liệu và trung bình 4,2 giây cho mỗi phản hồi. Kiến trúc Y đạt điểm thấp hơn một chút về số liệu chất lượng nhưng có giá 0,09 USD mỗi phiên và trung bình 2,1 giây cho mỗi phản hồi. SLA đã nêu yêu cầu phản hồi dưới 3 giây và khối lượng hàng năm dự kiến ​​là 2 triệu phiên tài liệu. Phương pháp đánh giá nào áp dụng chính xác phân tích trụ cột giá trị kinh doanh cho quyết định này?","jp":"ある医療機関は、臨床文書作成アシスタント用に、Claude を利用した 2 つの AI アーキテクチャを評価しています。アーキテクチャ X はより高い出力品質スコアを生成しますが、ドキュメント セッションごとに 0.18 ドルのコストがかかり、応答ごとに平均 4.2 秒かかります。アーキテクチャ Y の品質メトリクスのスコアはわずかに低くなりますが、セッションあたりのコストは 0.09 ドルで、応答あたりの平均時間は 2.1 秒です。規定されている SLA では 3 秒以内の応答が必要で、年間量は 200 万回の文書化セッションと予測されています。 ビジネス価値柱分析をこの決定に正しく適用する評価アプローチはどれですか?"},"options":[{"k":"A","t":{"en":"Select Architecture Y based solely on the 50% cost reduction, since solution cost is the most important value pillar in healthcare budget-constrained environments.","vi":"Chọn Kiến trúc Y chỉ dựa trên việc giảm 50% chi phí, vì chi phí giải pháp là trụ cột giá trị quan trọng nhất trong môi trường có ngân sách chăm sóc sức khỏe hạn chế.","jp":"医療予算に制約のある環境ではソリューションのコストが最も重要な価値の柱であるため、50% のコスト削減のみに基づいてアーキテクチャ Y を選択します。"}},{"k":"B","t":{"en":"Select Architecture X because the higher quality scores justify the cost premium, and any SLA gap can be addressed through infrastructure optimization after deployment.","vi":"Chọn Kiến trúc X vì điểm chất lượng cao hơn sẽ bù đắp cho chi phí cao hơn và mọi khoảng cách SLA đều có thể được giải quyết thông qua tối ưu hóa cơ sở hạ tầng sau khi triển khai.","jp":"アーキテクチャ X を選択します。これは、品質スコアが高いほどコスト割増が正当化され、SLA ギャップは展開後のインフラストラクチャの最適化によって対処できるためです。"}},{"k":"C","t":{"en":"Eliminate Architecture X on SLA grounds, then evaluate Architecture Y against the efficiency and solution cost pillars by calculating annual cost difference and assessing whether the quality delta materially impacts clinical workflow productivity.","vi":"Loại bỏ Kiến trúc X trên cơ sở SLA, sau đó đánh giá Kiến trúc Y dựa trên các trụ cột chi phí và hiệu quả của giải pháp bằng cách tính toán chênh lệch chi phí hàng năm và đánh giá xem liệu đồng bằng chất lượng có ảnh hưởng trọng yếu đến năng suất quy trình làm việc lâm sàng hay không.","jp":"SLA に基づいてアーキテクチャ X を削除し、年間コスト差を計算し、品質の差分が臨床ワークフローの生産性に重大な影響を与えるかどうかを評価することで、効率とソリューションのコストの柱に照らしてアーキテクチャ Y を評価します。"}},{"k":"D","t":{"en":"Recommend a hybrid approach using Architecture X for complex cases and Architecture Y for routine cases, without additional analysis, since this preserves quality where it matters most.","vi":"Đề xuất cách tiếp cận kết hợp sử dụng Kiến trúc X cho các trường hợp phức tạp và Kiến trúc Y cho các trường hợp thông thường mà không cần phân tích bổ sung vì điều này giúp duy trì chất lượng ở những nơi quan trọng nhất.","jp":"複雑なケースにはアーキテクチャ X を使用し、日常的なケースにはアーキテクチャ Y を使用し、追加の分析を行わずにハイブリッド アプローチを推奨します。これにより、最も重要な品質が維持されます。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> SLA yêu cầu phản hồi &lt; 3 giây là <b>cổng bắt buộc</b>: Architecture X trung bình 4,2 giây nên <b>bị loại</b> trừ khi được thiết kế lại và kiểm thử lại — hứa tối ưu sau deploy không phải bằng chứng tuân thủ. Architecture Y (2,1 giây) đạt SLA; sau đó đánh giá theo trụ <b>solution cost</b> (2 triệu phiên × 0,09 USD = 180.000 USD/năm so với 360.000 USD của X, chênh 180.000 USD) và trụ <b>efficiency</b> — liệu chênh lệch chất lượng có ảnh hưởng thực chất đến năng suất workflow lâm sàng (ví dụ thời gian sửa của bác sĩ) hay không.","elim":["<b>A.</b> Chọn chỉ vì giảm 50% chi phí bỏ qua việc kiểm tra SLA và tác động chất lượng lên workflow lâm sàng; không có trụ nào mặc nhiên quan trọng nhất.","<b>B.</b> Chọn X dù vi phạm SLA đã nêu, dựa trên lời hứa tối ưu sau deploy chưa được chứng minh.","<b>D.</b> Hybrid không phân tích vẫn để X xử lý ca phức tạp với độ trễ vượt SLA, và thiếu phân tích chi phí/định tuyến để chứng minh lợi ích."]}},{"id":"ccarp-q108","n":108,"topic":6,"type":"mcq","stem":{"en":"You are a solution architect designing a Claude-based assistant with access to 60 internal tools across multiple business domains. Loading every tool definition on every request increases token usage and time to first response. Which design pattern best addresses this issue without sacrificing capability breadth?","vi":"Bạn là kiến ​​trúc sư giải pháp đang thiết kế một trợ lý dựa trên Claude với quyền truy cập vào 60 công cụ nội bộ trên nhiều lĩnh vực kinh doanh. Tải mọi định nghĩa công cụ cho mỗi yêu cầu sẽ tăng mức sử dụng mã thông báo và thời gian cho phản hồi đầu tiên. Mẫu thiết kế nào giải quyết tốt nhất vấn đề này mà không phải hy sinh khả năng mở rộng?","jp":"あなたは、複数のビジネス ドメインにわたる 60 の内部ツールにアクセスできるクロード ベースのアシスタントを設計するソリューション アーキテクトです。すべてのリクエストですべてのツール定義をロードすると、トークンの使用量が増加し、最初の応答までの時間が増加します。 幅広い機能を犠牲にすることなく、この問題に最もよく対処できる設計パターンはどれでしょうか?"},"options":[{"k":"A","t":{"en":"Apply progressive tool discovery so a curated initial subset is exposed and additional tools are loaded on demand based on the task.","vi":"Áp dụng khám phá công cụ lũy tiến để hiển thị tập hợp con ban đầu được quản lý và các công cụ bổ sung được tải theo yêu cầu dựa trên tác vụ.","jp":"プログレッシブ ツール ディスカバリを適用すると、厳選された初期サブセットが公開され、タスクに基づいて追加のツールがオンデマンドで読み込まれます。"}},{"k":"B","t":{"en":"Use a separate model call to summarize all 60 tool definitions before each user turn.","vi":"Sử dụng lệnh gọi mô hình riêng để tóm tắt tất cả 60 định nghĩa công cụ trước mỗi lượt người dùng.","jp":"各ユーザーが順番を変える前に、別のモデル呼び出しを使用して 60 個のツール定義すべてを要約します。"}},{"k":"C","t":{"en":"Increase the maximum context length and load all 60 tool definitions on every request, accepting the higher token cost and latency as necessary for full capability.","vi":"Tăng độ dài ngữ cảnh tối đa và tải tất cả 60 định nghĩa công cụ theo mọi yêu cầu, chấp nhận chi phí mã thông báo và độ trễ cao hơn nếu cần để có được toàn bộ khả năng.","jp":"最大コンテキスト長を増やし、すべてのリクエストで 60 個のツール定義をすべてロードし、完全な機能を実現するために必要なトークン コストとレイテンシの増加を受け入れます。"}},{"k":"D","t":{"en":"Hard-code a fixed set of five tools per request to reduce token usage, regardless of whether those tools are relevant to the current task.","vi":"Mã hóa cứng một bộ năm công cụ cố định cho mỗi yêu cầu để giảm mức sử dụng mã thông báo, bất kể những công cụ đó có liên quan đến nhiệm vụ hiện tại hay không.","jp":"それらのツールが現在のタスクに関連しているかどうかに関係なく、リクエストごとに 5 つのツールの固定セットをハードコーディングして、トークンの使用量を削減します。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> <b>Progressive tool discovery</b> chỉ đưa vào context một <b>tập tool tuyển chọn</b> cùng cơ chế tìm kiếm; khi tác vụ cần, Claude tìm trong danh mục và <b>nạp định nghĩa tool liên quan theo nhu cầu</b> (Tool Search của Anthropic dùng deferred loading). Nhờ đó vẫn giữ đủ 60 tool về năng lực, nhưng giảm token, giảm thời gian phản hồi đầu tiên và tăng độ chính xác chọn tool trong danh mục lớn.","elim":["<b>B.</b> Gọi thêm model tóm tắt định nghĩa tool mỗi lượt tăng chi phí và độ trễ, đồng thời làm mất chi tiết schema cần để gọi tool đúng.","<b>C.</b> Nạp toàn bộ 60 tool mỗi request chính là nguồn gốc vấn đề; context lớn hơn không giảm token hay độ trễ.","<b>D.</b> Cố định 5 tool bất kể liên quan hy sinh độ rộng năng lực, tool cần thiết có thể vắng mặt."]},"cite":"Hướng dẫn ôn tập — Lĩnh vực 2.3 Phân bổ Tool Giữa các Agent và Cấu hình tool_choice"},{"id":"ccarp-q109","n":109,"topic":6,"type":"mcq","stem":{"en":"You are listing characteristics of robust guardrail design for an enterprise deployment. Which two characteristics belong on the list? (Select two.) Each correct answer presents a complete solution.  [Chọn 2 đáp án]","vi":"Bạn đang liệt kê các đặc điểm của thiết kế lan can chắc chắn để triển khai cho doanh nghiệp. Hai đặc điểm nào thuộc về danh sách? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một giải pháp hoàn chỉnh.  [Chọn 2 đáp án]","jp":"あなたは、エンタープライズ展開向けの堅牢なガードレール設計の特徴を列挙しています。 リストに含まれる 2 つの特性はどれですか? (2 つ選択してください。) それぞれの正解は完全な解決策を示します。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Centralized log retention for guardrail violations with quarterly review by the security team.","vi":"Lưu giữ nhật ký tập trung đối với các hành vi vi phạm lan can được đội ngũ an ninh xem xét hàng quý.","jp":"セキュリティ チームによる四半期ごとのレビューにより、ガードレール違反のログを一元的に保持します。"}},{"k":"B","t":{"en":"Periodic refresh of the system prompt wording to keep refusal language current and clear.","vi":"Làm mới định kỳ lời nhắc của hệ thống để giữ cho ngôn ngữ từ chối luôn cập nhật và rõ ràng.","jp":"システム プロンプトの文言を定期的に更新して、拒否の文言を最新かつ明確に保ちます。"}},{"k":"C","t":{"en":"User feedback channels that route reported guardrail failures into the product backlog for triage.","vi":"Các kênh phản hồi của người dùng định tuyến đã báo cáo lỗi lan can vào phần tồn đọng của sản phẩm để phân loại.","jp":"報告されたガードレールの障害をトリアージのために製品バックログにルーティングするユーザー フィードバック チャネル。"}},{"k":"D","t":{"en":"Per-role tool allow-lists enforced at the orchestration layer before any tool call executes.","vi":"Danh sách cho phép công cụ theo vai trò được thực thi ở lớp điều phối trước khi thực thi bất kỳ lệnh gọi công cụ nào.","jp":"ロールごとのツール許可リストは、ツール呼び出しが実行される前にオーケストレーション層で適用されます。"}},{"k":"E","t":{"en":"Adversarial-input coverage in the evaluation set with regression tracking on guardrail performance.","vi":"Phạm vi đầu vào đối nghịch trong bộ đánh giá với tính năng theo dõi hồi quy về hiệu suất của lan can.","jp":"評価セット内の敵対的入力カバレッジと、ガードレールのパフォーマンスの回帰追跡。"}}],"answer":["D","E"],"multi":true,"explain":{"key":"<b>Đáp án D, E.</b><br><b>D:</b> <b>Allow-list tool theo vai trò được thực thi ở tầng orchestration</b> trước khi tool call chạy là kiểm soát <b>xác định, nằm ngoài model</b> — không phụ thuộc vào việc model có tuân thủ chỉ dẫn, nên chặn được cả khi prompt injection hay suy luận sai.<br><b>E:</b> <b>Bao phủ đầu vào đối kháng</b> trong bộ đánh giá kèm <b>theo dõi regression</b> cho phép đo hiệu quả guardrail một cách liên tục và phát hiện suy giảm khi đổi prompt hoặc model.","elim":["<b>A.</b> Lưu log vi phạm tập trung với review hàng quý là phát hiện muộn sau sự việc, không ngăn được vi phạm và chu kỳ quá thưa.","<b>B.</b> Làm mới câu chữ system prompt chỉ là guardrail mềm dựa trên chỉ dẫn, không phải cơ chế thực thi hay đo lường vững chắc.","<b>C.</b> Kênh phản hồi người dùng đưa lỗi vào backlog là phản ứng thụ động, phụ thuộc vào việc người dùng phát hiện và báo cáo."]},"cite":"Hướng dẫn ôn tập — Lĩnh vực 2.3 Phân bổ Tool Giữa các Agent và Cấu hình tool_choice; §3.5 Hooks trong Agent SDK"},{"id":"ccarp-q110","n":110,"topic":6,"type":"mcq","stem":{"en":"You are explaining the precedence of Claude Code configuration scopes to the team. Which precedence ordering, from highest to lowest, is correct?","vi":"Bạn đang giải thích mức độ ưu tiên của phạm vi cấu hình Mã Claude cho nhóm. Thứ tự ưu tiên nào từ cao nhất đến thấp nhất là đúng?","jp":"あなたは、クロード コードの構成スコープの優先順位をチームに説明しています。 最も高いものから最も低いものまで、どの優先順位が正しいでしょうか?"},"options":[{"k":"A","t":{"en":"Local &gt; managed &gt; user &gt; command-line arguments &gt; project","vi":"Cục bộ&gt; được quản lý&gt; người dùng&gt; đối số dòng lệnh&gt; dự án","jp":"ローカル &gt; 管理対象 &gt; ユーザー &gt; コマンドライン引数 &gt; プロジェクト"}},{"k":"B","t":{"en":"Project &gt; user &gt; managed &gt; local &gt; command-line arguments","vi":"Dự án&gt; người dùng&gt; được quản lý&gt; cục bộ&gt; đối số dòng lệnh","jp":"プロジェクト &gt; ユーザー &gt; 管理対象 &gt; ローカル &gt; コマンドライン引数"}},{"k":"C","t":{"en":"Managed &gt; command-line arguments &gt; local &gt; project &gt; user","vi":"Được quản lý &gt; đối số dòng lệnh &gt; cục bộ &gt; dự án &gt; người dùng","jp":"「管理対象」&gt;「コマンドライン引数」&gt;「ローカル」&gt;「プロジェクト」&gt;「ユーザー」"}},{"k":"D","t":{"en":"User &gt; project &gt; local &gt; command-line arguments &gt; managed","vi":"Người dùng &gt; dự án &gt; cục bộ &gt; đối số dòng lệnh &gt; được quản lý","jp":"ユーザー &gt; プロジェクト &gt; ローカル &gt; コマンドライン引数 &gt; 管理対象"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Thứ tự ưu tiên từ cao đến thấp của Claude Code là <b>managed &gt; command-line arguments &gt; local &gt; project &gt; user</b>. <b>Managed</b> cao nhất vì chứa kiểm soát tổ chức/tuân thủ mà kỹ sư không được ghi đè; <b>tham số dòng lệnh</b> là ghi đè tạm thời cho một session; <b>local</b> (<code>.claude/settings.local.json</code>) là cấu hình cá nhân trong một repo nên ưu tiên hơn <b>project</b> (<code>.claude/settings.json</code>) dùng chung; <b>user</b> (<code>~/.claude/settings.json</code>) áp dụng rộng nhất cho mọi project nên thấp nhất.","elim":["<b>A.</b> Đặt local trên managed sẽ cho phép kỹ sư ghi đè chính sách tổ chức; tham số dòng lệnh cũng không nằm dưới user.","<b>B.</b> Đặt managed ở giữa và tham số dòng lệnh thấp nhất là sai; project cũng không vượt local và user.","<b>D.</b> Đảo ngược hoàn toàn: managed phải cao nhất chứ không phải thấp nhất, và user là scope thấp nhất."]},"cite":"Hướng dẫn ôn tập — §5.1 Phân cấp CLAUDE.md; Lĩnh vực 3.1"},{"id":"ccarp-q111","n":111,"topic":6,"type":"mcq","stem":{"en":"A Claude architect is leading the discovery phase for a new AI-powered customer service solution. Which two activities are characteristic of structured discovery and requirement gathering for a Claude-based deployment? (Select two.)  [Chọn 2 đáp án]","vi":"Kiến trúc sư Claude đang dẫn đầu giai đoạn khám phá giải pháp dịch vụ khách hàng mới được hỗ trợ bởi AI. Hai hoạt động nào đặc trưng cho việc khám phá có cấu trúc và thu thập yêu cầu để triển khai dựa trên Claude? (Chọn 2.) [Chọn 2 đáp án]","jp":"クロード アーキテクトは、AI を活用した新しい顧客サービス ソリューションの探索フェーズを主導しています。 クロードベースの導入における構造化された検出と要件収集の特徴となる 2 つのアクティビティはどれですか? (2 つ選択してください。) [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Facilitating stakeholder workshops to surface latency, accuracy, and compliance constraints before scoping begins.","vi":"Tạo điều kiện cho các bên liên quan hội thảo để tìm hiểu các hạn chế về độ trễ, độ chính xác và tuân thủ trước khi bắt đầu xác định phạm vi.","jp":"スコーピングを開始する前に、関係者のワークショップを促進して、レイテンシー、精度、コンプライアンスの制約を明らかにします。"}},{"k":"B","t":{"en":"Selecting the Claude model tier based on the architect's prior project experience before stakeholder input is collected.","vi":"Chọn tầng mô hình Claude dựa trên kinh nghiệm dự án trước đây của kiến ​​trúc sư trước khi thu thập ý kiến ​​đóng góp của các bên liên quan.","jp":"関係者の意見が収集される前に、アーキテクトの以前のプロジェクト経験に基づいてクロード モデル層を選択します。"}},{"k":"C","t":{"en":"Generating an initial prototype and iterating based on user reaction rather than written requirements.","vi":"Tạo nguyên mẫu ban đầu và lặp lại dựa trên phản ứng của người dùng thay vì yêu cầu bằng văn bản.","jp":"初期プロトタイプを生成し、書かれた要件ではなくユーザーの反応に基づいて反復します。"}},{"k":"D","t":{"en":"Documenting explicit success criteria and failure thresholds that will gate production deployment.","vi":"Ghi lại các tiêu chí thành công và ngưỡng thất bại rõ ràng sẽ giúp ích cho việc triển khai sản xuất.","jp":"実稼働環境のデプロイメントを制御する明示的な成功基準と失敗しきい値を文書化します。"}},{"k":"E","t":{"en":"Deferring constraint documentation until the integration design phase to avoid scope creep.","vi":"Trì hoãn tài liệu ràng buộc cho đến giai đoạn thiết kế tích hợp để tránh leo thang phạm vi.","jp":"スコープのクリープを避けるために、統合設計フェーズまで制約の文書化を延期します。"}}],"answer":["A","D"],"multi":true,"explain":{"key":"<b>Đáp án A, D.</b><br><b>A:</b> Discovery có cấu trúc bắt đầu bằng <b>workshop với các bên liên quan</b> (chủ sở hữu kết quả kinh doanh, người vận hành, quản lý rủi ro, người dùng) để làm lộ các ràng buộc về <b>độ trễ, độ chính xác, tuân thủ</b> trước khi xác định phạm vi.<br><b>D:</b> Chuyển các kỳ vọng đó thành <b>tiêu chí thành công và ngưỡng thất bại tường minh</b>, đo được bằng thực nghiệm, làm <b>cổng quyết định</b> cho triển khai production.","elim":["<b>B.</b> Chọn model theo kinh nghiệm cá nhân trước khi có ý kiến bên liên quan là quyết định giải pháp khi chưa có yêu cầu.","<b>C.</b> Prototype rồi lặp theo phản ứng thay cho yêu cầu viết thành văn bỏ qua việc ghi nhận ràng buộc và tiêu chí thành công — không phải discovery có cấu trúc.","<b>E.</b> Hoãn tài liệu hóa ràng buộc đến giai đoạn thiết kế tích hợp khiến ràng buộc tuân thủ/độ trễ bị phát hiện muộn, gây làm lại."]}},{"id":"ccarp-q112","n":112,"topic":6,"type":"mcq","stem":{"en":"You are classifying token-management tactics by where each tactic applies in the request lifecycle: \"Input Preparation,\" \"Prompt Construction,\" or \"Output Handling.\"","vi":"Bạn đang phân loại các chiến thuật quản lý mã thông báo theo vị trí áp dụng từng chiến thuật trong vòng đời yêu cầu: \"Chuẩn bị đầu vào\", \"Xây dựng nhanh chóng\" hoặc \"Xử lý đầu ra\".","jp":"トークン管理戦術を、各戦術がリクエスト ライフサイクルのどこに適用されるか (「入力の準備」、「即時構築」、または「出力処理」) によって分類しています。"},"options":[{"k":"A","t":{"en":"Prompt Construction · Output Handling · Input Preparation · Prompt Construction · Input Preparation · Output Handling","vi":"Xây dựng nhanh chóng · Xử lý đầu ra · Chuẩn bị đầu vào · Xây dựng nhanh chóng · Chuẩn bị đầu vào · Xử lý đầu ra","jp":"即時構築 · 出力処理 · 入力準備 · 即時構築 · 入力準備 · 出力処理"}},{"k":"B","t":{"en":"Output Handling · Prompt Construction · Input Preparation · Output Handling · Prompt Construction · Input Preparation","vi":"Xử lý đầu ra · Xây dựng nhanh chóng · Chuẩn bị đầu vào · Xử lý đầu ra · Xây dựng nhanh chóng · Chuẩn bị đầu vào","jp":"出力処理 · 即時構築 · 入力準備 · 出力処理 · 即時構築 · 入力準備"}},{"k":"C","t":{"en":"Input Preparation · Input Preparation · Prompt Construction · Output Handling · Prompt Construction · Output Handling","vi":"Chuẩn bị đầu vào · Chuẩn bị đầu vào · Xây dựng nhanh chóng · Xử lý đầu ra · Xây dựng nhanh chóng · Xử lý đầu ra","jp":"入力の準備 · 入力の準備 · 迅速な構築 · 出力の処理 · 迅速な構築 · 出力の処理"}},{"k":"D","t":{"en":"Output Handling · Input Preparation · Prompt Construction · Output Handling · Prompt Construction · Input Preparation","vi":"Xử lý đầu ra · Chuẩn bị đầu vào · Xây dựng nhanh chóng · Xử lý đầu ra · Xây dựng nhanh chóng · Chuẩn bị đầu vào","jp":"出力処理 · 入力準備 · 迅速な構築 · 出力処理 · 迅速な構築 · 入力準備"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Theo thứ tự các chiến thuật (theo giải thích gốc): (1) lưu output đã kiểm tra cho downstream và audit → <b>Output Handling</b>; (2) sắp xếp phần prompt để nội dung cacheable đứng trước nội dung theo request → <b>Prompt Construction</b>; (3) tóm tắt lịch sử hội thoại khi không cần đầy đủ → <b>Input Preparation</b>; (4) validate structured output theo schema → <b>Output Handling</b>; (5) đưa nội dung lặp lại ổn định vào <b>cacheable prefix</b> đầu prompt → <b>Prompt Construction</b>; (6) cắt các đoạn truy xuất chỉ giữ phần liên quan → <b>Input Preparation</b>. Nguyên tắc: Input Preparation quyết định đưa dữ liệu gì vào, Prompt Construction quyết định sắp xếp (đặc biệt cho prompt caching), Output Handling xử lý sau khi model trả lời.","elim":["<b>A.</b> Xếp việc lưu output vào Prompt Construction và tóm tắt lịch sử vào Input Preparation ở sai vị trí; chuỗi lệch ngay từ mục 1 và 2.","<b>C.</b> Xếp việc lưu output và sắp xếp phần cacheable vào Input Preparation là sai — một cái là xử lý đầu ra, một cái là dựng prompt.","<b>D.</b> Đúng mục 1 nhưng xếp sắp xếp phần cacheable vào Input Preparation và tóm tắt lịch sử vào Prompt Construction là đảo vị trí."]},"cite":"Hướng dẫn ôn tập — §1.5 Context Window; Lĩnh vực 5.1"},{"id":"ccarp-q113","n":113,"topic":6,"type":"mcq","stem":{"en":"A customer support team has proposed delegating customer refund decisions to a Claudedriven workflow with no human review for refunds under 50 USD. The team's reasoning is that small refunds are low-risk and human review would erase the efficiency gain. Which Delegation-competency principle should guide your response?","vi":"Một nhóm hỗ trợ khách hàng đã đề xuất ủy quyền các quyết định hoàn tiền cho khách hàng cho quy trình làm việc của Claudedrive mà không có sự đánh giá của con người đối với các khoản tiền hoàn lại dưới 50 USD. Lý do của nhóm là những khoản hoàn trả nhỏ có rủi ro thấp và sự đánh giá của con người sẽ làm mất đi hiệu quả đạt được. Nguyên tắc về năng lực ủy quyền nào sẽ định hướng cho phản ứng của bạn?","jp":"カスタマー サポート チームは、50 米ドル未満の払い戻しについては人間によるレビューを行わずに、顧客の払い戻しの決定をクロード主導のワークフローに委任することを提案しました。チームの推論は、少額の払い戻しはリスクが低く、人間によるレビューでは効率性の向上が打ち消されてしまうというものだ。 あなたの対応の指針となるのは、どの委任能力原則ですか?"},"options":[{"k":"A","t":{"en":"Delegation should always include human review on every decision the workflow produces.","vi":"Việc ủy ​​quyền phải luôn bao gồm sự xem xét của con người đối với mọi quyết định mà quy trình làm việc đưa ra.","jp":"委任には、ワークフローによって生成されるすべての決定に対して常に人間によるレビューを含める必要があります。"}},{"k":"B","t":{"en":"Delegation scope should reflect the type of risk involved, not the transaction size alone.","vi":"Phạm vi ủy quyền phải phản ánh loại rủi ro liên quan chứ không chỉ quy mô giao dịch.","jp":"委任の範囲は、トランザクションの規模だけではなく、関与するリスクの種類を反映する必要があります。"}},{"k":"C","t":{"en":"Delegation scope should be set primarily by maximizing efficiency gains across the workflow.","vi":"Phạm vi ủy quyền nên được thiết lập chủ yếu bằng cách tối đa hóa hiệu quả đạt được trong toàn bộ quy trình làm việc.","jp":"委任範囲は、主にワークフロー全体の効率向上を最大化することによって設定する必要があります。"}},{"k":"D","t":{"en":"Delegation should be avoided entirely wherever financial transactions occur in the workflow.","vi":"Nên tránh hoàn toàn việc ủy ​​quyền ở bất kỳ nơi nào có giao dịch tài chính xảy ra trong quy trình làm việc.","jp":"ワークフロー内で金融取引が発生する場合は、委任を完全に回避する必要があります。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Giá trị giao dịch chỉ là một thành phần của rủi ro. Một khoản hoàn tiền nhỏ vẫn có thể gây <b>gian lận</b>, kết quả phân biệt đối xử, vi phạm hợp đồng, chiếm đoạt tài khoản hoặc <b>tổn thất cộng dồn</b> khi bị khai thác hàng loạt. Phạm vi ủy quyền nên dựa trên <b>loại rủi ro</b> — bản chất, khả năng phát hiện, khả năng đảo ngược và tác động tổng hợp — dẫn tới tự động hóa phân tầng: ca thường lệ, đủ bằng chứng tự động xử lý; ca bất thường, nhạy cảm danh tính hoặc ở rìa chính sách được review/escalate.","elim":["<b>A.</b> Review mọi quyết định triệt tiêu lợi ích ủy quyền và không phân biệt mức rủi ro.","<b>C.</b> Tối đa hóa hiệu quả làm tiêu chí chính chính là lập luận của đội đề xuất, bỏ qua rủi ro gian lận và tổn thất cộng dồn.","<b>D.</b> Tránh hoàn toàn ủy quyền ở mọi giao dịch tài chính là quá cứng nhắc; nhiều ca rủi ro thấp, rõ ràng hoàn toàn có thể tự động hóa an toàn."]},"cite":"Hướng dẫn ôn tập — §9.1 Khi nào escalation lên cho con người; Lĩnh vực 5.2"},{"id":"ccarp-q114","n":114,"topic":6,"type":"mcq","stem":{"en":"You are identifying inefficiency in a Claude Code workflow where each engineer manually re-explains the project's conventions and architecture in every session. Which adjustment most directly removes this inefficiency?","vi":"Bạn đang xác định sự kém hiệu quả trong quy trình làm việc của Mã Claude trong đó mỗi kỹ sư giải thích lại các quy ước và kiến ​​trúc của dự án theo cách thủ công trong mỗi phiên. Sự điều chỉnh nào trực tiếp loại bỏ sự kém hiệu quả này?","jp":"あなたは、各エンジニアがセッションごとにプロジェクトの規則とアーキテクチャを手動で再説明するクロード コードのワークフローの非効率性を特定しています。 この非効率性を最も直接的に取り除く調整はどれですか?"},"options":[{"k":"A","t":{"en":"Forbid the use of Claude Code on the project entirely to avoid the session-initialization overhead, accepting that the team loses all AI-assisted development productivity for this codebase.","vi":"Cấm hoàn toàn việc sử dụng Mã Claude trong dự án để tránh chi phí khởi tạo phiên, chấp nhận rằng nhóm sẽ mất tất cả năng suất phát triển được hỗ trợ bởi AI cho cơ sở mã này.","jp":"セッション初期化のオーバーヘッドを回避するためにプロジェクトでのクロード コードの使用を完全に禁止し、チームがこのコードベースに対する AI 支援開発の生産性をすべて失うことを受け入れます。"}},{"k":"B","t":{"en":"Capture the project's conventions and architecture in a project-scoped CLAUDE.md (or equivalent persistent project-context file) committed to the repository, so each session loads it automatically.","vi":"Nắm bắt các quy ước và kiến ​​trúc của dự án trong CLAUDE.md trong phạm vi dự án (hoặc tệp bối cảnh dự án liên tục tương đương) được cam kết với kho lưu trữ, do đó, mỗi phiên sẽ tự động tải nó.","jp":"リポジトリにコミットされたプロジェクト スコープの CLAUDE.md (または同等の永続的なプロジェクト コンテキスト ファイル) でプロジェクトの規則とアーキテクチャをキャプチャすると、各セッションでそれが自動的に読み込まれます。"}},{"k":"C","t":{"en":"Tell each engineer to retype the project conventions and architecture context more quickly at the start of each session, reducing time lost without eliminating the repeated manual effort.","vi":"Yêu cầu mỗi kỹ sư nhập lại các quy ước dự án và bối cảnh kiến ​​trúc nhanh hơn khi bắt đầu mỗi phiên, giảm thời gian lãng phí mà không loại bỏ nỗ lực thủ công lặp đi lặp lại.","jp":"各セッションの開始時にプロジェクトの規則とアーキテクチャのコンテキストをより迅速に再入力するよう各エンジニアに指示し、手動での繰り返しの作業を排除することなく時間のロスを削減します。"}},{"k":"D","t":{"en":"Remove all documented project conventions and architectural standards so engineers have nothing to re- explain at session start, accepting the loss of consistency and shared coding standards.","vi":"Loại bỏ tất cả các quy ước dự án và tiêu chuẩn kiến ​​trúc đã được ghi lại để các kỹ sư không có gì phải giải thích lại khi bắt đầu phiên làm việc, chấp nhận mất đi tính nhất quán và các tiêu chuẩn mã hóa chung.","jp":"文書化されたプロジェクトの規約とアーキテクチャ標準をすべて削除して、エンジニアがセッション開始時に再説明する必要がなくなるようにし、一貫性と共有コーディング標準の喪失を受け入れます。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> <b>CLAUDE.md cấp dự án</b> được commit vào repository biến thông tin phải giải thích lặp lại thành <b>context bền vững, có version control</b>. Claude Code tự động nạp CLAUDE.md khi khởi tạo session, nên quy ước code, nguyên tắc kiến trúc, lệnh build và cấu trúc repo được chia sẻ nhất quán cho mọi kỹ sư mà không ai phải gõ lại. Commit file còn cho phép review và kiểm soát thay đổi như code thông thường.","elim":["<b>A.</b> Cấm dùng Claude Code để tránh chi phí khởi tạo session là đánh mất toàn bộ năng suất thay vì gỡ bỏ điểm kém hiệu quả.","<b>C.</b> Gõ nhanh hơn chỉ giảm bớt thời gian chứ vẫn giữ nguyên công sức thủ công lặp lại mỗi session.","<b>D.</b> Xóa bỏ quy ước và tiêu chuẩn kiến trúc làm mất tính nhất quán của codebase — chữa bệnh bằng cách loại bỏ thứ có giá trị."]},"cite":"Hướng dẫn ôn tập — §5.1 Phân cấp CLAUDE.md; Lĩnh vực 3.1"},{"id":"ccarp-q115","n":115,"topic":6,"type":"mcq","stem":{"en":"The compliance team has authored a regulatory disclosure procedure that must be applied identically across customer service, sales, and onboarding workflows. The procedure changes when regulators issue updates, currently four to six times per year. You are designing how the procedure will be packaged for use by Claude across all three workflows. Which two design decisions should you include? (Select two.) Each correct answer presents part of the solution.  [Chọn 2 đáp án]","vi":"Nhóm tuân thủ đã soạn thảo một quy trình công bố quy định phải được áp dụng giống hệt nhau trong các quy trình làm việc về dịch vụ khách hàng, bán hàng và giới thiệu. Quy trình thay đổi khi cơ quan quản lý đưa ra bản cập nhật, hiện tại là bốn đến sáu lần mỗi năm. Bạn đang thiết kế cách thức đóng gói quy trình để Claude sử dụng trên cả ba quy trình công việc. Bạn nên đưa ra hai quyết định thiết kế nào? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một phần của giải pháp.  [Chọn 2 đáp án]","jp":"コンプライアンス チームは、顧客サービス、販売、オンボーディングのワークフロー全体に同一に適用する必要がある規制開示手順を作成しました。規制当局が最新情報を発行するたびに手順が変更され、現在は年に 4 ～ 6 回行われています。あなたは、3 つのワークフローすべてでクロードが使用できるように、プロシージャをどのようにパッケージ化するかを設計しています。 設計上の決定事項のうち、含めるべき 2 つのものはどれですか? (2 つ選択してください。) それぞれの正解は、解決策の一部を示しています。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Package the procedure as a Claude Skill owned directly by the compliance team.","vi":"Đóng gói quy trình dưới dạng Kỹ năng Claude do nhóm tuân thủ trực tiếp sở hữu.","jp":"プロシージャを、コンプライアンス チームが直接所有するクロード スキルとしてパッケージ化します。"}},{"k":"B","t":{"en":"Embed the procedure text into each workflow's system prompt at integration time.","vi":"Nhúng văn bản quy trình vào lời nhắc hệ thống của từng quy trình làm việc tại thời điểm tích hợp.","jp":"統合時に各ワークフローのシステム プロンプトに手順テキストを埋め込みます。"}},{"k":"C","t":{"en":"Store the procedure in a shared retrieval corpus accessed by all three workflows.","vi":"Lưu trữ thủ tục trong kho truy xuất chung được cả ba quy trình công việc truy cập.","jp":"3 つのワークフローすべてからアクセスされる共有検索コーパスにプロシージャを保存します。"}},{"k":"D","t":{"en":"Have each workflow team rewrite the procedure for its own context.","vi":"Yêu cầu mỗi nhóm quy trình viết lại quy trình cho bối cảnh riêng của mình.","jp":"各ワークフロー チームに、独自のコンテキストに合わせて手順を書き直してもらいます。"}},{"k":"E","t":{"en":"Reference the same Claude Skill from all three workflow integrations.","vi":"Tham khảo cùng một Kỹ năng Claude từ cả ba tích hợp quy trình công việc.","jp":"3 つのワークフロー統合すべてから同じクロード スキルを参照します。"}}],"answer":["A","E"],"multi":true,"explain":{"key":"<b>Đáp án A, E.</b> Quy trình cần <b>một bản triển khai có thẩm quyền duy nhất</b> và <b>một chủ sở hữu chịu trách nhiệm</b>.<br><b>A:</b> Đóng gói thành <b>Claude Skill do team compliance sở hữu</b> giúp chỉ dẫn, ví dụ, template và mẫu bị cấm được duy trì cùng nhau; khi quy định thay đổi 4–6 lần/năm, compliance cập nhật ở một nơi.<br><b>E:</b> <b>Tham chiếu cùng một Skill</b> từ cả ba workflow đảm bảo cập nhật lan truyền nhất quán mà không phải sửa riêng từng system prompt, tránh lệch cấu hình.","elim":["<b>B.</b> Nhúng văn bản quy trình vào system prompt của từng workflow tạo ra ba bản sao phải cập nhật thủ công mỗi lần quy định đổi, dễ lệch nhau.","<b>C.</b> Kho truy xuất phù hợp cho tài liệu tham khảo cần tìm kiếm, nhưng không đảm bảo quy trình được nạp đầy đủ và áp dụng y hệt mỗi lần.","<b>D.</b> Để mỗi team tự viết lại quy trình phá vỡ yêu cầu áp dụng giống hệt nhau và tạo ra hành vi tuân thủ không nhất quán."]},"cite":"Hướng dẫn ôn tập — §5.5 Skill — .claude/skills/; Lĩnh vực 3.2"},{"id":"ccarp-q116","n":116,"topic":6,"type":"mcq","stem":{"en":"You are compiling continuity practices that span the deployment lifecycle. Which two practices belong on the list? (Select two.) Each correct answer presents a complete solution.  [Chọn 2 đáp án]","vi":"Bạn đang biên soạn các phương pháp thực hành liên tục kéo dài suốt vòng đời triển khai. Hai thực hành nào thuộc danh sách? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một giải pháp hoàn chỉnh.  [Chọn 2 đáp án]","jp":"導入ライフサイクルにわたる継続性のプラクティスをまとめています。 リストに含まれる 2 つの実践はどれですか? (2 つ選択してください。) それぞれの正解は完全な解決策を示します。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Maintain a stakeholder register and notify the listed parties at every phase transition event.","vi":"Duy trì sổ đăng ký các bên liên quan và thông báo cho các bên được liệt kê tại mỗi sự kiện chuyển giai đoạn.","jp":"利害関係者登録簿を管理し、フェーズ移行イベントごとにリストに記載された関係者に通知します。"}},{"k":"B","t":{"en":"Carry the evaluation framework and reference set forward across iterations rather than rebuilding each time.","vi":"Thực hiện khung đánh giá và tham chiếu được thiết lập qua các lần lặp lại thay vì xây dựng lại mỗi lần.","jp":"毎回再構築するのではなく、反復にわたって設定された評価フレームワークと参照を継続します。"}},{"k":"C","t":{"en":"Archive every phase deliverable in long-term storage to preserve a record of what was produced.","vi":"Lưu trữ mọi giai đoạn có thể phân phối trong kho lưu trữ dài hạn để lưu giữ hồ sơ về những gì đã được sản xuất.","jp":"すべてのフェーズの成果物を長期保管場所にアーカイブして、作成さ
