<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCAR-P · Claude Certified Architect - Professional</title>
<meta name="description" content="Bộ đề luyện thi CCAR-F.">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<script>
/* đặt theme trước khi vẽ để không nháy màu */
(function(){
  var th="dark";
  try{
    var d=JSON.parse(localStorage.getItem('examtrainer.CCAR-F')||"{}");
    if(d.theme) th=d.theme;
    else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches) th="light";
  }catch(e){}
  document.documentElement.setAttribute("data-theme",th);
})();
</script>
<style>
/* ============================================================
   Exam Trainer — bảng điều khiển + tờ đề in (tông ấm)
   ============================================================ */

:root{                      /* TỐI — mỗi màu chữ đều đo trên nền sáng nhất mà nó nằm lên */
  --shell:#171310;          /* khung ngoài            */
  --shell-2:#201A15;        /* cột trái / cột phải    */
  --shell-3:#2E251C;        /* nền nổi khi rê chuột   */
  --sunken:#100D0A;         /* ô nhập liệu — chìm     */
  --paper:#1C1712;          /* vùng đọc               */
  --paper-2:#252019;
  --ink:#F1EFEA;            /* ≥13.1:1 mọi nền        */
  --ink-2:#C6BCAA;          /* ≥ 8.0:1 — nhãn, chú thích */
  --ink-3:#ABA08B;          /* ≥ 5.8:1 — số đếm, gợi ý ô nhập */
  --rule:#3D3428;           /* kẻ trang trí           */
  --rule-2:#786853;         /* viền điều khiển ≥3:1   */
  --on-accent:#171310;      /* chữ nằm trên mảng màu đặc */
  --ok:#8FD98C;
  --ok-bg:rgba(143,217,140,.15);
  --bad:#FF9781;
  --bad-bg:rgba(255,151,129,.15);
  --flag:#F7C25A;
  --flag-bg:rgba(247,194,90,.17);
  --pick:#8ECBF0;
  --pick-bg:rgba(142,203,240,.15);
  --stamp:#FF9781;
  --focus:#F7C25A;
  --thumb:#5A4E3D;
  color-scheme:dark;
}
[data-theme="light"]{       /* SÁNG — cùng nguyên tắc, giấy ngà để bớt chói */
  --shell:#E9E3D5;
  --shell-2:#F2EDE2;
  --shell-3:#E7E1D2;
  --sunken:#FFFFFF;
  --paper:#FDFBF5;
  --paper-2:#F5F1E6;
  --ink:#201C16;            /* ≥13.0:1 */
  --ink-2:#463E35;          /* ≥ 8.0:1 */
  --ink-3:#5B5347;          /* ≥ 5.8:1 */
  --rule:#DED6C4;
  --rule-2:#8F8269;
  --on-accent:#FFFFFF;
  --ok:#256B42;
  --ok-bg:rgba(37,107,66,.10);
  --bad:#B32E1F;
  --bad-bg:rgba(179,46,31,.09);
  --flag:#7F5405;
  --flag-bg:rgba(127,84,5,.13);
  --pick:#175D91;
  --pick-bg:rgba(23,93,145,.09);
  --stamp:#B32E1F;
  --focus:#7F5405;
  --thumb:#B0A48D;
  color-scheme:light;
}
:root{
  --sans:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --top:52px;
  --gut:clamp(16px,1.8vw,26px);
  --pad:clamp(24px,2.6vw,46px);
  --perf:26px;
  --recpad:clamp(12px,1.2vw,20px);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
*{scrollbar-width:thin;scrollbar-color:var(--thumb) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent;border-left:1px solid var(--rule)}
::-webkit-scrollbar-thumb{background:var(--thumb);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
body{
  margin:0;background:var(--shell);color:var(--ink);
  font-family:var(--serif);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
b,strong{font-weight:600}
h1,h2,h3,h4{margin:0}
img{max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hide{display:none!important}
.grow{flex:1}

.lbl{
  font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-2);
}

/* ============================ TOP ============================ */
.top{
  position:sticky;top:0;z-index:60;height:var(--top);
  background:var(--shell-2);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:var(--gut);padding:0 var(--gut);
}
.mark{display:flex;align-items:baseline;gap:9px;flex:none}
.mark .w{font-family:var(--sans);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.mark .w em{font-style:normal;color:var(--stamp)}
.mark .s{font-family:var(--sans);font-size:12px;letter-spacing:.02em;color:var(--ink-2);white-space:nowrap}

.seg{display:flex;border:1px solid var(--rule-2);flex:none}
.seg button{
  background:transparent;border:0;border-right:1px solid var(--rule-2);
  font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-2);padding:6px 13px;cursor:pointer;line-height:1.45;
}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink);background:var(--shell-3)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-accent)}
.seg.mini button{padding:5px 9px;font-size:10px;letter-spacing:.1em}
.top .right{display:flex;gap:8px;align-items:center;flex:none}
.icb{
  background:transparent;border:1px solid var(--rule-2);color:var(--ink-2);
  width:29px;height:29px;display:grid;place-items:center;cursor:pointer;
  font-family:var(--sans);font-weight:700;font-size:12px;flex:none;
}
.icb:hover{color:var(--ink);border-color:var(--ink-3)}

/* ============================ GRID ============================ */
.app{
  display:grid;
  grid-template-columns:266px minmax(0,1fr) 304px;
  grid-template-areas:"rail main aside";
  align-items:stretch;min-height:calc(100vh - var(--top));
}
.rail{grid-area:rail;border-right:1px solid var(--rule);background:var(--shell-2)}
.main{grid-area:main;min-width:0;background:var(--paper);position:relative;min-height:calc(100vh - var(--top))}
.aside{grid-area:aside;border-left:1px solid var(--rule);background:var(--shell-2)}
.rail-in,.aside-in{
  position:sticky;top:var(--top);height:calc(100vh - var(--top));
  overflow-y:auto;overflow-x:hidden;padding:16px var(--gut) 40px;
}
@media(max-width:1319px){
  .app{grid-template-columns:244px minmax(0,1fr);grid-template-areas:"rail aside" "rail main";align-content:start}
  .aside{border-left:0;border-bottom:1px solid var(--rule)}
  .aside-in{position:static;height:auto;max-height:none;padding:12px var(--gut)}
  .aside .stack{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 26px;align-items:start}
}
@media(max-width:899px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"rail" "main" "aside"}
  .aside{border-top:1px solid var(--rule);border-bottom:0}
  .only-lg{display:none}
  .rail{border-right:0;border-bottom:1px solid var(--rule)}
  .rail-in{position:static;height:auto;max-height:none;padding:12px var(--gut) 18px}
  body:not(.rail-open) .rail-in{display:none}
  .rail-in .stack{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px 26px;align-items:start}
}
@media(min-width:900px){ .railtoggle{display:none} }
@media(max-width:899px){
  .top{height:auto;min-height:var(--top);flex-wrap:wrap;gap:8px 10px;padding:8px var(--gut)}
  .mark .s{display:none}
  .top .right{margin-left:auto}
  .seg button{padding:6px 9px;font-size:10px;letter-spacing:.07em}
  .seg.mini button{padding:5px 7px}
}
@media(max-width:640px){
  :root{--perf:14px}
  .paper::before,.paper::after{background-size:100% 20px}
}

/* ============================ CONTROLS ============================ */
.blk{margin-bottom:22px}
.blk > .lbl{display:block;margin-bottom:8px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}

.fld{
  width:100%;background:var(--sunken);border:1px solid var(--rule-2);color:var(--ink);
  font-family:var(--serif);font-size:14.5px;padding:8px 10px;
}
.fld::placeholder{color:var(--ink-3);opacity:1}
.fld:focus{outline:none;border-color:var(--stamp);box-shadow:inset 0 0 0 1px var(--stamp)}

/* select tự vẽ — không dùng mũi tên mặc định của hệ điều hành */
.sel{position:relative;display:block}
.sel select{
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  width:100%;background:var(--sunken);color:var(--ink);
  border:1px solid var(--rule-2);border-radius:0;
  padding:9px 42px 9px 12px;font-family:var(--mono);font-size:13.5px;line-height:1.35;
  cursor:pointer;
}
.sel select:hover{border-color:var(--ink-3)}
.sel select:focus{outline:none;border-color:var(--stamp);box-shadow:inset 0 0 0 1px var(--stamp)}
.sel .cap{
  position:absolute;top:1px;right:1px;bottom:1px;width:30px;
  border-left:1px solid var(--rule-2);background:var(--shell-3);
  display:grid;place-items:center;pointer-events:none;
}
.sel .cap::after{
  content:"";width:0;height:0;
  border-left:4.5px solid transparent;border-right:4.5px solid transparent;
  border-top:5.5px solid var(--ink-2);
}
.sel select:hover + .cap::after{border-top-color:var(--ink)}
.sel select:focus + .cap{background:var(--stamp);border-left-color:var(--stamp)}
.sel select:focus + .cap::after{border-top-color:var(--on-accent)}
.sel.on select{border-color:var(--pick);box-shadow:inset 0 0 0 1px var(--pick)}
.sel.on .cap{border-left-color:var(--pick)}

.tlist{display:grid;gap:1px}
.slist{display:grid;border-top:1px solid var(--rule)}
.srow{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;border-bottom:1px solid var(--rule);
  border-left:2px solid transparent;padding:8px 10px;
}
.srow:hover{background:var(--shell-3)}
.srow[aria-pressed="true"]{border-left-color:var(--stamp);background:var(--shell-3)}
.srow[aria-pressed="true"] .nm{color:var(--ink)}
.srow .dot{width:10px;height:10px;flex:none;position:relative;color:var(--ink-3)}
.srow[aria-pressed="true"] .dot{color:var(--ink)}
.srow .dot::before{content:"";position:absolute;inset:1px;border:1px solid currentColor}
.srow .dot.g{color:var(--ok)}   .srow .dot.g::before{background:currentColor}
.srow .dot.r{color:var(--bad)}  .srow .dot.r::before{background:currentColor}
.srow .dot.f{color:var(--flag)} .srow .dot.f::before{background:currentColor}
/* dấu hiệu của từng dạng câu, vẽ lại đúng hình dáng điều khiển tương ứng */
.srow .dot.m-mcq::before{box-shadow:inset 0 0 0 2px currentColor}
.srow .dot.m-yesno::before{border:0;background:linear-gradient(currentColor 0 34%,transparent 34% 66%,currentColor 66% 100%)}
.srow .dot.m-drop::before{border:0;background:currentColor;clip-path:polygon(0 22%,100% 22%,50% 86%)}
.srow .nm{flex:1;font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.03em;
  text-transform:uppercase;color:var(--ink-2)}
.srow .ct{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* nhóm nút dữ liệu — hàng đầy chiều rộng, thống nhất với các danh sách khác */
.vlist{display:grid;border-top:1px solid var(--rule)}
.vrow{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;border-bottom:1px solid var(--rule);padding:10px;
  font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);
}
.vrow:hover{background:var(--shell-3);color:var(--ink)}
.vrow svg{flex:none;width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7}
.vrow.danger{color:var(--bad)}
.vrow.danger:hover{background:var(--bad-bg)}
.trow{
  display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:center;
  background:transparent;border:0;border-left:2px solid transparent;
  padding:6px 8px;cursor:pointer;text-align:left;width:100%;min-width:0;
}
.trow:hover{background:var(--shell-3)}
.trow[aria-pressed="true"]{border-left-color:var(--stamp);background:var(--shell-3)}
.trow .nm{font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.trow .ct{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.meter{grid-column:1/-1;height:4px;background:var(--rule);display:flex;overflow:hidden}
.meter i{display:block;height:100%}
.meter .g{background:var(--ok)}
.meter .r{background:var(--bad)}

.act{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;background:transparent;color:var(--ink);
  border:1px solid var(--rule-2);padding:7px 13px;cursor:pointer;line-height:1.4;
}
.btn:hover{border-color:var(--ink);background:var(--shell-3)}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{border-color:var(--rule-2);background:transparent;color:var(--ink)}
.btn.solid{background:var(--ink);border-color:var(--ink);color:var(--on-accent)}
.btn.solid:hover:not(:disabled){filter:brightness(1.12)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:5px 10px;font-size:10px}

/* ============================ ASIDE ============================ */
.kv{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:3px 0}
.kv span{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.kv b{font-family:var(--mono);font-size:12.5px;font-weight:600}
.bigbar{height:8px;border:1px solid var(--rule-2);display:flex;margin:6px 0;overflow:hidden}
.bigbar i{display:block;height:100%}
.queue{display:grid;gap:2px;max-height:270px;overflow:auto}
.qbtn{
  display:flex;gap:8px;align-items:baseline;background:transparent;border:0;
  border-left:2px solid var(--rule-2);padding:5px 8px;text-align:left;cursor:pointer;width:100%;min-width:0;
}
.qbtn:hover{background:var(--shell-3)}
.qbtn.is-wrong{border-left-color:var(--bad)}
.qbtn.is-flag{border-left-color:var(--flag)}
.qbtn .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);flex:none}
.qbtn .t{min-width:0;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.keys{display:grid;gap:3px}
.keyrow{display:flex;gap:8px;align-items:center;font-family:var(--serif);font-size:12.5px;color:var(--ink-2)}
kbd{
  font-family:var(--mono);font-size:10px;background:var(--shell-3);border:1px solid var(--rule-2);
  border-bottom-width:2px;padding:1px 5px;color:var(--ink);min-width:18px;text-align:center;
}

/* ============================ PAPER ============================ */
.paper{position:relative;padding:0 var(--perf);min-height:100%}
.paper::before,.paper::after{
  content:"";position:absolute;top:0;bottom:0;width:var(--perf);
  background:var(--paper-2);pointer-events:none;
}
.paper::before{left:0;border-right:1px solid var(--rule);box-shadow:inset -4px 0 0 -3px var(--rule)}
.paper::after{right:0;border-left:1px solid var(--rule);box-shadow:inset 4px 0 0 -3px var(--rule)}
.sheet{padding:0 var(--pad) 64px}

.head{padding:30px 0 18px;border-bottom:2px solid var(--ink);display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.head h2{font-family:var(--sans);font-weight:700;font-size:clamp(22px,2.6vw,34px);letter-spacing:-.01em;text-transform:uppercase;line-height:1}
.head p{font-family:var(--serif);font-size:14.5px;color:var(--ink-2);margin:8px 0 0;max-width:62ch}
.head .r{margin-left:auto;text-align:right}

.rec{
  border-bottom:1px solid var(--rule);
  padding:22px var(--recpad) 24px;margin:0 calc(-1 * var(--recpad));
  scroll-margin-top:calc(var(--top) + 12px);
}
.rec.cur{background:var(--paper-2);box-shadow:inset 3px 0 0 var(--stamp)}
.rec.cur .idx{color:var(--stamp)}
.rechead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px;max-width:86ch}
.idx{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.05em}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.flagbtn{
  flex:none;width:26px;height:24px;display:grid;place-items:center;cursor:pointer;
  background:transparent;border:1px solid var(--rule-2);color:var(--ink-2);
}
.flagbtn svg{width:12px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9}
.flagbtn:hover{color:var(--flag);border-color:var(--flag)}
.flagbtn[aria-pressed="true"]{color:var(--flag);border-color:var(--flag);background:var(--flag-bg)}
.flagbtn[aria-pressed="true"] svg{fill:currentColor}
.tag{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid var(--rule-2);color:var(--ink-2);padding:2px 6px;white-space:nowrap;
}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.bad{color:var(--bad);border-color:var(--bad)}
.tag.flag{color:var(--flag);border-color:var(--flag)}
.tag.multi{color:var(--pick);border-color:var(--pick)}

.stem{font-family:var(--mono);font-size:14.5px;line-height:1.62;margin:0;max-width:78ch}
.gloss{
  display:block;font-family:var(--serif);font-size:14.5px;line-height:1.6;
  color:var(--ink-2);max-width:74ch;margin:4px 0 0;
}
.qbody{margin-top:16px}
.qimg{display:block;margin:14px 0 4px;border:1px solid var(--rule-2);max-width:min(100%,620px);cursor:zoom-in}

/* --- phương án nhiều lựa chọn --- */
.opts{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-width:86ch}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:transparent;border:1px solid transparent;color:var(--ink);
  padding:8px 10px;cursor:pointer;
}
.opt:hover{border-color:var(--rule-2)}
.opt .k{
  flex:none;width:22px;height:22px;display:grid;place-items:center;margin-top:1px;
  border:1px solid var(--rule-2);font-family:var(--mono);font-weight:600;font-size:11.5px;
}
.opt .tx{flex:1;min-width:0;font-family:var(--mono);font-size:13.5px;line-height:1.55}
.opt .tx .gloss{font-size:13.5px;margin-top:3px}
.opt .mk{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;white-space:nowrap;padding-top:5px;display:none;
}
.opt[data-pick="1"]{border-color:var(--pick);background:var(--pick-bg)}
.opt[data-pick="1"] .k{background:var(--pick);border-color:var(--pick);color:var(--on-accent)}
.opt[data-pick="1"] .mk-you{display:block;color:var(--pick)}
.rec[data-done="1"] .opt{cursor:default}
.rec[data-done="1"] .opt:hover{border-color:transparent}
.rec[data-done="1"] .opt[data-right="1"]{border-color:var(--ok);background:var(--ok-bg)}
.rec[data-done="1"] .opt[data-right="1"] .k{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.rec[data-done="1"] .opt[data-right="1"] .mk-ok{display:block;color:var(--ok)}
.rec[data-done="1"] .opt[data-right="1"] .mk-you{display:none}
.rec[data-done="1"] .opt[data-pick="1"][data-right="0"]{border-color:var(--bad);background:var(--bad-bg)}
.rec[data-done="1"] .opt[data-pick="1"][data-right="0"] .k{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.rec[data-done="1"] .opt[data-pick="1"][data-right="0"] .mk-you{display:block;color:var(--bad)}

/* --- dạng Có / Không theo dòng --- */
.ynlist{list-style:none;margin:0;padding:0;max-width:92ch;border-top:1px solid var(--rule)}
.yn{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:center;
  padding:12px 10px;border-bottom:1px solid var(--rule);
}
.yn .ynt{font-family:var(--mono);font-size:13.5px;line-height:1.55;min-width:0}
.yn .ynt .gloss{font-size:13.5px;margin-top:3px}
.ynb{display:flex;flex:none;border:1px solid var(--rule-2)}
.ynb button{
  background:transparent;border:0;border-right:1px solid var(--rule-2);
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-2);padding:6px 14px;cursor:pointer;min-width:64px;
}
.ynb button:last-child{border-right:0}
.ynb button:hover{background:var(--shell-3);color:var(--ink)}
.ynb button[aria-pressed="true"]{background:var(--pick);color:var(--on-accent)}
.rec[data-done="1"] .ynb button{cursor:default}
.rec[data-done="1"] .ynb button:hover{background:transparent;color:var(--ink-2)}
.rec[data-done="1"] .ynb button[aria-pressed="true"]{background:var(--bad);color:var(--on-accent)}
.rec[data-done="1"] .yn[data-right="1"] .ynb button[aria-pressed="true"]{background:var(--ok);color:var(--on-accent)}
.rec[data-done="1"] .yn[data-right="0"] .ynb button[data-correct="1"]{box-shadow:inset 0 0 0 2px var(--ok);color:var(--ok)}

/* --- dạng chọn từ danh sách --- */
.blanks{display:grid;gap:18px;max-width:78ch}
.blank .blabel{display:block;font-family:var(--mono);font-size:13px;line-height:1.55;margin-bottom:8px;color:var(--ink)}
.blank .blabel .gloss{font-size:13px;margin-top:3px}
.blank .ansline{
  font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  margin-top:7px;display:none;
}
.rec[data-done="1"] .blank[data-right="0"] .ansline{display:block}
.blank .ansline.ok{color:var(--ok)}
.blank .ansline.bad{color:var(--bad)}
.rec[data-done="1"] .sel select{pointer-events:none}
.rec[data-done="1"] .blank[data-right="1"] select{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.rec[data-done="1"] .blank[data-right="0"] select{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}

.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px;max-width:86ch}
.note{font-family:var(--serif);font-size:13.5px;color:var(--ink-2)}

/* --- khối đáp án --- */
.rev{display:none;margin-top:20px;border-top:1px solid var(--ink);padding-top:18px}
.rec[data-done="1"] .rev{display:block}
.revtop{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.stamp{
  border:2.5px solid var(--stamp);color:var(--stamp);padding:5px 13px 6px;
  transform:rotate(-2.2deg);box-shadow:inset 0 0 0 1px var(--stamp);
  display:flex;align-items:baseline;gap:10px;flex:none;max-width:100%;
}
.stamp .t{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.stamp .v{font-family:var(--sans);font-weight:700;font-size:26px;line-height:1;letter-spacing:.06em}
.stamp.txt .v{font-size:15px;letter-spacing:.02em;font-family:var(--mono);font-weight:600;line-height:1.35}
.verdict{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--bad)}
.conf{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid currentColor;padding:3px 8px;
}
.conf.h{color:var(--ok)}
.conf.m{color:var(--flag)}
.conf.l{color:var(--bad)}

.revgrid{display:grid;gap:20px 36px}
@media(min-width:1500px){ .revgrid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }
.sech{
  font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-2);display:flex;align-items:center;gap:10px;margin-bottom:8px;
}
.sech::after{content:"";flex:1;height:0;border-top:1px dotted var(--rule-2)}
.prose{font-family:var(--serif);font-size:15.5px;line-height:1.7;max-width:72ch;margin:0}
.prose b{box-shadow:inset 0 -2px 0 var(--flag)}
ul.elim{list-style:none;margin:0;padding:0;max-width:72ch}
ul.elim li{font-family:var(--serif);font-size:15px;line-height:1.65;padding-left:20px;position:relative;margin-bottom:6px}
ul.elim li::before{content:"\00D7";position:absolute;left:2px;top:-1px;font-family:var(--sans);font-weight:700;color:var(--bad);font-size:16px}
.cite{
  font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-top:16px;
  padding-top:10px;border-top:1px dotted var(--rule-2);max-width:78ch;word-break:break-word;
}
.notewrap{margin-top:20px;padding-top:16px;border-top:1px dotted var(--rule-2)}
.notewrap .lbl{display:block;margin-bottom:6px}
.notewrap textarea{
  display:block;width:100%;max-width:72ch;min-height:64px;resize:vertical;background:var(--sunken);
  border:1px solid var(--rule-2);color:var(--ink);font-family:var(--serif);font-size:14.5px;padding:9px 11px;
}
.notewrap textarea:focus{outline:none;border-color:var(--stamp)}

/* ============================ EXAM ============================ */
.panel{border:1px solid var(--rule-2);background:var(--paper-2);padding:24px var(--pad);margin-top:24px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px 24px;align-items:end}
.grid2 .lbl{min-height:15px}
.fldw{display:grid;gap:6px}
.timer{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:.06em}
.timer.low{color:var(--bad)}
.pal{display:flex;flex-wrap:wrap;gap:4px}
.pd{
  width:30px;height:28px;border:1px solid var(--rule-2);background:transparent;color:var(--ink-2);
  font-family:var(--mono);font-size:11px;cursor:pointer;position:relative;
}
.pd:hover{border-color:var(--ink-3);color:var(--ink)}
.pd.is-ans{border-color:var(--pick);color:var(--pick)}
.pd.is-flag::after{content:"";position:absolute;top:2px;right:2px;width:4px;height:4px;background:var(--flag)}
.pd.is-cur{background:var(--ink);border-color:var(--ink);color:var(--on-accent)}

.score{display:flex;gap:36px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .n b{font-family:var(--sans);font-weight:700;font-size:34px;line-height:1}
.ring .n span{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);letter-spacing:.1em;text-transform:uppercase}
.result-h{font-family:var(--sans);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase}
.result-h.ok{color:var(--ok)}
.result-h.bad{color:var(--flag)}
.figs{display:flex;gap:28px;flex-wrap:wrap;margin-top:12px}
.fig b{display:block;font-family:var(--mono);font-size:23px;font-weight:600}

/* ============================ TABLE ============================ */
.tw{overflow-x:auto;margin-top:12px}
.tw table{min-width:440px}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule)}
th{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);border-bottom-color:var(--rule-2)}
td:first-child{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.02em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.sbar{height:5px;background:var(--rule);display:flex;min-width:70px}
.sbar i{display:block;height:100%}

.empty{padding:64px 10px;text-align:center;font-family:var(--serif);font-size:14.5px;color:var(--ink-2)}
.empty b{display:block;font-family:var(--sans);font-size:18px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-bottom:8px}

/* ============================ OVERLAY ============================ */
.ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px}
.ov .box{background:var(--shell-2);border:1px solid var(--rule-2);max-width:520px;width:100%;padding:22px 24px;max-height:86vh;overflow:auto}
.ov h3{font-family:var(--sans);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.ov p{font-family:var(--serif);font-size:14.5px;color:var(--ink-2);margin:0 0 16px}
.ov.zoom{cursor:zoom-out}
.ov.zoom img{max-width:96vw;max-height:92vh;border:1px solid var(--rule-2)}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;
  background:var(--ink);color:var(--on-accent);font-family:var(--mono);font-size:12.5px;
  padding:9px 16px;border:1px solid var(--ink);
}

/* ============ RESPONSIVE OVERRIDES (phải nằm sau mọi component) ============ */
@media(max-width:640px){
  .yn{grid-template-columns:minmax(0,1fr);gap:12px}
  .ynb{justify-self:start}
  .ynb button{min-width:84px;padding:7px 16px}
  .stem,.opt .tx,.yn .ynt{font-size:13.5px}
  .revtop{gap:12px}
  .stamp{transform:none}
}

/* ============================ PRINT ============================ */
@media print{
  body{background:#fff;color:#000}
  .top,.rail,.aside,.bar,.notewrap,.ov,.toast{display:none!important}
  .app{display:block}
  .main{background:#fff}
  .paper{padding:0}
  .paper::before,.paper::after{display:none}
  .rec{break-inside:avoid;background:#fff!important}
  .rev{display:block!important}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

</style>

<script>
/* ============================================================
   Exam Trainer — engine
   Hỗ trợ 3 dạng câu: mcq · yesno · dropdown
   ============================================================ */
const DATA = {"meta":{"code":"CCAR-P","title":{"en":"CCAR-P - Claude Certified Architect - Professional"},"org":"Anthropic","pass":70},"topics":[{"n":1,"title":{"en":"Practice Set 1","vi":"Bộ đề số 1","jp":"練習問題 1"},"questions":[{"id":"ccarp-q001","n":1,"topic":1,"type":"mcq","stem":{"en":"You are configuring tool permissions for a Claude-based assistant. The assistant's defined responsibilities require read access to a knowledge base and write access to a draft queue, and nothing else. Which scoping design best applies least privilege?","vi":"Bạn đang định cấu hình quyền truy cập công cụ cho trợ lý dựa trên Claude. Các trách nhiệm được xác định của trợ lý yêu cầu quyền truy cập đọc vào cơ sở kiến ​​thức và quyền truy cập ghi vào hàng đợi bản nháp, ngoài ra không có gì khác. Thiết kế phạm vi nào áp dụng ít đặc quyền nhất?","jp":"クロードベースのアシスタントのツール権限を構成しています。アシスタントの定義された責任には、ナレッジ ベースへの読み取りアクセスとドラフト キューへの書き込みアクセスが必要ですが、それ以外は何も必要ありません。 最小特権を適用するのに最適なスコープ設計はどれですか?"},"options":[{"k":"A","t":{"en":"Allow access to all tools with read permissions globally and restrict write permissions to the draftqueue tool, without scoping to only the specific tools required for defined tasks.","vi":"Cho phép truy cập vào tất cả các công cụ có quyền đọc trên toàn cầu và hạn chế quyền ghi đối với công cụ hàng dự thảo mà không chỉ giới hạn ở các công cụ cụ thể cần thiết cho các tác vụ đã xác định.","jp":"定義されたタスクに必要な特定のツールのみに限定することなく、読み取り権限を持つすべてのツールへのアクセスをグローバルに許可し、書き込み権限をドラフトキュー ツールに制限します。"}},{"k":"B","t":{"en":"Per-role allow-list of exactly the read-knowledge-base and write-draft-queue tools, enforced at the orchestration layer.","vi":"Danh sách cho phép theo vai trò của chính xác các công cụ đọc-kiến thức-cơ sở và ghi-nháp-hàng đợi, được thực thi ở lớp điều phối.","jp":"オーケストレーション層で強制される、読み取りナレッジ ベース ツールと書き込みドラフト キュー ツールのロールごとの許可リスト。"}},{"k":"C","t":{"en":"Allow access to every tool in the catalog and rely on the model to decline tools it should not use.","vi":"Cho phép truy cập vào mọi công cụ trong danh mục và dựa vào mô hình để từ chối những công cụ không nên sử dụng.","jp":"カタログ内のすべてのツールへのアクセスを許可し、使用すべきでないツールを拒否するモデルに依存します。"}},{"k":"D","t":{"en":"Disable all tools entirely to achieve a minimal permission surface, accepting that the assistant can no longer perform the read-knowledge-base or write-draft-queue tasks it was designed for.","vi":"Vô hiệu hóa hoàn toàn tất cả các công cụ để đạt được bề mặt cấp phép tối thiểu, chấp nhận rằng trợ lý không còn có thể thực hiện các tác vụ đọc-cơ sở kiến ​​thức hoặc xếp hàng ghi-nháp mà nó được thiết kế cho nữa.","jp":"すべてのツールを完全に無効にして、最小限の権限領域を実現し、アシスタントが設計されたナレッジベースの読み取りタスクやドラフトキューの書き込みタスクを実行できなくなることを受け入れます。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> <b>Least privilege</b> nghĩa là cấp đúng và chỉ đúng những năng lực mà trách nhiệm đã định nghĩa yêu cầu: ở đây là đọc knowledge base và ghi vào draft queue. Một <b>allow-list theo vai trò</b> gồm chính xác hai tool này giới hạn bề mặt tấn công tối thiểu mà vẫn giữ nguyên chức năng. Việc <b>thực thi ở tầng orchestration</b> tạo ranh giới phân quyền tất định nằm ngoài prompt và suy luận của mô hình, nên prompt injection hay lỗi suy luận không thể vượt qua.","elim":["<b>A.</b> Cấp quyền đọc toàn cục cho mọi tool vượt quá phạm vi cần thiết (chỉ cần đọc knowledge base), nên vẫn mở rộng bề mặt truy cập dữ liệu ngoài trách nhiệm.","<b>C.</b> Dựa vào mô hình tự từ chối tool là kiểm soát xác suất, không phải ranh giới phân quyền; prompt injection hoặc suy luận sai có thể khiến mô hình gọi tool không được phép.","<b>D.</b> Tắt toàn bộ tool làm hệ thống mất chức năng được thiết kế; least privilege là \"đủ và không thừa\", không phải \"không có gì\"."]},"cite":"Hướng dẫn ôn tập — Lĩnh vực 2.3 Phân bổ Tool Giữa các Agent và Cấu hình <code>tool_choice</code>"},{"id":"ccarp-q002","n":2,"topic":1,"type":"mcq","stem":{"en":"You are running a controlled experiment to compare two prompts and must complete the design steps before executing the experiment. Which two steps must be completed BEFORE running the experiment with random assignment? (Select two.) Each correct answer presents part of the solution.  [Chọn 2 đáp án]","vi":"Bạn đang chạy một thử nghiệm được kiểm soát để so sánh hai lời nhắc và phải hoàn thành các bước thiết kế trước khi thực hiện thử nghiệm. Hai bước nào phải được hoàn thành TRƯỚC KHI chạy thử nghiệm với sự phân công ngẫu nhiên? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một phần của giải pháp.  [Chọn 2 đáp án]","jp":"2 つのプロンプトを比較する制御実験を実行しているため、実験を実行する前に設計手順を完了する必要があります。 ランダムな割り当てで実験を実行する前に完了する必要がある 2 つの手順はどれですか? (2 つ選択してください。) それぞれの正解は、解決策の一部を示しています。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Determine the minimum detectable effect size and the sample size needed for power.","vi":"Xác định kích thước hiệu ứng tối thiểu có thể phát hiện được và kích thước mẫu cần thiết cho công suất.","jp":"検出可能な最小効果サイズと検出力に必要なサンプル サイズを決定します。"}},{"k":"B","t":{"en":"Decide whether to promote, reject, or iterate the candidate based on the analysis.","vi":"Quyết định xem nên đề bạt, từ chối hay lặp lại ứng viên dựa trên phân tích.","jp":"分析に基づいて、候補者を昇進するか、拒否するか、反復するかを決定します。"}},{"k":"C","t":{"en":"Define the hypothesis and the primary success metric for the comparison.","vi":"Xác định giả thuyết và thước đo thành công chính để so sánh.","jp":"比較のための仮説と主要な成功指標を定義します。"}},{"k":"D","t":{"en":"Analyze the results against the predefined success metric and significance threshold.","vi":"Phân tích kết quả theo chỉ số thành công được xác định trước và ngưỡng ý nghĩa.","jp":"事前定義された成功指標および有意性しきい値と比較して結果を分析します。"}},{"k":"E","t":{"en":"Document the recommendation, the trade-offs accepted, and the alternatives considered.","vi":"Ghi lại khuyến nghị, sự đánh đổi được chấp nhận và các lựa chọn thay thế được xem xét.","jp":"推奨事項、受け入れられたトレードオフ、検討された代替案を文書化します。"}}],"answer":["A","C"],"multi":true,"explain":{"key":"<b>Đáp án A, C.</b> Thiết kế thí nghiệm phải được chốt <b>trước</b> khi chạy và phân nhóm ngẫu nhiên.<br><b>C:</b> Định nghĩa <b>giả thuyết và metric thành công chính</b> từ trước để tránh việc xem kết quả rồi mới chọn metric có lợi cho prompt mới (p-hacking).<br><b>A:</b> Xác định <b>minimum detectable effect</b> và <b>cỡ mẫu đủ power</b> để biết thí nghiệm có khả năng phát hiện cải thiện có ý nghĩa thực tế hay không; thiếu bước này thì kết quả \"không khác biệt\" không thể diễn giải.","elim":["<b>B.</b> Quyết định promote/reject/iterate dựa trên kết quả phân tích, nên chỉ xảy ra sau khi thí nghiệm đã chạy.","<b>D.</b> Phân tích kết quả theo metric và ngưỡng ý nghĩa là bước sau khi thu dữ liệu, không phải bước thiết kế trước thí nghiệm.","<b>E.</b> Ghi lại khuyến nghị, trade-off và phương án thay thế là bước tổng kết cuối cùng, sau khi đã có kết quả và quyết định."]}},{"id":"ccarp-q003","n":3,"topic":1,"type":"mcq","stem":{"en":"You are reviewing a peer's Claude Code permission rules for an enterprise rollout. The rules grant unrestricted Bash access to all projects across all developers. Which response is most appropriate?","vi":"Bạn đang xem xét các quy tắc cấp phép Mã Claude của một thiết bị ngang hàng để triển khai cho doanh nghiệp. Các quy tắc cấp quyền truy cập Bash không hạn chế cho tất cả các dự án trên tất cả các nhà phát triển. Phản ứng nào là phù hợp nhất?","jp":"You are reviewing a peer's Claude Code permission rules for an enterprise rollout. The rules grant unrestricted Bash access to all projects across all developers. どの対応が最も適切でしょうか?"},"options":[{"k":"A","t":{"en":"Add unrestricted access to additional tool categories as well, so that Bash is not asymmetrically more permissive than other tools, expanding the attack surface further in the name of consistency.","vi":"Thêm quyền truy cập không hạn chế vào các danh mục công cụ bổ sung, để Bash không dễ dãi hơn các công cụ khác một cách bất đối xứng, mở rộng bề mặt tấn công hơn nữa với danh nghĩa nhất quán.","jp":"追加のツール カテゴリへの無制限のアクセスも同様に追加します。これにより、Bash が他のツールよりも非対称的に寛容になり、一貫性の名のもとに攻撃対象領域がさらに拡大することがなくなります。"}},{"k":"B","t":{"en":"Approve the unrestricted Bash access as written on the grounds that narrowing the rules would add configuration complexity, accepting the full attack surface for all engineers across all projects.","vi":"Phê duyệt quyền truy cập Bash không hạn chế như đã viết trên cơ sở việc thu hẹp các quy tắc sẽ làm tăng thêm độ phức tạp của cấu hình, chấp nhận toàn bộ bề mặt tấn công cho tất cả các kỹ sư trong tất cả các dự án.","jp":"ルールを狭めると構成が複雑になり、すべてのプロジェクトのすべてのエンジニアが攻撃対象領域を完全に受け入れることになるという理由で、書かれているように無制限の Bash アクセスを承認します。"}},{"k":"C","t":{"en":"Replace unrestricted Bash with narrowly scoped tool patterns that allow only the specific commands the workflows require, and add explicit deny rules for sensitive operations.","vi":"Thay thế Bash không hạn chế bằng các mẫu công cụ có phạm vi hẹp chỉ cho phép các lệnh cụ thể mà quy trình công việc yêu cầu và thêm các quy tắc từ chối rõ ràng cho các hoạt động nhạy cảm.","jp":"制限のない Bash を、ワークフローに必要な特定のコマンドのみを許可する狭い範囲のツール パターンに置き換え、機密性の高い操作に対して明示的な拒否ルールを追加します。"}},{"k":"D","t":{"en":"Disable all permission rules for the enterprise rollout so every command across every project runs without any tool-pattern scoping or explicit deny rules for sensitive operations.","vi":"Vô hiệu hóa tất cả các quy tắc cấp phép cho quá trình triển khai doanh nghiệp để mọi lệnh trên mọi dự án đều chạy mà không có bất kỳ phạm vi mẫu công cụ nào hoặc quy tắc từ chối rõ ràng đối với các hoạt động nhạy cảm.","jp":"エンタープライズ ロールアウトのすべての権限ルールを無効にすると、ツール パターンのスコープ指定や機密性の高い操作に対する明示的な拒否ルールなしで、すべてのプロジェクトのすべてのコマンドが実行されます。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Bash không giới hạn cho mọi dự án và mọi lập trình viên mở ra quyền truy cập filesystem, credential, mạng, package manager và có thể cả hạ tầng — vi phạm <b>least privilege</b>. Cách đúng là thay bằng <b>tool pattern hẹp</b> (ví dụ <code>Bash(npm run test:*)</code>) chỉ cho phép đúng các lệnh workflow cần, kèm <b>deny rule tường minh</b> cho thao tác nhạy cảm. Hệ thống permission của Claude Code hỗ trợ allow/ask/deny, trong đó <b>deny được ưu tiên</b>, nên deny rule là lớp chặn đáng tin cậy.","elim":["<b>A.</b> Mở thêm quyền không giới hạn cho các tool khác chỉ để \"nhất quán\" làm bề mặt tấn công rộng hơn nữa thay vì khắc phục vấn đề.","<b>B.</b> Chấp nhận toàn bộ bề mặt tấn công chỉ để tránh độ phức tạp cấu hình là đánh đổi sai cho triển khai enterprise; cấu hình theo pattern là chi phí hợp lý.","<b>D.</b> Bỏ mọi permission rule loại bỏ cả cơ chế kiểm soát, còn tệ hơn tình trạng hiện tại."]}},{"id":"ccarp-q004","n":4,"topic":1,"type":"mcq","stem":{"en":"A senior architect is managing stakeholder expectations for a Claude-based reporting assistant midway through development. Stakeholders have escalating concerns about response latency. Which two actions most directly address stakeholder expectation alignment in this situation? (Select two.)  [Chọn 2 đáp án]","vi":"Một kiến ​​trúc sư cấp cao đang quản lý những kỳ vọng của các bên liên quan đối với trợ lý báo cáo làm việc tại Claude trong quá trình phát triển. Các bên liên quan ngày càng lo ngại về độ trễ phản hồi. Hai hành động nào giải quyết trực tiếp nhất sự phù hợp kỳ vọng của các bên liên quan trong tình huống này? (Chọn 2.) [Chọn 2 đáp án]","jp":"上級アーキテクトは、開発の途中でクロードベースのレポートアシスタントに対する関係者の期待を管理しています。関係者の応答遅延に対する懸念は高まっています。 この状況でステークホルダーの期待の一致に最も直接的に対処する 2 つのアクションはどれですか? (2 つ選択してください。) [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Present measured p50 and p95 latency baselines against the agreed SLA thresholds so stakeholders have accurate data.","vi":"Trình bày các đường cơ sở về độ trễ p50 và p95 được đo lường so với ngưỡng SLA đã thống nhất để các bên liên quan có dữ liệu chính xác.","jp":"関係者が正確なデータを入手できるように、合意された SLA しきい値に対して測定された p50 および p95 遅延ベースラインを提示します。"}},{"k":"B","t":{"en":"Pause all development and reallocate engineering resources entirely to latency optimization.","vi":"Tạm dừng tất cả quá trình phát triển và phân bổ lại toàn bộ nguồn lực kỹ thuật để tối ưu hóa độ trễ.","jp":"すべての開発を一時停止し、レイテンシの最適化のためにエンジニアリング リソースを完全に再割り当てします。"}},{"k":"C","t":{"en":"Communicate that latency concerns are a known LLM limitation and outside the architecture team's control.","vi":"Truyền đạt rằng những lo ngại về độ trễ là một hạn chế LLM đã biết và nằm ngoài tầm kiểm soát của nhóm kiến ​​trúc.","jp":"遅延の問題は LLM の既知の制限であり、アーキテクチャ チームの制御の範囲外であることを伝えます。"}},{"k":"D","t":{"en":"Replace the current Claude model with a third-party model that may offer lower latency without evaluation.","vi":"Thay thế mô hình Claude hiện tại bằng mô hình của bên thứ ba có thể mang lại độ trễ thấp hơn mà không cần đánh giá.","jp":"現在の Claude モデルを、評価なしでより低いレイテンシを提供できるサードパーティ モデルに置き換えます。"}},{"k":"E","t":{"en":"Revise the SLA definition collaboratively with stakeholders if current targets are not achievable given production constraints.","vi":"Phối hợp sửa đổi định nghĩa SLA với các bên liên quan nếu các mục tiêu hiện tại không thể đạt được do hạn chế về sản xuất.","jp":"生産上の制約により現在の目標が達成できない場合は、関係者と協力して SLA 定義を改訂します。"}}],"answer":["A","E"],"multi":true,"explain":{"key":"<b>Đáp án A, E.</b> Căn chỉnh kỳ vọng stakeholder bắt đầu từ <b>dữ liệu đo được</b> và kết thúc bằng <b>thỏa thuận được điều chỉnh minh bạch</b>.<br><b>A:</b> Trình bày baseline <b>p50 và p95</b> so với ngưỡng SLA đã thỏa thuận cho stakeholder thấy trải nghiệm trung vị và phần đuôi chậm, thay thế cảm nhận bằng bằng chứng.<br><b>E:</b> Nếu mục tiêu không khả thi trong ràng buộc production, cần <b>cùng stakeholder sửa lại định nghĩa SLA</b> (hoặc phạm vi, chi phí, thiết kế UX) thay vì âm thầm bỏ lỡ cam kết.","elim":["<b>B.</b> Dừng toàn bộ phát triển để tối ưu latency là phản ứng thái quá, chưa dựa trên số liệu và không giải quyết việc căn chỉnh kỳ vọng.","<b>C.</b> Đổ cho \"giới hạn của LLM\" là né tránh trách nhiệm; latency chịu ảnh hưởng lớn bởi kiến trúc (model tier, độ dài prompt, caching, streaming, số lượt tool call).","<b>D.</b> Đổi sang mô hình bên thứ ba mà không đánh giá có thể làm giảm chất lượng và vẫn không giải quyết việc thống nhất kỳ vọng dựa trên dữ liệu."]}},{"id":"ccarp-q005","n":5,"topic":1,"type":"mcq","stem":{"en":"You are supporting a team whose Claude Code sessions consistently load 60 or more MCP tools from many servers, exhausting context budget before the session begins. Which adjustment most directly addresses this issue without removing capability?","vi":"Bạn đang hỗ trợ một nhóm có phiên Claude Code tải liên tục 60 công cụ MCP trở lên từ nhiều máy chủ, làm cạn kiệt ngân sách ngữ cảnh trước khi phiên bắt đầu. Điều chỉnh nào giải quyết trực tiếp nhất vấn đề này mà không loại bỏ khả năng?","jp":"あなたは、Claude Code セッションが多数のサーバーから 60 以上の MCP ツールを常にロードし、セッションが始まる前にコンテキスト バジェットを使い果たしているチームをサポートしています。 機能を削除せずにこの問題に最も直接的に対処する調整はどれですか?"},"options":[{"k":"A","t":{"en":"Enable Tool Search so tool definitions are deferred and discovered on demand rather than loaded into context upfront.","vi":"Bật Tìm kiếm công cụ để các định nghĩa công cụ được trì hoãn và phát hiện theo yêu cầu thay vì được tải trước vào ngữ cảnh.","jp":"ツール検索を有効にすると、ツール定義は事前にコンテキストに読み込まれるのではなく、延期されてオンデマンドで検出されます。"}},{"k":"B","t":{"en":"Disable every MCP server in the configuration to free up context budget, accepting that the team loses all tool access and cannot perform any MCP-dependent task in the session.","vi":"Vô hiệu hóa mọi máy chủ MCP trong cấu hình để giải phóng ngân sách ngữ cảnh, chấp nhận rằng nhóm mất tất cả quyền truy cập vào công cụ và không thể thực hiện bất kỳ nhiệm vụ phụ thuộc MCP nào trong phiên.","jp":"コンテキスト バジェットを解放するには、構成内のすべての MCP サーバーを無効にし、チームがすべてのツールにアクセスできなくなり、セッション内で MCP に依存するタスクを実行できなくなることを受け入れます。"}},{"k":"C","t":{"en":"Increase the prompt's verbosity with additional instructions and context, which consumes more of the context budget rather than reducing the tool-definition overhead causing the issue.","vi":"Tăng mức độ chi tiết của lời nhắc bằng các hướng dẫn và ngữ cảnh bổ sung, việc này tiêu tốn nhiều ngân sách ngữ cảnh hơn là giảm chi phí định nghĩa công cụ gây ra sự cố.","jp":"追加の指示とコンテキストを使用してプロンプトの冗長性を高めます。これにより、問題の原因となるツール定義のオーバーヘッドが削減されるのではなく、コンテキスト バジェットがより多く消費されます。"}},{"k":"D","t":{"en":"Add additional MCP servers to give the team more capability, which increases rather than reduces the number of tool definitions loaded into the session's context budget.","vi":"Thêm các máy chủ MCP bổ sung để cung cấp cho nhóm nhiều khả năng hơn, điều này làm tăng thay vì giảm số lượng định nghĩa công cụ được tải vào ngân sách ngữ cảnh của phiên.","jp":"MCP サーバーを追加すると、チームにより多くの機能が提供されます。これにより、セッションのコンテキスト バジェットにロードされるツール定義の数は減りません。むしろ増加します。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Vấn đề là định nghĩa của 60+ MCP tool (tên, mô tả, JSON schema) được nạp hết vào context trước khi phiên bắt đầu. <b>Tool Search</b> áp dụng cơ chế <b>khám phá dần (deferred loading)</b>: Claude chỉ thấy thông tin tối thiểu và nạp định nghĩa đầy đủ của tool khi tác vụ thực sự cần. Nhờ vậy context được giải phóng cho instruction, code và lịch sử hội thoại mà <b>không mất năng lực</b> của bất kỳ server nào.","elim":["<b>B.</b> Tắt toàn bộ MCP server giải phóng context nhưng mất hết năng lực, trái với yêu cầu \"không loại bỏ capability\".","<b>C.</b> Thêm instruction dài dòng tiêu tốn thêm context, làm vấn đề nặng hơn chứ không giảm overhead định nghĩa tool.","<b>D.</b> Thêm MCP server làm tăng số định nghĩa tool nạp vào context, trực tiếp làm trầm trọng nguyên nhân gốc."]},"cite":"Hướng dẫn ôn tập — §1.5 Context Window; Lĩnh vực 2.4"},{"id":"ccarp-q006","n":6,"topic":1,"type":"mcq","stem":{"en":"You are reviewing an integration specification for security gaps. Which two findings constitute valid security gaps in the specification? (Select two.) Each correct answer presents a complete solution.  [Chọn 2 đáp án]","vi":"Bạn đang xem xét đặc tả tích hợp để tìm các lỗ hổng bảo mật. Hai phát hiện nào tạo thành lỗ hổng bảo mật hợp lệ trong đặc tả? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một giải pháp hoàn chỉnh.  [Chọn 2 đáp án]","jp":"あなたは、セキュリティギャップに関する統合仕様をレビューしています。 仕様における有効なセキュリティ ギャップを構成する 2 つの発見はどれですか? (2 つ選択してください。) それぞれの正解は完全な解決策を示します。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Tool calls execute server-side under a least-privilege service principal scoped to the requested action.","vi":"Các cuộc gọi công cụ thực thi phía máy chủ theo nguyên tắc dịch vụ có đặc quyền tối thiểu trong phạm vi hành động được yêu cầu.","jp":"ツール呼び出しは、要求されたアクションを範囲とする最小特権のサービス プリンシパルの下でサーバー側で実行されます。"}},{"k":"B","t":{"en":"Service credentials are placed in the prompt context, where they can leak into logs and traces.","vi":"Thông tin xác thực dịch vụ được đặt trong ngữ cảnh nhắc nhở, nơi chúng có thể bị rò rỉ vào nhật ký và dấu vết.","jp":"サービス資格情報はプロンプト コンテキストに配置されるため、ログやトレースに漏洩する可能性があります。"}},{"k":"C","t":{"en":"Role-based access control is enforced only at the response-rendering layer after the model accesses restricted data.","vi":"Kiểm soát truy cập dựa trên vai trò chỉ được thực thi ở lớp kết xuất phản hồi sau khi mô hình truy cập dữ liệu bị hạn chế.","jp":"ロールベースのアクセス制御は、モデルが制限されたデータにアクセスした後、応答レンダリング層でのみ適用されます。"}},{"k":"D","t":{"en":"Per-user OAuth tokens are exchanged with scope-restricted permissions and refreshed within the active session.","vi":"Mã thông báo OAuth cho mỗi người dùng được trao đổi với các quyền có giới hạn phạm vi và được làm mới trong phiên hoạt động.","jp":"ユーザーごとの OAuth トークンは、スコープが制限されたアクセス許可と交換され、アクティブなセッション内で更新されます。"}},{"k":"E","t":{"en":"Tool inputs and outputs are encrypted in transit using transport-layer security between services.","vi":"Đầu vào và đầu ra của công cụ được mã hóa trong quá trình truyền tải bằng cách sử dụng bảo mật lớp vận chuyển giữa các dịch vụ.","jp":"ツールの入力と出力は、サービス間のトランスポート層セキュリティを使用して転送中に暗号化されます。"}}],"answer":["B","C"],"multi":true,"explain":{"key":"<b>Đáp án B, C.</b> Hai phát hiện này là lỗ hổng thực sự vì chúng đặt dữ liệu nhạy cảm vào context mô hình trái phép.<br><b>B:</b> <b>Credential trong prompt context</b> có thể bị lưu trong log, trace, cache và bị mô hình vô tình lặp lại; credential phải được phân giải phía server qua secret store hoặc cơ chế ủy quyền.<br><b>C:</b> <b>RBAC chỉ ở tầng render</b> là quá muộn — dữ liệu bị hạn chế đã vào context và có thể rò qua tóm tắt, suy luận hoặc tool call; phân quyền phải áp dụng <b>trước khi truy xuất</b> và dựng prompt.","elim":["<b>A.</b> Thực thi tool phía server dưới service principal least-privilege, giới hạn theo hành động, là một kiểm soát đúng chứ không phải lỗ hổng.","<b>D.</b> Token OAuth theo từng người dùng với scope hạn chế và được refresh trong phiên là thực hành tốt về danh tính và ủy quyền.","<b>E.</b> Mã hóa dữ liệu khi truyền bằng TLS giữa các service là kiểm soát cơ bản đúng đắn, không phải lỗ hổng."]}},{"id":"ccarp-q007","n":7,"topic":1,"type":"mcq","stem":{"en":"You are investigating an MCP server that fails on first launch but succeeds on subsequent runs. System permission dialogs appeared during the first launch. Which response is most appropriate?","vi":"Bạn đang điều tra một máy chủ MCP không thành công trong lần khởi chạy đầu tiên nhưng thành công ở những lần chạy tiếp theo. Hộp thoại cấp phép hệ thống xuất hiện trong lần khởi chạy đầu tiên. Phản ứng nào là phù hợp nhất?","jp":"最初の起動では失敗するが、その後の実行では成功する MCP サーバーを調査しています。 最初の起動時にシステム許可ダイアログが表示されました。 どの対応が最も適切でしょうか?"},"options":[{"k":"A","t":{"en":"Recognize the first-run permission grant as the cause, document the expected behavior in onboarding guidance, and confirm that subsequent runs succeed.","vi":"Nhận biết việc cấp quyền cho lần chạy đầu tiên là nguyên nhân, ghi lại hành vi dự kiến ​​trong hướng dẫn triển khai và xác nhận rằng các lần chạy tiếp theo thành công.","jp":"最初の実行の権限付与が原因であることを認識し、オンボーディング ガイダンスで予想される動作を文書化し、その後の実行が成功することを確認します。"}},{"k":"B","t":{"en":"Reinstall the operating system to clear all permission state without first confirming whether the one- time permission grant caused the failure.","vi":"Cài đặt lại hệ điều hành để xóa tất cả trạng thái quyền mà không cần xác nhận trước xem việc cấp quyền một lần có gây ra lỗi hay không.","jp":"ワンタイム権限付与が失敗の原因であるかどうかを最初に確認せずに、オペレーティング システムを再インストールして、すべての権限状態をクリアします。"}},{"k":"C","t":{"en":"Disable operating-system permission dialogs entirely, accept the resulting security implications, and proceed without confirming whether the failure recurs.","vi":"Tắt hoàn toàn các hộp thoại cấp quyền của hệ điều hành, chấp nhận các tác động bảo mật phát sinh và tiếp tục mà không cần xác nhận xem lỗi có tái diễn hay không.","jp":"オペレーティング システムのアクセス許可ダイアログを完全に無効にし、その結果生じるセキュリティへの影響を受け入れ、エラーが再発するかどうかを確認せずに続行します。"}},{"k":"D","t":{"en":"Treat the first-run failure as a permanent fault, replace the MCP server, and do not verify whether subsequent runs succeed.","vi":"Hãy coi lỗi ở lần chạy đầu tiên là lỗi vĩnh viễn, thay thế máy chủ MCP và không xác minh xem các lần chạy tiếp theo có thành công hay không.","jp":"最初の実行の失敗を永続的な障害として扱い、MCP サーバーを交換し、その後の実行が成功するかどうかは検証しません。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Chuỗi sự kiện cung cấp bằng chứng nhân quả trực tiếp: lần chạy đầu bị gián đoạn khi hệ điều hành chờ người dùng <b>cấp quyền một lần</b>, các lần sau thành công vì quyền đã được cấp. Phản ứng đúng là <b>xác nhận hành vi lặp lại được</b>, rồi <b>ghi vào tài liệu onboarding</b> như một hành vi dự kiến. Cách này xử lý tương xứng với nguyên nhân mà không phá hủy trạng thái chẩn đoán hay làm suy yếu bảo mật.","elim":["<b>B.</b> Cài lại hệ điều hành là bất tương xứng, xóa trạng thái hữu ích cho chẩn đoán và không được dẫn dắt bởi bằng chứng.","<b>C.</b> Tắt hộp thoại cấp quyền của hệ điều hành làm suy yếu bảo mật endpoint chỉ để né một hành vi vốn bình thường.","<b>D.</b> Thay server đang hoạt động tốt ở các lần chạy sau là chẩn đoán sai; đây không phải lỗi vĩnh viễn."]}},{"id":"ccarp-q008","n":8,"topic":1,"type":"mcq","stem":{"en":"A technical team is cataloguing risks specific to Claude's use in a document-grounded Q &amp; A system. Which two items represent failure modes intrinsic to LLM-based systems rather than generic software defects? (Select two.)  [Chọn 2 đáp án]","vi":"Một nhóm kỹ thuật đang lập danh mục các rủi ro cụ thể liên quan đến việc sử dụng Claude trong hệ thống Hỏi &amp; Đáp dựa trên tài liệu. Hai mục nào thể hiện các chế độ lỗi nội tại của hệ thống dựa trên LLM thay vì các lỗi phần mềm chung? (Chọn 2.) [Chọn 2 đáp án]","jp":"技術チームは、文書に基づいた Q&amp;A システムでクロードの使用に特有のリスクをカタログ化しています。 一般的なソフトウェアの欠陥ではなく、LLM ベースのシステムに固有の障害モードを表す 2 つの項目はどれですか? (2 つ選択してください。) [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"An expired TLS certificate blocks outbound API calls to Claude.","vi":"Chứng chỉ TLS đã hết hạn sẽ chặn lệnh gọi API đi tới Claude.","jp":"有効期限が切れた TLS 証明書は、クロードへのアウトバウンド API 呼び出しをブロックします。"}},{"k":"B","t":{"en":"A database connection timeout causes retrieval to return an empty result set.","vi":"Hết thời gian chờ kết nối cơ sở dữ liệu khiến quá trình truy xuất trả về tập kết quả trống.","jp":"データベース接続がタイムアウトすると、取得時に空の結果セットが返されます。"}},{"k":"C","t":{"en":"The model refuses a legitimate query because surface features trigger an overly broad safety pattern.","vi":"Mô hình từ chối một truy vấn hợp pháp vì các tính năng bề mặt kích hoạt một mẫu an toàn quá rộng.","jp":"表面の特徴が過度に広範な安全パターンを引き起こすため、モデルは正当なクエリを拒否します。"}},{"k":"D","t":{"en":"A misconfigured load balancer routes requests to a deprecated API version.","vi":"Bộ cân bằng tải bị định cấu hình sai sẽ định tuyến các yêu cầu tới một phiên bản API không được dùng nữa.","jp":"ロード バランサーの構成が間違っていると、リクエストが非推奨の API バージョンにルーティングされます。"}},{"k":"E","t":{"en":"The model generates a plausible-sounding answer unsupported by any retrieved document.","vi":"Mô hình tạo ra một câu trả lời nghe có vẻ hợp lý mà không được hỗ trợ bởi bất kỳ tài liệu nào được truy xuất.","jp":"このモデルは、取得された文書によって裏付けられていない、もっともらしい答えを生成します。"}}],"answer":["C","E"],"multi":true,"explain":{"key":"<b>Đáp án C, E.</b> Đây là các rủi ro bắt nguồn từ <b>hành vi xác suất của mô hình</b>, xảy ra ngay cả khi hạ tầng hoạt động đúng.<br><b>C:</b> <b>Over-refusal</b> — mô hình từ chối câu hỏi hợp lệ vì đặc điểm bề mặt kích hoạt mẫu an toàn quá rộng.<br><b>E:</b> <b>Hallucination / thiếu grounding</b> — câu trả lời nghe hợp lý nhưng không được tài liệu truy xuất nào hỗ trợ. Cả hai đòi hỏi eval riêng cho mô hình, chỉ dẫn grounding, citation và cơ chế fallback.","elim":["<b>A.</b> Chứng chỉ TLS hết hạn là lỗi vận hành phần mềm/hạ tầng thông thường, không đặc thù cho LLM.","<b>B.</b> Timeout kết nối cơ sở dữ liệu là lỗi hệ thống phân tán điển hình, xảy ra với mọi ứng dụng có truy xuất dữ liệu.","<b>D.</b> Load balancer định tuyến sai phiên bản API là lỗi cấu hình hạ tầng chung, không phải chế độ lỗi nội tại của LLM."]}},{"id":"ccarp-q009","n":9,"topic":1,"type":"mcq","stem":{"en":"You are running a risk assessment on a planned Claude-based deployment and must complete the inventory steps before assessing threats against assets. Which two steps must be completed BEFORE assessing threats against assets to estimate likelihood and impact? (Select two.) Each correct answer presents part of the solution.  [Chọn 2 đáp án]","vi":"Bạn đang tiến hành đánh giá rủi ro khi triển khai dựa trên Claude theo kế hoạch và phải hoàn thành các bước kiểm kê trước khi đánh giá các mối đe dọa đối với tài sản. Hai bước nào phải được hoàn thành TRƯỚC KHI đánh giá các mối đe dọa đối với tài sản để ước tính khả năng và tác động? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một phần của giải pháp.  [Chọn 2 đáp án]","jp":"計画されたクロードベースの展開に対してリスク評価を実行しているため、資産に対する脅威を評価する前にインベントリの手順を完了する必要があります。 資産に対する脅威を評価して可能性と影響を見積もる前に、完了する必要がある 2 つの手順はどれですか? (2 つ選択してください。) それぞれの正解は、解決策の一部を示しています。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Document the assessment outcome with risks, mitigations, residual risk, and acceptance owners.","vi":"Ghi lại kết quả đánh giá với các rủi ro, biện pháp giảm nhẹ, rủi ro còn sót lại và chủ sở hữu chấp nhận.","jp":"リスク、緩和策、残留リスク、および受け入れ責任者を含む評価結果を文書化します。"}},{"k":"B","t":{"en":"Recommend mitigations and residual-risk acceptance for the risks that remain after analysis.","vi":"Đề xuất các biện pháp giảm thiểu và chấp nhận rủi ro còn lại đối với những rủi ro còn tồn tại sau khi phân tích.","jp":"分析後に残るリスクについては、緩和策と残留リスクの受け入れを推奨します。"}},{"k":"C","t":{"en":"Identify the assets that the deployment touches, along with the sensitivity of each asset.","vi":"Xác định các nội dung mà quá trình triển khai chạm đến, cùng với mức độ nhạy cảm của từng nội dung.","jp":"導入で影響を受ける資産と、各資産の機密性を特定します。"}},{"k":"D","t":{"en":"Recommend mitigations and residual-risk acceptance for risks that remain.","vi":"Đề xuất các biện pháp giảm thiểu và chấp nhận rủi ro còn lại đối với những rủi ro còn tồn tại.","jp":"残っているリスクについては、緩和策と残留リスクの受け入れを推奨します。"}},{"k":"E","t":{"en":"Enumerate the threat actors and attack vectors relevant to the deployment.","vi":"Liệt kê các tác nhân đe dọa và vectơ tấn công có liên quan đến việc triển khai.","jp":"導入に関連する脅威アクターと攻撃ベクトルを列挙します。"}}],"answer":["C","E"],"multi":true,"explain":{"key":"<b>Đáp án C, E.</b> Đánh giá khả năng xảy ra và tác động của mối đe dọa cần biết <b>cái gì cần bảo vệ</b> và <b>ai/cái gì đe dọa nó</b>.<br><b>C:</b> Kiểm kê <b>tài sản</b> mà hệ thống chạm tới (prompt, tài liệu truy xuất, credential, output, log, tool) cùng <b>mức độ nhạy cảm</b> — xác định mức tác động nếu bị xâm phạm.<br><b>E:</b> Liệt kê <b>threat actor và attack vector</b> (ví dụ prompt injection, rò dữ liệu qua tool) để có thể ước lượng likelihood cho từng cặp tài sản–mối đe dọa.","elim":["<b>A.</b> Ghi lại kết quả đánh giá, rủi ro tồn dư và người chấp nhận là bước cuối, sau khi đã đánh giá và đề xuất giảm thiểu.","<b>B.</b> Đề xuất biện pháp giảm thiểu và chấp nhận rủi ro tồn dư chỉ làm được sau khi đã phân tích likelihood và impact.","<b>D.</b> Cũng là đề xuất giảm thiểu cho rủi ro còn lại — thuộc giai đoạn sau đánh giá, không phải bước kiểm kê trước đó."]}},{"id":"ccarp-q010","n":10,"topic":1,"type":"mcq","stem":{"en":"You are compiling guardrail tactics for a customer-facing assistant. Which two tactics belong on the guardrail list? Each correct answer presents a complete solution.  [Chọn 2 đáp án]","vi":"Bạn đang biên soạn các chiến thuật lan can cho trợ lý tiếp xúc với khách hàng. Hai chiến thuật nào thuộc danh sách lan can? Mỗi câu trả lời đúng trình bày một giải pháp hoàn chỉnh.  [Chọn 2 đáp án]","jp":"あなたは、顧客対応アシスタント向けのガードレール戦術をまとめています。 ガードレールのリストに含まれる 2 つの戦術はどれですか? それぞれの正解は完全な解決策を示します。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Embed approved override phrases that let trusted users relax guardrails on demand.","vi":"Nhúng các cụm từ ghi đè đã được phê duyệt để cho phép người dùng đáng tin cậy nới lỏng các biện pháp bảo vệ theo yêu cầu.","jp":"承認されたオーバーライド フレーズを埋め込むと、信頼できるユーザーがオンデマンドでガードレールを緩和できるようになります。"}},{"k":"B","t":{"en":"Lower sampling temperature globally to reduce the chance of off-policy completions.","vi":"Giảm nhiệt độ lấy mẫu trên toàn cầu để giảm nguy cơ hoàn thành ngoài chính sách.","jp":"サンプリング温度を全体的に下げて、ポリシー違反の完了の可能性を減らします。"}},{"k":"C","t":{"en":"Validate the model output against a structured schema before downstream actions are taken.","vi":"Xác thực đầu ra của mô hình dựa trên lược đồ có cấu trúc trước khi thực hiện các hành động tiếp theo.","jp":"下流のアクションが実行される前に、構造化スキーマに対してモデル出力を検証します。"}},{"k":"D","t":{"en":"Layer prompt-level guardrails with runtime content checks rather than relying on either alone.","vi":"Lớp các biện pháp bảo vệ cấp độ nhắc nhở với kiểm tra nội dung thời gian chạy thay vì chỉ dựa vào một trong hai.","jp":"どちらか一方だけに依存するのではなく、実行時のコンテンツ チェックを使用してプロンプト レベルのガードレールを重ねます。"}},{"k":"E","t":{"en":"Rely on a single hardened system prompt that enumerates every disallowed behavior.","vi":"Dựa vào một lời nhắc hệ thống cứng nhắc liệt kê mọi hành vi không được phép.","jp":"すべての禁止された動作を列挙する単一の強化されたシステム プロンプトに依存します。"}}],"answer":["C","D"],"multi":true,"explain":{"key":"<b>Đáp án C, D.</b> Guardrail hiệu quả cần ranh giới tất định và phòng thủ nhiều lớp.<br><b>C:</b> <b>Validate output theo schema</b> trước khi hành động downstream tạo ranh giới tất định giữa output xác suất và hệ thống thực thi — chặn trường thiếu, kiểu sai, hành động không được phép (có thể dùng Structured Outputs/<code>tool_use</code> với JSON schema).<br><b>D:</b> <b>Defense in depth</b> — kết hợp guardrail ở prompt với kiểm tra nội dung lúc runtime (classifier, policy engine) để lớp này bù cho điểm yếu của lớp kia.","elim":["<b>A.</b> \"Câu thần chú\" override nhúng trong prompt chính là lỗ hổng có thể bị lộ hoặc bị kẻ tấn công lợi dụng; nới guardrail phải qua danh tính đã xác thực ngoài mô hình.","<b>B.</b> Giảm temperature chỉ giảm độ biến thiên, không phải guardrail an toàn; mô hình vẫn có thể tạo nội dung vi phạm ở temperature thấp.","<b>E.</b> Dựa vào một system prompt duy nhất là single point of failure; không thể liệt kê hết hành vi bị cấm và prompt có thể bị jailbreak."]},"cite":"Hướng dẫn ôn tập — §2.4 JSON Schema cho Structured Output; Lĩnh vực 4.3"},{"id":"ccarp-q011","n":11,"topic":1,"type":"mcq","stem":{"en":"You are diagnosing a Claude Code session whose subagent uses 50,000 tokens of context before the engineer types a single message. Which root cause is most likely?","vi":"Bạn đang chẩn đoán một phiên Mã Claude có tác nhân phụ sử dụng 50.000 mã thông báo ngữ cảnh trước khi kỹ sư nhập một tin nhắn. Nguyên nhân gốc rễ nào có khả năng xảy ra nhất?","jp":"エンジニアが 1 つのメッセージを入力する前に、サブエージェントが 50,000 個のコンテキスト トークンを使用するクロード コード セッションを診断しています。 どの根本原因が最も考えられますか?"},"options":[{"k":"A","t":{"en":"The developer's keyboard layout or input-method configuration is the cause of the elevated context consumption, introducing extra tokens before the engineer types any message.","vi":"Bố cục bàn phím hoặc cấu hình phương thức nhập của nhà phát triển là nguyên nhân khiến mức tiêu thụ ngữ cảnh tăng cao, đưa ra các mã thông báo bổ sung trước khi kỹ sư nhập bất kỳ thông báo nào.","jp":"開発者のキーボード レイアウトまたは入力方法の構成がコンテキストの消費量の増加の原因となり、エンジニアがメッセージを入力する前に余分なトークンが導入されます。"}},{"k":"B","t":{"en":"Many MCP servers are configured, each contributing tool definitions to the context budget; Tool Search is not enabled, so all definitions load upfront.","vi":"Nhiều máy chủ MCP được định cấu hình, mỗi máy chủ đóng góp các định nghĩa công cụ vào ngân sách ngữ cảnh; Tìm kiếm bằng công cụ chưa được bật nên tất cả các định nghĩa đều được tải trước.","jp":"多くの MCP サーバーが構成されており、それぞれがコンテキスト バジェットにツール定義を提供します。ツール検索が有効になっていないため、すべての定義が事前に読み込まれます。"}},{"k":"C","t":{"en":"The model has internal personal preferences or default behaviors that silently consume large portions of context budget before any user message is processed, independent of tool configuration.","vi":"Mô hình này có các tùy chọn cá nhân nội bộ hoặc hành vi mặc định âm thầm tiêu tốn phần lớn ngân sách ngữ cảnh trước khi bất kỳ thông báo nào của người dùng được xử lý, không phụ thuộc vào cấu hình công cụ.","jp":"このモデルには、ツールの設定とは関係なく、ユーザー メッセージが処理される前にコンテキスト バジェットの大部分を静かに消費する内部の個人的な設定またはデフォルトの動作があります。"}},{"k":"D","t":{"en":"The font rendering or display-scaling settings of the IDE are converting visual output into additional context tokens, causing the high pre-session context consumption.","vi":"Cài đặt hiển thị phông chữ hoặc tỷ lệ hiển thị của IDE đang chuyển đổi kết quả trực quan thành mã thông báo ngữ cảnh bổ sung, gây ra mức tiêu thụ ngữ cảnh trước phiên cao.","jp":"IDE のフォント レンダリングまたは表示スケーリング設定により、ビジュアル出力が追加のコンテキスト トークンに変換され、セッション前のコンテキスト消費量が増加します。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Context của Claude Code (và của subagent) được dựng <b>trước</b> tin nhắn đầu tiên, gồm system prompt, CLAUDE.md, cấu hình subagent, instruction của MCP server và <b>định nghĩa tool dưới dạng JSON schema</b>. Khi cấu hình nhiều MCP server, mỗi server đóng góp hàng loạt định nghĩa tool; nếu <b>Tool Search không được bật</b>, tất cả được nạp ngay từ đầu và dễ chiếm hàng chục nghìn token. Bật Tool Search hoặc thu hẹp tập server cho subagent là cách khắc phục trực tiếp.","elim":["<b>A.</b> Bố cục bàn phím hay bộ gõ không sinh token khi người dùng chưa gõ gì; giả thuyết này không có cơ chế giải thích.","<b>C.</b> Mô hình không có \"sở thích cá nhân\" ẩn tiêu tốn context; mức tiêu thụ ban đầu đến từ những gì harness nạp vào context.","<b>D.</b> Font chữ hay độ phóng to hiển thị của IDE không chuyển thành token trong context mô hình."]},"cite":"Hướng dẫn ôn tập — §1.5 Context Window; Lĩnh vực 2.4"},{"id":"ccarp-q012","n":12,"topic":1,"type":"mcq","stem":{"en":"A team manager wants all engineers working on the same repository to share identical MCP server definitions without manual synchronization. Which configuration approach satisfies this requirement?","vi":"Người quản lý nhóm muốn tất cả các kỹ sư làm việc trên cùng một kho lưu trữ chia sẻ các định nghĩa máy chủ MCP giống hệt nhau mà không cần đồng bộ hóa thủ công. Cách tiếp cận cấu hình nào đáp ứng yêu cầu này?","jp":"チーム マネージャーは、同じリポジトリで作業するすべてのエンジニアが手動で同期せずに同一の MCP サーバー定義を共有することを望んでいます。 この要件を満たす構成アプローチはどれですか?"},"options":[{"k":"A","t":{"en":"managed configuration pushed to all endpoints by the administrator","vi":"cấu hình được quản lý được quản trị viên đẩy tới tất cả các điểm cuối","jp":"管理者によってすべてのエンドポイントにプッシュされた管理構成"}},{"k":"B","t":{"en":"environment variables set at the operating-system level on each workstation","vi":"các biến môi trường được đặt ở cấp hệ điều hành trên mỗi máy trạm","jp":"各ワークステーションのオペレーティング システム レベルで設定される環境変数"}},{"k":"C","t":{"en":"project-scope .claude/settings.json and .mcp.json files committed to the repository","vi":"Các tệp .claude/settings.json và .mcp.json phạm vi dự án được cam kết với kho lưu trữ","jp":"リポジトリにコミットされた project-scope の .claude/settings.json および .mcp.json ファイル"}},{"k":"D","t":{"en":"each engineer maintains a personal ~/.claude/settings.json with the shared definitions","vi":"mỗi kỹ sư duy trì một ~/.claude/settings.json cá nhân với các định nghĩa được chia sẻ","jp":"各エンジニアは、共有定義を含む個人用 ~/.claude/settings.json を管理します。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Cấu hình cấp <b>dự án</b> là cơ chế dành cho thiết lập gắn với repository cần nhất quán giữa các cộng tác viên. <code>.mcp.json</code> ở gốc repo định nghĩa MCP server dùng chung và <code>.claude/settings.json</code> là settings dự án dùng chung; khi <b>commit vào version control</b>, mọi kỹ sư nhận cùng định nghĩa qua clone/pull, có review và lịch sử phiên bản. Secret có thể để dưới dạng biến môi trường (<code>${GITHUB_TOKEN}</code>) để không commit bí mật.","elim":["<b>A.</b> Managed configuration do admin đẩy xuống áp dụng toàn tổ chức, phù hợp cho chính sách bắt buộc, không phải để chia sẻ định nghĩa riêng của một repository do nhóm tự quản.","<b>B.</b> Biến môi trường trên từng máy phải thiết lập thủ công và dễ lệch nhau; chúng cũng không phải nơi định nghĩa MCP server.","<b>D.</b> <code>~/.claude/settings.json</code> là cấu hình cấp người dùng; mỗi người tự duy trì bản riêng chính là đồng bộ thủ công mà đề muốn tránh."]},"cite":"Hướng dẫn ôn tập — §4.3 Cấu hình MCP Server; Lĩnh vực 2.4"},{"id":"ccarp-q013","n":13,"topic":1,"type":"mcq","stem":{"en":"You are supporting an engineer whose Claude Code session reports a permission denial when the engineer expected the action to be allowed. Which resolution step is most appropriate?","vi":"Bạn đang hỗ trợ một kỹ sư có phiên Mã Claude báo cáo việc từ chối cấp phép khi kỹ sư đó mong đợi hành động đó sẽ được cho phép. Bước giải quyết nào là phù hợp nhất?","jp":"あなたは、アクションが許可されると予想していたにもかかわらず、クロード コード セッションでアクセス許可の拒否を報告するエンジニアをサポートしています。 どの解決手順が最も適切ですか?"},"options":[{"k":"A","t":{"en":"Tell the engineer to retry the denied action verbatim repeatedly until the denial stops appearing, without inspecting the active permission rules to determine whether the denial is intentional.","vi":"Yêu cầu kỹ sư thử lại nguyên văn hành động bị từ chối nhiều lần cho đến khi từ chối ngừng xuất hiện mà không kiểm tra các quy tắc cấp phép hoạt động để xác định xem việc từ chối có phải là cố ý hay không.","jp":"アクティブなアクセス許可ルールを検査して拒否が意図的であるかどうかを判断することなく、拒否が表示されなくなるまで、拒否されたアクションをそのまま繰り返し再試行するようにエンジニアに指示します。"}},{"k":"B","t":{"en":"Disable the permission system entirely across all scopes to remove the denial, eliminating all toolpattern and deny-rule controls rather than identifying and amending the specific rule.","vi":"Vô hiệu hóa hoàn toàn hệ thống cấp phép trên tất cả các phạm vi để loại bỏ việc từ chối, loại bỏ tất cả các biện pháp kiểm soát mẫu công cụ và quy tắc từ chối thay vì xác định và sửa đổi quy tắc cụ thể.","jp":"すべてのスコープで権限システムを完全に無効にして拒否を削除し、特定のルールを特定して修正するのではなく、すべてのツールパターンと拒否ルールの制御を削除します。"}},{"k":"C","t":{"en":"Inspect the active permission rules across all scopes-managed, command-line, local, project, and user-to identify which rule is denying the action and confirm whether it should be amended or remain denied.","vi":"Kiểm tra các quy tắc cấp phép hoạt động trên tất cả các phạm vi được quản lý, dòng lệnh, cục bộ, dự án và người dùng để xác định quy tắc nào đang từ chối hành động và xác nhận xem liệu quy tắc đó có nên được sửa đổi hay vẫn bị từ chối hay không.","jp":"すべてのスコープ (管理対象、コマンドライン、ローカル、プロジェクト、およびユーザー) にわたるアクティブな権限ルールを検査して、アクションを拒否しているルールを特定し、修正する必要があるか、拒否されたままにするかを確認します。"}},{"k":"D","t":{"en":"Grant the engineer unrestricted Bash access to bypass the specific rule causing the denial, removing all tool-pattern constraints rather than amending only the rule in question.","vi":"Cấp cho kỹ sư quyền truy cập Bash không hạn chế để bỏ qua quy tắc cụ thể gây ra sự từ chối, loại bỏ tất cả các ràng buộc về mẫu công cụ thay vì chỉ sửa đổi quy tắc được đề cập.","jp":"エンジニアに無制限の Bash アクセスを許可して、拒否の原因となっている特定のルールをバイパスし、問題のルールのみを修正するのではなく、すべてのツール パターンの制約を削除します。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Quyết định permission của Claude Code là <b>tất định</b> và chịu ảnh hưởng của nhiều scope: managed, command-line, local, project, user. <b>Managed policy có độ ưu tiên cao nhất</b>, và một <b>deny rule</b> ở bất kỳ scope áp dụng nào không thể bị allow rule nơi khác ghi đè. Vì vậy cần kiểm tra rule hiệu lực ở mọi scope để tìm đúng rule gây deny, rồi xác định đó là ranh giới bảo mật có chủ đích hay rule bị cấu hình sai, và chỉ sửa đúng rule đó nếu hợp lý.","elim":["<b>A.</b> Thử lại nguyên văn không thay đổi được quyết định permission tất định, và bỏ qua khả năng denial là có chủ đích.","<b>B.</b> Tắt toàn bộ hệ thống permission loại bỏ mọi kiểm soát chỉ để gỡ một denial, hoàn toàn bất tương xứng.","<b>D.</b> Cấp Bash không giới hạn để vòng qua rule vi phạm least privilege và có thể vô hiệu hóa ranh giới bảo mật cố ý."]}},{"id":"ccarp-q014","n":14,"topic":1,"type":"mcq","stem":{"en":"You are integrating Claude Code into the team's pull-request workflow. The team wants AIassisted review without removing human approval. Which integration design best fits this requirement?","vi":"Bạn đang tích hợp Mã Claude vào quy trình làm việc theo yêu cầu kéo của nhóm. Nhóm muốn đánh giá được hỗ trợ bởi AI mà không cần loại bỏ sự phê duyệt của con người. Thiết kế tích hợp nào phù hợp nhất với yêu cầu này?","jp":"あなたは、Claude Code をチームのプルリクエスト ワークフローに統合しています。チームは人間の承認を削除せずに AI 支援によるレビューを望んでいます。 この要件に最も適した統合設計はどれですか?"},"options":[{"k":"A","t":{"en":"Claude Code reviews the pull request and posts a structured analysis as a comment, while a human reviewer retains the approval decision under the existing branch-protection rules.","vi":"Claude Code xem xét yêu cầu kéo và đăng bản phân tích có cấu trúc dưới dạng nhận xét, trong khi người đánh giá vẫn giữ nguyên quyết định phê duyệt theo các quy tắc bảo vệ chi nhánh hiện có.","jp":"Claude Code はプル リクエストをレビューし、構造化分析をコメントとして投稿しますが、人間のレビュー担当者が既存のブランチ保護ルールに基づいて承認の決定を保持します。"}},{"k":"B","t":{"en":"Claude Code merges every pull request automatically after completing its analysis, bypassing human approval and the existing branch-protection rules.","vi":"Claude Code tự động hợp nhất mọi yêu cầu kéo sau khi hoàn thành quá trình phân tích, bỏ qua sự chấp thuận của con người và các quy tắc bảo vệ chi nhánh hiện có.","jp":"Claude Code は、分析完了後にすべてのプル リクエストを自動的にマージし、人間の承認や既存のブランチ保護ルールをバイパスします。"}},{"k":"C","t":{"en":"Claude Code disables all existing branch-protection rules to streamline the merge process, removing human approval as a required gate.","vi":"Mã Claude vô hiệu hóa tất cả các quy tắc bảo vệ chi nhánh hiện có để hợp lý hóa quy trình hợp nhất, loại bỏ sự chấp thuận của con người như một cổng bắt buộc.","jp":"Claude Code は既存のブランチ保護ルールをすべて無効にしてマージ プロセスを合理化し、必須のゲートとして人間による承認を排除します。"}},{"k":"D","t":{"en":"Claude Code silently deletes pull requests it assesses as low quality without posting a comment or notifying the author.","vi":"Claude Code âm thầm xóa các yêu cầu kéo mà nó đánh giá là chất lượng thấp mà không đăng bình luận hay thông báo cho tác giả.","jp":"Claude Code は、低品質と評価したプル リクエストを、コメントの投稿や作成者への通知を行わずにサイレントに削除します。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Yêu cầu là <b>AI hỗ trợ review nhưng giữ phê duyệt của con người</b>. Claude Code phân tích PR trong ngữ cảnh repo (lỗi logic, bảo mật, regression, khả năng bảo trì) và đăng <b>nhận xét có cấu trúc</b> để con người đánh giá. <b>Branch protection</b> hiện có vẫn bắt buộc reviewer người phê duyệt, bảo toàn trách nhiệm giải trình và phân tách nhiệm vụ — AI chỉ đóng vai trò tư vấn.","elim":["<b>B.</b> Tự động merge và bỏ qua branch protection biến năng lực tư vấn thành cơ chế phê duyệt không kiểm soát, trái yêu cầu giữ con người phê duyệt.","<b>C.</b> Gỡ bỏ branch protection loại bỏ chính cổng phê duyệt của con người mà đề yêu cầu giữ lại.","<b>D.</b> Âm thầm xóa PR không minh bạch, tác giả không được thông báo hay phản biện, và mô hình đang tự ra quyết định thay con người."]},"cite":"Hướng dẫn ôn tập — §5.9 Claude Code CLI cho CI/CD; Lĩnh vực 3.6"},{"id":"ccarp-q015","n":15,"topic":1,"type":"mcq","stem":{"en":"A platform team operates a self-hosted multi-agent system on Kubernetes that orchestrates seven specialized agents for invoice processing. The team spends approximately 40 percent of engineering capacity on infrastructure maintenance, message bus reliability, and agent state recovery. The CFO has asked you to evaluate moving to managed agent infrastructure to reclaim engineering capacity. The security officer requires that all customer financial data remain within an approved network boundary. Which factor should most heavily influence your recommendation?","vi":"Một nhóm nền tảng vận hành một hệ thống đa tác nhân tự lưu trữ trên Kubernetes, điều phối bảy tác nhân chuyên biệt để xử lý hóa đơn. Nhóm dành khoảng 40% năng lực kỹ thuật cho việc bảo trì cơ sở hạ tầng, độ tin cậy của bus thông báo và khôi phục trạng thái tác nhân. Giám đốc tài chính đã yêu cầu bạn đánh giá việc chuyển sang cơ sở hạ tầng đại lý được quản lý để lấy lại năng lực kỹ thuật. Nhân viên an ninh yêu cầu tất cả dữ liệu tài chính của khách hàng phải nằm trong ranh giới mạng đã được phê duyệt. Yếu tố nào sẽ ảnh hưởng nhiều nhất đến đề xuất của bạn?","jp":"プラットフォーム チームは、請求書処理のために 7 つの専門エージェントを調整する Kubernetes 上で自己ホスト型マルチエージェント システムを運用しています。チームはエンジニアリング能力の約 40% をインフラストラクチャのメンテナンス、メッセージ バスの信頼性、エージェント状態の回復に費やしています。 CFO は、エンジニアリング能力を取り戻すために、マネージド エージェント インフラストラクチャへの移行を評価するようあなたに依頼しました。セキュリティ担当者は、すべての顧客の財務データが承認されたネットワーク境界内に留まるように要求します。 あなたの推奨事項に最も大きな影響を与える要素はどれですか?"},"options":[{"k":"A","t":{"en":"Whether the current seven agents map cleanly to the patterns supported by managed agents.","vi":"Liệu bảy tác nhân hiện tại có ánh xạ rõ ràng tới các mẫu được hỗ trợ bởi các tác nhân được quản lý hay không.","jp":"現在の 7 つのエージェントが、管理対象エージェントによってサポートされているパターンに正しくマッピングされているかどうか。"}},{"k":"B","t":{"en":"Whether managed agents reduce per-invoice token costs across the existing processing volume.","vi":"Liệu các đại lý được quản lý có giảm chi phí mã thông báo trên mỗi hóa đơn trên khối lượng xử lý hiện có hay không.","jp":"管理対象エージェントが既存の処理量全体にわたって請求書ごとのトークン コストを削減するかどうか。"}},{"k":"C","t":{"en":"Whether managed agents support the current bus topology used by the platform team.","vi":"Liệu các tác nhân được quản lý có hỗ trợ cấu trúc liên kết bus hiện tại được nhóm nền tảng sử dụng hay không.","jp":"管理対象エージェントが、プラットフォーム チームが使用している現在のバス トポロジをサポートしているかどうか。"}},{"k":"D","t":{"en":"Whether managed agent data handling satisfies the network boundary required by security.","vi":"Việc xử lý dữ liệu tác nhân được quản lý có đáp ứng ranh giới mạng mà bảo mật yêu cầu hay không.","jp":"管理対象エージェントのデータ処理がセキュリティで必要なネットワーク境界を満たしているかどうか。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Yêu cầu dữ liệu tài chính khách hàng phải nằm trong ranh giới mạng được phê duyệt là một <b>ràng buộc bắt buộc (hard constraint)</b>, không phải tiêu chí để đánh đổi. Lợi ích vận hành của managed agents (bớt gánh nặng agent loop, state, recovery, orchestration) trở nên vô nghĩa nếu dữ liệu rời khỏi ranh giới. Do đó phải xác minh trước cách xử lý dữ liệu: nơi inference chạy, lưu trữ session, data residency, mã hóa, subprocessor, xử lý credential, audit.","elim":["<b>A.</b> Việc 7 agent ánh xạ vào mẫu của managed agents là yếu tố thiết kế quan trọng nhưng chỉ đáng xét sau khi ràng buộc bảo mật bắt buộc đã được thỏa.","<b>B.</b> Chi phí token mỗi hóa đơn là tối ưu thứ yếu; mục tiêu của CFO là thu hồi năng lực kỹ thuật, và chi phí không thể bù đắp vi phạm ranh giới dữ liệu.","<b>C.</b> Giữ nguyên topology message bus không phải mục tiêu; chuyển sang managed infrastructure chính là để thay thế phần tự vận hành này."]}},{"id":"ccarp-q016","n":16,"topic":1,"type":"mcq","stem":{"en":"You are producing an architecture guide for a new deployment and must complete the planning steps before drafting each section. Which two steps must be completed BEFORE drafting each section of the guide? (Select two.) Each correct answer presents part of the solution.  [Chọn 2 đáp án]","vi":"Bạn đang tạo hướng dẫn kiến ​​trúc cho lần triển khai mới và phải hoàn thành các bước lập kế hoạch trước khi soạn thảo từng phần. Hai bước nào phải được hoàn thành TRƯỚC KHI soạn th
