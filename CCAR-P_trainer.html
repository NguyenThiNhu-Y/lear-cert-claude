 ôn tập — §8.1 Pipeline cố định (Prompt Chaining); Lĩnh vực 1.6"},{"id":"ccarp-q067","n":67,"topic":4,"type":"mcq","stem":{"en":"A managed agent deployment for claims triage has grown from 6 tools to 34 tools over 18 months as product teams added capabilities. Triage accuracy has declined from 91 percent to 78 percent, and average tool- selection latency has increased by 2.3 seconds. A junior engineer has proposed adding a tool-router agent in front of the current agent to filter the tool list per request. Which two findings should you present to justify capability decomposition before adding the router? (Select two.) Each correct answer presents part of the solution.  [Chọn 2 đáp án]","vi":"Việc triển khai tác nhân được quản lý để phân loại khiếu nại đã tăng từ 6 công cụ lên 34 công cụ trong 18 tháng khi các nhóm sản phẩm bổ sung thêm các chức năng. Độ chính xác của việc phân loại đã giảm từ 91 phần trăm xuống 78 phần trăm và độ trễ lựa chọn công cụ trung bình đã tăng thêm 2,3 giây. Một kỹ sư cấp dưới đã đề xuất thêm một tác nhân định tuyến công cụ trước tác nhân hiện tại để lọc danh sách công cụ theo yêu cầu. Bạn nên trình bày hai phát hiện nào để biện minh cho việc phân rã khả năng trước khi thêm bộ định tuyến? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một phần của giải pháp.  [Chọn 2 đáp án]","jp":"製品チームが機能を追加したため、保険金請求のトリアージのためのマネージド エージェントの導入は、18 か月で 6 つのツールから 34 のツールに増加しました。トリアージの精度は 91% から 78% に低下し、ツール選択の平均待ち時間は 2.3 秒増加しました。若手エンジニアは、現在のエージェントの前にツール ルーター エージェントを追加して、リクエストごとにツール リストをフィルタリングすることを提案しました。 ルーターを追加する前に、機能の分解を正当化するには、どの 2 つの調査結果を提示する必要がありますか? (2 つ選択してください。) それぞれの正解は、解決策の一部を示しています。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Tool descriptions overlap across multiple claim categories within the agent's tool set.","vi":"Mô tả công cụ trùng lặp trên nhiều danh mục xác nhận quyền sở hữu trong bộ công cụ của tổng đài viên.","jp":"ツールの説明は、エージェントのツール セット内の複数の請求カテゴリにわたって重複しています。"}},{"k":"B","t":{"en":"Several tools have not been invoked across the most recent 90 days of traffic.","vi":"Một số công cụ đã không được gọi trong 90 ngày lưu lượng truy cập gần đây nhất.","jp":"いくつかのツールは、最近 90 日間のトラフィックにわたって呼び出されませんでした。"}},{"k":"C","t":{"en":"The 34 tools serve four distinct claim-workflow domains within the triage scope.","vi":"34 công cụ phục vụ bốn miền quy trình xác nhận quyền sở hữu riêng biệt trong phạm vi phân loại.","jp":"34 のツールは、トリアージ範囲内の 4 つの異なる請求ワークフロー ドメインに対応します。"}},{"k":"D","t":{"en":"The router pattern is well documented across publicly available agent literature.","vi":"Mẫu bộ định tuyến được ghi lại đầy đủ trên các tài liệu tác nhân có sẵn công khai.","jp":"ルーターのパターンは、一般に入手可能なエージェントの資料に詳しく文書化されています。"}},{"k":"E","t":{"en":"The proposed router introduces an additional model call on every incoming request.","vi":"Bộ định tuyến được đề xuất giới thiệu một cuộc gọi mô hình bổ sung cho mỗi yêu cầu đến.","jp":"提案されたルーターは、受信リクエストごとに追加のモデル呼び出しを導入します。"}}],"answer":["C","E"],"multi":true,"explain":{"key":"<b>Đáp án C, E.</b> Cần bằng chứng cho thấy vấn đề gốc là <b>phình năng lực (capability sprawl)</b>, và router chỉ là lớp vá.<br><b>C.</b> 34 tool phục vụ <b>bốn domain workflow riêng biệt</b> — agent đã vượt ra ngoài một ranh giới năng lực gắn kết. Tách thành các agent theo domain làm mỗi agent có ít tool hơn (quá nhiều tool làm giảm độ tin cậy chọn tool), prompt, quyền, eval và ownership rõ hơn.<br><b>E.</b> Router đề xuất thêm <b>một lời gọi mô hình cho mọi request</b>, tăng độ trễ (vốn đã tăng 2,3 giây), chi phí và thêm một điểm lỗi mà không sửa nguyên nhân gốc.","elim":["<b>A.</b> Mô tả tool chồng chéo là vấn đề cần sửa bằng cách viết lại mô tả cho rõ; nó không tự chứng minh cần phân rã năng lực.","<b>B.</b> Tool không được dùng 90 ngày chỉ cần gỡ bỏ — một biện pháp dọn dẹp, không phải lý do phân rã kiến trúc.","<b>D.</b> Router được tài liệu hóa rộng rãi là lập luận ủng hộ router chứ không biện minh cho phân rã trước; mức độ phổ biến cũng không phải tiêu chí kiến trúc."]},"cite":"Hướng dẫn ôn tập — Lĩnh vực 2.3 Phân bổ Tool Giữa các Agent và Cấu hình tool_choice"},{"id":"ccarp-q068","n":68,"topic":4,"type":"mcq","stem":{"en":"A Claude architect needs to ensure that a security-hardening flag cannot be disabled by any individual engineer after it is set. Which configuration scope correctly enforces this requirement?","vi":"Kiến trúc sư Claude cần đảm bảo rằng cờ tăng cường bảo mật không thể bị vô hiệu hóa bởi bất kỳ kỹ sư cá nhân nào sau khi nó được đặt. Phạm vi cấu hình nào thực thi chính xác yêu cầu này?","jp":"クロード アーキテクトは、セキュリティ強化フラグを設定した後、個々のエンジニアがそのフラグを無効にできないようにする必要があります。 この要件を正しく適用する構成スコープはどれですか?"},"options":[{"k":"A","t":{"en":"User scope (~/.claude/settings.json) on each engineer's machine","vi":"Phạm vi người dùng (~/.claude/settings.json) trên máy của mỗi kỹ sư","jp":"各エンジニアのマシン上のユーザー スコープ (~/.claude/settings.json)"}},{"k":"B","t":{"en":"Environment variable defined in the CI/CD pipeline only","vi":"Biến môi trường chỉ được xác định trong đường dẫn CI/CD","jp":"CI/CD パイプラインでのみ定義された環境変数"}},{"k":"C","t":{"en":"Managed configuration applied centrally and marked as non-overridable","vi":"Cấu hình được quản lý được áp dụng tập trung và được đánh dấu là không thể ghi đè","jp":"管理された構成は一元的に適用され、上書き不可能としてマークされます"}},{"k":"D","t":{"en":"Project scope (.claude/settings.json) committed to the repository","vi":"Phạm vi dự án (.claude/settings.json) được cam kết với kho lưu trữ","jp":"リポジトリにコミットされたプロジェクト スコープ (.claude/settings.json)"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> <b>Managed configuration</b> (managed settings do IT/DevOps triển khai tập trung) là scope dành cho chính sách bảo mật và tuân thủ toàn tổ chức mà người dùng không được ghi đè. Trong thứ tự ưu tiên của Claude Code, managed settings đứng cao nhất, vượt cả tham số dòng lệnh, local, project và user settings — nên cờ hardening đã đặt sẽ không thể bị một kỹ sư nào tự tắt.","elim":["<b>A.</b> User scope <code>~/.claude/settings.json</code> nằm trên máy từng kỹ sư, họ có thể sửa hoặc xóa bất kỳ lúc nào.","<b>B.</b> Biến môi trường chỉ trong pipeline CI/CD không áp dụng cho phiên làm việc cục bộ của kỹ sư và có thể bị thay đổi bởi người có quyền sửa pipeline.","<b>D.</b> Project scope <code>.claude/settings.json</code> commit trong repo có thể bị sửa qua commit, và bị local/managed settings xếp trên ghi đè — không phải ranh giới không ghi đè được."]}},{"id":"ccarp-q069","n":69,"topic":4,"type":"mcq","stem":{"en":"A Claude architect is auditing configuration scope assignments. Which two statements correctly identify an appropriate use of user-scope configuration versus other scopes? (Select two.)  [Chọn 2 đáp án]","vi":"Một kiến ​​trúc sư Claude đang kiểm tra các nhiệm vụ phạm vi cấu hình. Hai câu nào xác định chính xác cách sử dụng thích hợp cấu hình phạm vi người dùng so với các phạm vi khác? (Chọn 2.) [Chọn 2 đáp án]","jp":"クロード アーキテクトは、構成スコープの割り当てを監査しています。 ユーザー スコープ構成と他のスコープの適切な使用法を正しく特定している 2 つのステートメントはどれですか? (2 つ選択してください。) [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Persisting personal editor theme preferences that follow an engineer across projects.","vi":"Duy trì các tùy chọn chủ đề của biên tập viên cá nhân theo sát kỹ sư trong các dự án.","jp":"プロジェクト全体にわたってエンジニアに従う個人エディターのテーマ設定を保持します。"}},{"k":"B","t":{"en":"Saving a preferred Claude response language that applies to all repositories the engineer uses.","vi":"Lưu ngôn ngữ phản hồi Claude ưa thích áp dụng cho tất cả các kho lưu trữ mà kỹ sư sử dụng.","jp":"エンジニアが使用するすべてのリポジトリに適用される優先クロード応答言語を保存します。"}},{"k":"C","t":{"en":"Enforcing a company-wide policy that disables a feature for all engineers.","vi":"Thực thi chính sách toàn công ty nhằm vô hiệu hóa một tính năng cho tất cả kỹ sư.","jp":"すべてのエンジニアに対して機能を無効にする全社的なポリシーを適用します。"}},{"k":"D","t":{"en":"Defining MCP server endpoints shared by all contributors to a specific repository.","vi":"Xác định điểm cuối của máy chủ MCP được chia sẻ bởi tất cả những người đóng góp cho một kho lưu trữ cụ thể.","jp":"すべての寄稿者によって共有される MCP サーバー エンドポイントを特定のリポジトリに定義します。"}},{"k":"E","t":{"en":"Storing API authentication keys so they are not committed to version control.","vi":"Lưu trữ khóa xác thực API để chúng không được cam kết kiểm soát phiên bản.","jp":"API 認証キーを保存して、バージョン管理にコミットしないようにします。"}}],"answer":["A","B"],"multi":true,"explain":{"key":"<b>Đáp án A, B.</b> <b>User scope</b> (<code>~/.claude/settings.json</code>) áp dụng cho một kỹ sư trên mọi dự án, nên phù hợp với <b>sở thích cá nhân có tính di động</b>.<br><b>A.</b> Theme trình soạn thảo là sở thích riêng của từng người, đi theo kỹ sư qua mọi dự án.<br><b>B.</b> Ngôn ngữ phản hồi ưa thích của Claude (cài đặt <code>language</code>) là sở thích cá nhân, đặt ở user scope để áp dụng cho mọi repo kỹ sư dùng.","elim":["<b>C.</b> Chính sách toàn công ty tắt một tính năng thuộc managed scope — phải triển khai tập trung và không thể bị cá nhân ghi đè.","<b>D.</b> MCP server dùng chung cho mọi người đóng góp vào một repo thuộc project scope (<code>.mcp.json</code> commit trong repo), không phải user scope.","<b>E.</b> Khóa API là bí mật, cần trình quản lý credential/biến môi trường hoặc settings local không commit; xếp nó vào nhóm sở thích user scope là gán sai mục đích của scope."]},"cite":"Hướng dẫn ôn tập — §4.3 Cấu hình MCP Server; §5.1 Phân cấp CLAUDE.md"},{"id":"ccarp-q070","n":70,"topic":4,"type":"mcq","stem":{"en":"You are compiling factors that should drive the choice between Model Context Protocol (MCP), direct API integration, and agent-to-agent handoff. Which two factors belong on the list? (Select two.) Each correct answer presents a complete solution.  [Chọn 2 đáp án]","vi":"Bạn đang tổng hợp các yếu tố sẽ thúc đẩy sự lựa chọn giữa Giao thức bối cảnh mô hình (MCP), tích hợp API trực tiếp và chuyển giao giữa các tác nhân. Hai yếu tố nào thuộc danh sách? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một giải pháp hoàn chỉnh.  [Chọn 2 đáp án]","jp":"モデル コンテキスト プロトコル (MCP)、直接 API 統合、エージェント間のハンドオフのいずれかを選択する要因をまとめています。 リストに含まれる 2 つの要素はどれですか? (2 つ選択してください。) それぞれの正解は完全な解決策を示します。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Whether the vendor publishes detailed reference documentation for each candidate protocol.","vi":"Liệu nhà cung cấp có xuất bản tài liệu tham khảo chi tiết cho từng giao thức ứng viên hay không.","jp":"ベンダーが各候補プロトコルの詳細なリファレンス ドキュメントを公開しているかどうか。"}},{"k":"B","t":{"en":"Whether the team has prior implementation experience with any of the candidate protocols.","vi":"Liệu nhóm có kinh nghiệm triển khai trước đó với bất kỳ giao thức ứng viên nào hay không.","jp":"チームが候補プロトコルのいずれかを以前に実装した経験があるかどうか。"}},{"k":"C","t":{"en":"Whether the underlying transport supports encryption in transit between the integrated services.","vi":"Liệu phương tiện truyền tải cơ bản có hỗ trợ mã hóa trong quá trình truyền tải giữa các dịch vụ tích hợp hay không.","jp":"基盤となるトランスポートが、統合サービス間の転送中の暗号化をサポートしているかどうか。"}},{"k":"D","t":{"en":"Whether the integration must be portable across multiple AI clients in the ecosystem.","vi":"Liệu việc tích hợp có phải có khả năng di động trên nhiều máy khách AI trong hệ sinh thái hay không.","jp":"統合がエコシステム内の複数の AI クライアント間で移植可能である必要があるかどうか。"}},{"k":"E","t":{"en":"Whether the interaction is stateless and latency-sensitive or stateful and longer-running.","vi":"Cho dù tương tác là không trạng thái và nhạy cảm với độ trễ hay có trạng thái và chạy lâu hơn.","jp":"インタラクションがステートレスで遅延の影響を受けやすいか、ステートフルで長時間実行されるか。"}}],"answer":["D","E"],"multi":true,"explain":{"key":"<b>Đáp án D, E.</b> Hai yếu tố này quyết định kiến trúc tích hợp.<br><b>D.</b> <b>Tính di động qua nhiều AI client</b>: nếu tool/nguồn dữ liệu cần dùng lại cho nhiều client tương thích, <b>MCP</b> cung cấp giao diện chuẩn hóa; nếu chỉ một ứng dụng dùng, tích hợp API trực tiếp đơn giản hơn.<br><b>E.</b> <b>Mô hình tương tác</b>: lời gọi stateless, nhạy độ trễ hợp với API trực tiếp; tương tác stateful, chạy lâu với trách nhiệm ủy quyền độc lập hợp với agent-to-agent handoff.","elim":["<b>A.</b> Chất lượng tài liệu tham chiếu ảnh hưởng công sức triển khai, không quyết định cơ chế nào phù hợp về kiến trúc.","<b>B.</b> Kinh nghiệm sẵn có của nhóm ảnh hưởng tốc độ học, nhưng chọn theo quen thuộc thay vì yêu cầu là sai tiêu chí.","<b>C.</b> Mã hóa khi truyền là yêu cầu nền tảng bắt buộc với mọi phương án, nên không phân biệt được giữa MCP, API trực tiếp và handoff."]},"cite":"Hướng dẫn ôn tập — §4.1 MCP là gì"},{"id":"ccarp-q071","n":71,"topic":4,"type":"mcq","stem":{"en":"You are selecting a protocol for a single low-latency stateless tool call from a Claude-based assistant to an internal pricing service that already exposes a stable HTTP API. Which integration mechanism is the most appropriate?","vi":"Bạn đang chọn một giao thức cho một lệnh gọi công cụ không trạng thái có độ trễ thấp từ trợ lý dựa trên Claude đến dịch vụ định giá nội bộ đã cung cấp API HTTP ổn định. Cơ chế tích hợp nào là phù hợp nhất?","jp":"クロードベースのアシスタントから安定した HTTP API をすでに公開している内部価格設定サービスへの、単一の低遅延ステートレス ツール呼び出し用のプロトコルを選択しています。 どの統合メカニズムが最も適切ですか?"},"options":[{"k":"A","t":{"en":"A direct API call to the existing endpoint with the appropriate scoped credentials.","vi":"Lệnh gọi API trực tiếp đến điểm cuối hiện có với thông tin xác thực có phạm vi phù hợp.","jp":"適切な範囲の資格情報を使用した、既存のエンドポイントへの直接 API 呼び出し。"}},{"k":"B","t":{"en":"A long-lived stateful session protocol for a stateless single-call interaction.","vi":"Giao thức phiên trạng thái tồn tại lâu dài dành cho tương tác một cuộc gọi không trạng thái.","jp":"ステートレスな単一呼び出しインタラクションのための、長期間有効なステートフル セッション プロトコル。"}},{"k":"C","t":{"en":"A bespoke streaming protocol layered over an unrelated asynchronous message bus.","vi":"Một giao thức truyền phát riêng biệt được xếp lớp trên một bus tin nhắn không đồng bộ không liên quan.","jp":"無関係な非同期メッセージ バスの上に重ねられた特注のストリーミング プロトコル。"}},{"k":"D","t":{"en":"An agent-to-agent handoff that introduces another Claude-based agent in front of the pricing service.","vi":"Sự chuyển giao giữa đại lý với đại lý nhằm giới thiệu một đại lý khác có trụ sở tại Claude trước dịch vụ định giá.","jp":"価格設定サービスの前に別のクロードベースのエージェントを導入するエージェント間のハンドオフ。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Yêu cầu là <b>một lời gọi stateless, độ trễ thấp</b> tới dịch vụ đã có <b>HTTP API ổn định</b>. Gọi trực tiếp endpoint đó (bọc trong một tool) với <b>credential phân quyền hẹp</b> là cơ chế đơn giản nhất thỏa mãn mọi yêu cầu: ít hop mạng nhất, ít phụ thuộc và điểm lỗi nhất. Phần triển khai tool nên validate tham số, xác thực phía server, đặt timeout rõ ràng và kiểm tra response.","elim":["<b>B.</b> Giao thức phiên dài stateful cho tương tác một lần stateless thêm quản lý session và độ phức tạp không cần thiết.","<b>C.</b> Giao thức streaming tự chế trên message bus bất đồng bộ không liên quan thêm độ trễ, chuyển đổi dữ liệu và rủi ro vận hành.","<b>D.</b> Đặt thêm một agent Claude trước dịch vụ giá thêm một lời gọi mô hình, tăng độ trễ, chi phí và tính bất định cho một phép gọi API đơn giản."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool"},{"id":"ccarp-q072","n":72,"topic":4,"type":"mcq","stem":{"en":"A Claude architect observes that after a recent model-version upgrade, grounded responses began including claims not supported by the retrieved source documents. Which mitigation is most directly targeted at this failure mode?","vi":"Một kiến ​​trúc sư Claude nhận thấy rằng sau lần nâng cấp phiên bản mô hình gần đây, các phản hồi có cơ sở đã bắt đầu bao gồm các tuyên bố không được hỗ trợ bởi các tài liệu nguồn được truy xuất. Biện pháp giảm thiểu nào được nhắm mục tiêu trực tiếp nhất vào chế độ lỗi này?","jp":"クロード アーキテクトは、最近のモデル バージョンのアップグレード後、根拠のある応答に、取得したソース ドキュメントでサポートされていない主張が含まれるようになったと観察しています。 この障害モードを最も直接的にターゲットにした緩和策はどれですか?"},"options":[{"k":"A","t":{"en":"Constrain responses to source-supported content, require citations, and add a verification step.","vi":"Hạn chế phản hồi đối với nội dung được nguồn hỗ trợ, yêu cầu trích dẫn và thêm bước xác minh.","jp":"回答をソースでサポートされているコンテンツに制限し、引用を要求し、検証ステップを追加します。"}},{"k":"B","t":{"en":"Score each new model version against a stable adversarial evaluation set.","vi":"Cho điểm từng phiên bản mô hình mới dựa trên bộ đánh giá đối thủ ổn định.","jp":"安定した敵対的評価セットに対して新しいモデルの各バージョンをスコア付けします。"}},{"k":"C","t":{"en":"Replace the shared API key with per-user OAuth tokens to restrict data access.","vi":"Thay thế khóa API dùng chung bằng mã thông báo OAuth cho mỗi người dùng để hạn chế quyền truy cập dữ liệu.","jp":"共有 API キーをユーザーごとの OAuth トークンに置き換えて、データ アクセスを制限します。"}},{"k":"D","t":{"en":"Treat retrieved data as untrusted and apply input classifiers at ingestion time.","vi":"Hãy coi dữ liệu được truy xuất là không đáng tin cậy và áp dụng các bộ phân loại đầu vào tại thời điểm nhập.","jp":"取得したデータを信頼できないものとして扱い、取り込み時に入力分類子を適用します。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Lỗi quan sát được là <b>lỗi grounding</b>: câu trả lời chứa nhận định không truy vết được về tài liệu truy xuất. Biện pháp nhắm thẳng vào đó là <b>ràng buộc câu trả lời vào nội dung có nguồn</b>, <b>bắt buộc trích dẫn</b> và thêm <b>bước xác minh</b> rằng mỗi nhận định quan trọng có đoạn văn hỗ trợ — nhận định không có nguồn bị loại, đánh dấu không chắc chắn, hoặc thay bằng thông báo nguồn không đủ.","elim":["<b>B.</b> Chấm điểm phiên bản mô hình trên tập adversarial có thể phát hiện regression nhưng không ngăn được nhận định không có nguồn trong câu trả lời; tập adversarial cũng nhắm vào tấn công chứ không phải groundedness.","<b>C.</b> OAuth theo người dùng giải quyết danh tính và phân quyền dữ liệu, không liên quan đến việc mô hình bịa nội dung.","<b>D.</b> Coi dữ liệu truy xuất là không tin cậy và dùng input classifier là phòng chống prompt injection, không phải sửa lỗi hallucination khi nguồn hợp lệ."]},"cite":"Hướng dẫn ôn tập — §12.1 Vấn đề Mất Quy kết Nguồn; Lĩnh vực 5.6"},{"id":"ccarp-q073","n":73,"topic":4,"type":"mcq","stem":{"en":"You are defining escalation criteria for ambiguous cases in an automated workflow. Which set of criteria best supports consistent escalation?","vi":"Bạn đang xác định tiêu chí leo thang cho các trường hợp không rõ ràng trong quy trình làm việc tự động. Bộ tiêu chí nào hỗ trợ tốt nhất cho việc leo thang nhất quán?","jp":"自動化されたワークフローであいまいなケースのエスカレーション基準を定義しています。 一貫したエスカレーションを最もよくサポートする基準セットはどれですか?"},"options":[{"k":"A","t":{"en":"No escalation criteria; the model decides independently on every turn whether to escalate, without explicit confidence thresholds, impact categories, or classifier-based ambiguity flags.","vi":"Không có tiêu chí leo thang; mô hình quyết định một cách độc lập ở mỗi lượt xem có nên leo thang hay không mà không có ngưỡng tin cậy rõ ràng, danh mục tác động hoặc cờ mơ hồ dựa trên phân loại.","jp":"エスカレーション基準はありません。モデルは、明示的な信頼しきい値、影響カテゴリー、または分類子ベースの曖昧性フラグを使用せずに、エスカレーションするかどうかを毎ターン独立して決定します。"}},{"k":"B","t":{"en":"Escalation only after an affected customer has contacted support to complain, after the automated workflow has already completed without human review.","vi":"Chỉ chuyển lên cấp cao hơn sau khi khách hàng bị ảnh hưởng đã liên hệ với bộ phận hỗ trợ để khiếu nại, sau khi quy trình làm việc tự động đã hoàn tất mà không có sự đánh giá của con người.","jp":"エスカレーションは、影響を受ける顧客がサポートに苦情を連絡した後、自動化されたワークフローが人間によるレビューなしですでに完了した後にのみ行われます。"}},{"k":"C","t":{"en":"Escalation at the discretion of whoever is available when the team's on-call engineer has spare capacity, without a defined threshold, category, or ambiguity criterion.","vi":"Nâng cấp theo quyết định của bất kỳ ai có mặt khi kỹ sư trực của nhóm có năng lực dự phòng mà không có ngưỡng, danh mục hoặc tiêu chí mơ hồ xác định.","jp":"定義されたしきい値、カテゴリ、または曖昧さの基準なしで、チームのオンコール エンジニアに余裕がある場合に対応可能な担当者の裁量でエスカレーションします。"}},{"k":"D","t":{"en":"A confidence score below a defined threshold, presence of high-impact decision categories, ambiguity flags raised by content classifiers, and the user's explicit request for review.","vi":"Điểm tin cậy dưới ngưỡng xác định, sự hiện diện của các danh mục quyết định có tác động cao, cờ mơ hồ do bộ phân loại nội dung đưa ra và yêu cầu xem xét rõ ràng của người dùng.","jp":"定義されたしきい値を下回る信頼スコア、影響の大きい決定カテゴリの存在、コンテンツ分類子によって生成された曖昧さフラグ、およびユーザーの明示的なレビュー要求。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Escalation nhất quán cần các <b>trigger quan sát được và lặp lại được</b>: <b>confidence dưới ngưỡng xác định</b> (hệ thống không đủ chắc chắn), <b>nhóm quyết định tác động cao</b> (luôn cần con người dù confidence cao), <b>cờ mơ hồ từ content classifier</b> (một kiểm soát độc lập) và <b>yêu cầu review tường minh của người dùng</b> (tôn trọng quyền được con người xem xét). Các trigger này cần được tài liệu hóa, kiểm thử và log lại.","elim":["<b>A.</b> Để mô hình tự quyết mọi lượt mà không có ngưỡng hay tiêu chí khiến escalation không nhất quán và không thể audit.","<b>B.</b> Chỉ escalate sau khi khách hàng khiếu nại là quá muộn — quyết định đã hoàn tất và gây hại trước khi con người tham gia.","<b>C.</b> Escalate tùy theo người đang rảnh không có tiêu chí xác định, kết quả phụ thuộc lịch trực chứ không phụ thuộc rủi ro của ca."]},"cite":"Hướng dẫn ôn tập — §9.1 Khi nào escalation lên cho con người; Lĩnh vực 5.2"},{"id":"ccarp-q074","n":74,"topic":4,"type":"mcq","stem":{"en":"After a prompt-template update, several previously passing test cases now produce unexpected outputs. Which test type is specifically designed to detect this category of failure?","vi":"Sau khi cập nhật mẫu nhắc nhở, một số trường hợp thử nghiệm đã vượt qua trước đây hiện tạo ra kết quả đầu ra không mong muốn. Loại thử nghiệm nào được thiết kế đặc biệt để phát hiện loại lỗi này?","jp":"プロンプト テンプレートの更新後、以前に合格したいくつかのテスト ケースが予期しない出力を生成するようになりました。 このカテゴリの障害を検出するために特別に設計されたテスト タイプはどれですか?"},"options":[{"k":"A","t":{"en":"Integration tests that validate cross-component pipeline behavior.","vi":"Kiểm tra tích hợp xác nhận hành vi đường ống nhiều thành phần.","jp":"コンポーネント間のパイプライン動作を検証する統合テスト。"}},{"k":"B","t":{"en":"Adversarial tests that probe for prompt-injection vulnerabilities.","vi":"Các thử nghiệm đối nghịch nhằm thăm dò các lỗ hổng được tiêm nhanh.","jp":"プロンプトインジェクションの脆弱性を調査する敵対的テスト。"}},{"k":"C","t":{"en":"Regression tests scored against a stable reference set of known-good behavior.","vi":"Các bài kiểm tra hồi quy được tính điểm dựa trên một tập hợp tham chiếu ổn định về hành vi được biết đến là tốt.","jp":"回帰テストは、既知の良好な動作の安定した参照セットに対してスコアを付けました。"}},{"k":"D","t":{"en":"Smoke tests that confirm high-level system availability after the change.","vi":"Kiểm tra khói xác nhận tính khả dụng của hệ thống cấp cao sau khi thay đổi.","jp":"変更後の高レベルのシステム可用性を確認するスモーク テスト。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Triệu chứng là các ca <b>trước đây pass nay cho kết quả bất ngờ sau một thay đổi</b> — đúng định nghĩa <b>regression</b>. <b>Regression test</b> chạy cùng đầu vào, cùng kỳ vọng và cùng tiêu chí chấm trên một <b>tập tham chiếu ổn định</b> qua các phiên bản prompt, nên quy được lỗi cho bản cập nhật template. Các ca lỗi nên được giữ trong bộ regression và so sánh phiên bản cũ/mới trước khi release.","elim":["<b>A.</b> Integration test kiểm tra tương tác giữa các thành phần, không được thiết kế để phát hiện suy giảm hành vi đầu ra chi tiết sau thay đổi prompt.","<b>B.</b> Adversarial test dò lỗ hổng prompt injection và lạm dụng, không phải so sánh với hành vi tốt đã biết.","<b>D.</b> Smoke test chỉ xác nhận hệ thống còn khả dụng ở mức cao, không bắt được thay đổi tinh tế trong nội dung đầu ra."]}},{"id":"ccarp-q075","n":75,"topic":4,"type":"mcq","stem":{"en":"A Claude architect at a health services organization is defining evaluation metrics for a clinical-summary pipeline. The pipeline must remain within a per-query cost ceiling and must never surface patient data to unauthorized roles. Which two metrics directly address these requirements? (Select two.)  [Chọn 2 đáp án]","vi":"Kiến trúc sư Claude tại một tổ chức dịch vụ y tế đang xác định các số liệu đánh giá cho quy trình tóm tắt lâm sàng. Quy trình phải duy trì trong mức trần chi phí cho mỗi truy vấn và không bao giờ được chuyển dữ liệu bệnh nhân sang các vai trò trái phép. Hai số liệu nào trực tiếp giải quyết các yêu cầu này? (Chọn 2.) [Chọn 2 đáp án]","jp":"医療サービス組織のクロード アーキテクトは、臨床概要パイプラインの評価指標を定義しています。パイプラインはクエリごとのコスト上限内にとどまる必要があり、患者データを許可されていない役割に決して公開してはなりません。 これらの要件に直接対応する 2 つの指標はどれですか? (2 つ選択してください。) [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"BLEU score computed against a human-annotated reference summary set","vi":"Điểm BLEU được tính toán dựa trên tập hợp tóm tắt tham chiếu có chú thích của con người","jp":"人間が注釈を付けた参照概要セットに対して計算された BLEU スコア"}},{"k":"B","t":{"en":"Role-based access-control enforcement rate measured on a red-team dataset","vi":"Tỷ lệ thực thi kiểm soát truy cập dựa trên vai trò được đo trên tập dữ liệu của đội đỏ","jp":"レッドチーム データセットで測定されたロールベースのアクセス制御の適用率"}},{"k":"C","t":{"en":"Throughput measured as successful requests processed per minute","vi":"Thông lượng được đo bằng các yêu cầu được xử lý thành công mỗi phút","jp":"スループットは、1 分あたりに処理された成功したリクエストとして測定されます"}},{"k":"D","t":{"en":"Per-query token cost measured against the defined cost ceiling","vi":"Chi phí mã thông báo cho mỗi truy vấn được đo dựa trên mức trần chi phí đã xác định","jp":"定義されたコスト上限に対して測定されたクエリごとのトークン コスト"}},{"k":"E","t":{"en":"Response latency at the 95th percentile across a one-week sample window","vi":"Độ trễ phản hồi ở phân vị thứ 95 trong khoảng thời gian mẫu một tuần","jp":"1 週間のサンプル期間における 95 パーセンタイルでの応答待ち時間"}}],"answer":["B","D"],"multi":true,"explain":{"key":"<b>Đáp án B, D.</b> Metric phải ánh xạ trực tiếp vào hai yêu cầu đã nêu.<br><b>B.</b> <b>Tỷ lệ thực thi RBAC đo trên tập red-team</b> kiểm tra xem truy cập từ danh tính/vai trò không được phép có luôn bị từ chối không — biến yêu cầu ‘không bao giờ lộ dữ liệu bệnh nhân cho vai trò trái phép’ thành chỉ số bảo mật quan sát được, ngưỡng chấp nhận gần như 100%.<br><b>D.</b> <b>Chi phí token mỗi truy vấn so với trần chi phí</b> đo trực tiếp ràng buộc ngân sách mỗi query.","elim":["<b>A.</b> BLEU đo độ trùng lặp từ ngữ với bản tóm tắt tham chiếu — liên quan chất lượng, không phải chi phí hay kiểm soát truy cập.","<b>C.</b> Throughput đo năng lực xử lý, không cho biết chi phí mỗi truy vấn có vượt trần hay dữ liệu có bị lộ không.","<b>E.</b> Độ trễ p95 là chỉ số hiệu năng, không phải yêu cầu được nêu trong đề."]}},{"id":"ccarp-q076","n":76,"topic":4,"type":"mcq","stem":{"en":"You are choosing the level of detail for an implementation guide. The audience is a delivery team that will build the deployment. Which guidance composition best serves them?","vi":"Bạn đang chọn mức độ chi tiết cho hướng dẫn triển khai. Đối tượng là nhóm phân phối sẽ xây dựng quá trình triển khai. Thành phần hướng dẫn nào phục vụ họ tốt nhất?","jp":"実装ガイドの詳細レベルを選択しています。対象者は、デプロイメントを構築する配信チームです。 どのガイダンス構成が彼らに最も役立つでしょうか?"},"options":[{"k":"A","t":{"en":"Component responsibilities, contracts between components, sequence diagrams of the dominant flows, configuration parameters with defaults, and operational runbooks.","vi":"Trách nhiệm của thành phần, hợp đồng giữa các thành phần, sơ đồ tuần tự của các luồng chính, tham số cấu hình có giá trị mặc định và sổ sách vận hành.","jp":"コンポーネントの責任、コンポーネント間の契約、主要なフローのシーケンス図、デフォルトの構成パラメーター、および運用ランブック。"}},{"k":"B","t":{"en":"Component responsibilities and interface contracts only, without sequence diagrams of the dominant flows, configuration parameters with defaults, or runbooks to guide operational tasks.","vi":"Chỉ có trách nhiệm của thành phần và hợp đồng giao diện, không có sơ đồ tuần tự của các luồng chính, các tham số cấu hình có giá trị mặc định hoặc sổ sách hướng dẫn các tác vụ vận hành.","jp":"コンポーネントの責任とインターフェイス コントラクトのみ。主要なフローのシーケンス図、デフォルトの構成パラメーター、または運用タスクをガイドするランブックはありません。"}},{"k":"C","t":{"en":"An architecture overview and sequence diagrams for the dominant flows, without interface contracts, configuration-parameter tables, or operational runbooks for the delivery team to follow.","vi":"Tổng quan về kiến ​​trúc và sơ đồ trình tự cho các luồng chính, không có hợp đồng giao diện, bảng tham số cấu hình hoặc sổ tay vận hành để nhóm phân phối tuân theo.","jp":"主要なフローのアーキテクチャの概要とシーケンス図。インターフェイス契約、構成パラメータ テーブル、配信チームが従う運用手順書は含まれていません。"}},{"k":"D","t":{"en":"An architecture overview and a list of known limitations, without component-level diagrams, interface contracts, configuration parameters, or operational runbooks to support implementation.","vi":"Tổng quan về kiến ​​trúc và danh sách các hạn chế đã biết, không có sơ đồ cấp thành phần, hợp đồng giao diện, tham số cấu hình hoặc sổ sách vận hành để hỗ trợ triển khai.","jp":"アーキテクチャの概要と既知の制限のリスト。コンポーネント レベルの図、インターフェイス契約、構成パラメータ、実装をサポートする運用ブックは含まれていません。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Đội delivery cần hướng dẫn <b>ở mức triển khai</b>, không phải tóm tắt kiến trúc. <b>Trách nhiệm thành phần</b> xác định ranh giới sở hữu; <b>contract giữa các thành phần</b> định nghĩa schema, input, output, lỗi; <b>sequence diagram cho luồng chính</b> cho thấy các thành phần tương tác thế nào; <b>bảng tham số cấu hình kèm giá trị mặc định</b> tránh giả định lệch giữa các môi trường; <b>runbook vận hành</b> bảo đảm triển khai, khôi phục, giám sát được tính tới ngay từ đầu.","elim":["<b>B.</b> Có trách nhiệm và contract nhưng thiếu sequence diagram, tham số cấu hình và runbook — đội không thấy luồng tương tác và không biết cấu hình/vận hành ra sao.","<b>C.</b> Có tổng quan và sequence diagram nhưng thiếu contract, cấu hình và runbook — các nhóm dễ xây thành phần không tương thích nhau.","<b>D.</b> Chỉ có tổng quan và danh sách giới hạn là mức tài liệu cho lãnh đạo, hoàn toàn thiếu chi tiết để xây dựng."]}},{"id":"ccarp-q077","n":77,"topic":4,"type":"mcq","stem":{"en":"You are identifying the highest-impact optimization for a deployment whose token cost is dominated by a long, repeated system prompt and a large retrieved context per request. Which optimization most directly targets the dominant cost driver?","vi":"Bạn đang xác định cách tối ưu hóa có tác động cao nhất cho hoạt động triển khai có chi phí mã thông báo bị chi phối bởi lời nhắc hệ thống dài, lặp lại và ngữ cảnh được truy xuất lớn cho mỗi yêu cầu. Tối ưu hóa nào nhắm mục tiêu trực tiếp nhất đến trình điều khiển chi phí chính?","jp":"あなたは、長く繰り返されるシステム プロンプトとリクエストごとに取得される大量のコンテキストによってトークン コストが支配されるデプロイメントに対して、最も影響の大きい最適化を特定しています。 主要なコスト要因を最も直接的にターゲットにした最適化はどれですか?"},"options":[{"k":"A","t":{"en":"Increase retrieval depth on every request to maximize recall, worsening the dominant cost driver by adding more retrieved tokens per request rather than reducing them.","vi":"Tăng độ sâu truy xuất trên mọi yêu cầu để tối đa hóa khả năng thu hồi, làm xấu đi trình điều khiển chi phí chi phối bằng cách thêm nhiều mã thông báo được truy xuất cho mỗi yêu cầu thay vì giảm chúng.","jp":"すべてのリクエストの取得深度を増やしてリコールを最大化し、リクエストごとに取得されるトークンを減らすのではなく追加することで主なコスト要因を悪化させます。"}},{"k":"B","t":{"en":"Add additional repeated content to the system prompt to give the model more guidance.","vi":"Thêm nội dung lặp lại bổ sung vào lời nhắc của hệ thống để cung cấp thêm hướng dẫn cho mô hình.","jp":"繰り返しのコンテンツをシステム プロンプトに追加して、モデルにさらなるガイダンスを提供します。"}},{"k":"C","t":{"en":"Move the long, repeated system prompt into a cacheable prefix and trim retrieved context to the spans relevant to each query.","vi":"Di chuyển lời nhắc hệ thống dài, lặp đi lặp lại vào tiền tố có thể lưu vào bộ nhớ đệm và cắt bớt ngữ cảnh được truy xuất theo các khoảng có liên quan đến từng truy vấn.","jp":"長く繰り返されるシステム プロンプトをキャッシュ可能なプレフィックスに移動し、取得したコンテキストを各クエリに関連する範囲にトリミングします。"}},{"k":"D","t":{"en":"Switch every request to the heaviest available model to maximize output quality, accepting that higher per-request inference cost compounds rather than addresses the dominant cost driver.","vi":"Chuyển mọi yêu cầu sang mô hình có sẵn nặng nhất để tối đa hóa chất lượng đầu ra, chấp nhận rằng chi phí suy luận theo yêu cầu cao hơn sẽ gộp lại thay vì giải quyết trình điều khiển chi phí chính.","jp":"すべてのリクエストを利用可能な最も重いモデルに切り替えて、出力品質を最大化します。リクエストごとの推論コストが高くなると、主なコスト要因に対処するのではなく、さらに悪化することを受け入れます。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Chi phí bị chi phối bởi hai thứ: <b>system prompt dài lặp lại</b> và <b>context truy xuất lớn</b> mỗi request — phương án C đánh vào cả hai. Đưa system prompt vào <b>tiền tố có thể cache</b> (prompt caching) để các request sau đọc từ cache với giá cache-read thấp hơn nhiều so với input thường; đồng thời <b>cắt context truy xuất</b> xuống chỉ những đoạn liên quan tới truy vấn, giảm trực tiếp số input token.","elim":["<b>A.</b> Tăng độ sâu retrieval thêm nhiều token truy xuất mỗi request — làm trầm trọng chính yếu tố chi phí chủ đạo.","<b>B.</b> Thêm nội dung lặp lại vào system prompt làm phần input lặp vốn đã đắt càng dài thêm.","<b>D.</b> Chuyển mọi request sang mô hình nặng nhất tăng đơn giá mỗi token, nhân lên chi phí thay vì giảm khối lượng token."]}},{"id":"ccarp-q078","n":78,"topic":4,"type":"mcq","stem":{"en":"You are defining transparency practices for a customer-facing assistant whose responses are materially shaped by AI. Which transparency practice most directly supports responsible deployment?","vi":"Bạn đang xác định các phương pháp thực hành minh bạch cho trợ lý làm việc trực tiếp với khách hàng có phản hồi được định hình cụ thể bởi AI. Biện pháp minh bạch nào hỗ trợ trực tiếp nhất cho việc triển khai có trách nhiệm?","jp":"あなたは、AI によって実質的に応答が形成される顧客対応アシスタントの透明性実践を定義しています。 責任ある展開を最も直接的にサポートする透明性の実践はどれですか?"},"options":[{"k":"A","t":{"en":"Misrepresent the AI's role in producing responses in order to make the assistant feel more trustworthy or more human, undermining informed user consent and organizational transparency.","vi":"Trình bày sai vai trò của AI trong việc đưa ra phản hồi nhằm làm cho trợ lý cảm thấy đáng tin cậy hơn hoặc giống con người hơn, làm suy yếu sự đồng ý của người dùng và tính minh bạch của tổ chức.","jp":"アシスタントがより信頼できる、より人間的であると感じさせるために、応答を生成する AI の役割を誤って伝え、インフォームド ユーザーの同意と組織の透明性を損なう。"}},{"k":"B","t":{"en":"Refuse to answer any user question about how the responses were produced or whether AI was involved, treating the AI's role as confidential operational information.","vi":"Từ chối trả lời bất kỳ câu hỏi nào của người dùng về cách tạo ra các câu trả lời hoặc liệu AI có liên quan hay không, coi vai trò của AI là thông tin vận hành bí mật.","jp":"応答がどのように生成されたか、または AI が関与しているかどうかに関するユーザーの質問への回答を拒否し、AI の役割を機密の運用情報として扱います。"}},{"k":"C","t":{"en":"Disclose AI involvement to end users in line with the organization's transparency policy and provide a documented path to reach a human when needed.","vi":"Tiết lộ sự tham gia của AI cho người dùng cuối theo chính sách minh bạch của tổ chức và cung cấp đường dẫn được ghi lại để tiếp cận con người khi cần.","jp":"組織の透明性ポリシーに従って AI の関与をエンド ユーザーに開示し、必要なときに人間に連絡するための文書化されたパスを提供します。"}},{"k":"D","t":{"en":"Disclose AI involvement only to internal staff and operators while withholding that information from the end users whose interactions are materially shaped by the AI system.","vi":"Chỉ tiết lộ sự tham gia của AI cho nhân viên nội bộ và người vận hành đồng thời giữ kín thông tin đó với người dùng cuối có tương tác được định hình cụ thể bởi hệ thống AI.","jp":"AI の関与を内部スタッフとオペレーターにのみ開示し、対話が実質的に AI システムによって形成されるエンド ユーザーにはその情報を差し控えます。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Triển khai có trách nhiệm đòi hỏi người dùng được biết chính xác họ đang tương tác với hệ thống nào. <b>Công bố sự tham gia của AI cho người dùng cuối</b> theo chính sách minh bạch của tổ chức (tương xứng với mức độ AI định hình câu trả lời, phù hợp quy định áp dụng) và cung cấp <b>con đường được tài liệu hóa để gặp con người</b> khi trợ lý không giải quyết được, kết quả bị tranh chấp hoặc vấn đề cần thẩm quyền của con người.","elim":["<b>A.</b> Trình bày sai vai trò của AI để trông ‘đáng tin’ hay ‘giống người’ là lừa dối, phá vỡ sự đồng thuận có hiểu biết của người dùng.","<b>B.</b> Từ chối trả lời việc AI có tham gia hay không là che giấu thông tin người dùng có quyền biết.","<b>D.</b> Chỉ công bố cho nhân viên nội bộ mà giấu người dùng cuối — đúng những người chịu ảnh hưởng — là trái với minh bạch."]}},{"id":"ccarp-q079","n":79,"topic":4,"type":"mcq","stem":{"en":"An engineering organization is adopting Claude Code across 200 developers. A team lead proposes that AI- generated pull requests bypass standard code review for changes under 50 lines because small changes are considered low risk and review capacity is constrained. Which two Diligence-competency objections should you raise? (Select two.) Each correct answer presents part of the solution.  [Chọn 2 đáp án]","vi":"Một tổ chức kỹ thuật đang áp dụng Claude Code cho 200 nhà phát triển. Trưởng nhóm đề xuất rằng các yêu cầu kéo do AI tạo ra sẽ bỏ qua việc xem xét mã tiêu chuẩn đối với những thay đổi dưới 50 dòng vì những thay đổi nhỏ được coi là có rủi ro thấp và khả năng xem xét bị hạn chế. Bạn nên nêu ra hai phản đối nào về Siêng năng-năng lực? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một phần của giải pháp.  [Chọn 2 đáp án]","jp":"あるエンジニアリング組織は、200 人の開発者にクロード コードを採用しています。チームリーダーは、小さな変更はリスクが低いとみなされ、レビュー能力が制限されているため、AI によって生成されたプル リクエストは 50 行未満の変更については標準のコード レビューをバイパスすることを提案しています。 勤勉能力に関する異議を 2 つ提起する必要があるのはどれですか? (2 つ選択してください。) それぞれの正解は、解決策の一部を示しています。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Removing review eliminates the verification mechanism required for AI-generated output across the workflow.","vi":"Việc xóa đánh giá sẽ loại bỏ cơ chế xác minh cần thiết cho đầu ra do AI tạo ra trong toàn bộ quy trình làm việc.","jp":"レビューを削除すると、ワークフロー全体で AI によって生成された出力に必要な検証メカニズムが排除されます。"}},{"k":"B","t":{"en":"Code-review capacity should be expanded to handle every code change submitted across the team.","vi":"Năng lực đánh giá mã cần được mở rộng để xử lý mọi thay đổi mã được gửi trong nhóm.","jp":"チーム全体で提出されたすべてのコード変更を処理できるように、コードレビューの能力を拡張する必要があります。"}},{"k":"C","t":{"en":"The threshold should be increased to 200 lines to capture more changes.","vi":"Ngưỡng phải được tăng lên 200 dòng để nắm bắt được nhiều thay đổi hơn.","jp":"より多くの変更をキャプチャするには、しきい値を 200 行に増やす必要があります。"}},{"k":"D","t":{"en":"AI-generated pull requests should be rejected by default across the organization.","vi":"Các yêu cầu kéo do AI tạo ra phải bị từ chối theo mặc định trong toàn tổ chức.","jp":"AI によって生成されたプル リクエストは、組織全体でデフォルトで拒否される必要があります。"}},{"k":"E","t":{"en":"Line count is a poor proxy for the actual risk introduced by a code change.","vi":"Số dòng là một đại diện kém cho rủi ro thực tế do thay đổi mã gây ra.","jp":"行数は、コード変更によってもたらされる実際のリスクを表すには不十分です。"}}],"answer":["A","E"],"multi":true,"explain":{"key":"<b>Đáp án A, E.</b><br><b>A:</b> Đầu ra do AI sinh ra phải đi qua <b>cơ chế kiểm chứng</b> giống như code do người viết; bỏ review cho PR dưới 50 dòng là gỡ bỏ đúng cái cổng có thể phát hiện giả định sai, lỗ hổng bảo mật, thiếu test hay hành vi ngoài ý muốn.<br><b>E:</b> <b>Số dòng là thước đo rủi ro kém</b>: một thay đổi một dòng ở logic phân quyền, dependency hay lệnh thực thi có thể nguy hiểm hơn nhiều so với một cập nhật tài liệu lớn. Mức độ review nên dựa trên thành phần bị ảnh hưởng, đặc quyền, độ nhạy dữ liệu, khả năng đảo ngược và độ bao phủ test.","elim":["<b>B.</b> Mở rộng năng lực review cho mọi thay đổi là giải pháp vận hành/nguồn lực, không phải phản biện thuộc năng lực Diligence về việc vì sao đề xuất bỏ review là sai.","<b>C.</b> Nâng ngưỡng lên 200 dòng còn làm tăng số thay đổi không được review và vẫn dùng số dòng làm thước đo rủi ro — đúng cái sai cần phản bác.","<b>D.</b> Từ chối mặc định mọi PR do AI sinh ra là phản ứng thái quá, triệt tiêu lợi ích áp dụng Claude Code thay vì đặt kiểm chứng phù hợp với rủi ro."]},"cite":"Hướng dẫn ôn tập — §9.4 Hiệu chỉnh độ tin cậy và giám sát của con người"},{"id":"ccarp-q080","n":80,"topic":4,"type":"mcq","stem":{"en":"You are defining an SLA for a Claude-based assistant. Which SLA definition is most operationally meaningful?","vi":"Bạn đang xác định SLA cho trợ lý dựa trên Claude. Định nghĩa SLA nào có ý nghĩa nhất về mặt hoạt động?","jp":"クロードベースのアシスタントの SLA を定義しています。 運用上最も意味のある SLA 定義はどれですか?"},"options":[{"k":"A","t":{"en":"A target tied to a stakeholder sentiment measure such as \"the team feels satisfied,\" which cannot be measured objectively or used to trigger a documented breach response.","vi":"Mục tiêu gắn liền với thước đo cảm tính của các bên liên quan, chẳng hạn như \"nhóm cảm thấy hài lòng\", không thể đo lường một cách khách quan hoặc được sử dụng để kích hoạt phản hồi vi phạm được ghi lại.","jp":"「チームは満足している」などの利害関係者の感情尺度に関連付けられた目標。客観的に測定したり、文書化された違反対応を引き起こすために使用したりすることはできません。"}},{"k":"B","t":{"en":"A measurable target with a defined metric, threshold, evaluation window, and consequence for breach- for example, \"p95 per-request latency under 800 ms over a 28-day window.\"","vi":"Mục tiêu có thể đo lường được với chỉ số, ngưỡng, khoảng thời gian đánh giá được xác định và hậu quả đối với vi phạm - ví dụ: \"độ trễ p95 cho mỗi yêu cầu dưới 800 mili giây trong khoảng thời gian 28 ngày\".","jp":"定義されたメトリクス、しきい値、評価ウィンドウ、および違反の影響を含む測定可能な目標。たとえば、「28 日間のウィンドウで、リクエストあたりの p95 レイテンシが 800 ミリ秒未満」。"}},{"k":"C","t":{"en":"A qualitative commitment such as \"the system will be fast and reliable,\" which names no metric, threshold, or evaluation window.","vi":"Cam kết định tính chẳng hạn như \"hệ thống sẽ nhanh và đáng tin cậy\", không nêu tên số liệu, ngưỡng hoặc khoảng thời gian đánh giá.","jp":"「システムは高速で信頼性が高くなります」などの定性的な約束であり、指標、しきい値、評価ウィンドウは指定されていません。"}},{"k":"D","t":{"en":"A target that names the metric and threshold but omits the evaluation window and breach consequence, leaving compliance periods and remediation triggers undefined.","vi":"Mục tiêu nêu tên chỉ số và ngưỡng nhưng bỏ qua khoảng thời gian đánh giá và hậu quả vi phạm, khiến khoảng thời gian tuân thủ và trình kích hoạt khắc phục không được xác định.","jp":"メトリックとしきい値を指定するターゲットですが、評価ウィンドウと違反の結果が省略され、コンプライアンス期間と修復トリガーが未定義のままになります。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Một SLA có giá trị vận hành phải <b>đo được khách quan và thực thi được</b>: có <b>metric</b> xác định, <b>ngưỡng</b>, <b>cửa sổ đánh giá</b> và <b>hệ quả khi vi phạm</b>. Ví dụ p95 latency dưới 800 ms trong cửa sổ 28 ngày cho phép hai bên xác định rõ có tuân thủ hay không. Dùng percentile (p95) tốt hơn trung bình vì lộ ra hiệu năng đuôi mà một phần đáng kể người dùng thực sự gặp; hệ quả vi phạm kích hoạt escalation, khắc phục hoặc bồi hoàn.","elim":["<b>A.</b> Cảm nhận hài lòng của đội không đo được khách quan nên không thể xác định vi phạm hay kích hoạt quy trình xử lý vi phạm đã ghi nhận.","<b>C.</b> Cam kết định tính kiểu nhanh và ổn định không nêu metric, ngưỡng hay cửa sổ đánh giá nên không kiểm chứng được.","<b>D.</b> Có metric và ngưỡng nhưng thiếu cửa sổ đánh giá và hệ quả vi phạm, khiến kỳ tuân thủ và điều kiện kích hoạt khắc phục bị bỏ ngỏ — SLA chưa hoàn chỉnh."]}}]},{"n":5,"title":{"en":"Practice Set 5","vi":"Bộ đề số 5","jp":"練習問題 5"},"questions":[{"id":"ccarp-q081","n":81,"topic":5,"type":"mcq","stem":{"en":"A Claude architect is designing a HIPAA-compliant pipeline that processes patient records. Which two design decisions directly support HIPAA compliance requirements? (Select two.)  [Chọn 2 đáp án]","vi":"Một kiến ​​trúc sư Claude đang thiết kế một quy trình tuân thủ HIPAA để xử lý hồ sơ bệnh nhân. Hai quyết định thiết kế nào trực tiếp hỗ trợ các yêu cầu tuân thủ HIPAA? (Chọn 2.) [Chọn 2 đáp án]","jp":"クロード アーキテクトは、患者記録を処理する HIPAA 準拠のパイプラインを設計しています。 HIPAA コンプライアンス要件を直接サポートする 2 つの設計上の決定はどれですか? (2 つ選択してください。) [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Setting max_tokens to a low value to minimize the volume of text generated per request.","vi":"Đặt max_tokens thành giá trị thấp để giảm thiểu khối lượng văn bản được tạo theo yêu cầu.","jp":"max_tokens を低い値に設定して、リクエストごとに生成されるテキストの量を最小限に抑えます。"}},{"k":"B","t":{"en":"Selecting the highest-capability Claude model to maximize diagnostic accuracy.","vi":"Chọn mô hình Claude có khả năng cao nhất để tối đa hóa độ chính xác chẩn đoán.","jp":"診断精度を最大化するために、最高の機能を備えたクロード モデルを選択します。"}},{"k":"C","t":{"en":"Enforcing role-based access controls so that PHI is retrievable only by authorized personnel.","vi":"Thực thi các biện pháp kiểm soát truy cập dựa trên vai trò để chỉ những người được ủy quyền mới có thể truy xuất PHI.","jp":"権限のある担当者のみが PHI を取得できるように、ロールベースのアクセス制御を実施します。"}},{"k":"D","t":{"en":"Ensuring patient data is never included in training feedback loops sent to the model provider without a BAA in place.","vi":"Đảm bảo dữ liệu bệnh nhân không bao giờ được đưa vào các vòng phản hồi đào tạo được gửi đến nhà cung cấp mô hình mà không có BAA.","jp":"BAA が設定されていないモデルプロバイダーに送信されるトレーニング フィードバック ループに患者データが決して含まれないようにします。"}},{"k":"E","t":{"en":"Using streaming responses to reduce perceived latency for clinical users.","vi":"Sử dụng phản hồi phát trực tuyến để giảm độ trễ nhận thấy cho người dùng lâm sàng.","jp":"ストリーミング応答を使用して、臨床ユーザーが感じる待ち時間を短縮します。"}}],"answer":["C","D"],"multi":true,"explain":{"key":"<b>Đáp án C, D.</b><br><b>C:</b> <b>Kiểm soát truy cập theo vai trò (RBAC)</b> trực tiếp đáp ứng yêu cầu access control và nguyên tắc minimum necessary của HIPAA: tầng truy xuất/điều phối phải xác minh vai trò người dùng trước khi PHI được đưa vào context của model, kèm audit log. Chỉ dẫn trong prompt không phải là ranh giới bảo mật.<br><b>D:</b> PHI chỉ được xử lý trong phạm vi dịch vụ được bao phủ bởi <b>Business Associate Agreement (BAA)</b>; không được để dữ liệu bệnh nhân lọt vào các vòng phản hồi/huấn luyện gửi cho nhà cung cấp model khi chưa có BAA.","elim":["<b>A.</b> Giảm <code>max_tokens</code> chỉ hạn chế độ dài đầu ra, không kiểm soát ai truy cập PHI hay PHI được xử lý ở đâu.","<b>B.</b> Chọn model mạnh nhất liên quan đến chất lượng chẩn đoán, không phải yêu cầu tuân thủ HIPAA về bảo vệ và truy cập dữ liệu.","<b>E.</b> Streaming chỉ cải thiện độ trễ cảm nhận, hoàn toàn không liên quan đến bảo mật hay quyền riêng tư của PHI."]}},{"id":"ccarp-q082","n":82,"topic":5,"type":"mcq","stem":{"en":"You are designing a human-in-the-loop validation workflow for a new Claude-based deployment and must complete the design steps before piloting the workflow. Which two steps must be completed BEFORE piloting the workflow with a representative subset of traffic? (Select two.) Each correct answer presents part of the solution.  [Chọn 2 đáp án]","vi":"Bạn đang thiết kế quy trình xác thực con người trong vòng lặp cho quá trình triển khai dựa trên Claude mới và phải hoàn thành các bước thiết kế trước khi thử nghiệm quy trình làm việc. Hai bước nào phải được hoàn thành TRƯỚC KHI thí điểm quy trình làm việc với một tập hợp con lưu lượng truy cập đại diện? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một phần của giải pháp.  [Chọn 2 đáp án]","jp":"新しいクロードベースの展開用の人間参加型検証ワークフローを設計しているため、ワークフローを試験運用する前に設計手順を完了する必要があります。 トラフィックの代表的なサブセットを使用してワークフローを試験運用する前に、完了する必要がある 2 つの手順はどれですか? (2 つ選択してください。) それぞれの正解は、解決策の一部を示しています。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Define the sampling strategy and the escalation criteria at each oversight point in the pipeline.","vi":"Xác định chiến lược lấy mẫu và tiêu chí leo thang tại mỗi điểm giám sát trong quy trình.","jp":"パイプライン内の各監視ポイントでのサンプリング戦略とエスカレーション基準を定義します。"}},{"k":"B","t":{"en":"Iterate the workflow design based on observed pilot findings before broader rollout to production.","vi":"Lặp lại thiết kế quy trình làm việc dựa trên những phát hiện thí điểm được quan sát trước khi triển khai rộng rãi hơn vào sản xuất.","jp":"運用環境への広範なロールアウトの前に、観察されたパイロット結果に基づいてワークフロー設計を繰り返します。"}},{"k":"C","t":{"en":"Onboard the reviewer pool with role-specific training on the check criteria and escalation procedures.","vi":"Tham gia nhóm người đánh giá với chương trình đào tạo dành riêng cho từng vai trò về tiêu chí kiểm tra và quy trình nâng cấp.","jp":"チェック基準とエスカレーション手順に関する役割別のトレーニングを受けてレビュー担当者を集めます。"}},{"k":"D","t":{"en":"Document the workflow with check criteria, escalation paths, and service-level agreements (SLAs) for each step.","vi":"Ghi lại quy trình làm việc với các tiêu chí kiểm tra, đường dẫn leo thang và thỏa thuận cấp độ dịch vụ (SLA) cho từng bước.","jp":"各ステップのチェック基準、エスカレーション パス、サービス レベル アグリーメント (SLA) を含むワークフローを文書化します。"}},{"k":"E","t":{"en":"Identify the decision points in the pipeline that require human oversight by impact and reversibility.","vi":"Xác định các điểm quyết định trong quy trình yêu cầu sự giám sát của con người dựa trên tác động và khả năng đảo ngược.","jp":"パイプライン内で人間による監視が必要な意思決定ポイントを、影響と可逆性によって特定します。"}}],"answer":["A","E"],"multi":true,"explain":{"key":"<b>Đáp án A, E.</b><br><b>E:</b> Bước đầu tiên là <b>xác định các điểm quyết định cần giám sát của con người</b> dựa trên <b>tác động và khả năng đảo ngược</b> — hành động tác động lớn, không đảo ngược được hoặc có hệ quả pháp lý cần review chặt hơn so với bản nháp rủi ro thấp.<br><b>A:</b> Sau khi có các điểm kiểm soát, phải định nghĩa <b>chiến lược lấy mẫu</b> (toàn bộ, ngẫu nhiên, theo rủi ro, theo độ tin cậy) và <b>tiêu chí escalation</b> tại mỗi điểm — đây là phần thiết kế cốt lõi mà pilot sẽ kiểm nghiệm.","elim":["<b>B.</b> Lặp lại thiết kế dựa trên kết quả pilot là bước diễn ra SAU pilot, không thể làm trước khi pilot.","<b>C.</b> Đào tạo toàn bộ đội reviewer theo vai trò phụ thuộc vào tiêu chí và quy trình đã được kiểm nghiệm; làm trước pilot là sớm và không phải bước thiết kế bắt buộc.","<b>D.</b> Tài liệu hóa đầy đủ kèm SLA cho từng bước thường được hoàn thiện sau khi pilot xác nhận thiết kế; đề hỏi hai bước thiết kế nền tảng phải xong trước pilot."]},"cite":"Hướng dẫn ôn tập — §9.1 Khi nào escalation lên cho con người; Lĩnh vực 5.2"},{"id":"ccarp-q083","n":83,"topic":5,"type":"mcq","stem":{"en":"You are compiling team-setup practices for a Claude Code rollout across an engineering organization. Which two practices belong on the list? (Select two.) Each correct answer presents a complete solution.  [Chọn 2 đáp án]","vi":"Bạn đang biên soạn các phương pháp thiết lập nhóm để triển khai Mã Claude trong một tổ chức kỹ thuật. Hai thực hành nào thuộc danh sách? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một giải pháp hoàn chỉnh.  [Chọn 2 đáp án]","jp":"あなたは、エンジニアリング組織全体にクロード コードを展開するためのチーム設定の実践方法をまとめています。 リストに含まれる 2 つの実践はどれですか? (2 つ選択してください。) それぞれの正解は完全な解決策を示します。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Use project scope for team-shared Model Context Protocol (MCP) servers and permission rules under version control.","vi":"Sử dụng phạm vi dự án cho các máy chủ Giao thức bối cảnh mô hình (MCP) được nhóm chia sẻ và các quy tắc cấp phép trong kiểm soát phiên bản.","jp":"チーム共有モデル コンテキスト プロトコル (MCP) サーバーとバージョン管理下の権限ルールのプロジェクト スコープを使用します。"}},{"k":"B","t":{"en":"Apply managed configuration centrally for security-critical settings that must not be overridden by individual engineers.","vi":"Áp dụng tập trung cấu hình được quản lý cho các cài đặt quan trọng về bảo mật mà từng kỹ sư không được ghi đè.","jp":"個々のエンジニアが上書きしてはならないセキュリティクリティカルな設定については、管理された構成を一元的に適用します。"}},{"k":"C","t":{"en":"Use local scope for security-critical permission rules so each engineer can adapt them to ongoing work.","vi":"Sử dụng phạm vi cục bộ cho các quy tắc cấp phép quan trọng về bảo mật để mỗi kỹ sư có thể điều chỉnh chúng cho phù hợp với công việc đang diễn ra.","jp":"セキュリティ クリティカルな権限ルールにはローカル スコープを使用して、各エンジニアが継続的な作業にルールを適応できるようにします。"}},{"k":"D","t":{"en":"Use user scope for team-shared MCP servers so every engineer on the team has consistent access.","vi":"Sử dụng phạm vi người dùng cho các máy chủ MCP được chia sẻ trong nhóm để mọi kỹ sư trong nhóm đều có quyền truy cập nhất quán.","jp":"チーム共有 MCP サーバーのユーザー スコープを使用すると、チーム内のすべてのエンジニアが一貫したアクセス権を得ることができます。"}},{"k":"E","t":{"en":"Use project scope for personal editor preferences so the preferences apply consistently within the project.","vi":"Sử dụng phạm vi dự án cho các tùy chọn biên tập cá nhân để các tùy chọn này được áp dụng nhất quán trong dự án.","jp":"個人のエディター設定にプロジェクト スコープを使用して、設定がプロジェクト内で一貫して適用されるようにします。"}}],"answer":["A","B"],"multi":true,"explain":{"key":"<b>Đáp án A, B.</b><br><b>A:</b> <b>Project scope</b> (ví dụ <code>.mcp.json</code>, <code>.claude/settings.json</code> ở gốc repo) dành cho cấu hình dùng chung của nhóm, được commit vào version control — MCP server và permission rule chung nhờ đó nhất quán và được review như code.<br><b>B:</b> <b>Managed configuration</b> do quản trị viên triển khai tập trung, có độ ưu tiên cao nhất và <b>không thể bị ghi đè</b> bởi các scope thấp hơn — phù hợp cho thiết lập bảo mật/tuân thủ bắt buộc.","elim":["<b>C.</b> Local scope là cấu hình riêng trên máy của một kỹ sư, không chia sẻ và cho phép tự sửa — trái ngược với yêu cầu thực thi thống nhất cho rule bảo mật quan trọng.","<b>D.</b> User scope (<code>~/.claude.json</code>) theo từng cá nhân qua mọi project, không được chia sẻ qua version control nên không đảm bảo cả nhóm có cùng MCP server.","<b>E.</b> Tùy chọn editor cá nhân thuộc user/local scope; đưa vào project scope sẽ áp sở thích cá nhân lên mọi người đóng góp."]},"cite":"Hướng dẫn ôn tập — §4.3 Cấu hình MCP Server; Lĩnh vực 2.4"},{"id":"ccarp-q084","n":84,"topic":5,"type":"mcq","stem":{"en":"You are reviewing a customer-support agent's configuration. Each candidate tool falls into one of four categories: (1) required to complete defined tasks, (2) frequently used and reduces handoffs, (3) occasionally useful for unrelated work, (4) speculative future utility. Which categories should typically remain in the agent configuration?","vi":"Bạn đang xem lại cấu hình của nhân viên hỗ trợ khách hàng. Mỗi công cụ ứng cử viên thuộc một trong bốn loại: (1) cần thiết để hoàn thành các nhiệm vụ đã xác định, (2) được sử dụng thường xuyên và giảm thiểu sự chuyển giao, (3) đôi khi hữu ích cho các công việc không liên quan, (4) tiện ích đầu cơ trong tương lai. Những danh mục nào thường nên có trong cấu hình tổng đài viên?","jp":"カスタマー サポート エージェントの構成を確認しています。各候補ツールは 4 つのカテゴリのいずれかに分類されます: (1) 定義されたタスクを完了するために必要、(2) 頻繁に使用されハンドオフが軽減される、(3) 無関係な作業に時折役立つ、(4) 将来の推測上の有用性。 通常、エージェント構成に残すべきカテゴリはどれですか?"},"options":[{"k":"A","t":{"en":"Only category 3, because occasionally useful tools for unrelated work provide broader coverage and should take priority over tools required for the agent's defined tasks.","vi":"Chỉ loại 3, vì đôi khi các công cụ hữu ích cho công việc không liên quan cung cấp phạm vi bao quát rộng hơn và phải được ưu tiên hơn các công cụ cần thiết cho các nhiệm vụ được xác định của tổng đài viên.","jp":"カテゴリ 3 のみ。無関係な作業に役立つツールがより広範囲に適用される場合があり、エージェントの定義されたタスクに必要なツールよりも優先する必要があるためです。"}},{"k":"B","t":{"en":"Only category 4, because speculative future-utility tools provide the most flexibility and should be configured even when no defined task currently requires them.","vi":"Chỉ loại 4, vì các công cụ tiện ích tương lai mang tính suy đoán mang lại tính linh hoạt cao nhất và phải được định cấu hình ngay cả khi hiện tại không có tác vụ xác định nào yêu cầu chúng.","jp":"カテゴリ 4 のみ。投機的将来ユーティリティ ツールは最も柔軟性が高く、現在それらを必要とする定義済みタスクがない場合でも構成する必要があるためです。"}},{"k":"C","t":{"en":"Categories 1 and 2 only, because they map to defined tasks and the agent's regular hand-offs.","vi":"Chỉ loại 1 và 2, vì chúng ánh xạ tới các nhiệm vụ đã xác định và sự chuyển giao thường xuyên của tổng đài viên.","jp":"カテゴリ 1 と 2 のみ。定義されたタスクとエージェントの通常の引き継ぎにマップされるためです。"}},{"k":"D","t":{"en":"All four categories, because broader tool access is categorically better for agent performance regardless of whether the tools map to defined tasks or regular hand-offs.","vi":"Tất cả bốn loại, bởi vì khả năng truy cập công cụ rộng hơn về mặt phân loại sẽ tốt hơn cho hiệu suất của tác nhân bất kể công cụ đó có ánh xạ tới các nhiệm vụ đã xác định hay chuyển giao thông thường hay không.","jp":"4 つのカテゴリすべて。ツールが定義されたタスクにマップされているか、通常の引き継ぎにマップされているかに関係なく、ツールへのアクセスが広範である方がエージェントのパフォーマンスが断然向上するためです。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Chỉ giữ tool thuộc nhóm 1 (<b>bắt buộc để hoàn thành nhiệm vụ đã định</b>) và nhóm 2 (<b>dùng thường xuyên và giảm hand-off</b>) — cả hai đều gắn với phạm vi trách nhiệm của agent. Nhóm 3 và 4 gây <b>phình năng lực</b>: tăng bề mặt tấn công, tốn context, khó phân quyền và đánh giá, đồng thời làm giảm độ chính xác chọn tool (quá nhiều tool khiến agent chọn sai hoặc dùng sai tool ngoài chuyên môn).","elim":["<b>A.</b> Tool chỉ hữu ích cho việc không liên quan nằm ngoài ranh giới trách nhiệm của agent; ưu tiên chúng hơn tool bắt buộc là đảo ngược logic.","<b>B.</b> Tool có tiện ích suy đoán trong tương lai không có yêu cầu đã xác thực, chỉ thêm rủi ro và chi phí context.","<b>D.</b> Truy cập tool rộng hơn không mặc nhiên tốt hơn; nhiều tool hơn làm giảm độ tin cậy chọn tool và vi phạm nguyên tắc least privilege."]},"cite":"Hướng dẫn ôn tập — Lĩnh vực 2.3 Phân bổ Tool Giữa các Agent và Cấu hình tool_choice"},{"id":"ccarp-q085","n":85,"topic":5,"type":"mcq","stem":{"en":"You are documenting an architectural decision to support future audit and onboarding. Which artifact is the strongest fit?","vi":"Bạn đang ghi lại một quyết định về kiến ​​trúc để hỗ trợ quá trình kiểm tra và triển khai trong tương lai. Hiện vật nào phù hợp nhất?","jp":"あなたは、将来の監査とオンボーディングをサポートするためのアーキテクチャ上の決定を文書化しています。 どのアーティファクトが最も適合しますか?"},"options":[{"k":"A","t":{"en":"A slide deck in a presentation folder with no accompanying written rationale.","vi":"Một bản trình bày trong một thư mục thuyết trình không có lý do bằng văn bản kèm theo.","jp":"プレゼンテーション フォルダー内のスライド デッキ。根拠が書かれていない。"}},{"k":"B","t":{"en":"A code comment in a single file that contains an opinion of one engineer.","vi":"Một nhận xét về mã trong một tệp chứa ý kiến ​​của một kỹ sư.","jp":"1 人のエンジニアの意見を含む 1 つのファイル内のコード コメント。"}},{"k":"C","t":{"en":"An Architecture Decision Record that states the context, the decision, the alternatives considered, the consequences, and the date and authors.","vi":"Bản ghi Quyết định Kiến trúc nêu rõ bối cảnh, quyết định, các lựa chọn thay thế được xem xét, hậu quả, ngày tháng và tác giả.","jp":"コンテキスト、決定、検討された代替案、結果、日付と作成者を記載するアーキテクチャ決定記録。"}},{"k":"D","t":{"en":"A short verbal note shared during a hallway conversation with no written record.","vi":"Một ghi chú bằng lời nói ngắn được chia sẻ trong cuộc trò chuyện ở hành lang mà không có ghi chép bằng văn bản.","jp":"廊下での会話中に共有された短い口頭メモ。書面による記録はありません。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> <b>Architecture Decision Record (ADR)</b> được thiết kế để lưu giữ một quyết định kiến trúc ở dạng ngắn gọn, bền vững và review được: <b>context</b> (vấn đề, ràng buộc), <b>quyết định</b>, <b>các phương án đã cân nhắc</b>, <b>hệ quả</b> (lợi ích, chi phí, rủi ro còn lại) cùng <b>ngày và tác giả</b>. Cấu trúc này giúp người audit truy vết vì sao chọn phương án và giúp người mới onboarding hiểu bối cảnh mà không phải hỏi lại.","elim":["<b>A.</b> Slide deck không có lý giải viết thành văn thiếu phương án thay thế, hệ quả và trách nhiệm — khó dùng làm bằng chứng audit.","<b>B.</b> Comment trong một file chỉ phản ánh ý kiến một kỹ sư, phân tán, không có phương án thay thế hay phê duyệt.","<b>D.</b> Ghi chú miệng không để lại hồ sơ nào nên hoàn toàn không phục vụ được audit hay onboarding."]}},{"id":"ccarp-q086","n":86,"topic":5,"type":"mcq","stem":{"en":"During an architectural review, the security team identifies a risk that adversarial content injected into retrieved documents could manipulate the model's behavior. Which mitigation most directly addresses this threat?","vi":"Trong quá trình đánh giá kiến ​​trúc, nhóm bảo mật xác định nguy cơ nội dung đối nghịch được đưa vào tài liệu được truy xuất có thể thao túng hành vi của mô hình. Biện pháp giảm thiểu nào giải quyết trực tiếp nhất mối đe dọa này?","jp":"セキュリティ チームは、アーキテクチャのレビュー中に、取得したドキュメントに挿入された敵対的なコンテンツによってモデルの動作が操作される可能性があるリスクを特定しました。 この脅威に最も直接的に対処する緩和策はどれですか?"},"options":[{"k":"A","t":{"en":"Treat all retrieved content as untrusted input and apply input classifiers with output validation.","vi":"Hãy coi tất cả nội dung được truy xuất là dữ liệu đầu vào không đáng tin cậy và áp dụng bộ phân loại đầu vào cùng với xác thực đầu ra.","jp":"取得されたすべてのコンテンツを信頼できない入力として扱い、出力検証を備えた入力分類子を適用します。"}},{"k":"B","t":{"en":"Require citations for each claim and constrain responses to source-supported content.","vi":"Yêu cầu trích dẫn cho mỗi khiếu nại và hạn chế phản hồi đối với nội dung được nguồn hỗ trợ.","jp":"各主張の引用を要求し、出典がサポートされているコンテンツへの回答を制限します。"}},{"k":"C","t":{"en":"Restrict outbound tool calls to an approved destination allow-list.","vi":"Hạn chế các cuộc gọi công cụ gửi đi đến danh sách cho phép đích đã được phê duyệt.","jp":"送信ツール呼び出しを承認された宛先許可リストに制限します。"}},{"k":"D","t":{"en":"Score outputs against a stable adversarial evaluation set on each model-version change.","vi":"Cho điểm kết quả đầu ra dựa trên đánh giá đối thủ ổn định được đặt ra cho mỗi lần thay đổi phiên bản mô hình.","jp":"モデル バージョンの変更ごとに、安定した敵対的評価セットに対して出力をスコア付けします。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Đây là <b>indirect prompt injection</b>: chỉ dẫn độc hại được nhúng vào tài liệu truy xuất mà Claude xử lý như bằng chứng. Biện pháp trực tiếp nhất là xử lý tại đúng ranh giới tin cậy: <b>coi mọi nội dung truy xuất là đầu vào không tin cậy</b>, sàng lọc bằng <b>input classifier</b> trước khi dùng và <b>kiểm tra đầu ra</b> trước khi nó tác động tới hành động phía sau. Kèm theo đó là đặt nội dung bên thứ ba trong cấu trúc được đánh dấu rõ và chỉ dẫn rằng nó không thể ghi đè system prompt.","elim":["<b>B.</b> Bắt buộc trích dẫn giảm hallucination nhưng không ngăn chỉ dẫn độc hại trong chính nguồn được trích dẫn thao túng hành vi model.","<b>C.</b> Allow-list đích gọi ra ngoài chỉ hạn chế một hậu quả (rò rỉ dữ liệu), không xử lý trực tiếp việc nội dung bị tiêm thao túng hành vi.","<b>D.</b> Bộ đánh giá đối kháng khi đổi phiên bản model là biện pháp phát hiện hồi quy định kỳ, không phải kiểm soát chặn injection ở runtime."]}},{"id":"ccarp-q087","n":87,"topic":5,"type":"mcq","stem":{"en":"You are evaluating an evaluation set used to score a Claude-based hiring-support tool. The set is drawn from one geographic region and one tenure band. Which response is most appropriate?","vi":"Bạn đang đánh giá một bộ đánh giá được sử dụng để chấm điểm công cụ hỗ trợ tuyển dụng dựa trên Claude. Bộ này được rút ra từ một khu vực địa lý và một nhóm quyền sở hữu. Phản ứng nào là phù hợp nhất?","jp":"クロードベースの採用支援ツールのスコアリングに使用される評価セットを評価しています。このセットは、1 つの地理的地域と 1 つの在職期間バンドから抽出されます。 どの対応が最も適切でしょうか?"},"options":[{"k":"A","t":{"en":"Discard all quantitative evaluation and replace it with qualitative impressions collected from a small, convenience-selected group that may not represent the tool's full user population.","vi":"Loại bỏ tất cả đánh giá định lượng và thay thế bằng các hiển thị định tính được thu thập từ một nhóm nhỏ, được lựa chọn thuận tiện và có thể không đại diện cho toàn bộ người dùng của công cụ.","jp":"すべての定量的評価を破棄し、ツールの全ユーザー母集団を代表していない可能性がある、便宜的に選択された小規模なグループから収集された定性的インプレッションに置き換えます。"}},{"k":"B","t":{"en":"Expand the evaluation set to cover the geographic regions and tenure bands the tool will serve, and rescore the system on the expanded set before broader release.","vi":"Mở rộng bộ đánh giá để bao gồm các khu vực địa lý và phạm vi sở hữu mà công cụ sẽ phục vụ và chấm điểm lại hệ thống trên bộ mở rộng trước khi phát hành rộng rãi hơn.","jp":"ツールがサービスを提供する地理的地域と保有期間をカバーするように評価セットを拡張し、広範囲にリリースする前に拡張セットでシステムを再スコアリングします。"}},{"k":"C","t":{"en":"Reduce the evaluation set further to a single demographic subgroup to simplify score interpretation, narrowing coverage rather than expanding it to match the intended user population.","vi":"Giảm bộ đánh giá hơn nữa thành một nhóm nhỏ nhân khẩu học để đơn giản hóa việc giải thích điểm số, thu hẹp phạm vi bao phủ thay vì mở rộng phạm vi để phù hợp với nhóm người dùng dự kiến.","jp":"スコアの解釈を簡素化するために、評価セットをさらに 1 つの人口統計サブグループに絞り込み、対象となるユーザー母集団に合わせて範囲を拡大するのではなく、範囲を狭めます。"}},{"k":"D","t":{"en":"Continue using the narrow evaluation set drawn from one region and one tenure band because the existing benchmark scores are already high on that subset.","vi":"Tiếp tục sử dụng tập hợp đánh giá hẹp được rút ra từ một khu vực và một nhóm nhiệm kỳ vì điểm chuẩn hiện tại đã cao trên tập hợp con đó.","jp":"既存のベンチマーク スコアはそのサブセットですでに高いため、1 つの地域と 1 つの在職期間バンドから抽出された狭い評価セットを引き続き使用します。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Bộ đánh giá chỉ lấy từ một vùng địa lý và một nhóm thâm niên <b>không đại diện cho quần thể</b> mà công cụ tuyển dụng sẽ phục vụ; điểm cao trên tập hẹp có thể che giấu khác biệt lớn giữa các nhóm. Cần <b>mở rộng tập đánh giá</b> bao phủ các vùng và nhóm thâm niên mục tiêu, báo cáo <b>metric phân tách theo từng slice</b> và <b>chấm lại trước khi phát hành rộng</b> — đặc biệt quan trọng với ứng dụng tuyển dụng nhạy cảm về công bằng.","elim":["<b>A.</b> Bỏ đánh giá định lượng để thay bằng cảm nhận từ nhóm nhỏ chọn tiện lợi làm mất khả năng đo lường và còn kém đại diện hơn.","<b>C.</b> Thu hẹp về một nhóm duy nhất làm độ bao phủ tệ hơn, đi ngược mục tiêu khớp với quần thể người dùng dự kiến.","<b>D.</b> Điểm cao trên tập hẹp không chứng minh hiệu năng trên các nhóm chưa được đánh giá; tiếp tục dùng là bỏ qua lỗ hổng bao phủ."]}},{"id":"ccarp-q088","n":88,"topic":5,"type":"mcq","stem":{"en":"You must present an architectural recommendation to deploy a Claude-based contract review assistant to a steering committee that includes the CFO, the general counsel, and the CIO. Each stakeholder cares about different aspects of the decision. How should you structure the recommendation document?","vi":"Bạn phải trình bày đề xuất kiến ​​trúc để triển khai trợ lý đánh giá hợp đồng dựa trên Claude cho ban chỉ đạo bao gồm CFO, cố vấn chung và CIO. Mỗi bên liên quan quan tâm đến các khía cạnh khác nhau của quyết định. Bạn nên cấu trúc tài liệu giới thiệu như thế nào?","jp":"クロードベースの契約レビューアシスタントを CFO、法務顧問、CIO を含む運営委員会に配置するためのアーキテクチャ上の推奨事項を提示する必要があります。 各利害関係者は、意思決定のさまざまな側面を考慮します。 推奨文書はどのように構成すればよいでしょうか?"},"options":[{"k":"A","t":{"en":"Lead with the technical architecture diagram and the full component list before any other section.","vi":"Dẫn đầu bằng sơ đồ kiến ​​trúc kỹ thuật và danh sách thành phần đầy đủ trước bất kỳ phần nào khác.","jp":"他のセクションの前に、技術アーキテクチャ図と完全なコンポーネントのリストを理解してください。"}},{"k":"B","t":{"en":"Lead with detailed cost projections across the full multi-year horizon before the rationale section.","vi":"Dẫn đầu với các dự báo chi phí chi tiết trong toàn bộ thời gian nhiều năm trước phần lý do.","jp":"理論的根拠のセクションの前に、複数年にわたる詳細なコスト予測を示します。"}},{"k":"C","t":{"en":"Present the same dense narrative throughout with no stakeholder differentiation in any section.","vi":"Trình bày cùng một câu chuyện dày đặc xuyên suốt mà không có sự phân biệt các bên liên quan trong bất kỳ phần nào.","jp":"どのセクションでも関係者を区別せずに、一貫して同じ密度の高い物語を提示します。"}},{"k":"D","t":{"en":"Lead with the architectural decision, then address each stakeholder's primary concerns directly.","vi":"Dẫn đầu với quyết định về kiến ​​trúc, sau đó giải quyết trực tiếp mối quan tâm chính của từng bên liên quan.","jp":"アーキテクチャ上の決定を主導し、各関係者の主な懸念事項に直接対処します。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Ban chỉ đạo cần tài liệu theo kiểu <b>answer-first</b>: nêu ngay <b>quyết định kiến trúc</b>, kết quả kinh doanh mà nó hỗ trợ và hành động cần phê duyệt; sau đó <b>trả lời trực tiếp mối quan tâm chính của từng bên</b> — CFO (chi phí triển khai/vận hành, tiết kiệm, rủi ro tài chính), general counsel (bảo mật, đặc quyền luật sư–khách hàng, xử lý dữ liệu, review pháp lý), CIO (tích hợp, bảo mật, vận hành, khả năng mở rộng).","elim":["<b>A.</b> Mở đầu bằng sơ đồ kiến trúc và danh sách thành phần chỉ phục vụ CIO, chôn vùi quyết định và bỏ qua mối quan tâm của CFO và general counsel.","<b>B.</b> Mở đầu bằng dự phóng chi phí nhiều năm chỉ phục vụ CFO, đặt chi tiết trước cả quyết định và lý do.","<b>C.</b> Một bài viết dày đặc không phân biệt bên liên quan buộc mỗi người tự tìm phần mình cần, làm giảm hiệu quả ra quyết định."]}},{"id":"ccarp-q089","n":89,"topic":5,"type":"mcq","stem":{"en":"You are compiling a diagnostic toolkit for Claude Code operational issues. Which two diagnostic actions belong in the toolkit? (Select two.) Each correct answer presents a complete solution.  [Chọn 2 đáp án]","vi":"Bạn đang biên soạn bộ công cụ chẩn đoán cho các vấn đề vận hành của Mã Claude. Hai hành động chẩn đoán nào thuộc về bộ công cụ? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một giải pháp hoàn chỉnh.  [Chọn 2 đáp án]","jp":"クロード コードの運用上の問題に対する診断ツールキットをコンパイルしています。 ツールキットに含まれる 2 つの診断アクションはどれですか? (2 つ選択してください。) それぞれの正解は完全な解決策を示します。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Increase the model sampling temperature so that intermittent issues surface more frequently for analysis.","vi":"Tăng nhiệt độ lấy mẫu mô hình để các vấn đề gián đoạn xuất hiện thường xuyên hơn khi phân tích.","jp":"モデルのサンプリング温度を上げて、断続的な問題がより頻繁に表面化して解析できるようにします。"}},{"k":"B","t":{"en":"File a support ticket with vendor support before any local reproduction or evidence collection.","vi":"Gửi phiếu hỗ trợ với bộ phận hỗ trợ của nhà cung cấp trước khi sao chép hoặc thu thập bằng chứng tại địa phương.","jp":"ローカルで複製または証拠を収集する前に、ベンダー サポートにサポート チケットを提出してください。"}},{"k":"C","t":{"en":"Reproduce the issue with a minimal reproduction case that isolates one variable at a time.","vi":"Tái tạo sự cố bằng trường hợp tái tạo tối thiểu nhằm tách biệt một biến tại một thời điểm.","jp":"一度に 1 つの変数を分離する最小限の再現ケースで問題を再現します。"}},{"k":"D","t":{"en":"Roll back to the previous Claude Code version immediately to confirm whether the issue is version specific.","vi":"Quay lại phiên bản Claude Code trước đó ngay lập tức để xác nhận xem sự cố có phải là phiên bản cụ thể hay không.","jp":"すぐに以前のクロード コード バージョンにロールバックして、問題がバージョン固有のものであるかどうかを確認します。"}},{"k":"E","t":{"en":"List the configured Model Context Protocol (MCP) servers and inspect server status to identify connection failures.","vi":"Liệt kê các máy chủ Giao thức bối cảnh mô hình (MCP) đã định cấu hình và kiểm tra trạng thái máy chủ để xác định lỗi kết nối.","jp":"構成されたモデル コンテキスト プロトコル (MCP) サーバーを一覧表示し、サーバーのステータスを検査して接続エラーを特定します。"}}],"answer":["C","E"],"multi":true,"explain":{"key":"<b>Đáp án C, E.</b><br><b>C:</b> <b>Minimal reproduction</b> thay đổi từng biến một sẽ loại bỏ prompt, tool, setting, hook và trạng thái repo không liên quan, cho bằng chứng trực tiếp xem lỗi gắn với cấu hình, server hay lệnh nào — đồng thời tạo gói bằng chứng nếu sau này cần escalate.<br><b>E:</b> MCP là miền lỗi phổ biến của Claude Code; <code>claude mcp list</code> (hoặc <code>/mcp</code> trong session) liệt kê server đã cấu hình và trạng thái kết nối, giúp phát hiện lỗi kết nối/xác thực.","elim":["<b>A.</b> Tăng temperature làm hành vi thêm ngẫu nhiên, khó tái lập và phân tích hơn, không làm lỗi lộ ra có hệ thống.","<b>B.</b> Mở ticket trước khi tự tái lập hay thu thập bằng chứng khiến bộ phận hỗ trợ thiếu thông tin chẩn đoán cần thiết.","<b>D.</b> Rollback ngay lập tức là biện pháp khắc phục đoán mò, thay đổi nhiều biến cùng lúc và bỏ qua bước thu thập bằng chứng."]},"cite":"Hướng dẫn ôn tập — §4.3 Cấu hình MCP Server; Lĩnh vực 2.4"},{"id":"ccarp-q090","n":90,"topic":5,"type":"mcq","stem":{"en":"A Claude Architect is reviewing a post-deployment performance report for an AI-assisted legal-document summarization system. The report includes these observations: * Average summarization time decreased from 47 minutes to 6 minutes per document. * Associates spend less time on summaries, but overall billable output has not measurably changed. * Infrastructure costs increased by 22% because redundant retry logic generated additional API calls. * Some summaries require attorney correction, adding an average of 8 minutes of review per document. Which analysis correctly attributes each observation to the appropriate business-value pillar?","vi":"Kiến trúc sư Claude đang xem xét báo cáo hiệu suất sau triển khai cho hệ thống tóm tắt tài liệu pháp lý được hỗ trợ bởi AI. Báo cáo bao gồm những quan sát sau: * Thời gian tóm tắt trung bình giảm từ 47 phút xuống còn 6 phút/tài liệu. * Các cộng sự dành ít thời gian hơn cho việc tóm tắt, nhưng tổng sản lượng có thể lập hóa đơn không thay đổi đáng kể. * Chi phí cơ sở hạ tầng tăng 22% do logic thử lại dư thừa tạo ra các lệnh gọi API bổ sung. * Một số bản tóm tắt yêu cầu luật sư chỉnh sửa, thêm trung bình 8 phút xem xét cho mỗi tài liệu. Phân tích nào quy định chính xác từng quan sát cho trụ cột giá trị kinh doanh thích hợp?","jp":"クロード アーキテクトは、AI 支援の法的文書要約システムの導入後のパフォーマンス レポートをレビューしています。レポートには次のような観察結果が含まれています。 * 平均要約時間は、文書あたり 47 分から 6 分に短縮されました。 * 従業員が要約に費やす時間は減りましたが、請求対象となる全体的な生産高は目に見えるほど変化していません。 * 冗長な再試行ロジックにより追加の API 呼び出しが生成されたため、インフラストラクチャのコストが 22% 増加しました。 * 一部の要約では弁護士による修正が必要となり、文書ごとに平均 8 分のレビューが追加されます。 各観察を適切なビジネス価値の柱に正しく帰属させる分析はどれですか?"},"options":[{"k":"A","t":{"en":"Observations 1 and 2 both indicate efficiency gains; Observation 3 is a solution-cost issue; Observation 4 is a performance-SLA issue.","vi":"Quan sát 1 và 2 đều cho thấy mức tăng hiệu quả; Quan sát 3 là vấn đề về giải pháp-chi phí; Quan sát 4 là vấn đề về hiệu suất-SLA.","jp":"観察 1 と 2 は両方とも効率の向上を示しています。観察 3 は、解決策のコストの問題です。観察 4 はパフォーマンス SLA の問題です。"}},{"k":"B","t":{"en":"Observation 1 is a transformation outcome; Observation 2 is an efficiency gain; Observation 3 is a performance-SLA degradation; Observation 4 is a solution-cost issue.","vi":"Quan sát 1 là kết quả chuyển đổi; Quan sát 2 là đạt được hiệu quả; Quan sát 3 là sự suy giảm SLA về hiệu suất; Quan sát 4 là vấn đề về giải pháp-chi phí.","jp":"観察 1 は変換の結果です。観察 2 は効率の向上です。観察 3 は、パフォーマンス SLA の低下です。観察 4 は、解決策のコストの問題です。"}},{"k":"C","t":{"en":"Observations 1 and 4 together indicate a net performance-SLA improvement; Observation 2 is a transformation gap; Observation 3 is a productivity drain from over-engineering.","vi":"Các quan sát 1 và 4 cùng nhau cho thấy sự cải thiện SLA hiệu suất ròng; Quan sát 2 là khoảng trống chuyển đổi; Quan sát 3 là sự sụt giảm năng suất do sử dụng kỹ thuật quá mức.","jp":"観察 1 と 4 は合わせて、正味のパフォーマンス SLA の改善を示しています。観察 2 は変換ギャップです。観察 3 は、過剰なエンジニアリングによる生産性の低下です。"}},{"k":"D","t":{"en":"Observation 1 indicates an efficiency gain; Observation 2 shows that productivity has not yet been realized; Observation 3 is a solution-cost issue; Observation 4 is an efficiency loss that partially offsets Observation 1.","vi":"Quan sát 1 cho thấy mức tăng hiệu quả; Quan sát 2 cho thấy năng suất chưa được hiện thực hóa; Quan sát 3 là vấn đề về giải pháp-chi phí; Quan sát 4 là tổn thất về hiệu quả bù đắp một phần cho Quan sát 1.","jp":"観察 1 は効率の向上を示しています。観察 2 は、生産性がまだ実現されていないことを示しています。観察 3 は、解決策のコストの問題です。観測 4 は、観測 1 を部分的に相殺する効率の損失です。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Phải giữ các trụ giá trị tách biệt: (1) thời gian tóm tắt giảm từ 47 xuống 6 phút là <b>efficiency gain</b> trực tiếp; (2) thời gian tiết kiệm chưa chuyển thành sản lượng billable cho thấy <b>productivity chưa được hiện thực hóa</b>; (3) chi phí hạ tầng tăng 22% do retry thừa là vấn đề <b>solution cost</b>; (4) 8 phút sửa của luật sư là <b>efficiency loss bù trừ một phần</b> cho (1). Chỉ đo tốc độ sinh văn bản sẽ phóng đại giá trị thực.","elim":["<b>A.</b> Gộp quan sát 2 vào efficiency gain là sai vì sản lượng không đổi; xếp quan sát 4 vào performance-SLA bỏ qua bản chất là thời gian con người bù trừ cho hiệu quả.","<b>B.</b> Quan sát 1 là efficiency chứ chưa phải transformation; quan sát 3 là chi phí (retry thừa) chứ không phải suy giảm SLA; quan sát 4 là thời gian sửa, không phải solution cost.","<b>C.</b> Gộp 1 và 4 thành cải thiện SLA làm lẫn trụ giá trị; retry thừa (quan sát 3) là vấn đề chi phí chứ không phải tụt năng suất do over-engineering."]}},{"id":"ccarp-q091","n":91,"topic":5,"type":"mcq","stem":{"en":"You are supporting an engineer whose newly added MCP server does not appear in their Claude Code session. Which diagnostic step should be tried first?","vi":"Bạn đang hỗ trợ một kỹ sư có máy chủ MCP mới được thêm vào không xuất hiện trong phiên Mã Claude của họ. Bước chẩn đoán nào nên được thử đầu tiên?","jp":"あなたは、新しく追加された MCP サーバーがクロード コード セッションに表示されないエンジニアをサポートしています。 最初にどの診断ステップを試行する必要がありますか?"},"options":[{"k":"A","t":{"en":"Disable every MCP server in the configuration to isolate the issue, removing all tool access rather than confirming whether the new server is registered.","vi":"Vô hiệu hóa mọi máy chủ MCP trong cấu hình để tách biệt sự cố, xóa tất cả quyền truy cập vào công cụ thay vì xác nhận xem máy chủ mới có được đăng ký hay không.","jp":"構成内のすべての MCP サーバーを無効にして問題を切り分け、新しいサーバーが登録されているかどうかを確認するのではなく、すべてのツールへのアクセスを削除します。"}},{"k":"B","t":{"en":"Switch the team to a different Claude product family unrelated to the existing workflow, abandoning the current configuration rather than diagnosing the registration issue.","vi":"Chuyển nhóm sang dòng sản phẩm Claude khác không liên quan đến quy trình làm việc hiện tại, từ bỏ cấu hình hiện tại thay vì chẩn đoán vấn đề đăng ký.","jp":"登録の問題を診断するのではなく、現在の構成を放棄して、既存のワークフローとは関係のない別のクロード製品ファミリーにチームを切り替えます。"}},{"k":"C","t":{"en":"Verify the MCP server is registered using the listing command, then reconnect the session if needed, since configuration changes typically require a restart to take effect.","vi":"Xác minh máy chủ MCP đã được đăng ký bằng lệnh liệt kê, sau đó kết nối lại phiên nếu cần, vì các thay đổi cấu hình thường yêu cầu khởi động lại để có hiệu lực.","jp":"構成の変更を有効にするには通常、再起動が必要であるため、listing コマンドを使用して MCP サーバーが登録されていることを確認し、必要に応じてセッションを再接続します。"}},{"k":"D","t":{"en":"Reinstall the developer's operating system from scratch, discarding all local configuration and tool state before attempting any targeted diagnostic steps.","vi":"Cài đặt lại hệ điều hành của nhà phát triển từ đầu, loại bỏ tất cả trạng thái công cụ và cấu hình cục bộ trước khi thử bất kỳ bước chẩn đoán được nhắm mục tiêu nào.","jp":"対象の診断手順を試行する前に、開発者のオペレーティング システムを最初から再インストールし、ローカル構成とツールの状態をすべて破棄します。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Bước chẩn đoán đầu tiên phải xác nhận Claude Code đã <b>đăng ký server</b> chưa bằng lệnh liệt kê (<code>claude mcp list</code>, hoặc <code>/mcp</code> trong session) — lệnh này phân biệt server đã kết nối với server cần xác thực/phê duyệt hoặc đang lỗi. Nếu server được thêm sau khi session bắt đầu, cần <b>khởi động lại/kết nối lại session</b> vì thay đổi cấu hình thường chỉ có hiệu lực khi session mới khởi tạo. Đây là bước rẻ, có mục tiêu và cho bằng chứng trực tiếp.","elim":["<b>A.</b> Tắt mọi MCP server làm mất toàn bộ tool mà không xác nhận được server mới đã đăng ký hay chưa — thao tác phá hủy, không chẩn đoán.","<b>B.</b> Chuyển sang dòng sản phẩm khác là bỏ cuộc, không chẩn đoán vấn đề đăng ký.","<b>D.</b> Cài lại hệ điều hành là biện pháp cực đoan, xóa mọi cấu hình mà chưa thử bước chẩn đoán có mục tiêu nào."]},"cite":"Hướng dẫn ôn tập — §4.3 Cấu hình MCP Server; Lĩnh vực 2.4"},{"id":"ccarp-q092","n":92,"topic":5,"type":"mcq","stem":{"en":"You are a solution architect designing a Claude-based assistant with access to 60 internal tools across multiple business domains. Loading every tool definition on every request increases token usage and time to first response. Which design pattern best addresses this issue without sacrificing capability breadth?","vi":"Bạn là kiến ​​trúc sư giải pháp đang thiết kế một trợ lý dựa trên Claude với quyền truy cập vào 60 công cụ nội bộ trên nhiều lĩnh vực kinh doanh. Tải mọi định nghĩa công cụ cho mỗi yêu cầu sẽ tăng mức sử dụng mã thông báo và thời gian cho phản hồi đầu tiên. Mẫu thiết kế nào giải quyết tốt nhất vấn đề này mà không phải hy sinh khả năng mở rộng?","jp":"あなたは、複数のビジネス ドメインにわたる 60 の内部ツールにアクセスできるクロード ベースのアシスタントを設計するソリューション アーキテクトです。すべてのリクエストですべてのツール定義をロードすると、トークンの使用量が増加し、最初の応答までの時間が増加します。 幅広い機能を犠牲にすることなく、この問題に最もよく対処できる設計パターンはどれでしょうか?"},"options":[{"k":"A","t":{"en":"Apply progressive tool discovery so a curated initial subset is
