ảo từng phần của hướng dẫn? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một phần của giải pháp.  [Chọn 2 đáp án]","jp":"新しい展開のアーキテクチャ ガイドを作成しているため、各セクションの草稿を作成する前に計画手順を完了する必要があります。 ガイドの各セクションを作成する前に、完了する必要がある 2 つの手順はどれですか? (2 つ選択してください。) それぞれの正解は、解決策の一部を示しています。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Identify the audience and the questions the guide must answer for that audience.","vi":"Xác định khán giả và các câu hỏi mà người hướng dẫn phải trả lời cho khán giả đó.","jp":"聴衆と、その聴衆に対してガイドが答えなければならない質問を特定します。"}},{"k":"B","t":{"en":"Translate the guide into the supported regional languages for the candidate population.","vi":"Dịch hướng dẫn sang các ngôn ngữ khu vực được hỗ trợ cho nhóm ứng viên.","jp":"ガイドを候補者向けにサポートされている地域の言語に翻訳します。"}},{"k":"C","t":{"en":"Validate the guide with the implementation team and incorporate corrections.","vi":"Xác nhận hướng dẫn với nhóm thực hiện và kết hợp các chỉnh sửa.","jp":"導入チームと一緒にガイドを検証し、修正を組み込みます。"}},{"k":"D","t":{"en":"Establish the document under version control with a defined review cadence and approver list.","vi":"Thiết lập tài liệu dưới sự kiểm soát phiên bản với nhịp độ xem xét và danh sách người phê duyệt được xác định.","jp":"定義されたレビュー頻度と承認者リストを使用して、バージョン管理下でドキュメントを確立します。"}},{"k":"E","t":{"en":"Outline the guide sections covering the overview, components, contracts, flows, runbooks, and limitations.","vi":"Phác thảo các phần hướng dẫn bao gồm tổng quan, thành phần, hợp đồng, quy trình, sổ sách và các giới hạn.","jp":"概要、コンポーネント、契約、フロー、ランブック、および制限事項をカバーするガイド セクションの概要を説明します。"}}],"answer":["A","E"],"multi":true,"explain":{"key":"<b>Đáp án A, E.</b> Tài liệu hiệu quả bắt đầu bằng phân tích người đọc và lập cấu trúc trước khi viết.<br><b>A:</b> Xác định <b>audience và các câu hỏi tài liệu phải trả lời</b> quyết định độ sâu kỹ thuật, thuật ngữ và trọng tâm vận hành, tránh các mục chung chung.<br><b>E:</b> <b>Lập outline</b> các mục (tổng quan, thành phần, contract, luồng, runbook, giới hạn) bảo đảm bao phủ đầy đủ trước khi viết từng phần.","elim":["<b>B.</b> Dịch sang các ngôn ngữ chỉ làm được khi đã có nội dung nguồn ổn định, tức là sau khi soạn thảo.","<b>C.</b> Xác thực với đội triển khai và sửa lỗi cần có bản nháp trước, nên là bước sau soạn thảo.","<b>D.</b> Đưa vào version control với chu kỳ review và danh sách approver là bước quản trị vòng đời tài liệu, không phải bước lập kế hoạch nội dung bắt buộc trước khi viết từng mục."]}},{"id":"ccarp-q017","n":17,"topic":1,"type":"mcq","stem":{"en":"You are evaluating retrieval-strategy claims used by a peer team. For each claim, select yes if the statement is generally accurate. Otherwise, select no.","vi":"Bạn đang đánh giá các tuyên bố về chiến lược truy xuất được sử dụng bởi một nhóm ngang hàng. Đối với mỗi khẳng định, hãy chọn có nếu nhận định nói chung là chính xác. Nếu không, hãy chọn không.","jp":"あなたは、ピア チームが使用する取得戦略の主張を評価しています。 各主張について、その記述が概ね正確である場合は、「はい」を選択してください。それ以外の場合は、「いいえ」を選択します。"},"options":[{"k":"A","t":{"en":"Yes - Yes - Yes - No - No","vi":"Có - Có - Có - Không - Không","jp":"はい - はい - はい - いいえ - いいえ"}},{"k":"B","t":{"en":"No - No - Yes - Yes - Yes","vi":"Không - Không - Có - Có - Có","jp":"いいえ - いいえ - はい - はい - はい"}},{"k":"C","t":{"en":"No - Yes - Yes - Yes - No","vi":"Không - Có - Có - Có - Không","jp":"いいえ - はい - はい - はい - いいえ"}},{"k":"D","t":{"en":"Yes - No - No - Yes - Yes","vi":"Có - Không - Không - Có - Có","jp":"はい - いいえ - いいえ - はい - はい"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A (Yes – Yes – Yes – No – No).</b> Ba nhận định đầu đúng: <b>dense vector retrieval</b> nắm bắt tương đồng ngữ nghĩa nên khớp được diễn đạt khác nhau (paraphrase); <b>sparse lexical retrieval</b> (kiểu BM25) nhạy với token chính xác nên mạnh với mã định danh, mã sản phẩm, thuật ngữ hiếm; <b>structured query</b> phù hợp khi cần lọc theo trường, join, đếm, gom nhóm, tổng hợp trên schema quan hệ. Hai nhận định cuối không chính xác về mặt tổng quát — mỗi chiến lược có điểm mạnh riêng, nên các khẳng định tuyệt đối kiểu một chiến lược luôn thay thế được chiến lược khác thường là sai; thực tế hay dùng kết hợp (hybrid) và rerank.","elim":["<b>B.</b> Đánh \"No\" cho hai nhận định đầu là sai: tìm kiếm ngữ nghĩa và khớp token chính xác lần lượt là điểm mạnh cốt lõi của dense và sparse retrieval; đồng thời chấp nhận hai nhận định cuối không đúng.","<b>C.</b> Phủ nhận nhận định về dense retrieval (vốn đúng) và chấp nhận nhận định thứ tư (không đúng).","<b>D.</b> Phủ nhận nhận định về sparse retrieval và structured query (đều đúng) trong khi chấp nhận hai nhận định cuối không chính xác."]}},{"id":"ccarp-q018","n":18,"topic":1,"type":"mcq","stem":{"en":"A Claude-based research assistant begins producing responses that confidently contradict its retrieved source documents despite no change to the retrieval pipeline. Which two diagnostic actions most directly identify the root cause of this behavior? (Select two.)  [Chọn 2 đáp án]","vi":"Một trợ lý nghiên cứu có trụ sở tại Claude bắt đầu đưa ra các phản hồi tự tin mâu thuẫn với các tài liệu nguồn được truy xuất của mình mặc dù không có thay đổi nào đối với quy trình truy xuất. Hai hành động chẩn đoán nào xác định trực tiếp nhất nguyên nhân gốc rễ của hành vi này? (Chọn 2.) [Chọn 2 đáp án]","jp":"クロードを拠点とする研究助手は、検索パイプラインに変更がないにもかかわらず、検索したソース文書と自信を持って矛盾する回答を作成し始めます。 この動作の根本原因を最も直接的に特定する 2 つの診断アクションはどれですか? (2 つ選択してください。) [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Increase the context-window size to allow more retrieved chunks per query.","vi":"Tăng kích thước cửa sổ ngữ cảnh để cho phép truy xuất nhiều đoạn hơn cho mỗi truy vấn.","jp":"コンテキスト ウィンドウのサイズを大きくして、クエリごとにより多くのチャンクを取得できるようにします。"}},{"k":"B","t":{"en":"Switch the retrieval index to a denser embedding model to improve chunk-relevance scores.","vi":"Chuyển chỉ mục truy xuất sang mô hình nhúng dày đặc hơn để cải thiện điểm số liên quan đến khối.","jp":"取得インデックスをより高密度の埋め込みモデルに切り替えて、チャンク関連性スコアを向上させます。"}},{"k":"C","t":{"en":"Determine whether the failure reproduces on the previous model version to test for a model mismatch.","vi":"Xác định xem lỗi có tái tạo trên phiên bản mô hình trước đó hay không để kiểm tra xem mô hình có không khớp hay không.","jp":"モデルの不一致をテストするために、以前のモデル バージョンで障害が再現されるかどうかを確認します。"}},{"k":"D","t":{"en":"Reduce the temperature setting to lower response variance across all query types.","vi":"Giảm cài đặt nhiệt độ để giảm phương sai phản hồi trên tất cả các loại truy vấn.","jp":"すべてのクエリ タイプにわたる応答の差異を小さくするには、温度設定を下げます。"}},{"k":"E","t":{"en":"Inspect the system-prompt grounding instructions to determine whether citation constraints remain intact.","vi":"Kiểm tra hướng dẫn nối đất theo lời nhắc của hệ thống để xác định xem các giới hạn trích dẫn có còn nguyên vẹn hay không.","jp":"システムプロンプトのグラウンディング指示を調べて、引用制約がそのまま残っているかどうかを判断します。"}}],"answer":["C","E"],"multi":true,"explain":{"key":"<b>Đáp án C, E.</b> Pipeline truy xuất không đổi, nên điều tra phải cô lập phần <b>sinh câu trả lời</b> và <b>chỉ dẫn grounding</b>.<br><b>C:</b> Chạy lại các ca lỗi trên <b>phiên bản mô hình trước</b> cho biết hồi quy đi theo việc nâng cấp mô hình hay tổ hợp mô hình–prompt hiện tại.<br><b>E:</b> Kiểm tra <b>chỉ dẫn grounding trong system prompt</b> xem yêu cầu dựa vào nguồn, citation, cách xử lý khi không chắc chắn có bị xóa hoặc làm yếu đi không.","elim":["<b>A.</b> Tăng context window để nạp thêm chunk là thay đổi một thành phần chưa có bằng chứng lỗi; vấn đề là mô hình mâu thuẫn với nguồn đã có, không phải thiếu nguồn.","<b>B.</b> Đổi embedding model tác động vào retrieval — thành phần đề nói không thay đổi — và không chẩn đoán được nguyên nhân.","<b>D.</b> Giảm temperature là biện pháp giảm triệu chứng, không xác định root cause; mô hình vẫn có thể trả lời sai một cách nhất quán."]},"cite":"Hướng dẫn ôn tập — §12.1 Vấn đề Mất Quy kết Nguồn; Lĩnh vực 5.6"},{"id":"ccarp-q019","n":19,"topic":1,"type":"mcq","stem":{"en":"A solutions architect is analyzing stakeholder feedback collected after the first quarter of a Claude-powered procurement automation deployment. The feedback includes four statements: (1) \"Our procurement team is processing 3x more purchase orders per analyst per day.\" (2) \"We have eliminated the manual data entry role entirely and redeployed those staff to vendor relationship management.\" (3) \"The API integration costs are running 40% over the projected per-transaction budget.\" (4) \"Response latency during end-of-month batch runs is averaging 11 seconds, against our committed 5-second SLA.\" Which of the following correctly identifies the primary business value pillar each stakeholder statement represents?","vi":"Một kiến ​​trúc sư giải pháp đang phân tích phản hồi của các bên liên quan được thu thập sau quý đầu tiên của quá trình triển khai tự động hóa mua sắm do Claude hỗ trợ. Phản hồi bao gồm bốn tuyên bố: (1) \"Nhóm mua sắm của chúng tôi đang xử lý gấp 3 lần đơn đặt hàng cho mỗi nhà phân tích mỗi ngày.\" (2) \"Chúng tôi đã loại bỏ hoàn toàn vai trò nhập dữ liệu thủ công và bố trí lại những nhân viên đó để quản lý mối quan hệ với nhà cung cấp.\" (3) \"Chi phí tích hợp API đang chiếm 40% so với ngân sách dự kiến ​​cho mỗi giao dịch.\" (4) \"Độ trễ phản hồi trong quá trình chạy hàng loạt cuối tháng là trung bình 11 giây, so với SLA 5 giây đã cam kết của chúng tôi.\" Điều nào sau đây xác định chính xác trụ cột giá trị kinh doanh chính mà mỗi tuyên bố của bên liên quan đại diện?","jp":"ソリューション アーキテクトは、Claude による調達自動化導入の第 1 四半期後に収集された関係者からのフィードバックを分析しています。フィードバックには次の 4 つの記述が含まれています。 (1) 「当社の調達チームは、アナリストあたり 1 日あたり 3 倍の発注書を処理しています。」 (2) 「手動データ入力の役割を完全に廃止し、それらのスタッフをベンダー関係管理に再配置しました。」 (3) 「API 統合コストは、トランザクションごとの予測予算を 40% 上回っています。」 (4) 「月末のバッチ実行中の応答遅延は、当社が約束した 5 秒の SLA に対して、平均 11 秒です。」各ステークホルダーのステートメントが表す主なビジネス価値の柱を正しく特定しているのは次のうちどれですか?"},"options":[{"k":"A","t":{"en":"Statement 1: Efficiency; Statement 2: Transformation; Statement 3: Solution Cost; Statement 4: Performance SLA","vi":"Tuyên bố 1: Hiệu quả; Tuyên bố 2: Sự chuyển đổi; Tuyên bố 3: Chi phí giải pháp; Tuyên bố 4: SLA hiệu suất","jp":"ステートメント 1: 効率。ステートメント 2: 変革。ステートメント 3: ソリューションのコスト。ステートメント 4: パフォーマンス SLA"}},{"k":"B","t":{"en":"Statement 1: Productivity; Statement 2: Efficiency; Statement 3: Solution Cost; Statement 4: Performance SLA","vi":"Tuyên bố 1: Năng suất; Tuyên bố 2: Hiệu quả; Tuyên bố 3: Chi phí giải pháp; Tuyên bố 4: SLA hiệu suất","jp":"ステートメント 1: 生産性。ステートメント 2: 効率。ステートメント 3: ソリューションのコスト。ステートメント 4: パフォーマンス SLA"}},{"k":"C","t":{"en":"Statement 1: Transformation; Statement 2: Productivity; Statement 3: Solution Cost; Statement 4: Efficiency","vi":"Tuyên bố 1: Sự chuyển đổi; Tuyên bố 2: Năng suất; Tuyên bố 3: Chi phí giải pháp; Tuyên bố 4: Hiệu quả","jp":"ステートメント 1: 変革。ステートメント 2: 生産性。ステートメント 3: ソリューションのコスト。ステートメント 4: 効率"}},{"k":"D","t":{"en":"Statement 1: Efficiency; Statement 2: Productivity; Statement 3: Performance SLA; Statement 4: Solution Cost","vi":"Tuyên bố 1: Hiệu quả; Tuyên bố 2: Năng suất; Tuyên bố 3: SLA hiệu suất; Tuyên bố 4: Chi phí giải pháp","jp":"ステートメント 1: 効率。ステートメント 2: 生産性。ステートメント 3: パフォーマンス SLA。ステートメント 4: ソリューションのコスト"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Phát biểu 1 là <b>Efficiency</b>: cùng một đơn vị (một analyst) xử lý gấp 3 lần số PO mỗi ngày — tăng thông lượng trong quy trình hiện có. Phát biểu 2 là <b>Transformation</b>: không chỉ tăng tốc nhập liệu mà <b>loại bỏ hẳn vai trò</b> và tái bố trí nhân sự sang quản lý quan hệ nhà cung cấp — thay đổi cấu trúc vận hành. Phát biểu 3 là <b>Solution Cost</b> (chi phí tích hợp API vượt 40% ngân sách mỗi giao dịch), và phát biểu 4 là <b>Performance SLA</b> (latency 11 giây so với cam kết 5 giây).","elim":["<b>B.</b> Phát biểu 2 là thay đổi cấu trúc vai trò (Transformation), không phải Efficiency; còn phát biểu 1 đo thông lượng trên cùng đơn vị lao động nên đúng hơn là Efficiency.","<b>C.</b> Phát biểu 1 chỉ là tăng thông lượng trong quy trình cũ, chưa phải Transformation; và latency vượt SLA (phát biểu 4) là Performance SLA chứ không phải Efficiency.","<b>D.</b> Đảo ngược phát biểu 3 và 4: vượt ngân sách mỗi giao dịch là Solution Cost, latency vượt cam kết là Performance SLA; phát biểu 2 cũng không phải Productivity."]}},{"id":"ccarp-q020","n":20,"topic":1,"type":"mcq","stem":{"en":"You are a solution architect evaluating candidate use cases for a Claude-based program. For each scenario, select Yes if Claude is appropriate as the primary solution at the architectural level. Otherwise, select No.","vi":"Bạn là kiến ​​trúc sư giải pháp đang đánh giá các trường hợp sử dụng ứng viên cho chương trình dựa trên Claude. Đối với mỗi kịch bản, hãy chọn Có nếu Claude phù hợp làm giải pháp chính ở cấp độ kiến ​​trúc. Ngược lại chọn Không.","jp":"あなたは、クロードベースのプログラムの候補となるユースケースを評価するソリューションアーキテクトです。 各シナリオで、アーキテクチャ レベルでの主要なソリューションとしてクロードが適切な場合は、[はい] を選択します。 それ以外の場合は、「いいえ」を選択します。"},"options":[{"k":"A","t":{"en":"No - Yes - Yes - Yes - No","vi":"Không - Có - Có - Có - Không","jp":"いいえ - はい - はい - はい - いいえ"}},{"k":"B","t":{"en":"Yes - Yes - No - Yes - No","vi":"Có - Có - Không - Có - Không","jp":"はい - はい - いいえ - はい - いいえ"}},{"k":"C","t":{"en":"Yes - Yes - Yes - No - No","vi":"Có - Có - Có - Không - Không","jp":"はい - はい - はい - いいえ - いいえ"}},{"k":"D","t":{"en":"Yes - No - Yes - No - Yes","vi":"Có - Không - Có - Không - Có","jp":"はい - いいえ - はい - いいえ - はい"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D (Yes – No – Yes – No – Yes).</b> Claude phù hợp với tác vụ <b>nặng về ngôn ngữ</b>: soạn bản nháp báo cáo điều tra từ log bán cấu trúc để analyst review (Yes), review hợp đồng dài với trích xuất điều khoản có cấu trúc và đánh dấu sai lệch (Yes), định tuyến ticket vào 30 nhóm kèm lý do (Yes). Ngược lại, tính điểm gian lận real-time <b>dưới 50 ms</b> trên streaming pipeline đòi hỏi latency và tính tất định mà mô hình ML chuyên dụng phù hợp hơn (No). Thay thế <b>vector index</b> cho truy xuất ngữ nghĩa trên hàng triệu tài liệu cũng sai vai trò — LLM không phải hạ tầng index/tìm kiếm (No).","elim":["<b>A.</b> Đánh \"No\" cho soạn báo cáo điều tra (vốn là thế mạnh của Claude) và \"Yes\" cho chấm điểm gian lận dưới 50 ms cùng thay vector index — hai ca không phù hợp.","<b>B.</b> Chấp nhận chấm điểm gian lận real-time và thay vector index, đồng thời bác bỏ review hợp đồng dài và định tuyến ticket — đều là ca phù hợp.","<b>C.</b> Chấp nhận chấm điểm gian lận dưới 50 ms (không phù hợp) và bác bỏ định tuyến ticket kèm lý do (phù hợp)."]}}]},{"n":2,"title":{"en":"Practice Set 2","vi":"Bộ đề số 2","jp":"練習問題 2"},"questions":[{"id":"ccarp-q021","n":21,"topic":2,"type":"mcq","stem":{"en":"You are an architect supporting the iteration phase of a deployed Claude-based system. Which activity most directly fits this phase?","vi":"Bạn là kiến ​​trúc sư hỗ trợ giai đoạn lặp lại của hệ thống dựa trên Claude đã triển khai. Hoạt động nào phù hợp trực tiếp nhất với giai đoạn này?","jp":"あなたは、デプロイされたクロードベースのシステムの反復フェーズをサポートするアーキテクトです。 このフェーズに最も直接的に適合するアクティビティはどれですか?"},"options":[{"k":"A","t":{"en":"Rebuild the entire system architecture from scratch at the start of every iteration cycle regardless of what production telemetry, evaluations, and stakeholder feedback indicate is needed.","vi":"Xây dựng lại toàn bộ kiến ​​trúc hệ thống từ đầu khi bắt đầu mỗi chu kỳ lặp lại bất kể việc đo từ xa sản xuất, đánh giá và phản hồi của các bên liên quan cho thấy điều gì là cần thiết.","jp":"運用テレメトリ、評価、関係者のフィードバックが必要であることを示しているかどうかに関係なく、各反復サイクルの開始時にシステム アーキテクチャ全体を最初から再構築します。"}},{"k":"B","t":{"en":"Stop measuring production outcomes once the deployment has successfully launched, treating the go- live milestone as the end of the evaluation and iteration cycle.","vi":"Dừng đo lường kết quả sản xuất sau khi triển khai thành công, coi cột mốc đi vào hoạt động là điểm kết thúc của chu trình đánh giá và lặp lại.","jp":"導入が正常に開始されたら、運用成果の測定を停止し、稼働マイルストーンを評価と反復サイクルの終了として扱います。"}},{"k":"C","t":{"en":"Discard the evaluation framework and reference set once the deployment is in production, accepting that future iterations will have no structured basis for measuring the impact of changes.","vi":"Loại bỏ khung đánh giá và bộ tham chiếu sau khi quá trình triển khai được đưa vào sản xuất, chấp nhận rằng các lần lặp lại trong tương lai sẽ không có cơ sở có cấu trúc để đo lường tác động của các thay đổi.","jp":"導入が本番環境になったら、評価フレームワークとリファレンス セットを破棄し、将来の反復では変更の影響を測定するための構造化された基盤がないことを受け入れます。"}},{"k":"D","t":{"en":"Review production telemetry, sampled output evaluations, and stakeholder feedback to identify the highest-impact change for the next cycle, then plan the change against the evaluation framework .","vi":"Xem xét dữ liệu đo từ xa về sản xuất, đánh giá đầu ra được lấy mẫu và phản hồi của các bên liên quan để xác định thay đổi có tác động cao nhất cho chu kỳ tiếp theo, sau đó lập kế hoạch thay đổi dựa trên khung đánh giá.","jp":"生産テレメトリー、サンプリングされた出力評価、関係者のフィードバックをレビューして、次のサイクルに最も大きな影響を与える変更を特定し、評価フレームワークに照らして変更を計画します。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Giai đoạn iteration là vòng cải tiến <b>dựa trên bằng chứng</b> sau triển khai. Ba nguồn đầu vào bổ sung cho nhau: <b>telemetry production</b> (latency, chi phí, lỗi, tool failure), <b>đánh giá mẫu output</b> (chất lượng, grounding, an toàn mà metric hạ tầng không thấy) và <b>phản hồi stakeholder</b> (còn đáp ứng nhu cầu nghiệp vụ hay không). Chọn thay đổi có tác động lớn nhất rồi <b>lập kế hoạch đối chiếu với evaluation framework</b> giúp đo được tác động và phát hiện hồi quy.","elim":["<b>A.</b> Xây lại toàn bộ kiến trúc mỗi chu kỳ bất kể dữ liệu chỉ ra gì là lãng phí, rủi ro cao và không dựa trên bằng chứng.","<b>B.</b> Ngừng đo lường sau go-live loại bỏ chính dữ liệu mà iteration cần; go-live không phải là điểm kết thúc vòng đời.","<b>C.</b> Bỏ evaluation framework và reference set khiến các thay đổi sau này không có cơ sở đo tác động hay phát hiện hồi quy."]}},{"id":"ccarp-q022","n":22,"topic":2,"type":"mcq","stem":{"en":"You are classifying chunking strategies by the corpus type each is best suited to. For each chunking strategy, select the appropriate corpus type: \"Long Structured Documents,\" \"Heterogeneous Short Records,\" or \"Code or Hierarchical Specifications.\"","vi":"Bạn đang phân loại các chiến lược phân đoạn theo loại kho văn bản phù hợp nhất. Đối với mỗi chiến lược phân nhóm, hãy chọn loại kho văn bản thích hợp: \"Tài liệu có cấu trúc dài\", \"Bản ghi ngắn không đồng nhất\" hoặc \"Thông số kỹ thuật mã hoặc phân cấp\".","jp":"チャンキング戦略を、それぞれが最適なコーパス タイプによって分類しています。 チャンキング戦略ごとに、適切なコーパス タイプ (「長い構造化文書」、「異種の短いレコード」、または「コードまたは階層仕様」) を選択します。"},"options":[{"k":"A","t":{"en":"Code or Hierarchical Specs · Code or Hierarchical Specs · Heterogeneous Short Records · Long Structured Documents · Heterogeneous Short Records · Long Structured Documents","vi":"Mã hoặc thông số phân cấp · Mã hoặc thông số phân cấp · Bản ghi ngắn không đồng nhất · Tài liệu có cấu trúc dài · Bản ghi ngắn không đồng nhất · Tài liệu có cấu trúc dài","jp":"コードまたは階層仕様 · コードまたは階層仕様 · 異種の短いレコード · 長い構造化ドキュメント · 異種の短いレコード · 長い構造化ドキュメント"}},{"k":"B","t":{"en":"Code or Hierarchical Specs · Heterogeneous Short Records · Heterogeneous Short Records · Long Structured Documents · Long Structured Documents · Code or Hierarchical Specs","vi":"Mã hoặc thông số phân cấp · Bản ghi ngắn không đồng nhất · Bản ghi ngắn không đồng nhất · Tài liệu có cấu trúc dài · Tài liệu có cấu trúc dài · Mã hoặc thông số phân cấp","jp":"コードまたは階層仕様 · 異種の短いレコード · 異種の短いレコード · 長い構造のドキュメント · 長い構造のドキュメント · コードまたは階層の仕様"}},{"k":"C","t":{"en":"Heterogeneous Short Records · Code or Hierarchical Specs · Code or Hierarchical Specs · Long Structured Documents · Long Structured Documents · Heterogeneous Short Records","vi":"Bản ghi ngắn không đồng nhất · Thông số mã hoặc thông số phân cấp · Mã hoặc thông số phân cấp · Tài liệu có cấu trúc dài · Tài liệu có cấu trúc dài · Bản ghi ngắn không đồng nhất","jp":"異種の短いレコード · コードまたは階層仕様 · コードまたは階層仕様 · 長い構造のドキュメント · 長い構造のドキュメント · 異種の短いレコード"}},{"k":"D","t":{"en":"Code or Hierarchical Specs · Heterogeneous Short Records · Long Structured Documents · Code or Hierarchical Specs · Long Structured Documents · Heterogeneous Short Records","vi":"Thông số mã hoặc phân cấp · Bản ghi ngắn không đồng nhất · Tài liệu có cấu trúc dài · Thông số mã hoặc phân cấp · Tài liệu có cấu trúc dài · Bản ghi ngắn không đồng nhất","jp":"コードまたは階層仕様 · 異種の短いレコード · 長い構造のドキュメント · コードまたは階層の仕様 · 長い構造のドキュメント · 異種の短いレコード"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Chunking phải <b>bảo toàn đơn vị cấu trúc tự nhiên</b> của từng loại corpus. Chunk theo function/section cho module code và chunk theo cây (tree-aware) bám hệ thống cấp bậc của code/spec → <b>Code or Hierarchical Specs</b>. Mỗi record một chunk, và fixed-size có overlap cho record ngắn có độ dài tương đương → <b>Heterogeneous Short Records</b>. Semantic chunking theo ranh giới điều khoản/đoạn văn, và hierarchical chunking phản chiếu cấu trúc mục của tài liệu → <b>Long Structured Documents</b>.","elim":["<b>B.</b> Gán tree-aware chunking cho short records (sai — nó dành cho cấu trúc phân cấp) và hierarchical chunking theo mục tài liệu cho code; đồng thời xếp fixed-size cho record ngắn vào tài liệu dài.","<b>C.</b> Gán chunk theo function cho short records và per-record chunking cho code — ngược với đơn vị tự nhiên của từng corpus.","<b>D.</b> Xếp tree-aware cho short records, per-record cho tài liệu dài và semantic chunking theo điều khoản cho code — các cặp đều lệch với cấu trúc corpus."]}},{"id":"ccarp-q023","n":23,"topic":2,"type":"mcq","stem":{"en":"You are evaluating prompting claims in a peer's design document. For each claim, select yes if the claim reflects sound practice. Otherwise, select no.","vi":"Bạn đang đánh giá các yêu cầu nhắc nhở trong tài liệu thiết kế của một đối tác ngang hàng. Đối với mỗi yêu cầu, hãy chọn có nếu yêu cầu đó phản ánh thực tiễn đúng đắn. Nếu không, hãy chọn không.","jp":"あなたは、ピアの設計ドキュメントでプロンプト クレームを評価しています。 各主張について、その主張が健全な慣行を反映している場合は、「はい」を選択します。それ以外の場合は、「いいえ」を選択します。"},"options":[{"k":"A","t":{"en":"Yes - Yes - No - Yes - No","vi":"Có - Có - Không - Có - Không","jp":"はい - はい - いいえ - はい - いいえ"}},{"k":"B","t":{"en":"Yes - No - Yes - Yes - No","vi":"Có - Không - Có - Có - Không","jp":"はい - いいえ - はい - はい - いいえ"}},{"k":"C","t":{"en":"Yes - Yes - Yes - No - No","vi":"Có - Có - Có - Không - Không","jp":"はい - はい - はい - いいえ - いいえ"}},{"k":"D","t":{"en":"Yes - No - Yes - No - Yes","vi":"Có - Không - Có - Không - Có","jp":"はい - いいえ - はい - いいえ - はい"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A (Yes – Yes – No – Yes – No).</b> Nhận định 1 đúng: <b>zero-shot</b> là baseline hợp lý cho classifier tập đóng khi nhãn và định nghĩa nhãn đã rõ, sau đó đo trên eval set trước khi thêm độ phức tạp. Nhận định 2 đúng: <b>few-shot với ví dụ dùng đúng tên trường</b> là cách tin cậy nhất để định hướng định dạng và cấu trúc output cho extraction. Nhận định 4 cũng phản ánh thực hành vững, còn nhận định 3 và 5 là thực hành không đúng (đi ngược nguyên tắc tiêu chí tường minh, đo lường bằng eval và ví dụ đa dạng, có chủ đích).","elim":["<b>B.</b> Đánh \"No\" cho việc dùng few-shot với đúng tên trường để trích xuất — vốn là thực hành được khuyến nghị — và chấp nhận nhận định 3 không vững.","<b>C.</b> Chấp nhận nhận định 3 (không vững) và bác bỏ nhận định 4 (thực hành đúng).","<b>D.</b> Bác bỏ few-shot cho extraction và nhận định 4, đồng thời chấp nhận nhận định 3 và 5 — ngược hoàn toàn với ba ô cuối của đáp án đúng."]},"cite":"Hướng dẫn ôn tập — §6.1 Few-shot Prompting; Lĩnh vực 4.2"},{"id":"ccarp-q024","n":24,"topic":2,"type":"mcq","stem":{"en":"You are assessing a Claude-based system whose dominant risk is silent quality drift on safetyrelevant outputs after a model-version upgrade. Which assessment activity most directly addresses this risk?","vi":"Bạn đang đánh giá một hệ thống dựa trên Claude có rủi ro chủ yếu là chất lượng âm thầm bị thay đổi trên các đầu ra liên quan đến an toàn sau khi nâng cấp phiên bản mô hình. Hoạt động đánh giá nào giải quyết trực tiếp nhất rủi ro này?","jp":"あなたは、モデル バージョンのアップグレード後の安全関連出力におけるサイレント品質ドリフトが主なリスクであるクロード ベースのシステムを評価しています。 このリスクに最も直接的に対処する評価活動はどれですか?"},"options":[{"k":"A","t":{"en":"Disable adversarial evaluation entirely during model-version upgrade cycles to reduce evaluation cost, accepting that safety drift will go undetected until it appears in production.","vi":"Vô hiệu hóa hoàn toàn đánh giá đối nghịch trong chu kỳ nâng cấp phiên bản mô hình để giảm chi phí đánh giá, chấp nhận rằng sai lệch an toàn sẽ không bị phát hiện cho đến khi nó xuất hiện trong sản xuất.","jp":"安全性ドリフトが本番環境に現れるまで検出されないことを受け入れ、モデル バージョンのアップグレード サイクル中は敵対的評価を完全に無効にして評価コストを削減します。"}},{"k":"B","t":{"en":"Rotate adversarial inputs randomly so no two upgrades are scored on the same set.","vi":"Xoay ngẫu nhiên các đầu vào đối nghịch để không có hai nâng cấp nào được ghi trên cùng một bộ.","jp":"敵対的な入力をランダムにローテーションして、同じセットで 2 つのアップグレードがスコアリングされないようにします。"}},{"k":"C","t":{"en":"Skip evaluation on each model-version upgrade and rely on user-submitted complaints to surface safety drift after the upgraded model has already served production traffic.","vi":"Bỏ qua đánh giá đối với mỗi lần nâng cấp phiên bản mô hình và dựa vào các khiếu nại do người dùng gửi về độ lệch an toàn bề mặt sau khi mô hình nâng cấp đã phục vụ lưu lượng sản xuất.","jp":"各モデル バージョンのアップグレードの評価をスキップし、アップグレードされたモデルがすでに運用トラフィックに対応した後、表面の安全性ドリフトに対してユーザーが提出した苦情に依存します。"}},{"k":"D","t":{"en":"Maintain an adversarial evaluation set with version-attributed scoring so each upgrade is measured against the same set before promotion.","vi":"Duy trì một bộ đánh giá đối thủ bằng cách tính điểm theo phiên bản để mỗi lần nâng cấp được đo lường dựa trên cùng một bộ trước khi thăng cấp.","jp":"バージョン属性のスコアリングを使用して敵対的評価セットを維持し、昇格前に各アップグレードが同じセットに対して測定されるようにします。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Rủi ro chính là <b>trôi chất lượng âm thầm</b> trên output liên quan an toàn sau nâng cấp mô hình. Một <b>adversarial eval set cố định</b> với <b>điểm số gắn theo phiên bản</b> cho phép so sánh táo-với-táo giữa các phiên bản: cải thiện, giữ nguyên hay suy giảm trên cùng các ca nhạy cảm. Chạy <b>trước khi promote</b> giúp hồi quy chặn được việc triển khai thay vì trở thành sự cố production.","elim":["<b>A.</b> Tắt adversarial eval khi nâng cấp chính là chấp nhận để drift lọt vào production — ngược với mục tiêu phát hiện drift.","<b>B.</b> Xoay vòng ngẫu nhiên tập đầu vào làm mất tính so sánh giữa các phiên bản, nên không thể quy thay đổi điểm số cho mô hình.","<b>C.</b> Dựa vào khiếu nại người dùng là phát hiện bị động, sau khi output không an toàn đã phục vụ traffic thật."]}},{"id":"ccarp-q025","n":25,"topic":2,"type":"mcq","stem":{"en":"You are responding to an adversarial input pattern in which users include text claiming admin authority and instructing the model to bypass safety restrictions. Which combination of controls most effectively mitigates this attack pattern?","vi":"Bạn đang phản hồi một mẫu đầu vào đối nghịch trong đó người dùng bao gồm văn bản xác nhận quyền quản trị viên và hướng dẫn mô hình bỏ qua các hạn chế an toàn. Sự kết hợp các biện pháp kiểm soát nào giúp giảm thiểu kiểu tấn công này một cách hiệu quả nhất?","jp":"ユーザーが管理者権限を主張し、安全制限をバイパスするようにモデルに指示するテキストを含む、敵対的な入力パターンに応答していることになります。 この攻撃パターンを最も効果的に軽減する制御の組み合わせはどれですか?"},"options":[{"k":"A","t":{"en":"Trusting that the model will intrinsically recognize and reject all bypass attempts without promptlevel instructions, runtime classifiers, scoped permissions, or audit logging.","vi":"Tin tưởng rằng về bản chất, mô hình sẽ nhận dạng và từ chối tất cả các nỗ lực bỏ qua mà không có hướng dẫn cấp độ nhắc nhở, bộ phân loại thời gian chạy, quyền trong phạm vi hoặc ghi nhật ký kiểm tra.","jp":"プロンプトレベルの命令、実行時分類子、スコープ指定されたアクセス許可、または監査ログなしで、モデルが本質的にすべてのバイパス試行を認識し、拒否すると信頼します。"}},{"k":"B","t":{"en":"Prompt-level instructions that treat user content as untrusted data, runtime classifiers that detect override attempts, scoped tool permissions that cannot be elevated by user content, and audit logging of attempts.","vi":"Các hướng dẫn ở cấp độ nhắc nhở xử lý nội dung của người dùng dưới dạng dữ liệu không đáng tin cậy, bộ phân loại thời gian chạy phát hiện các lần ghi đè, các quyền của công cụ trong phạm vi mà nội dung người dùng không thể nâng cao và ghi nhật ký kiểm tra các lần thử.","jp":"ユーザー コンテンツを信頼できないデータとして扱うプロンプト レベルの指示、オーバーライドの試みを検出するランタイム分類子、ユーザー コンテンツによって昇格できないスコープ指定されたツールのアクセス許可、および試行の監査ログ。"}},{"k":"C","t":{"en":"Removing all safety restrictions and guardrails to eliminate the attack surface that bypass attempts target, accepting that this makes the assistant unrestricted for all inputs.","vi":"Loại bỏ tất cả các hạn chế và rào chắn an toàn để loại bỏ bề mặt tấn công vượt qua mục tiêu cố gắng, đồng thời chấp nhận rằng điều này khiến trợ lý không bị hạn chế đối với tất cả các đầu vào.","jp":"すべての安全制限とガードレールを削除して、ターゲットをバイパスする攻撃対象領域を排除し、これによりアシスタントがすべての入力に対して制限されなくなることを受け入れます。"}},{"k":"D","t":{"en":"Granting users any privilege level they assert in their message content, on the assumption that cooperative behavior requires honoring self-declared authority without independent verification.","vi":"Cấp cho người dùng bất kỳ mức đặc quyền nào mà họ khẳng định trong nội dung tin nhắn của mình, với giả định rằng hành vi hợp tác đòi hỏi phải tôn trọng quyền tự tuyên bố mà không cần xác minh độc lập.","jp":"協力的な行動には独立した検証なしに自己宣言した権限を尊重する必要があるという前提で、メッセージの内容で主張するあらゆる特権レベルをユーザーに付与します。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Tuyên bố \"tôi là admin\" trong nội dung tin nhắn là <b>dữ liệu không tin cậy</b>, không phải danh tính đã xác thực. Phương án B kết hợp các lớp độc lập (<b>defense in depth</b>): prompt coi nội dung người dùng là untrusted; <b>classifier runtime</b> phát hiện nỗ lực override; <b>quyền tool được thực thi ngoài mô hình</b> và xuất phát từ danh tính/vai trò đã xác thực nên không thể bị nâng bởi nội dung hội thoại; <b>audit log</b> ghi lại các nỗ lực để điều tra và cải tiến.","elim":["<b>A.</b> Tin rằng mô hình tự nhận diện mọi nỗ lực bypass là dựa vào một lớp xác suất duy nhất, không có kiểm soát tất định hay khả năng truy vết.","<b>C.</b> Gỡ bỏ mọi guardrail không \"loại bỏ bề mặt tấn công\" mà trao luôn cho kẻ tấn công điều họ muốn.","<b>D.</b> Cấp quyền theo tuyên bố tự khai trong tin nhắn là lỗi phân quyền nghiêm trọng; quyền phải dựa trên xác thực độc lập."]},"cite":"Hướng dẫn ôn tập — Lĩnh vực 1.5 Agent SDK Hook để Chặn Lời gọi Tool và Chuẩn hóa Dữ liệu"},{"id":"ccarp-q026","n":26,"topic":2,"type":"mcq","stem":{"en":"An operations engineer reports that a Claude-based pipeline began returning malformed JSON responses after a scheduled maintenance window, causing downstream processing failures. Which two investigative steps most directly isolate the root cause? (Select two.)  [Chọn 2 đáp án]","vi":"Một kỹ sư vận hành báo cáo rằng quy trình dựa trên Claude bắt đầu trả về các phản hồi JSON không đúng định dạng sau khoảng thời gian bảo trì theo lịch trình, gây ra lỗi xử lý xuôi dòng. Hai bước điều tra nào giúp cô lập nguyên nhân gốc rễ một cách trực tiếp nhất? (Chọn 2.) [Chọn 2 đáp án]","jp":"運用エンジニアは、スケジュールされたメンテナンス時間枠の後にクロードベースのパイプラインが不正な JSON 応答を返し始め、ダウンストリーム処理エラーが発生したと報告しました。 根本原因を最も直接的に特定する 2 つの調査手順はどれですか? (2 つ選択してください。) [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Clear the prompt cache and resubmit all pending requests to eliminate stale cached prefixes.","vi":"Xóa bộ đệm nhắc nhở và gửi lại tất cả các yêu cầu đang chờ xử lý để loại bỏ các tiền tố cũ được lưu trong bộ nhớ đệm.","jp":"プロンプト キャッシュをクリアし、保留中のリクエストをすべて再送信して、キャッシュされた古いプレフィックスを削除します。"}},{"k":"B","t":{"en":"Compare the current system prompt and output schema configuration against the last known good version from before the maintenance window.","vi":"So sánh cấu hình lược đồ đầu ra và lời nhắc hệ thống hiện tại với phiên bản tốt đã biết gần đây nhất trước thời gian bảo trì.","jp":"現在のシステム プロンプトおよび出力スキーマ構成を、メンテナンス期間前の最新の正常なバージョンと比較します。"}},{"k":"C","t":{"en":"Switch to a different Claude model tier to rule out provider-side changes as a contributing factor.","vi":"Chuyển sang cấp mô hình Claude khác để loại trừ các thay đổi từ phía nhà cung cấp được coi là yếu tố góp phần.","jp":"プロバイダー側​​の変更が要因である可能性を排除するには、別のクロード モデル層に切り替えます。"}},{"k":"D","t":{"en":"Increase the max_tokens limit to determine whether output truncation is causing incomplete JSON structures.","vi":"Tăng giới hạn max_tokens để xác định xem việc cắt bớt đầu ra có gây ra cấu trúc JSON không đầy đủ hay không.","jp":"max_tokens 制限を増やして、出力の切り捨てが不完全な JSON 構造を引き起こしているかどうかを判断します。"}},{"k":"E","t":{"en":"Replay a set of premaintenance requests against the current configuration and inspect the raw model output before downstream parsing.","vi":"Phát lại một tập hợp các yêu cầu bảo trì trước đối với cấu hình hiện tại và kiểm tra đầu ra của mô hình thô trước khi phân tích cú pháp xuôi dòng.","jp":"現在の構成に対して一連の事前メンテナンス リクエストを再生し、ダウンストリーム解析の前に生のモデル出力を検査します。"}}],"answer":["B","E"],"multi":true,"explain":{"key":"<b>Đáp án B, E.</b> Lỗi xuất hiện ngay sau cửa sổ bảo trì, nên cần cô lập <b>drift cấu hình</b> bằng so sánh và tái hiện có kiểm soát.<br><b>B:</b> So <b>system prompt và cấu hình output schema</b> hiện tại với phiên bản tốt gần nhất trước bảo trì để tìm thay đổi như mất chỉ dẫn định dạng, schema bị sửa, structured output bị tắt.<br><b>E:</b> <b>Replay các request trước bảo trì</b> trên cấu hình hiện tại và xem <b>raw output trước khi parse</b> để xác định lỗi nằm ở output mô hình hay ở parser downstream.","elim":["<b>A.</b> Xóa prompt cache không chẩn đoán gì; cache chỉ dùng lại prefix đã xử lý, không làm thay đổi nội dung output, và resubmit hàng loạt có thể nhân rộng lỗi.","<b>C.</b> Đổi model tier là thay đổi thêm một biến khi chưa có bằng chứng, làm rối việc cô lập nguyên nhân thay vì xác định nó.","<b>D.</b> Tăng <code>max_tokens</code> chỉ hợp lý khi đã thấy <code>stop_reason</code> là <code>max_tokens</code>; đây là đoán mò thay vì đối chiếu cấu hình và kiểm tra raw output."]},"cite":"Hướng dẫn ôn tập — §2.4 JSON Schema cho Structured Output; Lĩnh vực 4.4"},{"id":"ccarp-q027","n":27,"topic":2,"type":"mcq","stem":{"en":"Engineering leadership wants to roll out Claude Skills to 280 developers across 14 teams. Skills will encode internal coding standards, code-review checklists, and incident-postmortem templates. Leadership has asked how to govern Skill authorship so that Skills remain trustworthy without bottlenecking on a single central team. Which governance model should you recommend?","vi":"Lãnh đạo kỹ thuật muốn triển khai Claude Skills cho 280 nhà phát triển thuộc 14 nhóm. Các kỹ năng sẽ mã hóa các tiêu chuẩn mã hóa nội bộ, danh sách kiểm tra đánh giá mã và các mẫu sau khi xảy ra sự cố. Ban lãnh đạo đã hỏi cách quản lý quyền tác giả Kỹ năng để Kỹ năng vẫn đáng tin cậy mà không gây cản trở cho một nhóm trung tâm duy nhất. Bạn nên giới thiệu mô hình quản trị nào?","jp":"エンジニアリングのリーダーシップは、14 チームの 280 人の開発者にクロード スキルを展開したいと考えています。 スキルは、内部コーディング標準、コードレビューチェックリスト、インシデント事後分析テンプレートをエンコードします。リーダーたちは、単一の中央チームがボトルネックになることなくスキルの信頼性を維持できるように、スキルの作成者を管理する方法を求めています。 どのガバナンス モデルを推奨する必要がありますか?"},"options":[{"k":"A","t":{"en":"Per-developer authorship across the 280 engineers with no team-level coordination required.","vi":"Quyền tác giả của mỗi nhà phát triển đối với 280 kỹ sư mà không cần sự phối hợp ở cấp độ nhóm.","jp":"チームレベルの調整を必要とせず、280 人のエンジニア全体にわたる開発者ごとのオーサーシップ。"}},{"k":"B","t":{"en":"Centralized authorship by a single platform team responsible for every Skill produced.","vi":"Quyền tác giả tập trung bởi một nhóm nền tảng duy nhất chịu trách nhiệm về mọi Kỹ năng được tạo ra.","jp":"作成されたすべてのスキルを担当する単一のプラットフォーム チームによる集中的な権限。"}},{"k":"C","t":{"en":"Fully decentralized authorship across the 14 teams with no review before publication.","vi":"Quyền tác giả được phân cấp hoàn toàn trên 14 nhóm mà không cần xem xét trước khi xuất bản.","jp":"著者は 14 チームに完全に分散されており、出版前にレビューはありません。"}},{"k":"D","t":{"en":"Federated authorship across the 14 teams with a central review and publication gate.","vi":"Quyền tác giả liên kết giữa 14 nhóm với cổng xuất bản và đánh giá trung tâm.","jp":"中央のレビューと出版ゲートを備えた 14 チームにわたる著者の連合。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> <b>Federated authorship</b> cho phép 14 nhóm — những người hiểu rõ chuẩn code, checklist review, quy trình postmortem của mình — tự viết và cập nhật Skill mà không phải chờ một nhóm trung tâm. <b>Cổng review và publish trung tâm</b> giữ độ tin cậy toàn tổ chức: kiểm tra ownership, bảo mật, quyền tool (<code>allowed-tools</code>), trùng lặp, versioning và bằng chứng test trước khi phát hành. Mô hình này cân bằng giữa tốc độ và quản trị, tránh cả nút thắt lẫn hỗn loạn.","elim":["<b>A.</b> Để 280 kỹ sư tự viết không phối hợp tạo ra Skill trùng lặp, mâu thuẫn và không được kiểm định, mất tính tin cậy.","<b>B.</b> Một nhóm platform viết mọi Skill tạo đúng nút thắt mà lãnh đạo muốn tránh, và nhóm này thiếu kiến thức chuyên môn của từng nhóm.","<b>C.</b> Phi tập trung hoàn toàn không review trước khi publish khiến Skill không đáng tin và có thể không an toàn."]},"cite":"Hướng dẫn ôn tập — §5.5 Skill — <code>.claude/skills/</code>; Lĩnh vực 3.2"},{"id":"ccarp-q028","n":28,"topic":2,"type":"mcq","stem":{"en":"You are transitioning a Claude-based deployment from design into implementation. Which handoff package most directly supports a clean transition?","vi":"Bạn đang chuyển quá trình triển khai dựa trên Claude từ thiết kế sang triển khai. Gói chuyển giao nào hỗ trợ trực tiếp nhất cho quá trình chuyển đổi rõ ràng?","jp":"あなたは、Claude ベースの展開を設計から実装に移行しています。 クリーンな移行を最も直接的にサポートするハンドオフ パッケージはどれですか?"},"options":[{"k":"A","t":{"en":"The most recent set of design presentation slides without component-level diagrams, interface contracts, an evaluation framework with a reference set, runbooks, or a known-limitations register.","vi":"Bộ trang trình bày thiết kế mới nhất không có sơ đồ cấp thành phần, hợp đồng giao diện, khung đánh giá với bộ tham chiếu, sổ tay hoặc sổ đăng ký các giới hạn đã biết.","jp":"コンポーネント レベルの図、インターフェイス コントラクト、リファレンス セットを含む評価フレームワーク、運用手順書、または既知の制限事項レジスタを含まない、最新の設計プレゼンテーション スライドのセット。"}},{"k":"B","t":{"en":"A verbal walkthrough conducted on the day of handoff with no written architecture overview, ADRs, component contracts, evaluation framework, runbooks, playbook, or known limitations.","vi":"Hướng dẫn bằng lời nói được thực hiện vào ngày bàn giao mà không có tổng quan về kiến ​​trúc bằng văn bản, ADR, hợp đồng thành phần, khung đánh giá, sổ tay, cẩm nang hoặc các hạn chế đã biết.","jp":"書面によるアーキテクチャの概要、ADR、コンポーネント契約、評価フレームワーク、ランブック、プレイブック、または既知の制限事項を伴わずに、引き継ぎ日に実施される口頭によるウォークスルー。"}},{"k":"C","t":{"en":"Architecture overview, ADRs, component contracts, evaluation framework with reference set, runbooks, on-call playbook, and known limitations.","vi":"Tổng quan về kiến ​​trúc, ADR, hợp đồng thành phần, khung đánh giá với bộ tham chiếu, sổ tay, sổ tay theo yêu cầu và các hạn chế đã biết.","jp":"アーキテクチャの概要、ADR、コンポーネント契約、リファレンス セットを含む評価フレームワーク、ランブック、オンコール プレイブック、既知の制限事項。"}},{"k":"D","t":{"en":"Source code alone with no integrating architecture overview, ADRs, component contracts, evaluation framework, runbooks, on-call playbook, or known-limitations register to support the delivery team.","vi":"Chỉ riêng mã nguồn mà không có tổng quan về kiến ​​trúc tích hợp, ADR, hợp đồng thành phần, khung đánh giá, sổ tay, sổ tay theo yêu cầu hoặc đăng ký giới hạn đã biết để hỗ trợ nhóm phân phối.","jp":"アーキテクチャの概要、ADR、コンポーネント契約、評価フレームワーク、ランブック、オンコール プレイブック、または既知の制限が統合されていないソース コードのみが、配信チームをサポートします。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Gói bàn giao phải chuyển được cả <b>ý đồ kiến trúc</b> lẫn <b>khả năng vận hành</b>. Architecture overview xác định ranh giới và quan hệ thành phần; <b>ADR</b> lưu bối cảnh và trade-off của quyết định; <b>component contract</b> định nghĩa interface, schema, hành vi lỗi. <b>Evaluation framework kèm reference set</b> giúp đội triển khai xác nhận chất lượng khi thay prompt/mô hình/retrieval, còn <b>runbook, on-call playbook và danh sách giới hạn đã biết</b> chuẩn bị cho vận hành production.","elim":["<b>A.</b> Slide trình bày thiết kế thiếu sơ đồ thành phần, contract, eval và runbook — không đủ để triển khai hay vận hành.","<b>B.</b> Walkthrough bằng lời không có tài liệu viết dễ mất thông tin, không tra cứu được và không lưu được lý do quyết định.","<b>D.</b> Source code một mình không truyền đạt lý do thiết kế, contract, tiêu chí chất lượng hay quy trình vận hành."]}},{"id":"ccarp-q029","n":29,"topic":2,"type":"mcq","stem":{"en":"A security audit uncovers two issues: (1) all end users share a single API key, and (2) tool calls are executed without logging the initiating user. Which two mitigations directly address these specific findings? (Select two.)  [Chọn 2 đáp án]","vi":"Quá trình kiểm tra bảo mật phát hiện ra hai vấn đề: (1) tất cả người dùng cuối đều chia sẻ một khóa API duy nhất và (2) lệnh gọi công cụ được thực thi mà không ghi nhật ký người dùng ban đầu. Hai biện pháp giảm thiểu nào trực tiếp giải quyết những phát hiện cụ thể này? (Chọn 2.) [Chọn 2 đáp án]","jp":"セキュリティ監査により、(1) すべてのエンド ユーザーが単一の API キーを共有する、(2) 開始ユーザーのログを記録せずにツール呼び出しが実行されるという 2 つの問題が明らかになります。 これらの特定の調査結果に直接対処する 2 つの緩和策はどれですか? (2 つ選択してください。) [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Validate structured outputs against a schema before downstream actions are executed.","vi":"Xác thực các kết quả đầu ra có cấu trúc dựa trên lược đồ trước khi thực thi các hành động tiếp theo.","jp":"ダウンストリームアクションが実行される前に、スキーマに対して構造化出力を検証します。"}},{"k":"B","t":{"en":"Enforce RBAC at the retrieval layer before content enters the model context.","vi":"Thực thi RBAC ở lớp truy xuất trước khi nội dung đi vào ngữ cảnh mô hình.","jp":"コンテンツがモデル コンテキストに入る前に、取得レイヤーで RBAC を強制します。"}},{"k":"C","t":{"en":"Move credentials out of the prompt context and resolve them from a server-side secret store.","vi":"Di chuyển thông tin xác thực ra khỏi ngữ cảnh được nhắc và giải quyết chúng từ kho lưu trữ bí mật phía máy chủ.","jp":"資格情報をプロンプト コンテキストの外に移動し、サーバー側のシークレット ストアから解決します。"}},{"k":"D","t":{"en":"Add actor attribution to tool-call logs so each call records the initiating user identity.","vi":"Thêm phân bổ tác nhân vào nhật ký cuộc gọi công cụ để mỗi cuộc gọi ghi lại danh tính người dùng bắt đầu.","jp":"アクターの属性をツール呼び出しログに追加して、各呼び出しが開始ユーザー ID を記録できるようにします。"}},{"k":"E","t":{"en":"Replace the shared API key with per-user OAuth tokens carrying scope-restricted permissions.","vi":"Thay thế khóa API được chia sẻ bằng mã thông báo OAuth cho mỗi người dùng mang các quyền có giới hạn phạm vi.","jp":"共有 API キーを、スコープ制限されたアクセス許可を持つユーザーごとの OAuth トークンに置き換えます。"}}],"answer":["D","E"],"multi":true,"explain":{"key":"<b>Đáp án D, E.</b> Mỗi biện pháp phải ánh xạ trực tiếp vào một phát hiện của audit.<br><b>E:</b> Thay <b>API key dùng chung</b> bằng <b>OAuth token theo từng người dùng</b> với scope hạn chế: mỗi token gắn với một danh tính, chỉ mang quyền cần thiết, có thể thu hồi độc lập — xử lý phát hiện (1).<br><b>D:</b> Thêm <b>actor attribution</b> vào log tool call để mỗi lời gọi ghi lại danh tính người khởi tạo — xử lý phát hiện (2) và cho phép truy vết, điều tra.","elim":["<b>A.</b> Validate output theo schema là kiểm soát tốt cho tính toàn vẹn output nhưng không liên quan đến key dùng chung hay thiếu log danh tính.","<b>B.</b> RBAC ở tầng retrieval là kiểm soát truy cập dữ liệu hợp lý, nhưng không thay thế được key dùng chung cũng không thêm danh tính vào log tool call.","<b>C.</b> Chuyển credential ra khỏi prompt context là thực hành đúng, nhưng audit không nêu credential nằm trong prompt; key vẫn dùng chung cho mọi người."]}},{"id":"ccarp-q030","n":30,"topic":2,"type":"mcq","stem":{"en":"An architect is reviewing a Claude-based candidate-screening tool prior to deployment. A stakeholder asserts that because the model was not trained on company data, no bias evaluation is necessary. Which two responses most accurately challenge this assertion? (Select two.)  [Chọn 2 đáp án]","vi":"Một kiến ​​trúc sư đang xem xét công cụ sàng lọc ứng viên dựa trên Claude trước khi triển khai. Một bên liên quan khẳng định rằng vì mô hình không được đào tạo dựa trên dữ liệu của công ty nên không cần đánh giá sai lệch. Hai câu trả lời nào thách thức chính xác nhất khẳng định này? (Chọn 2.) [Chọn 2 đáp án]","jp":"アーキテクトは、導入前にクロードベースの候補者スクリーニング ツールをレビューしています。関係者は、モデルが企業データに基づいてトレーニングされていないため、バイアス評価は必要ないと主張しています。 この主張に最も正確に異議を唱える 2 つの回答はどれですか? (2 つ選択してください。) [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Transparency obligations are satisfied by disclosing that an AI system is in use, without further evaluation.","vi":"Nghĩa vụ minh bạch được đáp ứng bằng cách tiết lộ rằng hệ thống AI đang được sử dụng mà không cần đánh giá thêm.","jp":"透明性義務は、さらなる評価を行わずに AI システムが使用されていることを開示することで満たされます。"}},{"k":"B","t":{"en":"Fairness testing is required only when the training dataset is known to contain protected-class labels.","vi":"Kiểm tra tính công bằng chỉ được yêu cầu khi tập dữ liệu huấn luyện được biết là có chứa nhãn lớp được bảo vệ.","jp":"公平性テストは、トレーニング データセットに保護クラス ラベルが含まれていることがわかっている場合にのみ必要です。"}},{"k":"C","t":{"en":"The model may carry demographic biases from pretraining that manifest in screening outcomes regardless of fine-tuning.","vi":"Mô hình này có thể mang theo những thành kiến ​​về nhân khẩu học từ quá trình đào tạo trước, biểu hiện ở kết quả sàng lọc bất kể tinh chỉnh.","jp":"モデルには、微調整に関係なく、スクリーニング結果に現れる事前トレーニングによる人口統計上のバイアスが含まれる可能性があります。"}},{"k":"D","t":{"en":"The system should be evaluated on outcome-disparity metrics across protected groups before deployment.","vi":"Hệ thống phải được đánh giá dựa trên các số liệu chênh lệch về kết quả giữa các nhóm được bảo vệ trước khi triển khai.","jp":"システムは、展開前に、保護されたグループ間の結果格差メトリクスに基づいて評価される必要があります。"}},{"k":"E","t":{"en":"Bias evaluation is unnecessary when the model provider has published a responsible-use policy.","vi":"Đánh giá sai lệch là không cần thiết khi nhà cung cấp mô hình đã công bố chính sách sử dụng có trách nhiệm.","jp":"モデルプロバイダーが責任ある使用ポリシーを公開している場合、バイアス評価は不要です。"}}],"answer":["C","D"],"multi":true,"explain":{"key":"<b>Đáp án C, D.</b> \"Không huấn luyện trên dữ liệu công ty\" không chứng minh được hệ thống không thiên lệch.<br><b>C:</b> Foundation model có thể mang <b>thiên lệch nhân khẩu học từ dữ liệu pretraining</b>, biểu hiện trong kết quả sàng lọc bất kể có fine-tune hay không; ngoài ra prompt, dữ liệu truy xuất và quy trình cũng có thể gây thiên lệch.<br><b>D:</b> Vì sàng lọc ứng viên ảnh hưởng trực tiếp đến cơ hội việc làm, toàn hệ thống phải được đánh giá bằng <b>metric chênh lệch kết quả giữa các nhóm được bảo vệ</b> (tỷ lệ chọn, tỷ lệ sai dương/âm) <b>trước khi triển khai</b>.","elim":["<b>A.</b> Công bố có dùng AI chỉ đáp ứng một phần nghĩa vụ minh bạch, không thay thế cho việc đánh giá công bằng của kết quả.","<b>B.</b> Thiên lệch có thể xuất hiện qua biến đại diện (proxy) ngay cả khi không có nhãn nhóm được bảo vệ; kiểm thử công bằng không phụ thuộc vào việc dataset có nhãn này.","<b>E.</b> Chính sách sử dụng có trách nhiệm của nhà cung cấp không đánh giá được ứng dụng cụ thể; trách nhiệm đánh giá hệ thống triển khai thuộc về bên triển khai."]}},{"id":"ccarp-q031","n":31,"topic":2,"type":"mcq","stem":{"en":"You are distinguishing functional from non-functional requirements during discovery. Which item is a non-functional requirement?","vi":"Bạn đang phân biệt các yêu cầu chức năng và phi chức năng trong quá trình khám phá. Mục nào là yêu cầu phi chức năng?","jp":"検出中に機能要件と非機能要件を区別します。 どの項目が非機能要件ですか?"},"options":[{"k":"A","t":{"en":"The system must extract a defined set of specific fields from invoice attachments and populate a downstream data record.","vi":"Hệ thống phải trích xuất một tập hợp các trường cụ thể đã xác định từ tệp đính kèm hóa đơn và điền vào bản ghi dữ liệu xuôi dòng.","jp":"システムは、請求書の添付ファイルから定義済みの特定フィールドのセットを抽出し、ダウンストリーム データ レコードにデータを入力する必要があります。"}},{"k":"B","t":{"en":"The system must produce a draft response that a human reviewer can edit before sending.","vi":"Hệ thống phải tạo ra phản hồi nháp mà người đánh giá có thể chỉnh sửa trước khi gửi.","jp":"システムは、人間のレビュー担当者が送信前に編集できる応答草案を作成する必要があります。"}},{"k":"C","t":{"en":"The system must classify inbound tickets into a defined set of categories.","vi":"Hệ thống phải phân loại vé vào thành một nhóm danh mục xác định.","jp":"システムは、受信チケットを定義された一連のカテゴリに分類する必要があります。"}},{"k":"D","t":{"en":"The system must respond at p95 latency under 800 milliseconds at the expected request volume.","vi":"Hệ thống phải phản hồi ở độ trễ p95 dưới 800 mili giây với khối lượng yêu cầu dự kiến.","jp":"システムは、予想される要求量に対して 800 ミリ秒未満の p95 遅延で応答する必要があります。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> <b>Yêu cầu phi chức năng</b> mô tả hệ thống phải vận hành <b>tốt đến mức nào</b> (hiệu năng, độ tin cậy, bảo mật...), còn yêu cầu chức năng mô tả hệ thống <b>làm gì</b>. \"Latency p95 dưới 800 ms ở mức tải dự kiến\" là một đặc tính hiệu năng đo được, gắn với điều kiện tải cụ thể — điển hình của yêu cầu phi chức năng.","elim":["<b>A.</b> Trích xuất các trường từ hóa đơn và tạo bản ghi downstream là một năng lực/hành vi của hệ thống — yêu cầu chức năng.","<b>B.</b> Tạo bản nháp để con người chỉnh sửa trước khi gửi mô tả một hành vi hệ thống phải thực hiện — yêu cầu chức năng.","<b>C.</b> Phân loại ticket vào các nhóm định sẵn là chức năng nghiệp vụ — yêu cầu chức năng."]}},{"id":"ccarp-q032","n":32,"topic":2,"type":"mcq","stem":{"en":"You are sequencing decomposed components in an invoice-processing pipeline. For each of the decomposed components, select the execution layer it belongs to: \"Pre-Processing,\" \"Model Stage,\" or \"Post-Processing.\"","vi":"Bạn đang sắp xếp các thành phần bị phân tách trong quy trình xử lý hóa đơn. Đối với mỗi thành phần được phân tách, hãy chọn lớp thực thi mà nó thuộc về: \"Tiền xử lý\", \"Giai đoạn mô hình\" hoặc \"Xử lý hậu kỳ\".","jp":"請求書処理パイプラインで分解されたコンポーネントを順序付けしています。 分解されたコンポーネントごとに、それが属する実行レイヤーを「前処理」、「モデルステージ」、または「後処理」から選択します。"},"options":[{"k":"A","t":{"en":"Post-Processing · Post-Processing · Pre-Processing · Pre-Processing · Model Stage · Model Stage","vi":"Hậu xử lý · Hậu xử lý · Tiền xử lý · Tiền xử lý · Giai đoạn mô hình · Giai đoạn mô hình","jp":"後処理 · 後処理 · 前処理 · 前処理 · モデル段階 · モデル段階"}},{"k":"B","t":{"en":"Model Stage · Post-Processing · Post-Processing · Model Stage · Pre-Processing · Pre-Processing","vi":"Giai đoạn mô hình · Hậu xử lý · Hậu xử lý · Giai đoạn mô hình · Tiền xử lý · Tiền xử lý","jp":"モデル段階 · 後処理 · 後処理 · モデル段階 · 前処理 · 前処理"}},{"k":"C","t":{"en":"Post-Processing · Model Stage · Pre-Processing · Post-Processing · Pre-Processing · Model Stage","vi":"Hậu xử lý · Giai đoạn mô hình · Tiền xử lý · Hậu xử lý · Tiền xử lý · Giai đoạn mô hình","jp":"後処理 · モデル段階 · 前処理 · 後処理 · 前処理 · モデル段階"}},{"k":"D","t":{"en":"Model Stage · Post-Processing · Pre-Processing · Model Stage · Pre-Processing · Post-Processing","vi":"Giai đoạn mô hình · Xử lý hậu kỳ · Tiền xử lý · Giai đoạn mô hình · Tiền xử lý · Hậu xử lý","jp":"モデル段階・後処理・前処理・モデル段階・前処理・後処理"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B (Model Stage – Post-Processing – Post-Processing – Model Stage – Pre-Processing – Pre-Processing).</b> <b>Pre-processing</b> chuẩn bị đầu vào trước khi gọi Claude: <b>OCR</b> chuyển ảnh hóa đơn scan thành văn bản, và <b>che PII</b> được nêu rõ là làm trước khi gọi mô hình. <b>Model stage</b> gồm các tác vụ cần năng lực hiểu ngôn ngữ của Claude như phân loại hóa đơn và trích xuất trường. <b>Post-processing</b> là các bước tất định trên output của mô hình, như validate theo schema/quy tắc nghiệp vụ và ghi/định tuyến kết quả vào hệ thống downstream.","elim":["<b>A.</b> Đặt các tác vụ của mô hình (phân loại, trích xuất) vào post/pre-processing và đưa OCR, che PII vào model stage — ngược với vai trò của từng tầng.","<b>C.</b> Xếp thành phần đầu (phân loại hóa đơn) vào post-processing và đặt che PII vào model stage, trong khi PII phải được che trước khi gọi mô hình.","<b>D.</b> Đặt một bước hậu xử lý vào pre-processing và che PII (vốn trước khi gọi mô hình) vào post-processing — sai thứ tự thực thi."]},"cite":"Hướng dẫn ôn tập — §8.1 Pipeline cố định (Prompt Chaining); Lĩnh vực 1.6"},{"id":"ccarp-q033","n":33,"topic":2,"type":"mcq","stem":{"en":"A pilot AI assistant for procurement specialists shows 89 percent first-response acceptance, but follow-up surveys reveal that specialists frequently override the assistant's vendor recommendations after considering criteria the assistant did not evaluate. The pilot owner wants to ship the assistant unchanged because of the strong acceptance rate. Which two Discernment-competency observations should you raise BEFORE approving the launch? (Select two.)  [Chọn 2 đáp án]","vi":"Một trợ lý AI thí điểm dành cho các chuyên gia mua sắm cho thấy 89% phản hồi đầu tiên được chấp nhận, nhưng các cuộc khảo sát tiếp theo cho thấy các chuyên gia thường xuyên ghi đè các đề xuất của nhà cung cấp của trợ lý sau khi xem xét các tiêu chí mà trợ lý không đánh giá. Chủ phi công muốn gửi trợ lý không thay đổi vì tỷ lệ chấp nhận cao. Bạn nên nêu ra hai quan sát về Năng lực nhận thức nào TRƯỚC KHI phê duyệt việc ra mắt? (Chọn 2.) [Chọn 2 đáp án]","jp":"調達スペシャリスト向けのパイロット AI アシスタントは、最初の応答で 89% の受け入れ率を示しましたが、追跡調査では、スペシャリストがアシスタントが評価しなかった基準を考慮した後、アシスタントのベンダー推奨を頻繁に上書きすることが明らかになりました。パイロットの所有者は、受け入れ率が高いため、アシスタントを変更せずに出荷したいと考えています。 立ち上げを承認する前に、識別能力に関する観察を 2 つ挙げるべきですか? (2 つ選択してください。) [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"The acceptance rate alone proves readiness for general production use.","vi":"Chỉ riêng tỷ lệ chấp nhận đã chứng tỏ sự sẵn sàng cho việc sử dụng sản xuất chung.","jp":"受け入れ率だけでも、一般的な実稼働環境での使用が可能であることが証明されます。"}},{"k":"B","t":{"en":"The survey response rate may not be statistically representative of all specialists.","vi":"Tỷ lệ phản hồi khảo sát có thể không mang tính đại diện về mặt thống kê cho tất cả các chuyên gia.","jp":"調査の回答率は統計的にすべての専門家を代表するものではない可能性があります。"}},{"k":"C","t":{"en":"The unconsidered criteria represent a scope gap in the assistant's input space.","vi":"Các tiêu chí chưa được xem xét thể hiện khoảng cách về phạm vi trong không gian đầu vào của trợ lý.","jp":"考慮されていない基準は、アシスタントの入力スペース内のスコープ ギャップを表します。"}},{"k":"D","t":{"en":"Acceptance does not establish whether recommendations remain correct after specialist review.","vi":"Việc chấp nhận không xác định liệu các khuyến nghị có còn đúng sau khi được chuyên gia xem xét hay không.","jp":"承認は、専門家のレビュー後に推奨事項が正しいままであるかどうかを証明するものではありません。"}},{"k":"E","t":{"en":"The pilot duration was probably too short to demonstrate reliability across the full year.","vi":"Thời gian thí điểm có lẽ quá ngắn để chứng minh độ tin cậy trong cả năm.","jp":"パイロット期間はおそらく短すぎて、年間を通じて信頼性を実証できませんでした。"}}],"answer":["C","D"],"multi":true,"explain":{"key":"<b>Đáp án C, D.</b> Năng lực <b>Discernment</b> là đánh giá phê phán xem output AI có thực sự đúng và đầy đủ hay không, không chỉ nhìn tỷ lệ chấp nhận bề mặt.<br><b>C:</b> Việc chuyên viên thường override dựa trên các tiêu chí mà trợ lý không xét cho thấy <b>khoảng trống phạm vi đầu vào</b> — một lỗ hổng yêu cầu, không phải vấn đề trình bày.<br><b>D:</b> Tỷ lệ <b>chấp nhận ban đầu</b> không chứng minh khuyến nghị <b>vẫn đúng sau khi chuyên viên review</b>; cần metric hướng kết quả như tỷ lệ override, lý do override, tác động tài chính.","elim":["<b>A.</b> Tỷ lệ chấp nhận 89% đơn lẻ không chứng minh sẵn sàng production — chính dữ liệu override đã cho thấy điều ngược lại.","<b>B.</b> Băn khoăn về tính đại diện của tỷ lệ phản hồi khảo sát là vấn đề phương pháp phụ, không chạm vào lỗ hổng cốt lõi là thiếu tiêu chí và chưa đo tính đúng.","<b>E.</b> Thời lượng pilot là suy đoán (\"có lẽ\"), không dựa vào bằng chứng trong đề và không giải quyết vấn đề phạm vi đầu vào."]},"cite":"Hướng dẫn ôn tập — §9.4 Hiệu chỉnh độ tin cậy và giám sát của con người; Lĩnh vực 5.5"},{"id":"ccarp-q034","n":34,"topic":2,"type":"mcq","stem":{"en":"A revenue projection assistant has missed its monthly cost target by 38 percent. Profiling shows three contributors: a 6,000-token policy preamble repeated on every call (45 percent of cost), retrieval of historical sales chunks averaging 3,000 tokens per call (30 percent), and inference on a flagship-tier model (25 percent). Stakeholders require that projection accuracy remain unchanged. Which two optimizations should you sequence first to reduce cost without affecting accuracy? (Select two.) Each correct answer presents part of the solution.  [Chọn 2 đáp án]","vi":"Một trợ lý dự báo doanh thu đã không đạt được mục tiêu chi phí hàng tháng là 38%. Hồ sơ cho thấy ba người đóng góp: lời mở đầu chính sách 6.000 mã thông báo được lặp lại trên mỗi cuộc gọi (45% chi phí), truy xuất các khối bán hàng lịch sử trung bình 3.000 mã thông báo cho mỗi cuộc gọi (30%) và suy luận về mô hình cấp cao nhất (25%). Các bên liên quan yêu cầu độ chính xác của phép chiếu không thay đổi. Bạn nên sắp xếp hai hoạt động tối ưu hóa nào trước để giảm chi phí mà không ảnh hưởng đến độ chính xác? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một phần của giải pháp.  [Chọn 2 đáp án]","jp":"収益予測アシスタントは、月間コスト目標を 38% 未達にしました。プロファイリングでは、コールごとに繰り返される 6,000 トークンのポリシー プリアンブル (コストの 45 パーセント)、コールあたり平均 3,000 トークンの過去の売上チャンクの取得 (30 パーセント)、およびフラッグシップ層モデルでの推論 (25 パーセント) の 3 つの要因が示されています。 関係者は、投影精度が変わらないことを要求しています。 精度に影響を与えずにコストを削減するには、どの 2 つの最適化を最初に実行する必要がありますか? (2 つ選択してください。) それぞれの正解は、解決策の一部を示しています。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Reduce the number of historical sales chunks retrieved across each query run.","vi":"Giảm số lượng khối bán hàng lịch sử được truy xuất qua mỗi lần chạy truy vấn.","jp":"各クエリ実行で取得される売上履歴チャンクの数を減らします。"}},{"k":"B","t":{"en":"Truncate the policy preamble to remove non-essential clauses from the prompt.","vi":"Cắt bớt phần mở đầu chính sách để loại bỏ các mệnh đề không cần thiết khỏi lời nhắc.","jp":"ポリシーのプリアンブルを切り詰めて、プロンプトから必須でない句を削除します。"}},{"k":"C","t":{"en":"Enable prompt caching on the static policy preamble across the recurring calls.","vi":"Bật bộ đệm ẩn nhắc nhở trên phần mở đầu chính sách tĩnh trên các cuộc gọi định kỳ.","jp":"定期的な通話全体で静的ポリシー プリアンブルのプロンプト キャッシュを有効にします。"}},{"k":"D","t":{"en":"Switch the workload to a smaller, faster Claude model tier across all queries.","vi":"Chuyển khối lượng công việc sang cấp mô hình Claude nhỏ hơn, nhanh hơn trên tất cả các truy vấn.","jp":"すべてのクエリにわたって、ワークロードをより小さくて高速なクロード モデル層に切り替えます。"}},{"k":"E","t":{"en":"Cache common retrieved sales chunks accessed across many of the daily queries.","vi":"Các khối bán hàng được truy xuất chung vào bộ nhớ đệm được truy cập qua nhiều truy vấn hàng ngày.","jp":"多くの毎日のクエリでアクセスされる、共通に取得された売上チャンクをキャッシュします。"}}],"answer":["C","E"],"multi":true,"explain":{"key":"<b>Đáp án C, E.</b> Ràng buộc là giữ nguyên độ chính xác, nên ưu tiên các tối ưu <b>loại bỏ tính toán lặp lại mà không đổi thông tin hay năng lực mô hình</b>.<br><b>C:</b> <b>Prompt caching</b> cho preamble chính sách tĩnh 6.000 token đánh trực tiếp vào nguồn chi phí lớn nhất (45%); cache read rẻ hơn nhiều so với input token thường mà nội dung instruction giữ nguyên.<br><b>E:</b> <b>Cache các chunk doanh số dùng chung</b> được truy cập nhiều lần trong ngày áp dụng cùng nguyên tắc cho tầng retrieval (30%) mà không bớt dữ liệu mô hình nhận.","elim":["<b>A.</b> Giảm số chunk truy xuất làm giảm dữ liệu lịch sử mô hình dùng để dự báo, có nguy cơ ảnh hưởng độ chính xác.","<b>B.</b> Cắt bớt preamble chính sách thay đổi instruction và có thể làm thay đổi hành vi; caching đạt tiết kiệm mà không phải hy sinh nội dung.","<b>D.</b> Chuyển sang model tier nhỏ hơn thay đổi năng lực suy luận, cần eval lại và có thể làm giảm độ chính xác — không phải bước đầu an toàn."]}},{"id":"ccarp-q035","n":35,"topic":2,"type":"mcq","stem":{"en":"A technical team is debating whether to implement a new capability for generating regulatory filings from internal data as a Claude Skill or as an MCP server. The capability requires a fixed authoring procedure with embedded examples, does not need to call live external systems, and must be portable across three Claude deployments: claude.ai, an internal API integration, and Claude Code. Which factor most strongly favors implementing the capability as a Skill?","vi":"Một nhóm kỹ thuật đang tranh luận về việc nên triển khai khả năng mới để tạo hồ sơ pháp lý từ dữ liệu nội bộ với tư cách là Claude Skill hay máy chủ MCP. Khả năng này yêu cầu quy trình soạn thảo cố định với các ví dụ được nhúng, không cần gọi các hệ thống trực tiếp bên ngoài và phải có khả năng di động qua ba triển khai Claude: claude.ai, tích hợp API nội bộ và Mã Claude. Yếu tố nào ủng hộ mạnh mẽ nhất việc triển khai khả năng như một Kỹ năng?","jp":"技術チームは、内部データから規制書類を生成する新しい機能をクロード スキルとして実装するか、MCP サーバーとして実装するかについて議論しています。この機能には、サンプルが埋め込まれた固定のオーサリング手順が必要で、ライブ外部システムを呼び出す必要がなく、claude.ai、内部 API 統合、および Claude Code の 3 つの Claude デプロイメント間で移植可能である必要があります。 機能をスキルとして実装することを最も強く支持する要因はどれですか?"},"options":[{"k":"A","t":{"en":"The capability needs to query a live database for the most recent regulatory filings.","vi":"Khả năng cần truy vấn cơ sở dữ liệu trực tiếp để biết các hồ sơ quy định gần đây nhất.","jp":"この機能では、ライブ データベースにクエリを実行して最新の規制申請を取得する必要があります。"}},{"k":"B","t":{"en":"The capability must also be callable from a developer's command-line interface.","vi":"Khả năng này cũng phải có thể gọi được từ giao diện dòng lệnh của nhà phát triển.","jp":"この機能は、開発者のコ​​マンドライン インターフェイスからも呼び出すことができる必要があります。"}},{"k":"C","t":{"en":"The capability requires direct authentication against the corporate identity provider.","vi":"Khả năng này yêu cầu xác thực trực tiếp đối với nhà cung cấp danh tính công ty.","jp":"この機能には、コーポレート ID プロバイダーに対する直接認証が必要です。"}},{"k":"D","t":{"en":"The capability is procedural knowledge with no live external-system calls required.","vi":"Khả năng này là kiến ​​thức về thủ tục mà không cần đến các cuộc gọi hệ thống bên ngoài trực tiếp.","jp":"この機能は、ライブの外部システム コールを必要としない、手続き的な知識です。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> <b>Skill</b> là cơ chế đóng gói <b>kiến thức thủ tục</b>: instruction, template, ví dụ nhúng và tài nguyên hỗ trợ, nạp theo nhu cầu. Năng lực soạn hồ sơ pháp lý đi theo một quy trình cố định và <b>không cần gọi hệ thống ngoài trực tiếp</b>, nên MCP server sẽ thêm chi phí transport, xác thực, hosting, vận hành không cần thiết. MCP chỉ phù hợp khi Claude phải truy cập cơ sở dữ liệu, API hoặc dịch vụ doanh nghiệp đang hoạt động.","elim":["<b>A.</b> Truy vấn cơ sở dữ liệu live là lý do ủng hộ MCP server, không phải Skill — và mâu thuẫn với mô tả \"không gọi hệ thống ngoài\".","<b>B.</b> Khả dụng từ CLI không phải yếu tố phân biệt, vì cả Skill lẫn MCP đều dùng được trong Claude Code.","<b>C.</b> Xác thực trực tiếp với identity provider là nhu cầu tích hợp hệ thống, nghiêng về MCP server chứ không ủng hộ Skill."]},"cite":"Hướng dẫn ôn tập — §5.5 Skill — <code>.claude/skills/</code>; Lĩnh vực 3.2"},{"id":"ccarp-q036","n":36,"topic":2,"type":"mcq","stem":{"en":"You are auditing a procurement-assistant agent whose defined responsibility is to draft purchase requests for review. For each tool currently configured on the agent, select yes if the tool should remain after a leastprivilege audit. Otherwise, select no if it should be removed.","vi":"Bạn đang kiểm tra một đại lý trợ lý mua sắm có trách nhiệm được xác định là soạn thảo các yêu cầu mua hàng để xem xét. Đối với mỗi công cụ hiện được đặt cấu hình trên tác nhân, hãy chọn có nếu công cụ đó vẫn được duy trì sau quá trình kiểm tra đặc quyền tối thiểu. Nếu không, hãy chọn không nếu cần xóa.","jp":"あなたは、レビューのために購入リクエストの草稿を作成するという定義された責任を持つ調達アシスタント エージェントを監査しています。 エージェント上で現在構成されている各ツールについて、最小権限監査後にツールを残す必要がある場合は、「はい」を選択します。それ以外の場合、削除する必要がある場合は「いいえ」を選択します。"},"options":[{"k":"A","t":{"en":"No - Yes - Yes - No - Yes","vi":"Không - Có - Có - Không - Có","jp":"いいえ - はい - はい - いいえ - はい"}},{"k":"B","t":{"en":"Yes - No - No - Yes - Yes","vi":"Có - Không - Không - Có - Có","jp":"はい - いいえ - いいえ - はい - はい"}},{"k":"C","t":{"en":"Yes - Yes - No - No - Yes","vi":"Có - Có - Không - Không - Có","jp":"はい - はい - いいえ - いいえ - はい"}},{"k":"D","t":{"en":"Yes - No - Yes - No - Yes","vi":"Có - Không - Có - Không - Có","jp":"はい - いいえ - はい - いいえ - はい"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D (Yes – No – Yes – No – Yes).</b> Trách nhiệm của agent chỉ là <b>soạn đề nghị mua hàng để người review</b>, nên mỗi tool giữ lại phải cần thiết cho việc soạn thảo và giới hạn ở mức hành động thấp nhất. Giữ lại: <b>tra cứu catalog</b> (thông tin vendor, SKU), <b>đọc tài liệu chính sách mua sắm</b> (để bản nháp tuân thủ quy định), và <b>ghi bản nháp vào hàng đợi review</b> (bảo toàn ranh giới phê duyệt của con người). Loại bỏ các tool vượt trách nhiệm như <b>gửi email/inbox-send</b> ra bên ngoài hay tool thực thi/phê duyệt trực tiếp, vì chúng bỏ qua bước review.","elim":["<b>A.</b> Loại bỏ tool tra cứu catalog — vốn cần thiết để soạn đề nghị chính xác — và giữ lại một tool vượt trách nhiệm.","<b>B.</b> Loại tool cần cho việc soạn thảo (ô 3) và giữ tool vượt phạm vi (ô 4), ngược với kết quả audit least-privilege.","<b>C.</b> Giữ tool ở ô 2 vượt phạm vi soạn thảo và loại tool cần thiết ở ô 3."]},"cite":"Hướng dẫn ôn tập — Lĩnh vực 2.3 Phân bổ Tool Giữa các Agent và Cấu hình <code>tool_choice</code>"},{"id":"ccarp-q037","n":37,"topic":2,"type":"mcq","stem":{"en":"You are evaluating model-selection claims used by a peer team. For each statement, select yes if the statement is generally true. Otherwise, select no.","vi":"Bạn đang đánh giá các tuyên bố lựa chọn mô hình được sử dụng bởi một nhóm ngang hàng. Đối với mỗi câu, hãy chọn có nếu câu nói nói chung là đúng. Nếu không, hãy chọn không.","jp":"あなたは、ピア チームが使用するモデル選択クレームを評価しています。 各ステートメントについて、そのステートメントが一般的に正しい場合は、「はい」を選択します。それ以外の場合は、「いいえ」を選択します。"},"options":[{"k":"A","t":{"en":"Yes - No - Yes - No - Yes","vi":"Có - Không - Có - Không - Có","jp":"はい - いいえ - はい - いいえ - はい"}},{"k":"B","t":{"en":"Yes - Yes - Yes - No - No","vi":"Có - Có - Có - Không - Không","jp":"はい - はい - はい - いいえ - いいえ"}},{"k":"C","t":{"en":"No - Yes - Yes - No - Yes","vi":"Không - Có - Có - Không - Có","jp":"いいえ - はい - はい - いいえ - はい"}},{"k":"D","t":{"en":"Yes - Yes - No - Yes - No","vi":"Có - Có - Không - Có - Không","jp":"はい - はい - いいえ - はい - いいえ"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D (Yes – Yes – No – Yes – No).</b> Nhận định 1 đúng: cấu hình suy luận mạnh hơn (model lớn hơn, extended thinking) thường tốn tính toán hơn, <b>latency cao hơn</b> và tiêu thụ nhiều token/rate limit hơn. Nhận định 2 đúng: cần <b>kiểm thử trên workload đại diện</b> vì xếp hạng benchmark chung không chứng minh hiệu năng trên prompt, dữ liệu, edge case và định dạng output của tổ chức. Nhận định 4 cũng đúng, còn nhận định 3 và 5 là các khẳng định tổng quát không chính xác về lựa chọn mô hình.","elim":["<b>A.</b> Bác bỏ nhận định 2 về kiểm thử workload đại diện (vốn là khuyến nghị cốt lõi) và chấp nhận nhận định 3, 5 không chính xác.","<b>B.</b> Chấp nhận nhận định 3 (không đúng) và bác bỏ nhận định 4 (đúng).","<b>C.</b> Phủ nhận nhận định 1 về đánh đổi năng lực–latency–chi phí (vốn đúng) và chấp nhận nhận định 3, 5."]}},{"id":"ccarp-q038","n":38,"topic":2,"type":"mcq","stem":{"en":"The engineering lead at Trenova Systems, Inc. is evaluating two proposals for improving developer workflows using Claude-assisted tooling. Proposal A adds Claude Code to the IDE for inline code generation and review. Proposal B routes all code-generation requests through a shared Slack bot without IDE integration. Which two observations most accurately evaluate these proposals against workflow-improvement objectives? (Select two.)  [Chọn 2 đáp án]","vi":"Trưởng nhóm kỹ thuật tại Trenova Systems, Inc. đang đánh giá hai đề xuất nhằm cải thiện quy trình làm việc của nhà phát triển bằng cách sử dụng công cụ được Claude hỗ trợ. Đề xuất A thêm Mã Claude vào IDE để tạo và xem xét mã nội tuyến. Đề xuất B định tuyến tất cả các yêu cầu tạo mã thông qua bot Slack được chia sẻ mà không tích hợp IDE. Hai quan sát nào đánh giá chính xác nhất những đề xuất này so với các mục tiêu cải thiện quy trình làm việc? (Chọn 2.) [Chọn 2 đáp án]","jp":"Trenova Systems, Inc. のエンジニアリング リーダーは、Claude 支援ツールを使用して開発者のワークフローを改善するための 2 つの提案を評価しています。提案 A では、インライン コードの生成とレビューのために、Claude コードを IDE に追加します。提案 B は、IDE 統合を行わずに、すべてのコード生成リクエストを共有 Slack ボット経由でルーティングします。 ワークフロー改善の目標に対してこれらの提案を最も正確に評価する 2 つの観察はどれですか? (2 つ選択してください。) [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Proposal B is superior because centralizing requests in Slack creates an auditable log of all codegeneration activity.","vi":"Đề xuất B ưu việt hơn vì việc tập trung các yêu cầu trong Slack tạo ra nhật ký có thể kiểm tra được về tất cả hoạt động tạo mã.","jp":"提案 B は、Slack でリクエストを一元管理することで、すべてのコード生成アクティビティの監査可能なログが作成されるため、優れています。"}},{"k":"B","t":{"en":"Proposal B introduces workflow friction by requiring developers to leave the IDE, undermining the productivity objective.","vi":"Đề xuất B gây trở ngại cho quy trình làm việc bằng cách yêu cầu các nhà phát triển rời khỏi IDE, làm suy yếu mục tiêu năng suất.","jp":"提案 B は、開発者に IDE から離れることを要求することでワークフローの摩擦を引き起こし、生産性目標を損ないます。"}},{"k":"C","t":{"en":"Proposal A reduces context switching by providing AI assistance at the point of development without requiring a separate tool.","vi":"Đề xuất A giảm việc chuyển đổi ngữ cảnh bằng cách cung cấp hỗ trợ AI tại thời điểm phát triển mà không yêu cầu công cụ riêng.","jp":"提案 A では、別のツールを必要とせずに開発時点で AI 支援を提供することで、コンテキストの切り替えを削減します。"}},{"k":"D","t":{"en":"Proposal B improves workflow velocity because Slack notifications create an asynchronous review queue.","vi":"Đề xuất B cải thiện tốc độ luồng công việc vì thông báo Slack tạo ra hàng đợi đánh giá không đồng bộ.","jp":"提案 B では、Slack 通知によって非同期レビュー キューが作成されるため、ワークフローの速度が向上します。"}},{"k":"E","t":{"en":"Both proposals are equivalent because the model capabilities are identical regardless of the integration point.","vi":"Cả hai đề xuất đều tương đương vì khả năng của mô hình giống hệt nhau bất kể điểm tích hợp.","jp":"モデルの機能は統合ポイントに関係なく同一であるため、両方の提案は同等です。"}}],"answer":["B","C"],"multi":true,"explain":{"key":"<b>Đáp án B, C.</b> Hiệu quả cải tiến workflow phụ thuộc vào <b>nơi trợ giúp được cung cấp</b>, không chỉ vào năng lực mô hình.<br><b>B:</b> Proposal B buộc lập trình viên <b>rời IDE</b> sang Slack, sao chép code qua lại và mất ngữ cảnh repo — tạo ma sát, đi ngược mục tiêu năng suất.<br><b>C:</b> Proposal A tích hợp Claude Code ngay trong IDE, có sẵn code, selection, diagnostics, diff và ngữ cảnh repo — <b>giảm context switching</b> tại đúng nơi làm việc.","elim":["<b>A.</b> Log kiểm toán có giá trị nhưng không vượt mục tiêu năng suất đã nêu, và audit log cũng có thể đạt được với tích hợp IDE.","<b>D.</b> Hàng đợi bất đồng bộ qua Slack làm chậm vòng phản hồi tương tác khi viết code, không tăng tốc độ workflow.","<b>E.</b> Cùng mô hình không có nghĩa cùng hiệu quả; điểm tích hợp quyết định ngữ cảnh mô hình nhận được và ma sát với người dùng."]}},{"id":"ccarp-q039","n":39,"topic":2,"type":"mcq","stem":{"en":"A document analysis service processes legal filings averaging 80,000 tokens each. Each filing is queried by attorneys an average of 14 times during a case. The current architecture sends the full filing on every query. The CFO has asked you to reduce per-query costs while preserving response quality. The security officer requires that filing contents not be stored outside Fabrikam's tenancy. Which optimization approach should you recommend?","vi":"Dịch vụ phân tích tài liệu xử lý các hồ sơ pháp lý trung bình mỗi hồ sơ có 80.000 token. Mỗi hồ sơ được luật sư truy vấn trung bình 14 lần trong một vụ án. Kiến trúc hiện tại sẽ gửi hồ sơ đầy đủ cho mọi truy vấn. Giám đốc tài chính đã yêu cầu bạn giảm chi phí cho mỗi truy vấn trong khi vẫn duy trì chất lượng phản hồi. Nhân viên an ninh yêu cầu nội dung hồ sơ không được lưu trữ bên ngoài nơi thuê nhà của Fabrikam. Bạn nên giới thiệu phương pháp tối ưu hóa nào?","jp":"文書分析サービスは、それぞれ平均 80,000 トークンの法的申請を処理します。各申請書は、訴訟中に平均 14 回弁護士によって照会されます。現在のアーキテクチャでは、クエリごとに完全なファイルが送信されます。 CFO は、応答品質を維持しながらクエリごとのコストを削減するよう依頼しました。セキュリティ担当者は、ファイルの内容を Fabrikam のテナントの外に保存しないことを要求します。 どの最適化アプローチを推奨する必要がありますか?"},"options":[{"k":"A","t":{"en":"Summarize each filing once at intake and run all subsequent queries against the summary.","vi":"Tóm tắt từng hồ sơ một lần khi tiếp nhận và thực hiện tất cả các truy vấn tiếp theo đối với bản tóm tắt.","jp":"取り込み時に各申請を一度要約し、その要約に対して後続のすべてのクエリを実行します。"}},{"k":"B","t":{"en":"Cache the filing as the prompt prefix for reuse across the 14 queries per case.","vi":"Lưu trữ tệp dưới dạng tiền tố nhắc nhở để sử dụng lại trong 14 truy vấn cho mỗi trường hợp.","jp":"ファイリングをプロンプト プレフィックスとしてキャッシュし、ケースごとに 14 個のクエリで再利用します。"}},{"k":"C","t":{"en":"Index filings in a vector store and retrieve only the relevant passages per query.","vi":"Lập chỉ mục các hồ sơ trong kho vectơ và chỉ truy xuất các đoạn có liên quan cho mỗi truy vấn.","jp":"ベクター ストア内のインデックス ファイリングにより、クエリごとに関連するパッセージのみが取得されます。"}},{"k":"D","t":{"en":"Move the workload to a smaller Claude model to reduce the per-token cost paid.","vi":"Chuyển khối lượng công việc sang mô hình Claude nhỏ hơn để giảm chi phí trả cho mỗi mã thông báo.","jp":"ワークロードをより小さいクロード モデルに移動して、トークンごとに支払われるコストを削減します。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Hồ sơ 80.000 token là <b>prefix lớn, ổn định</b> được dùng lại trung bình 14 lần mỗi vụ — trường hợp lý tưởng cho <b>prompt caching</b>. Request đầu ghi cache, các request sau có cùng prefix chỉ trả giá <b>cache read</b> thấp hơn nhiều, trong khi Claude vẫn thấy <b>toàn bộ hồ sơ</b> nên chất lượng được giữ. Cache được cô lập theo tổ chức và tồn tại tạm thời (TTL ngắn), không tạo kho lưu trữ hồ sơ lâu dài ngoài tenancy như vector store bên ngoài.","elim":["<b>A.</b> Tóm tắt một lần rồi hỏi trên bản tóm tắt làm mất chi tiết mà luật sư có thể cần, ảnh hưởng chất lượng câu trả lời.","<b>C.</b> Vector store chỉ trả về đoạn liên quan nên có thể bỏ sót ngữ cảnh pháp lý, và tạo thêm một kho lưu trữ nội dung hồ sơ cần đánh giá theo yêu cầu bảo mật.","<b>D.</b> Mô hình nhỏ hơn giảm giá mỗi token nhưng có thể giảm chất lượng phân tích pháp lý, trái yêu cầu giữ chất lượng."]}},{"id":"ccarp-q040","n":40,"topic":2,"type":"mcq","stem":{"en":"You are designing a test strategy for a Claude-based pipeline that handles sensitive financial data. Which two test types should be prioritized to cover both safety under attack and cross-component correctness? (Select two.)  [Chọn 2 đáp án]","vi":"Bạn đang thiết kế chiến lược thử nghiệm cho quy trình xử lý dữ liệu tài chính nhạy cảm có trụ sở tại Claude. Hai loại thử nghiệm nào nên được ưu tiên để đảm bảo cả tính an toàn khi bị tấn công và tính chính xác của nhiều thành phần? (Chọn 2.) [Chọn 2 đáp án]","jp":"あなたは、機密の財務データを処理するクロードベースのパイプラインのテスト戦略を設計しています。 攻撃時の安全性とコンポーネント間の正確性の両方をカバーするには、どの 2 つのテスト タイプを優先する必要がありますか? (2 つ選択してください。) [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Adversarial tests using prompt-injection and malformed-input cases.","vi":"Kiểm tra đối nghịch bằng cách sử dụng các trường hợp nhập nhanh và nhập không đúng định dạng.","jp":"プロンプトインジェクションと不正な入力ケースを使用した敵対的テスト。"}},{"k":"B","t":{"en":"Regression tests against a stable reference set of previously known-good outputs.","vi":"Kiểm tra hồi quy đối với một tập tham chiếu ổn định gồm các kết quả đầu ra được biết đến là tốt trước đây.","jp":"以前に正常であることがわかっている出力の安定した参照セットに対する回帰テスト。"}},{"k":"C","t":{"en":"Smoke tests that verify core paths after each deployment.","vi":"Kiểm tra khói xác minh các đường dẫn cốt lõi sau mỗi lần triển khai.","jp":"各デプロイ後にコア パスを検証するスモーク テスト。"}},{"k":"D","t":{"en":"Integration tests that verify end-to-end pipeline behavior across all components.","vi":"Kiểm tra tích hợp xác minh hành vi đường ống từ đầu đến cuối trên tất cả các thành phần.","jp":"すべてのコンポーネントにわたるエンドツーエンドのパイプライン動作を検証する統合テスト。"}},{"k":"E","t":{"en":"Unit tests targeting only individual prompt-template rendering logic.","vi":"Các bài kiểm tra đơn vị chỉ nhắm mục tiêu logic kết xuất mẫu lời nhắc riêng lẻ.","jp":"個々のプロンプト テンプレート レンダリング ロジックのみを対象とした単体テスト。"}}],"answer":["A","D"],"multi":true,"explain":{"key":"<b>Đáp án A, D.</b> Đề yêu cầu hai mục tiêu riêng biệt: an toàn khi bị tấn công và tính đúng đắn xuyên thành phần.<br><b>A.</b> <b>Adversarial test</b> (prompt injection, đầu vào dị dạng, tài liệu độc hại, yêu cầu gọi tool trái phép) đo trực tiếp hành vi của pipeline dữ liệu tài chính nhạy cảm khi bị tấn công.<br><b>D.</b> <b>Integration test end-to-end</b> kiểm tra toàn chuỗi xác thực → truy xuất → dựng prompt → gọi mô hình → validation → ghi log → hành động downstream như một hệ thống, phát hiện lỗi ở ranh giới giữa các thành phần.","elim":["<b>B.</b> Regression test chỉ đo xem hành vi đã đạt trước đây có bị suy giảm sau thay đổi hay không; nó không thăm dò tấn công mới cũng không kiểm tra luồng xuyên thành phần.","<b>C.</b> Smoke test chỉ xác nhận các đường chính còn chạy sau mỗi lần deploy — độ phủ nông, không đánh giá an toàn trước tấn công hay tính đúng đắn tích hợp chi tiết.","<b>E.</b> Unit test chỉ cho logic render prompt template bị giới hạn ở một thành phần đơn lẻ, đúng là thứ không bao phủ được tương tác xuyên thành phần lẫn kịch bản tấn công."]}}]},{"n":3,"title":{"en":"Practice Set 3","vi":"Bộ đề số 3","jp":"練習問題 3"},"questions":[{"id":"ccarp-q041","n":41,"topic":3,"type":"mcq","stem":{"en":"The platform team at Trenova Systems, Inc. needs to reduce per-query cost and p95 latency for a high-volume Claude pipeline without degrading output quality on the core use case. Which two optimizations directly target both cost and latency simultaneously? (Select two.)  [Chọn 2 đáp án]","vi":"Nhóm nền tảng tại Trenova Systems, Inc. cần giảm chi phí cho mỗi truy vấn và độ trễ p95 cho quy trình Claude khối lượng lớn mà không làm giảm chất lượng đầu ra trong trường hợp sử dụng cốt lõi. Hai hoạt động tối ưu hóa nào nhắm mục tiêu trực tiếp đồng thời cả chi phí và độ trễ? (Chọn 2.) [Chọn 2 đáp án]","jp":"Trenova Systems, Inc. のプラットフォーム チームは、コア ユースケースの出力品質を低下させることなく、大容量クロード パイプラインのクエリごとのコストと p95 レイテンシを削減する必要があります。 コストとレイテンシーの両方を同時に直接ターゲットにする 2 つの最適化はどれですか? (2 つ選択してください。) [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Enable prompt caching on the static system-prompt prefix to reduce billable input tokens on repeated calls.","vi":"Bật bộ nhớ đệm lời nhắc trên tiền tố lời nhắc hệ thống tĩnh để giảm mã thông báo đầu vào phải trả cho các cuộc gọi lặp lại.","jp":"静的システム プロンプト プレフィックスでプロンプト キャッシュを有効にして、繰り返しの呼び出しで請求される入力トークンを削減します。"}},{"k":"B","t":{"en":"Route straightforward query types to a smaller, faster Claude model and reserve the full model for complex cases.","vi":"Định tuyến các loại truy vấn đơn giản tới mô hình Claude nhỏ hơn, nhanh hơn và dành mô hình đầy đủ cho các trường hợp phức tạp.","jp":"単純なクエリ タイプをより小さく高速なクロード モデルにルーティングし、複雑なケース用に完全なモデルを予約します。"}},{"k":"C","t":{"en":"Increase max_tokens to reduce the frequency of truncated responses requiring follow-up calls.","vi":"Tăng max_tokens để giảm tần suất phản hồi bị cắt ngắn yêu cầu các cuộc gọi tiếp theo.","jp":"max_tokens を増やして、フォローアップ呼び出しが必要な切り捨てられた応答の頻度を減らします。"}},{"k":"D","t":{"en":"Add a retrieval step that fetches the full source corpus into the context window before generation.","vi":"Thêm một bước truy xuất để tìm nạp kho dữ liệu nguồn đầy đủ vào cửa sổ ngữ cảnh trước khi tạo.","jp":"生成前に完全なソース コーパスをコンテキスト ウィンドウにフェッチする取得ステップを追加します。"}},{"k":"E","t":{"en":"Expand the system prompt to include additional few-shot examples on every request.","vi":"Mở rộng lời nhắc hệ thống để bao gồm các ví dụ bổ sung về một vài cảnh quay cho mọi yêu cầu.","jp":"システム プロンプトを展開して、すべてのリクエストに追加の数ショットの例を含めます。"}}],"answer":["A","B"],"multi":true,"explain":{"key":"<b>Đáp án A, B.</b> Cần tối ưu đồng thời cả chi phí lẫn độ trễ p95 mà không giảm chất lượng.<br><b>A.</b> <b>Prompt caching</b> trên tiền tố system prompt tĩnh: các lần gọi lặp lại đọc tiền tố từ cache với giá cache-read thấp hơn và không phải xử l
