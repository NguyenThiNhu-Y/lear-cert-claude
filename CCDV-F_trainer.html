<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCDV-F · Claude Certified Developer - Foundations</title>
<meta name="description" content="Bộ đề luyện thi CCAR-F.">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<script>
/* đặt theme trước khi vẽ để không nháy màu */
(function(){
  var th="dark";
  try{
    var d=JSON.parse(localStorage.getItem('examtrainer.CCAR-F')||"{}");
    if(d.theme) th=d.theme;
    else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches) th="light";
  }catch(e){}
  document.documentElement.setAttribute("data-theme",th);
})();
</script>
<style>
/* ============================================================
   Exam Trainer — bảng điều khiển + tờ đề in (tông ấm)
   ============================================================ */

:root{                      /* TỐI — mỗi màu chữ đều đo trên nền sáng nhất mà nó nằm lên */
  --shell:#171310;          /* khung ngoài            */
  --shell-2:#201A15;        /* cột trái / cột phải    */
  --shell-3:#2E251C;        /* nền nổi khi rê chuột   */
  --sunken:#100D0A;         /* ô nhập liệu — chìm     */
  --paper:#1C1712;          /* vùng đọc               */
  --paper-2:#252019;
  --ink:#F1EFEA;            /* ≥13.1:1 mọi nền        */
  --ink-2:#C6BCAA;          /* ≥ 8.0:1 — nhãn, chú thích */
  --ink-3:#ABA08B;          /* ≥ 5.8:1 — số đếm, gợi ý ô nhập */
  --rule:#3D3428;           /* kẻ trang trí           */
  --rule-2:#786853;         /* viền điều khiển ≥3:1   */
  --on-accent:#171310;      /* chữ nằm trên mảng màu đặc */
  --ok:#8FD98C;
  --ok-bg:rgba(143,217,140,.15);
  --bad:#FF9781;
  --bad-bg:rgba(255,151,129,.15);
  --flag:#F7C25A;
  --flag-bg:rgba(247,194,90,.17);
  --pick:#8ECBF0;
  --pick-bg:rgba(142,203,240,.15);
  --stamp:#FF9781;
  --focus:#F7C25A;
  --thumb:#5A4E3D;
  color-scheme:dark;
}
[data-theme="light"]{       /* SÁNG — cùng nguyên tắc, giấy ngà để bớt chói */
  --shell:#E9E3D5;
  --shell-2:#F2EDE2;
  --shell-3:#E7E1D2;
  --sunken:#FFFFFF;
  --paper:#FDFBF5;
  --paper-2:#F5F1E6;
  --ink:#201C16;            /* ≥13.0:1 */
  --ink-2:#463E35;          /* ≥ 8.0:1 */
  --ink-3:#5B5347;          /* ≥ 5.8:1 */
  --rule:#DED6C4;
  --rule-2:#8F8269;
  --on-accent:#FFFFFF;
  --ok:#256B42;
  --ok-bg:rgba(37,107,66,.10);
  --bad:#B32E1F;
  --bad-bg:rgba(179,46,31,.09);
  --flag:#7F5405;
  --flag-bg:rgba(127,84,5,.13);
  --pick:#175D91;
  --pick-bg:rgba(23,93,145,.09);
  --stamp:#B32E1F;
  --focus:#7F5405;
  --thumb:#B0A48D;
  color-scheme:light;
}
:root{
  --sans:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --top:52px;
  --gut:clamp(16px,1.8vw,26px);
  --pad:clamp(24px,2.6vw,46px);
  --perf:26px;
  --recpad:clamp(12px,1.2vw,20px);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
*{scrollbar-width:thin;scrollbar-color:var(--thumb) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent;border-left:1px solid var(--rule)}
::-webkit-scrollbar-thumb{background:var(--thumb);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
body{
  margin:0;background:var(--shell);color:var(--ink);
  font-family:var(--serif);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
b,strong{font-weight:600}
h1,h2,h3,h4{margin:0}
img{max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hide{display:none!important}
.grow{flex:1}

.lbl{
  font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-2);
}

/* ============================ TOP ============================ */
.top{
  position:sticky;top:0;z-index:60;height:var(--top);
  background:var(--shell-2);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:var(--gut);padding:0 var(--gut);
}
.mark{display:flex;align-items:baseline;gap:9px;flex:none}
.mark .w{font-family:var(--sans);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.mark .w em{font-style:normal;color:var(--stamp)}
.mark .s{font-family:var(--sans);font-size:12px;letter-spacing:.02em;color:var(--ink-2);white-space:nowrap}

.seg{display:flex;border:1px solid var(--rule-2);flex:none}
.seg button{
  background:transparent;border:0;border-right:1px solid var(--rule-2);
  font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-2);padding:6px 13px;cursor:pointer;line-height:1.45;
}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink);background:var(--shell-3)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-accent)}
.seg.mini button{padding:5px 9px;font-size:10px;letter-spacing:.1em}
.top .right{display:flex;gap:8px;align-items:center;flex:none}
.icb{
  background:transparent;border:1px solid var(--rule-2);color:var(--ink-2);
  width:29px;height:29px;display:grid;place-items:center;cursor:pointer;
  font-family:var(--sans);font-weight:700;font-size:12px;flex:none;
}
.icb:hover{color:var(--ink);border-color:var(--ink-3)}

/* ============================ GRID ============================ */
.app{
  display:grid;
  grid-template-columns:266px minmax(0,1fr) 304px;
  grid-template-areas:"rail main aside";
  align-items:stretch;min-height:calc(100vh - var(--top));
}
.rail{grid-area:rail;border-right:1px solid var(--rule);background:var(--shell-2)}
.main{grid-area:main;min-width:0;background:var(--paper);position:relative;min-height:calc(100vh - var(--top))}
.aside{grid-area:aside;border-left:1px solid var(--rule);background:var(--shell-2)}
.rail-in,.aside-in{
  position:sticky;top:var(--top);height:calc(100vh - var(--top));
  overflow-y:auto;overflow-x:hidden;padding:16px var(--gut) 40px;
}
@media(max-width:1319px){
  .app{grid-template-columns:244px minmax(0,1fr);grid-template-areas:"rail aside" "rail main";align-content:start}
  .aside{border-left:0;border-bottom:1px solid var(--rule)}
  .aside-in{position:static;height:auto;max-height:none;padding:12px var(--gut)}
  .aside .stack{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 26px;align-items:start}
}
@media(max-width:899px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"rail" "main" "aside"}
  .aside{border-top:1px solid var(--rule);border-bottom:0}
  .only-lg{display:none}
  .rail{border-right:0;border-bottom:1px solid var(--rule)}
  .rail-in{position:static;height:auto;max-height:none;padding:12px var(--gut) 18px}
  body:not(.rail-open) .rail-in{display:none}
  .rail-in .stack{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px 26px;align-items:start}
}
@media(min-width:900px){ .railtoggle{display:none} }
@media(max-width:899px){
  .top{height:auto;min-height:var(--top);flex-wrap:wrap;gap:8px 10px;padding:8px var(--gut)}
  .mark .s{display:none}
  .top .right{margin-left:auto}
  .seg button{padding:6px 9px;font-size:10px;letter-spacing:.07em}
  .seg.mini button{padding:5px 7px}
}
@media(max-width:640px){
  :root{--perf:14px}
  .paper::before,.paper::after{background-size:100% 20px}
}

/* ============================ CONTROLS ============================ */
.blk{margin-bottom:22px}
.blk > .lbl{display:block;margin-bottom:8px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}

.fld{
  width:100%;background:var(--sunken);border:1px solid var(--rule-2);color:var(--ink);
  font-family:var(--serif);font-size:14.5px;padding:8px 10px;
}
.fld::placeholder{color:var(--ink-3);opacity:1}
.fld:focus{outline:none;border-color:var(--stamp);box-shadow:inset 0 0 0 1px var(--stamp)}

/* select tự vẽ — không dùng mũi tên mặc định của hệ điều hành */
.sel{position:relative;display:block}
.sel select{
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  width:100%;background:var(--sunken);color:var(--ink);
  border:1px solid var(--rule-2);border-radius:0;
  padding:9px 42px 9px 12px;font-family:var(--mono);font-size:13.5px;line-height:1.35;
  cursor:pointer;
}
.sel select:hover{border-color:var(--ink-3)}
.sel select:focus{outline:none;border-color:var(--stamp);box-shadow:inset 0 0 0 1px var(--stamp)}
.sel .cap{
  position:absolute;top:1px;right:1px;bottom:1px;width:30px;
  border-left:1px solid var(--rule-2);background:var(--shell-3);
  display:grid;place-items:center;pointer-events:none;
}
.sel .cap::after{
  content:"";width:0;height:0;
  border-left:4.5px solid transparent;border-right:4.5px solid transparent;
  border-top:5.5px solid var(--ink-2);
}
.sel select:hover + .cap::after{border-top-color:var(--ink)}
.sel select:focus + .cap{background:var(--stamp);border-left-color:var(--stamp)}
.sel select:focus + .cap::after{border-top-color:var(--on-accent)}
.sel.on select{border-color:var(--pick);box-shadow:inset 0 0 0 1px var(--pick)}
.sel.on .cap{border-left-color:var(--pick)}

.tlist{display:grid;gap:1px}
.slist{display:grid;border-top:1px solid var(--rule)}
.srow{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;border-bottom:1px solid var(--rule);
  border-left:2px solid transparent;padding:8px 10px;
}
.srow:hover{background:var(--shell-3)}
.srow[aria-pressed="true"]{border-left-color:var(--stamp);background:var(--shell-3)}
.srow[aria-pressed="true"] .nm{color:var(--ink)}
.srow .dot{width:10px;height:10px;flex:none;position:relative;color:var(--ink-3)}
.srow[aria-pressed="true"] .dot{color:var(--ink)}
.srow .dot::before{content:"";position:absolute;inset:1px;border:1px solid currentColor}
.srow .dot.g{color:var(--ok)}   .srow .dot.g::before{background:currentColor}
.srow .dot.r{color:var(--bad)}  .srow .dot.r::before{background:currentColor}
.srow .dot.f{color:var(--flag)} .srow .dot.f::before{background:currentColor}
/* dấu hiệu của từng dạng câu, vẽ lại đúng hình dáng điều khiển tương ứng */
.srow .dot.m-mcq::before{box-shadow:inset 0 0 0 2px currentColor}
.srow .dot.m-yesno::before{border:0;background:linear-gradient(currentColor 0 34%,transparent 34% 66%,currentColor 66% 100%)}
.srow .dot.m-drop::before{border:0;background:currentColor;clip-path:polygon(0 22%,100% 22%,50% 86%)}
.srow .nm{flex:1;font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.03em;
  text-transform:uppercase;color:var(--ink-2)}
.srow .ct{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* nhóm nút dữ liệu — hàng đầy chiều rộng, thống nhất với các danh sách khác */
.vlist{display:grid;border-top:1px solid var(--rule)}
.vrow{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;border-bottom:1px solid var(--rule);padding:10px;
  font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);
}
.vrow:hover{background:var(--shell-3);color:var(--ink)}
.vrow svg{flex:none;width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7}
.vrow.danger{color:var(--bad)}
.vrow.danger:hover{background:var(--bad-bg)}
.trow{
  display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:center;
  background:transparent;border:0;border-left:2px solid transparent;
  padding:6px 8px;cursor:pointer;text-align:left;width:100%;min-width:0;
}
.trow:hover{background:var(--shell-3)}
.trow[aria-pressed="true"]{border-left-color:var(--stamp);background:var(--shell-3)}
.trow .nm{font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.trow .ct{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.meter{grid-column:1/-1;height:4px;background:var(--rule);display:flex;overflow:hidden}
.meter i{display:block;height:100%}
.meter .g{background:var(--ok)}
.meter .r{background:var(--bad)}

.act{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;background:transparent;color:var(--ink);
  border:1px solid var(--rule-2);padding:7px 13px;cursor:pointer;line-height:1.4;
}
.btn:hover{border-color:var(--ink);background:var(--shell-3)}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{border-color:var(--rule-2);background:transparent;color:var(--ink)}
.btn.solid{background:var(--ink);border-color:var(--ink);color:var(--on-accent)}
.btn.solid:hover:not(:disabled){filter:brightness(1.12)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:5px 10px;font-size:10px}

/* ============================ ASIDE ============================ */
.kv{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:3px 0}
.kv span{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.kv b{font-family:var(--mono);font-size:12.5px;font-weight:600}
.bigbar{height:8px;border:1px solid var(--rule-2);display:flex;margin:6px 0;overflow:hidden}
.bigbar i{display:block;height:100%}
.queue{display:grid;gap:2px;max-height:270px;overflow:auto}
.qbtn{
  display:flex;gap:8px;align-items:baseline;background:transparent;border:0;
  border-left:2px solid var(--rule-2);padding:5px 8px;text-align:left;cursor:pointer;width:100%;min-width:0;
}
.qbtn:hover{background:var(--shell-3)}
.qbtn.is-wrong{border-left-color:var(--bad)}
.qbtn.is-flag{border-left-color:var(--flag)}
.qbtn .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);flex:none}
.qbtn .t{min-width:0;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.keys{display:grid;gap:3px}
.keyrow{display:flex;gap:8px;align-items:center;font-family:var(--serif);font-size:12.5px;color:var(--ink-2)}
kbd{
  font-family:var(--mono);font-size:10px;background:var(--shell-3);border:1px solid var(--rule-2);
  border-bottom-width:2px;padding:1px 5px;color:var(--ink);min-width:18px;text-align:center;
}

/* ============================ PAPER ============================ */
.paper{position:relative;padding:0 var(--perf);min-height:100%}
.paper::before,.paper::after{
  content:"";position:absolute;top:0;bottom:0;width:var(--perf);
  background:var(--paper-2);pointer-events:none;
}
.paper::before{left:0;border-right:1px solid var(--rule);box-shadow:inset -4px 0 0 -3px var(--rule)}
.paper::after{right:0;border-left:1px solid var(--rule);box-shadow:inset 4px 0 0 -3px var(--rule)}
.sheet{padding:0 var(--pad) 64px}

.head{padding:30px 0 18px;border-bottom:2px solid var(--ink);display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.head h2{font-family:var(--sans);font-weight:700;font-size:clamp(22px,2.6vw,34px);letter-spacing:-.01em;text-transform:uppercase;line-height:1}
.head p{font-family:var(--serif);font-size:14.5px;color:var(--ink-2);margin:8px 0 0;max-width:62ch}
.head .r{margin-left:auto;text-align:right}

.rec{
  border-bottom:1px solid var(--rule);
  padding:22px var(--recpad) 24px;margin:0 calc(-1 * var(--recpad));
  scroll-margin-top:calc(var(--top) + 12px);
}
.rec.cur{background:var(--paper-2);box-shadow:inset 3px 0 0 var(--stamp)}
.rec.cur .idx{color:var(--stamp)}
.rechead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px;max-width:86ch}
.idx{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.05em}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.flagbtn{
  flex:none;width:26px;height:24px;display:grid;place-items:center;cursor:pointer;
  background:transparent;border:1px solid var(--rule-2);color:var(--ink-2);
}
.flagbtn svg{width:12px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9}
.flagbtn:hover{color:var(--flag);border-color:var(--flag)}
.flagbtn[aria-pressed="true"]{color:var(--flag);border-color:var(--flag);background:var(--flag-bg)}
.flagbtn[aria-pressed="true"] svg{fill:currentColor}
.tag{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid var(--rule-2);color:var(--ink-2);padding:2px 6px;white-space:nowrap;
}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.bad{color:var(--bad);border-color:var(--bad)}
.tag.flag{color:var(--flag);border-color:var(--flag)}
.tag.multi{color:var(--pick);border-color:var(--pick)}

.stem{font-family:var(--mono);font-size:14.5px;line-height:1.62;margin:0;max-width:78ch}
.gloss{
  display:block;font-family:var(--serif);font-size:14.5px;line-height:1.6;
  color:var(--ink-2);max-width:74ch;margin:4px 0 0;
}
.qbody{margin-top:16px}
.qimg{display:block;margin:14px 0 4px;border:1px solid var(--rule-2);max-width:min(100%,620px);cursor:zoom-in}

/* --- phương án nhiều lựa chọn --- */
.opts{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-width:86ch}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:transparent;border:1px solid transparent;color:var(--ink);
  padding:8px 10px;cursor:pointer;
}
.opt:hover{border-color:var(--rule-2)}
.opt .k{
  flex:none;width:22px;height:22px;display:grid;place-items:center;margin-top:1px;
  border:1px solid var(--rule-2);font-family:var(--mono);font-weight:600;font-size:11.5px;
}
.opt .tx{flex:1;min-width:0;font-family:var(--mono);font-size:13.5px;line-height:1.55}
.opt .tx .gloss{font-size:13.5px;margin-top:3px}
.opt .mk{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;white-space:nowrap;padding-top:5px;display:none;
}
.opt[data-pick="1"]{border-color:var(--pick);background:var(--pick-bg)}
.opt[data-pick="1"] .k{background:var(--pick);border-color:var(--pick);color:var(--on-accent)}
.opt[data-pick="1"] .mk-you{display:block;color:var(--pick)}
.rec[data-done="1"] .opt{cursor:default}
.rec[data-done="1"] .opt:hover{border-color:transparent}
.rec[data-done="1"] .opt[data-right="1"]{border-color:var(--ok);background:var(--ok-bg)}
.rec[data-done="1"] .opt[data-right="1"] .k{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.rec[data-done="1"] .opt[data-right="1"] .mk-ok{display:block;color:var(--ok)}
.rec[data-done="1"] .opt[data-right="1"] .mk-you{display:none}
.rec[data-done="1"] .opt[data-pick="1"][data-right="0"]{border-color:var(--bad);background:var(--bad-bg)}
.rec[data-done="1"] .opt[data-pick="1"][data-right="0"] .k{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.rec[data-done="1"] .opt[data-pick="1"][data-right="0"] .mk-you{display:block;color:var(--bad)}

/* --- dạng Có / Không theo dòng --- */
.ynlist{list-style:none;margin:0;padding:0;max-width:92ch;border-top:1px solid var(--rule)}
.yn{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:center;
  padding:12px 10px;border-bottom:1px solid var(--rule);
}
.yn .ynt{font-family:var(--mono);font-size:13.5px;line-height:1.55;min-width:0}
.yn .ynt .gloss{font-size:13.5px;margin-top:3px}
.ynb{display:flex;flex:none;border:1px solid var(--rule-2)}
.ynb button{
  background:transparent;border:0;border-right:1px solid var(--rule-2);
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-2);padding:6px 14px;cursor:pointer;min-width:64px;
}
.ynb button:last-child{border-right:0}
.ynb button:hover{background:var(--shell-3);color:var(--ink)}
.ynb button[aria-pressed="true"]{background:var(--pick);color:var(--on-accent)}
.rec[data-done="1"] .ynb button{cursor:default}
.rec[data-done="1"] .ynb button:hover{background:transparent;color:var(--ink-2)}
.rec[data-done="1"] .ynb button[aria-pressed="true"]{background:var(--bad);color:var(--on-accent)}
.rec[data-done="1"] .yn[data-right="1"] .ynb button[aria-pressed="true"]{background:var(--ok);color:var(--on-accent)}
.rec[data-done="1"] .yn[data-right="0"] .ynb button[data-correct="1"]{box-shadow:inset 0 0 0 2px var(--ok);color:var(--ok)}

/* --- dạng chọn từ danh sách --- */
.blanks{display:grid;gap:18px;max-width:78ch}
.blank .blabel{display:block;font-family:var(--mono);font-size:13px;line-height:1.55;margin-bottom:8px;color:var(--ink)}
.blank .blabel .gloss{font-size:13px;margin-top:3px}
.blank .ansline{
  font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  margin-top:7px;display:none;
}
.rec[data-done="1"] .blank[data-right="0"] .ansline{display:block}
.blank .ansline.ok{color:var(--ok)}
.blank .ansline.bad{color:var(--bad)}
.rec[data-done="1"] .sel select{pointer-events:none}
.rec[data-done="1"] .blank[data-right="1"] select{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.rec[data-done="1"] .blank[data-right="0"] select{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}

.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px;max-width:86ch}
.note{font-family:var(--serif);font-size:13.5px;color:var(--ink-2)}

/* --- khối đáp án --- */
.rev{display:none;margin-top:20px;border-top:1px solid var(--ink);padding-top:18px}
.rec[data-done="1"] .rev{display:block}
.revtop{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.stamp{
  border:2.5px solid var(--stamp);color:var(--stamp);padding:5px 13px 6px;
  transform:rotate(-2.2deg);box-shadow:inset 0 0 0 1px var(--stamp);
  display:flex;align-items:baseline;gap:10px;flex:none;max-width:100%;
}
.stamp .t{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.stamp .v{font-family:var(--sans);font-weight:700;font-size:26px;line-height:1;letter-spacing:.06em}
.stamp.txt .v{font-size:15px;letter-spacing:.02em;font-family:var(--mono);font-weight:600;line-height:1.35}
.verdict{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--bad)}
.conf{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid currentColor;padding:3px 8px;
}
.conf.h{color:var(--ok)}
.conf.m{color:var(--flag)}
.conf.l{color:var(--bad)}

.revgrid{display:grid;gap:20px 36px}
@media(min-width:1500px){ .revgrid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }
.sech{
  font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-2);display:flex;align-items:center;gap:10px;margin-bottom:8px;
}
.sech::after{content:"";flex:1;height:0;border-top:1px dotted var(--rule-2)}
.prose{font-family:var(--serif);font-size:15.5px;line-height:1.7;max-width:72ch;margin:0}
.prose b{box-shadow:inset 0 -2px 0 var(--flag)}
ul.elim{list-style:none;margin:0;padding:0;max-width:72ch}
ul.elim li{font-family:var(--serif);font-size:15px;line-height:1.65;padding-left:20px;position:relative;margin-bottom:6px}
ul.elim li::before{content:"\00D7";position:absolute;left:2px;top:-1px;font-family:var(--sans);font-weight:700;color:var(--bad);font-size:16px}
.cite{
  font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-top:16px;
  padding-top:10px;border-top:1px dotted var(--rule-2);max-width:78ch;word-break:break-word;
}
.notewrap{margin-top:20px;padding-top:16px;border-top:1px dotted var(--rule-2)}
.notewrap .lbl{display:block;margin-bottom:6px}
.notewrap textarea{
  display:block;width:100%;max-width:72ch;min-height:64px;resize:vertical;background:var(--sunken);
  border:1px solid var(--rule-2);color:var(--ink);font-family:var(--serif);font-size:14.5px;padding:9px 11px;
}
.notewrap textarea:focus{outline:none;border-color:var(--stamp)}

/* ============================ EXAM ============================ */
.panel{border:1px solid var(--rule-2);background:var(--paper-2);padding:24px var(--pad);margin-top:24px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px 24px;align-items:end}
.grid2 .lbl{min-height:15px}
.fldw{display:grid;gap:6px}
.timer{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:.06em}
.timer.low{color:var(--bad)}
.pal{display:flex;flex-wrap:wrap;gap:4px}
.pd{
  width:30px;height:28px;border:1px solid var(--rule-2);background:transparent;color:var(--ink-2);
  font-family:var(--mono);font-size:11px;cursor:pointer;position:relative;
}
.pd:hover{border-color:var(--ink-3);color:var(--ink)}
.pd.is-ans{border-color:var(--pick);color:var(--pick)}
.pd.is-flag::after{content:"";position:absolute;top:2px;right:2px;width:4px;height:4px;background:var(--flag)}
.pd.is-cur{background:var(--ink);border-color:var(--ink);color:var(--on-accent)}

.score{display:flex;gap:36px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .n b{font-family:var(--sans);font-weight:700;font-size:34px;line-height:1}
.ring .n span{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);letter-spacing:.1em;text-transform:uppercase}
.result-h{font-family:var(--sans);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase}
.result-h.ok{color:var(--ok)}
.result-h.bad{color:var(--flag)}
.figs{display:flex;gap:28px;flex-wrap:wrap;margin-top:12px}
.fig b{display:block;font-family:var(--mono);font-size:23px;font-weight:600}

/* ============================ TABLE ============================ */
.tw{overflow-x:auto;margin-top:12px}
.tw table{min-width:440px}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule)}
th{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);border-bottom-color:var(--rule-2)}
td:first-child{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.02em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.sbar{height:5px;background:var(--rule);display:flex;min-width:70px}
.sbar i{display:block;height:100%}

.empty{padding:64px 10px;text-align:center;font-family:var(--serif);font-size:14.5px;color:var(--ink-2)}
.empty b{display:block;font-family:var(--sans);font-size:18px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-bottom:8px}

/* ============================ OVERLAY ============================ */
.ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px}
.ov .box{background:var(--shell-2);border:1px solid var(--rule-2);max-width:520px;width:100%;padding:22px 24px;max-height:86vh;overflow:auto}
.ov h3{font-family:var(--sans);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.ov p{font-family:var(--serif);font-size:14.5px;color:var(--ink-2);margin:0 0 16px}
.ov.zoom{cursor:zoom-out}
.ov.zoom img{max-width:96vw;max-height:92vh;border:1px solid var(--rule-2)}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;
  background:var(--ink);color:var(--on-accent);font-family:var(--mono);font-size:12.5px;
  padding:9px 16px;border:1px solid var(--ink);
}

/* ============ RESPONSIVE OVERRIDES (phải nằm sau mọi component) ============ */
@media(max-width:640px){
  .yn{grid-template-columns:minmax(0,1fr);gap:12px}
  .ynb{justify-self:start}
  .ynb button{min-width:84px;padding:7px 16px}
  .stem,.opt .tx,.yn .ynt{font-size:13.5px}
  .revtop{gap:12px}
  .stamp{transform:none}
}

/* ============================ PRINT ============================ */
@media print{
  body{background:#fff;color:#000}
  .top,.rail,.aside,.bar,.notewrap,.ov,.toast{display:none!important}
  .app{display:block}
  .main{background:#fff}
  .paper{padding:0}
  .paper::before,.paper::after{display:none}
  .rec{break-inside:avoid;background:#fff!important}
  .rev{display:block!important}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

</style>

<script>
/* ============================================================
   Exam Trainer — engine
   Hỗ trợ 3 dạng câu: mcq · yesno · dropdown
   ============================================================ */
const DATA = {"meta":{"code":"CCDV-F","title":{"en":"CCDV-F - Claude Certified Developer - Foundations"},"org":"Anthropic","pass":70},"topics":[{"n":1,"title":{"en":"Practice Set 1","vi":"Bộ đề 1","jp":"練習問題 1"},"questions":[{"id":"ccdvf-q001","n":1,"topic":1,"type":"mcq","stem":{"en":"Your Claude agent has access to a tool that retrieves customer records. A teammate has noticed that the agent occasionally calls the tool with arguments the schema does not declare, and the tool's downstream service returns an error each time. The teammate proposes loosening the schema so the tool accepts whatever arguments the model produces. How would you respond?","vi":"Đại lý Claude của bạn có quyền truy cập vào một công cụ truy xuất hồ sơ khách hàng. Một đồng đội đã nhận thấy rằng tác nhân thỉnh thoảng gọi công cụ bằng các đối số mà lược đồ không khai báo và dịch vụ xuôi dòng của công cụ này mỗi lần đều trả về lỗi. Đồng đội đề xuất nới lỏng lược đồ để công cụ chấp nhận bất kỳ đối số nào mà mô hình tạo ra. Bạn sẽ trả lời thế nào?","jp":"Claude エージェントは、顧客レコードを取得するツールにアクセスできます。チームメイトは、エージェントがスキーマで宣言されていない引数を使用してツールを呼び出すことがあり、そのたびにツールのダウンストリーム サービスがエラーを返すことに気づきました。チームメイトは、モデルが生成するあらゆる引数をツールが受け入れるようにスキーマを緩めることを提案しました。あなたならどう答えますか？"},"options":[{"k":"A","t":{"en":"Add a system prompt instruction telling the model to produce schema-conforming arguments, treating the prompt instruction as the primary mechanism for keeping the agent's tool calls valid.","vi":"Thêm lệnh nhắc hệ thống yêu cầu mô hình tạo các đối số tuân thủ lược đồ, coi lệnh nhắc nhở là cơ chế chính để giữ cho các lệnh gọi công cụ của tác nhân hợp lệ.","jp":"スキーマに準拠した引数を生成するようにモデルに指示するシステム プロンプト命令を追加し、プロンプト命令をエージェントのツール呼び出しを有効に保つための主要なメカニズムとして扱います。"}},{"k":"B","t":{"en":"Keep the schema strict, validate arguments before dispatching, and return a structured error so the agent can retry.","vi":"Giữ lược đồ ở mức nghiêm ngặt, xác thực các đối số trước khi gửi đi và trả về lỗi có cấu trúc để tổng đài viên có thể thử lại.","jp":"スキーマを厳密に保ち、ディスパッチする前に引数を検証し、エージェントが再試行できるように構造化エラーを返します。"}},{"k":"C","t":{"en":"Remove the schema entirely and rely on the downstream service to reject invalid calls, treating the downstream service as the team's primary enforcement layer.","vi":"Xóa hoàn toàn lược đồ và dựa vào dịch vụ xuôi dòng để từ chối các cuộc gọi không hợp lệ, coi dịch vụ xuôi tuyến là lớp thực thi chính của nhóm.","jp":"スキーマを完全に削除し、ダウンストリーム サービスに依存して無効な呼び出しを拒否し、ダウンストリーム サービスをチームの主要な強制レイヤーとして扱います。"}},{"k":"D","t":{"en":"Loosen the schema as the teammate proposed so the downstream service receives every call the agent makes during normal operation.","vi":"Nới lỏng lược đồ như đồng đội đề xuất để dịch vụ hạ nguồn nhận được mọi cuộc gọi mà tổng đài viên thực hiện trong quá trình hoạt động bình thường.","jp":"チームメイトが提案したようにスキーマを緩め、通常の動作中にエージェントが行うすべての呼び出しをダウンストリーム サービスが受信できるようにします。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Schema của tool là <b>hợp đồng xác định (deterministic contract)</b> giữa model và dịch vụ phía sau; khi model sinh tham số không được khai báo, cách sửa là <b>giữ schema chặt và validate tham số trước khi dispatch</b>, chứ không nới lỏng hợp đồng. Lớp validation chặn lời gọi sai ngay tại ranh giới tool, nên dịch vụ khách hàng phía sau không còn nhận request lỗi. Đồng thời trả về một <b>lỗi có cấu trúc</b> (ví dụ <code>tool_result</code> có <code>is_error</code> kèm mô tả tham số nào không hợp lệ) để agent hiểu lỗi và tự retry với tham số đúng.","elim":["<b>A.</b> Chỉ dẫn trong system prompt chỉ có tính <b>xác suất</b>, không đảm bảo; coi nó là cơ chế chính thì lời gọi sai vẫn lọt xuống dịch vụ phía sau như hiện tại.","<b>C.</b> Bỏ hẳn schema làm model mất hướng dẫn về tham số (lời gọi sai còn tăng) và đẩy toàn bộ việc kiểm soát xuống dịch vụ phía sau — chính nơi đang trả lỗi.","<b>D.</b> Nới schema chỉ che triệu chứng: dịch vụ phía sau vẫn nhận tham số nó không hiểu và vẫn lỗi, trong khi hợp đồng giữa agent và tool bị phá vỡ."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.2"},{"id":"ccdvf-q002","n":2,"topic":1,"type":"mcq","stem":{"en":"A new agent your team built handles customer support tickets, but it routinely gets confused when a single ticket spans billing, shipping, and product issues. The agent often loses track of which sub-issue it has already addressed and revisits the same one. The team is considering architectural changes. What architectural change would you recommend?","vi":"Một đại lý mới mà nhóm của bạn xây dựng xử lý các yêu cầu hỗ trợ khách hàng, nhưng nó thường bị nhầm lẫn khi một yêu cầu duy nhất liên quan đến các vấn đề về thanh toán, vận chuyển và sản phẩm. Nhân viên thường không theo dõi được vấn đề phụ nào đã được giải quyết và xem xét lại vấn đề tương tự. Nhóm đang xem xét thay đổi kiến ​​trúc. Bạn muốn đề xuất thay đổi kiến ​​trúc nào?","jp":"チームが構築した新しいエージェントはカスタマー サポート チケットを処理しますが、単一のチケットが請求、配送、製品の問題にまたがる場合、日常的に混乱が生じます。エージェントは、どのサブ問題にすでに対応したかを見失い、同じ問題を再度検討することがよくあります。チームはアーキテクチャの変更を検討しています。どのようなアーキテクチャ上の変更をお勧めしますか?"},"options":[{"k":"A","t":{"en":"Introduce an orchestrator agent that delegates billing, shipping, and product sub-issues to dedicated subagents.","vi":"Giới thiệu một đại lý điều phối ủy quyền các vấn đề phụ về thanh toán, vận chuyển và sản phẩm cho các đại lý phụ chuyên dụng.","jp":"請求、配送、製品のサブ発行を専用のサブエージェントに委任するオーケストレーター エージェントを導入します。"}},{"k":"B","t":{"en":"Switch to a deterministic workflow that handles billing, shipping, and product issues in a fixed sequence.","vi":"Chuyển sang quy trình làm việc xác định để xử lý các vấn đề về thanh toán, vận chuyển và sản phẩm theo một trình tự cố định.","jp":"請求、配送、製品の問題を一定の順序で処理する決定的なワークフローに切り替えます。"}},{"k":"C","t":{"en":"Increase the size of the agent's context window so it can hold the full ticket history at once.","vi":"Tăng kích thước cửa sổ ngữ cảnh của tổng đài viên để nó có thể chứa toàn bộ lịch sử yêu cầu cùng một lúc.","jp":"エージェントのコンテキスト ウィンドウのサイズを大きくして、完全なチケット履歴を一度に保持できるようにします。"}},{"k":"D","t":{"en":"Add detailed prompting that instructs the agent to track which sub-issues have been resolved and which remain.","vi":"Thêm lời nhắc chi tiết để hướng dẫn tổng đài viên theo dõi vấn đề phụ nào đã được giải quyết và vấn đề nào còn tồn tại.","jp":"どのサブ問題が解決され、どれが残っているかを追跡するようエージェントに指示する詳細なプロンプトを追加します。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Vấn đề là một agent duy nhất phải theo dõi nhiều chuỗi việc độc lập (billing, shipping, product) trong cùng một context nên lẫn lộn và lặp lại. Mẫu <b>orchestrator (coordinator) – subagent</b> tách mỗi nhóm vấn đề cho một subagent chuyên trách với context riêng, còn orchestrator giữ <b>trạng thái tổng thể</b>: sub-issue nào đã giao, đã xong, còn lại. Nhờ đó mỗi subagent tập trung một miền, và việc theo dõi tiến độ trở thành trách nhiệm tường minh của orchestrator thay vì phụ thuộc vào trí nhớ của một context bị quá tải.","elim":["<b>B.</b> Workflow cố định theo thứ tự billing → shipping → product không phù hợp với ticket đa dạng: nhiều ticket chỉ có một hai loại vấn đề hoặc cần thứ tự khác, và nó mất khả năng thích ứng của agent.","<b>C.</b> Context window lớn hơn không giải quyết việc theo dõi trạng thái; agent vẫn phải tự nhớ trong một context lẫn lộn, thậm chí dễ lạc hơn khi context dài.","<b>D.</b> Thêm chỉ dẫn prompt chỉ là biện pháp xác suất trong cùng một context quá tải; nó không thay đổi kiến trúc gây ra sự nhầm lẫn."]},"cite":"Hướng dẫn ôn tập — §3.3 Hub-and-Spoke: Coordinator và Subagent; Lĩnh vực 1.2"},{"id":"ccdvf-q003","n":3,"topic":1,"type":"mcq","stem":{"en":"Your Claude application is hitting context window limits when processing long customer service transcripts. A junior developer suggests increasing the temperature parameter to fix the issue. How would you respond?","vi":"Ứng dụng Claude của bạn sắp đạt đến giới hạn cửa sổ ngữ cảnh khi xử lý bản ghi dịch vụ khách hàng dài. Một nhà phát triển cấp dưới đề xuất tăng thông số nhiệt độ để khắc phục sự cố. Bạn sẽ trả lời thế nào?","jp":"Claude アプリケーションは、長い顧客サービス記録を処理するときにコンテキスト ウィンドウの制限に達します。若手開発者は、問題を解決するために温度パラメータを増やすことを提案しています。あなたならどう答えますか？"},"options":[{"k":"A","t":{"en":"Increase the temperature parameter as the junior developer suggested and observe whether the context window issue resolves over the next several runs of the application in production.","vi":"Tăng tham số nhiệt độ như nhà phát triển cấp dưới đề xuất và quan sát xem sự cố cửa sổ ngữ cảnh có được giải quyết trong vài lần chạy ứng dụng tiếp theo trong sản xuất hay không.","jp":"ジュニア開発者が提案したように温度パラメータを増やし、本番環境でのアプリケーションの次の数回の実行でコンテキスト ウィンドウの問題が解決するかどうかを観察します。"}},{"k":"B","t":{"en":"Adjust the temperature parameter together with the max_tokens parameter, treating the combined adjustment as the team's mechanism for managing context window pressure during long-transcript processing.","vi":"Điều chỉnh tham số nhiệt độ cùng với tham số max_tokens, coi điều chỉnh kết hợp là cơ chế của nhóm để quản lý áp lực cửa sổ ngữ cảnh trong quá trình xử lý bản ghi dài.","jp":"温度パラメータを max_tokens パラメータと一緒に調整し、組み合わせた調整を、長いトランスクリプト処理中にコンテキスト ウィンドウのプレッシャーを管理するためのチームのメカニズムとして扱います。"}},{"k":"C","t":{"en":"Remove the system prompt entirely to make room for longer transcripts in each request, freeing up context window space the system prompt would otherwise consume.","vi":"Xóa hoàn toàn lời nhắc hệ thống để nhường chỗ cho các bản ghi dài hơn trong mỗi yêu cầu, giải phóng không gian cửa sổ ngữ cảnh mà lời nhắc hệ thống sẽ sử dụng.","jp":"システム プロンプトを完全に削除して、各リクエストで長いトランスクリプトを格納できるスペースを確保し、システム プロンプトが消費するコンテキスト ウィンドウのスペースを解放します。"}},{"k":"D","t":{"en":"Explain that temperature controls sampling randomness and is unrelated to context capacity, then address the context issue through summarization or chunking.","vi":"Giải thích rằng nhiệt độ kiểm soát tính ngẫu nhiên của việc lấy mẫu và không liên quan đến dung lượng ngữ cảnh, sau đó giải quyết vấn đề ngữ cảnh thông qua tóm tắt hoặc phân đoạn.","jp":"温度はサンプリングのランダム性を制御し、コンテキストの容量とは無関係であることを説明し、要約またはチャンキングを通じてコン​​テキストの問題に対処します。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> <code>temperature</code> chỉ điều khiển <b>mức ngẫu nhiên khi sampling</b> token đầu ra, hoàn toàn không ảnh hưởng đến số token mà context window chứa được. Vì vậy cần giải thích đúng bản chất cho developer junior, rồi xử lý gốc rễ là <b>lượng input quá lớn</b>: tóm tắt các phần transcript cũ hoặc chia transcript thành chunk để xử lý từng phần rồi tổng hợp. Đây là các kỹ thuật quản lý context chuẩn khi tài liệu vượt giới hạn.","elim":["<b>A.</b> Tăng temperature không thay đổi kích thước input hay giới hạn context; “quan sát trong production” chỉ trì hoãn việc sửa lỗi và làm đầu ra kém ổn định hơn.","<b>B.</b> <code>max_tokens</code> chỉ giới hạn độ dài đầu ra, còn temperature không liên quan; kết hợp hai tham số này không giải quyết việc transcript đầu vào quá dài.","<b>C.</b> Xóa system prompt làm mất chỉ dẫn hành vi quan trọng mà chỉ giải phóng một phần rất nhỏ context; transcript dài vẫn có thể vượt giới hạn."]},"cite":"Hướng dẫn ôn tập — §1.5 Context Window; Lĩnh vực 5.1"},{"id":"ccdvf-q004","n":4,"topic":1,"type":"mcq","stem":{"en":"You are running Claude Code as part of an automated continuous integration pipeline. The pipeline needs Claude Code to execute a set of well-defined tasks without prompting for confirmation, and the output needs to be captured for downstream processing. How would you configure the pipeline?","vi":"Bạn đang chạy Claude Code như một phần của quy trình tích hợp liên tục tự động. Quy trình cần Mã Claude để thực thi một tập hợp các tác vụ được xác định rõ ràng mà không cần nhắc xác nhận và đầu ra cần được ghi lại để xử lý tiếp theo. Bạn sẽ định cấu hình đường ống như thế nào?","jp":"自動化された継続的インテグレーション パイプラインの一部としてクロード コードを実行しています。パイプラインには、確認を求めるプロンプトを表示せずに明確に定義された一連のタスクを実行するためにクロード コードが必要であり、ダウンストリーム処理のために出力をキャプチャする必要があります。パイプラインをどのように構成しますか?"},"options":[{"k":"A","t":{"en":"Replace Claude Code with a different tool that does not require any configuration to operate without confirmation prompts in the pipeline.","vi":"Thay thế Claude Code bằng một công cụ khác không yêu cầu bất kỳ cấu hình nào để hoạt động mà không có lời nhắc xác nhận trong quy trình.","jp":"クロード コードを、パイプラインで確認プロンプトを表示せずに動作するための構成を必要としない別のツールに置き換えます。"}},{"k":"B","t":{"en":"Run Claude Code in headless mode with the required permissions configured in settings.json and capture its output for downstream processing.","vi":"Chạy Mã Claude ở chế độ không đầu với các quyền cần thiết được định cấu hình trong settings.json và ghi lại đầu ra của nó để xử lý tiếp theo.","jp":"settings.json で構成された必要なアクセス許可を使用してヘッドレス モードでクロード コードを実行し、ダウンストリーム処理のためにその出力をキャプチャします。"}},{"k":"C","t":{"en":"Disable Claude Code's confirmation prompts globally across all environments so the pipeline runs without interruption from any prompt.","vi":"Vô hiệu hóa lời nhắc xác nhận của Claude Code trên toàn cầu trên tất cả các môi trường để quy trình chạy mà không bị gián đoạn bởi bất kỳ lời nhắc nào.","jp":"Claude Code の確認プロンプトをすべての環境でグローバルに無効にして、どのプロンプトからも中断されることなくパイプラインが実行されるようにします。"}},{"k":"D","t":{"en":"Run Claude Code in interactive mode and have a developer manually approve every confirmation prompt while the pipeline executes its tasks.","vi":"Chạy Mã Claude ở chế độ tương tác và yêu cầu nhà phát triển phê duyệt thủ công mọi lời nhắc xác nhận trong khi quy trình thực thi các nhiệm vụ của mình.","jp":"クロード コードを対話モードで実行し、パイプラインがタスクを実行する間、開発者がすべての確認プロンプトを手動で承認します。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Trong CI, Claude Code phải chạy ở <b>chế độ headless/không tương tác</b> (<code>claude -p</code>): xử lý prompt, in kết quả ra stdout rồi thoát, không chờ người nhập. Để không bị hỏi xác nhận, cấu hình <b>quyền được phép tường minh</b> trong <code>settings.json</code> (ví dụ danh sách <code>permissions.allow</code>) chỉ cho đúng các thao tác pipeline cần. Đầu ra có thể lấy ở dạng có cấu trúc bằng <code>--output-format json</code> để các bước downstream phân tích.","elim":["<b>A.</b> Claude Code đã hỗ trợ sẵn chạy headless trong CI; thay công cụ khác là né vấn đề và mất năng lực cần dùng, không phải cấu hình đúng.","<b>C.</b> Tắt prompt xác nhận toàn cục cho mọi môi trường là quá rộng, xóa bỏ lớp bảo vệ cả trên máy developer; quyền nên được cấp có phạm vi cho pipeline.","<b>D.</b> Chế độ tương tác cần người duyệt từng bước, trái với yêu cầu pipeline tự động và làm CI bị treo chờ người."]},"cite":"Hướng dẫn ôn tập — §5.9 Claude Code CLI cho CI/CD; Lĩnh vực 3.6"},{"id":"ccdvf-q005","n":5,"topic":1,"type":"mcq","stem":{"en":"Your application uses the Messages API to handle multi-turn conversations. Each new turn resends the entire conversation history, and your token costs are growing as conversations get longer. You suspect there is a more efficient approach. How would you address this?","vi":"Ứng dụng của bạn sử dụng API Tin nhắn để xử lý các cuộc trò chuyện nhiều lượt. Mỗi lượt mới sẽ gửi lại toàn bộ lịch sử cuộc trò chuyện và chi phí mã thông báo của bạn sẽ tăng lên khi cuộc trò chuyện kéo dài hơn. Bạn nghi ngờ có một cách tiếp cận hiệu quả hơn. Bạn sẽ giải quyết vấn đề này như thế nào?","jp":"アプリケーションは Messages API を使用して複数ターンの会話を処理します。新しいターンごとに会話履歴全体が再送信され、会話が長くなるにつれてトークンのコストが増加します。もっと効率的なアプローチがあるのではないかと思われます。これについてはどう対処しますか?"},"options":[{"k":"A","t":{"en":"Use prompt caching to reuse the static portions of the conversation context across turns instead of paying for them at the normal input-token rate on every request the application sends.","vi":"Sử dụng bộ nhớ đệm nhắc nhở để sử dụng lại các phần tĩnh của ngữ cảnh hội thoại qua các lượt thay vì trả tiền cho chúng theo tỷ lệ mã thông báo đầu vào thông thường cho mỗi yêu cầu mà ứng dụng gửi.","jp":"プロンプト キャッシュを使用すると、アプリケーションが送信するリクエストごとに通常の入力トークン レートで会話コンテキストの静的部分の料金を支払うのではなく、ターンをまたいで会話コンテキストの静的部分を再利用できます。"}},{"k":"B","t":{"en":"Switch to the Batch API for every turn so the per-call cost is reduced, treating the batch as the team's primary cost-control mechanism for multi-turn work.","vi":"Chuyển sang API hàng loạt cho mỗi lượt để giảm chi phí mỗi cuộc gọi, coi lô là cơ chế kiểm soát chi phí chính của nhóm cho công việc nhiều lượt.","jp":"ターンごとにバッチ API に切り替えることで、呼び出しごとのコストが削減され、バッチが複数ターンの作業におけるチームの主要なコスト制御メカニズムとして扱われます。"}},{"k":"C","t":{"en":"Truncate every conversation to the last two messages so that token usage stays low and costs remain predictable across the application's normal operation.","vi":"Cắt ngắn mọi cuộc trò chuyện thành hai tin nhắn cuối cùng để mức sử dụng mã thông báo ở mức thấp và chi phí vẫn có thể dự đoán được trong suốt quá trình hoạt động bình thường của ứng dụng.","jp":"すべての会話を最後の 2 つのメッセージに切り詰めて、トークンの使用量を低く抑え、アプリケーションの通常の動作全体にわたるコストを予測可能な状態に保ちます。"}},{"k":"D","t":{"en":"Summarize each conversation after every turn and replace the full history with the summary on the next request, reducing token count at the cost of fidelity.","vi":"Tóm tắt từng cuộc trò chuyện sau mỗi lượt và thay thế toàn bộ lịch sử bằng bản tóm tắt cho yêu cầu tiếp theo, làm giảm số lượng mã thông báo với cái giá là độ trung thực.","jp":"ターンごとに各会話を要約し、次のリクエストで完全な履歴を要約に置き換えて、忠実性を犠牲にしてトークン数を削減します。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Messages API là stateless nên mỗi lượt phải gửi lại toàn bộ lịch sử; phần tiền tố lặp lại (system prompt, tool definitions, các lượt cũ) chính là thứ làm chi phí tăng. <b>Prompt caching</b> (đánh dấu <code>cache_control</code> tại điểm ngắt) cho phép tái sử dụng tiền tố đã cache ở các request sau với <b>giá đọc cache thấp hơn nhiều</b> so với input token thường, đồng thời giảm độ trễ. Cách này giữ nguyên đầy đủ lịch sử hội thoại nên không đánh đổi chất lượng.","elim":["<b>B.</b> Batch API là xử lý bất đồng bộ, có thể mất đến 24 giờ, không phù hợp với hội thoại multi-turn tương tác; nó cũng không loại bỏ việc gửi lại lịch sử.","<b>C.</b> Cắt còn hai tin nhắn cuối làm mất ngữ cảnh quan trọng của hội thoại, khiến câu trả lời sai hoặc mâu thuẫn với những gì đã thống nhất trước đó.","<b>D.</b> Tóm tắt sau mỗi lượt tốn thêm một lời gọi model mỗi lượt và làm mất chi tiết; prompt caching giảm chi phí mà không phải hy sinh độ trung thực."]}},{"id":"ccdvf-q006","n":6,"topic":1,"type":"mcq","stem":{"en":"You are designing a Claude application that will require structured JSON output for downstream processing. The output schema is well-defined, and downstream systems will reject malformed JSON.","vi":"Bạn đang thiết kế một ứng dụng Claude yêu cầu đầu ra JSON có cấu trúc để xử lý tiếp theo. Lược đồ đầu ra được xác định rõ ràng và các hệ thống hạ nguồn sẽ từ chối JSON không đúng định dạng.","jp":"あなたは、ダウンストリーム処理のために構造化された JSON 出力を必要とする Claude アプリケーションを設計しています。出力スキーマは明確に定義されており、ダウンストリーム システムは不正な形式の JSON を拒否します。"},"options":[{"k":"A","t":{"en":"Structure the prompt to request output in a schema that is described in plain English, with downstream systems parsing whatever shape Claude produces.","vi":"Cấu trúc lời nhắc yêu cầu đầu ra trong một lược đồ được mô tả bằng tiếng Anh đơn giản, với các hệ thống xuôi dòng phân tích cú pháp bất kỳ hình dạng nào mà Claude tạo ra.","jp":"平易な英語で記述されたスキーマで出力を要求するプロンプトを構成し、下流システムはクロードが生成するあらゆる形状を解析します。"}},{"k":"B","t":{"en":"Define a clear schema and structure the prompt to request output in that schema, with downstream systems handling any validation needed.","vi":"Xác định một lược đồ rõ ràng và cấu trúc lời nhắc yêu cầu đầu ra trong lược đồ đó, đồng thời các hệ thống phía sau sẽ xử lý mọi xác thực cần thiết.","jp":"明確なスキーマを定義し、そのスキーマでの出力を要求するプロンプトを構成し、ダウンストリーム システムが必要な検証を処理します。"}},{"k":"C","t":{"en":"Define a clear schema, structure the prompt to request output in that schema, and validate Claude's output against the schema before passing it downstream.","vi":"Xác định một lược đồ rõ ràng, cấu trúc lời nhắc yêu cầu đầu ra trong lược đồ đó và xác thực đầu ra của Claude dựa trên lược đồ trước khi chuyển nó xuống.","jp":"明確なスキーマを定義し、そのスキーマでの出力を要求するプロンプトを構成し、Claude の出力をダウンストリームに渡す前にスキーマに対して検証します。"}},{"k":"D","t":{"en":"Avoid structured output and use free-form text everywhere instead, on the grounds that free-form text is more flexible and handles edge cases better than structured schemas.","vi":"Tránh đầu ra có cấu trúc và thay vào đó hãy sử dụng văn bản dạng tự do ở mọi nơi, vì văn bản dạng tự do linh hoạt hơn và xử lý các trường hợp khó khăn hơn so với lược đồ có cấu trúc.","jp":"構造化出力を避け、代わりにどこでも自由形式テキストを使用します。これは、構造化スキーマよりも自由形式テキストの方が柔軟性があり、特殊なケースをうまく処理できるためです。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Khi downstream từ chối JSON sai định dạng, cần đủ ba lớp: <b>schema rõ ràng</b>, prompt (hoặc <code>tool_use</code> với <code>input_schema</code>) yêu cầu đúng schema đó, và <b>validate đầu ra so với schema trước khi chuyển xuống downstream</b>. Ngay cả khi model thường tuân thủ, vẫn có thể có lỗi cú pháp hoặc thiếu trường; lớp validation bắt lỗi tại ranh giới ứng dụng để retry hoặc xử lý thay vì để hệ thống phía sau gặp lỗi.","elim":["<b>A.</b> Mô tả schema bằng tiếng Anh thông thường là mơ hồ, và việc để downstream “parse bất kỳ hình dạng nào” mâu thuẫn trực tiếp với yêu cầu downstream từ chối JSON sai.","<b>B.</b> Có schema và prompt nhưng đẩy validation cho downstream nghĩa là JSON lỗi vẫn đi tới hệ thống vốn sẽ từ chối nó; thiếu lớp kiểm tra tại ứng dụng.","<b>D.</b> Văn bản tự do không thể được parse một cách tin cậy bởi hệ thống cần JSON có cấu trúc; nó đi ngược với yêu cầu đề bài."]},"cite":"Hướng dẫn ôn tập — §2.4 JSON Schema cho Structured Output; Lĩnh vực 4.3"},{"id":"ccdvf-q007","n":7,"topic":1,"type":"mcq","stem":{"en":"The Claude application your team built has grown over six months, and the prompt-handling code has accumulated duplication and tangled control flow. The functionality is working, but new features are getting harder to add. How would you address this?","vi":"Ứng dụng Claude mà nhóm của bạn xây dựng đã phát triển trong hơn sáu tháng và mã xử lý nhanh chóng đã tích lũy sự trùng lặp và luồng điều khiển rối rắm. Chức năng đang hoạt động nhưng các tính năng mới ngày càng khó thêm hơn. Bạn sẽ giải quyết vấn đề này như thế nào?","jp":"あなたのチームが構築した Claude アプリケーションは 6 か月以上にわたって成長し、プロンプト処理コードには重複が蓄積され、制御フローが複雑になりました。機能は動作していますが、新しい機能を追加するのは難しくなってきています。これについてはどう対処しますか?"},"options":[{"k":"A","t":{"en":"Plan a refactoring pass to consolidate duplicated logic, separate concerns, and simplify control flow before adding new features.","vi":"Lập kế hoạch tái cấu trúc để hợp nhất logic trùng lặp, tách biệt các mối quan tâm và đơn giản hóa luồng điều khiển trước khi thêm các tính năng mới.","jp":"新しい機能を追加する前に、重複したロジックを統合し、懸念事項を分離し、制御フローを簡素化するためのリファクタリング パスを計画します。"}},{"k":"B","t":{"en":"Refactor the prompt-handling code in small increments as part of each new feature ticket, treating the cleanup as a side effect of feature work.","vi":"Tái cấu trúc mã xử lý lời nhắc theo từng bước nhỏ như một phần của mỗi phiếu tính năng mới, coi việc dọn dẹp là một tác dụng phụ của công việc tính năng.","jp":"新しい機能チケットの一部としてプロンプト処理コードを少しずつリファクタリングし、クリーンアップを機能作業の副作用として扱います。"}},{"k":"C","t":{"en":"Continue adding features and plan a refactoring pass after the next two release cycles when the team has more bandwidth for internal work.","vi":"Tiếp tục thêm các tính năng và lên kế hoạch tái cấu trúc sau hai chu kỳ phát hành tiếp theo khi nhóm có nhiều băng thông hơn cho công việc nội bộ.","jp":"機能の追加を続け、次の 2 つのリリース サイクルの後、チームが内部作業にさらに多くの帯域幅を使えるようになったら、リファクタリング パスを計画します。"}},{"k":"D","t":{"en":"Move all the prompt-handling code into a single large function to reduce the number of files developers have to navigate when reading the code.","vi":"Di chuyển tất cả mã xử lý lời nhắc vào một hàm lớn duy nhất để giảm số lượng tệp mà nhà phát triển phải điều hướng khi đọc mã.","jp":"すべてのプロンプト処理コードを 1 つの大きな関数に移動して、開発者がコードを読み取るときにナビゲートする必要があるファイルの数を減らします。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Code đã chạy đúng nhưng <b>nợ kỹ thuật</b> (trùng lặp, luồng điều khiển rối) đang trực tiếp làm chậm việc thêm tính năng. Lúc đó nên lên kế hoạch một <b>đợt refactor có chủ đích</b>: gom logic trùng lặp, <b>tách biệt các mối quan tâm</b> (dựng prompt, gọi API, xử lý kết quả) và đơn giản hóa luồng điều khiển, trước khi thêm tính năng mới. Một đợt riêng có phạm vi rõ ràng, có thể review và kiểm thử hồi quy, nên giữ nguyên chức năng trong khi tạo nền sạch cho các tính năng tiếp theo.","elim":["<b>B.</b> Dọn dẹp như “tác dụng phụ” của ticket tính năng thì không có kế hoạch tổng thể, dễ không bao giờ xử lý vấn đề cấu trúc và trộn thay đổi refactor với thay đổi tính năng, khó review.","<b>C.</b> Hoãn qua hai chu kỳ release nghĩa là tiếp tục chồng tính năng lên nền rối, làm nợ kỹ thuật và chi phí refactor sau này tăng thêm.","<b>D.</b> Gom mọi thứ vào một hàm lớn làm tăng độ rối và độ gắn kết, đi ngược nguyên tắc tách biệt mối quan tâm; ít file hơn không có nghĩa là dễ bảo trì hơn."]}},{"id":"ccdvf-q008","n":8,"topic":1,"type":"mcq","stem":{"en":"You are designing a multi-step Claude workflow where some steps must reason without seeing the full prior conversation history. The team wants to keep specific context isolated to specific steps. The context engineering technique you would use is...","vi":"Bạn đang thiết kế quy trình làm việc Claude gồm nhiều bước trong đó một số bước phải suy luận mà không xem toàn bộ lịch sử hội thoại trước đó. Nhóm muốn giữ bối cảnh cụ thể tách biệt với các bước cụ thể. Kỹ thuật kỹ thuật bối cảnh bạn sẽ sử dụng là...","jp":"あなたは、以前の完全な会話履歴を確認せずに一部のステップを推論する必要がある、複数ステップのクロード ワークフローを設計しています。チームは、特定のコンテキストを特定のステップに隔離しておきたいと考えています。使用するコンテキスト エンジニアリング手法は次のとおりです。"},"options":[{"k":"A","t":{"en":"Augmenting the context with all available content at every step so each step has access to the entire prior history of the workflow during its reasoning.","vi":"Tăng cường bối cảnh với tất cả nội dung có sẵn ở mỗi bước để mỗi bước có quyền truy cập vào toàn bộ lịch sử trước đó của quy trình làm việc trong quá trình lập luận.","jp":"各ステップで利用可能なすべてのコンテンツを使用してコンテキストを拡張し、各ステップが推論中にワークフローの以前の履歴全体にアクセスできるようにします。"}},{"k":"B","t":{"en":"Using a single global prompt that applies to every step in the workflow no matter what each step is reasoning about during its run.","vi":"Sử dụng một lời nhắc chung duy nhất áp dụng cho mọi bước trong quy trình làm việc bất kể lý do của mỗi bước trong quá trình chạy là gì.","jp":"実行中の各ステップの推論に関係なく、ワークフローのすべてのステップに適用される単一のグローバル プロンプトを使用します。"}},{"k":"C","t":{"en":"Context isolation through subagents or multi-step agentic workflows that scope each step's context to only what the step needs.","vi":"Cách ly bối cảnh thông qua các tác nhân phụ hoặc quy trình làm việc tác nhân nhiều bước giúp xác định phạm vi bối cảnh của từng bước theo những gì bước đó cần.","jp":"サブエージェントまたは複数ステップのエージェントワークフローによるコンテキストの分離。各ステップのコンテキストの範囲をステップに必要なもののみに限定します。"}},{"k":"D","t":{"en":"Embedding the full prior history in each step regardless of whether the step needs the prior history for its reasoning.","vi":"Nhúng toàn bộ lịch sử trước đó vào mỗi bước bất kể bước đó có cần lịch sử trước đó để lập luận hay không.","jp":"ステップの推論に以前の履歴が必要かどうかに関係なく、各ステップに完全な以前の履歴を埋め込みます。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Yêu cầu là một số bước phải lập luận <b>không thấy toàn bộ lịch sử trước đó</b> — đó chính là <b>context isolation</b>. Dùng subagent (mỗi subagent có context riêng, chỉ nhận những gì được truyền tường minh trong prompt) hoặc workflow agentic nhiều bước trong đó mỗi bước chỉ nhận <b>đúng phần context nó cần</b>. Cách này vừa tránh nhiễu và thiên lệch từ lịch sử không liên quan, vừa giữ context của từng bước gọn và tập trung.","elim":["<b>A.</b> Đưa toàn bộ nội dung vào mọi bước là ngược lại với cô lập context mà đề yêu cầu, và làm context phình to, nhiễu.","<b>B.</b> Một prompt toàn cục cho mọi bước không cung cấp cơ chế giới hạn context theo bước; mọi bước vẫn chia sẻ cùng ngữ cảnh.","<b>D.</b> Nhúng toàn bộ lịch sử vào mỗi bước bất kể nhu cầu chính là điều đề muốn tránh với các bước phải lập luận độc lập."]},"cite":"Hướng dẫn ôn tập — §11.5 Ủy quyền cho Subagent để Bảo vệ Context; Lĩnh vực 1.3"},{"id":"ccdvf-q009","n":9,"topic":1,"type":"mcq","stem":{"en":"You are building an MCP server that exposes several internal data sources as MCP resources. The server needs to be deployed so multiple Claude applications can integrate with it. How would you approach the build and deployment?","vi":"Bạn đang xây dựng một máy chủ MCP hiển thị một số nguồn dữ liệu nội bộ dưới dạng tài nguyên MCP. Máy chủ cần được triển khai để nhiều ứng dụng Claude có thể tích hợp với nó. Bạn sẽ tiếp cận việc xây dựng và triển khai như thế nào?","jp":"いくつかの内部データ ソースを MCP リソースとして公開する MCP サーバーを構築しています。複数の Claude アプリケーションをサーバーと統合できるように、サーバーをデプロイする必要があります。構築と展開にはどのように取り組みますか?"},"options":[{"k":"A","t":{"en":"Author the server with clearly defined resources, tools, and prompts, choose a communication pattern, and deploy to an accessible hosting environment.","vi":"Tạo máy chủ bằng các tài nguyên, công cụ và lời nhắc được xác định rõ ràng, chọn kiểu giao tiếp và triển khai lên môi trường lưu trữ có thể truy cập được.","jp":"明確に定義されたリソース、ツール、プロンプトを使用してサーバーを作成し、通信パターンを選択して、アクセス可能なホスティング環境に展開します。"}},{"k":"B","t":{"en":"Build the MCP server with resource and tool definitions scoped to the first Claude application that needs it, and extend the definitions to additional applications as each integration is requested.","vi":"Xây dựng máy chủ MCP với các định nghĩa về tài nguyên và công cụ dành cho ứng dụng Claude đầu tiên cần đến nó, đồng thời mở rộng các định nghĩa cho các ứng dụng bổ sung khi mỗi lần tích hợp được yêu cầu.","jp":"MCP サーバーを必要とする最初の Claude アプリケーションをスコープとするリソースおよびツール定義を使用して MCP サーバーを構築し、統合が要求されるたびにその定義を追加のアプリケーションに拡張します。"}},{"k":"C","t":{"en":"Deploy the MCP server only on individual developer machines, with the Claude applications unable to reach the server outside each developer's machine.","vi":"Chỉ triển khai máy chủ MCP trên các máy của nhà phát triển riêng lẻ, với các ứng dụng Claude không thể truy cập máy chủ bên ngoài máy của mỗi nhà phát triển.","jp":"MCP サーバーは個々の開発者のマシンにのみ展開し、クロード アプリケーションは各開発者のマシンの外にあるサーバーにアクセスできません。"}},{"k":"D","t":{"en":"Bypass the MCP server and embed each data source directly in every Claude application that needs the data, with each application maintaining its own integration.","vi":"Bỏ qua máy chủ MCP và nhúng trực tiếp từng nguồn dữ liệu vào mọi ứng dụng Claude cần dữ liệu, trong đó mỗi ứng dụng duy trì sự tích hợp riêng.","jp":"MCP サーバーをバイパスし、データを必要とするすべての Claude アプリケーションに各データ ソースを直接埋め込み、各アプリケーションが独自の統合を維持します。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Một MCP server dùng chung cho nhiều ứng dụng Claude cần được thiết kế theo <b>giao thức chuẩn</b>: định nghĩa rõ ràng các <b>resources, tools và prompts</b> mà nó cung cấp, chọn cơ chế giao tiếp/transport phù hợp (ví dụ stdio cho cục bộ, HTTP có thể streaming cho server từ xa), rồi triển khai lên <b>môi trường hosting mà các client truy cập được</b>. Nhờ chuẩn MCP, bất kỳ client tương thích nào cũng tích hợp được mà không cần code tích hợp riêng cho từng ứng dụng.","elim":["<b>B.</b> Gắn định nghĩa với ứng dụng đầu tiên rồi mở rộng dần làm mất tính tổng quát của server dùng chung, dễ phải thiết kế lại và phá vỡ client hiện có.","<b>C.</b> Chỉ chạy trên máy từng developer thì các ứng dụng khác không truy cập được, trái với yêu cầu nhiều ứng dụng cùng tích hợp.","<b>D.</b> Nhúng trực tiếp từng nguồn dữ liệu vào mỗi ứng dụng tạo tích hợp trùng lặp N×M — chính vấn đề mà MCP được tạo ra để giải quyết."]},"cite":"Hướng dẫn ôn tập — §4.2 MCP Server; Lĩnh vực 2.4"},{"id":"ccdvf-q010","n":10,"topic":1,"type":"mcq","stem":{"en":"Your Claude agent's hooks are currently triggered for every action, which slows down the agent significantly even when actions pose no risk. The team wants to scope hooks more carefully. How would you scope the hooks?","vi":"Các móc của đặc vụ Claude của bạn hiện được kích hoạt cho mọi hành động, điều này làm chậm đặc vụ đáng kể ngay cả khi các hành động không gây rủi ro. Nhóm muốn xác định phạm vi hook cẩn thận hơn. Bạn sẽ xác định phạm vi của các móc như thế nào?","jp":"現在、Claude エージェントのフックはアクションごとにトリガーされるため、アクションにリスクがない場合でもエージェントの速度が大幅に低下します。チームはフックをより注意深く調査したいと考えています。フックのスコープをどのように設定しますか?"},"options":[{"k":"A","t":{"en":"Scope hooks to only the high-risk actions, such as destructive operations or sensitive data access, and remove hooks from low-risk actions to balance safety with performance.","vi":"Phạm vi chỉ liên kết với các hành động có rủi ro cao, chẳng hạn như các hoạt động phá hoại hoặc truy cập dữ liệu nhạy cảm, đồng thời loại bỏ các liên kết khỏi các hành động có rủi ro thấp để cân bằng giữa an toàn và hiệu suất.","jp":"フックの範囲を破壊的な操作や機密データへのアクセスなどの高リスクのアクションのみに設定し、低リスクのアクションからフックを削除して、安全性とパフォーマンスのバランスをとります。"}},{"k":"B","t":{"en":"Disable all hooks while the team re-scopes them, treating the period of no hook enforcement as a temporary state during the re-scoping work.","vi":"Vô hiệu hóa tất cả các hook trong khi nhóm xác định lại phạm vi của chúng, coi khoảng thời gian không thực thi hook là trạng thái tạm thời trong quá trình xác định lại phạm vi.","jp":"チームがスコープを再設定している間はすべてのフックを無効にし、フックが適用されない期間を再スコープ作業中の一時的な状態として扱います。"}},{"k":"C","t":{"en":"Disable the agent during peak hours so the hook overhead does not slow the application down during the busiest periods of the day across the application's operation.","vi":"Vô hiệu hóa tác nhân trong giờ cao điểm để chi phí hook không làm chậm ứng dụng trong những khoảng thời gian bận rộn nhất trong ngày trong quá trình hoạt động của ứng dụng.","jp":"アプリケーションの動作全体で 1 日の最も忙しい時間帯にフックのオーバーヘッドによってアプリケーションの速度が低下しないように、ピーク時間中にエージェントを無効にします。"}},{"k":"D","t":{"en":"Replace hooks with system prompt instructions on the grounds that prompt instructions can produce the same enforcement effect that hooks produce on the agent's actions.","vi":"Thay thế hook bằng hướng dẫn nhắc nhở của hệ thống với lý do hướng dẫn nhắc nhở có thể tạo ra tác dụng thực thi tương tự như hook tạo ra đối với hành động của tác nhân.","jp":"プロンプト命令は、フックがエージェントのアクションに対して生み出すのと同じ強制効果を生み出す可能性があるため、フックをシステム プロンプト命令に置き換えます。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Hook đem lại <b>kiểm soát deterministic</b> nhưng có chi phí hiệu năng, nên nên áp dụng <b>theo mức rủi ro</b>: giữ hook cho các hành động có hậu quả lớn như thao tác phá hủy dữ liệu hay truy cập dữ liệu nhạy cảm, và bỏ hook khỏi các hành động rủi ro thấp. Thực tế hook có thể được giới hạn phạm vi bằng matcher theo tên tool (ví dụ <code>PreToolUse</code> chỉ cho tool ghi/xóa), vừa giữ an toàn vừa loại bỏ overhead không cần thiết.","elim":["<b>B.</b> Tắt toàn bộ hook trong lúc re-scope để agent chạy không có lớp bảo vệ nào cho cả các thao tác nguy hiểm — rủi ro không cần thiết.","<b>C.</b> Tắt agent vào giờ cao điểm làm mất khả năng phục vụ đúng lúc cần nhất và không giải quyết việc hook được áp dụng quá rộng.","<b>D.</b> Chỉ dẫn trong prompt chỉ có tính xác suất, không thể thay thế sự đảm bảo deterministic của hook cho các hành động rủi ro cao."]},"cite":"Hướng dẫn ôn tập — §3.5 Hooks trong Agent SDK; Lĩnh vực 1.5"},{"id":"ccdvf-q011","n":11,"topic":1,"type":"mcq","stem":{"en":"A teammate has submitted a pull request that adds a Claude-powered feature to your service. The code works, but the prompt and model selection are hard-coded inline, error handling is missing, and there are no tests for the integration. What would you request during code review?","vi":"Một đồng đội đã gửi yêu cầu kéo để bổ sung tính năng do Claude cung cấp cho dịch vụ của bạn. Mã hoạt động nhưng lời nhắc và lựa chọn mô hình được mã hóa nội tuyến cứng, thiếu xử lý lỗi và không có thử nghiệm tích hợp. Bạn sẽ yêu cầu gì trong quá trình xem xét mã?","jp":"チームメイトが、Claude を利用した機能をサービスに追加するプル リクエストを送信しました。コードは機能しますが、プロンプトとモデルの選択はインラインでハードコーディングされており、エラー処理が欠落しており、統合のテストはありません。コードレビュー中に何を要求しますか?"},"options":[{"k":"A","t":{"en":"Approve the pull request and add the missing pieces yourself in a follow-up commit so the teammate can move on to other work immediately.","vi":"Phê duyệt yêu cầu kéo và tự mình thêm các phần còn thiếu vào cam kết tiếp theo để đồng đội có thể chuyển sang công việc khác ngay lập tức.","jp":"プル リクエストを承認し、不足している部分をフォローアップ コミットに自分で追加して、チームメイトがすぐに他の作業に移れるようにします。"}},{"k":"B","t":{"en":"Approve the pull request as-is, on the grounds that the feature works in the happy path and the missing pieces can be added in follow-up commits.","vi":"Phê duyệt yêu cầu kéo nguyên trạng, với lý do tính năng này hoạt động theo lộ trình phù hợp và những phần còn thiếu có thể được thêm vào trong các cam kết tiếp theo.","jp":"機能が正常に動作し、不足している部分はフォローアップ コミットで追加できるという理由で、プル リクエストをそのまま承認します。"}},{"k":"C","t":{"en":"Request changes that move prompt and model configuration to a configurable location and add tests, treating the missing error handling as a follow-up release item.","vi":"Yêu cầu thay đổi để di chuyển cấu hình mô hình và lời nhắc đến một vị trí có thể định cấu hình, đồng thời thêm các thử nghiệm, xử lý việc xử lý lỗi bị thiếu như một mục phát hành tiếp theo.","jp":"プロンプトとモデルの構成を構成可能な場所に移動し、欠落しているエラー処理をフォローアップ リリース項目として扱うテストを追加する変更を要求します。"}},{"k":"D","t":{"en":"Request changes that move prompt and model configuration to a configurable location, add error handling for Claude API failures, and add tests for the integration.","vi":"Yêu cầu thay đổi để di chuyển cấu hình mô hình và lời nhắc đến vị trí có thể định cấu hình, thêm xử lý lỗi đối với các lỗi API Claude và thêm các thử nghiệm để tích hợp.","jp":"プロンプトとモデルの構成を構成可能な場所に移動し、Claude API エラーのエラー処理を追加し、統合のテストを追加する変更をリクエストします。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Code review cho tích hợp Claude nên yêu cầu đủ ba điểm sẵn sàng production: đưa <b>prompt và lựa chọn model ra cấu hình</b> (dễ đổi version, A/B test, không phải sửa code), thêm <b>xử lý lỗi cho các lỗi Claude API</b> (rate limit 429, overloaded/5xx, timeout — retry có backoff hoặc fallback), và <b>test cho phần tích hợp</b>. “Chạy được ở happy path” chưa đủ; thiếu xử lý lỗi là rủi ro trực tiếp trong production vì API bên ngoài chắc chắn sẽ có lúc lỗi.","elim":["<b>A.</b> Tự sửa thay đồng nghiệp bỏ qua mục đích của review và chia sẻ kiến thức; vấn đề cũng vẫn được merge vào trước khi sửa.","<b>B.</b> Approve nguyên trạng đưa code thiếu xử lý lỗi và test vào nhánh chính; các “follow-up” thường không được làm.","<b>C.</b> Đúng phần cấu hình và test nhưng hoãn xử lý lỗi — chính phần quan trọng nhất cho độ tin cậy, vì lỗi API sẽ làm hỏng tính năng ngay trong production."]}},{"id":"ccdvf-q012","n":12,"topic":1,"type":"mcq","stem":{"en":"Your Claude application receives untrusted input from external sources. The team is establishing how the application should treat this untrusted input. Untrusted input would be...","vi":"Ứng dụng Claude của bạn nhận được thông tin đầu vào không đáng tin cậy từ các nguồn bên ngoài. Nhóm đang thiết lập cách ứng dụng xử lý thông tin đầu vào không đáng tin cậy này. Đầu vào không đáng tin cậy sẽ là...","jp":"Claude アプリケーションは外部ソースから信頼できない入力を受け取ります。チームは、アプリケーションがこの信頼できない入力をどのように扱うべきかを確立中です。信頼できない入力は次のとおりです..."},"options":[{"k":"A","t":{"en":"Validated and sanitized before being incorporated into prompts, and treated as data the model should not interpret as instructions.","vi":"Được xác thực và khử trùng trước khi được đưa vào lời nhắc và được coi là dữ liệu mà mô hình không được hiểu là hướng dẫn.","jp":"プロンプトに組み込まれる前に検証およびサニタイズされ、モデルが指示として解釈すべきではないデータとして扱われます。"}},{"k":"B","t":{"en":"Treated identically to trusted input from internal sources, on the grounds that all input the application receives can be handled the same way.","vi":"Được xử lý giống hệt với đầu vào đáng tin cậy từ các nguồn nội bộ, trên cơ sở tất cả đầu vào mà ứng dụng nhận được đều có thể được xử lý theo cùng một cách.","jp":"アプリケーションが受け取るすべての入力は同じ方法で処理できるため、内部ソースからの信頼できる入力と同様に扱われます。"}},{"k":"C","t":{"en":"Routed through a separate Claude application with more lax security controls so the original application does not handle the untrusted input directly.","vi":"Được định tuyến thông qua một ứng dụng Claude riêng biệt với các biện pháp kiểm soát bảo mật lỏng lẻo hơn nên ứng dụng gốc không xử lý trực tiếp dữ liệu đầu vào không đáng tin cậy.","jp":"元のアプリケーションが信頼できない入力を直接処理しないように、より緩いセキュリティ制御を備えた別の Claude アプリケーションを通じてルーティングされます。"}},{"k":"D","t":{"en":"Blocked entirely so the application accepts only trusted input, with no path for legitimate external input the application might process.","vi":"Bị chặn hoàn toàn nên ứng dụng chỉ chấp nhận đầu vào đáng tin cậy, không có đường dẫn cho đầu vào bên ngoài hợp pháp mà ứng dụng có thể xử lý.","jp":"完全にブロックされているため、アプリケーションは信頼できる入力のみを受け入れ、アプリケーションが処理する可能性のある正当な外部入力へのパスはありません。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Input không tin cậy (email, trang web, tài liệu người dùng tải lên...) là kênh chính cho <b>prompt injection</b>. Nguyên tắc là <b>validate và sanitize trước khi đưa vào prompt</b>, đồng thời coi nó là <b>dữ liệu, không phải chỉ dẫn</b>: tách bạch rõ bằng delimiter/thẻ XML và dặn model không làm theo lệnh nằm trong phần dữ liệu đó. Cách này vẫn cho phép xử lý input bên ngoài hợp lệ mà giảm rủi ro model bị điều khiển.","elim":["<b>B.</b> Đối xử giống input nội bộ đáng tin là bỏ qua hoàn toàn rủi ro prompt injection và dữ liệu độc hại từ nguồn bên ngoài.","<b>C.</b> Chuyển sang một ứng dụng có kiểm soát bảo mật lỏng hơn làm tăng chứ không giảm rủi ro; input độc hại vẫn được xử lý, chỉ là ở nơi kém an toàn hơn.","<b>D.</b> Chặn hoàn toàn input bên ngoài làm ứng dụng mất chức năng với các input hợp lệ mà nó được thiết kế để xử lý."]}},{"id":"ccdvf-q013","n":13,"topic":1,"type":"mcq","stem":{"en":"A teammate has asked you to explain when a Skill would be the right choice over an MCP server. The teammate is unsure how the two differ in practice when both can be reused across teams. How would you explain the distinction?","vi":"Một đồng đội đã yêu cầu bạn giải thích khi nào Kỹ năng sẽ là lựa chọn phù hợp trên máy chủ MCP. Đồng đội không chắc cả hai khác nhau như thế nào trong thực tế khi cả hai đều có thể được sử dụng lại giữa các đội. Bạn sẽ giải thích sự khác biệt như thế nào?","jp":"チームメイトがあなたに、MCP サーバーよりもスキルが適切な選択となる場合について説明してほしいと依頼しました。チームメイトは、両方をチーム間で再利用できる場合、実際に 2 つがどのように異なるのかわかりません。この違いをどう説明しますか？"},"options":[{"k":"A","t":{"en":"A Skill and an MCP server are equivalent extension mechanisms that the team can use interchangeably for any reusable capability that needs to be accessible across teams.","vi":"Kỹ năng và máy chủ MCP là các cơ chế mở rộng tương đương mà nhóm có thể sử dụng thay thế cho nhau cho bất kỳ khả năng tái sử dụng nào mà các nhóm cần có thể truy cập được.","jp":"スキルと MCP サーバーは同等の拡張メカニズムであり、チーム間でアクセスできる必要がある再利用可能な機能に対してチームが互換的に使用できます。"}},{"k":"B","t":{"en":"A Skill is the older mechanism and an MCP server is the newer one, so the team should prefer an MCP server for any reusable capability that the team builds going forward.","vi":"Kỹ năng là cơ chế cũ hơn và máy chủ MCP là cơ chế mới hơn, vì vậy nhóm nên ưu tiên máy chủ MCP vì bất kỳ khả năng tái sử dụng nào mà nhóm xây dựng trong tương lai.","jp":"スキルは古いメカニズムであり、MCP サーバーは新しいメカニズムであるため、チームが今後構築する再利用可能な機能には MCP サーバーを優先する必要があります。"}},{"k":"C","t":{"en":"A Skill is preferable for cross-team reuse because it loads more efficiently than an MCP server during normal operation in the team's typical multi-team workloads.","vi":"Kỹ năng thích hợp hơn để tái sử dụng giữa các nhóm vì nó tải hiệu quả hơn máy chủ MCP trong quá trình hoạt động bình thường trong khối lượng công việc nhiều nhóm thông thường của nhóm.","jp":"スキルは、チームの一般的なマルチチーム ワークロードでの通常の運用中に MCP サーバーよりも効率的にロードされるため、チーム間での再利用に適しています。"}},{"k":"D","t":{"en":"A Skill bundles prompts, scripts, and data into a package the model loads as a unit while an MCP server exposes resources, tools, and prompts through a standard client interface.","vi":"Kỹ năng gói các lời nhắc, tập lệnh và dữ liệu vào một gói mà mô hình tải dưới dạng một đơn vị trong khi máy chủ MCP hiển thị các tài nguyên, công cụ và lời nhắc thông qua giao diện máy khách tiêu chuẩn.","jp":"スキルはプロンプト、スクリプト、およびデータをパッケージにバンドルし、モデルはユニットとしてロードします。一方、MCP サーバーは標準のクライアント インターフェイスを通じてリソース、ツール、およびプロンプトを公開します。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Hai cơ chế khác nhau về bản chất: <b>Skill</b> là một gói (thư mục có <code>SKILL.md</code> cùng script, dữ liệu, tài nguyên) đóng gói <b>quy trình và tri thức</b> mà model nạp khi tác vụ liên quan — phù hợp khi cần dạy Claude <i>cách làm</i> một việc. <b>MCP server</b> là dịch vụ theo <b>giao thức chuẩn</b> cung cấp resources, tools và prompts cho bất kỳ client MCP nào — phù hợp khi cần <i>kết nối</i> tới hệ thống, dữ liệu hay API bên ngoài. Cả hai đều tái sử dụng được giữa các nhóm, nhưng chọn theo việc cần đóng gói chuyên môn hay cần một interface tới hệ thống.","elim":["<b>A.</b> Hai cơ chế không tương đương: Skill đóng gói hướng dẫn/quy trình cho model, MCP cung cấp kết nối tới hệ thống ngoài qua giao thức client–server.","<b>B.</b> Không có quan hệ “cũ – mới” thay thế nhau; chúng giải quyết các vấn đề khác nhau và thường được dùng bổ sung cho nhau.","<b>C.</b> Hiệu năng nạp không phải tiêu chí phân biệt chính, và nhận định chung chung này bỏ qua khác biệt thực chất về mục đích của từng cơ chế."]},"cite":"Hướng dẫn ôn tập — §5.5 Skill — .claude/skills/; §4.1 MCP là gì"},{"id":"ccdvf-q014","n":14,"topic":1,"type":"mcq","stem":{"en":"Your Claude application runs long agentic workflows where the agent makes many tool calls, and the conversation history grows quickly. After about 20 tool calls, you notice the agent's responses become less focused and sometimes ignore earlier task constraints. How would you address this?","vi":"Ứng dụng Claude của bạn chạy các quy trình làm việc tổng đài dài, trong đó tổng đài viên thực hiện nhiều lệnh gọi công cụ và lịch sử hội thoại tăng lên nhanh chóng. Sau khoảng 20 lệnh gọi công cụ, bạn nhận thấy phản hồi của nhân viên trở nên kém tập trung hơn và đôi khi bỏ qua các ràng buộc nhiệm vụ trước đó. Bạn sẽ giải quyết vấn đề này như thế nào?","jp":"Claude アプリケーションは、エージェントが多数のツール呼び出しを行う長いエージェント ワークフローを実行し、会話履歴が急速に増加します。ツールを約 20 回呼び出した後、エージェントの応答の焦点が薄れ、以前のタスクの制約が無視される場合があることに気付きます。これについてはどう対処しますか?"},"options":[{"k":"A","t":{"en":"Remove tool calling from the workflow entirely so the agent operates as a single textgeneration step with no tool outputs accumulating in the context window.","vi":"Loại bỏ hoàn toàn lệnh gọi công cụ khỏi quy trình làm việc để tác nhân hoạt động như một bước tạo văn bản duy nhất mà không có đầu ra công cụ nào tích lũy trong cửa sổ ngữ cảnh.","jp":"ワークフローからツール呼び出しを完全に削除することで、エージェントは単一のテキスト生成ステップとして動作し、コンテキスト ウィンドウにツール出力が蓄積されることはありません。"}},{"k":"B","t":{"en":"Apply context engineering techniques such as tool output pruning or compaction to keep the active task state visible while reducing the volume of older content.","vi":"Áp dụng các kỹ thuật kỹ thuật ngữ cảnh như cắt bớt hoặc nén đầu ra của công cụ để giữ cho trạng thái tác vụ đang hoạt động hiển thị đồng thời giảm khối lượng nội dung cũ hơn.","jp":"ツール出力のプルーニングや圧縮などのコンテキスト エンジニアリング手法を適用して、古いコンテンツの量を減らしながら、アクティブなタスクの状態を表示し続けます。"}},{"k":"C","t":{"en":"Increase the model's context window so the agent can hold every tool output at full detail across the entire workflow no matter how many tool calls it accumulates.","vi":"Tăng cửa sổ ngữ cảnh của mô hình để tác nhân có thể giữ mọi đầu ra công cụ với đầy đủ chi tiết trong toàn bộ quy trình làm việc bất kể nó tích lũy bao nhiêu lệnh gọi công cụ.","jp":"モデルのコンテキスト ウィンドウを増やすと、ツール呼び出しが何回蓄積されても、エージェントがワークフロー全体にわたってすべてのツール出力を詳細に保持できるようになります。"}},{"k":"D","t":{"en":"Restart the agent every five tool calls to prevent any drift, with the agent losing all task state at each restart point during the workflow.","vi":"Khởi động lại tổng đài viên sau mỗi năm lệnh gọi công cụ để ngăn chặn bất kỳ sự sai lệch nào, trong đó tổng đài viên sẽ mất tất cả trạng thái nhiệm vụ tại mỗi điểm khởi động lại trong quy trình làm việc.","jp":"ドリフトを防ぐために、5 回のツール呼び出しごとにエージェントを再起動します。ワークフロー中の各再起動ポイントでエージェントはすべてのタスク状態を失います。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Sau nhiều tool call, context bị lấp đầy bởi output cũ, khiến các ràng buộc ban đầu bị “chìm” và model kém tập trung. <b>Context engineering</b> giải quyết đúng chỗ: <b>cắt gọn (prune) tool output</b> không còn cần, chỉ giữ trường liên quan, hoặc <b>compaction</b> — tóm tắt phần lịch sử cũ — trong khi giữ <b>trạng thái tác vụ và các ràng buộc</b> hiển thị rõ (ví dụ một khối facts/constraints cố định). Agent vẫn tiếp tục được mà không mất trạng thái.","elim":["<b>A.</b> Bỏ tool calling khiến agent không còn làm được các tác vụ agentic cần thiết; đây là phá bỏ chức năng chứ không phải quản lý context.","<b>C.</b> Context lớn hơn không giải quyết việc chú ý bị loãng; giữ mọi output đầy đủ chi tiết vẫn khiến ràng buộc sớm bị chìm giữa khối nội dung dài.","<b>D.</b> Khởi động lại mỗi năm tool call làm mất toàn bộ trạng thái tác vụ, khiến agent làm lại việc và không hoàn thành được workflow dài."]},"cite":"Hướng dẫn ôn tập — §11.2 Cắt gọn Kết quả Tool; Lĩnh vực 5.1"},{"id":"ccdvf-q015","n":15,"topic":1,"type":"mcq","stem":{"en":"Your team is preparing to roll out a configuration change that updates several prompt versions across a Claude application used by multiple downstream systems. The change has already been tested in staging, but the team has not assessed how the prompt change will affect each downstream system that depends on the application's output. What would you do before rolling out the change?","vi":"Nhóm của bạn đang chuẩn bị triển khai thay đổi cấu hình nhằm cập nhật một số phiên bản nhanh chóng trên ứng dụng Claude được nhiều hệ thống hạ nguồn sử dụng. Thay đổi này đã được thử nghiệm trong giai đoạn thử nghiệm, nhưng nhóm chưa đánh giá được thay đổi kịp thời sẽ ảnh hưởng như thế nào đến từng hệ thống hạ nguồn phụ thuộc vào đầu ra của ứng dụng. Bạn sẽ làm gì trước khi triển khai thay đ
