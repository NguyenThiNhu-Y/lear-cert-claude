ットできるようにします。"}},{"k":"C","t":{"en":"Use the SDK's tool interface and loop, with conversation history stored in a separate team database.","vi":"Sử dụng vòng lặp và giao diện công cụ của SDK, với lịch sử hội thoại được lưu trữ trong cơ sở dữ liệu nhóm riêng biệt.","jp":"SDK のツール インターフェイスとループを使用し、会話履歴を別のチーム データベースに保存します。"}},{"k":"D","t":{"en":"Use the SDK's tool interface and write the loop and history layer in the team's own code.","vi":"Sử dụng giao diện công cụ của SDK và viết lớp vòng lặp và lịch sử bằng mã riêng của nhóm.","jp":"SDK のツール インターフェイスを使用し、チーム独自のコードでループと履歴レイヤーを記述します。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Lý do chọn <b>Claude Agent SDK</b> thay vì tự viết là để SDK lo <b>agentic loop</b>: gửi request, nhận <code>tool_use</code>, <b>dispatch tool</b>, đưa <code>tool_result</code> trở lại, quản lý <b>lịch sử hội thoại/session</b> và dừng khi xong. Nhóm chỉ cần định nghĩa tool (API nội bộ, database) qua <b>giao diện tool của SDK</b>, nhận được hành vi có cấu trúc, lặp lại được mà không phải duy trì vòng lặp riêng.","elim":["<b>B.</b> Gọi Messages API trực tiếp và để model viết lời gọi tool bằng văn bản thường là bỏ qua cả SDK lẫn cơ chế tool use có cấu trúc, dẫn đến phải tự parse một cách mong manh; trái với quyết định dùng SDK.","<b>C.</b> Tự lưu lịch sử vào database riêng nhân đôi việc SDK đã quản lý (session, resume), dễ lệch trạng thái giữa hai nơi.","<b>D.</b> Tự viết vòng lặp và lớp lịch sử chính là việc «xây custom loop» mà nhóm đã quyết định tránh."]},"cite":"Hướng dẫn ôn tập — §3.1 Agentic Loop là gì; Lĩnh vực 1.1"},{"id":"ccdvf-q062","n":62,"topic":1,"type":"mcq","stem":{"en":"Your agent makes 10 to 15 tool calls per task, and you have noticed it sometimes loses track of earlier results by the time it reaches later steps. The agent's context window is large enough to hold all the messages, but the relevant information appears to get buried as the conversation grows. How would you address this?","vi":"Nhân viên hỗ trợ của bạn thực hiện 10 đến 15 cuộc gọi công cụ cho mỗi nhiệm vụ và bạn nhận thấy đôi khi nhân viên đó mất dấu các kết quả trước đó khi thực hiện các bước sau. Cửa sổ ngữ cảnh của tổng đài viên đủ lớn để chứa tất cả tin nhắn, nhưng thông tin liên quan dường như bị chôn vùi khi cuộc trò chuyện ngày càng phát triển. Bạn sẽ giải quyết vấn đề này như thế nào?","jp":"エージェントはタスクごとに 10 ～ 15 回のツール呼び出しを行いますが、後のステップに到達するまでに以前の結果を追跡できなくなる場合があることに気づきました。エージェントのコンテキスト ウィンドウはすべてのメッセージを保持するのに十分な大きさですが、会話が大きくなるにつれて関連情報が埋もれてしまうようです。これについてはどう対処しますか?"},"options":[{"k":"A","t":{"en":"Switch to a different agentic framework that advertises automatic context-window management as a built-in feature.","vi":"Chuyển sang một khung tác nhân khác quảng cáo tính năng quản lý cửa sổ ngữ cảnh tự động như một tính năng tích hợp sẵn.","jp":"自動コンテキスト ウィンドウ管理を組み込み機能としてアドバタイズする別のエージェント フレームワークに切り替えます。"}},{"k":"B","t":{"en":"Reduce the number of tool calls per task by combining several existing tools into larger, multi-purpose tools.","vi":"Giảm số lượng lệnh gọi công cụ cho mỗi tác vụ bằng cách kết hợp một số công cụ hiện có thành các công cụ đa năng, lớn hơn.","jp":"いくつかの既存のツールをより大きな多目的ツールに統合することで、タスクごとのツール呼び出しの数を削減します。"}},{"k":"C","t":{"en":"Increase the context window further so all tool outputs from every prior step remain in full detail throughout the task.","vi":"Tăng cửa sổ ngữ cảnh hơn nữa để tất cả kết quả đầu ra của công cụ từ mỗi bước trước đó vẫn đầy đủ chi tiết trong suốt tác vụ.","jp":"コンテキスト ウィンドウをさらに拡大して、前のすべてのステップからのすべてのツール出力がタスク全体にわたって詳細に表示されるようにします。"}},{"k":"D","t":{"en":"Apply a context-management pattern that summarizes or prunes older tool outputs while preserving the active task state.","vi":"Áp dụng mẫu quản lý ngữ cảnh để tóm tắt hoặc cắt bớt các đầu ra của công cụ cũ hơn trong khi vẫn duy trì trạng thái tác vụ hiện hoạt.","jp":"アクティブなタスクの状態を維持しながら、古いツールの出力を要約または削除するコンテキスト管理パターンを適用します。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Context đủ chỗ nhưng thông tin quan trọng bị <b>chìm giữa lượng lớn kết quả tool</b>, nên vấn đề là chất lượng context chứ không phải dung lượng. Cần một <b>mẫu quản lý context</b>: <b>tóm tắt hoặc cắt bớt các tool output cũ</b> (chỉ giữ trường liên quan) trong khi <b>giữ nguyên trạng thái tác vụ đang hoạt động</b> (mục tiêu, các phát hiện then chốt, bước tiếp theo), ví dụ trong một block hoặc scratchpad có cấu trúc.","elim":["<b>A.</b> Đổi framework chỉ vì quảng cáo tính năng quản lý context là giải pháp tốn kém, không chắc đúng nhu cầu và có thể áp dụng ngay pattern tương tự trong hệ thống hiện tại.","<b>B.</b> Gộp tool thành tool lớn đa năng làm mô tả tool mơ hồ hơn, và mỗi lời gọi trả về nhiều dữ liệu hơn nên lượng output trong context không giảm.","<b>C.</b> Đề đã nói context đủ lớn; tăng thêm chỉ giữ nhiều nội dung hơn, càng làm thông tin quan trọng bị chìm."]},"cite":"Hướng dẫn ôn tập — §11.2 Cắt gọn Kết quả Tool; Lĩnh vực 5.1"},{"id":"ccdvf-q063","n":63,"topic":1,"type":"mcq","stem":{"en":"A teammate has asked how the Claude SDK handles transient API errors, such as a temporary network issue or a brief rate-limit response. They want to know whether the application code needs to handle every transient error or whether the SDK provides any default behavior. How would you describe the SDK's default behavior?","vi":"Một đồng đội đã hỏi cách Claude SDK xử lý các lỗi API tạm thời, chẳng hạn như sự cố mạng tạm thời hoặc phản hồi giới hạn tốc độ ngắn. Họ muốn biết liệu mã ứng dụng có cần xử lý mọi lỗi nhất thời hay liệu SDK có cung cấp bất kỳ hành vi mặc định nào hay không. Bạn mô tả hành vi mặc định của SDK như thế nào?","jp":"チームメイトが、一時的なネットワークの問題や短いレート制限応答など、一時的な API エラーを Claude SDK がどのように処理するのかを尋ねました。彼らは、アプリケーション コードがすべての一時的なエラーを処理する必要があるかどうか、または SDK がデフォルトの動作を提供しているかどうかを知りたいと考えています。 SDK のデフォルトの動作をどのように説明しますか?"},"options":[{"k":"A","t":{"en":"The SDK provides default retry behavior for transient errors up to a fixed number of attempts, and this behavior is not configurable.","vi":"SDK cung cấp hành vi thử lại mặc định cho các lỗi tạm thời lên tới số lần thử cố định và hành vi này không thể định cấu hình được.","jp":"SDK では、一時的なエラーに対して固定試行回数までのデフォルトの再試行動作が提供されていますが、この動作は構成できません。"}},{"k":"B","t":{"en":"The SDK provides default retry behavior for network errors but surfaces rate-limit responses directly to the application code, which must implement its own retry logic for those cases.","vi":"SDK cung cấp hành vi thử lại mặc định cho các lỗi mạng nhưng hiển thị phản hồi giới hạn tốc độ trực tiếp cho mã ứng dụng, mã này phải triển khai logic thử lại của riêng mình cho những trường hợp đó.","jp":"SDK はネットワーク エラーに対するデフォルトの再試行動作を提供しますが、レート制限応答をアプリケーション コードに直接表示するため、アプリケーション コードはそのような場合に独自の再試行ロジックを実装する必要があります。"}},{"k":"C","t":{"en":"The SDK logs transient errors to a default error stream and continues execution without retrying, leaving the application code responsible for detecting and responding to failed calls.","vi":"SDK ghi lại các lỗi nhất thời vào luồng lỗi mặc định và tiếp tục thực thi mà không cần thử lại, để lại mã ứng dụng chịu trách nhiệm phát hiện và phản hồi các lệnh gọi không thành công.","jp":"SDK は一時的なエラーをデフォルトのエラー ストリームに記録し、再試行せずに実行を続行し、失敗した呼び出しの検出と応答はアプリケーション コードに任せます。"}},{"k":"D","t":{"en":"The SDK provides default retry behavior for many transient errors, and the application code can configure or extend that behavior as needed.","vi":"SDK cung cấp hành vi thử lại mặc định cho nhiều lỗi tạm thời và mã ứng dụng có thể định cấu hình hoặc mở rộng hành vi đó nếu cần.","jp":"SDK は、多くの一時的なエラーに対するデフォルトの再試行動作を提供し、アプリケーション コードは必要に応じてその動作を構成または拡張できます。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> SDK chính thức của Anthropic <b>mặc định tự retry nhiều loại lỗi tạm thời</b> (lỗi kết nối, 408, 409, <b>429 rate limit</b>, lỗi 5xx) với exponential backoff, mặc định 2 lần. Hành vi này <b>cấu hình được</b>, ví dụ qua <code>max_retries</code> ở client hoặc từng request, cùng với <code>timeout</code>; ứng dụng có thể mở rộng bằng logic riêng cho các lỗi còn lại sau khi hết số lần retry.","elim":["<b>A.</b> Sai ở chỗ cho rằng không cấu hình được; số lần retry chỉnh được qua <code>max_retries</code> (kể cả đặt 0 để tắt).","<b>B.</b> Sai: lỗi 429 rate limit cũng nằm trong nhóm được SDK retry mặc định, không bị đẩy thẳng lên ứng dụng ngay lần đầu.","<b>C.</b> Sai: SDK có retry mặc định, và khi thất bại cuối cùng thì ném exception chứ không chỉ log rồi tiếp tục chạy."]}},{"id":"ccdvf-q064","n":64,"topic":1,"type":"mcq","stem":{"en":"Your Claude application's outputs are inconsistent in format. The team's instructions are scattered across the system prompt and user messages, with some instructions stated only once and others repeated. How would you fix the inconsistency?","vi":"Kết quả đầu ra của ứng dụng Claude của bạn không nhất quán về định dạng. Hướng dẫn của nhóm nằm rải rác trên lời nhắc của hệ thống và thông báo của người dùng, với một số hướng dẫn chỉ được nêu một lần và những hướng dẫn khác được lặp lại. Bạn sẽ khắc phục sự không nhất quán như thế nào?","jp":"Claude アプリケーションの出力の形式が一貫していません。チームの指示はシステム プロンプトとユーザー メッセージに散在しており、一部の指示は 1 回だけ記載され、他の指示は繰り返し表示されます。この不一致をどのように修正しますか?"},"options":[{"k":"A","t":{"en":"Move all instructions into the user message so the application's behavior is controlled at the input point.","vi":"Di chuyển tất cả các hướng dẫn vào thông báo của người dùng để hành vi của ứng dụng được kiểm soát tại điểm đầu vào.","jp":"すべての命令をユーザー メッセージに移動して、アプリケーションの動作が入力ポイントで制御されるようにします。"}},{"k":"B","t":{"en":"Consolidate behavioral and format instructions in the system prompt and keep user messages focused on the user's input.","vi":"Hợp nhất các hướng dẫn về hành vi và định dạng trong lời nhắc của hệ thống và giữ cho thông báo của người dùng tập trung vào thông tin đầu vào của người dùng.","jp":"システム プロンプト内の動作およびフォーマットの指示を統合し、ユーザー メッセージをユーザーの入力に集中させます。"}},{"k":"C","t":{"en":"Place each instruction wherever the developer who first wrote it found most natural, retaining the original intent.","vi":"Đặt mỗi hướng dẫn ở bất cứ nơi nào mà nhà phát triển viết nó lần đầu tiên thấy tự nhiên nhất, giữ nguyên mục đích ban đầu.","jp":"各命令を最初に作成した開発者が最も自然だと判断した場所に、元の意図を維持したまま配置します。"}},{"k":"D","t":{"en":"Repeat all instructions in both the system prompt and the user message so the model sees each instruction more than once.","vi":"Lặp lại tất cả các hướng dẫn trong cả lời nhắc hệ thống và thông báo người dùng để mô hình nhìn thấy từng hướng dẫn nhiều lần.","jp":"システム プロンプトとユーザー メッセージの両方ですべての指示を繰り返し、モデルが各指示を複数回確認できるようにします。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> <b>System prompt</b> là nơi chuẩn để đặt <b>vai trò, chỉ dẫn hành vi và định dạng</b> áp dụng xuyên suốt cuộc hội thoại; <b>user message</b> nên tập trung vào <b>nội dung đầu vào của người dùng</b>. Gom chỉ dẫn về một nơi giúp loại bỏ mâu thuẫn và trùng lặp, cho mô hình một nguồn chỉ dẫn nhất quán, nhờ đó định dạng đầu ra ổn định hơn.","elim":["<b>A.</b> Dồn mọi chỉ dẫn vào user message khiến chúng phải lặp lại ở mỗi lượt, trộn lẫn với input của người dùng và dễ bị ghi đè hoặc lệch giữa các lượt.","<b>C.</b> Để chỉ dẫn nằm rải rác theo thói quen của từng người viết chính là nguyên nhân gây ra sự không nhất quán hiện tại.","<b>D.</b> Lặp lại mọi chỉ dẫn ở hai nơi làm tăng token, dễ tạo phiên bản mâu thuẫn khi một nơi được sửa mà nơi kia không, và không giải quyết việc tổ chức chỉ dẫn."]},"cite":"Hướng dẫn ôn tập — §1.4 System Prompt"},{"id":"ccdvf-q065","n":65,"topic":1,"type":"mcq","stem":{"en":"You are setting up a Claude application that will run a mix of multi-turn conversations and one-off requests. You want to use caching techniques to reduce token costs where they apply. A teammate suggests caching the model's output as well, so the application does not have to make duplicate Claude calls when similar queries arrive. You would apply prompt caching to...","vi":"Bạn đang thiết lập một ứng dụng Claude sẽ chạy kết hợp các cuộc hội thoại nhiều lượt và các yêu cầu một lần. Bạn muốn sử dụng các kỹ thuật lưu vào bộ nhớ đệm để giảm chi phí mã thông báo khi áp dụng. Một đồng đội cũng đề xuất lưu đầu ra của mô hình vào bộ nhớ đệm để ứng dụng không phải thực hiện các cuộc gọi Claude trùng lặp khi có các truy vấn tương tự. Bạn sẽ áp dụng bộ nhớ đệm nhanh chóng cho...","jp":"あなたは、複数ターンの会話と 1 回限りのリクエストを組み合わせて実行するクロード アプリケーションをセットアップしています。キャッシュ技術を使用して、適用されるトークンのコストを削減したいと考えています。チームメイトは、同様のクエリが到着したときにアプリケーションが重複して Claude 呼び出しを行う必要がないように、モデルの出力もキャッシュすることを提案しています。プロンプト キャッシュを適用すると..."},"options":[{"k":"A","t":{"en":"Nothing, because prompt caching does not affect cost in any application that mixes multiturn conversations and one-off requests in a single deployment.","vi":"Không có gì, vì bộ nhớ đệm nhanh chóng không ảnh hưởng đến chi phí trong bất kỳ ứng dụng nào kết hợp nhiều cuộc hội thoại và yêu cầu một lần trong một lần triển khai.","jp":"単一のデプロイメント内に複数ターンの会話と 1 回限りのリクエストが混在するアプリケーションでは、プロンプト キャッシュはコストに影響を与えないため、何もありません。"}},{"k":"B","t":{"en":"The model's output, treating the response from each request as cacheable content the application can return on similar future queries.","vi":"Đầu ra của mô hình, xử lý phản hồi từ mỗi yêu cầu dưới dạng nội dung có thể lưu vào bộ nhớ đệm mà ứng dụng có thể trả về cho các truy vấn tương tự trong tương lai.","jp":"各リクエストからの応答を、アプリケーションが将来の同様のクエリで返すことができるキャッシュ可能なコンテンツとして扱うモデルの出力。"}},{"k":"C","t":{"en":"Only the user's input portion of each request because user input is the part of the prompt that varies the most across the application's normal operation.","vi":"Chỉ phần đầu vào của người dùng trong mỗi yêu cầu vì đầu vào của người dùng là phần của lời nhắc thay đổi nhiều nhất trong quá trình hoạt động bình thường của ứng dụng.","jp":"ユーザー入力は、アプリケーションの通常の動作全体で最も変化するプロンプトの部分であるため、各リクエストのユーザー入力部分のみ。"}},{"k":"D","t":{"en":"The static portions of prompts that are repeated across requests, such as system prompts, instructions, or shared context.","vi":"Các phần tĩnh của lời nhắc được lặp lại trong các yêu cầu, chẳng hạn như lời nhắc hệ thống, hướng dẫn hoặc ngữ cảnh chung.","jp":"システム プロンプト、指示、共有コンテキストなど、リクエスト間で繰り返されるプロンプトの静的な部分。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> <b>Prompt caching</b> cache <b>phần tiền tố (prefix) tĩnh của prompt</b> được lặp lại giữa các request, như system prompt, chỉ dẫn, định nghĩa tool, tài liệu dùng chung, được đánh dấu bằng <code>cache_control</code>. Các request sau đọc lại phần đã cache với giá token rẻ hơn nhiều và độ trễ thấp hơn. Nó áp dụng tốt cho cả hội thoại nhiều lượt (lịch sử tăng dần) lẫn request đơn lẻ dùng chung prefix; còn <b>output của model không phải là thứ prompt caching lưu</b>.","elim":["<b>A.</b> Sai: prompt caching giảm chi phí cho mọi request chia sẻ cùng prefix, bất kể hệ thống kết hợp hội thoại nhiều lượt và request đơn lẻ.","<b>B.</b> Cache đầu ra để trả lời các truy vấn «tương tự» là response caching ở tầng ứng dụng, không phải prompt caching, và có rủi ro trả về câu trả lời sai cho câu hỏi khác.","<b>C.</b> Phần input người dùng là phần biến đổi nhiều nhất nên gần như không bao giờ trùng khớp cache; caching chỉ hiệu quả với prefix lặp lại y hệt."]}},{"id":"ccdvf-q066","n":66,"topic":1,"type":"mcq","stem":{"en":"You are writing a system prompt for a Claude application that needs to produce output in a specific JSON shape. The downstream system will reject any output that does not match the schema. Your prompt would need to...","vi":"Bạn đang viết lời nhắc hệ thống cho ứng dụng Claude cần tạo đầu ra ở dạng JSON cụ thể. Hệ thống xuôi dòng sẽ từ chối mọi đầu ra không khớp với lược đồ. Lời nhắc của bạn sẽ cần phải...","jp":"特定の JSON 形式で出力を生成する必要があるクロード アプリケーションのシステム プロンプトを作成しています。ダウンストリーム システムは、スキーマに一致しない出力を拒否します。プロンプトには次のものが必要です..."},"options":[{"k":"A","t":{"en":"Instruct Claude to use whichever output format it considers most appropriate for each request the application handles.","vi":"Hướng dẫn Claude sử dụng bất kỳ định dạng đầu ra nào mà nó cho là phù hợp nhất cho từng yêu cầu mà ứng dụng xử lý.","jp":"アプリケーションが処理する各リクエストに最も適切と考えられる出力形式を使用するようにクロードに指示します。"}},{"k":"B","t":{"en":"Instruct Claude to return JSON sometimes and free text other times so the application's output captures both formats.","vi":"Hướng dẫn Claude đôi khi trả về JSON và văn bản miễn phí vào những thời điểm khác để đầu ra của ứng dụng ghi được cả hai định dạng.","jp":"アプリケーションの出力が両方の形式をキャプチャできるように、時には JSON を返し、時にはフリー テキストを返すように Claude に指示します。"}},{"k":"C","t":{"en":"Omit any reference to the format and rely on a post-processing step in the application to reshape Claude's output.","vi":"Bỏ qua mọi tham chiếu đến định dạng và dựa vào bước xử lý hậu kỳ trong ứng dụng để định hình lại đầu ra của Claude.","jp":"形式への参照を省略し、アプリケーションの後処理ステップに依存してクロードの出力を再形成します。"}},{"k":"D","t":{"en":"Include explicit constraints describing the required JSON schema and an instruction to produce only output matching that schema.","vi":"Bao gồm các ràng buộc rõ ràng mô tả lược đồ JSON được yêu cầu và hướng dẫn để chỉ tạo đầu ra khớp với lược đồ đó.","jp":"必要な JSON スキーマを記述する明示的な制約と、そのスキーマに一致する出力のみを生成する命令を含めます。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Khi downstream từ chối mọi đầu ra không khớp schema, prompt phải <b>nêu tường minh ràng buộc</b>: mô tả <b>JSON schema bắt buộc</b> (trường, kiểu, trường bắt buộc) và chỉ dẫn <b>chỉ xuất ra nội dung khớp schema</b>, không thêm văn bản ngoài. Tiêu chí rõ ràng giúp tăng mạnh độ tuân thủ; trong thực tế nên kết hợp với structured output qua <code>tool_use</code>/JSON schema và validation để đảm bảo chắc chắn hơn.","elim":["<b>A.</b> Để Claude tự chọn định dạng chắc chắn sinh ra đầu ra không khớp schema mà downstream sẽ từ chối.","<b>B.</b> Trộn JSON và văn bản tự do có nghĩa là một phần đầu ra chắc chắn bị downstream từ chối.","<b>C.</b> Không nhắc đến định dạng rồi dựa vào hậu xử lý để «nắn» lại là mong manh; hậu xử lý không thể suy ra đúng cấu trúc từ văn bản tùy ý."]},"cite":"Hướng dẫn ôn tập — §2.4 JSON Schema cho Structured Output; Lĩnh vực 4.1"},{"id":"ccdvf-q067","n":67,"topic":1,"type":"mcq","stem":{"en":"Your Claude application is hitting context window limits when processing long customer service transcripts. A junior developer suggests increasing the temperature parameter to fix the issue. How would you respond?","vi":"Ứng dụng Claude của bạn sắp đạt đến giới hạn cửa sổ ngữ cảnh khi xử lý bản ghi dịch vụ khách hàng dài. Một nhà phát triển cấp dưới đề xuất tăng thông số nhiệt độ để khắc phục sự cố. Bạn sẽ trả lời thế nào?","jp":"Claude アプリケーションは、長い顧客サービス記録を処理するときにコンテキスト ウィンドウの制限に達します。若手開発者は、問題を解決するために温度パラメータを増やすことを提案しています。あなたならどう答えますか？"},"options":[{"k":"A","t":{"en":"Explain that temperature controls sampling randomness and is unrelated to context capacity, then address the context issue through summarization or chunking.","vi":"Giải thích rằng nhiệt độ kiểm soát tính ngẫu nhiên của việc lấy mẫu và không liên quan đến dung lượng ngữ cảnh, sau đó giải quyết vấn đề ngữ cảnh thông qua tóm tắt hoặc phân đoạn.","jp":"温度はサンプリングのランダム性を制御し、コンテキストの容量とは無関係であることを説明し、要約またはチャンキングを通じてコン​​テキストの問題に対処します。"}},{"k":"B","t":{"en":"Adjust the temperature parameter together with the max_tokens parameter, treating the combined adjustment as the team's mechanism for managing context window pressure during long-transcript processing.","vi":"Điều chỉnh tham số nhiệt độ cùng với tham số max_tokens, coi điều chỉnh kết hợp là cơ chế của nhóm để quản lý áp lực cửa sổ ngữ cảnh trong quá trình xử lý bản ghi dài.","jp":"温度パラメータを max_tokens パラメータと一緒に調整し、組み合わせた調整を、長いトランスクリプト処理中にコンテキスト ウィンドウのプレッシャーを管理するためのチームのメカニズムとして扱います。"}},{"k":"C","t":{"en":"Remove the system prompt entirely to make room for longer transcripts in each request, freeing up context window space the system prompt would otherwise consume.","vi":"Xóa hoàn toàn lời nhắc hệ thống để nhường chỗ cho các bản ghi dài hơn trong mỗi yêu cầu, giải phóng không gian cửa sổ ngữ cảnh mà lời nhắc hệ thống sẽ sử dụng.","jp":"システム プロンプトを完全に削除して、各リクエストで長いトランスクリプトを格納できるスペースを確保し、システム プロンプトが消費するコンテキスト ウィンドウのスペースを解放します。"}},{"k":"D","t":{"en":"Increase the temperature parameter as the junior developer suggested and observe whether the context window issue resolves over the next several runs of the application in production.","vi":"Tăng tham số nhiệt độ như nhà phát triển cấp dưới đề xuất và quan sát xem sự cố cửa sổ ngữ cảnh có được giải quyết trong vài lần chạy ứng dụng tiếp theo trong sản xuất hay không.","jp":"ジュニア開発者が提案したように温度パラメータを増やし、本番環境でのアプリケーションの次の数回の実行でコンテキスト ウィンドウの問題が解決するかどうかを観察します。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> <code>temperature</code> chỉ điều khiển <b>độ ngẫu nhiên khi lấy mẫu token</b>, hoàn toàn không liên quan đến <b>dung lượng context window</b> (tổng token của system prompt, lịch sử, định nghĩa tool, kết quả tool). Vì vậy câu trả lời đúng là giải thích ngộ nhận cho junior rồi xử lý gốc rễ: transcript quá dài so với context. Các cách phù hợp là <b>tóm tắt</b> (giữ lại sự kiện, số liệu quan trọng), <b>chia chunk</b> transcript để xử lý từng phần rồi tổng hợp, hoặc lược bớt nội dung không liên quan.","elim":["<b>B.</b> Gộp <code>temperature</code> với <code>max_tokens</code> vẫn không giải quyết được vấn đề: <code>max_tokens</code> chỉ giới hạn độ dài đầu ra, còn <code>temperature</code> không ảnh hưởng gì đến số token đầu vào làm tràn context.","<b>C.</b> Bỏ hẳn system prompt làm mất vai trò, quy tắc và ràng buộc hành vi của ứng dụng, trong khi system prompt thường chỉ chiếm phần nhỏ so với transcript dài nên cũng không giải quyết triệt để.","<b>D.</b> Làm theo gợi ý sai rồi “chờ xem” trên production vừa lãng phí vừa rủi ro: tăng <code>temperature</code> chỉ làm đầu ra ngẫu nhiên hơn, không bao giờ làm transcript vừa context window."]},"cite":"Hướng dẫn ôn tập — §1.5 Context Window; Lĩnh vực 5.1"},{"id":"ccdvf-q068","n":68,"topic":1,"type":"mcq","stem":{"en":"A teammate is reviewing the team's threat model for a Claude application and has asked you to identify the categories of AI-specific threats that the model should cover. The teammate has already listed traditional web application threats and wants to know what additional categories apply to a Claude application. Which AI-specific threat categories would you add?","vi":"Một đồng đội đang xem xét mô hình mối đe dọa của nhóm cho ứng dụng Claude và đã yêu cầu bạn xác định các danh mục mối đe dọa dành riêng cho AI mà mô hình đó phải đề cập. Đồng đội đã liệt kê các mối đe dọa ứng dụng web truyền thống và muốn biết những danh mục bổ sung nào áp dụng cho ứng dụng Claude. Bạn sẽ thêm danh mục mối đe dọa dành riêng cho AI nào?","jp":"チームメイトがクロード アプリケーションのチームの脅威モデルをレビューしており、モデルでカバーすべき AI 固有の脅威のカテゴリを特定するように求められました。チームメイトはすでに従来の Web アプリケーションの脅威をリストアップしており、クロード アプリケーションにどのような追加カテゴリが適用されるかを知りたいと考えています。どの AI 固有の脅威カテゴリを追加しますか?"},"options":[{"k":"A","t":{"en":"Cross-site scripting and SQL injection, because these traditional web application threats apply with equal weight to any application that uses Claude in any way.","vi":"Tập lệnh chéo trang và chèn SQL, bởi vì các mối đe dọa ứng dụng web truyền thống này có tầm ảnh hưởng ngang nhau đối với bất kỳ ứng dụng nào sử dụng Claude theo bất kỳ cách nào.","jp":"クロスサイト スクリプティングと SQL インジェクション。これらの従来の Web アプリケーションの脅威は、何らかの方法で Claude を使用するアプリケーションに同等の重みで適用されるためです。"}},{"k":"B","t":{"en":"Network-level denial of service and physical infrastructure attacks, because these categories cover the threats most likely to affect any Claude application in production.","vi":"Các cuộc tấn công từ chối dịch vụ và cơ sở hạ tầng vật lý ở cấp độ mạng, bởi vì các danh mục này bao gồm các mối đe dọa có nhiều khả năng ảnh hưởng nhất đến bất kỳ ứng dụng Claude nào trong quá trình sản xuất.","jp":"ネットワーク レベルのサービス拒否攻撃と物理インフラストラクチャ攻撃。これらのカテゴリは、運用環境の Claude アプリケーションに影響を与える可能性が最も高い脅威をカバーしているためです。"}},{"k":"C","t":{"en":"Prompt injection, data leakage from prompts or context, jailbreak attempts, and unsafe model output that bypasses application controls.","vi":"Đưa vào, rò rỉ dữ liệu từ lời nhắc hoặc ngữ cảnh, nỗ lực bẻ khóa và đầu ra mô hình không an toàn vượt qua các biện pháp kiểm soát ứng dụng.","jp":"プロンプトインジェクション、プロンプトまたはコンテキストからのデータ漏洩、脱獄の試み、アプリケーション制御をバイパスする安全でないモデル出力。"}},{"k":"D","t":{"en":"Supply chain attacks on the Claude SDK because the SDK itself is the only point of vulnerability that a Claude application introduces beyond traditional web application threats.","vi":"Các cuộc tấn công chuỗi cung ứng vào Claude SDK vì bản thân SDK là điểm dễ bị tổn thương duy nhất mà ứng dụng Claude gây ra ngoài các mối đe dọa ứng dụng web truyền thống.","jp":"クロード SDK に対するサプライ チェーン攻撃。これは、SDK 自体がクロード アプリケーションによって従来の Web アプリケーションの脅威を超えて導入される唯一の脆弱性ポイントであるためです。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Ứng dụng dùng LLM có một <b>bề mặt tấn công riêng</b> ngoài các mối đe dọa web truyền thống: <b>prompt injection</b> (trực tiếp hoặc gián tiếp qua tài liệu/kết quả tool), <b>rò rỉ dữ liệu</b> từ prompt hoặc context (system prompt, dữ liệu nhạy cảm của người dùng khác), <b>jailbreak</b> nhằm vượt qua các giới hạn hành vi, và <b>đầu ra không an toàn</b> bị đưa thẳng vào hệ thống phía sau mà vượt qua kiểm soát của ứng dụng. Đây chính là các nhóm “AI-specific” mà người đồng nghiệp cần bổ sung vào threat model.","elim":["<b>A.</b> XSS và SQL injection là mối đe dọa web truyền thống mà đồng nghiệp đã liệt kê rồi; đề hỏi các nhóm đặc thù của AI, không phải lặp lại nhóm cũ.","<b>B.</b> DoS tầng mạng và tấn công hạ tầng vật lý cũng là mối đe dọa chung của mọi hệ thống, không phải đặc thù của ứng dụng Claude, và cũng không phải nhóm “có khả năng cao nhất”.","<b>D.</b> Tấn công chuỗi cung ứng là rủi ro có thật nhưng không phải “điểm yếu duy nhất”; khẳng định này bỏ sót hoàn toàn prompt injection, rò rỉ dữ liệu, jailbreak và đầu ra không an toàn."]}},{"id":"ccdvf-q069","n":69,"topic":1,"type":"mcq","stem":{"en":"Your Claude application returns confident-sounding answers, but occasionally those answers contain factual errors that downstream systems treat as ground truth. The team is concerned about the application's confidence-versus-accuracy gap. How would you address the gap?","vi":"Ứng dụng Claude của bạn trả về những câu trả lời nghe có vẻ tự tin, nhưng đôi khi những câu trả lời đó chứa các lỗi thực tế mà các hệ thống xuôi dòng coi là sự thật cơ bản. Nhóm lo ngại về khoảng cách giữa độ tin cậy và độ chính xác của ứng dụng. Bạn sẽ giải quyết khoảng cách đó như thế nào?","jp":"クロード アプリケーションは自信に満ちた回答を返しますが、場合によってはそれらの回答に事実上の誤りが含まれており、ダウンストリーム システムがグラウンド トゥルースとして処理します。チームは、アプリケーションの信頼性と精度のギャップを懸念しています。このギャップにどう対処しますか?"},"options":[{"k":"A","t":{"en":"Lower the model's temperature so the model's responses sound less confident and downstream systems are less likely to treat the responses as ground truth in normal operation.","vi":"Giảm nhiệt độ của mô hình để các phản hồi của mô hình có vẻ kém tự tin hơn và các hệ thống hạ nguồn ít có khả năng coi các phản hồi là sự thật cơ bản trong hoạt động bình thường.","jp":"モデルの温度を下げると、モデルの応答の信頼性が低くなり、下流システムが通常の動作における応答をグランド トゥルースとして扱う可能性が低くなります。"}},{"k":"B","t":{"en":"Apply skepticism toward confident output by adding validation steps, sourcing requirements, or confidence calibration before treating outputs as ground truth.","vi":"Áp dụng thái độ hoài nghi đối với kết quả đầu ra đáng tin cậy bằng cách thêm các bước xác thực, yêu cầu tìm nguồn cung ứng hoặc hiệu chỉnh độ tin cậy trước khi coi kết quả đầu ra là sự thật cơ bản.","jp":"出力をグランドトゥルースとして扱う前に、検証ステップ、調達要件、または信頼度の調整を追加することで、信頼できる出力に対して懐疑的な見方を適用します。"}},{"k":"C","t":{"en":"Reject every response the application produces until a manual accuracy review is conducted on each response by a human reviewer before any downstream system uses it.","vi":"Từ chối mọi phản hồi mà ứng dụng tạo ra cho đến khi người đánh giá tiến hành đánh giá độ chính xác theo cách thủ công đối với từng phản hồi trước khi bất kỳ hệ thống hạ nguồn nào sử dụng phản hồi đó.","jp":"ダウンストリーム システムが応答を使用する前に、人間のレビュー担当者による手動の精度レビューが各応答に対して実行されるまで、アプリケーションが生成するすべての応答を拒否します。"}},{"k":"D","t":{"en":"Add a disclaimer to every output telling users to verify the accuracy of the output and treat the disclaimer as the primary mechanism for managing the confidence-versus-accuracy gap.","vi":"Thêm tuyên bố từ chối trách nhiệm cho mọi đầu ra yêu cầu người dùng xác minh tính chính xác của đầu ra và coi tuyên bố từ chối trách nhiệm này là cơ chế chính để quản lý khoảng cách giữa độ tin cậy và độ chính xác.","jp":"すべての出力に免責事項を追加して、出力の正確性を検証し、免責事項を信頼性と精度のギャップを管理するための主要なメカニズムとして扱うようにユーザーに指示します。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Giọng văn tự tin của mô hình <b>không phải bằng chứng về độ chính xác</b>, nên khi hệ thống phía sau coi đầu ra là ground truth thì cần thêm các lớp kiểm chứng: <b>bước validation</b> (đối chiếu với nguồn dữ liệu, kiểm tra quy tắc), <b>yêu cầu dẫn nguồn</b> để có thể truy vết từng khẳng định, và <b>hiệu chỉnh độ tin cậy</b> (confidence calibration) trên tập validation có nhãn để quyết định khi nào tự động xử lý, khi nào chuyển người review. Cách này thu hẹp khoảng cách giữa tự tin và chính xác mà vẫn giữ được tự động hóa.","elim":["<b>A.</b> Hạ <code>temperature</code> chỉ giảm độ ngẫu nhiên, không làm câu trả lời “bớt tự tin” hay chính xác hơn; lỗi sự thật vẫn có thể xuất hiện một cách nhất quán.","<b>C.</b> Bắt con người review thủ công mọi phản hồi là quá mức, không mở rộng được và triệt tiêu giá trị tự động hóa; nên review có chọn lọc theo độ tin cậy và lấy mẫu.","<b>D.</b> Disclaimer không ngăn được hệ thống phía sau (máy, không phải người đọc) dùng dữ liệu sai làm ground truth; đó không phải cơ chế kiểm soát thực sự."]},"cite":"Hướng dẫn ôn tập — §9.4 Hiệu chỉnh độ tin cậy và giám sát của con người; Lĩnh vực 5.5"},{"id":"ccdvf-q070","n":70,"topic":1,"type":"mcq","stem":{"en":"You are setting up a CI/CD pipeline for a new Claude application. The pipeline needs to run automated checks on every pull request before code can be merged. The CI/CD checks would include...","vi":"Bạn đang thiết lập quy trình CI/CD cho ứng dụng Claude mới. Quy trình cần chạy kiểm tra tự động đối với mọi yêu cầu kéo trước khi có thể hợp nhất mã. Việc kiểm tra CI/CD sẽ bao gồm...","jp":"新しい Claude アプリケーションの CI/CD パイプラインをセットアップしています。コードをマージする前に、パイプラインはすべてのプル リクエストに対して自動チェックを実行する必要があります。 CI/CD チェックには以下が含まれます..."},"options":[{"k":"A","t":{"en":"Automated tests of the Claude integration, linting, and any other standard quality gates the team applies to its other services.","vi":"Các thử nghiệm tự động về tích hợp Claude, linting và bất kỳ cổng chất lượng tiêu chuẩn nào khác mà nhóm áp dụng cho các dịch vụ khác của mình.","jp":"クロード統合、リンティング、およびチームが他のサービスに適用するその他の標準品質ゲートの自動テスト。"}},{"k":"B","t":{"en":"A full end-to-end production deployment on every pull request to catch all possible issues before any code is merged into the main branch.","vi":"Triển khai sản xuất toàn diện theo từng yêu cầu kéo để nắm bắt tất cả các vấn đề có thể xảy ra trước khi bất kỳ mã nào được hợp nhất vào nhánh chính.","jp":"コードがメイン ブランチにマージされる前に、考えられるすべての問題をキャッチするために、すべてのプル リクエストで完全なエンドツーエンドの実稼働環境をデプロイします。"}},{"k":"C","t":{"en":"Automated tests of the Claude integration only, with linting handled separately during local development on each developer's machine.","vi":"Chỉ kiểm tra tự động quá trình tích hợp Claude, với việc linting được xử lý riêng trong quá trình phát triển cục bộ trên máy của mỗi nhà phát triển.","jp":"クロード統合のみの自動テスト。リンティングは各開発者のマシンでのローカル開発中に個別に処理されます。"}},{"k":"D","t":{"en":"Automated linting and security scanning, with Claude integration testing handled manually during pre- release verification by a designated reviewer.","vi":"Chức năng quét bảo mật và tìm lỗi mã nguồn tự động, với quá trình kiểm tra tích hợp Claude được xử lý thủ công trong quá trình xác minh trước khi phát hành bởi người đánh giá được chỉ định.","jp":"自動化されたリンティングとセキュリティ スキャン。リリース前の検証中に、指定されたレビュー担当者によって手動で処理されるクロード統合テストが行​​われます。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Ứng dụng Claude vẫn là một dịch vụ phần mềm nên CI trên mỗi pull request phải gồm <b>test tự động cho phần tích hợp Claude</b> (ví dụ: xử lý phản hồi, parse structured output, xử lý lỗi, có thể kèm bộ eval nhỏ) <b>cộng với linting và mọi quality gate tiêu chuẩn</b> mà nhóm áp dụng cho các dịch vụ khác (unit test, security scan...). Không nên coi phần Claude là ngoại lệ, cũng không nên bỏ các cổng chất lượng thông thường.","elim":["<b>B.</b> Triển khai production đầy đủ cho mỗi PR là sai mục đích của CI: tốn kém, rủi ro và đưa code chưa được review/merge lên production.","<b>C.</b> Chỉ test phần tích hợp Claude rồi để linting cho máy từng dev là không nhất quán và không được cưỡng chế; linting nên là cổng tự động trong CI.","<b>D.</b> Để test tích hợp Claude thành bước thủ công trước release làm mất phản hồi sớm trên từng PR, dễ bị bỏ sót và không lặp lại được."]},"cite":"Hướng dẫn ôn tập — §5.9 Claude Code CLI cho CI/CD; Lĩnh vực 3.6"},{"id":"ccdvf-q071","n":71,"topic":1,"type":"mcq","stem":{"en":"Your team is choosing how to add a capability to a Claude application. You want to apply the appropriate option, whether built-in tool, custom tool, Skill, or MCP server, based on the use case. You would choose the option that...","vi":"Nhóm của bạn đang chọn cách thêm khả năng vào ứng dụng Claude. Bạn muốn áp dụng tùy chọn thích hợp, cho dù là công cụ tích hợp, công cụ tùy chỉnh, Skill hay máy chủ MCP, tùy theo trường hợp sử dụng. Bạn sẽ chọn phương án...","jp":"あなたのチームは、Claude アプリケーションに機能を追加する方法を選択しています。ユースケースに基づいて、組み込みツール、カスタム ツール、スキル、MCP サーバーなど、適切なオプションを適用する必要があります。あなたは次のオプションを選択します..."},"options":[{"k":"A","t":{"en":"Is the most familiar to the team based on prior experience with similar capabilities.","vi":"Là người quen thuộc nhất với nhóm dựa trên kinh nghiệm trước đây với khả năng tương tự.","jp":"同様の機能を使用した以前の経験に基づいて、チームにとって最もよく知られています。"}},{"k":"B","t":{"en":"Is the newest available option among built-in tools, custom tools, Skills, and MCP servers.","vi":"Là tùy chọn khả dụng mới nhất trong số các công cụ tích hợp, công cụ tùy chỉnh, Kỹ năng và máy chủ MCP.","jp":"組み込みツール、カスタム ツール、スキル、MCP サーバーの中で利用可能な最新のオプションです。"}},{"k":"C","t":{"en":"Is the easiest to build given the team's current development tools and workflows.","vi":"Là cách dễ xây dựng nhất dựa trên các công cụ và quy trình phát triển hiện tại của nhóm.","jp":"チームの現在の開発ツールとワークフローを考慮すると、構築が最も簡単です。"}},{"k":"D","t":{"en":"Matches the use case's scope, reuse needs, and integration context.","vi":"Phù hợp với phạm vi của ca sử dụng, nhu cầu sử dụng lại và bối cảnh tích hợp.","jp":"ユースケースの範囲、再利用のニーズ、統合コンテキストを一致させます。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Lựa chọn giữa built-in tool, custom tool, Skill hay MCP server phải dựa trên <b>đặc điểm của use case</b>: <b>phạm vi</b> (một tác vụ hẹp trong một ứng dụng hay một năng lực rộng), <b>nhu cầu tái sử dụng</b> (chỉ một agent dùng hay nhiều nhóm/nhiều client dùng) và <b>bối cảnh tích hợp</b> (cần kết nối hệ thống bên ngoài theo giao thức chuẩn, hay chỉ cần đóng gói hướng dẫn và script). Ví dụ: tác vụ có sẵn thì dùng built-in tool, tích hợp hệ thống ngoài dùng chung thì dùng MCP server, quy trình/kiến thức tái sử dụng thì dùng Skill.","elim":["<b>A.</b> Mức độ quen thuộc của nhóm là tiêu chí thuận tiện, không đảm bảo lựa chọn phù hợp với phạm vi và nhu cầu tái sử dụng của tính năng.","<b>B.</b> “Mới nhất” không đồng nghĩa với phù hợp nhất; mỗi lựa chọn giải quyết một loại vấn đề khác nhau.","<b>C.</b> Dễ xây nhất trước mắt có thể dẫn đến giải pháp không tái sử dụng được hoặc tích hợp kém, gây chi phí lớn hơn về sau."]},"cite":"Hướng dẫn ôn tập — §5.4 Slash Command tùy chỉnh và Skill; §4.2 MCP Server"},{"id":"ccdvf-q072","n":72,"topic":1,"type":"mcq","stem":{"en":"A teammate has asked you to explain why the team's Claude application is billed for output tokens at a different rate than input tokens. They had assumed the rate was the same for both. How would you explain the difference?","vi":"Một đồng đội đã yêu cầu bạn giải thích lý do tại sao ứng dụng Claude của nhóm được tính phí cho mã thông báo đầu ra ở mức khác với mã thông báo đầu vào. Họ đã cho rằng tỷ lệ là như nhau cho cả hai. Bạn sẽ giải thích sự khác biệt như thế nào?","jp":"チームメイトから、チームのクロード アプリケーションが出力トークンに対して入力トークンとは異なるレートで請求される理由を説明してほしいと頼まれました。彼らはレートが両方とも同じであると想定していました。その違いをどう説明しますか？"},"options":[{"k":"A","t":{"en":"Output tokens are typically billed at the same rate as input tokens, and the apparent rate difference is a billing error to report to Anthropic.","vi":"Mã thông báo đầu ra thường được tính phí ở cùng mức với mã thông báo đầu vào và sự khác biệt về tỷ giá rõ ràng là lỗi thanh toán cần báo cáo cho Anthropic.","jp":"通常、出力トークンは入力トークンと同じレートで請求され、明らかなレートの差は請求エラーとして Anthropic に報告されます。"}},{"k":"B","t":{"en":"Output tokens are typically billed at a lower rate than input tokens, because output tokens are cheaper to produce than input tokens are to process.","vi":"Mã thông báo đầu ra thường được tính phí ở mức thấp hơn so với mã thông báo đầu vào, vì sản xuất mã thông báo đầu ra rẻ hơn so với mã thông báo đầu vào được xử lý.","jp":"出力トークンは、入力トークンの処理よりも生成の方が安価であるため、通常、出力トークンは入力トークンよりも低い料金で請求されます。"}},{"k":"C","t":{"en":"Output tokens are not billed at all, because cost is determined entirely by the input tokens sent to the model on each request.","vi":"Mã thông báo đầu ra hoàn toàn không được lập hóa đơn vì chi phí được xác định hoàn toàn bởi mã thông báo đầu vào được gửi đến mô hình theo mỗi yêu cầu.","jp":"コストは各リクエストでモデルに送信される入力トークンによって完全に決定されるため、出力トークンにはまったく請求されません。"}},{"k":"D","t":{"en":"Output tokens are typically billed at a higher rate than input tokens, and cost models for the application should reflect both rates separately.","vi":"Mã thông báo đầu ra thường được tính phí ở mức cao hơn mã thông báo đầu vào và mô hình chi phí cho ứng dụng sẽ phản ánh cả hai mức giá riêng biệt.","jp":"通常、出力トークンは入力トークンよりも高いレートで請求されるため、アプリケーションのコスト モデルは両方のレートを個別に反映する必要があります。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Trong bảng giá Claude API, <b>output token thường đắt hơn input token</b> (ví dụ nhiều model có tỷ lệ khoảng 5 lần), vì việc sinh token đầu ra diễn ra tuần tự từng token và tốn tài nguyên tính toán hơn so với xử lý song song input. Do đó, mô hình chi phí của ứng dụng phải <b>tính riêng hai đơn giá</b>: ứng dụng sinh đầu ra dài (báo cáo, code) sẽ có chi phí khác hẳn ứng dụng chủ yếu đọc đầu vào dài và trả lời ngắn.","elim":["<b>A.</b> Chênh lệch giá là thiết kế có chủ đích trong bảng giá, không phải lỗi tính phí cần báo cho Anthropic.","<b>B.</b> Ngược với thực tế: output token có đơn giá cao hơn, không thấp hơn input token.","<b>C.</b> Output token vẫn bị tính phí; chi phí mỗi request gồm cả input và output token."]}},{"id":"ccdvf-q073","n":73,"topic":1,"type":"mcq","stem":{"en":"Your Claude application's prompt was written months ago and has not been updated. The team has discovered through evals that the prompt produces good results on common cases but underperforms on a specific category of inputs that has grown in volume. How would you respond?","vi":"Lời nhắc trong ứng dụng Claude của bạn đã được viết từ nhiều tháng trước và chưa được cập nhật. Thông qua các đánh giá, nhóm đã phát hiện ra rằng lời nhắc mang lại kết quả tốt trong các trường hợp thông thường nhưng hoạt động kém hơn đối với một danh mục đầu vào cụ thể đã tăng về số lượng. Bạn sẽ trả lời thế nào?","jp":"Claude アプリケーションのプロンプトは数か月前に書かれたもので、更新されていません。チームは評価を通じて、このプロンプトは一般的なケースでは良好な結果を生成しますが、量が増加した特定のカテゴリの入力ではパフォーマンスが低下することを発見しました。あなたならどう答えますか？"},"options":[{"k":"A","t":{"en":"Iterate on the prompt to address the underperforming category, validate the change with evals, and continue refining as needed.","vi":"Lặp lại lời nhắc để giải quyết danh mục hoạt động kém, xác thực thay đổi bằng evals và tiếp tục tinh chỉnh nếu cần.","jp":"プロンプトを繰り返してパフォーマンスの低いカテゴリに対処し、評価で変更を検証し、必要に応じて調整を続けます。"}},{"k":"B","t":{"en":"Tell users to avoid the underperforming category by adding warnings in the application's user interface about handled inputs.","vi":"Yêu cầu người dùng tránh danh mục hoạt động kém bằng cách thêm cảnh báo trong giao diện người dùng của ứng dụng về dữ liệu đầu vào đã xử lý.","jp":"アプリケーションのユーザー インターフェイスに処理された入力に関する警告を追加して、パフォーマンスの低いカテゴリを避けるようにユーザーに伝えます。"}},{"k":"C","t":{"en":"Replace the prompt with a new one aligned to the underperforming category, treating any common-case performance change as a known tradeoff.","vi":"Thay thế lời nhắc bằng một lời nhắc mới phù hợp với danh mục hoạt động kém, coi mọi thay đổi về hiệu suất trong trường hợp thông thường là một sự đánh đổi đã biết.","jp":"プロンプトをパフォーマンスの低いカテゴリに合わせた新しいプロンプトに置き換え、一般的なパフォーマンスの変化を既知のトレードオフとして扱います。"}},{"k":"D","t":{"en":"Add the underperforming category to a separate Claude application with its own prompt so the original prompt does not change.","vi":"Thêm danh mục hoạt động kém vào một ứng dụng Claude riêng biệt có lời nhắc riêng để lời nhắc ban đầu không thay đổi.","jp":"元のプロンプトが変更されないように、パフォーマンスの低いカテゴリを独自のプロンプトを持つ別の Claude アプリケーションに追加します。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Prompt là tài sản cần bảo trì: khi eval phát hiện một nhóm đầu vào đang tăng mà chất lượng kém, cách đúng là <b>lặp tinh chỉnh prompt</b> nhắm vào nhóm đó (thêm tiêu chí rõ ràng, ví dụ few-shot cho nhóm này...), rồi <b>kiểm chứng bằng eval</b> trên cả nhóm yếu lẫn các trường hợp phổ biến để không gây hồi quy, và tiếp tục cải thiện theo chu kỳ. Đây là quy trình cải tiến tiệm tiến dựa trên dữ liệu.","elim":["<b>B.</b> Cảnh báo người dùng tránh nhóm đầu vào đang tăng trưởng là né vấn đề, đẩy gánh nặng cho người dùng thay vì cải thiện ứng dụng.","<b>C.</b> Viết lại hoàn toàn prompt cho nhóm yếu và chấp nhận suy giảm ở trường hợp phổ biến là đánh đổi không cần thiết; có thể cải thiện nhóm yếu mà vẫn giữ chất lượng chung.","<b>D.</b> Tách ra ứng dụng riêng chỉ để tránh sửa prompt làm tăng độ phức tạp vận hành (định tuyến, bảo trì hai hệ thống) mà không có lý do kỹ thuật."]},"cite":"Hướng dẫn ôn tập — Lĩnh vực 3.5 Tinh chỉnh Lặp lại để Cải thiện Tiệm tiến; §6.2 Tiêu chí rõ ràng so với chỉ dẫn mơ hồ"},{"id":"ccdvf-q074","n":74,"topic":1,"type":"mcq","stem":{"en":"Your Claude application produces good responses for typical inputs but struggles with edge cases. You have several labeled examples of edge-case inputs and the desired response for each. You want to use these examples to improve the model's handling of edge cases. What is the best way to use these examples?","vi":"Ứng dụng Claude của bạn tạo ra phản hồi tốt cho các đầu vào thông thường nhưng gặp khó khăn với các trường hợp khó khăn. Bạn có một số ví dụ được gắn nhãn về đầu vào trường hợp cạnh và phản hồi mong muốn cho từng trường hợp. Bạn muốn sử dụng những ví dụ này để cải thiện khả năng xử lý các trường hợp biên của mô hình. Cách tốt nhất để sử dụng những ví dụ này là gì?","jp":"Claude アプリケーションは、典型的な入力に対して良好な応答を生成しますが、エッジケースでは困難を伴います。エッジケース入力のラベル付き例がいくつかあり、それぞれに対する望ましい応答が示されています。これらの例を使用して、モデルによるエッジケースの処理を改善したいと考えています。これらの例を使用する最良の方法は何ですか?"},"options":[{"k":"A","t":{"en":"Embed the examples in a database for the model to find during inference.","vi":"Nhúng các ví dụ vào cơ sở dữ liệu để mô hình tìm thấy trong quá trình suy luận.","jp":"モデルが推論中に検索できるように、サンプルをデータベースに埋め込みます。"}},{"k":"B","t":{"en":"Add the labeled edge-case examples to the prompt as few-shot examples so the model can learn the pattern.","vi":"Thêm các ví dụ về trường hợp cạnh được gắn nhãn vào lời nhắc dưới dạng ví dụ về một vài lần chụp để mô hình có thể tìm hiểu mẫu.","jp":"モデルがパターンを学習できるように、ラベル付きのエッジケースの例を少数ショットの例としてプロンプトに追加します。"}},{"k":"C","t":{"en":"Train a custom model on the edge-case examples and deploy that custom model in place of the team's current Claude integration.","vi":"Huấn luyện mô hình tùy chỉnh trên các ví dụ trường hợp đặc biệt và triển khai mô hình tùy chỉnh đó thay cho tích hợp Claude hiện tại của nhóm.","jp":"エッジケースの例に基づいてカスタム モデルをトレーニングし、チームの現在のクロード統合の代わりにそのカスタム モデルをデプロイします。"}},{"k":"D","t":{"en":"Tell users to avoid submitting the edge-case inputs to the application by adding warnings in the application's user interface.","vi":"Yêu cầu người dùng tránh gửi dữ liệu đầu vào theo trường hợp đặc biệt cho ứng dụng bằng cách thêm cảnh báo vào giao diện người dùng của ứng dụng.","jp":"アプリケーションのユーザー インターフェイスに警告を追加して、エッジケースの入力をアプリケーションに送信しないようにユーザーに伝えます。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Đã có sẵn các cặp <b>đầu vào edge case – phản hồi mong muốn</b> có nhãn, nên cách hiệu quả và rẻ nhất là đưa chúng vào prompt dưới dạng <b>few-shot examples</b>. Ví dụ minh họa giúp mô hình nắm được mẫu xử lý cho các trường hợp khó tốt hơn nhiều so với mô tả bằng lời, cải thiện tính nhất quán mà không cần thay đổi hạ tầng hay huấn luyện mô hình.","elim":["<b>A.</b> Đưa ví dụ vào database để truy xuất lúc suy luận là thêm hạ tầng không cần thiết khi chỉ có vài ví dụ; mô hình cũng không tự “tìm” trong database nếu không có cơ chế retrieval/tool rõ ràng.","<b>C.</b> Huấn luyện mô hình tùy chỉnh từ vài ví dụ là quá mức, tốn kém và không phải hướng tiếp cận chuẩn cho ứng dụng Claude khi few-shot đã đủ.","<b>D.</b> Bảo người dùng tránh edge case là né tránh vấn đề, không cải thiện được khả năng xử lý của ứng dụng."]},"cite":"Hướng dẫn ôn tập — §6.1 Few-shot Prompting; Lĩnh vực 4.2"},{"id":"ccdvf-q075","n":75,"topic":1,"type":"mcq","stem":{"en":"A teammate has asked you to explain the difference between context engineering and prompt engineering. They have heard the terms used interchangeably and are unsure how each applies to a Claude application that processes long-running multi-step tasks. How would you describe the distinction?","vi":"Một đồng đội đã yêu cầu bạn giải thích sự khác biệt giữa kỹ thuật bối cảnh và kỹ thuật nhắc nhở. Họ đã nghe thấy các thuật ngữ được sử dụng thay thế cho nhau và không chắc chắn cách áp dụng từng thuật ngữ cho ứng dụng Claude xử lý các tác vụ nhiều bước dài hạn. Bạn sẽ mô tả sự khác biệt như thế nào?","jp":"チームメイトから、コンテキスト エンジニアリングとプロンプト エンジニアリングの違いについて説明してほしいと頼まれました。彼らは、これらの用語が同じ意味で使用されることを聞いたことがあるため、長時間実行される複数ステップのタスクを処理するクロード アプリケーションにそれぞれの用語がどのように適用されるのかがわかりません。この違いをどのように説明しますか?"},"options":[{"k":"A","t":{"en":"Prompt engineering focuses on the model's response, while context engineering focuses on the user's input across many sessions in a long-running multi-step Claude application.","vi":"Kỹ thuật nhắc nhở tập trung vào phản hồi của mô hình, trong khi kỹ thuật ngữ cảnh tập trung vào đầu vào của người dùng qua nhiều phiên trong ứng dụng Claude nhiều bước dài hạn.","jp":"プロンプト エンジニアリングはモデルの応答に焦点を当てますが、コンテキスト エンジニアリングは、長時間実行されるマルチステップ クロード アプリケーションの多くのセッションにわたるユーザーの入力に焦点を当てます。"}},{"k":"B","t":{"en":"Prompt engineering is the older term for prompt design, while context engineering is the newer term that has replaced it in modern Claude applications across the industry.","vi":"Kỹ thuật nhắc nhở là thuật ngữ cũ hơn cho thiết kế nhanh chóng, trong khi kỹ thuật bối cảnh là thuật ngữ mới hơn đã thay thế nó trong các ứng dụng Claude hiện đại trong toàn ngành.","jp":"プロンプト エンジニアリングはプロンプト デザインの古い用語ですが、コンテキスト エンジニアリングは、業界全体の最新の Claude アプリケーションでそれに取って代わられた新しい用語です。"}},{"k":"C","t":{"en":"Prompt engineering shapes individual prompts for specific outputs, while context engineering manages how content flows across turns and steps and takes steps to keep relevant state visible.","vi":"Kỹ thuật nhắc nhở định hình các lời nhắc riêng lẻ cho đầu ra cụ thể, trong khi kỹ thuật ngữ cảnh quản lý cách nội dung diễn ra theo các lượt và các bước, đồng thời thực hiện các bước để duy trì trạng thái liên quan.","jp":"プロンプト エンジニアリングは、特定の出力に対する個別のプロンプトを形成します。一方、コンテキスト エンジニアリングは、ターンやステップ間でコンテンツがどのように流れるかを管理し、関連する状態を可視化するための措置を講じます。"}},{"k":"D","t":{"en":"Prompt engineering and context engineering each address content the team gives Claude, but the team can group them under a single workflow because the practices use overlapping techniques.","vi":"Kỹ thuật nhanh chóng và kỹ thuật bối cảnh mỗi địa chỉ nội dung mà nhóm cung cấp cho Claude, nhưng nhóm có thể nhóm chúng theo một quy trình làm việc duy nhất vì các phương pháp thực hành sử dụng các kỹ thuật chồng chéo.","jp":"プロンプト エンジニアリングとコンテキスト エンジニアリングはそれぞれ、チームがクロードに提供するコンテンツに対応しますが、実践では重複するテクニックを使用するため、チームはそれらを 1 つのワークフローにグループ化できます。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> <b>Prompt engineering</b> tập trung vào việc soạn từng prompt cụ thể (chỉ dẫn, tiêu chí, ví dụ, định dạng) để có đầu ra mong muốn. <b>Context engineering</b> rộng hơn: quản lý <b>những gì nằm trong context qua nhiều lượt và nhiều bước</b> của tác vụ dài, ví dụ trích xuất sự kiện quan trọng ra block riêng, cắt gọn kết quả tool, dùng scratchpad, ủy quyền cho subagent, để <b>trạng thái liên quan luôn hiển thị</b> với mô hình. Với ứng dụng nhiều bước chạy dài, cả hai đều cần, nhưng context engineering giải quyết vấn đề mất thông tin theo thời gian.","elim":["<b>A.</b> Sai về định nghĩa: context engineering không phải là “tập trung vào đầu vào người dùng qua nhiều session”, và prompt engineering cũng không chỉ “tập trung vào phản hồi”.","<b>B.</b> Context engineering không phải tên mới thay thế prompt engineering; đó là hai mối quan tâm khác nhau và bổ trợ nhau.","<b>D.</b> Gộp chung thành một quy trình bỏ qua khác biệt cốt lõi: một bên tối ưu prompt đơn lẻ, một bên quản lý dòng chảy và trạng thái context qua các bước."]},"cite":"Hướng dẫn ôn tập — Chương 11: Quản lý Context trong Hệ thống Production; Lĩnh vực 5.1"},{"id":"ccdvf-q076","n":76,"topic":1,"type":"mcq","stem":{"en":"The product team has described a new Claude feature in business terms: \"agents should help our analysts produce client memos faster.\" You need to convert this into actionable technical requirements for the engineering team. Your first step would be to...","vi":"Nhóm sản phẩm đã mô tả tính năng mới của Claude theo thuật ngữ kinh doanh: \"các đại lý sẽ giúp các nhà phân tích của chúng tôi tạo ra các bản ghi nhớ khách hàng nhanh hơn.\" Bạn cần chuyển điều này thành các yêu cầu kỹ thuật có thể áp dụng được cho nhóm kỹ thuật. Bước đầu tiên của bạn sẽ là...","jp":"製品チームは、Claude の新機能をビジネス用語で「エージェントは、アナリストが顧客メモをより迅速に作成できるよう支援する必要がある」と説明しています。これをエンジニアリング チームにとって実行可能な技術要件に変換する必要があります。最初のステップは..."},"options":[{"k":"A","t":{"en":"Ask the analysts about the current memo production process to see where they think Claude could be introduced as a prompt-driven drafting step.","vi":"Hãy hỏi các nhà phân tích về quy trình sản xuất bản ghi nhớ hiện tại để xem họ nghĩ Claude có thể được giới thiệu như một bước soạn thảo nhanh chóng.","jp":"現在のメモ作成プロセスについてアナリストに質問し、プロンプト主導の草稿ステップとしてクロードを導入できると思われる箇所を確認します。"}},{"k":"B","t":{"en":"Assess what similar agent-based features have been built internally or in the industry and use those precedents to scope the technical approach.","vi":"Đánh giá những tính năng dựa trên tác nhân tương tự nào đã được xây dựng trong nội bộ hoặc trong ngành và sử dụng những tiền lệ đó để xác định phạm vi tiếp cận kỹ thuật.","jp":"社内または業界でどのような同様のエージェントベースの機能が構築されているかを評価し、それらの先例を使用して技術的アプローチの範囲を絞ります。"}},{"k":"C","t":{"en":"Examine what model capabilities and tier options are available and determine which best supports the memo drafting workflow described by the product team.","vi":"Kiểm tra những khả năng của mô hình và các tùy chọn cấp độ có sẵn và xác định khả năng nào hỗ trợ tốt nhất cho quy trình soạn thảo bản ghi nhớ được nhóm sản phẩm mô tả.","jp":"利用可能なモデル機能と階層オプションを調べて、製品チームが説明するメモ作成ワークフローを最もよくサポートするものを決定します。"}},{"k":"D","t":{"en":"Interpret the functional and infrastructure requirements implied by the business goal.","vi":"Giải thích các yêu cầu về chức năng và cơ sở hạ tầng ngụ ý trong mục tiêu kinh doanh.","jp":"ビジネス目標に含まれる機能要件とインフラストラクチャ要件を解釈します。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Bước đầu tiên khi chuyển một mục tiêu kinh doanh (“giúp analyst viết memo cho khách hàng nhanh hơn”) thành yêu cầu kỹ thuật là <b>diễn giải các yêu cầu chức năng và hạ tầng ngầm định</b> trong mục tiêu đó: agent phải làm gì, đọc dữ liệu nào, tích hợp với hệ thống nào, ràng buộc về bảo mật, độ trễ, quy mô, chất lượng ra sao. Chỉ khi có bộ yêu cầu này mới chọn được kiến trúc, model và cách đo thành công một cách có cơ sở.","elim":["<b>A.</b> Phỏng vấn analyst là hữu ích nhưng câu này đã giả định sẵn lời giải (thêm bước soạn thảo bằng prompt) trước khi xác định yêu cầu.","<b>B.</b> Tham khảo tiền lệ có thể làm sau; lấy tiền lệ làm cơ sở xác định phạm vi trước khi hiểu yêu cầu của chính bài toán dễ dẫn đến giải pháp không khớp.","<b>C.</b> Chọn model và tier là quyết định triển khai, phải đến sau khi đã xác định yêu cầu chức năng và phi chức năng."]}},{"id":"ccdvf-q077","n":77,"topic":1,"type":"mcq","stem":{"en":"Your Claude application is deployed to development, staging, and production environments. Each environment uses a different model version, different prompt versions, and different plugin dependencies, but the configuration is currently scattered across environment variables, hardcoded values, and undocumented setup scripts. How would you manage the configuration?","vi":"Ứng dụng Claude của bạn được triển khai vào môi trường phát triển, dàn dựng và sản xuất. Mỗi môi trường sử dụng một phiên bản mô hình khác nhau, các phiên bản nhắc nhở khác nhau và các phần phụ thuộc plugin khác nhau, nhưng cấu hình hiện nằm rải rác trên các biến môi trường, giá trị được mã hóa cứng và tập lệnh thiết lập không có giấy tờ. Bạn sẽ quản lý cấu hình như thế nào?","jp":"Claude アプリケーションは、開発環境、ステージング環境、実稼働環境にデプロイされます。各環境では、異なるモデル バージョン、異なるプロンプト バージョン、および異なるプラグインの依存関係が使用されますが、現在、設定は環境変数、ハードコードされた値、および文書化されていないセットアップ スクリプトに分散しています。構成をどのように管理しますか?"},"options":[{"k":"A","t":{"en":"Use the latest available model version everywhere and stop pinning model versions, on the grounds that pinning adds maintenance overhead the team should aim to reduce.","vi":"Sử dụng phiên bản mô hình mới nhất hiện có ở mọi nơi và ngừng ghim các phiên bản mô hình, với lý do việc ghim sẽ làm tăng thêm chi phí bảo trì mà nhóm nên đặt mục tiêu giảm bớt.","jp":"どこでも利用可能な最新のモデル バージョンを使用し、モデル バージョンの固定を停止します。これは、チームが削減を目指すべきメンテナンスのオーバーヘッドが固定によって追加されるためです。"}},{"k":"B","t":{"en":"Move all configuration into hardcoded application code to reduce reliance on external configuration sources that are difficult to track over time.","vi":"Chuyển tất cả cấu hình sang mã ứng dụng được mã hóa cứng để giảm sự phụ thuộc vào các nguồn cấu hình bên ngoài khó theo dõi theo thời gian.","jp":"すべての構成をハードコードされたアプリケーション コードに移動して、時間の経過とともに追跡するのが困難な外部構成ソースへの依存を軽減します。"}},{"k":"C","t":{"en":"Consolidate the configuration into a version-controlled system documenting model version pinning, prompt versioning, and plugin dependencies for each environment.","vi":"Hợp nhất cấu hình thành ghim phiên bản mô hình tài liệu hệ thống được kiểm soát theo phiên bản, lập phiên bản nhắc nhở và phần phụ thuộc plugin cho từng môi trường.","jp":"構成をバージョン管理されたシステムに統合し、各環境のモデルのバージョンの固定、プロンプトのバージョン管理、およびプラグインの依存関係を文書化します。"}},{"k":"D","t":{"en":"Standardize all environments to use the same configuration values to eliminate the differences between development, staging, and production.","vi":"Chuẩn hóa tất cả các môi trường để sử dụng cùng một giá trị cấu hình nhằm loại bỏ sự khác biệt giữa phát triển, dàn dựng và sản xuất.","jp":"すべての環境を標準化して同じ構成値を使用し、開発、ステージング、実稼働間の違いを排除します。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Ba môi trường có cấu hình khác nhau là hợp lý, vấn đề nằm ở chỗ cấu hình <b>phân tán và không có tài liệu</b>. Cách đúng là <b>hợp nhất cấu hình vào một hệ thống quản lý phiên bản</b>, ghi rõ cho từng môi trường: <b>pin phiên bản model</b>, <b>phiên bản prompt</b> và <b>phụ thuộc plugin</b>. Nhờ đó mọi thay đổi đều được review, truy vết, tái lập và rollback được, và có thể nâng cấp có kiểm soát từ dev lên staging rồi production.","elim":["<b>A.</b> Bỏ pin model và luôn dùng bản mới nhất khiến hành vi thay đổi ngoài ý muốn, không tái lập được kết quả và không kiểm thử trước được ở staging.","<b>B.</b> Hardcode cấu hình vào code làm mất khả năng cấu hình theo môi trường và trộn lẫn cấu hình với logic; không giải quyết việc thiếu tài liệu.","<b>D.</b> Ép mọi môi trường dùng cùng giá trị làm mất mục đích của dev/staging (thử phiên bản mới trước khi lên production)."]}},{"id":"ccdvf-q078","n":78,"topic":1,"type":"mcq","stem":{"en":"Your team uses several plugins across multiple Claude applications, and a recent plugin update introduced a regression. The team had not been tracking plugin versions, so the team cannot easily identify which version was previously working. How would you address this?","vi":"Nhóm của bạn sử dụng một số plugin trên nhiều ứng dụng Claude và bản cập nhật plugin gần đây đã đưa ra hiện tượng hồi quy. Nhóm chưa theo dõi các phiên bản plugin nên nhóm không thể dễ dàng xác định phiên bản nào trước đây đã hoạt động. Bạn sẽ giải quyết vấn đề này như thế nào?","jp":"あなたのチームは複数の Claude アプリケーションで複数のプラグインを使用していますが、最近のプラグインの更新により回帰が発生しました。チームはプラグインのバージョンを追跡していなかったので、どのバージョンが以前に動作していたのかを簡単に特定することができません。これについてはどう対処しますか?"},"options":[{"k":"A","t":{"en":"Stop using all plugins until the team can rebuild equivalent functionality directly into the application code, treating plugin avoidance as a way to remove version-related risk.","vi":"Ngừng sử dụng tất cả các plugin cho đến khi nhóm có thể xây dựng lại chức năng tương đương trực tiếp vào mã ứng dụng, coi việc tránh plugin là một cách để loại bỏ rủi ro liên quan đến phiên bản.","jp":"チームが同等の機能をアプリケーション コードに直接再構築できるようになるまで、すべてのプラグインの使用を停止し、プラグインの回避をバージョン関連のリスクを取り除く方法として扱います。"}},{"k":"B","t":{"en":"Add explicit plugin version tracking to the project's configuration so the team can identify, pin, and upgrade plugin versions deliberately.","vi":"Thêm tính năng theo dõi phiên bản plugin rõ ràng vào cấu hình của dự án để nhóm có thể xác định, ghim và nâng cấp các phiên bản plugin một cách có chủ ý.","jp":"明示的なプラグイン バージョン追跡をプロジェクトの設定に追加して、チームがプラグイン バージョンを意図的に特定、固定、アップグレードできるようにします。"}},{"k":"C","t":{"en":"Treat plugins as untrackable third-party code and rely on plugin authors to communicate breaking changes when they happen, with no internal version tracking.","vi":"Hãy coi các plugin là mã của bên thứ ba không thể theo dõi và dựa vào tác giả plugin để thông báo những thay đổi đáng chú ý khi chúng xảy ra mà không cần theo dõi phiên bản nội bộ.","jp":"プラグインを追跡できないサードパーティのコードとして扱い、重大な変更が発生した場合に内部バージョン追跡なしでプラグインの作成者に通知します。"}},{"k":"D","t":{"en":"Upgrade every plugin to the latest version on a regular cadence to keep version drift small, on the grounds that drift contributes to regression risk.","vi":"Nâng cấp mọi plugin lên phiên bản mới nhất theo tần suất đều đặn để giữ cho độ lệch phiên bản nhỏ, với lý do độ lệch phiên bản góp phần gây ra rủi ro hồi quy.","jp":"バージョンの変動は回帰リスクの一因となるため、すべてのプラグインを定期的に最新バージョンにアップグレードして、バージョンの変動を小さく保ちます。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Nguyên nhân gốc của việc không tìm được phiên bản plugin từng chạy tốt là <b>thiếu theo dõi phiên bản</b>. Cách khắc phục là <b>ghi rõ phiên bản plugin trong cấu hình dự án</b> (được version control), để nhóm có thể <b>xác định</b> phiên bản đang dùng, <b>pin</b> lại phiên bản ổn định khi có regression và <b>nâng cấp có chủ đích</b> sau khi kiểm thử. Đây là thực hành quản lý dependency chuẩn.","elim":["<b>A.</b> Bỏ hết plugin và tự viết lại là phản ứng thái quá, tốn công và đánh mất giá trị của plugin chỉ vì thiếu quản lý phiên bản.","<b>C.</b> Phó mặc cho tác giả plugin thông báo breaking change là bị động; không có tracking nội bộ thì vẫn không biết bản nào từng hoạt động.","<b>D.</b> Luôn nâng lên bản mới nhất định kỳ làm tăng nguy cơ regression như vừa xảy ra và vẫn không cho phép rollback có kiểm soát."]}},{"id":"ccdvf-q079","n":79,"topic":1,"type":"mcq","stem":{"en":"A teammate is debugging a Claude application whose system prompt has grown to several hundred lines and now contains overlapping, contradictory, and obsolete instructions. How would you advise the teammate?","vi":"Một đồng đội đang gỡ lỗi ứng dụng Claude có dấu nhắc hệ thống đã tăng lên hàng trăm dòng và hiện chứa các hướng dẫn chồng chéo, mâu thuẫn và lỗi thời. Bạn sẽ khuyên đồng đội như thế nào?","jp":"チームメイトがクロード アプリケーションをデバッグしています。そのシステム プロンプトは数百行に達し、重複した、矛盾した、時代遅れの命令が含まれています。チームメイトにどのようにアドバイスしますか?"},"options":[{"k":"A","t":{"en":"Add more explicit instructions so the most recent rules dominate the model's interpretation of the prompt during each request.","vi":"Thêm các hướng dẫn rõ ràng hơn để các quy tắc gần đây nhất chi phối việc giải thích lời nhắc của mô hình trong mỗi yêu cầu.","jp":"より明示的な命令を追加して、各リクエスト中のプロンプトのモデルの解釈に最新のルールが優先されるようにします。"}},{"k":"B","t":{"en":"Audit the prompt for overlap, contradiction, and obsolete content, then refactor so each instruction is clear, current, and non-redundant.","vi":"Kiểm tra lời nhắc về nội dung trùng lặp, mâu thuẫn và lỗi thời, sau đó cấu trúc lại để mỗi hướng dẫn đều rõ ràng, cập nhật và không dư thừa.","jp":"プロンプトの重複、矛盾、古くなった内容を監査し、各指示が明確で最新のものになり、冗長性がなくなるようにリファクタリングします。"}},{"k":"C","t":{"en":"Tighten only the contradictory rules first, treating the overlap and obsolete content as lower-priority work the team can address later.","vi":"Trước tiên, chỉ thắt chặt các quy tắc mâu thuẫn, coi nội dung trùng lặp và lỗi thời là công việc có mức độ ưu tiên thấp hơn mà nhóm có thể giải quyết sau.","jp":"最初に矛盾するルールのみを強化し、重複するコンテンツや古くなったコンテンツは、チームが後で対応できる優先度の低い作業として扱います。"}},{"k":"D","t":{"en":"Split the prompt across multiple system prompts so the model sees a smaller portion at any given time.","vi":"Chia lời nhắc thành nhiều lời nhắc hệ thống để mô hình nhìn thấy phần nhỏ hơn tại bất kỳ thời điểm nào.","jp":"プロンプトを複数のシステム プロンプトに分割して、モデルが常に表示する部分を少なくします。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> System prompt dài hàng trăm dòng với chỉ dẫn <b>chồng lấn, mâu thuẫn và lỗi thời</b> khiến mô hình không biết ưu tiên quy tắc nào và hành vi trở nên khó đoán. Cách đúng là <b>audit toàn bộ</b> prompt để tìm ba loại vấn đề này, rồi <b>refactor</b> sao cho mỗi chỉ dẫn rõ ràng, còn hiệu lực và không trùng lặp, sau đó kiểm chứng bằng eval. Prompt gọn, nhất quán dễ debug và dễ bảo trì hơn.","elim":["<b>A.</b> Thêm chỉ dẫn mới chồng lên làm prompt dài và mâu thuẫn hơn; mô hình không mặc định ưu tiên quy tắc “mới nhất”.","<b>C.</b> Chỉ sửa phần mâu thuẫn bỏ lại nội dung lỗi thời và trùng lặp vẫn gây nhiễu và có thể tái tạo mâu thuẫn; nên dọn dẹp toàn diện.","<b>D.</b> Một request chỉ có một system prompt; chia nhỏ để mô hình thấy từng phần không giải quyết mâu thuẫn mà còn làm mất chỉ dẫn cần thiết."]},"cite":"Hướng dẫn ôn tập — §6.2 Tiêu chí rõ ràng so với chỉ dẫn mơ hồ; Lĩnh vực 4.1"},{"id":"ccdvf-q080","n":80,"topic":1,"type":"mcq","stem":{"en":"You are designing a Claude application that will process customer support tickets in two stages: a triage stage that classifies tickets and a response stage that drafts replies. The team is debating whether to use a single Claude call that handles both stages or separate Claude calls for each stage. How would you structure the application?","vi":"Bạn đang thiết kế một ứng dụng Claude sẽ xử lý các phiếu hỗ trợ khách hàng theo hai giai đoạn: giai đoạn phân loại để phân loại các phiếu và giai đoạn phản hồi soạn thảo các câu trả lời. Nhóm đang tranh luận về việc nên sử dụng một lệnh gọi Claude duy nhất để xử lý cả hai giai đoạn hay các lệnh gọi Claude riêng biệt cho từng giai đoạn. Bạn sẽ cấu trúc ứng dụng như thế nào?","jp":"あなたは、カスタマー サポート チケットを 2 つの段階で処理する Claude アプリケーションを設計しています。1 つはチケットを分類するトリアージ ステージ、もう 1 つは返信の下書きを行う応答ステージです。チームは、両方のステージを処理する単一のクロード呼び出しを使用するか、ステージごとに個別のクロード呼び出しを使用するかを議論しています。アプリケーションをどのように構成しますか?"},"options":[{"k":"A","t":{"en":"Use a single Claude call for triage and then use a non-Claude rule-based system for response generation, on the grounds that rule-based systems are more reliable for drafting replies.","vi":"Sử dụng một lệnh gọi Claude duy nhất để phân loại và sau đó sử dụng hệ thống dựa trên quy tắc không phải Claude để tạo phản hồi, với lý do các hệ thống dựa trên quy tắc đáng tin cậy hơn để soạn thảo các câu trả lời.","jp":"トリアージには単一のクロード コールを使用し、その後、応答の生成には非クロード ルールベースのシステムを使用します。これは、ルールベースのシステムの方が返信の草案作成には信頼性が高いためです。"}},{"k":"B","t":{"en":"Use multiple Claude calls in parallel that each draft a complete ticket reply, then have a fourth Claude call select the best one to send to the customer.","vi":"Sử dụng song song nhiều cuộc gọi Claude để mỗi cuộc soạn thảo một câu trả lời yêu cầu hoàn chỉnh, sau đó thực hiện cuộc gọi thứ tư của Claude, chọn cuộc gọi tốt nhất để gửi cho khách hàng.","jp":"複数のクロード コールを並行して使用し、それぞれが完全なチケット返信を作成し、4 回目のクロード コールで顧客に送信する最適なチケットを選択します。"}},{"k":"C","t":{"en":"Use separate Claude calls for triage and response, because each stage has distinct inputs, outputs, and success criteria that benefit from focused prompts.","vi":"Sử dụng các lệnh gọi Claude riêng biệt để phân loại và phản hồi vì mỗi giai đoạn có đầu vào, đầu ra và tiêu chí thành công riêng biệt được hưởng lợi từ các lời nhắc tập trung.","jp":"各ステージには個別の入力、出力、および集中的なプロンプトの恩恵を受ける成功基準があるため、トリアージと対応には個別のクロード コールを使用します。"}},{"k":"D","t":{"en":"Use a single Claude call for both stages, on the grounds that a single call is cheaper than multiple calls in any production Claude application setup.","vi":"Sử dụng một cuộc gọi Claude duy nhất cho cả hai giai đoạn, với lý do một cuộc gọi sẽ rẻ hơn nhiều cuộc gọi trong bất kỳ thiết lập ứng dụng Claude sản xuất nào.","jp":"クロード アプリケーションの実稼働セットアップでは、単一の呼び出しの方が複数の呼び出しよりもコストが低いため、両方のステージで単一のクロード呼び出しを使用します。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Triage (phân loại) và soạn phản hồi là hai bước có <b>đầu vào, đầu ra và tiêu chí thành công khác nhau</b>, nên tách thành <b>các lời gọi Claude riêng</b> theo kiểu prompt chaining. Mỗi prompt tập trung vào một việc nên chất lượng cao hơn, đầu ra triage có cấu trúc có thể được validate và dùng để định tuyến/chọn ngữ cảnh cho bước phản hồi, và mỗi bước được đánh giá, debug, tối ưu (thậm chí chọn model khác nhau) độc lập.","elim":["<b>A.</b> Dùng hệ thống rule-based để soạn phản hồi bỏ phí điểm mạnh của Claude ở việc sinh ngôn ngữ tự nhiên; khẳng định rule-based “tin cậy hơn” cho việc soạn thư là không có cơ sở.","<b>B.</b> Sinh nhiều bản nháp song song rồi chọn bản tốt nhất làm tăng chi phí và vẫn bỏ qua việc tách riêng bước triage.","<b>D.</b> “Một lời gọi luôn rẻ hơn” là khái quát sai và bỏ qua chất lượng; gộp hai nhiệm vụ khác bản chất vào một prompt gây loãng chú ý và khó kiểm soát."]},"cite":"Hướng dẫn ôn tập — §6.3 Prompt Chaining; §8.1 Pipeline cố định (Prompt Chaining)"},{"id":"ccdvf-q081","n":81,"topic":1,"type":"mcq","stem":{"en":"You are configuring Claude Code for a new project. The team needs to set permissions, default model selections, and environment-specific behavior at the project level so the configuration is consistent across all developers working on the repository. The Claude Code mechanism you would use is...","vi":"Bạn đang định cấu hình Mã Claude cho một dự án mới. Nhóm cần đặt quyền, lựa chọn mô hình mặc định và hành vi dành riêng cho môi trường ở cấp dự án để cấu hình nhất quán trên tất cả các nhà phát triển làm việc trên kho lưu trữ. Cơ chế Mã Claude bạn sẽ sử dụng là...","jp":"新しいプロジェクト用にクロード コードを構成しています。チームは、リポジトリで作業するすべての開発者間で構成が一貫しているように、プロジェクト レベルで権限、デフォルトのモデル選択、および環境固有の動作を設定する必要があります。使用するクロード コードのメカニズムは次のとおりです..."},"options":[{"k":"A","t":{"en":"A shared spreadsheet that lists configuration values for team members to reference and update by hand as the project evolves.","vi":"Một bảng tính được chia sẻ liệt kê các giá trị cấu hình để các thành viên trong nhóm tham khảo và cập nhật thủ công khi dự án phát triển.","jp":"プロジェクトの進行に合わせてチーム メンバーが手動で参照および更新できる構成値をリストした共有スプレッドシート。"}},{"k":"B","t":{"en":"Environment variables that each developer sets on their own machine when working with Claude Code on the project.","vi":"Các biến môi trường mà mỗi nhà phát triển đặt trên máy riêng của họ khi làm việc với Claude Code trong dự án.","jp":"プロジェクトでクロード コードを使用するときに、各開発者が自分のマシンに設定する環境変数。"}},{"k":"C","t":{"en":"A system prompt embedded in every Claude Code conversation by each developer at the start of every session in the project.","vi":"Lời nhắc hệ thống được mỗi nhà phát triển nhúng vào mỗi cuộc trò chuyện về Claude Code khi bắt đầu mỗi phiên trong dự án.","jp":"プロジェクトのすべてのセッションの開始時に、各開発者によるすべてのクロード コードの会話にシステム プロンプトが埋め込まれます。"}},{"k":"D","t":{"en":"The settings.json file, scoped at the project level so the configuration applies consistently across developers and persists with the repository.","vi":"Tệp settings.json, nằm trong phạm vi cấp dự án để cấu hình được áp dụng nhất quán giữa các nhà phát triển và tồn tại với kho lưu trữ.","jp":"settings.json ファイル。プロジェクト レベルでスコープ設定されているため、構成は開発者間で一貫して適用され、リポジトリに保持されます。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Claude Code dùng file <code>settings.json</code> để cấu hình <b>permissions</b>, model mặc định, biến môi trường, hooks... Khi đặt ở <b>cấp dự án</b> (<code>.claude/settings.json</code> trong repo) và commit vào version control, cấu hình được <b>chia sẻ nhất quán cho mọi developer</b> và đi cùng repository; thiết lập cá nhân thì để ở <code>.claude/settings.local.json</code> hoặc <code>~/.claude/settings.json</code>.","elim":["<b>A.</b> Bảng tính dùng chung chỉ là tài liệu tham khảo thủ công, Claude Code không đọc nó nên không áp dụng được cấu hình.","<b>B.</b> Biến môi trường do từng dev tự đặt trên máy mình dễ lệch nhau, không đi cùng repo và không đảm bảo nhất quán.","<b>C.</b> Tự dán system prompt mỗi session là thủ công, dễ quên và không thể cấu hình permissions hay model theo cách có hiệu lực thật."]}},{"id":"ccdvf-q082","n":82,"topic":1,"type":"mcq","stem":{"en":"A Claude application is occasionally refusing to answer questions that should be in scope, including questions the application has answered correctly in the past. You want to investigate. What is the first step of your investigation?","vi":"Ứng dụng Claude đôi khi từ chối trả lời các câu hỏi nằm trong phạm vi áp dụng, bao gồm cả các câu hỏi mà ứng dụng đã trả lời đúng trong quá khứ. Bạn muốn điều tra. Bước đầu tiên của cuộc điều tra của bạn là gì?","jp":"Claude アプリケーションは、アプリケーションが過去に正しく回答した質問など、範囲内であるはずの質問への回答を拒否することがあります。調査したいと考えています。調査の最初のステップは何ですか?"},"options":[{"k":"A","t":{"en":"Test whether removing or adjusting those instructions resolves the behavior.","vi":"Kiểm tra xem việc loại bỏ hoặc điều chỉnh các hướng dẫn đó có giải quyết được hành vi hay không.","jp":"これらの命令を削除または調整することで動作が解決されるかどうかをテストします。"}},{"k":"B","t":{"en":"Examine traces of the refused requests to identify what triggers the refusal, whether input patterns, system prompt content, or other context.","vi":"Kiểm tra dấu vết của các yêu cầu bị từ chối để xác định nguyên nhân gây ra tình trạng từ chối, cho dù đó là mẫu đầu vào, nội dung lời nhắc của hệ thống hay bối cảnh khác.","jp":"拒否されたリクエストのトレースを調べて、入力パターン、システム プロンプトの内容、その他のコンテキストなど、拒否のトリガーとなったものを特定します。"}},{"k":"C","t":{"en":"Assess whether the refusals cluster around specific input patterns, question types, or time periods by analyzing the distribution of refused requests in the logs.","vi":"Đánh giá xem các từ chối có tập hợp xung quanh các mẫu đầu vào, loại câu hỏi hoặc khoảng thời gian cụ thể hay không bằng cách phân tích việc phân bổ các yêu cầu bị từ chối trong nhật ký.","jp":"ログ内の拒否されたリクエストの分布を分析することで、拒否が特定の入力パターン、質問の種類、または期間に集中しているかどうかを評価します。"}},{"k":"D","t":{"en":"Identify which questions have been refused and compare them against previously answered questions to determine what changed between the successful and refused interactions.","vi":"Xác định những câu hỏi nào đã bị từ chối và so sánh chúng với những câu hỏi đã trả lời trước đó để xác định điều gì đã thay đổi giữa các tương tác thành công và bị từ chối.","jp":"どの質問が拒否されたかを特定し、以前に回答した質問と比較して、成功したインタラクションと拒否されたインタラクションの間で何が変わったのかを判断します。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Bước đầu tiên khi điều tra việc từ chối bất thường là <b>xem trace của chính các request bị từ chối</b>: toàn bộ input, system prompt, context đi kèm (lịch sử, kết quả tool, tài liệu truy xuất) và phản hồi. Trace cho thấy <b>điều gì thực sự kích hoạt</b> việc từ chối (mẫu đầu vào, nội dung system prompt hay context khác) trước khi đặt giả thuyết và thử sửa. Đây là cách chẩn đoán dựa trên bằng chứng.","elim":["<b>A.</b> Thử bỏ hoặc chỉnh “các chỉ dẫn đó” là bước sửa, đi trước khi biết chỉ dẫn nào gây ra vấn đề; phải chẩn đoán qua trace trước.","<b>C.</b> Phân tích phân bố thống kê trong log hữu ích nhưng chỉ cho biết tương quan bề mặt, không cho thấy nội dung cụ thể trong context đã kích hoạt từ chối như trace.","<b>D.</b> So sánh danh sách câu hỏi bị từ chối và đã trả lời chỉ nhìn vào câu hỏi, bỏ qua system prompt và context thực tế mà trace mới phơi bày đầy đủ."]}},{"id":"ccdvf-q083","n":83,"topic":1,"type":"mcq","stem":{"en":"You are extending a Claude agent with a capability that needs to be reusable across multiple teams in the organization, with each team able to invoke and use it independently. How would you build the capability?","vi":"Bạn đang mở rộng một tác nhân Claude với khả năng cần được tái sử dụng cho nhiều nhóm trong tổ chức, trong đó mỗi nhóm có thể gọi và sử dụng nó một cách độc lập. Bạn sẽ xây dựng năng lực bằng cách nào?","jp":"クロード エージェントを、組織内の複数のチーム間で再利用できる機能で拡張し、各チームが独立して呼び出して使用できるようにします。どのようにして能力を構築しますか?"},"options":[{"k":"A","t":{"en":"As a custom tool embedded in this team's agent only, with other teams able to copy the implementation into their own agents when they need the capability.","vi":"Là một công cụ tùy chỉnh chỉ được nhúng trong tổng đài viên của nhóm này, các nhóm khác có thể sao chép quá trình triển khai vào tổng đài viên của chính họ khi họ cần khả năng này.","jp":"このチームのエージェントのみに埋め込まれたカスタム ツールとして、他のチームは機能が必要なときに実装を自分のエージェントにコピーできます。"}},{"k":"B","t":{"en":"As a shared library that each team imports into its own Claude application code, with each team responsible for keeping the library up to date in its integration.","vi":"Là một thư viện dùng chung mà mỗi nhóm nhập vào mã ứng dụng Claude của riêng mình, mỗi nhóm chịu trách nhiệm cập nhật thư viện trong quá trình tích hợp.","jp":"各チームが独自のクロード アプリケーション コードにインポートする共有ライブラリとして、各チームは統合時にライブラリを最新の状態に保つ責任があります。"}},{"k":"C","t":{"en":"As a Skill or MCP server because both are purpose-built for cross-team reuse independently by each consuming team.","vi":"Là máy chủ Skill hoặc MCP vì cả hai đều được xây dựng nhằm mục đích tái sử dụng giữa các nhóm một cách độc lập bởi mỗi nhóm tiêu dùng.","jp":"スキルサーバーまたは MCP サーバーとして。両方とも、使用する各チームが独立してチーム間で再利用できるように専用に構築されているためです。"}},{"k":"D","t":{"en":"As a wrapper around an existing built-in tool that adds the missing functionality, on the grounds that built-in tools cover the reuse pattern when extended carefully.","vi":"Là một trình bao bọc xung quanh một công cụ tích hợp sẵn có bổ sung chức năng còn thiếu, với lý do là các công cụ tích hợp sẽ bao gồm mẫu tái sử dụng khi được mở rộng một cách cẩn thận.","jp":"既存の組み込みツールのラッパーとして、不足している機能を追加します。これは、組み込みツールが慎重に拡張した場合に再利用パターンをカバーするためです。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Khi một năng lực cần được <b>tái sử dụng bởi nhiều nhóm</b>, mỗi nhóm gọi và dùng độc lập, nên đóng gói nó thành <b>Skill</b> hoặc <b>MCP server</b>. Skill đóng gói hướng dẫn và script thành gói có thể chia sẻ, được nạp theo nhu cầu; MCP server cung cấp tool/resource qua <b>giao thức chuẩn</b> mà bất kỳ client tương thích nào cũng kết nối được. Cả hai được thiết kế để tách năng lực khỏi một agent cụ thể và phân phối rộng.","elim":["<b>A.</b> Custom tool nhúng trong một agent rồi để nhóm khác copy code tạo ra nhiều bản sao rời rạc, khó cập nhật và dễ lệch nhau.","<b>B.</b> Thư viện dùng chung buộc mỗi nhóm tích hợp vào code và tự cập nhật, gắn chặt với ngôn ngữ/stack và không phải cơ chế mở rộng agent chuẩn như Skill/MCP.","<b>D.</b> Built-in tool không được thiết kế để người dùng mở rộng hay chia sẻ; bọc quanh chúng không tạo ra cơ chế tái sử dụng liên nhóm."]},"cite":"Hướng dẫn ôn tập — §5.5 Skill — .claude/skills/; §4.2 MCP Server"},{"id":"ccdvf-q084","n":84,"topic":1,"type":"mcq","stem":{"en":"A teammate has asked you to explain why your Claude agent's tools include detailed descriptions in the tool definition, even when the tool name is already descriptive. The teammate suggests removing the descriptions to simplify the tool definitions. How would you respond?","vi":"Một đồng đội đã yêu cầu bạn giải thích lý do tại sao các công cụ của đặc vụ Claude của bạn lại bao gồm các mô tả chi tiết trong định nghĩa công cụ, ngay cả khi tên công cụ đã mang tính mô tả. Đồng đội đề nghị loại bỏ các mô tả để đơn giản hóa các định nghĩa công cụ. Bạn sẽ trả lời thế nào?","jp":"チームメイトから、ツール名がすでに説明的である場合でも、クロード エージェントのツールのツール定義に詳細な説明が含まれている理由を説明してほしいと頼まれました。チームメイトは、ツールの定義を簡素化するために説明を削除することを提案しました。あなたならどう答えますか？"},"options":[{"k":"A","t":{"en":"Suggest replacing the descriptions with example calls embedded in the tool definition, treating example calls as a complete substitute for the prose description.","vi":"Đề xuất thay thế các mô tả bằng các lệnh gọi mẫu được nhúng trong định nghĩa công cụ, coi các lệnh gọi mẫu là sự thay thế hoàn toàn cho mô tả văn xuôi.","jp":"説明をツール定義に埋め込まれた呼び出し例に置き換え、呼び出し例を散文的な説明の完全な代替品として扱うことを提案します。"}},{"k":"B","t":{"en":"Agree with the teammate because tool names are sufficient for the model to choose the right tool on every request the agent handles.","vi":"Đồng ý với đồng đội vì tên tool đủ để model lựa chọn tool phù hợp cho mọi yêu cầu mà Agent xử lý.","jp":"モデルがエージェントが処理するすべてのリクエストに対して適切なツールを選択するには、ツール名があれば十分であるため、チームメイトの意見に同意します。"}},{"k":"C","t":{"en":"Explain that the model uses the tool description to decide when to call the tool, and descriptions disambiguate cases where the tool name is not enough.","vi":"Giải thích rằng mô hình sử dụng mô tả công cụ để quyết định thời điểm gọi công cụ và mô tả sẽ phân biệt các trường hợp tên công cụ không đủ.","jp":"モデルはツールの説明を使用してツールを呼び出すタイミングを決定し、ツール名では不十分な場合の曖昧さを説明によって明確にすることを説明します。"}},{"k":"D","t":{"en":"Suggest moving the descriptions out of the tool definition and into a separate documentation file the team maintains so the tool definitions stay short and the descriptions remain available.","vi":"Đề xuất chuyển các mô tả ra khỏi định nghĩa công cụ và vào một tệp tài liệu riêng biệt mà nhóm duy trì để các định nghĩa công cụ luôn ngắn gọn và các mô tả vẫn có sẵn.","jp":"説明をツール定義から移動し、チームが管理する別のドキュメント ファイルに移動することを提案します。これにより、ツール定義は短くなり、説明は引き続き利用できるようになります。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> <b>Phần mô tả tool là cơ chế lựa chọn chính</b>: mô hình đọc <code>description</code> để quyết định <b>khi nào</b> gọi tool và gọi với tham số nào. Tên tool dù rõ nghĩa vẫn không nói được tool trả về gì, định dạng đầu vào, edge case, ràng buộc và khi nào dùng tool này thay vì tool tương tự. Bỏ mô tả sẽ khiến mô hình nhầm lẫn khi các tool chồng lấn nhau.","elim":["<b>A.</b> Ví dụ gọi tool có thể bổ sung nhưng không thay thế hoàn toàn mô tả bằng lời về mục đích, ràng buộc và khi nào nên dùng.","<b>B.</b> Tên tool không đủ để mô hình luôn chọn đúng, đặc biệt khi có nhiều tool có chức năng gần nhau.","<b>D.</b> Mô hình chỉ thấy những gì nằm trong định nghĩa tool được gửi kèm request; chuyển mô tả sang file tài liệu riêng thì mô hình không còn đọc được."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"ccdvf-q085","n":85,"topic":1,"type":"mcq","stem":{"en":"You are designing an agent that handles a multi-step research task. You want the agent to break the task into smaller pieces, hand each piece to a focused subagent, and consolidate the results. The agent pattern you would apply is...","vi":"Bạn đang thiết kế một tác nhân xử lý một nhiệm vụ nghiên cứu gồm nhiều bước. Bạn muốn nhân viên hỗ trợ chia nhiệm vụ thành các phần nhỏ hơn, giao từng phần cho một nhân viên phụ tập trung và tổng hợp kết quả. Mẫu
