đại lý bạn sẽ áp dụng là...","jp":"あなたは、複数ステップの調査タスクを処理するエージェントを設計しています。エージェントがタスクを小さな部分に分割し、各部分を重点を置いたサブエージェントに渡し、結果を統合するようにしたいと考えています。適用するエージェント パターンは次のとおりです。"},"options":[{"k":"A","t":{"en":"An orchestrator and subagent pattern with specialized subagents assigned to each subtask.","vi":"Một mẫu điều phối và tác nhân phụ với các tác nhân phụ chuyên biệt được gán cho mỗi nhiệm vụ phụ.","jp":"各サブタスクに割り当てられた特殊なサブエージェントを含むオーケストレーターとサブエージェントのパターン。"}},{"k":"B","t":{"en":"A memory pattern that stores the entire research history in advance, before any subtask begins execution.","vi":"Một mẫu bộ nhớ lưu trữ trước toàn bộ lịch sử nghiên cứu trước khi bất kỳ nhiệm vụ con nào bắt đầu thực hiện.","jp":"サブタスクの実行が開始される前に、研究履歴全体を事前に保存するメモリ パターン。"}},{"k":"C","t":{"en":"A context-window pruning pattern that drops each subtask's content after the agent moves on.","vi":"Mẫu cắt bớt cửa sổ ngữ cảnh sẽ loại bỏ nội dung của từng nhiệm vụ con sau khi tác nhân tiếp tục.","jp":"エージェントが先に進んだ後に各サブタスクのコンテンツを削除するコンテキスト ウィンドウのプルーニング パターン。"}},{"k":"D","t":{"en":"A single tool-use loop that includes every tool the agent might need across all subtasks.","vi":"Một vòng lặp sử dụng công cụ duy nhất bao gồm mọi công cụ mà tác nhân có thể cần trong tất cả các nhiệm vụ phụ.","jp":"すべてのサブタスクにわたってエージェントが必要とする可能性のあるすべてのツールを含む、単一のツール使用ループ。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Yêu cầu “chia nhỏ tác vụ, giao mỗi phần cho một subagent tập trung, rồi tổng hợp kết quả” mô tả đúng mẫu <b>orchestrator–subagent</b> (hub-and-spoke). Orchestrator/coordinator phân rã tác vụ, giao việc cho các <b>subagent chuyên biệt</b> với context tách biệt và chỉ các tool cần thiết, sau đó tổng hợp và kiểm tra kết quả.","elim":["<b>B.</b> Mẫu bộ nhớ lưu sẵn toàn bộ lịch sử nghiên cứu trước khi bắt đầu là vô lý (lịch sử chưa tồn tại) và không phải cơ chế phân rã/ủy quyền.","<b>C.</b> Cắt tỉa context là kỹ thuật quản lý context, không phải mẫu phân rã và giao việc cho subagent; còn có thể làm mất kết quả cần tổng hợp.","<b>D.</b> Một vòng lặp tool-use duy nhất với mọi tool là kiến trúc agent đơn, trái với yêu cầu giao từng phần cho subagent tập trung, và nhiều tool làm giảm độ chính xác chọn tool."]},"cite":"Hướng dẫn ôn tập — §3.3 Hub-and-Spoke: Coordinator và Subagent; Lĩnh vực 1.2"},{"id":"ccdvf-q086","n":86,"topic":1,"type":"mcq","stem":{"en":"You are establishing the guardrail strategy for a Claude application. The team wants to ensure guardrail failure does not expose the application to unsafe behavior. The guardrail strategy would...","vi":"Bạn đang thiết lập chiến lược lan can cho ứng dụng Claude. Nhóm muốn đảm bảo rằng sự cố lan can không khiến ứng dụng gặp phải hành vi không an toàn. Chiến lược lan can sẽ...","jp":"クロード アプリケーションのガードレール戦略を確立しています。チームは、ガードレールの障害によってアプリケーションが危険な動作にさらされないようにしたいと考えています。ガードレール戦略は..."},"options":[{"k":"A","t":{"en":"Layer multiple guardrails so a single guardrail failure does not expose the application to unsafe behavior.","vi":"Xếp nhiều lớp lan can để một lỗi lan can duy nhất không khiến ứng dụng gặp phải hành vi không an toàn.","jp":"単一のガードレールの障害によってアプリケーションが危険な動作にさらされないように、複数のガードレールを階層化します。"}},{"k":"B","t":{"en":"Apply guardrails at the application output level only and route flagged responses to a human reviewer before they are delivered to the user.","vi":"Chỉ áp dụng các biện pháp bảo vệ ở cấp đầu ra của ứng dụng và định tuyến các phản hồi được gắn cờ cho người đánh giá trước khi chúng được gửi đến người dùng.","jp":"アプリケーション出力レベルでのみガードレールを適用し、フラグ付きの応答をユーザーに配信する前に人間のレビュー担当者にルーティングします。"}},{"k":"C","t":{"en":"Implement a single comprehensive system prompt guardrail and validate its coverage against the application's full range of expected inputs.","vi":"Triển khai một lan can nhắc nhở hệ thống toàn diện duy nhất và xác thực phạm vi bao phủ của nó dựa trên đầy đủ các thông tin đầu vào dự kiến ​​của ứng dụng.","jp":"単一の包括的なシステム プロンプト ガードレールを実装し、アプリケーションの予想される入力の全範囲に対してそのカバレッジを検証します。"}},{"k":"D","t":{"en":"Apply guardrails at the model level only and rely on the model's built-in safety behaviors to handle any cases the guardrail does not explicitly cover.","vi":"Chỉ áp dụng lan can ở cấp độ mô hình và dựa vào hành vi an toàn tích hợp của mô hình để xử lý mọi trường hợp mà lan can không đề cập rõ ràng.","jp":"ガードレールはモデル レベルでのみ適用し、モデルに組み込まれた安全動作に依存して、ガードレールが明示的にカバーしないケースを処理します。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Yêu cầu là “một guardrail thất bại không được làm lộ hành vi không an toàn”, tức là cần <b>phòng thủ nhiều lớp (defense in depth)</b>. Kết hợp nhiều guardrail độc lập như kiểm tra/lọc đầu vào, chỉ dẫn trong system prompt, giới hạn quyền tool, kiểm tra đầu ra xác định trước khi trả về và giám sát, để khi một lớp bị vượt qua thì các lớp khác vẫn chặn được.","elim":["<b>B.</b> Chỉ đặt guardrail ở tầng đầu ra là một lớp duy nhất; nếu lớp này hỏng thì không có lớp dự phòng, đúng điều đề muốn tránh.","<b>C.</b> Một guardrail system prompt duy nhất là điểm thất bại đơn lẻ và có tính xác suất, có thể bị prompt injection hoặc jailbreak vượt qua.","<b>D.</b> Chỉ dựa vào hành vi an toàn tích hợp của mô hình vẫn là một lớp duy nhất và không bao phủ chính sách riêng của ứng dụng."]}},{"id":"ccdvf-q087","n":87,"topic":1,"type":"mcq","stem":{"en":"You have just shipped a new Claude-powered application to production. The development phase is complete, and the system is now in active use by internal teams. The next phase of work for this system is...","vi":"Bạn vừa đưa một ứng dụng mới do Claude hỗ trợ vào sản xuất. Giai đoạn phát triển đã hoàn tất và hệ thống hiện đang được các nhóm nội bộ sử dụng tích cực. Giai đoạn công việc tiếp theo của hệ thống này là...","jp":"新しいクロードを利用したアプリケーションを運用環境に出荷しました。開発段階は完了し、システムは現在社内チームによって積極的に使用されています。このシステムの次の作業段階は..."},"options":[{"k":"A","t":{"en":"Retiring the system, since shipping is the final lifecycle stage for any application that reaches production.","vi":"Ngừng sử dụng hệ thống vì vận chuyển là giai đoạn cuối cùng trong vòng đời của bất kỳ ứng dụng nào được đưa vào sản xuất.","jp":"出荷は、実稼働環境に移行するアプリケーションの最終ライフサイクル段階であるため、システムを廃止します。"}},{"k":"B","t":{"en":"Running a formal post-deployment review that assesses the development phase before the team does any further work on the system.","vi":"Tiến hành đánh giá chính thức sau triển khai để đánh giá giai đoạn phát triển trước khi nhóm thực hiện bất kỳ công việc nào tiếp theo trên hệ thống.","jp":"チームがシステムでさらなる作業を行う前に、開発段階を評価する正式な展開後レビューを実行します。"}},{"k":"C","t":{"en":"Operating and maintaining the system, including monitoring, responding to issues, and planning evolution.","vi":"Vận hành và bảo trì hệ thống, bao gồm giám sát, ứng phó với các vấn đề và lập kế hoạch phát triển.","jp":"監視、問題への対応、進化の計画など、システムの運用と保守。"}},{"k":"D","t":{"en":"Handing the system over to a separate operations team that will manage it independently of the development team going forward.","vi":"Bàn giao hệ thống cho một nhóm vận hành riêng biệt sẽ quản lý nó độc lập với nhóm phát triển trong tương lai.","jp":"システムを別の運用チームに引き渡し、今後は開発チームとは独立してシステムを管理します。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Ship lên production không phải điểm kết thúc mà là bắt đầu giai đoạn <b>vận hành và bảo trì</b>: <b>giám sát</b> chất lượng, độ trễ, chi phí, lỗi; <b>phản hồi sự cố</b> và regression; và <b>lên kế hoạch phát triển tiếp</b> (cập nhật prompt, nâng cấp model, tính năng mới). Với ứng dụng LLM, giai đoạn này càng quan trọng vì đầu vào thực tế thay đổi và hành vi mô hình cần được theo dõi liên tục.","elim":["<b>A.</b> Hệ thống đang được dùng tích cực; ship không phải giai đoạn cuối và không có lý do gì để ngừng hoạt động.","<b>B.</b> Post-deployment review có thể hữu ích nhưng không phải là “giai đoạn tiếp theo” và không được trì hoãn mọi công việc vận hành như giám sát hay xử lý sự cố.","<b>D.</b> Bàn giao hẳn cho đội vận hành tách biệt là một lựa chọn tổ chức, không phải giai đoạn vòng đời bắt buộc, và tách nhóm phát triển khỏi phản hồi production sẽ cản trở cải tiến."]}},{"id":"ccdvf-q088","n":88,"topic":1,"type":"mcq","stem":{"en":"A Claude application that worked well in testing is now occasionally returning outputs that mention information not present in the input. The development team initially assumed the model was hallucinating, so they asked you to troubleshoot. What would you do first?","vi":"Một ứng dụng Claude hoạt động tốt trong quá trình thử nghiệm hiện thỉnh thoảng trả về kết quả đầu ra đề cập đến thông tin không có trong đầu vào. Nhóm phát triển ban đầu cho rằng mô hình này bị ảo giác nên họ đã yêu cầu bạn khắc phục sự cố. Bạn sẽ làm gì đầu tiên?","jp":"テストではうまく機能した Claude アプリケーションが、入力に存在しない情報に言及する出力を返すことがあります。開発チームは当初、モデルが幻覚を起こしていると考えたため、トラブルシューティングを依頼しました。まず何をしますか?"},"options":[{"k":"A","t":{"en":"Examine production traces to identify whether the issue is hallucination by the model, context loss, prompt injection, or another failure mode before recommending a fix.","vi":"Kiểm tra dấu vết sản xuất để xác định xem sự cố là ảo giác do mô hình, mất ngữ cảnh, chèn lời nhắc hay một chế độ lỗi khác trước khi đề xuất cách khắc phục.","jp":"修正を推奨する前に、運用トレースを調べて、問題がモデルによる幻覚、コンテキスト損失、プロンプト インジェクション、または別の障害モードであるかどうかを特定します。"}},{"k":"B","t":{"en":"Replace the current model with a larger one to reduce the chance of hallucination, on the grounds that larger models tend to hallucinate less in typical applications.","vi":"Thay thế mô hình hiện tại bằng mô hình lớn hơn để giảm khả năng xảy ra ảo giác, vì các mô hình lớn hơn có xu hướng gây ảo giác ít hơn trong các ứng dụng thông thường.","jp":"一般的な用途では大型モデルの方が幻覚が少ない傾向にあるため、幻覚の可能性を減らすために現在のモデルを大型のものに置き換えます。"}},{"k":"C","t":{"en":"Apply a retrieval-augmented generation pattern to ground the responses in source content before any further investigation of the production traces.","vi":"Áp dụng mẫu tạo tăng cường truy xuất để đưa ra các phản hồi trong nội dung nguồn trước khi thực hiện bất kỳ cuộc điều tra sâu hơn nào về dấu vết sản xuất.","jp":"実稼働トレースをさらに調査する前に、検索拡張生成パターンを適用して、ソース コンテンツ内の応答を根拠付けします。"}},{"k":"D","t":{"en":"Add a system prompt instruction telling the model not to invent information, on the grounds that prompt-level instructions are the fastest fix for hallucination concerns.","vi":"Thêm lệnh nhắc hệ thống yêu cầu mô hình không tạo ra thông tin, với lý do lệnh ở cấp độ nhắc nhở là cách khắc phục nhanh nhất cho các vấn đề về ảo giác.","jp":"プロンプトレベルの指示が幻覚の問題を最も早く解決できるという理由で、モデルに情報をでっち上げないよう指示するシステム プロンプト指示を追加します。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Việc đầu ra chứa thông tin không có trong input chưa chắc là hallucination: nó có thể do <b>mất context</b> (dữ liệu bị cắt, truncation), <b>prompt injection</b> từ nội dung bên ngoài, context lẫn giữa các request hay lỗi khác. Bước đầu tiên là <b>xem trace production</b> để xác định đúng chế độ lỗi, rồi mới đề xuất cách sửa phù hợp với nguyên nhân gốc.","elim":["<b>B.</b> Đổi sang model lớn hơn là sửa dựa trên giả định chưa kiểm chứng; nếu nguyên nhân là injection hay mất context thì model lớn hơn không giải quyết được.","<b>C.</b> Áp dụng RAG trước khi điều tra là nhảy vào giải pháp mà chưa biết nguyên nhân, có thể thêm độ phức tạp mà không trúng vấn đề.","<b>D.</b> Thêm chỉ dẫn “đừng bịa thông tin” cũng dựa trên giả định hallucination và là biện pháp yếu, không xử lý được injection hay lỗi context."]}},{"id":"ccdvf-q089","n":89,"topic":1,"type":"mcq","stem":{"en":"A team has deployed a multi-agent system in which a primary agent decomposes user requests and delegates subtasks to three specialized subagents: one for data retrieval, one for analysis, and one for report generation. In production, the team observes that subagents are making redundant tool calls, occasionally exceeding token budgets, and sometimes producing outputs that contradict each other - all of which the primary agent passes along without catching. What is the most appropriate way to address these failures?","vi":"Một nhóm đã triển khai một hệ thống nhiều tác nhân, trong đó một tác nhân chính phân tách các yêu cầu của người dùng và ủy quyền các nhiệm vụ phụ cho ba tác nhân phụ chuyên biệt: một để truy xuất dữ liệu, một để phân tích và một để tạo báo cáo. Trong quá trình sản xuất, nhóm quan sát thấy rằng các tác nhân phụ đang thực hiện các lệnh gọi công cụ dư thừa, đôi khi vượt quá ngân sách mã thông báo và đôi khi tạo ra các kết quả đầu ra mâu thuẫn với nhau - tất cả đều được tác nhân chính chuyển đi mà không nắm bắt được. Cách thích hợp nhất để giải quyết những thất bại này là gì?","jp":"チームはマルチエージェント システムを導入しました。このシステムでは、プライマリ エージェントがユーザー リクエストを分解し、データ取得用、分析用、レポート生成用の 3 つの特殊なサブエージェントにサブタスクを委任します。運用環境では、チームは、サブエージェントが冗長なツール呼び出しを行っており、場合によってはトークンの予算を超え、場合によっては相互に矛盾する出力を生成していることを観察しています。これらすべてがプライマリ エージェントによって捕捉されずに無視されます。これらの失敗に対処する最も適切な方法は何でしょうか?"},"options":[{"k":"A","t":{"en":"Add retry logic to each subagent so that when a tool call fails, the subagent retries automatically before escalating - and configure each subagent to log its tool calls and outputs to a shared trace so the team can audit redundancy and contradictions after the fact.","vi":"Thêm logic thử lại vào từng tác nhân phụ để khi lệnh gọi công cụ không thành công, tác nhân phụ sẽ tự động thử lại trước khi chuyển lên cấp cao hơn - và định cấu hình từng tác nhân phụ để ghi lại các lệnh gọi công cụ của nó và xuất ra dấu vết chung để nhóm có thể kiểm tra sự dư thừa và mâu thuẫn sau thực tế.","jp":"各サブエージェントに再試行ロジックを追加して、ツールの呼び出しが失敗した場合にエスカレーションする前にサブエージェントが自動的に再試行できるようにします。また、ツールの呼び出しと出力を共有トレースに記録するように各サブエージェントを構成して、チームが事後に冗長性と矛盾を監査できるようにします。"}},{"k":"B","t":{"en":"Give each subagent read access to the other subagents' outputs so they can identify and resolve contradictions without routing back through the primary agent.","vi":"Cấp cho mỗi tác nhân phụ quyền truy cập đọc vào đầu ra của các tác nhân phụ khác để chúng có thể xác định và giải quyết mâu thuẫn mà không cần định tuyến trở lại thông qua tác nhân chính.","jp":"各サブエージェントに他のサブエージェントの出力への読み取りアクセスを与えると、プライマリ エージェントを経由せずに矛盾を特定して解決できるようになります。"}},{"k":"C","t":{"en":"Strengthen the primary agent's management layer to enforce per-subagent tool budgets, validate outputs against a defined schema before passing them forward, and establish explicit handoff contracts between stages.","vi":"Tăng cường lớp quản lý của tác nhân chính để thực thi ngân sách công cụ cho mỗi tác nhân phụ, xác thực kết quả đầu ra theo lược đồ đã xác định trước khi chuyển chúng về phía trước và thiết lập hợp đồng chuyển giao rõ ràng giữa các giai đoạn.","jp":"プライマリ エージェントの管理レイヤーを強化して、サブエージェントごとのツール バジェットを強制し、出力を転送する前に定義されたスキーマに照らして検証し、ステージ間の明示的なハンドオフ コントラクトを確立します。"}},{"k":"D","t":{"en":"Collapse the three subagents into a single large-context model call that handles retrieval, analysis, and generation in one pass.","vi":"Thu gọn ba tác nhân phụ thành một lệnh gọi mô hình ngữ cảnh lớn duy nhất xử lý việc truy xuất, phân tích và tạo trong một lần chuyển.","jp":"3 つのサブエージェントを 1 つの大きなコンテキスト モデル呼び出しに集約し、取得、分析、生成を 1 つのパスで処理します。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Cả ba triệu chứng (tool call lặp lại, vượt token budget, đầu ra mâu thuẫn bị chuyển tiếp mà không bị phát hiện) đều chỉ ra <b>tầng điều phối của agent chính quá yếu</b>. Coordinator có trách nhiệm kiểm soát và validate kết quả, nên cần: <b>áp đặt budget tool/token cho từng subagent</b>, <b>validate đầu ra theo schema</b> trước khi chuyển sang bước sau, và thiết lập <b>hợp đồng bàn giao (handoff contract) rõ ràng</b> giữa các bước. Cách này phòng ngừa lỗi ngay khi chạy thay vì chỉ phát hiện sau.","elim":["<b>A.</b> Retry chỉ xử lý tool call thất bại, không xử lý gọi trùng hay vượt budget (còn có thể làm tăng thêm), và log để audit sau là phát hiện hậu kiểm, không ngăn mâu thuẫn được chuyển cho người dùng.","<b>B.</b> Cho subagent đọc và tự hòa giải đầu ra của nhau phá vỡ nguyên tắc mọi giao tiếp đi qua coordinator, làm giảm khả năng quan sát và kiểm soát lỗi.","<b>D.</b> Gộp tất cả vào một lời gọi lớn từ bỏ lợi ích chuyên biệt hóa và tách context, gây loãng chú ý mà không trực tiếp giải quyết việc thiếu kiểm soát."]},"cite":"Hướng dẫn ôn tập — §3.3 Hub-and-Spoke: Coordinator và Subagent; Lĩnh vực 5.3"},{"id":"ccdvf-q090","n":90,"topic":1,"type":"mcq","stem":{"en":"Your team is integrating Claude into an existing REST API service. The service handles concurrent requests, and you are deciding how to structure the Claude API calls within the existing async codebase. How would you structure the Claude calls?","vi":"Nhóm của bạn đang tích hợp Claude vào dịch vụ API REST hiện có. Dịch vụ này xử lý các yêu cầu đồng thời và bạn đang quyết định cách cấu trúc các lệnh gọi API Claude trong cơ sở mã không đồng bộ hiện có. Bạn sẽ sắp xếp các cuộc gọi của Claude như thế nào?","jp":"あなたのチームは、Claude を既存の REST API サービスに統合しています。このサービスは同時リクエストを処理し、既存の非同期コードベース内で Claude API 呼び出しをどのように構築するかを決定しています。クロードの呼び出しをどのように構成しますか?"},"options":[{"k":"A","t":{"en":"Run Claude API calls in a separate thread pool isolated from the rest of the service so the main event loop is not affected.","vi":"Chạy lệnh gọi API Claude trong nhóm luồng riêng biệt tách biệt với phần còn lại của dịch vụ để vòng lặp sự kiện chính không bị ảnh hưởng.","jp":"メイン イベント ループが影響を受けないように、サービスの残りの部分から分離された別のスレッド プールで Claude API 呼び出しを実行します。"}},{"k":"B","t":{"en":"Replace the existing async REST service with a synchronous service to match the call style of synchronous Claude SDK clients.","vi":"Thay thế dịch vụ REST không đồng bộ hiện có bằng dịch vụ đồng bộ để phù hợp với kiểu gọi của máy khách Claude SDK đồng bộ.","jp":"同期 Claude SDK クライアントの呼び出しスタイルに一致するように、既存の非同期 REST サービスを同期サービスに置き換えます。"}},{"k":"C","t":{"en":"Use the Claude SDK's async client and structure Claude calls as awaitable operations alongside the rest of the service's async code.","vi":"Sử dụng ứng dụng khách không đồng bộ của Claude SDK và cấu trúc các cuộc gọi Claude dưới dạng các hoạt động có thể chờ đợi cùng với phần còn lại của mã không đồng bộ của dịch vụ.","jp":"Claude SDK の非同期クライアントを使用し、サービスの残りの非同期コードとともに待機可能な操作として Claude 呼び出しを構造化します。"}},{"k":"D","t":{"en":"Make synchronous Claude API calls and block the async event loop until each call completes before processing the next request.","vi":"Thực hiện các lệnh gọi API Claude đồng bộ và chặn vòng lặp sự kiện không đồng bộ cho đến khi mỗi lệnh gọi hoàn tất trước khi xử lý yêu cầu tiếp theo.","jp":"同期 Claude API 呼び出しを行い、各呼び出しが完了するまで非同期イベント ループをブロックしてから、次のリクエストを処理します。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Dịch vụ REST hiện tại đã là async và xử lý request đồng thời, nên nên dùng <b>async client của Claude SDK</b> (ví dụ <code>AsyncAnthropic</code> trong Python) và viết lời gọi Claude thành <b>các thao tác awaitable</b>. Lời gọi Claude chủ yếu chờ I/O mạng, nên dùng <code>await</code> giúp event loop tiếp tục phục vụ request khác trong lúc chờ, nhất quán với kiến trúc sẵn có và không cần thêm cơ chế phụ.","elim":["<b>A.</b> Đẩy lời gọi sang thread pool riêng là cách vòng vèo, thêm overhead và phức tạp khi SDK đã có sẵn async client.","<b>B.</b> Viết lại dịch vụ async thành đồng bộ để hợp với client đồng bộ là đi ngược hướng, làm giảm khả năng xử lý đồng thời.","<b>D.</b> Gọi đồng bộ và chặn event loop khiến toàn bộ dịch vụ đứng chờ mỗi lời gọi Claude, phá hỏng khả năng xử lý request đồng thời."]}},{"id":"ccdvf-q091","n":91,"topic":1,"type":"mcq","stem":{"en":"You are deciding between Claude models for a task. The team has identified three relevant tradeoff dimensions: quality, latency, and cost. The right model is the one that...","vi":"Bạn đang quyết định giữa các mô hình Claude cho một nhiệm vụ. Nhóm đã xác định ba khía cạnh cân bằng có liên quan: chất lượng, độ trễ và chi phí. Mẫu phù hợp là mẫu...","jp":"あなたは、タスクに対してクロード モデルのどちらを選択するかを決定しています。チームは、品質、レイテンシー、コストという 3 つの関連するトレードオフの側面を特定しました。適切なモデルは次のとおりです。"},"options":[{"k":"A","t":{"en":"Satisfies the task's latency requirement first, then is evaluated against quality and cost thresholds to confirm the selection is acceptable across all three dimensions.","vi":"Trước tiên, đáp ứng yêu cầu về độ trễ của nhiệm vụ, sau đó được đánh giá theo ngưỡng chất lượng và chi phí để xác nhận lựa chọn có thể chấp nhận được trên cả ba chiều.","jp":"まずタスクのレイテンシ要件を満たし、次に品質とコストのしきい値に照らして評価され、3 つの側面すべてにわたって選択が受け入れられるかどうかが確認されます。"}},{"k":"B","t":{"en":"Meets the task's cost target within a defined latency budget, with quality validated against a representative sample of inputs after the model is selected.","vi":"Đáp ứng mục tiêu chi phí của nhiệm vụ trong ngân sách độ trễ đã xác định, với chất lượng được xác thực dựa trên mẫu đầu vào đại diện sau khi mô hình được chọn.","jp":"モデルの選択後に入力の代表的なサンプルに対して品質が検証され、定義されたレイテンシ バジェット内でタスクのコスト目標を満たします。"}},{"k":"C","t":{"en":"Fits the task's quality, latency, and cost requirements together, recognizing that improving one dimension typically affects the others.","vi":"Kết hợp các yêu cầu về chất lượng, độ trễ và chi phí của nhiệm vụ với nhau, nhận ra rằng việc cải thiện một khía cạnh thường ảnh hưởng đến các khía cạnh khác.","jp":"通常、1 つの側面を改善すると他の側面にも影響を与えることを認識し、タスクの品質、レイテンシ、コストの要件を適合させます。"}},{"k":"D","t":{"en":"Meets the task's quality requirements at an acceptable latency, with cost reviewed separately once the quality and latency bar has been established.","vi":"Đáp ứng các yêu cầu về chất lượng của nhiệm vụ ở độ trễ chấp nhận được, với chi phí được xem xét riêng sau khi thanh chất lượng và độ trễ được thiết lập.","jp":"許容可能なレイテンシでタスクの品質要件を満たし、品質とレイテンシの基準が確立されたらコストを個別にレビューします。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Chất lượng, độ trễ và chi phí là <b>ba chiều đánh đổi liên quan với nhau</b>: model mạnh hơn thường chất lượng cao hơn nhưng chậm hơn và đắt hơn, model nhỏ thì ngược lại. Vì vậy model phù hợp là model <b>đáp ứng đồng thời cả ba yêu cầu</b> của tác vụ, được đánh giá cùng nhau thay vì tối ưu tuần tự từng chiều.","elim":["<b>A.</b> Ưu tiên độ trễ trước rồi mới xét các chiều khác là xếp thứ tự tùy ý, có thể loại sớm những model cân bằng tốt hơn.","<b>B.</b> Chỉ kiểm chứng chất lượng sau khi đã chọn model theo chi phí là ngược quy trình; chất lượng phải là một tiêu chí lựa chọn, không phải bước xác nhận sau cùng.","<b>D.</b> Xem xét chi phí tách riêng sau khi đã chốt chất lượng và độ trễ bỏ qua tác động qua lại giữa chi phí và hai chiều còn lại."]}},{"id":"ccdvf-q092","n":92,"topic":1,"type":"mcq","stem":{"en":"The product team has asked you to choose a Claude model for a new feature. The team has provided functional requirements but has not specified performance, cost, or quality targets. The team's product manager says, \"Use whatever model gives us the best results.\" How would you respond?","vi":"Nhóm sản phẩm đã yêu cầu bạn chọn mẫu Claude cho tính năng mới. Nhóm đã cung cấp các yêu cầu chức năng nhưng chưa chỉ định các mục tiêu về hiệu suất, chi phí hoặc chất lượng. Người quản lý sản phẩm của nhóm nói: \"Hãy sử dụng bất kỳ mô hình nào mang lại cho chúng tôi kết quả tốt nhất\". Bạn sẽ trả lời thế nào?","jp":"製品チームは、新機能のためにクロード モデルを選択するように依頼しました。チームは機能要件を提供しましたが、パフォーマンス、コスト、または品質の目標を指定していませんでした。チームのプロダクト マネージャーは、「最良の結果が得られるモデルであれば何でも使用してください」と述べています。あなたならどう答えますか？"},"options":[{"k":"A","t":{"en":"Ask the product team to specify quality, latency, and cost targets, then select the model whose tradeoffs best fit those targets.","vi":"Yêu cầu nhóm sản phẩm chỉ định các mục tiêu về chất lượng, độ trễ và chi phí, sau đó chọn mô hình có sự cân bằng phù hợp nhất với các mục tiêu đó.","jp":"製品チームに品質、レイテンシ、コストの目標を指定するよう依頼し、トレードオフがそれらの目標に最も適合するモデルを選択します。"}},{"k":"B","t":{"en":"Run every Claude model on a representative sample and pick whichever scores best on a generic benchmark.","vi":"Chạy mọi mô hình Claude trên một mẫu đại diện và chọn bất kỳ mô hình nào đạt điểm cao nhất trên điểm chuẩn chung.","jp":"代表的なサンプルですべてのクロード モデルを実行し、一般的なベンチマークで最高のスコアを選択します。"}},{"k":"C","t":{"en":"Choose a mid-tier model and ship the feature, because mid-tier models work for most use cases without specified targets.","vi":"Chọn một mô hình cấp trung và cung cấp tính năng vì các mô hình cấp trung hoạt động cho hầu hết các trường hợp sử dụng mà không có mục tiêu cụ thể.","jp":"中間層モデルはターゲットが指定されていないほとんどのユースケースで機能するため、中間層モデルを選択して機能を出荷します。"}},{"k":"D","t":{"en":"Choose the largest, highest-capability Claude model, on the grounds that \"best results\" is most likely to mean highest quality.","vi":"Chọn mô hình Claude lớn nhất, có khả năng cao nhất, trên cơ sở \"kết quả tốt nhất\" có thể có nghĩa là chất lượng cao nhất.","jp":"「最良の結果」は最高の品質を意味する可能性が高いため、最大で最高の機能を備えたクロード モデルを選択します。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> “Kết quả tốt nhất” không phải là yêu cầu đo được; chọn model cần biết <b>mục tiêu về chất lượng, độ trễ và chi phí</b> vì đây là các chiều đánh đổi lẫn nhau. Cách đúng là <b>yêu cầu product team xác định các mục tiêu này</b>, sau đó chọn model có điểm cân bằng phù hợp nhất, lý tưởng là kiểm chứng bằng eval trên dữ liệu đại diện.","elim":["<b>B.</b> Benchmark chung chung không phản ánh yêu cầu cụ thể của tính năng, và vẫn thiếu mục tiêu về độ trễ, chi phí để quyết định.","<b>C.</b> Chọn đại model tầm trung rồi ship là quyết định không có căn cứ khi chưa biết các mục tiêu cần đạt.","<b>D.</b> Mặc định chọn model lớn nhất có thể vượt ngân sách và độ trễ cho phép; “tốt nhất” cho sản phẩm không chỉ là chất lượng cao nhất."]}},{"id":"ccdvf-q093","n":93,"topic":1,"type":"mcq","stem":{"en":"A teammate has asked how to extend Claude Code with a custom Skill that the team can invoke during sessions. The Skill consists of a set of instructions and a few support scripts the team wants Claude to be able to call when the Skill is loaded. Where is the right place to define the Skill?","vi":"Một đồng đội đã hỏi cách mở rộng Mã Claude bằng một Kỹ năng tùy chỉnh mà nhóm có thể gọi trong các phiên. Kỹ năng bao gồm một bộ hướng dẫn và một số tập lệnh hỗ trợ mà nhóm muốn Claude có thể gọi khi Kỹ năng được tải. Đâu là nơi thích hợp để xác định Kỹ năng?","jp":"チームメイトが、セッション中にチームが呼び出せるカスタム スキルを使用してクロード コードを拡張する方法を尋ねました。スキルは、一連の命令と、チームがスキルのロード時にクロードが呼び出せるようにするいくつかのサポート スクリプトで構成されています。スキルを定義する適切な場所はどこですか?"},"options":[{"k":"A","t":{"en":"Define the Skill as a long inline instruction at the top of every CLAUDE.md file in the team's repositories so Claude has access to it on every session.","vi":"Xác định Kỹ năng dưới dạng một hướng dẫn nội tuyến dài ở đầu mỗi tệp CLAUDE.md trong kho của nhóm để Claude có quyền truy cập vào nó trong mỗi phiên.","jp":"チームのリポジトリ内のすべての CLAUDE.md ファイルの先頭にスキルを長いインライン命令として定義し、クロードがセッションごとにスキルにアクセスできるようにします。"}},{"k":"B","t":{"en":"Define the Skill inside the application's source code as a regular library module and call it from the application code instead of from Claude Code.","vi":"Xác định Kỹ năng bên trong mã nguồn của ứng dụng dưới dạng mô-đun thư viện thông thường và gọi nó từ mã ứng dụng thay vì từ Mã Claude.","jp":"アプリケーションのソース コード内でスキルを通常のライブラリ モジュールとして定義し、クロード コードからではなくアプリケーション コードから呼び出します。"}},{"k":"C","t":{"en":"Define the Skill in a Skills directory recognized by Claude Code, where Claude can discover and load it during sessions for the team's repositories.","vi":"Xác định Kỹ năng trong thư mục Kỹ năng được Claude Code công nhận, nơi Claude có thể khám phá và tải nó trong các phiên dành cho kho lưu trữ của nhóm.","jp":"クロード コードによって認識されるスキル ディレクトリにスキルを定義します。クロードは、チームのリポジトリのセッション中にスキルを検出してロードできます。"}},{"k":"D","t":{"en":"Define the Skill in a personal scratch directory on each developer's machine and load it manually before each Claude Code session that needs it.","vi":"Xác định Kỹ năng trong thư mục cào cá nhân trên máy của mỗi nhà phát triển và tải thủ công trước mỗi phiên Mã Claude cần nó.","jp":"各開発者のマシン上の個人用スクラッチ ディレクトリにスキルを定義し、それを必要とする各クロード コード セッションの前に手動でロードします。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Skill trong Claude Code là một thư mục chứa <code>SKILL.md</code> (frontmatter + hướng dẫn) cùng các script hỗ trợ, đặt trong <b>thư mục skills mà Claude Code nhận diện</b>: <code>.claude/skills/</code> trong repo để chia sẻ với nhóm qua version control, hoặc <code>~/.claude/skills/</code> cho skill cá nhân. Claude Code tự <b>phát hiện và nạp skill theo nhu cầu</b> trong session, đúng với yêu cầu của nhóm.","elim":["<b>A.</b> Nhét hướng dẫn dài vào đầu mọi CLAUDE.md khiến nó luôn được nạp và chiếm context ở mọi session, mất tính gọi theo nhu cầu, và không đóng gói được script hỗ trợ như một Skill.","<b>B.</b> Module thư viện trong mã nguồn ứng dụng không phải Skill của Claude Code; Claude Code không phát hiện hay nạp nó trong session.","<b>D.</b> Thư mục tạm cá nhân trên từng máy, nạp thủ công, không chia sẻ được với nhóm và không được Claude Code tự phát hiện."]},"cite":"Hướng dẫn ôn tập — §5.5 Skill — .claude/skills/; Lĩnh vực 3.2"},{"id":"ccdvf-q094","n":94,"topic":1,"type":"mcq","stem":{"en":"Your team is debating how to manage the prompts used in your Claude application. Some prompts are checked into the code repository, some live in a separate configuration file, and some are constructed inline at runtime. The result is inconsistent, and a recent prompt change went out without code review. What steps would you take?","vi":"Nhóm của bạn đang tranh luận về cách quản lý lời nhắc được sử dụng trong ứng dụng Claude của bạn. Một số lời nhắc được kiểm tra trong kho lưu trữ mã, một số lời nhắc nằm trong một tệp cấu hình riêng biệt và một số lời nhắc được xây dựng nội tuyến khi chạy. Kết quả không nhất quán và một thay đổi nhanh chóng gần đây đã xảy ra mà không cần xem xét mã. Bạn sẽ thực hiện những bước nào?","jp":"あなたのチームは、Claude アプリケーションで使用されるプロンプトを管理する方法を議論しています。一部のプロンプトはコード リポジトリにチェックインされ、一部は別の構成ファイルに存在し、一部は実行時にインラインで構築されます。結果は一貫性がなく、最近のプロンプト変更はコードレビューなしで行われました。どのような手順を実行しますか?"},"options":[{"k":"A","t":{"en":"Move all prompts out of version control to a separate spreadsheet that team members can edit freely as the application evolves over time.","vi":"Di chuyển tất cả lời nhắc ra khỏi khả năng kiểm soát phiên bản sang một bảng tính riêng biệt mà các thành viên trong nhóm có thể tự do chỉnh sửa khi ứng dụng phát triển theo thời gian.","jp":"すべてのプロンプトをバージョン管理外の別のスプレッドシートに移動し、アプリケーションが時間の経過とともに進化するにつれて、チーム メンバーが自由に編集できるようにします。"}},{"k":"B","t":{"en":"Move all prompts to inline runtime construction so the team can update them quickly through a streamlined process outside the standard code review workflow.","vi":"Chuyển tất cả lời nhắc sang xây dựng thời gian chạy nội tuyến để nhóm có thể cập nhật chúng nhanh chóng thông qua quy trình hợp lý hóa bên ngoài quy trình đánh giá mã tiêu chuẩn.","jp":"すべてのプロンプトをインライン ランタイム構築に移動すると、チームは標準のコード レビュー ワークフローの外で合理化されたプロセスを通じてプロンプトを迅速に更新できます。"}},{"k":"C","t":{"en":"Establish a single source of truth for prompts but keep change review optional, allowing developers to update prompts directly when changes are urgent.","vi":"Thiết lập một nguồn đáng tin cậy duy nhất cho lời nhắc nhưng vẫn giữ tùy chọn xem xét thay đổi, cho phép nhà phát triển cập nhật trực tiếp lời nhắc khi có thay đổi khẩn cấp.","jp":"プロンプトの信頼できる唯一の情報源を確立しますが、変更レビューはオプションのままにして、変更が緊急の場合に開発者がプロ​​ンプトを直接更新できるようにします。"}},{"k":"D","t":{"en":"Establish a single source of truth for prompts, version-control them alongside code, and require code review for prompt changes.","vi":"Thiết lập một nguồn thông tin đáng tin cậy duy nhất cho các lời nhắc, kiểm soát phiên bản của chúng cùng với mã và yêu cầu xem xét mã để có những thay đổi nhanh chóng.","jp":"プロンプトの信頼できる唯一の情報源を確立し、プロンプトをコードとともにバージョン管理し、プロンプトの変更についてはコード レビューを要求します。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Prompt là một phần logic của ứng dụng, nên cần được quản lý như code: <b>một nguồn sự thật duy nhất</b> để hết tình trạng phân tán, <b>version control cùng với code</b> để truy vết và rollback, và <b>bắt buộc code review</b> cho mọi thay đổi prompt, nhằm ngăn lặp lại sự cố một thay đổi prompt lên production mà không được review.","elim":["<b>A.</b> Chuyển prompt ra bảng tính cho ai cũng sửa làm mất lịch sử phiên bản và quy trình review, đúng điều vừa gây ra sự cố.","<b>B.</b> Dựng prompt inline lúc runtime ngoài quy trình review làm tình trạng thiếu kiểm soát tệ hơn.","<b>C.</b> Có nguồn sự thật duy nhất nhưng để review là tùy chọn vẫn cho phép thay đổi khẩn cấp đi thẳng lên production mà không ai kiểm tra."]}},{"id":"ccdvf-q095","n":95,"topic":1,"type":"mcq","stem":{"en":"You are choosing between using STDIO-based communication and HTTP-based communication for an MCP server. The server will be invoked by a Claude Code session running locally. Which communication pattern would you use?","vi":"Bạn đang chọn giữa việc sử dụng giao tiếp dựa trên STDIO và giao tiếp dựa trên HTTP cho máy chủ MCP. Máy chủ sẽ được gọi bằng phiên Mã Claude chạy cục bộ. Bạn sẽ sử dụng mô hình giao tiếp nào?","jp":"MCP サーバーに対して STDIO ベースの通信を使用するか、HTTP ベースの通信を使用するかを選択しています。サーバーは、ローカルで実行されているクロード コード セッションによって呼び出されます。どのコミュニケーション パターンを使用しますか?"},"options":[{"k":"A","t":{"en":"STDIO and HTTP simultaneously for redundancy, with the team running two communication patterns at the same time across Claude Code sessions.","vi":"STDIO và HTTP đồng thời để dự phòng, nhóm chạy hai mẫu giao tiếp cùng lúc trong các phiên Mã Claude.","jp":"冗長性を確保するために STDIO と HTTP を同時に使用し、チームはクロード コード セッション全体で 2 つの通信パターンを同時に実行します。"}},{"k":"B","t":{"en":"HTTP on the grounds that HTTP is preferable to STDIO in any context the application might encounter during normal operation.","vi":"HTTP với lý do HTTP thích hợp hơn STDIO trong mọi ngữ cảnh mà ứng dụng có thể gặp phải trong quá trình hoạt động bình thường.","jp":"HTTP は、アプリケーションが通常の動作中に遭遇する可能性のあるあらゆるコンテキストにおいて STDIO よりも HTTP の方が望ましいという理由からです。"}},{"k":"C","t":{"en":"HTTP polling against the MCP server, treating HTTP as a substitute for the standard MCP communication patterns.","vi":"Thăm dò HTTP đối với máy chủ MCP, coi HTTP là sự thay thế cho các mẫu giao tiếp MCP tiêu chuẩn.","jp":"MCP サーバーに対する HTTP ポーリング。HTTP を標準 MCP 通信パターンの代わりとして扱います。"}},{"k":"D","t":{"en":"STDIO because STDIO is well-suited to local process communication and avoids unnecessary network setup.","vi":"STDIO vì STDIO rất phù hợp với giao tiếp quy trình cục bộ và tránh việc thiết lập mạng không cần thiết.","jp":"STDIO はローカル プロセス通信に適しており、不必要なネットワーク設定を回避するためです。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> MCP hỗ trợ hai kiểu transport chính: <b>stdio</b> (client khởi chạy server như một tiến trình con và giao tiếp qua stdin/stdout) và <b>HTTP</b> (streamable HTTP cho server từ xa). Với server được một session Claude Code <b>chạy cục bộ</b> gọi tới, <b>stdio</b> là lựa chọn tự nhiên: đơn giản, không cần mở cổng mạng, cấu hình TLS hay xác thực. HTTP phù hợp hơn cho server từ xa hoặc dùng chung.","elim":["<b>A.</b> Chạy đồng thời stdio và HTTP cho “dự phòng” chỉ thêm phức tạp mà không có lợi ích; một session chỉ cần một transport.","<b>B.</b> HTTP không ưu việt trong mọi bối cảnh; với tiến trình cục bộ nó thêm thiết lập mạng không cần thiết.","<b>C.</b> HTTP polling không phải mẫu giao tiếp chuẩn của MCP và không thay thế được các transport chuẩn."]},"cite":"Hướng dẫn ôn tập — §4.3 Cấu hình MCP Server; Lĩnh vực 2.4"},{"id":"ccdvf-q096","n":96,"topic":1,"type":"mcq","stem":{"en":"Your team's Claude agent has accumulated several customizations that bypass the SDK's defaults, including custom history management, retry logic, and error handling. A new team member has proposed reverting all the customizations to maintain the codebase more easily. The tech lead disagrees and says each customization was added for a reason. How would you advise the team?","vi":"Nhân viên hỗ trợ Claude của nhóm bạn đã tích lũy một số tùy chỉnh bỏ qua các giá trị mặc định của SDK, bao gồm quản lý lịch sử tùy chỉnh, logic thử lại và xử lý lỗi. Một thành viên mới trong nhóm đã đề xuất hoàn nguyên tất cả các tùy chỉnh để duy trì cơ sở mã dễ dàng hơn. Trưởng nhóm công nghệ không đồng ý và cho biết mỗi tùy chỉnh được thêm vào đều có lý do. Bạn sẽ tư vấn cho nhóm như thế nào?","jp":"チームの Claude エージェントは、カスタム履歴管理、再試行ロジック、エラー処理など、SDK のデフォルトをバイパスするいくつかのカスタマイズを蓄積しています。新しいチームメンバーは、コードベースをより簡単に保守するために、すべてのカスタマイズを元に戻すことを提案しました。技術責任者はこれに同意せず、それぞれのカスタマイズには理由があって追加されたと述べています。チームにどのようにアドバイスしますか?"},"options":[{"k":"A","t":{"en":"Migrate the agent off the SDK and rebuild it with a custom loop.","vi":"Di chuyển tác nhân ra khỏi SDK và xây dựng lại nó bằng vòng lặp tùy chỉnh.","jp":"エージェントを SDK から移行し、カスタム ループを使用して再構築します。"}},{"k":"B","t":{"en":"Revert all customizations to the SDK's defaults to standardize the codebase.","vi":"Hoàn nguyên tất cả các tùy chỉnh về mặc định của SDK để chuẩn hóa cơ sở mã.","jp":"コードベースを標準化するために、すべてのカスタマイズを SDK のデフォルトに戻します。"}},{"k":"C","t":{"en":"Keep all customizations, trusting that the tech lead's original reasoning is still valid.","vi":"Giữ tất cả các tùy chỉnh, tin tưởng rằng lý luận ban đầu của trưởng nhóm công nghệ vẫn hợp lệ.","jp":"技術リーダーの当初の推論がまだ有効であると信じて、すべてのカスタマイズを維持します。"}},{"k":"D","t":{"en":"Decide on each customization individually based on its original reason and the SDK's current capabilities.","vi":"Quyết định từng tùy chỉnh riêng lẻ dựa trên lý do ban đầu và khả năng hiện tại của SDK.","jp":"元の理由と SDK の現在の機能に基づいて、各カスタマイズを個別に決定します。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Cả hai cực đoan (xóa hết hay giữ hết) đều không dựa trên bằng chứng. Cách đúng là <b>xem xét từng tùy biến riêng lẻ</b>: lý do ban đầu là gì, và <b>SDK hiện tại đã hỗ trợ</b> nhu cầu đó chưa (SDK có thể đã bổ sung quản lý lịch sử, retry, xử lý lỗi tốt hơn). Tùy biến nào đã được SDK đáp ứng thì quay về mặc định để giảm bảo trì; tùy biến nào vẫn giải quyết nhu cầu thực thì giữ lại và ghi tài liệu.","elim":["<b>A.</b> Bỏ SDK để tự viết vòng lặp làm tăng gánh nặng bảo trì, ngược hẳn mục tiêu dễ bảo trì, và mất các cải tiến của SDK.","<b>B.</b> Quay về mặc định toàn bộ có thể tái tạo các lỗi mà tùy biến được thêm vào để sửa, nếu SDK vẫn chưa xử lý được những trường hợp đó.","<b>C.</b> Giữ tất cả chỉ vì tin lý do ban đầu bỏ qua thực tế SDK đã thay đổi; một số tùy biến có thể đã thừa hoặc xung đột với hành vi mới."]}},{"id":"ccdvf-q097","n":97,"topic":1,"type":"mcq","stem":{"en":"Your Claude application's content policy specifies categories of content it should not produce under any circumstance. The application currently has no mechanism to enforce this policy, and content matching these categories is appearing in the application's output. How would you enforce the content policy?","vi":"Chính sách nội dung của ứng dụng Claude của bạn chỉ định các danh mục nội dung mà ứng dụng này không được tạo ra trong bất kỳ trường hợp nào. Ứng dụng hiện không có cơ chế thực thi chính sách này và nội dung phù hợp với các danh mục này sẽ xuất hiện trong đầu ra của ứng dụng. Bạn sẽ thực thi chính sách nội dung như thế nào?","jp":"Claude アプリケーションのコンテンツ ポリシーでは、いかなる状況でも生成してはならないコンテンツのカテゴリを指定します。現在、アプリケーションにはこのポリシーを強制するメカニズムがなく、これらのカテゴリに一致するコンテンツがアプリケーションの出力に表示されます。コンテンツ ポリシーをどのように適用しますか?"},"options":[{"k":"A","t":{"en":"Enhance the system prompt to contain explicit instructions for the categories to avoid, complete with examples of each category. Treat the strengthened prompt as the primary enforcement mechanism for the application's content policy across all responses.","vi":"Cải thiện lời nhắc hệ thống để chứa hướng dẫn rõ ràng về các danh mục cần tránh, kèm theo ví dụ đầy đủ về từng danh mục. Hãy coi lời nhắc được tăng cường làm cơ chế thực thi chính cho chính sách nội dung của ứng dụng trên tất cả các phản hồi.","jp":"システム プロンプトを強化して、避けるべきカテゴリに関する明示的な指示を含め、各カテゴリの例を追加します。強化されたプロンプトを、すべての応答にわたるアプリケーションのコンテンツ ポリシーの主要な適用メカニズムとして扱います。"}},{"k":"B","t":{"en":"Remove the content policy entirely and let any output reach users during normal operation, accepting whatever content the application produces in response to incoming traffic.","vi":"Xóa hoàn toàn chính sách nội dung và cho phép mọi đầu ra đến tay người dùng trong quá trình hoạt động bình thường, chấp nhận mọi nội dung mà ứng dụng tạo ra để đáp ứng lưu lượng truy cập đến.","jp":"コンテンツ ポリシーを完全に削除し、通常の操作中に出力がユーザーに届くようにし、受信トラフィックに応じてアプリケーションが生成するあらゆるコンテンツを受け入れます。"}},{"k":"C","t":{"en":"Move enforcement to users by asking them to report content policy violations after the violating content has already reached them in the application's responses.","vi":"Chuyển biện pháp thực thi tới người dùng bằng cách yêu cầu họ báo cáo các hành vi vi phạm chính sách nội dung sau khi nội dung vi phạm đã đến tay họ trong phản hồi của ứng dụng.","jp":"アプリケーションの応答で違反コンテンツがユーザーに届いた後で、コンテンツ ポリシー違反を報告するようユーザーに依頼することで、ユーザーに適用を移します。"}},{"k":"D","t":{"en":"Add deterministic output filtering that checks responses against the content policy before they reach users.","vi":"Thêm tính năng lọc đầu ra xác định để kiểm tra phản hồi theo chính sách nội dung trước khi chúng đến tay người dùng.","jp":"応答がユーザーに届く前に、コンテンツ ポリシーに照らして応答をチェックする確定的な出力フィルタリングを追加します。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Chính sách quy định nội dung <b>tuyệt đối không được xuất hiện</b> thì cần một cơ chế cưỡng chế <b>xác định (deterministic)</b>, không phụ thuộc vào xác suất của mô hình. <b>Lọc đầu ra</b> kiểm tra mỗi phản hồi theo chính sách <b>trước khi đến người dùng</b> đảm bảo nội dung vi phạm bị chặn, kể cả khi mô hình bị jailbreak hay bỏ qua chỉ dẫn. Có thể giữ chỉ dẫn prompt như lớp bổ trợ, nhưng không phải lớp cưỡng chế chính.","elim":["<b>A.</b> Chỉ dẫn trong system prompt, dù có ví dụ, chỉ là hướng dẫn mang tính xác suất; mô hình vẫn có thể vi phạm nên không đủ cho yêu cầu “không bao giờ”.","<b>B.</b> Bỏ chính sách nội dung là từ bỏ hoàn toàn yêu cầu đã nêu và chấp nhận đưa nội dung có hại tới người dùng.","<b>C.</b> Để người dùng báo cáo sau khi đã nhận nội dung là phản ứng hậu kiểm; nội dung vi phạm đã đến tay người dùng, trái với chính sách."]}}]}]};

  let ok = false, mem = {};
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); ok = true; } catch(e){}
  return { ok,
    get(k){ try{ return ok ? localStorage.getItem(k) : (mem[k] ?? null); }catch(e){ return mem[k] ?? null; } },
    set(k,v){ try{ ok ? localStorage.setItem(k,v) : (mem[k]=v); }catch(e){ mem[k]=v; } },
    del(k){ try{ ok ? localStorage.removeItem(k) : delete mem[k]; }catch(e){ delete mem[k]; } } };
})();

let L = "vi";
const t = (k,...a) => { const v = T[L][k]; return typeof v === "function" ? v(...a) : v; };
/* văn bản song ngữ: luôn hiện bản tiếng Anh (đề gốc), kèm bản Việt khi giao diện là VI */
const tx = o => !o ? "" : o.en + ((L === "vi" && o.vi) ? `<span class="gloss">${o.vi}</span>` : (L === "jp" && o.jp) ? `<span class="gloss">${o.jp}</span>` : "");

/* ---------- dữ liệu phẳng ---------- */
const ALL = [], BY_ID = {};
DATA.topics.forEach(tp => tp.questions.forEach(q => {
  q.idx = ALL.length + 1;
  q.hay = fold(strip([q.stem.en, q.stem.vi, q.stem.jp,
    (q.options||[]).map(o => o.t.en + " " + (o.t.vi||"") + " " + (o.t.jp||"")).join(" "),
    (q.rows||[]).map(r => r.t.en + " " + (r.t.vi||"") + " " + (r.t.jp||"")).join(" "),
    (q.blanks||[]).map(b => (b.opts||[]).map(o => o.en).join(" ")).join(" "),
    q.explain && (q.explain.key || q.explain.text), (q.explain && q.explain.elim || []).join(" ")
  ].filter(Boolean).join(" ")));
  ALL.push(q); BY_ID[q.id] = q;
}));
const TOPICS = DATA.topics.map(d => d.n);
const TYPES = [...new Set(ALL.map(q => q.type))];
const PASS = DATA.meta.pass || 70;

/* ============================================================
   LOGIC THEO DẠNG CÂU
   ============================================================ */
function blankAnswer(q){
  if(q.type === "mcq")   return [];
  if(q.type === "yesno") return q.rows.map(() => null);
  return q.blanks.map(() => null);
}
function answeredCount(q, a){
  if(q.type === "mcq") return (a||[]).length;
  return (a||[]).filter(v => v !== null && v !== undefined).length;
}
function totalParts(q){
  if(q.type === "mcq") return q.answer.length;
  if(q.type === "yesno") return q.rows.length;
  return q.blanks.length;
}
function isComplete(q, a){ return answeredCount(q,a) >= totalParts(q); }
function isCorrect(q, a){
  if(!a) return false;
  if(q.type === "mcq")
    return a.length === q.answer.length && [...a].sort().join("") === [...q.answer].sort().join("");
  if(q.type === "yesno") return q.rows.every((r,i) => a[i] === r.a);
  return q.blanks.every((b,i) => a[i] === b.a);
}
function stampHTML(q){
  if(q.type === "mcq")
    return `<div class="stamp"><span class="t">${t("ansTitle")}</span><span class="v">${q.answer.join(" ")}</span></div>`;
  if(q.type === "yesno")
    return `<div class="stamp"><span class="t">${t("ansTitle")}</span><span class="v">${
      q.rows.map(r => r.a === "Y" ? "Y" : "N").join(" ")}</span></div>`;
  return `<div class="stamp txt"><span class="t">${t("ansTitle")}</span><span class="v">${
    q.blanks.map(b => strip(b.opts[b.a].en)).join(" · ")}</span></div>`;
}

/* ---------- thân câu hỏi (dùng chung cho ôn tập / thi / xem lại) ---------- */
function bodyHTML(q, a, done, act){
  const P = act ? `data-act="${act}"` : "";
  if(q.type === "mcq"){
    return `<ul class="opts">` + q.options.map(o => {
      const right = q.answer.includes(o.k), pick = (a||[]).includes(o.k);
      return `<li><button class="opt" ${P} data-k="${o.k}" data-right="${right?1:0}" data-pick="${pick?1:0}"
          ${done?'aria-disabled="true"':""}>
        <span class="k">${o.k}</span><span class="tx">${tx(o.t)}</span>
        <span class="mk mk-you">${t("markYou")}</span><span class="mk mk-ok">${t("markOk")}</span>
      </button></li>`; }).join("") + `</ul>`;
  }
  if(q.type === "yesno"){
    return `<ul class="ynlist">` + q.rows.map((r,i) => {
      const v = a ? a[i] : null;
      const right = v !== null && v === r.a;
      return `<li class="yn" data-right="${right?1:0}">
        <div class="ynt">${tx(r.t)}</div>
        <div class="ynb" role="group">
          <button ${P} data-i="${i}" data-v="Y" data-correct="${r.a==="Y"?1:0}" aria-pressed="${v==="Y"}">${t("yes")}</button>
          <button ${P} data-i="${i}" data-v="N" data-correct="${r.a==="N"?1:0}" aria-pressed="${v==="N"}">${t("no")}</button>
        </div></li>`; }).join("") + `</ul>`;
  }
  return `<div class="blanks">` + q.blanks.map((b,i) => {
    const v = a ? a[i] : null;
    const right = v !== null && v === b.a;
    return `<div class="blank" data-right="${right?1:0}">
      ${b.label ? `<span class="blabel">${tx(b.label)}</span>` : ""}
      <label class="sel ${v!==null?"on":""}">
        <select ${P} data-i="${i}">
          <option value="">— —</option>
          ${b.opts.map((o,j) => {
            const en = strip(o.en), vi = o.vi ? strip(o.vi) : "";
            return `<option value="${j}" ${v===j?"selected":""}${vi?` title="${esc(vi)}"`:""}>${esc(en)}</option>`;
          }).join("")}
        </select><span class="cap"></span>
      </label>
      <span class="ansline ${right?"ok":"bad"}">${t("ansTitle")}: ${esc(strip(b.opts[b.a].en))}${
        L === "vi" && b.opts[b.a].vi ? ` — ${esc(strip(b.opts[b.a].vi))}` : ""}${L === "jp" && b.opts[b.a].jp ? ` — ${esc(strip(b.opts[b.a].jp))}` : ""}</span>
    </div>`; }).join("") + `</div>`;
}

/* ---------- khối giải thích ---------- */
function noteHTML(r){
  return `<div class="notewrap"><span class="lbl">${t("secNote")}</span>
    <textarea data-act="note" rows="2" placeholder="${esc(t("notePh"))}">${esc(r.note||"")}</textarea></div>`;
}
function revealHTML(q, verdict, extra){
  const e = q.explain || {};
  const two = !!(e.key && e.elim && e.elim.length);
  let secs = "";
  if(e.key)  secs += `<div><h4 class="sech">${t("secKey")}</h4><p class="prose">${e.key}</p></div>`;
  if(e.elim && e.elim.length)
    secs += `<div><h4 class="sech">${t("secElim")}</h4><ul class="elim">${e.elim.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  if(e.text) secs += `<div><h4 class="sech">${t("secExp")}</h4><p class="prose">${e.text}</p></div>`;
  const conf = q.conf ? `<span class="conf ${q.conf.toLowerCase()}">${t("conf"+q.conf.toUpperCase())}</span>` : "";
  return `<div class="rev">
    <div class="revtop">${stampHTML(q)}${verdict}${conf}</div>
    <div class="revgrid ${two?"two":""}">${secs}</div>
    ${q.cite ? `<p class="cite">${t("source")}: ${q.cite}</p>` : ""}
    ${extra || ""}
  </div>`;
}

/* ============================================================
   TRẠNG THÁI
   ============================================================ */
const S = { mode:"study", f:{topic:"all",status:"all",type:"all",q:""},
            p:{}, history:[], cur:null, exam:null, reviewWrongOnly:false };
const rec = id => (S.p[id] ||= { a:null, done:0, ok:null, flag:0, note:"", n:0 });
const ansOf = q => { const r = rec(q.id); if(!r.a) r.a = blankAnswer(q); return r.a; };

function save(){
  const e = S.exam;
  const exam = (e && e.phase === "run") ? {
    ids:e.list.map(x=>x.id), order:e.order, answers:e.answers, flags:e.flags,
    pos:e.pos, started:e.started, duration:e.duration, cfg:e.cfg } : null;
  store.set(KEY, JSON.stringify({ v:2, lang:L, theme:document.documentElement.dataset.theme,
                                  p:S.p, history:S.history, exam }));
}
function load(){
  try{
    const d = JSON.parse(store.get(KEY) || "{}");
    if(d.p) S.p = d.p;
    if(Array.isArray(d.history)) S.history = d.history;
    if(d.lang) L = d.lang;
    if(d.exam && d.exam.ids){
      const list = d.exam.ids.map(id => {
        const q = BY_ID[id]; if(!q) return null;
        const ord = d.exam.order && d.exam.order[id];
        if(ord && q.options) return Object.assign({}, q, { options: ord.map(k => q.options.find(o=>o.k===k)).filter(Boolean) });
        return q;
      }).filter(Boolean);
      if(list.length === d.exam.ids.length)
        S.exam = { phase:"run", list, order:d.exam.order, answers:d.exam.answers||{}, flags:d.exam.flags||{},
                   pos:d.exam.pos||0, started:d.exam.started, duration:d.exam.duration, cfg:d.exam.cfg, timer:null };
    }
  }catch(e){}
}

/* ---------- lọc ---------- */
function filtered(){
  const term = fold(S.f.q.trim());
  return ALL.filter(q => {
    if(S.f.topic !== "all" && q.topic !== +S.f.topic) return false;
    if(S.f.type !== "all" && q.type !== S.f.type) return false;
    const r = S.p[q.id];
    if(S.f.status === "todo"  && r && r.done) return false;
    if(S.f.status === "right" && !(r && r.ok === true)) return false;
    if(S.f.status === "wrong" && !(r && r.ok === false)) return false;
    if(S.f.status === "flag"  && !(r && r.flag)) return false;
    if(term && !q.hay.includes(term)) return false;
    return true;
  });
}
function statsOf(list){
  let done=0, right=0, flag=0;
  list.forEach(q => { const r=S.p[q.id]; if(!r) return;
    if(r.ok === true || r.ok === false){ done++; if(r.ok) right++; }
    if(r.flag) flag++; });
  return { done, right, flag, total:list.length };
}

function renderAll(){ renderRail(); renderMain(); renderAside(); applyI18n(); }

function applyI18n(){
  document.documentElement.lang = L;
  $$("[data-t]").forEach(el => { const v = T[L][el.dataset.t]; if(typeof v === "string") el.textContent = v; });
  $$("[data-t-ph]").forEach(el => { const v = T[L][el.dataset.tPh]; if(typeof v === "string") el.placeholder = v; });
  $("#storeNote").textContent = store.ok ? t("okStore") : t("noStore");
  $$("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === L));
  $$("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === S.mode));
}

function renderRail(){
  // một hàm dựng hàng dùng chung cho MỌI danh sách lọc — thêm bộ lọc mới thì
  // gọi lại nó, đừng đẻ ra kiểu hiển thị thứ hai.
  const listRow = (key, cur, v, lab, count, mark) =>
    `<button class="srow" data-f-key="${key}" data-v="${v}" aria-pressed="${String(v)===String(cur)}">
      <span class="dot ${mark||""}"></span><span class="nm">${esc(lab)}</span><span class="ct">${count}</span>
    </button>`;

  // ----- trạng thái -----
  const counts = (() => {
    let todo=0, right=0, wrong=0, flag=0;
    ALL.forEach(q => { const r = S.p[q.id];
      if(!r || !r.done) todo++;
      if(r && r.ok === true) right++;
      if(r && r.ok === false) wrong++;
      if(r && r.flag) flag++; });
    return {all:ALL.length, todo, right, wrong, flag};
  })();
  $("#fStatus").innerHTML = [
    ["all", t("sAll"), ""], ["todo", t("sTodo"), ""], ["right", t("sRight"), "g"],
    ["wrong", t("sWrong"), "r"], ["flag", t("sFlag"), "f"]
  ].map(([v,lab,mk]) => listRow("status", S.f.status, v, lab, counts[v], mk)).join("");

  // ----- dạng câu: chỉ hiện khi đề có từ hai dạng trở lên -----
  const typeInfo = {mcq:[t("kMcq"),"m-mcq"], yesno:[t("kYesno"),"m-yesno"], dropdown:[t("kDrop"),"m-drop"]};
  const typeBlock = $("#fTypeBlk");
  if(TYPES.length < 2) typeBlock.classList.add("hide");
  else {
    typeBlock.classList.remove("hide");
    const tc = Object.fromEntries(TYPES.map(x => [x, ALL.filter(q => q.type === x).length]));
    $("#fType").innerHTML = listRow("type", S.f.type, "all", t("kAll"), ALL.length, "")
      + TYPES.map(x => listRow("type", S.f.type, x, typeInfo[x][0], tc[x], typeInfo[x][1])).join("");
  }

  const row = (v, name, list) => {
    const s = statsOf(list);
    return `<button class="trow" data-f-key="topic" data-v="${v}" aria-pressed="${String(v)===String(S.f.topic)}">
      <span class="nm">${esc(name)}</span><span class="ct">${s.done}/${s.total}</span>
      <span class="meter"><i class="g" style="width:${pct(s.right,s.total)}%"></i><i class="r" style="width:${pct(s.done-s.right,s.total)}%"></i></span>
    </button>`;
  };
  $("#fTopics").innerHTML = row("all", t("sAll"), ALL) +
    TOPICS.map(n => row(n, t("topicN", n), ALL.filter(q => q.topic === n))).join("");
}

/* ---------- vùng chính ---------- */
function renderMain(){
  const v = $("#view");
  v.innerHTML = S.mode === "study" ? viewStudy() : S.mode === "stats" ? viewStats() : viewExam();
}

function viewStudy(){
  const list = filtered();
  const head = `<header class="head">
      <div><h2>${t("studyTitle")}</h2><p>${t("studyLead", list.length)}</p></div>
      <div class="r"><span class="lbl">${esc(DATA.meta.code)}</span></div></header>`;
  if(!list.length) return head + `<div class="empty"><b>${t("emptyT")}</b>${t("emptyD")}</div>`;
  return head + list.map(recordHTML).join("");

function typeTag(q){
  if(q.type === "yesno") return `<span class="tag multi">${t("tYesno")}</span>`;
  if(q.type === "dropdown") return `<span class="tag multi">${t("tDrop")}</span>`;
  if(q.multi) return `<span class="tag multi">${t("multi", q.answer.length)}</span>`;
  return "";
}

function recordHTML(q){
  const r = rec(q.id), a = ansOf(q);
  const tags = [`<span class="tag">${esc(t("topicN", q.topic))}</span>`,
                `<span class="tag">${esc(t("qN", q.n))}</span>`, typeTag(q)];
  if(r.done && r.ok === true)  tags.push(`<span class="tag ok">${t("verdictOk")}</span>`);
  if(r.done && r.ok === false) tags.push(`<span class="tag bad">${t("verdictBad")}</span>`);
  tags.push(`<button class="flagbtn" data-act="flag" aria-pressed="${!!r.flag}"
      title="${esc(r.flag?t("unflag"):t("flag"))}" aria-label="${esc(r.flag?t("unflag"):t("flag"))}">${ICON.flag}</button>`);

  const n = answeredCount(q,a), total = totalParts(q);
  const bar = r.done
    ? `<button class="btn" data-act="again">${t("again")}</button>`
    : `<button class="btn solid" data-act="check" ${isComplete(q,a)?"":"disabled"}>${t("check")}</button>
       <button class="btn" data-act="reveal">${t("reveal")}</button>
       <span class="note">${n===0 ? t("pickFirst") : n>=total ? t("answered") : t("partial", n, total)}</span>`;

  const verdict = r.ok === true  ? `<span class="verdict ok">${t("verdictOk")}</span>`
                : r.ok === false ? `<span class="verdict bad">${t("verdictBad")}</span>`
                : `<span class="note">${t("verdictNone")}</span>`;

  return `<article class="rec ${S.cur===q.id?"cur":""}" id="rec-${q.id}" data-id="${q.id}" data-done="${r.done?1:0}">
    <div class="rechead"><span class="idx">${pad2(q.idx)}</span><div class="tags">${tags.join("")}</div></div>
    <p class="stem">${tx(q.stem)}</p>
    ${q.img ? `<img class="qimg" src="${q.img}" alt="" data-zoom>` : ""}
    <div class="qbody">${bodyHTML(q, a, r.done, "ans")}</div>
    <div class="bar">${bar}</div>
    ${revealHTML(q, verdict, noteHTML(r))}
  </article>`;
}

function refreshRecord(id, focusSel){
  const q = BY_ID[id];
  let node = document.getElementById("rec-"+id);
  if(!q || !node) return;
  node.outerHTML = recordHTML(q);
  node = document.getElementById("rec-"+id);
  if(node && focusSel){ const n = node.querySelector(focusSel); if(n) n.focus(); }
}

/* ---------- ghi nhận câu trả lời ---------- */
function applyAnswer(q, a, el){
  if(q.type === "mcq"){
    const k = el.dataset.k;
    if(q.answer.length > 1){
      const i = a.indexOf(k);
      if(i >= 0) a.splice(i,1);
      else { if(a.length >= q.answer.length) a.shift(); a.push(k); }
    } else { a.length = 0; if(!el.dataset.was) a.push(k); }
  } else if(q.type === "yesno"){
    const i = +el.dataset.i;
    a[i] = a[i] === el.dataset.v ? null : el.dataset.v;
  } else {
    const i = +el.dataset.i;
    a[i] = el.value === "" ? null : +el.value;
  }
}

function examPool(cfg){
  let p = ALL;
  if(cfg.topic !== "all") p = p.filter(q => q.topic === +cfg.topic);
  if(cfg.source === "wrong") p = p.filter(q => { const r=S.p[q.id]; return r && r.ok === false; });
  if(cfg.source === "flag")  p = p.filter(q => { const r=S.p[q.id]; return r && r.flag; });
  return p;
}
function viewExam(){
  const e = S.exam;
  if(!e || e.phase === "setup") return examSetup();
  if(e.phase === "run") return examRun();
  return examResult();
}
function selectHTML(name, cur, opts){
  return `<label class="fldw"><span class="lbl">${name}</span>

    }</select><span class="cap"></span></span></label>`;
}

function examResult(){
  const R = S.exam.result;
  const p = R.pct >= PASS, C = 2*Math.PI*58;
  const rows = TOPICS.map(n => {

/* ============================================================
   HÀNH ĐỘNG
   ============================================================ */
function checkRecord(id, revealOnly){
  const q = BY_ID[id], r = rec(id), a = ansOf(q);
  r.done = 1;
  r.ok = (revealOnly && answeredCount(q,a) === 0) ? null : isCorrect(q, a);
  r.n = (r.n||0) + 1;
  save(); refreshRecord(id); renderRail(); renderAside();
}
function setMode(m){
  S.mode = m;
  if(m === "exam" && !S.exam) S.exam = { phase:"setup", cfg:{count:30,mins:45,topic:"all",shuffle:"yes",source:"all"} };
  if(m === "exam" && S.exam.phase === "run" && !S.exam.timer && S.exam.duration){
    tickTimer(); S.exam.timer = setInterval(tickTimer, 1000);
  }
  renderAll(); window.scrollTo({top:0});
}
function startExam(){
  const cfg = S.exam.cfg, pool = examPool(cfg);
  if(!pool.length) return;
  const count = Math.max(1, Math.min(+cfg.count || 1, pool.length));
  const picked = shuffle(pool).slice(0, count);
  const order = {};
  const list = picked.map(q => {
    if(cfg.shuffle === "yes" && q.options){
      const opts = shuffle(q.options);
      order[q.id] = opts.map(o => o.k);
      return Object.assign({}, q, { options: opts });
    }
    return q;
  });
  clearInterval(S.exam.timer);
  S.exam = { phase:"run", list, order, answers:{}, flags:{}, pos:0, started:Date.now(),
             duration:(+cfg.mins||0)*60, cfg, timer:null };
  if(S.exam.duration){ tickTimer(); S.exam.timer = setInterval(tickTimer, 1000); }
  save(); renderAll(); window.scrollTo({top:0});
}
function tickTimer(){
  const e = S.exam;
  if(!e || e.phase !== "run" || !e.duration) return;
  const left = e.duration - Math.floor((Date.now()-e.started)/1000);
  const txt = clock(Math.max(0,left));
  ["timerOut","timerHead"].forEach(id => {
    const n = document.getElementById(id);
    if(n){ n.textContent = txt; n.classList.toggle("low", left < 60); }
  });
  if(left <= 0){ gradeExam(); toast(t("timeUp")); }
}
function gradeExam(){
  const e = S.exam;
  if(!e || e.phase !== "run") return;
  clearInterval(e.timer); e.timer = null;
  let correct = 0, blank = 0;
  const detail = e.list.map((q,i) => {
    const given = e.answers[i] || blankAnswer(q);
    const filled = answeredCount(q, given) > 0;
    if(!filled) blank++;
    const ok = filled && isCorrect(q, given);
    if(ok) correct++;
    const r = rec(q.id);
    if(filled){ r.a = JSON.parse(JSON.stringify(given)); r.done = 1; r.ok = ok; r.n = (r.n||0)+1; }
    if(e.flags[i]) r.flag = 1;
    return { q, given, ok };
  });
  const secs = Math.floor((Date.now()-e.started)/1000);
  const scope = e.cfg.topic === "all" ? t("allTopics") : t("topicN", e.cfg.topic);
  e.result = { detail, correct, wrong:e.list.length-correct, blank, pct:pct(correct,e.list.length), secs };
  e.phase = "result"; S.mode = "exam"; S.reviewWrongOnly = false;
  S.history.push({ at:new Date().toISOString(), pct:e.result.pct, c:correct, t:e.list.length, secs, scope });
  save(); renderAll(); window.scrollTo({top:0});
}

/* ---------- hộp thoại ---------- */
function dialog(title, body, confirmLabel, onYes, danger){
  const ov = document.createElement("div");
  ov.className = "ov";
  ov.innerHTML = `<div class="box" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(body)}</p>
    <div class="act"><button class="btn" data-no>${esc(t("cancel"))}</button>
    ${confirmLabel?`<button class="btn ${danger?"danger":"solid"}" data-yes>${esc(confirmLabel)}</button>`:""}</div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click", ev => {
    if(ev.target === ov || ev.target.hasAttribute("data-no")) ov.remove();
    if(ev.target.hasAttribute("data-yes")){ ov.remove(); onYes && onYes(); }
  });
  (ov.querySelector("[data-yes]") || ov.querySelector("[data-no]")).focus();
}
function helpDialog(){
  const rows = [["A B C D",t("kPick")],["Enter",t("kCheck")],["F",t("kFlag")],["← →",t("kNav")],["/",t("kSearch")],["?",t("kHelp")],["Esc",t("kEsc")]];
  const ov = document.createElement("div");
  ov.className = "ov";
  ov.innerHTML = `<div class="box" role="dialog" aria-modal="true"><h3>${esc(t("keysTitle"))}</h3>
    <div class="keys" style="margin-bottom:18px">${rows.map(([k,d])=>`<div class="keyrow"><kbd>${esc(k)}</kbd><span>${esc(d)}</span></div>`).join("")}</div>
    <div class="act"><button class="btn" data-no>${esc(t("close"))}</button></div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click", ev => { if(ev.target === ov || ev.target.hasAttribute("data-no")) ov.remove(); });
  ov.querySelector("[data-no]").focus();
}
function zoom(src){
  const ov = document.createElement("div");
  ov.className = "ov zoom";
  ov.innerHTML = `<img src="${src}" alt="">`;
  ov.addEventListener("click", () => ov.remove());
  document.body.appendChild(ov);
}
let toastTimer = null;
function toast(msg){
  $$(".toast").forEach(n => n.remove());
  const n = document.createElement("div");
  n.className = "toast"; n.textContent = msg; n.setAttribute("role","status");
  document.body.appendChild(n);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => n.remove(), 2800);
}

/* ---------- xuất / nhập ---------- */
function exportData(){
  const blob = new Blob([JSON.stringify({v:2, code:DATA.meta.code, exportedAt:new Date().toISOString(),
                                         p:S.p, history:S.history}, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${DATA.meta.code.toLowerCase()}-progress-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href); toast(t("exported"));
}
function importData(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const d = JSON.parse(fr.result);
      if(!d || typeof d.p !== "object") throw 0;
      S.p = d.p; S.history = Array.isArray(d.history) ? d.history : [];
      save(); renderAll(); toast(t("imported"));
    }catch(e){ toast(t("badFile")); }
  };
  fr.onerror = () => toast(t("badFile"));
  fr.readAsText(file);
}

/* ============================================================
   SỰ KIỆN
   ============================================================ */
document.addEventListener("click", ev => {
  if(ev.target.matches("[data-zoom]")){ zoom(ev.target.src); return; }
  // <select> do bộ lắng nghe "change" lo. Nếu để lọt vào đây, việc vẽ lại bản
  // ghi sẽ thay thế chính phần tử đang mở, làm danh sách đóng sập ngay khi bấm.
  if(ev.target.tagName === "SELECT") return;
  const el = ev.target.closest("[data-mode],[data-lang],[data-f-key],[data-act],[data-jump],[data-go]");
  if(!el) return;

  if(el.dataset.mode){ setMode(el.dataset.mode); return; }
  if(el.dataset.lang){ L = el.dataset.lang; save(); renderAll(); return; }
  if(el.dataset.fKey){
    S.f[el.dataset.fKey] = el.dataset.v;
    renderRail(); renderMain();
    if(window.innerWidth < 900) document.body.classList.remove("rail-open");
    return;
  }
  if(el.dataset.jump){
    const id = el.dataset.jump;
    if(S.mode !== "study") S.mode = "study";
    S.f = {topic:"all",status:"all",type:"all",q:""}; $("#search").value = "";
    renderAll();
    const n = document.getElementById("rec-"+id);
    if(n) n.scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }
  if(el.dataset.go !== undefined && S.exam && S.exam.phase === "run"){
    S.exam.pos = +el.dataset.go; save(); renderMain(); renderAside(); window.scrollTo({top:0}); return;
  }

  const recEl = el.closest(".rec"), id = recEl && recEl.dataset.id, act = el.dataset.act;
  switch(act){
    case "ans": {
      if(!id) break;
      const q = BY_ID[id], r = rec(id);
      if(r.done) break;
      const a = ansOf(q);
      if(q.type === "mcq" && q.answer.length === 1 && a[0] === el.dataset.k) el.dataset.was = "1";
      applyAnswer(q, a, el);
      save();
      refreshRecord(id, q.type === "mcq" ? `[data-act="ans"][data-k="${el.dataset.k}"]`
                                         : `[data-act="ans"][data-i="${el.dataset.i}"]`);
      break;
    }
    case "check":  if(id) checkRecord(id, false); break;
    case "reveal": if(id) checkRecord(id, true);  break;
    case "again": {
      if(!id) break;
      const r = rec(id); r.a = blankAnswer(BY_ID[id]); r.done = 0; r.ok = null;
      save(); refreshRecord(id, '[data-act="check"]'); renderRail(); renderAside(); break;
    }
    case "flag": {
      if(!id) break;
      const r = rec(id); r.flag = r.flag ? 0 : 1;
      save(); refreshRecord(id, '.flagbtn'); renderRail(); renderAside(); break;
    }
    case "start":  startExam(); break;
    case "resume": S.exam.phase = "run"; renderAll(); break;
    case "discard": clearInterval(S.exam.timer);
                    S.exam = {phase:"setup", cfg:S.exam.cfg}; save(); renderAll(); break;
    case "eans": {
      const e = S.exam, q = e.list[e.pos];
      const a = e.answers[e.pos] || (e.answers[e.pos] = blankAnswer(q));
      if(q.type === "mcq" && q.answer.length === 1 && a[0] === el.dataset.k) el.dataset.was = "1";
      applyAnswer(q, a, el);
      save(); renderMain(); renderAside(); break;
    }
    case "eprev": S.exam.pos = Math.max(0, S.exam.pos-1); save(); renderMain(); renderAside(); window.scrollTo({top:0}); break;
    case "enext": S.exam.pos = Math.min(S.exam.list.length-1, S.exam.pos+1); save(); renderMain(); renderAside(); window.scrollTo({top:0}); break;
    case "eflag": S.exam.flags[S.exam.pos] = !S.exam.flags[S.exam.pos]; save(); renderMain(); renderAside(); break;
    case "esubmit": {
      const e = S.exam;
      const blank = e.list.filter((q,i) => answeredCount(q, e.answers[i]) === 0).length;
      dialog(t("confirmSubmitT"), blank ? t("confirmSubmitD", blank) : t("confirmSubmitD0"), t("confirm"), gradeExam);
      break;
    }
    case "newexam": clearInterval(S.exam.timer);
                    S.exam = {phase:"setup", cfg:S.exam.cfg}; save(); renderAll(); window.scrollTo({top:0}); break;
    case "togglewrong": S.reviewWrongOnly = !S.reviewWrongOnly; renderMain(); break;
  }
});

document.addEventListener("input", ev => {
  const el = ev.target;
  if(el.id === "search"){ S.f.q = el.value; renderMain(); return; }
  if(el.dataset.act === "note"){
    const r = el.closest(".rec");
    if(r){ rec(r.dataset.id).note = el.value; clearTimeout(el._tm); el._tm = setTimeout(save, 400); }
    return;
  }
  if(el.dataset.cfg && S.exam){ S.exam.cfg[el.dataset.cfg] = el.value; renderMain(); }
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if(el.dataset.cfg && S.exam){ S.exam.cfg[el.dataset.cfg] = el.value; renderMain(); return; }
  if(el.dataset.act === "ans"){
    const r = el.closest(".rec"), q = BY_ID[r.dataset.id];
    if(rec(q.id).done) return;
    applyAnswer(q, ansOf(q), el);
    save(); refreshRecord(q.id, `[data-act="ans"][data-i="${el.dataset.i}"]`); return;
  }
  if(el.dataset.act === "eans"){
    const e = S.exam, q = e.list[e.pos];
    const a = e.answers[e.pos] || (e.answers[e.pos] = blankAnswer(q));
    applyAnswer(q, a, el); save(); renderMain(); renderAside(); return;
  }
  if(el.id === "fileIn" && el.files && el.files[0]){ importData(el.files[0]); el.value = ""; }
});

document.addEventListener("focusin", ev => {
  const r = ev.target.closest && ev.target.closest(".rec");
  if(r && r.dataset.id && r.dataset.id !== S.cur){
    const prev = S.cur ? document.getElementById("rec-"+S.cur) : null;
    if(prev) prev.classList.remove("cur");
    S.cur = r.dataset.id; r.classList.add("cur");
  }
});

$("#themeBtn").addEventListener("click", () => {
  document.documentElement.dataset.theme = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  save();
});
$("#helpBtn").addEventListener("click", helpDialog);
$("#railToggle").addEventListener("click", e => {
  e.currentTarget.setAttribute("aria-expanded", document.body.classList.toggle("rail-open"));
});
$("#btnExport").addEventListener("click", exportData);
$("#btnImport").addEventListener("click", () => $("#fileIn").click());
$("#btnReset").addEventListener("click", () =>
  dialog(t("resetT"), t("resetD"), t("del"), () => {
    S.p = {}; S.history = []; S.cur = null;
    if(S.exam) clearInterval(S.exam.timer);
    S.exam = null;
    store.del(KEY); save(); renderAll(); toast(t("del"));
  }, true));

document.addEventListener("keydown", ev => {
  const tag = (ev.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || tag === "select";
  if(ev.key === "Escape"){ $$(".ov").forEach(n => n.remove()); if(typing) ev.target.blur(); return; }
  if(typing) return;
  if(ev.key === "/"){ ev.preventDefault(); $("#search").focus(); return; }
  if(ev.key === "?"){ ev.preventDefault(); helpDialog(); return; }
  if(document.querySelector(".ov")) return;

  const e = S.exam, inExam = S.mode === "exam" && e && e.phase === "run";
  if(inExam){
    if(ev.key === "ArrowLeft"  && e.pos > 0){ e.pos--; save(); renderMain(); renderAside(); return; }
    if(ev.key === "ArrowRight" && e.pos < e.list.length-1){ e.pos++; save(); renderMain(); renderAside(); return; }
    if(/^[a-fA-F]$/.test(ev.key) && ev.key.toLowerCase() !== "f"){
      const b = document.querySelector(`[data-act="eans"][data-k="${ev.key.toUpperCase()}"]`);
      if(b) b.click(); return;
    }
    if(ev.key.toLowerCase() === "f"){ e.flags[e.pos] = !e.flags[e.pos]; save(); renderMain(); renderAside(); return; }
    return;
  }
  if(S.mode === "study" && S.cur){
    const node = document.getElementById("rec-"+S.cur);
    if(!node) return;
    if(/^[a-fA-F]$/.test(ev.key) && ev.key.toLowerCase() !== "f"){
      const b = node.querySelector(`[data-act="ans"][data-k="${ev.key.toUpperCase()}"]`);
      if(b) b.click(); return;
    }
    if(ev.key === "Enter"){
      const b = node.querySelector('[data-act="check"]:not([disabled])') || node.querySelector('[data-act="reveal"]');
      if(b) b.click(); return;
    }
    if(ev.key.toLowerCase() === "f"){ const b = node.querySelector('[data-act="flag"]'); if(b) b.click(); return; }
    if(ev.key === "ArrowDown" || ev.key === "ArrowRight"){ ev.preventDefault(); stepRecord(1); return; }
    if(ev.key === "ArrowUp"   || ev.key === "ArrowLeft"){  ev.preventDefault(); stepRecord(-1); return; }
  }
});
function stepRecord(d){
  const list = $$(".rec");
  const i = list.findIndex(n => n.dataset.id === S.cur);
  const next = list[Math.max(0, Math.min(list.length-1, i+d))];
  if(next){ const b = next.querySelector(".opt, .ynb button, select"); if(b) b.focus(); next.scrollIntoView({block:"nearest"}); }
}

/* ---------- khởi động ---------- */
$("#markCode").textContent = DATA.meta.code;
$$("[data-icon]").forEach(el => el.outerHTML = ICON[el.dataset.icon]);
load();
if(S.exam && S.exam.phase === "run"){ S.mode = "exam"; if(S.exam.duration){ tickTimer(); S.exam.timer = setInterval(tickTimer,1000); } }
renderAll();
