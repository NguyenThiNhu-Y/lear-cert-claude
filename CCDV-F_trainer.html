ổi?","jp":"あなたのチームは、複数のダウンストリーム システムで使用されるクロード アプリケーション全体で複数のプロンプト バージョンを更新する構成変更を展開する準備をしています。この変更はすでにステージングでテストされていますが、チームは、即時の変更がアプリケーションの出力に依存する各下流システムにどのような影響を与えるかを評価していません。変更を展開する前に何をしますか?"},"options":[{"k":"A","t":{"en":"Assess the configuration impact on each downstream system before rolling out, and coordinate with downstream system owners as needed.","vi":"Đánh giá tác động của cấu hình lên từng hệ thống hạ nguồn trước khi triển khai và phối hợp với chủ sở hữu hệ thống hạ nguồn nếu cần.","jp":"展開する前に各ダウンストリーム システムへの構成の影響を評価し、必要に応じてダウンストリーム システムの所有者と調整します。"}},{"k":"B","t":{"en":"Document the prompt version changes in the application changelog and proceed with the rollout, treating the staging test results as sufficient evidence of impact across all downstream systems.","vi":"Ghi lại các thay đổi phiên bản kịp thời trong nhật ký thay đổi ứng dụng và tiến hành triển khai, coi kết quả thử nghiệm dàn dựng là bằng chứng đầy đủ về tác động trên tất cả các hệ thống hạ nguồn.","jp":"プロンプトのバージョン変更をアプリケーション変更ログに記録し、ステージング テストの結果をすべてのダウンストリーム システムにわたる影響の十分な証拠として扱い、ロールアウトを進めます。"}},{"k":"C","t":{"en":"Notify downstream system owners that a change is coming and schedule the rollout for the following week, without conducting a formal impact assessment.","vi":"Thông báo cho chủ sở hữu hệ thống hạ nguồn rằng sắp có thay đổi và lên lịch triển khai vào tuần tiếp theo mà không cần tiến hành đánh giá tác động chính thức.","jp":"正式な影響評価は行わずに、下流のシステム所有者に変更が予定されていることを通知し、翌週のロールアウトをスケジュールします。"}},{"k":"D","t":{"en":"Limit the rollout to systems that were explicitly included in staging testing, and defer all other downstream systems until a later release cycle.","vi":"Giới hạn việc triển khai ở các hệ thống đã được đưa vào thử nghiệm dàn dựng một cách rõ ràng và trì hoãn tất cả các hệ thống hạ nguồn khác cho đến chu kỳ phát hành sau này.","jp":"展開をステージング テストに明示的に含まれたシステムに限定し、他のすべてのダウンストリーム システムは後のリリース サイクルまで延期します。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Test ở staging chỉ chứng minh thay đổi chạy được trong ứng dụng, chưa chứng minh <b>đầu ra mới tương thích với từng hệ thống downstream</b> (định dạng, độ dài, giọng điệu, trường dữ liệu có thể thay đổi khi đổi prompt). Vì vậy trước khi rollout cần <b>đánh giá tác động của cấu hình lên từng hệ thống phụ thuộc</b> và <b>phối hợp với chủ sở hữu</b> các hệ thống đó khi cần. Đây là quản lý thay đổi chuẩn cho một thành phần có nhiều consumer.","elim":["<b>B.</b> Ghi changelog rồi rollout, coi kết quả staging là đủ, bỏ qua đúng khoảng trống mà đề nêu: chưa ai đánh giá tác động lên downstream.","<b>C.</b> Chỉ thông báo và dời lịch không phải là đánh giá tác động; downstream vẫn có thể hỏng khi thay đổi được áp dụng.","<b>D.</b> Giới hạn rollout theo phạm vi test staging không khả thi khi các hệ thống cùng tiêu thụ đầu ra của một ứng dụng, và vẫn không đánh giá được tác động thực tế."]}},{"id":"ccdvf-q016","n":16,"topic":1,"type":"mcq","stem":{"en":"You are designing a Claude application that maintains user sessions across multi-turn conversations. The product team has asked how the application will handle session lifecycle: when sessions should expire, how state is reset, and how the application avoids carrying stale context into new conversations. How would you design session lifecycle?","vi":"Bạn đang thiết kế một ứng dụng Claude duy trì phiên của người dùng qua các cuộc hội thoại nhiều lượt. Nhóm sản phẩm đã hỏi cách ứng dụng sẽ xử lý vòng đời phiên: khi nào phiên hết hạn, cách đặt lại trạng thái và cách ứng dụng tránh mang bối cảnh cũ vào các cuộc hội thoại mới. Bạn sẽ thiết kế vòng đời phiên như thế nào?","jp":"あなたは、複数ターンの会話にわたってユーザー セッションを維持する Claude アプリケーションを設計しています。製品チームは、アプリケーションがセッションのライフサイクルをどのように処理するか、つまりセッションがいつ期限切れになるか、状態がどのようにリセットされるか、アプリケーションが新しい会話に古いコンテキストを持ち込むことをどのように回避するかを尋ねました。セッションのライフサイクルをどのように設計しますか?"},"options":[{"k":"A","t":{"en":"Define explicit session expiration rules, state reset triggers, and rules for starting fresh sessions so stale context does not leak into new conversations.","vi":"Xác định các quy tắc hết hạn phiên rõ ràng, trình kích hoạt đặt lại trạng thái và quy tắc bắt đầu các phiên mới để bối cảnh cũ không bị rò rỉ vào các cuộc hội thoại mới.","jp":"明示的なセッション有効期限ルール、状態リセット トリガー、および新しいセッションを開始するためのルールを定義して、古いコンテキストが新しい会話に漏洩しないようにします。"}},{"k":"B","t":{"en":"Define a single short session timeout that applies across all conversations and treat the timeout as the application's complete session lifecycle mechanism.","vi":"Xác định thời gian chờ phiên ngắn duy nhất áp dụng cho tất cả các cuộc hội thoại và coi thời gian chờ là cơ chế vòng đời phiên hoàn chỉnh của ứng dụng.","jp":"すべての会話に適用される単一の短いセッション タイムアウトを定義し、タイムアウトをアプリケーションの完全なセッション ライフサイクル メカニズムとして扱います。"}},{"k":"C","t":{"en":"Define explicit session expiration rules but rely on users to start new conversations when they want fresh context, with no automatic reset triggers in the application.","vi":"Xác định các quy tắc hết hạn phiên rõ ràng nhưng dựa vào người dùng để bắt đầu cuộc trò chuyện mới khi họ muốn có bối cảnh mới mà không có trình kích hoạt đặt lại tự động trong ứng dụng.","jp":"明示的なセッション有効期限ルールを定義しますが、アプリケーションで自動リセット トリガーを使用せず、新しいコンテキストが必要なときにユーザーが新しい会話を開始することに依存します。"}},{"k":"D","t":{"en":"Define state reset triggers tied to specific application events but apply them across all sessions globally, with no per-session expiration rules.","vi":"Xác định trình kích hoạt đặt lại trạng thái gắn với các sự kiện ứng dụng cụ thể nhưng áp dụng chúng trên tất cả các phiên trên toàn cầu mà không có quy tắc hết hạn cho mỗi phiên.","jp":"特定のアプリケーション イベントに関連付けられた状態リセット トリガーを定義しますが、セッションごとの有効期限ルールなしで、すべてのセッションにグローバルに適用されます。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Vòng đời session cần trả lời đủ ba câu hỏi product team nêu: <b>khi nào hết hạn</b> (quy tắc expiration rõ ràng), <b>khi nào reset trạng thái</b> (các trigger như đổi chủ đề, hoàn tất tác vụ, thay đổi dữ liệu nền) và <b>khi nào bắt đầu session mới</b> để context cũ, lỗi thời không rò rỉ sang hội thoại mới. Thiết kế tường minh cả ba thành phần giúp ứng dụng tự quản lý vòng đời thay vì phụ thuộc vào người dùng hay một tham số đơn lẻ.","elim":["<b>B.</b> Một timeout ngắn duy nhất không xử lý được reset theo sự kiện hay việc bắt đầu mới có chủ đích, và có thể cắt ngang hội thoại dài hợp lệ.","<b>C.</b> Có expiration nhưng không có reset tự động, để người dùng tự nhận ra context lỗi thời — không đảm bảo ngăn rò rỉ context cũ.","<b>D.</b> Trigger áp dụng toàn cục mà không có expiration theo session thì không quản lý được vòng đời riêng của từng session."]},"cite":"Hướng dẫn ôn tập — §5.10 fork_session và Quản lý Session; Lĩnh vực 1.7"},{"id":"ccdvf-q017","n":17,"topic":1,"type":"mcq","stem":{"en":"Your Claude application's error handling currently logs every API error with the same severity level. The team wants to differentiate between errors that should page an on-call engineer and errors that should be logged for later review. How would you structure the error handling?","vi":"Việc xử lý lỗi trong ứng dụng Claude của bạn hiện ghi lại mọi lỗi API có cùng mức độ nghiêm trọng. Nhóm muốn phân biệt giữa các lỗi cần báo cho kỹ sư trực và các lỗi cần ghi lại để xem xét sau. Bạn sẽ cấu trúc việc xử lý lỗi như thế nào?","jp":"現在、Claude アプリケーションのエラー処理では、すべての API エラーが同じ重大度レベルでログに記録されます。チームは、オンコール エンジニアに連絡する必要があるエラーと、後で確認するためにログに記録する必要があるエラーを区別したいと考えています。エラー処理をどのように構成しますか?"},"options":[{"k":"A","t":{"en":"Page on every error, on the grounds that paging guarantees that no error is missed by the team during normal operation across the application's lifecycle.","vi":"Trang trên mọi lỗi, với lý do việc phân trang đảm bảo rằng nhóm không bỏ sót lỗi nào trong quá trình hoạt động bình thường trong suốt vòng đời của ứng dụng.","jp":"ページングにより、アプリケーションのライフサイクル全体にわたる通常の操作中にチームがエラーを見逃さないことが保証されるため、すべてのエラーをページングします。"}},{"k":"B","t":{"en":"Disable logging for any error that does not page, treating non-paging errors as not worth recording for later review either.","vi":"Tắt tính năng ghi nhật ký cho bất kỳ lỗi nào không phân trang, coi các lỗi không phân trang là không đáng ghi lại để xem xét sau.","jp":"ページングされないエラーのロギングを無効にし、ページング以外のエラーも後で確認するために記録する価値がないものとして扱います。"}},{"k":"C","t":{"en":"Categorize errors by severity based on impact and recoverability, then route each category to the appropriate channel for paging or logging.","vi":"Phân loại lỗi theo mức độ nghiêm trọng dựa trên tác động và khả năng phục hồi, sau đó định tuyến từng danh mục đến kênh thích hợp để phân trang hoặc ghi nhật ký.","jp":"影響と回復可能性に基づいてエラーを重大度別に分類し、各カテゴリをページングまたはロギング用の適切なチャネルにルーティングします。"}},{"k":"D","t":{"en":"Log every error with the same severity, on the grounds that differentiating severity adds complexity that does not pay off in most application setups over time.","vi":"Ghi lại mọi lỗi có mức độ nghiêm trọng như nhau, với lý do mức độ nghiêm trọng khác nhau sẽ làm tăng thêm độ phức tạp mà không mang lại hiệu quả trong hầu hết các thiết lập ứng dụng theo thời gian.","jp":"すべてのエラーを同じ重大度でログに記録します。これは、重大度を区別すると複雑さが増し、ほとんどのアプリケーション設定では時間の経過とともに効果が得られないためです。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Phân loại lỗi theo <b>mức độ nghiêm trọng dựa trên tác động và khả năng tự phục hồi</b>: lỗi ảnh hưởng người dùng diện rộng hoặc không tự phục hồi (ví dụ lỗi xác thực API, outage kéo dài) cần page on-call; lỗi tạm thời đã được retry xử lý (một lần 429, timeout lẻ) chỉ cần log để xem lại. Sau đó <b>định tuyến mỗi loại tới kênh phù hợp</b>. Cách này giảm alert fatigue mà vẫn không bỏ sót sự cố thật.","elim":["<b>A.</b> Page cho mọi lỗi gây alert fatigue: on-call bị đánh thức vì lỗi tạm thời đã tự phục hồi, và dễ bỏ qua cảnh báo thật.","<b>B.</b> Không log các lỗi không page làm mất dữ liệu để phân tích xu hướng và phát hiện vấn đề âm ỉ trước khi trở nên nghiêm trọng.","<b>D.</b> Giữ một mức nghiêm trọng duy nhất là hiện trạng mà nhóm muốn thay đổi; nó không phân biệt được lỗi cần phản ứng ngay."]},"cite":"Hướng dẫn ôn tập — §10.1 Các nhóm lỗi"},{"id":"ccdvf-q018","n":18,"topic":1,"type":"mcq","stem":{"en":"Your team's Claude application has been in production for a year, and the team has decided to formalize its testing strategy. Currently, the team writes ad-hoc tests for individual features but has no overall testing approach. What testing approach would you formalize?","vi":"Ứng dụng Claude của nhóm bạn đã được sản xuất được một năm và nhóm đã quyết định chính thức hóa chiến lược thử nghiệm của mình. Hiện tại, nhóm viết các bài kiểm tra đặc biệt cho từng tính năng nhưng không có phương pháp kiểm tra tổng thể. Bạn sẽ chính thức hóa phương pháp thử nghiệm nào?","jp":"あなたのチームの Claude アプリケーションは 1 年間運用されており、チームはテスト戦略を正式に策定することを決定しました。現在、チームは個々の機能に対してアドホック テストを作成していますが、全体的なテストのアプローチはありません。どのようなテストアプローチを形式化しますか?"},"options":[{"k":"A","t":{"en":"Adopt a test-driven development practice where unit tests are written before each feature is implemented and must pass before code is merged.","vi":"Áp dụng phương pháp phát triển dựa trên thử nghiệm trong đó các bài kiểm tra đơn vị được viết trước khi triển khai từng tính năng và phải vượt qua trước khi hợp nhất mã.","jp":"各機能が実装される前に単体テストが作成され、コードがマージされる前に合格する必要があるテスト駆動開発プラクティスを採用します。"}},{"k":"B","t":{"en":"Define unit tests for individual functions, integration tests for the Claude integration, and end-to-end tests for critical user flows, applied consistently across the codebase.","vi":"Xác định các thử nghiệm đơn vị cho các chức năng riêng lẻ, thử nghiệm tích hợp cho tích hợp Claude và thử nghiệm toàn diện cho các luồng người dùng quan trọng, được áp dụng nhất quán trên toàn bộ cơ sở mã.","jp":"個々の機能の単体テスト、Claude 統合の統合テスト、重要なユーザー フローのエンドツーエンド テストを定義し、コードベース全体に一貫して適用します。"}},{"k":"C","t":{"en":"Continue writing ad-hoc tests as features ship and introduce a peer review step to ensure each test adequately covers the feature being released.","vi":"Tiếp tục viết các bài kiểm tra đặc biệt khi các tính năng được cung cấp và giới thiệu bước đánh giá ngang hàng để đảm bảo mỗi bài kiểm tra bao quát đầy đủ tính năng được phát hành.","jp":"機能が出荷されるたびにアドホック テストを作成し続け、各テストがリリースされる機能を適切にカバーしていることを確認するピア レビュー手順を導入します。"}},{"k":"D","t":{"en":"Define a single testing approach that uses end-to-end tests and apply it consistently across all new features as they are added to the codebase.","vi":"Xác định một phương pháp thử nghiệm duy nhất sử dụng các thử nghiệm toàn diện và áp dụng nó một cách nhất quán trên tất cả các tính năng mới khi chúng được thêm vào cơ sở mã.","jp":"エンドツーエンドのテストを使用する単一のテスト アプローチを定義し、コードベースに追加されるすべての新機能に一貫して適用します。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Một chiến lược kiểm thử chính thức nên phủ nhiều tầng: <b>unit test</b> cho các hàm riêng lẻ (dựng prompt, parse kết quả), <b>integration test</b> cho phần tích hợp với Claude (gọi API, xử lý lỗi, định dạng phản hồi), và <b>end-to-end test</b> cho các luồng người dùng quan trọng. Điều cốt lõi là <b>áp dụng nhất quán trên toàn codebase</b>, thay thế cách viết test ad-hoc hiện tại.","elim":["<b>A.</b> TDD là một thực hành viết code, chỉ tập trung unit test; nó không bao phủ integration với Claude hay các luồng end-to-end.","<b>C.</b> Tiếp tục viết test ad-hoc chính là hiện trạng cần thay đổi; thêm peer review không tạo ra chiến lược tổng thể.","<b>D.</b> Chỉ dùng E2E test thì chậm, dễ flaky, khó định vị lỗi và bỏ trống tầng unit/integration; cũng chỉ áp dụng cho tính năng mới."]}},{"id":"ccdvf-q019","n":19,"topic":1,"type":"mcq","stem":{"en":"Your Claude application uses structured output that is consumed by downstream code. The team wants to handle malformed or unexpected output gracefully so it does not crash downstream systems. The best choice for handling this issue would be to...","vi":"Ứng dụng Claude của bạn sử dụng đầu ra có cấu trúc được sử dụng bởi mã xuôi dòng. Nhóm muốn xử lý kết quả đầu ra không đúng định dạng hoặc không mong muốn một cách khéo léo để nó không làm hỏng hệ thống hạ nguồn. Lựa chọn tốt nhất để giải quyết vấn đề này là...","jp":"Claude アプリケーションは、ダウンストリーム コードによって消費される構造化出力を使用します。チームは、ダウンストリーム システムがクラッシュしないように、不正な出力や予期しない出力を適切に処理したいと考えています。この問題に対処するための最良の選択は次のとおりです..."},"options":[{"k":"A","t":{"en":"Crash on any unexpected output and require manual recovery on affected requests the application handles during normal operation.","vi":"Sự cố ở bất kỳ kết quả đầu ra không mong muốn nào và yêu cầu khôi phục thủ công đối với các yêu cầu bị ảnh hưởng mà ứng dụng xử lý trong quá trình hoạt động bình thường.","jp":"予期しない出力が発生するとクラッシュし、通常の動作中にアプリケーションが処理する影響を受けるリクエストを手動で回復する必要があります。"}},{"k":"B","t":{"en":"Silently drop any output that does not match expectations so downstream systems do not see the malformed output the application receives from the model.","vi":"Âm thầm loại bỏ bất kỳ đầu ra nào không phù hợp với mong đợi để các hệ thống hạ nguồn không nhìn thấy đầu ra không đúng định dạng mà ứng dụng nhận được từ mô hình.","jp":"期待と一致しない出力をサイレントにドロップするため、アプリケーションがモデルから受け取る不正な出力がダウンストリーム システムに表示されなくなります。"}},{"k":"C","t":{"en":"Use the output the model produces and leave schema enforcement to a later phase of production after the application is more complete.","vi":"Sử dụng kết quả đầu ra mà mô hình tạo ra và để việc thực thi lược đồ cho giai đoạn sản xuất sau này sau khi ứng dụng hoàn thiện hơn.","jp":"モデルが生成する出力を使用し、スキーマの適用はアプリケーションがより完成した後の運用フェーズに任せます。"}},{"k":"D","t":{"en":"Apply defensive parsing to handle unexpected fields, missing values, and type mismatches that the downstream code might otherwise crash on.","vi":"Áp dụng phân tích cú pháp phòng thủ để xử lý các trường không mong muốn, giá trị bị thiếu và loại không khớp mà mã xuôi dòng có thể gặp sự cố.","jp":"防御的な解析を適用して、ダウンストリーム コードがクラッシュする可能性がある予期しないフィールド、欠損値、型の不一致を処理します。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Đầu ra của model có thể có trường lạ, thiếu giá trị hoặc sai kiểu ngay cả khi thường tuân thủ schema. <b>Defensive parsing</b> xử lý các trường hợp này một cách có kiểm soát: bỏ qua trường không mong đợi, áp giá trị mặc định hoặc đánh dấu khi thiếu trường, kiểm tra và ép kiểu, rồi chuyển các trường hợp không cứu được sang luồng lỗi rõ ràng. Nhờ vậy downstream không bị crash và vấn đề vẫn được ghi nhận.","elim":["<b>A.</b> Crash và chờ phục hồi thủ công chính là điều nhóm muốn tránh; nó biến một sai lệch nhỏ thành sự cố.","<b>B.</b> Âm thầm bỏ output làm mất dữ liệu và che giấu vấn đề; không ai biết request nào đã thất bại hay vì sao.","<b>C.</b> Dùng nguyên output và hoãn kiểm tra schema đưa thẳng dữ liệu sai xuống downstream — đúng nguyên nhân gây crash."]},"cite":"Hướng dẫn ôn tập — §2.4 JSON Schema cho Structured Output; Lĩnh vực 4.4"},{"id":"ccdvf-q020","n":20,"topic":1,"type":"mcq","stem":{"en":"Your team is preparing a new Claude application for production, and the product team has asked for a cost projection. The team needs to estimate the cost based on expected request volume, average input length, and average output length. How would you build the projection?","vi":"Nhóm của bạn đang chuẩn bị ứng dụng Claude mới để sản xuất và nhóm sản phẩm đã yêu cầu dự toán chi phí. Nhóm cần ước tính chi phí dựa trên khối lượng yêu cầu dự kiến, độ dài đầu vào trung bình và độ dài đầu ra trung bình. Bạn sẽ xây dựng hình chiếu như thế nào?","jp":"あなたのチームは実稼働用に新しい Claude アプリケーションを準備しており、製品チームはコストの予測を求めています。チームは、予想されるリクエスト量、平均入力長、平均出力長に基づいてコストを見積もる必要があります。どのように投影を構築しますか?"},"options":[{"k":"A","t":{"en":"Build a cost model that uses the average per-request cost from a similar Claude application the team built last year, scaling that figure by expected request volume.","vi":"Xây dựng mô hình chi phí sử dụng chi phí trung bình cho mỗi yêu cầu từ một ứng dụng Claude tương tự mà nhóm đã xây dựng năm ngoái, nhân rộng con số đó theo khối lượng yêu cầu dự kiến.","jp":"チームが昨年構築した同様の Claude アプリケーションからのリクエストあたりの平均コストを使用するコスト モデルを構築し、その数値を予想されるリクエスト量に応じてスケールします。"}},{"k":"B","t":{"en":"Build a cost model that combines expected request volume, average input tokens, average output tokens, the chosen model's pricing, and any caching benefits.","vi":"Xây dựng mô hình chi phí kết hợp khối lượng yêu cầu dự kiến, mã thông báo đầu vào trung bình, mã thông báo đầu ra trung bình, giá của mô hình đã chọn và bất kỳ lợi ích bộ nhớ đệm nào.","jp":"予想されるリクエスト量、平均入力トークン、平均出力トークン、選択したモデルの価格設定、およびキャッシュの利点を組み合わせたコスト モデルを構築します。"}},{"k":"C","t":{"en":"Build a cost model that combines expected request volume and average input tokens, treating output tokens as a small enough share of cost to leave out of the projection.","vi":"Xây dựng mô hình chi phí kết hợp khối lượng yêu cầu dự kiến ​​và mã thông báo đầu vào trung bình, coi mã thông báo đầu ra là một phần chi phí đủ nhỏ để loại khỏi dự báo.","jp":"予想されるリクエスト量と平均入力トークンを組み合わせたコスト モデルを構築し、出力トークンをコストの十分に小さい割合として扱い、予測から除外します。"}},{"k":"D","t":{"en":"Build a cost model based on expected request volume and the chosen model's pricing, treating average input and output token counts as variables to be estimated post-launch.","vi":"Xây dựng mô hình chi phí dựa trên khối lượng yêu cầu dự kiến ​​và mức giá của mô hình đã chọn, coi số lượng mã thông báo đầu vào và đầu ra trung bình là các biến số được ước tính sau khi ra mắt.","jp":"予想されるリクエスト量と選択したモデルの価格設定に基づいてコスト モデルを構築し、平均入力トークン数と出力トークン数を起動後に推定される変数として扱います。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Chi phí Claude API được tính theo <b>token đầu vào và token đầu ra, với đơn giá khác nhau theo model</b> (output token thường đắt hơn input token nhiều lần). Một mô hình chi phí đúng cần kết hợp: <b>lưu lượng request dự kiến × (input token trung bình × giá input + output token trung bình × giá output)</b> của model đã chọn, sau đó trừ đi <b>lợi ích từ caching</b> (cache read rẻ hơn input thường) nếu có tiền tố lặp lại.","elim":["<b>A.</b> Chi phí trung bình của một ứng dụng cũ phản ánh model, độ dài prompt và output khác; nhân theo lưu lượng sẽ cho con số không đáng tin.","<b>C.</b> Bỏ qua output token là sai lầm lớn vì giá output thường cao gấp nhiều lần giá input và có thể chiếm phần đáng kể chi phí.","<b>D.</b> Không có số token thì không tính được chi phí; hoãn ước lượng tới sau khi launch làm mất mục đích của một dự báo chi phí."]}},{"id":"ccdvf-q021","n":21,"topic":1,"type":"mcq","stem":{"en":"Your Claude application validates structured output but has been treating validation failures as terminal errors. Each validation failure causes the entire user request to fail. The team wants to handle validation failures more gracefully. How would you handle the validation failures?","vi":"Ứng dụng Claude của bạn xác thực kết quả đầu ra có cấu trúc nhưng lại coi các lỗi xác thực là lỗi đầu cuối. Mỗi lần xác thực không thành công sẽ khiến toàn bộ yêu cầu của người dùng không thành công. Nhóm muốn xử lý các lỗi xác thực một cách khéo léo hơn. Bạn sẽ xử lý các lỗi xác thực như thế nào?","jp":"Claude アプリケーションは構造化出力を検証しますが、検証の失敗を端末エラーとして扱っています。検証が失敗するたびに、ユーザー リクエスト全体が失敗します。チームは検証の失敗をより適切に処理したいと考えています。検証の失敗にどう対処しますか?"},"options":[{"k":"A","t":{"en":"Pass validation failures directly to downstream systems and let each downstream system decide how to handle the malformed output.","vi":"Chuyển các lỗi xác thực trực tiếp đến các hệ thống hạ nguồn và để mỗi hệ thống hạ nguồn quyết định cách xử lý đầu ra không đúng định dạng.","jp":"検証の失敗を下流システムに直接渡し、各下流システムに不正な出力の処理方法を決定させます。"}},{"k":"B","t":{"en":"Disable output validation until the underlying cause of validation failures has been identified and addressed in a future release.","vi":"Vô hiệu hóa xác thực đầu ra cho đến khi nguyên nhân cơ bản của lỗi xác thực được xác định và giải quyết trong bản phát hành trong tương lai.","jp":"検証失敗の根本的な原因が特定され、将来のリリースで対処されるまで、出力検証を無効にします。"}},{"k":"C","t":{"en":"Treat validation failures as a recognized error path that triggers retry, repair, or fallback logic before failing the user request.","vi":"Xử lý các lỗi xác thực như một đường dẫn lỗi được nhận dạng để kích hoạt logic thử lại, sửa chữa hoặc dự phòng trước khi yêu cầu của người dùng không thực hiện được.","jp":"検証の失敗を、ユーザー要求が失敗する前に再試行、修復、またはフォールバック ロジックをトリガーする認識されたエラー パスとして扱います。"}},{"k":"D","t":{"en":"Tell users that validation failures are unavoidable and instruct them to perform manual accuracy checks before relying on outputs.","vi":"Cho người dùng biết rằng việc xác thực không thể tránh khỏi và hướng dẫn họ thực hiện kiểm tra độ chính xác theo cách thủ công trước khi dựa vào kết quả đầu ra.","jp":"検証の失敗は避けられないことをユーザーに伝え、出力に頼る前に手動で精度チェックを実行するよう指示します。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Lỗi validation là tình huống <b>có thể dự đoán và thường khôi phục được</b>, nên cần được xử lý như một <b>luồng lỗi có chủ đích</b>: <b>retry kèm phản hồi</b> (gửi lại chi tiết lỗi validation để model sửa), <b>repair</b> các lỗi nhỏ có thể sửa tự động, hoặc <b>fallback</b> (model/cách tiếp cận khác, đưa sang người duyệt). Chỉ khi các bước này thất bại mới báo lỗi cho người dùng.","elim":["<b>A.</b> Đẩy output lỗi xuống downstream làm lan truyền dữ liệu sai và phân tán trách nhiệm xử lý cho từng hệ thống.","<b>B.</b> Tắt validation khiến output sai đi thẳng xuống downstream mà không bị phát hiện — tệ hơn hiện trạng.","<b>D.</b> Lỗi validation phần lớn có thể xử lý tự động; đẩy gánh nặng kiểm tra cho người dùng là né trách nhiệm của hệ thống."]},"cite":"Hướng dẫn ôn tập — §6.5 Validation và Retry-with-Feedback; Lĩnh vực 4.4"},{"id":"ccdvf-q022","n":22,"topic":1,"type":"mcq","stem":{"en":"You are choosing a Claude model for a high-volume classification task. Each classification is straightforward, latency requirements are tight, and per-request cost matters at scale. Which model would you choose?","vi":"Bạn đang chọn mô hình Claude cho nhiệm vụ phân loại khối lượng lớn. Mỗi phân loại đều đơn giản, yêu cầu về độ trễ chặt chẽ và chi phí cho mỗi yêu cầu rất quan trọng trên quy mô lớn. Bạn sẽ chọn mô hình nào?","jp":"大量の分類タスク用にクロード モデルを選択しています。各分類は単純で、レイテンシー要件は厳しく、大規模な場合にはリクエストごとのコストが重要になります。どのモデルを選びますか?"},"options":[{"k":"A","t":{"en":"A mid-tier Claude model selected by default, because mid-tier models balance quality and cost in a way the team can apply across most tasks.","vi":"Mô hình Claude cấp trung được chọn theo mặc định vì các mô hình cấp trung cân bằng giữa chất lượng và chi phí theo cách mà nhóm có thể áp dụng cho hầu hết các nhiệm vụ.","jp":"中間層モデルは、チームがほとんどのタスクに適用できる方法で品質とコストのバランスをとるため、デフォルトで選択される中間層のクロード モデル。"}},{"k":"B","t":{"en":"Multiple Claude models in series, where each request runs through more than one model and the application combines the outputs into a final classification.","vi":"Nhiều mô hình Claude nối tiếp, trong đó mỗi yêu cầu chạy qua nhiều mô hình và ứng dụng kết hợp các kết quả đầu ra thành phân loại cuối cùng.","jp":"直列の複数のクロード モデル。各リクエストは複数のモデルを介して実行され、アプリケーションは出力を最終的な分類に結合します。"}},{"k":"C","t":{"en":"A smaller, faster Claude model, because the task is straightforward and the workload prioritizes latency and per-request cost at scale.","vi":"Mô hình Claude nhỏ hơn, nhanh hơn vì nhiệm vụ đơn giản và khối lượng công việc ưu tiên độ trễ cũng như chi phí theo yêu cầu trên quy mô lớn.","jp":"タスクが簡単で、ワークロードが大規模なレイテンシーとリクエストごとのコストを優先するため、より小型で高速なクロード モデル。"}},{"k":"D","t":{"en":"The largest, highest-capability Claude model, to maximize quality on every classification the application produces during normal operation across all requests.","vi":"Mô hình Claude lớn nhất, có khả năng cao nhất, giúp tối đa hóa chất lượng trên mọi phân loại mà ứng dụng tạo ra trong quá trình hoạt động bình thường đối với tất cả các yêu cầu.","jp":"最大かつ最高の機能を備えたクロード モデル。すべてのリクエストにわたる通常の動作中にアプリケーションが生成するすべての分類の品質を最大化します。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Chọn model theo <b>yêu cầu của tác vụ</b>: phân loại đơn giản, khối lượng lớn, yêu cầu độ trễ chặt và chi phí mỗi request quan trọng — đúng điểm mạnh của <b>model nhỏ, nhanh</b> trong họ Claude (ví dụ dòng Haiku). Model nhỏ thường đạt chất lượng đủ cho tác vụ dễ, trong khi độ trễ và chi phí thấp hơn nhiều; có thể kiểm chứng bằng bộ đánh giá trên dữ liệu đại diện.","elim":["<b>A.</b> Chọn model tầm trung “mặc định” không dựa trên yêu cầu cụ thể; với tác vụ đơn giản, nó tốn chi phí và độ trễ không cần thiết.","<b>B.</b> Chạy nhiều model nối tiếp nhân chi phí và độ trễ cho mỗi request, trái với cả hai ưu tiên của tác vụ.","<b>D.</b> Model lớn nhất có độ trễ và chi phí cao nhất; năng lực thêm không đem lại lợi ích đáng kể cho phân loại đơn giản."]}},{"id":"ccdvf-q023","n":23,"topic":1,"type":"mcq","stem":{"en":"Your Claude agent performs database operations. A recent incident occurred where the agent ran a destructive query that affected production data. The team wants to add deterministic controls to prevent similar incidents. How would you prevent similar incidents?","vi":"Đại lý Claude của bạn thực hiện các hoạt động cơ sở dữ liệu. Một sự cố gần đây đã xảy ra khi tác nhân chạy một truy vấn phá hoại làm ảnh hưởng đến dữ liệu sản xuất. Nhóm muốn bổ sung các biện pháp kiểm soát xác định để ngăn chặn những sự cố tương tự. Bạn sẽ làm thế nào để ngăn chặn những sự cố tương tự?","jp":"Claude エージェントはデータベース操作を実行します。最近、エージェントが実稼働データに影響を与える破壊的なクエリを実行するというインシデントが発生しました。チームは、同様のインシデントを防ぐために決定論的な制御を追加したいと考えています。同様の事件をどう防ぐか?"},"options":[{"k":"A","t":{"en":"Run the agent only during business hours when humans are available to monitor its activity, treating the schedule as the primary control mechanism for destructive operations.","vi":"Chỉ chạy tác nhân trong giờ làm việc khi có con người sẵn sàng giám sát hoạt động của nó, coi lịch trình là cơ chế kiểm soát chính đối với các hoạt động phá hoại.","jp":"人間がエージェントのアクティビティを監視できる営業時間内にのみエージェントを実行し、スケジュールを破壊的な操作の主要な制御メカニズムとして扱います。"}},{"k":"B","t":{"en":"Add Claude hooks that intercept database operations and apply deterministic checks, such as blocking destructive queries or requiring approval, before the queries execute.","vi":"Thêm móc Claude để chặn các hoạt động của cơ sở dữ liệu và áp dụng các biện pháp kiểm tra xác định, chẳng hạn như chặn các truy vấn phá hoại hoặc yêu cầu phê duyệt trước khi truy vấn thực thi.","jp":"データベース操作をインターセプトし、クエリの実行前に、破壊的なクエリのブロックや承認の要求などの決定論的なチェックを適用するクロード フックを追加します。"}},{"k":"C","t":{"en":"Switch to a higher-capability Claude model on the grounds that a more capable model is less likely to run destructive queries during normal operation across all requests.","vi":"Chuyển sang mô hình Claude có khả năng cao hơn với lý do mô hình có khả năng cao hơn sẽ ít có khả năng chạy các truy vấn phá hoại trong quá trình hoạt động bình thường trên tất cả các yêu cầu.","jp":"より高機能なモデルは、すべてのリクエストにわたって通常の操作中に破壊的なクエリを実行する可能性が低いため、より高機能な Claude モデルに切り替えます。"}},{"k":"D","t":{"en":"Add a system prompt instruction telling the agent to be careful with database operations on every request the application handles during normal operation across all incoming traffic.","vi":"Thêm hướng dẫn nhắc hệ thống yêu cầu tổng đài viên cẩn thận với các thao tác cơ sở dữ liệu theo mọi yêu cầu mà ứng dụng xử lý trong quá trình hoạt động bình thường trên tất cả lưu lượng truy cập đến.","jp":"すべての受信トラフィックにわたる通常の動作中にアプリケーションが処理するすべてのリクエストのデータベース操作に注意するようエージェントに指示するシステム プロンプト命令を追加します。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Đề yêu cầu <b>kiểm soát deterministic</b> — điều chỉ dẫn prompt hay lựa chọn model không đảm bảo được. Hook (ví dụ <code>PreToolUse</code>) <b>chặn lời gọi tool truy vấn database trước khi thực thi</b>, kiểm tra bằng code (phát hiện <code>DROP</code>/<code>DELETE</code>/<code>TRUNCATE</code>, truy vấn không có <code>WHERE</code>, môi trường production) rồi chặn hoặc yêu cầu phê duyệt của con người. Khi thất bại gây hậu quả nghiêm trọng như mất dữ liệu production, hãy dùng hook thay vì prompt.","elim":["<b>A.</b> Giới hạn giờ chạy không ngăn được truy vấn phá hủy; con người theo dõi vẫn có thể bỏ lỡ và thao tác đã thực thi thì khó hoàn tác.","<b>C.</b> Model mạnh hơn vẫn mang tính xác suất; giảm khả năng xảy ra không phải là kiểm soát deterministic.","<b>D.</b> Chỉ dẫn “cẩn thận” mơ hồ và không thể thực thi; nó chỉ là gợi ý xác suất, không chặn được truy vấn phá hủy."]},"cite":"Hướng dẫn ôn tập — §3.5 Hooks trong Agent SDK; Lĩnh vực 1.5"},{"id":"ccdvf-q024","n":24,"topic":1,"type":"mcq","stem":{"en":"You are designing a Claude application that helps medical researchers analyze multi-step clinical case studies. The application must work through differential diagnoses by considering symptom patterns, weighing evidence across competing hypotheses, and showing intermediate reasoning steps before producing a final recommendation. The team is choosing among Claude's available model options. The model option best suited to this use case is...","vi":"Bạn đang thiết kế một ứng dụng Claude giúp các nhà nghiên cứu y tế phân tích các nghiên cứu trường hợp lâm sàng gồm nhiều bước. Ứng dụng phải thực hiện các chẩn đoán phân biệt bằng cách xem xét các mẫu triệu chứng, cân nhắc bằng chứng giữa các giả thuyết cạnh tranh và hiển thị các bước lý luận trung gian trước khi đưa ra khuyến nghị cuối cùng. Nhóm đang lựa chọn trong số các mô hình có sẵn của Claude. Tùy chọn mô hình phù hợp nhất cho trường hợp sử dụng này là...","jp":"あなたは、医療研究者が多段階の臨床ケーススタディを分析するのに役立つ Claude アプリケーションを設計しています。アプリケーションは、最終的な推奨事項を作成する前に、症状のパターンを考慮し、競合する仮説間で証拠を比較検討し、中間の推論ステップを示すことによって、鑑別診断を行う必要があります。チームはクロードの利用可能なモデル オプションの中から選択しています。この使用例に最適なモデル オプションは..."},"options":[{"k":"A","t":{"en":"Zero-shot prompting alone with no model option adjustments, which keeps the application's configuration as simple as possible.","vi":"Chỉ nhắc nhở Zero-shot mà không cần điều chỉnh tùy chọn mô hình, giúp cấu hình ứng dụng đơn giản nhất có thể.","jp":"モデル オプションの調整を行わずにゼロショット プロンプトのみを実行するため、アプリケーションの構成が可能な限りシンプルに保たれます。"}},{"k":"B","t":{"en":"Extended thinking, which lets the model reason through the differential diagnosis steps before producing the final recommendation.","vi":"Tư duy mở rộng, cho phép mô hình suy luận thông qua các bước chẩn đoán phân biệt trước khi đưa ra khuyến nghị cuối cùng.","jp":"拡張思考。最終的な推奨事項を生成する前に、モデルが鑑別診断の手順を推論できるようにします。"}},{"k":"C","t":{"en":"Fast mode, which prioritizes the lowest possible latency at the expense of reasoning depth on complex tasks.","vi":"Chế độ nhanh, ưu tiên độ trễ thấp nhất có thể nhưng làm giảm độ sâu lý luận đối với các tác vụ phức tạp.","jp":"高速モード。複雑なタスクの推論の深さを犠牲にして、可能な限り低いレイテンシーを優先します。"}},{"k":"D","t":{"en":"A smaller model with a tighter context window, which encourages the model to focus its limited capacity on the task.","vi":"Một mô hình nhỏ hơn với cửa sổ ngữ cảnh chặt chẽ hơn, khuyến khích mô hình tập trung năng lực hạn chế của mình vào nhiệm vụ.","jp":"より狭いコンテキスト ウィンドウを備えた小さなモデル。これにより、モデルは限られた能力をタスクに集中させることができます。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Tác vụ đòi hỏi <b>lập luận nhiều bước</b>: xem xét mẫu triệu chứng, cân nhắc bằng chứng giữa các giả thuyết cạnh tranh và trình bày các bước trung gian trước khi kết luận. <b>Extended thinking</b> cho phép model dành một ngân sách token để suy nghĩ (khối <code>thinking</code>) trước khi đưa ra câu trả lời cuối, cải thiện chất lượng trên các bài toán suy luận phức tạp và làm lộ quá trình lập luận để kiểm tra.","elim":["<b>A.</b> Zero-shot đơn giản là kỹ thuật prompt, không phải tùy chọn model giúp tăng chiều sâu suy luận cho chẩn đoán phân biệt.","<b>C.</b> Ưu tiên độ trễ thấp nhất đánh đổi chiều sâu lập luận — ngược với yêu cầu chính của tác vụ.","<b>D.</b> Model nhỏ hơn với context hẹp hơn giảm năng lực suy luận và khả năng chứa ca bệnh dài; giới hạn không làm model “tập trung” hơn."]}},{"id":"ccdvf-q025","n":25,"topic":1,"type":"mcq","stem":{"en":"You are setting up Claude Code for a new project repository. Your team has shared coding standards, preferred libraries, and project-specific context that every developer working on the repository should have available when they use Claude Code. How would you set this up?","vi":"Bạn đang thiết lập Mã Claude cho kho lưu trữ dự án mới. Nhóm của bạn đã chia sẻ các tiêu chuẩn mã hóa, thư viện ưa thích và bối cảnh dành riêng cho dự án mà mọi nhà phát triển làm việc trên kho lưu trữ đều phải có sẵn khi họ sử dụng Claude Code. Bạn sẽ thiết lập điều này như thế nào?","jp":"新しいプロジェクト リポジトリ用に Claude Code をセットアップしています。チームは、コーディング標準、優先ライブラリ、およびリポジトリで作業するすべての開発者が Claude Code を使用するときに利用できるプロジェクト固有のコンテキストを共有しています。これをどのように設定しますか?"},"options":[{"k":"A","t":{"en":"Document the standards in a separate wiki page maintained outside the repository so the documentation stays decoupled from the source code.","vi":"Ghi lại các tiêu chuẩn trong một trang wiki riêng biệt được duy trì bên ngoài kho lưu trữ để tài liệu luôn tách biệt khỏi mã nguồn.","jp":"標準をリポジトリの外部で管理される別の Wiki ページに文書化して、文書がソース コードから切り離された状態になるようにします。"}},{"k":"B","t":{"en":"Configure Claude Code through environment variables that each developer sets on their own machine when they begin working in the repository.","vi":"Định cấu hình Mã Claude thông qua các biến môi trường mà mỗi nhà phát triển đặt trên máy riêng của họ khi họ bắt đầu làm việc trong kho lưu trữ.","jp":"各開発者がリポジトリでの作業を開始するときに自分のマシンに設定する環境変数を使用して、クロード コードを構成します。"}},{"k":"C","t":{"en":"Initialize Claude Code in the repository and document the standards and project-specific context in a CLAUDE.md file at the repository root.","vi":"Khởi tạo Mã Claude trong kho lưu trữ và ghi lại các tiêu chuẩn cũng như bối cảnh cụ thể của dự án trong tệp CLAUDE.md ở thư mục gốc của kho lưu trữ.","jp":"リポジトリ内の Claude コードを初期化し、リポジトリ ルートにある CLAUDE.md ファイルに標準とプロジェクト固有のコンテキストを文書化します。"}},{"k":"D","t":{"en":"Add the coding standards and project context to the repository's existing README file and direct developers to reference it when starting Claude Code sessions.","vi":"Thêm các tiêu chuẩn mã hóa và bối cảnh dự án vào tệp README hiện có của kho lưu trữ và hướng dẫn các nhà phát triển tham chiếu nó khi bắt đầu các phiên Mã Claude.","jp":"コーディング標準とプロジェクト コンテキストをリポジトリの既存の README ファイルに追加し、Claude Code セッションを開始するときにそれを参照するように開発者に指示します。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> <code>CLAUDE.md</code> ở <b>gốc repository (project-level)</b> được Claude Code tự động nạp vào context ở mỗi session, và vì được commit vào git nên <b>mọi developer clone repo đều dùng chung</b>. Đó là nơi đúng cho tiêu chuẩn code, thư viện ưu tiên và context dự án. Có thể khởi tạo nhanh bằng <code>/init</code>, rồi bổ sung và duy trì cùng mã nguồn.","elim":["<b>A.</b> Wiki bên ngoài repo không được Claude Code tự động nạp, và dễ bị lệch khỏi trạng thái thực của code.","<b>B.</b> Biến môi trường trên từng máy không phải cơ chế truyền tiêu chuẩn code cho Claude, và mỗi developer có thể cấu hình khác nhau.","<b>D.</b> README không được Claude Code tự động nạp như <code>CLAUDE.md</code>; dựa vào việc developer nhớ tham chiếu thì không nhất quán."]},"cite":"Hướng dẫn ôn tập — §5.1 Phân cấp CLAUDE.md; Lĩnh vực 3.1"},{"id":"ccdvf-q026","n":26,"topic":1,"type":"mcq","stem":{"en":"Your Claude application processes 50-page legal contracts and produces summaries with citation references back to the source. The team is debating whether to send each contract whole or split it into smaller pieces. The contracts fit within Claude's context window. Initial testing shows that whole-document processing produces summaries with stronger cross-section reasoning but occasionally drifts on citation accuracy in later sections. Chunked processing produces stronger citation accuracy per chunk but loses cross-section reasoning. The team has not decided which property matters more. How would you guide the team's decision?","vi":"Ứng dụng Claude của bạn xử lý các hợp đồng pháp lý dài 50 trang và tạo ra các bản tóm tắt có trích dẫn tài liệu tham khảo về nguồn. Nhóm đang tranh luận về việc nên gửi toàn bộ hợp đồng hay chia thành nhiều phần nhỏ hơn. Các hợp đồng nằm gọn trong cửa sổ ngữ cảnh của Claude. Thử nghiệm ban đầu cho thấy rằng quá trình xử lý toàn bộ tài liệu tạo ra các bản tóm tắt với lý luận theo từng phần chặt chẽ hơn nhưng đôi khi lại dẫn đến độ chính xác của trích dẫn ở các phần sau. Quá trình xử lý theo khối tạo ra độ chính xác trích dẫn cao hơn trên mỗi đoạn nhưng làm mất khả năng suy luận theo mặt cắt ngang. Nhóm vẫn chưa quyết định tài sản nào quan trọng hơn. Bạn sẽ hướng dẫn quyết định của nhóm như thế nào?","jp":"Claude アプリケーションは 50 ページの法的契約書を処理し、出典への引用参照を含む要約を作成します。チームは各契約書を丸ごと送信するか、分割して送信するかを検討中です。契約はクロードのコンテキスト ウィンドウ内に収まります。初期テストでは、文書全体を処理すると、より強力なセクションの推論を備えた要約が生成されますが、後のセクションでは引用の精度が変動する場合があることが示されています。チャンク処理では、チャンクごとの引用精度が向上しますが、断面推論が失われます。チームは、どのプロパティがより重要であるかを決定していません。チームの決定をどのように導きますか?"},"options":[{"k":"A","t":{"en":"Review the citation accuracy results from chunked processing and determine whether the loss of cross- section reasoning produces summaries that still meet the application's quality bar.","vi":"Xem lại kết quả về độ chính xác của trích dẫn từ quá trình xử lý theo khối và xác định xem liệu việc mất lý luận theo từng phần có tạo ra các bản tóm tắt vẫn đáp ứng tiêu chuẩn chất lượng của ứng dụng hay không.","jp":"チャンク処理による引用の精度の結果を確認し、断面推論の損失によってアプリケーションの品質基準を満たした要約が生成されるかどうかを判断します。"}},{"k":"B","t":{"en":"Identify which property matters more for the application's actual use case and let that decision drive the chunking approach, then validate the choice against representative contracts.","vi":"Xác định thuộc tính nào quan trọng hơn đối với trường hợp sử dụng thực tế của ứng dụng và để quyết định đó thúc đẩy phương pháp phân chia, sau đó xác thực lựa chọn dựa trên các hợp đồng đại diện.","jp":"アプリケーションの実際の使用例にとってどのプロパティがより重要かを特定し、その決定によってチャンク化アプローチが推進され、代表的な契約に照らして選択を検証します。"}},{"k":"C","t":{"en":"Examine the use cases where cross-section reasoning failures occur and assess whether whole- document processing meets the application's accuracy requirements across a representative sample of contracts.","vi":"Kiểm tra các trường hợp sử dụng trong đó xảy ra lỗi lý luận chéo và đánh giá xem liệu việc xử lý toàn bộ tài liệu có đáp ứng các yêu cầu về độ chính xác của ứng dụng trên một mẫu hợp đồng đại diện hay không.","jp":"横断的な推論の失敗が発生するユースケースを調査し、文書全体の処理が契約の代表的なサンプルにわたってアプリケーションの精度要件を満たしているかどうかを評価します。"}},{"k":"D","t":{"en":"Assess the cost and latency implications of both approaches against the application's performance requirements before recommending which processing strategy to adopt.","vi":"Đánh giá tác động về chi phí và độ trễ của cả hai phương pháp so với yêu cầu về hiệu suất của ứng dụng trước khi đề xuất nên áp dụng chiến lược xử lý nào.","jp":"どちらの処理戦略を採用するかを推奨する前に、アプリケーションのパフォーマンス要件に対して両方のアプローチのコストと遅延への影響を評価してください。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Đây là một <b>đánh đổi thực sự</b>: xử lý cả tài liệu mạnh về lập luận liên phần, chia chunk mạnh về độ chính xác trích dẫn. Khi nhóm chưa quyết được thuộc tính nào quan trọng hơn, bước đầu tiên là <b>xác định yêu cầu của use case thực tế</b> (người dùng cần phân tích tổng thể hợp đồng hay cần trích dẫn chính xác để tra cứu pháp lý), để quyết định đó dẫn dắt cách chunk, rồi <b>kiểm chứng trên tập hợp đồng đại diện</b>. Quyết định kỹ thuật phải xuất phát từ yêu cầu, không ngược lại.","elim":["<b>A.</b> Chỉ xem xét kết quả của cách chia chunk, giả định trước một hướng trong khi chưa trả lời câu hỏi thuộc tính nào quan trọng hơn.","<b>C.</b> Chỉ đánh giá cách xử lý cả tài liệu — vẫn là xem xét một phía của đánh đổi, không giải quyết câu hỏi ưu tiên cốt lõi.","<b>D.</b> Chi phí và độ trễ là cân nhắc phụ; đề nêu đánh đổi về chất lượng (lập luận vs trích dẫn) chưa được giải quyết."]}},{"id":"ccdvf-q027","n":27,"topic":1,"type":"mcq","stem":{"en":"Your Claude application makes high-volume API calls during business hours and very few calls overnight. The team is concerned about staying within rate limits during peak hours and wants to understand how the Claude API enforces those limits. How would you proceed?","vi":"Ứng dụng Claude của bạn thực hiện các cuộc gọi API số lượng lớn trong giờ làm việc và rất ít cuộc gọi qua đêm. Nhóm lo ngại về việc duy trì giới hạn tốc độ trong giờ cao điểm và muốn hiểu cách API Claude thực thi các giới hạn đó. Bạn sẽ tiến hành như thế nào?","jp":"Claude アプリケーションは、営業時間中に大量の API 呼び出しを行いますが、夜間にはほとんど呼び出しを行いません。チームは、ピーク時にレート制限内に収まることを懸念しており、Claude API がこれらの制限をどのように強制するかを理解したいと考えています。どのように進めますか?"},"options":[{"k":"A","t":{"en":"Review the API documentation for streaming endpoints and evaluate whether migrating peak-hour calls to streaming reduces exposure to rate limit enforcement.","vi":"Xem lại tài liệu API về điểm cuối phát trực tuyến và đánh giá xem liệu việc di chuyển cuộc gọi vào giờ cao điểm sang phát trực tuyến có làm giảm nguy cơ phải thực thi giới hạn tốc độ hay không.","jp":"ストリーミング エンドポイントの API ドキュメントを確認し、ピーク時の通話をストリーミングに移行することでレート制限の適用が軽減されるかどうかを評価します。"}},{"k":"B","t":{"en":"Assess the average payload size of current API calls and consolidate requests where possible to reduce the total number of calls made during peak hours.","vi":"Đánh giá kích thước tải trọng trung bình của các lệnh gọi API hiện tại và hợp nhất các yêu cầu nếu có thể để giảm tổng số lệnh gọi được thực hiện trong giờ cao điểm.","jp":"現在の API 呼び出しの平均ペイロード サイズを評価し、可能な場合はリクエストを統合して、ピーク時に行われる呼び出しの総数を削減します。"}},{"k":"C","t":{"en":"Identify the rate limits, design the application to stay within them during peak hours, and use exponential backoff when limits are reached.","vi":"Xác định các giới hạn tốc độ, thiết kế ứng dụng để duy trì trong giới hạn đó trong giờ cao điểm và sử dụng thời gian chờ theo cấp số nhân khi đạt đến giới hạn.","jp":"レート制限を特定し、ピーク時間中にその制限内に留まるようにアプリケーションを設計し、制限に達した場合には指数バックオフを使用します。"}},{"k":"D","t":{"en":"Examine the peak-hour request patterns in your application logs and smooth traffic by distributing requests more evenly across the business-hours window.","vi":"Kiểm tra các mẫu yêu cầu vào giờ cao điểm trong nhật ký ứng dụng của bạn và điều chỉnh lưu lượng truy cập bằng cách phân phối các yêu cầu đồng đều hơn trong khung giờ làm việc.","jp":"アプリケーション ログ内のピーク時間のリクエスト パターンを調べ、営業時間枠全体でリクエストをより均等に分散することでトラフィックをスムーズにします。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Claude API áp dụng rate limit theo tổ chức/tier (request mỗi phút, input/output token mỗi phút) và trả lỗi <code>429</code> khi vượt, kèm header như <code>retry-after</code>. Cách đúng là <b>xác định các giới hạn áp dụng</b>, <b>thiết kế ứng dụng ở dưới ngưỡng</b> vào giờ cao điểm (điều tiết, xếp hàng request) và dùng <b>exponential backoff</b> khi chạm giới hạn. Đây là cách tiếp cận đầy đủ: hiểu cơ chế, phòng ngừa, và phục hồi.","elim":["<b>A.</b> Streaming chỉ thay đổi cách nhận phản hồi, không miễn trừ rate limit; request streaming vẫn bị tính vào giới hạn.","<b>B.</b> Gộp request có thể giảm số request nhưng không hiểu giới hạn token và không có cơ chế xử lý khi vẫn chạm 429.","<b>D.</b> Làm mượt lưu lượng là một kỹ thuật hữu ích nhưng chưa xác định giới hạn cụ thể và thiếu cơ chế backoff khi bị giới hạn."]},"cite":"Hướng dẫn ôn tập — §10.1 Các nhóm lỗi"},{"id":"ccdvf-q028","n":28,"topic":1,"type":"mcq","stem":{"en":"You are building a Claude application that processes 10,000 customer emails overnight to extract structured data. The work is non-interactive, runs once daily, and has a flexible completion window of several hours. Which Claude API would you use?","vi":"Bạn đang xây dựng một ứng dụng Claude xử lý 10.000 email của khách hàng chỉ trong một đêm để trích xuất dữ liệu có cấu trúc. Công việc không tương tác, chạy một lần mỗi ngày và có thời gian hoàn thành linh hoạt trong vài giờ. Bạn sẽ sử dụng API Claude nào?","jp":"あなたは、10,000 件の顧客メールを一晩で処理して構造化データを抽出するクロード アプリケーションを構築しています。この作業は非インタラクティブで、1 日に 1 回実行され、数時間の柔軟な完了ウィンドウがあります。どの Claude API を使用しますか?"},"options":[{"k":"A","t":{"en":"The Batch API, which is designed for non-interactive workloads with flexible completion windows.","vi":"API Batch, được thiết kế cho khối lượng công việc không tương tác với khung thời gian hoàn thành linh hoạt.","jp":"バッチ API。柔軟な完了ウィンドウを備えた非対話型ワークロード向けに設計されています。"}},{"k":"B","t":{"en":"The streaming responses API to process each email and return partial results to a database as the model generates them.","vi":"API phản hồi phát trực tuyến để xử lý từng email và trả về một phần kết quả cho cơ sở dữ liệu khi mô hình tạo ra chúng.","jp":"各電子メールを処理し、モデルが生成した部分的な結果をデータベースに返すストリーミング応答 API。"}},{"k":"C","t":{"en":"The real-time Messages API, processing the emails one at a time sequentially to ensure consistent ordering of results.","vi":"API Tin nhắn theo thời gian thực, xử lý tuần tự từng email để đảm bảo thứ tự kết quả nhất quán.","jp":"リアルタイムのメッセージ API。電子メールを一度に 1 つずつ順番に処理して、結果の順序が一貫していることを保証します。"}},{"k":"D","t":{"en":"The real-time Messages API with concurrent requests to process the emails as fast as possible during the overnight window.","vi":"API Tin nhắn theo thời gian thực với các yêu cầu đồng thời để xử lý email nhanh nhất có thể trong thời gian qua đêm.","jp":"同時リクエストを伴うリアルタイム Messages API は、夜間の時間帯にできるだけ早く電子メールを処理します。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Workload <b>không tương tác</b>, chạy một lần mỗi ngày với <b>khung hoàn thành linh hoạt</b> vài giờ chính là kịch bản lý tưởng cho <b>Message Batches API</b>: gửi 10.000 request trong một batch, xử lý bất đồng bộ (tối đa 24 giờ) với <b>chi phí giảm khoảng 50%</b> và không phải tự quản lý rate limit. Mỗi request mang một <code>custom_id</code> để ghép kết quả với email tương ứng.","elim":["<b>B.</b> Streaming phục vụ trải nghiệm hiển thị dần cho người dùng; ở đây không có người chờ, nên nó không đem lại lợi ích mà vẫn trả giá đầy đủ.","<b>C.</b> Gọi tuần tự từng email rất chậm và trả giá đầy đủ; thứ tự kết quả có thể giữ bằng <code>custom_id</code> trong batch.","<b>D.</b> Gọi song song qua Messages API đồng bộ trả giá đầy đủ và phải tự xử lý rate limit, trong khi không cần độ trễ thấp."]},"cite":"Hướng dẫn ôn tập — §7.2 Khi nào dùng Batch API so với Synchronous API; Lĩnh vực 4.5"},{"id":"ccdvf-q029","n":29,"topic":1,"type":"mcq","stem":{"en":"Your enterprise has a contract with AWS that requires Claude API calls to flow through Amazon Bedrock rather than the direct Anthropic API. Your team is building a new Claude application and is unfamiliar with this constraint. How would you build the application?","vi":"Doanh nghiệp của bạn có hợp đồng với AWS yêu cầu các lệnh gọi API Claude phải truyền qua Amazon Bedrock thay vì API Anthropic trực tiếp. Nhóm của bạn đang xây dựng một ứng dụng Claude mới và không quen với hạn chế này. Bạn sẽ xây dựng ứng dụng như thế nào?","jp":"あなたの企業は、直接の Anthropic API ではなく Amazon Bedrock を介して Claude API 呼び出しを行う必要がある AWS との契約を結んでいます。あなたのチームは新しい Claude アプリケーションを構築していますが、この制約についてよく知りません。アプリケーションをどのように構築しますか?"},"options":[{"k":"A","t":{"en":"Build two parallel implementations of every call, one for the direct Anthropic API and one for Bedrock, and pick the faster one at runtime.","vi":"Xây dựng hai cách triển khai song song cho mọi lệnh gọi, một cho API Anthropic trực tiếp và một cho Bedrock, đồng thời chọn cách triển khai nhanh hơn trong thời gian chạy.","jp":"すべての呼び出しに対して 2 つの並列実装 (直接 Anthropic API 用と Bedrock 用に 1 つ) を構築し、実行時に高速な方を選択します。"}},{"k":"B","t":{"en":"Build the application against the direct Anthropic API now and migrate to Bedrock in a follow-up release once the team has more experience with the Bedrock API.","vi":"Xây dựng ứng dụng dựa trên API Anthropic trực tiếp ngay bây giờ và di chuyển sang Bedrock trong bản phát hành tiếp theo sau khi nhóm có nhiều kinh nghiệm hơn với API Bedrock.","jp":"今すぐ直接 Anthropic API に対してアプリケーションを構築し、チームが Bedrock API の経験を積んだら、フォローアップ リリースで Bedrock に移行します。"}},{"k":"C","t":{"en":"Configure the application to invoke Claude through the Bedrock-compatible API path while keeping the application's logic provider-agnostic.","vi":"Định cấu hình ứng dụng để gọi Claude thông qua đường dẫn API tương thích với Bedrock trong khi vẫn giữ nguyên tính bất khả tri của nhà cung cấp logic của ứng dụng.","jp":"アプリケーションのロジックをプロバイダーに依存しないようにしながら、Bedrock 互換の API パスを通じて Claude を呼び出すようにアプリケーションを構成します。"}},{"k":"D","t":{"en":"Build the application against the direct Anthropic API and ignore the contractual requirement to route Claude calls through Amazon Bedrock.","vi":"Xây dựng ứng dụng dựa trên API Anthropic trực tiếp và bỏ qua yêu cầu theo hợp đồng để định tuyến các cuộc gọi Claude thông qua Amazon Bedrock.","jp":"直接 Anthropic API に対してアプリケーションを構築し、Amazon Bedrock 経由で Claude 呼び出しをルーティングするという契約上の要件を無視します。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Ràng buộc hợp đồng yêu cầu mọi lời gọi Claude phải đi qua <b>Amazon Bedrock</b>, nên ứng dụng phải gọi Claude qua đường Bedrock ngay từ đầu (Anthropic SDK có client cho Bedrock, model ID dạng Bedrock, xác thực AWS). Đồng thời giữ <b>logic ứng dụng không phụ thuộc nhà cung cấp</b> bằng một lớp trừu tượng mỏng cho phần gọi model, để việc chọn endpoint chỉ là cấu hình và có thể đổi sau mà không sửa logic nghiệp vụ.","elim":["<b>A.</b> Duy trì hai bản song song làm gấp đôi chi phí bảo trì và vẫn vi phạm hợp đồng mỗi khi chọn đường API trực tiếp.","<b>B.</b> Xây trên API trực tiếp trước là vi phạm hợp đồng ngay từ bản đầu và gây chi phí chuyển đổi về sau.","<b>D.</b> Bỏ qua ràng buộc hợp đồng là không chấp nhận được về pháp lý và quản trị doanh nghiệp."]}},{"id":"ccdvf-q030","n":30,"topic":1,"type":"mcq","stem":{"en":"You are designing an agent that handles a complex claim-processing workflow. Each claim moves through fact extraction, eligibility evaluation, and a decision step. The three subtasks have distinct success criteria, and some claims require iteration between fact extraction and eligibility evaluation before a decision can be reached. Which agent pattern would you apply?","vi":"Bạn đang thiết kế một tác nhân xử lý quy trình xử lý yêu cầu phức tạp. Mỗi yêu cầu đều trải qua quá trình trích xuất dữ kiện, đánh giá tính đủ điều kiện và bước quyết định. Ba nhiệm vụ phụ có tiêu chí thành công riêng biệt và một số yêu cầu yêu cầu lặp lại giữa việc trích xuất dữ kiện và đánh giá tính đủ điều kiện trước khi đưa ra quyết định. Bạn sẽ áp dụng mẫu tác nhân nào?","jp":"あなたは、複雑な請求処理ワークフローを処理するエージェントを設計しています。各請求は、事実の抽出、適格性の評価、および決定のステップを経て行われます。 3 つのサブタスクには明確な成功基準があり、一部のクレームでは、決定に達する前に事実の抽出と適格性の評価を繰り返す必要があります。どのエージェント パターンを適用しますか?"},"options":[{"k":"A","t":{"en":"A graph-based pattern that lets the agent move between subtasks based on the state of each claim, with each subtask evaluated against its own criteria.","vi":"Mẫu dựa trên biểu đồ cho phép tác nhân di chuyển giữa các nhiệm vụ phụ dựa trên trạng thái của từng yêu cầu, trong đó mỗi nhiệm vụ phụ được đánh giá theo tiêu chí riêng của nó.","jp":"グラフベースのパターン。エージェントは各クレームの状態に基づいてサブタスク間を移動でき、各サブタスクは独自の基準に基づいて評価されます。"}},{"k":"B","t":{"en":"A streaming pattern that emits partial decisions as the agent processes each claim, refining the output until a final decision emerges from the stream.","vi":"Mẫu phát trực tuyến đưa ra các quyết định từng phần khi tác nhân xử lý từng yêu cầu, tinh chỉnh đầu ra cho đến khi có quyết định cuối cùng từ luồng.","jp":"エージェントが各クレームを処理するときに部分的な決定を出力し、ストリームから最終的な決定が現れるまで出力を調整するストリーミング パターン。"}},{"k":"C","t":{"en":"A single tool-use loop pattern that gives one agent access to all the tools needed for fact extraction, eligibility evaluation, and decision-making.","vi":"Mẫu vòng lặp sử dụng công cụ duy nhất cung cấp cho một tác nhân quyền truy cập vào tất cả các công cụ cần thiết để trích xuất dữ kiện, đánh giá tính đủ điều kiện và ra quyết định.","jp":"単一ツール使用ループ パターン。事実抽出、適格性評価、意思決定に必要なすべてのツールに 1 人のエージェントがアクセスできるようになります。"}},{"k":"D","t":{"en":"A linear chain pattern that processes every claim through fact extraction, then eligibility evaluation, then decision, with no return paths between subtasks.","vi":"Một mẫu chuỗi tuyến tính xử lý mọi yêu cầu thông qua trích xuất dữ kiện, sau đó đánh giá tính đủ điều kiện, rồi đưa ra quyết định mà không có đường dẫn quay lại giữa các nhiệm vụ phụ.","jp":"事実の抽出、適格性の評価、決定を通じてすべての請求を処理する線形チェーン パターン。サブタスク間にリターン パスはありません。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Ba subtask có <b>tiêu chí thành công riêng</b> và có claim cần <b>lặp lại giữa trích xuất sự kiện và đánh giá điều kiện</b> trước khi quyết định. Mẫu <b>graph-based</b> (máy trạng thái) mô hình hóa mỗi subtask là một node với điều kiện chuyển tiếp dựa trên trạng thái claim, cho phép <b>quay lại</b> bước trước khi thiếu dữ liệu và đánh giá mỗi bước theo tiêu chí riêng — đúng điều mà chuỗi tuyến tính không làm được.","elim":["<b>B.</b> Streaming là cách truyền đầu ra, không phải mẫu điều phối; phát ra “quyết định một phần” còn nguy hiểm trong xử lý claim.","<b>C.</b> Một vòng lặp tool-use duy nhất trộn ba subtask trong một agent, không có cấu trúc để đánh giá từng bước theo tiêu chí riêng.","<b>D.</b> Chuỗi tuyến tính không có đường quay lại, trái trực tiếp với yêu cầu lặp giữa trích xuất sự kiện và đánh giá điều kiện."]},"cite":"Hướng dẫn ôn tập — §8.2 Phân rã thích ứng động (Dynamic Adaptive Decomposition); Lĩnh vực 1.6"},{"id":"ccdvf-q031","n":31,"topic":1,"type":"mcq","stem":{"en":"You are explaining to a stakeholder why running the same Claude prompt twice can produce slightly different results. The stakeholder is concerned this means the application is broken. How would you address the stakeholder's concern?","vi":"Bạn đang giải thích cho một bên liên quan tại sao việc chạy cùng một lời nhắc Claude hai lần có thể tạo ra các kết quả hơi khác nhau. Các bên liên quan lo ngại điều này có nghĩa là ứng dụng bị hỏng. Bạn sẽ giải quyết mối quan ngại của các bên liên quan như thế nào?","jp":"同じクロード プロンプトを 2 回実行するとわずかに異なる結果が得られる理由を関係者に説明しています。関係者は、これはアプリケーションが壊れていることを意味すると懸念しています。利害関係者の懸念にどのように対処しますか?"},"options":[{"k":"A","t":{"en":"Tell the stakeholder the variation is a bug that the team will fix in the next release of the application, then create a work ticket to fix the bug.","vi":"Nói với các bên liên quan rằng biến thể là một lỗi mà nhóm sẽ sửa trong bản phát hành tiếp theo của ứng dụng, sau đó tạo phiếu công việc để sửa lỗi.","jp":"関係者に、バリエーションはバグであり、チームがアプリケーションの次のリリースで修正する予定であることを伝え、バグを修正するための作業チケットを作成します。"}},{"k":"B","t":{"en":"Tell the stakeholder the variation comes from network latency and that switching to a faster network connection will produce more consistent results across runs.","vi":"Cho bên liên quan biết sự thay đổi xuất phát từ độ trễ của mạng và việc chuyển sang kết nối mạng nhanh hơn sẽ tạo ra kết quả nhất quán hơn trong các lần chạy.","jp":"関係者に、変動はネットワーク遅延に起因するものであり、より高速なネットワーク接続に切り替えると実行全体でより一貫した結果が得られることを伝えます。"}},{"k":"C","t":{"en":"Explain that LLMs are non-deterministic by default due to sampling, and describe how the application handles this through validation, retries, or temperature adjustment.","vi":"Giải thích rằng LLM không mang tính xác định theo mặc định do lấy mẫu và mô tả cách ứng dụng xử lý việc này thông qua xác thực, thử lại hoặc điều chỉnh nhiệt độ.","jp":"LLM はサンプリングのためにデフォルトでは非決定的であることを説明し、アプリケーションが検証、再試行、または温度調整を通じてこれをどのように処理するかを説明します。"}},{"k":"D","t":{"en":"Tell the stakeholder the variation is caused by Claude being updated continuously by Anthropic, and that switching to a fixed model snapshot will eliminate the variation entirely.","vi":"Nói với các bên liên quan rằng biến thể là do Claude được Anthropic cập nhật liên tục và việc chuyển sang ảnh chụp nhanh mô hình cố định sẽ loại bỏ hoàn toàn biến thể.","jp":"関係者に、ばらつきの原因はクロードが Anthropic によって継続的に更新されること、固定モデルのスナップショットに切り替えることでばらつきが完全になくなることを伝えます。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> LLM sinh token bằng <b>sampling từ phân phối xác suất</b>, nên cùng một prompt có thể cho kết quả hơi khác nhau — đây là hành vi bình thường, không phải lỗi. Cần giải thích điều đó cho stakeholder và nêu cách ứng dụng kiểm soát: <b>validation</b> đầu ra theo schema/tiêu chí, <b>retry</b> khi không đạt, và <b>hạ <code>temperature</code></b> để tăng tính nhất quán khi cần (dù temperature 0 cũng không đảm bảo hoàn toàn giống hệt).","elim":["<b>A.</b> Gọi biến thiên là bug là sai về bản chất, gây kỳ vọng sai và lãng phí công sửa một “lỗi” không tồn tại.","<b>B.</b> Độ trễ mạng không ảnh hưởng đến nội dung model sinh ra; nguồn biến thiên là sampling.","<b>D.</b> Ghim một model snapshot giúp hành vi ổn định giữa các phiên bản nhưng không loại bỏ biến thiên do sampling trong cùng một model."]}},{"id":"ccdvf-q032","n":32,"topic":1,"type":"mcq","stem":{"en":"You are implementing a custom tool for your Claude agent. The tool needs to interact with an external pricing service that returns product data. Which of the following best practices would you apply as you develop this tool?","vi":"Bạn đang triển khai một công cụ tùy chỉnh cho đại lý Claude của mình. Công cụ này cần tương tác với dịch vụ định giá bên ngoài để trả về dữ liệu sản phẩm. Bạn sẽ áp dụng phương pháp thực hành tốt nhất nào sau đây khi phát triển công cụ này?","jp":"クロード エージェント用のカスタム ツールを実装しています。このツールは、製品データを返す外部の価格設定サービスと対話する必要があります。このツールを開発する際に適用するベスト プラクティスは次のうちどれですか?"},"options":[{"k":"A","t":{"en":"Omit the tool description and let the model infer when to use the tool based on the tool's name and the rest of the prompt context.","vi":"Bỏ qua mô tả công cụ và để mô hình suy ra thời điểm sử dụng công cụ dựa trên tên của công cụ và phần còn lại của ngữ cảnh nhắc nhở.","jp":"ツールの説明を省略し、ツールの名前と残りのプロンプト コンテキストに基づいて、いつツールを使用するかをモデルに推測させます。"}},{"k":"B","t":{"en":"Define the tool with a loose schema and let the model interpret the inputs flexibly on each call the agent makes.","vi":"Xác định công cụ bằng một lược đồ lỏng lẻo và để mô hình diễn giải các đầu vào một cách linh hoạt trên mỗi lệnh gọi mà tác nhân thực hiện.","jp":"緩やかなスキーマを使用してツールを定義し、エージェントが行う呼び出しごとにモデルに入力を柔軟に解釈させます。"}},{"k":"C","t":{"en":"Implement the tool with no error handling and let the agent loop catch failures whenever the pricing service returns an error during operation.","vi":"Triển khai công cụ mà không cần xử lý lỗi và để vòng lặp tác nhân phát hiện lỗi bất cứ khi nào dịch vụ định giá trả về lỗi trong quá trình hoạt động.","jp":"エラー処理を行わずにツールを実装し、操作中に価格設定サービスがエラーを返すたびにエージェント ループで障害をキャッチできるようにします。"}},{"k":"D","t":{"en":"Define the tool with a clear schema, write a precise description for when to call it, and handle pricing service errors explicitly.","vi":"Xác định công cụ bằng sơ đồ rõ ràng, viết mô tả chính xác về thời điểm cần gọi công cụ và xử lý rõ ràng các lỗi dịch vụ định giá.","jp":"明確なスキーマを使用してツールを定義し、いつ呼び出すかについて正確な説明を記述し、価格設定サービスのエラーを明示的に処理します。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Ba thực hành cốt lõi khi xây custom tool: <b>schema rõ ràng</b> (<code>input_schema</code> với kiểu, trường bắt buộc, enum) để model sinh tham số đúng; <b>mô tả chính xác</b> tool làm gì và <i>khi nào</i> nên gọi — description là cơ sở chính để model chọn tool; và <b>xử lý lỗi tường minh</b> từ dịch vụ giá (timeout, không tìm thấy sản phẩm), trả về lỗi có cấu trúc để agent biết nên retry, thử cách khác hay báo người dùng.","elim":["<b>A.</b> Bỏ description khiến model phải đoán từ tên tool, dẫn đến chọn sai tool hoặc gọi sai lúc; description là yếu tố quan trọng nhất cho việc chọn tool.","<b>B.</b> Schema lỏng khiến tham số không nhất quán và dịch vụ phía sau dễ lỗi; model cần ràng buộc rõ để sinh input hợp lệ.","<b>C.</b> Không xử lý lỗi thì agent chỉ nhận lỗi thô hoặc ngoại lệ không có ngữ cảnh, không biết lỗi tạm thời hay vĩnh viễn để phản ứng đúng."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"ccdvf-q033","n":33,"topic":1,"type":"mcq","stem":{"en":"Your Claude application has multi-step workflows where each step's output is needed only briefly before the agent moves on. The cumulative tool output is filling the context window with content that is no longer relevant. How would you handle the accumulating tool output?","vi":"Ứng dụng Claude của bạn có quy trình làm việc gồm nhiều bước, trong đó chỉ cần thực hiện đầu ra của mỗi bước trong thời gian ngắn trước khi tổng đài viên tiếp tục. Đầu ra của công cụ tích lũy đang lấp đầy cửa sổ ngữ cảnh với nội dung không còn phù hợp. Bạn sẽ xử lý đầu ra của công cụ tích lũy như thế nào?","jp":"Claude アプリケーションには複数ステップのワークフローがあり、各ステップの出力はエージェントが先に進む前の短時間のみ必要となります。累積的なツール出力により、関連性のなくなったコンテンツがコンテキスト ウィンドウに表示されます。蓄積されたツールの出力をどのように処理しますか?"},"options":[{"k":"A","t":{"en":"Apply tool output pruning to remove tool outputs that are no longer needed by later steps in the workflow.","vi":"Áp dụng tính năng cắt bớt đầu ra của dao để loại bỏ các đầu ra của dao không còn cần thiết ở các bước sau trong quy trình làm việc.","jp":"ツール出力のプルーニングを適用して、ワークフローの後続のステップで不要になったツール出力を削除します。"}},{"k":"B","t":{"en":"Apply prompt caching to the accumulated tool outputs so the application does not re-pay for the older content on each subsequent step.","vi":"Áp dụng bộ nhớ đệm nhanh chóng cho các đầu ra của công cụ tích lũy để ứng dụng không phải trả lại nội dung cũ hơn ở mỗi bước tiếp theo.","jp":"蓄積されたツール出力にプロンプ​​ト キャッシュを適用して、アプリケーションが後続の各ステップで古いコンテンツの料金を再支払わないようにします。"}},{"k":"C","t":{"en":"Switch to a smaller Claude model that processes context more efficiently and treat any quality loss as a tradeoff for the cost reduction.","vi":"Chuyển sang mô hình Claude nhỏ hơn để xử lý ngữ cảnh hiệu quả hơn và coi bất kỳ sự suy giảm chất lượng nào là sự đánh đổi để giảm chi phí.","jp":"コンテキストをより効率的に処理し、品質の低下をコスト削減のトレードオフとして扱う、より小さなクロード モデルに切り替えます。"}},{"k":"D","t":{"en":"Keep every tool output in the context indefinitely so the agent has the full record of every step it has executed during the workflow.","vi":"Giữ mọi đầu ra của công cụ trong ngữ cảnh vô thời hạn để tác nhân có bản ghi đầy đủ về từng bước mà nó đã thực hiện trong quy trình làm việc.","jp":"すべてのツールの出力をコンテキスト内に無期限に保持することで、エージェントはワークフロー中に実行したすべてのステップの完全な記録を保持します。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Output của mỗi bước chỉ cần trong thời gian ngắn, nên giữ lại chúng chỉ chiếm chỗ trong context và làm nhiễu sự chú ý của model. <b>Tool output pruning</b> loại bỏ (hoặc rút gọn còn tóm tắt/trường cần thiết) các kết quả tool mà <b>các bước sau không còn dùng tới</b>, giải phóng context window trực tiếp và giữ context tập trung vào phần còn liên quan.","elim":["<b>B.</b> Prompt caching giảm chi phí cho tiền tố lặp lại nhưng nội dung cache vẫn chiếm context window; nó không giải quyết việc context bị lấp đầy.","<b>C.</b> Model nhỏ hơn không “xử lý context hiệu quả hơn”; output cũ vẫn tích tụ y như trước, lại thêm suy giảm chất lượng.","<b>D.</b> Giữ mọi output vô thời hạn chính là nguyên nhân gây đầy context mà đề mô tả."]},"cite":"Hướng dẫn ôn tập — §11.2 Cắt gọn Kết quả Tool; Lĩnh vực 5.1"},{"id":"ccdvf-q034","n":34,"topic":1,"type":"mcq","stem":{"en":"You are setting up the configuration management approach for a new Claude Code project. Your team will use CLAUDE.md files and settings.json files to control behavior, and you want to make sure changes are tracked and reviewable. The configuration management approach would...","vi":"Bạn đang thiết lập phương pháp quản lý cấu hình cho dự án Claude Code mới. Nhóm của bạn sẽ sử dụng tệp CLAUDE.md và tệp settings.json để kiểm soát hành vi và bạn muốn đảm bảo các thay đổi được theo dõi và xem xét được. Phương pháp quản lý cấu hình sẽ...","jp":"新しいクロード コード プロジェクトの構成管理アプローチをセットアップしています。チームは CLAUDE.md ファイルと settings.json ファイルを使用して動作を制御することになり、変更が追跡され、確認可能であることを確認したいと考えています。構成管理アプローチでは..."},"options":[{"k":"A","t":{"en":"Duplicate CLAUDE.md and settings.json files in multiple repositories to provide redundancy, on the grounds that a single source of truth is risky for project configuration.","vi":"Sao chép các tệp CLAUDE.md và settings.json trong nhiều kho lưu trữ để cung cấp sự dự phòng, với lý do rằng một nguồn thông tin chính xác duy nhất sẽ gây rủi ro cho cấu hình dự án.","jp":"プロジェクト構成において信頼できる情報源が 1 つだけでは危険であるため、CLAUDE.md ファイルと settings.json ファイルを複数のリポジトリに複製して冗長性を確保します。"}},{"k":"B","t":{"en":"Version-control CLAUDE.md and settings.json files in a separate repository from the project's source code, so configuration evolves independently from the application code over time.","vi":"Các tệp CLAUDE.md và settings.json kiểm soát phiên bản trong một kho lưu trữ riêng biệt với mã nguồn của dự án, do đó cấu hình phát triển độc lập với mã ứng dụng theo thời gian.","jp":"CLAUDE.md および settings.json ファイルはプロジェクトのソース コードとは別のリポジトリにバージョン管理されるため、構成は時間の経過とともにアプリケーション コードとは独立して進化します。"}},{"k":"C","t":{"en":"Version-control CLAUDE.md alongside the project's source code and settings.json files in a separate repository from the project's source code.","vi":"Kiểm soát phiên bản CLAUDE.md cùng với mã nguồn của dự án và các tệp settings.json trong một kho lưu trữ riêng biệt với mã nguồn của dự án.","jp":"CLAUDE.md とプロジェクトのソース コード、およびプロジェクトのソース コードとは別のリポジトリにある settings.json ファイルのバージョン管理。"}},{"k":"D","t":{"en":"Version-control CLAUDE.md and settings.json files alongside the project's source code, with changes reviewed through standard pull request workflows the team applies.","vi":"Các tệp CLAUDE.md và settings.json kiểm soát phiên bản cùng với mã nguồn của dự án, với các thay đổi được xem xét thông qua quy trình yêu cầu kéo tiêu chuẩn mà nhóm áp dụng.","jp":"プロジェクトのソース コードとともにバージョン管理された CLAUDE.md および settings.json ファイル。チームが適用する標準のプル リクエスト ワークフローを通じて変更がレビューされます。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> <code>CLAUDE.md</code> mức dự án và <code>.claude/settings.json</code> là <b>cấu hình dùng chung của cả nhóm</b>, nên phải <b>nằm cùng repo với mã nguồn và được quản lý bằng VCS</b>. Như vậy mọi thành viên clone repo đều nhận cùng chỉ dẫn và quyền, cấu hình luôn khớp với phiên bản code tương ứng. Mọi thay đổi đi qua <b>quy trình pull request</b> thông thường nên được theo dõi lịch sử và review như code, đúng với yêu cầu <i>tracked and reviewable</i> trong đề.","elim":["<b>A.</b> Nhân bản file cấu hình sang nhiều repo tạo ra nhiều bản dễ lệch nhau (drift), không ai biết bản nào đúng; đây không phải là dự phòng mà là mất nguồn sự thật duy nhất.","<b>B.</b> Đặt cấu hình ở repo riêng khiến nó tách khỏi phiên bản code mà nó mô tả; Claude Code cũng chỉ tự nạp <code>CLAUDE.md</code>/<code>.claude/settings.json</code> trong cây thư mục dự án, nên cấu hình ở repo khác không có hiệu lực và dễ lệch pha.","<b>C.</b> Tách đôi cách quản lý không có lý do: <code>settings.json</code> (permissions, hooks) cũng là cấu hình dự án cần review cùng code; để ở repo riêng gây lệch phiên bản và không được nạp tự động."]},"cite":"Hướng dẫn ôn tập — §5.1 Phân cấp CLAUDE.md; Lĩnh vực 3.1"},{"id":"ccdvf-q035","n":35,"topic":1,"type":"mcq","stem":{"en":"You are designing a Claude application that processes user-submitted text. Some of that text could include sensitive information such as account numbers or passwords that the application should not send to Claude. How would you design the application?","vi":"Bạn đang thiết kế một ứng dụng Claude xử lý văn bản do người dùng gửi. Một số văn bản đó có thể bao gồm thông tin nhạy cảm như số tài khoản hoặc mật khẩu mà ứng dụng không được gửi cho Claude. Bạn sẽ thiết kế ứng dụng như thế nào?","jp":"あなたは、ユーザーが送信したテキストを処理する Claude アプリケーションを設計しています。そのテキストの一部には、アプリケーションがクロードに送信すべきでないアカウント番号やパスワードなどの機密情報が含まれる可能性があります。アプリケーションをどのように設計しますか?"},"options":[{"k":"A","t":{"en":"Define the application boundary explicitly, identify what content can leave the boundary for Claude, and add filtering or redaction at the boundary.","vi":"Xác định ranh giới ứng dụng một cách rõ ràng, xác định nội dung nào có thể rời khỏi ranh giới đối với Claude và thêm tính năng lọc hoặc biên tập ở ranh giới.","jp":"アプリケーション境界を明示的に定義し、クロードのために境界を離れることができるコンテンツを特定し、境界にフィルタリングまたは編集を追加します。"}},{"k":"B","t":{"en":"Add a prompt instruction in the system prompt specifying the categories of sensitive information Claude should disregard when processing user-submitted text.","vi":"Thêm hướng dẫn nhắc nhở trong lời nhắc hệ thống chỉ định các danh mục thông tin nhạy cảm mà Claude nên bỏ qua khi xử lý văn bản do người dùng gửi.","jp":"ユーザーが送信したテキストを処理する際にクロードが無視すべき機密情報のカテゴリを指定するプロンプト指示をシステム プロンプトに追加します。"}},{"k":"C","t":{"en":"Log all user-submitted text before it is sent to Claude and review the logs periodically to identify whether sensitive information is reaching the model.","vi":"Ghi lại tất cả văn bản do người dùng gửi trước khi gửi cho Claude và định kỳ xem lại nhật ký để xác định xem thông tin nhạy cảm có đến được mô hình hay không.","jp":"ユーザーが送信したすべてのテキストをクロードに送信する前にログに記録し、定期的にログを確認して機密情報がモデルに到達しているかどうかを特定します。"}},{"k":"D","t":{"en":"Apply filtering at the boundary for the most commonly observed sensitive data patterns and expand coverage to additional patterns based on findings from production monitoring.","vi":"Áp dụng tính năng lọc ở ranh giới cho các mẫu dữ liệu nhạy cảm được quan sát phổ biến nhất và mở rộng phạm vi bao phủ sang các mẫu bổ sung dựa trên phát hiện từ giám sát sản xuất.","jp":"最も一般的に観察される機密データ パターンの境界でフィルタリングを適用し、運用監視の結果に基づいて追加のパターンに適用範囲を拡大します。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Bảo vệ dữ liệu nhạy cảm phải là <b>kiểm soát xác định (deterministic) ở biên ứng dụng</b>, không phụ thuộc vào hành vi của mô hình. Cách đúng là <b>xác định rõ ranh giới hệ thống</b>, phân loại nội dung nào được phép rời ranh giới để gửi tới Claude, rồi <b>lọc hoặc che (redact)</b> số tài khoản, mật khẩu... trước khi gọi API. Như vậy dữ liệu nhạy cảm không bao giờ rời khỏi hệ thống, đúng yêu cầu <i>should not send to Claude</i>.","elim":["<b>B.</b> Dặn Claude «bỏ qua» thông tin nhạy cảm trong system prompt không ngăn được việc dữ liệu đã bị gửi đi; yêu cầu là không gửi, còn prompt chỉ là hướng dẫn xác suất.","<b>C.</b> Ghi log rồi review định kỳ chỉ phát hiện rò rỉ sau khi đã xảy ra, và còn tạo thêm một nơi lưu trữ dữ liệu nhạy cảm (log) cần bảo vệ.","<b>D.</b> Chỉ lọc vài mẫu phổ biến rồi mở rộng dần theo giám sát production nghĩa là chấp nhận rò rỉ các loại chưa được bao phủ; thiếu bước xác định ranh giới và chính sách nội dung được phép rời đi ngay từ đầu."]}},{"id":"ccdvf-q036","n":36,"topic":1,"type":"mcq","stem":{"en":"Your Claude agent has too many tools, and many of them have overlapping functionality. The agent often picks an inappropriate tool when several could plausibly handle a request. How would you address the tool selection problem?","vi":"Đặc vụ Claude của bạn có quá nhiều công cụ và nhiều công cụ trong số đó có chức năng chồng chéo. Tác nhân thường chọn một công cụ không phù hợp khi một số công cụ có thể xử lý yêu cầu một cách hợp lý. Bạn sẽ giải quyết vấn đề lựa chọn công cụ như thế nào?","jp":"クロード エージェントには多すぎるツールがあり、その多くには重複する機能があります。エージェントは、リクエストをおそらく複数のツールで処理できる場合に、不適切なツールを選択することがよくあります。ツール選択の問題にどのように対処しますか?"},"options":[{"k":"A","t":{"en":"Add more tools to cover every variation of the requests the agent handles, on the grounds that more tools give the agent more accurate options to choose from.","vi":"Thêm nhiều công cụ hơn để đáp ứng mọi biến thể của yêu cầu mà tổng đài viên xử lý, với lý do là có nhiều công cụ hơn giúp đại lý có nhiều lựa chọn chính xác hơn để lựa chọn.","jp":"ツールを追加すると、エージェントがより正確なオプションを選択できるようになり、エージェントが処理するリクエストのあらゆるバリエーションに対応できます。"}},{"k":"B","t":{"en":"Remove all tools and rely on the agent's general capability instead, with the application losing the workflows that previously relied on tools.","vi":"Xóa tất cả các công cụ và thay vào đó dựa vào khả năng chung của tổng đài viên, ứng dụng sẽ mất đi các quy trình làm việc mà trước đây dựa vào các công cụ.","jp":"すべてのツールを削除し、代わりにエージェントの一般的な機能に依存すると、アプリケーションは以前ツールに依存していたワークフローを失います。"}},{"k":"C","t":{"en":"Add detailed examples to each tool's description so the agent can match incoming requests to the right tool by example, treating the examples as the team's selection mechanism.","vi":"Thêm các ví dụ chi tiết vào mô tả của từng công cụ để tổng đài viên có thể khớp các yêu cầu đến với đúng công cụ bằng ví dụ, coi các ví dụ này là cơ chế lựa chọn của nhóm.","jp":"各ツールの説明に詳細な例を追加すると、エージェントは受信リクエストを例によって適切なツールに照合し、例をチームの選択メカニズムとして扱うことができます。"}},{"k":"D","t":{"en":"Restructure the tool set by consolidating overlapping tools, removing unused tools, and clarifying tool descriptions so each tool has a distinct purpose.","vi":"Tái cấu trúc bộ công cụ bằng cách hợp nhất các công cụ chồng chéo, loại bỏ các công cụ không sử dụng và làm rõ mô tả công cụ để mỗi công cụ có một mục đích riêng biệt.","jp":"重複するツールを統合し、未使用のツールを削除し、ツールの説明を明確にすることでツール セットを再構築し、各ツールが明確な目的を持つようにします。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Việc chọn tool của Claude dựa chủ yếu vào <b>tên và mô tả tool</b>; khi nhiều tool chồng chéo chức năng và mô tả mơ hồ, mô hình không có tín hiệu để phân biệt. Giải pháp gốc là <b>tái cấu trúc bộ tool</b>: gộp các tool trùng lặp, loại bỏ tool không dùng, và viết lại mô tả để <b>mỗi tool có mục đích riêng biệt</b> (khi nào dùng, khi nào không). Bộ tool nhỏ, rõ ràng giúp giảm nhầm lẫn khi chọn tool.","elim":["<b>A.</b> Thêm tool làm tăng thêm chồng chéo và số lựa chọn, khiến việc chọn tool càng kém tin cậy hơn chứ không chính xác hơn.","<b>B.</b> Bỏ toàn bộ tool làm mất khả năng truy cập dữ liệu/hành động mà các workflow cần; đây là phản ứng thái quá, không giải quyết vấn đề chọn tool.","<b>C.</b> Thêm ví dụ vào mô tả có thể giúp phần nào nhưng không xử lý gốc rễ là các tool trùng chức năng; khi hai tool cùng làm được một việc, ví dụ vẫn để lại vùng mơ hồ."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"ccdvf-q037","n":37,"topic":1,"type":"mcq","stem":{"en":"Your Claude application requests structured JSON output from the model. Most of the time the JSON is well- formed, but occasionally Claude returns malformed JSON that breaks downstream processing. How would you handle the malformed output?","vi":"Ứng dụng Claude của bạn yêu cầu đầu ra JSON có cấu trúc từ mô hình. Hầu hết JSON được định dạng đúng, nhưng đôi khi Claude trả về JSON không đúng định dạng làm gián đoạn quá trình xử lý tiếp theo. Bạn sẽ xử lý kết quả đầu ra không đúng định dạng như thế nào?","jp":"クロード アプリケーションは、モデルからの構造化された JSON 出力を要求します。ほとんどの場合、JSON は整形式ですが、クロードがダウンストリーム処理を中断する不正な形式の JSON を返す場合があります。不正な出力をどのように処理しますか?"},"options":[{"k":"A","t":{"en":"Manually inspect every response before downstream processing so a human reviewer catches any malformed JSON before the application passes the response to downstream systems.","vi":"Kiểm tra thủ công mọi phản hồi trước khi xử lý xuôi dòng để người đánh giá phát hiện mọi JSON không đúng định dạng trước khi ứng dụng chuyển phản hồi đến các hệ thống xuôi dòng.","jp":"ダウンストリーム処理の前にすべての応答を手動で検査し、アプリケーションが応答をダウンストリーム システムに渡す前に人間のレビュー担当者が不正な JSON を検出できるようにします。"}},{"k":"B","t":{"en":"Add output validation that parses Claude's response against the expected schema and treats malformed output as a recognized error path with retry or fallback handling.","vi":"Thêm xác thực đầu ra để phân tích phản hồi của Claude dựa trên lược đồ dự kiến ​​và xử lý đầu ra không đúng định dạng dưới dạng đường dẫn lỗi được nhận dạng bằng cách xử lý thử lại hoặc dự phòng.","jp":"クロードの応答を予期されるスキーマに対して解析し、不正な出力を再試行またはフォールバック処理で認識されたエラー パスとして扱う出力検証を追加します。"}},{"k":"C","t":{"en":"Switch to free-form text output so the application no longer depends on JSON parsing for any of the responses it sends to downstream systems during normal operation.","vi":"Chuyển sang đầu ra văn bản dạng tự do để ứng dụng không còn phụ thuộc vào phân tích cú pháp JSON cho bất kỳ phản hồi nào mà nó gửi đến các hệ thống hạ nguồn trong quá trình hoạt động bình thường.","jp":"自由形式のテキスト出力に切り替えると、アプリケーションは通常の動作中にダウンストリーム システムに送信する応答の JSON 解析に依存しなくなります。"}},{"k":"D","t":{"en":"Retry the same request repeatedly until valid JSON appears in the model's response, with the retry loop adding delay to the application's response time on affected requests.","vi":"Hãy thử lại cùng một yêu cầu nhiều lần cho đến khi JSON hợp lệ xuất hiện trong phản hồi của mô hình, với vòng lặp thử lại sẽ tăng thêm độ trễ cho thời gian phản hồi của ứng dụng đối với các yêu cầu bị ảnh hưởng.","jp":"有効な JSON がモデルの応答に表示されるまで、同じリクエストを繰り返し再試行します。再試行ループにより、影響を受けるリクエストに対するアプリケーションの応答時間に遅延が追加されます。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Đầu ra của LLM luôn có xác suất sai định dạng, nên ứng dụng cần <b>lớp validation</b>: parse phản hồi và kiểm tra theo <b>schema mong đợi</b> trước khi chuyển cho hệ thống downstream. JSON lỗi được coi là một <b>nhánh lỗi đã biết</b> với xử lý <b>retry (tốt nhất kèm phản hồi lỗi cụ thể) hoặc fallback</b>, thay vì làm sập pipeline. Cách này giữ được lợi ích của structured output mà vẫn an toàn với tỷ lệ lỗi nhỏ.","elim":["<b>A.</b> Kiểm tra thủ công mọi phản hồi không mở rộng được và tốn kém, trong khi việc kiểm tra cú pháp JSON hoàn toàn tự động hóa được.","<b>C.</b> Chuyển sang văn bản tự do làm mất cấu trúc mà downstream cần, khiến việc phân tích còn khó và dễ lỗi hơn.","<b>D.</b> Retry mù quáng, lặp lại cùng request không giới hạn, không có validation hay phản hồi lỗi, làm tăng độ trễ/chi phí và không đảm bảo hội tụ; thiếu fallback khi retry vẫn thất bại."]},"cite":"Hướng dẫn ôn tập — §6.5 Validation và Retry-with-Feedback; Lĩnh vực 4.4"},{"id":"ccdvf-q038","n":38,"topic":1,"type":"mcq","stem":{"en":"A Claude application is producing outputs that drift away from the expected JSON format after several conversation turns. The first few turns produce correctly formatted output, but later turns gradually lose structure. How would you address the drift?","vi":"Một ứng dụng Claude đang tạo ra các kết quả đầu ra khác với định dạng JSON mong đợi sau một vài lượt hội thoại. Một vài lượt đầu tiên tạo ra đầu ra được định dạng chính xác, nhưng các lượt sau đó dần mất cấu trúc. Bạn sẽ giải quyết sự trôi dạt như thế nào?","jp":"Claude アプリケーションは、会話が数回切り替わった後、予想される JSON 形式から離れる出力を生成します。最初の数ターンは正しくフォーマットされた出力を生成しますが、後のターンでは徐々に構造が失われます。このドリフトにどう対処しますか?"},"options":[{"k":"A","t":{"en":"Identify the failure mode as format drift, examine how the conversation context evolves over turns, and address the drift through context management or output validat
