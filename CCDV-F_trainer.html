ion.","vi":"Xác định chế độ lỗi là sai lệch định dạng, kiểm tra xem bối cảnh hội thoại phát triển như thế nào qua các lượt và giải quyết sai lệch thông qua quản lý bối cảnh hoặc xác thực đầu ra.","jp":"障害モードをフォーマットのドリフトとして特定し、会話コンテキストがターン中にどのように変化するかを調べ、コンテキスト管理または出力検証を通じてドリフトに対処します。"}},{"k":"B","t":{"en":"Truncate every response to the first few characters, validate that the truncated output matches the expected JSON structure, and log any mismatches for review.","vi":"Cắt bớt mọi phản hồi đối với một vài ký tự đầu tiên, xác thực rằng kết quả bị cắt bớt khớp với cấu trúc JSON dự kiến ​​và ghi lại mọi thông tin không khớp để xem xét.","jp":"すべての応答を最初の数文字まで切り捨て、切り捨てられた出力が予想される JSON 構造と一致することを検証し、レビューのために不一致をログに記録します。"}},{"k":"C","t":{"en":"Restart the application after every turn and monitor whether the format remains consistent across subsequent interactions.","vi":"Khởi động lại ứng dụng sau mỗi lượt và theo dõi xem định dạng có còn nhất quán trong các lần tương tác tiếp theo hay không.","jp":"ターンごとにアプリケーションを再起動し、その後の対話間でフォーマットの一貫性が保たれているかどうかを監視します。"}},{"k":"D","t":{"en":"Switch to a smaller Claude model and re-test the application to determine whether the drift persists across conversation turns.","vi":"Chuyển sang mô hình Claude nhỏ hơn và kiểm tra lại ứng dụng để xác định xem liệu tình trạng lệch lạc có còn tồn tại qua các lượt trò chuyện hay không.","jp":"より小さいクロード モデルに切り替えてアプリケーションを再テストし、会話が切り替わってもドリフトが持続するかどうかを判断します。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Hiện tượng định dạng tốt ở các lượt đầu rồi xấu dần là <b>format drift</b>: khi hội thoại dài ra, chỉ dẫn định dạng ban đầu bị «chìm» giữa nội dung mới, hoặc các phản hồi lệch chuẩn trong lịch sử trở thành mẫu cho lượt sau. Cách xử lý có hệ thống là <b>xác định đúng loại lỗi</b>, <b>xem context tiến hóa thế nào qua các lượt</b>, rồi khắc phục bằng <b>quản lý context</b> (nhắc lại/giữ ràng buộc định dạng, tóm tắt lịch sử) và/hoặc <b>validation đầu ra</b> mỗi lượt.","elim":["<b>B.</b> Cắt phản hồi còn vài ký tự đầu làm hỏng chính JSON cần dùng; việc kiểm tra một đoạn bị cắt cũng không cho biết cấu trúc đầy đủ có đúng hay không.","<b>C.</b> Khởi động lại ứng dụng sau mỗi lượt phá vỡ tính đa lượt của hội thoại và chỉ né triệu chứng, không tìm nguyên nhân.","<b>D.</b> Đổi sang mô hình nhỏ hơn không nhắm vào nguyên nhân (context tích lũy) và thường còn làm khả năng tuân thủ định dạng kém đi."]},"cite":"Hướng dẫn ôn tập — §6.5 Validation và Retry-with-Feedback; Lĩnh vực 5.1"},{"id":"ccdvf-q039","n":39,"topic":1,"type":"mcq","stem":{"en":"Your Claude application's token costs have grown faster than expected. The team has not been tracking token usage by feature, so the team cannot identify which features are driving cost. The team is debating how to respond. How would you respond?","vi":"Chi phí mã thông báo cho ứng dụng Claude của bạn đã tăng nhanh hơn dự kiến. Nhóm chưa theo dõi việc sử dụng mã thông báo theo tính năng, vì vậy nhóm không thể xác định tính năng nào đang thúc đẩy chi phí. Nhóm đang tranh luận về cách trả lời. Bạn sẽ trả lời thế nào?","jp":"クロード アプリケーションのトークン コストが予想よりも速く増加しました。チームは機能ごとのトークンの使用状況を追跡していないため、どの機能がコストを引き起こしているかを特定できません。チームはどのように対応するかを議論している。あなたならどう答えますか？"},"options":[{"k":"A","t":{"en":"Tell the team that cost growth is unavoidable as the application scales and that no investigation will change the trajectory of the application's cost over the next several quarters.","vi":"Nói với nhóm rằng việc tăng chi phí là không thể tránh khỏi khi ứng dụng mở rộng quy mô và không có cuộc điều tra nào sẽ thay đổi quỹ đạo chi phí của ứng dụng trong vài quý tới.","jp":"アプリケーションの規模が拡大するにつれてコストの増加は避けられないこと、および今後数四半期にわたるアプリケーションのコストの軌道を変更する調査は行われないことをチームに伝えます。"}},{"k":"B","t":{"en":"Switch every feature to the smallest model to cut cost broadly across the application during normal operation.","vi":"Chuyển mọi tính năng sang mô hình nhỏ nhất để cắt giảm chi phí trên toàn bộ ứng dụng trong quá trình hoạt động bình thường.","jp":"すべての機能を最小のモデルに切り替えて、通常の運用中にアプリケーション全体のコストを大幅に削減します。"}},{"k":"C","t":{"en":"Reduce token usage uniformly across all features by half, applying the cut evenly across the application during normal operation.","vi":"Giảm một nửa mức sử dụng mã thông báo đồng đều trên tất cả các tính năng, áp dụng mức cắt giảm đồng đều trên ứng dụng trong quá trình hoạt động bình thường.","jp":"すべての機能でトークンの使用量を均等に半分に削減し、通常の動作中にアプリケーション全体に均等にカットを適用します。"}},{"k":"D","t":{"en":"Add token usage tracking by feature to the application's logging so the team can identify which features drive cost before recommending changes.","vi":"Thêm tính năng theo dõi mức sử dụng mã thông báo theo tính năng vào nhật ký của ứng dụng để nhóm có thể xác định tính năng nào thúc đẩy chi phí trước khi đề xuất thay đổi.","jp":"機能ごとのトークン使用状況追跡をアプリケーションのログに追加すると、チームは変更を推奨する前にどの機能がコストを増加させるかを特定できます。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Không thể tối ưu chi phí khi chưa biết chi phí đến từ đâu. Bước đầu tiên là <b>bổ sung đo lường (observability)</b>: ghi nhận <b>token usage theo từng feature</b> (API trả về <code>usage</code> với input/output tokens cho mỗi request) để xác định feature nào gây tăng chi phí. Sau đó mới đưa ra đề xuất có mục tiêu như đổi model cho feature cụ thể, dùng prompt caching hay rút gọn prompt, dựa trên dữ liệu thay vì phỏng đoán.","elim":["<b>A.</b> Kết luận chi phí tăng là không tránh khỏi khi chưa điều tra là thiếu cơ sở và bỏ qua các tối ưu có thể làm được.","<b>B.</b> Chuyển mọi feature sang model nhỏ nhất là quyết định đại trà khi chưa có dữ liệu, có thể làm giảm chất lượng ở những feature cần model mạnh mà chưa chắc nhắm đúng nguồn chi phí.","<b>C.</b> Cắt đồng loạt 50% token là con số tùy ý, không gắn với feature nào thực sự gây chi phí và có thể làm hỏng các feature vốn đã tiết kiệm."]}},{"id":"ccdvf-q040","n":40,"topic":1,"type":"mcq","stem":{"en":"You maintain a Claude application that uses Claude Sonnet 4.5 across several production workflows. Anthropic released Claude Sonnet 4.7, which your evaluation suite shows performing 8% better on your highest-volume task. However, this version produces different output formatting on two of your structured- extraction prompts that downstream consumers parse with regex-based code. To roll out the upgrade, you would...","vi":"Bạn duy trì một ứng dụng Claude sử dụng Claude Sonnet 4.5 trong một số quy trình sản xuất. Anthropic đã phát hành Claude Sonnet 4.7, bộ đánh giá của bạn cho thấy hoạt động tốt hơn 8% đối với nhiệm vụ có khối lượng cao nhất của bạn. Tuy nhiên, phiên bản này tạo ra định dạng đầu ra khác nhau trên hai lời nhắc trích xuất có cấu trúc mà người tiêu dùng ở cấp dưới phân tích cú pháp bằng mã dựa trên biểu thức chính quy. Để triển khai bản nâng cấp, bạn sẽ...","jp":"いくつかの実稼働ワークフローにわたって Claude Sonnet 4.5 を使用する Claude アプリケーションを管理します。 Anthropic は Claude Sonnet 4.7 をリリースしました。評価スイートでは、最大量のタスクで 8% 優れたパフォーマンスを示しています。ただし、このバージョンでは、ダウンストリームのコンシューマが正規表現ベースのコードで解析する 2 つの構造化抽出プロンプトで異なる出力形式が生成されます。アップグレードをロールアウトするには、次のことを行います..."},"options":[{"k":"A","t":{"en":"Adjust the prompts to constrain output format, re-run evaluations against the expected parsing-layer schema, then roll the model out with a feature flag and the option to revert per workflow.","vi":"Điều chỉnh lời nhắc để hạn chế định dạng đầu ra, chạy lại các đánh giá dựa trên lược đồ lớp phân tích cú pháp dự kiến, sau đó triển khai mô hình với cờ tính năng và tùy chọn hoàn nguyên theo quy trình công việc.","jp":"プロンプトを調整して出力形式を制限し、予想される解析層スキーマに対して評価を再実行してから、機能フラグとワークフローごとに元に戻すオプションを使用してモデルをロールアウトします。"}},{"k":"B","t":{"en":"Switch the model identifier in the application's configuration to the new model, then monitor production for parsing failures to be fixed as failures surface.","vi":"Chuyển mã định danh mô hình trong cấu hình của ứng dụng sang mô hình mới, sau đó giám sát quá trình sản xuất để phát hiện các lỗi phân tích cú pháp cần được khắc phục dưới dạng lỗi bề mặt.","jp":"アプリケーションの構成内のモデル識別子を新しいモデルに切り替えてから、障害が表面化したときに修正される解析障害がないか本番環境を監視します。"}},{"k":"C","t":{"en":"Rewrite the downstream parsing code to accept a wider range of output formats to ensure the application is resilient to future model upgrades without requiring prompt changes.","vi":"Viết lại mã phân tích cú pháp xuôi dòng để chấp nhận phạm vi định dạng đầu ra rộng hơn nhằm đảm bảo ứng dụng có khả năng linh hoạt trước các bản nâng cấp mô hình trong tương lai mà không yêu cầu thay đổi nhanh chóng.","jp":"ダウンストリームの解析コードを書き換えて、より幅広い出力形式を受け入れられるようにして、迅速な変更を必要とせずに、将来のモデルのアップグレードに対するアプリケーションの回復力を確保します。"}},{"k":"D","t":{"en":"Keep the older model in production to preserve the fragile parsing layer that may risk breaking with any model change.","vi":"Giữ mô hình cũ hơn trong quá trình sản xuất để bảo toàn lớp phân tích cú pháp mỏng manh có thể có nguy cơ bị hỏng khi thay đổi mô hình.","jp":"モデルの変更によって破損する危険性がある脆弱な解析層を保存するために、古いモデルを運用環境に残しておきます。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Nâng cấp model là thay đổi có rủi ro hành vi, nên cần <b>rollout có kiểm soát</b>. Trước hết <b>chỉnh prompt để ràng buộc định dạng đầu ra</b> cho hai prompt trích xuất bị lệch, rồi <b>chạy lại evaluation</b> đối chiếu với schema mà lớp parsing mong đợi. Khi đạt, triển khai qua <b>feature flag</b> với khả năng <b>revert theo từng workflow</b>, nhờ đó vừa hưởng mức cải thiện 8% vừa bảo vệ các consumer downstream dùng regex.","elim":["<b>B.</b> Đổi model ngay rồi chờ lỗi xảy ra ở production là dùng người dùng làm môi trường test, trong khi lỗi định dạng đã được biết trước từ eval.","<b>C.</b> Viết lại parser để chấp nhận mọi định dạng là tốn công, làm logic parsing lỏng lẻo và dễ nhận sai dữ liệu; không giải quyết việc định dạng đầu ra không được ràng buộc.","<b>D.</b> Giữ model cũ vô thời hạn bỏ lỡ cải thiện đã đo được và chỉ trì hoãn vấn đề, vì model cũ rồi cũng bị ngừng hỗ trợ."]}},{"id":"ccdvf-q041","n":41,"topic":1,"type":"mcq","stem":{"en":"You are reviewing an architectural diagram for a Claude-powered travel-booking system. The diagram shows a top-level component that interprets user requests and three subordinate components that handle flights, hotels, and ground transportation. The top-level component is responsible for routing each request, sequencing the subordinate components, and reconciling their outputs into a final itinerary. The diagram also shows that each subordinate component has its own tool list and own short conversation history that is not shared with the others. Which architectural pattern does this diagram most closely describe?","vi":"Bạn đang xem xét sơ đồ kiến ​​trúc của hệ thống đặt vé du lịch do Claude cung cấp. Sơ đồ hiển thị một thành phần cấp cao nhất giúp diễn giải các yêu cầu của người dùng và ba thành phần cấp dưới xử lý các chuyến bay, khách sạn và vận tải mặt đất. Thành phần cấp cao nhất chịu trách nhiệm định tuyến từng yêu cầu, sắp xếp thứ tự các thành phần cấp dưới và điều chỉnh kết quả đầu ra của chúng thành hành trình cuối cùng. Sơ đồ cũng cho thấy mỗi thành phần cấp dưới có danh sách công cụ riêng và lịch sử hội thoại ngắn không được chia sẻ với những thành phần khác. Sơ đồ này mô tả chặt chẽ nhất mô hình kiến ​​trúc nào?","jp":"あなたは、Claude を利用した旅行予約システムのアーキテクチャ図を検討しています。この図は、ユーザーのリクエストを解釈する最上位コンポーネントと、航空券、ホテル、地上交通機関を処理する 3 つの下位コンポーネントを示しています。最上位コンポーネントは、各リクエストのルーティング、下位コンポーネントの順序付け、およびそれらの出力の最終的な旅程への調整を担当します。この図は、各下位コンポーネントが独自のツール リストと、他のコンポーネントとは共有されていない独自の短い会話履歴を持っていることも示しています。この図が最もよく表しているアーキテクチャ パターンはどれですか?"},"options":[{"k":"A","t":{"en":"A manager and supervisor pattern with isolated context per subagent, where the top-level agent coordinates specialized subagents that each maintain their own conversation history and tool list.","vi":"Mẫu người quản lý và người giám sát có bối cảnh riêng biệt cho mỗi tổng đài viên phụ, trong đó tổng đài viên cấp cao nhất điều phối các đại lý phụ chuyên biệt mà mỗi tổng đài viên duy trì lịch sử hội thoại và danh sách công cụ của riêng mình.","jp":"サブエージェントごとにコンテキストが分離されたマネージャーとスーパーバイザーのパターン。トップレベルのエージェントが、それぞれが独自の会話履歴とツール リストを保持する特殊なサブエージェントを調整します。"}},{"k":"B","t":{"en":"A manager and supervisor pattern with shared context, where the top-level agent and the subagents all share a single conversation history that grows as the request flows through the system.","vi":"Mẫu người quản lý và người giám sát có bối cảnh chung, trong đó tổng đài viên cấp cao nhất và đại lý phụ đều chia sẻ một lịch sử hội thoại duy nhất, lịch sử này sẽ phát triển khi yêu cầu truyền qua hệ thống.","jp":"コンテキストを共有するマネージャーとスーパーバイザーのパターン。トップレベルのエージェントとサブエージェントはすべて、リクエストがシステム内を流れるにつれて増加する単一の会話履歴を共有します。"}},{"k":"C","t":{"en":"A pipeline pattern, where each component processes the user request in sequence and passes the full conversation history along with the request to the next component in the pipeline.","vi":"Mẫu quy trình, trong đó mỗi thành phần xử lý yêu cầu của người dùng theo trình tự và chuyển toàn bộ lịch sử hội thoại cùng với yêu cầu đến thành phần tiếp theo trong quy trình.","jp":"パイプライン パターン。各コンポーネントがユーザー リクエストを順番に処理し、リクエストとともに完全な会話履歴をパイプライン内の次のコンポーネントに渡します。"}},{"k":"D","t":{"en":"A retrieval-augmented pattern, where the top-level component retrieves relevant context from the subordinate components' indexed data stores before generating each response.","vi":"Mẫu tăng cường truy xuất, trong đó thành phần cấp cao nhất truy xuất ngữ cảnh có liên quan từ kho lưu trữ dữ liệu được lập chỉ mục của thành phần cấp dưới trước khi tạo từng phản hồi.","jp":"検索拡張パターン。最上位コンポーネントは、各応答を生成する前に、下位コンポーネントのインデックス付きデータ ストアから関連するコンテキストを取得します。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Sơ đồ mô tả đúng mô hình <b>manager/supervisor (coordinator–subagent, hub-and-spoke)</b>: component cấp trên định tuyến, sắp thứ tự và tổng hợp kết quả thành lịch trình cuối. Chi tiết then chốt là mỗi component con có <b>danh sách tool riêng</b> và <b>lịch sử hội thoại riêng không chia sẻ</b>, tức là <b>context được cô lập theo từng subagent</b>; subagent chỉ nhận những gì coordinator truyền cho nó.","elim":["<b>B.</b> Đề nói rõ lịch sử hội thoại của mỗi component con <i>không được chia sẻ</i>, mâu thuẫn với một lịch sử chung lớn dần.","<b>C.</b> Pipeline xử lý tuần tự và truyền toàn bộ lịch sử cho bước sau; trong sơ đồ có một coordinator trung tâm định tuyến và tổng hợp, còn context không được truyền nguyên vẹn giữa các component.","<b>D.</b> Sơ đồ không có kho dữ liệu được đánh chỉ mục hay bước truy xuất; các component con là agent thực hiện việc (đặt vé, khách sạn), không phải nguồn retrieval."]},"cite":"Hướng dẫn ôn tập — §3.3 Hub-and-Spoke: Coordinator và Subagent; Lĩnh vực 1.2"},{"id":"ccdvf-q042","n":42,"topic":1,"type":"mcq","stem":{"en":"You are integrating Claude into an application written in Python. The Claude SDK provides a Python client that wraps the underlying REST API. How would you integrate the SDK?","vi":"Bạn đang tích hợp Claude vào một ứng dụng viết bằng Python. SDK Claude cung cấp ứng dụng khách Python bao bọc API REST cơ bản. Bạn sẽ tích hợp SDK như thế nào?","jp":"Claude を Python で書かれたアプリケーションに統合しています。 Claude SDK は、基礎となる REST API をラップする Python クライアントを提供します。 SDKをどのように統合しますか?"},"options":[{"k":"A","t":{"en":"Call the REST API directly with raw HTTP requests so the application avoids the SDK's abstraction between the application code and the API.","vi":"Gọi trực tiếp API REST bằng các yêu cầu HTTP thô để ứng dụng tránh được sự trừu tượng của SDK giữa mã ứng dụng và API.","jp":"生の HTTP リクエストを使用して REST API を直接呼び出すと、アプリケーションはアプリケーション コードと API の間の SDK の抽象化を回避できます。"}},{"k":"B","t":{"en":"Use the Claude Python SDK and let it handle authentication, retries, and response parsing through its standard documented patterns for Python integrations.","vi":"Sử dụng Claude Python SDK và để nó xử lý quá trình xác thực, thử lại và phân tích cú pháp phản hồi thông qua các mẫu tài liệu tiêu chuẩn để tích hợp Python.","jp":"Claude Python SDK を使用すると、Python 統合用に文書化された標準パターンを通じて認証、再試行、応答解析を処理できます。"}},{"k":"C","t":{"en":"Use a different LLM provider's SDK and translate the responses into Claude's API shape so the application can switch providers in the future.","vi":"Sử dụng SDK của nhà cung cấp LLM khác và chuyển các phản hồi sang dạng API của Claude để ứng dụng có thể chuyển đổi nhà cung cấp trong tương lai.","jp":"別の LLM プロバイダーの SDK を使用し、応答を Claude の API 形式に変換して、アプリケーションが将来プロバイダーを切り替えられるようにします。"}},{"k":"D","t":{"en":"Skip the SDK and embed Claude calls in shell commands invoked from Python, so that the application runs the calls outside the main Python process.","vi":"Bỏ qua SDK và nhúng các lệnh gọi Claude vào các lệnh shell được gọi từ Python để ứng dụng chạy các lệnh gọi bên ngoài quy trình Python chính.","jp":"SDK をスキップし、Python から呼び出されるシェル コマンドに Claude 呼び出しを埋め込み、アプリケーションがメインの Python プロセスの外で呼び出しを実行できるようにします。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> SDK Python chính thức (<code>anthropic</code>) là cách tích hợp chuẩn: nó <b>xử lý xác thực</b> (đọc <code>ANTHROPIC_API_KEY</code>), <b>tự động retry</b> các lỗi tạm thời, <b>timeout</b>, và <b>parse phản hồi thành đối tượng có kiểu</b>. Dùng theo các mẫu tài liệu hóa giúp giảm code tự viết, ít lỗi hơn và dễ cập nhật khi API thay đổi.","elim":["<b>A.</b> Gọi HTTP thô buộc nhóm tự viết lại xác thực, retry, parse và xử lý lỗi mà SDK đã cung cấp, trong khi lớp trừu tượng của SDK rất mỏng và không gây hại.","<b>C.</b> Dùng SDK của nhà cung cấp khác rồi dịch sang dạng API Claude là thêm lớp phức tạp không cần thiết cho một nhu cầu chưa tồn tại.","<b>D.</b> Gọi Claude qua lệnh shell từ Python làm mất xử lý lỗi, kiểu dữ liệu và hiệu năng, đồng thời tăng rủi ro bảo mật (shell injection, lộ key qua tham số)."]},"cite":"Hướng dẫn ôn tập — §1.1 Cấu trúc Yêu cầu API"},{"id":"ccdvf-q043","n":43,"topic":1,"type":"mcq","stem":{"en":"A new Claude model release includes performance improvements for several reasoning tasks but has changed the format of its responses to system prompts that use multi-section instructions. Your application uses multi- section system prompts heavily. Initial evaluation on the application's actual workload shows the new model performs 8 percent better on reasoning tasks but produces malformed output on roughly 3 percent of requests because of the format change. The team is debating whether to upgrade. How would you decide?","vi":"Bản phát hành mô hình Claude mới bao gồm các cải tiến về hiệu suất cho một số tác vụ suy luận nhưng đã thay đổi định dạng phản hồi của nó đối với các lời nhắc hệ thống sử dụng các hướng dẫn nhiều phần. Ứng dụng của bạn sử dụng nhiều lời nhắc hệ thống nhiều phần. Đánh giá ban đầu về khối lượng công việc thực tế của ứng dụng cho thấy mô hình mới hoạt động tốt hơn 8% trong các nhiệm vụ lý luận nhưng tạo ra kết quả không đúng định dạng trên khoảng 3% yêu cầu do thay đổi định dạng. Nhóm đang tranh luận xem có nên nâng cấp hay không. Bạn sẽ quyết định như thế nào?","jp":"新しいクロード モデルのリリースには、いくつかの推論タスクのパフォーマンスの向上が含まれていますが、複数セクションの命令を使用するシステム プロンプトに対する応答の形式が変更されています。アプリケーションでは複数セクションのシステム プロンプトが頻繁に使用されます。アプリケーションの実際のワークロードに関する初期評価では、新しいモデルは推論タスクのパフォーマンスが 8% 向上していますが、形式の変更によりリクエストの約 3% で不正な出力が生成されることが示されています。チームはアップグレードするかどうかを議論しています。どうやって決めますか？"},"options":[{"k":"A","t":{"en":"Upgrade immediately, because the 8 percent reasoning improvement outweighs the 3 percent malformed output rate across the application's typical request distribution.","vi":"Hãy nâng cấp ngay lập tức vì cải thiện lý luận 8 phần trăm lớn hơn tỷ lệ đầu ra không đúng định dạng 3 phần trăm trong quá trình phân phối yêu cầu thông thường của ứng dụng.","jp":"アプリケーションの典型的なリクエスト分布全体で 8% の推論改善が 3% の不正な出力率を上回るため、すぐにアップグレードしてください。"}},{"k":"B","t":{"en":"Adapt the application's system prompt to the new model's format expectations and reevaluate, then upgrade only if the adapted prompt eliminates the malformed output while preserving the reasoning improvements.","vi":"Điều chỉnh lời nhắc hệ thống của ứng dụng cho phù hợp với mong đợi về định dạng của mô hình mới và đánh giá lại, sau đó chỉ nâng cấp nếu lời nhắc đã điều chỉnh loại bỏ kết quả đầu ra không đúng định dạng trong khi vẫn duy trì các cải tiến lý luận.","jp":"アプリケーションのシステム プロンプトを新しいモデルの期待される形式に適応させて再評価し、適応されたプロンプトによって推論の改善を維持しながら不正な出力が除去される場合にのみアップグレードします。"}},{"k":"C","t":{"en":"Upgrade and add a downstream validation step that catches the 3 percent malformed output before it reaches users, treating the validation step as the team's mitigation for the format change.","vi":"Nâng cấp và thêm bước xác thực xuôi dòng để phát hiện 3% kết quả đầu ra không đúng định dạng trước khi đến tay người dùng, coi bước xác thực là biện pháp giảm nhẹ của nhóm đối với việc thay đổi định dạng.","jp":"ダウンストリーム検証ステップをアップグレードして追加します。これは、ユーザーに届く前に 3% の不正な出力を検出し、検証ステップを形式変更に対するチームの緩和策として扱います。"}},{"k":"D","t":{"en":"Stay on the previous model permanently to avoid the malformed output rate and any future format changes that subsequent model releases might introduce in the application.","vi":"Ở lại vĩnh viễn trên mô hình trước đó để tránh tốc độ đầu ra không đúng định dạng và mọi thay đổi định dạng trong tương lai mà các bản phát hành mô hình tiếp theo có thể đưa vào ứng dụng.","jp":"不正な形式の出力レートや、後続のモデル リリースでアプリケーションに導入される可能性のある将来の形式変更を避けるために、以前のモデルを永続的に使用し続けてください。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Quyết định nâng cấp nên <b>dựa trên đánh giá với workload thực tế</b> và xử lý gốc rễ của lỗi. Vì lỗi định dạng đến từ cách model mới hiểu system prompt nhiều phần, bước hợp lý là <b>điều chỉnh system prompt</b> theo kỳ vọng của model mới rồi <b>đánh giá lại</b>. Chỉ nâng cấp khi prompt mới <b>loại bỏ được lỗi định dạng mà vẫn giữ mức cải thiện suy luận</b>, tức là có tiêu chí rõ ràng để quyết định.","elim":["<b>A.</b> Nâng cấp ngay chấp nhận 3% phản hồi lỗi đến tay người dùng; đem so 8% với 3% là so hai đại lượng khác loại, và bỏ qua khả năng sửa được bằng prompt.","<b>C.</b> Lớp validation chỉ bắt lỗi chứ không sửa nguyên nhân; 3% request vẫn hỏng và cần retry hoặc fallback, tốn chi phí khi lỗi có thể được loại bỏ từ prompt.","<b>D.</b> Ở lại model cũ mãi mãi bỏ lỡ cải thiện và không bền vững vì model cũ sẽ bị ngừng hỗ trợ; né tránh thay vì thích nghi."]}},{"id":"ccdvf-q044","n":44,"topic":1,"type":"mcq","stem":{"en":"You are starting a new Claude application and have a small set of well-labeled examples that demonstrate the desired output format. You want to use these examples to guide Claude's behavior. How would you guide the application's behavior?","vi":"Bạn đang khởi động một ứng dụng Claude mới và có một tập hợp nhỏ các ví dụ được gắn nhãn rõ ràng thể hiện định dạng đầu ra mong muốn. Bạn muốn sử dụng những ví dụ này để hướng dẫn hành vi của Claude. Bạn sẽ hướng dẫn hành vi của ứng dụng như thế nào?","jp":"あなたは新しい Claude アプリケーションを開始しており、目的の出力形式を示す適切にラベル付けされたサンプルの小さなセットを持っています。これらの例を使用して、クロードの行動をガイドしたいと考えています。アプリケーションの動作をどのようにガイドしますか?"},"options":[{"k":"A","t":{"en":"Use multi-shot prompting by including the labeled examples in the prompt so Claude can match the desired output format on each request.","vi":"Sử dụng lời nhắc chụp nhiều cảnh bằng cách đưa các ví dụ được gắn nhãn vào lời nhắc để Claude có thể khớp định dạng đầu ra mong muốn cho mỗi yêu cầu.","jp":"プロンプトにラベル付きの例を含めてマルチショット プロンプトを使用すると、クロードは各リクエストで必要な出力形式を一致させることができます。"}},{"k":"B","t":{"en":"Use zero-shot prompting and rely on the model's general capability to produce the desired output format consistently across all incoming requests.","vi":"Sử dụng lời nhắc không bắn và dựa vào khả năng chung của mô hình để tạo ra định dạng đầu ra mong muốn một cách nhất quán trên tất cả các yêu cầu gửi đến.","jp":"ゼロショット プロンプトを使用し、モデルの一般的な機能を利用して、すべての受信リクエストにわたって目的の出力形式を一貫して生成します。"}},{"k":"C","t":{"en":"Embed the examples in a database and retrieve them at runtime as reference material for the team.","vi":"Nhúng các ví dụ vào cơ sở dữ liệu và truy xuất chúng trong thời gian chạy làm tài liệu tham khảo cho nhóm.","jp":"サンプルをデータベースに埋め込み、実行時にチームの参考資料として取得します。"}},{"k":"D","t":{"en":"Train a custom model on the labeled examples before deployment so that the application does not need to include the examples in any prompt during operation.","vi":"Huấn luyện mô hình tùy chỉnh trên các ví dụ được gắn nhãn trước khi triển khai để ứng dụng không cần đưa các ví dụ vào bất kỳ lời nhắc nào trong quá trình hoạt động.","jp":"デプロイ前にラベル付きのサンプルでカスタム モデルをトレーニングして、アプリケーションの操作中にプロンプ​​トにサンプルを含める必要がないようにします。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Khi đã có một tập nhỏ ví dụ được gắn nhãn tốt minh họa định dạng mong muốn, kỹ thuật phù hợp nhất là <b>few-shot / multi-shot prompting</b>: đưa các ví dụ trực tiếp vào prompt (thường bọc trong thẻ như <code>&lt;example&gt;</code>). Ví dụ cụ thể truyền đạt định dạng và phong cách hiệu quả hơn mô tả bằng lời, giúp Claude <b>bám sát định dạng một cách nhất quán</b> trên mỗi request.","elim":["<b>B.</b> Zero-shot bỏ phí các ví dụ đã có; chỉ dựa vào khả năng chung thì định dạng kém nhất quán hơn so với khi có ví dụ minh họa.","<b>C.</b> Lưu ví dụ vào database làm «tài liệu tham khảo cho nhóm» không đưa chúng vào prompt, nên không ảnh hưởng gì đến đầu ra của Claude.","<b>D.</b> Huấn luyện mô hình tùy chỉnh từ một tập ví dụ nhỏ là quá tốn kém và không cần thiết khi few-shot prompting đã đủ để đạt định dạng mong muốn."]},"cite":"Hướng dẫn ôn tập — §6.1 Few-shot Prompting; Lĩnh vực 4.2"},{"id":"ccdvf-q045","n":45,"topic":1,"type":"mcq","stem":{"en":"Your Claude application is producing inconsistent outputs for similar inputs, even when using the same model and prompt. You want to debug the issue systematically. Your debugging approach would...","vi":"Ứng dụng Claude của bạn đang tạo ra kết quả đầu ra không nhất quán cho các đầu vào tương tự, ngay cả khi sử dụng cùng một mô hình và lời nhắc. Bạn muốn gỡ lỗi vấn đề một cách có hệ thống. Phương pháp gỡ lỗi của bạn sẽ...","jp":"Claude アプリケーションは、同じモデルとプロンプトを使用している場合でも、同様の入力に対して一貫性のない出力を生成します。問題を体系的にデバッグしたいと考えています。デバッグアプローチでは..."},"options":[{"k":"A","t":{"en":"Lower the model's temperature and re-run the inconsistent inputs to determine whether the parameter change reduces output variability across runs.","vi":"Giảm nhiệt độ của mô hình và chạy lại các đầu vào không nhất quán để xác định xem việc thay đổi tham số có làm giảm sự biến đổi đầu ra trong các lần chạy hay không.","jp":"モデルの温度を下げ、一貫性のない入力を再実行して、パラメーターの変更により実行間の出力の変動が減少するかどうかを判断します。"}},{"k":"B","t":{"en":"Retry every request that produces an unexpected output and log the results to identify whether repeated calls converge on a consistent response pattern.","vi":"Hãy thử lại mọi yêu cầu tạo ra kết quả không mong muốn và ghi lại kết quả để xác định xem các cuộc gọi lặp lại có hội tụ theo mẫu phản hồi nhất quán hay không.","jp":"予期しない出力を生成するすべてのリクエストを再試行し、結果をログに記録して、繰り返された呼び出しが一貫した応答パターンに収束するかどうかを特定します。"}},{"k":"C","t":{"en":"Assume inconsistent outputs reflect normal LLM non-determinism and document the variability as an accepted characteristic of the application's behavior.","vi":"Giả sử các kết quả đầu ra không nhất quán phản ánh tính không xác định LLM thông thường và ghi lại tính biến đổi như một đặc điểm được chấp nhận trong hành vi của ứng dụng.","jp":"一貫性のない出力は通常の LLM の非決定性を反映していると想定し、その変動性をアプリケーションの動作の許容される特性として文書化します。"}},{"k":"D","t":{"en":"Capture full traces of input, system prompt, user messages, model output, and parameters, then analyze the differences between consistent and inconsistent runs.","vi":"Ghi lại đầy đủ dấu vết của đầu vào, lời nhắc hệ thống, thông báo người dùng, đầu ra mô hình và tham số, sau đó phân tích sự khác biệt giữa các lần chạy nhất quán và không nhất quán.","jp":"入力、システム プロンプト、ユーザー メッセージ、モデル出力、パラメーターの完全なトレースをキャプチャし、一貫性のある実行と一貫性のない実行の違いを分析します。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Debug có hệ thống bắt đầu bằng <b>dữ liệu đầy đủ</b>: thu thập <b>trace hoàn chỉnh</b> gồm input, system prompt, các user message, output và tham số (model, temperature, max_tokens...) của từng lần chạy. Sau đó <b>so sánh lần chạy nhất quán với lần không nhất quán</b> để tìm khác biệt thực sự, ví dụ một phần context thay đổi, prompt được ghép khác nhau hay tham số khác, thay vì đoán mò một nguyên nhân.","elim":["<b>A.</b> Hạ temperature là đoán trước giải pháp khi chưa chẩn đoán; nếu nguyên nhân là input/prompt khác nhau giữa các lần chạy thì hạ temperature không giải quyết được.","<b>B.</b> Retry và quan sát xem có hội tụ không chỉ đo triệu chứng, không cho biết vì sao đầu ra khác nhau, lại tăng chi phí.","<b>C.</b> Gán ngay cho tính bất định của LLM là bỏ qua điều tra; nhiều trường hợp «không nhất quán» thực ra do lỗi ghép prompt hoặc context khác nhau."]}},{"id":"ccdvf-q046","n":46,"topic":1,"type":"mcq","stem":{"en":"Your team uses Claude Code across multiple repositories. You want the team's rules and general coding standards to apply to all repositories, and other rules to apply only to specific repositories. The team is currently duplicating instructions across every repository's CLAUDE.md file. How would you address this?","vi":"Nhóm của bạn sử dụng Mã Claude trên nhiều kho lưu trữ. Bạn muốn các quy tắc của nhóm và tiêu chuẩn mã hóa chung áp dụng cho tất cả các kho lưu trữ và các quy tắc khác chỉ áp dụng cho các kho lưu trữ cụ thể. Nhóm hiện đang sao chép hướng dẫn trên mọi tệp CLAUDE.md của kho lưu trữ. Bạn sẽ giải quyết vấn đề này như thế nào?","jp":"あなたのチームは複数のリポジトリにわたって Claude Code を使用しています。チームのルールと一般的なコーディング標準をすべてのリポジトリに適用し、その他のルールを特定のリポジトリにのみ適用したいとします。チームは現在、すべてのリポジトリの CLAUDE.md ファイルにわたって手順を複製しています。これについてはどう対処しますか?"},"options":[{"k":"A","t":{"en":"Move all instructions to a separate documentation site that developers consult during Claude Code sessions across all repositories.","vi":"Di chuyển tất cả các hướng dẫn đến một trang tài liệu riêng biệt mà các nhà phát triển tham khảo trong các phiên Mã Claude trên tất cả các kho lưu trữ.","jp":"すべての手順を別のドキュメント サイトに移動し、開発者がすべてのリポジトリの Claude Code セッション中に参照するようにします。"}},{"k":"B","t":{"en":"Use a CLAUDE.md hierarchy that scopes general standards broadly and project-specific context within each repository's local CLAUDE.md.","vi":"Sử dụng hệ thống phân cấp CLAUDE.md để mở rộng phạm vi các tiêu chuẩn chung và bối cảnh cụ thể của dự án trong CLAUDE.md cục bộ của mỗi kho lưu trữ.","jp":"一般的な標準を幅広く対象とする CLAUDE.md 階層と、各リポジトリのローカル CLAUDE.md 内のプロジェクト固有のコンテキストを使用します。"}},{"k":"C","t":{"en":"Stop using CLAUDE.md altogether and ask each developer to configure Claude Code manually for each project they work on.","vi":"Hãy ngừng sử dụng CLAUDE.md hoàn toàn và yêu cầu mỗi nhà phát triển định cấu hình Mã Claude theo cách thủ công cho từng dự án mà họ thực hiện.","jp":"CLAUDE.md の使用を完全に中止し、各開発者に作業中のプロジェクトごとにクロード コードを手動で構成するよう依頼してください。"}},{"k":"D","t":{"en":"Use a single repository's CLAUDE.md as the central source of truth and link to it from every other repository's CLAUDE.md file.","vi":"Sử dụng CLAUDE.md của một kho lưu trữ duy nhất làm nguồn thông tin trung tâm và liên kết tới nó từ tệp CLAUDE.md của mọi kho lưu trữ khác.","jp":"単一リポジトリの CLAUDE.md を信頼できる中央の情報源として使用し、他のすべてのリポジトリの CLAUDE.md ファイルからそれにリンクします。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Claude Code nạp <b>CLAUDE.md theo phân cấp</b> và gộp chúng lại: chuẩn chung có thể đặt ở <b>mức rộng</b> (ví dụ <code>~/.claude/CLAUDE.md</code> mức người dùng, hoặc file chung được <code>@import</code>), còn <b>context riêng của dự án</b> nằm trong <code>CLAUDE.md</code> của từng repo (và CLAUDE.md thư mục con khi cần). Như vậy mỗi quy tắc chỉ được viết một lần ở đúng phạm vi, hết cảnh nhân bản chỉ dẫn qua mọi repo.","elim":["<b>A.</b> Trang tài liệu bên ngoài không được Claude Code tự nạp vào context; chỉ dẫn phải nằm trong CLAUDE.md mới có hiệu lực tự động.","<b>C.</b> Bỏ CLAUDE.md và cấu hình thủ công làm mất tính nhất quán, khó chia sẻ và lặp lại công sức của từng lập trình viên, ngược hẳn mục tiêu.","<b>D.</b> Một CLAUDE.md trong repo khác không phải là phạm vi được Claude Code tự nạp; «link» sang repo khác vẫn buộc mỗi repo phải truy cập được file đó và không tạo phân tầng chung/riêng rõ ràng."]},"cite":"Hướng dẫn ôn tập — §5.1 Phân cấp CLAUDE.md; Lĩnh vực 3.1"},{"id":"ccdvf-q047","n":47,"topic":1,"type":"mcq","stem":{"en":"A new agent your team built handles customer support tickets, but it routinely gets confused when a single ticket spans billing, shipping, and product issues. The agent often loses track of which sub-issue it has already addressed and revisits the same one. The team is considering architectural changes. What architectural change would you recommend?","vi":"Một đại lý mới mà nhóm của bạn xây dựng xử lý các yêu cầu hỗ trợ khách hàng, nhưng nó thường bị nhầm lẫn khi một yêu cầu duy nhất liên quan đến các vấn đề về thanh toán, vận chuyển và sản phẩm. Nhân viên thường không theo dõi được vấn đề phụ nào đã được giải quyết và xem xét lại vấn đề tương tự. Nhóm đang xem xét thay đổi kiến ​​trúc. Bạn muốn đề xuất thay đổi kiến ​​trúc nào?","jp":"チームが構築した新しいエージェントはカスタマー サポート チケットを処理しますが、単一のチケットが請求、配送、製品の問題にまたがる場合、日常的に混乱が生じます。エージェントは、どのサブ問題にすでに対応したかを見失い、同じ問題を再度検討することがよくあります。チームはアーキテクチャの変更を検討しています。どのようなアーキテクチャ上の変更をお勧めしますか?"},"options":[{"k":"A","t":{"en":"Switch to a deterministic workflow that handles billing, shipping, and product issues in a fixed sequence.","vi":"Chuyển sang quy trình làm việc xác định để xử lý các vấn đề về thanh toán, vận chuyển và sản phẩm theo một trình tự cố định.","jp":"請求、配送、製品の問題を一定の順序で処理する決定的なワークフローに切り替えます。"}},{"k":"B","t":{"en":"Add detailed prompting that instructs the agent to track which sub-issues have been resolved and which remain.","vi":"Thêm lời nhắc chi tiết để hướng dẫn tổng đài viên theo dõi vấn đề phụ nào đã được giải quyết và vấn đề nào còn tồn tại.","jp":"どのサブ問題が解決され、どれが残っているかを追跡するようエージェントに指示する詳細なプロンプトを追加します。"}},{"k":"C","t":{"en":"Introduce an orchestrator agent that delegates billing, shipping, and product sub-issues to dedicated subagents.","vi":"Giới thiệu một đại lý điều phối ủy quyền các vấn đề phụ về thanh toán, vận chuyển và sản phẩm cho các đại lý phụ chuyên dụng.","jp":"請求、配送、製品のサブ発行を専用のサブエージェントに委任するオーケストレーター エージェントを導入します。"}},{"k":"D","t":{"en":"Increase the size of the agent's context window so it can hold the full ticket history at once .","vi":"Tăng kích thước cửa sổ ngữ cảnh của tác nhân để nó có thể chứa toàn bộ lịch sử yêu cầu cùng một lúc.","jp":"エージェントのコンテキスト ウィンドウのサイズを大きくして、完全なチケット履歴を一度に保持できるようにします。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Ticket gồm ba vấn đề độc lập (billing, shipping, product) mà một agent đơn lẻ bị rối, quên và lặp lại. Mô hình <b>orchestrator–subagent</b> tách mỗi vấn đề con cho một <b>subagent chuyên trách với context riêng</b>, còn orchestrator <b>theo dõi trạng thái từng vấn đề con</b> và tổng hợp kết quả. Đây là thay đổi kiến trúc xử lý đúng gốc rễ: phân rã tác vụ và cô lập context.","elim":["<b>A.</b> Thứ tự cố định không phù hợp vì các ticket chứa tổ hợp vấn đề khác nhau và cần linh hoạt; workflow cứng không thích nghi được với ticket chỉ có một phần hoặc có phụ thuộc giữa các vấn đề.","<b>B.</b> Thêm prompt nhắc agent tự theo dõi chỉ là vá tạm bằng chỉ dẫn xác suất; agent vẫn ôm cả ba miền trong một context và vẫn dễ lẫn lộn.","<b>D.</b> Vấn đề không phải thiếu chỗ chứa mà là thông tin bị lẫn trong context lớn; mở rộng context window không giúp agent theo dõi việc nào đã xong."]},"cite":"Hướng dẫn ôn tập — §3.3 Hub-and-Spoke: Coordinator và Subagent; Lĩnh vực 1.6"},{"id":"ccdvf-q048","n":48,"topic":1,"type":"mcq","stem":{"en":"The team is debating whether to integrate with the Claude API directly or through a thirdparty abstraction layer that supports multiple LLM providers. The team has identified that all current and projected use cases run on Claude, no internal customer has requested LLM portability, and the team's product roadmap does not mention multi-provider support over the next two years. The third-party abstraction would add roughly 15 percent overhead in code complexity and introduce one additional dependency. Which integration approach would you recommend?","vi":"Nhóm đang tranh luận về việc nên tích hợp trực tiếp với API Claude hay thông qua lớp trừu tượng của bên thứ ba hỗ trợ nhiều nhà cung cấp LLM. Nhóm đã xác định rằng tất cả các trường hợp sử dụng hiện tại và dự kiến ​​đều chạy trên Claude, không có khách hàng nội bộ nào yêu cầu khả năng di chuyển LLM và lộ trình sản phẩm của nhóm không đề cập đến việc hỗ trợ nhiều nhà cung cấp trong hai năm tới. Sự trừu tượng hóa của bên thứ ba sẽ tăng thêm khoảng 15% chi phí về độ phức tạp của mã và đưa ra một phần phụ thuộc bổ sung. Bạn muốn giới thiệu phương pháp tích hợp nào?","jp":"チームは、Claude API と直接統合するか、複数の LLM プロバイダーをサポートするサードパーティの抽象化レイヤーを介して統合するかについて議論しています。チームは、現在および計画されているすべてのユースケースが Claude 上で実行され、社内顧客から LLM の移植性を要求されておらず、チームの製品ロードマップには今後 2 年間のマルチプロバイダーのサポートについて言及されていないことを確認しました。サードパーティの抽象化により、コードの複雑さのオーバーヘッドが約 15% 増加し、依存関係が 1 つ追加されます。どの統合アプローチをお勧めしますか?"},"options":[{"k":"A","t":{"en":"The third-party abstraction layer, on the grounds that multi-provider support is valuable for any application as a matter of long-term flexibility across vendors.","vi":"Lớp trừu tượng của bên thứ ba, trên cơ sở hỗ trợ nhiều nhà cung cấp có giá trị đối với bất kỳ ứng dụng nào vì tính linh hoạt lâu dài giữa các nhà cung cấp.","jp":"マルチプロバイダーのサポートは、ベンダー間の長期的な柔軟性の問題として、あらゆるアプリケーションにとって価値があるという理由から、サードパーティの抽象化レイヤーを使用します。"}},{"k":"B","t":{"en":"Both integration paths in parallel, where the application uses each path on different runs to compare which performs better in production over time.","vi":"Cả hai đường dẫn tích hợp song song, trong đó ứng dụng sử dụng từng đường dẫn trên các lần chạy khác nhau để so sánh đường dẫn nào hoạt động tốt hơn trong quá trình sản xuất theo thời gian.","jp":"両方の統合パスを並行して実行します。アプリケーションは異なる実行で各パスを使用して、本番環境で時間の経過とともにどちらのパフォーマンスが優れているかを比較します。"}},{"k":"C","t":{"en":"A custom multi-provider abstraction layer the team builds in-house so that the team controls every part of the abstraction the application uses for its API calls.","vi":"Một lớp trừu tượng tùy chỉnh của nhiều nhà cung cấp mà nhóm xây dựng nội bộ để nhóm kiểm soát mọi phần trừu tượng mà ứng dụng sử dụng cho các lệnh gọi API của nó.","jp":"チームが社内で構築するカスタム マルチプロバイダー抽象化レイヤー。これにより、アプリケーションが API 呼び出しに使用する抽象化のあらゆる部分をチームが制御できるようになります。"}},{"k":"D","t":{"en":"Direct integration with Claude through its SDK, because no multi-provider need exists and abstraction would add complexity that does not pay off.","vi":"Tích hợp trực tiếp với Claude thông qua SDK của nó, vì không có nhu cầu đa nhà cung cấp và việc trừu tượng hóa sẽ làm tăng thêm độ phức tạp mà không mang lại hiệu quả.","jp":"SDK を介した Claude との直接統合。マルチプロバイダーの必要性が存在せず、抽象化により複雑さが増すため、効果がありません。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Quyết định kiến trúc nên dựa trên <b>nhu cầu thực tế</b> chứ không phải linh hoạt giả định (YAGNI). Đề cho thấy mọi use case đều chạy trên Claude, không ai yêu cầu tính khả chuyển, lộ trình 2 năm không có multi-provider, trong khi lớp trừu tượng thêm <b>~15% độ phức tạp và một dependency</b>. Vì vậy <b>tích hợp trực tiếp qua SDK của Claude</b> là lựa chọn đúng: đơn giản hơn và dùng được đầy đủ tính năng riêng của Claude.","elim":["<b>A.</b> Biện minh bằng «linh hoạt lâu dài» chung chung trái với dữ liệu đã cho; trả chi phí phức tạp cho một nhu cầu không tồn tại.","<b>B.</b> Chạy song song hai đường tích hợp nhân đôi bảo trì và độ phức tạp mà không trả lời được câu hỏi nào có ích, vì bên dưới vẫn là cùng một model.","<b>C.</b> Tự xây lớp trừu tượng multi-provider còn tốn công hơn dùng thư viện bên thứ ba, cho cùng một nhu cầu không có thật."]}},{"id":"ccdvf-q049","n":49,"topic":1,"type":"mcq","stem":{"en":"Your Claude application has been running for several conversation turns, and you notice the model occasionally references information that was discussed many turns ago but is no longer relevant. You suspect context drift is causing the model to weight stale content too heavily. How would you address the drift?","vi":"Ứng dụng Claude của bạn đã chạy trong nhiều lượt trò chuyện và bạn nhận thấy mô hình thỉnh thoảng tham chiếu thông tin đã được thảo luận nhiều lần trước nhưng không còn phù hợp nữa. Bạn nghi ngờ sự lệch ngữ cảnh đang khiến mô hình coi trọng nội dung cũ quá nhiều. Bạn sẽ giải quyết sự trôi dạt như thế nào?","jp":"クロード アプリケーションは数回の会話ターンにわたって実行されており、モデルが、何ターンも前に議論されたものの、もはや関連性のなくなった情報を時折参照していることに気づきました。コンテキスト ドリフトにより、モデルが古いコンテンツを重み付けしすぎているのではないかと考えられます。このドリフトにどう対処しますか?"},"options":[{"k":"A","t":{"en":"Increase the context window size so all turns of the conversation remain visible to the model in full detail.","vi":"Tăng kích thước cửa sổ ngữ cảnh để mô hình vẫn hiển thị đầy đủ chi tiết tất cả các lượt của cuộc hội thoại.","jp":"コンテキスト ウィンドウのサイズを大きくして、会話のすべてのターンを詳細にモデルに表示できるようにします。"}},{"k":"B","t":{"en":"Reset the conversation after every turn so the model loses all prior turns when generating a response.","vi":"Đặt lại cuộc trò chuyện sau mỗi lượt để mô hình mất tất cả các lượt trước đó khi tạo phản hồi.","jp":"モデルが応答を生成するときにそれまでのターンがすべて失われるように、ターンごとに会話をリセットします。"}},{"k":"C","t":{"en":"Apply compaction to summarize older portions of the conversation so the gist remains while the specifics carry less weight.","vi":"Áp dụng sự rút gọn để tóm tắt các phần cũ hơn của cuộc trò chuyện để giữ lại ý chính trong khi các chi tiết cụ thể ít có ý nghĩa hơn.","jp":"圧縮を適用して会話の古い部分を要約すると、要点は残り、詳細の重みが軽減されます。"}},{"k":"D","t":{"en":"Truncate the conversation so the model sees only the most recent turn during each subsequent response.","vi":"Cắt bớt cuộc trò chuyện để mô hình chỉ nhìn thấy lượt gần đây nhất trong mỗi phản hồi tiếp theo.","jp":"会話を切り詰めて、後続の各応答中にモデルが最新のターンのみを認識できるようにします。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Khi mô hình bám vào thông tin cũ không còn liên quan, giải pháp cân bằng là <b>compaction</b>: <b>tóm tắt các phần cũ của hội thoại</b> để giữ lại ý chính (quyết định, sự kiện quan trọng) nhưng bỏ chi tiết, nhờ đó chi tiết cũ <b>bớt trọng lượng</b> so với nội dung gần đây. Đây cũng là ý tưởng của lệnh <code>/compact</code> trong Claude Code.","elim":["<b>A.</b> Mở rộng context window giữ nguyên toàn bộ nội dung cũ, nên không giảm, thậm chí còn duy trì, ảnh hưởng của thông tin lỗi thời.","<b>B.</b> Reset sau mỗi lượt làm mất toàn bộ context, kể cả thông tin cần thiết, phá vỡ hội thoại nhiều lượt.","<b>D.</b> Chỉ giữ lượt gần nhất cũng làm mất các thông tin quan trọng từ trước (yêu cầu, ràng buộc, quyết định đã thống nhất)."]},"cite":"Hướng dẫn ôn tập — §5.7 Lệnh /compact; Lĩnh vực 5.1"},{"id":"ccdvf-q050","n":50,"topic":1,"type":"mcq","stem":{"en":"Your Claude application uses tool calling to fetch patient data and generate summary reports. The flow occasionally fails because the model returns a tool_use block that references arguments not present in the schema, and your application code does not handle this case gracefully. How would you address this?","vi":"Ứng dụng Claude của bạn sử dụng công cụ gọi để tìm nạp dữ liệu bệnh nhân và tạo báo cáo tóm tắt. Luồng đôi khi không thành công vì mô hình trả về khối tool_use tham chiếu các đối số không có trong lược đồ và mã ứng dụng của bạn không xử lý trường hợp này một cách khéo léo. Bạn sẽ giải quyết vấn đề này như thế nào?","jp":"Claude アプリケーションは、ツール呼び出しを使用して患者データを取得し、概要レポートを生成します。モデルがスキーマに存在しない引数を参照する tools_use ブロックを返し、アプリケーション コードがこのケースを適切に処理しないため、フローが失敗することがあります。これについてはどう対処しますか?"},"options":[{"k":"A","t":{"en":"Validate the tool_use block's arguments against the tool schema before dispatching the tool and handle invalid arguments as a recognized error path.","vi":"Xác thực các đối số của khối tool_use dựa trên lược đồ công cụ trước khi gửi công cụ và xử lý các đối số không hợp lệ dưới dạng đường dẫn lỗi được nhận dạng.","jp":"ツールをディスパッチする前に、tool_use ブロックの引数をツール スキーマに対して検証し、無効な引数を認識されたエラー パスとして処理します。"}},{"k":"B","t":{"en":"Log invalid tool_use blocks when they occur and allow the tool dispatch to proceed, relying on the tool's own error handling to surface failures back to the application.","vi":"Ghi lại các khối tool_use không hợp lệ khi chúng xảy ra và cho phép tiến hành gửi công cụ, dựa vào cách xử lý lỗi của chính công cụ để xử lý các lỗi hiển thị trong ứng dụng.","jp":"無効なtool_useブロックが発生した場合はログに記録し、ツールのディスパッチを続行できるようにします。ツール独自のエラー処理に依存して障害をアプリケーションに表示します。"}},{"k":"C","t":{"en":"Retry the same request repeatedly until the model returns a valid tool_use block that matches the schema as expected.","vi":"Hãy thử lại cùng một yêu cầu nhiều lần cho đến khi mô hình trả về khối tool_use hợp lệ khớp với lược đồ như mong đợi.","jp":"モデルが期待どおりにスキーマと一致する有効なtool_useブロックを返すまで、同じリクエストを繰り返し再試行します。"}},{"k":"D","t":{"en":"Stop using tool calling entirely and replace tools with prompted text generation that asks the model to describe what it would do.","vi":"Hãy ngừng sử dụng hoàn toàn lệnh gọi công cụ và thay thế các công cụ bằng việc tạo văn bản được nhắc nhở yêu cầu mô hình mô tả những gì nó sẽ làm.","jp":"ツール呼び出しの使用を完全に中止し、モデルが何を行うかを説明するよう求めるプロンプト付きテキスト生成にツールを置き換えます。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Ứng dụng là bên thực thi tool, nên phải <b>validate tham số của khối <code>tool_use</code> theo input schema trước khi dispatch</b>. Tham số không hợp lệ được xử lý như một <b>nhánh lỗi đã biết</b>: không gọi tool thật mà trả về <code>tool_result</code> với <code>is_error: true</code> mô tả rõ lỗi để Claude tự sửa và gọi lại. Với dữ liệu bệnh nhân, chặn tham số sai trước khi chạm vào hệ thống thật càng quan trọng.","elim":["<b>B.</b> Chỉ ghi log rồi vẫn dispatch nghĩa là gửi tham số không hợp lệ vào hệ thống dữ liệu bệnh nhân và phụ thuộc vào xử lý lỗi không rõ ràng của tool; đó chính là tình trạng «không xử lý gracefully» trong đề.","<b>C.</b> Retry nguyên request mà không báo cho model biết sai ở đâu khó hội tụ, tốn chi phí và có thể lặp vô hạn.","<b>D.</b> Bỏ tool calling để model «mô tả» hành động làm mất khả năng truy xuất dữ liệu có cấu trúc, phản ứng thái quá với một lỗi xử lý được."]},"cite":"Hướng dẫn ôn tập — §6.5 Validation và Retry-with-Feedback; Lĩnh vực 2.2"},{"id":"ccdvf-q051","n":51,"topic":1,"type":"mcq","stem":{"en":"You are deciding between deploying a Claude-powered agent on Anthropic's hosted infrastructure or self- hosting under a \"bring your own cloud\" model in your own AWS account. The agent processes customer data subject to your enterprise's data residency policies, but the team wants to ship quickly and avoid managing infrastructure. Which deployment model would you recommend?","vi":"Bạn đang quyết định giữa việc triển khai một tác nhân do Claude hỗ trợ trên cơ sở hạ tầng được lưu trữ của Anthropic hoặc tự lưu trữ theo mô hình \"mang đám mây của riêng bạn\" vào tài khoản AWS của riêng bạn. Đại lý xử lý dữ liệu khách hàng theo chính sách nơi lưu trữ dữ liệu của doanh nghiệp bạn, nhưng nhóm muốn gửi nhanh chóng và tránh quản lý cơ sở hạ tầng. Bạn muốn giới thiệu mô hình triển khai nào?","jp":"あなたは、Claude を利用したエージェントを Anthropic のホスト型インフラストラクチャにデプロイするか、自分の AWS アカウントの「Bring Your Own Cloud」モデルに基づいてセルフホスティングするかを決定しています。エージェントは企業のデータ常駐ポリシーに従って顧客データを処理しますが、チームは迅速に出荷し、インフラストラクチャの管理を回避したいと考えています。どの導入モデルをお勧めしますか?"},"options":[{"k":"A","t":{"en":"Self-hosting under BYOC for an initial pilot, then evaluating whether to migrate to Anthropic-hosted infrastructure once the agent's data-handling patterns are better understood.","vi":"Tự lưu trữ theo BYOC cho giai đoạn thử nghiệm ban đầu, sau đó đánh giá xem có nên di chuyển sang cơ sở hạ tầng do Anthropic lưu trữ hay không sau khi hiểu rõ hơn về các mẫu xử lý dữ liệu của tác nhân.","jp":"初期パイロットでは BYOC で自己ホスティングし、エージェントのデータ処理パターンがよく理解できたら、Anthropic がホストするインフラストラクチャに移行するかどうかを評価します。"}},{"k":"B","t":{"en":"Deploying on Anthropic-hosted infrastructure while the team drafts a request to update the enterprise data residency policy to accommodate hosted AI deployments.","vi":"Triển khai trên cơ sở hạ tầng được lưu trữ trên máy chủ của Anthropic trong khi nhóm soạn thảo yêu cầu cập nhật chính sách nơi lưu trữ dữ liệu doanh nghiệp để phù hợp với việc triển khai AI được lưu trữ trên máy chủ.","jp":"Anthropic がホストするインフラストラクチャにデプロイする一方で、チームはホスト型 AI のデプロイメントに対応するためにエンタープライズ データ常駐ポリシーを更新するリクエストの草案を作成します。"}},{"k":"C","t":{"en":"Self-hosting under BYOC to satisfy the data residency requirement, while working with the infrastructure team to reduce the operational overhead of managing the deployment.","vi":"Tự lưu trữ theo BYOC để đáp ứng yêu cầu về nơi lưu trữ dữ liệu, đồng thời làm việc với nhóm cơ sở hạ tầng để giảm chi phí vận hành trong việc quản lý việc triển khai.","jp":"BYOC に基づくセルフホスティングによりデータ常駐要件を満たしながら、インフラストラクチャ チームと協力して展開管理の運用オーバーヘッドを削減します。"}},{"k":"D","t":{"en":"Deploying on Anthropic-hosted infrastructure to meet the team's shipping timeline, and flagging the data residency requirement for a follow-up compliance review after launch.","vi":"Triển khai trên cơ sở hạ tầng do Anthropic lưu trữ để đáp ứng tiến trình vận chuyển của nhóm và gắn cờ yêu cầu về nơi lưu trữ dữ liệu để đánh giá tuân thủ tiếp theo sau khi ra mắt.","jp":"チームの出荷スケジュールに合わせて Anthropic がホストするインフラストラクチャにデプロイし、リリース後のフォローアップのコンプライアンス レビューのためにデータ常駐要件にフラグを立てます。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> <b>Chính sách data residency của doanh nghiệp là ràng buộc cứng</b>, không thể đánh đổi để lấy tốc độ phát hành. Vì agent xử lý dữ liệu khách hàng chịu chính sách này, cần <b>self-host theo mô hình BYOC</b> trong tài khoản AWS của mình để đáp ứng yêu cầu. Mong muốn ship nhanh và ít vận hành được xử lý ở tầng sau bằng cách <b>phối hợp với nhóm hạ tầng để giảm overhead vận hành</b>, chứ không phải bằng cách vi phạm chính sách.","elim":["<b>A.</b> Nếu pilot BYOC rồi định chuyển sang hosted thì vẫn sẽ vi phạm data residency sau này; việc «hiểu rõ hơn» hành vi dữ liệu không thay đổi được chính sách.","<b>B.</b> Triển khai hosted trong khi chính sách chưa được sửa là vi phạm ngay từ đầu; xin đổi chính sách không hợp thức hóa việc đã làm.","<b>D.</b> Ship trước rồi để review compliance sau là cố ý vi phạm chính sách với dữ liệu khách hàng thật, rủi ro pháp lý cao."]}},{"id":"ccdvf-q052","n":52,"topic":1,"type":"mcq","stem":{"en":"A teammate has asked why your Claude application sometimes produces a response that includes the prompt text repeated back, and other times produces a response with the prompt text rephrased. They suspect a bug in the application's request construction. How would you respond?","vi":"Một đồng đội đã hỏi tại sao ứng dụng Claude của bạn đôi khi tạo ra phản hồi bao gồm văn bản nhắc lại được lặp lại và những lần khác lại tạo ra phản hồi với văn bản nhắc nhở được diễn đạt lại. Họ nghi ngờ có lỗi trong quá trình xây dựng yêu cầu của ứng dụng. Bạn sẽ trả lời thế nào?","jp":"チームメイトが、Claude アプリケーションがプロンプト テキストを繰り返し返す応答を生成することもあれば、プロンプト テキストを言い換えた応答を生成することがあるのはなぜかと尋ねました。彼らは、アプリケーションのリクエスト構造にバグがあるのではないかと疑っています。あなたならどう答えますか？"},"options":[{"k":"A","t":{"en":"Tell the teammate that the variation depends on which Claude model serves the request, and recommend pinning the application to a single model version to make the output behavior consistent.","vi":"Nói với đồng đội rằng sự thay đổi phụ thuộc vào mô hình Claude phục vụ yêu cầu và khuyên bạn nên ghim ứng dụng vào một phiên bản mô hình duy nhất để làm cho hành vi đầu ra nhất quán.","jp":"バリエーションはリクエストを処理するクロード モデルによって異なることをチームメイトに伝え、出力動作の一貫性を保つためにアプリケーションを単一のモデル バージョンに固定することを推奨します。"}},{"k":"B","t":{"en":"Explain that LLMs generate output token by token, and variation in how prompt content appears in output is a property of generation, not a bug in request construction.","vi":"Giải thích rằng LLM tạo mã thông báo đầu ra theo mã thông báo và sự thay đổi về cách xuất hiện nội dung lời nhắc trong đầu ra là thuộc tính của quá trình tạo chứ không phải lỗi trong quá trình xây dựng yêu cầu.","jp":"LLM は出力トークンをトークンごとに生成し、プロンプト コンテンツが出力にどのように表示されるかは生成の特性であり、リクエスト構築のバグではないことを説明します。"}},{"k":"C","t":{"en":"Confirm that the variation is a bug in the application's request construction and start investigating which part of the application is producing the inconsistent prompt text.","vi":"Xác nhận rằng biến thể đó là lỗi trong quá trình xây dựng yêu cầu của ứng dụng và bắt đầu điều tra phần nào của ứng dụng đang tạo ra văn bản nhắc nhở không nhất quán.","jp":"この変化がアプリケーションのリクエスト構造のバグであることを確認し、アプリケーションのどの部分が一貫性のないプロンプト テキストを生成しているのか調査を開始します。"}},{"k":"D","t":{"en":"Tell the teammate that the variation is caused by the application sending two different prompts on different runs and propose a code change that pins the system prompt to a single version.","vi":"Nói với đồng đội rằng sự thay đổi là do ứng dụng gửi hai lời nhắc khác nhau trong các lần chạy khác nhau và đề xuất thay đổi mã để ghim lời nhắc hệ thống vào một phiên bản duy nhất.","jp":"チームメイトに、アプリケーションが異なる実行で 2 つの異なるプロンプトを送信することが変動の原因であることを伝え、システム プロンプトを 1 つのバージョンに固定するコード変更を提案します。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> LLM <b>sinh đầu ra từng token theo xác suất (sampling)</b>, nên cùng một prompt có thể cho kết quả khác nhau: lúc lặp lại nguyên văn đoạn prompt, lúc diễn đạt lại. Đây là <b>đặc tính của quá trình sinh</b>, không phải dấu hiệu request được xây dựng sai. Nếu cần hành vi cụ thể (ví dụ không lặp lại prompt), nên điều chỉnh chỉ dẫn hoặc hậu xử lý, thay vì đi tìm bug trong code tạo request.","elim":["<b>A.</b> Biến thiên này xảy ra ngay cả khi dùng một model cố định; quy cho việc «model nào phục vụ request» là không có căn cứ.","<b>C.</b> Khẳng định ngay là bug và đi tìm trong code tạo request là dựa trên giả định sai về cách LLM sinh đầu ra.","<b>D.</b> Không có bằng chứng ứng dụng gửi hai prompt khác nhau; đề xuất sửa code dựa trên nguyên nhân bịa ra."]}},{"id":"ccdvf-q053","n":53,"topic":1,"type":"mcq","stem":{"en":"You are building a Claude application that needs to deliver model output to end users as it is generated, instead of waiting for the full response to complete. The Claude API mechanism you would use is...","vi":"Bạn đang xây dựng một ứng dụng Claude cần cung cấp đầu ra mô hình cho người dùng cuối khi ứng dụng được tạo, thay vì chờ phản hồi đầy đủ hoàn tất. Cơ chế API Claude bạn sẽ sử dụng là...","jp":"あなたは、完全な応答が完了するのを待つのではなく、生成されたモデル出力をエンド ユーザーに配信する必要があるクロード アプリケーションを構築しています。使用する Claude API メカニズムは次のとおりです。"},"options":[{"k":"A","t":{"en":"Structured JSON output, which delivers responses only after the model has finalized the JSON shape across the entire response.","vi":"Đầu ra JSON có cấu trúc, chỉ cung cấp phản hồi sau khi mô hình hoàn thiện hình dạng JSON trên toàn bộ phản hồi.","jp":"構造化された JSON 出力。モデルが応答全体にわたって JSON 形状を完成させた後にのみ応答を配信します。"}},{"k":"B","t":{"en":"Streaming responses, which deliver tokens incrementally as the model generates them so users see output progressively.","vi":"Phản hồi trực tuyến, phân phối mã thông báo tăng dần khi mô hình tạo ra chúng để người dùng nhìn thấy kết quả dần dần.","jp":"ストリーミング応答。モデルが生成するトークンを段階的に配信するため、ユーザーは出力を段階的に確認できます。"}},{"k":"C","t":{"en":"The Batch API, which delivers full responses after a delay suitable for non-interactive workloads.","vi":"API hàng loạt, cung cấp phản hồi đầy đủ sau một khoảng thời gian trễ phù hợp với khối lượng công việc không tương tác.","jp":"バッチ API。非対話型ワークロードに適した遅延後に完全な応答を配信します。"}},{"k":"D","t":{"en":"Prompt caching, which speeds up the cost profile of future requests and does not affect the delivery timing of the first response.","vi":"Bộ nhớ đệm nhanh chóng giúp tăng tốc hồ sơ chi phí của các yêu cầu trong tương lai và không ảnh hưởng đến thời gian gửi phản hồi đầu tiên.","jp":"プロンプト キャッシュ。将来のリクエストのコスト プロファイルが高速化され、最初のレスポンスの配信タイミングには影響しません。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Để hiển thị đầu ra cho người dùng ngay khi đang sinh, dùng <b>streaming</b>: đặt <code>stream: true</code> (hoặc helper stream của SDK), API trả về <b>server-sent events</b> với các <code>content_block_delta</code> chứa token <b>từng phần</b>. Người dùng thấy văn bản xuất hiện dần, giảm đáng kể độ trễ cảm nhận so với chờ toàn bộ phản hồi.","elim":["<b>A.</b> Structured JSON output liên quan đến hình dạng dữ liệu, không phải thời điểm giao; chính phương án cũng nói nó trả về sau khi hoàn tất, trái với yêu cầu.","<b>C.</b> Batch API xử lý bất đồng bộ với độ trễ có thể lên tới 24 giờ, dành cho workload không tương tác, hoàn toàn ngược với yêu cầu thời gian thực.","<b>D.</b> Prompt caching giảm chi phí và độ trễ xử lý phần prompt lặp lại, nhưng không giao đầu ra từng phần cho người dùng."]}},{"id":"ccdvf-q054","n":54,"topic":1,"type":"mcq","stem":{"en":"You are designing an agent that processes vendor invoices. The work involves a small number of well- understood steps, but occasionally an invoice arrives in an unexpected format that requires the system to decide between rerouting, requesting clarification, or flagging for human review. The most appropriate architecture for this system is...","vi":"Bạn đang thiết kế một đại lý xử lý hóa đơn của nhà cung cấp. Công việc này bao gồm một số bước nhỏ được hiểu rõ nhưng đôi khi hóa đơn được gửi đến ở định dạng không mong muốn khiến hệ thống phải quyết định giữa việc định tuyến lại, yêu cầu làm rõ hoặc gắn cờ để con người xem xét. Kiến trúc phù hợp nhất cho hệ thống này là...","jp":"あなたは、仕入先請求書を処理するエージェントを設計しています。この作業にはよく理解された少数の手順が含まれますが、請求書が予期しない形式で届く場合があり、システムはルート変更、説明の要求、人間によるレビューのフラグのいずれかを決定する必要があります。このシステムに最も適したアーキテクチャは..."},"options":[{"k":"A","t":{"en":"A fully autonomous agent that handles every invoice from start to finish across all formats.","vi":"Một đại lý hoàn toàn tự chủ xử lý mọi hóa đơn từ đầu đến cuối trên tất cả các định dạng.","jp":"あらゆる形式の請求書を最初から最後まで処理する完全自律型エージェント。"}},{"k":"B","t":{"en":"A manager agent that delegates each step of standard invoice processing to a dedicated subagent, with a separate subagent handling each unexpected format.","vi":"Một tác nhân quản lý ủy quyền từng bước xử lý hóa đơn tiêu chuẩn cho một đại lý phụ chuyên dụng, với một đại lý phụ riêng biệt xử lý từng định dạng không mong muốn.","jp":"標準の請求書処理の各ステップを専用のサブエージェントに委任するマネージャー エージェント。予期しない形式のそれぞれを別のサブエージェントが処理します。"}},{"k":"C","t":{"en":"A single large prompt that processes every incoming invoice, both standard and unexpected, in one model call.","vi":"Một lời nhắc lớn duy nhất xử lý mọi hóa đơn đến, cả tiêu chuẩn và đột xuất, trong một lệnh gọi mô hình.","jp":"標準的な請求書と予期せぬ請求書の両方を 1 つのモデル呼び出しで処理する単一の大きなプロンプト。"}},{"k":"D","t":{"en":"A workflow for the standard path with an agent invoked at the decision point for unexpected formats.","vi":"Quy trình làm việc dành cho đường dẫn tiêu chuẩn với tác nhân được gọi tại điểm quyết định đối với các định dạng không mong muốn.","jp":"予期しない形式の決定点でエージェントが呼び出される、標準パスのワークフロー。"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Nguyên tắc là <b>dùng workflow xác định cho phần dự đoán được</b> và <b>chỉ dùng agent ở nơi thực sự cần phán đoán</b>. Đường xử lý chuẩn chỉ gồm ít bước đã hiểu rõ, nên <b>workflow cố định</b> rẻ, nhanh và dễ kiểm soát. Riêng điểm quyết định với hóa đơn định dạng lạ (định tuyến lại, xin làm rõ, hay chuyển cho người) mới <b>gọi agent</b> để suy luận linh hoạt.","elim":["<b>A.</b> Agent hoàn toàn tự chủ cho cả những bước đơn giản, đã biết rõ là thừa: tốn chi phí, khó dự đoán và khó kiểm toán hơn workflow.","<b>B.</b> Manager kèm subagent cho từng bước chuẩn và từng định dạng lạ là thiết kế quá phức tạp so với một quy trình ít bước; số định dạng lạ cũng không biết trước để tạo subagent riêng.","<b>C.</b> Một prompt khổng lồ xử lý mọi trường hợp trong một lần gọi thiếu cấu trúc, khó kiểm thử và không có điểm rẽ nhánh rõ ràng cho xử lý ngoại lệ hoặc chuyển cho con người."]},"cite":"Hướng dẫn ôn tập — §8.1 Pipeline cố định (Prompt Chaining); Lĩnh vực 1.6"},{"id":"ccdvf-q055","n":55,"topic":1,"type":"mcq","stem":{"en":"Your agent is processing tasks that take 30 to 60 minutes to complete. Each task has welldefined intermediate checkpoints, and the team wants the agent to be able to resume from the most recent checkpoint if a process is interrupted. How would you implement this resumability?","vi":"Nhân viên hỗ trợ của bạn đang xử lý các tác vụ mất từ ​​30 đến 60 phút để hoàn thành. Mỗi nhiệm vụ đều có các điểm kiểm tra trung gian được xác định rõ ràng và nhóm muốn tổng đài viên có thể tiếp tục từ điểm kiểm tra gần đây nhất nếu một quá trình bị gián đoạn. Bạn sẽ triển khai khả năng tiếp tục này như thế nào?","jp":"エージェントは、完了までに 30 ～ 60 分かかるタスクを処理しています。各タスクには明確に定義された中間チェックポイントがあり、チームはプロセスが中断された場合にエージェントが最新のチェックポイントから再開できるようにしたいと考えています。この再開可能性をどのように実装しますか?"},"options":[{"k":"A","t":{"en":"Increase the agent's timeout to several hours so that interruptions become rare enough to ignore in practice.","vi":"Tăng thời gian chờ của tổng đài viên lên vài giờ để tình trạng gián đoạn trở nên hiếm khi bị bỏ qua trong thực tế.","jp":"エージェントのタイムアウトを数時間に増やして、実際には中断が無視できるほどまれになるようにします。"}},{"k":"B","t":{"en":"Apply a checkpointing pattern that persists the agent's intermediate state and reloads that state when resuming an interrupted task.","vi":"Áp dụng mẫu điểm kiểm tra để duy trì trạng thái trung gian của tác nhân và tải lại trạng thái đó khi tiếp tục một tác vụ bị gián đoạn.","jp":"エージェントの中間状態を保持し、中断されたタスクを再開するときにその状態をリロードするチェックポイント パターンを適用します。"}},{"k":"C","t":{"en":"Run two copies of the agent in parallel for every task and use whichever one finishes first as the source of truth.","vi":"Chạy song song hai bản sao của tác nhân cho mọi nhiệm vụ và sử dụng bản nào hoàn thành trước làm nguồn thông tin chính xác.","jp":"すべてのタスクに対してエージェントの 2 つのコピーを並行して実行し、最初に終了した方を信頼できる情報源として使用します。"}},{"k":"D","t":{"en":"Restart the task from the beginning whenever a process is interrupted.","vi":"Khởi động lại tác vụ từ đầu bất cứ khi nào một quá trình bị gián đoạn.","jp":"プロセスが中断されるたびに、タスクを最初から再開します。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Với tác vụ dài 30–60 phút có các mốc trung gian rõ ràng, cách chuẩn là <b>checkpointing</b>: tại mỗi mốc, <b>lưu trạng thái trung gian của agent</b> (kết quả đã có, bước tiếp theo, dữ liệu cần thiết) vào bộ nhớ bền vững; khi tiến trình bị gián đoạn, <b>nạp lại checkpoint gần nhất</b> và tiếp tục. Như vậy chỉ mất phần việc kể từ checkpoint cuối, đúng yêu cầu resume.","elim":["<b>A.</b> Tăng timeout không ngăn được các gián đoạn khác (crash, deploy, lỗi mạng) và không cung cấp cơ chế tiếp tục khi chúng xảy ra.","<b>C.</b> Chạy hai bản song song nhân đôi chi phí, và nếu cả hai cùng bị gián đoạn thì vẫn phải làm lại từ đầu.","<b>D.</b> Khởi động lại từ đầu lãng phí tới cả giờ xử lý và trái với yêu cầu tiếp tục từ checkpoint gần nhất."]},"cite":"Hướng dẫn ôn tập — §11.6 Lưu trữ Trạng thái có Cấu trúc (để phục hồi sau sự cố); Lĩnh vực 1.7"},{"id":"ccdvf-q056","n":56,"topic":1,"type":"mcq","stem":{"en":"The team is debating whether to build a new capability as a custom tool or to use an existing built-in tool that nearly covers the use case but lacks one specific feature. How would you decide?","vi":"Nhóm đang tranh luận về việc nên xây dựng một khả năng mới dưới dạng một công cụ tùy chỉnh hay sử dụng một công cụ tích hợp sẵn gần như đáp ứng được trường hợp sử dụng nhưng thiếu một tính năng cụ thể. Bạn sẽ quyết định như thế nào?","jp":"チームは、カスタム ツールとして新しい機能を構築するか、ユースケースをほぼカバーしているものの、特定の機能が 1 つ欠けている既存の組み込みツールを使用するかを議論しています。どうやって決めますか？"},"options":[{"k":"A","t":{"en":"Evaluate whether the missing feature can be addressed by extending the built-in tool or warrants a custom tool, then choose accordingly.","vi":"Đánh giá xem tính năng còn thiếu có thể được giải quyết bằng cách mở rộng công cụ tích hợp hay bảo đảm một công cụ tùy chỉnh, sau đó chọn cho phù hợp.","jp":"不足している機能が組み込みツールを拡張することで解決できるか、それともカスタム ツールが必要かを評価し、それに応じて選択します。"}},{"k":"B","t":{"en":"Identify whether the team has previously built similar custom tools and use those precedents to determine which approach is more consistent with the existing codebase.","vi":"Xác định xem trước đây nhóm có xây dựng các công cụ tùy chỉnh tương tự hay không và sử dụng các tiền lệ đó để xác định cách tiếp cận nào phù hợp hơn với cơ sở mã hiện có.","jp":"チームが以前に同様のカスタム ツールを構築したかどうかを特定し、それらの前例を使用して、どのアプローチが既存のコードベースとより一貫性があるかを判断します。"}},{"k":"C","t":{"en":"Examine the custom tool option by scoping the implementation effort and determining whether the additional flexibility justifies the development and maintenance cost.","vi":"Kiểm tra tùy chọn công cụ tùy chỉnh bằng cách xác định phạm vi nỗ lực triển khai và xác định xem liệu tính linh hoạt bổ sung có phù hợp với chi phí phát triển và bảo trì hay không.","jp":"導入作業の範囲を定め、追加の柔軟性が開発およびメンテナンスのコストに見合うかどうかを判断することによって、カスタム ツール オプションを検討します。"}},{"k":"D","t":{"en":"Review the built-in tool's documentation and assess whether its existing capabilities are sufficient to cover the use case without any modification or extension.","vi":"Xem lại tài liệu của công cụ tích hợp và đánh giá xem các khả năng hiện có của nó có đủ để đáp ứng trường hợp sử dụng mà không cần sửa đổi hoặc mở rộng hay không.","jp":"組み込みツールのドキュメントを確認し、その既存の機能が変更や拡張なしでユースケースをカバーするのに十分であるかどうかを評価します。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Câu hỏi then chốt là <b>tính năng còn thiếu có thể bổ sung bằng cách mở rộng tool có sẵn hay không</b> (ví dụ bọc thêm logic, thêm tham số, kết hợp với bước xử lý khác), hay nó đủ khác biệt để <b>cần một custom tool</b>. Đánh giá <b>cả hai hướng dựa trên khoảng trống cụ thể</b> rồi chọn giúp tận dụng phần đã có sẵn và chỉ xây mới khi thực sự cần.","elim":["<b>B.</b> Dựa vào tiền lệ trong codebase là tiêu chí phụ; nó không trả lời được tính năng thiếu có thể bù đắp bằng cách mở rộng hay không.","<b>C.</b> Chỉ xem xét phương án custom tool là đánh giá một phía, bỏ qua khả năng mở rộng tool có sẵn với chi phí thấp hơn.","<b>D.</b> Chỉ đọc tài liệu để xem tool có sẵn có «đủ mà không cần sửa» hay không, trong khi đề đã nói nó thiếu một tính năng; bỏ qua lựa chọn mở rộng hoặc xây mới."]}},{"id":"ccdvf-q057","n":57,"topic":1,"type":"mcq","stem":{"en":"Your Claude application's API keys are stored in a secrets manager. The team is debating whether the same key should be used in development, staging, and production environments. How would you handle the keys across environments?","vi":"Khóa API của ứng dụng Claude của bạn được lưu trữ trong trình quản lý bí mật. Nhóm đang tranh luận liệu có nên sử dụng cùng một khóa trong môi trường phát triển, dàn dựng và sản xuất hay không. Bạn sẽ xử lý các phím trên các môi trường như thế nào?","jp":"Claude アプリケーションの API キーはシークレット マネージャーに保存されます。チームは、開発環境、ステージング環境、実稼働環境で同じキーを使用する必要があるかどうかを議論しています。環境間でキーをどのように処理しますか?"},"options":[{"k":"A","t":{"en":"Use distinct keys for each environment so a compromise in one environment does not affect the others during normal operation across the application's lifecycle.","vi":"Sử dụng các khóa riêng biệt cho từng môi trường để sự thỏa hiệp trong một môi trường không ảnh hưởng đến các môi trường khác trong quá trình hoạt động bình thường trong suốt vòng đời của ứng dụng.","jp":"アプリケーションのライフサイクル全体にわたる通常の運用中に、ある環境での侵害が他の環境に影響を及ぼさないように、環境ごとに個別のキーを使用します。"}},{"k":"B","t":{"en":"Rotate the same key across environments at random intervals on the grounds that random rotation provides isolation between environments without requiring distinct keys.","vi":"Xoay cùng một khóa trên các môi trường theo các khoảng thời gian ngẫu nhiên với lý do việc xoay ngẫu nhiên mang lại sự cách ly giữa các môi trường mà không yêu cầu các khóa riêng biệt.","jp":"ランダムなローテーションにより、個別のキーを必要とせずに環境間の分離が実現されるため、環境間で同じキーをランダムな間隔でローテーションします。"}},{"k":"C","t":{"en":"Use the same key across all environments for simplicity and treat the propagation of any compromise as a known operational tradeoff for the team's key management approach.","vi":"Sử dụng cùng một khóa trên tất cả các môi trường để đơn giản hóa và coi việc lan truyền bất kỳ sự thỏa hiệp nào là sự đánh đổi hoạt động đã biết đối với phương pháp quản lý khóa của nhóm.","jp":"簡素化のためにすべての環境で同じキーを使用し、侵害の伝播をチームのキー管理アプローチの既知の運用上のトレードオフとして扱います。"}},{"k":"D","t":{"en":"Use a single development key everywhere on the grounds that production keys are too risky to deploy across the application's three environments during normal operation.","vi":"Sử dụng một khóa phát triển duy nhất ở mọi nơi vì các khóa sản xuất quá rủi ro khi triển khai trên ba môi trường của ứng dụng trong quá trình hoạt động bình thường.","jp":"通常の運用中にアプリケーションの 3 つの環境に製品キーを展開するにはリスクが大きすぎるため、どこでも単一の開発キーを使用します。"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Thực hành bảo mật chuẩn là <b>tách key riêng cho từng môi trường</b> (dev, staging, production) để <b>giới hạn phạm vi ảnh hưởng (blast radius)</b>: nếu key dev bị lộ, production không bị ảnh hưởng. Key riêng còn cho phép <b>thu hồi/rotate độc lập</b>, đặt hạn mức và quyền khác nhau, và theo dõi usage, chi phí theo môi trường (ví dụ dùng các workspace khác nhau trong Claude Console).","elim":["<b>B.</b> Rotate một key dùng chung theo chu kỳ ngẫu nhiên không tạo ra cách ly: tại mọi thời điểm cả ba môi trường vẫn dùng cùng một key, nên lộ một nơi là lộ cả ba.","<b>C.</b> Dùng chung một key và chấp nhận lan truyền khi bị lộ là chấp nhận rủi ro có thể tránh với chi phí rất thấp.","<b>D.</b> Dùng key dev ở mọi nơi vẫn là một key chung cho cả ba môi trường, đồng thời đưa production phụ thuộc vào một key được quản lý lỏng lẻo hơn."]}},{"id":"ccdvf-q058","n":58,"topic":1,"type":"mcq","stem":{"en":"The Anthropic API deprecated a request parameter that your Claude application uses in approximately 40 places across the codebase. The deprecation notice gives a six-month window before the parameter is removed and recommends a replacement parameter with slightly different semantics. You would respond to the deprecation by...","vi":"API Anthropic không còn dùng tham số yêu cầu mà ứng dụng Claude của bạn sử dụng ở khoảng 40 vị trí trên cơ sở mã. Thông báo không dùng nữa đưa ra thời hạn sáu tháng trước khi tham số này bị xóa và đề xuất tham số thay thế có ngữ nghĩa hơi khác một chút. Bạn sẽ phản ứng với việc không dùng nữa bằng cách...","jp":"Anthropic API は、Claude アプリケーションがコードベース全体の約 40 か所で使用するリクエスト パラメーターを非推奨にしました。非推奨の通知では、パラメータが削除されるまでに 6 か月の猶予期間が設けられており、セマンティクスがわずかに異なる代替パラメータが推奨されています。非推奨に対応するには..."},"options":[{"k":"A","t":{"en":"Migrating all 40 call sites in a single change near the removal date to ensure the deprecated parameter continues to work as long as possible.","vi":"Di chuyển tất cả 40 địa điểm cuộc gọi trong một thay đổi duy nhất gần ngày xóa để đảm bảo thông số không được dùng nữa tiếp tục hoạt động lâu nhất có thể.","jp":"非推奨のパラメータが可能な限り長く機能し続けることを保証するために、削除日近くに 40 のコール サイトすべてを 1 回の変更で移行します。"}},{"k":"B","t":{"en":"Keeping the deprecated parameter in place while writing a wrapper function around it to insulate the rest of the codebase from the eventual change.","vi":"Giữ nguyên tham số không được dùng nữa trong khi viết hàm bao quanh nó để cách ly phần còn lại của cơ sở mã khỏi thay đổi cuối cùng.","jp":"非推奨のパラメータを所定の位置に維持しながら、そのパラメータを囲むラッパー関数を作成して、コードベースの残りの部分を最終的な変更から隔離します。"}},{"k":"C","t":{"en":"Adding regression tests to cover the parameter's behavior, then migrating call sites in batches that you validate against regression tests.","vi":"Thêm các thử nghiệm hồi quy để kiểm tra hành vi của tham số, sau đó di chuyển các trang web cuộc gọi theo lô mà bạn xác thực dựa trên các thử nghiệm hồi quy.","jp":"パラメーターの動作をカバーする回帰テストを追加し、回帰テストに対して検証する呼び出しサイトをバッチで移行します。"}},{"k":"D","t":{"en":"Swapping all 40 call sites in a single change right away to prevent drawn-out migration work that will delay ongoing functioning.","vi":"Hoán đổi ngay lập tức tất cả 40 địa điểm cuộc gọi trong một thay đổi duy nhất để ngăn chặn công việc di chuyển kéo dài sẽ làm trì hoãn hoạt động đang diễn ra.","jp":"1 回の変更で 40 のコール サイトすべてをすぐに交換することで、進行中の機能を遅らせる長期にわたる移行作業を回避します。"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Tham số thay thế có <b>ngữ nghĩa hơi khác</b>, nên rủi ro chính là thay đổi hành vi ngầm. Cách an toàn là trước hết <b>viết regression test</b> ghi lại hành vi hiện tại, rồi <b>migrate các call site theo từng đợt</b> và kiểm chứng mỗi đợt bằng test. Cửa sổ 6 tháng đủ để làm từ từ, phát hiện khác biệt sớm và khoanh vùng lỗi theo từng đợt nhỏ.","elim":["<b>A.</b> Dồn toàn bộ 40 chỗ vào một thay đổi sát ngày gỡ bỏ không còn thời gian xử lý khi phát hiện khác biệt ngữ nghĩa, và một thay đổi lớn rất khó khoanh vùng lỗi.","<b>B.</b> Bọc tham số đã deprecated trong wrapper chỉ trì hoãn; khi tham số bị gỡ, wrapper vẫn hỏng và việc chuyển sang ngữ nghĩa mới vẫn chưa được làm hay kiểm thử.","<b>D.</b> Đổi ngay cả 40 chỗ trong một lần mà không có test rủi ro cao vì ngữ nghĩa khác nhau; lỗi sẽ khó phát hiện và khó truy ra chỗ gây lỗi."]}},{"id":"ccdvf-q059","n":59,"topic":1,"type":"mcq","stem":{"en":"You are setting up a Claude application that requires API keys for several external services. What is the best way to store the keys?","vi":"Bạn đang thiết lập ứng dụng Claude yêu cầu khóa API cho một số dịch vụ bên ngoài. Cách tốt nhất để lưu trữ chìa khóa là gì?","jp":"いくつかの外部サービスの API キーを必要とするクロード アプリケーションをセットアップしています。鍵を保管する最適な方法は何ですか?"},"options":[{"k":"A","t":{"en":"Put the keys in the application's configuration file and check the configuration file into the team's repository alongside the rest of the source code.","vi":"Đặt các khóa vào tệp cấu hình của ứng dụng và kiểm tra tệp cấu hình vào kho lưu trữ của nhóm cùng với phần còn lại của mã nguồn.","jp":"アプリケーションの構成ファイルにキーを入力し、その構成ファイルを残りのソース コードとともにチームのリポジトリにチェックインします。"}},{"k":"B","t":{"en":"Store the keys in a secrets manager or environment-specific configuration that is not checked into source code, and load them at runtime.","vi":"Lưu trữ các khóa trong trình quản lý bí mật hoặc cấu hình dành riêng cho môi trường chưa được kiểm tra trong mã nguồn và tải chúng khi chạy.","jp":"キーをシークレット マネージャーまたはソース コードにチェックインされていない環境固有の構成に保存し、実行時にロードします。"}},{"k":"C","t":{"en":"Use a single shared key across all external services, so any developer working on the application can find the keys easily during development.","vi":"Sử dụng một khóa chung duy nhất trên tất cả các dịch vụ bên ngoài để bất kỳ nhà phát triển nào làm việc trên ứng dụng đều có thể dễ dàng tìm thấy khóa trong quá trình phát triển.","jp":"すべての外部サービスで単一の共有キーを使用することで、アプリケーションに取り組んでいる開発者は開発中にキーを簡単に見つけることができます。"}},{"k":"D","t":{"en":"Email the keys to each developer as needed and have each developer paste the keys into their local environment when they begin working on the application's code.","vi":"Gửi khóa qua email cho từng nhà phát triển nếu cần và yêu cầu mỗi nhà phát triển dán khóa vào môi trường cục bộ của họ khi họ bắt đầu làm việc với mã của ứng dụng.","jp":"必要に応じて各開発者にキーを電子メールで送信し、各開発者がアプリケーションのコードの作業を開始するときにキーをローカル環境に貼り付けてもらいます。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Secret <b>không bao giờ được commit vào source code</b>. Cách chuẩn là lưu trong <b>secrets manager</b> hoặc cấu hình theo môi trường (biến môi trường) <b>nằm ngoài VCS</b>, và <b>nạp lúc runtime</b>. Cách này giữ key khỏi lịch sử git, cho phép rotate mà không cần đổi code, và hỗ trợ key khác nhau cho từng môi trường (giống cách <code>.mcp.json</code> dùng <code>${VAR}</code> thay vì ghi cứng token).","elim":["<b>A.</b> Commit key vào repo khiến bất kỳ ai có quyền đọc repo (và mọi bản sao, lịch sử git) đều thấy key; đây là nguyên nhân rò rỉ secret phổ biến nhất.","<b>C.</b> Một key không thể dùng chung cho nhiều dịch vụ bên ngoài khác nhau, và việc ưu tiên «dễ tìm» đi ngược nguyên tắc tối thiểu quyền.","<b>D.</b> Gửi key qua email để lại bản sao không kiểm soát trong hộp thư, không thể thu hồi hay kiểm toán, và khó rotate."]},"cite":"Hướng dẫn ôn tập — §4.3 Cấu hình MCP Server; Lĩnh vực 2.4"},{"id":"ccdvf-q060","n":60,"topic":1,"type":"mcq","stem":{"en":"You are building a Claude application that needs to maintain a persistent connection to a service that streams real-time updates. The team is unsure what communication pattern to use. Which communication pattern would you use?","vi":"Bạn đang xây dựng một ứng dụng Claude cần duy trì kết nối liên tục với dịch vụ truyền phát các bản cập nhật theo thời gian thực. Nhóm không chắc nên sử dụng hình thức giao tiếp nào. Bạn sẽ sử dụng mô hình giao tiếp nào?","jp":"あなたは、リアルタイム更新をストリーミングするサービスへの永続的な接続を維持する必要があるクロード アプリケーションを構築しています。チームはどのようなコミュニケーション パターンを使用すればよいかわかりません。どのコミュニケーション パターンを使用しますか?"},"options":[{"k":"A","t":{"en":"Repeated short-lived HTTP polling requests, where the application opens a new HTTP connection each time it checks for updates.","vi":"Các yêu cầu thăm dò HTTP tồn tại trong thời gian ngắn lặp đi lặp lại, trong đó ứng dụng sẽ mở một kết nối HTTP mới mỗi lần kiểm tra các bản cập nhật.","jp":"短期間の HTTP ポーリング リクエストが繰り返され、アプリケーションは更新をチェックするたびに新しい HTTP 接続を開きます。"}},{"k":"B","t":{"en":"A WebSocket, because WebSockets are designed for bidirectional, persistent, real-time communication between the client and the streaming service.","vi":"WebSocket, vì WebSockets được thiết kế để liên lạc hai chiều, liên tục, theo thời gian thực giữa máy khách và dịch vụ phát trực tuyến.","jp":"WebSocket。WebSocket は、クライアントとストリーミング サービス間の双方向の永続的なリアルタイム通信用に設計されています。"}},{"k":"C","t":{"en":"A single long HTTP request the server holds open indefinitely, with no standard WebSocket framing on the connection.","vi":"Một yêu cầu HTTP dài duy nhất được máy chủ giữ mở vô thời hạn mà không có khung WebSocket tiêu chuẩn nào trên kết nối.","jp":"サーバーは単一の長い HTTP リクエストを無期限にオープンしたままにし、接続に標準の WebSocket フレーミングを使用しません。"}},{"k":"D","t":{"en":"File-based communication where the service writes new updates to disk and the application polls the file system for changes.","vi":"Giao tiếp dựa trên tệp trong đó dịch vụ ghi các bản cập nhật mới vào đĩa và ứng dụng thăm dò hệ thống tệp để tìm các thay đổi.","jp":"ファイルベースの通信では、サービスが新しい更新をディスクに書き込み、アプリケーションがファイル システムに変更をポーリングします。"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Yêu cầu là <b>kết nối lâu dài</b> với một dịch vụ <b>đẩy cập nhật thời gian thực</b>. <b>WebSocket</b> được thiết kế đúng cho việc này: một kết nối duy nhất, <b>hai chiều, bền vững</b>, server đẩy dữ liệu ngay khi có mà không cần client hỏi lại, với framing và cơ chế ping/keepalive chuẩn.","elim":["<b>A.</b> Polling ngắn mở kết nối mới mỗi lần, tốn tài nguyên, tăng độ trễ (chỉ thấy cập nhật ở lần hỏi kế tiếp) và không phải là kết nối liên tục.","<b>C.</b> Giữ một HTTP request mở vô thời hạn mà không có framing chuẩn là cách tự chế, dễ bị proxy/timeout cắt và chỉ một chiều.","<b>D.</b> Giao tiếp qua file và polling hệ thống file chậm, dễ xung đột ghi/đọc và không áp dụng được cho dịch vụ từ xa."]}},{"id":"ccdvf-q061","n":61,"topic":1,"type":"mcq","stem":{"en":"You are building an agent that needs to call several internal APIs and a database in a structured, repeatable way. Your team has decided to use the Claude Agent SDK rather than build a custom loop. You are setting up the agent's tool definitions and execution loop. How would you set up the tools and execution loop?","vi":"Bạn đang xây dựng một tác nhân cần gọi một số API nội bộ và cơ sở dữ liệu theo cách có cấu trúc và có thể lặp lại. Nhóm của bạn đã quyết định sử dụng SDK đại lý Claude thay vì xây dựng vòng lặp tùy chỉnh. Bạn đang thiết lập các định nghĩa công cụ và vòng thực thi của tác nhân. Bạn sẽ thiết lập các công cụ và vòng lặp thực thi như thế nào?","jp":"構造化された反復可能な方法で、いくつかの内部 API とデータベースを呼び出す必要があるエージェントを構築しています。あなたのチームは、カスタム ループを構築するのではなく、Claude Agent SDK を使用することにしました。エージェントのツール定義と実行ループをセットアップしています。ツールと実行ループをどのように設定しますか?"},"options":[{"k":"A","t":{"en":"Use the SDK's tool interface and let the SDK handle the loop, dispatch, and history.","vi":"Sử dụng giao diện công cụ của SDK và để SDK xử lý vòng lặp, điều phối và lịch sử.","jp":"SDK のツール インターフェイスを使用して、SDK にループ、ディスパッチ、履歴を処理させます。"}},{"k":"B","t":{"en":"Call the Messages API directly and let the model format its tool calls in plain text.","vi":"Gọi trực tiếp API Tin nhắn và để mô hình định dạng các cuộc gọi mà công cụ của nó gọi bằng văn bản thuần túy.","jp":"メッセージ API を直接呼び出して、モデルがそのツール呼び出しをプレーン テキストでフォーマ
