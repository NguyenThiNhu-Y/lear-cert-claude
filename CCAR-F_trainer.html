<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCAR-F · Claude Certified Architect - Foundations</title>
<meta name="description" content="Bộ đề luyện thi CCAR-F.">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<script>
/* đặt theme trước khi vẽ để không nháy màu */
(function(){
  var th="dark";
  try{
    var d=JSON.parse(localStorage.getItem('examtrainer.CCAR-F')||"{}");
    if(d.theme) th=d.theme;
    else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches) th="light";
  }catch(e){}
  document.documentElement.setAttribute("data-theme",th);
})();
</script>
<style>
/* ============================================================
   Exam Trainer — bảng điều khiển + tờ đề in (tông ấm)
   ============================================================ */

:root{                      /* TỐI — mỗi màu chữ đều đo trên nền sáng nhất mà nó nằm lên */
  --shell:#171310;          /* khung ngoài            */
  --shell-2:#201A15;        /* cột trái / cột phải    */
  --shell-3:#2E251C;        /* nền nổi khi rê chuột   */
  --sunken:#100D0A;         /* ô nhập liệu — chìm     */
  --paper:#1C1712;          /* vùng đọc               */
  --paper-2:#252019;
  --ink:#F1EFEA;            /* ≥13.1:1 mọi nền        */
  --ink-2:#C6BCAA;          /* ≥ 8.0:1 — nhãn, chú thích */
  --ink-3:#ABA08B;          /* ≥ 5.8:1 — số đếm, gợi ý ô nhập */
  --rule:#3D3428;           /* kẻ trang trí           */
  --rule-2:#786853;         /* viền điều khiển ≥3:1   */
  --on-accent:#171310;      /* chữ nằm trên mảng màu đặc */
  --ok:#8FD98C;
  --ok-bg:rgba(143,217,140,.15);
  --bad:#FF9781;
  --bad-bg:rgba(255,151,129,.15);
  --flag:#F7C25A;
  --flag-bg:rgba(247,194,90,.17);
  --pick:#8ECBF0;
  --pick-bg:rgba(142,203,240,.15);
  --stamp:#FF9781;
  --focus:#F7C25A;
  --thumb:#5A4E3D;
  color-scheme:dark;
}
[data-theme="light"]{       /* SÁNG — cùng nguyên tắc, giấy ngà để bớt chói */
  --shell:#E9E3D5;
  --shell-2:#F2EDE2;
  --shell-3:#E7E1D2;
  --sunken:#FFFFFF;
  --paper:#FDFBF5;
  --paper-2:#F5F1E6;
  --ink:#201C16;            /* ≥13.0:1 */
  --ink-2:#463E35;          /* ≥ 8.0:1 */
  --ink-3:#5B5347;          /* ≥ 5.8:1 */
  --rule:#DED6C4;
  --rule-2:#8F8269;
  --on-accent:#FFFFFF;
  --ok:#256B42;
  --ok-bg:rgba(37,107,66,.10);
  --bad:#B32E1F;
  --bad-bg:rgba(179,46,31,.09);
  --flag:#7F5405;
  --flag-bg:rgba(127,84,5,.13);
  --pick:#175D91;
  --pick-bg:rgba(23,93,145,.09);
  --stamp:#B32E1F;
  --focus:#7F5405;
  --thumb:#B0A48D;
  color-scheme:light;
}
:root{
  --sans:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --top:52px;
  --gut:clamp(16px,1.8vw,26px);
  --pad:clamp(24px,2.6vw,46px);
  --perf:26px;
  --recpad:clamp(12px,1.2vw,20px);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
*{scrollbar-width:thin;scrollbar-color:var(--thumb) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent;border-left:1px solid var(--rule)}
::-webkit-scrollbar-thumb{background:var(--thumb);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
body{
  margin:0;background:var(--shell);color:var(--ink);
  font-family:var(--serif);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
b,strong{font-weight:600}
h1,h2,h3,h4{margin:0}
img{max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hide{display:none!important}
.grow{flex:1}

.lbl{
  font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-2);
}

/* ============================ TOP ============================ */
.top{
  position:sticky;top:0;z-index:60;height:var(--top);
  background:var(--shell-2);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:var(--gut);padding:0 var(--gut);
}
.mark{display:flex;align-items:baseline;gap:9px;flex:none}
.mark .w{font-family:var(--sans);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.mark .w em{font-style:normal;color:var(--stamp)}
.mark .s{font-family:var(--sans);font-size:12px;letter-spacing:.02em;color:var(--ink-2);white-space:nowrap}

.seg{display:flex;border:1px solid var(--rule-2);flex:none}
.seg button{
  background:transparent;border:0;border-right:1px solid var(--rule-2);
  font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-2);padding:6px 13px;cursor:pointer;line-height:1.45;
}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink);background:var(--shell-3)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-accent)}
.seg.mini button{padding:5px 9px;font-size:10px;letter-spacing:.1em}
.top .right{display:flex;gap:8px;align-items:center;flex:none}
.icb{
  background:transparent;border:1px solid var(--rule-2);color:var(--ink-2);
  width:29px;height:29px;display:grid;place-items:center;cursor:pointer;
  font-family:var(--sans);font-weight:700;font-size:12px;flex:none;
}
.icb:hover{color:var(--ink);border-color:var(--ink-3)}

/* ============================ GRID ============================ */
.app{
  display:grid;
  grid-template-columns:266px minmax(0,1fr) 304px;
  grid-template-areas:"rail main aside";
  align-items:stretch;min-height:calc(100vh - var(--top));
}
.rail{grid-area:rail;border-right:1px solid var(--rule);background:var(--shell-2)}
.main{grid-area:main;min-width:0;background:var(--paper);position:relative;min-height:calc(100vh - var(--top))}
.aside{grid-area:aside;border-left:1px solid var(--rule);background:var(--shell-2)}
.rail-in,.aside-in{
  position:sticky;top:var(--top);height:calc(100vh - var(--top));
  overflow-y:auto;overflow-x:hidden;padding:16px var(--gut) 40px;
}
@media(max-width:1319px){
  .app{grid-template-columns:244px minmax(0,1fr);grid-template-areas:"rail aside" "rail main";align-content:start}
  .aside{border-left:0;border-bottom:1px solid var(--rule)}
  .aside-in{position:static;height:auto;max-height:none;padding:12px var(--gut)}
  .aside .stack{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 26px;align-items:start}
}
@media(max-width:899px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"rail" "main" "aside"}
  .aside{border-top:1px solid var(--rule);border-bottom:0}
  .only-lg{display:none}
  .rail{border-right:0;border-bottom:1px solid var(--rule)}
  .rail-in{position:static;height:auto;max-height:none;padding:12px var(--gut) 18px}
  body:not(.rail-open) .rail-in{display:none}
  .rail-in .stack{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px 26px;align-items:start}
}
@media(min-width:900px){ .railtoggle{display:none} }
@media(max-width:899px){
  .top{height:auto;min-height:var(--top);flex-wrap:wrap;gap:8px 10px;padding:8px var(--gut)}
  .mark .s{display:none}
  .top .right{margin-left:auto}
  .seg button{padding:6px 9px;font-size:10px;letter-spacing:.07em}
  .seg.mini button{padding:5px 7px}
}
@media(max-width:640px){
  :root{--perf:14px}
  .paper::before,.paper::after{background-size:100% 20px}
}

/* ============================ CONTROLS ============================ */
.blk{margin-bottom:22px}
.blk > .lbl{display:block;margin-bottom:8px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}

.fld{
  width:100%;background:var(--sunken);border:1px solid var(--rule-2);color:var(--ink);
  font-family:var(--serif);font-size:14.5px;padding:8px 10px;
}
.fld::placeholder{color:var(--ink-3);opacity:1}
.fld:focus{outline:none;border-color:var(--stamp);box-shadow:inset 0 0 0 1px var(--stamp)}

/* select tự vẽ — không dùng mũi tên mặc định của hệ điều hành */
.sel{position:relative;display:block}
.sel select{
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  width:100%;background:var(--sunken);color:var(--ink);
  border:1px solid var(--rule-2);border-radius:0;
  padding:9px 42px 9px 12px;font-family:var(--mono);font-size:13.5px;line-height:1.35;
  cursor:pointer;
}
.sel select:hover{border-color:var(--ink-3)}
.sel select:focus{outline:none;border-color:var(--stamp);box-shadow:inset 0 0 0 1px var(--stamp)}
.sel .cap{
  position:absolute;top:1px;right:1px;bottom:1px;width:30px;
  border-left:1px solid var(--rule-2);background:var(--shell-3);
  display:grid;place-items:center;pointer-events:none;
}
.sel .cap::after{
  content:"";width:0;height:0;
  border-left:4.5px solid transparent;border-right:4.5px solid transparent;
  border-top:5.5px solid var(--ink-2);
}
.sel select:hover + .cap::after{border-top-color:var(--ink)}
.sel select:focus + .cap{background:var(--stamp);border-left-color:var(--stamp)}
.sel select:focus + .cap::after{border-top-color:var(--on-accent)}
.sel.on select{border-color:var(--pick);box-shadow:inset 0 0 0 1px var(--pick)}
.sel.on .cap{border-left-color:var(--pick)}

.tlist{display:grid;gap:1px}
.slist{display:grid;border-top:1px solid var(--rule)}
.srow{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;border-bottom:1px solid var(--rule);
  border-left:2px solid transparent;padding:8px 10px;
}
.srow:hover{background:var(--shell-3)}
.srow[aria-pressed="true"]{border-left-color:var(--stamp);background:var(--shell-3)}
.srow[aria-pressed="true"] .nm{color:var(--ink)}
.srow .dot{width:10px;height:10px;flex:none;position:relative;color:var(--ink-3)}
.srow[aria-pressed="true"] .dot{color:var(--ink)}
.srow .dot::before{content:"";position:absolute;inset:1px;border:1px solid currentColor}
.srow .dot.g{color:var(--ok)}   .srow .dot.g::before{background:currentColor}
.srow .dot.r{color:var(--bad)}  .srow .dot.r::before{background:currentColor}
.srow .dot.f{color:var(--flag)} .srow .dot.f::before{background:currentColor}
/* dấu hiệu của từng dạng câu, vẽ lại đúng hình dáng điều khiển tương ứng */
.srow .dot.m-mcq::before{box-shadow:inset 0 0 0 2px currentColor}
.srow .dot.m-yesno::before{border:0;background:linear-gradient(currentColor 0 34%,transparent 34% 66%,currentColor 66% 100%)}
.srow .dot.m-drop::before{border:0;background:currentColor;clip-path:polygon(0 22%,100% 22%,50% 86%)}
.srow .nm{flex:1;font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.03em;
  text-transform:uppercase;color:var(--ink-2)}
.srow .ct{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* nhóm nút dữ liệu — hàng đầy chiều rộng, thống nhất với các danh sách khác */
.vlist{display:grid;border-top:1px solid var(--rule)}
.vrow{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;border-bottom:1px solid var(--rule);padding:10px;
  font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);
}
.vrow:hover{background:var(--shell-3);color:var(--ink)}
.vrow svg{flex:none;width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7}
.vrow.danger{color:var(--bad)}
.vrow.danger:hover{background:var(--bad-bg)}
.trow{
  display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:center;
  background:transparent;border:0;border-left:2px solid transparent;
  padding:6px 8px;cursor:pointer;text-align:left;width:100%;min-width:0;
}
.trow:hover{background:var(--shell-3)}
.trow[aria-pressed="true"]{border-left-color:var(--stamp);background:var(--shell-3)}
.trow .nm{font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.trow .ct{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.meter{grid-column:1/-1;height:4px;background:var(--rule);display:flex;overflow:hidden}
.meter i{display:block;height:100%}
.meter .g{background:var(--ok)}
.meter .r{background:var(--bad)}

.act{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;background:transparent;color:var(--ink);
  border:1px solid var(--rule-2);padding:7px 13px;cursor:pointer;line-height:1.4;
}
.btn:hover{border-color:var(--ink);background:var(--shell-3)}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{border-color:var(--rule-2);background:transparent;color:var(--ink)}
.btn.solid{background:var(--ink);border-color:var(--ink);color:var(--on-accent)}
.btn.solid:hover:not(:disabled){filter:brightness(1.12)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:5px 10px;font-size:10px}

/* ============================ ASIDE ============================ */
.kv{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:3px 0}
.kv span{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.kv b{font-family:var(--mono);font-size:12.5px;font-weight:600}
.bigbar{height:8px;border:1px solid var(--rule-2);display:flex;margin:6px 0;overflow:hidden}
.bigbar i{display:block;height:100%}
.queue{display:grid;gap:2px;max-height:270px;overflow:auto}
.qbtn{
  display:flex;gap:8px;align-items:baseline;background:transparent;border:0;
  border-left:2px solid var(--rule-2);padding:5px 8px;text-align:left;cursor:pointer;width:100%;min-width:0;
}
.qbtn:hover{background:var(--shell-3)}
.qbtn.is-wrong{border-left-color:var(--bad)}
.qbtn.is-flag{border-left-color:var(--flag)}
.qbtn .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);flex:none}
.qbtn .t{min-width:0;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.keys{display:grid;gap:3px}
.keyrow{display:flex;gap:8px;align-items:center;font-family:var(--serif);font-size:12.5px;color:var(--ink-2)}
kbd{
  font-family:var(--mono);font-size:10px;background:var(--shell-3);border:1px solid var(--rule-2);
  border-bottom-width:2px;padding:1px 5px;color:var(--ink);min-width:18px;text-align:center;
}

/* ============================ PAPER ============================ */
.paper{position:relative;padding:0 var(--perf);min-height:100%}
.paper::before,.paper::after{
  content:"";position:absolute;top:0;bottom:0;width:var(--perf);
  background:var(--paper-2);pointer-events:none;
}
.paper::before{left:0;border-right:1px solid var(--rule);box-shadow:inset -4px 0 0 -3px var(--rule)}
.paper::after{right:0;border-left:1px solid var(--rule);box-shadow:inset 4px 0 0 -3px var(--rule)}
.sheet{padding:0 var(--pad) 64px}

.head{padding:30px 0 18px;border-bottom:2px solid var(--ink);display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.head h2{font-family:var(--sans);font-weight:700;font-size:clamp(22px,2.6vw,34px);letter-spacing:-.01em;text-transform:uppercase;line-height:1}
.head p{font-family:var(--serif);font-size:14.5px;color:var(--ink-2);margin:8px 0 0;max-width:62ch}
.head .r{margin-left:auto;text-align:right}

.rec{
  border-bottom:1px solid var(--rule);
  padding:22px var(--recpad) 24px;margin:0 calc(-1 * var(--recpad));
  scroll-margin-top:calc(var(--top) + 12px);
}
.rec.cur{background:var(--paper-2);box-shadow:inset 3px 0 0 var(--stamp)}
.rec.cur .idx{color:var(--stamp)}
.rechead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px;max-width:86ch}
.idx{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.05em}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.flagbtn{
  flex:none;width:26px;height:24px;display:grid;place-items:center;cursor:pointer;
  background:transparent;border:1px solid var(--rule-2);color:var(--ink-2);
}
.flagbtn svg{width:12px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9}
.flagbtn:hover{color:var(--flag);border-color:var(--flag)}
.flagbtn[aria-pressed="true"]{color:var(--flag);border-color:var(--flag);background:var(--flag-bg)}
.flagbtn[aria-pressed="true"] svg{fill:currentColor}
.tag{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid var(--rule-2);color:var(--ink-2);padding:2px 6px;white-space:nowrap;
}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.bad{color:var(--bad);border-color:var(--bad)}
.tag.flag{color:var(--flag);border-color:var(--flag)}
.tag.multi{color:var(--pick);border-color:var(--pick)}

.stem{font-family:var(--mono);font-size:14.5px;line-height:1.62;margin:0;max-width:78ch}
.stem b.kw{font-weight:700;text-decoration:underline;text-decoration-color:var(--flag);text-decoration-thickness:2px;text-underline-offset:3px}
.gloss{
  display:block;font-family:var(--serif);font-size:14.5px;line-height:1.6;
  color:var(--ink-2);max-width:74ch;margin:4px 0 0;
}
.qbody{margin-top:16px}
.qimg{display:block;margin:14px 0 4px;border:1px solid var(--rule-2);max-width:min(100%,620px);cursor:zoom-in}

/* --- phương án nhiều lựa chọn --- */
.opts{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-width:86ch}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:transparent;border:1px solid transparent;color:var(--ink);
  padding:8px 10px;cursor:pointer;
}
.opt:hover{border-color:var(--rule-2)}
.opt .k{
  flex:none;width:22px;height:22px;display:grid;place-items:center;margin-top:1px;
  border:1px solid var(--rule-2);font-family:var(--mono);font-weight:600;font-size:11.5px;
}
.opt .tx{flex:1;min-width:0;font-family:var(--mono);font-size:13.5px;line-height:1.55}
.opt .tx b.kw{font-weight:700;text-decoration:underline;text-decoration-color:var(--rule-2);text-decoration-thickness:1.5px;text-underline-offset:3px}
.opt .tx .gloss{font-size:13.5px;margin-top:3px}
.opt .mk{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;white-space:nowrap;padding-top:5px;display:none;
}
.opt[data-pick="1"]{border-color:var(--pick);background:var(--pick-bg)}
.opt[data-pick="1"] .k{background:var(--pick);border-color:var(--pick);color:var(--on-accent)}
.opt[data-pick="1"] .mk-you{display:block;color:var(--pick)}
.rec[data-done="1"] .opt{cursor:default}
.rec[data-done="1"] .opt:hover{border-color:transparent}
.rec[data-done="1"] .opt[data-right="1"]{border-color:var(--ok);background:var(--ok-bg)}
.rec[data-done="1"] .opt[data-right="1"] .k{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.rec[data-done="1"] .opt[data-right="1"] .mk-ok{display:block;color:var(--ok)}
.rec[data-done="1"] .opt[data-right="1"] .mk-you{display:none}
.rec[data-done="1"] .opt[data-pick="1"][data-right="0"]{border-color:var(--bad);background:var(--bad-bg)}
.rec[data-done="1"] .opt[data-pick="1"][data-right="0"] .k{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.rec[data-done="1"] .opt[data-pick="1"][data-right="0"] .mk-you{display:block;color:var(--bad)}

/* --- dạng Có / Không theo dòng --- */
.ynlist{list-style:none;margin:0;padding:0;max-width:92ch;border-top:1px solid var(--rule)}
.yn{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:center;
  padding:12px 10px;border-bottom:1px solid var(--rule);
}
.yn .ynt{font-family:var(--mono);font-size:13.5px;line-height:1.55;min-width:0}
.yn .ynt .gloss{font-size:13.5px;margin-top:3px}
.ynb{display:flex;flex:none;border:1px solid var(--rule-2)}
.ynb button{
  background:transparent;border:0;border-right:1px solid var(--rule-2);
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-2);padding:6px 14px;cursor:pointer;min-width:64px;
}
.ynb button:last-child{border-right:0}
.ynb button:hover{background:var(--shell-3);color:var(--ink)}
.ynb button[aria-pressed="true"]{background:var(--pick);color:var(--on-accent)}
.rec[data-done="1"] .ynb button{cursor:default}
.rec[data-done="1"] .ynb button:hover{background:transparent;color:var(--ink-2)}
.rec[data-done="1"] .ynb button[aria-pressed="true"]{background:var(--bad);color:var(--on-accent)}
.rec[data-done="1"] .yn[data-right="1"] .ynb button[aria-pressed="true"]{background:var(--ok);color:var(--on-accent)}
.rec[data-done="1"] .yn[data-right="0"] .ynb button[data-correct="1"]{box-shadow:inset 0 0 0 2px var(--ok);color:var(--ok)}

/* --- dạng chọn từ danh sách --- */
.blanks{display:grid;gap:18px;max-width:78ch}
.blank .blabel{display:block;font-family:var(--mono);font-size:13px;line-height:1.55;margin-bottom:8px;color:var(--ink)}
.blank .blabel .gloss{font-size:13px;margin-top:3px}
.blank .ansline{
  font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  margin-top:7px;display:none;
}
.rec[data-done="1"] .blank[data-right="0"] .ansline{display:block}
.blank .ansline.ok{color:var(--ok)}
.blank .ansline.bad{color:var(--bad)}
.rec[data-done="1"] .sel select{pointer-events:none}
.rec[data-done="1"] .blank[data-right="1"] select{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.rec[data-done="1"] .blank[data-right="0"] select{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}

.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px;max-width:86ch}
.note{font-family:var(--serif);font-size:13.5px;color:var(--ink-2)}

/* --- khối đáp án --- */
.rev{display:none;margin-top:20px;border-top:1px solid var(--ink);padding-top:18px}
.rec[data-done="1"] .rev{display:block}
.revtop{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.stamp{
  border:2.5px solid var(--stamp);color:var(--stamp);padding:5px 13px 6px;
  transform:rotate(-2.2deg);box-shadow:inset 0 0 0 1px var(--stamp);
  display:flex;align-items:baseline;gap:10px;flex:none;max-width:100%;
}
.stamp .t{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.stamp .v{font-family:var(--sans);font-weight:700;font-size:26px;line-height:1;letter-spacing:.06em}
.stamp.txt .v{font-size:15px;letter-spacing:.02em;font-family:var(--mono);font-weight:600;line-height:1.35}
.verdict{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--bad)}
.conf{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid currentColor;padding:3px 8px;
}
.conf.h{color:var(--ok)}
.conf.m{color:var(--flag)}
.conf.l{color:var(--bad)}

.revgrid{display:grid;gap:20px 36px}
@media(min-width:1500px){ .revgrid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }
.sech{
  font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-2);display:flex;align-items:center;gap:10px;margin-bottom:8px;
}
.sech::after{content:"";flex:1;height:0;border-top:1px dotted var(--rule-2)}
.prose{font-family:var(--serif);font-size:15.5px;line-height:1.7;max-width:72ch;margin:0}
.prose b{box-shadow:inset 0 -2px 0 var(--flag)}
ul.elim{list-style:none;margin:0;padding:0;max-width:72ch}
ul.elim li{font-family:var(--serif);font-size:15px;line-height:1.65;padding-left:20px;position:relative;margin-bottom:6px}
ul.elim li::before{content:"\00D7";position:absolute;left:2px;top:-1px;font-family:var(--sans);font-weight:700;color:var(--bad);font-size:16px}
.cite{
  font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-top:16px;
  padding-top:10px;border-top:1px dotted var(--rule-2);max-width:78ch;word-break:break-word;
}
.notewrap{margin-top:20px;padding-top:16px;border-top:1px dotted var(--rule-2)}
.notewrap .lbl{display:block;margin-bottom:6px}
.notewrap textarea{
  display:block;width:100%;max-width:72ch;min-height:64px;resize:vertical;background:var(--sunken);
  border:1px solid var(--rule-2);color:var(--ink);font-family:var(--serif);font-size:14.5px;padding:9px 11px;
}
.notewrap textarea:focus{outline:none;border-color:var(--stamp)}

/* ============================ EXAM ============================ */
.panel{border:1px solid var(--rule-2);background:var(--paper-2);padding:24px var(--pad);margin-top:24px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px 24px;align-items:end}
.grid2 .lbl{min-height:15px}
.fldw{display:grid;gap:6px}
.timer{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:.06em}
.timer.low{color:var(--bad)}
.pal{display:flex;flex-wrap:wrap;gap:4px}
.pd{
  width:30px;height:28px;border:1px solid var(--rule-2);background:transparent;color:var(--ink-2);
  font-family:var(--mono);font-size:11px;cursor:pointer;position:relative;
}
.pd:hover{border-color:var(--ink-3);color:var(--ink)}
.pd.is-ans{border-color:var(--pick);color:var(--pick)}
.pd.is-flag::after{content:"";position:absolute;top:2px;right:2px;width:4px;height:4px;background:var(--flag)}
.pd.is-cur{background:var(--ink);border-color:var(--ink);color:var(--on-accent)}

.score{display:flex;gap:36px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .n b{font-family:var(--sans);font-weight:700;font-size:34px;line-height:1}
.ring .n span{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);letter-spacing:.1em;text-transform:uppercase}
.result-h{font-family:var(--sans);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase}
.result-h.ok{color:var(--ok)}
.result-h.bad{color:var(--flag)}
.figs{display:flex;gap:28px;flex-wrap:wrap;margin-top:12px}
.fig b{display:block;font-family:var(--mono);font-size:23px;font-weight:600}

/* ============================ TABLE ============================ */
.tw{overflow-x:auto;margin-top:12px}
.tw table{min-width:440px}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule)}
th{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);border-bottom-color:var(--rule-2)}
td:first-child{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.02em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.sbar{height:5px;background:var(--rule);display:flex;min-width:70px}
.sbar i{display:block;height:100%}

.empty{padding:64px 10px;text-align:center;font-family:var(--serif);font-size:14.5px;color:var(--ink-2)}
.empty b{display:block;font-family:var(--sans);font-size:18px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-bottom:8px}

/* ============================ OVERLAY ============================ */
.ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px}
.ov .box{background:var(--shell-2);border:1px solid var(--rule-2);max-width:520px;width:100%;padding:22px 24px;max-height:86vh;overflow:auto}
.ov h3{font-family:var(--sans);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.ov p{font-family:var(--serif);font-size:14.5px;color:var(--ink-2);margin:0 0 16px}
.ov.zoom{cursor:zoom-out}
.ov.zoom img{max-width:96vw;max-height:92vh;border:1px solid var(--rule-2)}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;
  background:var(--ink);color:var(--on-accent);font-family:var(--mono);font-size:12.5px;
  padding:9px 16px;border:1px solid var(--ink);
}

/* ============ RESPONSIVE OVERRIDES (phải nằm sau mọi component) ============ */
@media(max-width:640px){
  .yn{grid-template-columns:minmax(0,1fr);gap:12px}
  .ynb{justify-self:start}
  .ynb button{min-width:84px;padding:7px 16px}
  .stem,.opt .tx,.yn .ynt{font-size:13.5px}
  .revtop{gap:12px}
  .stamp{transform:none}
}

/* ============================ PRINT ============================ */
@media print{
  body{background:#fff;color:#000}
  .top,.rail,.aside,.bar,.notewrap,.ov,.toast{display:none!important}
  .app{display:block}
  .main{background:#fff}
  .paper{padding:0}
  .paper::before,.paper::after{display:none}
  .rec{break-inside:avoid;background:#fff!important}
  .rev{display:block!important}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

<script>
/* ============================================================

const DATA = {"meta":{"code":"CCAR-F","title":{"en":"Claude Certified Architect - Foundations"},"org":"Anthropic","pass":70},"topics":[{"n":1,"title":{"en":"Topic 1","vi":"Chủ đề 1"},"questions":[{"id":"t1q1","n":1,"topic":1,"type":"mcq","stem":{"en":"A developer asks the agent to investigate why a specific API endpoint <b class=\"kw\">intermittently returns 500 responses</b>. The codebase has <b class=\"kw\">200+ files</b> and the developer <b class=\"kw\">doesn&#x27;t know which components are involved</b>. The agent must trace the error through routing, middleware, business logic, and database layers. What task decomposition approach would be most effective?","vi":"Một lập trình viên yêu cầu agent điều tra lý do một API endpoint cụ thể <b class=\"kw\">thỉnh thoảng (không liên tục)</b> trả về phản hồi 500. Codebase có <b class=\"kw\">200+ file</b> và lập trình viên <b class=\"kw\">không biết những thành phần nào có liên quan</b>. Agent phải lần theo lỗi qua các tầng routing, middleware, logic nghiệp vụ và cơ sở dữ liệu. Cách phân rã tác vụ nào sẽ hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Run parallel worker agents</b> on the file system of four layers, then combine their findings to reconstruct the complete error path.","vi":"<b class=\"kw\">Chạy song song các worker agent</b> trên hệ thống file của bốn tầng, sau đó kết hợp các phát hiện của chúng để tái dựng toàn bộ đường đi của lỗi."}},{"k":"B","t":{"en":"Have the agent <b class=\"kw\">dynamically generate investigation subtasks</b> based on what it discovers at each step, <b class=\"kw\">adapting its exploration plan</b> as new information about the error path emerges.","vi":"Để agent <b class=\"kw\">tạo các tác vụ con điều tra một cách động</b> dựa trên những gì nó phát hiện ở mỗi bước, <b class=\"kw\">điều chỉnh kế hoạch khám phá</b> khi thông tin mới về đường đi của lỗi xuất hiện."}},{"k":"C","t":{"en":"Define a <b class=\"kw\">fixed sequence of investigation steps</b> upfront—grep for error handlers, then examine middleware, then check database queries, then examine middleware-woven code.","vi":"Xác định trước một <b class=\"kw\">chuỗi bước điều tra cố định</b>—grep tìm các error handler, sau đó xem xét middleware, rồi kiểm tra các truy vấn cơ sở dữ liệu, rồi xem xét code đan xen với middleware (middleware-woven)."}},{"k":"D","t":{"en":"Have the agent first create a <b class=\"kw\">comprehensive plan</b> mapping all code paths through documented components <b class=\"kw\">before beginning any exploration</b> or code reading.","vi":"Để agent trước tiên tạo một <b class=\"kw\">kế hoạch toàn diện</b> ánh xạ mọi đường đi của code qua các thành phần đã được tài liệu hóa, <b class=\"kw\">trước khi bắt đầu bất kỳ việc khám phá</b> hay đọc code nào."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Điều tra lỗi 500 chập chờn trong codebase 200+ tệp khi chưa biết thành phần nào liên quan là bài toán <b>mở, không đoán trước được lộ trình</b>: mỗi tệp đọc được sẽ quyết định bước tiếp theo nên làm gì. Vì vậy cần <b>phân rã thích ứng động</b> — agent sinh các subtask điều tra dựa trên những gì vừa phát hiện (ví dụ thấy middleware nuốt exception thì lần theo nhánh đó) và điều chỉnh kế hoạch khi đường đi của lỗi qua routing → middleware → business logic → database lộ dần. Pipeline cố định chỉ phù hợp khi các bước đã biết trước.","elim":["<b>A.</b> Chia cứng theo bốn tầng và chạy worker song song giả định đã biết lỗi nằm ở đâu; các worker không thấy phát hiện của nhau nên khó lần ra một đường lỗi xuyên tầng, việc ghép kết quả sau cùng dễ đứt mạch nhân quả.","<b>C.</b> Chuỗi bước định sẵn không thích ứng với phát hiện mới; nếu nguyên nhân nằm ngoài kịch bản (ví dụ race condition ở connection pool) agent vẫn đi theo lộ trình cứng và bỏ lỡ.","<b>D.</b> Lập bản đồ toàn bộ code path trước khi đọc code là bất khả thi với 200+ tệp chưa biết, tốn context, và tài liệu có thể không phản ánh code thực — kế hoạch đó vẫn phải sửa liên tục khi điều tra."]},"cite":"Hướng dẫn ôn tập — §8.2 Phân rã thích ứng động (Dynamic Adaptive Decomposition); Lĩnh vực 1.6"},{"id":"t1q2","n":2,"topic":1,"type":"mcq","stem":{"en":"Your agent needs to insert a new helper function into the middle of a <b class=\"kw\">150-line utility module</b>, between two existing functions. The <b class=\"kw\">Edit tool fails</b> because its old_string parameter <b class=\"kw\">cannot find unique text to match</b> – the file has <b class=\"kw\">repetitive docstrings</b>, variable names, and structural patterns. What&#x27;s the most reliable way to complete this insertion?","vi":"Agent của bạn cần chèn một hàm helper mới vào giữa một module tiện ích <b class=\"kw\">dài 150 dòng</b>, nằm giữa hai hàm hiện có. <b class=\"kw\">Tool Edit thất bại</b> vì tham số old_string của nó <b class=\"kw\">không tìm được đoạn văn bản duy nhất để khớp</b> – file có các docstring, tên biến và mẫu cấu trúc <b class=\"kw\">lặp đi lặp lại</b>. Cách đáng tin cậy nhất để hoàn tất việc chèn này là gì?"},"options":[{"k":"A","t":{"en":"Use <b class=\"kw\">Read to load the file</b>, add the function at the appropriate location, then <b class=\"kw\">Write the updated file</b>","vi":"Dùng <b class=\"kw\">Read để tải file</b>, thêm hàm vào vị trí thích hợp, sau đó dùng <b class=\"kw\">Write để ghi lại file</b> đã cập nhật"}},{"k":"B","t":{"en":"Use Edit&#x27;s <b class=\"kw\">replace_all parameter</b> to target a <b class=\"kw\">common pattern</b> and embed the new function in the replacement text","vi":"Dùng <b class=\"kw\">tham số replace_all</b> của Edit để nhắm vào một <b class=\"kw\">mẫu phổ biến</b> và nhúng hàm mới vào văn bản thay thế"}},{"k":"C","t":{"en":"Use Edit with an <b class=\"kw\">extremely long old_string</b> capturing <b class=\"kw\">30+ lines of context</b> to guarantee uniqueness","vi":"Dùng Edit với một <b class=\"kw\">old_string cực dài</b> bao gồm <b class=\"kw\">30+ dòng context</b> để đảm bảo tính duy nhất"}},{"k":"D","t":{"en":"Use <b class=\"kw\">Bash to append</b> the function definition to the end of the file using <b class=\"kw\">heredoc syntax</b>","vi":"Dùng <b class=\"kw\">Bash để nối thêm</b> định nghĩa hàm vào cuối file bằng <b class=\"kw\">cú pháp heredoc</b>"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Khi <code>Edit</code> thất bại vì <code>old_string</code> không khớp được đoạn văn bản <b>duy nhất</b> (tệp có docstring, tên biến, cấu trúc lặp lại), phương án dự phòng chuẩn là <b>Read + Write</b>: dùng <code>Read</code> nạp toàn bộ tệp, chèn hàm mới vào đúng vị trí giữa hai hàm, rồi <code>Write</code> ghi lại toàn bộ nội dung. Với module chỉ 150 dòng, cách này rẻ, xác định và đảm bảo hàm nằm đúng chỗ.","elim":["<b>B.</b> <code>replace_all</code> thay thế MỌI chỗ khớp; với mẫu lặp lại, hàm mới sẽ bị chèn nhiều lần ở nhiều vị trí, làm hỏng module.","<b>C.</b> <code>old_string</code> dài 30+ dòng rất dễ lệch một ký tự hay khoảng trắng nên Edit vẫn có thể thất bại, và với cấu trúc lặp vẫn không bảo đảm duy nhất — mong manh, không phải cách đáng tin cậy nhất.","<b>D.</b> Nối vào cuối tệp bằng heredoc đặt hàm sai vị trí, trong khi yêu cầu là chèn vào giữa hai hàm hiện có."]},"cite":"Hướng dẫn ôn tập — §13.3 Phương án Dự phòng: Read + Write thay vì Edit; Lĩnh vực 2.5"},{"id":"t1q3","n":3,"topic":1,"type":"mcq","stem":{"en":"An engineer used Claude Code yesterday to investigate authentication flows in a legacy monolith, building up significant context over a 2-hour session. Today she wants to <b class=\"kw\">continue that specific investigation</b>. She&#x27;s worked on <b class=\"kw\">three other codebases since then</b> and knows the <b class=\"kw\">session was named &quot;auth-deep-dive&quot;</b>. How should she resume?","vi":"Hôm qua, một kỹ sư đã dùng Claude Code để điều tra các luồng xác thực (authentication) trong một hệ thống monolith cũ (legacy), tích lũy được lượng context đáng kể qua một session kéo dài 2 giờ. Hôm nay cô ấy muốn <b class=\"kw\">tiếp tục đúng cuộc điều tra đó</b>. Kể từ hôm qua, cô đã làm việc trên <b class=\"kw\">ba codebase khác</b> và biết rằng <b class=\"kw\">session đó được đặt tên là &quot;auth-deep-dive&quot;</b>. Cô ấy nên tiếp tục (resume) như thế nào?"},"options":[{"k":"A","t":{"en":"Use <b class=\"kw\">--resume auth-deep-dive</b> to load that specific session <b class=\"kw\">by name</b>","vi":"Dùng <b class=\"kw\">--resume auth-deep-dive</b> để tải đúng session đó <b class=\"kw\">theo tên</b>"}},{"k":"B","t":{"en":"Use <b class=\"kw\">--session-id with the UUID</b> from yesterday&#x27;s session transcript file","vi":"Dùng <b class=\"kw\">--session-id với UUID</b> lấy từ file bản ghi (transcript) của session hôm qua"}},{"k":"C","t":{"en":"Use <b class=\"kw\">--continue</b> to pick up where the <b class=\"kw\">most recent conversation</b> left off","vi":"Dùng <b class=\"kw\">--continue</b> để tiếp tục từ chỗ <b class=\"kw\">cuộc hội thoại gần đây nhất</b> đã dừng lại"}},{"k":"D","t":{"en":"<b class=\"kw\">Start fresh</b> and <b class=\"kw\">re-read the same files</b>","vi":"<b class=\"kw\">Bắt đầu lại từ đầu</b> và <b class=\"kw\">đọc lại chính các file đó</b>"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> <code>--resume &lt;session-name&gt;</code> nạp lại <b>đúng một phiên đã đặt tên</b> cùng toàn bộ context đã lưu. Kỹ sư biết tên phiên là “auth-deep-dive” và đã làm việc ở ba codebase khác kể từ đó, nên <code>claude --resume auth-deep-dive</code> là cách trực tiếp, chính xác nhất để quay lại cuộc điều tra 2 giờ hôm qua mà không mất context đã tích lũy.","elim":["<b>B.</b> <code>--session-id</code> dùng để chỉ định UUID cho một phiên, không phải cách tự nhiên để tiếp tục phiên đã đặt tên; lục UUID trong file transcript là thủ công và không cần thiết khi đã biết tên phiên.","<b>C.</b> <code>--continue</code> chỉ tiếp tục cuộc hội thoại gần nhất; sau khi làm việc với ba codebase khác, không có gì bảo đảm phiên gần nhất là “auth-deep-dive”.","<b>D.</b> Bắt đầu lại và đọc lại tệp vứt bỏ 2 giờ context đã xây dựng, trong khi phiên vẫn còn và có thể resume được."]},"cite":"Hướng dẫn ôn tập — §5.10 fork_session và Quản lý Session; Lĩnh vực 1.7"},{"id":"t1q4","n":4,"topic":1,"type":"mcq","stem":{"en":"An engineer&#x27;s exploration subagent spent <b class=\"kw\">30 minutes analyzing</b> a legacy payment system, <b class=\"kw\">reading 47 files</b> and documenting data flows. The session was interrupted when the engineer&#x27;s connection dropped. While away, a teammate merged a PR that <b class=\"kw\">renamed two utility functions</b>. The engineer wants to <b class=\"kw\">continue the same exploration</b>. What&#x27;s the most effective approach?","vi":"Subagent khám phá của một kỹ sư đã dành <b class=\"kw\">30 phút phân tích</b> một hệ thống thanh toán cũ (legacy), <b class=\"kw\">đọc 47 file</b> và ghi lại các luồng dữ liệu. Session bị gián đoạn khi kết nối của kỹ sư bị mất. Trong lúc kỹ sư vắng mặt, một đồng đội đã merge một PR <b class=\"kw\">đổi tên hai hàm tiện ích</b>. Kỹ sư muốn <b class=\"kw\">tiếp tục chính cuộc khám phá đó</b>. Cách tiếp cận nào hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Resume the subagent</b> from its previous transcript <b class=\"kw\">without mentioning the changes</b>–the architecture understanding remains valid.","vi":"<b class=\"kw\">Tiếp tục (resume) subagent</b> từ bản ghi (transcript) trước đó mà <b class=\"kw\">không đề cập đến các thay đổi</b>–hiểu biết về kiến trúc vẫn còn hợp lệ."}},{"k":"B","t":{"en":"<b class=\"kw\">Resume the subagent</b> from its previous transcript and <b class=\"kw\">inform it about the renamed functions</b>.","vi":"<b class=\"kw\">Tiếp tục (resume) subagent</b> từ bản ghi (transcript) trước đó và <b class=\"kw\">thông báo cho nó về các hàm đã được đổi tên</b>."}},{"k":"C","t":{"en":"Launch a <b class=\"kw\">fresh subagent</b> and <b class=\"kw\">include the prior transcript</b> in the initial prompt for context.","vi":"Khởi chạy một <b class=\"kw\">subagent mới</b> và <b class=\"kw\">đưa bản ghi (transcript) trước đó</b> vào prompt ban đầu để làm context."}},{"k":"D","t":{"en":"Launch a <b class=\"kw\">fresh subagent</b> with a <b class=\"kw\">summary of prior findings</b>.","vi":"Khởi chạy một <b class=\"kw\">subagent mới</b> kèm theo <b class=\"kw\">bản tóm tắt các phát hiện trước đó</b>."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Hiểu biết kiến trúc và data flow từ 47 tệp vẫn <b>phần lớn còn giá trị</b> — thay đổi chỉ là hai hàm tiện ích bị đổi tên. Resume subagent từ transcript giữ lại 30 phút phân tích, và <b>thông báo cụ thể về các thay đổi</b> giúp nó cập nhật hoặc đọc lại có mục tiêu thay vì tiếp tục dựa vào tên hàm cũ đã lỗi thời. Đây là cân bằng tốt nhất giữa hiệu quả và độ chính xác khi resume.","elim":["<b>A.</b> Không báo về việc đổi tên khiến subagent tiếp tục tham chiếu tên hàm không còn tồn tại; kết quả tool trong transcript đã lỗi thời và dẫn tới kết luận sai.","<b>C.</b> Nhồi toàn bộ transcript cũ vào prompt của subagent mới tốn rất nhiều context, vẫn mang theo thông tin lỗi thời và cũng không báo về thay đổi — kém hơn resume trực tiếp.","<b>D.</b> Bản tóm tắt làm mất nhiều chi tiết data flow đã tích lũy; khởi động mới chỉ đáng khi context suy giảm nặng hoặc codebase đổi lớn, còn ở đây chỉ có hai hàm bị đổi tên."]},"cite":"Hướng dẫn ôn tập — §5.10 fork_session và Quản lý Session; Lĩnh vực 1.7"},{"id":"t1q5","n":5,"topic":1,"type":"mcq","stem":{"en":"Your agent has <b class=\"kw\">spent 25 minutes exploring</b> a game engine&#x27;s rendering subsystem–reading shader code, buffer management, and frame synchronization logic. An engineer now asks it to understand how the <b class=\"kw\">physics engine integrates with rendering</b> for collision debug overlays. You notice recent responses reference <b class=\"kw\">&quot;typical rendering patterns&quot;</b> <b class=\"kw\">rather than the specific VulkanPipeline and FrameGraph classes</b> it discovered earlier. What&#x27;s the most effective approach?","vi":"Agent của bạn đã dành <b class=\"kw\">25 phút khám phá</b> hệ thống con rendering của một game engine–đọc code shader, phần quản lý buffer và logic đồng bộ khung hình (frame). Giờ một kỹ sư yêu cầu nó tìm hiểu cách <b class=\"kw\">physics engine tích hợp với rendering</b> cho các lớp phủ debug va chạm (collision debug overlays). Bạn nhận thấy các phản hồi gần đây nhắc đến <b class=\"kw\">&quot;các mẫu rendering thông thường&quot;</b> <b class=\"kw\">thay vì các lớp VulkanPipeline và FrameGraph cụ thể</b> mà nó đã phát hiện trước đó. Cách tiếp cận nào hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"Use <b class=\"kw\">/clear to reset context completely</b>, then start fresh with physics exploration using file paths from the project&#x27;s CLAUDE.md.","vi":"Dùng <b class=\"kw\">/clear để reset hoàn toàn context</b>, sau đó bắt đầu lại việc khám phá phần physics bằng các đường dẫn file từ CLAUDE.md của dự án."}},{"k":"B","t":{"en":"<b class=\"kw\">Summarize key rendering findings</b>, then <b class=\"kw\">spawn a sub-agent</b> for physics exploration with that summary in its initial context.","vi":"<b class=\"kw\">Tóm tắt các phát hiện chính về rendering</b>, sau đó <b class=\"kw\">khởi tạo một sub-agent</b> để khám phá phần physics với bản tóm tắt đó trong context ban đầu của nó."}},{"k":"C","t":{"en":"Spawn a sub-agent to <b class=\"kw\">explore physics independently</b>, then <b class=\"kw\">manually synthesize its findings</b> with the rendering knowledge accumulated in the main conversation.","vi":"Khởi tạo một sub-agent để <b class=\"kw\">khám phá phần physics một cách độc lập</b>, sau đó <b class=\"kw\">tự tổng hợp thủ công</b> các phát hiện của nó với kiến thức về rendering đã tích lũy trong cuộc hội thoại chính."}},{"k":"D","t":{"en":"<b class=\"kw\">Continue in the current context</b> with <b class=\"kw\">more targeted prompts</b> referencing the specific classes by name.","vi":"<b class=\"kw\">Tiếp tục trong context hiện tại</b> với các <b class=\"kw\">prompt có mục tiêu cụ thể hơn</b>, tham chiếu trực tiếp đến các lớp cụ thể theo tên."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Việc agent nói về “typical rendering patterns” thay vì các lớp cụ thể <code>VulkanPipeline</code>, <code>FrameGraph</code> là dấu hiệu <b>context đã suy giảm</b> sau 25 phút khám phá. Cách hiệu quả: <b>tóm tắt các phát hiện then chốt về rendering</b> (giữ tên lớp, điểm tích hợp) rồi <b>spawn subagent</b> khám phá physics với bản tóm tắt đó trong context ban đầu — subagent có context sạch, đồng thời vẫn biết những gì cần để tìm điểm nối physics–rendering cho collision debug overlay.","elim":["<b>A.</b> <code>/clear</code> xóa sạch toàn bộ hiểu biết rendering, trong khi tác vụ overlay va chạm lại cần chính kiến thức đó; CLAUDE.md không chứa các phát hiện của phiên khám phá.","<b>C.</b> Subagent khám phá độc lập không biết gì về rendering nên khó tìm đúng điểm tích hợp; bước tổng hợp lại dựa vào context chính vốn đã suy giảm.","<b>D.</b> Tiếp tục trong context đã suy giảm và nạp thêm code physics chỉ làm vấn đề tệ hơn; nhắc tên lớp không khôi phục được các chi tiết đã bị mờ."]},"cite":"Hướng dẫn ôn tập — §11.5 Ủy quyền cho Subagent để Bảo vệ Context; Lĩnh vực 5.4"},{"id":"t1q6","n":6,"topic":1,"type":"mcq","stem":{"en":"An engineer asks the agent to <b class=\"kw\">find all callers</b> of a function before removing it. The function is defined in a core library but is also <b class=\"kw\">exposed through wrapper modules that rename the function</b> for domain-specific use (e.g., <b class=\"kw\">calculateTax in the library becomes computeOrderTax</b> in the orders module). What exploration strategy will most reliably identify all callers?","vi":"Một kỹ sư yêu cầu agent <b class=\"kw\">tìm tất cả các nơi gọi</b> (caller) một hàm trước khi xóa hàm đó. Hàm được định nghĩa trong một thư viện lõi nhưng cũng được cung cấp ra ngoài thông qua các <b class=\"kw\">module wrapper đổi tên hàm</b> cho mục đích sử dụng theo từng miền nghiệp vụ (ví dụ: <b class=\"kw\">calculateTax trong thư viện trở thành computeOrderTax</b> trong module orders). Chiến lược khám phá nào sẽ xác định tất cả các caller một cách đáng tin cậy nhất?"},"options":[{"k":"A","t":{"en":"Read the library and wrapper modules to <b class=\"kw\">identify all exposed names</b> for the function, then <b class=\"kw\">Grep for each name</b> across the codebase.","vi":"Đọc thư viện và các module wrapper để <b class=\"kw\">xác định tất cả các tên</b> mà hàm được cung cấp ra ngoài, sau đó dùng <b class=\"kw\">Grep tìm từng tên</b> trên toàn codebase."}},{"k":"B","t":{"en":"Use <b class=\"kw\">Grep</b> to search for the <b class=\"kw\">function&#x27;s original name</b> across the codebase.","vi":"Dùng <b class=\"kw\">Grep</b> để tìm <b class=\"kw\">tên gốc của hàm</b> trên toàn codebase."}},{"k":"C","t":{"en":"Use Grep to <b class=\"kw\">find all files that import</b> from the library or wrapper modules, then <b class=\"kw\">read each file</b> to check whether it uses the function.","vi":"Dùng Grep để <b class=\"kw\">tìm tất cả các file import</b> từ thư viện hoặc các module wrapper, sau đó <b class=\"kw\">đọc từng file</b> để kiểm tra xem file đó có dùng hàm này không."}},{"k":"D","t":{"en":"Search for the function name in <b class=\"kw\">project documentation</b> to understand intended usage patterns and navigate to <b class=\"kw\">documented integration points</b>.","vi":"Tìm tên hàm trong <b class=\"kw\">tài liệu dự án</b> để hiểu các mẫu sử dụng dự kiến và điều hướng đến các <b class=\"kw\">điểm tích hợp đã được tài liệu hóa</b>."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Hàm được export lại qua các wrapper <b>đổi tên</b> (ví dụ <code>calculateTax</code> → <code>computeOrderTax</code>), nên grep một tên duy nhất chắc chắn bỏ sót. Cách đáng tin cậy là <b>đọc thư viện và các wrapper để liệt kê mọi tên được expose</b>, rồi <code>Grep</code> từng tên trên toàn codebase — đúng chiến lược điều tra tăng dần: Read để hiểu cấu trúc, rồi Grep tìm usage.","elim":["<b>B.</b> Chỉ grep tên gốc bỏ sót mọi caller dùng tên wrapper như <code>computeOrderTax</code>; xóa hàm sẽ làm hỏng các caller đó.","<b>C.</b> Thư viện lõi có thể được import ở rất nhiều nơi cho các hàm khác, nên đọc từng file import là tốn context lớn; và vẫn phải biết các tên alias mới nhận ra được cách dùng.","<b>D.</b> Tài liệu dự án thường không đầy đủ hoặc lỗi thời; không thể dựa vào nó để tìm TẤT CẢ caller trước khi xóa hàm."]},"cite":"Hướng dẫn ôn tập — §13.2 Chiến lược Điều tra Tăng dần; Lĩnh vực 2.5"},{"id":"t1q7","n":7,"topic":1,"type":"mcq","stem":{"en":"During testing, you observe that in <b class=\"kw\">extended exploration sessions (30+ minutes)</b>, the agent starts giving <b class=\"kw\">inconsistent answers about code structure it discussed earlier</b>. Engineers report having to <b class=\"kw\">repeat context about modules they&#x27;ve already explored</b>. What&#x27;s the most effective approach to address this?","vi":"Trong quá trình kiểm thử, bạn quan sát thấy trong các <b class=\"kw\">session khám phá kéo dài (30+ phút)</b>, agent bắt đầu đưa ra các <b class=\"kw\">câu trả lời không nhất quán</b> về cấu trúc code mà nó đã thảo luận trước đó. Các kỹ sư cho biết họ <b class=\"kw\">phải lặp lại context</b> về những module họ đã khám phá rồi. Cách tiếp cận nào hiệu quả nhất để giải quyết vấn đề này?"},"options":[{"k":"A","t":{"en":"Implement <b class=\"kw\">automatic context clearing every 15 minutes</b> to ensure the agent starts with fresh, uncontaminated context.","vi":"Triển khai cơ chế <b class=\"kw\">tự động xóa context mỗi 15 phút</b> để đảm bảo agent bắt đầu với context mới, không bị nhiễu."}},{"k":"B","t":{"en":"Switch to a <b class=\"kw\">higher-capacity model tier</b> to provide more context window space for accumulated exploration data.","vi":"Chuyển sang một <b class=\"kw\">cấp mô hình có dung lượng cao hơn</b> để có thêm không gian context window cho dữ liệu khám phá đã tích lũy."}},{"k":"C","t":{"en":"Have the agent maintain a <b class=\"kw\">scratchpad file</b> that <b class=\"kw\">records key findings</b>, referencing it for subsequent questions.","vi":"Để agent duy trì một <b class=\"kw\">file scratchpad</b> <b class=\"kw\">ghi lại các phát hiện chính</b>, và tham chiếu đến file đó cho các câu hỏi tiếp theo."}},{"k":"D","t":{"en":"Create <b class=\"kw\">summaries of all source files</b> before exploration begins, loading only these <b class=\"kw\">compressed representations</b> into context.","vi":"Tạo <b class=\"kw\">bản tóm tắt cho tất cả các file mã nguồn</b> trước khi bắt đầu khám phá, chỉ tải các bản <b class=\"kw\">biểu diễn nén</b> này vào context."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Trong phiên dài 30+ phút, các chi tiết khám phá sớm bị đẩy xa hoặc bị nén trong context, khiến câu trả lời mâu thuẫn. <b>Tệp scratchpad</b> lưu các phát hiện then chốt (lớp, quan hệ, vị trí tệp) <b>bên ngoài context</b>; agent tham chiếu lại khi trả lời thay vì dựa vào trí nhớ hội thoại đã suy giảm hay khám phá lại. Kiến thức này còn tồn tại qua <code>/compact</code> hoặc session mới.","elim":["<b>A.</b> Xóa context mỗi 15 phút phá hủy chính những gì đã khám phá, buộc kỹ sư lặp lại context nhiều hơn — làm trầm trọng đúng vấn đề đang gặp.","<b>B.</b> Context window lớn hơn không khắc phục suy giảm chú ý trên context dài, chỉ trì hoãn; vấn đề là tổ chức thông tin chứ không phải dung lượng.","<b>D.</b> Tóm tắt mọi tệp trước khi khám phá là tốn kém, phần lớn không liên quan đến câu hỏi thực tế, và bản nén làm mất chi tiết cần để trả lời chính xác."]},"cite":"Hướng dẫn ôn tập — §11.4 Tệp Scratchpad; Lĩnh vực 5.4"},{"id":"t1q8","n":8,"topic":1,"type":"mcq","stem":{"en":"After adding an MCP server with specialized code refactoring tools (extract_function, rename_variable, inline_function), you notice the agent <b class=\"kw\">still uses basic text manipulation</b> via Write and Bash sed commands for refactoring tasks. The MCP server is <b class=\"kw\">connected and working</b>. Examining the configuration, you find each MCP tool has a <b class=\"kw\">minimal description</b> like &quot;extract_function: extracts a function from code.&quot; What&#x27;s the most effective way to improve adoption of the MCP refactoring tools?","vi":"Sau khi thêm một MCP server có các tool refactor code chuyên biệt (extract_function, rename_variable, inline_function), bạn nhận thấy agent <b class=\"kw\">vẫn dùng thao tác văn bản cơ bản</b> qua Write và lệnh sed trong Bash cho các tác vụ refactor. MCP server <b class=\"kw\">đã được kết nối và đang hoạt động</b>. Khi kiểm tra cấu hình, bạn thấy mỗi MCP tool chỉ có một <b class=\"kw\">mô tả tối giản</b> như &quot;extract_function: trích xuất một hàm từ code.&quot; Cách hiệu quả nhất để tăng mức độ sử dụng các MCP tool refactor là gì?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Accept this as expected behavior</b> since simpler tools like sed are more predictable than specialized refactoring tools.","vi":"<b class=\"kw\">Chấp nhận đây là hành vi bình thường</b> vì các tool đơn giản như sed dễ dự đoán hơn các tool refactor chuyên biệt."}},{"k":"B","t":{"en":"<b class=\"kw\">Remove the Write tool</b> from the agent&#x27;s configuration for refactoring sessions so it must use the MCP tools for code modifications.","vi":"<b class=\"kw\">Loại bỏ tool Write</b> khỏi cấu hình của agent trong các session refactor để nó buộc phải dùng các MCP tool khi sửa đổi code."}},{"k":"C","t":{"en":"<b class=\"kw\">Enhance the MCP tool descriptions</b> to explain when each tool is preferable to text manipulation and <b class=\"kw\">clarify expected inputs and outputs</b>.","vi":"<b class=\"kw\">Cải thiện mô tả của các MCP tool</b> để giải thích khi nào mỗi tool phù hợp hơn so với thao tác văn bản, đồng thời <b class=\"kw\">làm rõ đầu vào và đầu ra mong đợi</b>."}},{"k":"D","t":{"en":"Implement a <b class=\"kw\">request classifier</b> that detects refactoring intent and <b class=\"kw\">automatically routes</b> those requests to the MCP server before the agent processes them.","vi":"Triển khai một <b class=\"kw\">bộ phân loại request</b> để phát hiện ý định refactor và <b class=\"kw\">tự động định tuyến</b> các request đó đến MCP server trước khi agent xử lý chúng."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Claude chọn tool chủ yếu dựa trên <b>mô tả tool</b> mà nó thấy. Mô tả kiểu “extract_function: extracts a function from code” không nói khi nào nên dùng thay cho <code>Write</code>/<code>sed</code>, cũng không nêu đầu vào/đầu ra, nên agent quay về công cụ quen thuộc. <b>Mở rộng mô tả</b> — nêu rõ khi nào tool ưu việt hơn thao tác văn bản (refactor an toàn theo ngữ nghĩa, tự cập nhật tham chiếu), tham số và kết quả trả về — là cách trực tiếp, đúng gốc rễ để tăng mức sử dụng.","elim":["<b>A.</b> Refactor bằng sed dễ lỗi hơn công cụ hiểu cấu trúc code; nguyên nhân (mô tả sơ sài) hoàn toàn sửa được nên không thể chấp nhận như hành vi bình thường.","<b>B.</b> Gỡ <code>Write</code> là biện pháp thô bạo, làm mất khả năng ghi tệp cho nhu cầu chính đáng khác, và agent vẫn còn Bash sed — không xử lý gốc rễ.","<b>D.</b> Bộ phân loại định tuyến bên ngoài là over-engineering, bỏ qua khả năng chọn tool của agent và tự nó có thể phân loại sai; sửa mô tả tool đơn giản và hiệu quả hơn."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q9","n":9,"topic":1,"type":"mcq","stem":{"en":"An engineer asks the agent to investigate error handling in a legacy payment processing module spanning 15 files. <b class=\"kw\">After reading the first 8 files</b>, the agent&#x27;s responses are becoming <b class=\"kw\">noticeably less accurate</b>—it&#x27;s <b class=\"kw\">forgetting previously discovered code patterns</b> and <b class=\"kw\">hasn&#x27;t yet located all test files</b> or traced the complete data flow. What&#x27;s the most effective approach to complete this investigation?","vi":"Một kỹ sư yêu cầu agent điều tra cách xử lý lỗi trong một module xử lý thanh toán cũ (legacy) trải rộng trên 15 file. <b class=\"kw\">Sau khi đọc 8 file đầu tiên</b>, các phản hồi của agent trở nên <b class=\"kw\">kém chính xác rõ rệt</b>—nó <b class=\"kw\">quên các mẫu code đã phát hiện trước đó</b> và <b class=\"kw\">vẫn chưa tìm ra tất cả các file test</b> hay lần theo được toàn bộ luồng dữ liệu. Cách tiếp cận nào hiệu quả nhất để hoàn tất cuộc điều tra này?"},"options":[{"k":"A","t":{"en":"Use <b class=\"kw\">Grep</b> to search for <b class=\"kw\">specific function names</b> across remaining files, reducing the content loaded into context.","vi":"Dùng <b class=\"kw\">Grep</b> để tìm các <b class=\"kw\">tên hàm cụ thể</b> trong các file còn lại, giảm lượng nội dung được tải vào context."}},{"k":"B","t":{"en":"<b class=\"kw\">Spawn a subagent</b> to explore the remaining files, providing a <b class=\"kw\">summary of discovered patterns</b> as its initial context.","vi":"<b class=\"kw\">Khởi tạo một subagent</b> để khám phá các file còn lại, cung cấp <b class=\"kw\">bản tóm tắt các mẫu đã phát hiện</b> làm context ban đầu cho nó."}},{"k":"C","t":{"en":"<b class=\"kw\">Document a summary of findings</b> so far in a file, then <b class=\"kw\">start fresh with a new context</b> using that summary as reference.","vi":"<b class=\"kw\">Ghi bản tóm tắt các phát hiện</b> cho đến lúc này vào một file, sau đó <b class=\"kw\">bắt đầu lại với một context mới</b>, dùng bản tóm tắt đó làm tài liệu tham chiếu."}},{"k":"D","t":{"en":"Close the current context with <b class=\"kw\">/clear</b> and start fresh, <b class=\"kw\">re-reading only the most critical files</b>.","vi":"Đóng context hiện tại bằng <b class=\"kw\">/clear</b> và bắt đầu lại, <b class=\"kw\">chỉ đọc lại những file quan trọng nhất</b>."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Độ chính xác giảm sau 8 tệp cho thấy <b>context đã quá tải</b>. Spawn <b>subagent</b> với context sạch để khám phá các tệp còn lại (tìm test, lần data flow), kèm <b>bản tóm tắt các mẫu đã phát hiện</b> làm context ban đầu: phần đọc tệp nặng nề diễn ra trong context riêng của subagent, nó chỉ trả về kết quả cô đọng, còn agent chính giữ được các phát hiện trước đó để tổng hợp.","elim":["<b>A.</b> Grep giảm lượng nạp nhưng không khắc phục context đã suy giảm; lần data flow và tìm test cần đọc hiểu chứ không chỉ khớp tên hàm.","<b>C.</b> Khởi động lại với bản tóm tắt làm agent chính mất toàn bộ chi tiết đã đọc, và nó vẫn phải tự đọc các tệp còn lại trong cùng một context nên sẽ lại suy giảm; subagent cô lập phần việc tốt hơn.","<b>D.</b> <code>/clear</code> xóa sạch phát hiện mà không lưu lại gì, buộc đọc lại tệp và lặp lại công việc đã làm."]},"cite":"Hướng dẫn ôn tập — §11.5 Ủy quyền cho Subagent để Bảo vệ Context; Lĩnh vực 5.4"},{"id":"t1q10","n":10,"topic":1,"type":"mcq","stem":{"en":"An engineer <b class=\"kw\">used the agent yesterday</b> to analyze a legacy authentication module, identifying <b class=\"kw\">two distinct refactoring approaches</b>: extracting a microservice versus refactoring in-place. Today, they want to <b class=\"kw\">explore both approaches in depth</b>–having the agent propose specific code changes for each–<b class=\"kw\">before deciding which to implement</b>. What&#x27;s the most effective way to structure this exploration?","vi":"<b class=\"kw\">Hôm qua</b>, một kỹ sư đã dùng agent để phân tích một module xác thực cũ (legacy), xác định được <b class=\"kw\">hai hướng refactor khác biệt</b>: tách ra một microservice so với refactor tại chỗ (in-place). Hôm nay, họ muốn <b class=\"kw\">khám phá sâu cả hai hướng</b>–để agent đề xuất các thay đổi code cụ thể cho từng hướng–<b class=\"kw\">trước khi quyết định triển khai hướng nào</b>. Cách hiệu quả nhất để tổ chức việc khám phá này là gì?"},"options":[{"k":"A","t":{"en":"Start <b class=\"kw\">two fresh sessions</b>, <b class=\"kw\">manually providing a summary</b> of yesterday&#x27;s analysis findings to establish context.","vi":"Bắt đầu <b class=\"kw\">hai session mới</b>, <b class=\"kw\">tự cung cấp thủ công bản tóm tắt</b> các phát hiện từ phân tích hôm qua để thiết lập context."}},{"k":"B","t":{"en":"<b class=\"kw\">Resume yesterday&#x27;s session</b> to explore the first approach, then start a <b class=\"kw\">new session for the second</b>, manually recreating the original context.","vi":"<b class=\"kw\">Tiếp tục (resume) session hôm qua</b> để khám phá hướng thứ nhất, sau đó bắt đầu một <b class=\"kw\">session mới cho hướng thứ hai</b>, tự tái tạo thủ công context ban đầu."}},{"k":"C","t":{"en":"Use <b class=\"kw\">fork_session</b> to create <b class=\"kw\">two branches</b> from yesterday&#x27;s analysis, exploring one approach in each fork.","vi":"Dùng <b class=\"kw\">fork_session</b> để tạo <b class=\"kw\">hai nhánh</b> từ phân tích hôm qua, khám phá một hướng trong mỗi nhánh (fork)."}},{"k":"D","t":{"en":"<b class=\"kw\">Resume yesterday&#x27;s session</b> and explore <b class=\"kw\">both approaches sequentially</b> within the same conversation thread.","vi":"<b class=\"kw\">Tiếp tục (resume) session hôm qua</b> và khám phá <b class=\"kw\">lần lượt cả hai hướng</b> trong cùng một luồng hội thoại."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> <code>fork_session</code> tạo các <b>nhánh độc lập từ cùng một điểm context</b>: cả hai fork kế thừa toàn bộ phân tích hôm qua về module xác thực, sau đó phân kỳ — một nhánh đề xuất code cho hướng tách microservice, nhánh kia cho refactor tại chỗ. Mỗi hướng được khám phá sâu mà không ảnh hưởng nhau, và không phải dựng lại context thủ công.","elim":["<b>A.</b> Tóm tắt thủ công làm mất chi tiết phân tích hôm qua và tốn công, trong khi phiên gốc vẫn tồn tại để fork.","<b>B.</b> Phiên thứ hai phải dựng lại context thủ công nên có context kém hơn phiên thứ nhất — so sánh hai hướng không công bằng và tốn công.","<b>D.</b> Khám phá tuần tự trong cùng luồng khiến hướng thứ nhất ảnh hưởng (anchor) hướng thứ hai, đồng thời làm context phình to và chất lượng phần sau giảm."]},"cite":"Hướng dẫn ôn tập — §5.10 fork_session và Quản lý Session; Lĩnh vực 1.7"},{"id":"t1q11","n":11,"topic":1,"type":"mcq","stem":{"en":"Your agent has analyzed a complex service module–<b class=\"kw\">reading 23 source files</b>, tracing request flows, and identifying error handling patterns. A developer wants to <b class=\"kw\">compare two testing strategies</b> before committing to one: end-to-end tests with mocked external services vs. snapshot tests capturing expected outputs. They need to <b class=\"kw\">independently develop both approaches</b> to evaluate trade-offs. How should you manage the sessions?","vi":"Agent của bạn đã phân tích một module service phức tạp–<b class=\"kw\">đọc 23 file mã nguồn</b>, lần theo các luồng request và xác định các mẫu xử lý lỗi. Một lập trình viên muốn <b class=\"kw\">so sánh hai chiến lược kiểm thử</b> trước khi chọn một: test end-to-end với các service bên ngoài được mock so với snapshot test ghi lại đầu ra mong đợi. Họ cần <b class=\"kw\">phát triển độc lập cả hai cách tiếp cận</b> để đánh giá các đánh đổi (trade-off). Bạn nên quản lý các session như thế nào?"},"options":[{"k":"A","t":{"en":"Resume the analysis session with <b class=\"kw\">fork_session enabled</b>, creating a <b class=\"kw\">separate branch for each</b> testing strategy.","vi":"Tiếp tục (resume) session phân tích với <b class=\"kw\">fork_session được bật</b>, tạo một <b class=\"kw\">nhánh riêng cho mỗi</b> chiến lược kiểm thử."}},{"k":"B","t":{"en":"<b class=\"kw\">Export the analysis session&#x27;s key findings</b> to a file, then create <b class=\"kw\">two new sessions</b> that reference this file.","vi":"<b class=\"kw\">Xuất các phát hiện chính của session phân tích</b> ra một file, sau đó tạo <b class=\"kw\">hai session mới</b> tham chiếu đến file này."}},{"k":"C","t":{"en":"<b class=\"kw\">Continue in the original session</b>, developing end-to-end tests first, then snapshot tests <b class=\"kw\">sequentially</b>.","vi":"<b class=\"kw\">Tiếp tục trong session ban đầu</b>, phát triển test end-to-end trước, rồi <b class=\"kw\">lần lượt</b> đến snapshot test."}},{"k":"D","t":{"en":"Start <b class=\"kw\">two fresh sessions</b>, having each <b class=\"kw\">re-read the relevant source files</b> before beginning.","vi":"Bắt đầu <b class=\"kw\">hai session mới</b>, để mỗi session <b class=\"kw\">đọc lại các file mã nguồn liên quan</b> trước khi bắt đầu."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Cần phát triển <b>độc lập</b> hai chiến lược kiểm thử nhưng cả hai đều dựa trên cùng một phân tích (23 tệp, luồng request, mẫu xử lý lỗi). Resume phiên phân tích với <code>fork_session</code> tạo <b>mỗi chiến lược một nhánh</b>: cả hai kế thừa đầy đủ context đến điểm phân nhánh rồi phân kỳ, nên có thể so sánh trade-off công bằng mà không phải phân tích lại.","elim":["<b>B.</b> Xuất key findings ra tệp chỉ giữ bản tóm lược; hai phiên mới mất phần lớn context chi tiết về 23 tệp và luồng request.","<b>C.</b> Làm tuần tự trong cùng phiên khiến chiến lược sau bị ảnh hưởng bởi code và quyết định của chiến lược trước — không độc lập — và context phình to.","<b>D.</b> Hai phiên mới đọc lại toàn bộ tệp lặp lại công việc phân tích đã làm, tốn gấp đôi thời gian và token."]},"cite":"Hướng dẫn ôn tập — §5.10 fork_session và Quản lý Session; Lĩnh vực 1.7"},{"id":"t1q12","n":12,"topic":1,"type":"mcq","stem":{"en":"Your codebase exploration tool stores session IDs to allow engineers to continue investigations across work sessions. An engineer <b class=\"kw\">spent an hour yesterday</b> analyzing a legacy authentication module, building context about its architecture and dependencies. They want to continue today. The <b class=\"kw\">session ID is valid</b>, but version control shows <b class=\"kw\">3 of the 12 files</b> the agent previously read were modified overnight by a teammate&#x27;s merge. What approach best <b class=\"kw\">balances efficiency and accuracy</b>?","vi":"Tool khám phá codebase của bạn lưu trữ session ID để cho phép kỹ sư tiếp tục các cuộc điều tra qua nhiều phiên làm việc. Hôm qua, một kỹ sư đã <b class=\"kw\">dành một giờ phân tích</b> một module xác thực cũ (legacy), xây dựng context về kiến trúc và các phụ thuộc của nó. Họ muốn tiếp tục vào hôm nay. <b class=\"kw\">Session ID vẫn hợp lệ</b>, nhưng hệ thống quản lý phiên bản cho thấy <b class=\"kw\">3 trong số 12 file</b> mà agent đã đọc trước đó đã bị sửa đổi qua đêm bởi một lần merge của đồng đội. Cách tiếp cận nào <b class=\"kw\">cân bằng tốt nhất giữa hiệu quả và độ chính xác</b>?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Resume the session</b> and immediately have the agent <b class=\"kw\">re-read all 12</b> previously analyzed files","vi":"<b class=\"kw\">Tiếp tục (resume) session</b> và ngay lập tức để agent <b class=\"kw\">đọc lại toàn bộ 12 file</b> đã phân tích trước đó"}},{"k":"B","t":{"en":"<b class=\"kw\">Start a fresh session</b> to ensure the agent works with current codebase state without stale assumptions","vi":"<b class=\"kw\">Bắt đầu một session mới</b> để đảm bảo agent làm việc với trạng thái hiện tại của codebase mà không mang theo các giả định đã lỗi thời"}},{"k":"C","t":{"en":"<b class=\"kw\">Resume the session</b> and inform the agent <b class=\"kw\">which specific files changed</b> for targeted re-analysis","vi":"<b class=\"kw\">Tiếp tục (resume) session</b> và thông báo cho agent biết <b class=\"kw\">những file cụ thể nào đã thay đổi</b> để phân tích lại có trọng tâm"}},{"k":"D","t":{"en":"<b class=\"kw\">Resume the session</b> <b class=\"kw\">without informing the agent</b> about the changed files","vi":"<b class=\"kw\">Tiếp tục (resume) session</b> <b class=\"kw\">mà không thông báo cho agent</b> về các file đã thay đổi"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Chỉ 3/12 tệp thay đổi, nên phần lớn context hôm qua vẫn đúng. <b>Resume</b> giữ lại một giờ phân tích, và <b>báo rõ những tệp nào đã thay đổi</b> để agent <b>phân tích lại có mục tiêu</b> đúng 3 tệp đó, tránh dựa vào kết quả tool lỗi thời. Đây là điểm cân bằng giữa hiệu quả và độ chính xác.","elim":["<b>A.</b> Đọc lại cả 12 tệp lãng phí vì 9 tệp không đổi, và làm phình context không cần thiết.","<b>B.</b> Phiên mới vứt bỏ một giờ phân tích trong khi khoảng 75% vẫn còn hợp lệ — quá thận trọng, kém hiệu quả.","<b>D.</b> Không báo khiến agent tiếp tục tin vào nội dung cũ của 3 tệp đã bị sửa, dẫn đến kết luận sai."]},"cite":"Hướng dẫn ôn tập — §5.10 fork_session và Quản lý Session; Lĩnh vực 1.7"},{"id":"t1q13","n":13,"topic":1,"type":"mcq","stem":{"en":"An engineer asks the agent to understand how the caching layer works before adding a new cache invalidation trigger. After initial Grep searches, the agent has identified that caching logic <b class=\"kw\">spans 15 files</b> including <b class=\"kw\">decorators, middleware, and service classes</b> (<b class=\"kw\">~8,000 lines total</b>). What&#x27;s the most effective next step for building understanding while <b class=\"kw\">managing context constraints</b>?","vi":"Một kỹ sư yêu cầu agent tìm hiểu cách tầng caching hoạt động trước khi thêm một trigger vô hiệu hóa cache (cache invalidation) mới. Sau các lần tìm kiếm bằng Grep ban đầu, agent đã xác định rằng logic caching <b class=\"kw\">trải rộng trên 15 file</b> gồm các <b class=\"kw\">decorator, middleware và lớp service</b> (tổng cộng <b class=\"kw\">~8,000 dòng</b>). Bước tiếp theo nào hiệu quả nhất để xây dựng hiểu biết trong khi vẫn <b class=\"kw\">quản lý được các giới hạn về context</b>?"},"options":[{"k":"A","t":{"en":"Use the Read tool to <b class=\"kw\">sequentially load all 15 files</b>, building complete understanding across the full caching implementation.","vi":"Dùng tool Read để <b class=\"kw\">lần lượt tải toàn bộ 15 file</b>, xây dựng hiểu biết đầy đủ về toàn bộ phần triển khai caching."}},{"k":"B","t":{"en":"<b class=\"kw\">Analyze imports and class hierarchies</b> to identify the <b class=\"kw\">base cache class</b>, Read that file to understand the interface, then trace specific invalidation implementations.","vi":"<b class=\"kw\">Phân tích các import và cây phân cấp lớp</b> để xác định <b class=\"kw\">lớp cache cơ sở</b>, dùng Read đọc file đó để hiểu interface, sau đó lần theo các triển khai invalidation cụ thể."}},{"k":"C","t":{"en":"Use <b class=\"kw\">Grep</b> to search for &quot;invalidate&quot; and &quot;expire&quot; patterns across all files, then <b class=\"kw\">Read only those specific line ranges</b> with minimal surrounding context.","vi":"Dùng <b class=\"kw\">Grep</b> để tìm các mẫu &quot;invalidate&quot; và &quot;expire&quot; trên tất cả các file, sau đó <b class=\"kw\">chỉ Read đúng các khoảng dòng</b> đó với rất ít context xung quanh."}},{"k":"D","t":{"en":"Use <b class=\"kw\">Glob</b> to find files matching common caching patterns (cache.py, caching/), <b class=\"kw\">prioritize the largest files</b> by reading them first, then check smaller files for gaps.","vi":"Dùng <b class=\"kw\">Glob</b> để tìm các file khớp với các mẫu đặt tên caching phổ biến (cache.py, caching/), <b class=\"kw\">ưu tiên đọc các file lớn nhất</b> trước, sau đó kiểm tra các file nhỏ hơn để bổ sung phần còn thiếu."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> 15 tệp ~8.000 dòng — nạp tất cả sẽ chiếm phần lớn context. Cách hiệu quả là <b>điều tra tăng dần theo cấu trúc</b>: phân tích import và cây kế thừa để tìm <b>lớp cache cơ sở</b>, đọc nó để nắm <b>interface/hợp đồng chung</b>, rồi lần theo các implementation invalidation cụ thể. Hiểu khung kiến trúc trước rồi mới đi vào chi tiết liên quan tới trigger mới, nên chỉ nạp những gì thực sự cần.","elim":["<b>A.</b> Đọc tuần tự toàn bộ 8.000 dòng làm đầy context, gây suy giảm, và phần lớn nội dung không liên quan tới việc thêm một trigger.","<b>C.</b> Chỉ đọc vài dòng quanh “invalidate”/“expire” cho ra các mảnh rời rạc, thiếu hiểu biết về interface và luồng tổng thể, đồng thời bỏ sót logic dùng tên khác.","<b>D.</b> Kích thước tệp không phản ánh tầm quan trọng; đọc tệp lớn nhất trước là heuristic tùy tiện và tốn context."]},"cite":"Hướng dẫn ôn tập — §13.2 Chiến lược Điều tra Tăng dần; Lĩnh vực 5.4"},{"id":"t1q14","n":14,"topic":1,"type":"mcq","stem":{"en":"An engineer who just joined the team asks the agent to help them <b class=\"kw\">understand the authentication and authorization architecture</b> before making security improvements. The codebase has <b class=\"kw\">800+ files across multiple services</b>. What exploration strategy will most effectively build understanding, given Claude <b class=\"kw\">built-in tools and context limits</b>?","vi":"Một kỹ sư vừa gia nhập nhóm yêu cầu agent giúp họ <b class=\"kw\">hiểu kiến trúc xác thực</b> (authentication) và phân quyền (authorization) trước khi thực hiện các cải tiến bảo mật. Codebase có <b class=\"kw\">800+ file trải trên nhiều service</b>. Với các tool tích hợp sẵn của Claude và <b class=\"kw\">giới hạn context</b>, chiến lược khám phá nào sẽ xây dựng hiểu biết hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Read all files containing</b> &quot;auth&quot;, &quot;login&quot;, &quot;permission&quot;, or &quot;token&quot; in their content or filename.","vi":"<b class=\"kw\">Đọc tất cả các file có chứa</b> &quot;auth&quot;, &quot;login&quot;, &quot;permission&quot; hoặc &quot;token&quot; trong nội dung hoặc tên file."}},{"k":"B","t":{"en":"Read any <b class=\"kw\">CLAUDE.md and README files</b> first, then <b class=\"kw\">ask the engineer</b> to specify which 10-15 files are most important for understanding the auth system.","vi":"Đọc các file <b class=\"kw\">CLAUDE.md và README</b> (nếu có) trước, sau đó <b class=\"kw\">yêu cầu kỹ sư</b> chỉ ra 10-15 file nào quan trọng nhất để hiểu hệ thống auth."}},{"k":"C","t":{"en":"Use Grep to find <b class=\"kw\">authentication entry points</b>, read those files, then <b class=\"kw\">follow imports and function calls</b> to map the auth flow incrementally.","vi":"Dùng Grep để tìm các <b class=\"kw\">điểm vào (entry point) của luồng xác thực</b>, đọc các file đó, sau đó <b class=\"kw\">lần theo các import và lời gọi hàm</b> để lập bản đồ luồng auth một cách tăng dần."}},{"k":"D","t":{"en":"Launch <b class=\"kw\">parallel subagents</b> to explore different services simultaneously, then <b class=\"kw\">synthesize their findings</b> into an architectural overview.","vi":"Khởi chạy <b class=\"kw\">song song các subagent</b> để khám phá đồng thời các service khác nhau, sau đó <b class=\"kw\">tổng hợp các phát hiện</b> của chúng thành một bản tổng quan kiến trúc."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Với 800+ tệp, không thể đọc hết. Chiến lược đúng là <b>điều tra tăng dần</b>: dùng <code>Grep</code> tìm <b>điểm vào xác thực</b> (middleware auth, route login, decorator phân quyền), đọc các tệp đó, rồi <b>lần theo import và lời gọi hàm</b> để vẽ dần luồng auth. Hiểu biết được xây theo quan hệ thực trong code và chỉ nạp các tệp liên quan, phù hợp giới hạn context.","elim":["<b>A.</b> Từ khóa phổ biến như “token”, “auth” xuất hiện ở hàng trăm tệp (kể cả token parser, OAuth client...), làm tràn context với nhiều kết quả nhiễu.","<b>B.</b> Đọc CLAUDE.md/README trước là hợp lý, nhưng bắt kỹ sư MỚI vào nhóm chỉ ra 10–15 tệp quan trọng là không thực tế — đó chính là điều họ đang cần agent giúp tìm hiểu.","<b>D.</b> Chia subagent theo service phân mảnh theo ranh giới tổ chức chứ không theo luồng auth xuyên service; tốn kém khi chưa biết phạm vi và khó ghép thành bức tranh luồng thống nhất."]},"cite":"Hướng dẫn ôn tập — §13.2 Chiến lược Điều tra Tăng dần; Lĩnh vực 2.5"},{"id":"t1q15","n":15,"topic":1,"type":"mcq","stem":{"en":"After integrating a local MCP server providing code analysis tools (analyze_dependencies, find_dead_code, calculate_complexity), you notice the agent <b class=\"kw\">continues to use Grep</b> to inspect dependencies even when users <b class=\"kw\">explicitly ask about &quot;code dependencies&quot;</b>. Tool definitions reveal: analyze_dependencies <b class=\"kw\">returns a dependency graph by analyzing imports</b>. What&#x27;s the most effective approach to improve the agent&#x27;s selection of MCP tools?","vi":"Sau khi tích hợp một MCP server cục bộ cung cấp các tool phân tích code (analyze_dependencies, find_dead_code, calculate_complexity), bạn nhận thấy agent vẫn <b class=\"kw\">tiếp tục dùng Grep</b> để kiểm tra các phụ thuộc ngay cả khi người dùng <b class=\"kw\">hỏi rõ ràng về &quot;các phụ thuộc trong code&quot;</b>. Các định nghĩa tool cho thấy: analyze_dependencies <b class=\"kw\">trả về một đồ thị phụ thuộc</b> bằng cách phân tích các import. Cách tiếp cận nào hiệu quả nhất để cải thiện việc agent lựa chọn MCP tool?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Split analyze_dependencies into granular tools</b>: list_imports, detect_transitive_deps, identify_circular_deps to avoid overlap with Grep.","vi":"<b class=\"kw\">Tách analyze_dependencies thành các tool chi tiết hơn</b>: list_imports, detect_transitive_deps, identify_circular_deps để tránh chồng chéo với Grep."}},{"k":"B","t":{"en":"<b class=\"kw\">Expand MCP tool descriptions and outputs</b>–e.g., &quot;Builds dependency graph with list_imports, direct_circular_deps&quot;–to clearly distinguish dependencies and cycle analysis from Grep.","vi":"<b class=\"kw\">Mở rộng mô tả và đầu ra của MCP tool</b>–ví dụ: &quot;Xây dựng đồ thị phụ thuộc với list_imports, direct_circular_deps&quot;–để phân biệt rõ việc phân tích phụ thuộc và chu trình với Grep."}},{"k":"C","t":{"en":"<b class=\"kw\">Remove Grep</b> from the available tools to eliminate functional overlap.","vi":"<b class=\"kw\">Loại bỏ Grep</b> khỏi các tool khả dụng để loại bỏ sự chồng chéo về chức năng."}},{"k":"D","t":{"en":"Add <b class=\"kw\">routing questions to the system prompt</b> specifying that dependency-related questions should use MCP tools rather than Grep.","vi":"Thêm các <b class=\"kw\">câu hỏi định tuyến
