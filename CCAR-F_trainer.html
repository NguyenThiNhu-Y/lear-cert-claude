vào system prompt</b>, quy định rằng các câu hỏi liên quan đến phụ thuộc nên dùng MCP tool thay vì Grep."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Agent vẫn dùng <code>Grep</code> vì mô tả <code>analyze_dependencies</code> không cho thấy giá trị khác biệt so với tìm kiếm văn bản. <b>Mở rộng mô tả tool và mô tả đầu ra</b> (trả về dependency graph, phụ thuộc trực tiếp/bắc cầu, phát hiện vòng phụ thuộc) giúp Claude <b>phân biệt rõ</b> khi nào nên dùng tool phân tích thay vì Grep. Mô tả tool là tín hiệu chính để Claude chọn tool.","elim":["<b>A.</b> Tách thành nhiều tool nhỏ tăng số lượng tool cần chọn; nếu mô tả vẫn sơ sài thì vấn đề chọn tool vẫn còn — sự chồng chéo với Grep không phải nguyên nhân gốc.","<b>C.</b> Gỡ Grep loại bỏ công cụ tìm kiếm nội dung thiết yếu cho rất nhiều tác vụ khác chỉ để ép dùng một tool.","<b>D.</b> Quy tắc định tuyến trong system prompt là giải pháp vòng, kém tin cậy hơn sửa trực tiếp mô tả tool — nơi Claude thực sự đánh giá khả năng của từng tool."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q16","n":16,"topic":1,"type":"mcq","stem":{"en":"Your extraction pipeline processes contracts that frequently include amendments. When a contract contains <b class=\"kw\">both original terms and later amendments</b> (e.g., original clause specifies &quot;30-day payment terms&quot; while Amendment 1 changes this to &quot;45 days&quot;), the model <b class=\"kw\">inconsistently extracts one value or the other</b> with <b class=\"kw\">no indication of which applies</b>. What&#x27;s the most effective approach to improve extraction accuracy for documents with amendments?","vi":"Pipeline trích xuất của bạn xử lý các hợp đồng thường xuyên có phụ lục sửa đổi (amendment). Khi một hợp đồng chứa <b class=\"kw\">cả điều khoản gốc lẫn các sửa đổi về sau</b> (ví dụ: điều khoản gốc quy định &quot;thời hạn thanh toán 30 ngày&quot; trong khi Phụ lục sửa đổi 1 đổi thành &quot;45 ngày&quot;), mô hình trích xuất <b class=\"kw\">không nhất quán giá trị này hoặc giá trị kia</b> mà <b class=\"kw\">không cho biết giá trị nào được áp dụng</b>. Cách tiếp cận nào hiệu quả nhất để cải thiện độ chính xác trích xuất cho các tài liệu có sửa đổi?"},"options":[{"k":"A","t":{"en":"Add <b class=\"kw\">prompt instructions</b> to always extract the <b class=\"kw\">most recent amendment value</b> and ignore superseded original terms.","vi":"Thêm <b class=\"kw\">hướng dẫn vào prompt</b> để luôn trích xuất <b class=\"kw\">giá trị của lần sửa đổi gần nhất</b> và bỏ qua các điều khoản gốc đã bị thay thế."}},{"k":"B","t":{"en":"Implement <b class=\"kw\">post-extraction validation</b> using <b class=\"kw\">pattern matching</b> to detect amendments and flag those extractions for manual review.","vi":"Triển khai bước <b class=\"kw\">kiểm tra hợp lệ (validation) sau trích xuất</b> bằng <b class=\"kw\">so khớp mẫu (pattern matching)</b> để phát hiện các sửa đổi và gắn cờ những kết quả trích xuất đó để review thủ công."}},{"k":"C","t":{"en":"<b class=\"kw\">Redesign the schema</b> so amended fields <b class=\"kw\">capture multiple values</b>, each with source location and effective date.","vi":"<b class=\"kw\">Thiết kế lại schema</b> để các trường bị sửa đổi <b class=\"kw\">ghi nhận được nhiều giá trị</b>, mỗi giá trị kèm vị trí trong nguồn và ngày có hiệu lực."}},{"k":"D","t":{"en":"<b class=\"kw\">Preprocess documents with a classifier</b> that identifies and <b class=\"kw\">removes superseded sections</b> before the main extraction step.","vi":"<b class=\"kw\">Tiền xử lý tài liệu bằng một bộ phân loại</b> để xác định và <b class=\"kw\">loại bỏ các phần đã bị thay thế</b> trước bước trích xuất chính."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Hợp đồng thực sự chứa <b>nhiều giá trị hợp lệ cho cùng một trường theo thời gian</b>; schema chỉ cho một giá trị buộc model chọn tùy tiện. Thiết kế lại để trường bị sửa đổi lưu <b>nhiều giá trị, mỗi giá trị kèm vị trí nguồn và ngày hiệu lực</b> bảo toàn đầy đủ thông tin và provenance, để downstream xác định giá trị nào áp dụng tại thời điểm nào — thay vì mất dữ liệu một cách im lặng.","elim":["<b>A.</b> “Luôn lấy sửa đổi mới nhất” làm mất dấu vết điều khoản gốc và sai khi sửa đổi có ngày hiệu lực tương lai hoặc chỉ áp dụng một phần; không còn thông tin để kiểm chứng.","<b>B.</b> Chỉ gắn cờ review thủ công sau khi đã trích xuất không cải thiện độ chính xác của bản thân việc trích xuất, lại tăng tải cho con người.","<b>D.</b> Bộ phân loại xóa phần bị thay thế thêm một bước dễ sai, có thể xóa nhầm và làm mất lịch sử điều khoản cần cho kiểm toán."]},"cite":"Hướng dẫn ôn tập — §12.2 Xử lý Dữ liệu Xung đột; Lĩnh vực 4.3"},{"id":"t1q17","n":17,"topic":1,"type":"mcq","stem":{"en":"After deployment, you find that <b class=\"kw\">12% of extractions contain semantic errors</b> that <b class=\"kw\">pass JSON schema validation</b> (e.g., a duration like &quot;30 minutes&quot; incorrectly placed in an ingredient quantity field). Human reviewers have <b class=\"kw\">capacity to check only 20%</b> of extractions. Which approach most effectively <b class=\"kw\">allocates reviewer attention</b>?","vi":"Sau khi deploy, bạn phát hiện <b class=\"kw\">12% kết quả trích xuất chứa lỗi ngữ nghĩa</b> nhưng vẫn <b class=\"kw\">vượt qua kiểm tra hợp lệ (validation) JSON schema</b> (ví dụ: một khoảng thời gian như &quot;30 minutes&quot; bị đặt sai vào trường số lượng nguyên liệu). Người review <b class=\"kw\">chỉ có đủ năng lực kiểm tra 20%</b> kết quả trích xuất. Cách tiếp cận nào <b class=\"kw\">phân bổ sự chú ý của người review</b> hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Randomly sample 20%</b> of extractions for review, using corrections to track accuracy and identify error patterns.","vi":"<b class=\"kw\">Lấy mẫu ngẫu nhiên 20%</b> kết quả trích xuất để review, dùng các bản sửa để theo dõi độ chính xác và xác định các mẫu lỗi."}},{"k":"B","t":{"en":"Review all extractions from documents with <b class=\"kw\">formatting anomalies</b> such as unusual layouts or mixed content types.","vi":"Review tất cả kết quả trích xuất từ các tài liệu có <b class=\"kw\">định dạng bất thường</b>, chẳng hạn bố cục lạ hoặc nhiều loại nội dung trộn lẫn."}},{"k":"C","t":{"en":"Have the model output <b class=\"kw\">field-level confidence scores</b>, then <b class=\"kw\">calibrate review thresholds</b> using a labeled validation set.","vi":"Yêu cầu mô hình xuất <b class=\"kw\">confidence score ở cấp độ từng trường</b>, sau đó <b class=\"kw\">hiệu chỉnh các ngưỡng review</b> bằng một tập validation đã được gắn nhãn."}},{"k":"D","t":{"en":"Prioritize review of all extractions where <b class=\"kw\">required fields are empty</b> or explicitly marked as not found.","vi":"Ưu tiên review tất cả các kết quả trích xuất có <b class=\"kw\">trường bắt buộc bị trống</b> hoặc được đánh dấu rõ là không tìm thấy."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Lỗi ngữ nghĩa (như “30 minutes” nằm trong trường số lượng nguyên liệu) vượt qua schema validation, nên cần một tín hiệu chất lượng <b>ở cấp trường</b>. Cho model xuất <b>confidence score theo trường</b>, rồi <b>hiệu chỉnh ngưỡng bằng tập validation có nhãn</b> (vì confidence thô chưa chắc khớp độ chính xác thực), giúp dồn 20% năng lực review vào đúng những trích xuất có khả năng sai cao nhất.","elim":["<b>A.</b> Lấy mẫu ngẫu nhiên tốt cho đo lường độ chính xác nhưng không phân bổ theo rủi ro — chỉ bắt được khoảng 20% số lỗi.","<b>B.</b> Dị thường định dạng chỉ là một yếu tố rủi ro; lỗi đặt giá trị sai trường vẫn xảy ra ở tài liệu định dạng bình thường.","<b>D.</b> Trường trống/“not found” là lỗi thiếu dữ liệu, còn vấn đề ở đây là giá trị đã điền nhưng sai — tiêu chí này bỏ sót đúng loại lỗi cần bắt."]},"cite":"Hướng dẫn ôn tập — §9.4 Hiệu chỉnh độ tin cậy và giám sát của con người; Lĩnh vực 5.5"},{"id":"t1q18","n":18,"topic":1,"type":"mcq","stem":{"en":"Your extraction pipeline processes invoices and extracts line items, tax amounts, and grand totals. You discover that <b class=\"kw\">8% of documents</b> have extracted line item amounts that <b class=\"kw\">don&#x27;t sum to the extracted grand total</b>—the <b class=\"kw\">downstream accounting system has been detecting mismatches</b>. What&#x27;s the most effective improvement?","vi":"Pipeline trích xuất của bạn xử lý hóa đơn và trích xuất các dòng mục (line item), số tiền thuế và tổng cộng cuối cùng (grand total). Bạn phát hiện <b class=\"kw\">8% tài liệu</b> có tổng số tiền các line item được trích xuất <b class=\"kw\">không khớp với grand total được trích xuất</b>—hệ thống kế toán hạ nguồn liên tục <b class=\"kw\">phát hiện các sai lệch</b>. Cải tiến nào hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"Extract line items and totals <b class=\"kw\">independently</b>, then use a <b class=\"kw\">separate validation model</b> to reconcile discrepancies.","vi":"Trích xuất line item và các tổng <b class=\"kw\">một cách độc lập</b>, sau đó dùng một <b class=\"kw\">mô hình kiểm tra hợp lệ riêng</b> để đối soát các sai lệch."}},{"k":"B","t":{"en":"Implement post-processing that <b class=\"kw\">automatically adjusts line item amounts</b> when the extracted total doesn&#x27;t match the sum.","vi":"Triển khai bước hậu xử lý <b class=\"kw\">tự động điều chỉnh số tiền của các line item</b> khi tổng được trích xuất không khớp với tổng cộng các khoản."}},{"k":"C","t":{"en":"Add <b class=\"kw\">few-shot examples</b> to the system prompt where extracted line items correctly sum to demonstrate the desired extraction behavior.","vi":"Thêm các <b class=\"kw\">ví dụ few-shot</b> vào system prompt trong đó các line item được trích xuất cộng lại đúng bằng tổng, để minh họa hành vi trích xuất mong muốn."}},{"k":"D","t":{"en":"Add a <b class=\"kw\">calculated_total field</b> where the model extracts line items independently, then validate totals alongside a <b class=\"kw\">is_total_consistent boolean flag</b> for human review when values differ.","vi":"Thêm một <b class=\"kw\">trường calculated_total</b> trong đó mô hình trích xuất các line item một cách độc lập, sau đó kiểm tra hợp lệ các tổng cùng với một <b class=\"kw\">cờ boolean is_total_consistent</b> để chuyển sang review của con người khi các giá trị khác nhau."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Đây là mẫu <b>tự kiểm tra (self-correction)</b> cho lỗi ngữ nghĩa: model trích xuất line items và tổng in trên hóa đơn độc lập, đồng thời tính <code>calculated_total</code> từ line items; cờ <code>is_total_consistent</code> cho biết hai giá trị có khớp không. Khi không khớp, bản ghi được <b>chuyển con người review</b> — lỗi được phát hiện ngay tại pipeline thay vì để hệ thống kế toán downstream bắt, và dữ liệu không bị sửa âm thầm.","elim":["<b>A.</b> Thêm một model thẩm định riêng tăng chi phí và độ phức tạp; việc “hòa giải” tự động cũng không biết giá trị nào mới đúng.","<b>B.</b> Tự động chỉnh line items cho khớp tổng là làm sai lệch dữ liệu — có khi chính tổng bị trích xuất sai; nó che giấu lỗi thay vì phát hiện.","<b>C.</b> Few-shot có thể giảm lỗi phần nào nhưng không có cơ chế phát hiện và gắn cờ các trường hợp vẫn sai."]},"cite":"Hướng dẫn ôn tập — §6.6 Tự sửa lỗi (Self-correction); Lĩnh vực 4.4"},{"id":"t1q19","n":19,"topic":1,"type":"mcq","stem":{"en":"Your pipeline uses a tool called extract_metadata with a JSON schema for paper details. During testing, the agent <b class=\"kw\">sometimes fails to call extract_metadata</b> because it <b class=\"kw\">wants to provide direct answers</b>. What&#x27;s the <b class=\"kw\">most reliable way</b> to ensure metadata extraction <b class=\"kw\">always happens first</b>?","vi":"Pipeline của bạn dùng một tool tên là extract_metadata với một JSON schema cho thông tin chi tiết của bài báo khoa học. Trong quá trình kiểm thử, agent <b class=\"kw\">đôi khi không gọi extract_metadata</b> vì nó <b class=\"kw\">muốn đưa ra câu trả lời trực tiếp</b>. Cách <b class=\"kw\">đáng tin cậy nhất</b> để đảm bảo việc trích xuất metadata <b class=\"kw\">luôn diễn ra trước tiên</b> là gì?"},"options":[{"k":"A","t":{"en":"Set <b class=\"kw\">tool_choice to &quot;auto&quot;</b> in the API call, combined with tools so that Claude <b class=\"kw\">always prioritizes metadata</b> before any other tool calls.","vi":"Đặt <b class=\"kw\">tool_choice thành &quot;auto&quot;</b> trong lệnh gọi API, kết hợp với tools để Claude <b class=\"kw\">luôn ưu tiên metadata</b> trước mọi tool call khác."}},{"k":"B","t":{"en":"Set <b class=\"kw\">tool_choice to &quot;auto&quot;</b> and <b class=\"kw\">reorder the tool definitions</b> placing extract_metadata first since Claude prioritizes earlier-listed tools.","vi":"Đặt <b class=\"kw\">tool_choice thành &quot;auto&quot;</b> và <b class=\"kw\">sắp xếp lại các định nghĩa tool</b>, đặt extract_metadata lên đầu vì Claude ưu tiên các tool được liệt kê trước."}},{"k":"C","t":{"en":"Set tool_choice to <b class=\"kw\">type &quot;tool&quot;, name &quot;extract_metadata&quot;</b> and process the enrichment requests in <b class=\"kw\">subsequent turns</b> after receiving the extracted metadata.","vi":"Đặt tool_choice với <b class=\"kw\">type &quot;tool&quot;, name &quot;extract_metadata&quot;</b> và xử lý các yêu cầu bổ sung thông tin (enrichment) ở <b class=\"kw\">các lượt tiếp theo</b> sau khi nhận được metadata đã trích xuất."}},{"k":"D","t":{"en":"Set tool_choice to <b class=\"kw\">type &quot;any&quot;</b> so Claude must use a tool, combined with <b class=\"kw\">system prompt instructions</b> to call extract_metadata first.","vi":"Đặt tool_choice với <b class=\"kw\">type &quot;any&quot;</b> để Claude bắt buộc phải dùng một tool, kết hợp với <b class=\"kw\">hướng dẫn trong system prompt</b> yêu cầu gọi extract_metadata trước."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Đặt <code>tool_choice</code> dạng <code>{\"type\": \"tool\", \"name\": \"extract_metadata\"}</code> <b>buộc Claude gọi đúng tool đó</b> ở lượt này — không thể trả lời trực tiếp hay gọi tool khác. Sau khi nhận metadata, các bước enrichment được xử lý ở các lượt tiếp theo. Đây là bảo đảm ở mức API, khác hẳn chỉ dẫn trong prompt vốn mang tính xác suất.","elim":["<b>A.</b> <code>auto</code> để model tự quyết có gọi tool hay không — chính là chế độ đang cho phép model trả lời trực tiếp, không bảo đảm gì.","<b>B.</b> Thứ tự định nghĩa tool không phải cơ chế ưu tiên được bảo đảm; với <code>auto</code> model vẫn có thể bỏ qua tool.","<b>D.</b> <code>any</code> buộc gọi MỘT tool nào đó nhưng không chỉ định tool nào; việc gọi <code>extract_metadata</code> trước vẫn chỉ dựa vào system prompt."]},"cite":"Hướng dẫn ôn tập — §2.3 Tham số tool_choice; Lĩnh vực 2.3"},{"id":"t1q20","n":20,"topic":1,"type":"mcq","stem":{"en":"After your daily batch of 10,000 documents completes, <b class=\"kw\">300 documents (3%) failed</b> with <b class=\"kw\">&quot;context_length_exceeded&quot;</b> errors. The results file <b class=\"kw\">identifies each failure by custom_id</b>. What&#x27;s the <b class=\"kw\">most cost-effective</b> approach to process these failures?","vi":"Sau khi batch hằng ngày gồm 10,000 tài liệu hoàn tất, có <b class=\"kw\">300 tài liệu (3%) thất bại</b> với lỗi <b class=\"kw\">&quot;context_length_exceeded&quot;</b>. File kết quả <b class=\"kw\">xác định từng tài liệu lỗi theo custom_id</b>. Cách tiếp cận nào <b class=\"kw\">hiệu quả về chi phí nhất</b> để xử lý các tài liệu lỗi này?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Resubmit only the 300 failed documents</b> after <b class=\"kw\">chunking them into smaller pieces</b>, then combine the partial extractions","vi":"<b class=\"kw\">Chỉ gửi lại 300 tài liệu thất bại</b> sau khi <b class=\"kw\">chia chúng thành các phần (chunk) nhỏ hơn</b>, sau đó kết hợp các kết quả trích xuất từng phần"}},{"k":"B","t":{"en":"<b class=\"kw\">Increase the max_tokens parameter</b> for the 300 failed documents and resubmit them in a new batch","vi":"<b class=\"kw\">Tăng tham số max_tokens</b> cho 300 tài liệu thất bại và gửi lại chúng trong một batch mới"}},{"k":"C","t":{"en":"<b class=\"kw\">Reprocess the entire batch</b> with <b class=\"kw\">prompt caching</b> enabled to reduce the cost of retrying requests with identical system prompts","vi":"<b class=\"kw\">Xử lý lại toàn bộ batch</b> với <b class=\"kw\">prompt caching</b> được bật để giảm chi phí retry các request có system prompt giống hệt nhau"}},{"k":"D","t":{"en":"Resubmit the <b class=\"kw\">entire 10,000 document batch</b> using a model tier with a <b class=\"kw\">larger context window</b>","vi":"Gửi lại <b class=\"kw\">toàn bộ batch 10,000 tài liệu</b> bằng một cấp mô hình có <b class=\"kw\">context window lớn hơn</b>"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> <code>context_length_exceeded</code> nghĩa là <b>đầu vào quá dài</b> so với context window. Dùng <code>custom_id</code> để xác định đúng 300 tài liệu lỗi, <b>chia nhỏ chúng thành các đoạn</b> vừa context, chỉ gửi lại những tài liệu này (vẫn có thể qua batch để hưởng giảm 50%) rồi gộp các kết quả từng phần. Không xử lý lại 9.700 tài liệu đã thành công.","elim":["<b>B.</b> <code>max_tokens</code> giới hạn ĐẦU RA; tăng nó không giải quyết đầu vào vượt context window, thậm chí còn làm tổng token yêu cầu lớn hơn.","<b>C.</b> Xử lý lại toàn bộ batch lãng phí 9.700 tài liệu đã thành công, và prompt caching không làm tài liệu ngắn đi nên 300 tài liệu vẫn lỗi.","<b>D.</b> Gửi lại toàn bộ 10.000 tài liệu cho một vấn đề chỉ 3% là cực kỳ tốn kém; model có context lớn hơn cũng chưa chắc đủ cho các tài liệu quá dài."]},"cite":"Hướng dẫn ôn tập — §7.4 Xử lý các thất bại trong Batch; Lĩnh vực 4.5"},{"id":"t1q21","n":21,"topic":1,"type":"mcq","stem":{"en":"Your extraction system parses e-commerce product descriptions to extract specifications like dimensions, weight, and materials into JSON. <b class=\"kw\">Despite having a well-defined schema</b>, the model <b class=\"kw\">inconsistently extracts the &quot;materials&quot; field</b>–sometimes returning <b class=\"kw\">&quot;cotton blend&quot;, other times &quot;Cotton/Polyester mix&quot;</b>, and <b class=\"kw\">occasionally omitting the field</b> when material information is clearly present in the source. What&#x27;s the most effective way to improve extraction consistency?","vi":"Hệ thống trích xuất của bạn phân tích mô tả sản phẩm thương mại điện tử để trích xuất các thông số như kích thước, trọng lượng và chất liệu thành JSON. <b class=\"kw\">Mặc dù có schema được định nghĩa rõ ràng</b>, mô hình <b class=\"kw\">trích xuất trường &quot;materials&quot; không nhất quán</b>–đôi khi trả về <b class=\"kw\">&quot;cotton blend&quot;, lúc khác là &quot;Cotton/Polyester mix&quot;</b>, và <b class=\"kw\">thỉnh thoảng bỏ sót trường này</b> dù thông tin chất liệu hiện diện rõ ràng trong nguồn. Cách hiệu quả nhất để cải thiện tính nhất quán của việc trích xuất là gì?"},"options":[{"k":"A","t":{"en":"Switch to a <b class=\"kw\">more capable model tier</b> since inconsistent extraction indicates insufficient model capability","vi":"Chuyển sang một <b class=\"kw\">cấp mô hình mạnh hơn</b> vì trích xuất không nhất quán cho thấy năng lực của mô hình chưa đủ"}},{"k":"B","t":{"en":"Add <b class=\"kw\">few-shot examples</b> showing 2-3 complete input-output pairs with <b class=\"kw\">standardized material description formats</b>","vi":"Thêm các <b class=\"kw\">ví dụ few-shot</b> gồm 2-3 cặp đầu vào-đầu ra hoàn chỉnh với <b class=\"kw\">định dạng mô tả chất liệu được chuẩn hóa</b>"}},{"k":"C","t":{"en":"Set <b class=\"kw\">temperature to 0</b> to eliminate randomness and ensure deterministic outputs","vi":"Đặt <b class=\"kw\">temperature bằng 0</b> để loại bỏ tính ngẫu nhiên và đảm bảo đầu ra tất định"}},{"k":"D","t":{"en":"Make the <b class=\"kw\">&quot;materials&quot; field required</b> instead of optional in the schema to force the model to always extract a value","vi":"Đặt <b class=\"kw\">trường &quot;materials&quot; thành bắt buộc</b> thay vì tùy chọn trong schema để buộc mô hình luôn trích xuất một giá trị"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Schema định nghĩa cấu trúc nhưng không truyền đạt được <b>định dạng chuẩn hóa mong muốn</b> hay ranh giới khi nào phải trích xuất. <b>Few-shot 2–3 cặp input–output đầy đủ</b> cho model thấy cụ thể cách viết vật liệu thống nhất (ví dụ cùng một kiểu cho “cotton blend”/“Cotton/Polyester mix”) và cho thấy phải điền trường khi thông tin có mặt. Few-shot là kỹ thuật hiệu quả nhất để tăng tính nhất quán của đầu ra.","elim":["<b>A.</b> Sự bất nhất đến từ việc thiếu đặc tả định dạng, không phải năng lực model; model mạnh hơn vẫn không biết bạn muốn chuẩn nào.","<b>C.</b> <code>temperature</code> 0 giảm ngẫu nhiên nhưng không định nghĩa chuẩn định dạng; các mô tả nguồn khác nhau vẫn cho ra cách viết khác nhau.","<b>D.</b> Bắt buộc trường khiến model bịa giá trị khi sản phẩm thật sự không ghi vật liệu, và không giải quyết chuyện định dạng không thống nhất."]},"cite":"Hướng dẫn ôn tập — §6.1 Few-shot Prompting; Lĩnh vực 4.2"},{"id":"t1q22","n":22,"topic":1,"type":"mcq","stem":{"en":"Your system extracts event metadata (date, location, organizer, attendee_count) from news articles using a JSON schema with <b class=\"kw\">all nullable fields</b>. During evaluation, you observe the model frequently generates <b class=\"kw\">plausible but incorrect values</b> for <b class=\"kw\">fields not mentioned in the article</b>–for example, outputting &quot;500&quot; for attendee_count when the <b class=\"kw\">source contains no attendance information</b>. What&#x27;s the most effective way to reduce these false extractions?","vi":"Hệ thống của bạn trích xuất metadata của sự kiện (date, location, organizer, attendee_count) từ các bài báo tin tức bằng một JSON schema trong đó <b class=\"kw\">tất cả các trường đều nullable</b>. Trong quá trình đánh giá, bạn quan sát thấy mô hình thường tạo ra các giá trị <b class=\"kw\">nghe có vẻ hợp lý nhưng sai</b> cho những trường <b class=\"kw\">không được đề cập trong bài báo</b>–ví dụ: xuất ra &quot;500&quot; cho attendee_count khi <b class=\"kw\">nguồn không chứa bất kỳ thông tin nào</b> về số người tham dự. Cách hiệu quả nhất để giảm những trích xuất sai này là gì?"},"options":[{"k":"A","t":{"en":"Make <b class=\"kw\">all schema fields required (non-nullable)</b> with strict validation rules to ensure the model only outputs verifiable data.","vi":"Đặt <b class=\"kw\">tất cả các trường trong schema thành bắt buộc (non-nullable)</b> với các quy tắc kiểm tra hợp lệ nghiêm ngặt để đảm bảo mô hình chỉ xuất ra dữ liệu có thể kiểm chứng."}},{"k":"B","t":{"en":"Upgrade to a <b class=\"kw\">more capable model tier</b> with improved instruction-following to reduce hallucination tendencies.","vi":"Nâng cấp lên một <b class=\"kw\">cấp mô hình mạnh hơn</b> với khả năng tuân thủ hướng dẫn tốt hơn để giảm xu hướng ảo giác (hallucination)."}},{"k":"C","t":{"en":"Add a post-processing step using a <b class=\"kw\">second LLM call</b> to <b class=\"kw\">verify each extracted value</b> exists in the source document.","vi":"Thêm một bước hậu xử lý dùng một <b class=\"kw\">lệnh gọi LLM thứ hai</b> để <b class=\"kw\">xác minh rằng từng giá trị</b> được trích xuất có tồn tại trong tài liệu nguồn."}},{"k":"D","t":{"en":"Add <b class=\"kw\">prompt instructions</b> to <b class=\"kw\">return null</b> for any field where information is not directly stated in the source.","vi":"Thêm <b class=\"kw\">hướng dẫn vào prompt</b> để <b class=\"kw\">trả về null</b> cho bất kỳ trường nào mà thông tin không được nêu trực tiếp trong nguồn."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Schema đã cho phép null nhưng model không biết <b>khi nào</b> nên dùng null, nên điền giá trị “hợp lý” như “500”. Chỉ dẫn tường minh <b>trả về null cho mọi trường không được nêu trực tiếp trong nguồn</b> đặt ra tiêu chí rõ ràng và cho model một “lối thoát” hợp lệ thay vì hallucinate. Đây là cách rẻ, đúng gốc rễ.","elim":["<b>A.</b> Bắt buộc non-nullable làm vấn đề tệ hơn: model buộc phải điền giá trị ngay cả khi bài báo không có thông tin, tăng bịa đặt.","<b>B.</b> Model mạnh hơn vẫn có xu hướng điền giá trị khi không có tiêu chí rõ; vấn đề là thiếu chỉ dẫn chứ không phải năng lực.","<b>C.</b> Lời gọi LLM thứ hai tăng gấp đôi chi phí và độ trễ chỉ để bắt triệu chứng; nên ngăn ngay từ prompt trích xuất."]},"cite":"Hướng dẫn ôn tập — §2.4 JSON Schema cho Structured Output; Lĩnh vực 4.1"},{"id":"t1q23","n":23,"topic":1,"type":"mcq","stem":{"en":"After implementing tool use with strict schema definitions, <b class=\"kw\">JSON syntax errors are eliminated</b>, but 5% of extractions still have valid JSON with <b class=\"kw\">empty arrays or null values for required fields</b> like citations and methodology. Spot-checking reveals that <b class=\"kw\">source documents contain this information</b>, but <b class=\"kw\">in varied formats</b>–inline citations vs. bibliographies, methodology sections vs. details embedded in introductions. What&#x27;s the most effective way to address these failures?","vi":"Sau khi triển khai tool use với các định nghĩa schema nghiêm ngặt, <b class=\"kw\">lỗi cú pháp JSON đã được loại bỏ</b>, nhưng 5% kết quả trích xuất vẫn là JSON hợp lệ với <b class=\"kw\">mảng rỗng hoặc giá trị null</b> cho các trường bắt buộc như citations và methodology. Kiểm tra ngẫu nhiên cho thấy <b class=\"kw\">tài liệu nguồn có chứa thông tin này</b>, nhưng <b class=\"kw\">ở các định dạng khác nhau</b>–trích dẫn nội dòng (inline) so với danh mục tài liệu tham khảo, phần phương pháp luận riêng so với các chi tiết được lồng trong phần giới thiệu. Cách hiệu quả nhất để giải quyết những lỗi này là gì?"},"options":[{"k":"A","t":{"en":"Build a <b class=\"kw\">regex-based post-processing layer</b> that scans source documents for citation patterns and methodology keywords, populating empty fields when the model fails to extract.","vi":"Xây dựng một <b class=\"kw\">tầng hậu xử lý dựa trên regex</b> để quét tài liệu nguồn tìm các mẫu trích dẫn và từ khóa phương pháp luận, điền vào các trường trống khi mô hình không trích xuất được."}},{"k":"B","t":{"en":"Modify your schema to make <b class=\"kw\">citations and methodology optional</b>, and <b class=\"kw\">flag incomplete records</b> for manual review rather than failing validation.","vi":"Sửa schema để <b class=\"kw\">citations và methodology thành tùy chọn</b>, và <b class=\"kw\">gắn cờ các bản ghi chưa đầy đủ</b> để review thủ công thay vì để kiểm tra hợp lệ thất bại."}},{"k":"C","t":{"en":"Add <b class=\"kw\">few-shot examples</b> demonstrating extractions from documents with <b class=\"kw\">varied structures</b>–showing how to identify citations in different formats and locate methodology details across section types.","vi":"Thêm các <b class=\"kw\">ví dụ few-shot</b> minh họa việc trích xuất từ các tài liệu có <b class=\"kw\">cấu trúc đa dạng</b>–cho thấy cách nhận diện trích dẫn ở các định dạng khác nhau và xác định vị trí chi tiết phương pháp luận trong nhiều loại phần (section) khác nhau."}},{"k":"D","t":{"en":"Implement <b class=\"kw\">retry logic</b> that re-sends requests when validation detects empty required fields.","vi":"Triển khai <b class=\"kw\">logic retry</b> gửi lại request khi bước kiểm tra hợp lệ phát hiện trường bắt buộc bị trống."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Thông tin thực sự có trong nguồn nhưng ở <b>nhiều định dạng khác nhau</b> (trích dẫn nội dòng vs thư mục cuối bài; phương pháp ở mục riêng vs lồng trong phần giới thiệu), và model không nhận ra chúng. <b>Few-shot từ các tài liệu có cấu trúc đa dạng</b> dạy model cách nhận diện và định vị thông tin trong từng biến thể — giải quyết đúng gốc rễ là khả năng nhận diện, không chỉ xử lý triệu chứng.","elim":["<b>A.</b> Regex mong manh trước chính sự đa dạng định dạng đã làm model thất bại, và không thể nhận ra “phương pháp nằm trong phần giới thiệu” vốn cần hiểu ngữ nghĩa.","<b>B.</b> Biến trường thành optional che giấu lỗi và đẩy gánh nặng sang con người, trong khi thông tin thực sự có trong tài liệu.","<b>D.</b> Retry không kèm hướng dẫn mới về cách tìm thông tin ở định dạng lạ thường cho kết quả lặp lại; model thiếu cách nhận diện chứ không gặp lỗi ngẫu nhiên."]},"cite":"Hướng dẫn ôn tập — §6.1 Few-shot Prompting; Lĩnh vực 4.2"},{"id":"t1q24","n":24,"topic":1,"type":"mcq","stem":{"en":"Your extraction system implements automatic retries when validation fails. On each retry, the <b class=\"kw\">specific validation error is appended</b> to the prompt. This retry-with-error-feedback approach <b class=\"kw\">resolves most failures within 2-3 attempts</b> For which failure pattern would additional retries be <b class=\"kw\">LEAST effective</b>?","vi":"Hệ thống trích xuất của bạn tự động retry khi kiểm tra hợp lệ (validation) thất bại. Ở mỗi lần retry, <b class=\"kw\">lỗi validation cụ thể được nối thêm vào prompt</b>. Cách retry kèm phản hồi lỗi này giải quyết được <b class=\"kw\">hầu hết các lỗi trong vòng 2-3 lần thử</b>. Với kiểu lỗi nào thì việc retry thêm sẽ <b class=\"kw\">KÉM hiệu quả NHẤT</b>?"},"options":[{"k":"A","t":{"en":"The model extracts citation counts as <b class=\"kw\">locale-formatted strings</b> (&quot;1,234&quot;) when the schema requires <b class=\"kw\">integers</b>","vi":"Mô hình trích xuất số lượng trích dẫn dưới dạng <b class=\"kw\">chuỗi định dạng theo locale</b> (&quot;1,234&quot;) trong khi schema yêu cầu <b class=\"kw\">số nguyên</b>"}},{"k":"B","t":{"en":"The model extracts keywords as a <b class=\"kw\">nested object</b> organized by category when the schema requires a <b class=\"kw\">flat array of strings</b>","vi":"Mô hình trích xuất từ khóa dưới dạng một <b class=\"kw\">object lồng nhau</b> được tổ chức theo danh mục trong khi schema yêu cầu một <b class=\"kw\">mảng chuỗi phẳng</b>"}},{"k":"C","t":{"en":"The model extracts <b class=\"kw\">&quot;et al.&quot;</b> for co-authors when the full list exists only in an <b class=\"kw\">external document not in the input</b>","vi":"Mô hình trích xuất <b class=\"kw\">&quot;et al.&quot;</b> cho các đồng tác giả trong khi danh sách đầy đủ chỉ tồn tại trong một <b class=\"kw\">tài liệu bên ngoài không có trong đầu vào</b>"}},{"k":"D","t":{"en":"The model extracts dates as <b class=\"kw\">ISO 8601 datetime strings</b> (&quot;2023-03-15T00:00:00Z&quot;) when the schema requires <b class=\"kw\">only the date portion</b> (YYYY-MM-DD)","vi":"Mô hình trích xuất ngày dưới dạng <b class=\"kw\">chuỗi datetime ISO 8601</b> (&quot;2023-03-15T00:00:00Z&quot;) trong khi schema <b class=\"kw\">chỉ yêu cầu phần ngày</b> (YYYY-MM-DD)"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Retry-with-error-feedback hiệu quả khi lỗi là <b>định dạng hoặc cấu trúc</b> mà model có thể tự sửa bằng thông tin <b>đã có trong input</b>. Danh sách đồng tác giả đầy đủ chỉ nằm trong <b>tài liệu bên ngoài, không có trong input</b> — dù retry bao nhiêu lần, model cũng không thể tạo ra thông tin nó không có; cách đúng là đánh dấu thiếu hoặc cung cấp thêm nguồn.","elim":["<b>A.</b> Đổi “1,234” thành số nguyên 1234 là lỗi định dạng đơn giản; thông báo lỗi chỉ rõ yêu cầu integer nên retry sửa được dễ dàng.","<b>B.</b> Object lồng theo danh mục vs mảng phẳng là lỗi cấu trúc; dữ liệu đã có sẵn, phản hồi lỗi giúp model làm phẳng — retry hiệu quả.","<b>D.</b> Cắt ISO datetime về <code>YYYY-MM-DD</code> là chỉnh định dạng trực tiếp; retry kèm lỗi giải quyết ngay."]},"cite":"Hướng dẫn ôn tập — §6.5 Validation và Retry-with-Feedback; Lĩnh vực 4.4"},{"id":"t1q25","n":25,"topic":1,"type":"mcq","stem":{"en":"Your extraction pipeline processes restaurant menus and <b class=\"kw\">must output structured JSON</b> with fields for item names, descriptions, prices, and dietary tags. Some menus use <b class=\"kw\">inconsistent formatting</b>–<b class=\"kw\">prices as &quot;$12&quot; vs &quot;12.00&quot;</b>, dietary info as <b class=\"kw\">icons vs text</b>. What&#x27;s the most reliable approach?","vi":"Pipeline trích xuất của bạn xử lý thực đơn nhà hàng và <b class=\"kw\">phải xuất ra JSON có cấu trúc</b> với các trường cho tên món, mô tả, giá và nhãn chế độ ăn (dietary tags). Một số thực đơn dùng <b class=\"kw\">định dạng không nhất quán</b>–giá ghi là <b class=\"kw\">&quot;$12&quot; so với &quot;12.00&quot;</b>, thông tin chế độ ăn dưới dạng <b class=\"kw\">biểu tượng so với văn bản</b>. Cách tiếp cận nào đáng tin cậy nhất?"},"options":[{"k":"A","t":{"en":"Define a <b class=\"kw\">strict output schema</b> and include <b class=\"kw\">format normalization rules</b> in your prompt.","vi":"Định nghĩa một <b class=\"kw\">schema đầu ra nghiêm ngặt</b> và đưa các <b class=\"kw\">quy tắc chuẩn hóa định dạng</b> vào prompt."}},{"k":"B","t":{"en":"Use <b class=\"kw\">separate extraction calls for each field</b> to ensure consistent handling of each type.","vi":"Dùng các <b class=\"kw\">lệnh gọi trích xuất riêng cho từng trường</b> để đảm bảo xử lý nhất quán cho mỗi loại."}},{"k":"C","t":{"en":"<b class=\"kw\">Extract data as-is</b> and normalize formats in <b class=\"kw\">post-processing code</b> after Claude returns.","vi":"<b class=\"kw\">Trích xuất dữ liệu nguyên trạng</b> và chuẩn hóa định dạng bằng <b class=\"kw\">code hậu xử lý</b> sau khi Claude trả về kết quả."}},{"k":"D","t":{"en":"Request <b class=\"kw\">multiple extraction attempts</b> per document and select the <b class=\"kw\">most common format</b>.","vi":"Yêu cầu <b class=\"kw\">nhiều lần trích xuất</b> cho mỗi tài liệu và chọn <b class=\"kw\">định dạng xuất hiện nhiều nhất</b>."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Kết hợp <b>schema đầu ra chặt chẽ</b> (cấu trúc, kiểu dữ liệu: giá là số, dietary tags là danh sách chuẩn) với <b>quy tắc chuẩn hóa trong prompt</b> (ví dụ “$12” và “12.00” đều thành 12.00; biểu tượng lá thành “vegetarian”). Claude hiểu ngữ cảnh nên chuẩn hóa được cả biểu tượng lẫn văn bản đa dạng ngay trong một lần gọi, cho đầu ra nhất quán và đáng tin cậy.","elim":["<b>B.</b> Mỗi trường một lời gọi nhân chi phí lên nhiều lần, mất liên kết giữa tên món–giá–tag, và tự nó không chuẩn hóa định dạng.","<b>C.</b> Code hậu xử lý khó diễn giải biểu tượng/mô tả ăn kiêng đa dạng vốn cần hiểu ngữ nghĩa, và bộ quy tắc phải liên tục mở rộng; Claude làm được việc này ngay khi trích xuất.","<b>D.</b> Trích xuất nhiều lần rồi bỏ phiếu tốn chi phí gấp nhiều lần và không định nghĩa định dạng chuẩn — định dạng phổ biến nhất vẫn có thể sai chuẩn."]},"cite":"Hướng dẫn ôn tập — §2.4 JSON Schema cho Structured Output; Lĩnh vực 4.3"},{"id":"t1q26","n":26,"topic":1,"type":"mcq","stem":{"en":"Your extraction uses tool use with a JSON schema where property_type is defined as an enum: [&#x27;house&#x27;, &#x27;apartment&#x27;, &#x27;condo&#x27;, &#x27;townhouse&#x27;]. After deployment, <b class=\"kw\">8% of extractions fail schema validation</b>. Investigation reveals listings mention <b class=\"kw\">many uncommon property types</b> –&quot;studio&quot;, &quot;loft&quot;, &quot;duplex&quot;, &quot;mobile home&quot;, &quot;tiny house&quot;, &quot;converted warehouse&quot;–and <b class=\"kw\">new types continue appearing regularly</b>. What&#x27;s the most effective <b class=\"kw\">long-term solution</b>?","vi":"Việc trích xuất của bạn dùng tool use với một JSON schema trong đó property_type được định nghĩa là một enum: [&#x27;house&#x27;, &#x27;apartment&#x27;, &#x27;condo&#x27;, &#x27;townhouse&#x27;]. Sau khi deploy, 8% kết quả trích xuất <b class=\"kw\">không vượt qua kiểm tra hợp lệ schema</b>. Điều tra cho thấy các tin đăng nhắc đến <b class=\"kw\">nhiều loại bất động sản ít phổ biến</b> –&quot;studio&quot;, &quot;loft&quot;, &quot;duplex&quot;, &quot;mobile home&quot;, &quot;tiny house&quot;, &quot;converted warehouse&quot;–và <b class=\"kw\">các loại mới vẫn tiếp tục xuất hiện thường xuyên</b>. <b class=\"kw\">Giải pháp dài hạn</b> hiệu quả nhất là gì?"},"options":[{"k":"A","t":{"en":"Add an <b class=\"kw\">&quot;other&quot; value</b> to your enum with a separate <b class=\"kw\">property_type_detail string field</b> for specifics when &quot;other&quot; is selected.","vi":"Thêm <b class=\"kw\">giá trị &quot;other&quot;</b> vào enum cùng với một <b class=\"kw\">trường chuỗi property_type_detail</b> riêng để ghi chi tiết khi &quot;other&quot; được chọn."}},{"k":"B","t":{"en":"Add <b class=\"kw\">few-shot examples</b> to your prompt demonstrating how to map unexpected property types to the <b class=\"kw\">closest existing enum value</b>.","vi":"Thêm các <b class=\"kw\">ví dụ few-shot</b> vào prompt minh họa cách ánh xạ các loại bất động sản ngoài dự kiến sang <b class=\"kw\">giá trị enum hiện có gần nhất</b>."}},{"k":"C","t":{"en":"Change property_type from an enum to a <b class=\"kw\">free-form string</b> and implement a <b class=\"kw\">normalization step</b> in post-processing.","vi":"Đổi property_type từ enum sang <b class=\"kw\">chuỗi tự do (free-form string)</b> và triển khai một <b class=\"kw\">bước chuẩn hóa</b> trong hậu xử lý."}},{"k":"D","t":{"en":"<b class=\"kw\">Continuously expand the enum</b> to include newly observed property types and add monitoring for additional edge cases.","vi":"<b class=\"kw\">Liên tục mở rộng enum</b> để bao gồm các loại bất động sản mới được ghi nhận và bổ sung giám sát cho các edge case khác."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Mẫu <b>enum có giá trị “other” + trường chi tiết</b> (<code>property_type_detail</code>) giữ được chuẩn hóa cho các loại phổ biến, đồng thời mọi loại mới (“loft”, “tiny house”...) vẫn hợp lệ với schema và không mất thông tin. Khi loại mới xuất hiện liên tục, đây là giải pháp bền vững lâu dài mà không cần sửa schema mỗi lần.","elim":["<b>B.</b> Ép “loft” hay “converted warehouse” về giá trị gần nhất làm sai lệch, mất thông tin; và loại mới vẫn liên tục phát sinh.","<b>C.</b> Chuỗi tự do bỏ mất lợi ích ràng buộc của enum cho các loại phổ biến và đẩy toàn bộ việc chuẩn hóa sang hậu xử lý phải bảo trì liên tục.","<b>D.</b> Liên tục mở rộng enum là cuộc chạy đuổi không hồi kết — giữa các lần cập nhật vẫn có lỗi validation."]},"cite":"Hướng dẫn ôn tập — §2.4 JSON Schema cho Structured Output; Lĩnh vực 4.3"},{"id":"t1q27","n":27,"topic":1,"type":"mcq","stem":{"en":"Your system has been operating with 100% human review for 3 months. Analysis shows that extractions with <b class=\"kw\">model confidence &gt;90%</b> have <b class=\"kw\">97% accuracy overall</b>. To reduce reviewer workload, you plan to <b class=\"kw\">automate high-confidence extractions</b> <b class=\"kw\">Before deploying</b>, what validation step is most critical?","vi":"Hệ thống của bạn đã vận hành với 100% review của con người trong 3 tháng. Phân tích cho thấy các kết quả trích xuất có <b class=\"kw\">confidence của mô hình &gt;90%</b> đạt <b class=\"kw\">độ chính xác tổng thể 97%</b>. Để giảm khối lượng công việc của người review, bạn dự định <b class=\"kw\">tự động hóa các kết quả trích xuất có confidence cao</b>. <b class=\"kw\">Trước khi deploy</b>, bước kiểm tra hợp lệ (validation) nào là quan trọng nhất?"},"options":[{"k":"A","t":{"en":"Run a <b class=\"kw\">two-week pilot</b> routing 25% of high-confidence extractions directly to downstream systems and <b class=\"kw\">monitor error reports</b>.","vi":"Chạy <b class=\"kw\">thử nghiệm (pilot) trong hai tuần</b>, định tuyến 25% kết quả trích xuất có confidence cao trực tiếp đến các hệ thống hạ nguồn và <b class=\"kw\">theo dõi các báo cáo lỗi</b>."}},{"k":"B","t":{"en":"Verify that <b class=\"kw\">97% accuracy meets requirements</b> for all downstream systems that consume the extracted data.","vi":"Xác minh rằng <b class=\"kw\">độ chính xác 97% đáp ứng yêu cầu</b> của tất cả các hệ thống hạ nguồn sử dụng dữ liệu được trích xuất."}},{"k":"C","t":{"en":"Analyze accuracy <b class=\"kw\">by document type and field</b> to verify high-confidence extractions perform consistently across all segments, <b class=\"kw\">not just in aggregate</b>.","vi":"Phân tích độ chính xác <b class=\"kw\">theo loại tài liệu và theo trường</b> để xác minh rằng các kết quả trích xuất có confidence cao đạt hiệu quả nhất quán trên mọi phân khúc, <b class=\"kw\">chứ không chỉ ở mức tổng hợp</b>."}},{"k":"D","t":{"en":"Compare accuracy at <b class=\"kw\">different confidence thresholds</b> (85%, 90%, 95%) to find the <b class=\"kw\">optimal cutoff</b> that maximizes automation while minimizing errors.","vi":"So sánh độ chính xác ở <b class=\"kw\">các ngưỡng confidence khác nhau</b> (85%, 90%, 95%) để tìm <b class=\"kw\">ngưỡng cắt tối ưu</b> giúp tối đa hóa mức tự động hóa trong khi giảm thiểu lỗi."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Độ chính xác <b>tổng hợp</b> 97% có thể che giấu một phân khúc (một loại tài liệu hoặc một trường) có tỷ lệ lỗi rất cao. Trước khi tự động hóa, phải <b>phân tích độ chính xác theo loại tài liệu và theo trường</b> để xác nhận các trích xuất confidence cao hoạt động nhất quán ở mọi phân khúc; phân khúc yếu được giữ lại cho con người review.","elim":["<b>A.</b> Pilot đưa thẳng kết quả vào hệ thống downstream nghĩa là để lỗi lọt vào production trước khi xác minh, và dựa vào báo cáo lỗi thụ động sẽ bỏ sót lỗi âm thầm.","<b>B.</b> Kiểm tra 97% có đạt yêu cầu vẫn dựa trên số tổng hợp, không phát hiện phân khúc có độ chính xác thực thấp hơn nhiều.","<b>D.</b> Tối ưu ngưỡng confidence vẫn dựa trên độ chính xác tổng hợp; một ngưỡng tối ưu toàn cục vẫn có thể thất bại ở một loại tài liệu cụ thể."]},"cite":"Hướng dẫn ôn tập — §9.4 Hiệu chỉnh độ tin cậy và giám sát của con người; Lĩnh vực 5.5"},{"id":"t1q28","n":28,"topic":1,"type":"mcq","stem":{"en":"Documents <b class=\"kw\">arrive continuously throughout business hours</b> and need structured data extracted. To reduce costs, you want to use the Message Batches API (50% discount, <b class=\"kw\">up-to-24-hour processing window</b>). Your SLA specifies that extraction results must be available <b class=\"kw\">within 30 hours of document arrival</b> with <b class=\"kw\">99.9% reliability</b>. Which batching strategy is most appropriate?","vi":"Tài liệu <b class=\"kw\">đến liên tục trong suốt giờ làm việc</b> và cần được trích xuất dữ liệu có cấu trúc. Để giảm chi phí, bạn muốn dùng Message Batches API (giảm giá 50%, <b class=\"kw\">cửa sổ xử lý lên đến 24 giờ</b>). SLA của bạn quy định kết quả trích xuất phải sẵn sàng <b class=\"kw\">trong vòng 30 giờ</b> kể từ khi tài liệu đến, với <b class=\"kw\">độ tin cậy 99.9%</b>. Chiến lược batch nào phù hợp nhất?"},"options":[{"k":"A","t":{"en":"Submit a <b class=\"kw\">single batch at end of day</b> containing all documents from that day","vi":"Gửi <b class=\"kw\">một batch duy nhất vào cuối ngày</b> chứa tất cả tài liệu của ngày hôm đó"}},{"k":"B","t":{"en":"Submit batches <b class=\"kw\">every 6 hours</b> containing documents from that window","vi":"Gửi batch <b class=\"kw\">mỗi 6 giờ</b>, chứa các tài liệu đến trong khoảng thời gian đó"}},{"k":"C","t":{"en":"Use the <b class=\"kw\">real-time API</b> for all documents instead of batch processing","vi":"Dùng <b class=\"kw\">API thời gian thực</b> cho tất cả tài liệu thay vì xử lý theo batch"}},{"k":"D","t":{"en":"Submit batches <b class=\"kw\">every 4 hours</b> containing documents from that window","vi":"Gửi batch <b class=\"kw\">mỗi 4 giờ</b>, chứa các tài liệu đến trong khoảng thời gian đó"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> SLA 30 giờ, Batch API có thể mất tới 24 giờ → tài liệu chỉ được chờ tối đa <b>30 − 24 = 6 giờ</b> trước khi gửi. Gửi <b>mỗi 4 giờ</b>: tài liệu đến ngay sau một lần gửi chờ tối đa 4 giờ + 24 giờ = 28 giờ, còn <b>2 giờ đệm</b> cho việc gom, gửi và lấy kết quả — cần thiết với yêu cầu độ tin cậy 99.9%, mà vẫn hưởng giảm giá 50%.","elim":["<b>A.</b> Một batch cuối ngày: tài liệu đến từ sáng sớm đã chờ 8–10 giờ trở lên, cộng 24 giờ xử lý là vượt hạn 30 giờ.","<b>B.</b> Mỗi 6 giờ: trường hợp xấu nhất 6 + 24 = 30 giờ, chạm đúng hạn chót, không có biên an toàn — mọi độ trễ nhỏ đều vi phạm SLA 99.9%.","<b>C.</b> Real-time API đáp ứng SLA nhưng bỏ lỡ khoản tiết kiệm 50% trong khi SLA 30 giờ hoàn toàn cho phép dùng batch."]},"cite":"Hướng dẫn ôn tập — §7.5 Lập kế hoạch SLA; Lĩnh vực 4.5"},{"id":"t1q29","n":29,"topic":1,"type":"mcq","stem":{"en":"Your schema includes a skills: string[] field. Production monitoring reveals three consistency issues: (1) compound phrases like &quot;Python and SQL&quot; are <b class=\"kw\">sometimes kept as one entry, sometimes split</b>; (2) <b class=\"kw\">implied but unstated skills</b> occasionally appear in extractions; (3) similar documents produce <b class=\"kw\">wildly different array lengths</b> (5-10 vs 40+ entries). Your prompt currently says <b class=\"kw\">&quot;Extract all skills mentioned.&quot;</b> What&#x27;s the most effective improvement?","vi":"Schema của bạn có một trường skills: string[]. Giám sát trên production cho thấy ba vấn đề về tính nhất quán: (1) các cụm từ ghép như &quot;Python and SQL&quot; <b class=\"kw\">đôi khi được giữ thành một mục, đôi khi bị tách ra</b>; (2) các kỹ năng <b class=\"kw\">được ngụ ý nhưng không được nêu ra</b> thỉnh thoảng xuất hiện trong kết quả trích xuất; (3) các tài liệu tương tự nhau lại tạo ra các mảng có <b class=\"kw\">độ dài chênh lệch rất lớn</b> (5-10 so với 40+ mục). Prompt hiện tại của bạn ghi <b class=\"kw\">&quot;Trích xuất tất cả các kỹ năng được đề cập.&quot;</b> Cải tiến nào hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"Add <b class=\"kw\">post-extraction normalization</b> that maps skills to a <b class=\"kw\">canonical taxonomy</b> and deduplicates similar entries.","vi":"Thêm bước <b class=\"kw\">chuẩn hóa sau trích xuất</b> để ánh xạ các kỹ năng sang một <b class=\"kw\">bộ phân loại (taxonomy) chuẩn</b> và loại bỏ các mục trùng lặp tương tự nhau."}},{"k":"B","t":{"en":"<b class=\"kw\">Add constraints</b>: &quot;Extract <b class=\"kw\">10-20 skills maximum</b>, one skill per entry, only explicitly named skills.&quot;","vi":"<b class=\"kw\">Thêm các ràng buộc</b>: &quot;Trích xuất <b class=\"kw\">tối đa 10-20 kỹ năng</b>, mỗi mục một kỹ năng, chỉ những kỹ năng được nêu tên rõ ràng.&quot;"}},{"k":"C","t":{"en":"Add <b class=\"kw\">few-shot examples</b> demonstrating <b class=\"kw\">compound phrase handling</b>, explicit mention criteria, and appropriate entry granularity.","vi":"Thêm các <b class=\"kw\">ví dụ few-shot</b> minh họa cách <b class=\"kw\">xử lý cụm từ ghép</b>, tiêu chí thế nào là được đề cập rõ ràng, và mức độ chi tiết (granularity) phù hợp của mỗi mục."}},{"k":"D","t":{"en":"<b class=\"kw\">Enrich the schema</b> to {skill: string, confidence: float, source_quote: string[]} to capture <b class=\"kw\">extraction metadata</b>.","vi":"<b class=\"kw\">Làm giàu schema</b> thành {skill: string, confidence: float, source_quote: string[]} để ghi nhận <b class=\"kw\">metadata của việc trích xuất</b>."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Cả ba vấn đề — tách hay gộp cụm ghép, kỹ năng ngụ ý, độ dài mảng bất nhất — đều bắt nguồn từ chỉ dẫn mơ hồ “Extract all skills mentioned”. <b>Few-shot</b> minh họa cụ thể cách xử lý cụm ghép (tách “Python and SQL” thành hai mục), <b>tiêu chí chỉ lấy kỹ năng được nêu rõ</b> và <b>mức chi tiết phù hợp</b> giúp model học đúng ranh giới phán đoán, cho kết quả nhất quán giữa các tài liệu tương tự.","elim":["<b>A.</b> Chuẩn hóa sau trích xuất xử lý được trùng lặp/tên gọi nhưng không loại được kỹ năng suy diễn hay sửa mức chi tiết — chỉ xử lý triệu chứng.","<b>B.</b> Giới hạn cứng 10–20 là tùy tiện: CV có 30 kỹ năng thật bị cắt, CV ít kỹ năng có thể bị độn; chỉ dẫn ngắn gọn cũng không cho thấy cách xử lý cụm ghép.","<b>D.</b> Thêm confidence và source_quote giúp truy vết nhưng không định nghĩa cách tách cụm hay mức chi tiết, nên không giải quyết sự bất nhất."]},"cite":"Hướng dẫn ôn tập — §6.1 Few-shot Prompting; Lĩnh vực 4.2"},{"id":"t1q30","n":30,"topic":1,"type":"mcq","stem":{"en":"Your extraction system processes two document types: standard monthly reports (<b class=\"kw\">archived after processing</b>) and urgent exception reports (<b class=\"kw\">must trigger business alerts within 30 minutes</b> of receipt). Both use the same JSON schema. You want to <b class=\"kw\">minimize API costs while meeting latency requirements</b>. How should you architect the processing pipeline?","vi":"Hệ thống trích xuất của bạn xử lý hai loại tài liệu: báo cáo hằng tháng tiêu chuẩn (<b class=\"kw\">được lưu trữ sau khi xử lý</b>) và báo cáo ngoại lệ khẩn cấp (<b class=\"kw\">phải kích hoạt cảnh báo nghiệp vụ trong vòng 30 phút</b> kể từ khi nhận). Cả hai dùng cùng một JSON schema. Bạn muốn <b class=\"kw\">giảm thiểu chi phí API</b> trong khi vẫn <b class=\"kw\">đáp ứng yêu cầu về độ trễ</b>. Bạn nên thiết kế kiến trúc pipeline xử lý như thế nào?"},"options":[{"k":"A","t":{"en":"Queue all documents and submit <b class=\"kw\">hourly batches</b>, flagging urgent documents for <b class=\"kw\">expedited handling</b> when batch results return.","vi":"Đưa tất cả tài liệu vào hàng đợi và gửi <b class=\"kw\">batch mỗi giờ</b>, gắn cờ các tài liệu khẩn cấp để được <b class=\"kw\">xử lý ưu tiên</b> khi kết quả batch trả về."}},{"k":"B","t":{"en":"Route <b class=\"kw\">standard reports to the Batch API</b> for 50% cost savings, and route urgent exception reports to the <b class=\"kw\">real-time Messages API</b>.","vi":"Định tuyến <b class=\"kw\">báo cáo tiêu chuẩn đến Batch API</b> để tiết kiệm 50% chi phí, và định tuyến báo cáo ngoại lệ khẩn cấp đến <b class=\"kw\">Messages API thời gian thực</b>."}},{"k":"C","t":{"en":"Submit <b class=\"kw\">all documents to the Batch API</b> with custom_ids for tracking. When results arrive, immediately process urgent documents and trigger <b class=\"kw\">delayed alerts</b> for exceptions.","vi":"Gửi <b class=\"kw\">tất cả tài liệu đến Batch API</b> kèm custom_ids để theo dõi. Khi có kết quả, xử lý ngay các tài liệu khẩn cấp và kích hoạt <b class=\"kw\">cảnh báo trễ</b> cho các ngoại lệ."}},{"k":"D","t":{"en":"Submit <b class=\"kw\">all documents</b> to the <b class=\"kw\">real-time Messages API</b> to ensure consistent processing latency across document types.","vi":"Gửi <b class=\"kw\">tất cả tài liệu</b> đến <b class=\"kw\">Messages API thời gian thực</b> để đảm bảo độ trễ xử lý nhất quán giữa các loại tài liệu."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Định tuyến <b>theo yêu cầu độ trễ</b> của từng loại tài liệu: báo cáo tháng (lưu trữ, không gấp) đi qua <b>Batch API</b> để tiết kiệm 50%; báo cáo ngoại lệ phải phát cảnh báo trong 30 phút đi qua <b>Messages API real-time</b>, vì Batch API có thể mất tới 24 giờ và không có SLA về độ trễ. Chi phí thấp nhất mà vẫn đáp ứng yêu cầu thời gian.","elim":["<b>A.</b> Batch hàng giờ không bảo đảm kết quả trong 30 phút vì batch có thể mất tới 24 giờ; “xử lý ưu tiên” khi kết quả trở về thì đã quá muộn.","<b>C.</b> Đưa tài liệu khẩn qua Batch vi phạm yêu cầu 30 phút; <code>custom_id</code> chỉ để theo dõi, không tăng tốc, và “cảnh báo trễ” trái với mục tiêu.","<b>D.</b> Real-time cho tất cả đáp ứng độ trễ nhưng bỏ lỡ 50% tiết kiệm cho khối lượng lớn báo cáo tháng vốn không gấp."]},"cite":"Hướng dẫn ôn tập — §7.2 Khi nào dùng Batch API so với Synchronous API; Lĩnh vực 4.5"},{"id":"t1q31","n":31,"topic":1,"type":"mcq","stem":{"en":"The document analysis agent has a <b class=\"kw\">single analyze_document tool</b> that takes a document and a <b class=\"kw\">free-text instruction parameter</b>. During evaluation, requests like &quot;extract the key financial metrics&quot; <b class=\"kw\">often return narrative summaries</b>, while &quot;summarize the methodology&quot; sometimes returns raw data tables. The synthesis agent reports that <b class=\"kw\">35% of analysis results require re-requests</b> with clarified instructions. What&#x27;s the most effective way to improve reliability?","vi":"Agent phân tích tài liệu có <b class=\"kw\">một tool duy nhất là analyze_document</b>, nhận vào một tài liệu và một <b class=\"kw\">tham số instruction dạng văn bản tự do</b>. Trong quá trình đánh giá, các request như &quot;trích xuất các chỉ số tài chính chính&quot; <b class=\"kw\">thường trả về các bản tóm tắt dạng tường thuật</b>, trong khi &quot;tóm tắt phương pháp luận&quot; đôi khi lại trả về các bảng dữ liệu thô. Agent tổng hợp báo cáo rằng <b class=\"kw\">35% kết quả phân tích phải yêu cầu lại</b> với hướng dẫn được làm rõ hơn. Cách hiệu quả nhất để cải thiện độ tin cậy là gì?"},"options":[{"k":"A","t":{"en":"Keep the <b class=\"kw\">single tool</b> but add an <b class=\"kw\">analysis_type enum parameter</b> requiring explicit selection between extraction, summarization, and verification modes.","vi":"Giữ <b class=\"kw\">một tool duy nhất</b> nhưng thêm <b class=\"kw\">tham số enum analysis_type</b>, yêu cầu chọn rõ ràng giữa các chế độ trích xuất, tóm tắt và xác minh."}},{"k":"B","t":{"en":"Split the generic tool into <b class=\"kw\">purpose-specific tools</b>– extract_data_points, summarize_content, verify_claim_against_source –each with <b class=\"kw\">defined input/output contracts</b>.","vi":"Tách tool chung thành các <b class=\"kw\">tool chuyên biệt theo mục đích</b>– extract_data_points, summarize_content, verify_claim_against_source –mỗi tool có <b class=\"kw\">hợp đồng đầu vào/đầu ra</b> được định nghĩa rõ ràng."}},{"k":"C","t":{"en":"Have the <b class=\"kw\">coordinator pre-classify</b> each analysis request before passing instructions to the document analysis agent.","vi":"Để <b class=\"kw\">coordinator phân loại trước</b> mỗi request phân tích trước khi chuyển hướng dẫn cho agent phân tích tài liệu."}},{"k":"D","t":{"en":"<b class=\"kw\">Enhance the tool description</b> with <b class=\"kw\">detailed examples</b> showing how different instruction phrasings should map to different output formats.","vi":"<b class=\"kw\">Cải thiện mô tả tool</b> bằng các <b class=\"kw\">ví dụ chi tiết</b> cho thấy các cách diễn đạt hướng dẫn khác nhau nên ánh xạ sang các định dạng đầu ra khác nhau như thế nào."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Một tool chung với tham số chỉ dẫn tự do khiến đầu ra mơ hồ — “extract” lại thành tóm tắt, “summarize” lại thành bảng số liệu. Tách thành các <b>tool chuyên biệt</b> (<code>extract_data_points</code>, <code>summarize_content</code>, <code>verify_claim_against_source</code>), <b>mỗi tool có hợp đồng input/output xác định</b>, khiến mục đích và định dạng kết quả rõ ràng ngay từ việc chọn tool, giảm mạnh tỷ lệ 35% phải yêu cầu lại.","elim":["<b>A.</b> Enum <code>analysis_type</code> giúp chọn chế độ nhưng vẫn là một tool với đầu ra không có hợp đồng riêng cho từng chế độ, nên định dạng kết quả vẫn không được ràng buộc.","<b>C.</b> Tiền phân loại ở coordinator thêm một bước nhưng tool đích vẫn chung chung với chỉ dẫn tự do; đầu ra không nhất quán vẫn còn.","<b>D.</b> Thêm ví dụ vào mô tả có thể cải thiện phần nào nhưng vẫn dựa vào việc diễn giải chỉ dẫn tự do, không có hợp đồng đầu ra ràng buộc."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q32","n":32,"topic":1,"type":"mcq","stem":{"en":"The coordinator agent has AgentFunctions <b class=\"kw\">configured for all four specialized subagents</b>, each with <b class=\"kw\">appropriate descriptions and restrictions</b>. During testing, you find the coordinator sometimes fails to delegate—it writes <b class=\"kw\">&quot;I&#x27;ll ask the web search agent to find sources&quot;</b> <b class=\"kw\">without actually invoking it</b>. What is the most likely cause?","vi":"Coordinator agent đã được cấu hình AgentFunctions <b class=\"kw\">cho cả bốn subagent chuyên biệt</b>, mỗi subagent có <b class=\"kw\">mô tả và giới hạn phù hợp</b>. Trong quá trình kiểm thử, bạn thấy coordinator đôi khi không ủy quyền (delegate) được—nó viết <b class=\"kw\">&quot;Tôi sẽ nhờ agent tìm kiếm web tìm các nguồn&quot;</b> <b class=\"kw\">mà không thực sự gọi agent đó</b>. Nguyên nhân có khả năng cao nhất là gì?"},"options":[{"k":"A","t":{"en":"The AgentFunctions are configured correctly, but the <b class=\"kw\">coordinator&#x27;s system prompt</b> includes a statement that prevents it from knowing the <b class=\"kw\">available subagent types</b>.","vi":"Các AgentFunctions được cấu hình đúng, nhưng <b class=\"kw\">system prompt của coordinator</b> có một câu khiến nó không biết được <b class=\"kw\">các loại subagent hiện có</b>."}},{"k":"B","t":{"en":"The coordinator&#x27;s <b class=\"kw\">allowed Tools configuration</b> <b class=\"kw\">doesn&#x27;t include &quot;Task&quot;</b>, so while it can describe delegation, it cannot actually invoke the tool required to spawn subagents.","vi":"<b class=\"kw\">Cấu hình allowed Tools</b> của coordinator <b class=\"kw\">không bao gồm &quot;Task&quot;</b>, nên dù có thể mô tả việc ủy quyền, nó không thể thực sự gọi tool cần thiết để khởi tạo subagent."}},{"k":"C","t":{"en":"The coordinator&#x27;s <b class=\"kw\">max_tokens setting is too low</b>, causing the Task tool invocation to be <b class=\"kw\">truncated</b> before the subagent parameter can be specified.","vi":"Thiết lập <b class=\"kw\">max_tokens của coordinator quá thấp</b>, khiến lời gọi tool Task <b class=\"kw\">bị cắt cụt</b> trước khi kịp chỉ định tham số subagent."}},{"k":"D","t":{"en":"<b class=\"kw\">Subagent context limit descriptions</b> from the coordinator don&#x27;t provide enough context; you need to configure <b class=\"kw\">explicit context content</b> between coordinator and tool descriptions.","vi":"Các <b class=\"kw\">mô tả giới hạn context của subagent</b> từ coordinator không cung cấp đủ context; bạn cần cấu hình <b class=\"kw\">nội dung context tường minh</b> giữa coordinator và các mô tả tool."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Coordinator spawn subagent bằng cách <b>gọi tool <code>Task</code></b>. Nếu <code>allowedTools</code> của coordinator không chứa <code>\"Task\"</code>, nó chỉ có thể <b>mô tả</b> việc ủy quyền bằng văn bản (“I'll ask the web search agent...”) mà không thể thực hiện lời gọi. Định nghĩa subagent dù đúng cũng vô dụng nếu coordinator thiếu tool để gọi chúng.","elim":["<b>A.</b> Coordinator rõ ràng biết có web search agent (nó nhắc đến tên) — vấn đề là không gọi được, không phải không biết loại subagent.","<b>C.</b> <code>max_tokens</code> thấp sẽ cắt phản hồi giữa chừng với <code>stop_reason</code> là <code>max_tokens</code>; ở đây coordinator viết câu hoàn chỉnh rồi kết thúc mà không có <code>tool_use</code>, không khớp triệu chứng cắt cụt.","<b>D.</b> Cách truyền context giữa coordinator và subagent ảnh hưởng chất lượng kết quả của subagent, không quyết định việc coordinator có thực hiện được lời gọi hay không."]},"cite":"Hướng dẫn ôn tập — §3.4 Tool Task để Sinh ra Subagent; Lĩnh vực 1.3"},{"id":"t1q33","n":33,"topic":1,"type":"mcq","stem":{"en":"When researching &quot;renewable energy adoption,&quot; the web search agent returns recent statistics <b class=\"kw\">(2024: 35% adoption)</b> while the document analysis agent extracts data from internal reports <b class=\"kw\">(2022: 18% adoption)</b>. The synthesis agent <b class=\"kw\">incorrectly flags these as contradictory</b> sources rather than recognizing the data shows <b class=\"kw\">growth over time</b>. What change would best enable the synthesis agent to correctly interpret such temporal differences?","vi":"Khi nghiên cứu về &quot;mức độ áp dụng năng lượng tái tạo,&quot; agent tìm kiếm web trả về số liệu thống kê gần đây <b class=\"kw\">(2024: tỷ lệ áp dụng 35%)</b> trong khi agent phân tích tài liệu trích xuất dữ liệu từ các báo cáo nội bộ <b class=\"kw\">(2022: tỷ lệ áp dụng 18%)</b>. Agent tổng hợp <b class=\"kw\">đánh dấu sai rằng đây là các nguồn mâu thuẫn</b> nhau thay vì nhận ra dữ liệu cho thấy sự <b class=\"kw\">tăng trưởng theo thời gian</b>. Thay đổi nào sẽ giúp agent tổng hợp diễn giải đúng những khác biệt về thời gian như vậy một cách tốt nhất?"},"options":[{"k":"A","t":{"en":"Add a <b class=\"kw\">conflict resolution agent</b> that automatically <b class=\"kw\">discards older data</b> when newer data exists for the same metric.","vi":"Thêm một <b class=\"kw\">agent giải quyết xung đột</b>, tự động <b class=\"kw\">loại bỏ dữ liệu cũ hơn</b> khi có dữ liệu mới hơn cho cùng một chỉ số."}},{"k":"B","t":{"en":"Configure the web search agent to <b class=\"kw\">only return results</b> from the <b class=\"kw\">past 6 months</b>.","vi":"Cấu hình agent tìm kiếm web <b class=\"kw\">chỉ trả về kết quả</b> trong <b class=\"kw\">6 tháng gần nhất</b>."}},{"k":"C","t":{"en":"Require subagents to include <b class=\"kw\">publication or data collection dates</b> in their <b class=\"kw\">structured outputs</b>.","vi":"Yêu cầu các subagent đưa <b class=\"kw\">ngày xuất bản hoặc ngày thu thập dữ liệu</b> vào <b class=\"kw\">đầu ra có cấu trúc</b> của chúng."}},{"k":"D","t":{"en":"Instruct the synthesis agent to always treat the <b class=\"kw\">most recent data as authoritative</b> and place older findings in a <b class=\"kw\">separate historical appendix</b>.","vi":"Hướng dẫn agent tổng hợp luôn coi <b class=\"kw\">dữ liệu mới nhất là có thẩm quyền</b> và đặt các phát hiện cũ hơn vào một <b class=\"kw\">phụ lục lịch sử riêng</b>."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Synthesis agent hiểu nhầm vì <b>nó không bao giờ thấy ngày tháng</b>: 18% và 35% trông như mâu thuẫn, trong khi 2022 → 2024 thực ra là tăng trưởng. Yêu cầu các subagent <b>đưa ngày xuất bản/thu thập dữ liệu vào output có cấu trúc</b> bảo toàn metadata thời gian từ nguồn, giúp synthesis diễn giải đúng khác biệt theo thời gian thay vì gắn cờ xung đột.","elim":["<b>A.</b> Loại bỏ dữ liệu cũ làm mất thông tin xu hướng — chính cặp 2022/2024 thể hiện tăng trưởng; và nếu không có ngày thì cũng không biết cái nào cũ hơn.","<b>B.</b> Giới hạn 6 tháng bỏ mất dữ liệu lịch sử có giá trị và không xử lý dữ liệu thiếu ngày từ document analysis agent.","<b>D.</b> “Luôn coi dữ liệu mới nhất là chuẩn” là quy tắc cứng, vẫn cần ngày để biết cái nào mới nhất, và đẩy dữ liệu cũ ra phụ lục làm mất câu chuyện tăng trưởng."]},"cite":"Hướng dẫn ôn tập — §12.3 Bao gồm Ngày tháng để Diễn giải Đúng; Lĩnh vực 5.6"},{"id":"t1q34","n":34,"topic":1,"type":"mcq","stem":{"en":"Your multi-agent research pipeline <b class=\"kw\">crashed after processing 12 of 28 documents</b>. The web search agent had identified relevant sources, the document analysis agent had <b class=\"kw\">partially completed extraction</b>, and the synthesizer had begun pattern identification. You need to resume processing <b class=\"kw\">without repeating work or losing fidelity</b> of prior findings. What state management approach best <b class=\"kw\">balances information fidelity with context efficiency</b> when restoring agent state?","vi":"Pipeline nghiên cứu đa agent (multi-agent) của bạn <b class=\"kw\">bị sập sau khi xử lý 12 trong số 28 tài liệu</b>. Agent tìm kiếm web đã xác định được các nguồn liên quan, agent phân tích tài liệu đã <b class=\"kw\">hoàn thành một phần</b> việc trích xuất, và agent tổng hợp (synthesizer) đã bắt đầu nhận diện các mẫu. Bạn cần tiếp tục xử lý <b class=\"kw\">mà không phải lặp lại công việc</b> hay làm giảm độ trung thực của các phát hiện trước đó. Cách quản lý trạng thái nào cân bằng tốt nhất giữa <b class=\"kw\">độ trung thực của thông tin và hiệu quả sử dụng context</b> khi khôi phục trạng thái của agent?"},"options":[{"k":"A","t":{"en":"Have each agent maintain <b class=\"kw\">its own persistent state file</b> and <b class=\"kw\">reload it independently</b> at the start of each session.","vi":"Để mỗi agent duy trì <b class=\"kw\">file trạng thái bền vững (persistent) của riêng nó</b> và <b class=\"kw\">tải lại một cách độc lập</b> khi bắt đầu mỗi session."}},{"k":"B","t":{"en":"Index all agent outputs in a <b class=\"kw\">shared vector store</b>. When resuming, each agent queries the store using <b class=\"kw\">semantic search</b> to retrieve relevant prior findings.","vi":"Đánh chỉ mục tất cả đầu ra của các agent vào một <b class=\"kw\">vector store dùng chung</b>. Khi tiếp tục, mỗi agent truy vấn store đó bằng <b class=\"kw\">tìm kiếm ngữ nghĩa</b> để lấy các phát hiện trước đó có liên quan."}},{"k":"C","t":{"en":"Have each agent persist a <b class=\"kw\">structured report to a known location</b>. On resume, the <b class=\"kw\">coordinator loads the reports</b> and injects relevant state into agent prompts.","vi":"Để mỗi agent lưu bền vững một <b class=\"kw\">báo cáo có cấu trúc vào một vị trí đã biết trước</b>. Khi tiếp tục, <b class=\"kw\">coordinator tải các báo cáo</b> đó và đưa trạng thái liên quan vào prompt của các agent."}},{"k":"D","t":{"en":"Persist the <b class=\"kw\">coordinator&#x27;s conversation log</b> containing all task delegations and responses, providing this to agents when resuming.","vi":"Lưu bền vững <b class=\"kw\">log hội thoại của coordinator</b> chứa tất cả các lần ủy quyền tác vụ và các phản hồi, rồi cung cấp log này cho các agent khi tiếp tục."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Mỗi agent ghi một <b>báo cáo trạng thái có cấu trúc</b> (status, phát hiện chính, phạm vi đã bao phủ, khoảng trống) ra <b>vị trí đã biết</b>; khi tiếp tục, <b>coordinator nạp các báo cáo/manifest</b> và chỉ chèn phần trạng thái liên quan vào prompt của từng agent. Cấu trúc rõ ràng giữ được độ trung thực, việc chọn lọc giữ context gọn, và coordinator nắm được agent nào đã xong, agent nào dở dang để không lặp lại công việc.","elim":["<b>A.</b> Mỗi agent tự nạp trạng thái riêng thiếu điều phối tập trung: coordinator không biết tiến độ tổng thể, và synthesis không nhận được kết quả của các agent khác.","<b>B.</b> Semantic search trả về mảnh theo độ tương đồng, có thể bỏ sót hoặc lấy sai, và mất cấu trúc tiến độ (cái gì xong, cái gì dở) — độ trung thực thấp.","<b>D.</b> Toàn bộ log hội thoại của coordinator rất lớn và nhiều nhiễu, gây tốn context; mỗi agent chỉ cần phần liên quan đến nó."]},"cite":"Hướng dẫn ôn tập — §11.6 Lưu trữ Trạng thái có Cấu trúc (để phục hồi sau sự cố); Lĩnh vực 5.4"},{"id":"t1q35","n":35,"topic":1,"type":"mcq","stem":{"en":"Production reviews reveal <b class=\"kw\">inconsistent handling of uncertainty</b> in final reports. Sometimes confidence calibrations are synthesized into standardized uncertainty expressions, while other times results produce <b class=\"kw\">vague estimates without clear methodology</b>. Which <b class=\"kw\">system-level improvement</b> best addresses this inconsistency?","vi":"Các đợt review trên production cho thấy <b class=\"kw\">việc xử lý mức độ không chắc chắn</b> trong các báo cáo cuối cùng không nhất quán. Đôi khi các hiệu chỉnh confidence được tổng hợp thành các cách diễn đạt mức độ không chắc chắn đã chuẩn hóa, trong khi những lần khác kết quả lại đưa ra các <b class=\"kw\">ước lượng mơ hồ không có phương pháp rõ ràng</b>. <b class=\"kw\">Cải tiến ở cấp hệ thống</b> nào giải quyết tốt nhất sự không nhất quán này?"},"options":[{"k":"A","t":{"en":"Implement a <b class=\"kw\">confidence calibration layer</b> where synthesis agent normalizes uncertainty expressions into <b class=\"kw\">standardized probability representations</b> (0.0-1.0), then weights their calibrated confidence.","vi":"Triển khai một <b class=\"kw\">tầng hiệu chỉnh confidence</b> trong đó agent tổng hợp chuẩn hóa các cách diễn đạt mức độ không chắc chắn thành các <b class=\"kw\">biểu diễn xác suất chuẩn hóa</b> (0.0-1.0), sau đó đánh trọng số theo confidence đã hiệu chỉnh của chúng."}},{"k":"B","t":{"en":"Instruct the synthesis agent to use <b class=\"kw\">explicit sections</b> separating confirmed findings from contested analysis, <b class=\"kw\">preserving original source characterizations</b>.","vi":"Hướng dẫn agent tổng hợp dùng <b class=\"kw\">các phần riêng biệt, tường minh</b> để tách các phát hiện đã được xác nhận khỏi các phân tích còn tranh cãi, đồng thời <b class=\"kw\">giữ nguyên cách mô tả gốc của nguồn</b>."}},{"k":"C","t":{"en":"Configure subagents to <b class=\"kw\">only report findings</b> with <b class=\"kw\">sufficient coverage breadth</b>, source diversity, and quality criteria before passing results to the synthesis agent.","vi":"Cấu hình các subagent <b class=\"kw\">chỉ báo cáo những phát hiện</b> <b class=\"kw\">đạt đủ tiêu chí về độ rộng bao phủ</b>, độ đa dạng nguồn và chất lượng trước khi chuyển kết quả cho agent tổng hợp."}},{"k":"D","t":{"en":"Add a <b class=\"kw\">verification subagent</b> that cross-references findings across sources, only accepting synthesis corroborated by <b class=\"kw\">at least two independent sources</b>.","vi":"Thêm một <b class=\"kw\">subagent xác minh</b> để đối chiếu chéo các phát hiện giữa các nguồn, chỉ chấp nhận nội dung tổng hợp được <b class=\"kw\">ít nhất hai nguồn độc lập</b> xác nhận."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Giải pháp cấp hệ thống là <b>cấu trúc báo cáo cố định</b>: các mục riêng tách <b>phát hiện đã xác nhận</b> khỏi <b>phân tích còn tranh cãi</b>, đồng thời <b>giữ nguyên cách nguồn gốc mô tả mức độ chắc chắn</b>. Nhờ vậy cách xử lý bất định luôn nhất quán giữa các báo cáo, người đọc biết rõ điều gì chắc chắn và điều gì chưa, mà không mất sắc thái của nguồn.","elim":["<b>A.</b> Quy đổi mọi cách diễn đạt bất định thành xác suất 0.0–1.0 tạo ra độ chính xác giả — các nguồn không có phương pháp hiệu chỉnh chung, con số quy đổi che mất cách nguồn thực sự diễn đạt.","<b>C.</b> Lọc chỉ giữ phát hiện đạt chuẩn làm mất chính những thông tin bất định/tranh cãi cần được trình bày minh bạch.","<b>D.</b> Chỉ chấp nhận phát hiện có hai nguồn độc lập loại bỏ các phát hiện đơn nguồn hợp lệ, và không giải quyết cách trình bày sự bất định."]},"cite":"Hướng dẫn ôn tập — §12.2 Xử lý Dữ liệu Xung đột; Lĩnh vực 5.6"},{"id":"t1q36","n":36,"topic":1,"type":"mcq","stem":{"en":"The coordinator provides <b class=\"kw\">detailed step-by-step instructions</b> to the web search subagent, <b class=\"kw\">specifying exact search queries</b>, source quality criteria (coverage breadth, source diversity), and content type classifications. The coordinator sometimes encounters challenges where <b class=\"kw\">instructions fail when the subagent encounters unexpected situations</b>. What&#x27;s the most effective way to <b class=\"kw\">improve subagent adaptability</b>?","vi":"Coordinator cung cấp <b class=\"kw\">hướng dẫn chi tiết từng bước</b> cho subagent tìm kiếm web, <b class=\"kw\">chỉ định chính xác các truy vấn tìm kiếm</b>, tiêu chí chất lượng nguồn (độ rộng bao phủ, độ đa dạng nguồn) và cách phân loại loại nội dung. Coordinator đôi khi gặp vấn đề khi các hướng dẫn không còn hiệu quả lúc subagent gặp phải <b class=\"kw\">những tình huống không lường trước</b>. Cách hiệu quả nhất để cải thiện <b class=\"kw\">khả năng thích ứng của subagent</b> là gì?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Remove procedural detail entirely</b>, delegating with <b class=\"kw\">simple goals</b> like &quot;research it thoroughly&quot; and relying on the subagent&#x27;s general capabilities.","vi":"<b class=\"kw\">Loại bỏ hoàn toàn chi tiết về quy trình</b>, ủy quyền với các <b class=\"kw\">mục tiêu đơn giản</b> như &quot;nghiên cứu thật kỹ lưỡng&quot; và dựa vào năng lực chung của subagent."}},{"k":"B","t":{"en":"Specify <b class=\"kw\">research goals and quality criteria</b> (coverage breadth, source diversity, content type) rather than procedural instructions, <b class=\"kw\">letting the subagent determine execution</b>.","vi":"Chỉ định <b class=\"kw\">mục tiêu nghiên cứu và tiêu chí chất lượng</b> (độ rộng bao phủ, độ đa dạng nguồn, loại nội dung) thay vì hướng dẫn theo quy trình, <b class=\"kw\">để subagent tự quyết định cách thực hiện</b>."}},{"k":"C","t":{"en":"Add <b class=\"kw\">explicit fallback directives</b> to the detailed instructions: &quot;if specified searches fail, attempt alternative queries before reporting failure.&quot;","vi":"Thêm các <b class=\"kw\">chỉ thị fallback tường minh</b> vào hướng dẫn chi tiết: &quot;nếu các tìm kiếm được chỉ định thất bại, hãy thử các truy vấn thay thế trước khi báo cáo thất bại.&quot;"}},{"k":"D","t":{"en":"Implement a <b class=\"kw\">task classification step</b> where the coordinator categorizes requests as &quot;analytical&quot; vs &quot;exploratory&quot; and uses <b class=\"kw\">different instruction sets</b> for each category.","vi":"Triển khai một <b class=\"kw\">bước phân loại tác vụ</b>, trong đó coordinator phân loại request thành &quot;phân tích&quot; hoặc &quot;khám phá&quot; và dùng các <b class=\"kw\">bộ hướng dẫn khác nhau</b> cho mỗi loại."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Chỉ dẫn từng bước cứng nhắc sẽ gãy khi subagent gặp tình huống ngoài dự kiến. Coordinator nên nêu <b>mục tiêu nghiên cứu và tiêu chí chất lượng</b> (độ bao phủ, đa dạng nguồn, loại nội dung) thay vì thủ tục, để <b>subagent tự quyết cách thực hiện</b>. Subagent vẫn có thước đo để đánh giá kết quả, đồng thời đủ linh hoạt để đổi truy vấn hay hướng tiếp cận khi gặp bất ngờ.","elim":["<b>A.</b> Chỉ giao “research it thoroughly” làm mất luôn tiêu chí chất lượng — subagent không biết thế nào là đủ, kết quả thiếu nhất quán.","<b>C.</b> Thêm fallback chỉ vá một kịch bản hỏng (truy vấn thất bại); chỉ dẫn vẫn mang tính thủ tục và không lường trước được các tình huống khác.","<b>D.</b> Hai bộ chỉ dẫn theo loại vẫn là thủ tục cứng nhắc, chỉ thêm độ phức tạp mà không giải quyết gốc rễ."]},"cite":"Hướng dẫn ôn tập — §3.3 Hub-and-Spoke: Coordinator và Subagent; Lĩnh vực 1.3"},{"id":"t1q37","n":37,"topic":1,"type":"mcq","stem":{"en":"A user is expanding the research system beyond its single web search agent by adding specialized data sources. They add a financial API agent that returns structured JSON with revenue, margins, and growth rates; a news monitoring agent that returns prose summaries of recent developments; and a patent analysis agent that returns structured lists of technology areas. The synthesis agent combines these into executive briefings. Currently, it <b class=\"kw\">converts everything to bullet points</b>, causing financial comparisons to <b class=\"kw\">lose tabular clarity</b> and news summaries to <b class=\"kw\">lose narrative flow</b>. What change would most improve briefing quality?","vi":"Một người dùng đang mở rộng hệ thống nghiên cứu vượt ra ngoài agent tìm kiếm web duy nhất bằng cách thêm các nguồn dữ liệu chuyên biệt. Họ thêm một agent API tài chính trả về JSON có cấu trúc với doanh thu, biên lợi nhuận và tốc độ tăng trưởng; một agent theo dõi tin tức trả về các bản tóm tắt dạng văn xuôi về những diễn biến gần đây; và một agent phân tích bằng sáng chế trả về danh sách có cấu trúc các lĩnh vực công nghệ. Agent tổng hợp kết hợp những nội dung này thành các bản báo cáo tóm tắt cho lãnh đạo (executive briefing). Hiện tại, nó <b class=\"kw\">chuyển mọi thứ thành dạng gạch đầu dòng</b>, khiến các so sánh tài chính <b class=\"kw\">mất đi sự rõ ràng của dạng bảng</b> và các bản tóm tắt tin tức <b class=\"kw\">mất đi mạch tường thuật</b>. Thay đổi nào sẽ cải thiện chất lượng bản báo cáo tóm tắt nhiều nhất?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Standardize</b> all subagent outputs to <b class=\"kw\">prose summaries with inline citations</b>.","vi":"<b class=\"kw\">Chuẩn hóa</b> tất cả đầu ra của subagent thành các bản <b class=\"kw\">tóm tắt dạng văn xuôi có trích dẫn nội dòng</b>."}},{"k":"B","t":{"en":"Add a <b class=\"kw\">format conversion layer</b> between subagents and synthesis that transforms all outputs to a <b class=\"kw\">common intermediate representation</b>.","vi":"Thêm một <b class=\"kw\">tầng chuyển đổi định dạng</b> giữa các subagent và bước tổng hợp, biến đổi tất cả đầu ra thành một dạng <b class=\"kw\">biểu diễn trung gian chung</b>."}},{"k":"C","t":{"en":"Update the synthesis agent to <b class=\"kw\">render each content type appropriately</b>–<b class=\"kw\">financial data as tables</b>, news as prose.","vi":"Cập nhật agent tổng hợp để <b class=\"kw\">trình bày mỗi loại nội dung theo cách phù hợp</b>–<b class=\"kw\">dữ liệu tài chính dạng bảng</b>, tin tức dạng văn xuôi."}},{"k":"D","t":{"en":"<b class=\"kw\">Standardize</b> all subagent outputs to <b class=\"kw\">JSON with fields</b> for claim, evidence, source, and confidence.","vi":"<b class=\"kw\">Chuẩn hóa</b> tất cả đầu ra của subagent thành <b class=\"kw\">JSON với các trường</b> cho nhận định (claim), bằng chứng (evidence), nguồn (source) và confidence."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Vấn đề nằm ở bước trình bày: synthesis agent ép mọi thứ thành bullet point. Nguyên tắc là <b>trình bày theo loại nội dung</b> — dữ liệu tài chính dạng <b>bảng</b> để so sánh, tin tức dạng <b>văn xuôi</b> để giữ mạch tường thuật, danh sách công nghệ của bằng sáng chế dạng danh sách có cấu trúc. Cập nhật synthesis agent để render phù hợp từng loại giữ được ưu điểm vốn có của mỗi nguồn.","elim":["<b>A.</b> Chuẩn hóa thành văn xuôi làm mất tính dạng bảng của dữ liệu tài chính — chỉ đổi một kiểu ép định dạng sang kiểu khác.","<b>B.</b> Lớp chuyển đổi về một biểu diễn chung chính là cách “ép một định dạng” gây mất sắc thái, lại thêm độ phức tạp.","<b>D.</b> JSON claim/evidence chuẩn hóa đầu vào, nhưng vấn đề là cách synthesis trình bày đầu ra; nó không biến dữ liệu tài chính thành bảng hay tin tức thành văn xuôi."]},"cite":"Hướng dẫn ôn tập — §12.4 Trình bày theo Loại Nội dung; Lĩnh vực 5.6"},{"id":"t1q38","n":38,"topic":1,"type":"mcq","stem":{"en":"The web search agent has gathered several relevant sources for a research topic. The document analysis agent <b class=\"kw\">now needs to examine these sources</b>. How does <b class=\"kw\">information typically flow</b> <b class=\"kw\">between these two specialized subagents</b>?","vi":"Agent tìm kiếm web đã thu thập được một số nguồn liên quan cho một chủ đề nghiên cứu. Giờ agent phân tích tài liệu <b class=\"kw\">cần xem xét các nguồn này</b>. <b class=\"kw\">Thông tin thường được truyền</b> <b class=\"kw\">giữa hai subagent chuyên biệt này</b> như thế nào?"},"options":[{"k":"A","t":{"en":"The <b class=\"kw\">coordinator agent receives</b> the web search agent&#x27;s output and <b class=\"kw\">includes relevant findings in the prompt</b> when invoking the document analysis agent.","vi":"<b class=\"kw\">Coordinator agent nhận</b> đầu ra của agent tìm kiếm web và <b class=\"kw\">đưa các phát hiện liên quan vào prompt</b> khi gọi agent phân tích tài liệu."}},{"k":"B","t":{"en":"Both agents access a <b class=\"kw\">shared memory store</b> where the web search agent writes findings and the document analysis agent reads them.","vi":"Cả hai agent truy cập một <b class=\"kw\">kho bộ nhớ dùng chung</b>, nơi agent tìm kiếm web ghi các phát hiện và agent phân tích tài liệu đọc chúng."}},{"k":"C","t":{"en":"The web search agent <b class=\"kw\">directly invokes the document analysis agent</b>, passing the discovered sources as parameters.","vi":"Agent tìm kiếm web <b class=\"kw\">gọi trực tiếp agent phân tích tài liệu</b>, truyền các nguồn đã tìm được dưới dạng tham số."}},{"k":"D","t":{"en":"The agents communicate through an <b class=\"kw\">event-driven message queue</b>, with the document analysis agent subscribing to web search completion events.","vi":"Các agent giao tiếp qua một <b class=\"kw\">hàng đợi thông điệp hướng sự kiện (event-driven)</b>, trong đó agent phân tích tài liệu đăng ký nhận các sự kiện hoàn tất tìm kiếm web."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Trong kiến trúc <b>hub-and-spoke</b>, subagent không giao tiếp trực tiếp với nhau và <b>không tự kế thừa context</b>. Mọi luồng thông tin đi qua <b>coordinator</b>: nó nhận output của web search agent, chọn các phát hiện liên quan rồi <b>đưa tường minh vào prompt</b> khi gọi document analysis agent.","elim":["<b>B.</b> Shared memory store không phải cơ chế điển hình; subagent chỉ biết những gì được truyền trong prom
