getarian”). Claude hiểu ngữ cảnh nên chuẩn hóa được cả biểu tượng lẫn văn bản đa dạng ngay trong một lần gọi, cho đầu ra nhất quán và đáng tin cậy.","elim":["<b>B.</b> Mỗi trường một lời gọi nhân chi phí lên nhiều lần, mất liên kết giữa tên món–giá–tag, và tự nó không chuẩn hóa định dạng.","<b>C.</b> Code hậu xử lý khó diễn giải biểu tượng/mô tả ăn kiêng đa dạng vốn cần hiểu ngữ nghĩa, và bộ quy tắc phải liên tục mở rộng; Claude làm được việc này ngay khi trích xuất.","<b>D.</b> Trích xuất nhiều lần rồi bỏ phiếu tốn chi phí gấp nhiều lần và không định nghĩa định dạng chuẩn — định dạng phổ biến nhất vẫn có thể sai chuẩn."]},"cite":"Hướng dẫn ôn tập — §2.4 JSON Schema cho Structured Output; Lĩnh vực 4.3"},{"id":"t1q26","n":26,"topic":1,"type":"mcq","stem":{"en":"Your extraction uses tool use with a JSON schema where property_type is defined as an enum: [&#x27;house&#x27;, &#x27;apartment&#x27;, &#x27;condo&#x27;, &#x27;townhouse&#x27;]. After deployment, 8% of extractions fail schema validation. Investigation reveals listings mention many uncommon property types –&quot;studio&quot;, &quot;loft&quot;, &quot;duplex&quot;, &quot;mobile home&quot;, &quot;tiny house&quot;, &quot;converted warehouse&quot;–and new types continue appearing regularly. What&#x27;s the most effective long-term solution?"},"options":[{"k":"A","t":{"en":"Add an &quot;other&quot; value to your enum with a separate property_type_detail string field for specifics when &quot;other&quot; is selected."}},{"k":"B","t":{"en":"Add few-shot examples to your prompt demonstrating how to map unexpected property types to the closest existing enum value."}},{"k":"C","t":{"en":"Change property_type from an enum to a free-form string and implement a normalization step in post-processing."}},{"k":"D","t":{"en":"Continuously expand the enum to include newly observed property types and add monitoring for additional edge cases."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Mẫu <b>enum có giá trị “other” + trường chi tiết</b> (<code>property_type_detail</code>) giữ được chuẩn hóa cho các loại phổ biến, đồng thời mọi loại mới (“loft”, “tiny house”...) vẫn hợp lệ với schema và không mất thông tin. Khi loại mới xuất hiện liên tục, đây là giải pháp bền vững lâu dài mà không cần sửa schema mỗi lần.","elim":["<b>B.</b> Ép “loft” hay “converted warehouse” về giá trị gần nhất làm sai lệch, mất thông tin; và loại mới vẫn liên tục phát sinh.","<b>C.</b> Chuỗi tự do bỏ mất lợi ích ràng buộc của enum cho các loại phổ biến và đẩy toàn bộ việc chuẩn hóa sang hậu xử lý phải bảo trì liên tục.","<b>D.</b> Liên tục mở rộng enum là cuộc chạy đuổi không hồi kết — giữa các lần cập nhật vẫn có lỗi validation."]},"cite":"Hướng dẫn ôn tập — §2.4 JSON Schema cho Structured Output; Lĩnh vực 4.3"},{"id":"t1q27","n":27,"topic":1,"type":"mcq","stem":{"en":"Your system has been operating with 100% human review for 3 months. Analysis shows that extractions with model confidence &gt;90% have 97% accuracy overall. To reduce reviewer workload, you plan to automate high-confidence extractions Before deploying, what validation step is most critical?"},"options":[{"k":"A","t":{"en":"Run a two-week pilot routing 25% of high-confidence extractions directly to downstream systems and monitor error reports."}},{"k":"B","t":{"en":"Verify that 97% accuracy meets requirements for all downstream systems that consume the extracted data."}},{"k":"C","t":{"en":"Analyze accuracy by document type and field to verify high-confidence extractions perform consistently across all segments, not just in aggregate."}},{"k":"D","t":{"en":"Compare accuracy at different confidence thresholds (85%, 90%, 95%) to find the optimal cutoff that maximizes automation while minimizing errors."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Độ chính xác <b>tổng hợp</b> 97% có thể che giấu một phân khúc (một loại tài liệu hoặc một trường) có tỷ lệ lỗi rất cao. Trước khi tự động hóa, phải <b>phân tích độ chính xác theo loại tài liệu và theo trường</b> để xác nhận các trích xuất confidence cao hoạt động nhất quán ở mọi phân khúc; phân khúc yếu được giữ lại cho con người review.","elim":["<b>A.</b> Pilot đưa thẳng kết quả vào hệ thống downstream nghĩa là để lỗi lọt vào production trước khi xác minh, và dựa vào báo cáo lỗi thụ động sẽ bỏ sót lỗi âm thầm.","<b>B.</b> Kiểm tra 97% có đạt yêu cầu vẫn dựa trên số tổng hợp, không phát hiện phân khúc có độ chính xác thực thấp hơn nhiều.","<b>D.</b> Tối ưu ngưỡng confidence vẫn dựa trên độ chính xác tổng hợp; một ngưỡng tối ưu toàn cục vẫn có thể thất bại ở một loại tài liệu cụ thể."]},"cite":"Hướng dẫn ôn tập — §9.4 Hiệu chỉnh độ tin cậy và giám sát của con người; Lĩnh vực 5.5"},{"id":"t1q28","n":28,"topic":1,"type":"mcq","stem":{"en":"Documents arrive continuously throughout business hours and need structured data extracted. To reduce costs, you want to use the Message Batches API (50% discount, up-to-24-hour processing window). Your SLA specifies that extraction results must be available within 30 hours of document arrival with 99.9% reliability. Which batching strategy is most appropriate?"},"options":[{"k":"A","t":{"en":"Submit a single batch at end of day containing all documents from that day"}},{"k":"B","t":{"en":"Submit batches every 6 hours containing documents from that window"}},{"k":"C","t":{"en":"Use the real-time API for all documents instead of batch processing"}},{"k":"D","t":{"en":"Submit batches every 4 hours containing documents from that window"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> SLA 30 giờ, Batch API có thể mất tới 24 giờ → tài liệu chỉ được chờ tối đa <b>30 − 24 = 6 giờ</b> trước khi gửi. Gửi <b>mỗi 4 giờ</b>: tài liệu đến ngay sau một lần gửi chờ tối đa 4 giờ + 24 giờ = 28 giờ, còn <b>2 giờ đệm</b> cho việc gom, gửi và lấy kết quả — cần thiết với yêu cầu độ tin cậy 99.9%, mà vẫn hưởng giảm giá 50%.","elim":["<b>A.</b> Một batch cuối ngày: tài liệu đến từ sáng sớm đã chờ 8–10 giờ trở lên, cộng 24 giờ xử lý là vượt hạn 30 giờ.","<b>B.</b> Mỗi 6 giờ: trường hợp xấu nhất 6 + 24 = 30 giờ, chạm đúng hạn chót, không có biên an toàn — mọi độ trễ nhỏ đều vi phạm SLA 99.9%.","<b>C.</b> Real-time API đáp ứng SLA nhưng bỏ lỡ khoản tiết kiệm 50% trong khi SLA 30 giờ hoàn toàn cho phép dùng batch."]},"cite":"Hướng dẫn ôn tập — §7.5 Lập kế hoạch SLA; Lĩnh vực 4.5"},{"id":"t1q29","n":29,"topic":1,"type":"mcq","stem":{"en":"Your schema includes a skills: string[] field. Production monitoring reveals three consistency issues: (1) compound phrases like &quot;Python and SQL&quot; are sometimes kept as one entry, sometimes split; (2) implied but unstated skills occasionally appear in extractions; (3) similar documents produce wildly different array lengths (5-10 vs 40+ entries). Your prompt currently says &quot;Extract all skills mentioned.&quot; What&#x27;s the most effective improvement?"},"options":[{"k":"A","t":{"en":"Add post-extraction normalization that maps skills to a canonical taxonomy and deduplicates similar entries."}},{"k":"B","t":{"en":"Add constraints: &quot;Extract 10-20 skills maximum, one skill per entry, only explicitly named skills.&quot;"}},{"k":"C","t":{"en":"Add few-shot examples demonstrating compound phrase handling, explicit mention criteria, and appropriate entry granularity."}},{"k":"D","t":{"en":"Enrich the schema to {skill: string, confidence: float, source_quote: string[]} to capture extraction metadata."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Cả ba vấn đề — tách hay gộp cụm ghép, kỹ năng ngụ ý, độ dài mảng bất nhất — đều bắt nguồn từ chỉ dẫn mơ hồ “Extract all skills mentioned”. <b>Few-shot</b> minh họa cụ thể cách xử lý cụm ghép (tách “Python and SQL” thành hai mục), <b>tiêu chí chỉ lấy kỹ năng được nêu rõ</b> và <b>mức chi tiết phù hợp</b> giúp model học đúng ranh giới phán đoán, cho kết quả nhất quán giữa các tài liệu tương tự.","elim":["<b>A.</b> Chuẩn hóa sau trích xuất xử lý được trùng lặp/tên gọi nhưng không loại được kỹ năng suy diễn hay sửa mức chi tiết — chỉ xử lý triệu chứng.","<b>B.</b> Giới hạn cứng 10–20 là tùy tiện: CV có 30 kỹ năng thật bị cắt, CV ít kỹ năng có thể bị độn; chỉ dẫn ngắn gọn cũng không cho thấy cách xử lý cụm ghép.","<b>D.</b> Thêm confidence và source_quote giúp truy vết nhưng không định nghĩa cách tách cụm hay mức chi tiết, nên không giải quyết sự bất nhất."]},"cite":"Hướng dẫn ôn tập — §6.1 Few-shot Prompting; Lĩnh vực 4.2"},{"id":"t1q30","n":30,"topic":1,"type":"mcq","stem":{"en":"Your extraction system processes two document types: standard monthly reports (archived after processing) and urgent exception reports (must trigger business alerts within 30 minutes of receipt). Both use the same JSON schema. You want to minimize API costs while meeting latency requirements. How should you architect the processing pipeline?"},"options":[{"k":"A","t":{"en":"Queue all documents and submit hourly batches, flagging urgent documents for expedited handling when batch results return."}},{"k":"B","t":{"en":"Route standard reports to the Batch API for 50% cost savings, and route urgent exception reports to the real-time Messages API."}},{"k":"C","t":{"en":"Submit all documents to the Batch API with custom_ids for tracking. When results arrive, immediately process urgent documents and trigger delayed alerts for exceptions."}},{"k":"D","t":{"en":"Submit all documents to the real-time Messages API to ensure consistent processing latency across document types."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Định tuyến <b>theo yêu cầu độ trễ</b> của từng loại tài liệu: báo cáo tháng (lưu trữ, không gấp) đi qua <b>Batch API</b> để tiết kiệm 50%; báo cáo ngoại lệ phải phát cảnh báo trong 30 phút đi qua <b>Messages API real-time</b>, vì Batch API có thể mất tới 24 giờ và không có SLA về độ trễ. Chi phí thấp nhất mà vẫn đáp ứng yêu cầu thời gian.","elim":["<b>A.</b> Batch hàng giờ không bảo đảm kết quả trong 30 phút vì batch có thể mất tới 24 giờ; “xử lý ưu tiên” khi kết quả trở về thì đã quá muộn.","<b>C.</b> Đưa tài liệu khẩn qua Batch vi phạm yêu cầu 30 phút; <code>custom_id</code> chỉ để theo dõi, không tăng tốc, và “cảnh báo trễ” trái với mục tiêu.","<b>D.</b> Real-time cho tất cả đáp ứng độ trễ nhưng bỏ lỡ 50% tiết kiệm cho khối lượng lớn báo cáo tháng vốn không gấp."]},"cite":"Hướng dẫn ôn tập — §7.2 Khi nào dùng Batch API so với Synchronous API; Lĩnh vực 4.5"},{"id":"t1q31","n":31,"topic":1,"type":"mcq","stem":{"en":"The document analysis agent has a single analyze_document tool that takes a document and a free-text instruction parameter. During evaluation, requests like &quot;extract the key financial metrics&quot; often return narrative summaries, while &quot;summarize the methodology&quot; sometimes returns raw data tables. The synthesis agent reports that 35% of analysis results require re-requests with clarified instructions. What&#x27;s the most effective way to improve reliability?"},"options":[{"k":"A","t":{"en":"Keep the single tool but add an analysis_type enum parameter requiring explicit selection between extraction, summarization, and verification modes."}},{"k":"B","t":{"en":"Split the generic tool into purpose-specific tools– extract_data_points, summarize_content, verify_claim_against_source –each with defined input/output contracts."}},{"k":"C","t":{"en":"Have the coordinator pre-classify each analysis request before passing instructions to the document analysis agent."}},{"k":"D","t":{"en":"Enhance the tool description with detailed examples showing how different instruction phrasings should map to different output formats."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Một tool chung với tham số chỉ dẫn tự do khiến đầu ra mơ hồ — “extract” lại thành tóm tắt, “summarize” lại thành bảng số liệu. Tách thành các <b>tool chuyên biệt</b> (<code>extract_data_points</code>, <code>summarize_content</code>, <code>verify_claim_against_source</code>), <b>mỗi tool có hợp đồng input/output xác định</b>, khiến mục đích và định dạng kết quả rõ ràng ngay từ việc chọn tool, giảm mạnh tỷ lệ 35% phải yêu cầu lại.","elim":["<b>A.</b> Enum <code>analysis_type</code> giúp chọn chế độ nhưng vẫn là một tool với đầu ra không có hợp đồng riêng cho từng chế độ, nên định dạng kết quả vẫn không được ràng buộc.","<b>C.</b> Tiền phân loại ở coordinator thêm một bước nhưng tool đích vẫn chung chung với chỉ dẫn tự do; đầu ra không nhất quán vẫn còn.","<b>D.</b> Thêm ví dụ vào mô tả có thể cải thiện phần nào nhưng vẫn dựa vào việc diễn giải chỉ dẫn tự do, không có hợp đồng đầu ra ràng buộc."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q32","n":32,"topic":1,"type":"mcq","stem":{"en":"The coordinator agent has AgentFunctions configured for all four specialized subagents, each with appropriate descriptions and restrictions. During testing, you find the coordinator sometimes fails to delegate—it writes &quot;I&#x27;ll ask the web search agent to find sources&quot; without actually invoking it. What is the most likely cause?"},"options":[{"k":"A","t":{"en":"The AgentFunctions are configured correctly, but the coordinator&#x27;s system prompt includes a statement that prevents it from knowing the available subagent types."}},{"k":"B","t":{"en":"The coordinator&#x27;s allowed Tools configuration doesn&#x27;t include &quot;Task&quot;, so while it can describe delegation, it cannot actually invoke the tool required to spawn subagents."}},{"k":"C","t":{"en":"The coordinator&#x27;s max_tokens setting is too low, causing the Task tool invocation to be truncated before the subagent parameter can be specified."}},{"k":"D","t":{"en":"Subagent context limit descriptions from the coordinator don&#x27;t provide enough context; you need to configure explicit context content between coordinator and tool descriptions."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Coordinator spawn subagent bằng cách <b>gọi tool <code>Task</code></b>. Nếu <code>allowedTools</code> của coordinator không chứa <code>\"Task\"</code>, nó chỉ có thể <b>mô tả</b> việc ủy quyền bằng văn bản (“I'll ask the web search agent...”) mà không thể thực hiện lời gọi. Định nghĩa subagent dù đúng cũng vô dụng nếu coordinator thiếu tool để gọi chúng.","elim":["<b>A.</b> Coordinator rõ ràng biết có web search agent (nó nhắc đến tên) — vấn đề là không gọi được, không phải không biết loại subagent.","<b>C.</b> <code>max_tokens</code> thấp sẽ cắt phản hồi giữa chừng với <code>stop_reason</code> là <code>max_tokens</code>; ở đây coordinator viết câu hoàn chỉnh rồi kết thúc mà không có <code>tool_use</code>, không khớp triệu chứng cắt cụt.","<b>D.</b> Cách truyền context giữa coordinator và subagent ảnh hưởng chất lượng kết quả của subagent, không quyết định việc coordinator có thực hiện được lời gọi hay không."]},"cite":"Hướng dẫn ôn tập — §3.4 Tool Task để Sinh ra Subagent; Lĩnh vực 1.3"},{"id":"t1q33","n":33,"topic":1,"type":"mcq","stem":{"en":"When researching &quot;renewable energy adoption,&quot; the web search agent returns recent statistics (2024: 35% adoption) while the document analysis agent extracts data from internal reports (2022: 18% adoption). The synthesis agent incorrectly flags these as contradictory sources rather than recognizing the data shows growth over time. What change would best enable the synthesis agent to correctly interpret such temporal differences?"},"options":[{"k":"A","t":{"en":"Add a conflict resolution agent that automatically discards older data when newer data exists for the same metric."}},{"k":"B","t":{"en":"Configure the web search agent to only return results from the past 6 months."}},{"k":"C","t":{"en":"Require subagents to include publication or data collection dates in their structured outputs."}},{"k":"D","t":{"en":"Instruct the synthesis agent to always treat the most recent data as authoritative and place older findings in a separate historical appendix."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Synthesis agent hiểu nhầm vì <b>nó không bao giờ thấy ngày tháng</b>: 18% và 35% trông như mâu thuẫn, trong khi 2022 → 2024 thực ra là tăng trưởng. Yêu cầu các subagent <b>đưa ngày xuất bản/thu thập dữ liệu vào output có cấu trúc</b> bảo toàn metadata thời gian từ nguồn, giúp synthesis diễn giải đúng khác biệt theo thời gian thay vì gắn cờ xung đột.","elim":["<b>A.</b> Loại bỏ dữ liệu cũ làm mất thông tin xu hướng — chính cặp 2022/2024 thể hiện tăng trưởng; và nếu không có ngày thì cũng không biết cái nào cũ hơn.","<b>B.</b> Giới hạn 6 tháng bỏ mất dữ liệu lịch sử có giá trị và không xử lý dữ liệu thiếu ngày từ document analysis agent.","<b>D.</b> “Luôn coi dữ liệu mới nhất là chuẩn” là quy tắc cứng, vẫn cần ngày để biết cái nào mới nhất, và đẩy dữ liệu cũ ra phụ lục làm mất câu chuyện tăng trưởng."]},"cite":"Hướng dẫn ôn tập — §12.3 Bao gồm Ngày tháng để Diễn giải Đúng; Lĩnh vực 5.6"},{"id":"t1q34","n":34,"topic":1,"type":"mcq","stem":{"en":"Your multi-agent research pipeline crashed after processing 12 of 28 documents. The web search agent had identified relevant sources, the document analysis agent had partially completed extraction, and the synthesizer had begun pattern identification. You need to resume processing without repeating work or losing fidelity of prior findings. What state management approach best balances information fidelity with context efficiency when restoring agent state?"},"options":[{"k":"A","t":{"en":"Have each agent maintain its own persistent state file and reload it independently at the start of each session."}},{"k":"B","t":{"en":"Index all agent outputs in a shared vector store. When resuming, each agent queries the store using semantic search to retrieve relevant prior findings."}},{"k":"C","t":{"en":"Have each agent persist a structured report to a known location. On resume, the coordinator loads the reports and injects relevant state into agent prompts."}},{"k":"D","t":{"en":"Persist the coordinator&#x27;s conversation log containing all task delegations and responses, providing this to agents when resuming."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Mỗi agent ghi một <b>báo cáo trạng thái có cấu trúc</b> (status, phát hiện chính, phạm vi đã bao phủ, khoảng trống) ra <b>vị trí đã biết</b>; khi tiếp tục, <b>coordinator nạp các báo cáo/manifest</b> và chỉ chèn phần trạng thái liên quan vào prompt của từng agent. Cấu trúc rõ ràng giữ được độ trung thực, việc chọn lọc giữ context gọn, và coordinator nắm được agent nào đã xong, agent nào dở dang để không lặp lại công việc.","elim":["<b>A.</b> Mỗi agent tự nạp trạng thái riêng thiếu điều phối tập trung: coordinator không biết tiến độ tổng thể, và synthesis không nhận được kết quả của các agent khác.","<b>B.</b> Semantic search trả về mảnh theo độ tương đồng, có thể bỏ sót hoặc lấy sai, và mất cấu trúc tiến độ (cái gì xong, cái gì dở) — độ trung thực thấp.","<b>D.</b> Toàn bộ log hội thoại của coordinator rất lớn và nhiều nhiễu, gây tốn context; mỗi agent chỉ cần phần liên quan đến nó."]},"cite":"Hướng dẫn ôn tập — §11.6 Lưu trữ Trạng thái có Cấu trúc (để phục hồi sau sự cố); Lĩnh vực 5.4"},{"id":"t1q35","n":35,"topic":1,"type":"mcq","stem":{"en":"Production reviews reveal inconsistent handling of uncertainty in final reports. Sometimes confidence calibrations are synthesized into standardized uncertainty expressions, while other times results produce vague estimates without clear methodology. Which system-level improvement best addresses this inconsistency?"},"options":[{"k":"A","t":{"en":"Implement a confidence calibration layer where synthesis agent normalizes uncertainty expressions into standardized probability representations (0.0-1.0), then weights their calibrated confidence."}},{"k":"B","t":{"en":"Instruct the synthesis agent to use explicit sections separating confirmed findings from contested analysis, preserving original source characterizations."}},{"k":"C","t":{"en":"Configure subagents to only report findings with sufficient coverage breadth, source diversity, and quality criteria before passing results to the synthesis agent."}},{"k":"D","t":{"en":"Add a verification subagent that cross-references findings across sources, only accepting synthesis corroborated by at least two independent sources."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Giải pháp cấp hệ thống là <b>cấu trúc báo cáo cố định</b>: các mục riêng tách <b>phát hiện đã xác nhận</b> khỏi <b>phân tích còn tranh cãi</b>, đồng thời <b>giữ nguyên cách nguồn gốc mô tả mức độ chắc chắn</b>. Nhờ vậy cách xử lý bất định luôn nhất quán giữa các báo cáo, người đọc biết rõ điều gì chắc chắn và điều gì chưa, mà không mất sắc thái của nguồn.","elim":["<b>A.</b> Quy đổi mọi cách diễn đạt bất định thành xác suất 0.0–1.0 tạo ra độ chính xác giả — các nguồn không có phương pháp hiệu chỉnh chung, con số quy đổi che mất cách nguồn thực sự diễn đạt.","<b>C.</b> Lọc chỉ giữ phát hiện đạt chuẩn làm mất chính những thông tin bất định/tranh cãi cần được trình bày minh bạch.","<b>D.</b> Chỉ chấp nhận phát hiện có hai nguồn độc lập loại bỏ các phát hiện đơn nguồn hợp lệ, và không giải quyết cách trình bày sự bất định."]},"cite":"Hướng dẫn ôn tập — §12.2 Xử lý Dữ liệu Xung đột; Lĩnh vực 5.6"},{"id":"t1q36","n":36,"topic":1,"type":"mcq","stem":{"en":"The coordinator provides detailed step-by-step instructions to the web search subagent, specifying exact search queries, source quality criteria (coverage breadth, source diversity), and content type classifications. The coordinator sometimes encounters challenges where instructions fail when the subagent encounters unexpected situations. What&#x27;s the most effective way to improve subagent adaptability?"},"options":[{"k":"A","t":{"en":"Remove procedural detail entirely, delegating with simple goals like &quot;research it thoroughly&quot; and relying on the subagent&#x27;s general capabilities."}},{"k":"B","t":{"en":"Specify research goals and quality criteria (coverage breadth, source diversity, content type) rather than procedural instructions, letting the subagent determine execution."}},{"k":"C","t":{"en":"Add explicit fallback directives to the detailed instructions: &quot;if specified searches fail, attempt alternative queries before reporting failure.&quot;"}},{"k":"D","t":{"en":"Implement a task classification step where the coordinator categorizes requests as &quot;analytical&quot; vs &quot;exploratory&quot; and uses different instruction sets for each category."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Chỉ dẫn từng bước cứng nhắc sẽ gãy khi subagent gặp tình huống ngoài dự kiến. Coordinator nên nêu <b>mục tiêu nghiên cứu và tiêu chí chất lượng</b> (độ bao phủ, đa dạng nguồn, loại nội dung) thay vì thủ tục, để <b>subagent tự quyết cách thực hiện</b>. Subagent vẫn có thước đo để đánh giá kết quả, đồng thời đủ linh hoạt để đổi truy vấn hay hướng tiếp cận khi gặp bất ngờ.","elim":["<b>A.</b> Chỉ giao “research it thoroughly” làm mất luôn tiêu chí chất lượng — subagent không biết thế nào là đủ, kết quả thiếu nhất quán.","<b>C.</b> Thêm fallback chỉ vá một kịch bản hỏng (truy vấn thất bại); chỉ dẫn vẫn mang tính thủ tục và không lường trước được các tình huống khác.","<b>D.</b> Hai bộ chỉ dẫn theo loại vẫn là thủ tục cứng nhắc, chỉ thêm độ phức tạp mà không giải quyết gốc rễ."]},"cite":"Hướng dẫn ôn tập — §3.3 Hub-and-Spoke: Coordinator và Subagent; Lĩnh vực 1.3"},{"id":"t1q37","n":37,"topic":1,"type":"mcq","stem":{"en":"A user is expanding the research system beyond its single web search agent by adding specialized data sources. They add a financial API agent that returns structured JSON with revenue, margins, and growth rates; a news monitoring agent that returns prose summaries of recent developments; and a patent analysis agent that returns structured lists of technology areas. The synthesis agent combines these into executive briefings. Currently, it converts everything to bullet points, causing financial comparisons to lose tabular clarity and news summaries to lose narrative flow. What change would most improve briefing quality?"},"options":[{"k":"A","t":{"en":"Standardize all subagent outputs to prose summaries with inline citations."}},{"k":"B","t":{"en":"Add a format conversion layer between subagents and synthesis that transforms all outputs to a common intermediate representation."}},{"k":"C","t":{"en":"Update the synthesis agent to render each content type appropriately–financial data as tables, news as prose."}},{"k":"D","t":{"en":"Standardize all subagent outputs to JSON with fields for claim, evidence, source, and confidence."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Vấn đề nằm ở bước trình bày: synthesis agent ép mọi thứ thành bullet point. Nguyên tắc là <b>trình bày theo loại nội dung</b> — dữ liệu tài chính dạng <b>bảng</b> để so sánh, tin tức dạng <b>văn xuôi</b> để giữ mạch tường thuật, danh sách công nghệ của bằng sáng chế dạng danh sách có cấu trúc. Cập nhật synthesis agent để render phù hợp từng loại giữ được ưu điểm vốn có của mỗi nguồn.","elim":["<b>A.</b> Chuẩn hóa thành văn xuôi làm mất tính dạng bảng của dữ liệu tài chính — chỉ đổi một kiểu ép định dạng sang kiểu khác.","<b>B.</b> Lớp chuyển đổi về một biểu diễn chung chính là cách “ép một định dạng” gây mất sắc thái, lại thêm độ phức tạp.","<b>D.</b> JSON claim/evidence chuẩn hóa đầu vào, nhưng vấn đề là cách synthesis trình bày đầu ra; nó không biến dữ liệu tài chính thành bảng hay tin tức thành văn xuôi."]},"cite":"Hướng dẫn ôn tập — §12.4 Trình bày theo Loại Nội dung; Lĩnh vực 5.6"},{"id":"t1q38","n":38,"topic":1,"type":"mcq","stem":{"en":"The web search agent has gathered several relevant sources for a research topic. The document analysis agent now needs to examine these sources. How does information typically flow between these two specialized subagents?"},"options":[{"k":"A","t":{"en":"The coordinator agent receives the web search agent&#x27;s output and includes relevant findings in the prompt when invoking the document analysis agent."}},{"k":"B","t":{"en":"Both agents access a shared memory store where the web search agent writes findings and the document analysis agent reads them."}},{"k":"C","t":{"en":"The web search agent directly invokes the document analysis agent, passing the discovered sources as parameters."}},{"k":"D","t":{"en":"The agents communicate through an event-driven message queue, with the document analysis agent subscribing to web search completion events."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Trong kiến trúc <b>hub-and-spoke</b>, subagent không giao tiếp trực tiếp với nhau và <b>không tự kế thừa context</b>. Mọi luồng thông tin đi qua <b>coordinator</b>: nó nhận output của web search agent, chọn các phát hiện liên quan rồi <b>đưa tường minh vào prompt</b> khi gọi document analysis agent.","elim":["<b>B.</b> Shared memory store không phải cơ chế điển hình; subagent chỉ biết những gì được truyền trong prompt của nó.","<b>C.</b> Subagent không gọi trực tiếp subagent khác — việc điều phối và spawn thuộc về coordinator.","<b>D.</b> Message queue event-driven là hạ tầng bên ngoài, không phải cách luồng thông tin điển hình giữa các subagent trong mô hình coordinator–subagent."]},"cite":"Hướng dẫn ôn tập — §3.3 Hub-and-Spoke: Coordinator và Subagent; Lĩnh vực 1.2"},{"id":"t1q39","n":39,"topic":1,"type":"mcq","stem":{"en":"After the web search agent and document analysis agent complete their tasks, the coordinator invokes the synthesis agent. However, the synthesis agent responds that it cannot complete the task because no research findings were provided. What is the most likely cause of this issue?"},"options":[{"k":"A","t":{"en":"The synthesis agent needs tools that can fetch results directly from the other agents&#x27; conversation histories."}},{"k":"B","t":{"en":"The subagents need to share a single API connection to enable automatic context sharing between invocations."}},{"k":"C","t":{"en":"The coordinator did not include the outputs from the previous agents in the synthesis agent&#x27;s prompt."}},{"k":"D","t":{"en":"The synthesis agent&#x27;s context window is not large enough to hold the combined outputs from both previous agents."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Subagent có <b>context cô lập</b>: synthesis agent chỉ thấy đúng những gì coordinator đưa vào prompt khi gọi nó, không tự động thấy kết quả của các agent trước. Câu trả lời “không có findings” cho thấy <b>coordinator đã không chèn output của web search và document analysis</b> vào prompt — context phải được truyền tường minh.","elim":["<b>A.</b> Không có cơ chế để subagent đọc lịch sử hội thoại của agent khác; cách đúng là coordinator truyền dữ liệu qua prompt.","<b>B.</b> Mỗi lời gọi API là stateless; dùng chung kết nối API không chia sẻ context giữa các lần gọi.","<b>D.</b> Context window không đủ sẽ gây lỗi hoặc cắt bớt, không khiến agent báo là không nhận được findings nào — dữ liệu ở đây chưa từng được gửi."]},"cite":"Hướng dẫn ôn tập — §3.4 Tool Task để Sinh ra Subagent; Lĩnh vực 1.3"},{"id":"t1q40","n":40,"topic":1,"type":"mcq","stem":{"en":"In production, final reports frequently contain claims without proper source attribution. Investigation shows that while the web search and document analysis agents correctly attach citations to their outputs, the synthesis agent loses track of which sources support which conclusions when combining findings. What&#x27;s the most effective architectural change?"},"options":[{"k":"A","t":{"en":"Require all subagents to output structured claim-source mappings that the synthesis agent must preserve and merge when combining findings from multiple sources."}},{"k":"B","t":{"en":"Add a verification step where the report generator uses semantic similarity matching against original sources to reconstruct which claims came from which documents."}},{"k":"C","t":{"en":"Have the coordinator inject source identifier prefixes into text before each handoff, then parse these prefixes at report generation to reconstruct citations."}},{"k":"D","t":{"en":"Maintain complete transcripts of all subagent interactions and add a citation-resolution agent to analyze logs and determine attributions before report generation."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Citation bị mất ở <b>bước tổng hợp</b>, nên phải giữ liên kết claim → nguồn dưới dạng <b>dữ liệu có cấu trúc</b> suốt pipeline: mọi subagent xuất <b>claim-source mapping</b> (claim, nguồn, ngày...) và synthesis agent <b>bắt buộc bảo toàn và hợp nhất</b> các mapping này khi kết hợp phát hiện. Provenance được bảo toàn từ đầu thay vì phải tái dựng sau.","elim":["<b>B.</b> So khớp semantic similarity là đoán lại nguồn sau khi thông tin đã mất; kém chính xác với các claim đã được tổng hợp hoặc diễn đạt lại.","<b>C.</b> Prefix chèn vào văn bản rất mong manh: khi synthesis viết lại câu, prefix dễ bị mất hoặc lệch chỗ, và parse văn bản tự do không đáng tin.","<b>D.</b> Phân tích transcript để suy ra quy kết tốn kém, phức tạp và vẫn là suy đoán sau sự việc thay vì bảo toàn ngay từ đầu."]},"cite":"Hướng dẫn ôn tập — §12.1 Vấn đề Mất Quy kết Nguồn; Lĩnh vực 5.6"},{"id":"t1q41","n":41,"topic":1,"type":"mcq","stem":{"en":"Production monitoring shows that follow-up queries like &quot;summarize what we learned about market trends&quot; consistently take 40+ seconds. Investigation reveals the coordinator spawns the synthesis subagent for each summarization request, passing 80K+ tokens of accumulated findings. The coordinator already has these findings in its context from orchestrating the research. What&#x27;s the most effective way to improve response time for these follow-up summaries?"},"options":[{"k":"A","t":{"en":"Spawn the synthesis subagent with reduced context and have it request specific findings from the coordinator on-demand."}},{"k":"B","t":{"en":"Pre-generate and cache summaries at multiple granularities whenever new findings accumulate."}},{"k":"C","t":{"en":"Have the coordinator handle straightforward summarization requests directly using its existing context, reserving subagent spawning for complex analysis."}},{"k":"D","t":{"en":"Enable prompt caching on the synthesis subagent to reduce the overhead of repeatedly transferring the same research findings."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Coordinator <b>đã có sẵn toàn bộ findings trong context</b>; spawn synthesis subagent cho một yêu cầu tóm tắt đơn giản buộc phải truyền lại 80K+ token, gây độ trễ 40+ giây vô ích. Ủy quyền cho subagent có chi phí, chỉ đáng khi lợi ích (cô lập context, chuyên môn hóa) vượt chi phí — nên coordinator <b>tự xử lý tóm tắt đơn giản</b> và chỉ spawn subagent cho phân tích phức tạp.","elim":["<b>A.</b> Subagent hỏi lại coordinator theo nhu cầu tạo nhiều vòng qua lại, có thể còn chậm hơn, và vẫn là spawn không cần thiết.","<b>B.</b> Sinh trước tóm tắt ở nhiều mức tốn chi phí cho những bản có thể không bao giờ dùng, và khó khớp các câu hỏi follow-up cụ thể.","<b>D.</b> Prompt caching giảm phần nào chi phí xử lý tiền tố nhưng vẫn phải spawn subagent và truyền 80K token mỗi lần; không loại bỏ bước thừa."]},"cite":"Hướng dẫn ôn tập — §3.3 Hub-and-Spoke: Coordinator và Subagent; Lĩnh vực 1.2"},{"id":"t1q42","n":42,"topic":1,"type":"mcq","stem":{"en":"After the web search agent finds 25 sources (120K tokens of raw content), the document analysis agent extracts key insights (15K tokens), and the synthesis agent produces a coherent narrative draft (3K tokens), the coordinator must pass context to the report generation agent for the final output with proper source citations. What context-passing strategy provides the best balance of completeness and efficiency?"},"options":[{"k":"A","t":{"en":"Pass the full accumulated context from all prior agents."}},{"k":"B","t":{"en":"Pass the synthesis draft along with a structured source index that maps key claims to their source URLs and relevant excerpts."}},{"k":"C","t":{"en":"Pass a condensed summary of all prior stages that preserves the main findings and attributes them to sources by name only."}},{"k":"D","t":{"en":"Pass only the synthesis draft and have a separate post-processing pipeline match claims to sources and insert citations after the report is generated."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Agent tạo báo cáo cần hai thứ: nội dung đã tổng hợp (bản nháp 3K token) và <b>ánh xạ claim → source</b> để trích dẫn chính xác. Một <b>source index có cấu trúc</b> (claim ↔ URL ↔ đoạn trích liên quan) giữ nguyên provenance mà không phải kéo theo 120K token nội dung thô. Đây là nguyên tắc truyền context có chọn lọc: chỉ đưa đúng dữ liệu cần cho tác vụ kế tiếp, nhưng dưới dạng có cấu trúc để không mất metadata nguồn.","elim":["<b>A.</b> Chuyển toàn bộ context (~138K token) là lãng phí, dễ gây lost-in-the-middle và có thể chạm giới hạn context, trong khi phần lớn nội dung thô không cần cho bước viết báo cáo.","<b>C.</b> Chỉ ghi nguồn bằng tên làm mất URL và đoạn trích cụ thể, nên agent không thể tạo trích dẫn chính xác hay kiểm chứng từng claim.","<b>D.</b> Ghép trích dẫn sau khi đã sinh báo cáo là sửa lỗi hậu kỳ: pipeline phải đoán lại claim nào đến từ nguồn nào, dễ ghép sai vì liên kết claim–nguồn đã không được truyền đi."]},"cite":"Hướng dẫn ôn tập — §12.1 Vấn đề Mất Quy kết Nguồn; Lĩnh vực 5.6"},{"id":"t1q43","n":43,"topic":1,"type":"mcq","stem":{"en":"When analyzing complex legal cases that cite multiple precedents, the document analysis subagent processes each sequentially. A landmark case citing 12 precedents takes over 3 minutes to analyze completely. What&#x27;s the most effective way to reduce this latency while preserving the coordinator&#x27;s ability to monitor and debug the system?"},"options":[{"k":"A","t":{"en":"Implement a message queue where precedent analysis tasks are processed asynchronously by a pool of worker agents."}},{"k":"B","t":{"en":"Create a recursive agent hierarchy where analysis agents subdivide work among child agents until reaching single-precedent granularity."}},{"k":"C","t":{"en":"Have the coordinator spawn parallel document analysis subagents, each handling a subset of precedents, then aggregate results before synthesis."}},{"k":"D","t":{"en":"Enable the document analysis subagent to spawn its own specialized subagents dynamically when it encounters cases with many citations."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> 12 precedent có thể phân tích <b>độc lập</b>, nên cách giảm latency tự nhiên nhất là để coordinator <b>spawn nhiều subagent song song</b> (nhiều lời gọi <code>Task</code> trong cùng một lượt), mỗi subagent xử lý một nhóm precedent, rồi tổng hợp kết quả trước bước synthesis. Vì mọi lần giao việc và kết quả đều đi qua coordinator, kiến trúc hub-and-spoke vẫn giữ được <b>khả năng quan sát và debug tập trung</b>.","elim":["<b>A.</b> Message queue với pool worker bất đồng bộ đưa thêm hạ tầng ngoài luồng điều phối của coordinator, làm giảm khả năng giám sát và debug mà đề bài yêu cầu giữ lại.","<b>B.</b> Hệ phân cấp agent đệ quy nhiều tầng làm phức tạp hóa quá mức và khiến luồng thực thi khó theo dõi từ coordinator.","<b>D.</b> Để subagent tự spawn subagent con làm giao tiếp bỏ qua coordinator, phá vỡ mô hình hub-and-spoke và mất khả năng quan sát tập trung."]},"cite":"Hướng dẫn ôn tập — §3.4 Tool Task để Sinh ra Subagent; Lĩnh vực 1.3"},{"id":"t1q44","n":44,"topic":1,"type":"mcq","stem":{"en":"In production, you&#x27;re distributing complex queries to specialized subagents. The query distribution is uneven and evolving as users discover new applications. What&#x27;s the most effective approach to optimize for query complexity?"},"options":[{"k":"A","t":{"en":"Have the coordinator analyze each query dynamically and selectively route subagents based on the query&#x27;s complexity and routing characteristics."}},{"k":"B","t":{"en":"Create a fast-track path for factual questions that bypasses subagents entirely, routing only analytical queries through the complete pipeline."}},{"k":"C","t":{"en":"Train a query complexity classifier based on labeled historical data to predict optimal subagent combination."}},{"k":"D","t":{"en":"Implement pattern-based routing that categorizes queries based on factual vs analytical patterns and maps each to a predefined subagent combination."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Khi phân bố truy vấn <b>không đều và liên tục thay đổi</b>, mọi cơ chế định tuyến cố định (fast-track, pattern, classifier) đều sẽ lỗi thời. Cách bền vững là để <b>coordinator phân tích từng truy vấn và chọn động</b> những subagent cần gọi: câu hỏi factual đơn giản chỉ cần ít bước, nghiên cứu so sánh phức tạp mới cần cả pipeline. Đây chính là trách nhiệm của coordinator trong mô hình hub-and-spoke — <b>lựa chọn subagent một cách động</b> dựa trên yêu cầu của truy vấn — và nó tự thích ứng với các kiểu truy vấn mới mà không cần sửa luật hay huấn luyện lại (giống câu t1q64).","elim":["<b>B.</b> Fast-track bỏ qua <i>toàn bộ</i> subagent là luật cứng chia đôi factual/analytical; với phân bố đang thay đổi, nhiều truy vấn sẽ bị xếp sai nhánh — câu “factual” cần xác minh nguồn sẽ thiếu chiều sâu, còn câu phân tích vừa phải vẫn phải đi cả pipeline tốn kém.","<b>C.</b> Classifier cần dữ liệu gán nhãn và phải huấn luyện lại liên tục khi phân bố truy vấn trôi dạt — overengineering, trong khi coordinator đã có sẵn khả năng suy luận về yêu cầu của từng truy vấn.","<b>D.</b> Routing theo pattern với tổ hợp subagent định sẵn rất dễ gãy khi người dùng liên tục tìm ra kiểu truy vấn mới không khớp danh mục nào."]},"cite":"Hướng dẫn ôn tập — §3.3 Hub-and-Spoke: Coordinator và Subagent; §8.2 Phân rã thích ứng động; Lĩnh vực 1.2"},{"id":"t1q45","n":45,"topic":1,"type":"mcq","stem":{"en":"The synthesis agent receives summarized findings from the web search and document analysis agents, then passes a consolidated summary to the report generator. During testing, you discover the generated reports make factual claims without proper citations–the report generator cannot attribute statements to their original sources because that metadata was lost during the summarization steps. What&#x27;s the most effective approach to ensure proper source attribution in the final reports?"},"options":[{"k":"A","t":{"en":"Have the report generator query the web search agent to re-locate sources for claims in the final report."}},{"k":"B","t":{"en":"Instruct the synthesis agent to embed source references inline within its summary text using a consistent citation format."}},{"k":"C","t":{"en":"Have each agent output structured data separating content summaries from source metadata (URLs, document names, page numbers)."}},{"k":"D","t":{"en":"Skip summarization and pass full raw outputs from web search and document analysis directly to the report generator."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Nguyên nhân gốc là metadata nguồn bị mất khi tóm tắt dưới dạng văn xuôi. Khắc phục tận gốc là yêu cầu <b>mỗi agent xuất dữ liệu có cấu trúc</b>, <b>tách phần nội dung tóm tắt khỏi metadata nguồn</b> (URL, tên tài liệu, số trang) để ánh xạ claim → source đi qua mọi bước của pipeline. Như vậy report generator luôn có đủ thông tin để quy kết từng nhận định.","elim":["<b>A.</b> Bắt report generator truy vấn lại web search để tìm lại nguồn là sửa lỗi sau khi đã mất, tốn thêm vòng lặp và có thể ghép claim với nguồn khác nguồn gốc ban đầu.","<b>B.</b> Nhúng trích dẫn inline vào văn bản chỉ áp dụng ở agent synthesis và vẫn phụ thuộc vào việc các bước tóm tắt trước đó còn giữ metadata; trích dẫn dạng chữ cũng dễ bị cô đọng mất ở bước sau.","<b>D.</b> Bỏ tóm tắt và chuyển toàn bộ đầu ra thô làm bùng nổ token và gây lost-in-the-middle, trong khi vấn đề chỉ là mất metadata."]},"cite":"Hướng dẫn ôn tập — §12.1 Vấn đề Mất Quy kết Nguồn; Lĩnh vực 1.3, 5.6"},{"id":"t1q46","n":46,"topic":1,"type":"mcq","stem":{"en":"When implementing your lookup_order MCP tool, the backend sometimes returns errors (e.g., &quot;Order not found&quot; or temporary database failures). What is the correct pattern for communicating these errors back to the agent?"},"options":[{"k":"A","t":{"en":"Return the error message in the tool result content with the isError flag set to true"}},{"k":"B","t":{"en":"Return a success response with a &quot;status&quot; field indicating the error type"}},{"k":"C","t":{"en":"Log the error server-side and return an empty result to avoid confusing the model"}},{"k":"D","t":{"en":"Throw an exception from the tool handler so the agent framework can catch and log it"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Trong MCP, lỗi khi thực thi tool được trả về <b>bên trong tool result</b>: đặt thông điệp lỗi vào <code>content</code> và đặt cờ <code>isError: true</code>. Nhờ vậy mô hình <b>biết lời gọi đã thất bại và đọc được lý do</b> (ví dụ “Order not found” khác với lỗi database tạm thời), từ đó quyết định retry, hỏi lại khách hay escalation.","elim":["<b>B.</b> Trả về phản hồi “success” kèm trường status che giấu thất bại; mô hình có thể coi đó là dữ liệu hợp lệ thay vì một lỗi.","<b>C.</b> Trả về kết quả rỗng là anti-pattern ém lỗi: agent không phân biệt được “không có dữ liệu” với “tra cứu thất bại”.","<b>D.</b> Ném exception khiến lỗi bị xử lý ở tầng framework/giao thức, mô hình không nhận được thông tin lỗi trong ngữ cảnh để tự điều chỉnh."]},"cite":"Hướng dẫn ôn tập — §4.4 Cờ isError trong MCP; Lĩnh vực 2.2"},{"id":"t1q47","n":47,"topic":1,"type":"mcq","stem":{"en":"After investigating a billing dispute over 25+ turns, you&#x27;ve identified that duplicate charges occurred due to a payment gateway timeout triggering retry logic. The required refund ($847) exceeds your $500 authorization limit. You need to call escalate_to_human, and the human agent won&#x27;t have access to your conversation transcript. What context should you pass to enable effective resolution?"},"options":[{"k":"A","t":{"en":"The customer&#x27;s original complaint verbatim plus the tool result excerpts showing duplicate transactions."}},{"k":"B","t":{"en":"The complete conversation transcript with all tool results."}},{"k":"C","t":{"en":"Your diagnosis and the refund amount only."}},{"k":"D","t":{"en":"A structured summary: customer ID, root cause, refund amount, and recommended action."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Nhân viên tiếp nhận <b>không thấy transcript</b>, nên bản bàn giao phải <b>tự chứa và có cấu trúc</b>: customer ID, root cause (gateway timeout kích hoạt retry gây trùng phí), số tiền hoàn ($847) và hành động đề xuất. Đây đúng là mẫu structured handoff: đủ để hành động ngay mà không phải đọc lại 25+ lượt hội thoại.","elim":["<b>A.</b> Khiếu nại nguyên văn và trích đoạn tool result thiếu chẩn đoán root cause, số tiền cần hoàn và đề xuất, buộc nhân viên tự phân tích lại.","<b>B.</b> Toàn bộ transcript quá dài và nhiễu cho người xử lý; đề bài còn nói rõ nhân viên không có quyền truy cập transcript.","<b>C.</b> Chỉ có chẩn đoán và số tiền thì thiếu customer ID và hành động đề xuất, chưa đủ để nhân viên xác định tài khoản và xử lý."]},"cite":"Hướng dẫn ôn tập — §9.3 Các giao thức bàn giao có cấu trúc (Structured Handoff); Lĩnh vực 1.4"},{"id":"t1q48","n":48,"topic":1,"type":"mcq","stem":{"en":"Your agent has called lookup_order multiple times while investigating a customer&#x27;s return requests. Each response includes 40+ fields (items, shipping details, payment info, status history). Tool outputs now represent the majority of the conversation&#x27;s context. The customer mentions two more orders they want to discuss. What&#x27;s the most effective approach before making additional lookups?"},"options":[{"k":"A","t":{"en":"Proceed with additional lookups without modifying the existing tool output context"}},{"k":"B","t":{"en":"Move all tool responses to a vector database with semantic indexing, retrieving relevant portions as the conversation continues"}},{"k":"C","t":{"en":"Have the model generate a natural language summary of each order&#x27;s key details, replacing structured responses with prose descriptions"}},{"k":"D","t":{"en":"Extract only return-relevant fields (items, purchase date, return window, status) from each existing order response, removing verbose details"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Đầu ra tool tích lũy trong context <b>không tương xứng với mức liên quan</b>: mỗi đơn 40+ trường nhưng tác vụ đổi trả chỉ cần vài trường. <b>Cắt gọn kết quả tool</b> xuống các trường liên quan (items, ngày mua, return window, status) giải phóng context trước khi tra cứu thêm hai đơn mới, mà vẫn <b>giữ dữ liệu ở dạng có cấu trúc, chính xác</b>.","elim":["<b>A.</b> Tiếp tục tra cứu mà không xử lý sẽ đẩy thêm hai khối 40+ trường vào context vốn đã quá tải, làm tăng nhiễu và nguy cơ chạm giới hạn.","<b>B.</b> Vector database với semantic indexing là overengineering cho một phiên hỗ trợ, và việc truy xuất theo ngữ nghĩa có thể bỏ sót trường cần thiết.","<b>C.</b> Chuyển dữ liệu có cấu trúc thành văn xuôi có nguy cơ làm mất hoặc làm mờ các giá trị chính xác (ngày, số tiền, trạng thái)."]},"cite":"Hướng dẫn ôn tập — §11.2 Cắt gọn Kết quả Tool; Lĩnh vực 5.1"},{"id":"t1q49","n":49,"topic":1,"type":"mcq","stem":{"en":"A customer sends: &quot;This is frustrating. I&#x27;ve explained my issue twice and nothing is being resolved. I want to talk to a real person NOW.&quot; The agent has not yet called any tools to investigate their account. What should the agent do?"},"options":[{"k":"A","t":{"en":"Immediately call escalate_to_human with the conversation history."}},{"k":"B","t":{"en":"Briefly explain what the agent can help with and offer to resolve the issue quickly, escalating only if the customer repeats their request."}},{"k":"C","t":{"en":"Acknowledge the frustration and ask one targeted question to understand the specific issue before escalating."}},{"k":"D","t":{"en":"First call get_customer and lookup_order to gather account context, then escalate to a human agent."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Khách hàng đã <b>yêu cầu rõ ràng được gặp người thật</b> (“I want to talk to a real person NOW”) sau khi đã giải thích hai lần. Theo nguyên tắc escalation, <b>yêu cầu tường minh của khách phải được đáp ứng ngay</b>, không cố tự giải quyết, không điều tra hay hỏi thêm trước. Gọi <code>escalate_to_human</code> <b>kèm lịch sử hội thoại</b> giúp nhân viên tiếp nhận có đủ context, nên khách không phải giải thích lần thứ ba.","elim":["<b>B.</b> Giới thiệu khả năng của agent và chỉ escalation khi khách nhắc lại là phớt lờ một yêu cầu đã rõ ràng, khiến khách càng bức xúc.","<b>C.</b> Hỏi thêm “một câu” vẫn là trì hoãn một yêu cầu tường minh; lịch sử hội thoại được chuyển kèm đã chứa nội dung khách giải thích hai lần, nên không cần khách trả lời thêm trước khi chuyển.","<b>D.</b> Tự gọi <code>get_customer</code> và <code>lookup_order</code> trước là điều tra khi khách không yêu cầu, làm chậm việc chuyển cho người thật."]},"cite":"Hướng dẫn ôn tập — §9.1 Khi nào escalation lên cho con người; §9.2 Các mẫu Escalation; Lĩnh vực 5.2"},{"id":"t1q50","n":50,"topic":1,"type":"mcq","stem":{"en":"You&#x27;re implementing the escalation logic for when the agent should call escalate_to_human. Your team proposes four different approaches for triggering escalation. Which approach will most reliably identify cases that genuinely require human intervention?"},"options":[{"k":"A","t":{"en":"Instruct the agent to escalate when the customer requests a human, when the issue requires policy exceptions, or when the agent cannot make meaningful progress."}},{"k":"B","t":{"en":"Configure the agent to escalate after three consecutive tool calls that fail to resolve the customer&#x27;s stated issue, ensuring a reasonable attempt before involving a human."}},{"k":"C","t":{"en":"Build a rules engine that maps specific issue types, customer segments, and product categories to escalation decisions, removing the need for model judgment calls."}},{"k":"D","t":{"en":"Implement sentiment analysis that monitors for frustration indicators (negative language, repeated questions, exclamation marks) and trigger escalation when the frustration score exceeds a configured threshold."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Ba tác nhân escalation đáng tin cậy là: <b>khách yêu cầu rõ ràng gặp người thật</b>, <b>cần ngoại lệ/chính sách không bao quát</b>, và <b>agent không thể tiến triển</b>. Các tiêu chí này bám vào bản chất của ca (thẩm quyền, chính sách, khả năng giải quyết) thay vì tín hiệu bề mặt, và cho phép mô hình phán đoán theo ngữ cảnh.","elim":["<b>B.</b> Ngưỡng cố định “3 lần gọi tool thất bại” là heuristic tùy ý: có ca cần nhiều bước hợp lệ, có ca (như yêu cầu ngoại lệ) nên escalation ngay từ đầu.","<b>C.</b> Rules engine ánh xạ loại vấn đề/phân khúc/sản phẩm cứng nhắc, không bao quát được lỗ hổng chính sách hay tình huống mới, và loại bỏ phán đoán theo ngữ cảnh.","<b>D.</b> Sentiment analysis là thước đo không đáng tin: mức độ bực bội của khách không tương quan với độ phức tạp hay việc có cần con người can thiệp."]},"cite":"Hướng dẫn ôn tập — §9.1 Khi nào escalation lên cho con người; Lĩnh vực 5.2"},{"id":"t1q51","n":51,"topic":1,"type":"mcq","stem":{"en":"Your agent is handling a billing dispute. After calling get_customer and lookup_order, it identifies that the dispute involves a promotional pricing error requiring manager approval–beyond the agent&#x27;s authorization level. How should the workflow handle this mid-process escalation?"},"options":[{"k":"A","t":{"en":"Attempt the refund with process_refund anyway, escalating only if the system rejects the transaction."}},{"k":"B","t":{"en":"Compile a structured handoff with customer details, order info, and the identified issue before calling escalate_to_human."}},{"k":"C","t":{"en":"Call escalate_to_human passing only the customer&#x27;s original message."}},{"k":"D","t":{"en":"Persist the complete conversation and tool response history to a database, then call escalate_to_human with a reference ID."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Khi escalation giữa quy trình, agent đã thu thập được dữ liệu giá trị qua <code>get_customer</code> và <code>lookup_order</code>. Nó nên <b>tổng hợp một bản bàn giao có cấu trúc</b> (thông tin khách, đơn hàng, vấn đề đã xác định là lỗi giá khuyến mãi cần quản lý duyệt) rồi mới gọi <code>escalate_to_human</code>, để người tiếp nhận <b>hành động ngay mà không phải điều tra lại</b>.","elim":["<b>A.</b> Cố gọi <code>process_refund</code> khi biết rõ vượt thẩm quyền là vi phạm chính sách; không được dựa vào việc hệ thống từ chối để làm rào chắn.","<b>C.</b> Chỉ chuyển tin nhắn gốc bỏ phí toàn bộ kết quả điều tra, buộc nhân viên làm lại từ đầu.","<b>D.</b> Lưu toàn bộ lịch sử và chỉ gửi reference ID buộc nhân viên tự đọc và lọc dữ liệu thô, thay vì nhận ngay một bản tóm tắt sẵn sàng hành động."]},"cite":"Hướng dẫn ôn tập — §9.3 Các giao thức bàn giao có cấu trúc (Structured Handoff); Lĩnh vực 1.4"},{"id":"t1q52","n":52,"topic":1,"type":"mcq","stem":{"en":"During a billing dispute resolution, your agent successfully retrieves customer info via get_customer and order details via lookup_order, but when attempting to process the refund via process_refund, the tool returns a timeout error. The agent has enough information to explain the billing, confirm the refund eligibility, and verify refund eligibility, but cannot actually process the refund due to the backend failure. What approach best balances first-contact resolution with appropriate error handling?"},"options":[{"k":"A","t":{"en":"Escalate immediately to a human agent since the refund action cannot be completed"}},{"k":"B","t":{"en":"Implement automatic retries with exponential backoff for process_refund, keeping the conversation open until the refund is successfully processed"}},{"k":"C","t":{"en":"Confirm the refund will be processed and close the conversation, since the system has all necessary information to complete it automatically"}},{"k":"D","t":{"en":"Explain the billing, confirm refund eligibility, acknowledge the system issue preventing immediate processing, and offer escalation or retry later"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Agent nên <b>cung cấp mọi giá trị nó có thể</b> (giải thích hóa đơn, xác nhận đủ điều kiện hoàn tiền), đồng thời <b>minh bạch về lỗi hệ thống</b> và đưa ra lựa chọn (escalation hoặc thử lại sau). Cách này tối đa hóa giải quyết ngay lần đầu mà không hứa hẹn điều chưa xảy ra, đúng tinh thần graceful degradation khi gặp lỗi tạm thời.","elim":["<b>A.</b> Escalation ngay bỏ phí phần việc agent đã làm được và chuyển cho con người một ca thực chất chỉ vướng lỗi backend tạm thời.","<b>B.</b> Giữ hội thoại mở để retry vô hạn với backoff khiến khách phải chờ không biết bao lâu; lỗi có thể kéo dài và khách không được thông báo.","<b>C.</b> Xác nhận hoàn tiền “sẽ được xử lý” rồi đóng hội thoại là hứa sai sự thật: lệnh hoàn chưa thành công và không có gì bảo đảm sẽ tự hoàn tất."]},"cite":"Hướng dẫn ôn tập — §10.1 Các nhóm lỗi; Lĩnh vực 5.3"},{"id":"t1q53","n":53,"topic":1,"type":"mcq","stem":{"en":"Production logs reveal inconsistent error responses when lookup_order fails. The agent sometimes retries (wasting 3-4 turns) before concluding on the error. Your MCP tool currently returns only a plain text error message to Claude. What&#x27;s the most effective improvement?"},"options":[{"k":"A","t":{"en":"Implement retry logic with exponential backoff in your MCP server for all errors, returning only successful results to the agent."}},{"k":"B","t":{"en":"Create an analyze_error MCP tool the agent calls to determine the error type before deciding how to handle it."}},{"k":"C","t":{"en":"Return structured error responses with retryable: false for business errors and a customer-friendly explanation for Claude to use."}},{"k":"D","t":{"en":"Add few-shot examples to the system prompt showing how to distinguish retryable from non-retryable errors by parsing error message text."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Thông báo lỗi dạng văn bản thuần không cho agent biết lỗi có thử lại được hay không, nên nó retry vô ích. Trả về <b>phản hồi lỗi có cấu trúc</b> với <code>retryable: false</code> cho lỗi nghiệp vụ giúp agent <b>dừng retry ngay</b>, và kèm <b>lời giải thích thân thiện với khách</b> để Claude dùng khi trả lời. Cách này sửa tận gốc ở giao diện tool, mang tính deterministic.","elim":["<b>A.</b> Retry mọi lỗi trong MCP server vẫn retry vô ích các lỗi nghiệp vụ không bao giờ thành công, và giấu hoàn toàn lỗi khỏi agent.","<b>B.</b> Thêm tool <code>analyze_error</code> tạo thêm một vòng gọi cho mỗi lỗi, trong khi thông tin phân loại lẽ ra nên có sẵn ngay trong phản hồi lỗi.","<b>D.</b> Few-shot dạy mô hình đoán loại lỗi từ văn bản là xác suất và dễ gãy khi thông điệp lỗi thay đổi; không đáng tin bằng một cờ có cấu trúc."]},"cite":"Hướng dẫn ôn tập — §4.4 Cờ isError trong MCP; Lĩnh vực 2.2"},{"id":"t1q54","n":54,"topic":1,"type":"mcq","stem":{"en":"When the agent calls lookup_order and receives order details showing the item was purchased 45 days ago, how does the agentic loop determine whether to call process_refund or escalate_to_human next?"},"options":[{"k":"A","t":{"en":"The agent executes the remaining steps in a tool sequence planned at the start of the request."}},{"k":"B","t":{"en":"The agent follows a pre-configured decision tree mapping order attributes to specific tool calls."}},{"k":"C","t":{"en":"The order details are added to the conversation and the model reasons about which action to take."}},{"k":"D","t":{"en":"The orchestration layer automatically routes to the next tool based on the order&#x27;s status field."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Trong agentic loop, sau khi tool chạy xong, <b>kết quả tool được nối vào lịch sử hội thoại</b> và gửi lại cho Claude; <b>mô hình suy luận</b> dựa trên dữ liệu mới (mua 45 ngày trước) để quyết định gọi <code>process_refund</code> hay <code>escalate_to_human</code>. Đây là ra quyết định do mô hình điều khiển, không phải luồng cứng định sẵn.","elim":["<b>A.</b> Agent không lập sẵn một chuỗi tool cố định từ đầu rồi chạy tiếp; mỗi bước được quyết định lại dựa trên kết quả mới nhất.","<b>B.</b> Cây quyết định cấu hình sẵn là thiết kế hard-coded, ngược với mô hình agentic loop nơi Claude chọn tool tiếp theo.","<b>D.</b> Không có lớp orchestration nào tự định tuyến theo trường status; tầng ứng dụng chỉ thực thi tool mà Claude yêu cầu."]},"cite":"Hướng dẫn ôn tập — §3.1 Agentic Loop là gì; Lĩnh vực 1.1"},{"id":"t1q55","n":55,"topic":1,"type":"mcq","stem":{"en":"A customer writes: &quot;I&#x27;ve been going back and forth on this return for days. I just want to speak to someone who can actually help me.&quot; The agent has confirmed via lookup_order that the return is straightforward–within policy and eligible for immediate processing. What should the agent do?"},"options":[{"k":"A","t":{"en":"Process the refund via process_refund to resolve the underlying issue, then inform them it&#x27;s complete"}},{"k":"B","t":{"en":"Ask what specifically hasn&#x27;t worked in previous attempts before deciding whether to escalate or resolve automatically"}},{"k":"C","t":{"en":"Acknowledge frustration, inform them this is resolvable now, and offer to complete it or escalate"}},{"k":"D","t":{"en":"Call escalate_to_human immediately to honor the customer&#x27;s request"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Khách bày tỏ bức xúc và muốn gặp “someone who can actually help”, nhưng agent đã xác nhận ca này <b>đủ điều kiện xử lý ngay</b>. Mẫu đúng là <b>ghi nhận cảm xúc</b>, cho khách biết vấn đề <b>có thể giải quyết ngay bây giờ</b>, và <b>để khách lựa chọn</b> hoàn tất luôn hoặc chuyển người thật, vừa giải quyết nhanh vừa tôn trọng mong muốn của khách.","elim":["<b>A.</b> Tự xử lý hoàn tiền mà không hỏi là phớt lờ yêu cầu gặp người của khách; khách không được lựa chọn.","<b>B.</b> Hỏi lại lý do các lần trước không thành công bắt khách giải thích thêm, trong khi agent đã có đủ thông tin để giải quyết.","<b>D.</b> Escalation ngay bỏ qua cơ hội giải quyết tức thì một ca đơn giản, khiến khách phải chờ thêm dù vấn đề có thể xong ngay."]},"cite":"Hướng dẫn ôn tập — §9.2 Các mẫu Escalation; Lĩnh vực 5.2"},{"id":"t1q56","n":56,"topic":1,"type":"mcq","stem":{"en":"Compliance requires that refunds exceeding $500 must automatically escalate to a human agent–this rule cannot be left to model discretion. Despite clear system prompt instructions, production logs show the agent occasionally processes high-value refunds directly (3% failure rate). How should you achieve guaranteed compliance?"},"options":[{"k":"A","t":{"en":"Implement a hook to intercept tool calls; when the refund process amount exceeds $500, block it and invoke human escalation."}},{"k":"B","t":{"en":"Strengthen the system prompt with emphatic language: &quot;CRITICAL POLICY: Refunds over $500 MUST trigger human escalation. NEVER process these directly.&quot;"}},{"k":"C","t":{"en":"Modify the refund tool to return an error with message &quot;Amount exceeds policy limit–please escalate&quot; when threshold is exceeded."}},{"k":"D","t":{"en":"Add few-shot examples to the prompt showing correct escalation behavior at various refund amounts ($400, $500, $600)."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Quy tắc tuân thủ bắt buộc không thể dựa vào prompt, vì prompt chỉ cho <b>mức tuân thủ xác suất</b> (ở đây 3% thất bại). Một <b>hook chặn lời gọi tool</b> kiểm tra số tiền trước khi <code>process_refund</code> chạy; nếu &gt; $500 thì chặn và chuyển sang escalation. Đây là <b>đảm bảo deterministic</b> nằm trong code, không phụ thuộc vào việc mô hình nhớ làm theo.","elim":["<b>B.</b> Viết prompt mạnh hơn (CRITICAL, NEVER) vẫn chỉ là hướng dẫn xác suất; không thể đưa tỷ lệ vi phạm về 0 như yêu cầu tuân thủ.","<b>C.</b> Để tool trả lỗi thì việc escalation vẫn phụ thuộc vào mô hình đọc lỗi và tự gọi escalation; không tự động chuyển cho người như quy định đòi hỏi.","<b>D.</b> Few-shot cải thiện hành vi nhưng vẫn mang tính xác suất, không bảo đảm 100% tuân thủ."]},"cite":"Hướng dẫn ôn tập — §3.5 Hooks trong Agent SDK; Lĩnh vực 1.5"},{"id":"t1q57","n":57,"topic":1,"type":"mcq","stem":{"en":"A customer raises three separate issues during one session: a refund inquiry (turns 1-15), a subscription question (turns 16-30), and a payment method update (turns 31-45). At turn 48, the customer asks &quot;What happened with my refund?&quot; The conversation is approaching context limits. What strategy best maintains the agent&#x27;s ability to address all issues throughout the session?"},"options":[{"k":"A","t":{"en":"Extract and persist structured issue data (order IDs, amounts, statuses) into a separate context layer."}},{"k":"B","t":{"en":"Rely on MCP tools to re-fetch relevant information on demand when the customer references earlier issues."}},{"k":"C","t":{"en":"Implement sliding window context that retains the most recent 30 turns."}},{"k":"D","t":{"en":"Summarize earlier turns into a narrative description, preserving full message history only for the active issue."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Khi hội thoại dài nhiều vấn đề tiến gần giới hạn context, rủi ro lớn nhất là <b>mất các giá trị chính xác</b> (mã đơn, số tiền, trạng thái) của những vấn đề cũ. Giải pháp là <b>trích xuất dữ kiện giao dịch thành dữ liệu có cấu trúc</b> và lưu trong một <b>lớp context riêng (khối “case facts”)</b> luôn được đưa vào mỗi request, nằm ngoài phần lịch sử có thể bị tóm tắt hay cắt bỏ. Nhờ đó khi khách hỏi lại về refund ở lượt 48, agent vẫn có đúng mã đơn, số tiền và trạng thái của refund.","elim":["<b>B.</b> Dựa vào MCP tool để tra lại không khôi phục được những gì đã trao đổi trong hội thoại (cam kết, lựa chọn của khách), và agent còn phải nhớ mã đơn nào để tra — chính thông tin có thể đã mất.","<b>C.</b> Sliding window 30 lượt sẽ cắt mất toàn bộ phần refund (lượt 1–15), đúng phần khách đang hỏi ở lượt 48.","<b>D.</b> Tóm tắt dạng tường thuật làm <b>mất chi tiết chính xác</b>: số tiền, mã đơn, ngày tháng bị nén thành câu mơ hồ kiểu “khách đã hỏi về một khoản hoàn tiền” — không đủ để trả lời chính xác câu hỏi về refund."]},"cite":"Hướng dẫn ôn tập — §11.1 Trích xuất các Sự kiện ra một Block Riêng; Lĩnh vực 5.1"},{"id":"t1q58","n":58,"topic":1,"type":"mcq","stem":{"en":"The agent verifies customer identity through a multi-step process before resetting passwords. During testing, you notice that after the customer answers the third verification question, the agent asks them to provide their name again, as if the earlier exchange never happened. What&#x27;s the most likely cause of this behavior?"},"options":[{"k":"A","t":{"en":"The prompt lacks instructions telling Claude to remember information across multiple exchanges."}},{"k":"B","t":{"en":"The verification tool is clearing the agent&#x27;s internal state after each successful validation step."}},{"k":"C","t":{"en":"Claude&#x27;s memory retention is limited to two conversational turns by default, requiring explicit configuration to extend it."}},{"k":"D","t":{"en":"The conversation history isn&#x27;t being passed in subsequent API requests."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Claude API là <b>stateless</b>: mô hình không nhớ gì giữa các request. Ứng dụng phải <b>gửi lại toàn bộ lịch sử hội thoại</b> trong mảng <code>messages</code> ở mỗi lần gọi. Việc agent hỏi lại tên “như thể chưa từng trao đổi” là dấu hiệu điển hình cho thấy các lượt trước không được đưa vào request tiếp theo.","elim":["<b>A.</b> Không có chỉ dẫn prompt nào giúp Claude “nhớ”; nếu các lượt trước không có trong request thì không prompt nào bù được.","<b>B.</b> Tool xác minh không có quyền xóa “trạng thái nội bộ” của agent; context của mô hình chính là những gì ứng dụng gửi lên.","<b>C.</b> Không tồn tại giới hạn mặc định hai lượt; Claude xử lý bất kỳ lịch sử nào nằm trong context window được gửi lên."]},"cite":"Hướng dẫn ôn tập — §1.2 Vai trò của Message; Lĩnh vực 5.1"},{"id":"t1q59","n":59,"topic":1,"type":"mcq","stem":{"en":"Your process_refund tool returns two types of errors: technical errors (&quot;503 Service Unavailable&quot;, &quot;Connection timeout&quot;) that are transient (5% of calls), and business errors (&quot;Order exceeds 30-day return window&quot;, &quot;Item already refunded&quot;) that are permanent (12% of calls). Monitoring shows the agent wastes 3-4 turns retrying business errors that can never succeed. Currently, both error types return only a plain text message to Claude. What&#x27;s the most effective way to reduce wasted retries while improving customer-facing response quality?"},"options":[{"k":"A","t":{"en":"Add few-shot examples showing how to distinguish retryable from non-retryable errors by parsing error message text."}},{"k":"B","t":{"en":"Return structured error responses with retryable: false for business errors and a customer-friendly explanation for Claude to use."}},{"k":"C","t":{"en":"Implement automatic retry logic at the tool level for technical errors only, passing business errors to Claude without retries."}},{"k":"D","t":{"en":"Add a check_refund_eligibility tool that must be called before process_refund to prevent business rule violations."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Cả hai loại lỗi đều trả văn bản thuần nên Claude không phân biệt được lỗi tạm thời và lỗi nghiệp vụ. Trả về <b>lỗi có cấu trúc</b> với <code>retryable: false</code> cho lỗi nghiệp vụ giúp agent <b>dừng retry ngay</b> (giảm 3–4 lượt lãng phí), còn <b>lời giải thích thân thiện với khách</b> cho Claude nội dung để báo cho khách lý do (quá 30 ngày, đã hoàn tiền). Một thay đổi giải quyết cả hai mục tiêu của đề.","elim":["<b>A.</b> Few-shot dạy phân tích văn bản lỗi là phương pháp xác suất, dễ gãy khi thông điệp thay đổi, và không cải thiện nội dung giải thích cho khách.","<b>C.</b> Tự retry lỗi kỹ thuật ở tầng tool là hữu ích, nhưng lỗi nghiệp vụ vẫn đến Claude dưới dạng văn bản thuần không có cờ retryable hay lời giải thích cho khách, nên chưa giải quyết được mục tiêu chất lượng phản hồi.","<b>D.</b> Thêm tool kiểm tra điều kiện trước tạo thêm một lời gọi cho mọi giao dịch và vẫn dựa vào việc mô hình nhớ gọi nó; không xử lý được cách báo lỗi."]},"cite":"Hướng dẫn ôn tập — §10.1 Các nhóm lỗi; Lĩnh vực 2.2"},{"id":"t1q60","n":60,"topic":1,"type":"mcq","stem":{"en":"A customer returns 4 hours after their initial session about the same billing dispute. The previous 32-turn session contains context: lookup_status_result messages containing &quot;Status: Pending Refund&quot; and significant tokens from prior lookup results. The agent needs to be prepared to answer the customer fully. What approach most reliably handles returning customers?"},"options":[{"k":"A","t":{"en":"Start a new session, inject a structured summary of the previous interaction (issue type, resolution steps, current status), then make fresh tool calls as needed."}},{"k":"B","t":{"en":"Resume with the full conversation and add a system prompt instruction that instructs the agent to prioritize resolving the pending refund."}},{"k":"C","t":{"en":"Resume with state and configure the agent to automatically re-call all previous tool_results messages to ensure data freshness."}},{"k":"D","t":{"en":"Resume the previous session with the full history and ask the customer to restate the dispute before deciding whether fresh lookups are necessary."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Sau 4 giờ, các tool result cũ (“Pending Refund”) có thể đã <b>lỗi thời</b>, và 32 lượt cũ chiếm nhiều token. <b>Bắt đầu session mới</b> với <b>bản tóm tắt có cấu trúc</b> (loại vấn đề, các bước đã làm, trạng thái hiện tại), rồi gọi tool mới khi cần, giúp agent nắm mạch mà vẫn dùng dữ liệu cập nhật. Guide nêu rõ: session mới với tóm tắt có cấu trúc đáng tin cậy hơn resume với kết quả cũ.","elim":["<b>B.</b> Resume toàn bộ lịch sử vẫn giữ các trạng thái đã lỗi thời và tốn token; thêm chỉ dẫn ưu tiên refund không làm dữ liệu mới hơn.","<b>C.</b> Tự động gọi lại mọi tool cũ là lãng phí (nhiều lời gọi không cần) và vẫn mang theo khối lịch sử cồng kềnh.","<b>D.</b> Bắt khách kể lại tranh chấp là trải nghiệm tồi, trong khi hệ thống đã có đủ thông tin để tóm tắt."]},"cite":"Hướng dẫn ôn tập — §5.10 fork_session và Quản lý Session; Lĩnh vực 1.7"},{"id":"t1q61","n":61,"topic":1,"type":"mcq","stem":{"en":"Your extraction pipeline processes invoices and extracts line items, subtotals, tax amounts, and grand totals. During evaluation, you discover that in 18% of extractions, the sum of extracted line item amounts doesn&#x27;t match the extracted grand total—sometimes due to OCR errors in the source document, sometimes due to extraction mistakes by the model. Downstream accounting systems reject records with mismatched totals. What&#x27;s the most effective approach to improve extraction reliability?"},"options":[{"k":"A","t":{"en":"Add few-shot examples demonstrating invoices where extracted line items sum correctly to the stated total, encouraging the model to produce mathematically consistent extractions."}},{"k":"B","t":{"en":"Implement post-processing that automatically adjusts line item amounts proportionally when their sum doesn&#x27;t match the stated total."}},{"k":"C","t":{"en":"Extract line items and totals independently, then use a separate validation model to reconcile discrepancies by determining which extracted values are most likely correct."}},{"k":"D","t":{"en":"Add a &quot;calculated_total&quot; field where the model sums extracted line items alongside a &quot;stated_total&quot; field. Flag records for human review when values differ."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Lỗi đến từ hai nguồn (OCR sai trong tài liệu gốc và mô hình trích sai), nên không thể tự “sửa” một cách an toàn. Mẫu <b>self-correction</b>: trích xuất cả <code>calculated_total</code> (tổng các dòng) lẫn <code>stated_total</code> (giá trị in trên hóa đơn) để <b>biến sai lệch thành tín hiệu tường minh</b>, rồi chuyển các bản ghi lệch cho con người review thay vì gửi dữ liệu sai xuống hệ thống kế toán.","elim":["<b>A.</b> Few-shot các hóa đơn khớp tổng có thể khiến mô hình “ép” các con số cho khớp, che giấu lỗi OCR thay vì phát hiện nó.","<b>B.</b> Điều chỉnh tỷ lệ các dòng hàng là bịa dữ liệu: các con số sau điều chỉnh không còn phản ánh tài liệu gốc.","<b>C.</b> Một model thứ hai “đoán” giá trị nào đúng vẫn chỉ là phỏng đoán khi chính tài liệu nguồn có lỗi OCR, và thêm độ phức tạp."]},"cite":"Hướng dẫn ôn tập — §6.6 Tự sửa lỗi (Self-correction); Lĩnh vực 4.4"},{"id":"t1q62","n":62,"topic":1,"type":"mcq","stem":{"en":"An engineer asks your agent to identify untested code paths in a legacy payment processing module spanning 45 files. After reading the first 8 source files, the agent&#x27;s responses are becoming noticeably less accurate — it&#x27;s forgetting previously discussed code patterns and hasn&#x27;t yet located all test files or traced critical payment flows. What&#x27;s the most effective approach to complete this investigation?"},"options":[{"k":"A","t":{"en":"Clear context with /clear, then selectively re-read only the most critical files discovered so far, writing key findings to a scratchpad file that persists between context resets."}},{"k":"B","t":{"en":"Spawn subagents to investigate specific questions (e.g., &quot;find all test files for payment processing&quot;, &quot;trace refund flow dependencies&quot;) while the main agent coordinates findings and preserves high-level understanding."}},{"k":"C","t":{"en":"Document all current findings in a summary report, clear context completely, then use that report as the sole reference for continuing the investigation."}},{"k":"D","t":{"en":"Switch to using Grep to search for specific function names instead of reading full files, reducing the content loaded into context for remaining exploration."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Đây là dấu hiệu <b>suy giảm context</b> sau khi đọc nhiều file. Giải pháp là <b>ủy thác cho subagent</b> các câu hỏi có phạm vi rõ (tìm test file, truy vết refund flow): subagent đọc nhiều file trong context riêng và chỉ trả về kết luận ngắn, còn agent chính <b>giữ hiểu biết tổng thể và điều phối</b>. Cách này bảo vệ context chính trong khi vẫn đi hết 45 file.","elim":["<b>A.</b> <code>/clear</code> rồi đọc lại file quan trọng vẫn nạp lại toàn bộ nội dung file vào context chính, nên sẽ sớm gặp lại đúng vấn đề.","<b>C.</b> Xóa sạch context và chỉ dựa vào báo cáo tóm tắt làm mất nhiều chi tiết, và phần còn lại vẫn được đọc trong cùng một context dễ đầy.","<b>D.</b> Grep giúp tìm kiếm có mục tiêu nhưng không đủ để truy vết luồng thanh toán phức tạp; agent vẫn phải đọc code và context chính vẫn tiếp tục phình ra."]},"cite":"Hướng dẫn ôn tập — §11.5 Ủy quyền cho Subagent để Bảo vệ Context; Lĩnh vực 5.4"},{"id":"t1q63","n":63,"topic":1,"type":"mcq","stem":{"en":"The coordinator agent has AgentDefinitions configured for all four specialized subagents, each with appropriate descriptions, prompts, and tool restrictions. During testing, you notice the coordinator correctly reasons about when to delegate — it generates messages like &quot;I&#x27;ll ask the web search agent to find sources on this topic&quot; — but no subagent execution ever occurs. The coordinator then proceeds as if the delegation happened and continues with incomplete information. Logs show no errors. What is the most likely cause?"},"options":[{"k":"A","t":{"en":"Subagent context isolation means task descriptions from the coordinator don&#x27;t automatically reach subagents; you need to configure explicit context forwarding in ClaudeAgentOptions."}},{"k":"B","t":{"en":"The AgentDefinitions are configured correctly, but the coordinator&#x27;s system prompt doesn&#x27;t explicitly list the available subagent types, preventing the model from knowing they can be invoked."}},{"k":"C","t":{"en":"The coordinator&#x27;s max_tokens setting is too low, causing the Task tool invocation to be truncated before the subagent type parameter can be specified."}},{"k":"D","t":{"en":"The coordinator&#x27;s allowedTools configuration doesn&#x27;t include &quot;Task&quot;, so while it can reason about delegation, it cannot invoke the tool required to spawn subagents."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Subagent chỉ được spawn qua tool <code>Task</code>; <code>allowedTools</code> của coordinator <b>bắt buộc phải có <code>\"Task\"</code></b>. Thiếu nó, coordinator vẫn <b>suy luận</b> và viết ra ý định ủy thác nhưng <b>không thể phát lệnh gọi tool</b>, nên không có subagent nào chạy và cũng không có lỗi: khớp đúng triệu chứng trong đề.","elim":["<b>A.</b> Context isolation khiến subagent không thừa hưởng lịch sử của cha, nhưng nếu đó là lỗi thì subagent vẫn chạy (chỉ thiếu context); ở đây subagent hoàn toàn không chạy. Cũng không có cấu hình “context forwarding” như vậy.","<b>B.</b> AgentDefinition đã cung cấp mô tả subagent cho mô hình; coordinator rõ ràng biết các subagent tồn tại vì nó nói muốn giao việc cho web search agent.","<b>C.</b> <code>max_tokens</code> quá thấp sẽ cắt ngang phản hồi với <code>stop_reason: \"max_tokens\"</code> một cách nhất quán, không phải hành vi coordinator chạy tiếp bình thường như đề mô tả."]},"cite":"Hướng dẫn ôn tập — §3.4 Tool Task để Sinh ra Subagent; Lĩnh vực 1.3"},{"id":"t1q64","n":64,"topic":1,"type":"mcq","stem":{"en":"In production, you observe that simple fact-checking queries (e.g., &quot;What year was the Paris Climate Agreement signed?&quot;) traverse all four subagents sequentially, consuming 40+ seconds and significant tokens per query. Complex comparative research benefits from the full pipeline. Your query distribution is diverse and evolving as users discover new applications. What&#x27;s the most effective approach to optimize for varying query complexity?"},"options":[{"k":"A","t":{"en":"Have the coordinator analyze each query and dynamically decide which subagents to invoke based on its assessment of query requirements."}},{"k":"B","t":{"en":"Train a query complexity classifier on labeled historical data to predict optimal subagent combinations, retraining periodically as query patterns evolve."}},{"k":"C","t":{"en":"Create a fast-path for factual questions that bypasses subagents entirely, routing all other queries through the complete pipeline to ensure research thoroughness."}},{"k":"D","t":{"en":"Implement pattern-based routing that categorizes queries by structure (single-fact vs. comparative vs. analytical) and maps each category to a predefined subagent combination."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Phân bố truy vấn <b>đa dạng và liên tục thay đổi</b>, nên cần một cơ chế thích ứng chứ không phải quy tắc cố định. Để <b>coordinator phân tích từng truy vấn và chọn động</b> các subagent cần thiết (câu hỏi factual có thể chỉ cần web search, nghiên cứu so sánh dùng full pipeline) tận dụng chính năng lực suy luận của LLM, đúng vai trò “lựa chọn subagent một cách động” của coordinator.","elim":["<b>B.</b> Classifier huấn luyện trên dữ liệu gán nhãn tốn công gán nhãn và phải huấn luyện lại liên tục, luôn đi sau sự thay đổi của phân bố truy vấn.","<b>C.</b> Fast-path nhị phân chỉ tách “factual” với “còn lại”; mọi truy vấn trung gian vẫn đi qua cả 4 subagent, không tối ưu cho độ phức tạp đa dạng.","<b>D.</b> Routing theo
