 pattern với tổ hợp định sẵn dễ gãy khi người dùng phát hiện ứng dụng mới không khớp danh mục nào."]},"cite":"Hướng dẫn ôn tập — §8.2 Phân rã thích ứng động; Lĩnh vực 1.2"},{"id":"t1q65","n":65,"topic":1,"type":"mcq","stem":{"en":"Production logs reveal inconsistent error handling: when lookup_order fails, the agent sometimes retries 5+ times (wasteful when the order ID doesn&#x27;t exist), sometimes escalates immediately (premature for temporary network issues), and sometimes asks users for clarification (inappropriate when the issue is a backend permission error). Investigation shows your MCP tool returns uniform error responses: {&quot;isError&quot;: true, &quot;content&quot;: [{&quot;type&quot;: &quot;text&quot;, &quot;text&quot;: &quot;Operation failed&quot;}]}. The agent cannot distinguish between error types. What&#x27;s the most effective improvement?"},"options":[{"k":"A","t":{"en":"Create an analyze_error MCP tool the agent calls after any failure to determine the error category and recommended action."}},{"k":"B","t":{"en":"Enhance error responses with structured metadata: include errorCategory (transient/validation/permission), isRetryable boolean, and a description of what caused the failure."}},{"k":"C","t":{"en":"Add few-shot examples to the system prompt demonstrating how to interpret error message patterns and select appropriate responses for each."}},{"k":"D","t":{"en":"Implement retry logic with exponential backoff in your MCP server for all errors, returning to the agent only after retries are exhausted."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Vấn đề gốc là mọi lỗi đều trả về “Operation failed”, nên agent không phân biệt được. Bổ sung <b>metadata lỗi có cấu trúc</b>: <code>errorCategory</code> (transient/validation/permission), <code>isRetryable</code> và mô tả nguyên nhân, cho agent đủ thông tin để <b>chọn hành động đúng</b>: retry lỗi tạm thời, hỏi lại khách khi ID sai, escalation khi lỗi quyền.","elim":["<b>A.</b> Tool <code>analyze_error</code> thêm một vòng gọi sau mỗi lỗi, và nó cũng không thể biết nguyên nhân nếu thông tin lỗi gốc chỉ là “Operation failed”.","<b>C.</b> Few-shot không giúp gì khi mọi lỗi có cùng thông điệp; không có mẫu nào để mô hình phân biệt.","<b>D.</b> Retry mọi lỗi phí thời gian với lỗi validation/permission không bao giờ thành công, và sau đó agent vẫn nhận lỗi chung chung."]},"cite":"Hướng dẫn ôn tập — §4.4 Cờ isError trong MCP; Lĩnh vực 2.2"},{"id":"t1q66","n":66,"topic":1,"type":"mcq","stem":{"en":"Users report that final reports sometimes lack depth on specific subtopics. Investigation shows that the document analysis agent frequently identifies gaps—for instance, noting &quot;the retrieved sources discuss API authentication but lack details on token refresh patterns&quot;—but under the current strict pipeline, this insight isn&#x27;t actionable since search has already completed. What&#x27;s the most effective architectural change?"},"options":[{"k":"A","t":{"en":"Have the synthesis agent attach confidence scores to each section and flag areas with insufficient coverage for manual review."}},{"k":"B","t":{"en":"Have the analysis agent report specific gaps to the coordinator, which triggers targeted searches and re-invokes analysis until sufficient."}},{"k":"C","t":{"en":"Add a research planning agent before the search phase that decomposes topics into specific sub- questions."}},{"k":"D","t":{"en":"Have the coordinator review analysis output for gap indicators and re-invoke search with gapinformed queries when gaps are detected."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Pipeline một chiều khiến phát hiện của agent phân tích (thiếu thông tin về token refresh) không được dùng đến. Chuyển sang <b>vòng lặp tinh chỉnh lặp lại</b>: agent phân tích <b>báo cáo các lỗ hổng cụ thể</b> cho coordinator, coordinator kích hoạt <b>tìm kiếm có mục tiêu</b> và gọi lại phân tích <b>cho đến khi đủ</b>. Agent hiểu rõ nhất về lỗ hổng chủ động nêu ra, còn coordinator giữ quyền định tuyến.","elim":["<b>A.</b> Gắn confidence score và đẩy sang review thủ công chỉ đánh dấu chỗ yếu mà không lấp lỗ hổng; báo cáo vẫn thiếu chiều sâu.","<b>C.</b> Thêm agent lập kế hoạch trước bước search giúp phân rã tốt hơn nhưng không xử lý được lỗ hổng chỉ lộ ra sau khi phân tích tài liệu.","<b>D.</b> Để coordinator tự dò “dấu hiệu lỗ hổng” trong output là suy luận gián tiếp, kém chính xác hơn việc agent phân tích báo cáo lỗ hổng cụ thể; cũng không có vòng lặp gọi lại phân tích đến khi đủ."]},"cite":"Hướng dẫn ôn tập — §8.2 Phân rã thích ứng động; Lĩnh vực 1.2"},{"id":"t1q67","n":67,"topic":1,"type":"mcq","stem":{"en":"This currently requires manually copy-pasting content into conversations. The team wants the agent to access this standard Jira ticket data directly. What&#x27;s the most effective approach?"},"options":[{"k":"A","t":{"en":"Use the Bash tool with curl to call Jira&#x27;s REST API, including authentication headers and parsing JSON responses inline."}},{"k":"B","t":{"en":"Build a custom MCP server wrapping Jira&#x27;s API with tools designed specifically for this team&#x27;s code review workflow."}},{"k":"C","t":{"en":"Integrate an existing Jira MCP server that exposes tickets, comments, and metadata through discoverable tool interfaces."}},{"k":"D","t":{"en":"Export Jira tickets to markdown files in the repository that the agent accesses using the Read tool."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Jira là <b>tích hợp tiêu chuẩn</b> và dữ liệu ở đây là ticket Jira tiêu chuẩn. Thực hành tốt là <b>dùng một MCP server có sẵn</b> (cộng đồng/chính thức), cung cấp ticket, comment, metadata qua các tool mà agent tự khám phá được: ít công sức, dễ bảo trì, không phải tự viết tích hợp.","elim":["<b>A.</b> Gọi REST API bằng curl qua Bash bắt agent tự xử lý xác thực và parse JSON mỗi lần, dễ lỗi và để lộ thông tin xác thực trong lệnh.","<b>B.</b> Tự xây MCP server riêng chỉ đáng làm khi có nhu cầu đặc thù; với dữ liệu Jira tiêu chuẩn, đây là công sức xây dựng và bảo trì thừa.","<b>D.</b> Xuất ticket ra file markdown tạo bản sao tĩnh nhanh chóng lỗi thời và vẫn cần thao tác thủ công định kỳ."]},"cite":"Hướng dẫn ôn tập — §4.3 Cấu hình MCP Server; Lĩnh vực 2.4"},{"id":"t1q68","n":68,"topic":1,"type":"mcq","stem":{"en":"A critical bug is affecting production users. Error logs show exceptions in the OrderProcessing module with a clear stack trace pointing to a specific area, but you haven&#x27;t worked with this module before. What&#x27;s the most effective approach?"},"options":[{"k":"A","t":{"en":"Use direct execution to examine the stack trace, read the relevant code, and implement a fix once you identify the root cause."}},{"k":"B","t":{"en":"Use plan mode to analyze the error in context of the module&#x27;s design, enumerate potential root causes, and prioritize fixes systematically."}},{"k":"C","t":{"en":"Start with direct execution to gather initial information, then switch to plan mode to design a comprehensive solution before implementing."}},{"k":"D","t":{"en":"Enter plan mode to explore the module&#x27;s architecture and dependencies before attempting any fix."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Lỗi production có <b>stack trace rõ ràng chỉ đến một vùng cụ thể</b> là trường hợp điển hình cho <b>thực thi trực tiếp</b>: đọc stack trace, đọc đoạn code liên quan, xác định root cause rồi sửa. Gỡ lỗi mang tính thích ứng (mỗi file đọc định hướng bước tiếp theo), và tình huống khẩn cấp đòi hỏi không tốn thời gian lập kế hoạch trước.","elim":["<b>B.</b> Plan mode để liệt kê và xếp ưu tiên nhiều root cause là thừa khi stack trace đã chỉ ra vị trí, làm chậm việc sửa lỗi khẩn cấp.","<b>C.</b> Chuyển sang plan mode để thiết kế “giải pháp toàn diện” là quá mức cho một bug đã định vị được; ưu tiên là sửa nhanh và đúng.","<b>D.</b> Khám phá toàn bộ kiến trúc module trước khi sửa là không cần; chỉ cần hiểu vùng code mà stack trace chỉ tới."]},"cite":"Hướng dẫn ôn tập — §5.6 Planning Mode so với Thực thi trực tiếp; Lĩnh vực 3.4"},{"id":"t1q69","n":69,"topic":1,"type":"mcq","stem":{"en":"After deploying the automated review, you notice high precision but low recall — real bugs are slipping through undetected. Investigation reveals your review prompt instructs Claude to &quot;only report high- confidence issues you are certain about&quot; and &quot;err on the side of not commenting.&quot; Developers appreciate the low noise, but a race condition that caused a production outage was visible in a reviewed PR and went unreported. You need to substantially improve bug detection while keeping false positive rates manageable for your team. What is the most effective approach?"},"options":[{"k":"A","t":{"en":"Split the review into a finding stage where Claude&#x27;s goal is coverage — flagging every potential issue with confidence and severity metadata — and a separate stage that thresholds those findings."}},{"k":"B","t":{"en":"Add detailed few-shot examples demonstrating bug categories Claude should flag — race conditions, null dereferences, error handling gaps — while keeping the high-confidence filtering instruction to maintain current precision levels."}},{"k":"C","t":{"en":"Remove the conservative filtering instructions and prompt Claude to report all potential issues, then apply a programmatic filter to deduplicate and suppress categories that historically generate false positives."}},{"k":"D","t":{"en":"Expand the context window by including related test files, recent git history, and the module&#x27;s dependency graph alongside the diff, giving Claude richer signals to assess issue severity."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Recall thấp vì prompt bắt mô hình <b>vừa tìm vừa tự lọc</b> trong cùng một bước. Tách thành hai giai đoạn: <b>giai đoạn tìm kiếm với mục tiêu coverage</b>, gắn cờ mọi vấn đề tiềm năng kèm metadata confidence và severity; rồi <b>một giai đoạn riêng áp ngưỡng</b>. Nhờ đó bug như race condition không bị loại sớm, còn tỷ lệ false positive vẫn kiểm soát được bằng ngưỡng có thể tinh chỉnh.","elim":["<b>B.</b> Few-shot về các loại bug vẫn đi kèm chỉ dẫn “chỉ báo khi chắc chắn”, nên mô hình tiếp tục tự kiểm duyệt và bỏ sót bug; recall không cải thiện đáng kể.","<b>C.</b> Báo cáo mọi thứ rồi chặn theo loại bug từng nhiều false positive có thể chặn luôn bug thật thuộc loại đó; không có thông tin confidence/severity để lọc tinh.","<b>D.</b> Thêm context giúp đánh giá tốt hơn nhưng không gỡ bỏ chỉ dẫn bảo thủ đang là nguyên nhân gốc của recall thấp."]},"cite":"Hướng dẫn ôn tập — §8.3 Code Review nhiều lượt (Multi-pass); Lĩnh vực 4.6"},{"id":"t1q70","n":70,"topic":1,"type":"mcq","stem":{"en":"Your remove_team_member tool uses a dry_run: boolean parameter for previewing impacts before execution. Production monitoring shows the agent bypasses the preview step in 15% of calls by calling with dry_run=false directly. You need to ensure every removal is preceded by a preview that the user explicitly confirms. What is the most reliable approach?"},"options":[{"k":"A","t":{"en":"Add detailed instructions and few-shot examples to the tool description requiring the agent to always call with dry_run=true first and wait for user confirmation before calling with dry_run=false."}},{"k":"B","t":{"en":"Annotate the tool as requiring confirmation and configure the orchestration layer to prompt the user for approval before forwarding any calls to annotated tools."}},{"k":"C","t":{"en":"Replace with two tools: preview_remove_member returns impact details and a single-use confirmation token; execute_remove_member requires that token, binding execution to the specific previewed action."}},{"k":"D","t":{"en":"Add server-side validation that permits dry_run=false only when a dry_run=true call with identical parameters occurred within the past 60 seconds."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Thiết kế <b>hai tool ràng buộc bằng token</b>: <code>preview_remove_member</code> trả về tác động và một <b>confirmation token dùng một lần</b>; <code>execute_remove_member</code> chỉ chạy khi có token đó. Việc thực thi không qua preview trở nên <b>bất khả thi về mặt kiến trúc</b>, và token gắn đúng với hành động đã xem trước. Đây là ràng buộc ở cấp code, không dựa vào việc LLM làm theo.","elim":["<b>A.</b> Hướng dẫn và few-shot trong mô tả tool chỉ mang tính xác suất; agent vẫn có thể gọi <code>dry_run=false</code> trực tiếp như 15% hiện tại.","<b>B.</b> Annotation và lớp orchestration hỏi phê duyệt không bảo đảm người dùng thấy bản preview tác động trước khi duyệt; phụ thuộc vào hạ tầng bên ngoài thay vì ràng buộc trong giao diện tool.","<b>D.</b> Kiểm tra “có lời gọi dry_run=true trong 60 giây” là heuristic thời gian: không chứng minh được người dùng đã xác nhận, và dễ lỗi khi người dùng cân nhắc lâu hơn 60 giây."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q71","n":71,"topic":1,"type":"mcq","stem":{"en":"Your invoice extraction uses tool use with strict JSON schemas. JSON syntax errors never occur, but 12% of extractions fail semantic validation--for example, line Item amounts don&#x27;t extracted total, or vendor IDs don&#x27;t match valid formats. These failures currently route to manual review. What&#x27;s the most effective approach to reduce manual review volume while maintaining accuracy?"},"options":[{"k":"A","t":{"en":"Add stricter schema constraints with detailed field descriptions to prevent the model from generating invalid values initially."}},{"k":"B","t":{"en":"Retry the extraction up to 3 times when validation fallis, accepting the first result that passes validation."}},{"k":"C","t":{"en":"Implement post-processing logic that automatically corrects common amors, such as recalculating totais from line items when sums don&#x27;t match."}},{"k":"D","t":{"en":"When validation falls, make a follow-up request with the document, extraction, and validation errors for model correction."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Schema đã bảo đảm cú pháp; 12% lỗi là <b>lỗi ngữ nghĩa</b> (tổng không khớp, định dạng vendor ID sai), loại lỗi mà mô hình thường tự sửa được khi được chỉ ra. Mẫu <b>retry-with-feedback</b>: gửi lại tài liệu gốc, bản trích xuất trước và <b>lỗi validation cụ thể</b> để mô hình kiểm tra và sửa, giảm khối lượng review thủ công mà vẫn giữ độ chính xác.","elim":["<b>A.</b> Ràng buộc schema chặt hơn không diễn đạt được các quy tắc liên trường như “tổng các dòng = tổng cộng”; lỗi ngữ nghĩa vẫn lọt qua.","<b>B.</b> Retry mù không kèm thông tin lỗi thường lặp lại cùng sai sót, và “chấp nhận kết quả đầu tiên qua validation” có thể là kết quả ngẫu nhiên khớp.","<b>C.</b> Tự động tính lại tổng từ các dòng có thể ghi đè giá trị đúng trên hóa đơn khi chính dòng hàng bị trích sai, làm sai lệch dữ liệu một cách âm thầm."]},"cite":"Hướng dẫn ôn tập — §6.5 Validation và Retry-with-Feedback; Lĩnh vực 4.4"},{"id":"t1q72","n":72,"topic":1,"type":"mcq","stem":{"en":"Your system must extract event details from calendar invitations and output JSON that strictly conforms to a schema with fields for title, date, time, location, and attendees. Downstream reject any malformed or non- conformant JSON. What approach provides the most reliable schema compliance?"},"options":[{"k":"A","t":{"en":"Include detailed JSON formatting instructions and the target schema in your prompt, then parse Claude&#x27;s text response as JSON."}},{"k":"B","t":{"en":"Pre-fill Claude&#x27;s response with an opening brace to force JSON output, then complete and parse the response."}},{"k":"C","t":{"en":"Define a tool with your target schema as input parameters and have Claude call it with the extracted data."}},{"k":"D","t":{"en":"Append instructions like &quot;Output only valid JSON matching the schema exactly&quot; and implement retry logic to re-prompt when JSON parsing fails."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Cách đáng tin cậy nhất để có JSON đúng schema là <b>định nghĩa một tool có <code>input_schema</code> chính là schema đích</b> và để Claude gọi tool đó với dữ liệu đã trích xuất. Đầu ra <code>tool_use</code> là JSON có cấu trúc theo schema, <b>loại bỏ lỗi cú pháp JSON</b> so với việc parse văn bản tự do (nên kết hợp <code>tool_choice</code> ép gọi tool).","elim":["<b>A.</b> Hướng dẫn định dạng trong prompt rồi parse văn bản vẫn có thể sinh JSON hỏng hoặc kèm chữ thừa; độ tuân thủ chỉ mang tính xác suất.","<b>B.</b> Prefill dấu “{” chỉ buộc mở đầu là JSON, không bảo đảm phần còn lại hợp lệ hay đúng schema.","<b>D.</b> Chỉ dẫn “chỉ xuất JSON hợp lệ” cộng retry là xử lý triệu chứng: tốn thêm lời gọi và vẫn không bảo đảm tuân thủ schema."]},"cite":"Hướng dẫn ôn tập — §2.4 JSON Schema cho Structured Output; Lĩnh vực 4.3"},{"id":"t1q73","n":73,"topic":1,"type":"mcq","stem":{"en":"Your extraction system uses tool_use with a JSON schema containing 12 fields and detailed descriptions, totaling approximately 2,500 tokens for the complete tool definition. Processing documents under 150K tokens yields 98% accuracy. For documents between 175-190K tokens, accuracy drops to 71%, with information from the final third consistently missed. The model&#x27;s context window is 200K tokens. What is the most likely cause?"},"options":[{"k":"A","t":{"en":"Schemas exceeding 8-10 fields increase decision complexity during parameter generation, reducing extraction accuracy independent of document length."}},{"k":"B","t":{"en":"The model distributes attention proportionally across input length, causing fields mentioned only once near the document&#x27;s end to receive insufficient processing focus."}},{"k":"C","t":{"en":"Very long documents exceed the model&#x27;s effective attention span regardless of context limits, causing accuracy degradation for content farther from the prompt instructions."}},{"k":"D","t":{"en":"Tool definitions consume input context tokens. Combined with system prompts and document content, the total approaches the context limit, degrading end-of-document processing."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Context window gồm <b>system prompt + định nghĩa tool + tin nhắn + kết quả tool</b>. Tài liệu 175–190K token cộng 2.5K token định nghĩa tool cùng system prompt khiến tổng <b>tiến sát giới hạn 200K</b>, nên phần cuối tài liệu bị xử lý kém hoặc bị cắt. Triệu chứng chỉ xuất hiện ở tài liệu gần giới hạn và luôn mất phần một phần ba cuối chính là dấu hiệu của ngân sách context bị vượt.","elim":["<b>A.</b> Nếu số trường schema là nguyên nhân thì độ chính xác cũng giảm ở tài liệu dưới 150K; thực tế đạt 98% với cùng schema.","<b>B.</b> “Attention phân bổ theo tỷ lệ độ dài” không giải thích được vì sao chỉ một phần ba cuối bị bỏ sót một cách nhất quán và chỉ khi gần giới hạn.","<b>C.</b> “Effective attention span” mơ hồ không giải thích được ngưỡng rõ rệt quanh 175K; nguyên nhân cụ thể là tổng token chạm giới hạn context."]},"cite":"Hướng dẫn ôn tập — §1.5 Context Window"},{"id":"t1q74","n":74,"topic":1,"type":"mcq","stem":{"en":"The extraction pipeline receives documents of varying types—some are invoices, others are contracts, and some are receipts. You&#x27;ve defined separate extraction tools, each with its own schema tailored to the document type. During testing, you observe that with tool_choice: &quot;auto&quot;, Claude sometimes returns conversational text instead of calling an extraction tool, causing downstream parsing failures. You need guaranteed structured output without knowing the document type in advance. What&#x27;s the most effective approach?"},"options":[{"k":"A","t":{"en":"Add a preliminary classification call, then make a second call with tool_choice forced to the identified extraction tool."}},{"k":"B","t":{"en":"Set tool_choice: &quot;any&quot; with all extraction tools defined."}},{"k":"C","t":{"en":"Consolidate all document types into a single unified-schema extraction tool and force that tool."}},{"k":"D","t":{"en":"Keep tool_choice: &quot;auto&quot; with system prompt instructions requiring tool use."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> <code>tool_choice: \"any\"</code> buộc Claude <b>phải gọi một tool nào đó</b> (không được trả lời bằng văn bản), nhưng vẫn <b>tự chọn tool phù hợp</b> trong số các tool trích xuất theo loại tài liệu. Vì vậy luôn có structured output mà không cần biết trước loại tài liệu hay thêm bước phân loại.","elim":["<b>A.</b> Gọi phân loại trước rồi ép tool cụ thể tốn thêm một lời gọi API và thêm điểm lỗi (phân loại sai), trong khi <code>\"any\"</code> làm được việc này trong một lời gọi.","<b>C.</b> Gộp mọi loại tài liệu vào một schema chung làm mất các schema chuyên biệt, tạo nhiều trường tùy chọn/rỗng và giảm chất lượng trích xuất.","<b>D.</b> Giữ <code>\"auto\"</code> kèm chỉ dẫn trong prompt vẫn cho phép mô hình trả về văn bản; không có bảo đảm như đề yêu cầu."]},"cite":"Hướng dẫn ôn tập — §2.3 Tham số tool_choice; Lĩnh vực 4.3"},{"id":"t1q75","n":75,"topic":1,"type":"mcq","stem":{"en":"Monitoring shows 12% of extractions fall Pydantic validation with specific errors like &quot;expected float for quantity, got &#x27;2 to 3&quot;. Retrying these requests without modification produces failures. What&#x27;s the most effective approach to recover from these validation failures?"},"options":[{"k":"A","t":{"en":"Set temperature to 0 to eliminate output variability and ensure consistent formatting"}},{"k":"B","t":{"en":"Send a follow-up request including the validation error, asking the model to correct its output"}},{"k":"C","t":{"en":"Implement a secondary pipeline using a larger model tier to reprocess documents that fail validation"}},{"k":"D","t":{"en":"Pre-process source documents to standardize problematic formats before sending them for extraction"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Retry nguyên trạng thất bại vì mô hình không biết mình sai ở đâu. Gửi <b>yêu cầu tiếp theo kèm lỗi validation cụ thể</b> (“expected float for quantity, got '2 to 3'”) để mô hình <b>sửa đúng chỗ</b>, ví dụ chọn một giá trị số hoặc chuẩn hóa khoảng. Đây là vòng lặp validate–retry với Pydantic: lỗi định dạng là loại lỗi retry-with-feedback xử lý tốt nhất.","elim":["<b>A.</b> Temperature 0 chỉ làm đầu ra ổn định hơn, không giúp mô hình biết cách xử lý giá trị dạng khoảng; thậm chí lặp lại đúng lỗi cũ.","<b>C.</b> Chuyển sang model lớn hơn tốn chi phí mà không giải quyết gốc rễ: mô hình vẫn không được biết lỗi validation cụ thể.","<b>D.</b> Tiền xử lý tài liệu nguồn để chuẩn hóa định dạng là cồng kềnh, khó bao quát hết các biến thể, và có thể làm sai lệch dữ liệu gốc."]},"cite":"Hướng dẫn ôn tập — §6.5 Validation và Retry-with-Feedback; Lĩnh vực 4.4"},{"id":"t1q76","n":76,"topic":1,"type":"mcq","stem":{"en":"After three months of weekly sessions, your conversation history has grown to 85,000 tokens. When users ask &quot;What did we conclude about the theme of isolation?&quot;, the assistant provides generic literary analysis rather than referencing the group&#x27;s specific insights from earlier sessions. Discussions often build on previous meetings&#x27; conclusions, so maintaining narrative context is important. What&#x27;s the most effective approach?"},"options":[{"k":"A","t":{"en":"Add structured XML tags to mark significant discussion conclusions throughout the conversation history."}},{"k":"B","t":{"en":"Implement rolling window truncation to keep only the most recent 25,000 tokens."}},{"k":"C","t":{"en":"Use semantic embedding to index the full conversation history and retrieve only relevant past exchanges for each user query, replacing the linear conversation format with retrieved segments."}},{"k":"D","t":{"en":"Implement progressive summarization where older conversation blocks are replaced with concise summaries that explicitly extract key conclusions, decisions, and recurring themes, keeping recent exchanges verbatim."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Đề nhấn mạnh các buổi thảo luận <b>xây dựng trên kết luận trước đó</b> và cần <b>giữ mạch tường thuật</b>. <b>Tóm tắt lũy tiến</b> thay các khối cũ bằng bản tóm tắt <b>trích xuất rõ kết luận, quyết định và chủ đề lặp lại</b>, đồng thời giữ nguyên văn các trao đổi gần đây. Nhờ vậy câu hỏi “đã kết luận gì về sự cô lập” có câu trả lời cụ thể trong context, mà vẫn giảm mạnh số token.","elim":["<b>A.</b> Gắn thẻ XML đánh dấu kết luận không giảm được 85K token, và phải tái cấu trúc toàn bộ lịch sử cũ.","<b>B.</b> Rolling window 25K token cắt mất phần lớn ba tháng thảo luận, gồm chính các kết luận người dùng đang hỏi.","<b>C.</b> Semantic retrieval thay thế định dạng hội thoại tuyến tính bằng các đoạn rời rạc, phá vỡ mạch tường thuật mà đề yêu cầu giữ; các kết luận phụ thuộc lẫn nhau có thể bị truy xuất thiếu."]},"cite":"Hướng dẫn ôn tập — §1.5 Context Window; Lĩnh vực 5.1"},{"id":"t1q77","n":77,"topic":1,"type":"mcq","stem":{"en":"You&#x27;re Implementing a feature where users refine their playlist preferences through multiple conversation turns. After deploying, you notice Claude&#x27;s responses don&#x27;t reflect what us earlier in the same conversation— for example, a user says they love jazz, but two messages later Claude asks what genres they enjoy. What is the most likely cause?"},"options":[{"k":"A","t":{"en":"Your application isn&#x27;t including prior messages in the messages array"}},{"k":"B","t":{"en":"The model&#x27;s context window has been exceeded by the conversation length"}},{"k":"C","t":{"en":"Claude requires a vector database connection to maintain conversation memory"}},{"k":"D","t":{"en":"The Claude API requires a session_id parameter that you haven&#x27;t configured"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Claude API là <b>stateless</b>; không có bộ nhớ phía server giữa các lời gọi. Ứng dụng phải <b>đưa các tin nhắn trước vào mảng <code>messages</code></b> ở mỗi request. Chỉ hai tin nhắn sau khi người dùng nói thích jazz mà Claude đã quên là dấu hiệu rõ ràng các lượt trước không được gửi lên.","elim":["<b>B.</b> Một cuộc trao đổi vài tin nhắn không thể vượt context window hàng trăm nghìn token.","<b>C.</b> Claude không cần vector database để nhớ hội thoại; lịch sử được truyền trực tiếp qua <code>messages</code>.","<b>D.</b> Messages API không có tham số <code>session_id</code>; trạng thái hội thoại hoàn toàn do ứng dụng quản lý."]},"cite":"Hướng dẫn ôn tập — §1.2 Vai trò của Message; Lĩnh vực 5.1"},{"id":"t1q78","n":78,"topic":1,"type":"mcq","stem":{"en":"Your home renovation planning assistant uses a system prompt defining an expert contractor persona with specific guidelines: always ask about budget, suggest alternatives at multiple price points, and confirm timeline requirements. During testing, responses follow these guidelines for turns 1-4, but by turn 7, the assistant gives generic advice without asking about budget or timeline. The conversation is only 2,000 tokens—well within the context window. What is the most likely cause?"},"options":[{"k":"A","t":{"en":"The model&#x27;s attention on system prompt instructions naturally weakens as turns accumulate."}},{"k":"B","t":{"en":"System prompts only establish initial behavior and don&#x27;t persist across all turns."}},{"k":"C","t":{"en":"The system prompt is only sent with the first API request."}},{"k":"D","t":{"en":"The assistant&#x27;s accumulated responses are diluting the system prompt&#x27;s influence."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Hội thoại chỉ 2.000 token nên không phải vấn đề giới hạn context, và system prompt vẫn được gửi ở mọi request. Nguyên nhân là <b>các phản hồi assistant tích lũy làm loãng ảnh hưởng của system prompt</b>: mô hình ngày càng <b>khớp mẫu theo chính các đầu ra trước đó</b> của nó (lời khuyên chung chung) thay vì các quy tắc persona, dẫn đến trôi hành vi dù token còn ít.","elim":["<b>A.</b> Sự suy yếu chú ý theo độ dài không phải yếu tố đáng kể ở mức chỉ 2.000 token.","<b>B.</b> System prompt không chỉ thiết lập hành vi ban đầu; nó được áp dụng xuyên suốt và gửi kèm mỗi lời gọi API.","<b>C.</b> System prompt được truyền trong trường <code>system</code> ở mọi request (API stateless), không chỉ ở request đầu."]},"cite":"Hướng dẫn ôn tập — §1.4 System Prompt"},{"id":"t1q79","n":79,"topic":1,"type":"mcq","stem":{"en":"Users report that during extended conversations, the AI loses track of specific topics, examples, and preferences they mentioned earlier in the session. Your current implementation uses a sliding window that keeps only the most recent 25 message pairs to stay within context limits. What&#x27;s the most effective approach to maintain awareness of earlier conversation content while managing context size?"},"options":[{"k":"A","t":{"en":"Increase the window size to 50 message pairs to retain more conversation history before truncation."}},{"k":"B","t":{"en":"Add a separate API call each turn to summarize messages being dropped, prepending this running summary to the conversation."}},{"k":"C","t":{"en":"Implement vector similarity search over the full conversation history, retrieving relevant past messages for each user query."}},{"k":"D","t":{"en":"Replace the sliding window with a hybrid approach: summarize older messages while keeping recent messages verbatim."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Sliding window làm <b>mất hẳn</b> các lượt cũ. Cách tiếp cận <b>lai</b>, gồm <b>tóm tắt các tin nhắn cũ</b> và <b>giữ nguyên văn các tin nhắn gần đây</b>, vừa bảo toàn chủ đề, ví dụ và sở thích đã nêu dưới dạng nén, vừa giữ context chính xác cho mạch hội thoại hiện tại, trong giới hạn token.","elim":["<b>A.</b> Tăng cửa sổ lên 50 cặp chỉ trì hoãn vấn đề và tăng chi phí; khi hội thoại dài hơn, thông tin cũ vẫn bị cắt.","<b>B.</b> Gọi API riêng mỗi lượt để tóm tắt và nối dần bản tóm tắt làm tăng chi phí, độ trễ và tích lũy lỗi tóm tắt qua nhiều lần.","<b>C.</b> Vector search có thể bỏ sót các sở thích không tương đồng ngữ nghĩa với câu hỏi hiện tại, và thêm hạ tầng phức tạp."]},"cite":"Hướng dẫn ôn tập — §1.5 Context Window; Lĩnh vực 5.1"},{"id":"t1q80","n":80,"topic":1,"type":"mcq","stem":{"en":"During QA testing, you notice that Claude follows your system prompt guidelines consistently in the first 10- 15 turns, but by turn 25-30, responses begin deviating—using informal tone when formality was specified, occasionally skipping required formatting, or providing information types the guidelines restrict. Conversation length is well within context limits (typically 30,000 tokens out of 200,000 available). What&#x27;s the most effective approach to maintain consistent behavior throughout extended conversations?"},"options":[{"k":"A","t":{"en":"Automatically start a new conversation after 20 turns, passing a summary of the prior context to maintain continuity."}},{"k":"B","t":{"en":"Insert user-role messages that reinforce critical guidelines at natural conversation breakpoints, especially before complex requests."}},{"k":"C","t":{"en":"Move behavioral guidelines from the system prompt into the first user message."}},{"k":"D","t":{"en":"Implement post-response validation that regenerates each response until it conforms to the specified guidelines."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Trôi hướng dẫn xảy ra khi lịch sử tích lũy dần lấn át system prompt, dù vẫn trong giới hạn token. <b>Chèn tin nhắn vai trò user nhắc lại các hướng dẫn then chốt</b> tại các điểm ngắt tự nhiên (đặc biệt trước yêu cầu phức tạp) <b>tái thiết lập ràng buộc</b> gần vị trí sinh phản hồi, mang tính phòng ngừa và không phá vỡ context.","elim":["<b>A.</b> Bắt đầu hội thoại mới sau 20 lượt phá vỡ context, và bản tóm tắt có thể làm mất chi tiết quan trọng.","<b>C.</b> Chuyển hướng dẫn vào tin nhắn user đầu tiên làm giảm thẩm quyền của chúng, và chúng còn bị chôn sâu hơn khi hội thoại dài ra.","<b>D.</b> Validate rồi sinh lại mang tính khắc phục, tăng mạnh độ trễ và chi phí, mà không xử lý nguyên nhân gây trôi."]},"cite":"Hướng dẫn ôn tập — §1.4 System Prompt"},{"id":"t1q81","n":81,"topic":1,"type":"mcq","stem":{"en":"During a conversation about order tracking, your external system receives a webhook indicating the user&#x27;s package has shipped. The user is actively chatting and will likely send a follow-up message soon. You want the assistant to naturally incorporate this status change in its next response. What&#x27;s the most effective approach?"},"options":[{"k":"A","t":{"en":"Immediately send an API request with the update as a synthetic user message, generating an unsolicited assistant response."}},{"k":"B","t":{"en":"Append the status update as a prefix to the next user message before calling the API."}},{"k":"C","t":{"en":"Configure the assistant to call a get_order_status tool at the start of every response."}},{"k":"D","t":{"en":"Add the current shipping status to the system prompt before the next API call."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Cập nhật trạng thái là <b>thông tin tức thời gắn với lượt hội thoại hiện tại</b>, nên cách tự nhiên nhất là <b>chèn nó làm tiền tố cho tin nhắn tiếp theo của người dùng</b> trước khi gọi API (ví dụ một khối <code>[Cập nhật hệ thống: đơn hàng đã được gửi đi]</code> trước nội dung người dùng gõ). Mô hình thấy thông tin mới ngay đúng thời điểm trả lời và lồng nó vào phản hồi, mà không tạo lượt giả, không gọi tool thừa, và không phải sửa system prompt.","elim":["<b>A.</b> Gửi ngay một tin nhắn user giả sẽ sinh ra phản hồi không được yêu cầu, chen ngang khi người dùng đang gõ và làm lệch luồng hội thoại.","<b>C.</b> Bắt gọi <code>get_order_status</code> ở mọi phản hồi lãng phí một lời gọi tool mỗi lượt cho một sự kiện hiếm khi xảy ra.","<b>D.</b> System prompt dành cho chỉ dẫn và vai trò ổn định; sửa nó theo từng sự kiện là cồng kềnh, trộn dữ liệu trạng thái thay đổi liên tục vào phần cấu hình, và không gắn cập nhật với đúng thời điểm trong hội thoại."]},"cite":"Hướng dẫn ôn tập — §1.2 Vai trò của Message; câu hỏi mẫu 73 (Các mẫu kiến trúc AI hội thoại)"},{"id":"t1q82","n":82,"topic":1,"type":"mcq","stem":{"en":"Users report that responses feel repetitive across turns—each message begins with phrases like &quot;Certainly!&quot; or &quot;I&#x27;d be happy to help!&quot; even deep into conversations. You want responses to feel more natural, without these repetitive openers. What&#x27;s the most effective approach?"},"options":[{"k":"A","t":{"en":"Add system prompt instructions specifying phrases to avoid, such as &quot;Never begin responses with &#x27;Certainly&#x27; or similar affirmations&quot;"}},{"k":"B","t":{"en":"Implement post-processing to detect and strip common greeting phrases from response beginnings"}},{"k":"C","t":{"en":"Append a partial assistant message with a direct response opening that the model will continue from"}},{"k":"D","t":{"en":"Lower the temperature parameter to make response openings more deterministic and less variable"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> <b>Prefill</b>: nối một tin nhắn assistant dở dang chứa phần mở đầu trả lời trực tiếp, để mô hình <b>tiếp tục từ đó</b>. Vì token mở đầu đã cố định, mô hình không thể chèn “Certainly!” hay “I'd be happy to help!”. Cách này kiểm soát trực tiếp ngay ở bước sinh, đáng tin cậy hơn chỉ dẫn hay hậu xử lý.","elim":["<b>A.</b> Chỉ dẫn trong system prompt có ích nhưng kém tin cậy; mô hình thường chuyển sang các biến thể mở đầu khác (“Of course!”, “Absolutely!”).","<b>B.</b> Hậu xử lý cắt cụm chào hỏi là cách lách dễ vỡ: phải liệt kê mọi biến thể và có thể làm câu đầu cụt hoặc mất mạch.","<b>D.</b> Temperature điều khiển độ ngẫu nhiên, không phải mẫu cụm từ; hạ temperature còn có thể làm các câu mở đầu quen thuộc lặp lại nhiều hơn."]},"cite":"Hướng dẫn ôn tập — §1.2 Vai trò của Message"},{"id":"t1q83","n":83,"topic":1,"type":"mcq","stem":{"en":"Users frequently send ambiguous requests like &quot;book a venue for the party&quot; without specifying date, guest count, or budget. Your evaluation shows the assistant asks an average of 4.2 clarifying questions before taking any action, causing 35% of users to abandon mid-conversation. However, when you reduce questions, users sometimes receive recommendations that don&#x27;t match their preferences. What&#x27;s the most effective approach to improve this trade-off?"},"options":[{"k":"A","t":{"en":"Instruct the assistant to state explicit assumptions based on conversation history, proceed with recommendations while inviting corrections, and reserve clarifying questions only for irreversible actions like confirming bookings."}},{"k":"B","t":{"en":"Configure the assistant to consolidate all clarifying questions into a single compound question (e.g., &quot;What date, guest count, and budget are you considering?&quot;) to reduce the total number of conversational turns."}},{"k":"C","t":{"en":"Implement a structured intake form that collects all required parameters (date, guest count, budget, venue type) upfront before the assistant begins providing any recommendations."}},{"k":"D","t":{"en":"Configure the assistant to proceed with reasonable defaults (medium-sized venue, next weekend, moderate budget) without explicitly stating these assumptions, allowing users to provide corrections if results don&#x27;t match expectations."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Bài toán là cân bằng giữa <b>ma sát</b> (4,2 câu hỏi khiến 35% người dùng bỏ đi) và <b>độ khớp sở thích</b>. Cách cân bằng tốt nhất là <b>nêu giả định một cách tường minh</b> (dựa trên lịch sử hội thoại), vẫn đưa ra đề xuất ngay và mời người dùng chỉnh sửa — người dùng thấy giả định nên sửa được nhanh, thay vì nhận đề xuất sai mà không hiểu vì sao. Câu hỏi làm rõ chỉ dành cho <b>hành động không thể đảo ngược</b> như xác nhận đặt chỗ, nơi sai lầm gây hậu quả thật.","elim":["<b>B.</b> Gộp các câu hỏi thành một câu ghép vẫn bắt người dùng trả lời đủ mọi thông tin trước khi nhận được giá trị nào; ma sát nhận thức gần như không đổi, chỉ giảm số lượt.","<b>C.</b> Biểu mẫu thu thập đầy đủ tham số trước khi đề xuất chính là phiên bản cứng nhắc của việc hỏi 4,2 câu — vẫn chặn người dùng ở đầu luồng và gây bỏ cuộc.","<b>D.</b> Dùng giá trị mặc định mà <b>không nêu ra</b> khiến người dùng không biết kết quả dựa trên giả định nào, nên không thể sửa đúng chỗ — chính là nguyên nhân của các đề xuất lệch sở thích."]},"cite":"Hướng dẫn ôn tập — Lĩnh vực 5.2 Thiết kế các Mẫu Escalation Hiệu quả và Giải quyết Sự Mơ hồ"},{"id":"t1q84","n":84,"topic":1,"type":"mcq","stem":{"en":"Your conversational AI tutor has a 2,800-token system prompt containing teaching methodology, persona guidelines, and detailed written instructions for adapting explanations to different proficiency levels. User testing reveals that in conversations exceeding 12 turns (approximately 4,000 tokens of conversation history), the assistant increasingly ignores the proficiency-adaptation guidelines, defaulting to intermediate-level explanations regardless of the learner&#x27;s stated level. What&#x27;s the most effective approach to ensure consistent adherence to these guidelines throughout extended conversations?"},"options":[{"k":"A","t":{"en":"Inject a condensed reminder of the proficiency requirements into the conversation as a system message every 4-5 turns."}},{"k":"B","t":{"en":"Replace the verbose proficiency guidelines with few-shot examples demonstrating appropriate responses at each proficiency level, showing concrete differences in vocabulary, complexity, and explanation depth."}},{"k":"C","t":{"en":"After each assistant response, make a separate API call to evaluate whether the difficulty level matched the learner&#x27;s profile, regenerating responses that don&#x27;t align."}},{"k":"D","t":{"en":"Restructure the system prompt to place the proficiency-adaptation rules in a clearly-marked final section immediately before the conversation history begins."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Mô hình bỏ qua hướng dẫn thích ứng trình độ và “trôi” về mức trung bình vì các chỉ dẫn mô tả bằng lời dài dòng là <b>trừu tượng</b>, khó áp dụng nhất quán khi hội thoại dài ra. <b>Ví dụ few-shot</b> cho từng trình độ thể hiện cụ thể khác biệt về từ vựng, độ phức tạp, độ sâu giải thích — đây là cách hiệu quả nhất để tạo đầu ra nhất quán và giúp mô hình tổng quát hóa thay vì quay về mặc định. Đồng thời thay phần văn bản dài bằng ví dụ còn làm prompt gọn và rõ hơn.","elim":["<b>A.</b> Chèn nhắc nhở định kỳ chỉ là giải pháp chắp vá xử lý triệu chứng: nhắc lại cùng một chỉ dẫn trừu tượng không làm mô hình biết cụ thể câu trả lời ở mỗi trình độ trông ra sao.","<b>C.</b> Thêm một lời gọi API đánh giá rồi sinh lại sau mỗi phản hồi làm tăng gấp đôi chi phí và độ trễ, chỉ phát hiện lỗi sau khi xảy ra chứ không sửa nguyên nhân gốc.","<b>D.</b> Chỉ đổi vị trí phần quy tắc trong system prompt không giải quyết được việc chỉ dẫn trừu tượng khó áp dụng; ~4.000 token hội thoại cũng không phải là quá dài để vị trí trở thành yếu tố quyết định."]},"cite":"Hướng dẫn ôn tập — §6.1 Few-shot Prompting; Lĩnh vực 4.2"},{"id":"t1q85","n":85,"topic":1,"type":"mcq","stem":{"en":"The system routes documents with extraction confidence below 85% to human review. A quarterly audit reveals that 12% of high-confidence extractions (&gt;85%) also contain errors—cases where the model finds plausible-but-incorrect values. Error sources vary: comparison tables showing competitor specs, appendices referencing different product variants, and ambiguous phrasing the model misinterprets. You need a sustainable strategy to catch these high-confidence errors and measure whether improvements reduce the error rate over time. What approach is most effective?"},"options":[{"k":"A","t":{"en":"Add a verification pass that re-extracts from each high-confidence document, flagging cases where the two extraction attempts produce different results."}},{"k":"B","t":{"en":"Lower the confidence threshold from 85% to 70%, routing a larger volume of extractions to human review."}},{"k":"C","t":{"en":"Implement heuristic rules that flag documents containing comparison tables or appendices for review regardless of confidence score."}},{"k":"D","t":{"en":"Implement stratified random sampling reviewing a fixed percentage of high-confidence extractions weekly, enabling error rate measurement and novel pattern detection."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Lỗi ở nhóm độ tin cậy cao là các giá trị “hợp lý nhưng sai” mà điểm confidence không phản ánh được, và nguồn lỗi rất đa dạng. <b>Lấy mẫu ngẫu nhiên phân tầng</b> một tỷ lệ cố định các bản trích xuất độ tin cậy cao mỗi tuần vừa cho phép <b>đo tỷ lệ lỗi</b> một cách thống kê theo thời gian (để biết cải tiến có hiệu quả không), vừa giúp <b>phát hiện các mẫu lỗi mới</b> chưa biết trước. Đây là chiến lược bền vững với khối lượng review có thể kiểm soát.","elim":["<b>A.</b> Trích xuất lại lần hai bằng cùng mô hình thường lặp lại cùng lỗi “hợp lý nhưng sai” (lỗi mang tính hệ thống), nên hai lần khớp nhau vẫn có thể sai; nó cũng không cung cấp số đo tỷ lệ lỗi.","<b>B.</b> Hạ ngưỡng xuống 70% chỉ đẩy thêm khối lượng review mà không nhắm vào lỗi ở nhóm &gt;85%, vì độ tin cậy vốn không tương quan tốt với các lỗi này.","<b>C.</b> Heuristic chỉ bắt các nguồn lỗi đã biết (bảng so sánh, phụ lục), bỏ sót lỗi diễn đạt mơ hồ và các mẫu lỗi mới, đồng thời không đo được tỷ lệ lỗi tổng thể."]},"cite":"Hướng dẫn ôn tập — §9.4 Hiệu chỉnh độ tin cậy và giám sát của con người; Lĩnh vực 5.5"},{"id":"t1q86","n":86,"topic":1,"type":"mcq","stem":{"en":"Your research assistant helps users analyze academic papers over extended conversations. User testing reveals a recurring issue: after conversations exceed 60K tokens, users ask follow-up questions requiring precise numerical details from papers discussed earlier—sample sizes, exact p-values, specific inclusion criteria. Your current approach summarizes paper discussions after 8 turns to stay within context limits. Users report that responses to these precision-dependent questions are often hedged or inaccurate. What&#x27;s the most effective architectural change?"},"options":[{"k":"A","t":{"en":"Keep source text from methodology and results sections in context permanently, while summarizing only the conversational discussion and interpretation portions."}},{"k":"B","t":{"en":"Use a separate Claude call with explicit instructions to generate higher-fidelity summaries that preserve all numerical details and statistical values."}},{"k":"C","t":{"en":"Implement retrieval that re-injects relevant paper sections when the user&#x27;s question suggests they need specific numerical details."}},{"k":"D","t":{"en":"Maintain a structured database of key facts extracted from each paper (sample sizes, statistics, methods) and retrieve relevant entries into context when precision-dependent questions are detected."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Nguyên nhân gốc là <b>tóm tắt tiệm tiến làm mất giá trị số</b> (cỡ mẫu, p-value, tiêu chí chọn). Giải pháp kiến trúc là <b>trích xuất các sự kiện then chốt thành dữ liệu có cấu trúc</b> lưu ngoài lịch sử được tóm tắt, rồi truy xuất đúng mục vào context khi phát hiện câu hỏi cần độ chính xác. Cách này giữ chính xác số liệu, tiết kiệm token và không phụ thuộc vào chất lượng tóm tắt — tương tự mẫu “case facts” tách khỏi lịch sử hội thoại.","elim":["<b>A.</b> Giữ vĩnh viễn toàn bộ phần phương pháp và kết quả của mọi bài báo sẽ làm context phình to theo số bài, sớm chạm giới hạn và gây hiệu ứng lost-in-the-middle.","<b>B.</b> Tóm tắt “độ trung thực cao hơn” vẫn là tóm tắt, vẫn có nguy cơ làm mất hoặc làm méo chi tiết số, và vẫn tiêu tốn context khi số bài tăng.","<b>C.</b> Re-inject cả đoạn văn bản thô tốn nhiều token và phải dò tìm số liệu trong văn bản dài; lưu sự kiện dạng cấu trúc gọn và chính xác hơn cho đúng loại câu hỏi này."]},"cite":"Hướng dẫn ôn tập — §11.1 Trích xuất các Sự kiện ra một Block Riêng; Lĩnh vực 5.1"},{"id":"t1q87","n":87,"topic":1,"type":"mcq","stem":{"en":"A security audit requires updating your authentication library from v2 to v3. The migration guide documents breaking changes: authenticate() now returns a Promise instead of accepting a callback, the User type has restructured fields, and three deprecated methods were removed. Grep shows the library is imported in 45 files across several modules. What&#x27;s the most effective approach?"},"options":[{"k":"A","t":{"en":"Create a custom slash command encapsulating the migration transformations, then execute it against each file without prior codebase exploration."}},{"k":"B","t":{"en":"Update the dependency version, run the test suite, and use Claude Code to fix each failure as it appears."}},{"k":"C","t":{"en":"Enter plan mode to explore library usage across modules, map affected code paths, then create a migration strategy before implementing."}},{"k":"D","t":{"en":"Paste the migration guide&#x27;s breaking changes into your prompt and use direct execution to update all usages across the 45 files."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Đây là thay đổi lớn: breaking change về API (callback → Promise), cấu trúc kiểu <code>User</code> thay đổi, phương thức bị xóa, chạm tới <b>45 file ở nhiều module</b>. Theo hướng dẫn, các migration quy mô như vậy cần <b>planning mode</b> để khám phá an toàn cách thư viện được dùng, lập bản đồ các luồng code bị ảnh hưởng và xây chiến lược migration trước khi sửa — tránh sửa dở dang hoặc không nhất quán giữa các module.","elim":["<b>A.</b> Áp một slash command biến đổi máy móc “không khám phá trước” bỏ qua khác biệt trong cách mỗi module dùng thư viện (ví dụ cách xử lý callback, trường <code>User</code>), dễ gây lỗi hàng loạt.","<b>B.</b> Sửa theo từng test thất bại là phản ứng thụ động, phụ thuộc độ phủ test; các luồng không có test sẽ lọt lỗi và không có chiến lược nhất quán cho 45 file.","<b>D.</b> Thực thi trực tiếp trên 45 file mà không hiểu các mẫu sử dụng là đúng loại tác vụ planning mode được thiết kế để tránh; dán migration guide không thay thế việc khảo sát codebase."]},"cite":"Hướng dẫn ôn tập — §5.6 Planning Mode so với Thực thi trực tiếp; Lĩnh vực 3.4"},{"id":"t1q88","n":88,"topic":1,"type":"mcq","stem":{"en":"You&#x27;ve asked Claude Code to build a PDF report generation feature. The initial implementation queries the database correctly, but the output has formatting issues: table columns are too narrow causing content truncation, dates display without proper formatting, and page break handling is incorrect. You&#x27;ve noticed these issues interact— changing column widths affects how dates render, and page breaks depend on content height. What&#x27;s the most effective approach for iterating toward a working solution?"},"options":[{"k":"A","t":{"en":"Address the column width issue first with specific measurements, verify it works, then fix date formatting within the corrected columns, then adjust page breaks— testing after each change."}},{"k":"B","t":{"en":"Show Claude an example of a correctly formatted report and ask it to match that output, rather than listing the specific technical issues."}},{"k":"C","t":{"en":"Start fresh with a detailed prompt specifying all formatting requirements upfront."}},{"k":"D","t":{"en":"Provide all three issues in a single detailed message with exact specifications for each, allowing Claude to address them together in one update."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Ba vấn đề <b>phụ thuộc lẫn nhau theo chuỗi</b>: độ rộng cột ảnh hưởng cách ngày hiển thị, và ngắt trang phụ thuộc chiều cao nội dung. Vì vậy nên <b>sửa tuần tự theo thứ tự phụ thuộc</b> — cột trước (với số đo cụ thể), kiểm tra, rồi định dạng ngày trong cột đã đúng, rồi ngắt trang — và <b>test sau mỗi bước</b>. Cách lặp tiệm tiến này giúp cô lập nguyên nhân khi có lỗi và mỗi bước xây trên nền đã được xác minh.","elim":["<b>B.</b> Đưa một báo cáo mẫu mà không nêu vấn đề kỹ thuật cụ thể khiến Claude phải tự đoán chênh lệch nằm ở đâu, không xử lý rõ chuỗi phụ thuộc giữa cột, ngày và ngắt trang.","<b>C.</b> Bắt đầu lại từ đầu vứt bỏ phần truy vấn dữ liệu đã đúng và vẫn phải đối mặt với cùng các tương tác định dạng.","<b>D.</b> Sửa cả ba cùng lúc khiến khi kết quả sai thì khó biết thay đổi nào gây ra, vì chúng tác động lẫn nhau; không có điểm kiểm tra giữa các bước."]},"cite":"Hướng dẫn ôn tập — Lĩnh vực 3.5 Tinh chỉnh Lặp lại để Cải thiện Tiệm tiến"},{"id":"t1q89","n":89,"topic":1,"type":"mcq","stem":{"en":"You&#x27;re implementing a new payment processing module that must follow your project&#x27;s established patterns for database transactions, error handling, and audit logging. You&#x27;ve identified three existing modules that exemplify these patterns: db_utils.py, error_handlers.py, and audit_logger.py. This is a one-off integration task—these patterns are well-documented in your team wiki and don&#x27;t need additional project-level documentation. What&#x27;s the most effective approach?"},"options":[{"k":"A","t":{"en":"Ask Claude to explore your codebase to find and understand the transaction, error handling, and logging patterns before generating the new module."}},{"k":"B","t":{"en":"Use @references to include the three modules directly in your prompt, giving Claude concrete code examples of the patterns to follow."}},{"k":"C","t":{"en":"Add documentation of each pattern to your CLAUDE.md file, establishing them as project conventions that Claude will apply automatically."}},{"k":"D","t":{"en":"Describe the patterns from the three modules in natural language in your prompt, explaining the transaction handling approach, error format, and logging conventions Claude should follow."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Đã biết chính xác ba module mẫu và đây là <b>tác vụ một lần</b>. Dùng <b>tham chiếu <code>@file</code></b> đưa thẳng <code>db_utils.py</code>, <code>error_handlers.py</code>, <code>audit_logger.py</code> vào prompt cho Claude <b>ví dụ code cụ thể</b> — cách truyền đạt kỳ vọng hiệu quả nhất, không mất công tìm kiếm và không làm nhiễu cấu hình dự án lâu dài.","elim":["<b>A.</b> Bắt Claude tự khám phá codebase lãng phí context và thời gian khi ta đã biết chính xác ba file mẫu, lại có rủi ro tìm nhầm mẫu khác.","<b>C.</b> Đề bài nói rõ đây là việc một lần và các mẫu đã có tài liệu; thêm vào CLAUDE.md sẽ nạp chúng vào mọi session sau, gây tốn context không cần thiết.","<b>D.</b> Mô tả bằng ngôn ngữ tự nhiên kém chính xác hơn code thật; dễ bỏ sót chi tiết như định dạng lỗi hay chữ ký hàm mà ví dụ cụ thể thể hiện ngay."]},"cite":"Hướng dẫn ôn tập — §5.2 Cú pháp @path (Import tệp); Lĩnh vực 3.5"},{"id":"t1q90","n":90,"topic":1,"type":"mcq","stem":{"en":"Your monorepo contains shared coding standards in /docs/standards/security-rules.md (for services handling user data), testing-patterns.md (for all packages), and api-conventions.md (for API-facing services). Your 15 packages are organized by feature domain (/packages/auth/, /packages/billing/, /packages/notifications/, etc.) without naming conventions indicating which handle user data or expose APIs. Package maintainers are expected to configure their own local development settings, as they understand their package&#x27;s domain requirements. Currently, all package CLAUDE.md files duplicate all three standards, applying irrelevant guidance. What&#x27;s the most effective approach?"},"options":[{"k":"A","t":{"en":"Use @imports in each package&#x27;s CLAUDE.md to reference only the specific standard files relevant to that package, based on the maintainer&#x27;s domain knowledge."}},{"k":"B","t":{"en":"Create claude/rules/ files for each standard with YAML frontmatter paths listing every package directory where that standard should apply."}},{"k":"C","t":{"en":"Create a shared-standards.nd that uses @imports to combine all three standards, then have each package&#x27;s CLAUDE.md import that combined file."}},{"k":"D","t":{"en":"Put all standards in the root CLAUDE.md with override instructions like &quot;ignore security-rules.md when working in packages that don&#x27;t handle user data.&quot;"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Các package được tổ chức theo domain, <b>không có quy ước đặt tên</b> cho biết package nào xử lý dữ liệu người dùng hay mở API, và chính <b>maintainer</b> mới hiểu yêu cầu domain của package mình. Vì vậy dùng <b><code>@import</code> trong CLAUDE.md của từng package</b> để chỉ đưa vào các file tiêu chuẩn liên quan là cách đúng: tiêu chuẩn được lưu một nơi (không trùng lặp), mỗi package chỉ nạp phần phù hợp, và quyền quyết định thuộc về người hiểu domain.","elim":["<b>B.</b> <code>.claude/rules/</code> với <code>paths</code> phát huy khi có mẫu glob chung; ở đây phải liệt kê thủ công từng thư mục package ở cấp trung tâm, tách khỏi maintainer và dễ lỗi thời khi thêm package.","<b>C.</b> File gộp cả ba tiêu chuẩn rồi import vào mọi package lại tái tạo đúng vấn đề hiện tại — mỗi package vẫn nhận cả hướng dẫn không liên quan.","<b>D.</b> Dồn tất cả vào CLAUDE.md gốc kèm lệnh “bỏ qua” vẫn nạp mọi tiêu chuẩn vào context và dựa vào việc mô hình tự đoán package nào xử lý dữ liệu người dùng — điều không thể suy ra từ tên."]},"cite":"Hướng dẫn ôn tập — §5.2 Cú pháp @path (Import tệp); Lĩnh vực 3.1"},{"id":"t1q91","n":91,"topic":1,"type":"mcq","stem":{"en":"The system needs to extract candidate information (name, contact details, skills, work experience, education) from uploaded resumes. The extracted data must strictly conform to a predefined JSON schema, as missing required fields or incorrect data types will cause downstream validation failures. What is the most reliable approach to ensure Claude&#x27;s output consistently matches the schema?"},"options":[{"k":"A","t":{"en":"Define a tool with an input schema matching your required JSON structure and extract the data from Claude&#x27;s tool_use response."}},{"k":"B","t":{"en":"Make two separate API calls—first extracting information as text, then asking Claude to format that text as JSON."}},{"k":"C","t":{"en":"Include detailed JSON formatting instructions and a template example in the system prompt, asking Claude to output only valid JSON."}},{"k":"D","t":{"en":"Parse Claude&#x27;s text response with regex patterns to extract JSON objects, using retry logic for malformed responses."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> <b><code>tool_use</code> với JSON Schema</b> là cách đáng tin cậy nhất để đảm bảo đầu ra tuân thủ schema: định nghĩa một tool có <code>input_schema</code> khớp cấu trúc cần thiết (trường bắt buộc, kiểu dữ liệu), rồi lấy dữ liệu từ khối <code>tool_use</code> trong phản hồi. Cách này loại bỏ lỗi cú pháp JSON và thiếu trường bắt buộc — đúng thứ gây lỗi validation phía sau. (Có thể kết hợp ép <code>tool_choice</code> để chắc chắn tool được gọi.)","elim":["<b>B.</b> Hai lời gọi API tăng chi phí, độ trễ, và bước định dạng JSON bằng văn bản vẫn không có cơ chế ràng buộc schema.","<b>C.</b> Hướng dẫn định dạng và template trong system prompt chỉ là gợi ý; mô hình vẫn có thể sinh JSON sai cú pháp hoặc thiếu trường.","<b>D.</b> Regex kèm retry là cách vá phía sau, mong manh với JSON lồng nhau và không đảm bảo đúng schema; xử lý triệu chứng thay vì ngăn lỗi từ đầu."]},"cite":"Hướng dẫn ôn tập — §2.4 JSON Schema cho Structured Output; Lĩnh vực 4.3"},{"id":"t1q92","n":92,"topic":1,"type":"mcq","stem":{"en":"Anthropic&#x27;s tool use documentation states: &quot;Write instructive error messages. Instead of generic errors like &#x27;failed&#x27;, include what went wrong and what Claude should try next.&quot; A billing dispute agent uses lookup_order, which catches all exceptions and returns a tool_result with is_error: true and the message &quot;execution failed&quot;. Monitoring shows two failure modes: the agent retries the identical call until hitting the turn limit, or it immediately calls escalate_to_human without trying alternative tools. Which change follows the documented recommendation and gives Claude the information it needs to select the correct recovery action for each error type?"},"options":[{"k":"A","t":{"en":"Return error-type-specific messages with is_error: true, e.g., &quot;order not found-try get_customer to search by phone&quot; for data errors and &quot;Database timeout (transient)-retry should succeed&quot; for infrastructure errors."}},{"k":"B","t":{"en":"Implement retry logic with exponential backoff inside each tool implementation so transient errors are resolved transparently within the tool before any failure result is surfaced to Claude in the agentic loop."}},{"k":"C","t":{"en":"Remove is_error: true and return the error details as normal tool content, so Claude reasons about the response as data rather than treating it as a flagged failure condition that biases retry behavior."}},{"k":"D","t":{"en":"Add an error classification step in the agentic loop that intercepts tool errors before Claude sees them, tags each as &quot;retry&quot; &quot;try_alternative,&quot; or &quot;escalate,&quot; and adds that recommendation to the tool result."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Thông báo chung chung “execution failed” khiến Claude không phân biệt được lỗi tạm thời với lỗi dữ liệu, dẫn tới hai hành vi sai: retry vô ích hoặc escalate sớm. Làm đúng khuyến nghị của tài liệu là trả về <b>thông báo riêng theo loại lỗi</b>, vẫn giữ <code>is_error: true</code>, nêu <b>điều gì đã sai và nên thử gì tiếp</b> — ví dụ “order not found – thử <code>get_customer</code> theo số điện thoại” cho lỗi dữ liệu và “Database timeout (transient) – retry nên thành công” cho lỗi hạ tầng. Claude nhờ đó chọn đúng hành động phục hồi.","elim":["<b>B.</b> Retry có backoff bên trong tool chỉ xử lý lỗi tạm thời; lỗi “order not found” vẫn trả về thông báo chung chung nên Claude vẫn không biết thử tool thay thế.","<b>C.</b> Bỏ <code>is_error: true</code> làm mất tín hiệu thất bại; Claude có thể coi thông báo lỗi là dữ liệu hợp lệ, và việc này không theo khuyến nghị viết thông báo lỗi có tính hướng dẫn.","<b>D.</b> Thêm lớp phân loại chặn giữa vòng lặp là phức tạp hóa không cần thiết; thông tin phân loại thuộc về chính tool — nơi biết rõ lỗi xảy ra vì sao — đúng như tài liệu khuyến nghị."]},"cite":"Hướng dẫn ôn tập — §4.4 Cờ isError trong MCP; Lĩnh vực 2.2"},{"id":"t1q93","n":93,"topic":1,"type":"mcq","stem":{"en":"Production logs reveal inconsistent error handling: when tool_code fails, the agent sometimes retries 5 times (even if the tool_id doesn&#x27;t exist), sometimes escalates immediately (premature for temporary network issues), and sometimes adds user-friendly explanation (inappropriate when the issue is a backend permission error). Investigation shows four MCP tool returns uniform error responses: {&quot;status&quot;: &quot;error&quot;, &quot;content&quot;: &quot;{&quot;type&quot;: &quot;Error&quot;, &quot;message&quot;: &quot;Operation failed.&quot;}&quot;}. The agent learns different types. What&#x27;s the most effective improvement?"},"options":[{"k":"A","t":{"en":"Add a few-shot examples to the system prompt demonstrating how to interpret error message patterns and select appropriate responses for each."}},{"k":"B","t":{"en":"Enhance error responses with structured metadata. Include error_category (transient/retriable/permission), reason, and a description of what caused the failure."}},{"k":"C","t":{"en":"Implement retry logic with exponential backoff in your MCP server for all errors, returning to the agent only after retries are exhausted."}},{"k":"D","t":{"en":"Create an analyze_error MCP tool the agent calls after any failure to determine the error category and recommended action."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Mọi tool MCP đều trả về cùng một lỗi “Operation failed.”, nên agent không có thông tin để chọn cách xử lý — dẫn tới retry lỗi không tồn tại, escalate sớm lỗi mạng tạm thời, giải thích sai lỗi quyền. Giải pháp gốc là <b>bổ sung metadata lỗi có cấu trúc</b>: <code>error_category</code> (transient/retriable/permission), lý do và mô tả nguyên nhân. Đây đúng là mẫu “phản hồi lỗi có cấu trúc” với <code>errorCategory</code>/<code>isRetryable</code> cho tool MCP.","elim":["<b>A.</b> Few-shot dạy cách diễn giải mẫu thông báo lỗi là vô ích khi mọi lỗi đều giống hệt nhau — không có mẫu nào để phân biệt.","<b>C.</b> Retry mọi lỗi bất kể loại sẽ retry cả lỗi quyền và tool_id không tồn tại (không bao giờ thành công), lãng phí thời gian và vẫn trả về lỗi chung chung sau cùng.","<b>D.</b> Tool <code>analyze_error</code> cũng chỉ nhận được cùng chuỗi “Operation failed.” nên không thể suy ra loại lỗi; còn tốn thêm một lượt gọi mỗi lần thất bại."]},"cite":"Hướng dẫn ôn tập — §4.4 Cờ isError trong MCP; Lĩnh vực 2.2"},{"id":"t1q94","n":94,"topic":1,"type":"mcq","stem":{"en":"Your code review prompts include both implementation changes and the corresponding test file, but the LLM&#x27;s review comments fail to point out untested code paths. Analysis reveals the model correctly flags functions that have no tests at all, but fails to identify when conditional branches or error-handling paths within tested functions that have no tests at all, but fails to identify when conditional branches or error-handling paths within tested functio lack coverage. What&#x27;s the most effective way to improve detection of branch-level coverage gaps without overcomplicating the pipeline?"},"options":[{"k":"A","t":{"en":"Implement a multi-pass pipeline where separate LLM calls first extract all conditional branches, then cross-reference each against test assertions in a second pass."}},{"k":"B","t":{"en":"Add explicit instructions directing the model to enumerate each conditional branch and exception path, then verify each has a corresponding test assertion."}},{"k":"C","t":{"en":"Restructure the prompt to interleave implementation and tests, presenting each function followed immediately by its test cases"}},{"k":"D","t":{"en":"Include few-shot examples showing code with an uncovered branch paired with the review comment identifying the specific missing test case."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Mô hình đã làm tốt ở mức hàm nhưng bỏ sót <b>khoảng trống phủ test ở mức nhánh</b> (nhánh điều kiện, đường xử lý lỗi). <b>Ví dụ few-shot</b> ghép đoạn code có nhánh chưa được test với comment review chỉ rõ test case còn thiếu giúp mô hình hiểu chính xác loại phát hiện mong muốn và mức chi tiết cần nêu. Guide nêu rõ few-shot có thể minh họa cách xử lý các tình huống như lỗ hổng độ phủ test, và đây là cách cải thiện mà không làm phức tạp pipeline.","elim":["<b>A.</b> Pipeline nhiều lượt với các lời gọi LLM riêng để trích xuất nhánh rồi đối chiếu là phức tạp hóa — trái với yêu cầu “không làm phức tạp pipeline”.","<b>B.</b> Chỉ dẫn bằng lời “liệt kê từng nhánh rồi kiểm tra” kém hiệu quả hơn ví dụ cụ thể trong việc truyền đạt thế nào là một khoảng trống phủ test và cách viết comment.","<b>C.</b> Xếp xen kẽ code và test chỉ thay đổi bố cục; mô hình vẫn không được chỉ cho thấy cần phân tích ở mức nhánh."]},"cite":"Hướng dẫn ôn tập — §6.1 Few-shot Prompting; Lĩnh vực 4.2"},{"id":"t1q95","n":95,"topic":1,"type":"mcq","stem":{"en":"Your pipeline uses a tool called extract_metadata with a JSON schema for paper details. You&#x27;ve also defined lookup_citations and verify_doi tools for enrichment. During testing, you notice that when users include requests like &quot;extract the metadata and tell me how cited it is,&quot; Claude sometimes calls lookup_citations first, which fails because it needs the DOI that extract_metadata would provide. What&#x27;s the most effective way to ensure structured metadata extraction happens first?"},"options":[{"k":"A","t":{"en":"Set tool_choice to {&quot;type&quot;: &quot;tool&quot;, &quot;name&quot;: &quot;extract_metadata&quot;} and process the enrichment requests in subsequent turns after receiving the extracted metadata."}},{"k":"B","t":{"en":"Set tool_choice to &quot;any&quot; so Claude must use a tool, combined with system prompt instructions prioritizing extract_metadata."}},{"k":"C","t":{"en":"Set tool_choice to &quot;auto&quot; and reorder the tool definitions so extract_metadata appears first in the tools array, since Claude prioritizes earlier-listed tools."}},{"k":"D","t":{"en":"Set tool_choice to {&quot;type&quot;: &quot;tool&quot;, &quot;name&quot;: &quot;extract_metadata&quot;} for every API call in the pipeline, ensuring Claude always extracts metadata before any enrichment can occur."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Để <b>đảm bảo thứ tự thực thi</b>, ép một tool cụ thể bằng <code>tool_choice: {\"type\": \"tool\", \"name\": \"extract_metadata\"}</code> ở lượt đầu tiên, nên DOI chắc chắn được trích xuất trước. Sau khi có metadata, các lượt tiếp theo (với <code>tool_choice</code> bình thường) xử lý yêu cầu làm giàu dữ liệu như <code>lookup_citations</code>, <code>verify_doi</code> dùng DOI vừa có.","elim":["<b>B.</b> <code>\"any\"</code> chỉ bắt buộc gọi <i>một</i> tool nào đó, không bắt buộc tool nào; Claude vẫn có thể gọi <code>lookup_citations</code> trước, chỉ dẫn trong prompt không phải bảo đảm.","<b>C.</b> Thứ tự trong mảng tools không quyết định việc chọn tool; với <code>\"auto\"</code> Claude chọn theo mô tả và ngữ cảnh, nên vẫn có thể gọi sai thứ tự.","<b>D.</b> Ép <code>extract_metadata</code> ở <i>mọi</i> lời gọi sẽ khiến Claude không bao giờ gọi được <code>lookup_citations</code> hay <code>verify_doi</code>, chặn luôn bước làm giàu dữ liệu."]},"cite":"Hướng dẫn ôn tập — §2.3 Tham số tool_choice; Lĩnh vực 2.3"},{"id":"t1q96","n":96,"topic":1,"type":"mcq","stem":{"en":"Your pipeline reviews every PR using a single API call with a static prompt containing the diff and full text of each changed file — unchanged files are not included. Reviews are posted asynchronously and don&#x27;t block PR creation. Developers report that reviews consistently miss bugs involving cross-file interactions — for example, a PR renames a function&#x27;s parameters but the review doesn&#x27;t flag callers in unchanged files that still use the old argument order. Evaluation shows cross-file bugs account for 35% of production incidents from reviewed PRs. What is the most effective change to your review design?"},"options":[{"k":"A","t":{"en":"Redesign the review as a turn-limited agentic task where the model can read files and search the codebase via tools, following references to verify cross-file findings."}},{"k":"B","t":{"en":"Run parallel review passes per changed file with direct dependents included in each pass, then aggregate and deduplicate findings using a final summarization call."}},{"k":"C","t":{"en":"Use static analysis to build a dependency graph of changed code, then expand the prompt to include all files within two dependency hops of any changed file."}},{"k":"D","t":{"en":"Add chain-of-thought instructions asking the model to list all external references in the diff, then reason step-by-step about how each change might affect callers in other files."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Lỗi xuyên file xảy ra vì <b>thiếu context</b>: các hàm gọi nằm trong file không thay đổi, mà prompt tĩnh chỉ chứa diff và file đã đổi. Thiết kế lại thành <b>tác vụ agentic có giới hạn số lượt</b>, cho mô hình dùng tool đọc file và tìm kiếm codebase (ví dụ Grep tên hàm bị đổi tham số) để <b>truy vết tham chiếu</b> và xác minh phát hiện — chỉ lấy đúng context cần thiết. Review không chặn PR nên thời gian chạy thêm của vòng lặp agent là chấp nhận được.","elim":["<b>B.</b> Chỉ đưa “phụ thuộc trực tiếp” được xác định trước vẫn là context tĩnh, có thể bỏ sót caller ở xa hơn; lượt tổng hợp cuối cũng không bù được thông tin chưa từng được đọc.","<b>C.</b> Nạp mọi file trong phạm vi hai bước phụ thuộc làm prompt phình to (gây loãng chú ý) mà vẫn có thể bỏ sót caller ở xa hơn hai bước.","<b>D.</b> Chain-of-thought không giúp mô hình biết caller nằm ở đâu và dùng thứ tự đối số thế nào khi nó không thể nhìn thấy các file đó."]},"cite":"Hướng dẫn ôn tập — §8.2 Phân rã thích ứng động (Dynamic Adaptive Decomposition); Lĩnh vực 4.6"},{"id":"t1q97","n":97,"topic":1,"type":"mcq","stem":{"en":"Your search Flights tool calls an external airline API that occasionally returns a 503 Service Unavailable error. What is the most effective way to handle this error in your tool implementation?"},"options":[{"k":"A","t":{"en":"Return an empty flight list as if the search succeeded but found no matching flights."}},{"k":"B","t":{"en":"Log the error internally and return an empty response, letting the model continue without the flight data."}},{"k":"C","t":{"en":"Return an error message in the tool result explaining the service is temporarily unavailable."}},{"k":"D","t":{"en":"Automatically retry the request up to five times with exponential backoff before returning results to the agent."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> 503 Service Unavailable là <b>lỗi tạm thời</b> và thỉnh thoảng mới xảy ra, nên thường thành công khi thử lại. Nguyên tắc phân chia trách nhiệm là <b>phục hồi cục bộ</b> đối với lỗi tạm thời ngay trong phần cài đặt tool — <b>retry với exponential backoff</b> có giới hạn số lần — và chỉ báo lỗi lên agent khi đã thử hết. Agent nhờ đó không tốn lượt cho một lỗi tạm thời.","elim":["<b>A.</b> Trả về danh sách rỗng như thể tìm kiếm thành công là che giấu lỗi: agent sẽ nói với người dùng “không có chuyến bay”, nhầm lỗi truy cập với kết quả rỗng hợp lệ.","<b>B.</b> Ghi log rồi trả về rỗng cũng lặng lẽ nuốt lỗi; mô hình tiếp tục mà không biết dữ liệu bị thiếu — một anti-pattern xử lý lỗi.","<b>C.</b> Báo lỗi ngay lên agent đẩy một lỗi tạm thời, có thể tự khắc phục, lên tầng suy luận; agent tốn lượt retry hoặc sai lầm báo người dùng “thử lại sau”."]},"cite":"Hướng dẫn ôn tập — §10.2 Các anti-pattern trong xử lý lỗi; Lĩnh vực 2.2"},{"id":"t1q98","n":98,"topic":1,"type":"mcq","stem":{"en":"Your agent has a log_workout tool that accepts exercise_type (string), value (number), and measurement (string). Production monitoring shows the agent frequently passes mismatched combinations-using measurement: &quot;reps&quot; for cardio exercises like running, or measurement: &quot;miles&quot; for strength exercises like bench press. Your exercises naturally divide into two categories: cardio (measured in time or distance) and strength (measured in reps and sets). 23% of tool calls have invalid combinations. What approach would most effectively reduce these errors?"},"options":[{"k":"A","t":{"en":"Add explicit examples to the tool description showing valid combinations (e.g., &quot;For running: use minutes or miles. For push-ups: use reps&quot;) with constraints for each exercise category."}},{"k":"B","t":{"en":"Implement server-side validation returning descriptive errors for invalid combinations, allowing the agent to retry with corrections."}},{"k":"C","t":{"en":"Add enum constraints on measurement limiting values to &quot;minutes&quot;, &quot;miles&quot;, &quot;reps&quot;, or &quot;sets&quot; to prevent arbitrary measurement strings."}},{"k":"D","t":{"en":"Split into log_cardio_workout (with duration_minutes or distance_miles parameters) and log_strength_workout (with reps and sets parameters)."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Bài tập vốn chia tự nhiên thành hai loại với cách đo khác nhau. <b>Tách tool đa năng thành các tool chuyên biệt</b> — <code>log_cardio_workout</code> (<code>duration_minutes</code>/<code>distance_miles</code>) và <code>log_strength_workout</code> (<code>reps</code>, <code>sets</code>) — làm cho tổ hợp sai <b>không thể biểu diễn được</b> ở cấp giao diện. Đây là ràng buộc cấu trúc, mạnh hơn mọi chỉ dẫn hay validation, và đúng kỹ năng “chia tool đa năng thành tool chuyên biệt với hợp đồng đầu vào rõ ràng”.","elim":["<b>A.</b> Ví dụ trong mô tả tool chỉ là hướng dẫn mềm; mô hình vẫn có thể truyền tổ hợp sai vì schema vẫn cho phép.","<b>B.</b> Validation phía server chỉ bắt lỗi sau khi xảy ra, tốn thêm lượt retry cho 23% lời gọi thay vì ngăn lỗi từ đầu.","<b>C.</b> Enum chỉ giới hạn giá trị hợp lệ của từng trường riêng lẻ; <code>\"reps\"</code> cho chạy bộ vẫn là giá trị enum hợp lệ, nên lỗi tổ hợp không bị ngăn."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q99","n":99,"topic":1,"type":"mcq","stem":{"en":"During initial testing, you notice that Claude doesn&#x27;t seem to remember vocabulary words from earlier in the conversation. When a student asks &quot;Can you quiz me on those words?&quot;, responds as if no words have been discussed. What is the most likely explanation?"},"options":[{"k":"A","t":{"en":"You&#x27;re not including prior messages in each API request—the stateless API doesn&#x27;t retain conversation history."}},{"k":"B","t":{"en":"The model&#x27;s context window has filled up, causing earlier conversation content to be dropped."}},{"k":"C","t":{"en":"Your system prompt needs explicit instructions telling Claude to remember information from earlier turns."}},{"k":"D","t":{"en":"You need to enable conversation persistence by passing a session ID parameter with each API call."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Claude API là <b>stateless</b>: không có bộ nhớ phía server giữa các request. Mỗi lời gọi phải gửi <b>toàn bộ lịch sử hội thoại</b> trong mảng <code>messages</code>; nếu ứng dụng chỉ gửi tin nhắn mới nhất thì Claude không hề biết các từ vựng đã học trước đó. Đây là lỗi điển hình ở giai đoạn thử nghiệm ban đầu.","elim":["<b>B.</b> Trong giai đoạn thử nghiệm ban đầu với một buổi học ngắn, việc lấp đầy context window (hàng trăm nghìn token) gần như không thể xảy ra.","<b>C.</b> System prompt không thể khiến Claude “nhớ” điều không có trong request; mô hình chỉ thấy những gì được gửi trong mỗi lời gọi.","<b>D.</b> Messages API không có tham số session ID để lưu hội thoại; việc duy trì lịch sử là trách nhiệm của ứng dụng."]},"cite":"Hướng dẫn ôn tập — §1.2 Vai trò của Message; Lĩnh vực 5.1"},{"id":"t1q100","n":100,"topic":1,"type":"mcq","stem":{"en":"A new user&#x27;s first message is &quot;Set up my focus music,&quot; This could mean configure preferences, create a playlist, or play music immediately. Your system supports all three actions. What&#x27;s the effective approach?"},"options":[{"k":"A","t":{"en":"Ask one clarifying question about action type: play now or configure for later"}},{"k":"B","t":{"en":"Start preference configuration by asking about genres, temps, and artists they prefer for focus."}},{"k":"C","t":{"en":"Play popular focus tracks Immediately and let the user redirect if needed"}},{"k":"D","t":{"en":"Create a new &quot;Focus&quot; playlist with curated tracks and notify the user it&#x27;s ready."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> “Set up my focus music” có ba cách hiểu dẫn tới <b>các hành động khác hẳn nhau</b>, và đây là <b>người dùng mới</b> nên không có lịch sử để suy ra giả định hợp lý. Khi đó, <b>một câu hỏi làm rõ duy nhất, ngắn gọn</b> về loại hành động (phát ngay hay cấu hình cho sau) là cách hiệu quả: chi phí thấp, tránh làm sai ý định, và đúng nguyên tắc chỉ hỏi những gì thực sự cần để phân nhánh.","elim":["<b>B.</b> Nhảy vào luồng cấu hình sở thích với nhiều câu hỏi (thể loại, tempo, nghệ sĩ) là giả định người dùng muốn cấu hình và gây ma sát lớn nếu họ chỉ muốn nghe ngay.","<b>C.</b> Phát nhạc ngay là đoán một trong ba ý định mà không có căn cứ; với người dùng mới, giả định này có xác suất sai cao.","<b>D.</b> Tự tạo playlist cũng là đoán ý định và tạo ra hiện vật mà người dùng có thể không muốn."]},"cite":"Hướng dẫn ôn tập — Lĩnh vực 5.2 Thiết kế các Mẫu Escalation Hiệu quả và Giải quyết Sự Mơ hồ"},{"id":"t1q101","n":101,"topic":1,"type":"mcq","stem":{"en":"Your conversational assistant frequently generates multiple clarifying questions when users make ambiguous requests. When a user asks &quot;Can you help me with the report?&quot;, the assistant responds: &quot;I&#x27;d be happy to help! Could you tell me: 1) Which report? 2) What kind of help—drafting, reviewing, or formatting? 3) What&#x27;s your deadline?&quot; User analytics show a 40% conversation abandonment rate after these multi-question responses. What&#x27;s the most effective way to reduce friction while appropriately handling ambiguity?"},"options":[{"k":"A","t":{"en":"Limit the assistant to one clarifying question per turn, using conversation history to accumulate answers over multiple exchanges rather than requesting everything upfront."}},{"k":"B","t":{"en":"Add a preprocessing step using a smaller model to classify request ambiguity on a 1-5 scale, routing high-ambiguity requests to a clarification dialog and low-ambiguity requests directly to the assistant."}},{"k":"C","t":{"en":"Modify the system prompt to instruct the assistant to make reasonable assumptions from available context, state those assumptions explicitly, and offer to adjust if the interpretation is wrong."}},{"k":"D","t":{"en":"Create a lookup table of common request patterns with predefined default interpretations, having the assistant respond with those defaults without stating the assumptions made."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Phản hồi nhiều câu hỏi cùng lúc tạo ma sát dẫn tới 40% bỏ cuộc. Hướng dẫn trợ lý <b>đưa ra giả định hợp lý từ context sẵn có</b>, <b>nêu rõ giả định</b> và <b>đề nghị điều chỉnh</b> nếu hiểu sai, giúp người dùng nhận được giá trị ngay mà vẫn giữ quyền kiểm soát. Do giả định được nói ra, sai lệch được phát hiện và sửa nhanh — xử lý
