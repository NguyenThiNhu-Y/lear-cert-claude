pt của nó.","<b>C.</b> Subagent không gọi trực tiếp subagent khác — việc điều phối và spawn thuộc về coordinator.","<b>D.</b> Message queue event-driven là hạ tầng bên ngoài, không phải cách luồng thông tin điển hình giữa các subagent trong mô hình coordinator–subagent."]},"cite":"Hướng dẫn ôn tập — §3.3 Hub-and-Spoke: Coordinator và Subagent; Lĩnh vực 1.2"},{"id":"t1q39","n":39,"topic":1,"type":"mcq","stem":{"en":"After the web search agent and document analysis agent <b class=\"kw\">complete their tasks</b>, the <b class=\"kw\">coordinator invokes the synthesis agent</b>. However, the synthesis agent responds that it cannot complete the task because <b class=\"kw\">no research findings were provided</b>. What is the most likely cause of this issue?","vi":"Sau khi agent tìm kiếm web và agent phân tích tài liệu <b class=\"kw\">hoàn thành tác vụ của chúng</b>, <b class=\"kw\">coordinator gọi agent tổng hợp</b>. Tuy nhiên, agent tổng hợp phản hồi rằng nó không thể hoàn thành tác vụ vì <b class=\"kw\">không có kết quả nghiên cứu nào được cung cấp</b>. Nguyên nhân có khả năng cao nhất của vấn đề này là gì?"},"options":[{"k":"A","t":{"en":"The synthesis agent needs tools that can <b class=\"kw\">fetch results directly</b> from the other agents&#x27; <b class=\"kw\">conversation histories</b>.","vi":"Agent tổng hợp cần các tool có thể <b class=\"kw\">lấy kết quả trực tiếp</b> từ <b class=\"kw\">lịch sử hội thoại</b> của các agent khác."}},{"k":"B","t":{"en":"The subagents need to <b class=\"kw\">share a single API connection</b> to enable <b class=\"kw\">automatic context sharing</b> between invocations.","vi":"Các subagent cần <b class=\"kw\">dùng chung một kết nối API duy nhất</b> để cho phép <b class=\"kw\">tự động chia sẻ context</b> giữa các lần gọi."}},{"k":"C","t":{"en":"The coordinator <b class=\"kw\">did not include the outputs</b> from the previous agents in the <b class=\"kw\">synthesis agent&#x27;s prompt</b>.","vi":"Coordinator <b class=\"kw\">đã không đưa đầu ra</b> của các agent trước đó vào <b class=\"kw\">prompt của agent tổng hợp</b>."}},{"k":"D","t":{"en":"The synthesis agent&#x27;s <b class=\"kw\">context window</b> is <b class=\"kw\">not large enough</b> to hold the combined outputs from both previous agents.","vi":"<b class=\"kw\">Context window</b> của agent tổng hợp <b class=\"kw\">không đủ lớn</b> để chứa đầu ra kết hợp từ cả hai agent trước đó."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Subagent có <b>context cô lập</b>: synthesis agent chỉ thấy đúng những gì coordinator đưa vào prompt khi gọi nó, không tự động thấy kết quả của các agent trước. Câu trả lời “không có findings” cho thấy <b>coordinator đã không chèn output của web search và document analysis</b> vào prompt — context phải được truyền tường minh.","elim":["<b>A.</b> Không có cơ chế để subagent đọc lịch sử hội thoại của agent khác; cách đúng là coordinator truyền dữ liệu qua prompt.","<b>B.</b> Mỗi lời gọi API là stateless; dùng chung kết nối API không chia sẻ context giữa các lần gọi.","<b>D.</b> Context window không đủ sẽ gây lỗi hoặc cắt bớt, không khiến agent báo là không nhận được findings nào — dữ liệu ở đây chưa từng được gửi."]},"cite":"Hướng dẫn ôn tập — §3.4 Tool Task để Sinh ra Subagent; Lĩnh vực 1.3"},{"id":"t1q40","n":40,"topic":1,"type":"mcq","stem":{"en":"In production, final reports frequently contain <b class=\"kw\">claims without proper source attribution</b>. Investigation shows that while the web search and document analysis agents <b class=\"kw\">correctly attach citations to their outputs</b>, the synthesis agent <b class=\"kw\">loses track of which sources support which conclusions</b> when combining findings. What&#x27;s the most effective <b class=\"kw\">architectural change</b>?","vi":"Trên production, các báo cáo cuối cùng thường xuyên chứa các nhận định <b class=\"kw\">không được ghi nguồn đúng cách</b>. Điều tra cho thấy dù agent tìm kiếm web và agent phân tích tài liệu <b class=\"kw\">gắn trích dẫn chính xác vào đầu ra</b> của chúng, agent tổng hợp lại <b class=\"kw\">mất dấu nguồn nào hỗ trợ kết luận nào</b> khi kết hợp các phát hiện. <b class=\"kw\">Thay đổi kiến trúc</b> nào hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"Require all subagents to output <b class=\"kw\">structured claim-source mappings</b> that the synthesis agent must <b class=\"kw\">preserve and merge</b> when combining findings from multiple sources.","vi":"Yêu cầu tất cả subagent xuất ra các <b class=\"kw\">ánh xạ nhận định–nguồn (claim-source mapping) có cấu trúc</b> mà agent tổng hợp phải <b class=\"kw\">giữ nguyên và hợp nhất</b> khi kết hợp các phát hiện từ nhiều nguồn."}},{"k":"B","t":{"en":"Add a verification step where the report generator uses <b class=\"kw\">semantic similarity matching</b> against original sources to <b class=\"kw\">reconstruct which claims</b> came from which documents.","vi":"Thêm một bước xác minh trong đó bộ tạo báo cáo dùng <b class=\"kw\">so khớp tương đồng ngữ nghĩa</b> với các nguồn gốc để <b class=\"kw\">tái dựng xem nhận định nào</b> đến từ tài liệu nào."}},{"k":"C","t":{"en":"Have the coordinator inject <b class=\"kw\">source identifier prefixes</b> into text before each handoff, then <b class=\"kw\">parse these prefixes</b> at report generation to reconstruct citations.","vi":"Để coordinator chèn các <b class=\"kw\">tiền tố định danh nguồn</b> vào văn bản trước mỗi lần handoff, sau đó <b class=\"kw\">phân tích cú pháp (parse) các tiền tố này</b> khi tạo báo cáo để tái dựng trích dẫn."}},{"k":"D","t":{"en":"Maintain <b class=\"kw\">complete transcripts</b> of all subagent interactions and add a <b class=\"kw\">citation-resolution agent</b> to analyze logs and determine attributions before report generation.","vi":"Lưu giữ <b class=\"kw\">bản ghi (transcript) đầy đủ</b> của mọi tương tác với subagent và thêm một <b class=\"kw\">agent xử lý trích dẫn (citation-resolution)</b> để phân tích log và xác định nguồn gốc trước khi tạo báo cáo."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Citation bị mất ở <b>bước tổng hợp</b>, nên phải giữ liên kết claim → nguồn dưới dạng <b>dữ liệu có cấu trúc</b> suốt pipeline: mọi subagent xuất <b>claim-source mapping</b> (claim, nguồn, ngày...) và synthesis agent <b>bắt buộc bảo toàn và hợp nhất</b> các mapping này khi kết hợp phát hiện. Provenance được bảo toàn từ đầu thay vì phải tái dựng sau.","elim":["<b>B.</b> So khớp semantic similarity là đoán lại nguồn sau khi thông tin đã mất; kém chính xác với các claim đã được tổng hợp hoặc diễn đạt lại.","<b>C.</b> Prefix chèn vào văn bản rất mong manh: khi synthesis viết lại câu, prefix dễ bị mất hoặc lệch chỗ, và parse văn bản tự do không đáng tin.","<b>D.</b> Phân tích transcript để suy ra quy kết tốn kém, phức tạp và vẫn là suy đoán sau sự việc thay vì bảo toàn ngay từ đầu."]},"cite":"Hướng dẫn ôn tập — §12.1 Vấn đề Mất Quy kết Nguồn; Lĩnh vực 5.6"},{"id":"t1q41","n":41,"topic":1,"type":"mcq","stem":{"en":"Production monitoring shows that follow-up queries like &quot;summarize what we learned about market trends&quot; <b class=\"kw\">consistently take 40+ seconds</b>. Investigation reveals the coordinator <b class=\"kw\">spawns the synthesis subagent for each summarization request</b>, passing <b class=\"kw\">80K+ tokens</b> of accumulated findings. The coordinator <b class=\"kw\">already has these findings in its context</b> from orchestrating the research. What&#x27;s the most effective way to improve response time for these follow-up summaries?","vi":"Giám sát trên production cho thấy các truy vấn tiếp nối như &quot;tóm tắt những gì chúng ta đã tìm hiểu được về xu hướng thị trường&quot; <b class=\"kw\">luôn mất 40+ giây</b>. Điều tra cho thấy coordinator <b class=\"kw\">khởi tạo subagent tổng hợp cho mỗi yêu cầu tóm tắt</b>, truyền vào <b class=\"kw\">80K+ token</b> các phát hiện đã tích lũy. Coordinator <b class=\"kw\">vốn đã có sẵn những phát hiện này trong context</b> của nó từ quá trình điều phối nghiên cứu. Cách hiệu quả nhất để cải thiện thời gian phản hồi cho các bản tóm tắt tiếp nối này là gì?"},"options":[{"k":"A","t":{"en":"Spawn the synthesis subagent with <b class=\"kw\">reduced context</b> and have it <b class=\"kw\">request specific findings</b> from the coordinator on-demand.","vi":"Khởi tạo subagent tổng hợp với <b class=\"kw\">context được rút gọn</b> và để nó <b class=\"kw\">yêu cầu các phát hiện cụ thể</b> từ coordinator khi cần."}},{"k":"B","t":{"en":"<b class=\"kw\">Pre-generate and cache summaries</b> at multiple granularities whenever new findings accumulate.","vi":"<b class=\"kw\">Tạo sẵn và cache các bản tóm tắt</b> ở nhiều mức độ chi tiết mỗi khi có phát hiện mới được tích lũy."}},{"k":"C","t":{"en":"Have the <b class=\"kw\">coordinator handle</b> straightforward summarization requests directly using its <b class=\"kw\">existing context</b>, reserving subagent spawning for complex analysis.","vi":"Để <b class=\"kw\">coordinator trực tiếp xử lý</b> các yêu cầu tóm tắt đơn giản bằng <b class=\"kw\">context sẵn có</b> của nó, chỉ dành việc khởi tạo subagent cho các phân tích phức tạp."}},{"k":"D","t":{"en":"<b class=\"kw\">Enable prompt caching</b> on the synthesis subagent to reduce the overhead of repeatedly transferring the same research findings.","vi":"<b class=\"kw\">Bật prompt caching</b> cho subagent tổng hợp để giảm chi phí phát sinh của việc truyền lặp đi lặp lại cùng các phát hiện nghiên cứu."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Coordinator <b>đã có sẵn toàn bộ findings trong context</b>; spawn synthesis subagent cho một yêu cầu tóm tắt đơn giản buộc phải truyền lại 80K+ token, gây độ trễ 40+ giây vô ích. Ủy quyền cho subagent có chi phí, chỉ đáng khi lợi ích (cô lập context, chuyên môn hóa) vượt chi phí — nên coordinator <b>tự xử lý tóm tắt đơn giản</b> và chỉ spawn subagent cho phân tích phức tạp.","elim":["<b>A.</b> Subagent hỏi lại coordinator theo nhu cầu tạo nhiều vòng qua lại, có thể còn chậm hơn, và vẫn là spawn không cần thiết.","<b>B.</b> Sinh trước tóm tắt ở nhiều mức tốn chi phí cho những bản có thể không bao giờ dùng, và khó khớp các câu hỏi follow-up cụ thể.","<b>D.</b> Prompt caching giảm phần nào chi phí xử lý tiền tố nhưng vẫn phải spawn subagent và truyền 80K token mỗi lần; không loại bỏ bước thừa."]},"cite":"Hướng dẫn ôn tập — §3.3 Hub-and-Spoke: Coordinator và Subagent; Lĩnh vực 1.2"},{"id":"t1q42","n":42,"topic":1,"type":"mcq","stem":{"en":"After the web search agent finds 25 sources (<b class=\"kw\">120K tokens of raw content</b>), the document analysis agent extracts key insights (15K tokens), and the synthesis agent produces a coherent narrative draft (3K tokens), the coordinator must pass context to the report generation agent for the final output with <b class=\"kw\">proper source citations</b>. What context-passing strategy provides the <b class=\"kw\">best balance of completeness and efficiency</b>?","vi":"Sau khi agent tìm kiếm web tìm được 25 nguồn (<b class=\"kw\">120K token nội dung thô</b>), agent phân tích tài liệu trích xuất các phát hiện chính (15K token), và agent tổng hợp tạo ra một bản nháp tường thuật mạch lạc (3K token), coordinator phải truyền context cho agent tạo báo cáo để tạo ra đầu ra cuối cùng với <b class=\"kw\">trích dẫn nguồn đầy đủ</b>. Chiến lược truyền context nào mang lại sự <b class=\"kw\">cân bằng tốt nhất giữa tính đầy đủ và hiệu quả</b>?"},"options":[{"k":"A","t":{"en":"Pass the <b class=\"kw\">full accumulated context</b> from <b class=\"kw\">all prior agents</b>.","vi":"Truyền <b class=\"kw\">toàn bộ context đã tích lũy</b> từ <b class=\"kw\">tất cả các agent trước đó</b>."}},{"k":"B","t":{"en":"Pass the <b class=\"kw\">synthesis draft</b> along with a <b class=\"kw\">structured source index</b> that maps key claims to their source URLs and relevant excerpts.","vi":"Truyền <b class=\"kw\">bản nháp tổng hợp</b> cùng với một <b class=\"kw\">chỉ mục nguồn có cấu trúc</b>, ánh xạ các nhận định chính tới URL nguồn và các đoạn trích liên quan."}},{"k":"C","t":{"en":"Pass a <b class=\"kw\">condensed summary</b> of all prior stages that preserves the main findings and attributes them to sources <b class=\"kw\">by name only</b>.","vi":"Truyền một <b class=\"kw\">bản tóm tắt cô đọng</b> của tất cả các giai đoạn trước, giữ lại các phát hiện chính và ghi nguồn cho chúng <b class=\"kw\">chỉ bằng tên nguồn</b>."}},{"k":"D","t":{"en":"Pass only the synthesis draft and have a <b class=\"kw\">separate post-processing pipeline</b> match claims to sources and <b class=\"kw\">insert citations</b> after the report is generated.","vi":"Chỉ truyền bản nháp tổng hợp và để một <b class=\"kw\">pipeline hậu xử lý riêng</b> ghép các nhận định với nguồn và <b class=\"kw\">chèn trích dẫn</b> sau khi báo cáo được tạo."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Agent tạo báo cáo cần hai thứ: nội dung đã tổng hợp (bản nháp 3K token) và <b>ánh xạ claim → source</b> để trích dẫn chính xác. Một <b>source index có cấu trúc</b> (claim ↔ URL ↔ đoạn trích liên quan) giữ nguyên provenance mà không phải kéo theo 120K token nội dung thô. Đây là nguyên tắc truyền context có chọn lọc: chỉ đưa đúng dữ liệu cần cho tác vụ kế tiếp, nhưng dưới dạng có cấu trúc để không mất metadata nguồn.","elim":["<b>A.</b> Chuyển toàn bộ context (~138K token) là lãng phí, dễ gây lost-in-the-middle và có thể chạm giới hạn context, trong khi phần lớn nội dung thô không cần cho bước viết báo cáo.","<b>C.</b> Chỉ ghi nguồn bằng tên làm mất URL và đoạn trích cụ thể, nên agent không thể tạo trích dẫn chính xác hay kiểm chứng từng claim.","<b>D.</b> Ghép trích dẫn sau khi đã sinh báo cáo là sửa lỗi hậu kỳ: pipeline phải đoán lại claim nào đến từ nguồn nào, dễ ghép sai vì liên kết claim–nguồn đã không được truyền đi."]},"cite":"Hướng dẫn ôn tập — §12.1 Vấn đề Mất Quy kết Nguồn; Lĩnh vực 5.6"},{"id":"t1q43","n":43,"topic":1,"type":"mcq","stem":{"en":"When analyzing complex legal cases that cite multiple precedents, the document analysis subagent <b class=\"kw\">processes each sequentially</b>. A landmark case citing <b class=\"kw\">12 precedents</b> takes over 3 minutes to analyze completely. What&#x27;s the most effective way to <b class=\"kw\">reduce this latency</b> while <b class=\"kw\">preserving the coordinator&#x27;s ability to monitor and debug</b> the system?","vi":"Khi phân tích các vụ án pháp lý phức tạp có viện dẫn nhiều án lệ, subagent phân tích tài liệu <b class=\"kw\">xử lý từng án lệ một cách tuần tự</b>. Một vụ án mang tính bước ngoặt viện dẫn <b class=\"kw\">12 án lệ</b> mất hơn 3 phút để phân tích hoàn chỉnh. Cách hiệu quả nhất để <b class=\"kw\">giảm độ trễ này</b> mà vẫn <b class=\"kw\">giữ được khả năng giám sát và debug</b> hệ thống của coordinator là gì?"},"options":[{"k":"A","t":{"en":"Implement a <b class=\"kw\">message queue</b> where precedent analysis tasks are <b class=\"kw\">processed asynchronously</b> by a pool of worker agents.","vi":"Triển khai một <b class=\"kw\">hàng đợi tin nhắn (message queue)</b>, trong đó các tác vụ phân tích án lệ được <b class=\"kw\">xử lý bất đồng bộ</b> bởi một pool các worker agent."}},{"k":"B","t":{"en":"Create a <b class=\"kw\">recursive agent hierarchy</b> where analysis agents <b class=\"kw\">subdivide work among child agents</b> until reaching single-precedent granularity.","vi":"Tạo một <b class=\"kw\">hệ phân cấp agent đệ quy</b>, trong đó các agent phân tích <b class=\"kw\">chia nhỏ công việc cho các agent con</b> cho đến khi đạt mức chi tiết từng án lệ đơn lẻ."}},{"k":"C","t":{"en":"Have the coordinator <b class=\"kw\">spawn parallel document analysis subagents</b>, each handling a subset of precedents, then <b class=\"kw\">aggregate results</b> before synthesis.","vi":"Để coordinator <b class=\"kw\">khởi tạo song song nhiều subagent</b> phân tích tài liệu, mỗi subagent xử lý một tập con các án lệ, sau đó <b class=\"kw\">gộp kết quả</b> trước giai đoạn tổng hợp."}},{"k":"D","t":{"en":"Enable the <b class=\"kw\">document analysis subagent</b> to <b class=\"kw\">spawn its own specialized subagents</b> dynamically when it encounters cases with many citations.","vi":"Cho phép <b class=\"kw\">subagent phân tích tài liệu</b> <b class=\"kw\">tự khởi tạo động các subagent chuyên biệt</b> của riêng nó khi gặp các vụ án có nhiều trích dẫn."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> 12 precedent có thể phân tích <b>độc lập</b>, nên cách giảm latency tự nhiên nhất là để coordinator <b>spawn nhiều subagent song song</b> (nhiều lời gọi <code>Task</code> trong cùng một lượt), mỗi subagent xử lý một nhóm precedent, rồi tổng hợp kết quả trước bước synthesis. Vì mọi lần giao việc và kết quả đều đi qua coordinator, kiến trúc hub-and-spoke vẫn giữ được <b>khả năng quan sát và debug tập trung</b>.","elim":["<b>A.</b> Message queue với pool worker bất đồng bộ đưa thêm hạ tầng ngoài luồng điều phối của coordinator, làm giảm khả năng giám sát và debug mà đề bài yêu cầu giữ lại.","<b>B.</b> Hệ phân cấp agent đệ quy nhiều tầng làm phức tạp hóa quá mức và khiến luồng thực thi khó theo dõi từ coordinator.","<b>D.</b> Để subagent tự spawn subagent con làm giao tiếp bỏ qua coordinator, phá vỡ mô hình hub-and-spoke và mất khả năng quan sát tập trung."]},"cite":"Hướng dẫn ôn tập — §3.4 Tool Task để Sinh ra Subagent; Lĩnh vực 1.3"},{"id":"t1q44","n":44,"topic":1,"type":"mcq","stem":{"en":"In production, you&#x27;re distributing complex queries to specialized subagents. The query distribution is <b class=\"kw\">uneven and evolving</b> as <b class=\"kw\">users discover new applications</b>. What&#x27;s the most effective approach to optimize for <b class=\"kw\">query complexity</b>?","vi":"Trong production, bạn đang phân phối các truy vấn phức tạp tới các subagent chuyên biệt. Phân bố truy vấn <b class=\"kw\">không đồng đều và liên tục thay đổi</b> khi người dùng <b class=\"kw\">khám phá các ứng dụng mới</b>. Cách tiếp cận nào hiệu quả nhất để tối ưu theo <b class=\"kw\">độ phức tạp của truy vấn</b>?"},"options":[{"k":"A","t":{"en":"Have the coordinator <b class=\"kw\">analyze each query dynamically</b> and <b class=\"kw\">selectively route subagents</b> based on the query&#x27;s complexity and routing characteristics.","vi":"Để coordinator <b class=\"kw\">phân tích từng truy vấn một cách động</b> và <b class=\"kw\">định tuyến có chọn lọc</b> tới các subagent dựa trên độ phức tạp và đặc điểm định tuyến của truy vấn."}},{"k":"B","t":{"en":"Create a <b class=\"kw\">fast-track path for factual questions</b> that <b class=\"kw\">bypasses subagents entirely</b>, routing only analytical queries through the complete pipeline.","vi":"Tạo một <b class=\"kw\">đường tắt (fast-track)</b> cho các câu hỏi dữ kiện, <b class=\"kw\">bỏ qua hoàn toàn các subagent</b>, chỉ định tuyến các truy vấn phân tích qua toàn bộ pipeline."}},{"k":"C","t":{"en":"Train a <b class=\"kw\">query complexity classifier</b> based on <b class=\"kw\">labeled historical data</b> to predict optimal subagent combination.","vi":"Huấn luyện một <b class=\"kw\">bộ phân loại độ phức tạp truy vấn</b> dựa trên <b class=\"kw\">dữ liệu lịch sử đã gán nhãn</b> để dự đoán tổ hợp subagent tối ưu."}},{"k":"D","t":{"en":"Implement <b class=\"kw\">pattern-based routing</b> that categorizes queries based on factual vs analytical patterns and maps each to a <b class=\"kw\">predefined subagent combination</b>.","vi":"Triển khai <b class=\"kw\">định tuyến dựa trên mẫu (pattern-based routing)</b>, phân loại truy vấn theo mẫu dữ kiện so với phân tích và ánh xạ mỗi loại tới một <b class=\"kw\">tổ hợp subagent được định nghĩa trước</b>."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Khi phân bố truy vấn <b>không đều và liên tục thay đổi</b>, mọi cơ chế định tuyến cố định (fast-track, pattern, classifier) đều sẽ lỗi thời. Cách bền vững là để <b>coordinator phân tích từng truy vấn và chọn động</b> những subagent cần gọi: câu hỏi factual đơn giản chỉ cần ít bước, nghiên cứu so sánh phức tạp mới cần cả pipeline. Đây chính là trách nhiệm của coordinator trong mô hình hub-and-spoke — <b>lựa chọn subagent một cách động</b> dựa trên yêu cầu của truy vấn — và nó tự thích ứng với các kiểu truy vấn mới mà không cần sửa luật hay huấn luyện lại (giống câu t1q64).","elim":["<b>B.</b> Fast-track bỏ qua <i>toàn bộ</i> subagent là luật cứng chia đôi factual/analytical; với phân bố đang thay đổi, nhiều truy vấn sẽ bị xếp sai nhánh — câu “factual” cần xác minh nguồn sẽ thiếu chiều sâu, còn câu phân tích vừa phải vẫn phải đi cả pipeline tốn kém.","<b>C.</b> Classifier cần dữ liệu gán nhãn và phải huấn luyện lại liên tục khi phân bố truy vấn trôi dạt — overengineering, trong khi coordinator đã có sẵn khả năng suy luận về yêu cầu của từng truy vấn.","<b>D.</b> Routing theo pattern với tổ hợp subagent định sẵn rất dễ gãy khi người dùng liên tục tìm ra kiểu truy vấn mới không khớp danh mục nào."]},"cite":"Hướng dẫn ôn tập — §3.3 Hub-and-Spoke: Coordinator và Subagent; §8.2 Phân rã thích ứng động; Lĩnh vực 1.2"},{"id":"t1q45","n":45,"topic":1,"type":"mcq","stem":{"en":"The synthesis agent receives summarized findings from the web search and document analysis agents, then passes a consolidated summary to the report generator. During testing, you discover the generated reports make factual claims <b class=\"kw\">without proper citations</b>–the report generator <b class=\"kw\">cannot attribute statements to their original sources</b> because that <b class=\"kw\">metadata was lost during the summarization steps</b>. What&#x27;s the most effective approach to ensure proper source attribution in the final reports?","vi":"Agent tổng hợp nhận các phát hiện đã được tóm tắt từ agent tìm kiếm web và agent phân tích tài liệu, sau đó truyền một bản tóm tắt hợp nhất cho agent tạo báo cáo. Trong quá trình kiểm thử, bạn phát hiện các báo cáo được tạo ra đưa ra những nhận định về dữ kiện mà <b class=\"kw\">không có trích dẫn phù hợp</b> – agent tạo báo cáo <b class=\"kw\">không thể quy các phát biểu về nguồn gốc ban đầu</b> của chúng vì <b class=\"kw\">metadata đó đã bị mất trong các bước tóm tắt</b>. Cách tiếp cận nào hiệu quả nhất để đảm bảo ghi nguồn đúng trong các báo cáo cuối cùng?"},"options":[{"k":"A","t":{"en":"Have the report generator <b class=\"kw\">query the web search agent</b> to <b class=\"kw\">re-locate sources</b> for claims in the final report.","vi":"Để agent tạo báo cáo <b class=\"kw\">truy vấn agent tìm kiếm web</b> để <b class=\"kw\">xác định lại nguồn</b> cho các nhận định trong báo cáo cuối cùng."}},{"k":"B","t":{"en":"Instruct the synthesis agent to <b class=\"kw\">embed source references inline</b> within its summary text using a <b class=\"kw\">consistent citation format</b>.","vi":"Hướng dẫn agent tổng hợp <b class=\"kw\">nhúng tham chiếu nguồn trực tiếp (inline)</b> trong văn bản tóm tắt của nó bằng một <b class=\"kw\">định dạng trích dẫn thống nhất</b>."}},{"k":"C","t":{"en":"Have each agent output <b class=\"kw\">structured data</b> separating content summaries from <b class=\"kw\">source metadata</b> (URLs, document names, page numbers).","vi":"Để mỗi agent xuất <b class=\"kw\">dữ liệu có cấu trúc</b>, tách riêng phần tóm tắt nội dung khỏi <b class=\"kw\">metadata nguồn</b> (URL, tên tài liệu, số trang)."}},{"k":"D","t":{"en":"<b class=\"kw\">Skip summarization</b> and pass <b class=\"kw\">full raw outputs</b> from web search and document analysis directly to the report generator.","vi":"<b class=\"kw\">Bỏ qua bước tóm tắt</b> và truyền trực tiếp <b class=\"kw\">toàn bộ đầu ra thô</b> từ tìm kiếm web và phân tích tài liệu cho agent tạo báo cáo."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Nguyên nhân gốc là metadata nguồn bị mất khi tóm tắt dưới dạng văn xuôi. Khắc phục tận gốc là yêu cầu <b>mỗi agent xuất dữ liệu có cấu trúc</b>, <b>tách phần nội dung tóm tắt khỏi metadata nguồn</b> (URL, tên tài liệu, số trang) để ánh xạ claim → source đi qua mọi bước của pipeline. Như vậy report generator luôn có đủ thông tin để quy kết từng nhận định.","elim":["<b>A.</b> Bắt report generator truy vấn lại web search để tìm lại nguồn là sửa lỗi sau khi đã mất, tốn thêm vòng lặp và có thể ghép claim với nguồn khác nguồn gốc ban đầu.","<b>B.</b> Nhúng trích dẫn inline vào văn bản chỉ áp dụng ở agent synthesis và vẫn phụ thuộc vào việc các bước tóm tắt trước đó còn giữ metadata; trích dẫn dạng chữ cũng dễ bị cô đọng mất ở bước sau.","<b>D.</b> Bỏ tóm tắt và chuyển toàn bộ đầu ra thô làm bùng nổ token và gây lost-in-the-middle, trong khi vấn đề chỉ là mất metadata."]},"cite":"Hướng dẫn ôn tập — §12.1 Vấn đề Mất Quy kết Nguồn; Lĩnh vực 1.3, 5.6"},{"id":"t1q46","n":46,"topic":1,"type":"mcq","stem":{"en":"When implementing your <b class=\"kw\">lookup_order MCP tool</b>, the backend sometimes returns errors (e.g., &quot;Order not found&quot; or <b class=\"kw\">temporary database failures</b>). What is the correct pattern for <b class=\"kw\">communicating these errors back to the agent</b>?","vi":"Khi triển khai <b class=\"kw\">MCP tool lookup_order</b>, backend đôi khi trả về lỗi (ví dụ: &quot;Order not found&quot; hoặc <b class=\"kw\">lỗi cơ sở dữ liệu tạm thời</b>). Đâu là mẫu (pattern) đúng để <b class=\"kw\">truyền đạt các lỗi này trở lại cho agent</b>?"},"options":[{"k":"A","t":{"en":"Return the error message in the <b class=\"kw\">tool result content</b> with the <b class=\"kw\">isError flag set to true</b>","vi":"Trả về thông báo lỗi trong <b class=\"kw\">nội dung kết quả tool</b> với <b class=\"kw\">cờ isError được đặt là true</b>"}},{"k":"B","t":{"en":"Return a <b class=\"kw\">success response</b> with a <b class=\"kw\">&quot;status&quot; field</b> indicating the error type","vi":"Trả về một <b class=\"kw\">phản hồi thành công</b> với <b class=\"kw\">trường &quot;status&quot;</b> cho biết loại lỗi"}},{"k":"C","t":{"en":"<b class=\"kw\">Log the error server-side</b> and return an <b class=\"kw\">empty result</b> to avoid confusing the model","vi":"<b class=\"kw\">Ghi log lỗi ở phía server</b> và trả về <b class=\"kw\">kết quả rỗng</b> để tránh gây nhầm lẫn cho model"}},{"k":"D","t":{"en":"<b class=\"kw\">Throw an exception</b> from the tool handler so the <b class=\"kw\">agent framework can catch</b> and log it","vi":"<b class=\"kw\">Ném (throw) một exception</b> từ tool handler để <b class=\"kw\">framework agent có thể bắt</b> và ghi log lỗi đó"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Trong MCP, lỗi khi thực thi tool được trả về <b>bên trong tool result</b>: đặt thông điệp lỗi vào <code>content</code> và đặt cờ <code>isError: true</code>. Nhờ vậy mô hình <b>biết lời gọi đã thất bại và đọc được lý do</b> (ví dụ “Order not found” khác với lỗi database tạm thời), từ đó quyết định retry, hỏi lại khách hay escalation.","elim":["<b>B.</b> Trả về phản hồi “success” kèm trường status che giấu thất bại; mô hình có thể coi đó là dữ liệu hợp lệ thay vì một lỗi.","<b>C.</b> Trả về kết quả rỗng là anti-pattern ém lỗi: agent không phân biệt được “không có dữ liệu” với “tra cứu thất bại”.","<b>D.</b> Ném exception khiến lỗi bị xử lý ở tầng framework/giao thức, mô hình không nhận được thông tin lỗi trong ngữ cảnh để tự điều chỉnh."]},"cite":"Hướng dẫn ôn tập — §4.4 Cờ isError trong MCP; Lĩnh vực 2.2"},{"id":"t1q47","n":47,"topic":1,"type":"mcq","stem":{"en":"After investigating a billing dispute over <b class=\"kw\">25+ turns</b>, you&#x27;ve identified that duplicate charges occurred due to a payment gateway timeout triggering retry logic. The required refund ($847) <b class=\"kw\">exceeds your $500 authorization limit</b>. You need to call escalate_to_human, and the human agent <b class=\"kw\">won&#x27;t have access to your conversation transcript</b>. What context should you pass to enable effective resolution?","vi":"Sau khi điều tra một tranh chấp hóa đơn <b class=\"kw\">qua 25+ lượt</b>, bạn đã xác định rằng các khoản phí bị trừ trùng lặp xảy ra do timeout của cổng thanh toán kích hoạt logic retry. Khoản hoàn tiền cần thiết ($847) <b class=\"kw\">vượt quá hạn mức ủy quyền $500</b> của bạn. Bạn cần gọi escalate_to_human, và nhân viên (human agent) sẽ <b class=\"kw\">không có quyền truy cập bản ghi cuộc hội thoại</b> của bạn. Bạn nên truyền context nào để giúp giải quyết vấn đề hiệu quả?"},"options":[{"k":"A","t":{"en":"The customer&#x27;s <b class=\"kw\">original complaint verbatim</b> plus the <b class=\"kw\">tool result excerpts</b> showing duplicate transactions.","vi":"<b class=\"kw\">Nguyên văn khiếu nại ban đầu</b> của khách hàng cùng với <b class=\"kw\">các đoạn trích kết quả tool</b> cho thấy các giao dịch trùng lặp."}},{"k":"B","t":{"en":"The <b class=\"kw\">complete conversation transcript</b> with <b class=\"kw\">all tool results</b>.","vi":"<b class=\"kw\">Toàn bộ bản ghi cuộc hội thoại</b> cùng với <b class=\"kw\">tất cả kết quả tool</b>."}},{"k":"C","t":{"en":"<b class=\"kw\">Your diagnosis</b> and the <b class=\"kw\">refund amount only</b>.","vi":"<b class=\"kw\">Chỉ chẩn đoán của bạn</b> và <b class=\"kw\">số tiền hoàn</b>."}},{"k":"D","t":{"en":"A <b class=\"kw\">structured summary</b>: customer ID, <b class=\"kw\">root cause</b>, refund amount, and recommended action.","vi":"Một <b class=\"kw\">bản tóm tắt có cấu trúc</b>: ID khách hàng, <b class=\"kw\">nguyên nhân gốc</b>, số tiền hoàn và hành động được đề xuất."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Nhân viên tiếp nhận <b>không thấy transcript</b>, nên bản bàn giao phải <b>tự chứa và có cấu trúc</b>: customer ID, root cause (gateway timeout kích hoạt retry gây trùng phí), số tiền hoàn ($847) và hành động đề xuất. Đây đúng là mẫu structured handoff: đủ để hành động ngay mà không phải đọc lại 25+ lượt hội thoại.","elim":["<b>A.</b> Khiếu nại nguyên văn và trích đoạn tool result thiếu chẩn đoán root cause, số tiền cần hoàn và đề xuất, buộc nhân viên tự phân tích lại.","<b>B.</b> Toàn bộ transcript quá dài và nhiễu cho người xử lý; đề bài còn nói rõ nhân viên không có quyền truy cập transcript.","<b>C.</b> Chỉ có chẩn đoán và số tiền thì thiếu customer ID và hành động đề xuất, chưa đủ để nhân viên xác định tài khoản và xử lý."]},"cite":"Hướng dẫn ôn tập — §9.3 Các giao thức bàn giao có cấu trúc (Structured Handoff); Lĩnh vực 1.4"},{"id":"t1q48","n":48,"topic":1,"type":"mcq","stem":{"en":"Your agent has called lookup_order multiple times while investigating a customer&#x27;s <b class=\"kw\">return requests</b>. Each response includes <b class=\"kw\">40+ fields</b> (items, shipping details, payment info, status history). Tool outputs now represent the <b class=\"kw\">majority of the conversation&#x27;s context</b>. The customer mentions <b class=\"kw\">two more orders</b> they want to discuss. What&#x27;s the most effective approach before making additional lookups?","vi":"Agent của bạn đã gọi lookup_order nhiều lần trong khi điều tra các <b class=\"kw\">yêu cầu trả hàng</b> của một khách hàng. Mỗi phản hồi bao gồm <b class=\"kw\">40+ trường</b> (mặt hàng, chi tiết vận chuyển, thông tin thanh toán, lịch sử trạng thái). Đầu ra của tool hiện <b class=\"kw\">chiếm phần lớn context</b> của cuộc hội thoại. Khách hàng đề cập <b class=\"kw\">thêm hai đơn hàng nữa</b> mà họ muốn trao đổi. Cách tiếp cận nào hiệu quả nhất trước khi thực hiện thêm các lần tra cứu?"},"options":[{"k":"A","t":{"en":"Proceed with <b class=\"kw\">additional lookups</b> <b class=\"kw\">without modifying</b> the existing tool output context","vi":"Tiếp tục thực hiện <b class=\"kw\">thêm các lần tra cứu</b> mà <b class=\"kw\">không sửa đổi</b> context đầu ra tool hiện có"}},{"k":"B","t":{"en":"Move all tool responses to a <b class=\"kw\">vector database</b> with <b class=\"kw\">semantic indexing</b>, retrieving relevant portions as the conversation continues","vi":"Chuyển tất cả phản hồi của tool vào một <b class=\"kw\">cơ sở dữ liệu vector</b> có <b class=\"kw\">lập chỉ mục ngữ nghĩa</b>, truy xuất các phần liên quan khi cuộc hội thoại tiếp diễn"}},{"k":"C","t":{"en":"Have the model generate a <b class=\"kw\">natural language summary</b> of each order&#x27;s key details, replacing structured responses with <b class=\"kw\">prose descriptions</b>","vi":"Để model tạo bản <b class=\"kw\">tóm tắt bằng ngôn ngữ tự nhiên</b> về các chi tiết chính của từng đơn hàng, thay thế các phản hồi có cấu trúc bằng <b class=\"kw\">mô tả dạng văn xuôi</b>"}},{"k":"D","t":{"en":"<b class=\"kw\">Extract only return-relevant fields</b> (items, purchase date, return window, status) from each existing order response, <b class=\"kw\">removing verbose details</b>","vi":"<b class=\"kw\">Chỉ trích xuất các trường liên quan đến trả hàng</b> (mặt hàng, ngày mua, thời hạn trả hàng, trạng thái) từ mỗi phản hồi đơn hàng hiện có, <b class=\"kw\">loại bỏ các chi tiết dài dòng</b>"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Đầu ra tool tích lũy trong context <b>không tương xứng với mức liên quan</b>: mỗi đơn 40+ trường nhưng tác vụ đổi trả chỉ cần vài trường. <b>Cắt gọn kết quả tool</b> xuống các trường liên quan (items, ngày mua, return window, status) giải phóng context trước khi tra cứu thêm hai đơn mới, mà vẫn <b>giữ dữ liệu ở dạng có cấu trúc, chính xác</b>.","elim":["<b>A.</b> Tiếp tục tra cứu mà không xử lý sẽ đẩy thêm hai khối 40+ trường vào context vốn đã quá tải, làm tăng nhiễu và nguy cơ chạm giới hạn.","<b>B.</b> Vector database với semantic indexing là overengineering cho một phiên hỗ trợ, và việc truy xuất theo ngữ nghĩa có thể bỏ sót trường cần thiết.","<b>C.</b> Chuyển dữ liệu có cấu trúc thành văn xuôi có nguy cơ làm mất hoặc làm mờ các giá trị chính xác (ngày, số tiền, trạng thái)."]},"cite":"Hướng dẫn ôn tập — §11.2 Cắt gọn Kết quả Tool; Lĩnh vực 5.1"},{"id":"t1q49","n":49,"topic":1,"type":"mcq","stem":{"en":"A customer sends: &quot;This is frustrating. I&#x27;ve <b class=\"kw\">explained my issue twice</b> and nothing is being resolved. <b class=\"kw\">I want to talk to a real person NOW</b>.&quot; The agent <b class=\"kw\">has not yet called any tools</b> to investigate their account. What should the agent do?","vi":"Một khách hàng gửi: &quot;Thật bực mình. Tôi đã <b class=\"kw\">giải thích vấn đề của mình hai lần</b> rồi mà chẳng có gì được giải quyết. <b class=\"kw\">Tôi muốn nói chuyện với người thật NGAY BÂY GIỜ</b>.&quot; Agent vẫn <b class=\"kw\">chưa gọi tool nào</b> để điều tra tài khoản của họ. Agent nên làm gì?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Immediately call escalate_to_human</b> with the <b class=\"kw\">conversation history</b>.","vi":"<b class=\"kw\">Gọi escalate_to_human ngay lập tức</b> kèm theo <b class=\"kw\">lịch sử cuộc hội thoại</b>."}},{"k":"B","t":{"en":"<b class=\"kw\">Briefly explain</b> what the agent can help with and offer to resolve the issue quickly, <b class=\"kw\">escalating only if the customer repeats</b> their request.","vi":"<b class=\"kw\">Giải thích ngắn gọn</b> những gì agent có thể hỗ trợ và đề nghị giải quyết vấn đề nhanh chóng, <b class=\"kw\">chỉ escalate nếu khách hàng lặp lại</b> yêu cầu của họ."}},{"k":"C","t":{"en":"<b class=\"kw\">Acknowledge the frustration</b> and <b class=\"kw\">ask one targeted question</b> to understand the specific issue before escalating.","vi":"<b class=\"kw\">Ghi nhận sự bực bội</b> và <b class=\"kw\">hỏi một câu hỏi có trọng tâm</b> để hiểu vấn đề cụ thể trước khi escalate."}},{"k":"D","t":{"en":"First <b class=\"kw\">call get_customer and lookup_order</b> to gather account context, <b class=\"kw\">then escalate</b> to a human agent.","vi":"Trước tiên <b class=\"kw\">gọi get_customer và lookup_order</b> để thu thập context tài khoản, <b class=\"kw\">sau đó escalate</b> cho nhân viên (human agent)."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Khách hàng đã <b>yêu cầu rõ ràng được gặp người thật</b> (“I want to talk to a real person NOW”) sau khi đã giải thích hai lần. Theo nguyên tắc escalation, <b>yêu cầu tường minh của khách phải được đáp ứng ngay</b>, không cố tự giải quyết, không điều tra hay hỏi thêm trước. Gọi <code>escalate_to_human</code> <b>kèm lịch sử hội thoại</b> giúp nhân viên tiếp nhận có đủ context, nên khách không phải giải thích lần thứ ba.","elim":["<b>B.</b> Giới thiệu khả năng của agent và chỉ escalation khi khách nhắc lại là phớt lờ một yêu cầu đã rõ ràng, khiến khách càng bức xúc.","<b>C.</b> Hỏi thêm “một câu” vẫn là trì hoãn một yêu cầu tường minh; lịch sử hội thoại được chuyển kèm đã chứa nội dung khách giải thích hai lần, nên không cần khách trả lời thêm trước khi chuyển.","<b>D.</b> Tự gọi <code>get_customer</code> và <code>lookup_order</code> trước là điều tra khi khách không yêu cầu, làm chậm việc chuyển cho người thật."]},"cite":"Hướng dẫn ôn tập — §9.1 Khi nào escalation lên cho con người; §9.2 Các mẫu Escalation; Lĩnh vực 5.2"},{"id":"t1q50","n":50,"topic":1,"type":"mcq","stem":{"en":"You&#x27;re implementing the escalation logic for when the agent should call escalate_to_human. Your team proposes four different approaches for triggering escalation. Which approach will <b class=\"kw\">most reliably identify cases</b> that <b class=\"kw\">genuinely require human intervention</b>?","vi":"Bạn đang triển khai logic escalation để xác định khi nào agent nên gọi escalate_to_human. Nhóm của bạn đề xuất bốn cách tiếp cận khác nhau để kích hoạt escalation. Cách tiếp cận nào sẽ xác định một cách <b class=\"kw\">đáng tin cậy nhất các trường hợp</b> <b class=\"kw\">thực sự cần sự can thiệp của con người</b>?"},"options":[{"k":"A","t":{"en":"Instruct the agent to escalate when the <b class=\"kw\">customer requests a human</b>, when the issue requires <b class=\"kw\">policy exceptions</b>, or when the agent cannot make meaningful progress.","vi":"Hướng dẫn agent escalate khi <b class=\"kw\">khách hàng yêu cầu gặp người thật</b>, khi vấn đề cần <b class=\"kw\">ngoại lệ chính sách</b>, hoặc khi agent không thể đạt được tiến triển có ý nghĩa."}},{"k":"B","t":{"en":"Configure the agent to escalate after <b class=\"kw\">three consecutive tool calls</b> that <b class=\"kw\">fail to resolve</b> the customer&#x27;s stated issue, ensuring a reasonable attempt before involving a human.","vi":"Cấu hình agent để escalate sau <b class=\"kw\">ba tool call liên tiếp</b> <b class=\"kw\">không giải quyết được</b> vấn đề mà khách hàng đã nêu, đảm bảo đã có một nỗ lực hợp lý trước khi đưa con người vào."}},{"k":"C","t":{"en":"Build a <b class=\"kw\">rules engine</b> that maps specific issue types, customer segments, and product categories to escalation decisions, <b class=\"kw\">removing the need for model judgment</b> calls.","vi":"Xây dựng một <b class=\"kw\">engine quy tắc (rules engine)</b> ánh xạ các loại vấn đề, phân khúc khách hàng và danh mục sản phẩm cụ thể tới các quyết định escalation, <b class=\"kw\">loại bỏ nhu cầu để model tự phán đoán</b>."}},{"k":"D","t":{"en":"Implement <b class=\"kw\">sentiment analysis</b> that monitors for frustration indicators (negative language, repeated questions, exclamation marks) and trigger escalation when the <b class=\"kw\">frustration score exceeds a configured threshold</b>.","vi":"Triển khai <b class=\"kw\">phân tích cảm xúc (sentiment analysis)</b> theo dõi các dấu hiệu bực bội (ngôn ngữ tiêu cực, câu hỏi lặp lại, dấu chấm than) và kích hoạt escalation khi <b class=\"kw\">điểm bực bội vượt quá một ngưỡng</b> đã cấu hình."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Ba tác nhân escalation đáng tin cậy là: <b>khách yêu cầu rõ ràng gặp người thật</b>, <b>cần ngoại lệ/chính sách không bao quát</b>, và <b>agent không thể tiến triển</b>. Các tiêu chí này bám vào bản chất của ca (thẩm quyền, chính sách, khả năng giải quyết) thay vì tín hiệu bề mặt, và cho phép mô hình phán đoán theo ngữ cảnh.","elim":["<b>B.</b> Ngưỡng cố định “3 lần gọi tool thất bại” là heuristic tùy ý: có ca cần nhiều bước hợp lệ, có ca (như yêu cầu ngoại lệ) nên escalation ngay từ đầu.","<b>C.</b> Rules engine ánh xạ loại vấn đề/phân khúc/sản phẩm cứng nhắc, không bao quát được lỗ hổng chính sách hay tình huống mới, và loại bỏ phán đoán theo ngữ cảnh.","<b>D.</b> Sentiment analysis là thước đo không đáng tin: mức độ bực bội của khách không tương quan với độ phức tạp hay việc có cần con người can thiệp."]},"cite":"Hướng dẫn ôn tập — §9.1 Khi nào escalation lên cho con người; Lĩnh vực 5.2"},{"id":"t1q51","n":51,"topic":1,"type":"mcq","stem":{"en":"Your agent is handling a billing dispute. <b class=\"kw\">After calling get_customer and lookup_order</b>, it identifies that the dispute involves a promotional pricing error <b class=\"kw\">requiring manager approval</b>–<b class=\"kw\">beyond the agent&#x27;s authorization level</b>. How should the workflow handle this <b class=\"kw\">mid-process escalation</b>?","vi":"Agent của bạn đang xử lý một tranh chấp hóa đơn. <b class=\"kw\">Sau khi gọi get_customer và lookup_order</b>, nó xác định rằng tranh chấp liên quan đến lỗi giá khuyến mãi <b class=\"kw\">cần sự phê duyệt của quản lý</b> – <b class=\"kw\">vượt quá cấp ủy quyền của agent</b>. Workflow nên xử lý việc <b class=\"kw\">escalation giữa chừng quy trình</b> này như thế nào?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Attempt the refund with process_refund anyway</b>, <b class=\"kw\">escalating only if the system rejects</b> the transaction.","vi":"<b class=\"kw\">Vẫn thử hoàn tiền bằng process_refund</b>, <b class=\"kw\">chỉ escalate nếu hệ thống từ chối</b> giao dịch."}},{"k":"B","t":{"en":"Compile a <b class=\"kw\">structured handoff</b> with customer details, order info, and the <b class=\"kw\">identified issue</b> before calling escalate_to_human.","vi":"Tổng hợp một <b class=\"kw\">handoff có cấu trúc</b> gồm thông tin chi tiết khách hàng, thông tin đơn hàng và <b class=\"kw\">vấn đề đã xác định</b> trước khi gọi escalate_to_human."}},{"k":"C","t":{"en":"<b class=\"kw\">Call escalate_to_human</b> passing <b class=\"kw\">only the customer&#x27;s original message</b>.","vi":"<b class=\"kw\">Gọi escalate_to_human</b> <b class=\"kw\">chỉ truyền tin nhắn ban đầu của khách hàng</b>."}},{"k":"D","t":{"en":"<b class=\"kw\">Persist the complete conversation</b> and tool response history to a database, then call escalate_to_human with a <b class=\"kw\">reference ID</b>.","vi":"<b class=\"kw\">Lưu trữ toàn bộ lịch sử cuộc hội thoại</b> và phản hồi tool vào cơ sở dữ liệu, sau đó gọi escalate_to_human với một <b class=\"kw\">ID tham chiếu</b>."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Khi escalation giữa quy trình, agent đã thu thập được dữ liệu giá trị qua <code>get_customer</code> và <code>lookup_order</code>. Nó nên <b>tổng hợp một bản bàn giao có cấu trúc</b> (thông tin khách, đơn hàng, vấn đề đã xác định là lỗi giá khuyến mãi cần quản lý duyệt) rồi mới gọi <code>escalate_to_human</code>, để người tiếp nhận <b>hành động ngay mà không phải điều tra lại</b>.","elim":["<b>A.</b> Cố gọi <code>process_refund</code> khi biết rõ vượt thẩm quyền là vi phạm chính sách; không được dựa vào việc hệ thống từ chối để làm rào chắn.","<b>C.</b> Chỉ chuyển tin nhắn gốc bỏ phí toàn bộ kết quả điều tra, buộc nhân viên làm lại từ đầu.","<b>D.</b> Lưu toàn bộ lịch sử và chỉ gửi reference ID buộc nhân viên tự đọc và lọc dữ liệu thô, thay vì nhận ngay một bản tóm tắt sẵn sàng hành động."]},"cite":"Hướng dẫn ôn tập — §9.3 Các giao thức bàn giao có cấu trúc (Structured Handoff); Lĩnh vực 1.4"},{"id":"t1q52","n":52,"topic":1,"type":"mcq","stem":{"en":"During a billing dispute resolution, your agent successfully retrieves customer info via get_customer and order details via lookup_order, but when attempting to process the refund via process_refund, the tool <b class=\"kw\">returns a timeout error</b>. The agent <b class=\"kw\">has enough information to explain the billing</b>, confirm the refund eligibility, and verify refund eligibility, but cannot actually process the refund due to the backend failure. What approach best <b class=\"kw\">balances first-contact resolution</b> with <b class=\"kw\">appropriate error handling</b>?","vi":"Trong quá trình giải quyết một tranh chấp hóa đơn, agent của bạn truy xuất thành công thông tin khách hàng qua get_customer và chi tiết đơn hàng qua lookup_order, nhưng khi cố gắng xử lý hoàn tiền qua process_refund, tool <b class=\"kw\">trả về lỗi timeout</b>. Agent <b class=\"kw\">có đủ thông tin để giải thích hóa đơn</b>, xác nhận tính đủ điều kiện hoàn tiền và xác minh tính đủ điều kiện hoàn tiền, nhưng không thể thực sự xử lý hoàn tiền do lỗi backend. Cách tiếp cận nào cân bằng tốt nhất giữa việc <b class=\"kw\">giải quyết ngay trong lần liên hệ đầu tiên</b> và <b class=\"kw\">xử lý lỗi phù hợp</b>?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Escalate immediately</b> to a human agent since the refund action <b class=\"kw\">cannot be completed</b>","vi":"<b class=\"kw\">Escalate ngay lập tức</b> cho nhân viên (human agent) vì <b class=\"kw\">không thể hoàn tất</b> thao tác hoàn tiền"}},{"k":"B","t":{"en":"Implement <b class=\"kw\">automatic retries with exponential backoff</b> for process_refund, <b class=\"kw\">keeping the conversation open</b> until the refund is successfully processed","vi":"Triển khai <b class=\"kw\">retry tự động với exponential backoff</b> cho process_refund, <b class=\"kw\">giữ cuộc hội thoại mở</b> cho đến khi hoàn tiền được xử lý thành công"}},{"k":"C","t":{"en":"<b class=\"kw\">Confirm the refund will be processed</b> and <b class=\"kw\">close the conversation</b>, since the system has all necessary information to complete it automatically","vi":"<b class=\"kw\">Xác nhận rằng khoản hoàn tiền sẽ được xử lý</b> và <b class=\"kw\">đóng cuộc hội thoại</b>, vì hệ thống đã có mọi thông tin cần thiết để tự động hoàn tất"}},{"k":"D","t":{"en":"Explain the billing, confirm refund eligibility, <b class=\"kw\">acknowledge the system issue</b> preventing immediate processing, and <b class=\"kw\">offer escalation or retry later</b>","vi":"Giải thích hóa đơn, xác nhận tính đủ điều kiện hoàn tiền, <b class=\"kw\">thừa nhận sự cố hệ thống</b> đang ngăn việc xử lý ngay lập tức, và <b class=\"kw\">đề nghị escalate hoặc retry sau</b>"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Agent nên <b>cung cấp mọi giá trị nó có thể</b> (giải thích hóa đơn, xác nhận đủ điều kiện hoàn tiền), đồng thời <b>minh bạch về lỗi hệ thống</b> và đưa ra lựa chọn (escalation hoặc thử lại sau). Cách này tối đa hóa giải quyết ngay lần đầu mà không hứa hẹn điều chưa xảy ra, đúng tinh thần graceful degradation khi gặp lỗi tạm thời.","elim":["<b>A.</b> Escalation ngay bỏ phí phần việc agent đã làm được và chuyển cho con người một ca thực chất chỉ vướng lỗi backend tạm thời.","<b>B.</b> Giữ hội thoại mở để retry vô hạn với backoff khiến khách phải chờ không biết bao lâu; lỗi có thể kéo dài và khách không được thông báo.","<b>C.</b> Xác nhận hoàn tiền “sẽ được xử lý” rồi đóng hội thoại là hứa sai sự thật: lệnh hoàn chưa thành công và không có gì bảo đảm sẽ tự hoàn tất."]},"cite":"Hướng dẫn ôn tập — §10.1 Các nhóm lỗi; Lĩnh vực 5.3"},{"id":"t1q53","n":53,"topic":1,"type":"mcq","stem":{"en":"Production logs reveal inconsistent error responses when lookup_order fails. The agent <b class=\"kw\">sometimes retries</b> (<b class=\"kw\">wasting 3-4 turns</b>) before concluding on the error. Your MCP tool currently returns <b class=\"kw\">only a plain text error message</b> to Claude. What&#x27;s the most effective improvement?","vi":"Log production cho thấy các phản hồi lỗi không nhất quán khi lookup_order thất bại. Agent <b class=\"kw\">đôi khi retry</b> (<b class=\"kw\">lãng phí 3-4 lượt</b>) trước khi đi đến kết luận về lỗi. MCP tool của bạn hiện <b class=\"kw\">chỉ trả về một thông báo lỗi dạng văn bản thuần</b> cho Claude. Cải tiến nào hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"Implement <b class=\"kw\">retry logic with exponential backoff</b> in your MCP server for all errors, <b class=\"kw\">returning only successful results</b> to the agent.","vi":"Triển khai <b class=\"kw\">logic retry với exponential backoff</b> trong MCP server của bạn cho mọi lỗi, <b class=\"kw\">chỉ trả về kết quả thành công</b> cho agent."}},{"k":"B","t":{"en":"Create an <b class=\"kw\">analyze_error MCP tool</b> the agent calls to <b class=\"kw\">determine the error type</b> before deciding how to handle it.","vi":"Tạo một <b class=\"kw\">MCP tool analyze_error</b> mà agent gọi để <b class=\"kw\">xác định loại lỗi</b> trước khi quyết định cách xử lý."}},{"k":"C","t":{"en":"Return <b class=\"kw\">structured error responses</b> with <b class=\"kw\">retryable: false</b> for business errors and a customer-friendly explanation for Claude to use.","vi":"Trả về <b class=\"kw\">phản hồi lỗi có cấu trúc</b> với <b class=\"kw\">retryable: false</b> cho các lỗi nghiệp vụ và một lời giải thích thân thiện với khách hàng để Claude sử dụng."}},{"k":"D","t":{"en":"Add <b class=\"kw\">few-shot examples</b> to the system prompt showing how to distinguish retryable from non-retryable errors by <b class=\"kw\">parsing error message text</b>.","vi":"Thêm <b class=\"kw\">ví dụ few-shot</b> vào system prompt minh họa cách phân biệt lỗi có thể retry và lỗi không thể retry bằng cách <b class=\"kw\">phân tích văn bản thông báo lỗi</b>."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Thông báo lỗi dạng văn bản thuần không cho agent biết lỗi có thử lại được hay không, nên nó retry vô ích. Trả về <b>phản hồi lỗi có cấu trúc</b> với <code>retryable: false</code> cho lỗi nghiệp vụ giúp agent <b>dừng retry ngay</b>, và kèm <b>lời giải thích thân thiện với khách</b> để Claude dùng khi trả lời. Cách này sửa tận gốc ở giao diện tool, mang tính deterministic.","elim":["<b>A.</b> Retry mọi lỗi trong MCP server vẫn retry vô ích các lỗi nghiệp vụ không bao giờ thành công, và giấu hoàn toàn lỗi khỏi agent.","<b>B.</b> Thêm tool <code>analyze_error</code> tạo thêm một vòng gọi cho mỗi lỗi, trong khi thông tin phân loại lẽ ra nên có sẵn ngay trong phản hồi lỗi.","<b>D.</b> Few-shot dạy mô hình đoán loại lỗi từ văn bản là xác suất và dễ gãy khi thông điệp lỗi thay đổi; không đáng tin bằng một cờ có cấu trúc."]},"cite":"Hướng dẫn ôn tập — §4.4 Cờ isError trong MCP; Lĩnh vực 2.2"},{"id":"t1q54","n":54,"topic":1,"type":"mcq","stem":{"en":"When the agent calls lookup_order and <b class=\"kw\">receives order details</b> showing the item was purchased <b class=\"kw\">45 days ago</b>, <b class=\"kw\">how does the agentic loop determine</b> whether to call process_refund or escalate_to_human next?","vi":"Khi agent gọi lookup_order và <b class=\"kw\">nhận được chi tiết đơn hàng</b> cho thấy mặt hàng đã được mua cách đây <b class=\"kw\">45 ngày</b>, <b class=\"kw\">agentic loop xác định</b> bước tiếp theo nên gọi process_refund hay escalate_to_human bằng cách nào?"},"options":[{"k":"A","t":{"en":"The agent executes the <b class=\"kw\">remaining steps</b> in a <b class=\"kw\">tool sequence planned at the start</b> of the request.","vi":"Agent thực thi <b class=\"kw\">các bước còn lại</b> trong một <b class=\"kw\">chuỗi tool đã được lên kế hoạch ngay từ đầu</b> yêu cầu."}},{"k":"B","t":{"en":"The agent follows a <b class=\"kw\">pre-configured decision tree</b> mapping order attributes to <b class=\"kw\">specific tool calls</b>.","vi":"Agent tuân theo một <b class=\"kw\">cây quyết định được cấu hình sẵn</b>, ánh xạ các thuộc tính đơn hàng tới <b class=\"kw\">các tool call cụ thể</b>."}},{"k":"C","t":{"en":"The order details are <b class=\"kw\">added to the conversation</b> and the <b class=\"kw\">model reasons about which action</b> to take.","vi":"Chi tiết đơn hàng <b class=\"kw\">được thêm vào cuộc hội thoại</b> và <b class=\"kw\">model suy luận</b> xem nên thực hiện hành động nào."}},{"k":"D","t":{"en":"The <b class=\"kw\">orchestration layer automatically routes</b> to the next tool based on the order&#x27;s <b class=\"kw\">status field</b>.","vi":"<b class=\"kw\">Lớp điều phối (orchestration layer) tự động định tuyến</b> tới tool tiếp theo dựa trên <b class=\"kw\">trường status</b> của đơn hàng."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Trong agentic loop, sau khi tool chạy xong, <b>kết quả tool được nối vào lịch sử hội thoại</b> và gửi lại cho Claude; <b>mô hình suy luận</b> dựa trên dữ liệu mới (mua 45 ngày trước) để quyết định gọi <code>process_refund</code> hay <code>escalate_to_human</code>. Đây là ra quyết định do mô hình điều khiển, không phải luồng cứng định sẵn.","elim":["<b>A.</b> Agent không lập sẵn một chuỗi tool cố định từ đầu rồi chạy tiếp; mỗi bước được quyết định lại dựa trên kết quả mới nhất.","<b>B.</b> Cây quyết định cấu hình sẵn là thiết kế hard-coded, ngược với mô hình agentic loop nơi Claude chọn tool tiếp theo.","<b>D.</b> Không có lớp orchestration nào tự định tuyến theo trường status; tầng ứng dụng chỉ thực thi tool mà Claude yêu cầu."]},"cite":"Hướng dẫn ôn tập — §3.1 Agentic Loop là gì; Lĩnh vực 1.1"},{"id":"t1q55","n":55,"topic":1,"type":"mcq","stem":{"en":"A customer writes: &quot;I&#x27;ve been going back and forth on this return for days. I just want to speak to <b class=\"kw\">someone who can actually help me</b>.&quot; The agent has confirmed via lookup_order that the <b class=\"kw\">return is straightforward</b>–within policy and <b class=\"kw\">eligible for immediate processing</b>. What should the agent do?","vi":"Một khách hàng viết: &quot;Tôi đã phải qua lại về việc trả hàng này suốt mấy ngày rồi. Tôi chỉ muốn nói chuyện với <b class=\"kw\">ai đó thực sự có thể giúp tôi</b>.&quot; Agent đã xác nhận qua lookup_order rằng <b class=\"kw\">việc trả hàng này đơn giản</b> – nằm trong chính sách và <b class=\"kw\">đủ điều kiện để xử lý ngay</b>. Agent nên làm gì?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Process the refund via process_refund</b> to resolve the underlying issue, then <b class=\"kw\">inform them it&#x27;s complete</b>","vi":"<b class=\"kw\">Xử lý hoàn tiền qua process_refund</b> để giải quyết vấn đề cốt lõi, sau đó <b class=\"kw\">thông báo cho khách hàng rằng việc đã hoàn tất</b>"}},{"k":"B","t":{"en":"<b class=\"kw\">Ask what specifically hasn&#x27;t worked</b> in previous attempts <b class=\"kw\">before deciding</b> whether to escalate or resolve automatically","vi":"<b class=\"kw\">Hỏi cụ thể điều gì chưa hiệu quả</b> trong các lần thử trước, <b class=\"kw\">trước khi quyết định</b> escalate hay tự động giải quyết"}},{"k":"C","t":{"en":"<b class=\"kw\">Acknowledge frustration</b>, inform them this is resolvable now, and <b class=\"kw\">offer to complete it or escalate</b>","vi":"<b class=\"kw\">Ghi nhận sự bực bội</b>, thông báo rằng vấn đề này có thể giải quyết ngay bây giờ, và <b class=\"kw\">đề nghị hoàn tất việc đó hoặc escalate</b>"}},{"k":"D","t":{"en":"<b class=\"kw\">Call escalate_to_human immediately</b> to <b class=\"kw\">honor the customer&#x27;s request</b>","vi":"<b class=\"kw\">Gọi escalate_to_human ngay lập tức</b> để <b class=\"kw\">tôn trọng yêu cầu của khách hàng</b>"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Khách bày tỏ bức xúc và muốn gặp “someone who can actually help”, nhưng agent đã xác nhận ca này <b>đủ điều kiện xử lý ngay</b>. Mẫu đúng là <b>ghi nhận cảm xúc</b>, cho khách biết vấn đề <b>có thể giải quyết ngay bây giờ</b>, và <b>để khách lựa chọn</b> hoàn tất luôn hoặc chuyển người thật, vừa giải quyết nhanh vừa tôn trọng mong muốn của khách.","elim":["<b>A.</b> Tự xử lý hoàn tiền mà không hỏi là phớt lờ yêu cầu gặp người của khách; khách không được lựa chọn.","<b>B.</b> Hỏi lại lý do các lần trước không thành công bắt khách giải thích thêm, trong khi agent đã có đủ thông tin để giải quyết.","<b>D.</b> Escalation ngay bỏ qua cơ hội giải quyết tức thì một ca đơn giản, khiến khách phải chờ thêm dù vấn đề có thể xong ngay."]},"cite":"Hướng dẫn ôn tập — §9.2 Các mẫu Escalation; Lĩnh vực 5.2"},{"id":"t1q56","n":56,"topic":1,"type":"mcq","stem":{"en":"Compliance requires that refunds exceeding $500 must automatically escalate to a human agent–this rule <b class=\"kw\">cannot be left to model discretion</b>. <b class=\"kw\">Despite clear system prompt instructions</b>, production logs show the agent occasionally processes high-value refunds directly (<b class=\"kw\">3% failure rate</b>). How should you achieve <b class=\"kw\">guaranteed compliance</b>?","vi":"Quy định tuân thủ yêu cầu các khoản hoàn tiền vượt quá $500 phải tự động được escalate cho nhân viên (human agent) – quy tắc này <b class=\"kw\">không thể để model tự quyết định</b>. <b class=\"kw\">Dù system prompt có hướng dẫn rõ ràng</b>, log production cho thấy agent thỉnh thoảng vẫn xử lý trực tiếp các khoản hoàn tiền giá trị cao (<b class=\"kw\">tỷ lệ thất bại 3%</b>). Bạn nên làm thế nào để đạt được sự <b class=\"kw\">tuân thủ được đảm bảo</b>?"},"options":[{"k":"A","t":{"en":"Implement a <b class=\"kw\">hook to intercept tool calls</b>; when the refund process amount exceeds $500, <b class=\"kw\">block it</b> and invoke human escalation.","vi":"Triển khai một <b class=\"kw\">hook để chặn bắt các tool call</b>; khi số tiền xử lý hoàn tiền vượt quá $500, <b class=\"kw\">chặn lệnh gọi đó</b> và kích hoạt escalation cho con người."}},{"k":"B","t":{"en":"<b class=\"kw\">Strengthen the system prompt</b> with <b class=\"kw\">emphatic language</b>: &quot;CRITICAL POLICY: Refunds over $500 MUST trigger human escalation. NEVER process these directly.&quot;","vi":"<b class=\"kw\">Củng cố system prompt</b> bằng <b class=\"kw\">ngôn ngữ nhấn mạnh</b>: &quot;CHÍNH SÁCH QUAN TRỌNG: Hoàn tiền trên $500 BẮT BUỘC phải kích hoạt escalation cho con người. KHÔNG BAO GIỜ xử lý trực tiếp các khoản này.&quot;"}},{"k":"C","t":{"en":"<b class=\"kw\">Modify the refund tool</b> to <b class=\"kw\">return an error</b> with message &quot;Amount exceeds policy limit–please escalate&quot; when threshold is exceeded.","vi":"<b class=\"kw\">Sửa đổi tool hoàn tiền</b> để <b class=\"kw\">trả về lỗi</b> với thông báo &quot;Amount exceeds policy limit–please escalate&quot; khi vượt ngưỡng."}},{"k":"D","t":{"en":"Add <b class=\"kw\">few-shot examples</b> to the prompt showing <b class=\"kw\">correct escalation behavior</b> at various refund amounts ($400, $500, $600).","vi":"Thêm <b class=\"kw\">ví dụ few-shot</b> vào prompt minh họa <b class=\"kw\">hành vi escalation đúng</b> ở các mức hoàn tiền khác nhau ($400, $500, $600)."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Quy tắc tuân thủ bắt buộc không thể dựa vào prompt, vì prompt chỉ cho <b>mức tuân thủ xác suất</b> (ở đây 3% thất bại). Một <b>hook chặn lời gọi tool</b> kiểm tra số tiền trước khi <code>process_refund</code> chạy; nếu &gt; $500 thì chặn và chuyển sang escalation. Đây là <b>đảm bảo deterministic</b> nằm trong code, không phụ thuộc vào việc mô hình nhớ làm theo.","elim":["<b>B.</b> Viết prompt mạnh hơn (CRITICAL, NEVER) vẫn chỉ là hướng dẫn xác suất; không thể đưa tỷ lệ vi phạm về 0 như yêu cầu tuân thủ.","<b>C.</b> Để tool trả lỗi thì việc escalation vẫn phụ thuộc vào mô hình đọc lỗi và tự gọi escalation; không tự động chuyển cho người như quy định đòi hỏi.","<b>D.</b> Few-shot cải thiện hành vi nhưng vẫn mang tính xác suất, không bảo đảm 100% tuân thủ."]},"cite":"Hướng dẫn ôn tập — §3.5 Hooks trong Agent SDK; Lĩnh vực 1.5"},{"id":"t1q57","n":57,"topic":1,"type":"mcq","stem":{"en":"A customer raises <b class=\"kw\">three separate issues</b> during one session: a refund inquiry <b class=\"kw\">(turns 1-15)</b>, a subscription question (turns 16-30), and a payment method update (turns 31-45). <b class=\"kw\">At turn 48</b>, the customer asks &quot;What happened with my refund?&quot; The conversation is <b class=\"kw\">approaching context limits</b>. What strategy best maintains the agent&#x27;s ability to address all issues throughout the session?","vi":"Một khách hàng nêu <b class=\"kw\">ba vấn đề riêng biệt</b> trong một session: một câu hỏi về hoàn tiền <b class=\"kw\">(lượt 1-15)</b>, một câu hỏi về gói đăng ký (lượt 16-30) và một yêu cầu cập nhật phương thức thanh toán (lượt 31-45). <b class=\"kw\">Ở lượt 48</b>, khách hàng hỏi &quot;Khoản hoàn tiền của tôi sao rồi?&quot; Cuộc hội thoại đang <b class=\"kw\">tiến gần giới hạn context</b>. Chiến lược nào duy trì tốt nhất khả năng của agent trong việc xử lý tất cả các vấn đề trong suốt session?"},"options":[{"k":"A","t":{"en":"Extract and persist <b class=\"kw\">structured issue data</b> (order IDs, amounts, statuses) into a <b class=\"kw\">separate context layer</b>.","vi":"Trích xuất và lưu trữ <b class=\"kw\">dữ liệu vấn đề có cấu trúc</b> (ID đơn hàng, số tiền, trạng thái) vào một <b class=\"kw\">lớp context riêng</b>."}},{"k":"B","t":{"en":"Rely on <b class=\"kw\">MCP tools to re-fetch</b> relevant information <b class=\"kw\">on demand</b> when the customer references earlier issues.","vi":"Dựa vào <b class=\"kw\">các MCP tool để truy xuất lại</b> thông tin liên quan <b class=\"kw\">theo nhu cầu</b> khi khách hàng nhắc đến các vấn đề trước đó."}},{"k":"C","t":{"en":"Implement <b class=\"kw\">sliding window context</b> that retains the <b class=\"kw\">most recent 30 turns</b>.","vi":"Triển khai context dạng <b class=\"kw\">cửa sổ trượt (sliding window)</b> giữ lại <b class=\"kw\">30 lượt gần nhất</b>."}},{"k":"D","t":{"en":"<b class=\"kw\">Summarize earlier turns</b> into a <b class=\"kw\">narrative description</b>, preserving full message history only for the active issue.","vi":"<b class=\"kw\">Tóm tắt các lượt trước đó</b> thành một <b class=\"kw\">mô tả dạng tường thuật</b>, chỉ giữ toàn bộ lịch sử tin nhắn cho vấn đề đang xử lý."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Khi hội thoại dài nhiều vấn đề tiến gần giới hạn context, rủi ro lớn nhất là <b>mất các giá trị chính xác</b> (mã đơn, số tiền, trạng thái) của những vấn đề cũ. Giải pháp là <b>trích xuất dữ kiện giao dịch thành dữ liệu có cấu trúc</b> và lưu trong một <b>lớp context riêng (khối “case facts”)</b> luôn được đưa vào mỗi request, nằm ngoài phần lịch sử có thể bị tóm tắt hay cắt bỏ. Nhờ đó khi khách hỏi lại về refund ở lượt 48, agent vẫn có đúng mã đơn, số tiền và trạng thái của refund.","elim":["<b>B.</b> Dựa vào MCP tool để tra lại không khôi phục được những gì đã trao đổi trong hội thoại (cam kết, lựa chọn của khách), và agent còn phải nhớ mã đơn nào để tra — chính thông tin có thể đã mất.","<b>C.</b> Sliding window 30 lượt sẽ cắt mất toàn bộ phần refund (lượt 1–15), đúng phần khách đang hỏi ở lượt 48.","<b>D.</b> Tóm tắt dạng tường thuật làm <b>mất chi tiết chính xác</b>: số tiền, mã đơn, ngày tháng bị nén thành câu mơ hồ kiểu “khách đã hỏi về một khoản hoàn tiền” — không đủ để trả lời chính xác câu hỏi về refund."]},"cite":"Hướng dẫn ôn tập — §11.1 Trích xuất các Sự kiện ra một Block Riêng; Lĩnh vực 5.1"},{"id":"t1q58","n":58,"topic":1,"type":"mcq","stem":{"en":"The agent verifies customer identity through a <b class=\"kw\">multi-step process</b> before resetting passwords. During testing, you notice that after the customer answers the third verification question, the agent <b class=\"kw\">asks them to provide their name again</b>, <b class=\"kw\">as if the earlier exchange never happened</b>. What&#x27;s the most likely cause of this behavior?","vi":"Agent xác minh danh tính khách hàng qua một <b class=\"kw\">quy trình nhiều bước</b> trước khi đặt lại mật khẩu. Trong quá trình kiểm thử, bạn nhận thấy sau khi khách hàng trả lời câu hỏi xác minh thứ ba, agent lại <b class=\"kw\">yêu cầu họ cung cấp tên một lần nữa</b>, <b class=\"kw\">như thể cuộc trao đổi trước đó chưa từng diễn ra</b>. Nguyên nhân có khả năng nhất của hành vi này là gì?"},"options":[{"k":"A","t":{"en":"The prompt <b class=\"kw\">lacks instructions</b> telling Claude to <b class=\"kw\">remember information</b> across multiple exchanges.","vi":"Prompt <b class=\"kw\">thiếu hướng dẫn</b> yêu cầu Claude <b class=\"kw\">ghi nhớ thông tin</b> qua nhiều lần trao đổi."}},{"k":"B","t":{"en":"The <b class=\"kw\">verification tool is clearing</b> the agent&#x27;s <b class=\"kw\">internal state</b> after each successful validation step.","vi":"<b class=\"kw\">Tool xác minh đang xóa</b> <b class=\"kw\">trạng thái nội bộ</b> của agent sau mỗi bước kiểm tra hợp lệ thành công."}},{"k":"C","t":{"en":"Claude&#x27;s <b class=\"kw\">memory retention</b> is <b class=\"kw\">limited to two conversational turns</b> by default, requiring explicit configuration to extend it.","vi":"<b class=\"kw\">Khả năng ghi nhớ</b> của Claude mặc định <b class=\"kw\">bị giới hạn ở hai lượt hội thoại</b>, cần cấu hình rõ ràng để mở rộng."}},{"k":"D","t":{"en":"The <b class=\"kw\">conversation history isn&#x27;t being passed</b> in <b class=\"kw\">subsequent API requests</b>.","vi":"<b class=\"kw\">Lịch sử cuộc hội thoại không được truyền</b> trong các <b class=\"kw\">request API tiếp theo</b>."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Claude API là <b>stateless</b>: mô hình không nhớ gì giữa các request. Ứng dụng phải <b>gửi lại toàn bộ lịch sử hội thoại</b> trong mảng <code>messages</code> ở mỗi lần gọi. Việc agent hỏi lại tên “như thể chưa từng trao đổi” là dấu hiệu điển hình cho thấy các lượt trước không được đưa vào request tiếp theo.","elim":["<b>A.</b> Không có chỉ dẫn prompt nào giúp Claude “nhớ”; nếu các lượt trước không có trong request thì không prompt nào bù được.","<b>B.</b> Tool xác minh không có quyền xóa “trạng thái nội bộ” của agent; context của mô hình chính là những gì ứng dụng gửi lên.","<b>C.</b> Không tồn tại giới hạn mặc định hai lượt; Claude xử lý bất kỳ lịch sử nào nằm trong context window được gửi lên."]},"cite":"Hướng dẫn ôn tập — §1.2 Vai trò của Message; Lĩnh vực 5.1"},{"id":"t1q59","n":59,"topic":1,"type":"mcq","stem":{"en":"Your process_refund tool returns two types of errors: technical errors (&quot;503 Service Unavailable&quot;, &quot;Connection timeout&quot;) that are transient (5% of calls), and business errors (&quot;Order exceeds 30-day return window&quot;, &quot;Item already refunded&quot;) <b class=\"kw\">that are permanent</b> (12% of calls). Monitoring shows the agent wastes 3-4 turns <b class=\"kw\">retrying business errors that can never succeed</b>. Currently, both error types return <b class=\"kw\">only a plain text message</b> to Claude. What&#x27;s the most effective way to reduce wasted retries while improving <b class=\"kw\">customer-facing response quality</b>?","vi":"Tool process_refund của bạn trả về hai loại lỗi: lỗi kỹ thuật (&quot;503 Service Unavailable&quot;, &quot;Connection timeout&quot;) mang tính tạm thời (5% số lần gọi), và lỗi nghiệp vụ (&quot;Order exceeds 30-day return window&quot;, &quot;Item already refunded&quot;) <b class=\"kw\">mang tính vĩnh viễn</b> (12% số lần gọi). Theo dõi cho thấy agent lãng phí 3-4 lượt để <b class=\"kw\">retry các lỗi nghiệp vụ vốn không bao giờ có thể thành công</b>. Hiện tại, cả hai loại lỗi <b class=\"kw\">chỉ trả về một thông báo dạng văn bản thuần</b> cho Claude. Cách nào hiệu quả nhất để giảm các lần retry lãng phí đồng thời cải thiện <b class=\"kw\">chất lượng phản hồi tới khách hàng</b>?"},"options":[{"k":"A","t":{"en":"Add <b class=\"kw\">few-shot examples</b> showing how to distinguish retryable from non-retryable errors by <b class=\"kw\">parsing error message text</b>.","vi":"Thêm <b class=\"kw\">ví dụ few-shot</b> minh họa cách phân biệt lỗi có thể retry và lỗi không thể retry bằng cách <b class=\"kw\">phân tích văn bản thông báo lỗi</b>."}},{"k":"B","t":{"en":"Return <b class=\"kw\">structured error responses</b> with <b class=\"kw\">retryable: false</b> for business errors and a customer-friendly explanation for Claude to use.","vi":"Trả về <b class=\"kw\">phản hồi lỗi có cấu trúc</b> với <b class=\"kw\">retryable: false</b> cho các lỗi nghiệp vụ và một lời giải thích thân thiện với khách hàng để Claude sử dụng."}},{"k":"C","t":{"en":"Implement <b class=\"kw\">automatic retry logic</b> at the tool level for <b class=\"kw\">technical errors only</b>, passing business errors to Claude without retries.","vi":"Triển khai <b class=\"kw\">logic retry tự động</b> ở cấp tool <b class=\"kw\">chỉ cho lỗi kỹ thuật</b>, chuyển lỗi nghiệp vụ cho Claude mà không retry."}},{"k":"D","t":{"en":"Add a <b class=\"kw\">check_refund_eligibility tool</b> that must be <b class=\"kw\">called before process_refund</b> to prevent business rule violations.","vi":"Thêm một <b class=\"kw\">tool check_refund_eligibility</b> bắt buộc phải được <b class=\"kw\">gọi trước process_refund</b> để ngăn vi phạm quy tắc nghiệp vụ."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Cả hai loại lỗi đều trả văn bản thuần nên Claude không phân biệt được lỗi tạm thời và lỗi nghiệp vụ. Trả về <b>lỗi có cấu trúc</b> với <code>retryable: false</code> cho lỗi nghiệp vụ giúp agent <b>dừng retry ngay</b> (giảm 3–4 lượt lãng phí), còn <b>lời giải thích thân thiện với khách</b> cho Claude nội dung để báo cho khách lý do (quá 30 ngày, đã hoàn tiền). Một thay đổi giải quyết cả hai mục tiêu của đề.","elim":["<b>A.</b> Few-shot dạy phân tích văn bản lỗi là phương pháp xác suất, dễ gãy khi thông điệp thay đổi, và không cải thiện nội dung giải thích cho khách.","<b>C.</b> Tự retry lỗi kỹ thuật ở tầng tool là hữu ích, nhưng lỗi nghiệp vụ vẫn đến Claude dưới dạng văn bản thuần không có cờ retryable hay lời giải thích cho khách, nên chưa giải quyết được mục tiêu chất lượng phản hồi.","<b>D.</b> Thêm tool kiểm tra điều kiện trước tạo thêm một lời gọi cho mọi giao dịch và vẫn dựa vào việc mô hình nhớ gọi nó; không xử lý được cách báo lỗi."]},"cite":"Hướng dẫn ôn tập — §10.1 Các nhóm lỗi; Lĩnh vực 2.2"},{"id":"t1q60","n":60,"topic":1,"type":"mcq","stem":{"en":"A customer <b class=\"kw\">returns 4 hours after</b> their initial session about the same billing dispute. The previous 32-turn session contains context: lookup_status_result messages containing &quot;<b class=\"kw\">Status: Pending Refund</b>&quot; and <b class=\"kw\">significant tokens from prior lookup results</b>. The agent needs to be prepared to answer the customer fully. What approach most reliably handles returning customers?","vi":"Một khách hàng <b class=\"kw\">quay lại sau 4 giờ</b> kể từ session ban đầu về cùng một tranh chấp hóa đơn. Session trước gồm 32 lượt chứa context: các tin nhắn lookup_status_result có nội dung &quot;<b class=\"kw\">Status: Pending Refund</b>&quot; và một <b class=\"kw\">lượng token đáng kể từ các kết quả tra cứu trước đó</b>. Agent cần sẵn sàng để trả lời khách hàng một cách đầy đủ. Cách tiếp cận nào xử lý khách hàng quay lại một cách đáng tin cậy nhất?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Start a new session</b>, inject a <b class=\"kw\">structured summary</b> of the previous interaction (issue type, resolution steps, current status), then make fresh tool calls as needed.","vi":"<b class=\"kw\">Bắt đầu một session mới</b>, đưa vào (inject) một <b class=\"kw\">bản tóm tắt có cấu trúc</b> về tương tác trước đó (loại vấn đề, các bước giải quyết, trạng thái hiện tại), sau đó thực hiện các tool call mới khi cần."}},{"k":"B","t":{"en":"<b class=\"kw\">Resume with the full conversation</b> and add a <b class=\"kw\">system prompt instruction</b> that instructs the agent to prioritize resolving the pending refund.","vi":"<b class=\"kw\">Tiếp tục (resume) với toàn bộ cuộc hội thoại</b> và thêm một <b class=\"kw\">hướng dẫn trong system prompt</b> yêu cầu agent ưu tiên giải quyết khoản hoàn tiền đang chờ."}},{"k":"C","t":{"en":"<b class=\"kw\">Resume with state</b> and configure the agent to <b class=\"kw\">automatically re-call all previous</b> tool_results messages to ensure data freshness.","vi":"<b class=\"kw\">Tiếp tục (resume) với trạng thái cũ</b> và cấu hình agent <b class=\"kw\">tự động gọi lại tất cả</b> các tin nhắn tool_results trước đó để đảm bảo dữ liệu mới nhất."}},{"k":"D","t":{"en":"<b class=\"kw\">Resume the previous session</b> with the full history and <b class=\"kw\">ask the customer to restate</b> the dispute before deciding whether fresh lookups are necessary.","vi":"<b class=\"kw\">Tiếp tục session trước</b> với toàn bộ lịch sử và <b class=\"kw\">yêu cầu khách hàng trình bày lại</b> tranh chấp trước khi quyết định có cần tra cứu mới hay không."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Sau 4 giờ, các tool result cũ (“Pending Refund”) có thể đã <b>lỗi thời</b>, và 32 lượt cũ chiếm nhiều token. <b>Bắt đầu session mới</b> với <b>bản tóm tắt có cấu trúc</b> (loại vấn đề, các bước đã làm, trạng thái hiện tại), rồi gọi tool mới khi cần, giúp agent nắm mạch mà vẫn dùng dữ liệu cập nhật. Guide nêu rõ: session mới với tóm tắt có cấu trúc đáng tin cậy hơn resume với kết quả cũ.","elim":["<b>B.</b> Resume toàn bộ lịch sử vẫn giữ các trạng thái đã lỗi thời và tốn token; thêm chỉ dẫn ưu tiên refund không làm dữ liệu mới hơn.","<b>C.</b> Tự động gọi lại mọi tool cũ là lãng phí (nhiều lời gọi không cần) và vẫn mang theo khối lịch sử cồng kềnh.","<b>D.</b> Bắt khách kể lại tranh chấp là trải nghiệm tồi, trong khi hệ thống đã có đủ thông tin để tóm tắt."]},"cite":"Hướng dẫn ôn tập — §5.10 fork_session và Quản lý Session; Lĩnh vực 1.7"},{"id":"t1q61","n":61,"topic":1,"type":"mcq","stem":{"en":"Your extraction pipeline processes invoices and extracts line items, subtotals, tax amounts, and grand totals. During evaluation, you discover that in 18% of extractions, the sum of extracted line item amounts <b class=\"kw\">doesn&#x27;t match the extracted grand total</b>—sometimes due to <b class=\"kw\">OCR errors in the source document</b>, sometimes due to <b class=\"kw\">extraction mistakes by the model</b>. Downstream accounting systems <b class=\"kw\">reject records with mismatched totals</b>. What&#x27;s the most effective approach to improve extraction reliability?","vi":"Pipeline trích xuất của bạn xử lý hóa đơn và trích xuất các dòng mục (line item), tổng phụ, tiền thuế và tổng cộng. Trong quá trình đánh giá, bạn phát hiện ở 18% số lần trích xuất, tổng số tiền của các dòng mục được trích xuất <b class=\"kw\">không khớp với tổng cộng được trích xuất</b> — đôi khi do <b class=\"kw\">lỗi OCR trong tài liệu nguồn</b>, đôi khi do <b class=\"kw\">model trích xuất sai</b>. Các hệ thống kế toán downstream <b class=\"kw\">từ chối các bản ghi có tổng không khớp</b>. Cách tiếp cận nào hiệu quả nhất để cải thiện độ tin cậy của việc trích xuất?"},"options":[{"k":"A","t":{"en":"Add <b class=\"kw\">few-shot examples</b> demonstrating invoices where extracted line items <b class=\"kw\">sum correctly to the stated total</b>, encouraging the model to produce mathematically consistent extractions.","vi":"Thêm <b class=\"kw\">ví dụ few-shot</b> minh họa các hóa đơn mà các dòng mục được trích xuất <b class=\"kw\">cộng lại đúng bằng tổng</b> được ghi trên hóa đơn, khuyến khích model tạo ra các kết quả trích xuất nhất quán về mặt toán học."}},{"k":"B","t":{"en":"Implement <b class=\"kw\">post-processing</b> that automatically <b class=\"kw\">adjusts line item amounts proportionally</b> when their sum doesn&#x27;t match the stated total.","vi":"Triển khai <b class=\"kw\">hậu xử lý</b> tự động <b class=\"kw\">điều chỉnh số tiền của các dòng mục theo tỷ lệ</b> khi tổng của chúng không khớp với tổng được ghi trên hóa đơn."}},{"k":"C","t":{"en":"<b class=\"kw\">Extract line items and totals independently</b>, then use a <b class=\"kw\">separate validation model</b> to reconcile discrepancies by determining which extracted values are most likely correct.","vi":"<b class=\"kw\">Trích xuất các dòng mục và tổng một cách độc lập</b>, sau đó dùng một <b class=\"kw\">model kiểm tra hợp lệ (validation) riêng</b> để đối chiếu các chênh lệch bằng cách xác định giá trị trích xuất nào có khả năng đúng nhất."}},{"k":"D","t":{"en":"Add a <b class=\"kw\">&quot;calculated_total&quot; field</b> where the model sums extracted line items alongside a &quot;stated_total&quot; field. <b class=\"kw\">Flag records for human review</b> when values differ.","vi":"Thêm một <b class=\"kw\">trường &quot;calculated_total&quot;</b> trong đó model cộng các dòng mục đã trích xuất, đặt cạnh một trường &quot;stated_total&quot;. <b class=\"kw\">Gắn cờ các bản ghi</b> để chuyển sang review của con người khi các giá trị khác nhau."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Lỗi đến từ hai nguồn (OCR sai trong tài liệu gốc và mô hình trích sai), nên không thể tự “sửa” một cách an toàn. Mẫu <b>self-correction</b>: trích xuất cả <code>calculated_total</code> (tổng các dòng) lẫn <code>stated_total</code> (giá trị in trên hóa đơn) để <b>biến sai lệch thành tín hiệu tường minh</b>, rồi chuyển các bản ghi lệch cho con người review thay vì gửi dữ liệu sai xuống hệ thống kế toán.","elim":["<b>A.</b> Few-shot các hóa đơn khớp tổng có thể khiến mô hình “ép” các con số cho khớp, che giấu lỗi OCR thay vì phát hiện nó.","<b>B.</b> Điều chỉnh tỷ lệ các dòng hàng là bịa dữ liệu: các con số sau điều chỉnh không còn phản ánh tài liệu gốc.","<b>C.</b> Một model thứ hai “đoán” giá trị nào đúng vẫn chỉ là phỏng đoán khi chính tài liệu nguồn có lỗi OCR, và thêm độ phức tạp."]},"cite":"Hướng dẫn ôn tập — §6.6 Tự sửa lỗi (Self-correction); Lĩnh vực 4.4"},{"id":"t1q62","n":62,"topic":1,"type":"mcq","stem":{"en":"An engineer asks your agent to identify untested code paths in a legacy payment processing module <b class=\"kw\">spanning 45 files</b>. <b class=\"kw\">After reading the first 8 source files</b>, the agent&#x27;s responses are becoming noticeably less accurate — it&#x27;s <b class=\"kw\">forgetting previously discussed code patterns</b> and hasn&#x27;t yet located all test files or traced critical payment flows. What&#x27;s the most effective approach to complete this investigation?","vi":"Một kỹ sư yêu cầu agent của bạn xác định các code path chưa được kiểm thử trong một module xử lý thanh toán cũ (legacy) <b class=\"kw\">trải rộng trên 45 file</b>. <b class=\"kw\">Sau khi đọc 8 file mã nguồn đầu tiên</b>, các phản hồi của agent đang trở nên kém chính xác rõ rệt — nó <b class=\"kw\">quên các mẫu code đã thảo luận trước đó</b> và vẫn chưa tìm được tất cả file test hay lần theo các luồng thanh toán quan trọng. Cách tiếp cận nào hiệu quả nhất để hoàn thành cuộc điều tra này?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Clear context with /clear</b>, then selectively re-read only the most critical files discovered so far, writing key findings to a <b class=\"kw\">scratchpad file</b> that persists between context resets.","vi":"<b class=\"kw\">Xóa context bằng /clear</b>, sau đó chọn lọc đọc lại chỉ những file quan trọng nhất đã phát hiện cho đến nay, ghi các phát hiện chính vào một <b class=\"kw\">file scratchpad</b> được giữ lại giữa các lần reset context."}},{"k":"B","t":{"en":"<b class=\"kw\">Spawn subagents</b> to investigate specific questions (e.g., &quot;find all test files for payment processing&quot;, &quot;trace refund flow dependencies&quot;) while the <b class=\"kw\">main agent coordinates findings</b> and preserves high-level understanding.","vi":"<b class=\"kw\">Khởi tạo các subagent</b> để điều tra những câu hỏi cụ thể (ví dụ: &quot;tìm tất cả file test cho xử lý thanh toán&quot;, &quot;lần theo các phụ thuộc của luồng hoàn tiền&quot;) trong khi <b class=\"kw\">agent chính điều phối các phát hiện</b> và duy trì hiểu biết tổng quan."}},{"k":"C","t":{"en":"Document all current findings in a <b class=\"kw\">summary report</b>, <b class=\"kw\">clear context completely</b>, then use that report as the sole reference for continuing the investigation.","vi":"Ghi lại tất cả phát hiện hiện tại vào một <b class=\"kw\">báo cáo tóm tắt</b>, <b class=\"kw\">xóa hoàn toàn context</b>, sau đó dùng báo cáo đó làm tài liệu tham chiếu duy nhất để tiếp tục cuộc điều tra."}},{"k":"D","t":{"en":"<b class=\"kw\">Switch to using Grep</b> to search for specific function names <b class=\"kw\">instead of reading full files</b>, reducing the content loaded into context for remaining exploration.","vi":"<b class=\"kw\">Chu
