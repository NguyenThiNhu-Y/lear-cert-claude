 sự mơ hồ một cách minh bạch thay vì chặn người dùng bằng câu hỏi.","elim":["<b>A.</b> Một câu hỏi mỗi lượt chỉ dàn trải cùng ba câu hỏi qua nhiều lượt, kéo dài hội thoại mà người dùng vẫn chưa nhận được giúp đỡ nào.","<b>B.</b> Thêm mô hình phân loại độ mơ hồ là phức tạp hóa kiến trúc; nhóm mơ hồ cao vẫn bị đưa vào hộp thoại hỏi han — đúng nguồn gốc của ma sát.","<b>D.</b> Diễn giải mặc định mà <b>không nêu giả định</b> khiến người dùng không biết trợ lý đã hiểu gì, nên kết quả sai khó được phát hiện và sửa."]},"cite":"Hướng dẫn ôn tập — Lĩnh vực 5.2 Thiết kế các Mẫu Escalation Hiệu quả và Giải quyết Sự Mơ hồ"},{"id":"t1q102","n":102,"topic":1,"type":"mcq","stem":{"en":"You need to add a date validation check ensuring event dates are in the future. This requires adding a conditional statement to one existing function in a single file. What is the most appropriate approach?"},"options":[{"k":"A","t":{"en":"Use direct execution to make the change"}},{"k":"B","t":{"en":"Start with extended thinking mode enabled to ensure thorough reasoning about the validation logic"}},{"k":"C","t":{"en":"Enter plan mode to analyze how the validation might impact other parts of the reservation flow"}},{"k":"D","t":{"en":"Enter plan mode first to create a detailed implementation strategy before making the change"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Thêm một điều kiện kiểm tra ngày trong tương lai vào <b>một hàm có sẵn trong một file</b> là thay đổi đơn giản, phạm vi rõ ràng. Theo hướng dẫn, các thay đổi đã hiểu rõ như “thêm một validation duy nhất” nên dùng <b>thực thi trực tiếp</b>; planning mode dành cho tác vụ có hệ quả kiến trúc, nhiều phương án hoặc chạm nhiều file.","elim":["<b>B.</b> Extended thinking là thừa cho một câu lệnh điều kiện đơn giản; logic “ngày phải ở tương lai” không cần suy luận sâu.","<b>C.</b> Phân tích tác động lên toàn bộ luồng đặt chỗ là thổi phồng một thay đổi cục bộ một hàm, tốn thời gian không cần thiết.","<b>D.</b> Lập chiến lược triển khai chi tiết trong planning mode dành cho thay đổi lớn/kiến trúc, không phải cho việc thêm một điều kiện."]},"cite":"Hướng dẫn ôn tập — §5.6 Planning Mode so với Thực thi trực tiếp; Lĩnh vực 3.4"},{"id":"t1q103","n":103,"topic":1,"type":"mcq","stem":{"en":"Your team&#x27;s CLAUDE.md includes a rule: &quot;Use 4-space indentation and always run Prettier formatting.&quot; Despite this, code reviews reveal that roughly 30% of files Claude Code generates use inconsistent formatting — sometimes 2-space indentation, sometimes missing trailing commas. Adding emphasis (&quot;IMPORTANT: You MUST use Prettier formatting&quot;) reduces violations to about 15%, but doesn&#x27;t eliminate them. What is the most effective way to ensure all generated code is consistently formatted?"},"options":[{"k":"A","t":{"en":"Split the formatting rules into path-scoped .claude/rules/ files that load when Claude works on matching file types."}},{"k":"B","t":{"en":"Configure a Post ToolUse hook with an Edit|Write matcher that automatically runs Prettier on each file Claude modifies."}},{"k":"C","t":{"en":"Add a Stop hook with a prompt-based check that evaluates whether generated code follows formatting standards and prompts Claude to fix violations."}},{"k":"D","t":{"en":"Extract the formatting rules into a dedicated skill that Claude loads automatically when generating code, with more detailed examples of correct formatting."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Chỉ dẫn trong CLAUDE.md, dù được nhấn mạnh, vẫn là <b>hướng dẫn mang tính xác suất</b> (vẫn còn ~15% vi phạm). Để đảm bảo 100%, cần <b>cơ chế tất định</b>: hook <code>PostToolUse</code> với matcher <code>Edit|Write</code> tự động chạy Prettier trên mỗi file Claude vừa sửa. Định dạng do công cụ thực thi bằng code chứ không phụ thuộc mô hình có nhớ quy tắc hay không.","elim":["<b>A.</b> Tách quy tắc ra <code>.claude/rules/</code> theo đường dẫn chỉ thay đổi thời điểm nạp chỉ dẫn; vẫn là hướng dẫn xác suất nên không loại bỏ vi phạm.","<b>C.</b> Stop hook với kiểm tra dựa trên prompt vẫn dùng mô hình để phán đoán định dạng — không tất định, chạy muộn và tốn thêm vòng sửa, trong khi Prettier làm việc này chính xác.","<b>D.</b> Skill với nhiều ví dụ hơn vẫn là chỉ dẫn cho mô hình; không đảm bảo được mọi file đều đúng định dạng."]},"cite":"Hướng dẫn ôn tập — §3.5 Hooks trong Agent SDK; Lĩnh vực 1.5"},{"id":"t1q104","n":104,"topic":1,"type":"mcq","stem":{"en":"You&#x27;re implementing a caching layer for API responses to speed up the /products endpoint. You have a rough idea—Redis with a 5-minute TTL—but you&#x27;re new to production caching and aren&#x27;t sure what other considerations a robust implementation requires. What&#x27;s the most effective way to start your iterative workflow?"},"options":[{"k":"A","t":{"en":"Start with a minimal request: &quot;Add Redis caching to/products with 5-minute TTL.&quot; Add features and fix issues through follow-up prompts as problems surface during testing."}},{"k":"B","t":{"en":"Write a specification with your known requirements and &quot;TBD&quot; markers for uncertain areas, having Claude propose solutions for each TBD as it implements."}},{"k":"C","t":{"en":"Ask Claude to interview you about the caching requirements before implementing, surfacing considerations like invalidation strategies, cache layers, consistency guarantees, and failure modes."}},{"k":"D","t":{"en":"Use plan mode to analyze the current/products endpoint implementation, then provide your caching requirements once Claude explains how the existing code is structured."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Người dùng có ý tưởng sơ bộ (Redis, TTL 5 phút) nhưng <b>mới với caching production</b> và không biết còn những cân nhắc gì. <b>Mẫu “phỏng vấn”</b> — để Claude đặt câu hỏi trước khi triển khai — làm lộ ra các yếu tố thiết kế không hiển nhiên như chiến lược vô hiệu hóa cache, các tầng cache, đảm bảo nhất quán và chế độ lỗi, giúp bắt đầu với yêu cầu đầy đủ thay vì phát hiện vấn đề muộn.","elim":["<b>A.</b> Bắt đầu tối thiểu rồi sửa khi gặp vấn đề nghĩa là các lỗ hổng (invalidation, lỗi khi Redis sập) chỉ lộ ra muộn, có thể ở production, phải làm lại tốn kém.","<b>B.</b> Đánh dấu “TBD” giả định người dùng biết mình chưa biết gì; người mới thì không biết cần đặt TBD ở đâu, và Claude tự quyết khi triển khai mà không thảo luận.","<b>D.</b> Phân tích code hiện có giúp hiểu cấu trúc endpoint nhưng không giải quyết khoảng trống kiến thức về yêu cầu caching của người dùng."]},"cite":"Hướng dẫn ôn tập — §6.4 Mẫu “Phỏng vấn” (Interview); Lĩnh vực 3.5"},{"id":"t1q105","n":105,"topic":1,"type":"mcq","stem":{"en":"You&#x27;ve asked Claude to write a data migration script, but the initial output doesn&#x27;t correctly handle records with null values in required fields. What&#x27;s the most effective way to iterate toward a working solution?"},"options":[{"k":"A","t":{"en":"Manually edit the generated code to fix the null handling, then continue working with Claude on other parts."}},{"k":"B","t":{"en":"Provide a test case with example input containing null values and the expected output, then ask Claude to fix it."}},{"k":"C","t":{"en":"Describe the null value problem in detail and ask Claude to regenerate the entire script with improved edge case handling."}},{"k":"D","t":{"en":"Add &quot;think harder about edge cases&quot; to your prompt and request a complete rewrite of the migration logic."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> <b>Ví dụ đầu vào/đầu ra cụ thể</b> là cách hiệu quả nhất để truyền đạt kỳ vọng. Một <b>test case</b> chứa bản ghi có null ở trường bắt buộc cùng đầu ra mong đợi cho Claude biết chính xác hành vi cần có (bỏ qua, gán mặc định, hay báo lỗi) và cung cấp cách kiểm chứng việc sửa — đúng tinh thần lặp theo hướng test.","elim":["<b>A.</b> Tự sửa tay làm mất cơ hội để Claude hiểu yêu cầu xử lý null; các phần sau có thể lặp lại cùng lỗi và mâu thuẫn với bản sửa tay.","<b>C.</b> Mô tả bằng lời mơ hồ hơn ví dụ cụ thể, và sinh lại toàn bộ script có thể làm hỏng những phần đang đúng.","<b>D.</b> “Think harder” là chỉ dẫn chung chung không nêu hành vi mong muốn với null; viết lại toàn bộ cũng rủi ro phá phần đã chạy đúng."]},"cite":"Hướng dẫn ôn tập — Lĩnh vực 3.5 Tinh chỉnh Lặp lại để Cải thiện Tiệm tiến"},{"id":"t1q106","n":106,"topic":1,"type":"mcq","stem":{"en":"Production monitoring shows the research phase takes longer than expected. Analysis reveals the coordinator invokes the web search subagent, then invokes the document analysis subagent and waits again. These tasks are independent—neither requires the other&#x27;s output. What is the most effective way to run these subagents concurrently?"},"options":[{"k":"A","t":{"en":"Create an async orchestration layer outside the agent that spawns parallel threads, each running a separate coordinator."}},{"k":"B","t":{"en":"Switch both subagents to use a Haiku-tier model instead of Sonnet to reduce their individual execution time."}},{"k":"C","t":{"en":"Structure the coordinator to emit both Task tool calls (for web search and document analysis) in a single response message."}},{"k":"D","t":{"en":"Add detailed instructions to the coordinator&#x27;s system prompt explaining the performance benefits of parallel execution at the same time."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Trong Agent SDK, subagent chạy song song khi coordinator <b>phát nhiều lời gọi tool <code>Task</code> trong cùng một response</b>. Vì tìm kiếm web và phân tích tài liệu độc lập với nhau, coordinator chỉ cần phát cả hai lệnh <code>Task</code> trong một message để chúng chạy đồng thời — không cần hạ tầng bổ sung.","elim":["<b>A.</b> Lớp điều phối async bên ngoài với nhiều coordinator là phức tạp hóa không cần thiết và phân tán việc điều phối, trong khi SDK đã hỗ trợ song song gốc qua nhiều lời gọi <code>Task</code>.","<b>B.</b> Đổi sang model Haiku chỉ giảm thời gian từng subagent (và có thể giảm chất lượng); chúng vẫn chạy tuần tự.","<b>D.</b> Giải thích lợi ích song song trong system prompt không cụ thể bằng việc cấu trúc coordinator phát cả hai lệnh <code>Task</code> trong một response — đây mới là cơ chế thực thi đồng thời."]},"cite":"Hướng dẫn ôn tập — §3.4 Tool Task để Sinh ra Subagent; Lĩnh vực 1.3"},{"id":"t1q107","n":107,"topic":1,"type":"mcq","stem":{"en":"Your automated review calls the Claude API for each PR, using tool_use with a report_findings tool that returns a JSON array of finding objects (each with file_path, line_number, severity, category, and description). During testing on a large PR touching 30+ files, the response hits the max_tokens limit and the output is truncated mid-JSON, causing your pipeline&#x27;s parser to fail. What is the most effective way to handle this?"},"options":[{"k":"A","t":{"en":"Switch from tool_use to prompting Claude to return findings as a markdown list."}},{"k":"B","t":{"en":"Increase max_tokens to the model&#x27;s maximum and instruct Claude to keep finding descriptions under 50 words each."}},{"k":"C","t":{"en":"Split the review into multiple API calls that each analyze a subset of the changed files, then merge the resulting findings arrays."}},{"k":"D","t":{"en":"Add retry logic that detects truncated JSON and re-sends the request with instructions to report only critical and high severity findings."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Vấn đề gốc là <b>kích thước đầu ra</b> của một PR 30+ file vượt <code>max_tokens</code> (<code>stop_reason: \"max_tokens\"</code>), làm JSON bị cắt. <b>Chia review thành nhiều lời gọi</b>, mỗi lời gọi phân tích một nhóm file, giữ mỗi đầu ra trong giới hạn; sau đó gộp các mảng findings. Cách này mở rộng được với PR bất kỳ kích thước, giữ nguyên cấu trúc <code>tool_use</code> và chất lượng chi tiết.","elim":["<b>A.</b> Chuyển sang markdown bỏ đi lợi ích structured output của <code>tool_use</code> mà vẫn bị cắt cụt khi vượt giới hạn token.","<b>B.</b> Tăng <code>max_tokens</code> và rút ngắn mô tả chỉ đẩy ngưỡng lên; PR lớn hơn vẫn bị cắt, và cắt mô tả làm giảm chất lượng finding.","<b>D.</b> Retry chỉ báo critical/high là cố ý bỏ sót finding mức thấp hơn và tốn một lời gọi thất bại trước khi retry."]},"cite":"Hướng dẫn ôn tập — §1.3 Trường stop_reason trong Phản hồi; Lĩnh vực 4.6"},{"id":"t1q108","n":108,"topic":1,"type":"mcq","stem":{"en":"An engineer sees an unfamiliar error message &quot;SYNC_CONFLICT: entity version mismatch detected&quot; in production logs but doesn&#x27;t know which of the 12 services in the codebase generates it. They ask the agent to help locate the source code. What exploration approach will most efficiently find the responsible code?"},"options":[{"k":"A","t":{"en":"Use Grep to search for distinctive text from the error message (like &quot;SYNC_CONFLICT&quot; or &quot;entity version mismatch&quot;), then Read the matching files to understand context."}},{"k":"B","t":{"en":"Use Grep to find all files that import the project&#x27;s error handling module, then Read those files to locate custom error definitions."}},{"k":"C","t":{"en":"Use Glob to find files in directories commonly associated with error handling (such as errors/, exceptions/, or handlers/) across services, then Read each matching file."}},{"k":"D","t":{"en":"Read the project&#x27;s README and service configuration files to understand the architecture, then systematically Read source files in service directory."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Thông báo lỗi chứa <b>chuỗi đặc trưng</b> (“SYNC_CONFLICT”, “entity version mismatch”) gần như chắc chắn xuất hiện nguyên văn trong mã nguồn tạo ra nó. <b>Grep</b> — công cụ tìm kiếm theo nội dung file — tìm ra ngay vị trí trên 12 service, rồi <b>Read</b> các file khớp để hiểu context. Đây là chiến lược điều tra tăng dần chuẩn: Grep điểm vào, sau đó Read để truy vết.","elim":["<b>B.</b> Tìm mọi file import module xử lý lỗi cho ra tập kết quả rất rộng, phải đọc nhiều file không liên quan thay vì nhắm thẳng vào chuỗi lỗi.","<b>C.</b> Glob theo tên thư mục dựa trên giả định về quy ước đặt tên; mã lỗi có thể được định nghĩa ở nơi khác, và vẫn phải Read từng file khớp.","<b>D.</b> Đọc README rồi đọc tuần tự file nguồn của các service tốn rất nhiều context và thời gian, trong khi một lệnh Grep đã tìm ra đúng chỗ."]},"cite":"Hướng dẫn ôn tập — §13.2 Chiến lược Điều tra Tăng dần; Lĩnh vực 2.5"},{"id":"t1q109","n":109,"topic":1,"type":"mcq","stem":{"en":"An engineer asks your agent to add comprehensive tests to a legacy codebase with 200 files and minimal existing test coverage. The engineer hasn&#x27;t specified which modules to prioritize. How should the agent decompose this open-ended task?"},"options":[{"k":"A","t":{"en":"Systematically read all 200 files to create a complete function inventory before writing any tests, ensuring the testing plan accounts for every function before beginning."}},{"k":"B","t":{"en":"Create a fixed testing schedule upfront based on directory structure, allocating equal effort to each top-level directory regardless of code complexity or business importance."}},{"k":"C","t":{"en":"Use Glob and Grep to map codebase structure, identify heavily-coupled modules, create a prioritized plan for high-impact areas, and revise as dependencies are discovered."}},{"k":"D","t":{"en":"Start writing tests for the first module alphabetically, using test failures and imports to discover related files organically."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Đây là tác vụ mở, chưa xác định ưu tiên trên 200 file — phù hợp với <b>phân rã thích ứng động</b>. Dùng <b>Glob và Grep</b> để lập bản đồ cấu trúc codebase một cách rẻ, xác định các module có <b>độ liên kết cao</b> (tác động lớn), lập kế hoạch ưu tiên cho các vùng đó, rồi <b>điều chỉnh kế hoạch</b> khi phát hiện thêm phụ thuộc. Cách này cân bằng giữa thu thập context đủ dùng và việc bắt tay vào làm sớm.","elim":["<b>A.</b> Đọc toàn bộ 200 file trước khi viết test làm cạn context và trì hoãn giá trị; lập bản đồ bằng Grep/Glob đủ để ưu tiên.","<b>B.</b> Lịch cố định chia đều theo thư mục bỏ qua độ phức tạp và tầm quan trọng nghiệp vụ, và không thích ứng khi phát hiện phụ thuộc.","<b>D.</b> Bắt đầu theo thứ tự bảng chữ cái là tùy tiện, không gắn với tác động; khám phá “tự nhiên” dễ dồn công sức vào module ít quan trọng."]},"cite":"Hướng dẫn ôn tập — §8.2 Phân rã thích ứng động (Dynamic Adaptive Decomposition); Lĩnh vực 1.6"},{"id":"t1q110","n":110,"topic":1,"type":"mcq","stem":{"en":"Your productivity agent connects to three MCP servers: an issue tracker (search_issues, get_issue, create_comment), a documentation wiki (search_docs, get_page, list_spaces), and a database explorer (run_query, get_schema, list_databases). When engineers ask cross-system questions like &quot;What database tables are affected by the authentication refactor in PROJ-1234?&quot;, monitoring shows the agent makes 8-10 sequential tool calls, frequently issues exploratory calls because it lacks visibility into what content each server contains, and exhausts context space before completing complex investigations. What architectural change best leverages MCP capabilities to address these issues?"},"options":[{"k":"A","t":{"en":"Consolidate all three servers into a unified MCP server with cross-referencing capabilities"}},{"k":"B","t":{"en":"Expose each server&#x27;s content catalog as MCP resources—issue summaries, documentation hierarchy, database schemas"}},{"k":"C","t":{"en":"Add an orchestrator that routes questions to a single server based on keywords"}},{"k":"D","t":{"en":"Add a prepare_investigation tool to each server that accepts a natural language question and returns relevant content summaries"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Agent thực hiện nhiều lời gọi khám phá vì <b>không biết mỗi server chứa nội dung gì</b>. <b>MCP resources</b> được thiết kế đúng cho việc này: công bố <b>“danh mục nội dung”</b> — tóm tắt issue, cây tài liệu, schema cơ sở dữ liệu — để agent nắm được bức tranh tổng quan mà không phải gọi tool dò dẫm. Kết quả là giảm số lời gọi tuần tự và tiết kiệm context cho các điều tra phức tạp.","elim":["<b>A.</b> Gộp ba server thành một chỉ thay đổi cách đóng gói; agent vẫn thiếu thông tin về nội dung sẵn có nên vẫn phải gọi khám phá.","<b>C.</b> Định tuyến theo từ khóa tới một server duy nhất phá vỡ đúng loại câu hỏi xuyên hệ thống (issue + tài liệu + DB) mà đề bài nêu.","<b>D.</b> Tool <code>prepare_investigation</code> trên mỗi server vẫn là thêm lời gọi tool, và mỗi server tự diễn giải câu hỏi ngôn ngữ tự nhiên — không tận dụng primitive resources của MCP."]},"cite":"Hướng dẫn ôn tập — §4.5 MCP Resources; Lĩnh vực 2.4"},{"id":"t1q111","n":111,"topic":1,"type":"mcq","stem":{"en":"The synthesis agent completes its initial pass but flags that three key research questions remain unanswered because the web search and document analysis agents didn&#x27;t find relevant information on those specific subtopics. The coordinator currently proceeds directly to report generation, producing reports with incomplete coverage. What change would most effectively improve research completeness?"},"options":[{"k":"A","t":{"en":"Have the report generation agent note which research questions couldn&#x27;t be answered, so users understand the limitations of the final output."}},{"k":"B","t":{"en":"Give the synthesis agent direct access to web search tools so it can autonomously fill knowledge gaps without returning control to the coordinator."}},{"k":"C","t":{"en":"Have the coordinator evaluate synthesis output for gaps, then re-delegate to web search and document analysis with targeted queries before Invoking synthesis again."}},{"k":"D","t":{"en":"Increase the initial breadth of queries sent to web search and document analysis to reduce the probability of missing relevant information."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Coordinator chịu trách nhiệm <b>đánh giá chất lượng và độ đầy đủ</b> của kết quả. Khi synthesis báo còn câu hỏi chưa có lời giải, coordinator nên <b>đánh giá khoảng trống</b>, <b>ủy thác lại</b> cho web search và document analysis với truy vấn nhắm đúng các chủ đề con còn thiếu, rồi gọi synthesis lần nữa trước khi sinh báo cáo. Vòng lặp “đánh giá → ủy thác lại” giữ đúng mô hình hub-and-spoke và trực tiếp cải thiện độ phủ.","elim":["<b>A.</b> Ghi chú hạn chế giúp minh bạch nhưng không cải thiện độ đầy đủ của nghiên cứu — đúng điều đề bài yêu cầu.","<b>B.</b> Cho synthesis agent tự tìm web vượt ra ngoài chuyên môn của nó, phá vỡ phân vai và luồng điều phối qua coordinator (mọi giao tiếp nên đi qua coordinator).","<b>D.</b> Mở rộng truy vấn ban đầu là đoán trước; không đảm bảo phủ các chủ đề con cụ thể bị thiếu và tăng chi phí cho mọi lần chạy."]},"cite":"Hướng dẫn ôn tập — §3.3 Hub-and-Spoke: Coordinator và Subagent; Lĩnh vực 1.2"},{"id":"t1q112","n":112,"topic":1,"type":"mcq","stem":{"en":"Your documents (query) tool returns results as &quot;Found 3 documents: Q2 Budget Proposal, Q2 Budget Forecast, Annual Review&quot;. You want the agent to document (4, multi) and doc (24, multi). What return format would best enable these multi-step workflows?"},"options":[{"k":"A","t":{"en":"Structured data containing document IDs and metadata for each result."}},{"k":"B","t":{"en":"URLs that users can click to open the document in their browser."}},{"k":"C","t":{"en":"More detailed human-readable descriptions including the size and authors."}},{"k":"D","t":{"en":"A JSON array of document titles extracted from the search results."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Đầu ra hiện tại chỉ là chuỗi dễ đọc cho người, trong đó các tiêu đề còn gần giống nhau (“Q2 Budget Proposal”, “Q2 Budget Forecast”). Để agent thực hiện <b>workflow nhiều bước</b> (gọi tiếp các tool khác lên tài liệu cụ thể), tool cần trả về <b>dữ liệu có cấu trúc kèm ID tài liệu và metadata</b>. ID cho phép tham chiếu chính xác, không mơ hồ ở các lời gọi tiếp theo; metadata giúp chọn đúng tài liệu.","elim":["<b>B.</b> URL để người dùng nhấp vào phục vụ con người, không phải định danh để agent truyền cho các tool tiếp theo.","<b>C.</b> Mô tả dễ đọc chi tiết hơn vẫn là văn bản tự do, agent phải tự phân tích và vẫn không có định danh duy nhất.","<b>D.</b> Mảng tiêu đề chỉ là dạng JSON của cùng thông tin; tiêu đề không duy nhất, không ổn định và không đủ để tham chiếu chính xác."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q113","n":113,"topic":1,"type":"mcq","stem":{"en":"Your agent has access to 50+ specialized API connectors for different external services. As the connector library grew, tool selection accuracy dropped to 58%. You design a search_connectors(description) tool that finds matching connectors, but in testing agents frequently skip searching and call connectors directly (often incorrectly), or search select wrong connectors from the filtered results. How should you design the tool composition pattern to address both issues?"},"options":[{"k":"A","t":{"en":"Enhance all connector descriptions with detailed usage samples, edge cases, and input requirements. Add few-shot examples showing the correct search-then-use workflow."}},{"k":"B","t":{"en":"Design a find_and_execute(description, params) composite tool that searches and immediately executes the best matching connector."}},{"k":"C","t":{"en":"Design connectors with built-in compatibility validation that return descriptive errors for mismatched requests."}},{"k":"D","t":{"en":"Design search_connectors to dynamically add matched connectors to the agent&#x27;s available tools. Connectors start unavailable and persist once discovered."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Hai lỗi cùng nguồn gốc: quá nhiều tool hiển thị cùng lúc (50+), nên agent có thể bỏ qua bước tìm kiếm và gọi trực tiếp. Thiết kế để <b>connector ban đầu không khả dụng</b> và chỉ được <b>thêm động vào bộ tool</b> sau khi <code>search_connectors</code> tìm thấy làm cho việc tìm kiếm trở thành <b>bắt buộc về mặt cấu trúc</b> (không thể gọi thẳng). Đồng thời agent chỉ chọn trong tập nhỏ đã lọc, nâng độ chính xác lựa chọn; connector đã khám phá được giữ lại để dùng tiếp.","elim":["<b>A.</b> Mô tả chi tiết và few-shot chỉ là hướng dẫn mềm; agent vẫn thấy toàn bộ 50+ connector và vẫn có thể bỏ qua bước tìm kiếm, còn mô tả dài làm tăng context.","<b>B.</b> Tool gộp tìm-và-chạy tự động thực thi “kết quả khớp nhất” mà agent không được xem xét, nên lỗi chọn sai connector bị đẩy thành hành động sai ngay lập tức.","<b>C.</b> Validation trả lỗi chỉ phát hiện lỗi sau khi gọi sai, không ngăn agent bỏ qua tìm kiếm hay chọn sai, và tốn lượt."]},"cite":"Hướng dẫn ôn tập — §2.3 Tham số tool_choice; Lĩnh vực 2.3"},{"id":"t1q114","n":114,"topic":1,"type":"mcq","stem":{"en":"Your publish article tool calls an external CMS API that occasionally returns transient errors (network timeouts, 503s) and non-transient errors (403 permission denied, 422 validation failure). Currently, every error is returned directly to the agent, which leads to the agent retrying non-transient errors and wasting turns on failures that will never succeed. How should you partition error-handling responsibility between the tool implementation and the agent?"},"options":[{"k":"A","t":{"en":"Surface all errors to the agent immediately with detailed context, and let the agent decide which errors to retry and how many times-keeping the tool implementation stateless and simple."}},{"k":"B","t":{"en":"Handle transient errors (timeouts, 503s) with automatic retries inside the tool implementation, and surface non-transient errors (permission denied, validation fallures) to the agent with descriptive messages so it can take corrective action."}},{"k":"C","t":{"en":"Handle all errors inside the tool: Implement retries with exponential backoff for every error type, and only surface a failure to the agent after a fixed number of retry attempts have been exhausted."}},{"k":"D","t":{"en":"Implement a universal error handler that catches all exceptions and returns a generic &quot;tool unavailable- try again later&quot; message, shielding the agent from error complexity."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Phân chia trách nhiệm theo <b>loại lỗi</b>: lỗi tạm thời (timeout, 503) thường tự khỏi khi thử lại nên <b>tool tự retry</b> — phục hồi cục bộ, agent không tốn lượt. Lỗi không tạm thời (403, 422) <b>không bao giờ thành công khi retry</b> và cần thay đổi đầu vào hoặc quyết định khác, nên <b>trả về agent kèm thông báo mô tả</b> để nó có hành động khắc phục (sửa dữ liệu, xin quyền, báo người dùng).","elim":["<b>A.</b> Đẩy mọi lỗi lên agent chính là hiện trạng gây lãng phí lượt; agent phải xử lý cả lỗi tạm thời mà tool có thể tự giải quyết.","<b>C.</b> Retry mọi loại lỗi sẽ retry vô ích cả 403/422 và trì hoãn việc báo lỗi cần khắc phục cho agent.","<b>D.</b> Thông báo chung chung “try again later” che giấu loại lỗi, khiến agent tiếp tục retry lỗi quyền/validation — đúng anti-pattern."]},"cite":"Hướng dẫn ôn tập — §10.1 Các nhóm lỗi; Lĩnh vực 2.2"},{"id":"t1q115","n":115,"topic":1,"type":"mcq","stem":{"en":"Your scheduling agent uses get_available_slots(date, provider_id) to retrieve open appointment times, then book_appointment(provider_id, slot_time, patient_id) to reserve a slot. tickets show that 15% of booking attempts fall with &quot;slot no longer available&quot; because another user booked the slot between the availability check and the booking call. How should you refactor these tools?"},"options":[{"k":"A","t":{"en":"Combine both tools into a single find_and_book_appointment that atomically checks availability and books, returning either the confirmed booking or available alternatives."}},{"k":"B","t":{"en":"Add a hold_slot(provider_id, slot_time) tool that creates a 60 second temporary reservation, requiring the agent to call it between checking availability and booking."}},{"k":"C","t":{"en":"Modify book_appointment to return detailed failure information including currently available alternative slots when the requested slot is unavailable, enabling the agent to retry with a different time."}},{"k":"D","t":{"en":"Keep both tools but add retry logic to the agent&#x27;s system prompt, instructing it to call get_available_slots again and select a different time if booking fails."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> 15% thất bại là do <b>race condition</b> giữa bước kiểm tra và bước đặt chỗ (khoảng thời gian giữa hai lời gọi tool tách rời). Gộp thành <code>find_and_book_appointment</code> thực hiện <b>kiểm tra và đặt chỗ một cách nguyên tử</b> sẽ loại bỏ khoảng hở đó; khi slot không còn, tool trả về các phương án thay thế để agent đề xuất ngay.","elim":["<b>B.</b> <code>hold_slot</code> chỉ chuyển khoảng hở sang giữa bước kiểm tra và bước giữ chỗ (vẫn có race), thêm một lời gọi và phụ thuộc agent nhớ gọi đúng thứ tự trong 60 giây.","<b>C.</b> Trả về phương án thay thế khi thất bại giúp phục hồi nhưng không ngăn được thất bại; lần retry vẫn có thể gặp lại race condition.","<b>D.</b> Logic retry trong system prompt chỉ xử lý sau khi thất bại, tốn thêm lượt và vẫn giữ nguyên nguyên nhân gốc."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q116","n":116,"topic":1,"type":"mcq","stem":{"en":"Production monitoring shows your search_catalog tool fails 12% of the time: 8% are network timeouts that succeed when immediately retried, while 4% are query syntax errors from malformed user-provided filters that never succeed regardless of retry attempts. Currently, both error types are returned to the agent identically, causing it to waste turns retrying syntax errors and telling users to &quot;try again later&quot; for timeouts. How should you modify the tool&#x27;s error handling?"},"options":[{"k":"A","t":{"en":"Return all errors with a retryable boolean flag and error type details."}},{"k":"B","t":{"en":"Implement automatic retry with backoff for network timeouts inside the tool; return syntax errors immediately with parameter validation details."}},{"k":"C","t":{"en":"Apply exponential backoff retry logic to all errors uniformly, returning a generic &quot;service temporarily unavailable&quot; message after max retries are exhausted."}},{"k":"D","t":{"en":"Add few-shot examples to your system prompt demonstrating how to distinguish network errors from syntax errors and handle each case appropriately."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Hai loại lỗi cần xử lý khác nhau: timeout mạng (8%) <b>thành công khi retry ngay</b>, nên tool nên <b>tự retry có backoff</b> và agent không cần biết; lỗi cú pháp truy vấn (4%) <b>không bao giờ thành công khi retry</b>, nên phải trả về ngay kèm <b>chi tiết validation tham số</b> để agent sửa bộ lọc hoặc giải thích cho người dùng. Cách này loại bỏ cả hai hành vi sai: retry lỗi cú pháp và bảo người dùng “thử lại sau” khi timeout.","elim":["<b>A.</b> Cờ <code>retryable</code> là cải thiện nhưng vẫn đẩy timeout lên agent, bắt agent tốn lượt retry thứ mà tool có thể tự xử lý minh bạch.","<b>C.</b> Retry mọi lỗi sẽ retry vô ích lỗi cú pháp, rồi trả về thông báo chung chung che mất chi tiết agent cần để sửa truy vấn.","<b>D.</b> Few-shot vô ích khi cả hai loại lỗi đang được trả về giống hệt nhau — agent không có tín hiệu nào để phân biệt."]},"cite":"Hướng dẫn ôn tập — §10.1 Các nhóm lỗi; Lĩnh vực 2.2"},{"id":"t1q117","n":117,"topic":1,"type":"mcq","stem":{"en":"Your document extraction tool uses ML models to extract invoice fields (vendor, amount, date). The models return confidence scores (0.0-1.0) for each extracted field. In production, you observe: (1) the agent proceeds with low-confidence extractions that are incorrect 23% of the time, and (2) the agent requests unnecessary human review for 31% of extractions that were actually correct. How should you restructure the tool&#x27;s output?"},"options":[{"k":"A","t":{"en":"Return fields with confidence scores, plus a requires_review boolean computed using your tested confidence thresholds, along with a review_reasons array explaining which fields triggered review."}},{"k":"B","t":{"en":"Return fields organized into verified and needs_verification objects based on confidence thresholds."}},{"k":"C","t":{"en":"Return fields with their raw confidence scores and add detailed few-shot examples to your system prompt demonstrating how to interpret different confidence ranges and when to request human review."}},{"k":"D","t":{"en":"Compute an aggregate extraction quality score across all fields and return it alongside the extracted values. Include a text summary describing the overall extraction reliability."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Cả hai lỗi (tiếp tục với trích xuất sai và yêu cầu review thừa) đều do agent <b>tự diễn giải điểm confidence thô</b> không nhất quán. Tool nên trả về điểm confidence kèm <b>cờ <code>requires_review</code> tính từ ngưỡng đã được kiểm định</b> bằng dữ liệu có nhãn, cộng mảng <code>review_reasons</code> nêu trường nào gây cờ. Quyết định trở nên tất định và được hiệu chỉnh, còn lý do giúp agent/con người biết cần kiểm tra trường nào.","elim":["<b>B.</b> Chia thành <code>verified</code>/<code>needs_verification</code> có dựa trên ngưỡng nhưng bỏ đi điểm confidence và lý do, nên agent và người review thiếu thông tin vì sao trường bị đánh dấu.","<b>C.</b> Few-shot về cách diễn giải điểm thô vẫn để mô hình tự phán đoán theo xác suất — chính nguồn gốc của sự không nhất quán hiện tại.","<b>D.</b> Điểm tổng hợp che giấu trường cụ thể bị yếu (một trường sai có thể bị trung bình hóa đi), và tóm tắt văn bản không phải tín hiệu quyết định rõ ràng."]},"cite":"Hướng dẫn ôn tập — §9.4 Hiệu chỉnh độ tin cậy và giám sát của con người; Lĩnh vực 5.5"},{"id":"t1q118","n":118,"topic":1,"type":"mcq","stem":{"en":"Your agent includes an update_game_score tool that accepts game_date (string), home_team (string), and away_team (string) parameters. Production logs reveal recurring issues: the agent uses team nicknames instead of official names, applies inconsistent date formats, and selects the wrong game when teams have rematches in the same season. What tool interface change would effectively prevent these errors?"},"options":[{"k":"A","t":{"en":"Add a season parameter to disambiguate rematches, and add a confirm_before_update flag that returns the resolved game details for the agent to verify before the score is committed."}},{"k":"B","t":{"en":"Add enum constraints listing valid team names for both team parameters, and add a regex pattern enforcing ISO 8601 format for the date parameter."}},{"k":"C","t":{"en":"Add detailed examples to the tool description showing the required date format and complete list of official team names."}},{"k":"D","t":{"en":"Replace the three parameters with a single game_id parameter and a separate search_games lookup tool that returns matching game IDs."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Ba lỗi (biệt danh đội, định dạng ngày không thống nhất, chọn sai trận khi tái đấu) đều bắt nguồn từ việc <b>xác định trận đấu bằng các trường tự do</b>. Thay bằng <b>một tham số <code>game_id</code></b> cùng tool tra cứu <code>search_games</code> riêng tách việc tìm kiếm (mờ, chấp nhận tên/ngày gần đúng) khỏi việc cập nhật (cần định danh chính xác, duy nhất). Agent tra cứu, xác định đúng trận rồi cập nhật bằng ID — loại bỏ mơ hồ ngay ở giao diện.","elim":["<b>A.</b> Thêm <code>season</code> không phân biệt được hai trận tái đấu trong cùng mùa giải, và không xử lý vấn đề biệt danh hay định dạng ngày; cờ xác nhận chỉ thêm bước.","<b>B.</b> Enum và regex sửa được tên đội và định dạng ngày, nhưng schema chỉ ràng buộc định dạng: agent vẫn có thể điền ngày của trận tái đấu khác, và không có gì xác minh tổ hợp ngày/đội trỏ đúng trận cần cập nhật.","<b>C.</b> Ví dụ trong mô tả chỉ là hướng dẫn mềm, không ràng buộc; và vẫn không có cơ chế phân biệt trận tái đấu."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q119","n":119,"topic":1,"type":"mcq","stem":{"en":"You&#x27;ve configured the system so that all four subagents have access to the complete set of 18 tools. During testing, agents frequently call tools outside their specialization—the synthesis agent attempts web searches, and the report generator tries to analyze documents. What is the primary cause of this poor tool selection behavior?"},"options":[{"k":"A","t":{"en":"The coordinator cannot track which capabilities each subagent has, leading to misrouted tasks."}},{"k":"B","t":{"en":"The agents&#x27; role descriptions in their system prompts conflict with having access to tools outside that role."}},{"k":"C","t":{"en":"Choosing from 18 tools instead of 4-5 relevant ones increases decision complexity beyond reliable selection thresholds."}},{"k":"D","t":{"en":"The tool definitions consume too much context window space, leaving insufficient room for task content."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Theo hướng dẫn, cho mỗi agent <b>quá nhiều tool (18 thay vì 4–5)</b> làm <b>giảm độ tin cậy lựa chọn tool</b>: độ phức tạp quyết định tăng vượt ngưỡng chọn đáng tin cậy, và agent có tool ngoài chuyên môn có xu hướng dùng sai. Đó là nguyên nhân chính khiến synthesis agent gọi web search hay report generator phân tích tài liệu. Cách sửa là giới hạn bộ tool theo vai trò.","elim":["<b>A.</b> Vấn đề nằm ở việc chính subagent chọn sai tool, không phải coordinator định tuyến sai tác vụ.","<b>B.</b> Mô tả vai trò không “xung đột” với việc có tool; nguyên nhân là số lượng lựa chọn quá lớn, không phải mâu thuẫn giữa prompt và quyền truy cập.","<b>D.</b> 18 định nghĩa tool chiếm context không đáng kể so với context window; triệu chứng là chọn sai tool, không phải thiếu chỗ cho nội dung tác vụ."]},"cite":"Hướng dẫn ôn tập — Lĩnh vực 2.3 Phân bổ Tool Giữa các Agent và Cấu hình tool_choice"},{"id":"t1q120","n":120,"topic":1,"type":"mcq","stem":{"en":"You&#x27;ve documented API error handling conventions in a CLAUDE.md file at your project root, specifying that endpoint handlers should use a custom ApiError class. After several sessions, you notice Claude Code sometimes follows these conventions and sometimes uses generic try/catch blocks with string messages. The inconsistency appears random across different coding sessions. What&#x27;s the most efficient first diagnostic step?"},"options":[{"k":"A","t":{"en":"Run /memory to check which memory files are loaded and verify your CLAUDE.md is included."}},{"k":"B","t":{"en":"Create path-specific rules in claude/rules/handlers.md with YAML frontmatter scoping the error handling instructions to your API handler files."}},{"k":"C","t":{"en":"Add more detailed code examples to your CLAUDE.md showing the exact ApiError usage pattern for different endpoint types."}},{"k":"D","t":{"en":"Search for conflicting instructions in ~/.claude/CLAUDE.md or ~/.claude/rules/ that might override your project conventions."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Hành vi không nhất quán giữa các session gợi ý rằng <b>CLAUDE.md có thể không được nạp</b> ổn định (ví dụ khởi chạy từ thư mục khác). Bước chẩn đoán đầu tiên, rẻ và nhanh nhất là chạy <b><code>/memory</code></b> để xem các file memory nào đang được nạp và xác nhận CLAUDE.md của dự án có trong đó — kiểm tra giả thuyết trước khi thay đổi cấu hình.","elim":["<b>B.</b> Tạo rules theo đường dẫn là một giải pháp, không phải bước chẩn đoán; nếu nguyên nhân là file không được nạp thì vẫn chưa xác định được.","<b>C.</b> Thêm ví dụ vào CLAUDE.md là vô ích nếu chính file đó không được nạp trong các session thất bại; đây là sửa khi chưa chẩn đoán.","<b>D.</b> Tìm thủ công chỉ thị xung đột ở cấp người dùng là một giả thuyết hẹp hơn; <code>/memory</code> đã cho thấy toàn bộ các file đang được nạp (bao gồm cả cấp người dùng) trong một bước."]},"cite":"Hướng dẫn ôn tập — §5.8 Lệnh /memory; Lĩnh vực 3.1"},{"id":"t1q121","n":121,"topic":1,"type":"mcq","stem":{"en":"Your CI pipeline performs security-focused code reviews on approximately 50 PRs daily, currently costing $150/day using the synchronous API. Reviews are non-blocking—developers merge after tests pass and address findings in follow-up commits. You&#x27;re evaluating the Message Batches API for its 50% cost reduction. What factor most determines whether batch processing is appropriate for this use case?"},"options":[{"k":"A","t":{"en":"Whether you can structure each review as a single request without multi-turn refinement."}},{"k":"B","t":{"en":"Whether your result processing can handle reviews arriving in a different order than submitted."}},{"k":"C","t":{"en":"Whether reducing per-review latency from 30-60 seconds to near-instant matters for your workflow."}},{"k":"D","t":{"en":"Whether review feedback arriving up to 24 hours after PR creation remains actionable."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Message Batches API giảm 50% chi phí nhưng <b>thời gian xử lý lên tới 24 giờ</b> và <b>không có SLA độ trễ</b>. Vì vậy yếu tố quyết định là liệu <b>phản hồi review đến muộn tới 24 giờ sau khi tạo PR có còn hữu ích</b> hay không. Review ở đây không chặn merge và lỗi được xử lý ở commit tiếp theo, nên đây là câu hỏi then chốt để đánh giá tính phù hợp.","elim":["<b>A.</b> Cấu trúc thành một request đơn lượt là ràng buộc kỹ thuật (Batch không hỗ trợ tool nhiều lượt) nhưng một review bảo mật vốn đã là một request đơn; không phải yếu tố quyết định.","<b>B.</b> Thứ tự kết quả được xử lý dễ dàng bằng <code>custom_id</code>; đây là chi tiết triển khai đơn giản, không phải yếu tố quyết định.","<b>C.</b> Batch API không giảm độ trễ mà ngược lại làm tăng độ trễ; tiền đề của phương án này sai."]},"cite":"Hướng dẫn ôn tập — §7.2 Khi nào dùng Batch API so với Synchronous API; Lĩnh vực 4.5"},{"id":"t1q122","n":122,"topic":1,"type":"mcq","stem":{"en":"After a 40-minute session helping plan a dinner party, the conversation has grown to 78,000 tokens. The history includes: (1) the user mentioning a guest has a severe shellfish allergy, (2) measurements for scaling recipes to 8 servings, (3) the user&#x27;s clarification that &quot;room temperature butter&quot; means 68°F in their kitchen, and (4) general back-and-forth about meal timing and presentation. You need to implement context management before the window limit is reached. What approach best balances information preservation with token reduction?"},"options":[{"k":"A","t":{"en":"Store the full conversation externally and use semantic search to retrieve relevant portions for each turn, loading only matching segments into context."}},{"k":"B","t":{"en":"Implement a sliding window retaining only the most recent 20,000 tokens relying on users to re-state important information when relevant."}},{"k":"C","t":{"en":"Summarize the entire conversation history into a concise summary capturing main topics discussed, then append new messages going forward."}},{"k":"D","t":{"en":"Extract critical structured data (allergies, serving counts, user-defined terms) into a compact reference section, summarize general discussion, and retain recent exchanges verbatim."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Các loại thông tin cần cách xử lý khác nhau. Dữ liệu <b>then chốt, chính xác</b> — dị ứng hải sản nghiêm trọng (an toàn), số khẩu phần, định nghĩa riêng “bơ nhiệt độ phòng = 68°F” — phải được <b>trích xuất thành khối tham chiếu có cấu trúc</b> để không bao giờ bị tóm tắt làm mất. Thảo luận chung (thời gian, trình bày) có thể tóm tắt, và các trao đổi gần đây giữ nguyên văn để giữ mạch hội thoại. Đây là cân bằng tối ưu giữa bảo toàn thông tin và giảm token.","elim":["<b>A.</b> Tìm kiếm ngữ nghĩa chỉ nạp đoạn khớp với lượt hiện tại; thông tin như dị ứng có thể không được truy xuất khi câu hỏi không nhắc rõ tới nó — rủi ro an toàn.","<b>B.</b> Cửa sổ trượt 20.000 token sẽ đánh rơi dị ứng và định nghĩa riêng nêu từ sớm; dựa vào người dùng nhắc lại là không đáng tin cậy.","<b>C.</b> Tóm tắt toàn bộ thành “các chủ đề chính” chính là rủi ro tóm tắt tiệm tiến: số liệu (8 khẩu phần, 68°F) và chi tiết quan trọng dễ bị mất."]},"cite":"Hướng dẫn ôn tập — §11.1 Trích xuất các Sự kiện ra một Block Riêng; Lĩnh vực 5.1"},{"id":"t1q123","n":123,"topic":1,"type":"mcq","stem":{"en":"Your resource allocation tool returns a simple acknowledgment message after provisioning is requested. Users frequently approve allocations and immediately ask &quot;how much did that cost?&quot; or &quot;which project was that?&quot; - indicating they confirmed without understanding the request. What tool design change would most effectively address this?"},"options":[{"k":"A","t":{"en":"Return structured data including cost estimate, target project, resource specifications, and impact summary in the tool response"}},{"k":"B","t":{"en":"Implement a 60-second hold before execution completes, allowing users time to review pending allocations and cancel if needed"}},{"k":"C","t":{"en":"Add a user_acknowledged: boolean parameter that must be set true, with instructions for the agent to only set it after the user explicitly confirms they reviewed the details"}},{"k":"D","t":{"en":"Add a detail_level parameter with options &quot;minimal&quot; or &quot;comprehensive&quot; that controls how much context the agent presents in confirmations"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Người dùng phê duyệt mà không hiểu vì tool chỉ trả về một xác nhận đơn giản, nên agent <b>không có thông tin để trình bày</b>. Tool nên trả về <b>dữ liệu có cấu trúc</b>: ước tính chi phí, dự án đích, thông số tài nguyên và tóm tắt tác động. Agent nhờ đó có đủ chi tiết để giải thích rõ cho người dùng, và các câu hỏi “tốn bao nhiêu?” hay “dự án nào?” được trả lời ngay trong luồng.","elim":["<b>B.</b> Thời gian chờ 60 giây không cung cấp thêm thông tin; người dùng vẫn không biết chi phí hay dự án để quyết định hủy.","<b>C.</b> Cờ <code>user_acknowledged</code> chỉ là thủ tục — người dùng vẫn xác nhận mà không có chi tiết, và agent tự đặt cờ nên không có bảo đảm thật.","<b>D.</b> Tham số <code>detail_level</code> thêm độ phức tạp và có thể chọn “minimal”; vấn đề gốc là tool không trả về dữ liệu chi tiết để trình bày."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q124","n":124,"topic":1,"type":"mcq","stem":{"en":"Your search products tool queries an external catalog API that returns paginated results (50 items per request). Production logs show queries frequently match 200+ products, and the design that auto-fetches all pages causes 15-20 second delays. How should you redesign the pagination handling?"},"options":[{"k":"A","t":{"en":"Return the first page with total match count and cursor for additional pages."}},{"k":"B","t":{"en":"Implement server-side relevance ranking and return only the top 50 most relevant items."}},{"k":"C","t":{"en":"Create separate search products and fetch more results tools for pagination."}},{"k":"D","t":{"en":"Add a max pages parameter (default: 2) that controls how many pages are fetched internally."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Vấn đề là tool tự động kéo <b>toàn bộ</b> các trang (200+ sản phẩm = 4–5 lần gọi API tuần tự) gây trễ 15–20 giây, trong khi agent thường chỉ cần vài kết quả đầu. Thiết kế đúng là <b>phân trang theo cursor</b>: trả về trang đầu tiên kèm <b>tổng số kết quả khớp</b> và <b>cursor</b> cho trang tiếp theo. Tổng số giúp agent biết còn bao nhiêu dữ liệu, còn cursor cho phép agent <b>tự quyết định</b> có cần lấy thêm hay không — độ trễ chỉ phát sinh khi thực sự cần. Đây là mẫu chuẩn cho tool trả về tập kết quả lớn: kết quả gọn, giàu tín hiệu và có đường để mở rộng.","elim":["<b>B.</b> Chỉ trả 50 mục “liên quan nhất” làm mất hẳn khả năng truy cập các kết quả còn lại và agent không biết còn bao nhiêu kết quả bị cắt; việc xây ranking phía server cũng vượt quá phạm vi bài toán độ trễ.","<b>C.</b> Tách thành hai tool riêng làm tăng số tool và tạo chồng lấp ngữ nghĩa không cần thiết; cùng mục tiêu đạt được gọn hơn bằng một tham số cursor trên chính tool search.","<b>D.</b> Giới hạn cứng <code>max_pages</code> = 2 vẫn auto-fetch 2 trang (độ trễ giảm nhưng không biến mất) và cắt im lặng dữ liệu phía sau mà agent không hề biết còn kết quả khác."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q125","n":125,"topic":1,"type":"mcq","stem":{"en":"Your MCP server implements a check_availability tool that queries an external calendar API. During testing, you encounter three error conditions: (1) the tool is called with a malformed request, missing the required user_email parameter (2) the calendar API returns a 404 because the specified user doesn&#x27;t exist in the calendar system (3) the calendar API returns a 503 because the service is temporarily unavailable. How should each error be reported according to MCP&#x27;s error handling design?"},"options":[{"k":"A","t":{"en":"Report error 1 as a JSON-RPC protocol error, report errors 2 and 3 as tool results with isError: true"}},{"k":"B","t":{"en":"Report errors 1 and 2 as JSON-RPC protocol errors, report error 3 as a tool result with isError: true"}},{"k":"C","t":{"en":"Report all three as tool results with isError: true"}},{"k":"D","t":{"en":"Report all three as JSON-RPC protocol errors."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> MCP phân biệt hai loại lỗi: <b>lỗi giao thức (JSON-RPC error)</b> dành cho yêu cầu không hợp lệ ở tầng giao thức — tool không tồn tại, tham số sai/thiếu theo inputSchema — và <b>lỗi thực thi tool</b> được trả về như một kết quả bình thường với <code>isError: true</code>. Lỗi (1) thiếu tham số bắt buộc <code>user_email</code> là request sai định dạng ⇒ JSON-RPC error. Lỗi (2) 404 và (3) 503 xảy ra <b>trong lúc tool thực thi</b> khi gọi API bên ngoài ⇒ trả về tool result với <code>isError: true</code>, để model <b>nhìn thấy</b> lỗi và quyết định (báo người dùng sai email, hoặc retry vì 503 là lỗi tạm thời).","elim":["<b>B.</b> Lỗi 404 “user không tồn tại” là kết quả nghiệp vụ phát sinh khi tool đã chạy, không phải lỗi giao thức; đẩy nó thành JSON-RPC error khiến model không nhận được thông tin để phản hồi người dùng hợp lý.","<b>C.</b> Request thiếu tham số bắt buộc vi phạm schema ở tầng giao thức, nên theo thiết kế MCP được báo bằng JSON-RPC error chứ không phải tool result.","<b>D.</b> Lỗi API 404/503 là lỗi thực thi; báo chúng thành JSON-RPC error làm model mất ngữ cảnh lỗi (loại lỗi, có thể retry hay không) cần cho việc phục hồi."]},"cite":"Hướng dẫn ôn tập — §4.4 Cờ isError trong MCP; Lĩnh vực 2.2"},{"id":"t1q126","n":126,"topic":1,"type":"mcq","stem":{"en":"Your system has been running for 3 weeks and human reviewers have corrected 847 extractions. Analysis reveals a recurring pattern: when recipes use informal measurements like &quot;a handful&quot; or &quot;a splash,&quot; the model either invents specific amounts or leaves fields empty—accounting for 23% of all corrections. How should you use this feedback to improve extraction accuracy?"},"options":[{"k":"A","t":{"en":"Add few-shot examples to your prompt demonstrating correct handling of informal measurements— extracting them verbatim rather than converting or omitting them."}},{"k":"B","t":{"en":"Fine-tune the model on the 847 corrected extractions."}},{"k":"C","t":{"en":"Implement a post-processing layer that uses pattern matching to detect informal measurement phrases in source text and automatically populate values when the extraction is empty."}},{"k":"D","t":{"en":"Update your JSON schema to add a &quot;measurement_type&quot; enum field (precise/informal)."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Phân tích phản hồi đã chỉ ra một <b>mẫu lỗi lặp lại cụ thể</b> (23% số sửa): với đơn vị đo không chính thức như “a handful”, model hoặc bịa ra số lượng hoặc bỏ trống. Cách khắc phục trực tiếp nhất là thêm <b>few-shot examples</b> minh họa đúng hành vi mong muốn — <b>trích xuất nguyên văn</b> (“a handful”) thay vì quy đổi hay bỏ qua. Few-shot là kỹ thuật hiệu quả nhất để truyền đạt cách xử lý các trường hợp mơ hồ/edge case một cách nhất quán, và có thể triển khai ngay mà không cần huấn luyện lại.","elim":["<b>B.</b> Fine-tune trên 847 mẫu tốn kém, chậm, khó cập nhật, trong khi lỗi là một mẫu cụ thể có thể sửa ngay bằng prompt; đây là giải pháp quá nặng so với vấn đề.","<b>C.</b> Hậu xử lý bằng pattern matching chỉ vá triệu chứng (điền giá trị khi trường rỗng), không sửa được trường hợp model đã bịa số cụ thể, và regex dễ bỏ sót cách diễn đạt mới.","<b>D.</b> Thêm enum <code>measurement_type</code> chỉ gắn nhãn loại đo, không hướng dẫn model phải ghi giá trị thế nào — model vẫn có thể bịa số hoặc bỏ trống."]},"cite":"Hướng dẫn ôn tập — §6.1 Few-shot Prompting; Lĩnh vực 4.2"},{"id":"t1q127","n":127,"topic":1,"type":"mcq","stem":{"en":"&quot;You&#x27;re the Lead Data Scientist/Engineer on a critical project. Something is not completely right with technical details or the data, and it negative impacts expected outputs. They need to independently develop both approaches to evaluation data... How do you manage this scenario?&quot;"},"options":[{"k":"A","t":{"en":"Export the analysis session&#x27;s key findings to a file, then create two new sessions that reference this file."}},{"k":"B","t":{"en":"Continue in the original session, developing end-to-end tests first, then snapshot tests sequentially."}},{"k":"C","t":{"en":"Resume the analysis session with fork_session enabled, creating a separate branch for each testing strategy."}},{"k":"D","t":{"en":"Start two fresh sessions, having each re-read the relevant source files before beginning."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Tình huống: một session phân tích đã tích lũy hiểu biết sâu về codebase/dữ liệu, giờ cần phát triển <b>hai hướng kiểm thử độc lập</b>. <code>fork_session</code> khi resume tạo ra <b>các nhánh mới kế thừa toàn bộ context</b> của session phân tích, nhưng sau đó mỗi nhánh tiến triển độc lập, không làm “nhiễm” lẫn nhau. Nhờ vậy không phải phân tích lại từ đầu và hai chiến lược không ảnh hưởng nhau — đúng mục đích của forking: khám phá các phương án thay thế từ một baseline chung.","elim":["<b>A.</b> Xuất findings ra file rồi mở session mới chỉ giữ được bản tóm tắt, mất đi phần lớn context chi tiết đã tích lũy; <code>fork_session</code> giữ trọn context mà không cần bước trung gian.","<b>B.</b> Làm tuần tự trong cùng session khiến hai hướng không còn độc lập — cách tiếp cận đầu ảnh hưởng tới cách thứ hai và context ngày càng phình to.","<b>D.</b> Hai session mới phải đọc lại file từ đầu, lãng phí thời gian/token và đánh mất các phát hiện phân tích đã có."]},"cite":"Hướng dẫn ôn tập — §5.10 fork_session và Quản lý Session; Lĩnh vực 1.7"},{"id":"t1q128","n":128,"topic":1,"type":"mcq","stem":{"en":"Your automated reviewer uses a single prompt covering security issues, API design, and business logic correctness. Your evaluation suite shows strong recall findings (82%) but poor recall for business logic edge cases in quiz scoring (34%). When you add few-shot examples of logic bugs to the prompt, logic recall is 41% but API design recall drops to 68%. How should you address this trade-off to improve detection across both categories?"},"options":[{"k":"A","t":{"en":"Replace the few-shot examples with a detailed checklist of specific logic edge cases to verify, such as division-by-zero in score calculation or grading thresholds."}},{"k":"B","t":{"en":"Split the review into separate focused prompts - one for security and API design, another for business logic - each with dedicated examples, then combine findings before posting."}},{"k":"C","t":{"en":"Provide the full repository as context instead of just the changed files and surrounding code, giving the model deeper visibility into business logic."}},{"k":"D","t":{"en":"Upgrade to a more capable model tier, since its stronger reasoning will handle both concern types in a single prompt and eliminate the recall trade-off."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Dữ liệu cho thấy một <b>trade-off do pha loãng sự chú ý</b>: nhồi thêm ví dụ logic vào một prompt duy nhất làm tăng recall logic (34%→41%) nhưng kéo recall API design xuống (82%→68%). Khi các mối quan tâm cạnh tranh trong một prompt, giải pháp là <b>tách thành các lượt review tập trung</b> — một prompt cho security/API design, một prompt cho business logic — mỗi prompt có <b>ví dụ riêng</b>, rồi gộp kết quả trước khi đăng. Mỗi lượt có toàn bộ “sự chú ý” cho phạm vi của mình nên cải thiện được cả hai loại mà không đánh đổi.","elim":["<b>A.</b> Thay few-shot bằng checklist vẫn giữ mọi mối quan tâm trong một prompt, nên vấn đề cạnh tranh sự chú ý giữa các loại lỗi vẫn còn nguyên.","<b>C.</b> Đưa toàn bộ repository vào context còn làm pha loãng sự chú ý nặng hơn và tăng chi phí; vấn đề không phải thiếu thông tin mà là prompt ôm quá nhiều mục tiêu.","<b>D.</b> Nâng cấp model là giải pháp chung chung, tốn kém và không có gì bảo đảm loại bỏ trade-off mang tính cấu trúc của một prompt đa mục tiêu."]},"cite":"Hướng dẫn ôn tập — §8.3 Code Review nhiều lượt (Multi-pass); Lĩnh vực 4.6"},{"id":"t1q129","n":129,"topic":1,"type":"mcq","stem":{"en":"Your code review assistant needs to analyze pull requests and provide feedback on three aspects: code style compliance, potential security issues, and documentation completeness. Each aspect requires reading files, running analysis tools, and generating a report section. The review process follows the same three-step workflow for every PR. Which task decomposition pattern is most appropriate for this workflow?"},"options":[{"k":"A","t":{"en":"Prompt chaining—break the review into sequential steps where each aspect (style, security, documentation) is analyzed separately, with outputs combined in a final synthesis step."}},{"k":"B","t":{"en":"Single comprehensive prompt—include all instructions in one prompt and let the model handle all three aspects simultaneously."}},{"k":"C","t":{"en":"Orchestrator-workers—have a central LLM analyze each PR to dynamically determine which checks are needed, then delegate to specialized worker LLMs for each identified subtask."}},{"k":"D","t":{"en":"Routing—classify each PR by type (feature, bugfix, refactor) first, then route to different review prompts optimized for that category."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Workflow có <b>cấu trúc cố định, dự đoán được</b>: cùng ba khía cạnh (style, security, documentation) cho <b>mọi PR</b>. Đây đúng là trường hợp của <b>prompt chaining / pipeline cố định</b> — chia thành các bước tuần tự, mỗi bước tập trung vào một khía cạnh, rồi có bước tổng hợp cuối. Mỗi bước được tối ưu riêng, dễ debug và kiểm thử, và không cần LLM “quyết định” cần làm gì vì các bước đã biết trước.","elim":["<b>B.</b> Một prompt ôm cả ba khía cạnh (mỗi khía cạnh lại cần đọc file, chạy tool, viết báo cáo) dễ gây pha loãng sự chú ý và bỏ sót, đồng thời khó debug khi một phần kém chất lượng.","<b>C.</b> Orchestrator-workers phù hợp khi các subtask <b>không biết trước</b> và phải xác định động; ở đây ba bước luôn cố định nên thêm lớp điều phối động chỉ tăng độ phức tạp và chi phí.","<b>D.</b> Routing theo loại PR không phù hợp vì mọi PR đều cần đủ cả ba khía cạnh review như nhau, bất kể là feature, bugfix hay refactor."]},"cite":"Hướng dẫn ôn tập — §8.1 Pipeline cố định (Prompt Chaining); Lĩnh vực 1.6"},{"id":"t1q130","n":130,"topic":1,"type":"mcq","stem":{"en":"After the web search and document analysis subagents complete their tasks, the coordinator needs to spawn the synthesis subagent to synthesize the findings. What is the correct approach for providing the synthesis subagent with the information it needs?"},"options":[{"k":"A","t":{"en":"Provide the subagent with tool definitions that allow it to request outputs from other subagents via callbacks"}},{"k":"B","t":{"en":"Pass reference identifiers and configure the subagent with read access to a shared memory store where other subagents deposited their results"}},{"k":"C","t":{"en":"Include the complete findings from both subagents directly in the synthesis subagent&#x27;s prompt"}},{"k":"D","t":{"en":"Spawn the subagent with only a brief task description, relying on automatic context inheritance from the coordinator"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Subagent <b>không kế thừa</b> context của coordinator hay của các subagent khác — nó chỉ biết những gì có trong prompt được truyền qua tool <code>Task</code>. Vì vậy coordinator phải <b>đưa đầy đủ findings của cả hai subagent trực tiếp vào prompt</b> của subagent tổng hợp (kèm nguồn/trích dẫn để giữ provenance). Đây là cách đơn giản, tường minh và đúng với mô hình hub-and-spoke: mọi dữ liệu đi qua coordinator.","elim":["<b>A.</b> Subagent không thể “gọi ngược” sang các subagent khác qua callback — trong mô hình hub-and-spoke mọi giao tiếp đi qua coordinator, và các subagent kia đã hoàn tất.","<b>B.</b> Kho bộ nhớ dùng chung kèm reference ID là thêm hạ tầng không cần thiết và tạo luồng dữ liệu ngầm vòng qua coordinator; cách khuyến nghị là truyền trực tiếp kết quả trong prompt của subagent.","<b>D.</b> Không có cơ chế kế thừa context tự động từ coordinator; mô tả nhiệm vụ ngắn gọn khiến subagent tổng hợp không có findings nào để tổng hợp."]},"cite":"Hướng dẫn ôn tập — §3.4 Tool Task để Sinh ra Subagent; Lĩnh vực 1.3"},{"id":"t1q131","n":131,"topic":1,"type":"mcq","stem":{"en":"Developer Productivity An engineer asks the agent to find all files in the monorepo that import the @company/auth package to understand how authentication is used across services. Which built-in tool is most appropriate for this task?"},"options":[{"k":"A","t":{"en":"Bash, to execute find . -type d -name &quot;<i>auth</i>&quot; and explore matching directories"}},{"k":"B","t":{"en":"Grep, to search for the import statement pattern across file contents"}},{"k":"C","t":{"en":"Read, starting with package.json files to trace dependency declarations"}},{"k":"D","t":{"en":"Glob, to find files with &quot;auth&quot; in their filename or path"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Yêu cầu là tìm các file có <b>nội dung</b> chứa câu lệnh import <code>@company/auth</code>. <b>Grep</b> là tool tích hợp sẵn chuyên tìm kiếm <b>trong nội dung file</b> (tên hàm, thông báo lỗi, import), quét toàn bộ monorepo nhanh và trả về đúng danh sách file sử dụng package. Đây cũng là bước khởi đầu chuẩn của chiến lược điều tra tăng dần: Grep tìm điểm sử dụng, rồi Read các file cần đọc sâu.","elim":["<b>A.</b> <code>find -type d -name auth</code> tìm thư mục tên “auth”, không liên quan đến việc file nào import package; vừa sai mục tiêu vừa dùng Bash thay cho tool chuyên dụng.","<b>C.</b> <code>package.json</code> chỉ cho biết package nào khai báo dependency, không chỉ ra file mã nguồn cụ thể nào import nó; đọc lần lượt từng file cũng tốn context.","<b>D.</b> Glob khớp theo tên/đường dẫn file, trong khi file import <code>@company/auth</code> có thể mang bất kỳ tên nào — Glob không nhìn vào nội dung."]},"cite":"Hướng dẫn ôn tập — §13.1 Tham chiếu Lựa chọn Tool; Lĩnh vực 2.5"},{"id":"t1q132","n":132,"topic":1,"type":"mcq","stem":{"en":"Your MCP server includes archive_file(file_id) and delete_file(file_id) tools. Production logs show the agent calls delete_file when users ask to &quot;remove old backups,&quot; policy requires archiving backup files. Both tools currently have minimal descriptions: &quot;Archives a file&quot; and &quot;Deletes a file.&quot; Which change most directly improves tool selection?"},"options":[{"k":"A","t":{"en":"Implement server-side validation that rejects delete_file calls for files tagged as backups, returning an error message suggesting archive_file."}},{"k":"B","t":{"en":"Add few-shot examples to the system prompt demonstrating that requests involving &quot;backup&quot; or &quot;old&quot; should use archive_file."}},{"k":"C","t":{"en":"Expand tool descriptions to clarify use cases, adding guidance like &quot;Do not use for backup files&quot; to delete_file."}},{"k":"D","t":{"en":"Add a confirmation step that requires users to type &quot;CONFIRM DELETE&quot; before delete_file executes."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> <b>Mô tả tool là cơ chế chính</b> để LLM chọn tool. Hai mô tả tối thiểu “Archives a file” / “Deletes a file” không cho model biết khi nào dùng cái nào, nên với yêu cầu “remove old backups” nó chọn delete theo nghĩa đen. Mở rộng mô tả để nêu rõ <b>trường hợp sử dụng và ranh giới</b> (ví dụ thêm “Do not use for backup files — use archive_file” vào <code>delete_file</code>) giải quyết <b>trực tiếp</b> nguyên nhân gốc của việc chọn sai tool.","elim":["<b>A.</b> Validation phía server là lớp bảo vệ hữu ích nhưng chỉ chặn sau khi model đã chọn sai; nó không cải thiện việc <b>lựa chọn</b> tool mà câu hỏi yêu cầu.","<b>B.</b> Few-shot dựa trên từ khóa “backup”/“old” dễ gây liên tưởng sai (ví dụ file “old” không phải backup) và kém trực tiếp hơn việc sửa chính mô tả tool mà model dùng để chọn.","<b>D.</b> Bắt người dùng gõ “CONFIRM DELETE” thêm ma sát và không sửa việc agent chọn sai tool; người dùng vẫn có thể xác nhận một thao tác vi phạm chính sách."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q133","n":133,"topic":1,"type":"mcq","stem":{"en":"Your CRM agent&#x27;s delete_contact tool handles requests like &quot;delete the duplicate entry for Acme Corp.&quot; The database contains similarly named records (e.g., &quot;Acme Corp,&quot; &quot;Acme Corporation,&quot; &quot;ACME Corp Inc.&quot;), and analytics show 8% of deletions are reversed within 24 hours due to misidentified records. Users have also complained that the current multi-step confirmation flow adds too much friction to routine cleanup tasks. Which approach most effectively reduces the error rate while maintaining workflow efficiency?"},"options":[{"k":"A","t":{"en":"Require users to supply the exact record ID from the CRM Interface rather than using natural language references to contact names."}},{"k":"B","t":{"en":"Implement soft-delete with a 30-day recovery window so users can undo mistakes without slowing down the deletion workflow."}},{"k":"C","t":{"en":"Deploy automated duplicate detection that identifies and merges probable duplicates, removing the need for manual deletion requests."}},{"k":"D","t":{"en":"Present matched records with differentiating fields and require single-click confirmation of the intended target before executing deletion."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Nguyên nhân lỗi là <b>sự mơ hồ</b> giữa các bản ghi tên gần giống nhau (“Acme Corp”, “Acme Corporation”, “ACME Corp Inc.”). Hiển thị các bản ghi khớp kèm <b>các trường phân biệt</b> (địa chỉ, email, ngày tạo, ID…) giúp người dùng nhận ra đúng bản ghi, và chỉ cần <b>một cú click xác nhận</b> mục tiêu trước khi xóa. Cách này xử lý tận gốc việc nhận diện sai, đồng thời thay quy trình xác nhận nhiều bước bằng một bước nhẹ — cân bằng giữa độ chính xác và hiệu quả.","elim":["<b>A.</b> Bắt người dùng tự tra và nhập record ID làm tăng ma sát đáng kể, đi ngược yêu cầu duy trì hiệu quả cho các tác vụ dọn dẹp thường xuyên.","<b>B.</b> Soft-delete chỉ giúp khôi phục sau khi đã xóa nhầm, không làm giảm tỷ lệ nhận diện sai (8%) — lỗi vẫn xảy ra, chỉ dễ sửa hơn.","<b>C.</b> Tự động phát hiện và merge bản ghi trùng là thay đổi lớn, rủi ro merge nhầm chính các bản ghi tên gần giống, và không giải quyết yêu cầu xóa có chủ đích của người dùng."]},"cite":"Hướng dẫn ôn tập — §9.2 Các mẫu Escalation; Lĩnh vực 5.2"},{"id":"t1q134","n":134,"topic":1,"type":"mcq","stem":{"en":"Your team is extracting structured data from 50,000 legacy legal contracts under a two-week deadline. Initial testing with 500 sample documents shows 82% pass JSON schema first attempt, while the remaining 18% fall due to diverse issues—missing required fields, malformed dates, and incorrectly identified parties. Documents that fail typically need refinements targeting their specific failure modes. What&#x27;s the most effective processing strategy?"},"options":[{"k":"A","t":{"en":"Use the real-time API for all 50,000 documents since the batch API&#x27;s 24-hour processing window creates unacceptable deadline risk."}},{"k":"B","t":{"en":"Submit all 50,000 documents via batch API, then submit failed extractions in successive batches— refining prompts between each batch—until all documents pass validation."}},{"k":"C","t":{"en":"Split documents into 10 sequential batches of 5,000 each, analysing results and refining prompts between batches to improve extraction quality progressively."}},{"k":"D","t":{"en":"Process 2,000 sample documents via real time API to identify failure patterns and refine prompts, then batch process all 50,000 with the optimized prompts."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Với 50.000 tài liệu không cần phản hồi tức thì, <b>Message Batches API</b> là lựa chọn phù hợp: tiết kiệm 50% chi phí, cửa sổ xử lý tối đa 24 giờ — hoàn toàn nằm trong hạn 2 tuần. 82% tài liệu sẽ qua ngay lượt đầu; 18% còn lại lỗi do <b>nhiều nguyên nhân đa dạng</b>, cần tinh chỉnh prompt theo từng kiểu lỗi. Vì vậy chỉ <b>gửi lại các tài liệu thất bại</b> (nhận diện qua <code>custom_id</code>) trong các batch kế tiếp, tinh chỉnh prompt giữa mỗi vòng, cho tới khi tất cả qua validation — vừa tối ưu chi phí vừa xử lý được đuôi lỗi đa dạng.","elim":["<b>A.</b> Dùng API đồng bộ cho toàn bộ 50.000 tài liệu bỏ mất mức tiết kiệm 50%; cửa sổ 24 giờ của batch không phải rủi ro với hạn 2 tuần, đủ cho nhiều vòng batch.","<b>C.</b> Chia 10 batch tuần tự và tinh chỉnh giữa các batch xử lý lại cả các tài liệu vốn đã thành công với prompt cũ, kéo dài thời gian không cần thiết thay vì chỉ nhắm vào phần thất bại.","<b>D.</b> Đã có kết quả thử nghiệm trên 500 mẫu; lỗi đa dạng ở phần đuôi khó được phát hiện hết bằng mẫu 2.000 tài liệu, nên vẫn cần cơ chế xử lý lại các tài liệu thất bại sau batch chính."]},"cite":"Hướng dẫn ôn tập — §7.4 Xử lý các thất bại trong Batch; Lĩnh vực 4.5"},{"id":"t1q135","n":135,"topic":1,"type":"mcq","stem":{"en":"After deploying an updated system prompt that improves response quality, users with multi-session conversations spanning several weeks report that the assistant now contradicts its earlier statements and has a noticeably different communication style. New users don&#x27;t experience these issues. What&#x27;s the best approach to resolve this?"},"options":[{"k":"A","t":{"en":"Regenerate summaries of existing conversations using the new prompt and replace the stored histories to align past context with current behavior."}},{"k":"B","t":{"en":"Add instructions to the new system prompt directing the assistant to maintain consistency with any prior statements in the conversation history."}},{"k":"C","t":{"en":"Add a transition message when sessions resume explaining that the assistant has been updated and behavior may differ."}},{"k":"D","t":{"en":"Version system prompts and associate each conversation with the prompt version under which it started, applying updates only to new conversations."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Chỉ những hội thoại <b>bắt đầu dưới system prompt cũ</b> bị ảnh hưởng: lịch sử của chúng được tạo theo hành vi/giọng điệu cũ, nay bị system prompt mới “ghi đè” nên sinh ra mâu thuẫn. Giải pháp tận gốc là <b>quản lý phiên bản system prompt</b> và gắn mỗi hội thoại với phiên bản mà nó bắt đầu, chỉ áp dụng bản cập nhật cho <b>hội thoại mới</b>. Cách này giữ tính nhất quán cho người dùng cũ mà người dùng mới vẫn hưởng chất lượng cải tiến.","elim":["<b>A.</b> Viết lại tóm tắt và thay thế lịch sử đã lưu làm sai lệch những gì người dùng thực sự đã thấy/được nói, có thể gây mất thông tin và vẫn tạo ra mâu thuẫn với trí nhớ của người dùng.","<b>B.</b> Chỉ dẫn “giữ nhất quán với phát ngôn trước” mâu thuẫn trực tiếp với các thay đổi hành vi trong chính system prompt mới; chỉ là ràng buộc mềm, không loại bỏ xung đột gốc.","<b>C.</b> Thông báo “đã được cập nhật” chỉ giải thích sự không nhất quán chứ không khắc phục nó; trải nghiệm người dùng vẫn bị gián đoạn."]},"cite":"Hướng dẫn ôn tập — §1.4 System Prompt"},{"id":"t1q136","n":136,"topic":1,"type":"mcq","stem":{"en":"Evaluation shows 94% extraction accuracy on short meeting transcripts (&lt;30 minutes) but only 68% on longer transcripts (&gt;60 minutes) where discussions meander and key information is scattered throughout. Transcripts of both lengths fit within the model&#x27;s context window. What pattern most effectively improves accuracy on complex, lengthy documents?"},"options":[{"k":"A","t":{"en":"Add few-shot examples demonstrating correct extraction from lengthy meetings with scattered Information."}},{"k":"B","t":{"en":"Upgrade to a more capable model tier for the extraction task"}},{"k":"C","t":{"en":"Split lengthy transcripts Into chunks, extract from each chunk separately, then merge and deduplicate the results."}},{"k":"D","t":{"en":"Add a pre-extraction step where the model summarizes key discussions and conclusions before performing structured extraction."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Cả hai độ dài đều <b>vừa context window</b>, nên vấn đề không phải giới hạn token mà là <b>pha loãng sự chú ý</b>: với transcript dài, lan man, thông tin then chốt rải rác khắp nơi và dễ bị bỏ sót (hiệu ứng “lost in the middle”). Chia transcript thành các <b>chunk</b>, trích xuất từng chunk riêng để mỗi lượt model tập trung vào một đoạn ngắn — tương tự mức 94% của transcript ngắn — rồi <b>gộp và loại trùng</b> kết quả. Đây là mẫu phân rã đa lượt thường dùng cho tài liệu dài, phức tạp.","elim":["<b>A.</b> Few-shot với transcript dài bản thân rất tốn token và không giải quyết việc model phải chú ý cùng lúc cả một tài liệu dài với thông tin rải rác.","<b>B.</b> Nâng cấp model là giải pháp chung chung, tốn kém, không xử lý cấu trúc của vấn đề pha loãng sự chú ý trên tài liệu dài.","<b>D.</b> Tóm tắt trước khi trích xuất là bước <b>làm mất thông tin</b> — chi tiết rải rác dễ bị lược bỏ ngay ở bước tóm tắt, khiến lượt trích xuất sau không còn dữ liệu đó."]},"cite":"Hướng dẫn ôn tập — §11.3 Đầu vào Nhận biết Vị trí; Lĩnh vực 4.6"},{"id":"t1q137","n":137,"topic":1,"type":"mcq","stem":{"en":"You&#x27;re implementing a complex graph traversal algorithm with specific performance requirements and edge cases to handle (disconnected nodes, cycles, weighted edges). You want to structure your workflow for efficient iterative refinement with Claude. What approach will most effectively enable progressive improvement across multiple iterations?"},"options":[{"k":"A","t":{"en":"Have Claude extensively research the algorithm and create a detailed implementation plan using extended thinking, then implement the complete solution based on that plan."}},{"k":"B","t":{"en":"Write a test suite covering expected behavior, edge cases, and performance requirements before implementation. Ask Claude to write code that passes the tests, then iterate by sharing test failures with each refinement request."}},{"k":"C","t":{"en":"Provide Claude with a reference implementation from documentation, then ask it to rewrite the code to match your codebase style and add the required edge case handling, comparing outputs against the reference."}},{"k":"D","t":{"en":"Provide Claude with a detailed natural language specification of the algorithm, including all requirements and edge cases. Review each output manually and provide descriptive feedback on what behavior needs to change."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Với thuật toán có yêu cầu hiệu năng và edge case rõ ràng (node rời rạc, chu trình, cạnh có trọng số), cách lặp hiệu quả nhất là <b>lặp theo hướng test (test-driven iteration)</b>: viết bộ test bao phủ hành vi mong đợi, edge case và yêu cầu hiệu năng <b>trước</b>, yêu cầu Claude viết code để pass, rồi mỗi vòng gửi lại <b>các test thất bại cụ thể</b>. Test cho tín hiệu phản hồi khách quan, chính xác và tự động, giúp mỗi vòng cải tiến có mục tiêu rõ và không làm hỏng các phần đã đúng.","elim":["<b>A.</b> Lập kế hoạch kỹ rồi viết toàn bộ một lần không tạo vòng phản hồi để cải thiện dần; không có tiêu chí khách quan để biết lời giải đã đáp ứng edge case và hiệu năng hay chưa.","<b>C.</b> Viết lại theo một reference implementation phụ thuộc vào việc có sẵn bản tham chiếu phù hợp và chỉ so sánh output, không kiểm chứng hệ thống các yêu cầu hiệu năng/edge case riêng của bạn.","<b>D.</b> Review thủ công và phản hồi bằng lời mô tả là chậm, chủ quan, dễ mơ hồ; không bắt được hồi quy như một bộ test tự động."]},"cite":"Hướng dẫn ôn tập — Lĩnh vực 3.5 Tinh chỉnh Lặp lại để Cải thiện Tiệm tiến"},{"id":"t1q138","n":138,"topic":1,"type":"mcq","stem":{"en":"Your infrastructure-as-code repository includes Terraform modules (/terraform/), Kubernetes manifests (/kubernetes/), and CI/CD pipeline scripts (/pipelines/). Each requires different conventions, but your single root CLAUDE.md has grown to 500+ lines. When developers work on Kubernetes files, Terraform-specific rules load into context unnecessarily, consuming tokens. What is the best approach to reorganize so only relevant guidance loads when editing specific file types?"},"options":[{"k":"A","t":{"en":"Keep the root CLAUDE.md and use @path/to/import syntax to modularly include tool-specific guidance files from separate documents."}},{"k":"B","t":{"en":"Split content into subdirectory CLAUDE.md files (/terraform/CLAUDE.md, /kubernetes/CLAUDE.md), so Claude loads directory-specific guidance."}},{"k":"C","t":{"en":"Restructure the root CLAUDE.md into clearly labeled sections with headers (e.g., &quot;## Terraform Conventions&quot;), improving organization and readability."}},{"k":"D","t":{"en":"Create files in .claude/rules/ with YAML frontmatter path-scoping (e.g., paths: [&quot;terraform/**/*&quot;]), loading rules only when editing matching files."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Mục tiêu là <b>chỉ nạp hướng dẫn liên quan khi chỉnh sửa loại file tương ứng</b>. Các file trong <code>.claude/rules/</code> với frontmatter YAML <code>paths</code> (ví dụ <code>paths: [\"terraform/**/*\"]</code>) chỉ được tải khi Claude làm việc với file khớp mẫu glob, nên quy tắc Terraform không chiếm context khi sửa manifest Kubernetes. Đây là cơ chế <b>tải quy ước có điều kiện</b> được thiết kế đúng cho bài toán tiết kiệm token này, đồng thời tách CLAUDE.md 500+ dòng thành các file theo chủ đề dễ bảo trì.","elim":["<b>A.</b> <code>@import</code> trong root CLAUDE.md vẫn nạp mọi file được import vào mỗi session; chỉ mô-đun hóa cách tổ chức, không giảm token tiêu thụ.","<b>B.</b> CLAUDE.md theo thư mục con gắn với vị trí thư mục làm việc, không theo loại file đang sửa; phương án path-scoped rules kiểm soát chính xác hơn bằng glob và linh hoạt khi quy ước trải qua nhiều thư mục.","<b>C.</b> Chia section bằng header chỉ cải thiện khả năng đọc; toàn bộ 500+ dòng vẫn được nạp vào context mỗi lần."]},"cite":"Hướng dẫn ôn tập — §5.3 Thư mục .claude/rules/; Lĩnh vực 3.3"},{"id":"t1q139","n":139,"topic":1,"type":"mcq","stem":{"en":"After expanding the agent&#x27;s MCP tools with delivery-specific capabilities (check_delivery_status, contact_driver, issue_credit, apply_promo_code, update_delivery_address, reschedule_delivery), the total tool count has grown from 4 to 10. Your evaluation suite shows tool selection accuracy has dropped to 71%. Log analysis reveals the majority of errors involve the agent sele
