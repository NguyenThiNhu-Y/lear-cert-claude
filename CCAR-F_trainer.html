lass=\"kw\">mảng rỗng cho pros/cons</b> là đầu ra hợp lệ, và thêm <b class=\"kw\">&quot;unclear&quot;</b> vào enum sentiment."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Hai lỗi có cùng gốc: schema <b>không có cách hợp lệ để biểu đạt “không có thông tin”</b> nên model buộc phải bịa. (1) Cho phép <b>mảng rỗng</b> cho <code>pros</code>/<code>cons</code> làm output hợp lệ: với “Great product!”, model có thể trả <code>[]</code> thay vì bịa ưu/nhược điểm cụ thể, đồng thời giữ nguyên kiểu mảng nên code phía sau không phải xử lý null. (2) Thêm <code>\"unclear\"</code> vào enum sentiment cho các review mỉa mai/mơ hồ, để model không phải chọn tùy tiện giữa positive/negative/mixed.","elim":["<b>A.</b> Cho phép null với trường mảng tạo hai cách biểu đạt “không có” (null và <code>[]</code>), làm phức tạp xử lý phía sau; mảng rỗng là cách tự nhiên và nhất quán kiểu hơn cho danh sách không có phần tử.","<b>B.</b> Làm pros/cons optional khiến trường có thể vắng mặt hoàn toàn, khó phân biệt “quên trích xuất” với “không có thông tin”; thêm “neutral” không giải quyết vấn đề mỉa mai và chồng lấn với “unclear”.","<b>C.</b> Điểm confidence tự đánh giá thường không được hiệu chỉnh tốt, và lọc bỏ output chỉ loại dữ liệu thay vì sửa schema để model biểu đạt đúng sự thiếu thông tin."]},"cite":"Hướng dẫn ôn tập — §2.4 JSON Schema cho Structured Output; Lĩnh vực 4.3"},{"id":"t1q150","n":150,"topic":1,"type":"mcq","stem":{"en":"Production logs show that when the agent handles complex billing disputes requiring 6+ tool calls, it sometimes <b class=\"kw\">exhausts its max_turns limit</b> after gathering data and before completing resolution or escalating. The team&#x27;s goal is to <b class=\"kw\">guarantee that every customer interaction ends</b> with either a completed resolution or a human escalation, <b class=\"kw\">regardless of how the agent loop terminates</b>. Which approach achieves this guarantee?","vi":"Log production cho thấy khi agent xử lý các tranh chấp thanh toán phức tạp đòi hỏi 6+ tool call, đôi khi nó <b class=\"kw\">dùng hết giới hạn max_turns</b> sau khi thu thập dữ liệu và trước khi hoàn tất việc giải quyết hoặc escalate. Mục tiêu của nhóm là <b class=\"kw\">đảm bảo rằng mọi tương tác với khách hàng</b> đều kết thúc bằng một giải quyết hoàn tất hoặc một escalation lên con người, <b class=\"kw\">bất kể vòng lặp agent kết thúc như thế nào</b>. Cách tiếp cận nào đạt được sự đảm bảo này?"},"options":[{"k":"A","t":{"en":"Add <b class=\"kw\">orchestration-layer code</b> that checks the agent&#x27;s outcome after each loop termination - if the loop ended without a completed resolution or escalation, <b class=\"kw\">programmatically call escalate_to_human</b> with the accumulated conversation context and tool results.","vi":"Thêm <b class=\"kw\">code ở tầng điều phối (orchestration)</b> để kiểm tra kết quả của agent sau mỗi lần vòng lặp kết thúc - nếu vòng lặp kết thúc mà không có giải quyết hoàn tất hoặc escalation, <b class=\"kw\">gọi escalate_to_human bằng code (programmatically)</b> với context hội thoại và kết quả tool đã tích lũy."}},{"k":"B","t":{"en":"Add <b class=\"kw\">system prompt instructions</b> telling the agent to call escalate_to_human with a summary of its findings whenever it determines it cannot resolve the dispute.","vi":"Thêm <b class=\"kw\">hướng dẫn vào system prompt</b> yêu cầu agent gọi escalate_to_human kèm bản tóm tắt các phát hiện của nó bất cứ khi nào nó xác định rằng không thể giải quyết tranh chấp."}},{"k":"C","t":{"en":"Split the workflow into <b class=\"kw\">two sequential agent invocations</b> — a first agent gathers information via get_customer and lookup_order, then the second agent uses that data and handles process_refund or escalate_to_human, each with <b class=\"kw\">separate turn budgets</b>.","vi":"Tách workflow thành <b class=\"kw\">hai lần gọi agent tuần tự</b> — agent thứ nhất thu thập thông tin qua get_customer và lookup_order, sau đó agent thứ hai dùng dữ liệu đó và xử lý process_refund hoặc escalate_to_human, mỗi agent có <b class=\"kw\">ngân sách lượt riêng</b>."}},{"k":"D","t":{"en":"Implement a <b class=\"kw\">pre-tool-use hook</b> that <b class=\"kw\">counts tool invocations</b> and terminates the loop with an automatic escalation once the agent reaches 80% of its remaining actions.","vi":"Triển khai một <b class=\"kw\">hook pre-tool-use</b> <b class=\"kw\">đếm số lần gọi tool</b> và kết thúc vòng lặp bằng một escalation tự động khi agent đạt 80% số hành động còn lại của nó."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Yêu cầu là <b>đảm bảo</b> mọi tương tác đều kết thúc bằng giải quyết xong hoặc escalation, <b>bất kể vòng lặp agent kết thúc thế nào</b> (kể cả khi cạn <code>max_turns</code>). Một đảm bảo như vậy phải nằm <b>ngoài model</b>: code ở tầng điều phối kiểm tra kết quả sau mỗi lần vòng lặp dừng, và nếu chưa có resolution hay escalation thì <b>gọi <code>escalate_to_human</code> bằng code</b>, kèm context hội thoại và kết quả tool đã thu thập. Đây là thực thi deterministic, không phụ thuộc việc model “nhớ” escalate trước khi hết lượt.","elim":["<b>B.</b> Chỉ dẫn trong system prompt chỉ cho mức tuân thủ xác suất; khi agent hết <code>max_turns</code> giữa chừng, nó không còn lượt nào để thực hiện chỉ dẫn đó.","<b>C.</b> Tách thành hai agent chỉ chia nhỏ ngân sách lượt; agent thứ hai vẫn có thể cạn lượt mà không kết thúc, nên không có đảm bảo.","<b>D.</b> Ngưỡng “80% số hành động còn lại” là heuristic không đảm bảo bao phủ mọi cách vòng lặp kết thúc (lỗi, stop_reason khác…), và có thể escalate sớm những ca lẽ ra giải quyết được."]},"cite":"Hướng dẫn ôn tập — §3.1 Agentic Loop là gì; Lĩnh vực 1.4"},{"id":"t1q151","n":151,"topic":1,"type":"mcq","stem":{"en":"A developer uses Claude Code to refactor a function during their development session. Before committing, they ask <b class=\"kw\">the same Claude session</b> to review the code for issues. Later, a <b class=\"kw\">separate automated CI review</b> catches several bugs that the <b class=\"kw\">same-session review missed</b>. What best explains this discrepancy?","vi":"Một lập trình viên dùng Claude Code để refactor một hàm trong session phát triển của họ. Trước khi commit, họ yêu cầu <b class=\"kw\">chính session Claude đó</b> review code để tìm vấn đề. Sau đó, một quy trình <b class=\"kw\">review CI tự động riêng biệt</b> phát hiện một số bug mà lần review <b class=\"kw\">trong cùng session đã bỏ sót</b>. Điều gì giải thích tốt nhất sự khác biệt này?"},"options":[{"k":"A","t":{"en":"The CI environment has access to the <b class=\"kw\">full codebase context</b> while the local session <b class=\"kw\">only sees the current file</b>","vi":"Môi trường CI có quyền truy cập vào <b class=\"kw\">context của toàn bộ codebase</b> trong khi session cục bộ <b class=\"kw\">chỉ thấy file hiện tại</b>"}},{"k":"B","t":{"en":"Claude <b class=\"kw\">retains context about its prior reasoning</b> in the session, making it less likely to <b class=\"kw\">question its own decisions</b>","vi":"Claude <b class=\"kw\">giữ lại context về quá trình suy luận trước đó</b> của nó trong session, khiến nó ít có khả năng <b class=\"kw\">chất vấn các quyết định của chính mình</b>"}},{"k":"C","t":{"en":"The <b class=\"kw\">extended session length</b> caused the <b class=\"kw\">context window to fill</b> with conversation history, leaving less room for thorough analysis","vi":"<b class=\"kw\">Độ dài session kéo dài</b> khiến <b class=\"kw\">context window bị lấp đầy</b> bởi lịch sử hội thoại, để lại ít chỗ hơn cho việc phân tích kỹ lưỡng"}},{"k":"D","t":{"en":"The CI review uses a <b class=\"kw\">more specific prompt</b> tailored for catching bugs, while the developer&#x27;s request was <b class=\"kw\">too general</b>","vi":"Lần review CI dùng một <b class=\"kw\">prompt cụ thể hơn</b> được thiết kế riêng để bắt bug, trong khi yêu cầu của lập trình viên <b class=\"kw\">quá chung chung</b>"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Đây là <b>hạn chế của tự review</b>: trong cùng session, Claude vẫn giữ context về <b>lý do và quyết định</b> nó đã đưa ra khi refactor, nên có xu hướng xác nhận lại các lựa chọn đó thay vì nghi ngờ chúng. Review CI chạy như một <b>instance độc lập</b>, không mang context sinh code, nên nhìn đoạn code “bằng con mắt mới” và phát hiện được lỗi mà session gốc bỏ qua. Vì vậy nên dùng một instance riêng biệt để review code do Claude sinh ra.","elim":["<b>A.</b> Session Claude Code cục bộ có thể đọc toàn bộ codebase bằng Read/Grep/Glob, không bị giới hạn ở file hiện tại; khác biệt không nằm ở quyền truy cập.","<b>C.</b> Đề không cho thấy session dài hay context bị đầy; một lần refactor một hàm khó gây cạn context, và đây không phải giải thích cho thiên lệch xác nhận.","<b>D.</b> Prompt cụ thể hơn có thể giúp, nhưng không giải thích hiện tượng cốt lõi — chính session đã viết code thì kém hiệu quả khi review nó do giữ lại context suy luận."]},"cite":"Hướng dẫn ôn tập — §8.3 Code Review nhiều lượt (Multi-pass); Lĩnh vực 4.6"},{"id":"t1q152","n":152,"topic":1,"type":"mcq","stem":{"en":"You&#x27;ve configured your Claude agent with <b class=\"kw\">three MCP servers</b>: one for git operations, one for Jira ticket management, and one for documentation search. When a user asks the agent to &quot;create a branch for JIRA- 123 and add documentation links to the ticket,&quot; how does the agent <b class=\"kw\">access tools across these servers</b>?","vi":"Bạn đã cấu hình agent Claude của mình với <b class=\"kw\">ba MCP server</b>: một cho các thao tác git, một cho quản lý ticket Jira, và một cho tìm kiếm tài liệu. Khi người dùng yêu cầu agent &quot;tạo một branch cho JIRA- 123 và thêm các liên kết tài liệu vào ticket&quot;, agent <b class=\"kw\">truy cập các tool trên các server này</b> như thế nào?"},"options":[{"k":"A","t":{"en":"The agent <b class=\"kw\">automatically selects the most relevant server</b> based on the request and <b class=\"kw\">loads only that server&#x27;s tools</b>.","vi":"Agent <b class=\"kw\">tự động chọn server liên quan nhất</b> dựa trên yêu cầu và <b class=\"kw\">chỉ nạp các tool của server đó</b>."}},{"k":"B","t":{"en":"You must <b class=\"kw\">specify which MCP server</b> to use for each turn, and the agent can only access <b class=\"kw\">one server&#x27;s tools at a time</b>.","vi":"Bạn phải <b class=\"kw\">chỉ định MCP server nào</b> được dùng cho mỗi lượt, và agent chỉ có thể truy cập <b class=\"kw\">các tool của một server tại một thời điểm</b>."}},{"k":"C","t":{"en":"Tools from all configured MCP servers are <b class=\"kw\">discovered at connection time</b> and <b class=\"kw\">available simultaneously</b> to the agent.","vi":"Các tool từ tất cả các MCP server đã cấu hình <b class=\"kw\">được phát hiện tại thời điểm kết nối</b> và <b class=\"kw\">khả dụng đồng thời</b> cho agent."}},{"k":"D","t":{"en":"The agent <b class=\"kw\">queries each server sequentially</b> to determine which handles each tool, routing calls based on <b class=\"kw\">tool name prefixes</b>.","vi":"Agent <b class=\"kw\">truy vấn tuần tự từng server</b> để xác định server nào xử lý tool nào, định tuyến các lệnh gọi dựa trên <b class=\"kw\">tiền tố tên tool</b>."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Khi agent kết nối với nhiều MCP server, <b>tool của tất cả các server được khám phá tại thời điểm kết nối</b> và <b>đồng thời khả dụng</b> cho agent. Vì vậy với yêu cầu “tạo branch cho JIRA-123 và thêm link tài liệu vào ticket”, agent có thể gọi tool git, tool docs search và tool Jira trong cùng một tác vụ, chọn tool dựa trên tên và mô tả của chúng mà không cần chuyển đổi server.","elim":["<b>A.</b> Agent không tự chọn một server rồi chỉ nạp tool của server đó; mọi tool từ các server đã cấu hình đều có sẵn cùng lúc — yêu cầu này vốn cần tool từ cả ba server.","<b>B.</b> Không cần chỉ định server cho từng lượt và agent không bị giới hạn một server mỗi lúc; MCP được thiết kế để tích hợp nhiều server song song.","<b>D.</b> Agent không truy vấn tuần tự từng server lúc gọi để hỏi ai xử lý tool nào; danh sách tool đã được khám phá sẵn khi kết nối (qua <code>tools/list</code>)."]},"cite":"Hướng dẫn ôn tập — §4.2 MCP Server; Lĩnh vực 2.4"},{"id":"t1q153","n":153,"topic":1,"type":"mcq","stem":{"en":"An engineer submits two requests: • Request A: &quot;<b class=\"kw\">Rename the getUserData function</b> to fetchUserProfile everywhere it&#x27;s used.&quot; • Request B: &quot;<b class=\"kw\">Improve error handling throughout</b> the data processing module—add try/catch blocks, meaningful error messages, and ensure failures <b class=\"kw\">don&#x27;t silently corrupt data</b>.&quot; For which request does specifying an explicit multi-phase workflow (such as analyze propose implement with review) most improve outcome quality?","vi":"Một kỹ sư gửi hai yêu cầu: • Yêu cầu A: &quot;<b class=\"kw\">Đổi tên hàm getUserData</b> thành fetchUserProfile ở mọi nơi nó được sử dụng.&quot; • Yêu cầu B: &quot;<b class=\"kw\">Cải thiện xử lý lỗi trong toàn bộ module</b> xử lý dữ liệu—thêm các khối try/catch, thông báo lỗi có ý nghĩa, và đảm bảo các lỗi <b class=\"kw\">không âm thầm làm hỏng dữ liệu</b>.&quot; Đối với yêu cầu nào thì việc chỉ định một workflow nhiều giai đoạn tường minh (chẳng hạn phân tích đề xuất triển khai kèm review) cải thiện chất lượng kết quả nhiều nhất?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Neither request</b> benefits significantly","vi":"<b class=\"kw\">Không yêu cầu nào</b> được lợi đáng kể"}},{"k":"B","t":{"en":"<b class=\"kw\">Request A</b>, the <b class=\"kw\">function rename task</b>","vi":"<b class=\"kw\">Yêu cầu A</b>, <b class=\"kw\">tác vụ đổi tên hàm</b>"}},{"k":"C","t":{"en":"<b class=\"kw\">Both requests</b> benefit <b class=\"kw\">equally</b>","vi":"<b class=\"kw\">Cả hai yêu cầu</b> được lợi <b class=\"kw\">như nhau</b>"}},{"k":"D","t":{"en":"<b class=\"kw\">Request B</b>, the <b class=\"kw\">error handling task</b>","vi":"<b class=\"kw\">Yêu cầu B</b>, <b class=\"kw\">tác vụ xử lý lỗi</b>"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Request B (“cải thiện xử lý lỗi toàn module”) là tác vụ <b>mở, đòi hỏi phán đoán</b>: phải xác định chỗ nào cần try/catch, thông báo lỗi nào có ý nghĩa, làm sao tránh làm hỏng dữ liệu âm thầm — có nhiều cách làm hợp lý và ảnh hưởng rộng. Workflow nhiều giai đoạn (analyze → propose → implement → review) giúp <b>khám phá trước, thống nhất phương án</b> rồi mới sửa, giảm rủi ro thay đổi sai hướng. Request A là đổi tên cơ học, phạm vi rõ ràng, thực thi trực tiếp là đủ.","elim":["<b>A.</b> Request B có phạm vi rộng và nhiều quyết định thiết kế, nên hưởng lợi rõ rệt từ việc phân tích và đề xuất trước khi triển khai.","<b>B.</b> Đổi tên hàm là thao tác cơ học, có tiêu chí đúng/sai rõ (tìm và thay mọi chỗ dùng); thêm các giai đoạn phân tích/đề xuất gần như không cải thiện kết quả.","<b>C.</b> Hai request khác nhau về bản chất: một tác vụ xác định đơn giản và một tác vụ mở, nhiều phán đoán — lợi ích của workflow nhiều giai đoạn không như nhau."]},"cite":"Hướng dẫn ôn tập — §5.6 Planning Mode so với Thực thi trực tiếp; Lĩnh vực 3.4"},{"id":"t1q154","n":154,"topic":1,"type":"mcq","stem":{"en":"During initial testing of the automated review pipeline, you notice that reviews on large PRs (50+ changed files) sometimes take over 20 minutes and cost $8-12 per run due to extensive agentic loops — Claude reads files, runs analysis tools, and iterates many times. Your team needs each invocation to abort once it reaches a <b class=\"kw\">fixed iteration count</b> and a <b class=\"kw\">fixed dollar amount</b>, <b class=\"kw\">enforced by Claude Code itself</b> rather than the surrounding job runner. Which configuration change directly enforces both of those <b class=\"kw\">per-invocation caps</b>?","vi":"Trong quá trình kiểm thử ban đầu của pipeline review tự động, bạn nhận thấy các lần review trên PR lớn (50+ file thay đổi) đôi khi mất hơn 20 phút và tốn $8-12 mỗi lần chạy do các agentic loop kéo dài — Claude đọc file, chạy các tool phân tích, và lặp lại nhiều lần. Nhóm của bạn cần mỗi lần gọi tự hủy khi đạt đến một <b class=\"kw\">số vòng lặp cố định</b> và một <b class=\"kw\">số tiền cố định</b>, <b class=\"kw\">được thực thi bởi chính Claude Code</b> thay vì trình chạy job bao quanh. Thay đổi cấu hình nào trực tiếp thực thi <b class=\"kw\">cả hai giới hạn cho mỗi lần gọi</b> đó?"},"options":[{"k":"A","t":{"en":"Add <b class=\"kw\">--max-turns 10</b> <b class=\"kw\">--max-budget-usd 2.00</b> to the claude -p invocation to cap iterations and spend.","vi":"Thêm <b class=\"kw\">--max-turns 10</b> <b class=\"kw\">--max-budget-usd 2.00</b> vào lệnh gọi claude -p để giới hạn số vòng lặp và chi phí."}},{"k":"B","t":{"en":"Set <b class=\"kw\">--permission-mode dontAsk</b> to <b class=\"kw\">auto-deny</b> any tool permission requests not in the explicitly allowed set.","vi":"Đặt <b class=\"kw\">--permission-mode dontAsk</b> để <b class=\"kw\">tự động từ chối</b> mọi yêu cầu cấp quyền tool không nằm trong tập được cho phép tường minh."}},{"k":"C","t":{"en":"Switch the <b class=\"kw\">--model flag</b> to a <b class=\"kw\">smaller, cheaper model</b> so each iteration uses fewer tokens and lower per- call cost.","vi":"Chuyển <b class=\"kw\">cờ --model</b> sang một <b class=\"kw\">model nhỏ hơn, rẻ hơn</b> để mỗi vòng lặp dùng ít token hơn và chi phí mỗi lệnh gọi thấp hơn."}},{"k":"D","t":{"en":"Set <b class=\"kw\">timeout-minutes: 5</b> on the GitHub Actions job step and monitor per-run costs via the <b class=\"kw\">Anthropic Console usage dashboard</b>.","vi":"Đặt <b class=\"kw\">timeout-minutes: 5</b> cho bước job GitHub Actions và theo dõi chi phí mỗi lần chạy qua <b class=\"kw\">dashboard usage trên Anthropic Console</b>."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Đề yêu cầu hai giới hạn <b>cho mỗi lần gọi</b>, do <b>chính Claude Code thực thi</b>: số vòng lặp cố định và số tiền cố định. Trong chế độ non-interactive (<code>claude -p</code>), cờ <code>--max-turns</code> giới hạn số lượt agentic, còn <code>--max-budget-usd</code> giới hạn chi phí API tối đa cho lần chạy; khi chạm ngưỡng, Claude Code tự dừng. Đây là cấu hình trực tiếp đáp ứng cả hai yêu cầu.","elim":["<b>B.</b> <code>--permission-mode dontAsk</code> chỉ tự từ chối các tool chưa được cho phép, không giới hạn số vòng lặp hay số tiền chi tiêu.","<b>C.</b> Đổi sang model rẻ hơn chỉ giảm chi phí mỗi lượt, không áp đặt trần cứng nào về số lượt hay tổng chi phí.","<b>D.</b> <code>timeout-minutes</code> là giới hạn của job runner (GitHub Actions), không phải của Claude Code, và theo thời gian chứ không theo số vòng/tiền; dashboard chỉ để theo dõi sau đó."]},"cite":"Hướng dẫn ôn tập — §5.9 Claude Code CLI cho CI/CD; Lĩnh vực 3.6"},{"id":"t1q155","n":155,"topic":1,"type":"mcq","stem":{"en":"Your update_user_profile tool accepts a user_id (required) and an optional fields_to_update object. In testing, Claude frequently <b class=\"kw\">omits user_id</b> or <b class=\"kw\">passes incorrectly structured data</b>. What is most critical for helping Claude <b class=\"kw\">understand what parameter values to provide</b>?","vi":"Tool update_user_profile của bạn nhận một user_id (bắt buộc) và một object fields_to_update tùy chọn. Trong quá trình kiểm thử, Claude thường xuyên <b class=\"kw\">bỏ sót user_id</b> hoặc <b class=\"kw\">truyền dữ liệu có cấu trúc sai</b>. Điều gì quan trọng nhất để giúp Claude <b class=\"kw\">hiểu cần cung cấp giá trị tham số nào</b>?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Verbose parameter names</b> encoding format hints, such as <b class=\"kw\">user_id_string_uuid_format</b>","vi":"<b class=\"kw\">Tên tham số dài dòng</b> mã hóa gợi ý định dạng, chẳng hạn <b class=\"kw\">user_id_string_uuid_format</b>"}},{"k":"B","t":{"en":"<b class=\"kw\">Clear parameter descriptions</b> <b class=\"kw\">explaining expected format</b>, such as &quot;user_id : UUID of the user to update (required)&quot;","vi":"<b class=\"kw\">Mô tả tham số rõ ràng</b> <b class=\"kw\">giải thích định dạng mong đợi</b>, chẳng hạn &quot;user_id : UUID of the user to update (required)&quot;"}},{"k":"C","t":{"en":"<b class=\"kw\">Detailed error responses</b> explaining why invalid parameter values were rejected","vi":"<b class=\"kw\">Phản hồi lỗi chi tiết</b> giải thích vì sao các giá trị tham số không hợp lệ bị từ chối"}},{"k":"D","t":{"en":"<b class=\"kw\">Strict JSON Schema type constraints</b> marking user_id as required and defining fields_to_update as an object type","vi":"<b class=\"kw\">Ràng buộc kiểu JSON Schema nghiêm ngặt</b>, đánh dấu user_id là bắt buộc và định nghĩa fields_to_update là kiểu object"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Model quyết định truyền giá trị gì chủ yếu dựa trên <b>mô tả tham số</b> trong định nghĩa tool. Một mô tả rõ ràng như “<code>user_id</code>: UUID của người dùng cần cập nhật (bắt buộc)” cho biết <b>ý nghĩa, định dạng và tính bắt buộc</b> — chính là những gì model đang làm sai (bỏ sót <code>user_id</code>, truyền sai cấu trúc). Mô tả là kênh chính truyền đạt kỳ vọng cho model trước khi nó tạo lời gọi.","elim":["<b>A.</b> Tên tham số dài kiểu <code>user_id_string_uuid_format</code> khó đọc, phi chuẩn và vẫn kém thông tin hơn một mô tả có cấu trúc.","<b>C.</b> Thông báo lỗi chi tiết chỉ giúp sửa <b>sau khi</b> đã gọi sai (tốn thêm vòng lặp); chúng không phải điều chính giúp model hiểu từ đầu cần truyền gì.","<b>D.</b> Ràng buộc kiểu JSON Schema là cần thiết nhưng chỉ nói kiểu dữ liệu; không giải thích ý nghĩa và định dạng mong đợi (ví dụ UUID, những trường nào trong <code>fields_to_update</code>)."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q156","n":156,"topic":1,"type":"mcq","stem":{"en":"Your conversation history includes two types of content: <b class=\"kw\">persistent story elements</b> (character backgrounds, plot structure, world rules) that <b class=\"kw\">must remain consistent throughout</b>, and extensive brainstorming discussion that&#x27;s <b class=\"kw\">mostly ephemeral</b>. After 40+ turns, you&#x27;re hitting context limits and users report the assistant &quot;forgets&quot; established character traits, breaking narrative consistency. Which approach best ensures persistent story elements remain available to the model while <b class=\"kw\">reclaiming context space</b>?","vi":"Lịch sử hội thoại của bạn gồm hai loại nội dung: <b class=\"kw\">các yếu tố câu chuyện cố định</b> (bối cảnh nhân vật, cấu trúc cốt truyện, quy tắc của thế giới truyện) <b class=\"kw\">phải luôn nhất quán xuyên suốt</b>, và các thảo luận brainstorming dài <b class=\"kw\">phần lớn mang tính tạm thời</b>. Sau 40+ lượt, bạn đang chạm giới hạn context và người dùng báo cáo rằng trợ lý &quot;quên&quot; các đặc điểm nhân vật đã được thiết lập, phá vỡ tính nhất quán của câu chuyện. Cách tiếp cận nào đảm bảo tốt nhất rằng các yếu tố câu chuyện cố định luôn sẵn có cho model trong khi vẫn <b class=\"kw\">thu hồi được không gian context</b>?"},"options":[{"k":"A","t":{"en":"Separate persistent story elements into a <b class=\"kw\">retained &quot;story bible&quot; section</b> at context start, applying <b class=\"kw\">trimming or summarization only to brainstorming</b> discussion.","vi":"Tách các yếu tố câu chuyện cố định thành một <b class=\"kw\">phần &quot;story bible&quot; được giữ lại</b> ở đầu context, chỉ áp dụng việc <b class=\"kw\">cắt bớt hoặc tóm tắt cho phần thảo luận brainstorming</b>."}},{"k":"B","t":{"en":"Apply a <b class=\"kw\">sliding-window approach</b> keeping only the <b class=\"kw\">most recent 25 turns</b>, relying on the model to infer earlier context from recent discussion flow.","vi":"Áp dụng cách tiếp cận <b class=\"kw\">cửa sổ trượt (sliding window)</b> chỉ giữ <b class=\"kw\">25 lượt gần nhất</b>, dựa vào model để suy ra context trước đó từ diễn biến thảo luận gần đây."}},{"k":"C","t":{"en":"<b class=\"kw\">Summarize the entire conversation history</b> into a condensed synopsis <b class=\"kw\">every 20 turns</b>, replacing the full history to free up tokens.","vi":"<b class=\"kw\">Tóm tắt toàn bộ lịch sử hội thoại</b> thành một bản tóm lược cô đọng <b class=\"kw\">sau mỗi 20 lượt</b>, thay thế toàn bộ lịch sử để giải phóng token."}},{"k":"D","t":{"en":"Store all history in a <b class=\"kw\">vector database</b> and <b class=\"kw\">retrieve semantically similar passages</b> for each new message, replacing conversation history with retrieved chunks.","vi":"Lưu toàn bộ lịch sử trong một <b class=\"kw\">vector database</b> và <b class=\"kw\">truy xuất các đoạn tương tự về ngữ nghĩa</b> cho mỗi tin nhắn mới, thay thế lịch sử hội thoại bằng các chunk được truy xuất."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Hội thoại gồm hai loại nội dung với vòng đời khác nhau: <b>yếu tố bền vững</b> (tiểu sử nhân vật, cốt truyện, quy tắc thế giới) phải luôn có mặt, và <b>brainstorm tạm thời</b>. Tách các yếu tố bền vững thành một khối <b>“story bible”</b> được giữ nguyên ở đầu context, và <b>chỉ cắt gọn/tóm tắt phần brainstorm</b>. Như vậy thông tin cốt lõi không bao giờ bị mất qua các lần nén, còn không gian context vẫn được giải phóng.","elim":["<b>B.</b> Cửa sổ trượt 25 lượt sẽ đẩy các đặc điểm nhân vật thiết lập từ sớm ra khỏi context; trông chờ model “suy ra” chúng chính là nguyên nhân gây lỗi quên hiện tại.","<b>C.</b> Tóm tắt toàn bộ lịch sử định kỳ là nén lossy, dễ làm mất chi tiết nhân vật/quy tắc thế giới qua nhiều vòng tóm tắt.","<b>D.</b> Thay lịch sử bằng các đoạn truy xuất theo độ tương đồng không đảm bảo yếu tố bền vững luôn được lấy lại; quy tắc thế giới có thể không “giống” tin nhắn hiện tại nên bị bỏ sót."]},"cite":"Hướng dẫn ôn tập — §11.1 Trích xuất các Sự kiện ra một Block Riêng; Lĩnh vực 5.1"},{"id":"t1q157","n":157,"topic":1,"type":"mcq","stem":{"en":"Users frequently refine their search criteria mid-conversation. You notice a pattern: when users say things like &quot;Actually, let&#x27;s raise the budget to $650K&quot; or &quot;I&#x27;d prefer a condo now instead of a house,&quot; the assistant sometimes <b class=\"kw\">continues referencing the original preferences</b> in later responses—even though the <b class=\"kw\">updates are clearly present in the conversation history</b>. Context usage is <b class=\"kw\">only at 35% capacity</b>. Which solution most reliably ensures the model uses the current preferences?","vi":"Người dùng thường xuyên điều chỉnh tiêu chí tìm kiếm giữa cuộc hội thoại. Bạn nhận thấy một mẫu: khi người dùng nói những câu như &quot;Thực ra, hãy nâng ngân sách lên $650K&quot; hoặc &quot;Giờ tôi thích một căn hộ chung cư hơn là một ngôi nhà&quot;, trợ lý đôi khi <b class=\"kw\">tiếp tục tham chiếu đến các sở thích ban đầu</b> trong các phản hồi sau đó—mặc dù <b class=\"kw\">các cập nhật rõ ràng có trong lịch sử hội thoại</b>. Mức sử dụng context <b class=\"kw\">chỉ ở 35% dung lượng</b>. Giải pháp nào đảm bảo đáng tin cậy nhất rằng model sử dụng các sở thích hiện tại?"},"options":[{"k":"A","t":{"en":"Implement <b class=\"kw\">conversation pruning</b> to <b class=\"kw\">remove turns containing outdated preferences</b>, ensuring only current ones remain in context.","vi":"Triển khai <b class=\"kw\">cắt tỉa hội thoại</b> để <b class=\"kw\">loại bỏ các lượt chứa sở thích đã lỗi thời</b>, đảm bảo chỉ những sở thích hiện tại còn lại trong context."}},{"k":"B","t":{"en":"Add <b class=\"kw\">system prompt instructions</b> emphasizing that the model should always prioritize the <b class=\"kw\">most recently stated preferences</b> over earlier ones.","vi":"Thêm <b class=\"kw\">hướng dẫn vào system prompt</b> nhấn mạnh rằng model phải luôn ưu tiên các <b class=\"kw\">sở thích được nêu gần đây nhất</b> hơn các sở thích trước đó."}},{"k":"C","t":{"en":"Include <b class=\"kw\">few-shot examples</b> showing the assistant correctly acknowledging and applying preference changes in responses.","vi":"Đưa vào các <b class=\"kw\">ví dụ few-shot</b> cho thấy trợ lý ghi nhận và áp dụng đúng các thay đổi sở thích trong phản hồi."}},{"k":"D","t":{"en":"Maintain a <b class=\"kw\">structured state object</b> with current preferences, update it on changes, and <b class=\"kw\">include it in each request</b>.","vi":"Duy trì một <b class=\"kw\">object trạng thái có cấu trúc</b> chứa các sở thích hiện tại, cập nhật nó khi có thay đổi, và <b class=\"kw\">đưa nó vào mỗi request</b>."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Context chỉ dùng 35% nên vấn đề không phải thiếu chỗ, mà là model phải tự <b>đối chiếu nhiều phiên bản sở thích</b> rải rác trong lịch sử và đôi khi chọn nhầm bản cũ. Duy trì một <b>đối tượng trạng thái có cấu trúc</b> chứa sở thích <b>hiện hành</b> (budget $650K, loại nhà: condo…), cập nhật khi người dùng thay đổi và đưa vào mỗi request, cung cấp một <b>nguồn sự thật duy nhất</b> rõ ràng. Đây là cách đáng tin cậy nhất, không phụ thuộc vào việc model tự suy luận thứ tự thời gian.","elim":["<b>A.</b> Cắt bỏ các lượt chứa sở thích cũ phá vỡ mạch hội thoại, khó thực hiện chính xác (một lượt có thể chứa cả thông tin còn hiệu lực) và không cần thiết khi context mới dùng 35%.","<b>B.</b> Chỉ dẫn “ưu tiên sở thích mới nhất” vẫn bắt model tự xác định đâu là bản mới nhất trong lịch sử — chính việc nó đang làm sai; chỉ cải thiện xác suất.","<b>C.</b> Few-shot về việc thừa nhận thay đổi sở thích cũng là biện pháp mềm; không loại bỏ việc các giá trị cũ và mới cùng tồn tại trong context."]},"cite":"Hướng dẫn ôn tập — §11.1 Trích xuất các Sự kiện ra một Block Riêng; Lĩnh vực 5.1"},{"id":"t1q158","n":158,"topic":1,"type":"mcq","stem":{"en":"After deploying automated code review, developers report that approximately 35% of flagged findings are <b class=\"kw\">false positives falling into consistent patterns</b>: style suggestion contradicting team conventions, security warnings for patterns safe in your deployment context, and performance suggestions that would degrade your specific use case. You want to reduce false positives while maintaining the ability to <b class=\"kw\">catch genuine issues</b>. Which approach best enables the model to <b class=\"kw\">generalize its judgment to novel code patterns</b> it hasn&#x27;t seen before?","vi":"Sau khi deploy review code tự động, các lập trình viên báo cáo rằng khoảng 35% các phát hiện được gắn cờ là <b class=\"kw\">false positive rơi vào các mẫu nhất quán</b>: gợi ý về style mâu thuẫn với quy ước của nhóm, cảnh báo bảo mật cho các mẫu vốn an toàn trong bối cảnh deploy của bạn, và các gợi ý hiệu năng có thể làm giảm hiệu năng trong trường hợp sử dụng cụ thể của bạn. Bạn muốn giảm false positive trong khi vẫn duy trì khả năng <b class=\"kw\">phát hiện các vấn đề thực sự</b>. Cách tiếp cận nào giúp model <b class=\"kw\">khái quát hóa khả năng phán đoán của nó sang các mẫu code mới</b> mà nó chưa từng thấy tốt nhất?"},"options":[{"k":"A","t":{"en":"Create a <b class=\"kw\">comprehensive written specification</b> of all patterns that should not be flagged, then include this <b class=\"kw\">full documentation in the system prompt</b>.","vi":"Tạo một <b class=\"kw\">bản đặc tả bằng văn bản toàn diện</b> về tất cả các mẫu không nên bị gắn cờ, sau đó đưa <b class=\"kw\">toàn bộ tài liệu này vào system prompt</b>."}},{"k":"B","t":{"en":"Implement <b class=\"kw\">post-processing</b> that uses <b class=\"kw\">keyword matching</b> to filter out findings containing terms like &quot;convention,&quot; &quot;context-dependent,&quot; or &quot;trade-off.&quot;","vi":"Triển khai <b class=\"kw\">hậu xử lý</b> dùng <b class=\"kw\">so khớp từ khóa</b> để lọc bỏ các phát hiện chứa các thuật ngữ như &quot;convention,&quot; &quot;context-dependent,&quot; hoặc &quot;trade-off.&quot;"}},{"k":"C","t":{"en":"Add <b class=\"kw\">instructions to your system prompt</b> to <b class=\"kw\">&quot;be conservative,&quot;</b> &quot;only flag definite issues,&quot; and &quot;consider that some patterns may be intentional.&quot;","vi":"Thêm <b class=\"kw\">hướng dẫn vào system prompt</b> để <b class=\"kw\">&quot;thận trọng&quot;</b>, &quot;chỉ gắn cờ các vấn đề chắc chắn&quot;, và &quot;cân nhắc rằng một số mẫu có thể là có chủ đích&quot;."}},{"k":"D","t":{"en":"Include <b class=\"kw\">few-shot examples</b> in your prompt showing <b class=\"kw\">annotated code snippets</b> that distinguish acceptable patterns from genuine issues in each category.","vi":"Đưa các <b class=\"kw\">ví dụ few-shot</b> vào prompt, hiển thị các <b class=\"kw\">đoạn code có chú thích</b> phân biệt các mẫu chấp nhận được với các vấn đề thực sự trong từng loại."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Đề hỏi cách giúp model <b>khái quát hóa phán đoán</b> sang các mẫu code chưa từng gặp. <b>Few-shot examples</b> với các đoạn code được chú thích, cho thấy <b>vì sao</b> một mẫu là chấp nhận được (theo quy ước nhóm/bối cảnh triển khai) và mẫu khác là lỗi thật trong từng loại (style, security, performance), dạy cho model <b>lý lẽ phân biệt</b> chứ không chỉ một danh sách. Nhờ đó model áp dụng cùng tiêu chí cho trường hợp mới, giảm false positive mà vẫn bắt được lỗi thật.","elim":["<b>A.</b> Một bản đặc tả liệt kê các mẫu không cần flag chỉ bao phủ những gì đã biết; nó không giúp model khái quát hóa sang mẫu mới, và tài liệu dài còn làm loãng prompt.","<b>B.</b> Lọc bằng từ khóa rất thô, sẽ loại nhầm cả lỗi thật có chứa các từ đó và bỏ sót false positive diễn đạt khác — không cải thiện phán đoán của model.","<b>C.</b> Chỉ dẫn mơ hồ như “be conservative” không cho tiêu chí cụ thể; thường làm model bỏ sót cả lỗi thật mà vẫn không loại đúng các false positive."]},"cite":"Hướng dẫn ôn tập — §6.1 Few-shot Prompting; Lĩnh vực 4.2"},{"id":"t1q159","n":159,"topic":1,"type":"mcq","stem":{"en":"You are setting up a non-interactive automated code review pipeline using Claude Code. You want Claude to analyze a pulled Git diff (git diff) against the main branch and apply a <b class=\"kw\">custom set of code review instructions</b>. However, you notice that when you run the pipeline, Claude <b class=\"kw\">only looks at the raw diff text</b> itself and completely <b class=\"kw\">stops using its file-reading or code navigation tools</b>. As a result, it fails to inspect the broader codebase repository context, which is critical because the diff modifies a core function called by many other external modules. Which change to the CLI invocation will cause Claude to read related files in the repository while <b class=\"kw\">still successfully applying your custom review instructions</b>?","vi":"Bạn đang thiết lập một pipeline review code tự động không tương tác sử dụng Claude Code. Bạn muốn Claude phân tích một Git diff đã lấy về (git diff) so với branch main và áp dụng một <b class=\"kw\">bộ hướng dẫn review code tùy chỉnh</b>. Tuy nhiên, bạn nhận thấy khi chạy pipeline, Claude <b class=\"kw\">chỉ xem xét chính văn bản diff thô</b> và hoàn toàn <b class=\"kw\">ngừng sử dụng các tool đọc file hoặc điều hướng code</b>. Kết quả là nó không kiểm tra được context rộng hơn của repository codebase, điều này rất quan trọng vì diff sửa đổi một hàm cốt lõi được nhiều module bên ngoài khác gọi đến. Thay đổi nào đối với lệnh gọi CLI sẽ khiến Claude đọc các file liên quan trong repository trong khi <b class=\"kw\">vẫn áp dụng thành công các hướng dẫn review tùy chỉnh</b> của bạn?"},"options":[{"k":"A","t":{"en":"Replace --system-prompt with <b class=\"kw\">--append-system-prompt</b> so your review instructions are added to Claude Code&#x27;s default prompt <b class=\"kw\">instead of overwriting</b> the built-in guidance for using file-reading and code navigation tools.","vi":"Thay --system-prompt bằng <b class=\"kw\">--append-system-prompt</b> để các hướng dẫn review của bạn được thêm vào prompt mặc định của Claude Code <b class=\"kw\">thay vì ghi đè</b> hướng dẫn tích hợp sẵn về việc sử dụng các tool đọc file và điều hướng code."}},{"k":"B","t":{"en":"<b class=\"kw\">Remove --system-prompt entirely</b> and place the review instructions in a <b class=\"kw\">CLAUDE.md file</b> at the repo root, since --system-prompt is incompatible with tool use under -p.","vi":"<b class=\"kw\">Loại bỏ hoàn toàn --system-prompt</b> và đặt các hướng dẫn review vào một <b class=\"kw\">file CLAUDE.md</b> tại thư mục gốc của repo, vì --system-prompt không tương thích với tool use khi dùng -p."}},{"k":"C","t":{"en":"<b class=\"kw\">Stop piping the diff via stdin</b> and instead <b class=\"kw\">embed the diff contents</b> inside the prompt string, so Claude Code treats the invocation as an agentic session rather than a stream-processing one.","vi":"<b class=\"kw\">Ngừng truyền diff qua stdin</b> và thay vào đó <b class=\"kw\">nhúng nội dung diff</b> vào trong chuỗi prompt, để Claude Code coi lệnh gọi là một session agentic thay vì một session xử lý luồng (stream-processing)."}},{"k":"D","t":{"en":"<b class=\"kw\">Keep --system-prompt</b> and add <b class=\"kw\">--allowedTools &quot;Read, Glob, Grep&quot;</b> so that the non-interactive mode permits file system tools that it otherwise disables.","vi":"<b class=\"kw\">Giữ --system-prompt</b> và thêm <b class=\"kw\">--allowedTools &quot;Read, Glob, Grep&quot;</b> để chế độ không tương tác cho phép các tool hệ thống file mà nếu không nó sẽ vô hiệu hóa."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Cờ <code>--system-prompt</code> <b>thay thế hoàn toàn</b> system prompt mặc định của Claude Code — bao gồm cả các hướng dẫn về cách dùng tool đọc file và điều hướng code — nên Claude chỉ nhìn vào diff thô. <code>--append-system-prompt</code> thì <b>nối thêm</b> chỉ dẫn review của bạn vào sau prompt mặc định, giữ lại hành vi agentic (Read, Grep, Glob…) để Claude tự tra cứu các module gọi tới hàm lõi, đồng thời vẫn áp dụng tiêu chí review tùy chỉnh.","elim":["<b>B.</b> <code>--system-prompt</code> không “không tương thích” với tool use dưới <code>-p</code>; chuyển chỉ dẫn sang CLAUDE.md có thể chạy được nhưng lý do nêu ra là sai, và đây không phải cách sửa trực tiếp nguyên nhân (prompt mặc định bị ghi đè).","<b>C.</b> Cách truyền diff (stdin hay chuỗi prompt) không quyết định việc session có “agentic” hay không; vấn đề nằm ở system prompt bị thay thế.","<b>D.</b> Chế độ non-interactive không tự vô hiệu hóa các tool đọc file; thêm <code>--allowedTools</code> không khôi phục được các hướng dẫn mặc định đã bị <code>--system-prompt</code> xóa."]},"cite":"Hướng dẫn ôn tập — §5.9 Claude Code CLI cho CI/CD; Lĩnh vực 3.6"},{"id":"t1q160","n":160,"topic":1,"type":"mcq","stem":{"en":"Your development team is using Claude Code to automate test generation across a large codebase. However, developers are frequently rejecting the generated test suites because Claude creates a high volume of <b class=\"kw\">trivial assertions</b> or tests that merely maximize line coverage without validating meaningful behavioral logic or edge cases. You want to guide Claude to generate high-quality, production-ready tests directly <b class=\"kw\">without introducing high latency</b> or <b class=\"kw\">modifying the core pipeline script</b>. Which strategy best ensures that high-quality, meaningful tests are generated <b class=\"kw\">in the first place</b>?","vi":"Nhóm phát triển của bạn đang dùng Claude Code để tự động hóa việc sinh test trên một codebase lớn. Tuy nhiên, các lập trình viên thường xuyên từ chối các bộ test được sinh ra vì Claude tạo ra một lượng lớn <b class=\"kw\">assertion tầm thường</b> hoặc các test chỉ nhằm tối đa hóa độ bao phủ dòng mà không kiểm chứng logic hành vi có ý nghĩa hoặc các edge case. Bạn muốn hướng dẫn Claude trực tiếp sinh ra các test chất lượng cao, sẵn sàng cho production mà <b class=\"kw\">không gây độ trễ cao</b> hoặc <b class=\"kw\">sửa đổi script pipeline cốt lõi</b>. Chiến lược nào đảm bảo tốt nhất rằng các test chất lượng cao, có ý nghĩa được sinh ra <b class=\"kw\">ngay từ đầu</b>?"},"options":[{"k":"A","t":{"en":"Document <b class=\"kw\">testing standards in CLAUDE.md</b> including valuable test criteria, available fixtures with intended use cases, and <b class=\"kw\">examples distinguishing meaningful behavioral tests</b> from trivial assertions.","vi":"Ghi lại các <b class=\"kw\">tiêu chuẩn kiểm thử trong CLAUDE.md</b>, bao gồm tiêu chí cho test có giá trị, các fixture sẵn có kèm trường hợp sử dụng dự kiến, và <b class=\"kw\">các ví dụ phân biệt test hành vi có ý nghĩa</b> với các assertion tầm thường."}},{"k":"B","t":{"en":"Implement a <b class=\"kw\">two-phase generation</b> where a <b class=\"kw\">second Claude call scores each test</b> against quality criteria, filtering out low-scoring tests before presenting results to developers.","vi":"Triển khai <b class=\"kw\">sinh test hai giai đoạn</b>, trong đó một <b class=\"kw\">lệnh gọi Claude thứ hai chấm điểm</b> từng test theo tiêu chí chất lượng, lọc bỏ các test điểm thấp trước khi trình bày kết quả cho lập trình viên."}},{"k":"C","t":{"en":"Add <b class=\"kw\">post-generation coverage analysis</b> that automatically filters out any generated test that doesn&#x27;t increase <b class=\"kw\">line coverage</b> beyond what existing tests provide.","vi":"Thêm <b class=\"kw\">phân tích độ bao phủ sau khi sinh test</b> để tự động lọc bỏ bất kỳ test được sinh ra nào không làm tăng <b class=\"kw\">độ bao phủ dòng (line coverage)</b> vượt quá mức mà các test hiện có đã đạt được."}},{"k":"D","t":{"en":"<b class=\"kw\">Restrict test generation</b> to directories where <b class=\"kw\">historical quality metrics</b> show higher acceptance rates, disabling it for areas where generated tests consistently require heavy editing.","vi":"<b class=\"kw\">Giới hạn việc sinh test</b> ở các thư mục mà <b class=\"kw\">số liệu chất lượng trong quá khứ</b> cho thấy tỷ lệ chấp nhận cao hơn, tắt nó ở những khu vực mà test được sinh ra thường xuyên cần chỉnh sửa nhiều."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Yêu cầu: sinh test chất lượng <b>ngay từ đầu</b>, <b>không tăng độ trễ</b> và <b>không sửa script pipeline</b>. Ghi tiêu chuẩn kiểm thử vào <code>CLAUDE.md</code> — tiêu chí test có giá trị, các <b>fixture sẵn có và mục đích dùng</b>, cùng <b>ví dụ phân biệt</b> test hành vi có ý nghĩa với assertion tầm thường — cung cấp ngữ cảnh dự án mà Claude Code tự nạp ở mỗi lần chạy. Chỉ cần sửa một file cấu hình, không thêm lời gọi hay bước hậu xử lý nào.","elim":["<b>B.</b> Lượt chấm điểm bằng một lời gọi Claude thứ hai làm tăng độ trễ, chi phí và phải sửa pipeline; nó chỉ lọc sau khi đã sinh test kém.","<b>C.</b> Phân tích coverage hậu kỳ cần thêm bước vào pipeline và chỉ lọc kết quả; coverage dòng còn chính là thước đo khiến test tầm thường xuất hiện.","<b>D.</b> Tắt sinh test ở vùng khó né tránh vấn đề và mất giá trị tự động hóa, không làm test được sinh ra tốt hơn."]},"cite":"Hướng dẫn ôn tập — §5.1 Phân cấp CLAUDE.md; Lĩnh vực 3.6"},{"id":"t1q161","n":161,"topic":1,"type":"mcq","stem":{"en":"Your music discovery assistant should <b class=\"kw\">consistently maintain an enthusiastic tone</b>, explain its reasoning for each recommendation, and ask clarifying questions to better understand user preferences. You want this behavior to <b class=\"kw\">persist reliably across all user interactions</b>. Where should you define these <b class=\"kw\">behavioral guidelines</b>?","vi":"Trợ lý khám phá âm nhạc của bạn cần <b class=\"kw\">luôn duy trì giọng điệu nhiệt tình</b>, giải thích lý do cho mỗi đề xuất, và đặt câu hỏi làm rõ để hiểu rõ hơn sở thích của người dùng. Bạn muốn hành vi này được <b class=\"kw\">duy trì một cách đáng tin cậy trong mọi tương tác</b> với người dùng. Bạn nên định nghĩa các <b class=\"kw\">hướng dẫn hành vi</b> này ở đâu?"},"options":[{"k":"A","t":{"en":"In the <b class=\"kw\">first assistant message</b>, instructing Claude to follow these guidelines going forward","vi":"Trong <b class=\"kw\">tin nhắn assistant đầu tiên</b>, hướng dẫn Claude tuân theo các hướng dẫn này từ đó trở đi"}},{"k":"B","t":{"en":"In <b class=\"kw\">environmental variables</b> that your application passes to the API client","vi":"Trong các <b class=\"kw\">biến môi trường</b> mà ứng dụng của bạn truyền cho API client"}},{"k":"C","t":{"en":"<b class=\"kw\">Prepended to each user message</b> before sending to the API","vi":"<b class=\"kw\">Thêm vào đầu mỗi tin nhắn của người dùng</b> trước khi gửi đến API"}},{"k":"D","t":{"en":"In the <b class=\"kw\">system prompt</b>","vi":"Trong <b class=\"kw\">system prompt</b>"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> <b>System prompt</b> là nơi định nghĩa vai trò, giọng điệu và quy tắc hành vi áp dụng cho <b>toàn bộ hội thoại</b>. Được gửi kèm mọi request qua tham số <code>system</code>, nó có thẩm quyền cao hơn nội dung trong lượt user và tách biệt khỏi dữ liệu người dùng — nên giọng nhiệt tình, việc giải thích lý do cho mỗi đề xuất và đặt câu hỏi làm rõ sẽ được duy trì ổn định qua mọi tương tác.","elim":["<b>A.</b> Đặt chỉ dẫn trong tin nhắn assistant đầu tiên là lạm dụng vai trò; nó yếu hơn system prompt và dễ bị “trôi” khi hội thoại dài hoặc bị cắt gọn.","<b>B.</b> Biến môi trường của ứng dụng không được gửi tới model; chúng không ảnh hưởng gì đến hành vi của Claude trừ khi được đưa vào prompt.","<b>C.</b> Chèn vào đầu mỗi tin nhắn user lặp lại tốn token, trộn chỉ dẫn với nội dung người dùng và không phải cách chuẩn để đặt hành vi xuyên suốt."]},"cite":"Hướng dẫn ôn tập — §1.4 System Prompt"},{"id":"t1q162","n":162,"topic":1,"type":"mcq","stem":{"en":"Your team is configuring MCP servers in Claude Code. You want to add a <b class=\"kw\">shared venue lookup server</b> that <b class=\"kw\">all team members should have access</b> to, and you personally want to add an experimental music playlist server that <b class=\"kw\">only you are testing</b>. Which configuration approach correctly applies MCP server scopes?","vi":"Nhóm của bạn đang cấu hình các MCP server trong Claude Code. Bạn muốn thêm một <b class=\"kw\">server tra cứu địa điểm (venue) dùng chung</b> mà <b class=\"kw\">tất cả thành viên trong nhóm đều có quyền truy cập</b>, và cá nhân bạn muốn thêm một server playlist nhạc thử nghiệm mà <b class=\"kw\">chỉ mình bạn đang kiểm thử</b>. Cách cấu hình nào áp dụng đúng phạm vi (scope) của MCP server?"},"options":[{"k":"A","t":{"en":"Add <b class=\"kw\">venue server to ~/.claude.json</b> and <b class=\"kw\">playlist server to .mcp.json</b>","vi":"Thêm <b class=\"kw\">server venue vào ~/.claude.json</b> và <b class=\"kw\">server playlist vào .mcp.json</b>"}},{"k":"B","t":{"en":"Add <b class=\"kw\">venue server to .mcp.json</b> and <b class=\"kw\">playlist server to ~/.claude.json</b>","vi":"Thêm <b class=\"kw\">server venue vào .mcp.json</b> và <b class=\"kw\">server playlist vào ~/.claude.json</b>"}},{"k":"C","t":{"en":"Add <b class=\"kw\">both servers</b> to the <b class=\"kw\">project-level .mcp.json</b> file","vi":"Thêm <b class=\"kw\">cả hai server</b> vào file <b class=\"kw\">.mcp.json cấp dự án</b>"}},{"k":"D","t":{"en":"Add <b class=\"kw\">both servers</b> to your <b class=\"kw\">local ~/.claude.json</b>","vi":"Thêm <b class=\"kw\">cả hai server</b> vào file <b class=\"kw\">~/.claude.json cục bộ</b> của bạn"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Phạm vi MCP server trong Claude Code: <code>.mcp.json</code> ở gốc dự án là cấu hình <b>cấp dự án</b>, được commit vào version control nên <b>cả nhóm</b> đều có — phù hợp cho venue lookup server dùng chung. <code>~/.claude.json</code> là cấu hình <b>cấp người dùng/cá nhân</b>, không chia sẻ qua VCS — phù hợp cho playlist server thử nghiệm mà chỉ bạn dùng.","elim":["<b>A.</b> Đảo ngược phạm vi: server dùng chung trong <code>~/.claude.json</code> thì đồng đội không có, còn server thử nghiệm trong <code>.mcp.json</code> lại bị áp đặt cho cả nhóm.","<b>C.</b> Đưa playlist server thử nghiệm vào <code>.mcp.json</code> sẽ chia sẻ nó cho toàn nhóm, trái với ý định chỉ mình bạn thử nghiệm.","<b>D.</b> Đặt venue server trong <code>~/.claude.json</code> cục bộ khiến các thành viên khác không truy cập được server dùng chung."]},"cite":"Hướng dẫn ôn tập — §4.3 Cấu hình MCP Server; Lĩnh vực 2.4"}]}]};

    get(k){ try{ return ok ? localStorage.getItem(k) : (mem[k] ?? null); }catch(e){ return mem[k] ?? null; } },
    set(k,v){ try{ ok ? localStorage.setItem(k,v) : (mem[k]=v); }catch(e){ mem[k]=v; } },
    del(k){ try{ ok ? localStorage.removeItem(k) : delete mem[k]; }catch(e){ delete mem[k]; } } };

let L = "vi";
const t = (k,...a) => { const v = T[L][k]; return typeof v === "function" ? v(...a) : v; };
/* văn bản song ngữ: luôn hiện bản tiếng Anh (đề gốc), kèm bản Việt khi giao diện là VI */
const tx = o => !o ? "" : o.en + (L === "vi" && o.vi ? `<span class="gloss">${o.vi}</span>` : "");

/* ---------- dữ liệu phẳng ---------- */
const ALL = [], BY_ID = {};
DATA.topics.forEach(tp => tp.questions.forEach(q => {
  q.idx = ALL.length + 1;
  q.hay = fold(strip([q.stem.en, q.stem.vi,
    (q.options||[]).map(o => o.t.en + " " + (o.t.vi||"")).join(" "),
    (q.rows||[]).map(r => r.t.en + " " + (r.t.vi||"")).join(" "),
    (q.blanks||[]).map(b => (b.opts||[]).map(o => o.en).join(" ")).join(" "),
    q.explain && (q.explain.key || q.explain.text), (q.explain && q.explain.elim || []).join(" ")
  ].filter(Boolean).join(" ")));
  ALL.push(q); BY_ID[q.id] = q;
}));
const TOPICS = DATA.topics.map(d => d.n);
const TYPES = [...new Set(ALL.map(q => q.type))];
const PASS = DATA.meta.pass || 70;

/* ============================================================
   LOGIC THEO DẠNG CÂU
   ============================================================ */
function blankAnswer(q){
  if(q.type === "mcq")   return [];
  if(q.type === "yesno") return q.rows.map(() => null);
  return q.blanks.map(() => null);
}
function answeredCount(q, a){
  if(q.type === "mcq") return (a||[]).length;
  return (a||[]).filter(v => v !== null && v !== undefined).length;
}
function totalParts(q){
  if(q.type === "mcq") return q.answer.length;
  if(q.type === "yesno") return q.rows.length;
  return q.blanks.length;
}
function isComplete(q, a){ return answeredCount(q,a) >= totalParts(q); }
function isCorrect(q, a){
  if(!a) return false;
  if(q.type === "mcq")
    return a.length === q.answer.length && [...a].sort().join("") === [...q.answer].sort().join("");
  if(q.type === "yesno") return q.rows.every((r,i) => a[i] === r.a);
  return q.blanks.every((b,i) => a[i] === b.a);
}
function stampHTML(q){
  if(q.type === "mcq")
    return `<div class="stamp"><span class="t">${t("ansTitle")}</span><span class="v">${q.answer.join(" ")}</span></div>`;
  if(q.type === "yesno")
    return `<div class="stamp"><span class="t">${t("ansTitle")}</span><span class="v">${
      q.rows.map(r => r.a === "Y" ? "Y" : "N").join(" ")}</span></div>`;
  return `<div class="stamp txt"><span class="t">${t("ansTitle")}</span><span class="v">${
    q.blanks.map(b => strip(b.opts[b.a].en)).join(" · ")}</span></div>`;
}

/* ---------- thân câu hỏi (dùng chung cho ôn tập / thi / xem lại) ---------- */
function bodyHTML(q, a, done, act){
  const P = act ? `data-act="${act}"` : "";
  if(q.type === "mcq"){
    return `<ul class="opts">` + q.options.map(o => {
      const right = q.answer.includes(o.k), pick = (a||[]).includes(o.k);
      return `<li><button class="opt" ${P} data-k="${o.k}" data-right="${right?1:0}" data-pick="${pick?1:0}"
          ${done?'aria-disabled="true"':""}>
        <span class="k">${o.k}</span><span class="tx">${tx(o.t)}</span>
        <span class="mk mk-you">${t("markYou")}</span><span class="mk mk-ok">${t("markOk")}</span>
      </button></li>`; }).join("") + `</ul>`;
  }
  if(q.type === "yesno"){
    return `<ul class="ynlist">` + q.rows.map((r,i) => {
      const v = a ? a[i] : null;
      const right = v !== null && v === r.a;
      return `<li class="yn" data-right="${right?1:0}">
        <div class="ynt">${tx(r.t)}</div>
        <div class="ynb" role="group">
          <button ${P} data-i="${i}" data-v="Y" data-correct="${r.a==="Y"?1:0}" aria-pressed="${v==="Y"}">${t("yes")}</button>
          <button ${P} data-i="${i}" data-v="N" data-correct="${r.a==="N"?1:0}" aria-pressed="${v==="N"}">${t("no")}</button>
        </div></li>`; }).join("") + `</ul>`;
  }
  return `<div class="blanks">` + q.blanks.map((b,i) => {
    const v = a ? a[i] : null;
    const right = v !== null && v === b.a;
    return `<div class="blank" data-right="${right?1:0}">
      ${b.label ? `<span class="blabel">${tx(b.label)}</span>` : ""}
      <label class="sel ${v!==null?"on":""}">
        <select ${P} data-i="${i}">
          <option value="">— —</option>
          ${b.opts.map((o,j) => {
            const en = strip(o.en), vi = o.vi ? strip(o.vi) : "";
            return `<option value="${j}" ${v===j?"selected":""}${vi?` title="${esc(vi)}"`:""}>${esc(en)}</option>`;
          }).join("")}
        </select><span class="cap"></span>
      </label>
      <span class="ansline ${right?"ok":"bad"}">${t("ansTitle")}: ${esc(strip(b.opts[b.a].en))}${
        L === "vi" && b.opts[b.a].vi ? ` — ${esc(strip(b.opts[b.a].vi))}` : ""}</span>
    </div>`; }).join("") + `</div>`;
}

/* ---------- khối giải thích ---------- */
function noteHTML(r){
  return `<div class="notewrap"><span class="lbl">${t("secNote")}</span>
    <textarea data-act="note" rows="2" placeholder="${esc(t("notePh"))}">${esc(r.note||"")}</textarea></div>`;
}
function revealHTML(q, verdict, extra){
  const e = q.explain || {};
  const two = !!(e.key && e.elim && e.elim.length);
  let secs = "";
  if(e.key)  secs += `<div><h4 class="sech">${t("secKey")}</h4><p class="prose">${e.key}</p></div>`;
  if(e.elim && e.elim.length)
    secs += `<div><h4 class="sech">${t("secElim")}</h4><ul class="elim">${e.elim.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  if(e.text) secs += `<div><h4 class="sech">${t("secExp")}</h4><p class="prose">${e.text}</p></div>`;
  const conf = q.conf ? `<span class="conf ${q.conf.toLowerCase()}">${t("conf"+q.conf.toUpperCase())}</span>` : "";
  return `<div class="rev">
    <div class="revtop">${stampHTML(q)}${verdict}${conf}</div>
    <div class="revgrid ${two?"two":""}">${secs}</div>
    ${q.cite ? `<p class="cite">${t("source")}: ${q.cite}</p>` : ""}
    ${extra || ""}
  </div>`;
}

/* ============================================================
   TRẠNG THÁI
   ============================================================ */
const S = { mode:"study", f:{topic:"all",status:"all",type:"all",q:""},
            p:{}, history:[], cur:null, exam:null, reviewWrongOnly:false };
const rec = id => (S.p[id] ||= { a:null, done:0, ok:null, flag:0, note:"", n:0 });
const ansOf = q => { const r = rec(q.id); if(!r.a) r.a = blankAnswer(q); return r.a; };

function save(){
  const e = S.exam;
  const exam = (e && e.phase === "run") ? {
    ids:e.list.map(x=>x.id), order:e.order, answers:e.answers, flags:e.flags,
    pos:e.pos, started:e.started, duration:e.duration, cfg:e.cfg } : null;
  store.set(KEY, JSON.stringify({ v:2, lang:L, theme:document.documentElement.dataset.theme,
                                  p:S.p, history:S.history, exam }));
}
function load(){
  try{
    const d = JSON.parse(store.get(KEY) || "{}");
    if(d.p) S.p = d.p;
    if(Array.isArray(d.history)) S.history = d.history;
    if(d.lang) L = d.lang;
    if(d.exam && d.exam.ids){
      const list = d.exam.ids.map(id => {
        const q = BY_ID[id]; if(!q) return null;
        const ord = d.exam.order && d.exam.order[id];
        if(ord && q.options) return Object.assign({}, q, { options: ord.map(k => q.options.find(o=>o.k===k)).filter(Boolean) });
        return q;
      }).filter(Boolean);
      if(list.length === d.exam.ids.length)
        S.exam = { phase:"run", list, order:d.exam.order, answers:d.exam.answers||{}, flags:d.exam.flags||{},
                   pos:d.exam.pos||0, started:d.exam.started, duration:d.exam.duration, cfg:d.exam.cfg, timer:null };
    }
  }catch(e){}
}

/* ---------- lọc ---------- */
function filtered(){
  const term = fold(S.f.q.trim());
  return ALL.filter(q => {
    if(S.f.topic !== "all" && q.topic !== +S.f.topic) return false;
    if(S.f.type !== "all" && q.type !== S.f.type) return false;
    const r = S.p[q.id];
    if(S.f.status === "todo"  && r && r.done) return false;
    if(S.f.status === "right" && !(r && r.ok === true)) return false;
    if(S.f.status === "wrong" && !(r && r.ok === false)) return false;
    if(S.f.status === "flag"  && !(r && r.flag)) return false;
    if(term && !q.hay.includes(term)) return false;
    return true;
  });
}
function statsOf(list){
  let done=0, right=0, flag=0;
  list.forEach(q => { const r=S.p[q.id]; if(!r) return;
    if(r.ok === true || r.ok === false){ done++; if(r.ok) right++; }
    if(r.flag) flag++; });
  return { done, right, flag, total:list.length };
}

function applyI18n(){
  document.documentElement.lang = L;
  $$("[data-t]").forEach(el => { const v = T[L][el.dataset.t]; if(typeof v === "string") el.textContent = v; });
  $$("[data-t-ph]").forEach(el => { const v = T[L][el.dataset.tPh]; if(typeof v === "string") el.placeholder = v; });
  $("#storeNote").textContent = store.ok ? t("okStore") : t("noStore");
  $$("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === L));
  $$("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === S.mode));
}

function renderRail(){
  // một hàm dựng hàng dùng chung cho MỌI danh sách lọc — thêm bộ lọc mới thì
  // gọi lại nó, đừng đẻ ra kiểu hiển thị thứ hai.
  const listRow = (key, cur, v, lab, count, mark) =>
    `<button class="srow" data-f-key="${key}" data-v="${v}" aria-pressed="${String(v)===String(cur)}">
      <span class="dot ${mark||""}"></span><span class="nm">${esc(lab)}</span><span class="ct">${count}</span>
    </button>`;

  // ----- trạng thái -----
  const counts = (() => {
    let todo=0, right=0, wrong=0, flag=0;
    ALL.forEach(q => { const r = S.p[q.id];
      if(!r || !r.done) todo++;
      if(r && r.ok === true) right++;
      if(r && r.ok === false) wrong++;
      if(r && r.flag) flag++; });
    return {all:ALL.length, todo, right, wrong, flag};
  })();
  $("#fStatus").innerHTML = [
    ["all", t("sAll"), ""], ["todo", t("sTodo"), ""], ["right", t("sRight"), "g"],
    ["wrong", t("sWrong"), "r"], ["flag", t("sFlag"), "f"]
  ].map(([v,lab,mk]) => listRow("status", S.f.status, v, lab, counts[v], mk)).join("");

  // ----- dạng câu: chỉ hiện khi đề có từ hai dạng trở lên -----
  const typeInfo = {mcq:[t("kMcq"),"m-mcq"], yesno:[t("kYesno"),"m-yesno"], dropdown:[t("kDrop"),"m-drop"]};
  const typeBlock = $("#fTypeBlk");
  if(TYPES.length < 2) typeBlock.classList.add("hide");
  else {
    typeBlock.classList.remove("hide");
    const tc = Object.fromEntries(TYPES.map(x => [x, ALL.filter(q => q.type === x).length]));
    $("#fType").innerHTML = listRow("type", S.f.type, "all", t("kAll"), ALL.length, "")
      + TYPES.map(x => listRow("type", S.f.type, x, typeInfo[x][0], tc[x], typeInfo[x][1])).join("");
  }

  const row = (v, name, list) => {
    const s = statsOf(list);
    return `<button class="trow" data-f-key="topic" data-v="${v}" aria-pressed="${String(v)===String(S.f.topic)}">
      <span class="nm">${esc(name)}</span><span class="ct">${s.done}/${s.total}</span>
      <span class="meter"><i class="g" style="width:${pct(s.right,s.total)}%"></i><i class="r" style="width:${pct(s.done-s.right,s.total)}%"></i></span>
    </button>`;
  };
  $("#fTopics").innerHTML = row("all", t("sAll"), ALL) +
    TOPICS.map(n => row(n, t("topicN", n), ALL.filter(q => q.topic === n))).join("");
}

function renderAside(){
  const box = $("#asideBody");
  if(S.mode === "exam" && S.exam && S.exam.phase === "run"){ box.innerHTML = asideExam(); return; }
  if(S.mode === "stats"){ box.innerHTML = asideKeys(); return; }
  box.innerHTML = asideStudy() + asideKeys();
}
function asideStudy(){
  const s = statsOf(ALL);
  const queue = ALL.filter(q => { const r = S.p[q.id]; return r && (r.ok === false || r.flag); }).slice(0,40);
  return `<div class="blk">
    <span class="lbl">${t("progress")}</span>
    <div class="bigbar"><i style="width:${pct(s.right,s.total)}%;background:var(--ok)"></i><i style="width:${pct(s.done-s.right,s.total)}%;background:var(--bad)"></i></div>
    <div class="kv"><span>${t("attempted")}</span><b>${s.done}/${s.total}</b></div>
    <div class="kv"><span>${t("accuracy")}</span><b>${s.done?pct(s.right,s.done)+"%":"—"}</b></div>
    <div class="kv"><span>${t("flagged")}</span><b>${s.flag}</b></div>
  </div>
  <div class="blk only-lg">
    <span class="lbl">${t("queue")} · ${queue.length}</span>
    ${queue.length ? `<div class="queue">` + queue.map(q => {
        const r = S.p[q.id];
        return `<button class="qbtn ${r.ok===false?"is-wrong":"is-flag"}" data-jump="${q.id}">
          <span class="n">${pad2(q.idx)}</span><span class="t">${esc(strip(q.stem.en.replace(/<\/?b\b[^>]*>/g,"")).slice(0,64))}</span></button>`;
      }).join("") + `</div>` : `<p class="note">${t("queueEmpty")}</p>`}
  </div>`;
}
function asideKeys(){
  const r = (k,d) => `<div class="keyrow"><kbd>${k}</kbd><span>${d}</span></div>`;
  return `<div class="blk only-lg"><span class="lbl">${t("keysTitle")}</span><div class="keys">
    ${r("A–D",t("kPick"))}${r("↵",t("kCheck"))}${r("F",t("kFlag"))}${r("← →",t("kNav"))}${r("/",t("kSearch"))}
  </div></div>`;
}
function asideExam(){
  const e = S.exam;
  const left = e.duration ? Math.max(0, e.duration - Math.floor((Date.now()-e.started)/1000)) : null;
  const ans = e.list.filter((q,i) => isComplete(q, e.answers[i])).length;
  return `<div class="blk">
    <span class="lbl">${t("timeLeft")}</span>
    <div class="timer ${left!==null&&left<60?"low":""}" id="timerOut">${left===null?"∞":clock(left)}</div>
  </div>
  <div class="blk">
    <span class="lbl">${t("answeredN")}</span>
    <div class="bigbar"><i style="width:${pct(ans,e.list.length)}%;background:var(--pick)"></i></div>
    <div class="kv"><span>${t("answeredN")}</span><b>${ans}/${e.list.length}</b></div>
  </div>
  <div class="blk"><span class="lbl">${t("palette")}</span>
    <div class="pal">${e.list.map((q,i)=>`<button class="pd ${isComplete(q,e.answers[i])?"is-ans":""} ${e.flags[i]?"is-flag":""} ${i===e.pos?"is-cur":""}" data-go="${i}">${i+1}</button>`).join("")}</div>
  </div>`;
}

/* ---------- vùng chính ---------- */
function renderMain(){
  const v = $("#view");
  v.innerHTML = S.mode === "study" ? viewStudy() : S.mode === "stats" ? viewStats() : viewExam();
}

function viewStudy(){
  const list = filtered();
  const head = `<header class="head">
      <div><h2>${t("studyTitle")}</h2><p>${t("studyLead", list.length)}</p></div>
      <div class="r"><span class="lbl">${esc(DATA.meta.code)}</span></div></header>`;
  if(!list.length) return head + `<div class="empty"><b>${t("emptyT")}</b>${t("emptyD")}</div>`;
  return head + list.map(recordHTML).join("");
}

function typeTag(q){
  if(q.type === "yesno") return `<span class="tag multi">${t("tYesno")}</span>`;
  if(q.type === "dropdown") return `<span class="tag multi">${t("tDrop")}</span>`;
  if(q.multi) return `<span class="tag multi">${t("multi", q.answer.length)}</span>`;
  return "";
}

function recordHTML(q){
  const r = rec(q.id), a = ansOf(q);
  const tags = [`<span class="tag">${esc(t("topicN", q.topic))}</span>`,
                `<span class="tag">${esc(t("qN", q.n))}</span>`, typeTag(q)];
  if(r.done && r.ok === true)  tags.push(`<span class="tag ok">${t("verdictOk")}</span>`);
  if(r.done && r.ok === false) tags.push(`<span class="tag bad">${t("verdictBad")}</span>`);
  tags.push(`<button class="flagbtn" data-act="flag" aria-pressed="${!!r.flag}"
      title="${esc(r.flag?t("unflag"):t("flag"))}" aria-label="${esc(r.flag?t("unflag"):t("flag"))}">${ICON.flag}</button>`);

  const n = answeredCount(q,a), total = totalParts(q);
  const bar = r.done
    ? `<button class="btn" data-act="again">${t("again")}</button>`
    : `<button class="btn solid" data-act="check" ${isComplete(q,a)?"":"disabled"}>${t("check")}</button>
       <button class="btn" data-act="reveal">${t("reveal")}</button>
       <span class="note">${n===0 ? t("pickFirst") : n>=total ? t("answered") : t("partial", n, total)}</span>`;

  const verdict = r.ok === true  ? `<span class="verdict ok">${t("verdictOk")}</span>`
                : r.ok === false ? `<span class="verdict bad">${t("verdictBad")}</span>`
                : `<span class="note">${t("verdictNone")}</span>`;

  return `<article class="rec ${S.cur===q.id?"cur":""}" id="rec-${q.id}" data-id="${q.id}" data-done="${r.done?1:0}">
    <div class="rechead"><span class="idx">${pad2(q.idx)}</span><div class="tags">${tags.join("")}</div></div>
    <p class="stem">${tx(q.stem)}</p>
    ${q.img ? `<img class="qimg" src="${q.img}" alt="" data-zoom>` : ""}
    <div class="qbody">${bodyHTML(q, a, r.done, "ans")}</div>
    <div class="bar">${bar}</div>
    ${revealHTML(q, verdict, noteHTML(r))}
  </article>`;
}

function refreshRecord(id, focusSel){
  const q = BY_ID[id];
  let node = document.getElementById("rec-"+id);
  if(!q || !node) return;
  node.outerHTML = recordHTML(q);
  node = document.getElementById("rec-"+id);
  if(node && focusSel){ const n = node.querySelector(focusSel); if(n) n.focus(); }
}

/* ---------- ghi nhận câu trả lời ---------- */
function applyAnswer(q, a, el){
  if(q.type === "mcq"){
    const k = el.dataset.k;
    if(q.answer.length > 1){
      const i = a.indexOf(k);
      if(i >= 0) a.splice(i,1);
      else { if(a.length >= q.answer.length) a.shift(); a.push(k); }
    } else { a.length = 0; if(!el.dataset.was) a.push(k); }
  } else if(q.type === "yesno"){
    const i = +el.dataset.i;
    a[i] = a[i] === el.dataset.v ? null : el.dataset.v;
  } else {
    const i = +el.dataset.i;
    a[i] = el.value === "" ? null : +el.value;
  }
}

function examPool(cfg){
  let p = ALL;
  if(cfg.topic !== "all") p = p.filter(q => q.topic === +cfg.topic);
  if(cfg.source === "wrong") p = p.filter(q => { const r=S.p[q.id]; return r && r.ok === false; });
  if(cfg.source === "flag")  p = p.filter(q => { const r=S.p[q.id]; return r && r.flag; });
  return p;
}
function viewExam(){
  const e = S.exam;
  if(!e || e.phase === "setup") return examSetup();
  if(e.phase === "run") return examRun();
  return examResult();
}
function selectHTML(name, cur, opts){
  return `<label class="fldw"><span class="lbl">${name}</span>
    <span class="sel"><select data-cfg="${opts.key}">${
      opts.items.map(([v,lab]) => `<option value="${esc(v)}" ${String(v)===String(cur)?"selected":""}>${esc(lab)}</option>`).join("")
    }</select><span class="cap"></span></span></label>`;
}
function examSetup(){
  const cfg = (S.exam && S.exam.cfg) || { count:30, mins:45, topic:"all", shuffle:"yes", source:"all" };
  const n = examPool(cfg).length;
  const resume = S.exam && S.exam.phase === "run";
  return `<header class="head"><div><h2>${t("examSetup")}</h2><p>${t("examLead")}</p></div></header>
  ${resume ? `<div class="panel"><p class="prose" style="margin-bottom:14px">${t("inProgress")}</p>
     <div class="act"><button class="btn solid" data-act="resume">${t("resume")}</button>
     <button class="btn danger" data-act="discard">${t("discard")}</button></div></div>` : ""}
  <div class="panel">
    <div class="grid2">
      ${selectHTML(t("fSource"), cfg.source, {key:"source", items:[["all",t("srcAll")],["wrong",t("srcWrong")],["flag",t("srcFlag")]]})}
      ${selectHTML(t("fScope"), cfg.topic, {key:"topic", items:[["all",t("allTopics")], ...TOPICS.map(x=>[x,t("topicN",x)])]})}
      <label class="fldw"><span class="lbl">${t("fCount")}</span>
        <input class="fld" style="padding:9px 12px;font-size:13.5px;background:var(--paper)" type="number" data-cfg="count" min="1" max="${Math.max(1,n)}" value="${Math.min(cfg.count,Math.max(1,n))}"></label>
      <label class="fldw"><span class="lbl">${t("fTime")}</span>
        <input class="fld" style="padding:9px 12px;font-size:13.5px;background:var(--paper)" type="number" data-cfg="mins" min="0" value="${cfg.mins}"></label>
      ${selectHTML(t("fShuffle"), cfg.shuffle, {key:"shuffle", items:[["yes",t("optYes")],["no",t("optNo")]]})}
    </div>
    <p class="note" style="margin:18px 0 14px">${n ? t("poolInfo", n, Math.min(cfg.count,n)) : t("notEnough")}</p>
    <button class="btn solid" data-act="start" ${n?"":"disabled"}>${t("start")}</button>
  </div>`;
}
function examRun(){
  const e = S.exam, q = e.list[e.pos];
  const a = e.answers[e.pos] || (e.answers[e.pos] = blankAnswer(q));
  const left = e.duration ? Math.max(0, e.duration - Math.floor((Date.now()-e.started)/1000)) : null;
  return `<header class="head">
      <div><h2>${t("examRun")}</h2><p>${t("qPos", e.pos+1, e.list.length)}</p></div>
      <div class="r"><span class="lbl">${t("timeLeft")}</span><div class="timer" id="timerHead">${left===null?"∞":clock(left)}</div></div>
    </header>
  <article class="rec" data-done="0">
    <div class="rechead"><span class="idx">${pad2(e.pos+1)}</span>
      <div class="tags"><span class="tag">${esc(t("topicN", q.topic))}</span>${typeTag(q)}${e.flags[e.pos]?`<span class="tag flag">${t("flag")}</span>`:""}</div></div>
    <p class="stem">${tx(q.stem)}</p>
    ${q.img ? `<img class="qimg" src="${q.img}" alt="" data-zoom>` : ""}
    <div class="qbody">${bodyHTML(q, a, false, "eans")}</div>
    <div class="bar">
      <button class="btn" data-act="eprev" ${e.pos?"":"disabled"}>← ${t("prev")}</button>
      <button class="btn" data-act="enext" ${e.pos<e.list.length-1?"":"disabled"}>${t("next")} →</button>
      <button class="btn sm" data-act="eflag">${e.flags[e.pos]?t("unflag"):t("flag")}</button>
      <span class="grow"></span>
      <button class="btn solid" data-act="esubmit">${t("submit")}</button>
    </div>
  </article>`;
}
function examResult(){
  const R = S.exam.result;
  const p = R.pct >= PASS, C = 2*Math.PI*58;
  const rows = TOPICS.map(n => {
    const d = R.detail.filter(x => x.q.topic === n);
    if(!d.length) return "";
    const c = d.filter(x => x.ok).length;
    return `<tr><td>${esc(t("topicN",n))}</td><td class="num">${d.length}</td><td class="num">${c}</td>
      <td class="num">${pct(c,d.length)}%</td>
      <td><span class="sbar"><i style="width:${pct(c,d.length)}%;background:var(--ok)"></i><i style="width:${pct(d.length-c,d.length)}%;background:var(--bad)"></i></span></td></tr>`;
  }).join("");

  const shown = S.reviewWrongOnly ? R.detail.filter(x => !x.ok) : R.detail;
  const review = shown.map(d => {
    const q = d.q;
    const verdict = `<span class="verdict ${d.ok?"ok":"bad"}">${d.ok?t("verdictOk"):t("verdictBad")}</span>`;
    return `<article class="rec" data-done="1">
      <div class="rechead"><span class="idx">${pad2(R.detail.indexOf(d)+1)}</span>
        <div class="tags"><span class="tag">${esc(t("topicN",q.topic))}</span>${typeTag(q)}
        <span class="tag ${d.ok?"ok":"bad"}">${d.ok?t("verdictOk"):t("verdictBad")}</span></div></div>
      <p class="stem">${tx(q.stem)}</p>
      ${q.img ? `<img class="qimg" src="${q.img}" alt="" data-zoom>` : ""}
      <div class="qbody">${bodyHTML(q, d.given, true, null)}</div>
      ${revealHTML(q, verdict)}
    </article>`;
  }).join("");

  return `<header class="head"><div><h2>${t("resultTitle")}</h2><p>${t("passNote",PASS)}</p></div></header>
  <div class="panel"><div class="score">
    <div class="ring"><svg width="132" height="132" viewBox="0 0 132 132">
      <circle cx="66" cy="66" r="58" fill="none" stroke="var(--rule)" stroke-width="9"/>
      <circle cx="66" cy="66" r="58" fill="none" stroke="${p?"var(--ok)":"var(--flag)"}" stroke-width="9"
              stroke-dasharray="${C}" stroke-dashoffset="${C*(1-R.pct/100)}"/></svg>
      <div class="n"><b>${R.pct}%</b><span>${t("scoreLbl")}</span></div></div>
    <div>
      <div class="result-h ${p?"ok":"bad"}">${p?t("passed"):t("failed")}</div>
      <div class="figs">
        <div class="fig"><b style="color:var(--ok)">${R.correct}</b><span class="lbl">${t("fCorrect")}</span></div>
        <div class="fig"><b style="color:var(--bad)">${R.wrong}</b><span class="lbl">${t("fWrong")}</span></div>
        <div class="fig"><b>${R.blank}</b><span class="lbl">${t("fBlank")}</span></div>
        <div class="fig"><b>${clock(R.secs)}</b><span class="lbl">${t("fTime2")}</span></div>
      </div>
      <div class="act" style="margin-top:18px">
        <button class="btn solid" data-act="newexam">${t("retry")}</button>
        <button class="btn" data-act="togglewrong">${S.reviewWrongOnly?t("reviewAll"):t("reviewWrong")}</button>
      </div></div></div></div>
  <div class="panel"><span class="lbl">${t("byTopic")}</span>
    <div class="tw"><table><thead><tr><th>${t("colTopic")}</th><th class="num">${t("colDone")}</th>
    <th class="num">${t("colRight")}</th><th class="num">${t("colAcc")}</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div></div>
  ${review}`;
}

function viewStats(){
  const s = statsOf(ALL);
  const rows = TOPICS.map(n => {
    const st = statsOf(ALL.filter(q => q.topic === n));
    return `<tr><td>${esc(t("topicN",n))}</td><td class="num">${st.done}/${st.total}</td>
      <td class="num">${st.right}</td><td class="num">${st.done?pct(st.right,st.done)+"%":"—"}</td>
      <td><span class="sbar"><i style="width:${pct(st.right,st.total)}%;background:var(--ok)"></i><i style="width:${pct(st.done-st.right,st.total)}%;background:var(--bad)"></i></span></td></tr>`;
  }).join("");
  const hist = S.history.length ? S.history.slice().reverse().map(h =>
      `<tr><td>${esc(new Date(h.at).toLocaleString(L==="vi"?"vi-VN":"en-GB"))}</td><td>${esc(h.scope)}</td>
       <td class="num">${h.pct}%</td><td class="num">${h.c}/${h.t}</td><td class="num">${clock(h.secs)}</td></tr>`).join("")
    : `<tr><td colspan="5" style="color:var(--ink-3);font-family:var(--serif);font-weight:400">${t("histEmpty")}</td></tr>`;

  return `<header class="head"><div><h2>${t("statsTitle")}</h2><p>${t("statsLead")}</p></div></header>
  <div class="panel"><div class="figs">
    <div class="fig"><b>${s.done}/${s.total}</b><span class="lbl">${t("attempted")}</span></div>
    <div class="fig"><b style="color:var(--ok)">${s.done?pct(s.right,s.done):0}%</b><span class="lbl">${t("accuracy")}</span></div>
    <div class="fig"><b style="color:var(--flag)">${s.flag}</b><span class="lbl">${t("flagged")}</span></div>
    <div class="fig"><b>${S.history.length}</b><span class="lbl">${t("histTitle")}</span></div>
  </div></div>
  <div class="panel"><span class="lbl">${t("byTopic")}</span><div class="tw"><table><thead><tr>
    <th>${t("colTopic")}</th><th class="num">${t("colDone")}</th><th class="num">${t("colRight")}</th>
    <th class="num">${t("colAcc")}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>
  <div class="panel"><span class="lbl">${t("histTitle")}</span><div class="tw"><table><thead><tr>
    <th>${t("colWhen")}</th><th>${t("colScope")}</th><th class="num">${t("colScore")}</th>
    <th class="num">${t("colDetail")}</th><th class="num">${t("colDur")}</th></tr></thead><tbody>${hist}</tbody></table></div></div>`;
}
