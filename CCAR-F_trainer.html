 vụ - mỗi prompt có các ví dụ riêng, sau đó <b class=\"kw\">tổng hợp các phát hiện</b> trước khi đăng."}},{"k":"C","t":{"en":"Provide the <b class=\"kw\">full repository as context</b> instead of just the changed files and surrounding code, giving the model deeper visibility into business logic.","vi":"Cung cấp <b class=\"kw\">toàn bộ repository làm context</b> thay vì chỉ các file thay đổi và code xung quanh, giúp model nhìn sâu hơn vào logic nghiệp vụ."}},{"k":"D","t":{"en":"Upgrade to a <b class=\"kw\">more capable model tier</b>, since its stronger reasoning will handle both concern types in a <b class=\"kw\">single prompt</b> and eliminate the recall trade-off.","vi":"Nâng cấp lên một <b class=\"kw\">bậc model mạnh hơn</b>, vì khả năng suy luận tốt hơn của nó sẽ xử lý được cả hai loại vấn đề trong <b class=\"kw\">một prompt duy nhất</b> và loại bỏ sự đánh đổi về recall."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Dữ liệu cho thấy một <b>trade-off do pha loãng sự chú ý</b>: nhồi thêm ví dụ logic vào một prompt duy nhất làm tăng recall logic (34%→41%) nhưng kéo recall API design xuống (82%→68%). Khi các mối quan tâm cạnh tranh trong một prompt, giải pháp là <b>tách thành các lượt review tập trung</b> — một prompt cho security/API design, một prompt cho business logic — mỗi prompt có <b>ví dụ riêng</b>, rồi gộp kết quả trước khi đăng. Mỗi lượt có toàn bộ “sự chú ý” cho phạm vi của mình nên cải thiện được cả hai loại mà không đánh đổi.","elim":["<b>A.</b> Thay few-shot bằng checklist vẫn giữ mọi mối quan tâm trong một prompt, nên vấn đề cạnh tranh sự chú ý giữa các loại lỗi vẫn còn nguyên.","<b>C.</b> Đưa toàn bộ repository vào context còn làm pha loãng sự chú ý nặng hơn và tăng chi phí; vấn đề không phải thiếu thông tin mà là prompt ôm quá nhiều mục tiêu.","<b>D.</b> Nâng cấp model là giải pháp chung chung, tốn kém và không có gì bảo đảm loại bỏ trade-off mang tính cấu trúc của một prompt đa mục tiêu."]},"cite":"Hướng dẫn ôn tập — §8.3 Code Review nhiều lượt (Multi-pass); Lĩnh vực 4.6"},{"id":"t1q129","n":129,"topic":1,"type":"mcq","stem":{"en":"Your code review assistant needs to analyze pull requests and provide feedback on <b class=\"kw\">three aspects</b>: code style compliance, potential security issues, and documentation completeness. Each aspect requires reading files, running analysis tools, and generating a report section. The review process follows the <b class=\"kw\">same three-step workflow for every PR</b>. Which task decomposition pattern is most appropriate for this workflow?","vi":"Trợ lý review code của bạn cần phân tích các pull request và đưa ra phản hồi về <b class=\"kw\">ba khía cạnh</b>: tuân thủ code style, các vấn đề bảo mật tiềm ẩn, và mức độ đầy đủ của tài liệu. Mỗi khía cạnh đòi hỏi đọc file, chạy các tool phân tích và tạo một phần báo cáo. Quy trình review tuân theo <b class=\"kw\">cùng một workflow ba bước cho mọi PR</b>. Mẫu phân rã tác vụ nào phù hợp nhất cho workflow này?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Prompt chaining</b>—break the review into <b class=\"kw\">sequential steps</b> where each aspect (style, security, documentation) is analyzed separately, with outputs combined in a final synthesis step.","vi":"<b class=\"kw\">Prompt chaining</b>—chia việc review thành <b class=\"kw\">các bước tuần tự</b>, trong đó mỗi khía cạnh (style, bảo mật, tài liệu) được phân tích riêng, với các đầu ra được kết hợp trong một bước tổng hợp cuối cùng."}},{"k":"B","t":{"en":"<b class=\"kw\">Single comprehensive prompt</b>—include all instructions in one prompt and let the model handle all three aspects <b class=\"kw\">simultaneously</b>.","vi":"<b class=\"kw\">Một prompt toàn diện duy nhất</b>—đưa tất cả hướng dẫn vào một prompt và để model xử lý <b class=\"kw\">đồng thời</b> cả ba khía cạnh."}},{"k":"C","t":{"en":"<b class=\"kw\">Orchestrator-workers</b>—have a central LLM analyze each PR to <b class=\"kw\">dynamically determine which checks</b> are needed, then delegate to specialized worker LLMs for each identified subtask.","vi":"<b class=\"kw\">Orchestrator-workers</b>—để một LLM trung tâm phân tích từng PR nhằm <b class=\"kw\">xác định một cách động</b> những kiểm tra nào cần thiết, sau đó ủy thác cho các LLM worker chuyên biệt cho từng tác vụ con được xác định."}},{"k":"D","t":{"en":"<b class=\"kw\">Routing</b>—<b class=\"kw\">classify each PR by type</b> (feature, bugfix, refactor) first, then route to different review prompts optimized for that category.","vi":"<b class=\"kw\">Routing</b>—trước tiên <b class=\"kw\">phân loại từng PR theo loại</b> (feature, bugfix, refactor), sau đó định tuyến đến các prompt review khác nhau được tối ưu cho loại đó."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Workflow có <b>cấu trúc cố định, dự đoán được</b>: cùng ba khía cạnh (style, security, documentation) cho <b>mọi PR</b>. Đây đúng là trường hợp của <b>prompt chaining / pipeline cố định</b> — chia thành các bước tuần tự, mỗi bước tập trung vào một khía cạnh, rồi có bước tổng hợp cuối. Mỗi bước được tối ưu riêng, dễ debug và kiểm thử, và không cần LLM “quyết định” cần làm gì vì các bước đã biết trước.","elim":["<b>B.</b> Một prompt ôm cả ba khía cạnh (mỗi khía cạnh lại cần đọc file, chạy tool, viết báo cáo) dễ gây pha loãng sự chú ý và bỏ sót, đồng thời khó debug khi một phần kém chất lượng.","<b>C.</b> Orchestrator-workers phù hợp khi các subtask <b>không biết trước</b> và phải xác định động; ở đây ba bước luôn cố định nên thêm lớp điều phối động chỉ tăng độ phức tạp và chi phí.","<b>D.</b> Routing theo loại PR không phù hợp vì mọi PR đều cần đủ cả ba khía cạnh review như nhau, bất kể là feature, bugfix hay refactor."]},"cite":"Hướng dẫn ôn tập — §8.1 Pipeline cố định (Prompt Chaining); Lĩnh vực 1.6"},{"id":"t1q130","n":130,"topic":1,"type":"mcq","stem":{"en":"After the web search and document analysis <b class=\"kw\">subagents complete their tasks</b>, the coordinator needs to <b class=\"kw\">spawn the synthesis subagent</b> to synthesize the findings. What is the correct approach for providing the synthesis subagent with <b class=\"kw\">the information it needs</b>?","vi":"Sau khi các subagent tìm kiếm web và phân tích tài liệu <b class=\"kw\">hoàn thành nhiệm vụ</b>, coordinator cần <b class=\"kw\">khởi tạo subagent tổng hợp</b> để tổng hợp các phát hiện. Cách tiếp cận đúng để cung cấp cho subagent tổng hợp <b class=\"kw\">thông tin nó cần</b> là gì?"},"options":[{"k":"A","t":{"en":"Provide the subagent with <b class=\"kw\">tool definitions</b> that allow it to request outputs from other subagents <b class=\"kw\">via callbacks</b>","vi":"Cung cấp cho subagent các <b class=\"kw\">định nghĩa tool</b> cho phép nó yêu cầu đầu ra từ các subagent khác <b class=\"kw\">thông qua callback</b>"}},{"k":"B","t":{"en":"Pass <b class=\"kw\">reference identifiers</b> and configure the subagent with read access to a <b class=\"kw\">shared memory store</b> where other subagents deposited their results","vi":"Truyền các <b class=\"kw\">định danh tham chiếu</b> và cấu hình subagent với quyền đọc vào một <b class=\"kw\">kho bộ nhớ dùng chung</b>, nơi các subagent khác đã lưu kết quả của chúng"}},{"k":"C","t":{"en":"Include the <b class=\"kw\">complete findings</b> from both subagents <b class=\"kw\">directly in the synthesis subagent&#x27;s prompt</b>","vi":"Đưa <b class=\"kw\">toàn bộ các phát hiện</b> từ cả hai subagent <b class=\"kw\">trực tiếp vào prompt</b> của subagent tổng hợp"}},{"k":"D","t":{"en":"Spawn the subagent with only a <b class=\"kw\">brief task description</b>, relying on <b class=\"kw\">automatic context inheritance</b> from the coordinator","vi":"Khởi tạo subagent chỉ với một <b class=\"kw\">mô tả nhiệm vụ ngắn gọn</b>, dựa vào việc <b class=\"kw\">tự động kế thừa context</b> từ coordinator"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Subagent <b>không kế thừa</b> context của coordinator hay của các subagent khác — nó chỉ biết những gì có trong prompt được truyền qua tool <code>Task</code>. Vì vậy coordinator phải <b>đưa đầy đủ findings của cả hai subagent trực tiếp vào prompt</b> của subagent tổng hợp (kèm nguồn/trích dẫn để giữ provenance). Đây là cách đơn giản, tường minh và đúng với mô hình hub-and-spoke: mọi dữ liệu đi qua coordinator.","elim":["<b>A.</b> Subagent không thể “gọi ngược” sang các subagent khác qua callback — trong mô hình hub-and-spoke mọi giao tiếp đi qua coordinator, và các subagent kia đã hoàn tất.","<b>B.</b> Kho bộ nhớ dùng chung kèm reference ID là thêm hạ tầng không cần thiết và tạo luồng dữ liệu ngầm vòng qua coordinator; cách khuyến nghị là truyền trực tiếp kết quả trong prompt của subagent.","<b>D.</b> Không có cơ chế kế thừa context tự động từ coordinator; mô tả nhiệm vụ ngắn gọn khiến subagent tổng hợp không có findings nào để tổng hợp."]},"cite":"Hướng dẫn ôn tập — §3.4 Tool Task để Sinh ra Subagent; Lĩnh vực 1.3"},{"id":"t1q131","n":131,"topic":1,"type":"mcq","stem":{"en":"Developer Productivity An engineer asks the agent to find all files in the monorepo that <b class=\"kw\">import the @company/auth package</b> to understand how authentication is used <b class=\"kw\">across services</b>. Which <b class=\"kw\">built-in tool</b> is most appropriate for this task?","vi":"Developer Productivity (Năng suất lập trình viên) Một kỹ sư yêu cầu agent tìm tất cả các file trong monorepo có <b class=\"kw\">import package @company/auth</b> để hiểu cách xác thực được sử dụng <b class=\"kw\">trên các service</b>. <b class=\"kw\">Tool tích hợp sẵn</b> nào phù hợp nhất cho tác vụ này?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Bash</b>, to execute <b class=\"kw\">find . -type d -name &quot;auth&quot;</b> and explore matching directories","vi":"<b class=\"kw\">Bash</b>, để chạy <b class=\"kw\">find . -type d -name &quot;auth&quot;</b> và khám phá các thư mục khớp"}},{"k":"B","t":{"en":"<b class=\"kw\">Grep</b>, to search for the <b class=\"kw\">import statement pattern</b> across file contents","vi":"<b class=\"kw\">Grep</b>, để tìm kiếm <b class=\"kw\">mẫu câu lệnh import</b> trong nội dung các file"}},{"k":"C","t":{"en":"<b class=\"kw\">Read</b>, starting with <b class=\"kw\">package.json files</b> to trace dependency declarations","vi":"<b class=\"kw\">Read</b>, bắt đầu với các <b class=\"kw\">file package.json</b> để lần theo các khai báo dependency"}},{"k":"D","t":{"en":"<b class=\"kw\">Glob</b>, to find files with <b class=\"kw\">&quot;auth&quot; in their filename or path</b>","vi":"<b class=\"kw\">Glob</b>, để tìm các file có <b class=\"kw\">&quot;auth&quot; trong tên file hoặc đường dẫn</b>"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Yêu cầu là tìm các file có <b>nội dung</b> chứa câu lệnh import <code>@company/auth</code>. <b>Grep</b> là tool tích hợp sẵn chuyên tìm kiếm <b>trong nội dung file</b> (tên hàm, thông báo lỗi, import), quét toàn bộ monorepo nhanh và trả về đúng danh sách file sử dụng package. Đây cũng là bước khởi đầu chuẩn của chiến lược điều tra tăng dần: Grep tìm điểm sử dụng, rồi Read các file cần đọc sâu.","elim":["<b>A.</b> <code>find -type d -name auth</code> tìm thư mục tên “auth”, không liên quan đến việc file nào import package; vừa sai mục tiêu vừa dùng Bash thay cho tool chuyên dụng.","<b>C.</b> <code>package.json</code> chỉ cho biết package nào khai báo dependency, không chỉ ra file mã nguồn cụ thể nào import nó; đọc lần lượt từng file cũng tốn context.","<b>D.</b> Glob khớp theo tên/đường dẫn file, trong khi file import <code>@company/auth</code> có thể mang bất kỳ tên nào — Glob không nhìn vào nội dung."]},"cite":"Hướng dẫn ôn tập — §13.1 Tham chiếu Lựa chọn Tool; Lĩnh vực 2.5"},{"id":"t1q132","n":132,"topic":1,"type":"mcq","stem":{"en":"Your MCP server includes archive_file(file_id) and delete_file(file_id) tools. Production logs show the agent <b class=\"kw\">calls delete_file</b> when users ask to &quot;<b class=\"kw\">remove old backups</b>,&quot; <b class=\"kw\">policy requires archiving backup files</b>. Both tools currently have <b class=\"kw\">minimal descriptions</b>: &quot;Archives a file&quot; and &quot;Deletes a file.&quot; Which change most directly improves tool selection?","vi":"MCP server của bạn có các tool archive_file(file_id) và delete_file(file_id). Log production cho thấy agent <b class=\"kw\">gọi delete_file</b> khi người dùng yêu cầu &quot;<b class=\"kw\">xóa các bản backup cũ</b>&quot;, chính sách <b class=\"kw\">yêu cầu lưu trữ (archive) các file backup</b>. Cả hai tool hiện chỉ có <b class=\"kw\">mô tả tối giản</b>: &quot;Archives a file&quot; và &quot;Deletes a file.&quot; Thay đổi nào cải thiện việc lựa chọn tool một cách trực tiếp nhất?"},"options":[{"k":"A","t":{"en":"Implement <b class=\"kw\">server-side validation</b> that <b class=\"kw\">rejects delete_file calls</b> for files tagged as backups, returning an error message suggesting archive_file.","vi":"Triển khai <b class=\"kw\">kiểm tra hợp lệ (validation) phía server</b> để <b class=\"kw\">từ chối các lệnh gọi delete_file</b> đối với file được gắn tag là backup, trả về thông báo lỗi gợi ý dùng archive_file."}},{"k":"B","t":{"en":"Add <b class=\"kw\">few-shot examples</b> to the <b class=\"kw\">system prompt</b> demonstrating that requests involving &quot;backup&quot; or &quot;old&quot; should use archive_file.","vi":"Thêm các <b class=\"kw\">ví dụ few-shot</b> vào <b class=\"kw\">system prompt</b> minh họa rằng các yêu cầu liên quan đến &quot;backup&quot; hoặc &quot;old&quot; nên dùng archive_file."}},{"k":"C","t":{"en":"<b class=\"kw\">Expand tool descriptions</b> to clarify use cases, adding guidance like <b class=\"kw\">&quot;Do not use for backup files&quot;</b> to delete_file.","vi":"<b class=\"kw\">Mở rộng mô tả tool</b> để làm rõ các trường hợp sử dụng, thêm hướng dẫn như <b class=\"kw\">&quot;Do not use for backup files&quot;</b> vào delete_file."}},{"k":"D","t":{"en":"Add a <b class=\"kw\">confirmation step</b> that requires users to type <b class=\"kw\">&quot;CONFIRM DELETE&quot;</b> before delete_file executes.","vi":"Thêm một <b class=\"kw\">bước xác nhận</b> yêu cầu người dùng gõ <b class=\"kw\">&quot;CONFIRM DELETE&quot;</b> trước khi delete_file được thực thi."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> <b>Mô tả tool là cơ chế chính</b> để LLM chọn tool. Hai mô tả tối thiểu “Archives a file” / “Deletes a file” không cho model biết khi nào dùng cái nào, nên với yêu cầu “remove old backups” nó chọn delete theo nghĩa đen. Mở rộng mô tả để nêu rõ <b>trường hợp sử dụng và ranh giới</b> (ví dụ thêm “Do not use for backup files — use archive_file” vào <code>delete_file</code>) giải quyết <b>trực tiếp</b> nguyên nhân gốc của việc chọn sai tool.","elim":["<b>A.</b> Validation phía server là lớp bảo vệ hữu ích nhưng chỉ chặn sau khi model đã chọn sai; nó không cải thiện việc <b>lựa chọn</b> tool mà câu hỏi yêu cầu.","<b>B.</b> Few-shot dựa trên từ khóa “backup”/“old” dễ gây liên tưởng sai (ví dụ file “old” không phải backup) và kém trực tiếp hơn việc sửa chính mô tả tool mà model dùng để chọn.","<b>D.</b> Bắt người dùng gõ “CONFIRM DELETE” thêm ma sát và không sửa việc agent chọn sai tool; người dùng vẫn có thể xác nhận một thao tác vi phạm chính sách."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q133","n":133,"topic":1,"type":"mcq","stem":{"en":"Your CRM agent&#x27;s delete_contact tool handles requests like &quot;delete the duplicate entry for Acme Corp.&quot; The database contains <b class=\"kw\">similarly named records</b> (e.g., &quot;Acme Corp,&quot; &quot;Acme Corporation,&quot; &quot;ACME Corp Inc.&quot;), and analytics show 8% of deletions are reversed within 24 hours due to <b class=\"kw\">misidentified records</b>. Users have also complained that the current multi-step confirmation flow adds <b class=\"kw\">too much friction</b> to routine cleanup tasks. Which approach most effectively reduces the error rate while <b class=\"kw\">maintaining workflow efficiency</b>?","vi":"Tool delete_contact của agent CRM của bạn xử lý các yêu cầu như &quot;xóa bản ghi trùng lặp của Acme Corp.&quot; Cơ sở dữ liệu chứa <b class=\"kw\">các bản ghi có tên tương tự</b> (ví dụ: &quot;Acme Corp,&quot; &quot;Acme Corporation,&quot; &quot;ACME Corp Inc.&quot;), và số liệu phân tích cho thấy 8% số lần xóa bị hoàn tác trong vòng 24 giờ do <b class=\"kw\">xác định nhầm bản ghi</b>. Người dùng cũng phàn nàn rằng luồng xác nhận nhiều bước hiện tại gây <b class=\"kw\">quá nhiều phiền hà</b> cho các tác vụ dọn dẹp thường ngày. Cách tiếp cận nào giảm tỷ lệ lỗi hiệu quả nhất trong khi vẫn <b class=\"kw\">duy trì hiệu quả của workflow</b>?"},"options":[{"k":"A","t":{"en":"Require users to <b class=\"kw\">supply the exact record ID</b> from the CRM Interface rather than using natural language references to contact names.","vi":"Yêu cầu người dùng <b class=\"kw\">cung cấp ID bản ghi chính xác</b> từ giao diện CRM thay vì dùng tham chiếu bằng ngôn ngữ tự nhiên đến tên liên hệ."}},{"k":"B","t":{"en":"Implement <b class=\"kw\">soft-delete</b> with a <b class=\"kw\">30-day recovery window</b> so users can undo mistakes without slowing down the deletion workflow.","vi":"Triển khai <b class=\"kw\">soft-delete</b> với <b class=\"kw\">thời hạn khôi phục 30 ngày</b> để người dùng có thể hoàn tác sai sót mà không làm chậm workflow xóa."}},{"k":"C","t":{"en":"Deploy <b class=\"kw\">automated duplicate detection</b> that identifies and <b class=\"kw\">merges probable duplicates</b>, removing the need for manual deletion requests.","vi":"Deploy cơ chế <b class=\"kw\">phát hiện trùng lặp tự động</b> để xác định và <b class=\"kw\">merge các bản ghi</b> có khả năng trùng lặp, loại bỏ nhu cầu gửi yêu cầu xóa thủ công."}},{"k":"D","t":{"en":"Present matched records with <b class=\"kw\">differentiating fields</b> and require <b class=\"kw\">single-click confirmation</b> of the intended target before executing deletion.","vi":"Hiển thị các bản ghi khớp kèm <b class=\"kw\">các trường giúp phân biệt</b> và yêu cầu <b class=\"kw\">xác nhận bằng một cú nhấp</b> đối với bản ghi mục tiêu dự định trước khi thực hiện xóa."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Nguyên nhân lỗi là <b>sự mơ hồ</b> giữa các bản ghi tên gần giống nhau (“Acme Corp”, “Acme Corporation”, “ACME Corp Inc.”). Hiển thị các bản ghi khớp kèm <b>các trường phân biệt</b> (địa chỉ, email, ngày tạo, ID…) giúp người dùng nhận ra đúng bản ghi, và chỉ cần <b>một cú click xác nhận</b> mục tiêu trước khi xóa. Cách này xử lý tận gốc việc nhận diện sai, đồng thời thay quy trình xác nhận nhiều bước bằng một bước nhẹ — cân bằng giữa độ chính xác và hiệu quả.","elim":["<b>A.</b> Bắt người dùng tự tra và nhập record ID làm tăng ma sát đáng kể, đi ngược yêu cầu duy trì hiệu quả cho các tác vụ dọn dẹp thường xuyên.","<b>B.</b> Soft-delete chỉ giúp khôi phục sau khi đã xóa nhầm, không làm giảm tỷ lệ nhận diện sai (8%) — lỗi vẫn xảy ra, chỉ dễ sửa hơn.","<b>C.</b> Tự động phát hiện và merge bản ghi trùng là thay đổi lớn, rủi ro merge nhầm chính các bản ghi tên gần giống, và không giải quyết yêu cầu xóa có chủ đích của người dùng."]},"cite":"Hướng dẫn ôn tập — §9.2 Các mẫu Escalation; Lĩnh vực 5.2"},{"id":"t1q134","n":134,"topic":1,"type":"mcq","stem":{"en":"Your team is extracting structured data from <b class=\"kw\">50,000 legacy legal contracts</b> under a <b class=\"kw\">two-week deadline</b>. Initial testing with 500 sample documents shows <b class=\"kw\">82% pass JSON schema first attempt</b>, while the remaining 18% fall due to diverse issues—missing required fields, malformed dates, and incorrectly identified parties. Documents that fail typically need <b class=\"kw\">refinements targeting their specific failure modes</b>. What&#x27;s the most effective processing strategy?","vi":"Nhóm của bạn đang trích xuất dữ liệu có cấu trúc từ <b class=\"kw\">50,000 hợp đồng pháp lý cũ</b> với <b class=\"kw\">thời hạn hai tuần</b>. Kiểm thử ban đầu với 500 tài liệu mẫu cho thấy <b class=\"kw\">82% vượt qua JSON schema ngay lần đầu</b>, trong khi 18% còn lại thất bại do nhiều vấn đề khác nhau—thiếu trường bắt buộc, ngày sai định dạng, và xác định sai các bên. Các tài liệu thất bại thường cần những <b class=\"kw\">tinh chỉnh nhắm vào kiểu lỗi cụ thể</b> của chúng. Chiến lược xử lý nào hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"Use the <b class=\"kw\">real-time API for all 50,000 documents</b> since the batch API&#x27;s 24-hour processing window creates unacceptable deadline risk.","vi":"Dùng <b class=\"kw\">API real-time cho tất cả 50,000 tài liệu</b> vì khoảng thời gian xử lý 24 giờ của batch API tạo ra rủi ro trễ hạn không thể chấp nhận."}},{"k":"B","t":{"en":"Submit <b class=\"kw\">all 50,000 documents via batch API</b>, then submit failed extractions in <b class=\"kw\">successive batches</b>— refining prompts between each batch—until all documents pass validation.","vi":"Gửi <b class=\"kw\">tất cả 50,000 tài liệu qua batch API</b>, sau đó gửi các kết quả trích xuất thất bại trong <b class=\"kw\">các batch kế tiếp</b>— tinh chỉnh prompt giữa mỗi batch—cho đến khi tất cả tài liệu vượt qua kiểm tra hợp lệ (validation)."}},{"k":"C","t":{"en":"Split documents into <b class=\"kw\">10 sequential batches</b> of 5,000 each, analysing results and <b class=\"kw\">refining prompts between batches</b> to improve extraction quality progressively.","vi":"Chia tài liệu thành <b class=\"kw\">10 batch tuần tự</b>, mỗi batch 5,000 tài liệu, phân tích kết quả và <b class=\"kw\">tinh chỉnh prompt giữa các batch</b> để cải thiện dần chất lượng trích xuất."}},{"k":"D","t":{"en":"Process <b class=\"kw\">2,000 sample documents</b> via real time API to identify failure patterns and refine prompts, then <b class=\"kw\">batch process all 50,000</b> with the optimized prompts.","vi":"Xử lý <b class=\"kw\">2,000 tài liệu mẫu</b> qua API real-time để xác định các mẫu lỗi và tinh chỉnh prompt, sau đó <b class=\"kw\">xử lý batch toàn bộ 50,000</b> tài liệu với các prompt đã được tối ưu."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Với 50.000 tài liệu không cần phản hồi tức thì, <b>Message Batches API</b> là lựa chọn phù hợp: tiết kiệm 50% chi phí, cửa sổ xử lý tối đa 24 giờ — hoàn toàn nằm trong hạn 2 tuần. 82% tài liệu sẽ qua ngay lượt đầu; 18% còn lại lỗi do <b>nhiều nguyên nhân đa dạng</b>, cần tinh chỉnh prompt theo từng kiểu lỗi. Vì vậy chỉ <b>gửi lại các tài liệu thất bại</b> (nhận diện qua <code>custom_id</code>) trong các batch kế tiếp, tinh chỉnh prompt giữa mỗi vòng, cho tới khi tất cả qua validation — vừa tối ưu chi phí vừa xử lý được đuôi lỗi đa dạng.","elim":["<b>A.</b> Dùng API đồng bộ cho toàn bộ 50.000 tài liệu bỏ mất mức tiết kiệm 50%; cửa sổ 24 giờ của batch không phải rủi ro với hạn 2 tuần, đủ cho nhiều vòng batch.","<b>C.</b> Chia 10 batch tuần tự và tinh chỉnh giữa các batch xử lý lại cả các tài liệu vốn đã thành công với prompt cũ, kéo dài thời gian không cần thiết thay vì chỉ nhắm vào phần thất bại.","<b>D.</b> Đã có kết quả thử nghiệm trên 500 mẫu; lỗi đa dạng ở phần đuôi khó được phát hiện hết bằng mẫu 2.000 tài liệu, nên vẫn cần cơ chế xử lý lại các tài liệu thất bại sau batch chính."]},"cite":"Hướng dẫn ôn tập — §7.4 Xử lý các thất bại trong Batch; Lĩnh vực 4.5"},{"id":"t1q135","n":135,"topic":1,"type":"mcq","stem":{"en":"After deploying an updated system prompt that improves response quality, users with <b class=\"kw\">multi-session conversations spanning several weeks</b> report that the assistant now <b class=\"kw\">contradicts its earlier statements</b> and has a noticeably different communication style. <b class=\"kw\">New users don&#x27;t experience these issues</b>. What&#x27;s the best approach to resolve this?","vi":"Sau khi deploy một system prompt cập nhật giúp cải thiện chất lượng phản hồi, những người dùng có <b class=\"kw\">các cuộc hội thoại nhiều session kéo dài vài tuần</b> báo cáo rằng trợ lý giờ đây <b class=\"kw\">mâu thuẫn với các phát biểu trước đó</b> của nó và có phong cách giao tiếp khác biệt rõ rệt. <b class=\"kw\">Người dùng mới không gặp những vấn đề này</b>. Cách tiếp cận tốt nhất để giải quyết vấn đề này là gì?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Regenerate summaries</b> of existing conversations using the new prompt and <b class=\"kw\">replace the stored histories</b> to align past context with current behavior.","vi":"<b class=\"kw\">Tạo lại bản tóm tắt</b> của các cuộc hội thoại hiện có bằng prompt mới và <b class=\"kw\">thay thế lịch sử đã lưu</b> để căn chỉnh context trong quá khứ với hành vi hiện tại."}},{"k":"B","t":{"en":"Add <b class=\"kw\">instructions to the new system prompt</b> directing the assistant to <b class=\"kw\">maintain consistency</b> with any prior statements in the conversation history.","vi":"Thêm <b class=\"kw\">hướng dẫn vào system prompt mới</b>, yêu cầu trợ lý <b class=\"kw\">duy trì sự nhất quán</b> với mọi phát biểu trước đó trong lịch sử hội thoại."}},{"k":"C","t":{"en":"Add a <b class=\"kw\">transition message</b> when sessions resume explaining that the assistant has been updated and behavior may differ.","vi":"Thêm một <b class=\"kw\">thông báo chuyển tiếp</b> khi session được tiếp tục, giải thích rằng trợ lý đã được cập nhật và hành vi có thể khác."}},{"k":"D","t":{"en":"<b class=\"kw\">Version system prompts</b> and associate each conversation with the prompt version under which it started, <b class=\"kw\">applying updates only to new conversations</b>.","vi":"<b class=\"kw\">Đánh phiên bản cho system prompt</b> và gắn mỗi cuộc hội thoại với phiên bản prompt mà nó bắt đầu, <b class=\"kw\">chỉ áp dụng cập nhật cho các cuộc hội thoại mới</b>."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Chỉ những hội thoại <b>bắt đầu dưới system prompt cũ</b> bị ảnh hưởng: lịch sử của chúng được tạo theo hành vi/giọng điệu cũ, nay bị system prompt mới “ghi đè” nên sinh ra mâu thuẫn. Giải pháp tận gốc là <b>quản lý phiên bản system prompt</b> và gắn mỗi hội thoại với phiên bản mà nó bắt đầu, chỉ áp dụng bản cập nhật cho <b>hội thoại mới</b>. Cách này giữ tính nhất quán cho người dùng cũ mà người dùng mới vẫn hưởng chất lượng cải tiến.","elim":["<b>A.</b> Viết lại tóm tắt và thay thế lịch sử đã lưu làm sai lệch những gì người dùng thực sự đã thấy/được nói, có thể gây mất thông tin và vẫn tạo ra mâu thuẫn với trí nhớ của người dùng.","<b>B.</b> Chỉ dẫn “giữ nhất quán với phát ngôn trước” mâu thuẫn trực tiếp với các thay đổi hành vi trong chính system prompt mới; chỉ là ràng buộc mềm, không loại bỏ xung đột gốc.","<b>C.</b> Thông báo “đã được cập nhật” chỉ giải thích sự không nhất quán chứ không khắc phục nó; trải nghiệm người dùng vẫn bị gián đoạn."]},"cite":"Hướng dẫn ôn tập — §1.4 System Prompt"},{"id":"t1q136","n":136,"topic":1,"type":"mcq","stem":{"en":"Evaluation shows 94% extraction accuracy on short meeting transcripts (&lt;30 minutes) but <b class=\"kw\">only 68% on longer transcripts</b> (&gt;60 minutes) where discussions meander and <b class=\"kw\">key information is scattered throughout</b>. Transcripts of both lengths <b class=\"kw\">fit within the model&#x27;s context window</b>. What pattern most effectively improves accuracy on complex, lengthy documents?","vi":"Đánh giá cho thấy độ chính xác trích xuất đạt 94% trên các transcript cuộc họp ngắn (&lt;30 phút) nhưng <b class=\"kw\">chỉ 68% trên các transcript dài hơn</b> (&gt;60 phút), nơi các cuộc thảo luận lan man và <b class=\"kw\">thông tin quan trọng nằm rải rác khắp nơi</b>. Transcript ở cả hai độ dài <b class=\"kw\">đều vừa trong context window của model</b>. Mẫu nào cải thiện độ chính xác hiệu quả nhất trên các tài liệu phức tạp, dài?"},"options":[{"k":"A","t":{"en":"Add <b class=\"kw\">few-shot examples</b> demonstrating correct extraction from lengthy meetings with scattered Information.","vi":"Thêm các <b class=\"kw\">ví dụ few-shot</b> minh họa việc trích xuất đúng từ các cuộc họp dài có thông tin rải rác."}},{"k":"B","t":{"en":"Upgrade to a <b class=\"kw\">more capable model tier</b> for the extraction task","vi":"Nâng cấp lên một <b class=\"kw\">bậc model mạnh hơn</b> cho tác vụ trích xuất"}},{"k":"C","t":{"en":"<b class=\"kw\">Split lengthy transcripts Into chunks</b>, extract from each chunk separately, then <b class=\"kw\">merge and deduplicate</b> the results.","vi":"<b class=\"kw\">Chia các transcript dài thành các chunk</b>, trích xuất riêng từ mỗi chunk, sau đó <b class=\"kw\">merge và loại bỏ trùng lặp</b> kết quả."}},{"k":"D","t":{"en":"Add a <b class=\"kw\">pre-extraction step</b> where the model <b class=\"kw\">summarizes key discussions</b> and conclusions before performing structured extraction.","vi":"Thêm một <b class=\"kw\">bước tiền trích xuất</b>, trong đó model <b class=\"kw\">tóm tắt các cuộc thảo luận</b> và kết luận chính trước khi thực hiện trích xuất có cấu trúc."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Cả hai độ dài đều <b>vừa context window</b>, nên vấn đề không phải giới hạn token mà là <b>pha loãng sự chú ý</b>: với transcript dài, lan man, thông tin then chốt rải rác khắp nơi và dễ bị bỏ sót (hiệu ứng “lost in the middle”). Chia transcript thành các <b>chunk</b>, trích xuất từng chunk riêng để mỗi lượt model tập trung vào một đoạn ngắn — tương tự mức 94% của transcript ngắn — rồi <b>gộp và loại trùng</b> kết quả. Đây là mẫu phân rã đa lượt thường dùng cho tài liệu dài, phức tạp.","elim":["<b>A.</b> Few-shot với transcript dài bản thân rất tốn token và không giải quyết việc model phải chú ý cùng lúc cả một tài liệu dài với thông tin rải rác.","<b>B.</b> Nâng cấp model là giải pháp chung chung, tốn kém, không xử lý cấu trúc của vấn đề pha loãng sự chú ý trên tài liệu dài.","<b>D.</b> Tóm tắt trước khi trích xuất là bước <b>làm mất thông tin</b> — chi tiết rải rác dễ bị lược bỏ ngay ở bước tóm tắt, khiến lượt trích xuất sau không còn dữ liệu đó."]},"cite":"Hướng dẫn ôn tập — §11.3 Đầu vào Nhận biết Vị trí; Lĩnh vực 4.6"},{"id":"t1q137","n":137,"topic":1,"type":"mcq","stem":{"en":"You&#x27;re implementing a complex graph traversal algorithm with <b class=\"kw\">specific performance requirements and edge cases</b> to handle (disconnected nodes, cycles, weighted edges). You want to structure your workflow for efficient <b class=\"kw\">iterative refinement</b> with Claude. What approach will most effectively enable <b class=\"kw\">progressive improvement across multiple iterations</b>?","vi":"Bạn đang triển khai một thuật toán duyệt đồ thị phức tạp với <b class=\"kw\">các yêu cầu hiệu năng cụ thể và các edge case</b> cần xử lý (nút không liên thông, chu trình, cạnh có trọng số). Bạn muốn cấu trúc workflow để <b class=\"kw\">tinh chỉnh lặp</b> một cách hiệu quả với Claude. Cách tiếp cận nào sẽ giúp <b class=\"kw\">cải thiện dần qua nhiều vòng lặp</b> một cách hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"Have Claude extensively research the algorithm and create a <b class=\"kw\">detailed implementation plan</b> using <b class=\"kw\">extended thinking</b>, then implement the complete solution based on that plan.","vi":"Để Claude nghiên cứu kỹ thuật toán và tạo một <b class=\"kw\">kế hoạch triển khai chi tiết</b> bằng <b class=\"kw\">extended thinking</b>, sau đó triển khai giải pháp hoàn chỉnh dựa trên kế hoạch đó."}},{"k":"B","t":{"en":"Write a <b class=\"kw\">test suite</b> covering expected behavior, edge cases, and performance requirements before implementation. Ask Claude to write code that passes the tests, then iterate by <b class=\"kw\">sharing test failures</b> with each refinement request.","vi":"Viết một <b class=\"kw\">bộ test</b> bao quát hành vi mong đợi, các edge case và yêu cầu hiệu năng trước khi triển khai. Yêu cầu Claude viết code vượt qua các test, sau đó lặp lại bằng cách <b class=\"kw\">chia sẻ các test thất bại</b> trong mỗi yêu cầu tinh chỉnh."}},{"k":"C","t":{"en":"Provide Claude with a <b class=\"kw\">reference implementation</b> from documentation, then ask it to rewrite the code to match your codebase style and add the required edge case handling, <b class=\"kw\">comparing outputs against the reference</b>.","vi":"Cung cấp cho Claude một <b class=\"kw\">bản triển khai tham khảo</b> từ tài liệu, sau đó yêu cầu nó viết lại code cho khớp với style của codebase và thêm phần xử lý edge case cần thiết, <b class=\"kw\">so sánh đầu ra với bản tham khảo</b>."}},{"k":"D","t":{"en":"Provide Claude with a detailed <b class=\"kw\">natural language specification</b> of the algorithm, including all requirements and edge cases. <b class=\"kw\">Review each output manually</b> and provide descriptive feedback on what behavior needs to change.","vi":"Cung cấp cho Claude một <b class=\"kw\">đặc tả chi tiết bằng ngôn ngữ tự nhiên</b> về thuật toán, bao gồm tất cả yêu cầu và edge case. <b class=\"kw\">Review thủ công từng đầu ra</b> và đưa ra phản hồi mô tả hành vi nào cần thay đổi."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Với thuật toán có yêu cầu hiệu năng và edge case rõ ràng (node rời rạc, chu trình, cạnh có trọng số), cách lặp hiệu quả nhất là <b>lặp theo hướng test (test-driven iteration)</b>: viết bộ test bao phủ hành vi mong đợi, edge case và yêu cầu hiệu năng <b>trước</b>, yêu cầu Claude viết code để pass, rồi mỗi vòng gửi lại <b>các test thất bại cụ thể</b>. Test cho tín hiệu phản hồi khách quan, chính xác và tự động, giúp mỗi vòng cải tiến có mục tiêu rõ và không làm hỏng các phần đã đúng.","elim":["<b>A.</b> Lập kế hoạch kỹ rồi viết toàn bộ một lần không tạo vòng phản hồi để cải thiện dần; không có tiêu chí khách quan để biết lời giải đã đáp ứng edge case và hiệu năng hay chưa.","<b>C.</b> Viết lại theo một reference implementation phụ thuộc vào việc có sẵn bản tham chiếu phù hợp và chỉ so sánh output, không kiểm chứng hệ thống các yêu cầu hiệu năng/edge case riêng của bạn.","<b>D.</b> Review thủ công và phản hồi bằng lời mô tả là chậm, chủ quan, dễ mơ hồ; không bắt được hồi quy như một bộ test tự động."]},"cite":"Hướng dẫn ôn tập — Lĩnh vực 3.5 Tinh chỉnh Lặp lại để Cải thiện Tiệm tiến"},{"id":"t1q138","n":138,"topic":1,"type":"mcq","stem":{"en":"Your infrastructure-as-code repository includes Terraform modules (/terraform/), Kubernetes manifests (/kubernetes/), and CI/CD pipeline scripts (/pipelines/). <b class=\"kw\">Each requires different conventions</b>, but your single root CLAUDE.md has grown to <b class=\"kw\">500+ lines</b>. When developers work on Kubernetes files, <b class=\"kw\">Terraform-specific rules load into context unnecessarily</b>, consuming tokens. What is the best approach to reorganize so only relevant guidance loads <b class=\"kw\">when editing specific file types</b>?","vi":"Repository infrastructure-as-code của bạn gồm các module Terraform (/terraform/), manifest Kubernetes (/kubernetes/), và các script pipeline CI/CD (/pipelines/). Mỗi phần yêu cầu <b class=\"kw\">các quy ước khác nhau</b>, nhưng file CLAUDE.md gốc duy nhất của bạn đã phình lên <b class=\"kw\">500+ dòng</b>. Khi lập trình viên làm việc với các file Kubernetes, các <b class=\"kw\">quy tắc dành riêng cho Terraform bị nạp vào context</b> một cách không cần thiết, tiêu tốn token. Cách tiếp cận tốt nhất để tổ chức lại sao cho chỉ hướng dẫn liên quan được nạp <b class=\"kw\">khi chỉnh sửa các loại file cụ thể</b> là gì?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Keep the root CLAUDE.md</b> and use <b class=\"kw\">@path/to/import syntax</b> to modularly include tool-specific guidance files from separate documents.","vi":"<b class=\"kw\">Giữ CLAUDE.md gốc</b> và dùng <b class=\"kw\">cú pháp @path/to/import</b> để đưa vào theo dạng module các file hướng dẫn riêng cho từng tool từ các tài liệu riêng biệt."}},{"k":"B","t":{"en":"Split content into <b class=\"kw\">subdirectory CLAUDE.md files</b> (/terraform/CLAUDE.md, /kubernetes/CLAUDE.md), so Claude loads <b class=\"kw\">directory-specific guidance</b>.","vi":"Tách nội dung thành <b class=\"kw\">các file CLAUDE.md trong thư mục con</b> (/terraform/CLAUDE.md, /kubernetes/CLAUDE.md), để Claude nạp <b class=\"kw\">hướng dẫn riêng theo thư mục</b>."}},{"k":"C","t":{"en":"<b class=\"kw\">Restructure the root CLAUDE.md</b> into clearly <b class=\"kw\">labeled sections with headers</b> (e.g., &quot;## Terraform Conventions&quot;), improving organization and readability.","vi":"<b class=\"kw\">Cấu trúc lại CLAUDE.md gốc</b> thành <b class=\"kw\">các phần được gắn nhãn rõ ràng với tiêu đề</b> (ví dụ: &quot;## Terraform Conventions&quot;), cải thiện tính tổ chức và khả năng đọc."}},{"k":"D","t":{"en":"Create files in <b class=\"kw\">.claude/rules/</b> with <b class=\"kw\">YAML frontmatter path-scoping</b> (e.g., paths: [&quot;terraform/**/*&quot;]), loading rules only when editing matching files.","vi":"Tạo các file trong <b class=\"kw\">.claude/rules/</b> với <b class=\"kw\">frontmatter YAML giới hạn phạm vi theo đường dẫn</b> (ví dụ: paths: [&quot;terraform/**/*&quot;]), chỉ nạp các quy tắc khi chỉnh sửa các file khớp."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Mục tiêu là <b>chỉ nạp hướng dẫn liên quan khi chỉnh sửa loại file tương ứng</b>. Các file trong <code>.claude/rules/</code> với frontmatter YAML <code>paths</code> (ví dụ <code>paths: [\"terraform/**/*\"]</code>) chỉ được tải khi Claude làm việc với file khớp mẫu glob, nên quy tắc Terraform không chiếm context khi sửa manifest Kubernetes. Đây là cơ chế <b>tải quy ước có điều kiện</b> được thiết kế đúng cho bài toán tiết kiệm token này, đồng thời tách CLAUDE.md 500+ dòng thành các file theo chủ đề dễ bảo trì.","elim":["<b>A.</b> <code>@import</code> trong root CLAUDE.md vẫn nạp mọi file được import vào mỗi session; chỉ mô-đun hóa cách tổ chức, không giảm token tiêu thụ.","<b>B.</b> CLAUDE.md theo thư mục con gắn với vị trí thư mục làm việc, không theo loại file đang sửa; phương án path-scoped rules kiểm soát chính xác hơn bằng glob và linh hoạt khi quy ước trải qua nhiều thư mục.","<b>C.</b> Chia section bằng header chỉ cải thiện khả năng đọc; toàn bộ 500+ dòng vẫn được nạp vào context mỗi lần."]},"cite":"Hướng dẫn ôn tập — §5.3 Thư mục .claude/rules/; Lĩnh vực 3.3"},{"id":"t1q139","n":139,"topic":1,"type":"mcq","stem":{"en":"After expanding the agent&#x27;s MCP tools with delivery-specific capabilities (check_delivery_status, contact_driver, issue_credit, apply_promo_code, update_delivery_address, reschedule_delivery), the total tool count has grown from 4 to 10. Your evaluation suite shows tool selection accuracy has dropped to 71%. Log analysis reveals the majority of errors involve the agent selecting between <b class=\"kw\">semantically overlapping tools</b>- <b class=\"kw\">calling issue_credit when process_refund is correct</b>, and calling check_delivery_status when <b class=\"kw\">lookup_order already returns the needed data</b>. Which approach <b class=\"kw\">structurally eliminates</b> the semantic overlaps that are being logged as the error source?","vi":"Sau khi mở rộng các MCP tool của agent với các khả năng dành riêng cho giao hàng (check_delivery_status, contact_driver, issue_credit, apply_promo_code, update_delivery_address, reschedule_delivery), tổng số tool đã tăng từ 4 lên 10. Bộ đánh giá của bạn cho thấy độ chính xác lựa chọn tool đã giảm xuống 71%. Phân tích log cho thấy phần lớn lỗi liên quan đến việc agent lựa chọn giữa <b class=\"kw\">các tool chồng lấn về ngữ nghĩa</b>- <b class=\"kw\">gọi issue_credit khi process_refund mới là đúng</b>, và gọi check_delivery_status khi <b class=\"kw\">lookup_order đã trả về dữ liệu cần thiết</b>. Cách tiếp cận nào <b class=\"kw\">loại bỏ về mặt cấu trúc</b> các chồng lấn ngữ nghĩa đang được ghi nhận trong log là nguồn gây lỗi?"},"options":[{"k":"A","t":{"en":"Split the tools across <b class=\"kw\">two sub-agents</b> - a &quot;financial resolution&quot; agent with process_refund, issue_credit, and apply_promo_code, and a &quot;delivery&quot; agent with the remaining delivery tools - with a <b class=\"kw\">coordinator routing</b> between them.","vi":"Chia các tool cho <b class=\"kw\">hai sub-agent</b> - một agent &quot;financial resolution&quot; (giải quyết tài chính) với process_refund, issue_credit và apply_promo_code, và một agent &quot;delivery&quot; (giao hàng) với các tool giao hàng còn lại - cùng một <b class=\"kw\">coordinator định tuyến</b> giữa chúng."}},{"k":"B","t":{"en":"<b class=\"kw\">Consolidate semantically overlapping tools</b>-merge issue_credit and process_refund into a <b class=\"kw\">single resolve_compensation tool</b> with an optional include_tracking flag.","vi":"<b class=\"kw\">Hợp nhất các tool chồng lấn về ngữ nghĩa</b>-merge issue_credit và process_refund thành một <b class=\"kw\">tool resolve_compensation duy nhất</b> với cờ tùy chọn include_tracking."}},{"k":"C","t":{"en":"Enable the <b class=\"kw\">tool search tool</b> with <b class=\"kw\">defer_loading</b> on the six new tools, keeping the original four always loaded, so the agent dynamically calls it when needed.","vi":"Bật <b class=\"kw\">tool search tool</b> với <b class=\"kw\">defer_loading</b> cho sáu tool mới, giữ bốn tool ban đầu luôn được nạp, để agent gọi nó một cách động khi cần."}},{"k":"D","t":{"en":"Add <b class=\"kw\">few-shot examples</b> to the system prompt demonstrating correct selection for each <b class=\"kw\">ambiguous tool pair</b>, such as showing when issue_credit or process_refund is appropriate.","vi":"Thêm các <b class=\"kw\">ví dụ few-shot</b> vào system prompt minh họa cách lựa chọn đúng cho từng <b class=\"kw\">cặp tool dễ nhầm lẫn</b>, chẳng hạn chỉ ra khi nào issue_credit hoặc process_refund là phù hợp."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Log cho thấy lỗi chủ yếu đến từ <b>các cặp tool chồng lấp ngữ nghĩa</b> (<code>issue_credit</code> vs <code>process_refund</code>, <code>check_delivery_status</code> vs <code>lookup_order</code>). Câu hỏi yêu cầu <b>loại bỏ chồng lấp về mặt cấu trúc</b>: <b>hợp nhất</b> các tool trùng chức năng thành một tool duy nhất (ví dụ <code>resolve_compensation</code>, và gộp tra cứu trạng thái giao hàng vào <code>lookup_order</code> qua cờ tùy chọn <code>include_tracking</code>). Khi không còn hai tool cùng làm một việc, model không còn phải chọn giữa chúng — nguồn lỗi bị xóa bỏ thay vì chỉ được giảm nhẹ.","elim":["<b>A.</b> Chia sang hai sub-agent vẫn để <code>issue_credit</code> và <code>process_refund</code> nằm chung trong agent “financial resolution”, nên chồng lấp vẫn còn; lại thêm lỗi định tuyến ở tầng coordinator.","<b>C.</b> Tool search với <code>defer_loading</code> giảm số tool nạp sẵn nhưng không loại bỏ chồng lấp ngữ nghĩa — khi các tool trùng được tìm thấy, model vẫn phải chọn giữa chúng.","<b>D.</b> Few-shot chỉ cải thiện xác suất chọn đúng, là biện pháp mềm; các tool chồng lấp vẫn tồn tại nên không “loại bỏ về mặt cấu trúc” như đề yêu cầu."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q140","n":140,"topic":1,"type":"mcq","stem":{"en":"After expanding the agent&#x27;s MCP tools with delivery-specific capabilities [apply_promo_code, update_delivery_address, reconcile_delivery], the total tool count has grown from 1 to 7. We have observed that the agent now shows tool selection accuracy has dropped from 86% to 71%. Log analysis reveals the majority of errors involve the agent selecting between <b class=\"kw\">semantically overlapping tools</b> — <b class=\"kw\">calling issue_credit when process_refund was correct</b>, and calling check_delivery_status when looking <b class=\"kw\">order_allready_returns_the_needed_data</b>. Which approach <b class=\"kw\">structurally eliminates</b> the semantic overlap identified in the error source?","vi":"Sau khi mở rộng các MCP tool của agent với các khả năng dành riêng cho giao hàng [apply_promo_code, update_delivery_address, reconcile_delivery], tổng số tool đã tăng từ 1 lên 7. Chúng tôi quan sát thấy agent hiện có độ chính xác lựa chọn tool giảm từ 86% xuống 71%. Phân tích log cho thấy phần lớn lỗi liên quan đến việc agent lựa chọn giữa <b class=\"kw\">các tool chồng lấn về ngữ nghĩa</b> — <b class=\"kw\">gọi issue_credit khi process_refund mới là đúng</b>, và gọi check_delivery_status khi looking <b class=\"kw\">order_allready_returns_the_needed_data</b>. Cách tiếp cận nào <b class=\"kw\">loại bỏ về mặt cấu trúc</b> sự chồng lấn ngữ nghĩa được xác định trong nguồn gây lỗi?"},"options":[{"k":"A","t":{"en":"Add <b class=\"kw\">few-shot examples</b> to the system prompt demonstrating correct selection for <b class=\"kw\">each ambiguous tool</b>, such as showing when issue_credit applies versus when process_refund is appropriate.","vi":"Thêm các <b class=\"kw\">ví dụ few-shot</b> vào system prompt minh họa cách lựa chọn đúng cho <b class=\"kw\">từng tool dễ nhầm lẫn</b>, chẳng hạn chỉ ra khi nào issue_credit được áp dụng so với khi nào process_refund là phù hợp."}},{"k":"B","t":{"en":"Enable the <b class=\"kw\">tool search tool</b> with <b class=\"kw\">defer_loading</b> on the six new tools, keeping the original two always loaded, so the agent dynamically discovers specialized tools only when needed.","vi":"Bật <b class=\"kw\">tool search tool</b> với <b class=\"kw\">defer_loading</b> cho sáu tool mới, giữ hai tool ban đầu luôn được nạp, để agent khám phá động các tool chuyên biệt chỉ khi cần."}},{"k":"C","t":{"en":"Split the tools across <b class=\"kw\">two sub-agents</b> — a &#x27;financial resolution&#x27; agent with issue_credit, process_refund, return_order, and apply_promo_code and a &#x27;delivery operations&#x27; agent with the remaining delivery tools — with a <b class=\"kw\">coordinating routing</b> between them.","vi":"Chia các tool cho <b class=\"kw\">hai sub-agent</b> — một agent &#x27;financial resolution&#x27; (giải quyết tài chính) với issue_credit, process_refund, return_order và apply_promo_code và một agent &#x27;delivery operations&#x27; (vận hành giao hàng) với các tool giao hàng còn lại — cùng một <b class=\"kw\">cơ chế điều phối định tuyến</b> giữa chúng."}},{"k":"D","t":{"en":"<b class=\"kw\">Consolidate semantically overlapping tools</b> – merge issue_credit and process_refund into a <b class=\"kw\">single handle_promotions tool</b> with an action parameter and fold check_delivery_status into lookup_order with an optional include_tracking flag.","vi":"<b class=\"kw\">Hợp nhất các tool chồng lấn về ngữ nghĩa</b> – merge issue_credit và process_refund thành một <b class=\"kw\">tool handle_promotions duy nhất</b> với tham số action và gộp check_delivery_status vào lookup_order với cờ tùy chọn include_tracking."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Lỗi tập trung ở <b>các tool chồng lấp ngữ nghĩa</b>: <code>issue_credit</code> vs <code>process_refund</code>, và <code>check_delivery_status</code> trong khi <code>lookup_order</code> đã trả về dữ liệu cần thiết. Cách duy nhất <b>loại bỏ chồng lấp về mặt cấu trúc</b> là <b>hợp nhất</b>: gộp hai tool bồi hoàn thành một tool có tham số <code>action</code>, và gộp <code>check_delivery_status</code> vào <code>lookup_order</code> với cờ tùy chọn <code>include_tracking</code>. Khi mỗi chức năng chỉ còn một tool, quyết định chọn tool mơ hồ biến mất.","elim":["<b>A.</b> Few-shot là hướng dẫn mềm, chỉ tăng xác suất chọn đúng; các cặp tool trùng lặp vẫn còn nên nguồn lỗi chưa bị loại bỏ về cấu trúc.","<b>B.</b> Tool search với <code>defer_loading</code> chỉ trì hoãn việc nạp định nghĩa tool; các tool chồng lấp vẫn tồn tại và vẫn có thể bị chọn nhầm khi được khám phá.","<b>C.</b> Chia sub-agent vẫn đặt <code>issue_credit</code> và <code>process_refund</code> trong cùng agent “financial resolution”, nên chồng lấp chính vẫn nguyên, còn thêm rủi ro định tuyến sai ở coordinator."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q141","n":141,"topic":1,"type":"mcq","stem":{"en":"Your order management system requires tools for <b class=\"kw\">three distinct operations</b>: issuing refunds (requires amount and reason), canceling orders (requires reason), and res (requires shipping address). Each operation shares an order id parameter but has <b class=\"kw\">different additional requirements</b>. You notice during testing that with your current <b class=\"kw\">frequently omits required parameters</b> or <b class=\"kw\">includes irrelevant ones</b>. What design change will most effectively improve parameter accuracy?","vi":"Hệ thống quản lý đơn hàng của bạn cần các tool cho <b class=\"kw\">ba thao tác riêng biệt</b>: hoàn tiền (yêu cầu số tiền và lý do), hủy đơn hàng (yêu cầu lý do), và res (yêu cầu địa chỉ giao hàng). Mỗi thao tác đều dùng chung tham số order id nhưng có <b class=\"kw\">các yêu cầu bổ sung khác nhau</b>. Trong quá trình kiểm thử, bạn nhận thấy rằng với ... hiện tại của bạn <b class=\"kw\">thường xuyên bỏ sót các tham số bắt buộc</b> hoặc đưa vào <b class=\"kw\">các tham số không liên quan</b>. Thay đổi thiết kế nào sẽ cải thiện độ chính xác của tham số hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"Keep one unified tool with a <b class=\"kw\">nested operation object parameter</b> whose internal structure <b class=\"kw\">varies by operation type</b>, documented in the tool description.","vi":"Giữ một tool hợp nhất với một <b class=\"kw\">tham số object operation lồng nhau</b> có cấu trúc bên trong <b class=\"kw\">thay đổi theo loại thao tác</b>, được ghi lại trong phần mô tả tool."}},{"k":"B","t":{"en":"Split into <b class=\"kw\">three separate tools</b> (each defining <b class=\"kw\">only the parameters required</b> for that specific operation.","vi":"Tách thành <b class=\"kw\">ba tool riêng biệt</b> (mỗi tool <b class=\"kw\">chỉ định nghĩa các tham số cần thiết</b> cho thao tác cụ thể đó."}},{"k":"C","t":{"en":"Keep one unified tool but add <b class=\"kw\">JSON Schema if-then-else conditionals</b> to enforce that parameters like amount are required only when the operation type is &quot;refund&quot;.","vi":"Giữ một tool hợp nhất nhưng thêm <b class=\"kw\">các điều kiện if-then-else của JSON Schema</b> để buộc các tham số như amount chỉ là bắt buộc khi loại thao tác là &quot;refund&quot;."}},{"k":"D","t":{"en":"Keep one unified tool with <b class=\"kw\">all parameters marked optional</b>, but add <b class=\"kw\">few-shot examples</b> in the system prompt showing correct parameter combinations for each operation.","vi":"Giữ một tool hợp nhất với <b class=\"kw\">tất cả tham số được đánh dấu là tùy chọn</b>, nhưng thêm các <b class=\"kw\">ví dụ few-shot</b> trong system prompt cho thấy các tổ hợp tham số đúng cho từng thao tác."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Ba thao tác có <b>bộ tham số bắt buộc khác nhau</b> (refund cần amount + reason, cancel cần reason, reship cần shipping address). Một tool hợp nhất buộc model phải tự suy luận tổ hợp tham số đúng cho từng thao tác, dẫn tới bỏ sót tham số bắt buộc hoặc thêm tham số không liên quan. <b>Tách thành ba tool chuyên biệt</b>, mỗi tool chỉ khai báo đúng tham số của nó với <code>required</code> rõ ràng, tạo <b>hợp đồng đầu vào minh bạch</b> — schema tự nói lên điều cần truyền, cải thiện độ chính xác tham số trực tiếp nhất.","elim":["<b>A.</b> Object lồng nhau với cấu trúc thay đổi theo loại thao tác còn phức tạp hơn; model phải đọc mô tả để đoán cấu trúc, làm tăng khả năng truyền sai.","<b>C.</b> Điều kiện if-then-else trong JSON Schema khó để model hiểu và tuân theo khi sinh tham số, và hỗ trợ cho các cấu trúc schema phức tạp này bị hạn chế; tool vẫn đa năng và mơ hồ.","<b>D.</b> Đánh dấu mọi tham số là optional xóa bỏ tín hiệu <code>required</code> mà model dựa vào; few-shot chỉ là biện pháp mềm bù lại một schema yếu."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q142","n":142,"topic":1,"type":"mcq","stem":{"en":"Your fitness coaching assistant uses a system prompt with <b class=\"kw\">detailed conditional logic</b>: &quot;If the user mentions being a beginner, provide step-by-step form instructions. If they use term &#x27;progressive overload&#x27; or &#x27;superset&#x27;, respond concisely. If they ask about injury history, always recommend consulting a physician.&quot; During evaluation, you find the assistant correct explicit expertise declarations but struggles when users <b class=\"kw\">don&#x27;t clearly state their level</b>-often defaulting to overly detailed responses regardless of <b class=\"kw\">contextual cues like technical terms</b>. Which change to the system prompt would most directly address this failure to pick up on <b class=\"kw\">implicit expertise signals</b>?","vi":"Trợ lý huấn luyện thể hình của bạn dùng một system prompt với <b class=\"kw\">logic điều kiện chi tiết</b>: &quot;Nếu người dùng đề cập rằng họ là người mới bắt đầu, hãy cung cấp hướng dẫn tư thế từng bước. Nếu họ dùng thuật ngữ &#x27;progressive overload&#x27; hoặc &#x27;superset&#x27;, hãy trả lời ngắn gọn. Nếu họ hỏi về tiền sử chấn thương, luôn khuyên tham khảo ý kiến bác sĩ.&quot; Trong quá trình đánh giá, bạn nhận thấy trợ lý chính xác với các tuyên bố trình độ tường minh nhưng gặp khó khăn khi người dùng <b class=\"kw\">không nêu rõ trình độ của mình</b>—thường mặc định đưa ra phản hồi quá chi tiết bất kể <b class=\"kw\">các tín hiệu ngữ cảnh như thuật ngữ kỹ thuật</b>. Thay đổi nào đối với system prompt sẽ giải quyết trực tiếp nhất việc không nhận ra <b class=\"kw\">các tín hiệu ngầm về trình độ chuyên môn</b>?"},"options":[{"k":"A","t":{"en":"Implement a <b class=\"kw\">pre-conversation intake</b> that asks users to <b class=\"kw\">rate their experience level</b>, then inject that rating into the system prompt as context for all subsequent responses.","vi":"Triển khai một <b class=\"kw\">bước thu thập thông tin trước hội thoại</b>, yêu cầu người dùng <b class=\"kw\">tự đánh giá mức độ kinh nghiệm</b>, sau đó đưa đánh giá đó vào system prompt làm context cho tất cả các phản hồi tiếp theo."}},{"k":"B","t":{"en":"Add <b class=\"kw\">more conditional branches</b> to cover additional expertise signals, such as &quot;If user mentions specific rep ranges or asks about periodization, treat as advanced.&quot;","vi":"Thêm <b class=\"kw\">nhiều nhánh điều kiện hơn</b> để bao quát các tín hiệu chuyên môn bổ sung, chẳng hạn &quot;Nếu người dùng đề cập đến các khoảng số rep cụ thể hoặc hỏi về periodization, hãy coi là trình độ nâng cao.&quot;"}},{"k":"C","t":{"en":"Replace most conditionals with a <b class=\"kw\">general principle</b>: &quot;Adapt explanation depth to match user expertise, mirroring their terminology.&quot; <b class=\"kw\">Keep only the safety-critical conditional</b> abou consultations.","vi":"Thay phần lớn các điều kiện bằng <b class=\"kw\">một nguyên tắc chung</b>: &quot;Điều chỉnh độ sâu của phần giải thích cho phù hợp với trình độ của người dùng, dùng lại thuật ngữ của họ.&quot; <b class=\"kw\">Chỉ giữ lại điều kiện quan trọng về an toàn</b> liên quan đến việc tham vấn."}},{"k":"D","t":{"en":"Add an explicit instruction for the model to <b class=\"kw\">ask a clarifying question</b> about experience level whenever the user&#x27;s expertise isn&#x27;t immediately clear from their first message.","vi":"Thêm một hướng dẫn tường minh để model <b class=\"kw\">đặt câu hỏi làm rõ</b> về mức độ kinh nghiệm bất cứ khi nào trình độ của người dùng không rõ ràng ngay từ tin nhắn đầu tiên."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Logic điều kiện cứng (“nếu dùng thuật ngữ X thì…”) chỉ bắt được những tín hiệu đã liệt kê, nên khi người dùng không tuyên bố trình độ rõ ràng, model rơi về hành vi mặc định (trả lời quá chi tiết). Thay bằng một <b>nguyên tắc tổng quát</b> — “điều chỉnh độ sâu giải thích theo trình độ người dùng, phản chiếu thuật ngữ họ dùng” — giúp model <b>khái quát hóa</b> và nhận ra các tín hiệu ngầm. Đồng thời <b>giữ lại điều kiện an toàn</b> về khuyên gặp bác sĩ, vì quy tắc an toàn cần tính tuyệt đối, không để model tự phán đoán.","elim":["<b>A.</b> Bảng hỏi trình độ trước hội thoại tạo thêm ma sát, dựa vào tự đánh giá (thường không chính xác) và không giúp model đọc tín hiệu ngầm trong hội thoại.","<b>B.</b> Thêm nhánh điều kiện là cuộc chạy đuổi vô tận — luôn có tín hiệu chưa liệt kê, và prompt ngày càng cồng kềnh mà vẫn không khái quát hóa được.","<b>D.</b> Hỏi lại mỗi khi trình độ chưa rõ gây phiền cho người dùng và né tránh vấn đề cốt lõi: model cần tự suy ra trình độ từ ngữ cảnh."]},"cite":"Hướng dẫn ôn tập — §6.2 Tiêu chí rõ ràng so với chỉ dẫn mơ hồ; Lĩnh vực 4.1"},{"id":"t1q143","n":143,"topic":1,"type":"mcq","stem":{"en":"You&#x27;re building a security scanning workflow. When engineers need to <b class=\"kw\">locate all occurrences</b> of a <b class=\"kw\">dangerous function like eval()</b> across a <b class=\"kw\">large codebase</b>, which tool should your agent use for <b class=\"kw\">content search</b>?","vi":"Bạn đang xây dựng một workflow quét bảo mật. Khi kỹ sư cần <b class=\"kw\">định vị tất cả các lần xuất hiện</b> của một <b class=\"kw\">hàm nguy hiểm như eval()</b> trong một <b class=\"kw\">codebase lớn</b>, agent của bạn nên dùng tool nào để <b class=\"kw\">tìm kiếm nội dung</b>?"},"options":[{"k":"A","t":{"en":"Use <b class=\"kw\">Bash</b> to run <b class=\"kw\">ls -R | grep eval</b> to recursively list files containing eval.","vi":"Dùng <b class=\"kw\">Bash</b> để chạy <b class=\"kw\">ls -R | grep eval</b> nhằm liệt kê đệ quy các file chứa eval."}},{"k":"B","t":{"en":"Use <b class=\"kw\">Glob</b> with a pattern like /eval to find files, then <b class=\"kw\">Read each matching file</b>.","vi":"Dùng <b class=\"kw\">Glob</b> với mẫu như /eval để tìm file, sau đó <b class=\"kw\">Read từng file khớp</b>."}},{"k":"C","t":{"en":"<b class=\"kw\">Read the project&#x27;s main entry file</b> and <b class=\"kw\">follow import statements</b> to trace where eval might be used.","vi":"<b class=\"kw\">Read file entry chính</b> của dự án và <b class=\"kw\">lần theo các câu lệnh import</b> để truy vết nơi eval có thể được sử dụng."}},{"k":"D","t":{"en":"Use <b class=\"kw\">Grep</b> to search for the <b class=\"kw\">pattern &quot;eval(&quot;</b> across all files in the codebase.","vi":"Dùng <b class=\"kw\">Grep</b> để tìm kiếm <b class=\"kw\">mẫu &quot;eval(&quot;</b> trên tất cả các file trong codebase."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Tìm mọi vị trí gọi <code>eval()</code> là bài toán <b>tìm kiếm nội dung</b>. <b>Grep</b> (dựa trên ripgrep) là tool tích hợp sẵn được thiết kế cho việc này: quét nội dung toàn bộ codebase lớn nhanh chóng, trả về file và dòng khớp mẫu <code>eval(</code>. Đây là cách hiệu quả, đầy đủ và tiết kiệm context nhất cho quy trình quét bảo mật.","elim":["<b>A.</b> <code>ls -R | grep eval</code> chỉ lọc <b>tên file/thư mục</b> chứa “eval”, hoàn toàn không tìm trong nội dung file — sai mục tiêu.","<b>B.</b> Glob khớp theo đường dẫn/tên file, không theo nội dung; sau đó Read từng file vừa bỏ sót vừa tốn rất nhiều context.","<b>C.</b> Lần theo import từ file entry chỉ bao phủ đường đi được import, bỏ sót script, code chết, file động — không đảm bảo tìm <b>tất cả</b> vị trí, và rất chậm."]},"cite":"Hướng dẫn ôn tập — §13.1 Tham chiếu Lựa chọn Tool; Lĩnh vực 2.5"},{"id":"t1q144","n":144,"topic":1,"type":"mcq","stem":{"en":"Your test generation produces unit tests for new code, but reviews show <b class=\"kw\">55% are low-value</b>: <b class=\"kw\">trivial assertions</b> that only verify functions don&#x27;t throw exceptions, tests duplicating existing coverage, or tests <b class=\"kw\">ignoring your team&#x27;s fixture conventions</b>. How do you reduce the rate of low-value tests being generated <b class=\"kw\">in the first place</b>?","vi":"Tính năng sinh test của bạn tạo unit test cho code mới, nhưng các lần review cho thấy <b class=\"kw\">55% có giá trị thấp</b>: <b class=\"kw\">các assertion tầm thường</b> chỉ kiểm tra rằng hàm không ném exception, các test trùng lặp với độ bao phủ hiện có, hoặc các test <b class=\"kw\">bỏ qua quy ước fixture của nhóm bạn</b>. Làm thế nào để giảm tỷ lệ test giá trị thấp được sinh ra <b class=\"kw\">ngay từ đầu</b>?"},"options":[{"k":"A","t":{"en":"Document <b class=\"kw\">testing standards in CLAUDE.md</b> including valuable test criteria, available fixtures with intended use cases, and <b class=\"kw\">examples distinguishing meaningful behavioral tests</b> from trivial assertions.","vi":"Ghi lại các <b class=\"kw\">tiêu chuẩn kiểm thử trong CLAUDE.md</b>, bao gồm tiêu chí cho test có giá trị, các fixture sẵn có kèm trường hợp sử dụng dự kiến, và <b class=\"kw\">các ví dụ phân biệt test hành vi có ý nghĩa</b> với các assertion tầm thường."}},{"k":"B","t":{"en":"Add <b class=\"kw\">post-generation coverage analysis</b> that automatically filters out any generated test that doesn&#x27;t increase <b class=\"kw\">line coverage</b> beyond what existing tests provide.","vi":"Thêm <b class=\"kw\">phân tích độ bao phủ sau khi sinh test</b> để tự động lọc bỏ bất kỳ test được sinh ra nào không làm tăng <b class=\"kw\">độ bao phủ dòng (line coverage)</b> vượt quá mức mà các test hiện có đã đạt được."}},{"k":"C","t":{"en":"Implement a <b class=\"kw\">two-phase generation</b> where a <b class=\"kw\">second Claude call scores each test</b> against quality criteria, filtering out low-scoring tests before presenting results to developers.","vi":"Triển khai <b class=\"kw\">sinh test hai giai đoạn</b>, trong đó một <b class=\"kw\">lệnh gọi Claude thứ hai chấm điểm</b> từng test theo tiêu chí chất lượng, lọc bỏ các test điểm thấp trước khi trình bày kết quả cho lập trình viên."}},{"k":"D","t":{"en":"<b class=\"kw\">Restrict test generation</b> to directories where <b class=\"kw\">historical quality metrics</b> show higher acceptance rates, disabling it for areas where generated tests consistently require heavy editing.","vi":"<b class=\"kw\">Giới hạn việc sinh test</b> ở các thư mục mà <b class=\"kw\">số liệu chất lượng trong quá khứ</b> cho thấy tỷ lệ chấp nhận cao hơn, tắt nó ở những khu vực mà test được sinh ra thường xuyên cần chỉnh sửa nhiều."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Câu hỏi nhấn mạnh giảm test kém giá trị <b>ngay từ khi sinh ra</b>. Ba kiểu lỗi (assertion tầm thường, trùng coverage, bỏ qua quy ước fixture) đều xuất phát từ việc Claude <b>thiếu ngữ cảnh</b> về tiêu chuẩn của nhóm. Ghi rõ trong <code>CLAUDE.md</code> tiêu chí test có giá trị, các <b>fixture sẵn có và mục đích dùng</b>, kèm <b>ví dụ phân biệt</b> test hành vi có ý nghĩa với assertion tầm thường — Claude Code nạp CLAUDE.md mỗi session nên mọi lần sinh test đều tuân theo các chuẩn này.","elim":["<b>B.</b> Lọc theo coverage là hậu xử lý — test kém vẫn được sinh ra; hơn nữa coverage dòng không đo giá trị hành vi, và không xử lý việc bỏ qua quy ước fixture.","<b>C.</b> Lượt chấm điểm thứ hai chỉ lọc sau khi sinh, tốn thêm lời gọi và độ trễ; không giảm tỷ lệ test kém ở bước sinh như đề yêu cầu.","<b>D.</b> Tắt sinh test ở các vùng khó chỉ né vấn đề, làm mất lợi ích tự động hóa mà không cải thiện chất lượng test được sinh."]},"cite":"Hướng dẫn ôn tập — §5.1 Phân cấp CLAUDE.md; Lĩnh vực 3.6"},{"id":"t1q145","n":145,"topic":1,"type":"mcq","stem":{"en":"Your expense reimbursement agent processes employee requests using a process reimbursement tool. <b class=\"kw\">Company policy requires</b> that reimbursements above $500 <b class=\"kw\">must be approved before funds are disbursed</b>. The agent handles hundreds of requests daily, and you need the threshold enforcement to be <b class=\"kw\">tamper-proof regardless of how the agent is prompted</b> ensures the $500 approval threshold <b class=\"kw\">cannot be bypassed</b>?","vi":"Agent hoàn trả chi phí của bạn xử lý các yêu cầu của nhân viên bằng một tool process reimbursement. <b class=\"kw\">Chính sách công ty yêu cầu</b> các khoản hoàn trả trên $500 <b class=\"kw\">phải được phê duyệt trước khi giải ngân</b>. Agent xử lý hàng trăm yêu cầu mỗi ngày, và bạn cần việc thực thi ngưỡng này <b class=\"kw\">không thể bị can thiệp bất kể agent được prompt như thế nào</b> đảm bảo ngưỡng phê duyệt $500 <b class=\"kw\">không thể bị vượt qua</b>?"},"options":[{"k":"A","t":{"en":"The process reimbursement tool accepts an <b class=\"kw\">approved by manager parameter</b>. The system prompt instructs the agent to only set this to true after confirming that a manager approved the request. A <b class=\"kw\">nightly audit script</b> reviews all reimbursements where approved by manager was set to true.","vi":"Tool process reimbursement nhận một <b class=\"kw\">tham số approved by manager</b>. System prompt hướng dẫn agent chỉ đặt giá trị này thành true sau khi xác nhận rằng một quản lý đã phê duyệt yêu cầu. Một <b class=\"kw\">script audit chạy hằng đêm</b> rà soát tất cả các khoản hoàn trả có approved by manager được đặt thành true."}},{"k":"B","t":{"en":"Implement the threshold check in a <b class=\"kw\">PreToolUse hook</b> that inspects the amount parameter before process reimbursement executes. If the amount exceeds $500, the hook modifies the context to add a <b class=\"kw\">requires approval: true flag</b>, which the tool checks before disbursing.","vi":"Triển khai việc kiểm tra ngưỡng trong một <b class=\"kw\">hook PreToolUse</b>, kiểm tra tham số amount trước khi process reimbursement thực thi. Nếu số tiền vượt quá $500, hook sẽ sửa đổi context để thêm <b class=\"kw\">cờ requires approval: true</b>, cờ này được tool kiểm tra trước khi giải ngân."}},{"k":"C","t":{"en":"The process reimbursement tool accepts amount and details, and <b class=\"kw\">internally enforces the threshold</b>; amounts &lt;$500 are auto-disbursed and the tool returns a success confirmation. Amounts &gt;$500 cause the tool to create a <b class=\"kw\">pending approval request</b> and return a status indicating manager review is pending.","vi":"Tool process reimbursement nhận số tiền và thông tin chi tiết, và <b class=\"kw\">tự thực thi ngưỡng ở bên trong</b>; các khoản &lt;$500 được tự động giải ngân và tool trả về xác nhận thành công. Các khoản &gt;$500 khiến tool tạo một <b class=\"kw\">yêu cầu phê duyệt đang chờ xử lý</b> và trả về trạng thái cho biết đang chờ quản lý xem xét."}},{"k":"D","t":{"en":"Provide <b class=\"kw\">two tools: auto reimburse</b> (hard-coded limit of $500) and manager approval. Include detailed system prompt instructions telling the agent to check the amount and use the appropriate tool. Add a <b class=\"kw\">Post ToolUse hook</b> that logs which tool was called for auditing.","vi":"Cung cấp <b class=\"kw\">hai tool: auto reimburse</b> (giới hạn cứng $500) và manager approval. Đưa vào system prompt các hướng dẫn chi tiết yêu cầu agent kiểm tra số tiền và dùng tool phù hợp. Thêm một <b class=\"kw\">hook Post ToolUse</b> ghi log tool nào đã được gọi để phục vụ audit."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Yêu cầu là ngưỡng $500 phải <b>chống giả mạo bất kể agent được prompt thế nào</b>. Cách chắc chắn nhất là đặt kiểm tra <b>bên trong chính tool</b>: tool nhận amount, tự quyết định — dưới $500 thì chi tiền và trả xác nhận, trên $500 thì tạo yêu cầu phê duyệt đang chờ và trả trạng thái “pending manager review”. Agent không có tham số hay đường nào để vượt qua logic này, nên quy tắc được thực thi <b>deterministic</b> ở tầng code thay vì phụ thuộc vào việc model tuân theo prompt.","elim":["<b>A.</b> Tham số <code>approved_by_manager</code> do chính agent đặt dựa trên chỉ dẫn prompt — có thể bị prompt injection hoặc suy luận sai; audit ban đêm chỉ phát hiện sau khi tiền đã chi.","<b>B.</b> Hook chỉ “thêm cờ vào context” và trông cậy tool đọc cờ đó; cơ chế gián tiếp, phụ thuộc vào sự phối hợp giữa hai thành phần và không mạnh bằng việc tool tự thực thi ngưỡng.","<b>D.</b> Việc chọn đúng giữa <code>auto_reimburse</code> và <code>manager_approval</code> vẫn phụ thuộc vào prompt; PostToolUse hook chỉ ghi log sau khi thực thi, không ngăn được vi phạm."]},"cite":"Hướng dẫn ôn tập — §3.5 Hooks trong Agent SDK; Lĩnh vực 1.4"},{"id":"t1q146","n":146,"topic":1,"type":"mcq","stem":{"en":"Your portfolio value tool returns the total value of a user&#x27;s investment portfolio. You&#x27;re deciding between returning a <b class=\"kw\">structured JSON object with explicit fields</b> versus returning information as a <b class=\"kw\">formatted text string</b>. What is the <b class=\"kw\">primary advantage</b> of using structured output with defined fields?","vi":"Tool portfolio value của bạn trả về tổng giá trị danh mục đầu tư của người dùng. Bạn đang cân nhắc giữa việc trả về một <b class=\"kw\">object JSON có cấu trúc với các trường tường minh</b> và việc trả về thông tin dưới dạng một <b class=\"kw\">chuỗi văn bản đã định dạng</b>. <b class=\"kw\">Ưu điểm chính</b> của việc dùng đầu ra có cấu trúc với các trường được định nghĩa là gì?"},"options":[{"k":"A","t":{"en":"JSON schemas <b class=\"kw\">automatically validate</b> that the <b class=\"kw\">underlying API returned correct data</b> before the agent processes it.","vi":"Các JSON schema <b class=\"kw\">tự động kiểm tra hợp lệ</b> rằng <b class=\"kw\">API bên dưới đã trả về dữ liệu đúng</b> trước khi agent xử lý nó."}},{"k":"B","t":{"en":"Structured JSON is <b class=\"kw\">processed deterministically by the model</b>, significantly improving accuracy when extracting values.","vi":"JSON có cấu trúc <b class=\"kw\">được model xử lý một cách tất định</b>, cải thiện đáng kể độ chính xác khi trích xuất giá trị."}},{"k":"C","t":{"en":"The agent can <b class=\"kw\">reliably extract specific values</b> <b class=\"kw\">without parsing free form text</b>, reducing errors in subsequent operations.","vi":"Agent có thể <b class=\"kw\">trích xuất các giá trị cụ thể một cách đáng tin cậy</b> mà <b class=\"kw\">không cần phân tích văn bản dạng tự do</b>, giảm lỗi trong các thao tác tiếp theo."}},{"k":"D","t":{"en":"Structured JSON consumes significantly <b class=\"kw\">fewer tokens</b> than natural language, substantially <b class=\"kw\">reducing API costs</b>.","vi":"JSON có cấu trúc tiêu thụ <b class=\"kw\">ít token hơn</b> đáng kể so với ngôn ngữ tự nhiên, giúp <b class=\"kw\">giảm đáng kể chi phí API</b>."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Lợi ích chính của trả về JSON với các trường được định nghĩa là agent có thể <b>lấy chính xác giá trị cụ thể</b> (ví dụ <code>total_value</code>, <code>currency</code>) mà <b>không phải phân tích văn bản tự do</b>. Điều này giảm lỗi ở các bước tiếp theo — tính toán, so sánh, truyền giá trị cho tool khác — vì không còn rủi ro hiểu sai định dạng số, đơn vị hay vị trí thông tin trong câu.","elim":["<b>A.</b> JSON schema mô tả cấu trúc output của tool, không tự động kiểm chứng dữ liệu từ API bên dưới là đúng; dữ liệu sai vẫn có thể được đóng gói vào JSON hợp lệ.","<b>B.</b> Model không xử lý JSON một cách “deterministic”; đây là phát biểu sai về cách LLM hoạt động — lợi ích nằm ở việc giảm mơ hồ chứ không phải tính tất định.","<b>D.</b> JSON không nhất thiết ít token hơn văn bản (khóa, dấu ngoặc, dấu nháy đều tốn token); tiết kiệm chi phí không phải lợi ích chính."]},"cite":"Hướng dẫn ôn tập — §2.4 JSON Schema cho Structured Output; Lĩnh vực 2.1"},{"id":"t1q147","n":147,"topic":1,"type":"mcq","stem":{"en":"Performance analysis reveals your context is composed of <b class=\"kw\">accumulated RAG results from all previous queries</b>, which is <b class=\"kw\">crowding out conversation history</b> and causing <b class=\"kw\">coherence degradation after 15+ turns</b>. Which approach best addresses this issue?","vi":"Phân tích hiệu năng cho thấy context của bạn bao gồm <b class=\"kw\">các kết quả RAG tích lũy từ tất cả các truy vấn trước đó</b>, chúng đang <b class=\"kw\">lấn chỗ của lịch sử hội thoại</b> và gây <b class=\"kw\">suy giảm tính mạch lạc sau 15+ lượt</b>. Cách tiếp cận nào giải quyết vấn đề này tốt nhất?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Compress all RAG results</b> into a <b class=\"kw\">consolidated summary document</b> that updates incrementally after each retrieval","vi":"<b class=\"kw\">Nén tất cả kết quả RAG</b> thành một <b class=\"kw\">tài liệu tóm tắt hợp nhất</b>, được cập nhật tăng dần sau mỗi lần truy xuất"}},{"k":"B","t":{"en":"Implement a <b class=\"kw\">sliding window</b> for RAG results from the <b class=\"kw\">last 2-3 queries</b> while preserving conversation history","vi":"Triển khai một <b class=\"kw\">cửa sổ trượt (sliding window)</b> cho kết quả RAG từ <b class=\"kw\">2-3 truy vấn gần nhất</b> trong khi vẫn giữ nguyên lịch sử hội thoại"}},{"k":"C","t":{"en":"Implement <b class=\"kw\">semantic deduplication</b> to identify and remove redundant information across the accumulated RAG results and conversation turns","vi":"Triển khai <b class=\"kw\">loại bỏ trùng lặp theo ngữ nghĩa</b> để xác định và loại bỏ thông tin dư thừa trên các kết quả RAG tích lũy và các lượt hội thoại"}},{"k":"D","t":{"en":"Shift context budget to <b class=\"kw\">favor RAG results</b> while <b class=\"kw\">reducing conversation history allocation</b>","vi":"Dịch chuyển ngân sách context để <b class=\"kw\">ưu tiên kết quả RAG</b>, đồng thời <b class=\"kw\">giảm phần phân bổ cho lịch sử hội thoại</b>"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Nguyên nhân là kết quả RAG của <b>mọi truy vấn trước</b> tích lũy mãi, chiếm chỗ của lịch sử hội thoại — thứ cần thiết cho tính mạch lạc. Kết quả RAG cũ thường chỉ liên quan đến truy vấn tại thời điểm đó, nên áp dụng <b>cửa sổ trượt</b> chỉ giữ kết quả RAG của 2–3 truy vấn gần nhất, đồng thời <b>bảo toàn lịch sử hội thoại</b>. Cách này giới hạn phần context do RAG chiếm một cách có thể dự đoán và trả lại không gian cho hội thoại.","elim":["<b>A.</b> Tóm tắt dồn toàn bộ kết quả RAG vẫn để khối này tiếp tục lớn dần theo số lượt và làm mất chi tiết; không giải quyết tận gốc việc giữ lại dữ liệu đã hết liên quan.","<b>C.</b> Loại trùng ngữ nghĩa chỉ bỏ phần lặp; các kết quả RAG cũ nhưng không trùng vẫn tích lũy, đồng thời còn có nguy cơ xóa nhầm nội dung hội thoại.","<b>D.</b> Dồn ngân sách cho RAG và cắt lịch sử hội thoại làm vấn đề mạch lạc tệ hơn — đúng ngược với điều cần làm."]},"cite":"Hướng dẫn ôn tập — §11.2 Cắt gọn Kết quả Tool; Lĩnh vực 5.1"},{"id":"t1q148","n":148,"topic":1,"type":"mcq","stem":{"en":"Your team frequently migrates React components to Vue. You&#x27;ve written a step-by-step workflow for Claude Code to follow during each migration, and you want <b class=\"kw\">every developer on the team</b> to invoke it by <b class=\"kw\">typing /migrate-component</b>. The workflow should <b class=\"kw\">stay in sync as the team iterates</b> on it. Where should you place the skill file?","vi":"Nhóm của bạn thường xuyên chuyển đổi (migrate) các component React sang Vue. Bạn đã viết một workflow từng bước để Claude Code thực hiện trong mỗi lần chuyển đổi, và bạn muốn <b class=\"kw\">mọi lập trình viên trong nhóm</b> gọi nó bằng cách <b class=\"kw\">gõ /migrate-component</b>. Workflow cần <b class=\"kw\">luôn được đồng bộ khi nhóm tiếp tục cải tiến nó</b>. Bạn nên đặt file skill ở đâu?"},"options":[{"k":"A","t":{"en":"In the project&#x27;s <b class=\"kw\">.claude/settings.json</b> using a <b class=\"kw\">skillOverrides entry</b> to register and define the workflow","vi":"Trong <b class=\"kw\">.claude/settings.json</b> của dự án, dùng một <b class=\"kw\">mục skillOverrides</b> để đăng ký và định nghĩa workflow"}},{"k":"B","t":{"en":"In <b class=\"kw\">.claude/skills/migrate-component/SKILL.md</b> at the project root, <b class=\"kw\">committed to version control</b>","vi":"Trong <b class=\"kw\">.claude/skills/migrate-component/SKILL.md</b> tại thư mục gốc của dự án, <b class=\"kw\">được commit vào hệ thống quản lý phiên bản</b>"}},{"k":"C","t":{"en":"In <b class=\"kw\">~/.claude/skills/migrate-component/SKILL.md</b> on <b class=\"kw\">each developer&#x27;s machine</b>","vi":"Trong <b class=\"kw\">~/.claude/skills/migrate-component/SKILL.md</b> trên <b class=\"kw\">máy của từng lập trình viên</b>"}},{"k":"D","t":{"en":"As a <b class=\"kw\">detailed instruction block</b> in the project&#x27;s <b class=\"kw\">root CLAUDE.md file</b>","vi":"Dưới dạng một <b class=\"kw\">khối hướng dẫn chi tiết</b> trong <b class=\"kw\">file CLAUDE.md gốc</b> của dự án"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Skill cấp dự án đặt tại <code>.claude/skills/migrate-component/SKILL.md</code> ở gốc repo; tên thư mục trở thành lệnh <code>/migrate-component</code>. Vì nằm trong repo và được <b>commit vào version control</b>, mọi lập trình viên đều có cùng skill, và mỗi khi nhóm cải tiến workflow, thay đổi được đồng bộ qua git — đáp ứng cả hai yêu cầu “cả nhóm dùng được” và “luôn đồng bộ”.","elim":["<b>A.</b> <code>settings.json</code> không phải nơi định nghĩa nội dung skill; không có mục <code>skillOverrides</code> dùng để đăng ký và viết workflow như mô tả.","<b>C.</b> <code>~/.claude/skills/</code> là skill cấp người dùng, chỉ có trên máy từng người và không chia sẻ qua VCS — mỗi người phải tự sao chép và các bản sẽ lệch nhau.","<b>D.</b> Nhét workflow vào CLAUDE.md khiến nó được nạp vào mọi session (tốn context) và không tạo ra lệnh <code>/migrate-component</code> để gọi theo yêu cầu."]},"cite":"Hướng dẫn ôn tập — §5.5 Skill — .claude/skills/; Lĩnh vực 3.2"},{"id":"t1q149","n":149,"topic":1,"type":"mcq","stem":{"en":"The system processes product reviews using tool use with a defined schema: rating (integer 1-5), pros (string array), cons (string array), and overall_sentiment (enum: positive, negative, mixed). Testing reveals two issues with brief or ambiguous reviews (~20% of the dataset): (1) for reviews like &quot;Great product!&quot;, <b class=\"kw\">Claude fabricates specific pros and cons</b> rather than indicating this information <b class=\"kw\">isn&#x27;t explicitly stated</b>, and (2) for sarcastic reviews like &quot;Well that was... interesting&quot;, Claude picks sentiment arbitrarily since there&#x27;s <b class=\"kw\">no option for ambiguous cases</b>. What schema modification <b class=\"kw\">best addresses both issues</b>?","vi":"Hệ thống xử lý các đánh giá sản phẩm bằng tool use với một schema được định nghĩa: rating (số nguyên 1-5), pros (mảng chuỗi), cons (mảng chuỗi), và overall_sentiment (enum: positive, negative, mixed). Kiểm thử cho thấy hai vấn đề với các đánh giá ngắn hoặc mơ hồ (~20% tập dữ liệu): (1) với các đánh giá như &quot;Sản phẩm tuyệt vời!&quot;, <b class=\"kw\">Claude bịa ra các pros và cons</b> (ưu/nhược điểm) cụ thể thay vì chỉ ra rằng thông tin này <b class=\"kw\">không được nêu rõ</b>, và (2) với các đánh giá mỉa mai như &quot;Chà, cái đó thật là... thú vị&quot;, Claude chọn sentiment một cách tùy tiện vì <b class=\"kw\">không có lựa chọn nào cho các trường hợp mơ hồ</b>. Thay đổi schema nào giải quyết tốt nhất <b class=\"kw\">cả hai vấn đề</b>?"},"options":[{"k":"A","t":{"en":"Allow <b class=\"kw\">null values for pros/cons</b>, and add <b class=\"kw\">&quot;unclear&quot;</b> to the sentiment enum.","vi":"Cho phép <b class=\"kw\">giá trị null cho pros/cons</b>, và thêm <b class=\"kw\">&quot;unclear&quot;</b> vào enum sentiment."}},{"k":"B","t":{"en":"Make pros and cons <b class=\"kw\">optional fields</b>, and add <b class=\"kw\">&quot;neutral&quot; and &quot;unclear&quot;</b> to the sentiment enum.","vi":"Đặt pros và cons thành các <b class=\"kw\">trường tùy chọn</b>, và thêm <b class=\"kw\">&quot;neutral&quot; và &quot;unclear&quot;</b> vào enum sentiment."}},{"k":"C","t":{"en":"Add an <b class=\"kw\">extraction_confidence field</b> (0.0-1.0) for each value, and <b class=\"kw\">filter outputs</b> where any confidence falls below a threshold.","vi":"Thêm một <b class=\"kw\">trường extraction_confidence</b> (0.0-1.0) cho mỗi giá trị, và <b class=\"kw\">lọc bỏ các đầu ra</b> có bất kỳ confidence nào thấp hơn một ngưỡng."}},{"k":"D","t":{"en":"Allow <b class=\"kw\">empty arrays for pros/cons</b> as valid output, and add <b class=\"kw\">&quot;unclear&quot;</b> to the sentiment enum.","vi":"Cho phép <b c
