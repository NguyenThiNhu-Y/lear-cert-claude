cting between semantically overlapping tools- calling issue_credit when process_refund is correct, and calling check_delivery_status when lookup_order already returns the needed data. Which approach structurally eliminates the semantic overlaps that are being logged as the error source?"},"options":[{"k":"A","t":{"en":"Split the tools across two sub-agents - a &quot;financial resolution&quot; agent with process_refund, issue_credit, and apply_promo_code, and a &quot;delivery&quot; agent with the remaining delivery tools - with a coordinator routing between them."}},{"k":"B","t":{"en":"Consolidate semantically overlapping tools-merge issue_credit and process_refund into a single resolve_compensation tool with an optional include_tracking flag."}},{"k":"C","t":{"en":"Enable the tool search tool with defer_loading on the six new tools, keeping the original four always loaded, so the agent dynamically calls it when needed."}},{"k":"D","t":{"en":"Add few-shot examples to the system prompt demonstrating correct selection for each ambiguous tool pair, such as showing when issue_credit or process_refund is appropriate."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Log cho thấy lỗi chủ yếu đến từ <b>các cặp tool chồng lấp ngữ nghĩa</b> (<code>issue_credit</code> vs <code>process_refund</code>, <code>check_delivery_status</code> vs <code>lookup_order</code>). Câu hỏi yêu cầu <b>loại bỏ chồng lấp về mặt cấu trúc</b>: <b>hợp nhất</b> các tool trùng chức năng thành một tool duy nhất (ví dụ <code>resolve_compensation</code>, và gộp tra cứu trạng thái giao hàng vào <code>lookup_order</code> qua cờ tùy chọn <code>include_tracking</code>). Khi không còn hai tool cùng làm một việc, model không còn phải chọn giữa chúng — nguồn lỗi bị xóa bỏ thay vì chỉ được giảm nhẹ.","elim":["<b>A.</b> Chia sang hai sub-agent vẫn để <code>issue_credit</code> và <code>process_refund</code> nằm chung trong agent “financial resolution”, nên chồng lấp vẫn còn; lại thêm lỗi định tuyến ở tầng coordinator.","<b>C.</b> Tool search với <code>defer_loading</code> giảm số tool nạp sẵn nhưng không loại bỏ chồng lấp ngữ nghĩa — khi các tool trùng được tìm thấy, model vẫn phải chọn giữa chúng.","<b>D.</b> Few-shot chỉ cải thiện xác suất chọn đúng, là biện pháp mềm; các tool chồng lấp vẫn tồn tại nên không “loại bỏ về mặt cấu trúc” như đề yêu cầu."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q140","n":140,"topic":1,"type":"mcq","stem":{"en":"After expanding the agent&#x27;s MCP tools with delivery-specific capabilities [apply_promo_code, update_delivery_address, reconcile_delivery], the total tool count has grown from 1 to 7. We have observed that the agent now shows tool selection accuracy has dropped from 86% to 71%. Log analysis reveals the majority of errors involve the agent selecting between semantically overlapping tools — calling issue_credit when process_refund was correct, and calling check_delivery_status when looking order_allready_returns_the_needed_data. Which approach structurally eliminates the semantic overlap identified in the error source?"},"options":[{"k":"A","t":{"en":"Add few-shot examples to the system prompt demonstrating correct selection for each ambiguous tool, such as showing when issue_credit applies versus when process_refund is appropriate."}},{"k":"B","t":{"en":"Enable the tool search tool with defer_loading on the six new tools, keeping the original two always loaded, so the agent dynamically discovers specialized tools only when needed."}},{"k":"C","t":{"en":"Split the tools across two sub-agents — a &#x27;financial resolution&#x27; agent with issue_credit, process_refund, return_order, and apply_promo_code and a &#x27;delivery operations&#x27; agent with the remaining delivery tools — with a coordinating routing between them."}},{"k":"D","t":{"en":"Consolidate semantically overlapping tools – merge issue_credit and process_refund into a single handle_promotions tool with an action parameter and fold check_delivery_status into lookup_order with an optional include_tracking flag."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Lỗi tập trung ở <b>các tool chồng lấp ngữ nghĩa</b>: <code>issue_credit</code> vs <code>process_refund</code>, và <code>check_delivery_status</code> trong khi <code>lookup_order</code> đã trả về dữ liệu cần thiết. Cách duy nhất <b>loại bỏ chồng lấp về mặt cấu trúc</b> là <b>hợp nhất</b>: gộp hai tool bồi hoàn thành một tool có tham số <code>action</code>, và gộp <code>check_delivery_status</code> vào <code>lookup_order</code> với cờ tùy chọn <code>include_tracking</code>. Khi mỗi chức năng chỉ còn một tool, quyết định chọn tool mơ hồ biến mất.","elim":["<b>A.</b> Few-shot là hướng dẫn mềm, chỉ tăng xác suất chọn đúng; các cặp tool trùng lặp vẫn còn nên nguồn lỗi chưa bị loại bỏ về cấu trúc.","<b>B.</b> Tool search với <code>defer_loading</code> chỉ trì hoãn việc nạp định nghĩa tool; các tool chồng lấp vẫn tồn tại và vẫn có thể bị chọn nhầm khi được khám phá.","<b>C.</b> Chia sub-agent vẫn đặt <code>issue_credit</code> và <code>process_refund</code> trong cùng agent “financial resolution”, nên chồng lấp chính vẫn nguyên, còn thêm rủi ro định tuyến sai ở coordinator."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q141","n":141,"topic":1,"type":"mcq","stem":{"en":"Your order management system requires tools for three distinct operations: issuing refunds (requires amount and reason), canceling orders (requires reason), and res (requires shipping address). Each operation shares an order id parameter but has different additional requirements. You notice during testing that with your current frequently omits required parameters or includes irrelevant ones. What design change will most effectively improve parameter accuracy?"},"options":[{"k":"A","t":{"en":"Keep one unified tool with a nested operation object parameter whose internal structure varies by operation type, documented in the tool description."}},{"k":"B","t":{"en":"Split into three separate tools (each defining only the parameters required for that specific operation."}},{"k":"C","t":{"en":"Keep one unified tool but add JSON Schema if-then-else conditionals to enforce that parameters like amount are required only when the operation type is &quot;refund&quot;."}},{"k":"D","t":{"en":"Keep one unified tool with all parameters marked optional, but add few-shot examples in the system prompt showing correct parameter combinations for each operation."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Ba thao tác có <b>bộ tham số bắt buộc khác nhau</b> (refund cần amount + reason, cancel cần reason, reship cần shipping address). Một tool hợp nhất buộc model phải tự suy luận tổ hợp tham số đúng cho từng thao tác, dẫn tới bỏ sót tham số bắt buộc hoặc thêm tham số không liên quan. <b>Tách thành ba tool chuyên biệt</b>, mỗi tool chỉ khai báo đúng tham số của nó với <code>required</code> rõ ràng, tạo <b>hợp đồng đầu vào minh bạch</b> — schema tự nói lên điều cần truyền, cải thiện độ chính xác tham số trực tiếp nhất.","elim":["<b>A.</b> Object lồng nhau với cấu trúc thay đổi theo loại thao tác còn phức tạp hơn; model phải đọc mô tả để đoán cấu trúc, làm tăng khả năng truyền sai.","<b>C.</b> Điều kiện if-then-else trong JSON Schema khó để model hiểu và tuân theo khi sinh tham số, và hỗ trợ cho các cấu trúc schema phức tạp này bị hạn chế; tool vẫn đa năng và mơ hồ.","<b>D.</b> Đánh dấu mọi tham số là optional xóa bỏ tín hiệu <code>required</code> mà model dựa vào; few-shot chỉ là biện pháp mềm bù lại một schema yếu."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q142","n":142,"topic":1,"type":"mcq","stem":{"en":"Your fitness coaching assistant uses a system prompt with detailed conditional logic: &quot;If the user mentions being a beginner, provide step-by-step form instructions. If they use term &#x27;progressive overload&#x27; or &#x27;superset&#x27;, respond concisely. If they ask about injury history, always recommend consulting a physician.&quot; During evaluation, you find the assistant correct explicit expertise declarations but struggles when users don&#x27;t clearly state their level-often defaulting to overly detailed responses regardless of contextual cues like technical terms. Which change to the system prompt would most directly address this failure to pick up on implicit expertise signals?"},"options":[{"k":"A","t":{"en":"Implement a pre-conversation intake that asks users to rate their experience level, then inject that rating into the system prompt as context for all subsequent responses."}},{"k":"B","t":{"en":"Add more conditional branches to cover additional expertise signals, such as &quot;If user mentions specific rep ranges or asks about periodization, treat as advanced.&quot;"}},{"k":"C","t":{"en":"Replace most conditionals with a general principle: &quot;Adapt explanation depth to match user expertise, mirroring their terminology.&quot; Keep only the safety-critical conditional abou consultations."}},{"k":"D","t":{"en":"Add an explicit instruction for the model to ask a clarifying question about experience level whenever the user&#x27;s expertise isn&#x27;t immediately clear from their first message."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Logic điều kiện cứng (“nếu dùng thuật ngữ X thì…”) chỉ bắt được những tín hiệu đã liệt kê, nên khi người dùng không tuyên bố trình độ rõ ràng, model rơi về hành vi mặc định (trả lời quá chi tiết). Thay bằng một <b>nguyên tắc tổng quát</b> — “điều chỉnh độ sâu giải thích theo trình độ người dùng, phản chiếu thuật ngữ họ dùng” — giúp model <b>khái quát hóa</b> và nhận ra các tín hiệu ngầm. Đồng thời <b>giữ lại điều kiện an toàn</b> về khuyên gặp bác sĩ, vì quy tắc an toàn cần tính tuyệt đối, không để model tự phán đoán.","elim":["<b>A.</b> Bảng hỏi trình độ trước hội thoại tạo thêm ma sát, dựa vào tự đánh giá (thường không chính xác) và không giúp model đọc tín hiệu ngầm trong hội thoại.","<b>B.</b> Thêm nhánh điều kiện là cuộc chạy đuổi vô tận — luôn có tín hiệu chưa liệt kê, và prompt ngày càng cồng kềnh mà vẫn không khái quát hóa được.","<b>D.</b> Hỏi lại mỗi khi trình độ chưa rõ gây phiền cho người dùng và né tránh vấn đề cốt lõi: model cần tự suy ra trình độ từ ngữ cảnh."]},"cite":"Hướng dẫn ôn tập — §6.2 Tiêu chí rõ ràng so với chỉ dẫn mơ hồ; Lĩnh vực 4.1"},{"id":"t1q143","n":143,"topic":1,"type":"mcq","stem":{"en":"You&#x27;re building a security scanning workflow. When engineers need to locate all occurrences of a dangerous function like eval() across a large codebase, which tool should your agent use for content search?"},"options":[{"k":"A","t":{"en":"Use Bash to run ls -R | grep eval to recursively list files containing eval."}},{"k":"B","t":{"en":"Use Glob with a pattern like /<i>eval</i> to find files, then Read each matching file."}},{"k":"C","t":{"en":"Read the project&#x27;s main entry file and follow import statements to trace where eval might be used."}},{"k":"D","t":{"en":"Use Grep to search for the pattern &quot;eval(&quot; across all files in the codebase."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Tìm mọi vị trí gọi <code>eval()</code> là bài toán <b>tìm kiếm nội dung</b>. <b>Grep</b> (dựa trên ripgrep) là tool tích hợp sẵn được thiết kế cho việc này: quét nội dung toàn bộ codebase lớn nhanh chóng, trả về file và dòng khớp mẫu <code>eval(</code>. Đây là cách hiệu quả, đầy đủ và tiết kiệm context nhất cho quy trình quét bảo mật.","elim":["<b>A.</b> <code>ls -R | grep eval</code> chỉ lọc <b>tên file/thư mục</b> chứa “eval”, hoàn toàn không tìm trong nội dung file — sai mục tiêu.","<b>B.</b> Glob khớp theo đường dẫn/tên file, không theo nội dung; sau đó Read từng file vừa bỏ sót vừa tốn rất nhiều context.","<b>C.</b> Lần theo import từ file entry chỉ bao phủ đường đi được import, bỏ sót script, code chết, file động — không đảm bảo tìm <b>tất cả</b> vị trí, và rất chậm."]},"cite":"Hướng dẫn ôn tập — §13.1 Tham chiếu Lựa chọn Tool; Lĩnh vực 2.5"},{"id":"t1q144","n":144,"topic":1,"type":"mcq","stem":{"en":"Your test generation produces unit tests for new code, but reviews show 55% are low-value: trivial assertions that only verify functions don&#x27;t throw exceptions, tests duplicating existing coverage, or tests ignoring your team&#x27;s fixture conventions. How do you reduce the rate of low-value tests being generated in the first place?"},"options":[{"k":"A","t":{"en":"Document testing standards in CLAUDE.md including valuable test criteria, available fixtures with intended use cases, and examples distinguishing meaningful behavioral tests from trivial assertions."}},{"k":"B","t":{"en":"Add post-generation coverage analysis that automatically filters out any generated test that doesn&#x27;t increase line coverage beyond what existing tests provide."}},{"k":"C","t":{"en":"Implement a two-phase generation where a second Claude call scores each test against quality criteria, filtering out low-scoring tests before presenting results to developers."}},{"k":"D","t":{"en":"Restrict test generation to directories where historical quality metrics show higher acceptance rates, disabling it for areas where generated tests consistently require heavy editing."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Câu hỏi nhấn mạnh giảm test kém giá trị <b>ngay từ khi sinh ra</b>. Ba kiểu lỗi (assertion tầm thường, trùng coverage, bỏ qua quy ước fixture) đều xuất phát từ việc Claude <b>thiếu ngữ cảnh</b> về tiêu chuẩn của nhóm. Ghi rõ trong <code>CLAUDE.md</code> tiêu chí test có giá trị, các <b>fixture sẵn có và mục đích dùng</b>, kèm <b>ví dụ phân biệt</b> test hành vi có ý nghĩa với assertion tầm thường — Claude Code nạp CLAUDE.md mỗi session nên mọi lần sinh test đều tuân theo các chuẩn này.","elim":["<b>B.</b> Lọc theo coverage là hậu xử lý — test kém vẫn được sinh ra; hơn nữa coverage dòng không đo giá trị hành vi, và không xử lý việc bỏ qua quy ước fixture.","<b>C.</b> Lượt chấm điểm thứ hai chỉ lọc sau khi sinh, tốn thêm lời gọi và độ trễ; không giảm tỷ lệ test kém ở bước sinh như đề yêu cầu.","<b>D.</b> Tắt sinh test ở các vùng khó chỉ né vấn đề, làm mất lợi ích tự động hóa mà không cải thiện chất lượng test được sinh."]},"cite":"Hướng dẫn ôn tập — §5.1 Phân cấp CLAUDE.md; Lĩnh vực 3.6"},{"id":"t1q145","n":145,"topic":1,"type":"mcq","stem":{"en":"Your expense reimbursement agent processes employee requests using a process reimbursement tool. Company policy requires that reimbursements above $500 must be approved before funds are disbursed. The agent handles hundreds of requests daily, and you need the threshold enforcement to be tamper-proof regardless of how the agent is prompted ensures the $500 approval threshold cannot be bypassed?"},"options":[{"k":"A","t":{"en":"The process reimbursement tool accepts an approved by manager parameter. The system prompt instructs the agent to only set this to true after confirming that a manager approved the request. A nightly audit script reviews all reimbursements where approved by manager was set to true."}},{"k":"B","t":{"en":"Implement the threshold check in a PreToolUse hook that inspects the amount parameter before process reimbursement executes. If the amount exceeds $500, the hook modifies the context to add a requires approval: true flag, which the tool checks before disbursing."}},{"k":"C","t":{"en":"The process reimbursement tool accepts amount and details, and internally enforces the threshold; amounts &lt;$500 are auto-disbursed and the tool returns a success confirmation. Amounts &gt;$500 cause the tool to create a pending approval request and return a status indicating manager review is pending."}},{"k":"D","t":{"en":"Provide two tools: auto reimburse (hard-coded limit of $500) and manager approval. Include detailed system prompt instructions telling the agent to check the amount and use the appropriate tool. Add a Post ToolUse hook that logs which tool was called for auditing."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Yêu cầu là ngưỡng $500 phải <b>chống giả mạo bất kể agent được prompt thế nào</b>. Cách chắc chắn nhất là đặt kiểm tra <b>bên trong chính tool</b>: tool nhận amount, tự quyết định — dưới $500 thì chi tiền và trả xác nhận, trên $500 thì tạo yêu cầu phê duyệt đang chờ và trả trạng thái “pending manager review”. Agent không có tham số hay đường nào để vượt qua logic này, nên quy tắc được thực thi <b>deterministic</b> ở tầng code thay vì phụ thuộc vào việc model tuân theo prompt.","elim":["<b>A.</b> Tham số <code>approved_by_manager</code> do chính agent đặt dựa trên chỉ dẫn prompt — có thể bị prompt injection hoặc suy luận sai; audit ban đêm chỉ phát hiện sau khi tiền đã chi.","<b>B.</b> Hook chỉ “thêm cờ vào context” và trông cậy tool đọc cờ đó; cơ chế gián tiếp, phụ thuộc vào sự phối hợp giữa hai thành phần và không mạnh bằng việc tool tự thực thi ngưỡng.","<b>D.</b> Việc chọn đúng giữa <code>auto_reimburse</code> và <code>manager_approval</code> vẫn phụ thuộc vào prompt; PostToolUse hook chỉ ghi log sau khi thực thi, không ngăn được vi phạm."]},"cite":"Hướng dẫn ôn tập — §3.5 Hooks trong Agent SDK; Lĩnh vực 1.4"},{"id":"t1q146","n":146,"topic":1,"type":"mcq","stem":{"en":"Your portfolio value tool returns the total value of a user&#x27;s investment portfolio. You&#x27;re deciding between returning a structured JSON object with explicit fields versus returning information as a formatted text string. What is the primary advantage of using structured output with defined fields?"},"options":[{"k":"A","t":{"en":"JSON schemas automatically validate that the underlying API returned correct data before the agent processes it."}},{"k":"B","t":{"en":"Structured JSON is processed deterministically by the model, significantly improving accuracy when extracting values."}},{"k":"C","t":{"en":"The agent can reliably extract specific values without parsing free form text, reducing errors in subsequent operations."}},{"k":"D","t":{"en":"Structured JSON consumes significantly fewer tokens than natural language, substantially reducing API costs."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Lợi ích chính của trả về JSON với các trường được định nghĩa là agent có thể <b>lấy chính xác giá trị cụ thể</b> (ví dụ <code>total_value</code>, <code>currency</code>) mà <b>không phải phân tích văn bản tự do</b>. Điều này giảm lỗi ở các bước tiếp theo — tính toán, so sánh, truyền giá trị cho tool khác — vì không còn rủi ro hiểu sai định dạng số, đơn vị hay vị trí thông tin trong câu.","elim":["<b>A.</b> JSON schema mô tả cấu trúc output của tool, không tự động kiểm chứng dữ liệu từ API bên dưới là đúng; dữ liệu sai vẫn có thể được đóng gói vào JSON hợp lệ.","<b>B.</b> Model không xử lý JSON một cách “deterministic”; đây là phát biểu sai về cách LLM hoạt động — lợi ích nằm ở việc giảm mơ hồ chứ không phải tính tất định.","<b>D.</b> JSON không nhất thiết ít token hơn văn bản (khóa, dấu ngoặc, dấu nháy đều tốn token); tiết kiệm chi phí không phải lợi ích chính."]},"cite":"Hướng dẫn ôn tập — §2.4 JSON Schema cho Structured Output; Lĩnh vực 2.1"},{"id":"t1q147","n":147,"topic":1,"type":"mcq","stem":{"en":"Performance analysis reveals your context is composed of accumulated RAG results from all previous queries, which is crowding out conversation history and causing coherence degradation after 15+ turns. Which approach best addresses this issue?"},"options":[{"k":"A","t":{"en":"Compress all RAG results into a consolidated summary document that updates incrementally after each retrieval"}},{"k":"B","t":{"en":"Implement a sliding window for RAG results from the last 2-3 queries while preserving conversation history"}},{"k":"C","t":{"en":"Implement semantic deduplication to identify and remove redundant information across the accumulated RAG results and conversation turns"}},{"k":"D","t":{"en":"Shift context budget to favor RAG results while reducing conversation history allocation"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Nguyên nhân là kết quả RAG của <b>mọi truy vấn trước</b> tích lũy mãi, chiếm chỗ của lịch sử hội thoại — thứ cần thiết cho tính mạch lạc. Kết quả RAG cũ thường chỉ liên quan đến truy vấn tại thời điểm đó, nên áp dụng <b>cửa sổ trượt</b> chỉ giữ kết quả RAG của 2–3 truy vấn gần nhất, đồng thời <b>bảo toàn lịch sử hội thoại</b>. Cách này giới hạn phần context do RAG chiếm một cách có thể dự đoán và trả lại không gian cho hội thoại.","elim":["<b>A.</b> Tóm tắt dồn toàn bộ kết quả RAG vẫn để khối này tiếp tục lớn dần theo số lượt và làm mất chi tiết; không giải quyết tận gốc việc giữ lại dữ liệu đã hết liên quan.","<b>C.</b> Loại trùng ngữ nghĩa chỉ bỏ phần lặp; các kết quả RAG cũ nhưng không trùng vẫn tích lũy, đồng thời còn có nguy cơ xóa nhầm nội dung hội thoại.","<b>D.</b> Dồn ngân sách cho RAG và cắt lịch sử hội thoại làm vấn đề mạch lạc tệ hơn — đúng ngược với điều cần làm."]},"cite":"Hướng dẫn ôn tập — §11.2 Cắt gọn Kết quả Tool; Lĩnh vực 5.1"},{"id":"t1q148","n":148,"topic":1,"type":"mcq","stem":{"en":"Your team frequently migrates React components to Vue. You&#x27;ve written a step-by-step workflow for Claude Code to follow during each migration, and you want every developer on the team to invoke it by typing /migrate-component. The workflow should stay in sync as the team iterates on it. Where should you place the skill file?"},"options":[{"k":"A","t":{"en":"In the project&#x27;s .claude/settings.json using a skillOverrides entry to register and define the workflow"}},{"k":"B","t":{"en":"In .claude/skills/migrate-component/SKILL.md at the project root, committed to version control"}},{"k":"C","t":{"en":"In ~/.claude/skills/migrate-component/SKILL.md on each developer&#x27;s machine"}},{"k":"D","t":{"en":"As a detailed instruction block in the project&#x27;s root CLAUDE.md file"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Skill cấp dự án đặt tại <code>.claude/skills/migrate-component/SKILL.md</code> ở gốc repo; tên thư mục trở thành lệnh <code>/migrate-component</code>. Vì nằm trong repo và được <b>commit vào version control</b>, mọi lập trình viên đều có cùng skill, và mỗi khi nhóm cải tiến workflow, thay đổi được đồng bộ qua git — đáp ứng cả hai yêu cầu “cả nhóm dùng được” và “luôn đồng bộ”.","elim":["<b>A.</b> <code>settings.json</code> không phải nơi định nghĩa nội dung skill; không có mục <code>skillOverrides</code> dùng để đăng ký và viết workflow như mô tả.","<b>C.</b> <code>~/.claude/skills/</code> là skill cấp người dùng, chỉ có trên máy từng người và không chia sẻ qua VCS — mỗi người phải tự sao chép và các bản sẽ lệch nhau.","<b>D.</b> Nhét workflow vào CLAUDE.md khiến nó được nạp vào mọi session (tốn context) và không tạo ra lệnh <code>/migrate-component</code> để gọi theo yêu cầu."]},"cite":"Hướng dẫn ôn tập — §5.5 Skill — .claude/skills/; Lĩnh vực 3.2"},{"id":"t1q149","n":149,"topic":1,"type":"mcq","stem":{"en":"The system processes product reviews using tool use with a defined schema: rating (integer 1-5), pros (string array), cons (string array), and overall_sentiment (enum: positive, negative, mixed). Testing reveals two issues with brief or ambiguous reviews (~20% of the dataset): (1) for reviews like &quot;Great product!&quot;, Claude fabricates specific pros and cons rather than indicating this information isn&#x27;t explicitly stated, and (2) for sarcastic reviews like &quot;Well that was... interesting&quot;, Claude picks sentiment arbitrarily since there&#x27;s no option for ambiguous cases. What schema modification best addresses both issues?"},"options":[{"k":"A","t":{"en":"Allow null values for pros/cons, and add &quot;unclear&quot; to the sentiment enum."}},{"k":"B","t":{"en":"Make pros and cons optional fields, and add &quot;neutral&quot; and &quot;unclear&quot; to the sentiment enum."}},{"k":"C","t":{"en":"Add an extraction_confidence field (0.0-1.0) for each value, and filter outputs where any confidence falls below a threshold."}},{"k":"D","t":{"en":"Allow empty arrays for pros/cons as valid output, and add &quot;unclear&quot; to the sentiment enum."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Hai lỗi có cùng gốc: schema <b>không có cách hợp lệ để biểu đạt “không có thông tin”</b> nên model buộc phải bịa. (1) Cho phép <b>mảng rỗng</b> cho <code>pros</code>/<code>cons</code> làm output hợp lệ: với “Great product!”, model có thể trả <code>[]</code> thay vì bịa ưu/nhược điểm cụ thể, đồng thời giữ nguyên kiểu mảng nên code phía sau không phải xử lý null. (2) Thêm <code>\"unclear\"</code> vào enum sentiment cho các review mỉa mai/mơ hồ, để model không phải chọn tùy tiện giữa positive/negative/mixed.","elim":["<b>A.</b> Cho phép null với trường mảng tạo hai cách biểu đạt “không có” (null và <code>[]</code>), làm phức tạp xử lý phía sau; mảng rỗng là cách tự nhiên và nhất quán kiểu hơn cho danh sách không có phần tử.","<b>B.</b> Làm pros/cons optional khiến trường có thể vắng mặt hoàn toàn, khó phân biệt “quên trích xuất” với “không có thông tin”; thêm “neutral” không giải quyết vấn đề mỉa mai và chồng lấn với “unclear”.","<b>C.</b> Điểm confidence tự đánh giá thường không được hiệu chỉnh tốt, và lọc bỏ output chỉ loại dữ liệu thay vì sửa schema để model biểu đạt đúng sự thiếu thông tin."]},"cite":"Hướng dẫn ôn tập — §2.4 JSON Schema cho Structured Output; Lĩnh vực 4.3"},{"id":"t1q150","n":150,"topic":1,"type":"mcq","stem":{"en":"Production logs show that when the agent handles complex billing disputes requiring 6+ tool calls, it sometimes exhausts its max_turns limit after gathering data and before completing resolution or escalating. The team&#x27;s goal is to guarantee that every customer interaction ends with either a completed resolution or a human escalation, regardless of how the agent loop terminates. Which approach achieves this guarantee?"},"options":[{"k":"A","t":{"en":"Add orchestration-layer code that checks the agent&#x27;s outcome after each loop termination - if the loop ended without a completed resolution or escalation, programmatically call escalate_to_human with the accumulated conversation context and tool results."}},{"k":"B","t":{"en":"Add system prompt instructions telling the agent to call escalate_to_human with a summary of its findings whenever it determines it cannot resolve the dispute."}},{"k":"C","t":{"en":"Split the workflow into two sequential agent invocations — a first agent gathers information via get_customer and lookup_order, then the second agent uses that data and handles process_refund or escalate_to_human, each with separate turn budgets."}},{"k":"D","t":{"en":"Implement a pre-tool-use hook that counts tool invocations and terminates the loop with an automatic escalation once the agent reaches 80% of its remaining actions."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Yêu cầu là <b>đảm bảo</b> mọi tương tác đều kết thúc bằng giải quyết xong hoặc escalation, <b>bất kể vòng lặp agent kết thúc thế nào</b> (kể cả khi cạn <code>max_turns</code>). Một đảm bảo như vậy phải nằm <b>ngoài model</b>: code ở tầng điều phối kiểm tra kết quả sau mỗi lần vòng lặp dừng, và nếu chưa có resolution hay escalation thì <b>gọi <code>escalate_to_human</code> bằng code</b>, kèm context hội thoại và kết quả tool đã thu thập. Đây là thực thi deterministic, không phụ thuộc việc model “nhớ” escalate trước khi hết lượt.","elim":["<b>B.</b> Chỉ dẫn trong system prompt chỉ cho mức tuân thủ xác suất; khi agent hết <code>max_turns</code> giữa chừng, nó không còn lượt nào để thực hiện chỉ dẫn đó.","<b>C.</b> Tách thành hai agent chỉ chia nhỏ ngân sách lượt; agent thứ hai vẫn có thể cạn lượt mà không kết thúc, nên không có đảm bảo.","<b>D.</b> Ngưỡng “80% số hành động còn lại” là heuristic không đảm bảo bao phủ mọi cách vòng lặp kết thúc (lỗi, stop_reason khác…), và có thể escalate sớm những ca lẽ ra giải quyết được."]},"cite":"Hướng dẫn ôn tập — §3.1 Agentic Loop là gì; Lĩnh vực 1.4"},{"id":"t1q151","n":151,"topic":1,"type":"mcq","stem":{"en":"A developer uses Claude Code to refactor a function during their development session. Before committing, they ask the same Claude session to review the code for issues. Later, a separate automated CI review catches several bugs that the same-session review missed. What best explains this discrepancy?"},"options":[{"k":"A","t":{"en":"The CI environment has access to the full codebase context while the local session only sees the current file"}},{"k":"B","t":{"en":"Claude retains context about its prior reasoning in the session, making it less likely to question its own decisions"}},{"k":"C","t":{"en":"The extended session length caused the context window to fill with conversation history, leaving less room for thorough analysis"}},{"k":"D","t":{"en":"The CI review uses a more specific prompt tailored for catching bugs, while the developer&#x27;s request was too general"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Đây là <b>hạn chế của tự review</b>: trong cùng session, Claude vẫn giữ context về <b>lý do và quyết định</b> nó đã đưa ra khi refactor, nên có xu hướng xác nhận lại các lựa chọn đó thay vì nghi ngờ chúng. Review CI chạy như một <b>instance độc lập</b>, không mang context sinh code, nên nhìn đoạn code “bằng con mắt mới” và phát hiện được lỗi mà session gốc bỏ qua. Vì vậy nên dùng một instance riêng biệt để review code do Claude sinh ra.","elim":["<b>A.</b> Session Claude Code cục bộ có thể đọc toàn bộ codebase bằng Read/Grep/Glob, không bị giới hạn ở file hiện tại; khác biệt không nằm ở quyền truy cập.","<b>C.</b> Đề không cho thấy session dài hay context bị đầy; một lần refactor một hàm khó gây cạn context, và đây không phải giải thích cho thiên lệch xác nhận.","<b>D.</b> Prompt cụ thể hơn có thể giúp, nhưng không giải thích hiện tượng cốt lõi — chính session đã viết code thì kém hiệu quả khi review nó do giữ lại context suy luận."]},"cite":"Hướng dẫn ôn tập — §8.3 Code Review nhiều lượt (Multi-pass); Lĩnh vực 4.6"},{"id":"t1q152","n":152,"topic":1,"type":"mcq","stem":{"en":"You&#x27;ve configured your Claude agent with three MCP servers: one for git operations, one for Jira ticket management, and one for documentation search. When a user asks the agent to &quot;create a branch for JIRA- 123 and add documentation links to the ticket,&quot; how does the agent access tools across these servers?"},"options":[{"k":"A","t":{"en":"The agent automatically selects the most relevant server based on the request and loads only that server&#x27;s tools."}},{"k":"B","t":{"en":"You must specify which MCP server to use for each turn, and the agent can only access one server&#x27;s tools at a time."}},{"k":"C","t":{"en":"Tools from all configured MCP servers are discovered at connection time and available simultaneously to the agent."}},{"k":"D","t":{"en":"The agent queries each server sequentially to determine which handles each tool, routing calls based on tool name prefixes."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Khi agent kết nối với nhiều MCP server, <b>tool của tất cả các server được khám phá tại thời điểm kết nối</b> và <b>đồng thời khả dụng</b> cho agent. Vì vậy với yêu cầu “tạo branch cho JIRA-123 và thêm link tài liệu vào ticket”, agent có thể gọi tool git, tool docs search và tool Jira trong cùng một tác vụ, chọn tool dựa trên tên và mô tả của chúng mà không cần chuyển đổi server.","elim":["<b>A.</b> Agent không tự chọn một server rồi chỉ nạp tool của server đó; mọi tool từ các server đã cấu hình đều có sẵn cùng lúc — yêu cầu này vốn cần tool từ cả ba server.","<b>B.</b> Không cần chỉ định server cho từng lượt và agent không bị giới hạn một server mỗi lúc; MCP được thiết kế để tích hợp nhiều server song song.","<b>D.</b> Agent không truy vấn tuần tự từng server lúc gọi để hỏi ai xử lý tool nào; danh sách tool đã được khám phá sẵn khi kết nối (qua <code>tools/list</code>)."]},"cite":"Hướng dẫn ôn tập — §4.2 MCP Server; Lĩnh vực 2.4"},{"id":"t1q153","n":153,"topic":1,"type":"mcq","stem":{"en":"An engineer submits two requests: • Request A: &quot;Rename the getUserData function to fetchUserProfile everywhere it&#x27;s used.&quot; • Request B: &quot;Improve error handling throughout the data processing module—add try/catch blocks, meaningful error messages, and ensure failures don&#x27;t silently corrupt data.&quot; For which request does specifying an explicit multi-phase workflow (such as analyze propose implement with review) most improve outcome quality?"},"options":[{"k":"A","t":{"en":"Neither request benefits significantly"}},{"k":"B","t":{"en":"Request A, the function rename task"}},{"k":"C","t":{"en":"Both requests benefit equally"}},{"k":"D","t":{"en":"Request B, the error handling task"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Request B (“cải thiện xử lý lỗi toàn module”) là tác vụ <b>mở, đòi hỏi phán đoán</b>: phải xác định chỗ nào cần try/catch, thông báo lỗi nào có ý nghĩa, làm sao tránh làm hỏng dữ liệu âm thầm — có nhiều cách làm hợp lý và ảnh hưởng rộng. Workflow nhiều giai đoạn (analyze → propose → implement → review) giúp <b>khám phá trước, thống nhất phương án</b> rồi mới sửa, giảm rủi ro thay đổi sai hướng. Request A là đổi tên cơ học, phạm vi rõ ràng, thực thi trực tiếp là đủ.","elim":["<b>A.</b> Request B có phạm vi rộng và nhiều quyết định thiết kế, nên hưởng lợi rõ rệt từ việc phân tích và đề xuất trước khi triển khai.","<b>B.</b> Đổi tên hàm là thao tác cơ học, có tiêu chí đúng/sai rõ (tìm và thay mọi chỗ dùng); thêm các giai đoạn phân tích/đề xuất gần như không cải thiện kết quả.","<b>C.</b> Hai request khác nhau về bản chất: một tác vụ xác định đơn giản và một tác vụ mở, nhiều phán đoán — lợi ích của workflow nhiều giai đoạn không như nhau."]},"cite":"Hướng dẫn ôn tập — §5.6 Planning Mode so với Thực thi trực tiếp; Lĩnh vực 3.4"},{"id":"t1q154","n":154,"topic":1,"type":"mcq","stem":{"en":"During initial testing of the automated review pipeline, you notice that reviews on large PRs (50+ changed files) sometimes take over 20 minutes and cost $8-12 per run due to extensive agentic loops — Claude reads files, runs analysis tools, and iterates many times. Your team needs each invocation to abort once it reaches a fixed iteration count and a fixed dollar amount, enforced by Claude Code itself rather than the surrounding job runner. Which configuration change directly enforces both of those per-invocation caps?"},"options":[{"k":"A","t":{"en":"Add --max-turns 10 --max-budget-usd 2.00 to the claude -p invocation to cap iterations and spend."}},{"k":"B","t":{"en":"Set --permission-mode dontAsk to auto-deny any tool permission requests not in the explicitly allowed set."}},{"k":"C","t":{"en":"Switch the --model flag to a smaller, cheaper model so each iteration uses fewer tokens and lower per- call cost."}},{"k":"D","t":{"en":"Set timeout-minutes: 5 on the GitHub Actions job step and monitor per-run costs via the Anthropic Console usage dashboard."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Đề yêu cầu hai giới hạn <b>cho mỗi lần gọi</b>, do <b>chính Claude Code thực thi</b>: số vòng lặp cố định và số tiền cố định. Trong chế độ non-interactive (<code>claude -p</code>), cờ <code>--max-turns</code> giới hạn số lượt agentic, còn <code>--max-budget-usd</code> giới hạn chi phí API tối đa cho lần chạy; khi chạm ngưỡng, Claude Code tự dừng. Đây là cấu hình trực tiếp đáp ứng cả hai yêu cầu.","elim":["<b>B.</b> <code>--permission-mode dontAsk</code> chỉ tự từ chối các tool chưa được cho phép, không giới hạn số vòng lặp hay số tiền chi tiêu.","<b>C.</b> Đổi sang model rẻ hơn chỉ giảm chi phí mỗi lượt, không áp đặt trần cứng nào về số lượt hay tổng chi phí.","<b>D.</b> <code>timeout-minutes</code> là giới hạn của job runner (GitHub Actions), không phải của Claude Code, và theo thời gian chứ không theo số vòng/tiền; dashboard chỉ để theo dõi sau đó."]},"cite":"Hướng dẫn ôn tập — §5.9 Claude Code CLI cho CI/CD; Lĩnh vực 3.6"},{"id":"t1q155","n":155,"topic":1,"type":"mcq","stem":{"en":"Your update_user_profile tool accepts a user_id (required) and an optional fields_to_update object. In testing, Claude frequently omits user_id or passes incorrectly structured data. What is most critical for helping Claude understand what parameter values to provide?"},"options":[{"k":"A","t":{"en":"Verbose parameter names encoding format hints, such as user_id_string_uuid_format"}},{"k":"B","t":{"en":"Clear parameter descriptions explaining expected format, such as &quot;user_id : UUID of the user to update (required)&quot;"}},{"k":"C","t":{"en":"Detailed error responses explaining why invalid parameter values were rejected"}},{"k":"D","t":{"en":"Strict JSON Schema type constraints marking user_id as required and defining fields_to_update as an object type"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Model quyết định truyền giá trị gì chủ yếu dựa trên <b>mô tả tham số</b> trong định nghĩa tool. Một mô tả rõ ràng như “<code>user_id</code>: UUID của người dùng cần cập nhật (bắt buộc)” cho biết <b>ý nghĩa, định dạng và tính bắt buộc</b> — chính là những gì model đang làm sai (bỏ sót <code>user_id</code>, truyền sai cấu trúc). Mô tả là kênh chính truyền đạt kỳ vọng cho model trước khi nó tạo lời gọi.","elim":["<b>A.</b> Tên tham số dài kiểu <code>user_id_string_uuid_format</code> khó đọc, phi chuẩn và vẫn kém thông tin hơn một mô tả có cấu trúc.","<b>C.</b> Thông báo lỗi chi tiết chỉ giúp sửa <b>sau khi</b> đã gọi sai (tốn thêm vòng lặp); chúng không phải điều chính giúp model hiểu từ đầu cần truyền gì.","<b>D.</b> Ràng buộc kiểu JSON Schema là cần thiết nhưng chỉ nói kiểu dữ liệu; không giải thích ý nghĩa và định dạng mong đợi (ví dụ UUID, những trường nào trong <code>fields_to_update</code>)."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q156","n":156,"topic":1,"type":"mcq","stem":{"en":"Your conversation history includes two types of content: persistent story elements (character backgrounds, plot structure, world rules) that must remain consistent throughout, and extensive brainstorming discussion that&#x27;s mostly ephemeral. After 40+ turns, you&#x27;re hitting context limits and users report the assistant &quot;forgets&quot; established character traits, breaking narrative consistency. Which approach best ensures persistent story elements remain available to the model while reclaiming context space?"},"options":[{"k":"A","t":{"en":"Separate persistent story elements into a retained &quot;story bible&quot; section at context start, applying trimming or summarization only to brainstorming discussion."}},{"k":"B","t":{"en":"Apply a sliding-window approach keeping only the most recent 25 turns, relying on the model to infer earlier context from recent discussion flow."}},{"k":"C","t":{"en":"Summarize the entire conversation history into a condensed synopsis every 20 turns, replacing the full history to free up tokens."}},{"k":"D","t":{"en":"Store all history in a vector database and retrieve semantically similar passages for each new message, replacing conversation history with retrieved chunks."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Hội thoại gồm hai loại nội dung với vòng đời khác nhau: <b>yếu tố bền vững</b> (tiểu sử nhân vật, cốt truyện, quy tắc thế giới) phải luôn có mặt, và <b>brainstorm tạm thời</b>. Tách các yếu tố bền vững thành một khối <b>“story bible”</b> được giữ nguyên ở đầu context, và <b>chỉ cắt gọn/tóm tắt phần brainstorm</b>. Như vậy thông tin cốt lõi không bao giờ bị mất qua các lần nén, còn không gian context vẫn được giải phóng.","elim":["<b>B.</b> Cửa sổ trượt 25 lượt sẽ đẩy các đặc điểm nhân vật thiết lập từ sớm ra khỏi context; trông chờ model “suy ra” chúng chính là nguyên nhân gây lỗi quên hiện tại.","<b>C.</b> Tóm tắt toàn bộ lịch sử định kỳ là nén lossy, dễ làm mất chi tiết nhân vật/quy tắc thế giới qua nhiều vòng tóm tắt.","<b>D.</b> Thay lịch sử bằng các đoạn truy xuất theo độ tương đồng không đảm bảo yếu tố bền vững luôn được lấy lại; quy tắc thế giới có thể không “giống” tin nhắn hiện tại nên bị bỏ sót."]},"cite":"Hướng dẫn ôn tập — §11.1 Trích xuất các Sự kiện ra một Block Riêng; Lĩnh vực 5.1"},{"id":"t1q157","n":157,"topic":1,"type":"mcq","stem":{"en":"Users frequently refine their search criteria mid-conversation. You notice a pattern: when users say things like &quot;Actually, let&#x27;s raise the budget to $650K&quot; or &quot;I&#x27;d prefer a condo now instead of a house,&quot; the assistant sometimes continues referencing the original preferences in later responses—even though the updates are clearly present in the conversation history. Context usage is only at 35% capacity. Which solution most reliably ensures the model uses the current preferences?"},"options":[{"k":"A","t":{"en":"Implement conversation pruning to remove turns containing outdated preferences, ensuring only current ones remain in context."}},{"k":"B","t":{"en":"Add system prompt instructions emphasizing that the model should always prioritize the most recently stated preferences over earlier ones."}},{"k":"C","t":{"en":"Include few-shot examples showing the assistant correctly acknowledging and applying preference changes in responses."}},{"k":"D","t":{"en":"Maintain a structured state object with current preferences, update it on changes, and include it in each request."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Context chỉ dùng 35% nên vấn đề không phải thiếu chỗ, mà là model phải tự <b>đối chiếu nhiều phiên bản sở thích</b> rải rác trong lịch sử và đôi khi chọn nhầm bản cũ. Duy trì một <b>đối tượng trạng thái có cấu trúc</b> chứa sở thích <b>hiện hành</b> (budget $650K, loại nhà: condo…), cập nhật khi người dùng thay đổi và đưa vào mỗi request, cung cấp một <b>nguồn sự thật duy nhất</b> rõ ràng. Đây là cách đáng tin cậy nhất, không phụ thuộc vào việc model tự suy luận thứ tự thời gian.","elim":["<b>A.</b> Cắt bỏ các lượt chứa sở thích cũ phá vỡ mạch hội thoại, khó thực hiện chính xác (một lượt có thể chứa cả thông tin còn hiệu lực) và không cần thiết khi context mới dùng 35%.","<b>B.</b> Chỉ dẫn “ưu tiên sở thích mới nhất” vẫn bắt model tự xác định đâu là bản mới nhất trong lịch sử — chính việc nó đang làm sai; chỉ cải thiện xác suất.","<b>C.</b> Few-shot về việc thừa nhận thay đổi sở thích cũng là biện pháp mềm; không loại bỏ việc các giá trị cũ và mới cùng tồn tại trong context."]},"cite":"Hướng dẫn ôn tập — §11.1 Trích xuất các Sự kiện ra một Block Riêng; Lĩnh vực 5.1"},{"id":"t1q158","n":158,"topic":1,"type":"mcq","stem":{"en":"After deploying automated code review, developers report that approximately 35% of flagged findings are false positives falling into consistent patterns: style suggestion contradicting team conventions, security warnings for patterns safe in your deployment context, and performance suggestions that would degrade your specific use case. You want to reduce false positives while maintaining the ability to catch genuine issues. Which approach best enables the model to generalize its judgment to novel code patterns it hasn&#x27;t seen before?"},"options":[{"k":"A","t":{"en":"Create a comprehensive written specification of all patterns that should not be flagged, then include this full documentation in the system prompt."}},{"k":"B","t":{"en":"Implement post-processing that uses keyword matching to filter out findings containing terms like &quot;convention,&quot; &quot;context-dependent,&quot; or &quot;trade-off.&quot;"}},{"k":"C","t":{"en":"Add instructions to your system prompt to &quot;be conservative,&quot; &quot;only flag definite issues,&quot; and &quot;consider that some patterns may be intentional.&quot;"}},{"k":"D","t":{"en":"Include few-shot examples in your prompt showing annotated code snippets that distinguish acceptable patterns from genuine issues in each category."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Đề hỏi cách giúp model <b>khái quát hóa phán đoán</b> sang các mẫu code chưa từng gặp. <b>Few-shot examples</b> với các đoạn code được chú thích, cho thấy <b>vì sao</b> một mẫu là chấp nhận được (theo quy ước nhóm/bối cảnh triển khai) và mẫu khác là lỗi thật trong từng loại (style, security, performance), dạy cho model <b>lý lẽ phân biệt</b> chứ không chỉ một danh sách. Nhờ đó model áp dụng cùng tiêu chí cho trường hợp mới, giảm false positive mà vẫn bắt được lỗi thật.","elim":["<b>A.</b> Một bản đặc tả liệt kê các mẫu không cần flag chỉ bao phủ những gì đã biết; nó không giúp model khái quát hóa sang mẫu mới, và tài liệu dài còn làm loãng prompt.","<b>B.</b> Lọc bằng từ khóa rất thô, sẽ loại nhầm cả lỗi thật có chứa các từ đó và bỏ sót false positive diễn đạt khác — không cải thiện phán đoán của model.","<b>C.</b> Chỉ dẫn mơ hồ như “be conservative” không cho tiêu chí cụ thể; thường làm model bỏ sót cả lỗi thật mà vẫn không loại đúng các false positive."]},"cite":"Hướng dẫn ôn tập — §6.1 Few-shot Prompting; Lĩnh vực 4.2"},{"id":"t1q159","n":159,"topic":1,"type":"mcq","stem":{"en":"You are setting up a non-interactive automated code review pipeline using Claude Code. You want Claude to analyze a pulled Git diff (git diff) against the main branch and apply a custom set of code review instructions. However, you notice that when you run the pipeline, Claude only looks at the raw diff text itself and completely stops using its file-reading or code navigation tools. As a result, it fails to inspect the broader codebase repository context, which is critical because the diff modifies a core function called by many other external modules. Which change to the CLI invocation will cause Claude to read related files in the repository while still successfully applying your custom review instructions?"},"options":[{"k":"A","t":{"en":"Replace --system-prompt with --append-system-prompt so your review instructions are added to Claude Code&#x27;s default prompt instead of overwriting the built-in guidance for using file-reading and code navigation tools."}},{"k":"B","t":{"en":"Remove --system-prompt entirely and place the review instructions in a CLAUDE.md file at the repo root, since --system-prompt is incompatible with tool use under -p."}},{"k":"C","t":{"en":"Stop piping the diff via stdin and instead embed the diff contents inside the prompt string, so Claude Code treats the invocation as an agentic session rather than a stream-processing one."}},{"k":"D","t":{"en":"Keep --system-prompt and add --allowedTools &quot;Read, Glob, Grep&quot; so that the non-interactive mode permits file system tools that it otherwise disables."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Cờ <code>--system-prompt</code> <b>thay thế hoàn toàn</b> system prompt mặc định của Claude Code — bao gồm cả các hướng dẫn về cách dùng tool đọc file và điều hướng code — nên Claude chỉ nhìn vào diff thô. <code>--append-system-prompt</code> thì <b>nối thêm</b> chỉ dẫn review của bạn vào sau prompt mặc định, giữ lại hành vi agentic (Read, Grep, Glob…) để Claude tự tra cứu các module gọi tới hàm lõi, đồng thời vẫn áp dụng tiêu chí review tùy chỉnh.","elim":["<b>B.</b> <code>--system-prompt</code> không “không tương thích” với tool use dưới <code>-p</code>; chuyển chỉ dẫn sang CLAUDE.md có thể chạy được nhưng lý do nêu ra là sai, và đây không phải cách sửa trực tiếp nguyên nhân (prompt mặc định bị ghi đè).","<b>C.</b> Cách truyền diff (stdin hay chuỗi prompt) không quyết định việc session có “agentic” hay không; vấn đề nằm ở system prompt bị thay thế.","<b>D.</b> Chế độ non-interactive không tự vô hiệu hóa các tool đọc file; thêm <code>--allowedTools</code> không khôi phục được các hướng dẫn mặc định đã bị <code>--system-prompt</code> xóa."]},"cite":"Hướng dẫn ôn tập — §5.9 Claude Code CLI cho CI/CD; Lĩnh vực 3.6"},{"id":"t1q160","n":160,"topic":1,"type":"mcq","stem":{"en":"Your development team is using Claude Code to automate test generation across a large codebase. However, developers are frequently rejecting the generated test suites because Claude creates a high volume of trivial assertions or tests that merely maximize line coverage without validating meaningful behavioral logic or edge cases. You want to guide Claude to generate high-quality, production-ready tests directly without introducing high latency or modifying the core pipeline script. Which strategy best ensures that high-quality, meaningful tests are generated in the first place?"},"options":[{"k":"A","t":{"en":"Document testing standards in CLAUDE.md including valuable test criteria, available fixtures with intended use cases, and examples distinguishing meaningful behavioral tests from trivial assertions."}},{"k":"B","t":{"en":"Implement a two-phase generation where a second Claude call scores each test against quality criteria, filtering out low-scoring tests before presenting results to developers."}},{"k":"C","t":{"en":"Add post-generation coverage analysis that automatically filters out any generated test that doesn&#x27;t increase line coverage beyond what existing tests provide."}},{"k":"D","t":{"en":"Restrict test generation to directories where historical quality metrics show higher acceptance rates, disabling it for areas where generated tests consistently require heavy editing."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Yêu cầu: sinh test chất lượng <b>ngay từ đầu</b>, <b>không tăng độ trễ</b> và <b>không sửa script pipeline</b>. Ghi tiêu chuẩn kiểm thử vào <code>CLAUDE.md</code> — tiêu chí test có giá trị, các <b>fixture sẵn có và mục đích dùng</b>, cùng <b>ví dụ phân biệt</b> test hành vi có ý nghĩa với assertion tầm thường — cung cấp ngữ cảnh dự án mà Claude Code tự nạp ở mỗi lần chạy. Chỉ cần sửa một file cấu hình, không thêm lời gọi hay bước hậu xử lý nào.","elim":["<b>B.</b> Lượt chấm điểm bằng function totalParts(q){
  if(q.type === "mcq") return q.answer.length;
  if(q.type === "yesno") return q.rows.length;
  return q.blanks.length;
}
function isComplete(q, a){ return answeredCount(q,a) >= totalParts(q); }
function isCorrect(q, a){
  if(!a) return false;
  if(q.type === "mcq")
    return a.length === q.answer.length && [...a].sort().join("") === [...q.answer].sort().join("");
  if(q.type === "yesno") return q.rows.every((r,i) => a[i] === r.a);
  return q.blanks.every((b,i) => a[i] === b.a);
}
function stampHTML(q){
  if(q.type === "mcq")
    return `<div class="stamp"><span class="t">${t("ansTitle")}</span><span class="v">${q.answer.join(" ")}</span></div>`;
  if(q.type === "yesno")
    return `<div class="stamp"><span class="t">${t("ansTitle")}</span><span class="v">${
      q.rows.map(r => r.a === "Y" ? "Y" : "N").join(" ")}</span></div>`;
  return `<div class="stamp txt"><span class="t">${t("ansTitle")}</span><span class="v">${
    q.blanks.map(b => strip(b.opts[b.a].en)).join(" · ")}</span></div>`;
}

/* ---------- thân câu hỏi (dùng chung cho ôn tập / thi / xem lại) ---------- */
function bodyHTML(q, a, done, act){
  const P = act ? `data-act="${act}"` : "";
  if(q.type === "mcq"){
    return `<ul class="opts">` + q.options.map(o => {
      const right = q.answer.includes(o.k), pick = (a||[]).includes(o.k);
      return `<li><button class="opt" ${P} data-k="${o.k}" data-right="${right?1:0}" data-pick="${pick?1:0}"
          ${done?'aria-disabled="true"':""}>
        <span class="k">${o.k}</span><span class="tx">${tx(o.t)}</span>
        <span class="mk mk-you">${t("markYou")}</span><span class="mk mk-ok">${t("markOk")}</span>
      </button></li>`; }).join("") + `</ul>`;
  }
  if(q.type === "yesno"){
    return `<ul class="ynlist">` + q.rows.map((r,i) => {
      const v = a ? a[i] : null;
      const right = v !== null && v === r.a;
      return `<li class="yn" data-right="${right?1:0}">
        <div class="ynt">${tx(r.t)}</div>
        <div class="ynb" role="group">
          <button ${P} data-i="${i}" data-v="Y" data-correct="${r.a==="Y"?1:0}" aria-pressed="${v==="Y"}">${t("yes")}</button>
          <button ${P} data-i="${i}" data-v="N" data-correct="${r.a==="N"?1:0}" aria-pressed="${v==="N"}">${t("no")}</button>
        </div></li>`; }).join("") + `</ul>`;
  }
  return `<div class="blanks">` + q.blanks.map((b,i) => {
    const v = a ? a[i] : null;
    const right = v !== null && v === b.a;
    return `<div class="blank" data-right="${right?1:0}">
      ${b.label ? `<span class="blabel">${tx(b.label)}</span>` : ""}
      <label class="sel ${v!==null?"on":""}">
        <select ${P} data-i="${i}">
          <option value="">— —</option>
          ${b.opts.map((o,j) => {
            const en = strip(o.en), vi = o.vi ? strip(o.vi) : "";
            return `<option value="${j}" ${v===j?"selected":""}${vi?` title="${esc(vi)}"`:""}>${esc(en)}</option>`;
          }).join("")}
        </select><span class="cap"></span>
      </label>
      <span class="ansline ${right?"ok":"bad"}">${t("ansTitle")}: ${esc(strip(b.opts[b.a].en))}${
        L === "vi" && b.opts[b.a].vi ? ` — ${esc(strip(b.opts[b.a].vi))}` : ""}</span>
    </div>`; }).join("") + `</div>`;
}

/* ---------- khối giải thích ---------- */
function noteHTML(r){
  return `<div class="notewrap"><span class="lbl">${t("secNote")}</span>
    <textarea data-act="note" rows="2" placeholder="${esc(t("notePh"))}">${esc(r.note||"")}</textarea></div>`;
}
function revealHTML(q, verdict, extra){
  const e = q.explain || {};
  const two = !!(e.key && e.elim && e.elim.length);
  let secs = "";
  if(e.key)  secs += `<div><h4 class="sech">${t("secKey")}</h4><p class="prose">${e.key}</p></div>`;
  if(e.elim && e.elim.length)
    secs += `<div><h4 class="sech">${t("secElim")}</h4><ul class="elim">${e.elim.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  if(e.text) secs += `<div><h4 class="sech">${t("secExp")}</h4><p class="prose">${e.text}</p></div>`;
  const conf = q.conf ? `<span class="conf ${q.conf.toLowerCase()}">${t("conf"+q.conf.toUpperCase())}</span>` : "";
  return `<div class="rev">
    <div class="revtop">${stampHTML(q)}${verdict}${conf}</div>
    <div class="revgrid ${two?"two":""}">${secs}</div>
    ${q.cite ? `<p class="cite">${t("source")}: ${q.cite}</p>` : ""}
    ${extra || ""}
  </div>`;
}

const S = { mode:"study", f:{topic:"all",status:"all",type:"all",q:""},
            p:{}, history:[], cur:null, exam:null, reviewWrongOnly:false };
const rec = id => (S.p[id] ||= { a:null, done:0, ok:null, flag:0, note:"", n:0 });
const ansOf = q => { const r = rec(q.id); if(!r.a) r.a = blankAnswer(q); return r.a; };

function save(){
  const e = S.exam;
  const exam = (e && e.phase === "run") ? {
    ids:e.list.map(x=>x.id), order:e.order, answers:e.answers, flags:e.flags,
    pos:e.pos, started:e.started, duration:e.duration, cfg:e.cfg } : null;
  store.set(KEY, JSON.stringify({ v:2, lang:L, theme:document.documentElement.dataset.theme,
                                  p:S.p, history:S.history, exam }));
}
function load(){
  try{
    const d = JSON.parse(store.get(KEY) || "{}");
    if(d.p) S.p = d.p;
    if(Array.isArray(d.history)) S.history = d.history;
    if(d.lang) L = d.lang;
    if(d.exam && d.exam.ids){
      const list = d.exam.ids.map(id => {
        const q = BY_ID[id]; if(!q) return null;
        const ord = d.exam.order && d.exam.order[id];
        if(ord && q.options) return Object.assign({}, q, { options: ord.map(k => q.options.find(o=>o.k===k)).filter(Boolean) });
        return q;
      }).filter(Boolean);
      if(list.length === d.exam.ids.length)
        S.exam = { phase:"run", list, order:d.exam.order, answers:d.exam.answers||{}, flags:d.exam.flags||{},
                   pos:d.exam.pos||0, started:d.exam.started, duration:d.exam.duration, cfg:d.exam.cfg, timer:null };
    }
  }catch(e){}
}

/* ---------- lọc ---------- */
function filtered(){
  const term = fold(S.f.q.trim());
  return ALL.filter(q => {
    if(S.f.topic !== "all" && q.topic !== +S.f.topic) return false;
    if(S.f.type !== "all" && q.type !== S.f.type) return false;
    const r = S.p[q.id];
    if(S.f.status === "todo"  && r && r.done) return false;
    if(S.f.status === "right" && !(r && r.ok === true)) return false;
    if(S.f.status === "wrong" && !(r && r.ok === false)) return false;
    if(S.f.status === "flag"  && !(r && r.flag)) return false;
    if(term && !q.hay.includes(term)) return false;
    return true;
  });
}
function statsOf(list){
  let done=0, right=0, flag=0;
  list.forEach(q => { const r=S.p[q.id]; if(!r) return;
    if(r.ok === true || r.ok === false){ done++; if(r.ok) right++; }
    if(r.flag) flag++; });
  return { done, right, flag, total:list.length };
}

function applyI18n(){
  document.documentElement.lang = L;
  $$("[data-t]").forEach(el => { const v = T[L][el.dataset.t]; if(typeof v === "string") el.textContent = v; });
  $$("[data-t-ph]").forEach(el => { const v = T[L][el.dataset.tPh]; if(typeof v === "string") el.placeholder = v; });
  $("#storeNote").textContent = store.ok ? t("okStore") : t("noStore");
  $$("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === L));
  $$("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === S.mode));
}

function renderRail(){
  // một hàm dựng hàng dùng chung cho MỌI danh sách lọc — thêm bộ lọc mới thì
  // gọi lại nó, đừng đẻ ra kiểu hiển thị thứ hai.
  const listRow = (key, cur, v, lab, count, mark) =>
    `<button class="srow" data-f-key="${key}" data-v="${v}" aria-pressed="${String(v)===String(cur)}">
      <span class="dot ${mark||""}"></span><span class="nm">${esc(lab)}</span><span class="ct">${count}</span>
    </button>`;

  // ----- trạng thái -----
  const counts = (() => {
    let todo=0, right=0, wrong=0, flag=0;
    ALL.forEach(q => { const r = S.p[q.id];
      if(!r || !r.done) todo++;
      if(r && r.ok === true) right++;
      if(r && r.ok === false) wrong++;
      if(r && r.flag) flag++; });
    return {all:ALL.length, todo, right, wrong, flag};
  })();
  $("#fStatus").innerHTML = [
    ["all", t("sAll"), ""], ["todo", t("sTodo"), ""], ["right", t("sRight"), "g"],
    ["wrong", t("sWrong"), "r"], ["flag", t("sFlag"), "f"]
  ].map(([v,lab,mk]) => listRow("status", S.f.status, v, lab, counts[v], mk)).join("");

  // ----- dạng câu: chỉ hiện khi đề có từ hai dạng trở lên -----
  const typeInfo = {mcq:[t("kMcq"),"m-mcq"], yesno:[t("kYesno"),"m-yesno"], dropdown:[t("kDrop"),"m-drop"]};
  const typeBlock = $("#fTypeBlk");
  if(TYPES.length < 2) typeBlock.classList.add("hide");
  else {
    typeBlock.classList.remove("hide");
    const tc = Object.fromEntries(TYPES.map(x => [x, ALL.filter(q => q.type === x).length]));
    $("#fType").innerHTML = listRow("type", S.f.type, "all", t("kAll"), ALL.length, "")
      + TYPES.map(x => listRow("type", S.f.type, x, typeInfo[x][0], tc[x], typeInfo[x][1])).join("");
  }

  const row = (v, name, list) => {
    const s = statsOf(list);
    return `<button class="trow" data-f-key="topic" data-v="${v}" aria-pressed="${String(v)===String(S.f.topic)}">
      <span class="nm">${esc(name)}</span><span class="ct">${s.done}/${s.total}</span>
      <span class="meter"><i class="g" style="width:${pct(s.right,s.total)}%"></i><i class="r" style="width:${pct(s.done-s.right,s.total)}%"></i></span>
    </button>`;
  };
  $("#fTopics").innerHTML = row("all", t("sAll"), ALL) +
    TOPICS.map(n => row(n, t("topicN", n), ALL.filter(q => q.topic === n))).join("");
}

function renderAside(){

  if(S.mode === "stats"){ box.innerHTML = asideKeys(); return; }
  box.innerHTML = asideStudy() + asideKeys();
}

    <div class="bigbar"><i style="width:${pct(s.right,s.total)}%;background:var(--ok)"></i><i style="width:${pct(s.done-s.right,s.total)}%;background:var(--bad)"></i></div>
    <div class="kv"><span>${t("attempted")}</span><b>${s.done}/${s.total}</b></div>

    <div class="kv"><span>${t("flagged")}</span><b>${s.flag}</b></div>
  </div>
  <div class="blk only-lg">
    <span class="lbl">${t("queue")} · ${queue.length}</span>
    ${queue.length ? `<div class="queue">` + queue.map(q => {
        const r = S.p[q.id];
        return `<button class="qbtn ${r.ok===false?"is-wrong":"is-flag"}" data-jump="${q.id}">
          <span class="n">${pad2(q.idx)}</span><span class="t">${esc(strip(q.stem.en).slice(0,64))}</span></button>`;
      }).join("") + `</div>` : `<p class="note">${t("queueEmpty")}</p>`}

function asideKeys(){
  const r = (k,d) => `<div class="keyrow"><kbd>${k}</kbd><span>${d}</span></div>`;
  return `<div class="blk only-lg"><span class="lbl">${t("keysTitle")}</span><div class="keys">

function asideExam(){
  const e = S.exam;
  const left = e.duration ? Math.max(0, e.duration - Math.floor((Date.now()-e.started)/1000)) : null;
  const ans = e.list.filter((q,i) => isComplete(q, e.answers[i])).length;

  </div>

    <span class="lbl">${t("answeredN")}</span>
    <div class="bigbar"><i style="width:${pct(ans,e.list.length)}%;background:var(--pick)"></i></div>
    <div class="kv"><span>${t("answeredN")}</span><b>${ans}/${e.list.length}</b></div>

  </div>`;
}

/* ---------- vùng chính ---------- */
function renderMain(){
  const v = $("#view");
  v.innerHTML = S.mode === "study" ? viewStudy() : S.mode === "stats" ? viewStats() : viewExam();
}

function viewStudy(){
  const list = filtered();
  const head = `<header class="head">
      <div><h2>${t("studyTitle")}</h2><p>${t("studyLead", list.length)}</p></div>
      <div class="r"><span class="lbl">${esc(DATA.meta.code)}</span></div></header>`;
  if(!list.length) return head + `<div class="empty"><b>${t("emptyT")}</b>${t("emptyD")}</div>`;
  return head + list.map(recordHTML).join("");
}

function typeTag(q){
  if(q.type === "yesno") return `<span class="tag multi">${t("tYesno")}</span>`;
  if(q.type === "dropdown") return `<span class="tag multi">${t("tDrop")}</span>`;
  if(q.multi) return `<span class="tag multi">${t("multi", q.answer.length)}</span>`;
  return "";
}

function recordHTML(q){
  const r = rec(q.id), a = ansOf(q);
  const tags = [`<span class="tag">${esc(t("topicN", q.topic))}</span>`,
                `<span class="tag">${esc(t("qN", q.n))}</span>`, typeTag(q)];
  if(r.done && r.ok === true)  tags.push(`<span class="tag ok">${t("verdictOk")}</span>`);
  if(r.done && r.ok === false) tags.push(`<span class="tag bad">${t("verdictBad")}</span>`);
  tags.push(`<button class="flagbtn" data-act="flag" aria-pressed="${!!r.flag}"
      title="${esc(r.flag?t("unflag"):t("flag"))}" aria-label="${esc(r.flag?t("unflag"):t("flag"))}">${ICON.flag}</button>`);

  const n = answeredCount(q,a), total = totalParts(q);
  const bar = r.done
    ? `<button class="btn" data-act="again">${t("again")}</button>`
    : `<button class="btn solid" data-act="check" ${isComplete(q,a)?"":"disabled"}>${t("check")}</button>
       <button class="btn" data-act="reveal">${t("reveal")}</button>
       <span class="note">${n===0 ? t("pickFirst") : n>=total ? t("answered") : t("partial", n, total)}</span>`;

  const verdict = r.ok === true  ? `<span class="verdict ok">${t("verdictOk")}</span>`
                : r.ok === false ? `<span class="verdict bad">${t("verdictBad")}</span>`
                : `<span class="note">${t("verdictNone")}</span>`;

  return `<article class="rec ${S.cur===q.id?"cur":""}" id="rec-${q.id}" data-id="${q.id}" data-done="${r.done?1:0}">
    <div class="rechead"><span class="idx">${pad2(q.idx)}</span><div class="tags">${tags.join("")}</div></div>
    <p class="stem">${tx(q.stem)}</p>
    ${q.img ? `<img class="qimg" src="${q.img}" alt="" data-zoom>` : ""}
    <div class="qbody">${bodyHTML(q, a, r.done, "ans")}</div>
    <div class="bar">${bar}</div>
    ${revealHTML(q, verdict, noteHTML(r))}
  </article>`;
}

function refreshRecord(id, focusSel){
  const q = BY_ID[id];
  let node = document.getElementById("rec-"+id);
  if(!q || !node) return;
  node.outerHTML = recordHTML(q);
  node = document.getElementById("rec-"+id);
  if(node && focusSel){ const n = node.querySelector(focusSel); if(n) n.focus(); }
}

/* ---------- ghi nhận câu trả lời ---------- */
function applyAnswer(q, a, el){
  if(q.type === "mcq"){
    const k = el.dataset.k;
    if(q.answer.length > 1){
      const i = a.indexOf(k);
      if(i >= 0) a.splice(i,1);
      else { if(a.length >= q.answer.length) a.shift(); a.push(k); }
    } else { a.length = 0; if(!el.dataset.was) a.push(k); }
  } else if(q.type === "yesno"){
    const i = +el.dataset.i;
    a[i] = a[i] === el.dataset.v ? null : el.dataset.v;
  } else {
    const i = +el.dataset.i;
    a[i] = el.value === "" ? null : +el.value;
  }
}

/* ============================================================
   THI THỬ
   ============================================================ */
function examPool(cfg){
  let p = ALL;
  if(cfg.topic !== "all") p = p.filter(q => q.topic === +cfg.topic);
  if(cfg.source === "wrong") p = p.filter(q => { const r=S.p[q.id]; return r && r.ok === false; });
  if(cfg.source === "flag")  p = p.filter(q => { const r=S.p[q.id]; return r && r.flag; });
  return p;
}
function viewExam(){
  const e = S.exam;
  if(!e || e.phase === "setup") return examSetup();
  if(e.phase === "run") return examRun();
  return examResult();
}
function selectHTML(name, cur, opts){
  return `<label class="fldw"><span class="lbl">${name}</span>
    <span class="sel"><select data-cfg="${opts.key}">${
      opts.items.map(([v,lab]) => `<option value="${esc(v)}" ${String(v)===String(cur)?"selected":""}>${esc(lab)}</option>`).join("")
    }</select><span class="cap"></span></span></label>`;
}
function examSetup(){
  const cfg = (S.exam && S.exam.cfg) || { count:30, mins:45, topic:"all", shuffle:"yes", source:"all" };
  const n = examPool(cfg).length;
  const resume = S.exam && S.exam.phase === "run";
