eview. A quarterly audit reveals that 12% of <b class=\"kw\">high-confidence extractions (&gt;85%) also contain errors</b>—cases where the model finds plausible-but-incorrect values. <b class=\"kw\">Error sources vary</b>: comparison tables showing competitor specs, appendices referencing different product variants, and ambiguous phrasing the model misinterprets. You need a <b class=\"kw\">sustainable strategy</b> to catch these high-confidence errors and <b class=\"kw\">measure whether improvements reduce the error rate</b> over time. What approach is most effective?","vi":"Hệ thống chuyển các tài liệu có mức confidence trích xuất dưới 85% sang review của con người. Một đợt kiểm tra hằng quý cho thấy 12% các kết quả trích xuất có <b class=\"kw\">confidence cao (&gt;85%) cũng chứa lỗi</b> — những trường hợp mô hình tìm ra các giá trị nghe có vẻ hợp lý nhưng sai. <b class=\"kw\">Nguồn gốc lỗi rất đa dạng</b>: các bảng so sánh hiển thị thông số của đối thủ cạnh tranh, các phụ lục tham chiếu đến những biến thể sản phẩm khác, và cách diễn đạt mơ hồ mà mô hình hiểu sai. Bạn cần một <b class=\"kw\">chiến lược bền vững</b> để phát hiện những lỗi có confidence cao này và <b class=\"kw\">đo lường xem các cải tiến có làm giảm tỷ lệ lỗi</b> theo thời gian hay không. Cách tiếp cận nào hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"Add a <b class=\"kw\">verification pass</b> that <b class=\"kw\">re-extracts</b> from each high-confidence document, flagging cases where the two extraction attempts produce different results.","vi":"Thêm một <b class=\"kw\">lượt xác minh</b> <b class=\"kw\">trích xuất lại</b> từ mỗi tài liệu có confidence cao, gắn cờ các trường hợp mà hai lần trích xuất cho ra kết quả khác nhau."}},{"k":"B","t":{"en":"<b class=\"kw\">Lower the confidence threshold</b> from <b class=\"kw\">85% to 70%</b>, routing a larger volume of extractions to human review.","vi":"<b class=\"kw\">Hạ ngưỡng confidence</b> từ <b class=\"kw\">85% xuống 70%</b>, chuyển một khối lượng lớn hơn các kết quả trích xuất sang review của con người."}},{"k":"C","t":{"en":"Implement <b class=\"kw\">heuristic rules</b> that flag documents containing <b class=\"kw\">comparison tables or appendices</b> for review regardless of confidence score.","vi":"Triển khai các <b class=\"kw\">quy tắc heuristic</b> gắn cờ để review những tài liệu chứa <b class=\"kw\">bảng so sánh hoặc phụ lục</b>, bất kể confidence score."}},{"k":"D","t":{"en":"Implement <b class=\"kw\">stratified random sampling</b> reviewing a fixed percentage of high-confidence extractions weekly, enabling <b class=\"kw\">error rate measurement</b> and novel pattern detection.","vi":"Triển khai <b class=\"kw\">lấy mẫu ngẫu nhiên phân tầng</b>, review một tỷ lệ phần trăm cố định các kết quả trích xuất có confidence cao mỗi tuần, cho phép <b class=\"kw\">đo lường tỷ lệ lỗi</b> và phát hiện các mẫu lỗi mới."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Lỗi ở nhóm độ tin cậy cao là các giá trị “hợp lý nhưng sai” mà điểm confidence không phản ánh được, và nguồn lỗi rất đa dạng. <b>Lấy mẫu ngẫu nhiên phân tầng</b> một tỷ lệ cố định các bản trích xuất độ tin cậy cao mỗi tuần vừa cho phép <b>đo tỷ lệ lỗi</b> một cách thống kê theo thời gian (để biết cải tiến có hiệu quả không), vừa giúp <b>phát hiện các mẫu lỗi mới</b> chưa biết trước. Đây là chiến lược bền vững với khối lượng review có thể kiểm soát.","elim":["<b>A.</b> Trích xuất lại lần hai bằng cùng mô hình thường lặp lại cùng lỗi “hợp lý nhưng sai” (lỗi mang tính hệ thống), nên hai lần khớp nhau vẫn có thể sai; nó cũng không cung cấp số đo tỷ lệ lỗi.","<b>B.</b> Hạ ngưỡng xuống 70% chỉ đẩy thêm khối lượng review mà không nhắm vào lỗi ở nhóm &gt;85%, vì độ tin cậy vốn không tương quan tốt với các lỗi này.","<b>C.</b> Heuristic chỉ bắt các nguồn lỗi đã biết (bảng so sánh, phụ lục), bỏ sót lỗi diễn đạt mơ hồ và các mẫu lỗi mới, đồng thời không đo được tỷ lệ lỗi tổng thể."]},"cite":"Hướng dẫn ôn tập — §9.4 Hiệu chỉnh độ tin cậy và giám sát của con người; Lĩnh vực 5.5"},{"id":"t1q86","n":86,"topic":1,"type":"mcq","stem":{"en":"Your research assistant helps users analyze academic papers over extended conversations. User testing reveals a recurring issue: after conversations exceed 60K tokens, users ask follow-up questions requiring <b class=\"kw\">precise numerical details</b> from papers discussed earlier—sample sizes, exact p-values, specific inclusion criteria. Your current approach <b class=\"kw\">summarizes paper discussions after 8 turns</b> to stay within context limits. Users report that responses to these precision-dependent questions are often <b class=\"kw\">hedged or inaccurate</b>. What&#x27;s the most effective architectural change?","vi":"Trợ lý nghiên cứu của bạn giúp người dùng phân tích các bài báo học thuật qua những cuộc hội thoại dài. Kiểm thử với người dùng cho thấy một vấn đề lặp lại: sau khi cuộc hội thoại vượt quá 60K token, người dùng đặt các câu hỏi tiếp nối đòi hỏi <b class=\"kw\">chi tiết số liệu chính xác</b> từ các bài báo đã thảo luận trước đó — cỡ mẫu, giá trị p chính xác, tiêu chí đưa vào cụ thể. Cách tiếp cận hiện tại của bạn <b class=\"kw\">tóm tắt phần thảo luận về bài báo sau 8 lượt</b> để nằm trong giới hạn context. Người dùng phản ánh rằng câu trả lời cho những câu hỏi đòi hỏi độ chính xác này thường mang tính <b class=\"kw\">nước đôi, dè dặt hoặc không chính xác</b>. Thay đổi kiến trúc nào hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Keep source text</b> from methodology and results sections in context permanently, while <b class=\"kw\">summarizing only the conversational discussion</b> and interpretation portions.","vi":"<b class=\"kw\">Giữ vĩnh viễn văn bản gốc</b> của các phần phương pháp và kết quả trong context, trong khi <b class=\"kw\">chỉ tóm tắt phần thảo luận hội thoại</b> và phần diễn giải."}},{"k":"B","t":{"en":"Use a <b class=\"kw\">separate Claude call</b> with explicit instructions to generate <b class=\"kw\">higher-fidelity summaries</b> that preserve all numerical details and statistical values.","vi":"Dùng một <b class=\"kw\">lệnh gọi Claude riêng</b> với chỉ dẫn rõ ràng để tạo các <b class=\"kw\">bản tóm tắt có độ trung thực cao hơn</b>, giữ lại toàn bộ chi tiết số liệu và giá trị thống kê."}},{"k":"C","t":{"en":"Implement <b class=\"kw\">retrieval that re-injects</b> <b class=\"kw\">relevant paper sections</b> when the user&#x27;s question suggests they need specific numerical details.","vi":"Triển khai <b class=\"kw\">cơ chế truy xuất (retrieval)</b> đưa lại <b class=\"kw\">các phần liên quan của bài báo</b> vào context khi câu hỏi của người dùng cho thấy họ cần chi tiết số liệu cụ thể."}},{"k":"D","t":{"en":"Maintain a <b class=\"kw\">structured database of key facts</b> extracted from each paper (sample sizes, statistics, methods) and <b class=\"kw\">retrieve relevant entries</b> into context when precision-dependent questions are detected.","vi":"Duy trì một <b class=\"kw\">cơ sở dữ liệu có cấu trúc</b> chứa các dữ kiện chính được trích xuất từ mỗi bài báo (cỡ mẫu, số liệu thống kê, phương pháp) và <b class=\"kw\">truy xuất các mục liên quan</b> vào context khi phát hiện câu hỏi đòi hỏi độ chính xác."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Nguyên nhân gốc là <b>tóm tắt tiệm tiến làm mất giá trị số</b> (cỡ mẫu, p-value, tiêu chí chọn). Giải pháp kiến trúc là <b>trích xuất các sự kiện then chốt thành dữ liệu có cấu trúc</b> lưu ngoài lịch sử được tóm tắt, rồi truy xuất đúng mục vào context khi phát hiện câu hỏi cần độ chính xác. Cách này giữ chính xác số liệu, tiết kiệm token và không phụ thuộc vào chất lượng tóm tắt — tương tự mẫu “case facts” tách khỏi lịch sử hội thoại.","elim":["<b>A.</b> Giữ vĩnh viễn toàn bộ phần phương pháp và kết quả của mọi bài báo sẽ làm context phình to theo số bài, sớm chạm giới hạn và gây hiệu ứng lost-in-the-middle.","<b>B.</b> Tóm tắt “độ trung thực cao hơn” vẫn là tóm tắt, vẫn có nguy cơ làm mất hoặc làm méo chi tiết số, và vẫn tiêu tốn context khi số bài tăng.","<b>C.</b> Re-inject cả đoạn văn bản thô tốn nhiều token và phải dò tìm số liệu trong văn bản dài; lưu sự kiện dạng cấu trúc gọn và chính xác hơn cho đúng loại câu hỏi này."]},"cite":"Hướng dẫn ôn tập — §11.1 Trích xuất các Sự kiện ra một Block Riêng; Lĩnh vực 5.1"},{"id":"t1q87","n":87,"topic":1,"type":"mcq","stem":{"en":"A security audit requires updating your authentication library from v2 to v3. The migration guide documents <b class=\"kw\">breaking changes</b>: authenticate() now returns a Promise instead of accepting a callback, the User type has restructured fields, and three deprecated methods were removed. Grep shows the library is imported in <b class=\"kw\">45 files across several modules</b>. What&#x27;s the most effective approach?","vi":"Một đợt kiểm tra bảo mật yêu cầu nâng cấp thư viện xác thực của bạn từ v2 lên v3. Hướng dẫn migration ghi nhận các <b class=\"kw\">thay đổi phá vỡ tương thích (breaking changes)</b>: authenticate() giờ trả về một Promise thay vì nhận một callback, kiểu User có các trường được tái cấu trúc, và ba phương thức đã lỗi thời (deprecated) bị xóa. Grep cho thấy thư viện được import trong <b class=\"kw\">45 file trên nhiều module</b>. Cách tiếp cận nào hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"Create a <b class=\"kw\">custom slash command</b> encapsulating the migration transformations, then execute it against each file <b class=\"kw\">without prior codebase exploration</b>.","vi":"Tạo một <b class=\"kw\">slash command tùy chỉnh</b> đóng gói các phép biến đổi migration, sau đó chạy nó trên từng file mà <b class=\"kw\">không khám phá codebase trước</b>."}},{"k":"B","t":{"en":"Update the dependency version, <b class=\"kw\">run the test suite</b>, and use Claude Code to <b class=\"kw\">fix each failure</b> as it appears.","vi":"Cập nhật phiên bản dependency, <b class=\"kw\">chạy bộ test</b>, và dùng Claude Code để <b class=\"kw\">sửa từng lỗi</b> khi nó xuất hiện."}},{"k":"C","t":{"en":"<b class=\"kw\">Enter plan mode</b> to explore library usage across modules, map affected code paths, then create a <b class=\"kw\">migration strategy</b> before implementing.","vi":"<b class=\"kw\">Vào plan mode</b> để khám phá cách thư viện được sử dụng trên các module, lập bản đồ các luồng code bị ảnh hưởng, rồi xây dựng <b class=\"kw\">chiến lược migration</b> trước khi triển khai."}},{"k":"D","t":{"en":"Paste the <b class=\"kw\">migration guide&#x27;s breaking changes</b> into your prompt and use <b class=\"kw\">direct execution</b> to update all usages across the 45 files.","vi":"Dán các <b class=\"kw\">breaking changes từ hướng dẫn migration</b> vào prompt và dùng <b class=\"kw\">thực thi trực tiếp (direct execution)</b> để cập nhật tất cả các chỗ sử dụng trên 45 file."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Đây là thay đổi lớn: breaking change về API (callback → Promise), cấu trúc kiểu <code>User</code> thay đổi, phương thức bị xóa, chạm tới <b>45 file ở nhiều module</b>. Theo hướng dẫn, các migration quy mô như vậy cần <b>planning mode</b> để khám phá an toàn cách thư viện được dùng, lập bản đồ các luồng code bị ảnh hưởng và xây chiến lược migration trước khi sửa — tránh sửa dở dang hoặc không nhất quán giữa các module.","elim":["<b>A.</b> Áp một slash command biến đổi máy móc “không khám phá trước” bỏ qua khác biệt trong cách mỗi module dùng thư viện (ví dụ cách xử lý callback, trường <code>User</code>), dễ gây lỗi hàng loạt.","<b>B.</b> Sửa theo từng test thất bại là phản ứng thụ động, phụ thuộc độ phủ test; các luồng không có test sẽ lọt lỗi và không có chiến lược nhất quán cho 45 file.","<b>D.</b> Thực thi trực tiếp trên 45 file mà không hiểu các mẫu sử dụng là đúng loại tác vụ planning mode được thiết kế để tránh; dán migration guide không thay thế việc khảo sát codebase."]},"cite":"Hướng dẫn ôn tập — §5.6 Planning Mode so với Thực thi trực tiếp; Lĩnh vực 3.4"},{"id":"t1q88","n":88,"topic":1,"type":"mcq","stem":{"en":"You&#x27;ve asked Claude Code to build a PDF report generation feature. The initial implementation queries the database correctly, but the output has formatting issues: table columns are too narrow causing content truncation, dates display without proper formatting, and page break handling is incorrect. You&#x27;ve noticed <b class=\"kw\">these issues interact</b>— <b class=\"kw\">changing column widths affects how dates render</b>, and <b class=\"kw\">page breaks depend on content height</b>. What&#x27;s the most effective approach for iterating toward a working solution?","vi":"Bạn đã yêu cầu Claude Code xây dựng tính năng tạo báo cáo PDF. Bản triển khai ban đầu truy vấn cơ sở dữ liệu đúng, nhưng đầu ra có vấn đề về định dạng: các cột của bảng quá hẹp khiến nội dung bị cắt, ngày tháng hiển thị không được định dạng đúng, và việc xử lý ngắt trang không chính xác. Bạn nhận thấy <b class=\"kw\">các vấn đề này tương tác với nhau</b> — <b class=\"kw\">thay đổi độ rộng cột ảnh hưởng đến cách ngày tháng hiển thị</b>, và <b class=\"kw\">ngắt trang phụ thuộc vào chiều cao nội dung</b>. Cách tiếp cận nào hiệu quả nhất để lặp dần tới một giải pháp hoạt động được?"},"options":[{"k":"A","t":{"en":"Address the <b class=\"kw\">column width issue first</b> with specific measurements, verify it works, then fix date formatting within the corrected columns, then adjust page breaks— <b class=\"kw\">testing after each change</b>.","vi":"Xử lý vấn đề <b class=\"kw\">độ rộng cột trước</b> với các số đo cụ thể, xác minh nó hoạt động, sau đó sửa định dạng ngày trong các cột đã được chỉnh, rồi điều chỉnh ngắt trang — <b class=\"kw\">kiểm thử sau mỗi thay đổi</b>."}},{"k":"B","t":{"en":"Show Claude an example of a <b class=\"kw\">correctly formatted report</b> and ask it to <b class=\"kw\">match that output</b>, rather than listing the specific technical issues.","vi":"Cho Claude xem một ví dụ <b class=\"kw\">báo cáo được định dạng đúng</b> và yêu cầu nó tạo đầu ra <b class=\"kw\">khớp với ví dụ đó</b>, thay vì liệt kê các vấn đề kỹ thuật cụ thể."}},{"k":"C","t":{"en":"<b class=\"kw\">Start fresh</b> with a detailed prompt specifying <b class=\"kw\">all formatting requirements upfront</b>.","vi":"<b class=\"kw\">Bắt đầu lại từ đầu</b> với một prompt chi tiết nêu rõ <b class=\"kw\">tất cả các yêu cầu định dạng</b> ngay từ đầu."}},{"k":"D","t":{"en":"Provide all three issues in a <b class=\"kw\">single detailed message</b> with exact specifications for each, allowing Claude to address them <b class=\"kw\">together in one update</b>.","vi":"Đưa cả ba vấn đề vào <b class=\"kw\">một tin nhắn chi tiết duy nhất</b> với thông số chính xác cho từng vấn đề, để Claude xử lý chúng <b class=\"kw\">cùng lúc trong một lần cập nhật</b>."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Ba vấn đề <b>phụ thuộc lẫn nhau theo chuỗi</b>: độ rộng cột ảnh hưởng cách ngày hiển thị, và ngắt trang phụ thuộc chiều cao nội dung. Vì vậy nên <b>sửa tuần tự theo thứ tự phụ thuộc</b> — cột trước (với số đo cụ thể), kiểm tra, rồi định dạng ngày trong cột đã đúng, rồi ngắt trang — và <b>test sau mỗi bước</b>. Cách lặp tiệm tiến này giúp cô lập nguyên nhân khi có lỗi và mỗi bước xây trên nền đã được xác minh.","elim":["<b>B.</b> Đưa một báo cáo mẫu mà không nêu vấn đề kỹ thuật cụ thể khiến Claude phải tự đoán chênh lệch nằm ở đâu, không xử lý rõ chuỗi phụ thuộc giữa cột, ngày và ngắt trang.","<b>C.</b> Bắt đầu lại từ đầu vứt bỏ phần truy vấn dữ liệu đã đúng và vẫn phải đối mặt với cùng các tương tác định dạng.","<b>D.</b> Sửa cả ba cùng lúc khiến khi kết quả sai thì khó biết thay đổi nào gây ra, vì chúng tác động lẫn nhau; không có điểm kiểm tra giữa các bước."]},"cite":"Hướng dẫn ôn tập — Lĩnh vực 3.5 Tinh chỉnh Lặp lại để Cải thiện Tiệm tiến"},{"id":"t1q89","n":89,"topic":1,"type":"mcq","stem":{"en":"You&#x27;re implementing a new payment processing module that must follow your project&#x27;s established patterns for database transactions, error handling, and audit logging. You&#x27;ve <b class=\"kw\">identified three existing modules</b> that exemplify these patterns: db_utils.py, error_handlers.py, and audit_logger.py. This is a <b class=\"kw\">one-off integration task</b>—these patterns are well-documented in your team wiki and <b class=\"kw\">don&#x27;t need additional project-level documentation</b>. What&#x27;s the most effective approach?","vi":"Bạn đang triển khai một module xử lý thanh toán mới, module này phải tuân theo các pattern đã được thiết lập của dự án cho giao dịch cơ sở dữ liệu, xử lý lỗi và ghi log kiểm toán (audit logging). Bạn đã <b class=\"kw\">xác định ba module hiện có</b> minh họa các pattern này: db_utils.py, error_handlers.py và audit_logger.py. Đây là một <b class=\"kw\">tác vụ tích hợp chỉ làm một lần</b> — các pattern này đã được tài liệu hóa đầy đủ trong wiki của nhóm và <b class=\"kw\">không cần thêm tài liệu ở cấp dự án</b>. Cách tiếp cận nào hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"Ask Claude to <b class=\"kw\">explore your codebase</b> to <b class=\"kw\">find and understand</b> the transaction, error handling, and logging patterns before generating the new module.","vi":"Yêu cầu Claude <b class=\"kw\">khám phá codebase</b> để <b class=\"kw\">tìm và hiểu</b> các pattern về giao dịch, xử lý lỗi và ghi log trước khi tạo module mới."}},{"k":"B","t":{"en":"Use <b class=\"kw\">@references</b> to include the three modules directly in your prompt, giving Claude <b class=\"kw\">concrete code examples</b> of the patterns to follow.","vi":"Dùng <b class=\"kw\">@references</b> để đưa trực tiếp ba module vào prompt, cung cấp cho Claude các <b class=\"kw\">ví dụ code cụ thể</b> về những pattern cần tuân theo."}},{"k":"C","t":{"en":"Add documentation of each pattern to your <b class=\"kw\">CLAUDE.md file</b>, establishing them as <b class=\"kw\">project conventions</b> that Claude will apply automatically.","vi":"Thêm tài liệu về từng pattern vào <b class=\"kw\">file CLAUDE.md</b>, thiết lập chúng thành <b class=\"kw\">quy ước dự án</b> mà Claude sẽ tự động áp dụng."}},{"k":"D","t":{"en":"<b class=\"kw\">Describe the patterns</b> from the three modules in <b class=\"kw\">natural language</b> in your prompt, explaining the transaction handling approach, error format, and logging conventions Claude should follow.","vi":"<b class=\"kw\">Mô tả các pattern</b> từ ba module bằng <b class=\"kw\">ngôn ngữ tự nhiên</b> trong prompt, giải thích cách xử lý giao dịch, định dạng lỗi và các quy ước ghi log mà Claude cần tuân theo."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Đã biết chính xác ba module mẫu và đây là <b>tác vụ một lần</b>. Dùng <b>tham chiếu <code>@file</code></b> đưa thẳng <code>db_utils.py</code>, <code>error_handlers.py</code>, <code>audit_logger.py</code> vào prompt cho Claude <b>ví dụ code cụ thể</b> — cách truyền đạt kỳ vọng hiệu quả nhất, không mất công tìm kiếm và không làm nhiễu cấu hình dự án lâu dài.","elim":["<b>A.</b> Bắt Claude tự khám phá codebase lãng phí context và thời gian khi ta đã biết chính xác ba file mẫu, lại có rủi ro tìm nhầm mẫu khác.","<b>C.</b> Đề bài nói rõ đây là việc một lần và các mẫu đã có tài liệu; thêm vào CLAUDE.md sẽ nạp chúng vào mọi session sau, gây tốn context không cần thiết.","<b>D.</b> Mô tả bằng ngôn ngữ tự nhiên kém chính xác hơn code thật; dễ bỏ sót chi tiết như định dạng lỗi hay chữ ký hàm mà ví dụ cụ thể thể hiện ngay."]},"cite":"Hướng dẫn ôn tập — §5.2 Cú pháp @path (Import tệp); Lĩnh vực 3.5"},{"id":"t1q90","n":90,"topic":1,"type":"mcq","stem":{"en":"Your monorepo contains shared coding standards in /docs/standards/security-rules.md (for services handling user data), testing-patterns.md (for all packages), and api-conventions.md (for API-facing services). Your 15 packages are organized by feature domain (/packages/auth/, /packages/billing/, /packages/notifications/, etc.) <b class=\"kw\">without naming conventions</b> indicating which handle user data or expose APIs. Package maintainers are expected to configure their own local development settings, as <b class=\"kw\">they understand their package&#x27;s domain requirements</b>. Currently, all package CLAUDE.md files <b class=\"kw\">duplicate all three standards</b>, <b class=\"kw\">applying irrelevant guidance</b>. What&#x27;s the most effective approach?","vi":"Monorepo của bạn chứa các tiêu chuẩn lập trình dùng chung trong /docs/standards/security-rules.md (cho các service xử lý dữ liệu người dùng), testing-patterns.md (cho tất cả các package), và api-conventions.md (cho các service cung cấp API ra bên ngoài). 15 package của bạn được tổ chức theo miền tính năng (/packages/auth/, /packages/billing/, /packages/notifications/, v.v.) mà <b class=\"kw\">không có quy ước đặt tên</b> nào cho biết package nào xử lý dữ liệu người dùng hay cung cấp API. Người bảo trì package được kỳ vọng tự cấu hình các thiết lập phát triển cục bộ của mình, vì <b class=\"kw\">họ hiểu các yêu cầu theo miền của package mình</b>. Hiện tại, tất cả các file CLAUDE.md của các package đều <b class=\"kw\">sao chép cả ba tiêu chuẩn</b>, <b class=\"kw\">áp dụng cả những hướng dẫn không liên quan</b>. Cách tiếp cận nào hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"Use <b class=\"kw\">@imports in each package&#x27;s CLAUDE.md</b> to reference only the specific standard files relevant to that package, based on the <b class=\"kw\">maintainer&#x27;s domain knowledge</b>.","vi":"Dùng <b class=\"kw\">@imports trong CLAUDE.md của mỗi package</b> để chỉ tham chiếu những file tiêu chuẩn cụ thể liên quan đến package đó, dựa trên <b class=\"kw\">hiểu biết về miền của người bảo trì</b>."}},{"k":"B","t":{"en":"Create <b class=\"kw\">claude/rules/ files</b> for each standard with <b class=\"kw\">YAML frontmatter paths</b> listing every package directory where that standard should apply.","vi":"Tạo các <b class=\"kw\">file claude/rules/</b> cho từng tiêu chuẩn với <b class=\"kw\">YAML frontmatter paths</b> liệt kê mọi thư mục package nơi tiêu chuẩn đó cần được áp dụng."}},{"k":"C","t":{"en":"Create a <b class=\"kw\">shared-standards.nd</b> that uses @imports to combine all three standards, then have each package&#x27;s CLAUDE.md <b class=\"kw\">import that combined file</b>.","vi":"Tạo một file <b class=\"kw\">shared-standards.nd</b> dùng @imports để kết hợp cả ba tiêu chuẩn, sau đó cho CLAUDE.md của mỗi package <b class=\"kw\">import file kết hợp đó</b>."}},{"k":"D","t":{"en":"Put all standards in the <b class=\"kw\">root CLAUDE.md</b> with <b class=\"kw\">override instructions</b> like &quot;ignore security-rules.md when working in packages that don&#x27;t handle user data.&quot;","vi":"Đặt tất cả tiêu chuẩn vào <b class=\"kw\">CLAUDE.md gốc</b> kèm các <b class=\"kw\">chỉ dẫn ghi đè</b> như &quot;bỏ qua security-rules.md khi làm việc trong các package không xử lý dữ liệu người dùng.&quot;"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Các package được tổ chức theo domain, <b>không có quy ước đặt tên</b> cho biết package nào xử lý dữ liệu người dùng hay mở API, và chính <b>maintainer</b> mới hiểu yêu cầu domain của package mình. Vì vậy dùng <b><code>@import</code> trong CLAUDE.md của từng package</b> để chỉ đưa vào các file tiêu chuẩn liên quan là cách đúng: tiêu chuẩn được lưu một nơi (không trùng lặp), mỗi package chỉ nạp phần phù hợp, và quyền quyết định thuộc về người hiểu domain.","elim":["<b>B.</b> <code>.claude/rules/</code> với <code>paths</code> phát huy khi có mẫu glob chung; ở đây phải liệt kê thủ công từng thư mục package ở cấp trung tâm, tách khỏi maintainer và dễ lỗi thời khi thêm package.","<b>C.</b> File gộp cả ba tiêu chuẩn rồi import vào mọi package lại tái tạo đúng vấn đề hiện tại — mỗi package vẫn nhận cả hướng dẫn không liên quan.","<b>D.</b> Dồn tất cả vào CLAUDE.md gốc kèm lệnh “bỏ qua” vẫn nạp mọi tiêu chuẩn vào context và dựa vào việc mô hình tự đoán package nào xử lý dữ liệu người dùng — điều không thể suy ra từ tên."]},"cite":"Hướng dẫn ôn tập — §5.2 Cú pháp @path (Import tệp); Lĩnh vực 3.1"},{"id":"t1q91","n":91,"topic":1,"type":"mcq","stem":{"en":"The system needs to extract candidate information (name, contact details, skills, work experience, education) from uploaded resumes. The extracted data must <b class=\"kw\">strictly conform to a predefined JSON schema</b>, as <b class=\"kw\">missing required fields or incorrect data types</b> will cause downstream validation failures. What is the most reliable approach to ensure Claude&#x27;s output <b class=\"kw\">consistently matches the schema</b>?","vi":"Hệ thống cần trích xuất thông tin ứng viên (tên, thông tin liên hệ, kỹ năng, kinh nghiệm làm việc, học vấn) từ các CV được tải lên. Dữ liệu trích xuất phải <b class=\"kw\">tuân thủ nghiêm ngặt một JSON schema định sẵn</b>, vì việc <b class=\"kw\">thiếu các trường bắt buộc hoặc sai kiểu dữ liệu</b> sẽ gây lỗi kiểm tra hợp lệ (validation) ở các bước phía sau (downstream). Cách tiếp cận nào đáng tin cậy nhất để đảm bảo đầu ra của Claude <b class=\"kw\">luôn khớp với schema</b>?"},"options":[{"k":"A","t":{"en":"Define a <b class=\"kw\">tool with an input schema</b> matching your required JSON structure and extract the data from Claude&#x27;s <b class=\"kw\">tool_use response</b>.","vi":"Định nghĩa một <b class=\"kw\">tool có input schema</b> khớp với cấu trúc JSON bạn yêu cầu và trích xuất dữ liệu từ <b class=\"kw\">phản hồi tool_use</b> của Claude."}},{"k":"B","t":{"en":"Make <b class=\"kw\">two separate API calls</b>—first extracting information as text, then asking Claude to <b class=\"kw\">format that text as JSON</b>.","vi":"Thực hiện <b class=\"kw\">hai lệnh gọi API riêng biệt</b> — lần đầu trích xuất thông tin dưới dạng văn bản, sau đó yêu cầu Claude <b class=\"kw\">định dạng văn bản đó thành JSON</b>."}},{"k":"C","t":{"en":"Include detailed <b class=\"kw\">JSON formatting instructions</b> and a <b class=\"kw\">template example</b> in the system prompt, asking Claude to output only valid JSON.","vi":"Đưa các <b class=\"kw\">chỉ dẫn định dạng JSON</b> chi tiết và một <b class=\"kw\">ví dụ mẫu</b> vào system prompt, yêu cầu Claude chỉ xuất ra JSON hợp lệ."}},{"k":"D","t":{"en":"Parse Claude&#x27;s text response with <b class=\"kw\">regex patterns</b> to extract JSON objects, using <b class=\"kw\">retry logic</b> for malformed responses.","vi":"Phân tích phản hồi văn bản của Claude bằng các <b class=\"kw\">mẫu regex</b> để trích xuất các đối tượng JSON, dùng <b class=\"kw\">logic retry</b> cho các phản hồi bị sai định dạng."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> <b><code>tool_use</code> với JSON Schema</b> là cách đáng tin cậy nhất để đảm bảo đầu ra tuân thủ schema: định nghĩa một tool có <code>input_schema</code> khớp cấu trúc cần thiết (trường bắt buộc, kiểu dữ liệu), rồi lấy dữ liệu từ khối <code>tool_use</code> trong phản hồi. Cách này loại bỏ lỗi cú pháp JSON và thiếu trường bắt buộc — đúng thứ gây lỗi validation phía sau. (Có thể kết hợp ép <code>tool_choice</code> để chắc chắn tool được gọi.)","elim":["<b>B.</b> Hai lời gọi API tăng chi phí, độ trễ, và bước định dạng JSON bằng văn bản vẫn không có cơ chế ràng buộc schema.","<b>C.</b> Hướng dẫn định dạng và template trong system prompt chỉ là gợi ý; mô hình vẫn có thể sinh JSON sai cú pháp hoặc thiếu trường.","<b>D.</b> Regex kèm retry là cách vá phía sau, mong manh với JSON lồng nhau và không đảm bảo đúng schema; xử lý triệu chứng thay vì ngăn lỗi từ đầu."]},"cite":"Hướng dẫn ôn tập — §2.4 JSON Schema cho Structured Output; Lĩnh vực 4.3"},{"id":"t1q92","n":92,"topic":1,"type":"mcq","stem":{"en":"Anthropic&#x27;s tool use documentation states: &quot;Write instructive error messages. Instead of generic errors like &#x27;failed&#x27;, include what went wrong and <b class=\"kw\">what Claude should try next</b>.&quot; A billing dispute agent uses lookup_order, which catches all exceptions and returns a tool_result with is_error: true and the message &quot;<b class=\"kw\">execution failed</b>&quot;. Monitoring shows two failure modes: the agent <b class=\"kw\">retries the identical call</b> until hitting the turn limit, or it immediately calls escalate_to_human without trying alternative tools. Which change follows the documented recommendation and gives Claude the information it needs to select the correct recovery action <b class=\"kw\">for each error type</b>?","vi":"Tài liệu về tool use của Anthropic nêu: &quot;Hãy viết thông báo lỗi mang tính hướng dẫn. Thay vì các lỗi chung chung như &#x27;failed&#x27;, hãy nêu rõ điều gì đã sai và <b class=\"kw\">Claude nên thử gì tiếp theo</b>.&quot; Một agent xử lý tranh chấp hóa đơn sử dụng lookup_order, tool này bắt mọi exception và trả về một tool_result với is_error: true cùng thông báo &quot;<b class=\"kw\">execution failed</b>&quot;. Giám sát cho thấy hai kiểu thất bại: agent <b class=\"kw\">retry cùng một lệnh gọi y hệt</b> cho đến khi chạm giới hạn số lượt, hoặc nó gọi ngay escalate_to_human mà không thử các tool thay thế. Thay đổi nào tuân theo khuyến nghị trong tài liệu và cung cấp cho Claude thông tin cần thiết để chọn đúng hành động khôi phục <b class=\"kw\">cho từng loại lỗi</b>?"},"options":[{"k":"A","t":{"en":"Return <b class=\"kw\">error-type-specific messages</b> with <b class=\"kw\">is_error: true</b>, e.g., &quot;order not found-try get_customer to search by phone&quot; for data errors and &quot;Database timeout (transient)-retry should succeed&quot; for infrastructure errors.","vi":"Trả về <b class=\"kw\">thông báo cụ thể theo từng loại lỗi</b> với <b class=\"kw\">is_error: true</b>, ví dụ: &quot;order not found-try get_customer to search by phone&quot; cho lỗi dữ liệu và &quot;Database timeout (transient)-retry should succeed&quot; cho lỗi hạ tầng."}},{"k":"B","t":{"en":"Implement <b class=\"kw\">retry logic with exponential backoff</b> <b class=\"kw\">inside each tool implementation</b> so transient errors are resolved transparently within the tool before any failure result is surfaced to Claude in the agentic loop.","vi":"Triển khai <b class=\"kw\">logic retry với exponential backoff</b> <b class=\"kw\">bên trong phần triển khai của mỗi tool</b> để các lỗi tạm thời được giải quyết một cách trong suốt ngay trong tool, trước khi bất kỳ kết quả thất bại nào được đưa lên Claude trong agentic loop."}},{"k":"C","t":{"en":"<b class=\"kw\">Remove is_error: true</b> and return the error details as <b class=\"kw\">normal tool content</b>, so Claude reasons about the response as data rather than treating it as a flagged failure condition that biases retry behavior.","vi":"<b class=\"kw\">Bỏ is_error: true</b> và trả về chi tiết lỗi như <b class=\"kw\">nội dung tool thông thường</b>, để Claude suy luận về phản hồi như dữ liệu thay vì coi đó là một tình trạng thất bại được gắn cờ, vốn làm thiên lệch hành vi retry."}},{"k":"D","t":{"en":"Add an <b class=\"kw\">error classification step</b> in the agentic loop that <b class=\"kw\">intercepts tool errors</b> before Claude sees them, tags each as &quot;retry&quot; &quot;try_alternative,&quot; or &quot;escalate,&quot; and adds that recommendation to the tool result.","vi":"Thêm một <b class=\"kw\">bước phân loại lỗi</b> trong agentic loop để <b class=\"kw\">chặn các lỗi của tool</b> trước khi Claude nhìn thấy, gắn nhãn mỗi lỗi là &quot;retry&quot; &quot;try_alternative,&quot; hoặc &quot;escalate,&quot; và thêm khuyến nghị đó vào kết quả tool."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Thông báo chung chung “execution failed” khiến Claude không phân biệt được lỗi tạm thời với lỗi dữ liệu, dẫn tới hai hành vi sai: retry vô ích hoặc escalate sớm. Làm đúng khuyến nghị của tài liệu là trả về <b>thông báo riêng theo loại lỗi</b>, vẫn giữ <code>is_error: true</code>, nêu <b>điều gì đã sai và nên thử gì tiếp</b> — ví dụ “order not found – thử <code>get_customer</code> theo số điện thoại” cho lỗi dữ liệu và “Database timeout (transient) – retry nên thành công” cho lỗi hạ tầng. Claude nhờ đó chọn đúng hành động phục hồi.","elim":["<b>B.</b> Retry có backoff bên trong tool chỉ xử lý lỗi tạm thời; lỗi “order not found” vẫn trả về thông báo chung chung nên Claude vẫn không biết thử tool thay thế.","<b>C.</b> Bỏ <code>is_error: true</code> làm mất tín hiệu thất bại; Claude có thể coi thông báo lỗi là dữ liệu hợp lệ, và việc này không theo khuyến nghị viết thông báo lỗi có tính hướng dẫn.","<b>D.</b> Thêm lớp phân loại chặn giữa vòng lặp là phức tạp hóa không cần thiết; thông tin phân loại thuộc về chính tool — nơi biết rõ lỗi xảy ra vì sao — đúng như tài liệu khuyến nghị."]},"cite":"Hướng dẫn ôn tập — §4.4 Cờ isError trong MCP; Lĩnh vực 2.2"},{"id":"t1q93","n":93,"topic":1,"type":"mcq","stem":{"en":"Production logs reveal inconsistent error handling: when tool_code fails, the agent sometimes retries 5 times (<b class=\"kw\">even if the tool_id doesn&#x27;t exist</b>), sometimes escalates immediately (premature for <b class=\"kw\">temporary network issues</b>), and sometimes adds user-friendly explanation (inappropriate when the issue is a <b class=\"kw\">backend permission error</b>). Investigation shows four MCP tool returns <b class=\"kw\">uniform error responses</b>: {&quot;status&quot;: &quot;error&quot;, &quot;content&quot;: &quot;{&quot;type&quot;: &quot;Error&quot;, &quot;message&quot;: &quot;Operation failed.&quot;}&quot;}. The agent learns different types. What&#x27;s the most effective improvement?","vi":"Log production cho thấy việc xử lý lỗi không nhất quán: khi tool_code thất bại, agent đôi khi retry 5 lần (<b class=\"kw\">ngay cả khi tool_id không tồn tại</b>), đôi khi escalate ngay lập tức (quá sớm đối với các <b class=\"kw\">sự cố mạng tạm thời</b>), và đôi khi thêm lời giải thích thân thiện với người dùng (không phù hợp khi vấn đề là <b class=\"kw\">lỗi phân quyền ở backend</b>). Điều tra cho thấy bốn MCP tool trả về <b class=\"kw\">phản hồi lỗi đồng nhất</b>: {&quot;status&quot;: &quot;error&quot;, &quot;content&quot;: &quot;{&quot;type&quot;: &quot;Error&quot;, &quot;message&quot;: &quot;Operation failed.&quot;}&quot;}. Agent học các loại khác nhau. Cải tiến nào hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"Add a <b class=\"kw\">few-shot examples</b> to the system prompt demonstrating how to <b class=\"kw\">interpret error message patterns</b> and select appropriate responses for each.","vi":"Thêm các <b class=\"kw\">ví dụ few-shot</b> vào system prompt minh họa cách <b class=\"kw\">diễn giải các mẫu thông báo lỗi</b> và chọn phản hồi phù hợp cho từng loại."}},{"k":"B","t":{"en":"Enhance error responses with <b class=\"kw\">structured metadata</b>. Include <b class=\"kw\">error_category (transient/retriable/permission)</b>, reason, and a description of what caused the failure.","vi":"Bổ sung <b class=\"kw\">metadata có cấu trúc</b> cho các phản hồi lỗi. Bao gồm <b class=\"kw\">error_category (transient/retriable/permission)</b>, reason, và mô tả nguyên nhân gây ra lỗi."}},{"k":"C","t":{"en":"Implement <b class=\"kw\">retry logic with exponential backoff</b> in your MCP server <b class=\"kw\">for all errors</b>, returning to the agent only after retries are exhausted.","vi":"Triển khai <b class=\"kw\">logic retry với exponential backoff</b> trong MCP server <b class=\"kw\">cho mọi lỗi</b>, chỉ trả về cho agent sau khi đã hết số lần retry."}},{"k":"D","t":{"en":"Create an <b class=\"kw\">analyze_error MCP tool</b> the agent calls <b class=\"kw\">after any failure</b> to determine the error category and recommended action.","vi":"Tạo một <b class=\"kw\">MCP tool analyze_error</b> mà agent gọi <b class=\"kw\">sau bất kỳ lỗi nào</b> để xác định loại lỗi và hành động được khuyến nghị."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Mọi tool MCP đều trả về cùng một lỗi “Operation failed.”, nên agent không có thông tin để chọn cách xử lý — dẫn tới retry lỗi không tồn tại, escalate sớm lỗi mạng tạm thời, giải thích sai lỗi quyền. Giải pháp gốc là <b>bổ sung metadata lỗi có cấu trúc</b>: <code>error_category</code> (transient/retriable/permission), lý do và mô tả nguyên nhân. Đây đúng là mẫu “phản hồi lỗi có cấu trúc” với <code>errorCategory</code>/<code>isRetryable</code> cho tool MCP.","elim":["<b>A.</b> Few-shot dạy cách diễn giải mẫu thông báo lỗi là vô ích khi mọi lỗi đều giống hệt nhau — không có mẫu nào để phân biệt.","<b>C.</b> Retry mọi lỗi bất kể loại sẽ retry cả lỗi quyền và tool_id không tồn tại (không bao giờ thành công), lãng phí thời gian và vẫn trả về lỗi chung chung sau cùng.","<b>D.</b> Tool <code>analyze_error</code> cũng chỉ nhận được cùng chuỗi “Operation failed.” nên không thể suy ra loại lỗi; còn tốn thêm một lượt gọi mỗi lần thất bại."]},"cite":"Hướng dẫn ôn tập — §4.4 Cờ isError trong MCP; Lĩnh vực 2.2"},{"id":"t1q94","n":94,"topic":1,"type":"mcq","stem":{"en":"Your code review prompts include both implementation changes and the corresponding test file, but the LLM&#x27;s review comments fail to point out untested code paths. Analysis reveals the model <b class=\"kw\">correctly flags functions</b> that have no tests at all, but fails to identify when conditional branches or error-handling paths within tested functions that have no tests at all, but fails to identify when conditional branches or error-handling paths within tested functio lack coverage. What&#x27;s the most effective way to improve detection of <b class=\"kw\">branch-level coverage gaps</b> <b class=\"kw\">without overcomplicating the pipeline</b>?","vi":"Các prompt review code của bạn bao gồm cả các thay đổi triển khai lẫn file test tương ứng, nhưng các nhận xét review của LLM không chỉ ra được các luồng code chưa được test. Phân tích cho thấy mô hình <b class=\"kw\">gắn cờ đúng các hàm</b> hoàn toàn không có test nào, nhưng không xác định được khi các nhánh điều kiện hoặc các luồng xử lý lỗi bên trong các hàm đã được test mà hoàn toàn không có test nào, nhưng không xác định được khi các nhánh điều kiện hoặc các luồng xử lý lỗi bên trong các hàm đã được test thiếu độ bao phủ. Cách nào hiệu quả nhất để cải thiện việc phát hiện các <b class=\"kw\">lỗ hổng về độ bao phủ ở cấp nhánh</b> <b class=\"kw\">mà không làm pipeline trở nên quá phức tạp</b>?"},"options":[{"k":"A","t":{"en":"Implement a <b class=\"kw\">multi-pass pipeline</b> where <b class=\"kw\">separate LLM calls</b> first extract all conditional branches, then cross-reference each against test assertions in a second pass.","vi":"Triển khai một <b class=\"kw\">pipeline nhiều lượt</b>, trong đó các <b class=\"kw\">lệnh gọi LLM riêng biệt</b> trước tiên trích xuất tất cả các nhánh điều kiện, sau đó đối chiếu từng nhánh với các assertion của test ở lượt thứ hai."}},{"k":"B","t":{"en":"Add <b class=\"kw\">explicit instructions</b> directing the model to <b class=\"kw\">enumerate each conditional branch</b> and exception path, then verify each has a corresponding test assertion.","vi":"Thêm <b class=\"kw\">chỉ dẫn rõ ràng</b> yêu cầu mô hình <b class=\"kw\">liệt kê từng nhánh điều kiện</b> và từng luồng exception, sau đó xác minh mỗi nhánh/luồng đều có assertion test tương ứng."}},{"k":"C","t":{"en":"<b class=\"kw\">Restructure the prompt</b> to <b class=\"kw\">interleave implementation and tests</b>, presenting each function followed immediately by its test cases","vi":"<b class=\"kw\">Tái cấu trúc prompt</b> để <b class=\"kw\">xen kẽ code triển khai và test</b>, trình bày mỗi hàm và ngay sau đó là các test case của nó"}},{"k":"D","t":{"en":"Include <b class=\"kw\">few-shot examples</b> showing code with an <b class=\"kw\">uncovered branch</b> paired with the review comment identifying the specific missing test case.","vi":"Đưa vào các <b class=\"kw\">ví dụ few-shot</b> cho thấy code có một <b class=\"kw\">nhánh chưa được bao phủ</b>, đi kèm với nhận xét review chỉ ra test case cụ thể còn thiếu."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Mô hình đã làm tốt ở mức hàm nhưng bỏ sót <b>khoảng trống phủ test ở mức nhánh</b> (nhánh điều kiện, đường xử lý lỗi). <b>Ví dụ few-shot</b> ghép đoạn code có nhánh chưa được test với comment review chỉ rõ test case còn thiếu giúp mô hình hiểu chính xác loại phát hiện mong muốn và mức chi tiết cần nêu. Guide nêu rõ few-shot có thể minh họa cách xử lý các tình huống như lỗ hổng độ phủ test, và đây là cách cải thiện mà không làm phức tạp pipeline.","elim":["<b>A.</b> Pipeline nhiều lượt với các lời gọi LLM riêng để trích xuất nhánh rồi đối chiếu là phức tạp hóa — trái với yêu cầu “không làm phức tạp pipeline”.","<b>B.</b> Chỉ dẫn bằng lời “liệt kê từng nhánh rồi kiểm tra” kém hiệu quả hơn ví dụ cụ thể trong việc truyền đạt thế nào là một khoảng trống phủ test và cách viết comment.","<b>C.</b> Xếp xen kẽ code và test chỉ thay đổi bố cục; mô hình vẫn không được chỉ cho thấy cần phân tích ở mức nhánh."]},"cite":"Hướng dẫn ôn tập — §6.1 Few-shot Prompting; Lĩnh vực 4.2"},{"id":"t1q95","n":95,"topic":1,"type":"mcq","stem":{"en":"Your pipeline uses a tool called extract_metadata with a JSON schema for paper details. You&#x27;ve also defined lookup_citations and verify_doi tools for enrichment. During testing, you notice that when users include requests like &quot;extract the metadata and tell me how cited it is,&quot; Claude <b class=\"kw\">sometimes calls lookup_citations first</b>, which fails because it <b class=\"kw\">needs the DOI that extract_metadata would provide</b>. What&#x27;s the most effective way to <b class=\"kw\">ensure structured metadata extraction happens first</b>?","vi":"Pipeline của bạn dùng một tool tên extract_metadata với JSON schema cho thông tin chi tiết của bài báo. Bạn cũng đã định nghĩa các tool lookup_citations và verify_doi để làm giàu dữ liệu (enrichment). Trong quá trình kiểm thử, bạn nhận thấy khi người dùng đưa ra các yêu cầu như &quot;trích xuất metadata và cho tôi biết nó được trích dẫn nhiều đến mức nào&quot;, Claude đôi khi <b class=\"kw\">gọi lookup_citations trước</b>, và lệnh gọi này thất bại vì nó <b class=\"kw\">cần DOI mà extract_metadata sẽ cung cấp</b>. Cách nào hiệu quả nhất để đảm bảo việc trích xuất <b class=\"kw\">metadata có cấu trúc diễn ra trước tiên</b>?"},"options":[{"k":"A","t":{"en":"Set tool_choice to <b class=\"kw\">{&quot;type&quot;: &quot;tool&quot;, &quot;name&quot;: &quot;extract_metadata&quot;}</b> and process the enrichment requests in <b class=\"kw\">subsequent turns</b> after receiving the extracted metadata.","vi":"Đặt tool_choice thành <b class=\"kw\">{&quot;type&quot;: &quot;tool&quot;, &quot;name&quot;: &quot;extract_metadata&quot;}</b> và xử lý các yêu cầu enrichment ở <b class=\"kw\">các lượt tiếp theo</b> sau khi nhận được metadata đã trích xuất."}},{"k":"B","t":{"en":"Set <b class=\"kw\">tool_choice to &quot;any&quot;</b> so Claude must use a tool, combined with <b class=\"kw\">system prompt instructions</b> prioritizing extract_metadata.","vi":"Đặt <b class=\"kw\">tool_choice thành &quot;any&quot;</b> để Claude bắt buộc phải dùng một tool, kết hợp với <b class=\"kw\">chỉ dẫn trong system prompt</b> ưu tiên extract_metadata."}},{"k":"C","t":{"en":"Set <b class=\"kw\">tool_choice to &quot;auto&quot;</b> and <b class=\"kw\">reorder the tool definitions</b> so extract_metadata appears first in the tools array, since Claude prioritizes earlier-listed tools.","vi":"Đặt <b class=\"kw\">tool_choice thành &quot;auto&quot;</b> và <b class=\"kw\">sắp xếp lại các định nghĩa tool</b> để extract_metadata xuất hiện đầu tiên trong mảng tools, vì Claude ưu tiên các tool được liệt kê trước."}},{"k":"D","t":{"en":"Set tool_choice to <b class=\"kw\">{&quot;type&quot;: &quot;tool&quot;, &quot;name&quot;: &quot;extract_metadata&quot;}</b> for <b class=\"kw\">every API call</b> in the pipeline, ensuring Claude always extracts metadata before any enrichment can occur.","vi":"Đặt tool_choice thành <b class=\"kw\">{&quot;type&quot;: &quot;tool&quot;, &quot;name&quot;: &quot;extract_metadata&quot;}</b> cho <b class=\"kw\">mọi lệnh gọi API</b> trong pipeline, đảm bảo Claude luôn trích xuất metadata trước khi bất kỳ bước enrichment nào có thể diễn ra."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Để <b>đảm bảo thứ tự thực thi</b>, ép một tool cụ thể bằng <code>tool_choice: {\"type\": \"tool\", \"name\": \"extract_metadata\"}</code> ở lượt đầu tiên, nên DOI chắc chắn được trích xuất trước. Sau khi có metadata, các lượt tiếp theo (với <code>tool_choice</code> bình thường) xử lý yêu cầu làm giàu dữ liệu như <code>lookup_citations</code>, <code>verify_doi</code> dùng DOI vừa có.","elim":["<b>B.</b> <code>\"any\"</code> chỉ bắt buộc gọi <i>một</i> tool nào đó, không bắt buộc tool nào; Claude vẫn có thể gọi <code>lookup_citations</code> trước, chỉ dẫn trong prompt không phải bảo đảm.","<b>C.</b> Thứ tự trong mảng tools không quyết định việc chọn tool; với <code>\"auto\"</code> Claude chọn theo mô tả và ngữ cảnh, nên vẫn có thể gọi sai thứ tự.","<b>D.</b> Ép <code>extract_metadata</code> ở <i>mọi</i> lời gọi sẽ khiến Claude không bao giờ gọi được <code>lookup_citations</code> hay <code>verify_doi</code>, chặn luôn bước làm giàu dữ liệu."]},"cite":"Hướng dẫn ôn tập — §2.3 Tham số tool_choice; Lĩnh vực 2.3"},{"id":"t1q96","n":96,"topic":1,"type":"mcq","stem":{"en":"Your pipeline reviews every PR using a single API call with a static prompt containing the diff and full text of each changed file — <b class=\"kw\">unchanged files are not included</b>. Reviews are posted asynchronously and <b class=\"kw\">don&#x27;t block PR creation</b>. Developers report that reviews consistently miss bugs involving <b class=\"kw\">cross-file interactions</b> — for example, a PR renames a function&#x27;s parameters but the review doesn&#x27;t flag <b class=\"kw\">callers in unchanged files</b> that still use the old argument order. Evaluation shows cross-file bugs account for 35% of production incidents from reviewed PRs. What is the most effective change to your review design?","vi":"Pipeline của bạn review mọi PR bằng một lệnh gọi API duy nhất với một prompt tĩnh chứa diff và toàn văn của từng file đã thay đổi — <b class=\"kw\">các file không thay đổi không được đưa vào</b>. Các bản review được đăng bất đồng bộ và <b class=\"kw\">không chặn việc tạo PR</b>. Các lập trình viên phản ánh rằng các bản review liên tục bỏ sót những bug liên quan đến <b class=\"kw\">tương tác giữa các file</b> — ví dụ, một PR đổi tên các tham số của một hàm nhưng bản review không gắn cờ các <b class=\"kw\">nơi gọi hàm (caller) trong các file không thay đổi</b> vẫn đang dùng thứ tự đối số cũ. Đánh giá cho thấy các bug liên file chiếm 35% sự cố production từ các PR đã được review. Thay đổi nào hiệu quả nhất đối với thiết kế review của bạn?"},"options":[{"k":"A","t":{"en":"Redesign the review as a <b class=\"kw\">turn-limited agentic task</b> where the model can <b class=\"kw\">read files and search the codebase</b> via tools, following references to verify cross-file findings.","vi":"Thiết kế lại việc review thành một <b class=\"kw\">tác vụ agentic có giới hạn số lượt</b>, trong đó mô hình có thể <b class=\"kw\">đọc file và tìm kiếm codebase</b> thông qua các tool, lần theo các tham chiếu để xác minh các phát hiện liên file."}},{"k":"B","t":{"en":"Run <b class=\"kw\">parallel review passes</b> per changed file with direct dependents included in each pass, then <b class=\"kw\">aggregate and deduplicate</b> findings using a final summarization call.","vi":"Chạy các <b class=\"kw\">lượt review song song</b> cho từng file đã thay đổi, với các file phụ thuộc trực tiếp được đưa vào mỗi lượt, sau đó <b class=\"kw\">tổng hợp và loại bỏ trùng lặp</b> các phát hiện bằng một lệnh gọi tóm tắt cuối cùng."}},{"k":"C","t":{"en":"Use <b class=\"kw\">static analysis</b> to build a dependency graph of changed code, then expand the prompt to include all files within <b class=\"kw\">two dependency hops</b> of any changed file.","vi":"Dùng <b class=\"kw\">phân tích tĩnh</b> để xây dựng đồ thị phụ thuộc của code đã thay đổi, sau đó mở rộng prompt để đưa vào tất cả các file nằm trong phạm vi <b class=\"kw\">hai bước phụ thuộc</b> tính từ bất kỳ file đã thay đổi nào."}},{"k":"D","t":{"en":"Add <b class=\"kw\">chain-of-thought instructions</b> asking the model to list all external references in the diff, then <b class=\"kw\">reason step-by-step</b> about how each change might affect callers in other files.","vi":"Thêm <b class=\"kw\">chỉ dẫn chain-of-thought</b> yêu cầu mô hình liệt kê tất cả các tham chiếu bên ngoài trong diff, sau đó <b class=\"kw\">suy luận từng bước</b> về việc mỗi thay đổi có thể ảnh hưởng thế nào đến các caller trong các file khác."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Lỗi xuyên file xảy ra vì <b>thiếu context</b>: các hàm gọi nằm trong file không thay đổi, mà prompt tĩnh chỉ chứa diff và file đã đổi. Thiết kế lại thành <b>tác vụ agentic có giới hạn số lượt</b>, cho mô hình dùng tool đọc file và tìm kiếm codebase (ví dụ Grep tên hàm bị đổi tham số) để <b>truy vết tham chiếu</b> và xác minh phát hiện — chỉ lấy đúng context cần thiết. Review không chặn PR nên thời gian chạy thêm của vòng lặp agent là chấp nhận được.","elim":["<b>B.</b> Chỉ đưa “phụ thuộc trực tiếp” được xác định trước vẫn là context tĩnh, có thể bỏ sót caller ở xa hơn; lượt tổng hợp cuối cũng không bù được thông tin chưa từng được đọc.","<b>C.</b> Nạp mọi file trong phạm vi hai bước phụ thuộc làm prompt phình to (gây loãng chú ý) mà vẫn có thể bỏ sót caller ở xa hơn hai bước.","<b>D.</b> Chain-of-thought không giúp mô hình biết caller nằm ở đâu và dùng thứ tự đối số thế nào khi nó không thể nhìn thấy các file đó."]},"cite":"Hướng dẫn ôn tập — §8.2 Phân rã thích ứng động (Dynamic Adaptive Decomposition); Lĩnh vực 4.6"},{"id":"t1q97","n":97,"topic":1,"type":"mcq","stem":{"en":"Your search Flights tool calls an external airline API that <b class=\"kw\">occasionally returns</b> a <b class=\"kw\">503 Service Unavailable</b> error. What is the most effective way to handle this error <b class=\"kw\">in your tool implementation</b>?","vi":"Tool search Flights của bạn gọi một API hãng hàng không bên ngoài, API này <b class=\"kw\">thỉnh thoảng trả về</b> lỗi <b class=\"kw\">503 Service Unavailable</b>. Cách nào hiệu quả nhất để xử lý lỗi này <b class=\"kw\">trong phần triển khai tool</b> của bạn?"},"options":[{"k":"A","t":{"en":"Return an <b class=\"kw\">empty flight list</b> <b class=\"kw\">as if the search succeeded</b> but found no matching flights.","vi":"Trả về một <b class=\"kw\">danh sách chuyến bay rỗng</b> <b class=\"kw\">như thể việc tìm kiếm đã thành công</b> nhưng không tìm thấy chuyến bay phù hợp."}},{"k":"B","t":{"en":"<b class=\"kw\">Log the error internally</b> and return an <b class=\"kw\">empty response</b>, letting the model continue without the flight data.","vi":"<b class=\"kw\">Ghi log lỗi ở nội bộ</b> và trả về một <b class=\"kw\">phản hồi rỗng</b>, để mô hình tiếp tục mà không có dữ liệu chuyến bay."}},{"k":"C","t":{"en":"Return an <b class=\"kw\">error message in the tool result</b> explaining the service is <b class=\"kw\">temporarily unavailable</b>.","vi":"Trả về một <b class=\"kw\">thông báo lỗi trong kết quả tool</b> giải thích rằng dịch vụ <b class=\"kw\">tạm thời không khả dụng</b>."}},{"k":"D","t":{"en":"<b class=\"kw\">Automatically retry</b> the request up to five times with <b class=\"kw\">exponential backoff</b> before returning results to the agent.","vi":"<b class=\"kw\">Tự động retry</b> request tối đa năm lần với <b class=\"kw\">exponential backoff</b> trước khi trả kết quả về cho agent."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> 503 Service Unavailable là <b>lỗi tạm thời</b> và thỉnh thoảng mới xảy ra, nên thường thành công khi thử lại. Nguyên tắc phân chia trách nhiệm là <b>phục hồi cục bộ</b> đối với lỗi tạm thời ngay trong phần cài đặt tool — <b>retry với exponential backoff</b> có giới hạn số lần — và chỉ báo lỗi lên agent khi đã thử hết. Agent nhờ đó không tốn lượt cho một lỗi tạm thời.","elim":["<b>A.</b> Trả về danh sách rỗng như thể tìm kiếm thành công là che giấu lỗi: agent sẽ nói với người dùng “không có chuyến bay”, nhầm lỗi truy cập với kết quả rỗng hợp lệ.","<b>B.</b> Ghi log rồi trả về rỗng cũng lặng lẽ nuốt lỗi; mô hình tiếp tục mà không biết dữ liệu bị thiếu — một anti-pattern xử lý lỗi.","<b>C.</b> Báo lỗi ngay lên agent đẩy một lỗi tạm thời, có thể tự khắc phục, lên tầng suy luận; agent tốn lượt retry hoặc sai lầm báo người dùng “thử lại sau”."]},"cite":"Hướng dẫn ôn tập — §10.2 Các anti-pattern trong xử lý lỗi; Lĩnh vực 2.2"},{"id":"t1q98","n":98,"topic":1,"type":"mcq","stem":{"en":"Your agent has a log_workout tool that accepts exercise_type (string), value (number), and measurement (string). Production monitoring shows the agent frequently passes <b class=\"kw\">mismatched combinations</b>-using measurement: &quot;reps&quot; for cardio exercises like running, or measurement: &quot;miles&quot; for strength exercises like bench press. Your exercises <b class=\"kw\">naturally divide into two categories</b>: cardio (measured in time or distance) and strength (measured in reps and sets). 23% of tool calls have <b class=\"kw\">invalid combinations</b>. What approach would most effectively reduce these errors?","vi":"Agent của bạn có một tool log_workout nhận exercise_type (string), value (number) và measurement (string). Giám sát production cho thấy agent thường xuyên truyền các <b class=\"kw\">tổ hợp không khớp</b> — dùng measurement: &quot;reps&quot; cho các bài cardio như chạy bộ, hoặc measurement: &quot;miles&quot; cho các bài tập sức mạnh như bench press. Các bài tập của bạn <b class=\"kw\">tự nhiên chia thành hai nhóm</b>: cardio (đo bằng thời gian hoặc quãng đường) và sức mạnh (đo bằng số lần lặp (reps) và số hiệp (sets)). 23% tool call có <b class=\"kw\">tổ hợp không hợp lệ</b>. Cách tiếp cận nào sẽ giảm các lỗi này hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"Add <b class=\"kw\">explicit examples</b> to the <b class=\"kw\">tool description</b> showing valid combinations (e.g., &quot;For running: use minutes or miles. For push-ups: use reps&quot;) with constraints for each exercise category.","vi":"Thêm các <b class=\"kw\">ví dụ rõ ràng</b> vào <b class=\"kw\">mô tả tool</b> cho thấy các tổ hợp hợp lệ (ví dụ: &quot;Với chạy bộ: dùng minutes hoặc miles. Với chống đẩy: dùng reps&quot;) kèm ràng buộc cho từng nhóm bài tập."}},{"k":"B","t":{"en":"Implement <b class=\"kw\">server-side validation</b> returning <b class=\"kw\">descriptive errors</b> for invalid combinations, allowing the agent to retry with corrections.","vi":"Triển khai <b class=\"kw\">kiểm tra hợp lệ (validation) phía server</b>, trả về <b class=\"kw\">lỗi mang tính mô tả</b> cho các tổ hợp không hợp lệ, cho phép agent retry với các chỉnh sửa."}},{"k":"C","t":{"en":"Add <b class=\"kw\">enum constraints on measurement</b> limiting values to &quot;minutes&quot;, &quot;miles&quot;, &quot;reps&quot;, or &quot;sets&quot; to <b class=\"kw\">prevent arbitrary measurement strings</b>.","vi":"Thêm <b class=\"kw\">ràng buộc enum cho measurement</b>, giới hạn giá trị ở &quot;minutes&quot;, &quot;miles&quot;, &quot;reps&quot; hoặc &quot;sets&quot; để <b class=\"kw\">ngăn các chuỗi measurement tùy ý</b>."}},{"k":"D","t":{"en":"<b class=\"kw\">Split into log_cardio_workout</b> (with duration_minutes or distance_miles parameters) and <b class=\"kw\">log_strength_workout</b> (with reps and sets parameters).","vi":"<b class=\"kw\">Tách thành log_cardio_workout</b> (với tham số duration_minutes hoặc distance_miles) và <b class=\"kw\">log_strength_workout</b> (với tham số reps và sets)."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Bài tập vốn chia tự nhiên thành hai loại với cách đo khác nhau. <b>Tách tool đa năng thành các tool chuyên biệt</b> — <code>log_cardio_workout</code> (<code>duration_minutes</code>/<code>distance_miles</code>) và <code>log_strength_workout</code> (<code>reps</code>, <code>sets</code>) — làm cho tổ hợp sai <b>không thể biểu diễn được</b> ở cấp giao diện. Đây là ràng buộc cấu trúc, mạnh hơn mọi chỉ dẫn hay validation, và đúng kỹ năng “chia tool đa năng thành tool chuyên biệt với hợp đồng đầu vào rõ ràng”.","elim":["<b>A.</b> Ví dụ trong mô tả tool chỉ là hướng dẫn mềm; mô hình vẫn có thể truyền tổ hợp sai vì schema vẫn cho phép.","<b>B.</b> Validation phía server chỉ bắt lỗi sau khi xảy ra, tốn thêm lượt retry cho 23% lời gọi thay vì ngăn lỗi từ đầu.","<b>C.</b> Enum chỉ giới hạn giá trị hợp lệ của từng trường riêng lẻ; <code>\"reps\"</code> cho chạy bộ vẫn là giá trị enum hợp lệ, nên lỗi tổ hợp không bị ngăn."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q99","n":99,"topic":1,"type":"mcq","stem":{"en":"<b class=\"kw\">During initial testing</b>, you notice that Claude <b class=\"kw\">doesn&#x27;t seem to remember</b> vocabulary words from earlier in the conversation. When a student asks &quot;Can you quiz me on those words?&quot;, responds <b class=\"kw\">as if no words have been discussed</b>. What is the most likely explanation?","vi":"<b class=\"kw\">Trong quá trình kiểm thử ban đầu</b>, bạn nhận thấy Claude <b class=\"kw\">dường như không nhớ</b> các từ vựng từ phần trước của cuộc hội thoại. Khi một học sinh hỏi &quot;Bạn có thể kiểm tra tôi về những từ đó không?&quot;, thì lại trả lời <b class=\"kw\">như thể chưa có từ nào được thảo luận</b>. Lời giải thích khả dĩ nhất là gì?"},"options":[{"k":"A","t":{"en":"You&#x27;re <b class=\"kw\">not including prior messages</b> in each API request—the <b class=\"kw\">stateless API</b> doesn&#x27;t retain conversation history.","vi":"Bạn <b class=\"kw\">không đưa các tin nhắn trước đó</b> vào mỗi API request — <b class=\"kw\">API phi trạng thái (stateless)</b> không lưu giữ lịch sử hội thoại."}},{"k":"B","t":{"en":"The model&#x27;s <b class=\"kw\">context window</b> has <b class=\"kw\">filled up</b>, causing earlier conversation content to be dropped.","vi":"<b class=\"kw\">Context window</b> của mô hình <b class=\"kw\">đã đầy</b>, khiến nội dung hội thoại trước đó bị loại bỏ."}},{"k":"C","t":{"en":"Your <b class=\"kw\">system prompt</b> needs explicit instructions telling Claude to <b class=\"kw\">remember information from earlier turns</b>.","vi":"<b class=\"kw\">System prompt</b> của bạn cần có chỉ dẫn rõ ràng yêu cầu Claude <b class=\"kw\">ghi nhớ thông tin</b> từ các lượt trước."}},{"k":"D","t":{"en":"You need to enable <b class=\"kw\">conversation persistence</b> by passing a <b class=\"kw\">session ID parameter</b> with each API call.","vi":"Bạn cần bật tính năng <b class=\"kw\">lưu trữ hội thoại</b> bằng cách truyền <b class=\"kw\">tham số session ID</b> trong mỗi lệnh gọi API."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Claude API là <b>stateless</b>: không có bộ nhớ phía server giữa các request. Mỗi lời gọi phải gửi <b>toàn bộ lịch sử hội thoại</b> trong mảng <code>messages</code>; nếu ứng dụng chỉ gửi tin nhắn mới nhất thì Claude không hề biết các từ vựng đã học trước đó. Đây là lỗi điển hình ở giai đoạn thử nghiệm ban đầu.","elim":["<b>B.</b> Trong giai đoạn thử nghiệm ban đầu với một buổi học ngắn, việc lấp đầy context window (hàng trăm nghìn token) gần như không thể xảy ra.","<b>C.</b> System prompt không thể khiến Claude “nhớ” điều không có trong request; mô hình chỉ thấy những gì được gửi trong mỗi lời gọi.","<b>D.</b> Messages API không có tham số session ID để lưu hội thoại; việc duy trì lịch sử là trách nhiệm của ứng dụng."]},"cite":"Hướng dẫn ôn tập — §1.2 Vai trò của Message; Lĩnh vực 5.1"},{"id":"t1q100","n":100,"topic":1,"type":"mcq","stem":{"en":"<b class=\"kw\">A new user&#x27;s first message</b> is &quot;Set up my focus music,&quot; <b class=\"kw\">This could mean</b> configure preferences, create a playlist, or play music immediately. Your system <b class=\"kw\">supports all three actions</b>. What&#x27;s the effective approach?","vi":"<b class=\"kw\">Tin nhắn đầu tiên của một người dùng mới</b> là &quot;Thiết lập nhạc tập trung cho tôi,&quot; Điều này <b class=\"kw\">có thể có nghĩa là</b> cấu hình tùy chọn, tạo playlist, hoặc phát nhạc ngay lập tức. Hệ thống của bạn <b class=\"kw\">hỗ trợ cả ba hành động</b>. Cách tiếp cận hiệu quả là gì?"},"options":[{"k":"A","t":{"en":"Ask <b class=\"kw\">one clarifying question</b> about action type: <b class=\"kw\">play now or configure for later</b>","vi":"Đặt <b class=\"kw\">một câu hỏi làm rõ</b> về loại hành động: <b class=\"kw\">phát ngay hay cấu hình để dùng sau</b>"}},{"k":"B","t":{"en":"Start <b class=\"kw\">preference configuration</b> by asking about <b class=\"kw\">genres, temps, and artists</b> they prefer for focus.","vi":"Bắt đầu <b class=\"kw\">cấu hình tùy chọn</b> bằng cách hỏi về <b class=\"kw\">thể loại, nhịp độ (tempo) và nghệ sĩ</b> mà họ ưa thích khi cần tập trung."}},{"k":"C","t":{"en":"<b class=\"kw\">Play popular focus tracks Immediately</b> and <b class=\"kw\">let the user redirect</b> if needed","vi":"<b class=\"kw\">Phát ngay các bản nhạc tập trung phổ biến</b> và <b class=\"kw\">để người dùng chuyển hướng</b> nếu cần"}},{"k":"D","t":{"en":"Create a <b class=\"kw\">new &quot;Focus&quot; playlist</b> with curated tracks and <b class=\"kw\">notify the user</b> it&#x27;s ready.","vi":"Tạo một <b class=\"kw\">playlist &quot;Focus&quot; mới</b> với các bản nhạc được tuyển chọn và <b class=\"kw\">thông báo cho người dùng</b> rằng nó đã sẵn sàng."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> “Set up my focus music” có ba cách hiểu dẫn tới <b>các hành động khác hẳn nhau</b>, và đây là <b>người dùng mới</b> nên không có lịch sử để suy ra giả định hợp lý. Khi đó, <b>một câu hỏi làm rõ duy nhất, ngắn gọn</b> về loại hành động (phát ngay hay cấu hình cho sau) là cách hiệu quả: chi phí thấp, tránh làm sai ý định, và đúng nguyên tắc chỉ hỏi những gì thực sự cần để phân nhánh.","elim":["<b>B.</b> Nhảy vào luồng cấu hình sở thích với nhiều câu hỏi (thể loại, tempo, nghệ sĩ) là giả định người dùng muốn cấu hình và gây ma sát lớn nếu họ chỉ muốn nghe ngay.","<b>C.</b> Phát nhạc ngay là đoán một trong ba ý định mà không có căn cứ; với người dùng mới, giả định này có xác suất sai cao.","<b>D.</b> Tự tạo playlist cũng là đoán ý định và tạo ra hiện vật mà người dùng có thể không muốn."]},"cite":"Hướng dẫn ôn tập — Lĩnh vực 5.2 Thiết kế các Mẫu Escalation Hiệu quả và Giải quyết Sự Mơ hồ"},{"id":"t1q101","n":101,"topic":1,"type":"mcq","stem":{"en":"Your conversational assistant frequently generates <b class=\"kw\">multiple clarifying questions</b> when users make ambiguous requests. When a user asks &quot;Can you help me with the report?&quot;, the assistant responds: &quot;I&#x27;d be happy to help! Could you tell me: 1) Which report? 2) What kind of help—drafting, reviewing, or formatting? 3) What&#x27;s your deadline?&quot; User analytics show a <b class=\"kw\">40% conversation abandonment rate</b> after these multi-question responses. What&#x27;s the most effective way to <b class=\"kw\">reduce friction</b> while <b class=\"kw\">appropriately handling ambiguity</b>?","vi":"Trợ lý hội thoại của bạn thường xuyên đưa ra <b class=\"kw\">nhiều câu hỏi làm rõ</b> khi người dùng đưa ra yêu cầu mơ hồ. Khi một người dùng hỏi &quot;Bạn có thể giúp tôi với bản báo cáo không?&quot;, trợ lý trả lời: &quot;Tôi rất sẵn lòng giúp! Bạn có thể cho tôi biết: 1) Báo cáo nào? 2) Loại hỗ trợ nào — soạn thảo, rà soát hay định dạng? 3) Hạn chót của bạn là khi nào?&quot; Số liệu phân tích người dùng cho thấy <b class=\"kw\">tỷ lệ bỏ dở hội thoại là 40%</b> sau những câu trả lời gồm nhiều câu hỏi này. Cách nào hiệu quả nhất để <b class=\"kw\">giảm sự phiền phức (friction)</b> trong khi vẫn <b class=\"kw\">xử lý sự mơ hồ một cách phù hợp</b>?"},"options":[{"k":"A","t":{"en":"Limit the assistant to <b class=\"kw\">one clarifying question per turn</b>, using conversation history to <b class=\"kw\">accumulate answers</b> over multiple exchanges rather than requesting everything upfront.","vi":"Giới hạn trợ lý chỉ hỏi <b class=\"kw\">một câu hỏi làm rõ mỗi lượt</b>, dùng lịch sử hội thoại để <b class=\"kw\">tích lũy câu trả lời</b> qua nhiều lượt trao đổi thay vì yêu cầu mọi thứ ngay từ đầu."}},{"k":"B","t":{"en":"Add a <b class=\"kw\">preprocessing step</b> using a smaller model to <b class=\"kw\">classify request ambiguity</b> on a 1-5 scale, routing high-ambiguity requests to a clarification dialog and low-ambiguity requests directly to the assistant.","vi":"Thêm một <b class=\"kw\">bước tiền xử lý</b> dùng một mô hình nhỏ hơn để <b class=\"kw\">phân loại mức độ mơ hồ</b> của yêu cầu theo thang 1-5, chuyển các yêu cầu có độ mơ hồ cao sang một hộp thoại làm rõ và chuyển các yêu cầu có độ mơ hồ thấp trực tiếp đến trợ lý."}},{"k":"C","t":{"en":"Modify the system prompt to instruct the assistant to make <b class=\"kw\">reasonable assumptions</b> from available context, <b class=\"kw\">state those assumptions explicitly</b>, and offer to adjust if the interpretation is wrong.","vi":"Sửa system prompt để hướng dẫn trợ lý đưa ra các <b class=\"kw\">giả định hợp lý</b> từ context sẵn có, <b class=\"kw\">nêu rõ các giả định đó</b>, và đề nghị điều chỉnh nếu cách hiểu bị sai."}},{"k":"D","t":{"en":"Create a <b class=\"kw\">lookup table</b> of common request patterns with predefined default interpretations, having the assistant respond with those defaults <b class=\"kw\">without stating the assumptions</b> made.","vi":"Tạo một <b class=\"kw\">bảng tra cứu</b> các mẫu yêu cầu phổ biến với các cách hiểu mặc định được định nghĩa trước, để trợ lý trả lời theo các mặc định đó mà <b class=\"kw\">không nêu ra các giả định</b> đã đưa ra."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Phản hồi nhiều câu hỏi cùng lúc tạo ma sát dẫn tới 40% bỏ cuộc. Hướng dẫn trợ lý <b>đưa ra giả định hợp lý từ context sẵn có</b>, <b>nêu rõ giả định</b> và <b>đề nghị điều chỉnh</b> nếu hiểu sai, giúp người dùng nhận được giá trị ngay mà vẫn giữ quyền kiểm soát. Do giả định được nói ra, sai lệch được phát hiện và sửa nhanh — xử lý sự mơ hồ một cách minh bạch thay vì chặn người dùng bằng câu hỏi.","elim":["<b>A.</b> Một câu hỏi mỗi lượt chỉ dàn trải cùng ba câu hỏi qua nhiều lượt, kéo dài hội thoại mà người dùng vẫn chưa nhận được giúp đỡ nào.","<b>B.</b> Thêm mô hình phân loại độ mơ hồ là phức tạp hóa kiến trúc; nhóm mơ hồ cao vẫn bị đưa vào hộp thoại hỏi han — đúng nguồn gốc của ma sát.","<b>D.</b> Diễn giải mặc định mà <b>không nêu giả định</b> khiến người dùng không biết trợ lý đã hiểu gì, nên kết quả sai khó được phát hiện và sửa."]},"cite":"Hướng dẫn ôn tập — Lĩnh vực 5.2 Thiết kế các Mẫu Escalation Hiệu quả và Giải quyết Sự Mơ hồ"},{"id":"t1q102","n":102,"topic":1,"type":"mcq","stem":{"en":"You need to add a date validation check ensuring event dates are in the future. This requires <b class=\"kw\">adding a conditional statement</b> to <b class=\"kw\">one existing function in a single file</b>. What is the most appropriate approach?","vi":"Bạn cần thêm một bước kiểm tra hợp lệ ngày để đảm bảo ngày diễn ra sự kiện nằm trong tương lai. Việc này yêu cầu <b class=\"kw\">thêm một câu lệnh điều kiện</b> vào <b class=\"kw\">một hàm hiện có trong một file duy nhất</b>. Cách tiếp cận nào phù hợp nhất?"},"options":[{"k":"A","t":{"en":"Use <b class=\"kw\">direct execution</b> to <b class=\"kw\">make the change</b>","vi":"Dùng <b class=\"kw\">thực thi trực tiếp (direct execution)</b> để <b class=\"kw\">thực hiện thay đổi</b>"}},{"k":"B","t":{"en":"Start with <b class=\"kw\">extended thinking mode</b> enabled to ensure <b class=\"kw\">thorough reasoning</b> about the validation logic","vi":"Bắt đầu với <b class=\"kw\">chế độ extended thinking</b> được bật để đảm bảo <b class=\"kw\">suy luận kỹ lưỡng</b> về logic kiểm tra hợp lệ"}},{"k":"C","t":{"en":"<b class=\"kw\">Enter plan mode</b> to analyze how the validation might <b class=\"kw\">impact other parts</b> of the reservation flow","vi":"<b class=\"kw\">Vào plan mode</b> để phân tích việc kiểm tra hợp lệ có thể <b class=\"kw\">ảnh hưởng thế nào đến các phần khác</b> của luồng đặt chỗ"}},{"k":"D","t":{"en":"<b class=\"kw\">Enter plan mode first</b> to create a <b class=\"kw\">detailed implementation strategy</b> before making the change","vi":"<b class=\"kw\">Vào plan mode trước</b> để xây dựng một <b class=\"kw\">chiến lược triển khai chi tiết</b> trước khi thực hiện thay đổi"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Thêm một điều kiện kiểm tra ngày trong tương lai vào <b>một hàm có sẵn trong một file</b> là thay đổi đơn giản, phạm vi rõ ràng. Theo hướng dẫn, các thay đổi đã hiểu rõ như “thêm một validation duy nhất” nên dùng <b>thực thi trực tiếp</b>; planning mode dành cho tác vụ có hệ quả kiến trúc, nhiều phương án hoặc chạm nhiều file.","elim":["<b>B.</b> Extended thinking là thừa cho một câu lệnh điều kiện đơn giản; logic “ngày phải ở tương lai” không cần suy luận sâu.","<b>C.</b> Phân tích tác động lên toàn bộ luồng đặt chỗ là thổi phồng một thay đổi cục bộ một hàm, tốn thời gian không cần thiết.","<b>D.</b> Lập chiến lược triển khai chi tiết trong planning mode dành cho thay đổi lớn/kiến trúc, không phải cho việc thêm một điều kiện."]},"cite":"Hướng dẫn ôn tập — §5.6 Planning Mode so với Thực thi trực tiếp; Lĩnh vực 3.4"},{"id":"t1q103","n":103,"topic":1,"type":"mcq","stem":{"en":"Your team&#x27;s CLAUDE.md includes a rule: &quot;Use 4-space indentation and always run Prettier formatting.&quot; Despite this, code reviews reveal that <b class=\"kw\">roughly 30% of files</b> Claude Code generates use inconsistent formatting — sometimes 2-space indentation, sometimes missing trailing commas. <b class=\"kw\">Adding emphasis</b> (&quot;IMPORTANT: You MUST use Prettier formatting&quot;) reduces violations to about 15%, but <b class=\"kw\">doesn&#x27;t eliminate them</b>. What is the most effective way to <b class=\"kw\">ensure all generated code is consistently formatted</b>?","vi":"CLAUDE.md của nhóm bạn có một quy tắc: &quot;Dùng thụt lề 4 dấu cách và luôn chạy định dạng Prettier.&quot; Dù vậy, các đợt review code cho thấy <b class=\"kw\">khoảng 30% file</b> mà Claude Code tạo ra có định dạng không nhất quán — đôi khi thụt lề 2 dấu cách, đôi khi thiếu dấu phẩy cuối (trailing comma). Việc <b class=\"kw\">thêm nhấn mạnh</b> (&quot;QUAN TRỌNG: Bạn PHẢI dùng định dạng Prettier&quot;) giảm vi phạm xuống khoảng 15%, nhưng <b class=\"kw\">không loại bỏ hoàn toàn</b>. Cách nào hiệu quả nhất để <b class=\"kw\">đảm bảo toàn bộ code được tạo ra</b> đều được định dạng nhất quán?"},"options":[{"k":"A","t":{"en":"Split the formatting rules into <b class=\"kw\">path-scoped .claude/rules/ files</b> that load when Claude works on <b class=\"kw\">matching file types</b>.","vi":"Tách các quy tắc định dạng thành các <b class=\"kw\">file .claude/rules/ có phạm vi theo đường dẫn</b>, được tải khi Claude làm việc với các <b class=\"kw\">loại file tương ứng</b>."}},{"k":"B","t":{"en":"Configure a <b class=\"kw\">Post ToolUse hook</b> with an Edit|Write matcher that automatically <b class=\"kw\">runs Prettier</b> on each file Claude modifies.","vi":"Cấu hình một <b class=\"kw\">Post ToolUse hook</b> với matcher Edit|Write tự động <b class=\"kw\">chạy Prettier</b> trên mỗi file mà Claude sửa đổi."}},{"k":"C","t":{"en":"Add a <b class=\"kw\">Stop hook</b> with a <b class=\"kw\">prompt-based check</b> that evaluates whether generated code follows formatting standards and prompts Claude to fix violations.","vi":"Thêm một <b class=\"kw\">Stop hook</b> với bước <b class=\"kw\">kiểm tra dựa trên prompt</b>, đánh giá xem code được tạo có tuân theo tiêu chuẩn định dạng hay không và nhắc Claude sửa các vi phạm."}},{"k":"D","t":{"en":"Extract the formatting rules into a <b class=\"kw\">dedicated skill</b> that Claude loads automatically when generating code, with more <b class=\"kw\">detailed examples</b> of correct formatting.","vi":"Tách các quy tắc định dạng thành một <b class=\"kw\">skill chuyên biệt</b> mà Claude tự động tải khi tạo code, kèm các <b class=\"kw\">ví dụ chi tiết hơn</b> về định dạng đúng."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Chỉ dẫn trong CLAUDE.md, dù được nhấn mạnh, vẫn là <b>hướng dẫn mang tính xác suất</b> (vẫn còn ~15% vi phạm). Để đảm bảo 100%, cần <b>cơ chế tất định</b>: hook <code>PostToolUse</code> với matcher <code>Edit|Write</code> tự động chạy Prettier trên mỗi file Claude vừa sửa. Định dạng do công cụ thực thi bằng code chứ không phụ thuộc mô hình có nhớ quy tắc hay không.","elim":["<b>A.</b> Tách quy tắc ra <code>.claude/rules/</code> theo đường dẫn chỉ thay đổi thời điểm nạp chỉ dẫn; vẫn là hướng dẫn xác suất nên không loại bỏ vi phạm.","<b>C.</b> Stop hook với kiểm tra dựa trên prompt vẫn dùng mô hình để phán đoán định dạng — không tất định, chạy muộn và tốn thêm vòng sửa, trong khi Prettier làm việc này chính xác.","<b>D.</b> Skill với nhiều ví dụ hơn vẫn là chỉ dẫn cho mô hình; không đảm bảo được mọi file đều đúng định dạng."]},"cite":"Hướng dẫn ôn tập — §3.5 Hooks trong Agent SDK; Lĩnh vực 1.5"},{"id":"t1q104","n":104,"topic":1,"type":"mcq","stem":{"en":"You&#x27;re implementing a caching layer for API responses to speed up the /products endpoint. You have a <b class=\"kw\">rough idea</b>—Redis with a 5-minute TTL—but you&#x27;re <b class=\"kw\">new to production caching</b> and <b class=\"kw\">aren&#x27;t sure what other considerations</b> a robust implementation requires. What&#x27;s the most effective way to start your iterative workflow?","vi":"Bạn đang triển khai một lớp cache cho các phản hồi API để tăng tốc endpoint /products. Bạn đã có <b class=\"kw\">ý tưởng sơ bộ</b> — Redis với TTL 5 phút — nhưng bạn <b class=\"kw\">mới làm quen với caching trong production</b> và không chắc một bản triển khai vững chắc <b class=\"kw\">cần những cân nhắc nào khác</b>. Cách nào hiệu quả nhất để bắt đầu workflow lặp của bạn?"},"options":[{"k":"A","t":{"en":"Start with a <b class=\"kw\">minimal request</b>: &quot;Add Redis caching to/products with 5-minute TTL.&quot; Add features and fix issues through <b class=\"kw\">follow-up prompts</b> as problems surface during testing.","vi":"Bắt đầu với một <b class=\"kw\">yêu cầu tối giản</b>: &quot;Thêm Redis caching cho /products với TTL 5 phút.&quot; Bổ sung tính năng và sửa lỗi thông qua <b class=\"kw\">các prompt tiếp theo</b> khi vấn đề phát sinh trong quá trình kiểm thử."}},{"k":"B","t":{"en":"Write a <b class=\"kw\">specification</b> with your known requirements and <b class=\"kw\">&quot;TBD&quot; markers</b> for uncertain areas, having Claude propose solutions for each TBD as it implements.","vi":"Viết một <b class=\"kw\">bản đặc tả</b> với các yêu cầu bạn đã biết và các <b class=\"kw\">đánh dấu &quot;TBD&quot;</b> cho những phần chưa chắc chắn, để Claude đề xuất giải pháp cho từng TBD trong khi triển khai."}},{"k":"C","t":{"en":"Ask Claude to <b class=\"kw\">interview you</b> about the caching requirements <b class=\"kw\">before implementing</b>, surfacing considerations like invalidation strategies, cache layers, consistency guarantees, and failure modes.","vi":"Yêu cầu Claude <b class=\"kw\">phỏng vấn bạn</b> về các yêu cầu caching <b class=\"kw\">trước khi triển khai</b>, làm lộ ra các cân nhắc như chiến lược vô hiệu hóa cache (invalidation), các tầng cache, các đảm bảo về tính nhất quán, và các kiểu lỗi có thể xảy ra (failure modes)."}},{"k":"D","t":{"en":"Use <b class=\"kw\">plan mode</b> to <b class=\"kw\">analyze the current/products endpoint</b> implementation, then provide your caching requirements once Claude explains how the existing code is structured.","vi":"Dùng <b class=\"kw\">plan mode</b> để <b class=\"kw\">phân tích phần triển khai hiện tại</b> của endpoint /products, sau đó đưa ra các yêu cầu caching của bạn khi Claude đã giải thích cấu trúc của code hiện có."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Người dùng có ý tưởng sơ bộ (Redis, TTL 5 phút) nhưng <b>mới với caching production</b> và không biết còn những cân nhắc gì. <b>Mẫu “phỏng vấn”</b> — để Claude đặt câu hỏi trước khi triển khai — làm lộ ra các yếu tố thiết kế không hiển nhiên như chiến lược vô hiệu hóa cache, các tầng cache, đảm bảo nhất quán và chế độ lỗi, giúp bắt đầu với yêu cầu đầy đủ thay vì phát hiện vấn đề muộn.","elim":["<b>A.</b> Bắt đầu tối thiểu rồi sửa khi gặp vấn đề nghĩa là các lỗ hổng (invalidation, lỗi khi Redis sập) chỉ lộ ra muộn, có thể ở production, phải làm lại tốn kém.","<b>B.</b> Đánh dấu “TBD” giả định người dùng biết mình chưa biết gì; người mới thì không biết cần đặt TBD ở đâu, và Claude tự quyết khi triển khai mà không thảo luận.","<b>D.</b> Phân tích code hiện có giúp hiểu cấu trúc endpoint nhưng không giải quyết khoảng trống kiến thức về yêu cầu caching của người dùng."]},"cite":"Hướng dẫn ôn tập — §6.4 Mẫu “Phỏng vấn” (Interview); Lĩnh vực 3.5"},{"id":"t1q105","n":105,"topic":1,"type":"mcq","stem":{"en":"You&#x27;ve asked Claude to write a data migration script, but the initial output <b class=\"kw\">doesn&#x27;t correctly handle</b> records with <b class=\"kw\">null values in required fields</b>. What&#x27;s the most effective way to <b class=\"kw\">iterate toward a working solution</b>?","vi":"Bạn đã yêu cầu Claude viết một script migration dữ liệu, nhưng đầu ra ban đầu <b class=\"kw\">không xử lý đúng</b> các bản ghi có <b class=\"kw\">giá trị null ở các trường bắt buộc</b>. Cách nào hiệu quả nhất để <b class=\"kw\">lặp dần tới một giải pháp hoạt động được</b>?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Manually edit the generated code</b> to fix the null handling, then <b class=\"kw\">continue working</b> with Claude on other parts.","vi":"<b class=\"kw\">Tự tay sửa code được tạo</b> để khắc phục việc xử lý null, sau đó <b class=\"kw\">tiếp tục làm việc</b> với Claude ở các phần khác."}},{"k":"B","t":{"en":"Provide a <b class=\"kw\">test case</b> with example input containing null values and the <b class=\"kw\">expected output</b>, then ask Claude to fix it.","vi":"Cung cấp một <b class=\"kw\">test case</b> với dữ liệu đầu vào mẫu chứa giá trị null và <b class=\"kw\">đầu ra mong đợi</b>, sau đó yêu cầu Claude sửa."}},{"k":"C","t":{"en":"<b class=\"kw\">Describe the null value problem</b> in detail and ask Claude to <b class=\"kw\">regenerate the entire script</b> with improved edge case handling.","vi":"<b class=\"kw\">Mô tả chi tiết vấn đề giá trị null</b> và yêu cầu Claude <b class=\"kw\">tạo lại toàn bộ script</b> với khả năng xử lý edge case tốt hơn."}},{"k":"D","t":{"en":"Add <b class=\"kw\">&quot;think harder about edge cases&quot;</b> to your prompt and request a <b class=\"kw\">complete rewrite</b> of the migration logic.","vi":"Thêm <b class=\"kw\">&quot;hãy suy nghĩ kỹ hơn về các edge case&quot;</b> vào prompt và yêu cầu <b class=\"kw\">viết lại hoàn toàn</b> logic migration."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> <b>Ví dụ đầu vào/đầu ra cụ thể</b> là cách hiệu quả nhất để truyền đạt kỳ vọng. Một <b>test case</b> chứa bản ghi có null ở trường bắt buộc cùng đầu ra mong đợi cho Claude biết chính xác hành vi cần có (bỏ qua, gán mặc định, hay báo lỗi) và cung cấp cách kiểm chứng việc sửa — đúng tinh thần lặp theo hướng test.","elim":["<b>A.</b> Tự sửa tay làm mất cơ hội để Claude hiểu yêu cầu xử lý null; các phần sau có thể lặp lại cùng lỗi và mâu thuẫn với bản sửa tay.","<b>C.</b> Mô tả bằng lời mơ hồ hơn ví dụ cụ thể, và sinh lại toàn bộ script có thể làm hỏng những phần đang đúng.","<b>D.</b> “Think harder” là chỉ dẫn chung chung không nêu hành vi mong muốn với null; viết lại toàn bộ cũng rủi ro phá phần đã chạy đúng."]},"cite":"Hướng dẫn ôn tập — Lĩnh vực 3.5 Tinh chỉnh Lặp lại để Cải thiện Tiệm tiến"},{"id":"t1q106","n":106,"topic":1,"type":"mcq","stem":{"en":"Production monitoring shows the research phase takes longer than expected. Analysis reveals the coordinator invokes the web search subagent, then invokes the document analysis subagent and <b class=\"kw\">waits again</b>. <b clas
