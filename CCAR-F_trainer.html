s=\"kw\">These tasks are independent</b>—<b class=\"kw\">neither requires the other&#x27;s output</b>. What is the most effective way to <b class=\"kw\">run these subagents concurrently</b>?","vi":"Giám sát production cho thấy giai đoạn nghiên cứu mất nhiều thời gian hơn dự kiến. Phân tích cho thấy coordinator gọi subagent tìm kiếm web, sau đó gọi subagent phân tích tài liệu và <b class=\"kw\">lại chờ tiếp</b>. <b class=\"kw\">Các tác vụ này độc lập</b> — <b class=\"kw\">không tác vụ nào cần đầu ra của tác vụ kia</b>. Cách nào hiệu quả nhất để <b class=\"kw\">chạy các subagent này đồng thời</b>?"},"options":[{"k":"A","t":{"en":"Create an <b class=\"kw\">async orchestration layer</b> outside the agent that spawns <b class=\"kw\">parallel threads</b>, each running a separate coordinator.","vi":"Tạo một <b class=\"kw\">lớp điều phối bất đồng bộ</b> bên ngoài agent, sinh ra <b class=\"kw\">các luồng (thread) song song</b>, mỗi luồng chạy một coordinator riêng."}},{"k":"B","t":{"en":"Switch both subagents to use a <b class=\"kw\">Haiku-tier model</b> <b class=\"kw\">instead of Sonnet</b> to reduce their individual execution time.","vi":"Chuyển cả hai subagent sang dùng <b class=\"kw\">model tầng Haiku</b> <b class=\"kw\">thay vì Sonnet</b> để giảm thời gian thực thi của từng subagent."}},{"k":"C","t":{"en":"Structure the coordinator to emit <b class=\"kw\">both Task tool calls</b> (for web search and document analysis) in a <b class=\"kw\">single response message</b>.","vi":"Cấu trúc coordinator để phát ra <b class=\"kw\">cả hai Task tool call</b> (cho tìm kiếm web và phân tích tài liệu) trong <b class=\"kw\">cùng một tin nhắn phản hồi duy nhất</b>."}},{"k":"D","t":{"en":"Add <b class=\"kw\">detailed instructions</b> to the coordinator&#x27;s system prompt explaining the <b class=\"kw\">performance benefits</b> of parallel execution at the same time.","vi":"Thêm <b class=\"kw\">chỉ dẫn chi tiết</b> vào system prompt của coordinator giải thích <b class=\"kw\">lợi ích về hiệu năng</b> của việc thực thi song song cùng lúc."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Trong Agent SDK, subagent chạy song song khi coordinator <b>phát nhiều lời gọi tool <code>Task</code> trong cùng một response</b>. Vì tìm kiếm web và phân tích tài liệu độc lập với nhau, coordinator chỉ cần phát cả hai lệnh <code>Task</code> trong một message để chúng chạy đồng thời — không cần hạ tầng bổ sung.","elim":["<b>A.</b> Lớp điều phối async bên ngoài với nhiều coordinator là phức tạp hóa không cần thiết và phân tán việc điều phối, trong khi SDK đã hỗ trợ song song gốc qua nhiều lời gọi <code>Task</code>.","<b>B.</b> Đổi sang model Haiku chỉ giảm thời gian từng subagent (và có thể giảm chất lượng); chúng vẫn chạy tuần tự.","<b>D.</b> Giải thích lợi ích song song trong system prompt không cụ thể bằng việc cấu trúc coordinator phát cả hai lệnh <code>Task</code> trong một response — đây mới là cơ chế thực thi đồng thời."]},"cite":"Hướng dẫn ôn tập — §3.4 Tool Task để Sinh ra Subagent; Lĩnh vực 1.3"},{"id":"t1q107","n":107,"topic":1,"type":"mcq","stem":{"en":"Your automated review calls the Claude API for each PR, using tool_use with a report_findings tool that returns a JSON array of finding objects (each with file_path, line_number, severity, category, and description). During testing on a <b class=\"kw\">large PR touching 30+ files</b>, the response <b class=\"kw\">hits the max_tokens limit</b> and the output is <b class=\"kw\">truncated mid-JSON</b>, causing your pipeline&#x27;s parser to fail. What is the most effective way to handle this?","vi":"Hệ thống review tự động của bạn gọi Claude API cho mỗi PR, dùng tool_use với một tool report_findings trả về một mảng JSON các đối tượng phát hiện (finding), mỗi đối tượng có file_path, line_number, severity, category và description. Trong quá trình kiểm thử trên một <b class=\"kw\">PR lớn chạm tới 30+ file</b>, phản hồi <b class=\"kw\">chạm giới hạn max_tokens</b> và đầu ra <b class=\"kw\">bị cắt cụt giữa chừng JSON</b>, khiến trình phân tích (parser) của pipeline bị lỗi. Cách nào hiệu quả nhất để xử lý vấn đề này?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Switch from tool_use</b> to prompting Claude to return findings as a <b class=\"kw\">markdown list</b>.","vi":"<b class=\"kw\">Chuyển từ tool_use</b> sang prompt yêu cầu Claude trả về các phát hiện dưới dạng <b class=\"kw\">danh sách markdown</b>."}},{"k":"B","t":{"en":"<b class=\"kw\">Increase max_tokens</b> to the model&#x27;s maximum and instruct Claude to keep finding descriptions <b class=\"kw\">under 50 words each</b>.","vi":"<b class=\"kw\">Tăng max_tokens</b> lên mức tối đa của model và hướng dẫn Claude giữ mỗi mô tả phát hiện <b class=\"kw\">dưới 50 từ</b>."}},{"k":"C","t":{"en":"Split the review into <b class=\"kw\">multiple API calls</b> that each analyze a subset of the changed files, then <b class=\"kw\">merge the resulting findings arrays</b>.","vi":"Chia việc review thành <b class=\"kw\">nhiều lệnh gọi API</b>, mỗi lệnh phân tích một tập con các file đã thay đổi, sau đó <b class=\"kw\">gộp các mảng phát hiện</b> thu được."}},{"k":"D","t":{"en":"Add <b class=\"kw\">retry logic</b> that detects truncated JSON and re-sends the request with instructions to report <b class=\"kw\">only critical and high severity</b> findings.","vi":"Thêm <b class=\"kw\">logic retry</b> phát hiện JSON bị cắt cụt và gửi lại request với chỉ dẫn chỉ báo cáo các phát hiện có mức độ <b class=\"kw\">nghiêm trọng critical và high</b>."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Vấn đề gốc là <b>kích thước đầu ra</b> của một PR 30+ file vượt <code>max_tokens</code> (<code>stop_reason: \"max_tokens\"</code>), làm JSON bị cắt. <b>Chia review thành nhiều lời gọi</b>, mỗi lời gọi phân tích một nhóm file, giữ mỗi đầu ra trong giới hạn; sau đó gộp các mảng findings. Cách này mở rộng được với PR bất kỳ kích thước, giữ nguyên cấu trúc <code>tool_use</code> và chất lượng chi tiết.","elim":["<b>A.</b> Chuyển sang markdown bỏ đi lợi ích structured output của <code>tool_use</code> mà vẫn bị cắt cụt khi vượt giới hạn token.","<b>B.</b> Tăng <code>max_tokens</code> và rút ngắn mô tả chỉ đẩy ngưỡng lên; PR lớn hơn vẫn bị cắt, và cắt mô tả làm giảm chất lượng finding.","<b>D.</b> Retry chỉ báo critical/high là cố ý bỏ sót finding mức thấp hơn và tốn một lời gọi thất bại trước khi retry."]},"cite":"Hướng dẫn ôn tập — §1.3 Trường stop_reason trong Phản hồi; Lĩnh vực 4.6"},{"id":"t1q108","n":108,"topic":1,"type":"mcq","stem":{"en":"An engineer sees an unfamiliar error message &quot;<b class=\"kw\">SYNC_CONFLICT: entity version mismatch detected</b>&quot; in production logs but <b class=\"kw\">doesn&#x27;t know which of the 12 services</b> in the codebase generates it. They ask the agent to help locate the source code. What exploration approach will <b class=\"kw\">most efficiently find</b> the responsible code?","vi":"Một kỹ sư thấy một thông báo lỗi lạ &quot;<b class=\"kw\">SYNC_CONFLICT: entity version mismatch detected</b>&quot; trong log production nhưng <b class=\"kw\">không biết service nào trong số 12 service</b> của codebase tạo ra nó. Họ nhờ agent giúp xác định vị trí mã nguồn. Cách khám phá nào sẽ tìm ra code chịu trách nhiệm một cách <b class=\"kw\">hiệu quả nhất</b>?"},"options":[{"k":"A","t":{"en":"Use <b class=\"kw\">Grep</b> to search for <b class=\"kw\">distinctive text from the error message</b> (like &quot;SYNC_CONFLICT&quot; or &quot;entity version mismatch&quot;), then Read the matching files to understand context.","vi":"Dùng <b class=\"kw\">Grep</b> để tìm <b class=\"kw\">văn bản đặc trưng từ thông báo lỗi</b> (như &quot;SYNC_CONFLICT&quot; hoặc &quot;entity version mismatch&quot;), sau đó Read các file khớp để hiểu context."}},{"k":"B","t":{"en":"Use <b class=\"kw\">Grep</b> to find all files that <b class=\"kw\">import the project&#x27;s error handling module</b>, then Read those files to locate custom error definitions.","vi":"Dùng <b class=\"kw\">Grep</b> để tìm tất cả các file <b class=\"kw\">import module xử lý lỗi</b> của dự án, sau đó Read các file đó để xác định các định nghĩa lỗi tùy chỉnh."}},{"k":"C","t":{"en":"Use <b class=\"kw\">Glob</b> to find files in <b class=\"kw\">directories commonly associated with error handling</b> (such as errors/, exceptions/, or handlers/) across services, then Read each matching file.","vi":"Dùng <b class=\"kw\">Glob</b> để tìm các file trong những <b class=\"kw\">thư mục thường gắn với xử lý lỗi</b> (như errors/, exceptions/ hoặc handlers/) trên các service, sau đó Read từng file khớp."}},{"k":"D","t":{"en":"Read the <b class=\"kw\">project&#x27;s README</b> and service configuration files to understand the architecture, then <b class=\"kw\">systematically Read source files</b> in service directory.","vi":"Read <b class=\"kw\">README</b> và các file cấu hình service của dự án để hiểu kiến trúc, sau đó <b class=\"kw\">Read một cách có hệ thống</b> các file mã nguồn trong thư mục service."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Thông báo lỗi chứa <b>chuỗi đặc trưng</b> (“SYNC_CONFLICT”, “entity version mismatch”) gần như chắc chắn xuất hiện nguyên văn trong mã nguồn tạo ra nó. <b>Grep</b> — công cụ tìm kiếm theo nội dung file — tìm ra ngay vị trí trên 12 service, rồi <b>Read</b> các file khớp để hiểu context. Đây là chiến lược điều tra tăng dần chuẩn: Grep điểm vào, sau đó Read để truy vết.","elim":["<b>B.</b> Tìm mọi file import module xử lý lỗi cho ra tập kết quả rất rộng, phải đọc nhiều file không liên quan thay vì nhắm thẳng vào chuỗi lỗi.","<b>C.</b> Glob theo tên thư mục dựa trên giả định về quy ước đặt tên; mã lỗi có thể được định nghĩa ở nơi khác, và vẫn phải Read từng file khớp.","<b>D.</b> Đọc README rồi đọc tuần tự file nguồn của các service tốn rất nhiều context và thời gian, trong khi một lệnh Grep đã tìm ra đúng chỗ."]},"cite":"Hướng dẫn ôn tập — §13.2 Chiến lược Điều tra Tăng dần; Lĩnh vực 2.5"},{"id":"t1q109","n":109,"topic":1,"type":"mcq","stem":{"en":"An engineer asks your agent to add comprehensive tests to a <b class=\"kw\">legacy codebase with 200 files</b> and minimal existing test coverage. The engineer <b class=\"kw\">hasn&#x27;t specified which modules to prioritize</b>. How should the agent decompose this <b class=\"kw\">open-ended task</b>?","vi":"Một kỹ sư yêu cầu agent của bạn thêm các test toàn diện cho một codebase cũ (legacy) <b class=\"kw\">có 200 file</b> và độ bao phủ test hiện có rất ít. Kỹ sư <b class=\"kw\">không nêu rõ cần ưu tiên module nào</b>. Agent nên phân rã <b class=\"kw\">tác vụ mở</b> này như thế nào?"},"options":[{"k":"A","t":{"en":"Systematically <b class=\"kw\">read all 200 files</b> to create a <b class=\"kw\">complete function inventory</b> before writing any tests, ensuring the testing plan accounts for every function before beginning.","vi":"Đọc một cách có hệ thống <b class=\"kw\">toàn bộ 200 file</b> để lập <b class=\"kw\">danh mục đầy đủ các hàm</b> trước khi viết bất kỳ test nào, đảm bảo kế hoạch test tính đến mọi hàm trước khi bắt đầu."}},{"k":"B","t":{"en":"Create a <b class=\"kw\">fixed testing schedule</b> upfront based on directory structure, allocating <b class=\"kw\">equal effort</b> to each top-level directory regardless of code complexity or business importance.","vi":"Lập trước một <b class=\"kw\">lịch test cố định</b> dựa trên cấu trúc thư mục, phân bổ <b class=\"kw\">công sức bằng nhau</b> cho mỗi thư mục cấp cao nhất, bất kể độ phức tạp của code hay tầm quan trọng về nghiệp vụ."}},{"k":"C","t":{"en":"Use Glob and Grep to <b class=\"kw\">map codebase structure</b>, identify heavily-coupled modules, create a <b class=\"kw\">prioritized plan</b> for high-impact areas, and revise as dependencies are discovered.","vi":"Dùng Glob và Grep để <b class=\"kw\">lập bản đồ cấu trúc codebase</b>, xác định các module có mức liên kết (coupling) cao, lập <b class=\"kw\">kế hoạch ưu tiên</b> cho các khu vực có tác động lớn, và điều chỉnh khi phát hiện thêm các phụ thuộc."}},{"k":"D","t":{"en":"Start writing tests for the <b class=\"kw\">first module alphabetically</b>, using test failures and imports to <b class=\"kw\">discover related files organically</b>.","vi":"Bắt đầu viết test cho <b class=\"kw\">module đầu tiên theo thứ tự bảng chữ cái</b>, dùng các test thất bại và các lệnh import để <b class=\"kw\">khám phá các file liên quan</b> một cách tự nhiên."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Đây là tác vụ mở, chưa xác định ưu tiên trên 200 file — phù hợp với <b>phân rã thích ứng động</b>. Dùng <b>Glob và Grep</b> để lập bản đồ cấu trúc codebase một cách rẻ, xác định các module có <b>độ liên kết cao</b> (tác động lớn), lập kế hoạch ưu tiên cho các vùng đó, rồi <b>điều chỉnh kế hoạch</b> khi phát hiện thêm phụ thuộc. Cách này cân bằng giữa thu thập context đủ dùng và việc bắt tay vào làm sớm.","elim":["<b>A.</b> Đọc toàn bộ 200 file trước khi viết test làm cạn context và trì hoãn giá trị; lập bản đồ bằng Grep/Glob đủ để ưu tiên.","<b>B.</b> Lịch cố định chia đều theo thư mục bỏ qua độ phức tạp và tầm quan trọng nghiệp vụ, và không thích ứng khi phát hiện phụ thuộc.","<b>D.</b> Bắt đầu theo thứ tự bảng chữ cái là tùy tiện, không gắn với tác động; khám phá “tự nhiên” dễ dồn công sức vào module ít quan trọng."]},"cite":"Hướng dẫn ôn tập — §8.2 Phân rã thích ứng động (Dynamic Adaptive Decomposition); Lĩnh vực 1.6"},{"id":"t1q110","n":110,"topic":1,"type":"mcq","stem":{"en":"Your productivity agent connects to three MCP servers: an issue tracker (search_issues, get_issue, create_comment), a documentation wiki (search_docs, get_page, list_spaces), and a database explorer (run_query, get_schema, list_databases). When engineers ask cross-system questions like &quot;What database tables are affected by the authentication refactor in PROJ-1234?&quot;, monitoring shows the agent makes <b class=\"kw\">8-10 sequential tool calls</b>, frequently issues <b class=\"kw\">exploratory calls</b> because it <b class=\"kw\">lacks visibility into what content each server contains</b>, and <b class=\"kw\">exhausts context space</b> before completing complex investigations. What architectural change best leverages MCP capabilities to address these issues?","vi":"Agent năng suất của bạn kết nối tới ba MCP server: một trình theo dõi issue (search_issues, get_issue, create_comment), một wiki tài liệu (search_docs, get_page, list_spaces), và một trình khám phá cơ sở dữ liệu (run_query, get_schema, list_databases). Khi các kỹ sư hỏi những câu hỏi liên hệ thống như &quot;Những bảng cơ sở dữ liệu nào bị ảnh hưởng bởi đợt refactor xác thực trong PROJ-1234?&quot;, giám sát cho thấy agent thực hiện <b class=\"kw\">8-10 tool call tuần tự</b>, thường xuyên phát ra các <b class=\"kw\">lệnh gọi mang tính dò tìm</b> vì <b class=\"kw\">không nắm được mỗi server chứa nội dung gì</b>, và <b class=\"kw\">cạn kiệt không gian context</b> trước khi hoàn thành các cuộc điều tra phức tạp. Thay đổi kiến trúc nào tận dụng tốt nhất các khả năng của MCP để giải quyết những vấn đề này?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Consolidate all three servers</b> into a <b class=\"kw\">unified MCP server</b> with cross-referencing capabilities","vi":"<b class=\"kw\">Hợp nhất cả ba server</b> thành một <b class=\"kw\">MCP server thống nhất</b> với khả năng tham chiếu chéo"}},{"k":"B","t":{"en":"Expose each server&#x27;s <b class=\"kw\">content catalog</b> as <b class=\"kw\">MCP resources</b>—issue summaries, documentation hierarchy, database schemas","vi":"Cung cấp <b class=\"kw\">danh mục nội dung</b> của mỗi server dưới dạng <b class=\"kw\">MCP resources</b> — tóm tắt issue, cấu trúc phân cấp tài liệu, schema cơ sở dữ liệu"}},{"k":"C","t":{"en":"Add an <b class=\"kw\">orchestrator</b> that routes questions to a <b class=\"kw\">single server based on keywords</b>","vi":"Thêm một <b class=\"kw\">bộ điều phối (orchestrator)</b> định tuyến câu hỏi tới <b class=\"kw\">một server duy nhất dựa trên từ khóa</b>"}},{"k":"D","t":{"en":"Add a <b class=\"kw\">prepare_investigation tool</b> to each server that accepts a <b class=\"kw\">natural language question</b> and returns relevant content summaries","vi":"Thêm một <b class=\"kw\">tool prepare_investigation</b> vào mỗi server, nhận một <b class=\"kw\">câu hỏi bằng ngôn ngữ tự nhiên</b> và trả về các bản tóm tắt nội dung liên quan"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Agent thực hiện nhiều lời gọi khám phá vì <b>không biết mỗi server chứa nội dung gì</b>. <b>MCP resources</b> được thiết kế đúng cho việc này: công bố <b>“danh mục nội dung”</b> — tóm tắt issue, cây tài liệu, schema cơ sở dữ liệu — để agent nắm được bức tranh tổng quan mà không phải gọi tool dò dẫm. Kết quả là giảm số lời gọi tuần tự và tiết kiệm context cho các điều tra phức tạp.","elim":["<b>A.</b> Gộp ba server thành một chỉ thay đổi cách đóng gói; agent vẫn thiếu thông tin về nội dung sẵn có nên vẫn phải gọi khám phá.","<b>C.</b> Định tuyến theo từ khóa tới một server duy nhất phá vỡ đúng loại câu hỏi xuyên hệ thống (issue + tài liệu + DB) mà đề bài nêu.","<b>D.</b> Tool <code>prepare_investigation</code> trên mỗi server vẫn là thêm lời gọi tool, và mỗi server tự diễn giải câu hỏi ngôn ngữ tự nhiên — không tận dụng primitive resources của MCP."]},"cite":"Hướng dẫn ôn tập — §4.5 MCP Resources; Lĩnh vực 2.4"},{"id":"t1q111","n":111,"topic":1,"type":"mcq","stem":{"en":"The synthesis agent completes its initial pass but flags that <b class=\"kw\">three key research questions remain unanswered</b> because the web search and document analysis agents didn&#x27;t find relevant information on <b class=\"kw\">those specific subtopics</b>. The coordinator currently <b class=\"kw\">proceeds directly to report generation</b>, producing reports with incomplete coverage. What change would most effectively improve research completeness?","vi":"Agent tổng hợp (synthesis) hoàn thành lượt đầu tiên nhưng gắn cờ rằng <b class=\"kw\">ba câu hỏi nghiên cứu chính vẫn chưa được trả lời</b> vì các agent tìm kiếm web và phân tích tài liệu không tìm thấy thông tin liên quan về <b class=\"kw\">các chủ đề con cụ thể đó</b>. Coordinator hiện <b class=\"kw\">chuyển thẳng sang bước tạo báo cáo</b>, cho ra các báo cáo có độ bao phủ không đầy đủ. Thay đổi nào sẽ cải thiện hiệu quả nhất độ đầy đủ của nghiên cứu?"},"options":[{"k":"A","t":{"en":"Have the <b class=\"kw\">report generation agent</b> note which research questions <b class=\"kw\">couldn&#x27;t be answered</b>, so users understand the limitations of the final output.","vi":"Cho <b class=\"kw\">agent tạo báo cáo</b> ghi chú những câu hỏi nghiên cứu nào <b class=\"kw\">không thể trả lời</b>, để người dùng hiểu các hạn chế của đầu ra cuối cùng."}},{"k":"B","t":{"en":"Give the synthesis agent <b class=\"kw\">direct access to web search tools</b> so it can autonomously fill knowledge gaps <b class=\"kw\">without returning control</b> to the coordinator.","vi":"Cấp cho agent tổng hợp <b class=\"kw\">quyền truy cập trực tiếp</b> vào các tool tìm kiếm web để nó có thể tự động lấp các lỗ hổng kiến thức mà <b class=\"kw\">không trả quyền điều khiển</b> về cho coordinator."}},{"k":"C","t":{"en":"Have the <b class=\"kw\">coordinator evaluate synthesis output</b> for gaps, then <b class=\"kw\">re-delegate</b> to web search and document analysis with targeted queries before Invoking synthesis again.","vi":"Cho <b class=\"kw\">coordinator đánh giá đầu ra tổng hợp</b> để tìm lỗ hổng, sau đó <b class=\"kw\">giao lại</b> cho tìm kiếm web và phân tích tài liệu với các truy vấn có mục tiêu trước khi gọi lại bước tổng hợp."}},{"k":"D","t":{"en":"<b class=\"kw\">Increase the initial breadth of queries</b> sent to web search and document analysis to reduce the probability of missing relevant information.","vi":"<b class=\"kw\">Tăng độ rộng ban đầu của các truy vấn</b> gửi tới tìm kiếm web và phân tích tài liệu để giảm khả năng bỏ sót thông tin liên quan."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Coordinator chịu trách nhiệm <b>đánh giá chất lượng và độ đầy đủ</b> của kết quả. Khi synthesis báo còn câu hỏi chưa có lời giải, coordinator nên <b>đánh giá khoảng trống</b>, <b>ủy thác lại</b> cho web search và document analysis với truy vấn nhắm đúng các chủ đề con còn thiếu, rồi gọi synthesis lần nữa trước khi sinh báo cáo. Vòng lặp “đánh giá → ủy thác lại” giữ đúng mô hình hub-and-spoke và trực tiếp cải thiện độ phủ.","elim":["<b>A.</b> Ghi chú hạn chế giúp minh bạch nhưng không cải thiện độ đầy đủ của nghiên cứu — đúng điều đề bài yêu cầu.","<b>B.</b> Cho synthesis agent tự tìm web vượt ra ngoài chuyên môn của nó, phá vỡ phân vai và luồng điều phối qua coordinator (mọi giao tiếp nên đi qua coordinator).","<b>D.</b> Mở rộng truy vấn ban đầu là đoán trước; không đảm bảo phủ các chủ đề con cụ thể bị thiếu và tăng chi phí cho mọi lần chạy."]},"cite":"Hướng dẫn ôn tập — §3.3 Hub-and-Spoke: Coordinator và Subagent; Lĩnh vực 1.2"},{"id":"t1q112","n":112,"topic":1,"type":"mcq","stem":{"en":"Your documents (query) tool returns results as &quot;<b class=\"kw\">Found 3 documents</b>: <b class=\"kw\">Q2 Budget Proposal, Q2 Budget Forecast</b>, Annual Review&quot;. You want the agent to document (4, multi) and doc (24, multi). What return format would best enable these <b class=\"kw\">multi-step workflows</b>?","vi":"Tool documents (query) của bạn trả về kết quả dạng &quot;<b class=\"kw\">Found 3 documents</b>: <b class=\"kw\">Q2 Budget Proposal, Q2 Budget Forecast</b>, Annual Review&quot;. Bạn muốn agent document (4, multi) và doc (24, multi). Định dạng trả về nào sẽ hỗ trợ tốt nhất cho các <b class=\"kw\">workflow nhiều bước</b> này?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Structured data</b> containing <b class=\"kw\">document IDs and metadata</b> for each result.","vi":"<b class=\"kw\">Dữ liệu có cấu trúc</b> chứa <b class=\"kw\">ID tài liệu và metadata</b> cho mỗi kết quả."}},{"k":"B","t":{"en":"<b class=\"kw\">URLs</b> that users can click to <b class=\"kw\">open the document in their browser</b>.","vi":"<b class=\"kw\">Các URL</b> mà người dùng có thể nhấp vào để <b class=\"kw\">mở tài liệu trong trình duyệt</b>."}},{"k":"C","t":{"en":"More detailed <b class=\"kw\">human-readable descriptions</b> including the <b class=\"kw\">size and authors</b>.","vi":"Các <b class=\"kw\">mô tả dễ đọc cho con người</b>, chi tiết hơn, bao gồm <b class=\"kw\">kích thước và tác giả</b>."}},{"k":"D","t":{"en":"A <b class=\"kw\">JSON array</b> of <b class=\"kw\">document titles</b> extracted from the search results.","vi":"Một <b class=\"kw\">mảng JSON</b> các <b class=\"kw\">tiêu đề tài liệu</b> được trích xuất từ kết quả tìm kiếm."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Đầu ra hiện tại chỉ là chuỗi dễ đọc cho người, trong đó các tiêu đề còn gần giống nhau (“Q2 Budget Proposal”, “Q2 Budget Forecast”). Để agent thực hiện <b>workflow nhiều bước</b> (gọi tiếp các tool khác lên tài liệu cụ thể), tool cần trả về <b>dữ liệu có cấu trúc kèm ID tài liệu và metadata</b>. ID cho phép tham chiếu chính xác, không mơ hồ ở các lời gọi tiếp theo; metadata giúp chọn đúng tài liệu.","elim":["<b>B.</b> URL để người dùng nhấp vào phục vụ con người, không phải định danh để agent truyền cho các tool tiếp theo.","<b>C.</b> Mô tả dễ đọc chi tiết hơn vẫn là văn bản tự do, agent phải tự phân tích và vẫn không có định danh duy nhất.","<b>D.</b> Mảng tiêu đề chỉ là dạng JSON của cùng thông tin; tiêu đề không duy nhất, không ổn định và không đủ để tham chiếu chính xác."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q113","n":113,"topic":1,"type":"mcq","stem":{"en":"Your agent has access to <b class=\"kw\">50+ specialized API connectors</b> for different external services. As the connector library grew, tool selection accuracy dropped to 58%. You design a search_connectors(description) tool that finds matching connectors, but in testing agents frequently <b class=\"kw\">skip searching and call connectors directly</b> (often incorrectly), or search <b class=\"kw\">select wrong connectors</b> from the filtered results. How should you design the tool composition pattern to address <b class=\"kw\">both issues</b>?","vi":"Agent của bạn có quyền truy cập <b class=\"kw\">50+ API connector chuyên biệt</b> cho các dịch vụ bên ngoài khác nhau. Khi thư viện connector ngày càng lớn, độ chính xác của việc chọn tool giảm xuống còn 58%. Bạn thiết kế một tool search_connectors(description) để tìm các connector phù hợp, nhưng khi kiểm thử, các agent thường <b class=\"kw\">bỏ qua bước tìm kiếm và gọi trực tiếp các connector</b> (thường là sai), hoặc tìm kiếm <b class=\"kw\">chọn sai connector</b> từ các kết quả đã lọc. Bạn nên thiết kế pattern kết hợp tool (tool composition) như thế nào để giải quyết <b class=\"kw\">cả hai vấn đề</b>?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Enhance all connector descriptions</b> with detailed usage samples, edge cases, and input requirements. Add <b class=\"kw\">few-shot examples</b> showing the correct search-then-use workflow.","vi":"<b class=\"kw\">Bổ sung cho mô tả của tất cả các connector</b> các mẫu sử dụng chi tiết, các edge case và yêu cầu đầu vào. Thêm các <b class=\"kw\">ví dụ few-shot</b> thể hiện workflow đúng: tìm kiếm rồi mới sử dụng."}},{"k":"B","t":{"en":"Design a <b class=\"kw\">find_and_execute(description, params)</b> composite tool that searches and <b class=\"kw\">immediately executes</b> the best matching connector.","vi":"Thiết kế một tool tổng hợp <b class=\"kw\">find_and_execute(description, params)</b> vừa tìm kiếm vừa <b class=\"kw\">thực thi ngay</b> connector khớp nhất."}},{"k":"C","t":{"en":"Design connectors with <b class=\"kw\">built-in compatibility validation</b> that return <b class=\"kw\">descriptive errors</b> for mismatched requests.","vi":"Thiết kế các connector có sẵn cơ chế <b class=\"kw\">kiểm tra tương thích</b>, trả về <b class=\"kw\">lỗi mang tính mô tả</b> cho các request không khớp."}},{"k":"D","t":{"en":"Design search_connectors to <b class=\"kw\">dynamically add matched connectors</b> to the agent&#x27;s available tools. Connectors start unavailable and <b class=\"kw\">persist once discovered</b>.","vi":"Thiết kế search_connectors để <b class=\"kw\">tự động thêm các connector khớp</b> vào danh sách tool khả dụng của agent. Các connector ban đầu không khả dụng và <b class=\"kw\">được giữ lại một khi đã được phát hiện</b>."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Hai lỗi cùng nguồn gốc: quá nhiều tool hiển thị cùng lúc (50+), nên agent có thể bỏ qua bước tìm kiếm và gọi trực tiếp. Thiết kế để <b>connector ban đầu không khả dụng</b> và chỉ được <b>thêm động vào bộ tool</b> sau khi <code>search_connectors</code> tìm thấy làm cho việc tìm kiếm trở thành <b>bắt buộc về mặt cấu trúc</b> (không thể gọi thẳng). Đồng thời agent chỉ chọn trong tập nhỏ đã lọc, nâng độ chính xác lựa chọn; connector đã khám phá được giữ lại để dùng tiếp.","elim":["<b>A.</b> Mô tả chi tiết và few-shot chỉ là hướng dẫn mềm; agent vẫn thấy toàn bộ 50+ connector và vẫn có thể bỏ qua bước tìm kiếm, còn mô tả dài làm tăng context.","<b>B.</b> Tool gộp tìm-và-chạy tự động thực thi “kết quả khớp nhất” mà agent không được xem xét, nên lỗi chọn sai connector bị đẩy thành hành động sai ngay lập tức.","<b>C.</b> Validation trả lỗi chỉ phát hiện lỗi sau khi gọi sai, không ngăn agent bỏ qua tìm kiếm hay chọn sai, và tốn lượt."]},"cite":"Hướng dẫn ôn tập — §2.3 Tham số tool_choice; Lĩnh vực 2.3"},{"id":"t1q114","n":114,"topic":1,"type":"mcq","stem":{"en":"Your publish article tool calls an external CMS API that occasionally returns <b class=\"kw\">transient errors (network timeouts, 503s)</b> and <b class=\"kw\">non-transient errors</b> (403 permission denied, 422 validation failure). Currently, every error is returned directly to the agent, which leads to the agent <b class=\"kw\">retrying non-transient errors</b> and wasting turns on failures that will never succeed. How should you <b class=\"kw\">partition error-handling responsibility</b> between the tool implementation and the agent?","vi":"Tool publish article của bạn gọi một API CMS bên ngoài, API này thỉnh thoảng trả về <b class=\"kw\">lỗi tạm thời (network timeout, 503)</b> và <b class=\"kw\">lỗi không tạm thời</b> (403 permission denied, 422 validation failure). Hiện tại, mọi lỗi đều được trả trực tiếp về agent, dẫn đến việc agent <b class=\"kw\">retry các lỗi không tạm thời</b> và lãng phí lượt cho những lỗi sẽ không bao giờ thành công. Bạn nên <b class=\"kw\">phân chia trách nhiệm xử lý lỗi</b> giữa phần triển khai tool và agent như thế nào?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Surface all errors</b> to the agent immediately with detailed context, and <b class=\"kw\">let the agent decide</b> which errors to retry and how many times-keeping the tool implementation stateless and simple.","vi":"<b class=\"kw\">Đưa tất cả lỗi lên agent</b> ngay lập tức với context chi tiết, và <b class=\"kw\">để agent quyết định</b> retry lỗi nào và bao nhiêu lần — giữ cho phần triển khai tool phi trạng thái và đơn giản."}},{"k":"B","t":{"en":"<b class=\"kw\">Handle transient errors</b> (timeouts, 503s) with automatic retries inside the tool implementation, and <b class=\"kw\">surface non-transient errors</b> (permission denied, validation fallures) to the agent with descriptive messages so it can take corrective action.","vi":"<b class=\"kw\">Xử lý các lỗi tạm thời</b> (timeout, 503) bằng retry tự động bên trong phần triển khai tool, và <b class=\"kw\">đưa các lỗi không tạm thời</b> (permission denied, validation failure) lên agent với thông báo mang tính mô tả để agent có thể thực hiện hành động khắc phục."}},{"k":"C","t":{"en":"<b class=\"kw\">Handle all errors inside the tool</b>: Implement retries with exponential backoff for <b class=\"kw\">every error type</b>, and only surface a failure to the agent after a fixed number of retry attempts have been exhausted.","vi":"<b class=\"kw\">Xử lý mọi lỗi bên trong tool</b>: triển khai retry với exponential backoff cho <b class=\"kw\">mọi loại lỗi</b>, và chỉ đưa lỗi lên agent sau khi đã hết một số lần retry cố định."}},{"k":"D","t":{"en":"Implement a <b class=\"kw\">universal error handler</b> that catches all exceptions and returns a generic <b class=\"kw\">&quot;tool unavailable- try again later&quot;</b> message, shielding the agent from error complexity.","vi":"Triển khai một <b class=\"kw\">bộ xử lý lỗi chung</b> bắt mọi exception và trả về thông báo chung chung <b class=\"kw\">&quot;tool unavailable- try again later&quot;</b>, che chắn agent khỏi sự phức tạp của lỗi."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Phân chia trách nhiệm theo <b>loại lỗi</b>: lỗi tạm thời (timeout, 503) thường tự khỏi khi thử lại nên <b>tool tự retry</b> — phục hồi cục bộ, agent không tốn lượt. Lỗi không tạm thời (403, 422) <b>không bao giờ thành công khi retry</b> và cần thay đổi đầu vào hoặc quyết định khác, nên <b>trả về agent kèm thông báo mô tả</b> để nó có hành động khắc phục (sửa dữ liệu, xin quyền, báo người dùng).","elim":["<b>A.</b> Đẩy mọi lỗi lên agent chính là hiện trạng gây lãng phí lượt; agent phải xử lý cả lỗi tạm thời mà tool có thể tự giải quyết.","<b>C.</b> Retry mọi loại lỗi sẽ retry vô ích cả 403/422 và trì hoãn việc báo lỗi cần khắc phục cho agent.","<b>D.</b> Thông báo chung chung “try again later” che giấu loại lỗi, khiến agent tiếp tục retry lỗi quyền/validation — đúng anti-pattern."]},"cite":"Hướng dẫn ôn tập — §10.1 Các nhóm lỗi; Lĩnh vực 2.2"},{"id":"t1q115","n":115,"topic":1,"type":"mcq","stem":{"en":"Your scheduling agent uses get_available_slots(date, provider_id) to retrieve open appointment times, then book_appointment(provider_id, slot_time, patient_id) to reserve a slot. tickets show that 15% of booking attempts fall with &quot;<b class=\"kw\">slot no longer available</b>&quot; because <b class=\"kw\">another user booked the slot</b> <b class=\"kw\">between the availability check and the booking call</b>. How should you refactor these tools?","vi":"Agent lập lịch của bạn dùng get_available_slots(date, provider_id) để lấy các khung giờ hẹn còn trống, sau đó dùng book_appointment(provider_id, slot_time, patient_id) để đặt một khung giờ. Các ticket cho thấy 15% lượt đặt lịch thất bại với &quot;<b class=\"kw\">slot no longer available</b>&quot; vì <b class=\"kw\">một người dùng khác đã đặt khung giờ đó</b> trong khoảng thời gian <b class=\"kw\">giữa bước kiểm tra lịch trống và lệnh gọi đặt lịch</b>. Bạn nên refactor các tool này như thế nào?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Combine both tools</b> into a single find_and_book_appointment that <b class=\"kw\">atomically checks availability and books</b>, returning either the confirmed booking or available alternatives.","vi":"<b class=\"kw\">Gộp cả hai tool</b> thành một tool find_and_book_appointment duy nhất, kiểm tra lịch trống và đặt lịch <b class=\"kw\">một cách nguyên tử (atomic)</b>, trả về hoặc lịch hẹn đã được xác nhận hoặc các khung giờ thay thế còn trống."}},{"k":"B","t":{"en":"Add a <b class=\"kw\">hold_slot(provider_id, slot_time) tool</b> that creates a <b class=\"kw\">60 second temporary reservation</b>, requiring the agent to call it between checking availability and booking.","vi":"Thêm một <b class=\"kw\">tool hold_slot(provider_id, slot_time)</b> tạo một lượt <b class=\"kw\">giữ chỗ tạm thời trong 60 giây</b>, yêu cầu agent gọi nó giữa bước kiểm tra lịch trống và bước đặt lịch."}},{"k":"C","t":{"en":"Modify book_appointment to return <b class=\"kw\">detailed failure information</b> including currently <b class=\"kw\">available alternative slots</b> when the requested slot is unavailable, enabling the agent to retry with a different time.","vi":"Sửa book_appointment để trả về <b class=\"kw\">thông tin thất bại chi tiết</b>, bao gồm các <b class=\"kw\">khung giờ thay thế</b> hiện còn trống khi khung giờ được yêu cầu không còn, cho phép agent retry với thời gian khác."}},{"k":"D","t":{"en":"<b class=\"kw\">Keep both tools</b> but add <b class=\"kw\">retry logic to the agent&#x27;s system prompt</b>, instructing it to call get_available_slots again and select a different time if booking fails.","vi":"<b class=\"kw\">Giữ nguyên cả hai tool</b> nhưng thêm <b class=\"kw\">logic retry vào system prompt của agent</b>, hướng dẫn nó gọi lại get_available_slots và chọn thời gian khác nếu đặt lịch thất bại."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> 15% thất bại là do <b>race condition</b> giữa bước kiểm tra và bước đặt chỗ (khoảng thời gian giữa hai lời gọi tool tách rời). Gộp thành <code>find_and_book_appointment</code> thực hiện <b>kiểm tra và đặt chỗ một cách nguyên tử</b> sẽ loại bỏ khoảng hở đó; khi slot không còn, tool trả về các phương án thay thế để agent đề xuất ngay.","elim":["<b>B.</b> <code>hold_slot</code> chỉ chuyển khoảng hở sang giữa bước kiểm tra và bước giữ chỗ (vẫn có race), thêm một lời gọi và phụ thuộc agent nhớ gọi đúng thứ tự trong 60 giây.","<b>C.</b> Trả về phương án thay thế khi thất bại giúp phục hồi nhưng không ngăn được thất bại; lần retry vẫn có thể gặp lại race condition.","<b>D.</b> Logic retry trong system prompt chỉ xử lý sau khi thất bại, tốn thêm lượt và vẫn giữ nguyên nguyên nhân gốc."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q116","n":116,"topic":1,"type":"mcq","stem":{"en":"Production monitoring shows your search_catalog tool fails 12% of the time: 8% are network timeouts that <b class=\"kw\">succeed when immediately retried</b>, while 4% are query syntax errors from malformed user-provided filters that <b class=\"kw\">never succeed regardless of retry attempts</b>. Currently, both error types are <b class=\"kw\">returned to the agent identically</b>, causing it to waste turns retrying syntax errors and telling users to &quot;<b class=\"kw\">try again later</b>&quot; for timeouts. How should you modify the tool&#x27;s error handling?","vi":"Giám sát production cho thấy tool search_catalog của bạn thất bại 12% số lần: 8% là timeout mạng sẽ <b class=\"kw\">thành công khi retry ngay lập tức</b>, trong khi 4% là lỗi cú pháp truy vấn do bộ lọc người dùng cung cấp bị sai định dạng, <b class=\"kw\">không bao giờ thành công dù retry bao nhiêu lần</b>. Hiện tại, cả hai loại lỗi đều được <b class=\"kw\">trả về agent giống hệt nhau</b>, khiến agent lãng phí lượt để retry lỗi cú pháp và bảo người dùng &quot;<b class=\"kw\">thử lại sau</b>&quot; đối với lỗi timeout. Bạn nên sửa đổi cách xử lý lỗi của tool như thế nào?"},"options":[{"k":"A","t":{"en":"Return all errors with a <b class=\"kw\">retryable boolean flag</b> and <b class=\"kw\">error type details</b>.","vi":"Trả về mọi lỗi kèm một <b class=\"kw\">cờ boolean retryable</b> và <b class=\"kw\">chi tiết về loại lỗi</b>."}},{"k":"B","t":{"en":"Implement <b class=\"kw\">automatic retry with backoff</b> for network timeouts inside the tool; <b class=\"kw\">return syntax errors immediately</b> with parameter validation details.","vi":"Triển khai <b class=\"kw\">retry tự động có backoff</b> cho timeout mạng bên trong tool; <b class=\"kw\">trả về lỗi cú pháp ngay lập tức</b> kèm chi tiết kiểm tra hợp lệ tham số."}},{"k":"C","t":{"en":"Apply <b class=\"kw\">exponential backoff retry logic</b> to <b class=\"kw\">all errors uniformly</b>, returning a generic &quot;service temporarily unavailable&quot; message after max retries are exhausted.","vi":"Áp dụng <b class=\"kw\">logic retry với exponential backoff</b> <b class=\"kw\">đồng loạt cho mọi lỗi</b>, trả về thông báo chung chung &quot;service temporarily unavailable&quot; sau khi đã hết số lần retry tối đa."}},{"k":"D","t":{"en":"Add <b class=\"kw\">few-shot examples</b> to your system prompt demonstrating how to <b class=\"kw\">distinguish network errors from syntax errors</b> and handle each case appropriately.","vi":"Thêm các <b class=\"kw\">ví dụ few-shot</b> vào system prompt minh họa cách <b class=\"kw\">phân biệt lỗi mạng với lỗi cú pháp</b> và xử lý từng trường hợp một cách phù hợp."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Hai loại lỗi cần xử lý khác nhau: timeout mạng (8%) <b>thành công khi retry ngay</b>, nên tool nên <b>tự retry có backoff</b> và agent không cần biết; lỗi cú pháp truy vấn (4%) <b>không bao giờ thành công khi retry</b>, nên phải trả về ngay kèm <b>chi tiết validation tham số</b> để agent sửa bộ lọc hoặc giải thích cho người dùng. Cách này loại bỏ cả hai hành vi sai: retry lỗi cú pháp và bảo người dùng “thử lại sau” khi timeout.","elim":["<b>A.</b> Cờ <code>retryable</code> là cải thiện nhưng vẫn đẩy timeout lên agent, bắt agent tốn lượt retry thứ mà tool có thể tự xử lý minh bạch.","<b>C.</b> Retry mọi lỗi sẽ retry vô ích lỗi cú pháp, rồi trả về thông báo chung chung che mất chi tiết agent cần để sửa truy vấn.","<b>D.</b> Few-shot vô ích khi cả hai loại lỗi đang được trả về giống hệt nhau — agent không có tín hiệu nào để phân biệt."]},"cite":"Hướng dẫn ôn tập — §10.1 Các nhóm lỗi; Lĩnh vực 2.2"},{"id":"t1q117","n":117,"topic":1,"type":"mcq","stem":{"en":"Your document extraction tool uses ML models to extract invoice fields (vendor, amount, date). The models return <b class=\"kw\">confidence scores (0.0-1.0)</b> for each extracted field. In production, you observe: (1) the agent <b class=\"kw\">proceeds with low-confidence extractions</b> that are incorrect 23% of the time, and (2) the agent requests <b class=\"kw\">unnecessary human review</b> for 31% of extractions that were actually correct. How should you <b class=\"kw\">restructure the tool&#x27;s output</b>?","vi":"Tool trích xuất tài liệu của bạn dùng các mô hình ML để trích xuất các trường của hóa đơn (nhà cung cấp, số tiền, ngày). Các mô hình trả về <b class=\"kw\">confidence score (0.0-1.0)</b> cho mỗi trường được trích xuất. Trong production, bạn quan sát thấy: (1) agent vẫn <b class=\"kw\">tiếp tục với các kết quả trích xuất có confidence thấp</b>, vốn sai tới 23% số lần, và (2) agent yêu cầu <b class=\"kw\">review của con người một cách không cần thiết</b> cho 31% các kết quả trích xuất thực ra là đúng. Bạn nên <b class=\"kw\">tái cấu trúc đầu ra của tool</b> như thế nào?"},"options":[{"k":"A","t":{"en":"Return fields with confidence scores, plus a <b class=\"kw\">requires_review boolean</b> computed using your tested confidence thresholds, along with a <b class=\"kw\">review_reasons array</b> explaining which fields triggered review.","vi":"Trả về các trường kèm confidence score, cộng thêm một <b class=\"kw\">boolean requires_review</b> được tính bằng các ngưỡng confidence mà bạn đã kiểm thử, cùng với một <b class=\"kw\">mảng review_reasons</b> giải thích những trường nào đã kích hoạt việc review."}},{"k":"B","t":{"en":"Return fields organized into <b class=\"kw\">verified and needs_verification objects</b> based on <b class=\"kw\">confidence thresholds</b>.","vi":"Trả về các trường được tổ chức thành <b class=\"kw\">hai đối tượng verified và needs_verification</b> dựa trên các <b class=\"kw\">ngưỡng confidence</b>."}},{"k":"C","t":{"en":"Return fields with their <b class=\"kw\">raw confidence scores</b> and add detailed <b class=\"kw\">few-shot examples</b> to your system prompt demonstrating how to interpret different confidence ranges and when to request human review.","vi":"Trả về các trường kèm <b class=\"kw\">confidence score thô</b> và thêm các <b class=\"kw\">ví dụ few-shot</b> chi tiết vào system prompt minh họa cách diễn giải các khoảng confidence khác nhau và khi nào cần yêu cầu review của con người."}},{"k":"D","t":{"en":"Compute an <b class=\"kw\">aggregate extraction quality score</b> across all fields and return it alongside the extracted values. Include a <b class=\"kw\">text summary</b> describing the overall extraction reliability.","vi":"Tính một <b class=\"kw\">điểm chất lượng trích xuất tổng hợp</b> trên tất cả các trường và trả về cùng với các giá trị đã trích xuất. Kèm theo một <b class=\"kw\">bản tóm tắt dạng văn bản</b> mô tả độ tin cậy tổng thể của việc trích xuất."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Cả hai lỗi (tiếp tục với trích xuất sai và yêu cầu review thừa) đều do agent <b>tự diễn giải điểm confidence thô</b> không nhất quán. Tool nên trả về điểm confidence kèm <b>cờ <code>requires_review</code> tính từ ngưỡng đã được kiểm định</b> bằng dữ liệu có nhãn, cộng mảng <code>review_reasons</code> nêu trường nào gây cờ. Quyết định trở nên tất định và được hiệu chỉnh, còn lý do giúp agent/con người biết cần kiểm tra trường nào.","elim":["<b>B.</b> Chia thành <code>verified</code>/<code>needs_verification</code> có dựa trên ngưỡng nhưng bỏ đi điểm confidence và lý do, nên agent và người review thiếu thông tin vì sao trường bị đánh dấu.","<b>C.</b> Few-shot về cách diễn giải điểm thô vẫn để mô hình tự phán đoán theo xác suất — chính nguồn gốc của sự không nhất quán hiện tại.","<b>D.</b> Điểm tổng hợp che giấu trường cụ thể bị yếu (một trường sai có thể bị trung bình hóa đi), và tóm tắt văn bản không phải tín hiệu quyết định rõ ràng."]},"cite":"Hướng dẫn ôn tập — §9.4 Hiệu chỉnh độ tin cậy và giám sát của con người; Lĩnh vực 5.5"},{"id":"t1q118","n":118,"topic":1,"type":"mcq","stem":{"en":"Your agent includes an update_game_score tool that accepts game_date (string), home_team (string), and away_team (string) parameters. Production logs reveal recurring issues: the agent uses <b class=\"kw\">team nicknames instead of official names</b>, applies <b class=\"kw\">inconsistent date formats</b>, and selects the <b class=\"kw\">wrong game when teams have rematches</b> in the same season. What <b class=\"kw\">tool interface change</b> would effectively prevent these errors?","vi":"Agent của bạn có một tool update_game_score nhận các tham số game_date (string), home_team (string) và away_team (string). Log production cho thấy các vấn đề lặp lại: agent dùng <b class=\"kw\">biệt danh của đội thay vì tên chính thức</b>, áp dụng <b class=\"kw\">định dạng ngày không nhất quán</b>, và <b class=\"kw\">chọn sai trận đấu khi các đội có trận tái đấu</b> trong cùng một mùa giải. <b class=\"kw\">Thay đổi giao diện tool</b> nào sẽ ngăn chặn hiệu quả các lỗi này?"},"options":[{"k":"A","t":{"en":"Add a <b class=\"kw\">season parameter</b> to disambiguate rematches, and add a <b class=\"kw\">confirm_before_update flag</b> that returns the resolved game details for the agent to verify before the score is committed.","vi":"Thêm <b class=\"kw\">tham số season</b> để phân biệt các trận tái đấu, và thêm <b class=\"kw\">cờ confirm_before_update</b> trả về thông tin chi tiết của trận đấu đã được xác định để agent xác minh trước khi điểm số được ghi nhận."}},{"k":"B","t":{"en":"Add <b class=\"kw\">enum constraints</b> listing valid team names for both team parameters, and add a <b class=\"kw\">regex pattern enforcing ISO 8601</b> format for the date parameter.","vi":"Thêm <b class=\"kw\">ràng buộc enum</b> liệt kê các tên đội hợp lệ cho cả hai tham số đội, và thêm một <b class=\"kw\">mẫu regex bắt buộc định dạng ISO 8601</b> cho tham số ngày."}},{"k":"C","t":{"en":"Add <b class=\"kw\">detailed examples</b> to the <b class=\"kw\">tool description</b> showing the required date format and complete list of official team names.","vi":"Thêm các <b class=\"kw\">ví dụ chi tiết</b> vào <b class=\"kw\">mô tả tool</b> thể hiện định dạng ngày bắt buộc và danh sách đầy đủ tên chính thức của các đội."}},{"k":"D","t":{"en":"Replace the three parameters with a <b class=\"kw\">single game_id parameter</b> and a separate <b class=\"kw\">search_games lookup tool</b> that returns matching game IDs.","vi":"Thay ba tham số bằng một <b class=\"kw\">tham số game_id duy nhất</b> và một <b class=\"kw\">tool tra cứu search_games</b> riêng trả về các ID trận đấu khớp."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Ba lỗi (biệt danh đội, định dạng ngày không thống nhất, chọn sai trận khi tái đấu) đều bắt nguồn từ việc <b>xác định trận đấu bằng các trường tự do</b>. Thay bằng <b>một tham số <code>game_id</code></b> cùng tool tra cứu <code>search_games</code> riêng tách việc tìm kiếm (mờ, chấp nhận tên/ngày gần đúng) khỏi việc cập nhật (cần định danh chính xác, duy nhất). Agent tra cứu, xác định đúng trận rồi cập nhật bằng ID — loại bỏ mơ hồ ngay ở giao diện.","elim":["<b>A.</b> Thêm <code>season</code> không phân biệt được hai trận tái đấu trong cùng mùa giải, và không xử lý vấn đề biệt danh hay định dạng ngày; cờ xác nhận chỉ thêm bước.","<b>B.</b> Enum và regex sửa được tên đội và định dạng ngày, nhưng schema chỉ ràng buộc định dạng: agent vẫn có thể điền ngày của trận tái đấu khác, và không có gì xác minh tổ hợp ngày/đội trỏ đúng trận cần cập nhật.","<b>C.</b> Ví dụ trong mô tả chỉ là hướng dẫn mềm, không ràng buộc; và vẫn không có cơ chế phân biệt trận tái đấu."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q119","n":119,"topic":1,"type":"mcq","stem":{"en":"You&#x27;ve configured the system so that all four subagents have access to the <b class=\"kw\">complete set of 18 tools</b>. During testing, agents frequently call tools <b class=\"kw\">outside their specialization</b>—the synthesis agent attempts web searches, and the report generator tries to analyze documents. What is the <b class=\"kw\">primary cause</b> of this poor tool selection behavior?","vi":"Bạn đã cấu hình hệ thống sao cho cả bốn subagent đều có quyền truy cập vào <b class=\"kw\">toàn bộ 18 tool</b>. Trong quá trình kiểm thử, các agent thường xuyên gọi các tool <b class=\"kw\">nằm ngoài chuyên môn của mình</b> — agent tổng hợp cố gắng tìm kiếm web, và agent tạo báo cáo cố gắng phân tích tài liệu. <b class=\"kw\">Nguyên nhân chính</b> của hành vi chọn tool kém này là gì?"},"options":[{"k":"A","t":{"en":"The coordinator <b class=\"kw\">cannot track which capabilities</b> each subagent has, leading to <b class=\"kw\">misrouted tasks</b>.","vi":"Coordinator <b class=\"kw\">không thể theo dõi khả năng</b> của từng subagent, dẫn đến việc <b class=\"kw\">định tuyến tác vụ sai</b>."}},{"k":"B","t":{"en":"The agents&#x27; <b class=\"kw\">role descriptions</b> in their system prompts <b class=\"kw\">conflict</b> with having access to tools outside that role.","vi":"<b class=\"kw\">Mô tả vai trò</b> của các agent trong system prompt của chúng <b class=\"kw\">mâu thuẫn</b> với việc chúng có quyền truy cập vào các tool nằm ngoài vai trò đó."}},{"k":"C","t":{"en":"Choosing from <b class=\"kw\">18 tools instead of 4-5</b> relevant ones increases <b class=\"kw\">decision complexity</b> beyond reliable selection thresholds.","vi":"Việc phải chọn từ <b class=\"kw\">18 tool thay vì 4-5</b> tool liên quan làm tăng <b class=\"kw\">độ phức tạp của quyết định</b> vượt quá ngưỡng có thể lựa chọn một cách đáng tin cậy."}},{"k":"D","t":{"en":"The tool definitions <b class=\"kw\">consume too much context window</b> space, leaving <b class=\"kw\">insufficient room for task content</b>.","vi":"Các định nghĩa tool <b class=\"kw\">chiếm quá nhiều không gian context window</b>, <b class=\"kw\">không còn đủ chỗ</b> cho nội dung tác vụ."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Theo hướng dẫn, cho mỗi agent <b>quá nhiều tool (18 thay vì 4–5)</b> làm <b>giảm độ tin cậy lựa chọn tool</b>: độ phức tạp quyết định tăng vượt ngưỡng chọn đáng tin cậy, và agent có tool ngoài chuyên môn có xu hướng dùng sai. Đó là nguyên nhân chính khiến synthesis agent gọi web search hay report generator phân tích tài liệu. Cách sửa là giới hạn bộ tool theo vai trò.","elim":["<b>A.</b> Vấn đề nằm ở việc chính subagent chọn sai tool, không phải coordinator định tuyến sai tác vụ.","<b>B.</b> Mô tả vai trò không “xung đột” với việc có tool; nguyên nhân là số lượng lựa chọn quá lớn, không phải mâu thuẫn giữa prompt và quyền truy cập.","<b>D.</b> 18 định nghĩa tool chiếm context không đáng kể so với context window; triệu chứng là chọn sai tool, không phải thiếu chỗ cho nội dung tác vụ."]},"cite":"Hướng dẫn ôn tập — Lĩnh vực 2.3 Phân bổ Tool Giữa các Agent và Cấu hình tool_choice"},{"id":"t1q120","n":120,"topic":1,"type":"mcq","stem":{"en":"You&#x27;ve documented API error handling conventions in a CLAUDE.md file at your project root, specifying that endpoint handlers should use a custom ApiError class. After several sessions, you notice Claude Code <b class=\"kw\">sometimes follows these conventions</b> and sometimes uses generic try/catch blocks with string messages. The inconsistency appears <b class=\"kw\">random across different coding sessions</b>. What&#x27;s the most efficient <b class=\"kw\">first diagnostic step</b>?","vi":"Bạn đã ghi lại các quy ước xử lý lỗi API trong một file CLAUDE.md ở thư mục gốc dự án, quy định rằng các endpoint handler phải dùng một lớp ApiError tùy chỉnh. Sau vài session, bạn nhận thấy Claude Code <b class=\"kw\">đôi khi tuân theo các quy ước này</b> và đôi khi lại dùng các khối try/catch chung chung với thông báo dạng chuỗi. Sự không nhất quán có vẻ <b class=\"kw\">ngẫu nhiên giữa các session lập trình khác nhau</b>. <b class=\"kw\">Bước chẩn đoán đầu tiên</b> hiệu quả nhất là gì?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Run /memory</b> to check which <b class=\"kw\">memory files are loaded</b> and verify your CLAUDE.md is included.","vi":"<b class=\"kw\">Chạy /memory</b> để kiểm tra những <b class=\"kw\">memory file nào đang được tải</b> và xác minh CLAUDE.md của bạn có nằm trong đó."}},{"k":"B","t":{"en":"Create <b class=\"kw\">path-specific rules</b> in claude/rules/handlers.md with <b class=\"kw\">YAML frontmatter</b> scoping the error handling instructions to your API handler files.","vi":"Tạo các <b class=\"kw\">quy tắc theo đường dẫn cụ thể</b> trong claude/rules/handlers.md với <b class=\"kw\">YAML frontmatter</b> giới hạn phạm vi các chỉ dẫn xử lý lỗi vào các file API handler của bạn."}},{"k":"C","t":{"en":"Add <b class=\"kw\">more detailed code examples</b> to your CLAUDE.md showing the exact <b class=\"kw\">ApiError usage pattern</b> for different endpoint types.","vi":"Thêm các <b class=\"kw\">ví dụ code chi tiết hơn</b> vào CLAUDE.md, thể hiện chính xác <b class=\"kw\">pattern sử dụng ApiError</b> cho các loại endpoint khác nhau."}},{"k":"D","t":{"en":"Search for <b class=\"kw\">conflicting instructions</b> in <b class=\"kw\">~/.claude/CLAUDE.md</b> or ~/.claude/rules/ that might override your project conventions.","vi":"Tìm các <b class=\"kw\">chỉ dẫn mâu thuẫn</b> trong <b class=\"kw\">~/.claude/CLAUDE.md</b> hoặc ~/.claude/rules/ có thể ghi đè các quy ước dự án của bạn."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Hành vi không nhất quán giữa các session gợi ý rằng <b>CLAUDE.md có thể không được nạp</b> ổn định (ví dụ khởi chạy từ thư mục khác). Bước chẩn đoán đầu tiên, rẻ và nhanh nhất là chạy <b><code>/memory</code></b> để xem các file memory nào đang được nạp và xác nhận CLAUDE.md của dự án có trong đó — kiểm tra giả thuyết trước khi thay đổi cấu hình.","elim":["<b>B.</b> Tạo rules theo đường dẫn là một giải pháp, không phải bước chẩn đoán; nếu nguyên nhân là file không được nạp thì vẫn chưa xác định được.","<b>C.</b> Thêm ví dụ vào CLAUDE.md là vô ích nếu chính file đó không được nạp trong các session thất bại; đây là sửa khi chưa chẩn đoán.","<b>D.</b> Tìm thủ công chỉ thị xung đột ở cấp người dùng là một giả thuyết hẹp hơn; <code>/memory</code> đã cho thấy toàn bộ các file đang được nạp (bao gồm cả cấp người dùng) trong một bước."]},"cite":"Hướng dẫn ôn tập — §5.8 Lệnh /memory; Lĩnh vực 3.1"},{"id":"t1q121","n":121,"topic":1,"type":"mcq","stem":{"en":"Your CI pipeline performs security-focused code reviews on approximately 50 PRs daily, currently costing $150/day using the synchronous API. <b class=\"kw\">Reviews are non-blocking</b>—developers merge after tests pass and <b class=\"kw\">address findings in follow-up commits</b>. You&#x27;re evaluating the Message Batches API for its <b class=\"kw\">50% cost reduction</b>. What <b class=\"kw\">factor most determines</b> whether batch processing is appropriate for this use case?","vi":"Pipeline CI của bạn thực hiện review code tập trung vào bảo mật cho khoảng 50 PR mỗi ngày, hiện tốn $150/ngày khi dùng API đồng bộ. Các bản review <b class=\"kw\">không mang tính chặn</b> — lập trình viên merge sau khi test đạt và <b class=\"kw\">xử lý các phát hiện trong các commit tiếp theo</b>. Bạn đang đánh giá Message Batches API vì nó <b class=\"kw\">giảm 50% chi phí</b>. <b class=\"kw\">Yếu tố nào quyết định nhiều nhất</b> việc xử lý batch có phù hợp với trường hợp sử dụng này hay không?"},"options":[{"k":"A","t":{"en":"Whether you can structure each review as a <b class=\"kw\">single request</b> <b class=\"kw\">without multi-turn refinement</b>.","vi":"Liệu bạn có thể cấu trúc mỗi bản review thành <b class=\"kw\">một request duy nhất</b> mà <b class=\"kw\">không cần tinh chỉnh qua nhiều lượt</b> hay không."}},{"k":"B","t":{"en":"Whether your <b class=\"kw\">result processing</b> can handle reviews arriving in a <b class=\"kw\">different order than submitted</b>.","vi":"Liệu <b class=\"kw\">phần xử lý kết quả</b> của bạn có thể xử lý việc các bản review đến theo <b class=\"kw\">thứ tự khác với thứ tự gửi</b> hay không."}},{"k":"C","t":{"en":"Whether reducing <b class=\"kw\">per-review latency</b> from 30-60 seconds to <b class=\"kw\">near-instant</b> matters for your workflow.","vi":"Liệu việc giảm <b class=\"kw\">độ trễ của mỗi bản review</b> từ 30-60 giây xuống <b class=\"kw\">gần như tức thì</b> có quan trọng đối với workflow của bạn hay không."}},{"k":"D","t":{"en":"Whether review feedback arriving <b class=\"kw\">up to 24 hours</b> after PR creation <b class=\"kw\">remains actionable</b>.","vi":"Liệu phản hồi review đến <b class=\"kw\">muộn tới 24 giờ</b> sau khi tạo PR có <b class=\"kw\">còn hữu ích để hành động</b> hay không."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Message Batches API giảm 50% chi phí nhưng <b>thời gian xử lý lên tới 24 giờ</b> và <b>không có SLA độ trễ</b>. Vì vậy yếu tố quyết định là liệu <b>phản hồi review đến muộn tới 24 giờ sau khi tạo PR có còn hữu ích</b> hay không. Review ở đây không chặn merge và lỗi được xử lý ở commit tiếp theo, nên đây là câu hỏi then chốt để đánh giá tính phù hợp.","elim":["<b>A.</b> Cấu trúc thành một request đơn lượt là ràng buộc kỹ thuật (Batch không hỗ trợ tool nhiều lượt) nhưng một review bảo mật vốn đã là một request đơn; không phải yếu tố quyết định.","<b>B.</b> Thứ tự kết quả được xử lý dễ dàng bằng <code>custom_id</code>; đây là chi tiết triển khai đơn giản, không phải yếu tố quyết định.","<b>C.</b> Batch API không giảm độ trễ mà ngược lại làm tăng độ trễ; tiền đề của phương án này sai."]},"cite":"Hướng dẫn ôn tập — §7.2 Khi nào dùng Batch API so với Synchronous API; Lĩnh vực 4.5"},{"id":"t1q122","n":122,"topic":1,"type":"mcq","stem":{"en":"After a 40-minute session helping plan a dinner party, the conversation has grown to 78,000 tokens. The history includes: (1) the user mentioning a guest has a <b class=\"kw\">severe shellfish allergy</b>, (2) measurements for <b class=\"kw\">scaling recipes to 8 servings</b>, (3) the user&#x27;s clarification that &quot;room temperature butter&quot; <b class=\"kw\">means 68°F in their kitchen</b>, and (4) <b class=\"kw\">general back-and-forth about meal timing</b> and presentation. You need to implement context management before the window limit is reached. What approach best balances information preservation with token reduction?","vi":"Sau một session 40 phút giúp lên kế hoạch cho một bữa tiệc tối, cuộc hội thoại đã tăng lên 78,000 token. Lịch sử bao gồm: (1) người dùng đề cập một vị khách bị <b class=\"kw\">dị ứng hải sản có vỏ nghiêm trọng</b>, (2) các định lượng để <b class=\"kw\">điều chỉnh công thức cho 8 phần ăn</b>, (3) lời làm rõ của người dùng rằng &quot;bơ ở nhiệt độ phòng&quot; <b class=\"kw\">nghĩa là 68°F trong bếp của họ</b>, và (4) <b class=\"kw\">các trao đổi chung qua lại</b> về thời gian dọn món và cách trình bày. Bạn cần triển khai quản lý context trước khi đạt đến giới hạn của context window. Cách tiếp cận nào cân bằng tốt nhất giữa việc bảo toàn thông tin và giảm token?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Store the full conversation externally</b> and use <b class=\"kw\">semantic search</b> to retrieve relevant portions for each turn, loading only matching segments into context.","vi":"<b class=\"kw\">Lưu toàn bộ cuộc hội thoại ở bên ngoài</b> và dùng <b class=\"kw\">tìm kiếm ngữ nghĩa</b> để truy xuất các phần liên quan cho mỗi lượt, chỉ tải các đoạn khớp vào context."}},{"k":"B","t":{"en":"Implement a <b class=\"kw\">sliding window</b> retaining only the <b class=\"kw\">most recent 20,000 tokens</b> relying on users to re-state important information when relevant.","vi":"Triển khai một <b class=\"kw\">cửa sổ trượt</b> chỉ giữ lại <b class=\"kw\">20,000 token gần nhất</b>, dựa vào người dùng tự nhắc lại thông tin quan trọng khi cần."}},{"k":"C","t":{"en":"<b class=\"kw\">Summarize the entire conversation history</b> into a <b class=\"kw\">concise summary</b> capturing main topics discussed, then append new messages going forward.","vi":"<b class=\"kw\">Tóm tắt toàn bộ lịch sử hội thoại</b> thành một <b class=\"kw\">bản tóm tắt ngắn gọn</b> nắm bắt các chủ đề chính đã thảo luận, sau đó nối thêm các tin nhắn mới từ đó trở đi."}},{"k":"D","t":{"en":"Extract <b class=\"kw\">critical structured data</b> (allergies, serving counts, user-defined terms) into a compact reference section, summarize general discussion, and <b class=\"kw\">retain recent exchanges verbatim</b>.","vi":"Trích xuất <b class=\"kw\">dữ liệu có cấu trúc quan trọng</b> (dị ứng, số phần ăn, các thuật ngữ do người dùng định nghĩa) vào một phần tham chiếu gọn nhẹ, tóm tắt phần thảo luận chung, và <b class=\"kw\">giữ nguyên văn các trao đổi gần đây</b>."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Các loại thông tin cần cách xử lý khác nhau. Dữ liệu <b>then chốt, chính xác</b> — dị ứng hải sản nghiêm trọng (an toàn), số khẩu phần, định nghĩa riêng “bơ nhiệt độ phòng = 68°F” — phải được <b>trích xuất thành khối tham chiếu có cấu trúc</b> để không bao giờ bị tóm tắt làm mất. Thảo luận chung (thời gian, trình bày) có thể tóm tắt, và các trao đổi gần đây giữ nguyên văn để giữ mạch hội thoại. Đây là cân bằng tối ưu giữa bảo toàn thông tin và giảm token.","elim":["<b>A.</b> Tìm kiếm ngữ nghĩa chỉ nạp đoạn khớp với lượt hiện tại; thông tin như dị ứng có thể không được truy xuất khi câu hỏi không nhắc rõ tới nó — rủi ro an toàn.","<b>B.</b> Cửa sổ trượt 20.000 token sẽ đánh rơi dị ứng và định nghĩa riêng nêu từ sớm; dựa vào người dùng nhắc lại là không đáng tin cậy.","<b>C.</b> Tóm tắt toàn bộ thành “các chủ đề chính” chính là rủi ro tóm tắt tiệm tiến: số liệu (8 khẩu phần, 68°F) và chi tiết quan trọng dễ bị mất."]},"cite":"Hướng dẫn ôn tập — §11.1 Trích xuất các Sự kiện ra một Block Riêng; Lĩnh vực 5.1"},{"id":"t1q123","n":123,"topic":1,"type":"mcq","stem":{"en":"Your resource allocation tool returns a <b class=\"kw\">simple acknowledgment message</b> after provisioning is requested. Users frequently approve allocations and immediately ask &quot;<b class=\"kw\">how much did that cost?</b>&quot; or &quot;<b class=\"kw\">which project was that?</b>&quot; - indicating they <b class=\"kw\">confirmed without understanding the request</b>. What tool design change would most effectively address this?","vi":"Tool phân bổ tài nguyên của bạn trả về một <b class=\"kw\">thông báo xác nhận đơn giản</b> sau khi yêu cầu cấp phát (provisioning) được gửi. Người dùng thường xuyên phê duyệt các lượt phân bổ rồi ngay lập tức hỏi &quot;<b class=\"kw\">cái đó tốn bao nhiêu tiền?</b>&quot; hoặc &quot;<b class=\"kw\">đó là dự án nào vậy?</b>&quot; - cho thấy họ đã <b class=\"kw\">xác nhận mà không hiểu yêu cầu</b>. Thay đổi thiết kế tool nào sẽ giải quyết vấn đề này hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"Return <b class=\"kw\">structured data</b> including <b class=\"kw\">cost estimate</b>, target project, resource specifications, and impact summary in the tool response","vi":"Trả về <b class=\"kw\">dữ liệu có cấu trúc</b> bao gồm <b class=\"kw\">ước tính chi phí</b>, dự án đích, thông số tài nguyên và tóm tắt tác động trong phản hồi của tool"}},{"k":"B","t":{"en":"Implement a <b class=\"kw\">60-second hold</b> before execution completes, allowing users time to review pending allocations and <b class=\"kw\">cancel if needed</b>","vi":"Triển khai <b class=\"kw\">thời gian chờ 60 giây</b> trước khi việc thực thi hoàn tất, cho phép người dùng có thời gian xem lại các lượt phân bổ đang chờ và <b class=\"kw\">hủy nếu cần</b>"}},{"k":"C","t":{"en":"Add a <b class=\"kw\">user_acknowledged: boolean parameter</b> that must be set true, with instructions for the agent to only set it after the user <b class=\"kw\">explicitly confirms</b> they reviewed the details","vi":"Thêm một tham số <b class=\"kw\">user_acknowledged: boolean</b> bắt buộc phải được đặt thành true, kèm chỉ dẫn để agent chỉ đặt nó sau khi người dùng <b class=\"kw\">xác nhận rõ ràng</b> rằng họ đã xem lại các chi tiết"}},{"k":"D","t":{"en":"Add a <b class=\"kw\">detail_level parameter</b> with options <b class=\"kw\">&quot;minimal&quot; or &quot;comprehensive&quot;</b> that controls how much context the agent presents in confirmations","vi":"Thêm một <b class=\"kw\">tham số detail_level</b> với các tùy chọn <b class=\"kw\">&quot;minimal&quot; hoặc &quot;comprehensive&quot;</b> để kiểm soát lượng context mà agent trình bày trong các xác nhận"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Người dùng phê duyệt mà không hiểu vì tool chỉ trả về một xác nhận đơn giản, nên agent <b>không có thông tin để trình bày</b>. Tool nên trả về <b>dữ liệu có cấu trúc</b>: ước tính chi phí, dự án đích, thông số tài nguyên và tóm tắt tác động. Agent nhờ đó có đủ chi tiết để giải thích rõ cho người dùng, và các câu hỏi “tốn bao nhiêu?” hay “dự án nào?” được trả lời ngay trong luồng.","elim":["<b>B.</b> Thời gian chờ 60 giây không cung cấp thêm thông tin; người dùng vẫn không biết chi phí hay dự án để quyết định hủy.","<b>C.</b> Cờ <code>user_acknowledged</code> chỉ là thủ tục — người dùng vẫn xác nhận mà không có chi tiết, và agent tự đặt cờ nên không có bảo đảm thật.","<b>D.</b> Tham số <code>detail_level</code> thêm độ phức tạp và có thể chọn “minimal”; vấn đề gốc là tool không trả về dữ liệu chi tiết để trình bày."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q124","n":124,"topic":1,"type":"mcq","stem":{"en":"Your search products tool queries an external catalog API that returns paginated results (50 items per request). Production logs show queries <b class=\"kw\">frequently match 200+ products</b>, and the design that <b class=\"kw\">auto-fetches all pages</b> causes <b class=\"kw\">15-20 second delays</b>. How should you redesign the pagination handling?","vi":"Tool search products của bạn truy vấn một API danh mục sản phẩm bên ngoài, API này trả về kết quả phân trang (50 mục mỗi request). Log production cho thấy các truy vấn thường <b class=\"kw\">khớp với 200+ sản phẩm</b>, và thiết kế <b class=\"kw\">tự động tải tất cả các trang</b> gây ra <b class=\"kw\">độ trễ 15-20 giây</b>. Bạn nên thiết kế lại cách xử lý phân trang như thế nào?"},"options":[{"k":"A","t":{"en":"Return the <b class=\"kw\">first page</b> with total match count and <b class=\"kw\">cursor for additional pages</b>.","vi":"Trả về <b class=\"kw\">trang đầu tiên</b> kèm tổng số kết quả khớp và <b class=\"kw\">cursor cho các trang tiếp theo</b>."}},{"k":"B","t":{"en":"Implement <b class=\"kw\">server-side relevance ranking</b> and return only the <b class=\"kw\">top 50 most relevant items</b>.","vi":"Triển khai <b class=\"kw\">xếp hạng mức độ liên quan phía server</b> và chỉ trả về <b class=\"kw\">50 mục liên quan nhất</b>."}},{"k":"C","t":{"en":"Create <b class=\"kw\">separate search products</b> and <b class=\"kw\">fetch more results tools</b> for pagination.","vi":"Tạo <b class=\"kw\">hai tool riêng biệt search products</b> và <b class=\"kw\">fetch more results</b> để phân trang."}},{"k":"D","t":{"en":"Add a <b class=\"kw\">max pages parameter</b> (default: 2) that controls how many pages are <b class=\"kw\">fetched internally</b>.","vi":"Thêm <b class=\"kw\">tham số max pages</b> (mặc định: 2) để kiểm soát số trang được <b class=\"kw\">tải nội bộ</b>."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Vấn đề là tool tự động kéo <b>toàn bộ</b> các trang (200+ sản phẩm = 4–5 lần gọi API tuần tự) gây trễ 15–20 giây, trong khi agent thường chỉ cần vài kết quả đầu. Thiết kế đúng là <b>phân trang theo cursor</b>: trả về trang đầu tiên kèm <b>tổng số kết quả khớp</b> và <b>cursor</b> cho trang tiếp theo. Tổng số giúp agent biết còn bao nhiêu dữ liệu, còn cursor cho phép agent <b>tự quyết định</b> có cần lấy thêm hay không — độ trễ chỉ phát sinh khi thực sự cần. Đây là mẫu chuẩn cho tool trả về tập kết quả lớn: kết quả gọn, giàu tín hiệu và có đường để mở rộng.","elim":["<b>B.</b> Chỉ trả 50 mục “liên quan nhất” làm mất hẳn khả năng truy cập các kết quả còn lại và agent không biết còn bao nhiêu kết quả bị cắt; việc xây ranking phía server cũng vượt quá phạm vi bài toán độ trễ.","<b>C.</b> Tách thành hai tool riêng làm tăng số tool và tạo chồng lấp ngữ nghĩa không cần thiết; cùng mục tiêu đạt được gọn hơn bằng một tham số cursor trên chính tool search.","<b>D.</b> Giới hạn cứng <code>max_pages</code> = 2 vẫn auto-fetch 2 trang (độ trễ giảm nhưng không biến mất) và cắt im lặng dữ liệu phía sau mà agent không hề biết còn kết quả khác."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q125","n":125,"topic":1,"type":"mcq","stem":{"en":"Your MCP server implements a check_availability tool that queries an external calendar API. During testing, you encounter three error conditions: (1) the tool is called with a <b class=\"kw\">malformed request, missing the required user_email parameter</b> (2) the <b class=\"kw\">calendar API returns a 404</b> because the specified user doesn&#x27;t exist in the calendar system (3) the <b class=\"kw\">calendar API returns a 503</b> because the service is temporarily unavailable. How should each error be reported according to MCP&#x27;s error handling design?","vi":"MCP server của bạn triển khai tool check_availability truy vấn một API lịch bên ngoài. Trong quá trình kiểm thử, bạn gặp ba tình huống lỗi: (1) tool được gọi với một <b class=\"kw\">request sai định dạng, thiếu tham số bắt buộc user_email</b> (2) <b class=\"kw\">API lịch trả về 404</b> vì người dùng được chỉ định không tồn tại trong hệ thống lịch (3) <b class=\"kw\">API lịch trả về 503</b> vì dịch vụ tạm thời không khả dụng. Theo thiết kế xử lý lỗi của MCP, mỗi lỗi nên được báo cáo như thế nào?"},"options":[{"k":"A","t":{"en":"Report <b class=\"kw\">error 1 as a JSON-RPC</b> protocol error, report <b class=\"kw\">errors 2 and 3 as tool results</b> with isError: true","vi":"Báo cáo <b class=\"kw\">lỗi 1 dưới dạng lỗi giao thức JSON-RPC</b>, báo cáo <b class=\"kw\">lỗi 2 và 3 dưới dạng kết quả tool</b> với isError: true"}},{"k":"B","t":{"en":"Report <b class=\"kw\">errors 1 and 2 as JSON-RPC</b> protocol errors, report <b class=\"kw\">error 3 as a tool result</b> with isError: true","vi":"Báo cáo <b class=\"kw\">lỗi 1 và 2 dưới dạng lỗi giao thức JSON-RPC</b>, báo cáo <b class=\"kw\">lỗi 3 dưới dạng kết quả tool</b> với isError: true"}},{"k":"C","t":{"en":"Report <b class=\"kw\">all three as tool results</b> with isError: true","vi":"Báo cáo <b class=\"kw\">cả ba dưới dạng kết quả tool</b> với isError: true"}},{"k":"D","t":{"en":"Report <b class=\"kw\">all three as JSON-RPC protocol errors</b>.","vi":"Báo cáo <b class=\"kw\">cả ba dưới dạng lỗi giao thức JSON-RPC</b>."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> MCP phân biệt hai loại lỗi: <b>lỗi giao thức (JSON-RPC error)</b> dành cho yêu cầu không hợp lệ ở tầng giao thức — tool không tồn tại, tham số sai/thiếu theo inputSchema — và <b>lỗi thực thi tool</b> được trả về như một kết quả bình thường với <code>isError: true</code>. Lỗi (1) thiếu tham số bắt buộc <code>user_email</code> là request sai định dạng ⇒ JSON-RPC error. Lỗi (2) 404 và (3) 503 xảy ra <b>trong lúc tool thực thi</b> khi gọi API bên ngoài ⇒ trả về tool result với <code>isError: true</code>, để model <b>nhìn thấy</b> lỗi và quyết định (báo người dùng sai email, hoặc retry vì 503 là lỗi tạm thời).","elim":["<b>B.</b> Lỗi 404 “user không tồn tại” là kết quả nghiệp vụ phát sinh khi tool đã chạy, không phải lỗi giao thức; đẩy nó thành JSON-RPC error khiến model không nhận được thông tin để phản hồi người dùng hợp lý.","<b>C.</b> Request thiếu tham số bắt buộc vi phạm schema ở tầng giao thức, nên theo thiết kế MCP được báo bằng JSON-RPC error chứ không phải tool result.","<b>D.</b> Lỗi API 404/503 là lỗi thực thi; báo chúng thành JSON-RPC error làm model mất ngữ cảnh lỗi (loại lỗi, có thể retry hay không) cần cho việc phục hồi."]},"cite":"Hướng dẫn ôn tập — §4.4 Cờ isError trong MCP; Lĩnh vực 2.2"},{"id":"t1q126","n":126,"topic":1,"type":"mcq","stem":{"en":"Your system has been running for 3 weeks and human reviewers have corrected 847 extractions. Analysis reveals a <b class=\"kw\">recurring pattern</b>: when recipes use <b class=\"kw\">informal measurements</b> like &quot;a handful&quot; or &quot;a splash,&quot; the model either <b class=\"kw\">invents specific amounts or leaves fields empty</b>—accounting for 23% of all corrections. How should you use this feedback to improve extraction accuracy?","vi":"Hệ thống của bạn đã chạy được 3 tuần và những người review (con người) đã sửa 847 kết quả trích xuất. Phân tích cho thấy một <b class=\"kw\">mẫu lặp lại</b>: khi công thức nấu ăn dùng các <b class=\"kw\">đơn vị đo không chính thức</b> như &quot;một nắm&quot; hoặc &quot;một chút&quot;, model hoặc <b class=\"kw\">tự bịa ra lượng cụ thể hoặc để trống trường</b>—chiếm 23% tổng số lần sửa. Bạn nên sử dụng phản hồi này như thế nào để cải thiện độ chính xác trích xuất?"},"options":[{"k":"A","t":{"en":"Add <b class=\"kw\">few-shot examples</b> to your prompt demonstrating correct handling of informal measurements— <b class=\"kw\">extracting them verbatim</b> rather than converting or omitting them.","vi":"Thêm các <b class=\"kw\">ví dụ few-shot</b> vào prompt minh họa cách xử lý đúng các đơn vị đo không chính thức— <b class=\"kw\">trích xuất nguyên văn</b> thay vì chuyển đổi hoặc bỏ qua chúng."}},{"k":"B","t":{"en":"<b class=\"kw\">Fine-tune the model</b> on the <b class=\"kw\">847 corrected extractions</b>.","vi":"<b class=\"kw\">Fine-tune model</b> trên <b class=\"kw\">847 kết quả trích xuất đã được sửa</b>."}},{"k":"C","t":{"en":"Implement a <b class=\"kw\">post-processing layer</b> that uses <b class=\"kw\">pattern matching</b> to detect informal measurement phrases in source text and automatically populate values when the extraction is empty.","vi":"Triển khai một <b class=\"kw\">lớp hậu xử lý</b> dùng <b class=\"kw\">so khớp mẫu (pattern matching)</b> để phát hiện các cụm từ đo lường không chính thức trong văn bản nguồn và tự động điền giá trị khi kết quả trích xuất bị trống."}},{"k":"D","t":{"en":"Update your <b class=\"kw\">JSON schema</b> to add a <b class=\"kw\">&quot;measurement_type&quot; enum field</b> (precise/informal).","vi":"Cập nhật <b class=\"kw\">JSON schema</b> để thêm một <b class=\"kw\">trường enum &quot;measurement_type&quot;</b> (precise/informal)."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Phân tích phản hồi đã chỉ ra một <b>mẫu lỗi lặp lại cụ thể</b> (23% số sửa): với đơn vị đo không chính thức như “a handful”, model hoặc bịa ra số lượng hoặc bỏ trống. Cách khắc phục trực tiếp nhất là thêm <b>few-shot examples</b> minh họa đúng hành vi mong muốn — <b>trích xuất nguyên văn</b> (“a handful”) thay vì quy đổi hay bỏ qua. Few-shot là kỹ thuật hiệu quả nhất để truyền đạt cách xử lý các trường hợp mơ hồ/edge case một cách nhất quán, và có thể triển khai ngay mà không cần huấn luyện lại.","elim":["<b>B.</b> Fine-tune trên 847 mẫu tốn kém, chậm, khó cập nhật, trong khi lỗi là một mẫu cụ thể có thể sửa ngay bằng prompt; đây là giải pháp quá nặng so với vấn đề.","<b>C.</b> Hậu xử lý bằng pattern matching chỉ vá triệu chứng (điền giá trị khi trường rỗng), không sửa được trường hợp model đã bịa số cụ thể, và regex dễ bỏ sót cách diễn đạt mới.","<b>D.</b> Thêm enum <code>measurement_type</code> chỉ gắn nhãn loại đo, không hướng dẫn model phải ghi giá trị thế nào — model vẫn có thể bịa số hoặc bỏ trống."]},"cite":"Hướng dẫn ôn tập — §6.1 Few-shot Prompting; Lĩnh vực 4.2"},{"id":"t1q127","n":127,"topic":1,"type":"mcq","stem":{"en":"&quot;You&#x27;re the Lead Data Scientist/Engineer on a critical project. Something is not completely right with technical details or the data, and it negative impacts expected outputs. They need to <b class=\"kw\">independently develop</b> <b class=\"kw\">both approaches</b> to evaluation data... How do you manage this scenario?&quot;","vi":"&quot;Bạn là Lead Data Scientist/Engineer trong một dự án quan trọng. Có điều gì đó chưa hoàn toàn đúng với các chi tiết kỹ thuật hoặc dữ liệu, và nó tác động tiêu cực đến các đầu ra mong đợi. Họ cần <b class=\"kw\">phát triển độc lập</b> <b class=\"kw\">cả hai cách tiếp cận</b> đối với dữ liệu đánh giá... Bạn xử lý tình huống này như thế nào?&quot;"},"options":[{"k":"A","t":{"en":"Export the analysis session&#x27;s <b class=\"kw\">key findings to a file</b>, then create <b class=\"kw\">two new sessions</b> that reference this file.","vi":"Xuất các <b class=\"kw\">phát hiện chính của session phân tích ra một file</b>, sau đó tạo <b class=\"kw\">hai session mới</b> tham chiếu đến file này."}},{"k":"B","t":{"en":"<b class=\"kw\">Continue in the original session</b>, developing end-to-end tests first, then snapshot tests <b class=\"kw\">sequentially</b>.","vi":"<b class=\"kw\">Tiếp tục trong session ban đầu</b>, phát triển các test end-to-end trước, sau đó đến các snapshot test, <b class=\"kw\">theo tuần tự</b>."}},{"k":"C","t":{"en":"Resume the analysis session with <b class=\"kw\">fork_session enabled</b>, creating a <b class=\"kw\">separate branch</b> for each testing strategy.","vi":"Resume session phân tích với <b class=\"kw\">fork_session được bật</b>, tạo một <b class=\"kw\">nhánh riêng</b> cho mỗi chiến lược kiểm thử."}},{"k":"D","t":{"en":"Start <b class=\"kw\">two fresh sessions</b>, having each <b class=\"kw\">re-read the relevant source files</b> before beginning.","vi":"Bắt đầu <b class=\"kw\">hai session mới hoàn toàn</b>, cho mỗi session <b class=\"kw\">đọc lại các file mã nguồn liên quan</b> trước khi bắt đầu."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Tình huống: một session phân tích đã tích lũy hiểu biết sâu về codebase/dữ liệu, giờ cần phát triển <b>hai hướng kiểm thử độc lập</b>. <code>fork_session</code> khi resume tạo ra <b>các nhánh mới kế thừa toàn bộ context</b> của session phân tích, nhưng sau đó mỗi nhánh tiến triển độc lập, không làm “nhiễm” lẫn nhau. Nhờ vậy không phải phân tích lại từ đầu và hai chiến lược không ảnh hưởng nhau — đúng mục đích của forking: khám phá các phương án thay thế từ một baseline chung.","elim":["<b>A.</b> Xuất findings ra file rồi mở session mới chỉ giữ được bản tóm tắt, mất đi phần lớn context chi tiết đã tích lũy; <code>fork_session</code> giữ trọn context mà không cần bước trung gian.","<b>B.</b> Làm tuần tự trong cùng session khiến hai hướng không còn độc lập — cách tiếp cận đầu ảnh hưởng tới cách thứ hai và context ngày càng phình to.","<b>D.</b> Hai session mới phải đọc lại file từ đầu, lãng phí thời gian/token và đánh mất các phát hiện phân tích đã có."]},"cite":"Hướng dẫn ôn tập — §5.10 fork_session và Quản lý Session; Lĩnh vực 1.7"},{"id":"t1q128","n":128,"topic":1,"type":"mcq","stem":{"en":"Your automated reviewer uses a <b class=\"kw\">single prompt</b> covering security issues, API design, and business logic correctness. Your evaluation suite shows strong recall findings (82%) but poor recall for business logic edge cases in quiz scoring (34%). When you add few-shot examples of logic bugs to the prompt, <b class=\"kw\">logic recall is 41%</b> but <b class=\"kw\">API design recall drops to 68%</b>. How should you address this trade-off to improve detection <b class=\"kw\">across both categories</b>?","vi":"Trình review tự động của bạn dùng <b class=\"kw\">một prompt duy nhất</b> bao quát các vấn đề bảo mật, thiết kế API và tính đúng đắn của logic nghiệp vụ. Bộ đánh giá của bạn cho thấy recall cao cho các phát hiện (82%) nhưng recall kém cho các edge case logic nghiệp vụ trong phần tính điểm bài quiz (34%). Khi bạn thêm các ví dụ few-shot về bug logic vào prompt, <b class=\"kw\">recall logic đạt 41%</b> nhưng <b class=\"kw\">recall thiết kế API giảm xuống 68%</b>. Bạn nên xử lý sự đánh đổi này như thế nào để cải thiện khả năng phát hiện <b class=\"kw\">ở cả hai loại</b>?"},"options":[{"k":"A","t":{"en":"Replace the few-shot examples with a <b class=\"kw\">detailed checklist</b> of <b class=\"kw\">specific logic edge cases</b> to verify, such as division-by-zero in score calculation or grading thresholds.","vi":"Thay các ví dụ few-shot bằng một <b class=\"kw\">checklist chi tiết</b> gồm các <b class=\"kw\">edge case logic cụ thể</b> cần kiểm tra, chẳng hạn như chia cho 0 khi tính điểm hoặc các ngưỡng chấm điểm."}},{"k":"B","t":{"en":"Split the review into <b class=\"kw\">separate focused prompts</b> - one for security and API design, another for business logic - each with dedicated examples, then <b class=\"kw\">combine findings</b> before posting.","vi":"Tách việc review thành các <b class=\"kw\">prompt tập trung riêng biệt</b> - một cho bảo mật và thiết kế API, một cho logic nghiệp
