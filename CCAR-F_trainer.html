yển sang dùng Grep</b> để tìm kiếm các tên hàm cụ thể <b class=\"kw\">thay vì đọc toàn bộ file</b>, giảm lượng nội dung được nạp vào context cho phần khám phá còn lại."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Đây là dấu hiệu <b>suy giảm context</b> sau khi đọc nhiều file. Giải pháp là <b>ủy thác cho subagent</b> các câu hỏi có phạm vi rõ (tìm test file, truy vết refund flow): subagent đọc nhiều file trong context riêng và chỉ trả về kết luận ngắn, còn agent chính <b>giữ hiểu biết tổng thể và điều phối</b>. Cách này bảo vệ context chính trong khi vẫn đi hết 45 file.","elim":["<b>A.</b> <code>/clear</code> rồi đọc lại file quan trọng vẫn nạp lại toàn bộ nội dung file vào context chính, nên sẽ sớm gặp lại đúng vấn đề.","<b>C.</b> Xóa sạch context và chỉ dựa vào báo cáo tóm tắt làm mất nhiều chi tiết, và phần còn lại vẫn được đọc trong cùng một context dễ đầy.","<b>D.</b> Grep giúp tìm kiếm có mục tiêu nhưng không đủ để truy vết luồng thanh toán phức tạp; agent vẫn phải đọc code và context chính vẫn tiếp tục phình ra."]},"cite":"Hướng dẫn ôn tập — §11.5 Ủy quyền cho Subagent để Bảo vệ Context; Lĩnh vực 5.4"},{"id":"t1q63","n":63,"topic":1,"type":"mcq","stem":{"en":"The coordinator agent has <b class=\"kw\">AgentDefinitions configured</b> for all four specialized subagents, each with appropriate descriptions, prompts, and tool restrictions. During testing, you notice the coordinator correctly reasons about when to delegate — it generates messages like &quot;<b class=\"kw\">I&#x27;ll ask the web search agent</b> to find sources on this topic&quot; — but <b class=\"kw\">no subagent execution ever occurs</b>. The coordinator then proceeds as if the delegation happened and continues with incomplete information. <b class=\"kw\">Logs show no errors</b>. What is the most likely cause?","vi":"Coordinator agent đã được <b class=\"kw\">cấu hình AgentDefinitions</b> cho cả bốn subagent chuyên biệt, mỗi subagent có mô tả, prompt và giới hạn tool phù hợp. Trong quá trình kiểm thử, bạn nhận thấy coordinator suy luận đúng về thời điểm cần ủy quyền (delegate) — nó tạo ra các tin nhắn như &quot;<b class=\"kw\">Tôi sẽ yêu cầu agent tìm kiếm web</b> tìm nguồn về chủ đề này&quot; — nhưng <b class=\"kw\">không có subagent nào thực sự được thực thi</b>. Sau đó coordinator tiếp tục như thể việc ủy quyền đã diễn ra và làm việc tiếp với thông tin không đầy đủ. <b class=\"kw\">Log không cho thấy lỗi nào</b>. Nguyên nhân có khả năng nhất là gì?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Subagent context isolation</b> means task descriptions from the coordinator don&#x27;t automatically reach subagents; you need to configure <b class=\"kw\">explicit context forwarding</b> in ClaudeAgentOptions.","vi":"<b class=\"kw\">Sự cô lập context của subagent</b> khiến mô tả tác vụ từ coordinator không tự động đến được các subagent; bạn cần cấu hình việc <b class=\"kw\">chuyển tiếp context một cách tường minh</b> trong ClaudeAgentOptions."}},{"k":"B","t":{"en":"The AgentDefinitions are configured correctly, but the coordinator&#x27;s <b class=\"kw\">system prompt doesn&#x27;t explicitly list</b> the <b class=\"kw\">available subagent types</b>, preventing the model from knowing they can be invoked.","vi":"Các AgentDefinitions được cấu hình đúng, nhưng <b class=\"kw\">system prompt của coordinator không liệt kê rõ</b> <b class=\"kw\">các loại subagent hiện có</b>, khiến model không biết rằng chúng có thể được gọi."}},{"k":"C","t":{"en":"The coordinator&#x27;s <b class=\"kw\">max_tokens setting is too low</b>, causing the Task tool invocation to be <b class=\"kw\">truncated</b> before the subagent type parameter can be specified.","vi":"Thiết lập <b class=\"kw\">max_tokens của coordinator quá thấp</b>, khiến lệnh gọi Task tool <b class=\"kw\">bị cắt cụt</b> trước khi kịp chỉ định tham số loại subagent."}},{"k":"D","t":{"en":"The coordinator&#x27;s <b class=\"kw\">allowedTools configuration doesn&#x27;t include &quot;Task&quot;</b>, so while it can reason about delegation, it <b class=\"kw\">cannot invoke the tool</b> required to spawn subagents.","vi":"Cấu hình <b class=\"kw\">allowedTools của coordinator không bao gồm &quot;Task&quot;</b>, vì vậy dù có thể suy luận về việc ủy quyền, nó <b class=\"kw\">không thể gọi tool</b> cần thiết để khởi tạo subagent."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Subagent chỉ được spawn qua tool <code>Task</code>; <code>allowedTools</code> của coordinator <b>bắt buộc phải có <code>\"Task\"</code></b>. Thiếu nó, coordinator vẫn <b>suy luận</b> và viết ra ý định ủy thác nhưng <b>không thể phát lệnh gọi tool</b>, nên không có subagent nào chạy và cũng không có lỗi: khớp đúng triệu chứng trong đề.","elim":["<b>A.</b> Context isolation khiến subagent không thừa hưởng lịch sử của cha, nhưng nếu đó là lỗi thì subagent vẫn chạy (chỉ thiếu context); ở đây subagent hoàn toàn không chạy. Cũng không có cấu hình “context forwarding” như vậy.","<b>B.</b> AgentDefinition đã cung cấp mô tả subagent cho mô hình; coordinator rõ ràng biết các subagent tồn tại vì nó nói muốn giao việc cho web search agent.","<b>C.</b> <code>max_tokens</code> quá thấp sẽ cắt ngang phản hồi với <code>stop_reason: \"max_tokens\"</code> một cách nhất quán, không phải hành vi coordinator chạy tiếp bình thường như đề mô tả."]},"cite":"Hướng dẫn ôn tập — §3.4 Tool Task để Sinh ra Subagent; Lĩnh vực 1.3"},{"id":"t1q64","n":64,"topic":1,"type":"mcq","stem":{"en":"In production, you observe that <b class=\"kw\">simple fact-checking queries</b> (e.g., &quot;What year was the Paris Climate Agreement signed?&quot;) <b class=\"kw\">traverse all four subagents sequentially</b>, consuming 40+ seconds and significant tokens per query. <b class=\"kw\">Complex comparative research</b> benefits from the full pipeline. Your query distribution is <b class=\"kw\">diverse and evolving</b> as users discover new applications. What&#x27;s the most effective approach to optimize for varying query complexity?","vi":"Trong production, bạn quan sát thấy các <b class=\"kw\">truy vấn kiểm chứng dữ kiện đơn giản</b> (ví dụ: &quot;Hiệp định Khí hậu Paris được ký vào năm nào?&quot;) <b class=\"kw\">đi tuần tự qua cả bốn subagent</b>, tiêu tốn 40+ giây và một lượng token đáng kể cho mỗi truy vấn. Các <b class=\"kw\">nghiên cứu so sánh phức tạp</b> thì được hưởng lợi từ toàn bộ pipeline. Phân bố truy vấn của bạn <b class=\"kw\">đa dạng và liên tục thay đổi</b> khi người dùng khám phá các ứng dụng mới. Cách tiếp cận nào hiệu quả nhất để tối ưu cho các truy vấn có độ phức tạp khác nhau?"},"options":[{"k":"A","t":{"en":"Have the coordinator <b class=\"kw\">analyze each query</b> and <b class=\"kw\">dynamically decide which subagents</b> to invoke based on its assessment of query requirements.","vi":"Để coordinator <b class=\"kw\">phân tích từng truy vấn</b> và <b class=\"kw\">quyết định một cách động</b> nên gọi những subagent nào dựa trên đánh giá của nó về yêu cầu của truy vấn."}},{"k":"B","t":{"en":"Train a <b class=\"kw\">query complexity classifier</b> on labeled historical data to predict optimal subagent combinations, <b class=\"kw\">retraining periodically</b> as query patterns evolve.","vi":"Huấn luyện một <b class=\"kw\">bộ phân loại độ phức tạp truy vấn</b> trên dữ liệu lịch sử đã gán nhãn để dự đoán tổ hợp subagent tối ưu, <b class=\"kw\">huấn luyện lại định kỳ</b> khi các mẫu truy vấn thay đổi."}},{"k":"C","t":{"en":"Create a <b class=\"kw\">fast-path for factual questions</b> that <b class=\"kw\">bypasses subagents entirely</b>, routing all other queries through the complete pipeline to ensure research thoroughness.","vi":"Tạo một <b class=\"kw\">đường tắt (fast-path)</b> cho các câu hỏi dữ kiện, <b class=\"kw\">bỏ qua hoàn toàn các subagent</b>, và định tuyến tất cả các truy vấn khác qua toàn bộ pipeline để đảm bảo nghiên cứu kỹ lưỡng."}},{"k":"D","t":{"en":"Implement <b class=\"kw\">pattern-based routing</b> that categorizes queries by structure (single-fact vs. comparative vs. analytical) and maps each category to a <b class=\"kw\">predefined subagent combination</b>.","vi":"Triển khai <b class=\"kw\">định tuyến dựa trên mẫu (pattern-based routing)</b>, phân loại truy vấn theo cấu trúc (một dữ kiện đơn lẻ vs. so sánh vs. phân tích) và ánh xạ mỗi loại tới một <b class=\"kw\">tổ hợp subagent được định nghĩa trước</b>."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Phân bố truy vấn <b>đa dạng và liên tục thay đổi</b>, nên cần một cơ chế thích ứng chứ không phải quy tắc cố định. Để <b>coordinator phân tích từng truy vấn và chọn động</b> các subagent cần thiết (câu hỏi factual có thể chỉ cần web search, nghiên cứu so sánh dùng full pipeline) tận dụng chính năng lực suy luận của LLM, đúng vai trò “lựa chọn subagent một cách động” của coordinator.","elim":["<b>B.</b> Classifier huấn luyện trên dữ liệu gán nhãn tốn công gán nhãn và phải huấn luyện lại liên tục, luôn đi sau sự thay đổi của phân bố truy vấn.","<b>C.</b> Fast-path nhị phân chỉ tách “factual” với “còn lại”; mọi truy vấn trung gian vẫn đi qua cả 4 subagent, không tối ưu cho độ phức tạp đa dạng.","<b>D.</b> Routing theo pattern với tổ hợp định sẵn dễ gãy khi người dùng phát hiện ứng dụng mới không khớp danh mục nào."]},"cite":"Hướng dẫn ôn tập — §8.2 Phân rã thích ứng động; Lĩnh vực 1.2"},{"id":"t1q65","n":65,"topic":1,"type":"mcq","stem":{"en":"Production logs reveal inconsistent error handling: when lookup_order fails, the agent sometimes <b class=\"kw\">retries 5+ times</b> (wasteful when the order ID doesn&#x27;t exist), sometimes escalates immediately (premature for temporary network issues), and sometimes asks users for clarification (inappropriate when the issue is a backend permission error). Investigation shows your MCP tool returns <b class=\"kw\">uniform error responses</b>: {&quot;isError&quot;: true, &quot;content&quot;: [{&quot;type&quot;: &quot;text&quot;, &quot;text&quot;: &quot;<b class=\"kw\">Operation failed</b>&quot;}]}. The agent <b class=\"kw\">cannot distinguish between error types</b>. What&#x27;s the most effective improvement?","vi":"Log production cho thấy việc xử lý lỗi không nhất quán: khi lookup_order thất bại, agent đôi khi <b class=\"kw\">retry 5+ lần</b> (lãng phí khi ID đơn hàng không tồn tại), đôi khi escalate ngay lập tức (quá sớm đối với sự cố mạng tạm thời), và đôi khi hỏi người dùng để làm rõ (không phù hợp khi vấn đề là lỗi phân quyền ở backend). Điều tra cho thấy MCP tool của bạn trả về các <b class=\"kw\">phản hồi lỗi giống hệt nhau</b>: {&quot;isError&quot;: true, &quot;content&quot;: [{&quot;type&quot;: &quot;text&quot;, &quot;text&quot;: &quot;<b class=\"kw\">Operation failed</b>&quot;}]}. Agent <b class=\"kw\">không thể phân biệt giữa các loại lỗi</b>. Cải tiến nào hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"Create an <b class=\"kw\">analyze_error MCP tool</b> the agent calls <b class=\"kw\">after any failure</b> to determine the error category and recommended action.","vi":"Tạo một <b class=\"kw\">MCP tool analyze_error</b> mà agent gọi <b class=\"kw\">sau bất kỳ lỗi nào</b> để xác định loại lỗi và hành động được khuyến nghị."}},{"k":"B","t":{"en":"Enhance error responses with <b class=\"kw\">structured metadata</b>: include errorCategory (transient/validation/permission), <b class=\"kw\">isRetryable boolean</b>, and a description of what caused the failure.","vi":"Bổ sung <b class=\"kw\">metadata có cấu trúc</b> vào phản hồi lỗi: bao gồm errorCategory (transient/validation/permission), <b class=\"kw\">boolean isRetryable</b>, và mô tả nguyên nhân gây ra lỗi."}},{"k":"C","t":{"en":"Add <b class=\"kw\">few-shot examples</b> to the system prompt demonstrating how to <b class=\"kw\">interpret error message patterns</b> and select appropriate responses for each.","vi":"Thêm <b class=\"kw\">ví dụ few-shot</b> vào system prompt minh họa cách <b class=\"kw\">diễn giải các mẫu thông báo lỗi</b> và chọn phản hồi phù hợp cho từng loại."}},{"k":"D","t":{"en":"Implement <b class=\"kw\">retry logic with exponential backoff</b> in your MCP server for all errors, returning to the agent only <b class=\"kw\">after retries are exhausted</b>.","vi":"Triển khai <b class=\"kw\">logic retry với exponential backoff</b> trong MCP server của bạn cho mọi lỗi, chỉ trả về cho agent <b class=\"kw\">sau khi đã hết số lần retry</b>."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Vấn đề gốc là mọi lỗi đều trả về “Operation failed”, nên agent không phân biệt được. Bổ sung <b>metadata lỗi có cấu trúc</b>: <code>errorCategory</code> (transient/validation/permission), <code>isRetryable</code> và mô tả nguyên nhân, cho agent đủ thông tin để <b>chọn hành động đúng</b>: retry lỗi tạm thời, hỏi lại khách khi ID sai, escalation khi lỗi quyền.","elim":["<b>A.</b> Tool <code>analyze_error</code> thêm một vòng gọi sau mỗi lỗi, và nó cũng không thể biết nguyên nhân nếu thông tin lỗi gốc chỉ là “Operation failed”.","<b>C.</b> Few-shot không giúp gì khi mọi lỗi có cùng thông điệp; không có mẫu nào để mô hình phân biệt.","<b>D.</b> Retry mọi lỗi phí thời gian với lỗi validation/permission không bao giờ thành công, và sau đó agent vẫn nhận lỗi chung chung."]},"cite":"Hướng dẫn ôn tập — §4.4 Cờ isError trong MCP; Lĩnh vực 2.2"},{"id":"t1q66","n":66,"topic":1,"type":"mcq","stem":{"en":"Users report that final reports sometimes <b class=\"kw\">lack depth on specific subtopics</b>. Investigation shows that the document analysis agent <b class=\"kw\">frequently identifies gaps</b>—for instance, noting &quot;the retrieved sources discuss API authentication but lack details on token refresh patterns&quot;—but under the <b class=\"kw\">current strict pipeline</b>, this insight <b class=\"kw\">isn&#x27;t actionable since search has already completed</b>. What&#x27;s the most effective architectural change?","vi":"Người dùng phản ánh rằng các báo cáo cuối cùng đôi khi <b class=\"kw\">thiếu chiều sâu về một số chủ đề con cụ thể</b>. Điều tra cho thấy agent phân tích tài liệu <b class=\"kw\">thường xuyên phát hiện ra các khoảng trống</b> (gap) — ví dụ, ghi chú rằng &quot;các nguồn đã truy xuất có thảo luận về xác thực API nhưng thiếu chi tiết về các mẫu làm mới token&quot; — nhưng với <b class=\"kw\">pipeline cứng nhắc hiện tại</b>, nhận định này <b class=\"kw\">không thể được hành động theo vì bước tìm kiếm đã hoàn tất</b>. Thay đổi kiến trúc nào hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"Have the synthesis agent attach <b class=\"kw\">confidence scores</b> to each section and flag areas with insufficient coverage for <b class=\"kw\">manual review</b>.","vi":"Để agent tổng hợp gắn <b class=\"kw\">confidence score</b> cho từng phần và gắn cờ các khu vực có độ bao phủ chưa đủ để <b class=\"kw\">review thủ công</b>."}},{"k":"B","t":{"en":"Have the analysis agent <b class=\"kw\">report specific gaps to the coordinator</b>, which triggers <b class=\"kw\">targeted searches</b> and re-invokes analysis until sufficient.","vi":"Để agent phân tích <b class=\"kw\">báo cáo các khoảng trống cụ thể cho coordinator</b>, coordinator sẽ kích hoạt các <b class=\"kw\">tìm kiếm có mục tiêu</b> và gọi lại bước phân tích cho đến khi đủ."}},{"k":"C","t":{"en":"Add a <b class=\"kw\">research planning agent</b> before the search phase that <b class=\"kw\">decomposes topics</b> into specific sub- questions.","vi":"Thêm một <b class=\"kw\">agent lập kế hoạch nghiên cứu</b> trước giai đoạn tìm kiếm để <b class=\"kw\">phân rã các chủ đề</b> thành các câu hỏi con cụ thể."}},{"k":"D","t":{"en":"Have the coordinator <b class=\"kw\">review analysis output for gap indicators</b> and <b class=\"kw\">re-invoke search</b> with gapinformed queries when gaps are detected.","vi":"Để coordinator <b class=\"kw\">xem xét đầu ra phân tích nhằm tìm dấu hiệu khoảng trống</b> và <b class=\"kw\">gọi lại bước tìm kiếm</b> với các truy vấn dựa trên thông tin về khoảng trống khi phát hiện có khoảng trống."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Pipeline một chiều khiến phát hiện của agent phân tích (thiếu thông tin về token refresh) không được dùng đến. Chuyển sang <b>vòng lặp tinh chỉnh lặp lại</b>: agent phân tích <b>báo cáo các lỗ hổng cụ thể</b> cho coordinator, coordinator kích hoạt <b>tìm kiếm có mục tiêu</b> và gọi lại phân tích <b>cho đến khi đủ</b>. Agent hiểu rõ nhất về lỗ hổng chủ động nêu ra, còn coordinator giữ quyền định tuyến.","elim":["<b>A.</b> Gắn confidence score và đẩy sang review thủ công chỉ đánh dấu chỗ yếu mà không lấp lỗ hổng; báo cáo vẫn thiếu chiều sâu.","<b>C.</b> Thêm agent lập kế hoạch trước bước search giúp phân rã tốt hơn nhưng không xử lý được lỗ hổng chỉ lộ ra sau khi phân tích tài liệu.","<b>D.</b> Để coordinator tự dò “dấu hiệu lỗ hổng” trong output là suy luận gián tiếp, kém chính xác hơn việc agent phân tích báo cáo lỗ hổng cụ thể; cũng không có vòng lặp gọi lại phân tích đến khi đủ."]},"cite":"Hướng dẫn ôn tập — §8.2 Phân rã thích ứng động; Lĩnh vực 1.2"},{"id":"t1q67","n":67,"topic":1,"type":"mcq","stem":{"en":"This currently requires <b class=\"kw\">manually copy-pasting content</b> into conversations. The team wants the agent to access this <b class=\"kw\">standard Jira ticket data</b> <b class=\"kw\">directly</b>. What&#x27;s the most effective approach?","vi":"Việc này hiện đòi hỏi phải <b class=\"kw\">sao chép-dán nội dung thủ công</b> vào các cuộc hội thoại. Nhóm muốn agent <b class=\"kw\">truy cập trực tiếp</b> <b class=\"kw\">dữ liệu ticket Jira tiêu chuẩn</b> này. Cách tiếp cận nào hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"Use the <b class=\"kw\">Bash tool with curl</b> to call Jira&#x27;s <b class=\"kw\">REST API</b>, including authentication headers and parsing JSON responses inline.","vi":"Dùng <b class=\"kw\">Bash tool với curl</b> để gọi <b class=\"kw\">REST API</b> của Jira, kèm header xác thực và phân tích phản hồi JSON ngay tại chỗ."}},{"k":"B","t":{"en":"Build a <b class=\"kw\">custom MCP server</b> <b class=\"kw\">wrapping Jira&#x27;s API</b> with tools designed specifically for this team&#x27;s code review workflow.","vi":"Xây dựng một <b class=\"kw\">MCP server tùy chỉnh</b> <b class=\"kw\">bao bọc API của Jira</b> với các tool được thiết kế riêng cho workflow review code của nhóm này."}},{"k":"C","t":{"en":"Integrate an <b class=\"kw\">existing Jira MCP server</b> that exposes tickets, comments, and metadata through <b class=\"kw\">discoverable tool interfaces</b>.","vi":"Tích hợp một <b class=\"kw\">Jira MCP server có sẵn</b>, cung cấp ticket, bình luận và metadata thông qua các <b class=\"kw\">giao diện tool có thể khám phá được</b>."}},{"k":"D","t":{"en":"<b class=\"kw\">Export Jira tickets to markdown files</b> in the repository that the agent accesses using the <b class=\"kw\">Read tool</b>.","vi":"<b class=\"kw\">Xuất các ticket Jira thành file markdown</b> trong repo để agent truy cập bằng <b class=\"kw\">Read tool</b>."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Jira là <b>tích hợp tiêu chuẩn</b> và dữ liệu ở đây là ticket Jira tiêu chuẩn. Thực hành tốt là <b>dùng một MCP server có sẵn</b> (cộng đồng/chính thức), cung cấp ticket, comment, metadata qua các tool mà agent tự khám phá được: ít công sức, dễ bảo trì, không phải tự viết tích hợp.","elim":["<b>A.</b> Gọi REST API bằng curl qua Bash bắt agent tự xử lý xác thực và parse JSON mỗi lần, dễ lỗi và để lộ thông tin xác thực trong lệnh.","<b>B.</b> Tự xây MCP server riêng chỉ đáng làm khi có nhu cầu đặc thù; với dữ liệu Jira tiêu chuẩn, đây là công sức xây dựng và bảo trì thừa.","<b>D.</b> Xuất ticket ra file markdown tạo bản sao tĩnh nhanh chóng lỗi thời và vẫn cần thao tác thủ công định kỳ."]},"cite":"Hướng dẫn ôn tập — §4.3 Cấu hình MCP Server; Lĩnh vực 2.4"},{"id":"t1q68","n":68,"topic":1,"type":"mcq","stem":{"en":"A <b class=\"kw\">critical bug</b> is <b class=\"kw\">affecting production users</b>. Error logs show exceptions in the OrderProcessing module with a <b class=\"kw\">clear stack trace pointing to a specific area</b>, but you haven&#x27;t worked with this module before. What&#x27;s the most effective approach?","vi":"Một <b class=\"kw\">bug nghiêm trọng</b> đang <b class=\"kw\">ảnh hưởng đến người dùng production</b>. Log lỗi cho thấy các exception trong module OrderProcessing với <b class=\"kw\">stack trace rõ ràng chỉ đến một khu vực cụ thể</b>, nhưng bạn chưa từng làm việc với module này trước đây. Cách tiếp cận nào hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"Use <b class=\"kw\">direct execution</b> to examine the stack trace, read the relevant code, and <b class=\"kw\">implement a fix</b> once you identify the root cause.","vi":"Dùng <b class=\"kw\">thực thi trực tiếp (direct execution)</b> để xem xét stack trace, đọc code liên quan và <b class=\"kw\">triển khai bản sửa</b> sau khi xác định được nguyên nhân gốc."}},{"k":"B","t":{"en":"Use <b class=\"kw\">plan mode</b> to analyze the error in context of the module&#x27;s design, <b class=\"kw\">enumerate potential root causes</b>, and prioritize fixes systematically.","vi":"Dùng <b class=\"kw\">plan mode</b> để phân tích lỗi trong bối cảnh thiết kế của module, <b class=\"kw\">liệt kê các nguyên nhân gốc tiềm năng</b> và ưu tiên các bản sửa một cách có hệ thống."}},{"k":"C","t":{"en":"<b class=\"kw\">Start with direct execution</b> to gather initial information, then <b class=\"kw\">switch to plan mode</b> to design a comprehensive solution before implementing.","vi":"<b class=\"kw\">Bắt đầu bằng thực thi trực tiếp</b> để thu thập thông tin ban đầu, sau đó <b class=\"kw\">chuyển sang plan mode</b> để thiết kế một giải pháp toàn diện trước khi triển khai."}},{"k":"D","t":{"en":"<b class=\"kw\">Enter plan mode</b> to <b class=\"kw\">explore the module&#x27;s architecture</b> and dependencies before attempting any fix.","vi":"<b class=\"kw\">Vào plan mode</b> để <b class=\"kw\">khám phá kiến trúc</b> và các phụ thuộc của module trước khi thử bất kỳ bản sửa nào."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Lỗi production có <b>stack trace rõ ràng chỉ đến một vùng cụ thể</b> là trường hợp điển hình cho <b>thực thi trực tiếp</b>: đọc stack trace, đọc đoạn code liên quan, xác định root cause rồi sửa. Gỡ lỗi mang tính thích ứng (mỗi file đọc định hướng bước tiếp theo), và tình huống khẩn cấp đòi hỏi không tốn thời gian lập kế hoạch trước.","elim":["<b>B.</b> Plan mode để liệt kê và xếp ưu tiên nhiều root cause là thừa khi stack trace đã chỉ ra vị trí, làm chậm việc sửa lỗi khẩn cấp.","<b>C.</b> Chuyển sang plan mode để thiết kế “giải pháp toàn diện” là quá mức cho một bug đã định vị được; ưu tiên là sửa nhanh và đúng.","<b>D.</b> Khám phá toàn bộ kiến trúc module trước khi sửa là không cần; chỉ cần hiểu vùng code mà stack trace chỉ tới."]},"cite":"Hướng dẫn ôn tập — §5.6 Planning Mode so với Thực thi trực tiếp; Lĩnh vực 3.4"},{"id":"t1q69","n":69,"topic":1,"type":"mcq","stem":{"en":"After deploying the automated review, you notice <b class=\"kw\">high precision but low recall</b> — real bugs are slipping through undetected. Investigation reveals your review prompt instructs Claude to &quot;<b class=\"kw\">only report high- confidence issues</b> you are certain about&quot; and &quot;<b class=\"kw\">err on the side of not commenting</b>.&quot; Developers appreciate the low noise, but a race condition that caused a production outage was visible in a reviewed PR and went unreported. You need to substantially improve bug detection while <b class=\"kw\">keeping false positive rates manageable</b> for your team. What is the most effective approach?","vi":"Sau khi deploy hệ thống review tự động, bạn nhận thấy <b class=\"kw\">precision cao nhưng recall thấp</b> — các bug thực sự đang lọt qua mà không bị phát hiện. Điều tra cho thấy prompt review của bạn hướng dẫn Claude &quot;<b class=\"kw\">chỉ báo cáo những vấn đề có độ chắc chắn cao</b> mà bạn hoàn toàn chắc chắn&quot; và &quot;nếu phân vân thì <b class=\"kw\">nghiêng về phía không bình luận</b>&quot;. Các lập trình viên đánh giá cao mức nhiễu thấp, nhưng một race condition gây ra sự cố ngừng hoạt động production đã hiện diện trong một PR được review mà không được báo cáo. Bạn cần cải thiện đáng kể khả năng phát hiện bug trong khi vẫn <b class=\"kw\">giữ tỷ lệ false positive ở mức nhóm có thể kiểm soát</b> được. Cách tiếp cận nào hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"Split the review into a <b class=\"kw\">finding stage</b> where Claude&#x27;s goal is coverage — flagging every potential issue with confidence and severity metadata — and a <b class=\"kw\">separate stage that thresholds</b> those findings.","vi":"Tách việc review thành một <b class=\"kw\">giai đoạn tìm kiếm (finding)</b> trong đó mục tiêu của Claude là độ bao phủ — gắn cờ mọi vấn đề tiềm năng kèm metadata về độ chắc chắn và mức độ nghiêm trọng — và một <b class=\"kw\">giai đoạn riêng áp ngưỡng</b> để lọc các phát hiện đó."}},{"k":"B","t":{"en":"Add <b class=\"kw\">detailed few-shot examples</b> demonstrating bug categories Claude should flag — race conditions, null dereferences, error handling gaps — while <b class=\"kw\">keeping the high-confidence filtering instruction</b> to maintain current precision levels.","vi":"Thêm các <b class=\"kw\">ví dụ few-shot chi tiết</b> minh họa các loại bug mà Claude nên gắn cờ — race condition, null dereference, thiếu sót trong xử lý lỗi — trong khi <b class=\"kw\">vẫn giữ hướng dẫn lọc theo độ chắc chắn cao</b> để duy trì mức precision hiện tại."}},{"k":"C","t":{"en":"<b class=\"kw\">Remove the conservative filtering instructions</b> and prompt Claude to report all potential issues, then apply a <b class=\"kw\">programmatic filter</b> to deduplicate and suppress categories that historically generate false positives.","vi":"<b class=\"kw\">Loại bỏ các hướng dẫn lọc thận trọng</b> và yêu cầu Claude báo cáo mọi vấn đề tiềm năng, sau đó áp dụng một <b class=\"kw\">bộ lọc bằng lập trình</b> để loại trùng lặp và ẩn các loại vấn đề mà trong lịch sử thường tạo ra false positive."}},{"k":"D","t":{"en":"<b class=\"kw\">Expand the context window</b> by including <b class=\"kw\">related test files</b>, recent git history, and the module&#x27;s dependency graph alongside the diff, giving Claude richer signals to assess issue severity.","vi":"<b class=\"kw\">Mở rộng context window</b> bằng cách đưa vào <b class=\"kw\">các file test liên quan</b>, lịch sử git gần đây và đồ thị phụ thuộc của module cùng với diff, cung cấp cho Claude các tín hiệu phong phú hơn để đánh giá mức độ nghiêm trọng của vấn đề."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Recall thấp vì prompt bắt mô hình <b>vừa tìm vừa tự lọc</b> trong cùng một bước. Tách thành hai giai đoạn: <b>giai đoạn tìm kiếm với mục tiêu coverage</b>, gắn cờ mọi vấn đề tiềm năng kèm metadata confidence và severity; rồi <b>một giai đoạn riêng áp ngưỡng</b>. Nhờ đó bug như race condition không bị loại sớm, còn tỷ lệ false positive vẫn kiểm soát được bằng ngưỡng có thể tinh chỉnh.","elim":["<b>B.</b> Few-shot về các loại bug vẫn đi kèm chỉ dẫn “chỉ báo khi chắc chắn”, nên mô hình tiếp tục tự kiểm duyệt và bỏ sót bug; recall không cải thiện đáng kể.","<b>C.</b> Báo cáo mọi thứ rồi chặn theo loại bug từng nhiều false positive có thể chặn luôn bug thật thuộc loại đó; không có thông tin confidence/severity để lọc tinh.","<b>D.</b> Thêm context giúp đánh giá tốt hơn nhưng không gỡ bỏ chỉ dẫn bảo thủ đang là nguyên nhân gốc của recall thấp."]},"cite":"Hướng dẫn ôn tập — §8.3 Code Review nhiều lượt (Multi-pass); Lĩnh vực 4.6"},{"id":"t1q70","n":70,"topic":1,"type":"mcq","stem":{"en":"Your remove_team_member tool uses a <b class=\"kw\">dry_run: boolean parameter</b> for previewing impacts before execution. Production monitoring shows the agent <b class=\"kw\">bypasses the preview step in 15% of calls</b> by calling with dry_run=false directly. You need to <b class=\"kw\">ensure every removal is preceded by a preview</b> that the <b class=\"kw\">user explicitly confirms</b>. What is the most reliable approach?","vi":"Tool remove_team_member của bạn dùng <b class=\"kw\">tham số dry_run: boolean</b> để xem trước tác động trước khi thực thi. Giám sát production cho thấy agent <b class=\"kw\">bỏ qua bước xem trước trong 15% số lần gọi</b> bằng cách gọi trực tiếp với dry_run=false. Bạn cần <b class=\"kw\">đảm bảo mọi thao tác xóa</b> đều được thực hiện sau một bước xem trước mà <b class=\"kw\">người dùng xác nhận rõ ràng</b>. Cách tiếp cận nào đáng tin cậy nhất?"},"options":[{"k":"A","t":{"en":"Add <b class=\"kw\">detailed instructions and few-shot examples</b> to the tool description requiring the agent to always call with <b class=\"kw\">dry_run=true first</b> and wait for user confirmation before calling with dry_run=false.","vi":"Thêm <b class=\"kw\">hướng dẫn chi tiết và ví dụ few-shot</b> vào mô tả tool, yêu cầu agent luôn gọi với <b class=\"kw\">dry_run=true trước</b> và chờ người dùng xác nhận trước khi gọi với dry_run=false."}},{"k":"B","t":{"en":"<b class=\"kw\">Annotate the tool as requiring confirmation</b> and configure the <b class=\"kw\">orchestration layer</b> to prompt the user for approval before forwarding any calls to annotated tools.","vi":"<b class=\"kw\">Chú thích (annotate) tool là cần xác nhận</b> và cấu hình <b class=\"kw\">lớp điều phối (orchestration layer)</b> để hỏi người dùng phê duyệt trước khi chuyển tiếp bất kỳ lệnh gọi nào tới các tool đã được chú thích."}},{"k":"C","t":{"en":"<b class=\"kw\">Replace with two tools</b>: preview_remove_member returns impact details and a <b class=\"kw\">single-use confirmation token</b>; execute_remove_member requires that token, binding execution to the specific previewed action.","vi":"<b class=\"kw\">Thay bằng hai tool</b>: preview_remove_member trả về chi tiết tác động và một <b class=\"kw\">token xác nhận dùng một lần</b>; execute_remove_member yêu cầu token đó, ràng buộc việc thực thi với đúng thao tác cụ thể đã được xem trước."}},{"k":"D","t":{"en":"Add <b class=\"kw\">server-side validation</b> that permits dry_run=false only when a dry_run=true call with identical parameters occurred <b class=\"kw\">within the past 60 seconds</b>.","vi":"Thêm <b class=\"kw\">kiểm tra hợp lệ phía server</b> chỉ cho phép dry_run=false khi đã có một lệnh gọi dry_run=true với các tham số giống hệt <b class=\"kw\">trong vòng 60 giây</b> trước đó."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Thiết kế <b>hai tool ràng buộc bằng token</b>: <code>preview_remove_member</code> trả về tác động và một <b>confirmation token dùng một lần</b>; <code>execute_remove_member</code> chỉ chạy khi có token đó. Việc thực thi không qua preview trở nên <b>bất khả thi về mặt kiến trúc</b>, và token gắn đúng với hành động đã xem trước. Đây là ràng buộc ở cấp code, không dựa vào việc LLM làm theo.","elim":["<b>A.</b> Hướng dẫn và few-shot trong mô tả tool chỉ mang tính xác suất; agent vẫn có thể gọi <code>dry_run=false</code> trực tiếp như 15% hiện tại.","<b>B.</b> Annotation và lớp orchestration hỏi phê duyệt không bảo đảm người dùng thấy bản preview tác động trước khi duyệt; phụ thuộc vào hạ tầng bên ngoài thay vì ràng buộc trong giao diện tool.","<b>D.</b> Kiểm tra “có lời gọi dry_run=true trong 60 giây” là heuristic thời gian: không chứng minh được người dùng đã xác nhận, và dễ lỗi khi người dùng cân nhắc lâu hơn 60 giây."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q71","n":71,"topic":1,"type":"mcq","stem":{"en":"Your invoice extraction uses tool use with strict JSON schemas. <b class=\"kw\">JSON syntax errors never occur</b>, but 12% of extractions <b class=\"kw\">fail semantic validation</b>--for example, line Item amounts don&#x27;t extracted total, or vendor IDs don&#x27;t match valid formats. These failures currently route to manual review. What&#x27;s the most effective approach to <b class=\"kw\">reduce manual review volume</b> while <b class=\"kw\">maintaining accuracy</b>?","vi":"Việc trích xuất hóa đơn của bạn sử dụng tool use với JSON schema nghiêm ngặt. <b class=\"kw\">Lỗi cú pháp JSON không bao giờ xảy ra</b>, nhưng 12% số lần trích xuất <b class=\"kw\">không vượt qua kiểm tra hợp lệ ngữ nghĩa</b> — ví dụ, số tiền của các dòng mục không khớp với tổng đã trích xuất, hoặc ID nhà cung cấp không khớp với định dạng hợp lệ. Các trường hợp thất bại này hiện được chuyển sang review thủ công. Cách tiếp cận nào hiệu quả nhất để <b class=\"kw\">giảm khối lượng review thủ công</b> mà vẫn <b class=\"kw\">duy trì độ chính xác</b>?"},"options":[{"k":"A","t":{"en":"Add <b class=\"kw\">stricter schema constraints</b> with <b class=\"kw\">detailed field descriptions</b> to prevent the model from generating invalid values initially.","vi":"Thêm các <b class=\"kw\">ràng buộc schema chặt chẽ hơn</b> cùng <b class=\"kw\">mô tả trường chi tiết</b> để ngăn model tạo ra giá trị không hợp lệ ngay từ đầu."}},{"k":"B","t":{"en":"<b class=\"kw\">Retry the extraction</b> up to 3 times when validation fallis, <b class=\"kw\">accepting the first result</b> that passes validation.","vi":"<b class=\"kw\">Retry việc trích xuất</b> tối đa 3 lần khi kiểm tra hợp lệ thất bại, <b class=\"kw\">chấp nhận kết quả đầu tiên</b> vượt qua kiểm tra hợp lệ."}},{"k":"C","t":{"en":"Implement <b class=\"kw\">post-processing logic</b> that <b class=\"kw\">automatically corrects</b> common amors, such as recalculating totais from line items when sums don&#x27;t match.","vi":"Triển khai <b class=\"kw\">logic hậu xử lý</b> <b class=\"kw\">tự động sửa</b> các lỗi phổ biến, chẳng hạn như tính lại tổng từ các dòng mục khi tổng không khớp."}},{"k":"D","t":{"en":"When validation falls, make a <b class=\"kw\">follow-up request</b> with the document, extraction, and <b class=\"kw\">validation errors for model correction</b>.","vi":"Khi kiểm tra hợp lệ thất bại, gửi một <b class=\"kw\">request tiếp theo</b> kèm tài liệu, kết quả trích xuất và <b class=\"kw\">các lỗi kiểm tra hợp lệ để model tự sửa</b>."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Schema đã bảo đảm cú pháp; 12% lỗi là <b>lỗi ngữ nghĩa</b> (tổng không khớp, định dạng vendor ID sai), loại lỗi mà mô hình thường tự sửa được khi được chỉ ra. Mẫu <b>retry-with-feedback</b>: gửi lại tài liệu gốc, bản trích xuất trước và <b>lỗi validation cụ thể</b> để mô hình kiểm tra và sửa, giảm khối lượng review thủ công mà vẫn giữ độ chính xác.","elim":["<b>A.</b> Ràng buộc schema chặt hơn không diễn đạt được các quy tắc liên trường như “tổng các dòng = tổng cộng”; lỗi ngữ nghĩa vẫn lọt qua.","<b>B.</b> Retry mù không kèm thông tin lỗi thường lặp lại cùng sai sót, và “chấp nhận kết quả đầu tiên qua validation” có thể là kết quả ngẫu nhiên khớp.","<b>C.</b> Tự động tính lại tổng từ các dòng có thể ghi đè giá trị đúng trên hóa đơn khi chính dòng hàng bị trích sai, làm sai lệch dữ liệu một cách âm thầm."]},"cite":"Hướng dẫn ôn tập — §6.5 Validation và Retry-with-Feedback; Lĩnh vực 4.4"},{"id":"t1q72","n":72,"topic":1,"type":"mcq","stem":{"en":"Your system must extract event details from calendar invitations and output JSON that <b class=\"kw\">strictly conforms to a schema</b> with fields for title, date, time, location, and attendees. Downstream <b class=\"kw\">reject any malformed</b> or non- conformant JSON. What approach provides the <b class=\"kw\">most reliable schema compliance</b>?","vi":"Hệ thống của bạn phải trích xuất chi tiết sự kiện từ lời mời lịch và xuất JSON <b class=\"kw\">tuân thủ nghiêm ngặt một schema</b> với các trường tiêu đề, ngày, giờ, địa điểm và người tham dự. Phía downstream <b class=\"kw\">từ chối mọi JSON sai định dạng</b> hoặc không tuân thủ schema. Cách tiếp cận nào mang lại khả năng <b class=\"kw\">tuân thủ schema đáng tin cậy nhất</b>?"},"options":[{"k":"A","t":{"en":"Include detailed <b class=\"kw\">JSON formatting instructions</b> and the target schema in your prompt, then <b class=\"kw\">parse Claude&#x27;s text response</b> as JSON.","vi":"Đưa <b class=\"kw\">hướng dẫn chi tiết về định dạng JSON</b> và schema mục tiêu vào prompt, sau đó <b class=\"kw\">parse phản hồi văn bản</b> của Claude thành JSON."}},{"k":"B","t":{"en":"<b class=\"kw\">Pre-fill Claude&#x27;s response</b> with an <b class=\"kw\">opening brace</b> to force JSON output, then complete and parse the response.","vi":"<b class=\"kw\">Điền sẵn (pre-fill) phản hồi của Claude</b> bằng một <b class=\"kw\">dấu ngoặc nhọn mở</b> để buộc đầu ra là JSON, sau đó hoàn thành và parse phản hồi."}},{"k":"C","t":{"en":"<b class=\"kw\">Define a tool</b> with your target <b class=\"kw\">schema as input parameters</b> and have Claude call it with the extracted data.","vi":"<b class=\"kw\">Định nghĩa một tool</b> với <b class=\"kw\">schema mục tiêu làm tham số đầu vào</b> và để Claude gọi tool đó với dữ liệu đã trích xuất."}},{"k":"D","t":{"en":"<b class=\"kw\">Append instructions</b> like &quot;Output only valid JSON matching the schema exactly&quot; and implement <b class=\"kw\">retry logic to re-prompt</b> when JSON parsing fails.","vi":"<b class=\"kw\">Thêm vào cuối các hướng dẫn</b> như &quot;Chỉ xuất JSON hợp lệ khớp chính xác với schema&quot; và triển khai <b class=\"kw\">logic retry để prompt lại</b> khi parse JSON thất bại."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Cách đáng tin cậy nhất để có JSON đúng schema là <b>định nghĩa một tool có <code>input_schema</code> chính là schema đích</b> và để Claude gọi tool đó với dữ liệu đã trích xuất. Đầu ra <code>tool_use</code> là JSON có cấu trúc theo schema, <b>loại bỏ lỗi cú pháp JSON</b> so với việc parse văn bản tự do (nên kết hợp <code>tool_choice</code> ép gọi tool).","elim":["<b>A.</b> Hướng dẫn định dạng trong prompt rồi parse văn bản vẫn có thể sinh JSON hỏng hoặc kèm chữ thừa; độ tuân thủ chỉ mang tính xác suất.","<b>B.</b> Prefill dấu “{” chỉ buộc mở đầu là JSON, không bảo đảm phần còn lại hợp lệ hay đúng schema.","<b>D.</b> Chỉ dẫn “chỉ xuất JSON hợp lệ” cộng retry là xử lý triệu chứng: tốn thêm lời gọi và vẫn không bảo đảm tuân thủ schema."]},"cite":"Hướng dẫn ôn tập — §2.4 JSON Schema cho Structured Output; Lĩnh vực 4.3"},{"id":"t1q73","n":73,"topic":1,"type":"mcq","stem":{"en":"Your extraction system uses tool_use with a JSON schema containing 12 fields and detailed descriptions, totaling <b class=\"kw\">approximately 2,500 tokens</b> for the complete tool definition. Processing documents under 150K tokens yields 98% accuracy. For documents <b class=\"kw\">between 175-190K tokens</b>, accuracy drops to 71%, with information from the <b class=\"kw\">final third consistently missed</b>. The model&#x27;s <b class=\"kw\">context window is 200K tokens</b>. What is the most likely cause?","vi":"Hệ thống trích xuất của bạn dùng tool_use với một JSON schema gồm 12 trường và các mô tả chi tiết, tổng cộng <b class=\"kw\">khoảng 2,500 token</b> cho toàn bộ định nghĩa tool. Xử lý các tài liệu dưới 150K token đạt độ chính xác 98%. Với các tài liệu <b class=\"kw\">từ 175-190K token</b>, độ chính xác giảm xuống 71%, trong đó thông tin ở <b class=\"kw\">một phần ba cuối cùng liên tục bị bỏ sót</b>. <b class=\"kw\">Context window của model là 200K token</b>. Nguyên nhân có khả năng nhất là gì?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Schemas exceeding 8-10 fields</b> increase <b class=\"kw\">decision complexity</b> during parameter generation, reducing extraction accuracy independent of document length.","vi":"Các <b class=\"kw\">schema vượt quá 8-10 trường</b> làm tăng <b class=\"kw\">độ phức tạp ra quyết định</b> trong quá trình tạo tham số, làm giảm độ chính xác trích xuất bất kể độ dài tài liệu."}},{"k":"B","t":{"en":"The model <b class=\"kw\">distributes attention proportionally</b> across input length, causing fields mentioned only once <b class=\"kw\">near the document&#x27;s end</b> to receive insufficient processing focus.","vi":"Model <b class=\"kw\">phân bổ sự chú ý theo tỷ lệ</b> trên toàn bộ độ dài đầu vào, khiến các trường chỉ được nhắc đến một lần <b class=\"kw\">gần cuối tài liệu</b> không nhận được đủ sự tập trung xử lý."}},{"k":"C","t":{"en":"Very long documents exceed the model&#x27;s <b class=\"kw\">effective attention span</b> regardless of context limits, causing accuracy degradation for content <b class=\"kw\">farther from the prompt instructions</b>.","vi":"Các tài liệu rất dài vượt quá <b class=\"kw\">khoảng chú ý hiệu dụng</b> của model bất kể giới hạn context, gây suy giảm độ chính xác đối với nội dung <b class=\"kw\">càng xa các hướng dẫn trong prompt</b>."}},{"k":"D","t":{"en":"<b class=\"kw\">Tool definitions consume input context tokens</b>. Combined with system prompts and document content, the total <b class=\"kw\">approaches the context limit</b>, degrading end-of-document processing.","vi":"<b class=\"kw\">Các định nghĩa tool tiêu tốn token</b> của context đầu vào. Cộng với system prompt và nội dung tài liệu, tổng số <b class=\"kw\">tiến gần đến giới hạn context</b>, làm suy giảm việc xử lý phần cuối tài liệu."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Context window gồm <b>system prompt + định nghĩa tool + tin nhắn + kết quả tool</b>. Tài liệu 175–190K token cộng 2.5K token định nghĩa tool cùng system prompt khiến tổng <b>tiến sát giới hạn 200K</b>, nên phần cuối tài liệu bị xử lý kém hoặc bị cắt. Triệu chứng chỉ xuất hiện ở tài liệu gần giới hạn và luôn mất phần một phần ba cuối chính là dấu hiệu của ngân sách context bị vượt.","elim":["<b>A.</b> Nếu số trường schema là nguyên nhân thì độ chính xác cũng giảm ở tài liệu dưới 150K; thực tế đạt 98% với cùng schema.","<b>B.</b> “Attention phân bổ theo tỷ lệ độ dài” không giải thích được vì sao chỉ một phần ba cuối bị bỏ sót một cách nhất quán và chỉ khi gần giới hạn.","<b>C.</b> “Effective attention span” mơ hồ không giải thích được ngưỡng rõ rệt quanh 175K; nguyên nhân cụ thể là tổng token chạm giới hạn context."]},"cite":"Hướng dẫn ôn tập — §1.5 Context Window"},{"id":"t1q74","n":74,"topic":1,"type":"mcq","stem":{"en":"The extraction pipeline receives documents of varying types—some are invoices, others are contracts, and some are receipts. You&#x27;ve defined separate extraction tools, each with its own schema tailored to the document type. During testing, you observe that with <b class=\"kw\">tool_choice: &quot;auto&quot;</b>, Claude sometimes <b class=\"kw\">returns conversational text</b> instead of calling an extraction tool, causing downstream parsing failures. You need <b class=\"kw\">guaranteed structured output</b> <b class=\"kw\">without knowing the document type in advance</b>. What&#x27;s the most effective approach?","vi":"Pipeline trích xuất nhận các tài liệu thuộc nhiều loại khác nhau — một số là hóa đơn, một số là hợp đồng, và một số là biên lai. Bạn đã định nghĩa các tool trích xuất riêng biệt, mỗi tool có schema riêng phù hợp với loại tài liệu. Trong quá trình kiểm thử, bạn quan sát thấy với <b class=\"kw\">tool_choice: &quot;auto&quot;</b>, Claude đôi khi <b class=\"kw\">trả về văn bản hội thoại</b> thay vì gọi một tool trích xuất, gây lỗi parse ở downstream. Bạn cần <b class=\"kw\">đầu ra có cấu trúc được đảm bảo</b> mà <b class=\"kw\">không biết trước loại tài liệu</b>. Cách tiếp cận nào hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"Add a <b class=\"kw\">preliminary classification call</b>, then make a second call with <b class=\"kw\">tool_choice forced</b> to the identified extraction tool.","vi":"Thêm một <b class=\"kw\">lời gọi phân loại sơ bộ</b>, sau đó thực hiện lời gọi thứ hai với <b class=\"kw\">tool_choice buộc dùng</b> tool trích xuất đã xác định."}},{"k":"B","t":{"en":"Set <b class=\"kw\">tool_choice: &quot;any&quot;</b> with <b class=\"kw\">all extraction tools</b> defined.","vi":"Đặt <b class=\"kw\">tool_choice: &quot;any&quot;</b> với <b class=\"kw\">tất cả các tool trích xuất</b> được định nghĩa."}},{"k":"C","t":{"en":"Consolidate all document types into a <b class=\"kw\">single unified-schema extraction tool</b> and <b class=\"kw\">force that tool</b>.","vi":"Hợp nhất tất cả loại tài liệu vào một <b class=\"kw\">tool trích xuất duy nhất có schema thống nhất</b> và <b class=\"kw\">buộc dùng tool đó</b>."}},{"k":"D","t":{"en":"Keep <b class=\"kw\">tool_choice: &quot;auto&quot;</b> with <b class=\"kw\">system prompt instructions</b> requiring tool use.","vi":"Giữ <b class=\"kw\">tool_choice: &quot;auto&quot;</b> kèm <b class=\"kw\">hướng dẫn trong system prompt</b> yêu cầu sử dụng tool."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> <code>tool_choice: \"any\"</code> buộc Claude <b>phải gọi một tool nào đó</b> (không được trả lời bằng văn bản), nhưng vẫn <b>tự chọn tool phù hợp</b> trong số các tool trích xuất theo loại tài liệu. Vì vậy luôn có structured output mà không cần biết trước loại tài liệu hay thêm bước phân loại.","elim":["<b>A.</b> Gọi phân loại trước rồi ép tool cụ thể tốn thêm một lời gọi API và thêm điểm lỗi (phân loại sai), trong khi <code>\"any\"</code> làm được việc này trong một lời gọi.","<b>C.</b> Gộp mọi loại tài liệu vào một schema chung làm mất các schema chuyên biệt, tạo nhiều trường tùy chọn/rỗng và giảm chất lượng trích xuất.","<b>D.</b> Giữ <code>\"auto\"</code> kèm chỉ dẫn trong prompt vẫn cho phép mô hình trả về văn bản; không có bảo đảm như đề yêu cầu."]},"cite":"Hướng dẫn ôn tập — §2.3 Tham số tool_choice; Lĩnh vực 4.3"},{"id":"t1q75","n":75,"topic":1,"type":"mcq","stem":{"en":"Monitoring shows 12% of extractions fall Pydantic validation with <b class=\"kw\">specific errors</b> like &quot;<b class=\"kw\">expected float for quantity</b>, got &#x27;2 to 3&quot;. Retrying these requests <b class=\"kw\">without modification produces failures</b>. What&#x27;s the most effective approach to recover from these validation failures?","vi":"Giám sát cho thấy 12% số lần trích xuất không vượt qua kiểm tra hợp lệ Pydantic với các <b class=\"kw\">lỗi cụ thể</b> như &quot;<b class=\"kw\">expected float for quantity</b>, got &#x27;2 to 3&quot;. Retry các request này <b class=\"kw\">mà không sửa đổi gì vẫn dẫn đến thất bại</b>. Cách tiếp cận nào hiệu quả nhất để khắc phục các lỗi kiểm tra hợp lệ này?"},"options":[{"k":"A","t":{"en":"Set <b class=\"kw\">temperature to 0</b> to <b class=\"kw\">eliminate output variability</b> and ensure consistent formatting","vi":"Đặt <b class=\"kw\">temperature về 0</b> để <b class=\"kw\">loại bỏ sự biến thiên</b> của đầu ra và đảm bảo định dạng nhất quán"}},{"k":"B","t":{"en":"Send a <b class=\"kw\">follow-up request</b> including the <b class=\"kw\">validation error</b>, asking the model to correct its output","vi":"Gửi một <b class=\"kw\">request tiếp theo</b> kèm <b class=\"kw\">lỗi kiểm tra hợp lệ</b>, yêu cầu model sửa đầu ra của nó"}},{"k":"C","t":{"en":"Implement a <b class=\"kw\">secondary pipeline</b> using a <b class=\"kw\">larger model tier</b> to reprocess documents that fail validation","vi":"Triển khai một <b class=\"kw\">pipeline phụ</b> sử dụng <b class=\"kw\">tier model lớn hơn</b> để xử lý lại các tài liệu không vượt qua kiểm tra hợp lệ"}},{"k":"D","t":{"en":"<b class=\"kw\">Pre-process source documents</b> to <b class=\"kw\">standardize problematic formats</b> before sending them for extraction","vi":"<b class=\"kw\">Tiền xử lý tài liệu nguồn</b> để <b class=\"kw\">chuẩn hóa các định dạng có vấn đề</b> trước khi gửi đi trích xuất"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Retry nguyên trạng thất bại vì mô hình không biết mình sai ở đâu. Gửi <b>yêu cầu tiếp theo kèm lỗi validation cụ thể</b> (“expected float for quantity, got '2 to 3'”) để mô hình <b>sửa đúng chỗ</b>, ví dụ chọn một giá trị số hoặc chuẩn hóa khoảng. Đây là vòng lặp validate–retry với Pydantic: lỗi định dạng là loại lỗi retry-with-feedback xử lý tốt nhất.","elim":["<b>A.</b> Temperature 0 chỉ làm đầu ra ổn định hơn, không giúp mô hình biết cách xử lý giá trị dạng khoảng; thậm chí lặp lại đúng lỗi cũ.","<b>C.</b> Chuyển sang model lớn hơn tốn chi phí mà không giải quyết gốc rễ: mô hình vẫn không được biết lỗi validation cụ thể.","<b>D.</b> Tiền xử lý tài liệu nguồn để chuẩn hóa định dạng là cồng kềnh, khó bao quát hết các biến thể, và có thể làm sai lệch dữ liệu gốc."]},"cite":"Hướng dẫn ôn tập — §6.5 Validation và Retry-with-Feedback; Lĩnh vực 4.4"},{"id":"t1q76","n":76,"topic":1,"type":"mcq","stem":{"en":"After three months of weekly sessions, your conversation history has grown to <b class=\"kw\">85,000 tokens</b>. When users ask &quot;What did we conclude about the theme of isolation?&quot;, the assistant provides <b class=\"kw\">generic literary analysis</b> rather than referencing the group&#x27;s specific insights from earlier sessions. Discussions often <b class=\"kw\">build on previous meetings&#x27; conclusions</b>, so <b class=\"kw\">maintaining narrative context</b> is important. What&#x27;s the most effective approach?","vi":"Sau ba tháng với các session hằng tuần, lịch sử cuộc hội thoại của bạn đã tăng lên <b class=\"kw\">85,000 token</b>. Khi người dùng hỏi &quot;Chúng ta đã kết luận gì về chủ đề sự cô lập?&quot;, trợ lý đưa ra <b class=\"kw\">phân tích văn học chung chung</b> thay vì tham chiếu đến những nhận định cụ thể của nhóm từ các session trước. Các cuộc thảo luận thường được <b class=\"kw\">xây dựng dựa trên kết luận của các buổi gặp trước</b>, vì vậy việc <b class=\"kw\">duy trì context tường thuật</b> là quan trọng. Cách tiếp cận nào hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"Add <b class=\"kw\">structured XML tags</b> to <b class=\"kw\">mark significant discussion conclusions</b> throughout the conversation history.","vi":"Thêm các <b class=\"kw\">thẻ XML có cấu trúc</b> để <b class=\"kw\">đánh dấu các kết luận thảo luận quan trọng</b> trong suốt lịch sử cuộc hội thoại."}},{"k":"B","t":{"en":"Implement <b class=\"kw\">rolling window truncation</b> to keep only the <b class=\"kw\">most recent 25,000 tokens</b>.","vi":"Triển khai <b class=\"kw\">cắt bớt theo cửa sổ trượt (rolling window)</b> để chỉ giữ lại <b class=\"kw\">25,000 token gần nhất</b>."}},{"k":"C","t":{"en":"Use <b class=\"kw\">semantic embedding</b> to index the full conversation history and <b class=\"kw\">retrieve only relevant past exchanges</b> for each user query, replacing the linear conversation format with retrieved segments.","vi":"Dùng <b class=\"kw\">embedding ngữ nghĩa</b> để lập chỉ mục toàn bộ lịch sử cuộc hội thoại và <b class=\"kw\">chỉ truy xuất các trao đổi trước đây có liên quan</b> cho mỗi truy vấn của người dùng, thay thế định dạng hội thoại tuyến tính bằng các đoạn được truy xuất."}},{"k":"D","t":{"en":"Implement <b class=\"kw\">progressive summarization</b> where older conversation blocks are replaced with concise summaries that explicitly extract key conclusions, decisions, and recurring themes, <b class=\"kw\">keeping recent exchanges verbatim</b>.","vi":"Triển khai <b class=\"kw\">tóm tắt lũy tiến (progressive summarization)</b>, trong đó các khối hội thoại cũ được thay thế bằng các bản tóm tắt ngắn gọn trích xuất rõ ràng các kết luận, quyết định và chủ đề lặp lại chính, đồng thời <b class=\"kw\">giữ nguyên văn các trao đổi gần đây</b>."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Đề nhấn mạnh các buổi thảo luận <b>xây dựng trên kết luận trước đó</b> và cần <b>giữ mạch tường thuật</b>. <b>Tóm tắt lũy tiến</b> thay các khối cũ bằng bản tóm tắt <b>trích xuất rõ kết luận, quyết định và chủ đề lặp lại</b>, đồng thời giữ nguyên văn các trao đổi gần đây. Nhờ vậy câu hỏi “đã kết luận gì về sự cô lập” có câu trả lời cụ thể trong context, mà vẫn giảm mạnh số token.","elim":["<b>A.</b> Gắn thẻ XML đánh dấu kết luận không giảm được 85K token, và phải tái cấu trúc toàn bộ lịch sử cũ.","<b>B.</b> Rolling window 25K token cắt mất phần lớn ba tháng thảo luận, gồm chính các kết luận người dùng đang hỏi.","<b>C.</b> Semantic retrieval thay thế định dạng hội thoại tuyến tính bằng các đoạn rời rạc, phá vỡ mạch tường thuật mà đề yêu cầu giữ; các kết luận phụ thuộc lẫn nhau có thể bị truy xuất thiếu."]},"cite":"Hướng dẫn ôn tập — §1.5 Context Window; Lĩnh vực 5.1"},{"id":"t1q77","n":77,"topic":1,"type":"mcq","stem":{"en":"You&#x27;re Implementing a feature where users refine their playlist preferences through multiple conversation turns. After deploying, you notice Claude&#x27;s responses don&#x27;t reflect what us <b class=\"kw\">earlier in the same conversation</b>— for example, <b class=\"kw\">a user says they love jazz</b>, but <b class=\"kw\">two messages later</b> Claude asks what genres they enjoy. What is the most likely cause?","vi":"Bạn đang triển khai một tính năng trong đó người dùng tinh chỉnh sở thích playlist của họ qua nhiều lượt hội thoại. Sau khi deploy, bạn nhận thấy các phản hồi của Claude không phản ánh những gì đã nói <b class=\"kw\">trước đó trong cùng cuộc hội thoại</b> — ví dụ, một <b class=\"kw\">người dùng nói họ yêu thích nhạc jazz</b>, nhưng <b class=\"kw\">hai tin nhắn sau</b> Claude lại hỏi họ thích những thể loại nào. Nguyên nhân có khả năng nhất là gì?"},"options":[{"k":"A","t":{"en":"Your application <b class=\"kw\">isn&#x27;t including prior messages</b> in the <b class=\"kw\">messages array</b>","vi":"Ứng dụng của bạn <b class=\"kw\">không đưa các tin nhắn trước đó</b> vào <b class=\"kw\">mảng messages</b>"}},{"k":"B","t":{"en":"The model&#x27;s <b class=\"kw\">context window has been exceeded</b> by the <b class=\"kw\">conversation length</b>","vi":"<b class=\"kw\">Độ dài cuộc hội thoại</b> đã <b class=\"kw\">vượt quá context window</b> của model"}},{"k":"C","t":{"en":"Claude requires a <b class=\"kw\">vector database connection</b> to maintain <b class=\"kw\">conversation memory</b>","vi":"Claude cần <b class=\"kw\">kết nối cơ sở dữ liệu vector</b> để duy trì <b class=\"kw\">bộ nhớ hội thoại</b>"}},{"k":"D","t":{"en":"The Claude API requires a <b class=\"kw\">session_id parameter</b> that you <b class=\"kw\">haven&#x27;t configured</b>","vi":"Claude API yêu cầu một <b class=\"kw\">tham số session_id</b> mà bạn <b class=\"kw\">chưa cấu hình</b>"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Claude API là <b>stateless</b>; không có bộ nhớ phía server giữa các lời gọi. Ứng dụng phải <b>đưa các tin nhắn trước vào mảng <code>messages</code></b> ở mỗi request. Chỉ hai tin nhắn sau khi người dùng nói thích jazz mà Claude đã quên là dấu hiệu rõ ràng các lượt trước không được gửi lên.","elim":["<b>B.</b> Một cuộc trao đổi vài tin nhắn không thể vượt context window hàng trăm nghìn token.","<b>C.</b> Claude không cần vector database để nhớ hội thoại; lịch sử được truyền trực tiếp qua <code>messages</code>.","<b>D.</b> Messages API không có tham số <code>session_id</code>; trạng thái hội thoại hoàn toàn do ứng dụng quản lý."]},"cite":"Hướng dẫn ôn tập — §1.2 Vai trò của Message; Lĩnh vực 5.1"},{"id":"t1q78","n":78,"topic":1,"type":"mcq","stem":{"en":"Your home renovation planning assistant uses a system prompt defining an expert contractor persona with specific guidelines: always ask about budget, suggest alternatives at multiple price points, and confirm timeline requirements. During testing, responses follow these guidelines <b class=\"kw\">for turns 1-4</b>, but <b class=\"kw\">by turn 7</b>, the assistant gives generic advice without asking about budget or timeline. The conversation is <b class=\"kw\">only 2,000 tokens</b>—<b class=\"kw\">well within the context window</b>. What is the most likely cause?","vi":"Trợ lý lập kế hoạch cải tạo nhà của bạn dùng một system prompt định nghĩa persona nhà thầu chuyên gia với các hướng dẫn cụ thể: luôn hỏi về ngân sách, đề xuất các phương án thay thế ở nhiều mức giá, và xác nhận yêu cầu về tiến độ. Trong quá trình kiểm thử, các phản hồi tuân theo những hướng dẫn này <b class=\"kw\">ở lượt 1-4</b>, nhưng <b class=\"kw\">đến lượt 7</b>, trợ lý đưa ra lời khuyên chung chung mà không hỏi về ngân sách hay tiến độ. Cuộc hội thoại <b class=\"kw\">chỉ dài 2,000 token</b> — <b class=\"kw\">nằm gọn trong context window</b>. Nguyên nhân có khả năng nhất là gì?"},"options":[{"k":"A","t":{"en":"The <b class=\"kw\">model&#x27;s attention</b> on system prompt instructions <b class=\"kw\">naturally weakens</b> as turns accumulate.","vi":"<b class=\"kw\">Sự chú ý của model</b> đối với các hướng dẫn trong system prompt <b class=\"kw\">tự nhiên suy yếu dần</b> khi số lượt tăng lên."}},{"k":"B","t":{"en":"System prompts <b class=\"kw\">only establish initial behavior</b> and <b class=\"kw\">don&#x27;t persist across all turns</b>.","vi":"System prompt <b class=\"kw\">chỉ thiết lập hành vi ban đầu</b> và <b class=\"kw\">không duy trì qua tất cả các lượt</b>."}},{"k":"C","t":{"en":"The system prompt is <b class=\"kw\">only sent</b> with the <b class=\"kw\">first API request</b>.","vi":"System prompt <b class=\"kw\">chỉ được gửi</b> kèm <b class=\"kw\">request API đầu tiên</b>."}},{"k":"D","t":{"en":"The assistant&#x27;s <b class=\"kw\">accumulated responses</b> are <b class=\"kw\">diluting the system prompt&#x27;s influence</b>.","vi":"Các <b class=\"kw\">phản hồi tích lũy</b> của trợ lý đang <b class=\"kw\">làm loãng ảnh hưởng</b> của system prompt."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Hội thoại chỉ 2.000 token nên không phải vấn đề giới hạn context, và system prompt vẫn được gửi ở mọi request. Nguyên nhân là <b>các phản hồi assistant tích lũy làm loãng ảnh hưởng của system prompt</b>: mô hình ngày càng <b>khớp mẫu theo chính các đầu ra trước đó</b> của nó (lời khuyên chung chung) thay vì các quy tắc persona, dẫn đến trôi hành vi dù token còn ít.","elim":["<b>A.</b> Sự suy yếu chú ý theo độ dài không phải yếu tố đáng kể ở mức chỉ 2.000 token.","<b>B.</b> System prompt không chỉ thiết lập hành vi ban đầu; nó được áp dụng xuyên suốt và gửi kèm mỗi lời gọi API.","<b>C.</b> System prompt được truyền trong trường <code>system</code> ở mọi request (API stateless), không chỉ ở request đầu."]},"cite":"Hướng dẫn ôn tập — §1.4 System Prompt"},{"id":"t1q79","n":79,"topic":1,"type":"mcq","stem":{"en":"Users report that during extended conversations, the AI <b class=\"kw\">loses track of specific topics</b>, examples, and preferences they mentioned earlier in the session. Your current implementation uses a <b class=\"kw\">sliding window</b> that keeps <b class=\"kw\">only the most recent 25 message pairs</b> to stay within context limits. What&#x27;s the most effective approach to maintain awareness of earlier conversation content <b class=\"kw\">while managing context size</b>?","vi":"Người dùng phản ánh rằng trong các cuộc hội thoại kéo dài, AI <b class=\"kw\">mất dấu các chủ đề</b>, ví dụ và sở thích cụ thể mà họ đã đề cập trước đó trong session. Cách triển khai hiện tại của bạn dùng một <b class=\"kw\">cửa sổ trượt (sliding window)</b> <b class=\"kw\">chỉ giữ 25 cặp tin nhắn gần nhất</b> để nằm trong giới hạn context. Cách tiếp cận nào hiệu quả nhất để duy trì nhận biết về nội dung hội thoại trước đó trong khi <b class=\"kw\">vẫn quản lý kích thước context</b>?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Increase the window size</b> to <b class=\"kw\">50 message pairs</b> to retain more conversation history before truncation.","vi":"<b class=\"kw\">Tăng kích thước cửa sổ</b> lên <b class=\"kw\">50 cặp tin nhắn</b> để giữ lại nhiều lịch sử hội thoại hơn trước khi cắt bớt."}},{"k":"B","t":{"en":"Add a <b class=\"kw\">separate API call each turn</b> to summarize messages being dropped, prepending this <b class=\"kw\">running summary</b> to the conversation.","vi":"Thêm một <b class=\"kw\">lời gọi API riêng ở mỗi lượt</b> để tóm tắt các tin nhắn sắp bị loại bỏ, chèn <b class=\"kw\">bản tóm tắt liên tục</b> này vào đầu cuộc hội thoại."}},{"k":"C","t":{"en":"Implement <b class=\"kw\">vector similarity search</b> over the full conversation history, <b class=\"kw\">retrieving relevant past messages</b> for each user query.","vi":"Triển khai <b class=\"kw\">tìm kiếm tương đồng vector</b> trên toàn bộ lịch sử hội thoại, <b class=\"kw\">truy xuất các tin nhắn trước đây có liên quan</b> cho mỗi truy vấn của người dùng."}},{"k":"D","t":{"en":"Replace the sliding window with a hybrid approach: <b class=\"kw\">summarize older messages</b> while <b class=\"kw\">keeping recent messages verbatim</b>.","vi":"Thay cửa sổ trượt bằng một cách tiếp cận kết hợp: <b class=\"kw\">tóm tắt các tin nhắn cũ</b> trong khi <b class=\"kw\">giữ nguyên văn các tin nhắn gần đây</b>."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Sliding window làm <b>mất hẳn</b> các lượt cũ. Cách tiếp cận <b>lai</b>, gồm <b>tóm tắt các tin nhắn cũ</b> và <b>giữ nguyên văn các tin nhắn gần đây</b>, vừa bảo toàn chủ đề, ví dụ và sở thích đã nêu dưới dạng nén, vừa giữ context chính xác cho mạch hội thoại hiện tại, trong giới hạn token.","elim":["<b>A.</b> Tăng cửa sổ lên 50 cặp chỉ trì hoãn vấn đề và tăng chi phí; khi hội thoại dài hơn, thông tin cũ vẫn bị cắt.","<b>B.</b> Gọi API riêng mỗi lượt để tóm tắt và nối dần bản tóm tắt làm tăng chi phí, độ trễ và tích lũy lỗi tóm tắt qua nhiều lần.","<b>C.</b> Vector search có thể bỏ sót các sở thích không tương đồng ngữ nghĩa với câu hỏi hiện tại, và thêm hạ tầng phức tạp."]},"cite":"Hướng dẫn ôn tập — §1.5 Context Window; Lĩnh vực 5.1"},{"id":"t1q80","n":80,"topic":1,"type":"mcq","stem":{"en":"During QA testing, you notice that Claude follows your system prompt guidelines consistently in the <b class=\"kw\">first 10- 15 turns</b>, but <b class=\"kw\">by turn 25-30</b>, <b class=\"kw\">responses begin deviating</b>—using informal tone when formality was specified, occasionally skipping required formatting, or providing information types the guidelines restrict. Conversation length is <b class=\"kw\">well within context limits</b> (typically 30,000 tokens out of 200,000 available). What&#x27;s the most effective approach to maintain consistent behavior throughout extended conversations?","vi":"Trong quá trình kiểm thử QA, bạn nhận thấy Claude tuân theo các hướng dẫn trong system prompt một cách nhất quán ở <b class=\"kw\">10-15 lượt đầu</b>, nhưng <b class=\"kw\">đến lượt 25-30</b>, các phản hồi <b class=\"kw\">bắt đầu lệch hướng</b> — dùng giọng điệu thân mật trong khi đã chỉ định giọng trang trọng, thỉnh thoảng bỏ qua định dạng bắt buộc, hoặc cung cấp những loại thông tin mà hướng dẫn hạn chế. Độ dài cuộc hội thoại <b class=\"kw\">vẫn nằm trong giới hạn context</b> (thường là 30,000 token trên 200,000 token khả dụng). Cách tiếp cận nào hiệu quả nhất để duy trì hành vi nhất quán trong suốt các cuộc hội thoại kéo dài?"},"options":[{"k":"A","t":{"en":"Automatically <b class=\"kw\">start a new conversation after 20 turns</b>, <b class=\"kw\">passing a summary</b> of the prior context to maintain continuity.","vi":"Tự động <b class=\"kw\">bắt đầu một cuộc hội thoại mới sau 20 lượt</b>, <b class=\"kw\">truyền bản tóm tắt</b> context trước đó để duy trì tính liên tục."}},{"k":"B","t":{"en":"Insert <b class=\"kw\">user-role messages</b> that <b class=\"kw\">reinforce critical guidelines</b> at natural conversation breakpoints, especially before complex requests.","vi":"Chèn các <b class=\"kw\">tin nhắn vai trò user</b> <b class=\"kw\">nhắc lại các hướng dẫn quan trọng</b> tại các điểm ngắt tự nhiên của cuộc hội thoại, đặc biệt là trước các yêu cầu phức tạp."}},{"k":"C","t":{"en":"<b class=\"kw\">Move behavioral guidelines</b> from the system prompt into the <b class=\"kw\">first user message</b>.","vi":"<b class=\"kw\">Chuyển các hướng dẫn hành vi</b> từ system prompt sang <b class=\"kw\">tin nhắn user đầu tiên</b>."}},{"k":"D","t":{"en":"Implement <b class=\"kw\">post-response validation</b> that <b class=\"kw\">regenerates each response</b> until it conforms to the specified guidelines.","vi":"Triển khai <b class=\"kw\">kiểm tra hợp lệ sau phản hồi</b>, <b class=\"kw\">tạo lại từng phản hồi</b> cho đến khi nó tuân thủ các hướng dẫn đã chỉ định."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Trôi hướng dẫn xảy ra khi lịch sử tích lũy dần lấn át system prompt, dù vẫn trong giới hạn token. <b>Chèn tin nhắn vai trò user nhắc lại các hướng dẫn then chốt</b> tại các điểm ngắt tự nhiên (đặc biệt trước yêu cầu phức tạp) <b>tái thiết lập ràng buộc</b> gần vị trí sinh phản hồi, mang tính phòng ngừa và không phá vỡ context.","elim":["<b>A.</b> Bắt đầu hội thoại mới sau 20 lượt phá vỡ context, và bản tóm tắt có thể làm mất chi tiết quan trọng.","<b>C.</b> Chuyển hướng dẫn vào tin nhắn user đầu tiên làm giảm thẩm quyền của chúng, và chúng còn bị chôn sâu hơn khi hội thoại dài ra.","<b>D.</b> Validate rồi sinh lại mang tính khắc phục, tăng mạnh độ trễ và chi phí, mà không xử lý nguyên nhân gây trôi."]},"cite":"Hướng dẫn ôn tập — §1.4 System Prompt"},{"id":"t1q81","n":81,"topic":1,"type":"mcq","stem":{"en":"During a conversation about order tracking, your external system <b class=\"kw\">receives a webhook</b> indicating the user&#x27;s package has shipped. The user is <b class=\"kw\">actively chatting</b> and <b class=\"kw\">will likely send a follow-up message soon</b>. You want the assistant to naturally incorporate this status change <b class=\"kw\">in its next response</b>. What&#x27;s the most effective approach?","vi":"Trong một cuộc hội thoại về theo dõi đơn hàng, hệ thống bên ngoài của bạn <b class=\"kw\">nhận được một webhook</b> cho biết gói hàng của người dùng đã được gửi đi. Người dùng <b class=\"kw\">đang tích cực trò chuyện</b> và có khả năng <b class=\"kw\">sẽ sớm gửi tin nhắn tiếp theo</b>. Bạn muốn trợ lý lồng ghép thay đổi trạng thái này một cách tự nhiên <b class=\"kw\">vào phản hồi tiếp theo</b> của nó. Cách tiếp cận nào hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"<b class=\"kw\">Immediately send an API request</b> with the update as a <b class=\"kw\">synthetic user message</b>, generating an unsolicited assistant response.","vi":"<b class=\"kw\">Gửi ngay một request API</b> với bản cập nhật dưới dạng <b class=\"kw\">tin nhắn user giả lập</b>, tạo ra một phản hồi assistant không được yêu cầu."}},{"k":"B","t":{"en":"<b class=\"kw\">Append the status update</b> as a <b class=\"kw\">prefix to the next user message</b> before calling the API.","vi":"<b class=\"kw\">Thêm cập nhật trạng thái</b> làm <b class=\"kw\">tiền tố vào tin nhắn tiếp theo của người dùng</b> trước khi gọi API."}},{"k":"C","t":{"en":"Configure the assistant to call a <b class=\"kw\">get_order_status tool</b> at the <b class=\"kw\">start of every response</b>.","vi":"Cấu hình trợ lý gọi <b class=\"kw\">tool get_order_status</b> ở <b class=\"kw\">đầu mỗi phản hồi</b>."}},{"k":"D","t":{"en":"Add the <b class=\"kw\">current shipping status</b> to the <b class=\"kw\">system prompt</b> before the next API call.","vi":"Thêm <b class=\"kw\">trạng thái vận chuyển hiện tại</b> vào <b class=\"kw\">system prompt</b> trước lời gọi API tiếp theo."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Cập nhật trạng thái là <b>thông tin tức thời gắn với lượt hội thoại hiện tại</b>, nên cách tự nhiên nhất là <b>chèn nó làm tiền tố cho tin nhắn tiếp theo của người dùng</b> trước khi gọi API (ví dụ một khối <code>[Cập nhật hệ thống: đơn hàng đã được gửi đi]</code> trước nội dung người dùng gõ). Mô hình thấy thông tin mới ngay đúng thời điểm trả lời và lồng nó vào phản hồi, mà không tạo lượt giả, không gọi tool thừa, và không phải sửa system prompt.","elim":["<b>A.</b> Gửi ngay một tin nhắn user giả sẽ sinh ra phản hồi không được yêu cầu, chen ngang khi người dùng đang gõ và làm lệch luồng hội thoại.","<b>C.</b> Bắt gọi <code>get_order_status</code> ở mọi phản hồi lãng phí một lời gọi tool mỗi lượt cho một sự kiện hiếm khi xảy ra.","<b>D.</b> System prompt dành cho chỉ dẫn và vai trò ổn định; sửa nó theo từng sự kiện là cồng kềnh, trộn dữ liệu trạng thái thay đổi liên tục vào phần cấu hình, và không gắn cập nhật với đúng thời điểm trong hội thoại."]},"cite":"Hướng dẫn ôn tập — §1.2 Vai trò của Message; câu hỏi mẫu 73 (Các mẫu kiến trúc AI hội thoại)"},{"id":"t1q82","n":82,"topic":1,"type":"mcq","stem":{"en":"Users report that responses feel repetitive across turns—<b class=\"kw\">each message begins with phrases like</b> &quot;<b class=\"kw\">Certainly!</b>&quot; or &quot;I&#x27;d be happy to help!&quot; even deep into conversations. You want responses to feel more natural, <b class=\"kw\">without these repetitive openers</b>. What&#x27;s the most effective approach?","vi":"Người dùng phản ánh rằng các phản hồi có cảm giác lặp lại qua các lượt — <b class=\"kw\">mỗi tin nhắn đều bắt đầu bằng</b> những cụm từ như &quot;<b class=\"kw\">Certainly!</b>&quot; hoặc &quot;I&#x27;d be happy to help!&quot; ngay cả khi cuộc hội thoại đã đi rất sâu. Bạn muốn các phản hồi tự nhiên hơn, <b class=\"kw\">không có những câu mở đầu lặp lại này</b>. Cách tiếp cận nào hiệu quả nhất?"},"options":[{"k":"A","t":{"en":"Add <b class=\"kw\">system prompt instructions</b> specifying <b class=\"kw\">phrases to avoid</b>, such as &quot;Never begin responses with &#x27;Certainly&#x27; or similar affirmations&quot;","vi":"Thêm <b class=\"kw\">hướng dẫn vào system prompt</b> chỉ rõ <b class=\"kw\">các cụm từ cần tránh</b>, chẳng hạn &quot;Không bao giờ bắt đầu phản hồi bằng &#x27;Certainly&#x27; hoặc các câu khẳng định tương tự&quot;"}},{"k":"B","t":{"en":"Implement <b class=\"kw\">post-processing</b> to detect and <b class=\"kw\">strip common greeting phrases</b> from response beginnings","vi":"Triển khai <b class=\"kw\">hậu xử lý</b> để phát hiện và <b class=\"kw\">loại bỏ các cụm từ chào hỏi</b> phổ biến ở đầu phản hồi"}},{"k":"C","t":{"en":"Append a <b class=\"kw\">partial assistant message</b> with a <b class=\"kw\">direct response opening</b> that the model will continue from","vi":"Thêm vào cuối một <b class=\"kw\">tin nhắn assistant dở dang (partial)</b> với <b class=\"kw\">phần mở đầu trả lời trực tiếp</b> để model tiếp tục viết từ đó"}},{"k":"D","t":{"en":"<b class=\"kw\">Lower the temperature</b> parameter to make response openings <b class=\"kw\">more deterministic</b> and less variable","vi":"<b class=\"kw\">Giảm tham số temperature</b> để phần mở đầu phản hồi <b class=\"kw\">tất định hơn</b> và ít biến thiên hơn"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> <b>Prefill</b>: nối một tin nhắn assistant dở dang chứa phần mở đầu trả lời trực tiếp, để mô hình <b>tiếp tục từ đó</b>. Vì token mở đầu đã cố định, mô hình không thể chèn “Certainly!” hay “I'd be happy to help!”. Cách này kiểm soát trực tiếp ngay ở bước sinh, đáng tin cậy hơn chỉ dẫn hay hậu xử lý.","elim":["<b>A.</b> Chỉ dẫn trong system prompt có ích nhưng kém tin cậy; mô hình thường chuyển sang các biến thể mở đầu khác (“Of course!”, “Absolutely!”).","<b>B.</b> Hậu xử lý cắt cụm chào hỏi là cách lách dễ vỡ: phải liệt kê mọi biến thể và có thể làm câu đầu cụt hoặc mất mạch.","<b>D.</b> Temperature điều khiển độ ngẫu nhiên, không phải mẫu cụm từ; hạ temperature còn có thể làm các câu mở đầu quen thuộc lặp lại nhiều hơn."]},"cite":"Hướng dẫn ôn tập — §1.2 Vai trò của Message"},{"id":"t1q83","n":83,"topic":1,"type":"mcq","stem":{"en":"Users frequently send ambiguous requests like &quot;book a venue for the party&quot; without specifying date, guest count, or budget. Your evaluation shows the assistant asks an average of <b class=\"kw\">4.2 clarifying questions before taking any action</b>, causing <b class=\"kw\">35% of users to abandon</b> mid-conversation. However, when you reduce questions, users sometimes receive recommendations that <b class=\"kw\">don&#x27;t match their preferences</b>. What&#x27;s the most effective approach to <b class=\"kw\">improve this trade-off</b>?","vi":"Người dùng thường xuyên gửi các yêu cầu mơ hồ như &quot;đặt địa điểm cho bữa tiệc&quot; mà không nêu rõ ngày, số lượng khách hay ngân sách. Đánh giá của bạn cho thấy trợ lý đặt trung bình <b class=\"kw\">4.2 câu hỏi làm rõ trước khi thực hiện bất kỳ hành động nào</b>, khiến <b class=\"kw\">35% người dùng bỏ dở</b> giữa cuộc hội thoại. Tuy nhiên, khi bạn giảm bớt câu hỏi, người dùng đôi khi nhận được các đề xuất <b class=\"kw\">không khớp với sở thích</b> của họ. Cách tiếp cận nào hiệu quả nhất để <b class=\"kw\">cải thiện sự đánh đổi này</b>?"},"options":[{"k":"A","t":{"en":"Instruct the assistant to <b class=\"kw\">state explicit assumptions</b> based on conversation history, proceed with recommendations while <b class=\"kw\">inviting corrections</b>, and reserve clarifying questions only for irreversible actions like confirming bookings.","vi":"Hướng dẫn trợ lý <b class=\"kw\">nêu rõ các giả định</b> dựa trên lịch sử hội thoại, tiếp tục đưa ra đề xuất đồng thời <b class=\"kw\">mời người dùng chỉnh sửa</b>, và chỉ dành câu hỏi làm rõ cho các hành động không thể đảo ngược như xác nhận đặt chỗ."}},{"k":"B","t":{"en":"Configure the assistant to consolidate all clarifying questions into a <b class=\"kw\">single compound question</b> (e.g., &quot;What date, guest count, and budget are you considering?&quot;) to <b class=\"kw\">reduce the total number</b> of conversational turns.","vi":"Cấu hình trợ lý gộp tất cả câu hỏi làm rõ thành <b class=\"kw\">một câu hỏi kép duy nhất</b> (ví dụ: &quot;Bạn đang cân nhắc ngày nào, bao nhiêu khách và ngân sách bao nhiêu?&quot;) để <b class=\"kw\">giảm tổng số lượt hội thoại</b>."}},{"k":"C","t":{"en":"Implement a <b class=\"kw\">structured intake form</b> that collects all required parameters (date, guest count, budget, venue type) <b class=\"kw\">upfront</b> before the assistant begins providing any recommendations.","vi":"Triển khai một <b class=\"kw\">biểu mẫu tiếp nhận có cấu trúc</b> để <b class=\"kw\">thu thập trước</b> tất cả các tham số bắt buộc (ngày, số lượng khách, ngân sách, loại địa điểm) trước khi trợ lý bắt đầu đưa ra bất kỳ đề xuất nào."}},{"k":"D","t":{"en":"Configure the assistant to proceed with <b class=\"kw\">reasonable defaults</b> (medium-sized venue, next weekend, moderate budget) <b class=\"kw\">without explicitly stating these assumptions</b>, allowing users to provide corrections if results don&#x27;t match expectations.","vi":"Cấu hình trợ lý tiếp tục với các <b class=\"kw\">giá trị mặc định hợp lý</b> (địa điểm cỡ vừa, cuối tuần tới, ngân sách vừa phải) mà <b class=\"kw\">không nêu rõ các giả định này</b>, để người dùng tự chỉnh sửa nếu kết quả không đúng kỳ vọng."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Bài toán là cân bằng giữa <b>ma sát</b> (4,2 câu hỏi khiến 35% người dùng bỏ đi) và <b>độ khớp sở thích</b>. Cách cân bằng tốt nhất là <b>nêu giả định một cách tường minh</b> (dựa trên lịch sử hội thoại), vẫn đưa ra đề xuất ngay và mời người dùng chỉnh sửa — người dùng thấy giả định nên sửa được nhanh, thay vì nhận đề xuất sai mà không hiểu vì sao. Câu hỏi làm rõ chỉ dành cho <b>hành động không thể đảo ngược</b> như xác nhận đặt chỗ, nơi sai lầm gây hậu quả thật.","elim":["<b>B.</b> Gộp các câu hỏi thành một câu ghép vẫn bắt người dùng trả lời đủ mọi thông tin trước khi nhận được giá trị nào; ma sát nhận thức gần như không đổi, chỉ giảm số lượt.","<b>C.</b> Biểu mẫu thu thập đầy đủ tham số trước khi đề xuất chính là phiên bản cứng nhắc của việc hỏi 4,2 câu — vẫn chặn người dùng ở đầu luồng và gây bỏ cuộc.","<b>D.</b> Dùng giá trị mặc định mà <b>không nêu ra</b> khiến người dùng không biết kết quả dựa trên giả định nào, nên không thể sửa đúng chỗ — chính là nguyên nhân của các đề xuất lệch sở thích."]},"cite":"Hướng dẫn ôn tập — Lĩnh vực 5.2 Thiết kế các Mẫu Escalation Hiệu quả và Giải quyết Sự Mơ hồ"},{"id":"t1q84","n":84,"topic":1,"type":"mcq","stem":{"en":"Your conversational AI tutor has a 2,800-token system prompt containing teaching methodology, persona guidelines, and <b class=\"kw\">detailed written instructions</b> for adapting explanations to different proficiency levels. User testing reveals that in conversations exceeding 12 turns (approximately 4,000 tokens of conversation history), the assistant <b class=\"kw\">increasingly ignores the proficiency-adaptation guidelines</b>, <b class=\"kw\">defaulting to intermediate-level explanations</b> regardless of the learner&#x27;s stated level. What&#x27;s the most effective approach to ensure <b class=\"kw\">consistent adherence</b> to these guidelines throughout extended conversations?","vi":"Trợ lý gia sư AI dạng hội thoại của bạn có system prompt dài 2,800 token chứa phương pháp giảng dạy, hướng dẫn về persona, và các <b class=\"kw\">chỉ dẫn viết chi tiết</b> để điều chỉnh phần giải thích theo các trình độ khác nhau. Kiểm thử với người dùng cho thấy trong các cuộc hội thoại vượt quá 12 lượt (khoảng 4,000 token lịch sử hội thoại), trợ lý <b class=\"kw\">ngày càng bỏ qua các hướng dẫn</b> điều chỉnh theo trình độ, <b class=\"kw\">mặc định đưa ra giải thích ở mức trung cấp</b> bất kể trình độ mà người học đã nêu. Cách tiếp cận nào hiệu quả nhất để đảm bảo <b class=\"kw\">tuân thủ nhất quán</b> các hướng dẫn này trong suốt các cuộc hội thoại dài?"},"options":[{"k":"A","t":{"en":"Inject a <b class=\"kw\">condensed reminder</b> of the proficiency requirements into the conversation as a system message <b class=\"kw\">every 4-5 turns</b>.","vi":"Chèn một <b class=\"kw\">lời nhắc rút gọn</b> về các yêu cầu theo trình độ vào cuộc hội thoại dưới dạng thông điệp hệ thống (system message) <b class=\"kw\">sau mỗi 4-5 lượt</b>."}},{"k":"B","t":{"en":"Replace the verbose proficiency guidelines with <b class=\"kw\">few-shot examples</b> demonstrating appropriate responses at <b class=\"kw\">each proficiency level</b>, showing concrete differences in vocabulary, complexity, and explanation depth.","vi":"Thay thế các hướng dẫn dài dòng về trình độ bằng các <b class=\"kw\">ví dụ few-shot</b> minh họa câu trả lời phù hợp ở <b class=\"kw\">từng trình độ</b>, thể hiện sự khác biệt cụ thể về từ vựng, độ phức tạp và độ sâu của phần giải thích."}},{"k":"C","t":{"en":"After each assistant response, make a <b class=\"kw\">separate API call to evaluate</b> whether the difficulty level matched the learner&#x27;s profile, <b class=\"kw\">regenerating responses</b> that don&#x27;t align.","vi":"Sau mỗi câu trả lời của trợ lý, thực hiện một <b class=\"kw\">lệnh gọi API riêng để đánh giá</b> xem mức độ khó có khớp với hồ sơ của người học hay không, và <b class=\"kw\">tạo lại những câu trả lời</b> không phù hợp."}},{"k":"D","t":{"en":"<b class=\"kw\">Restructure the system prompt</b> to place the proficiency-adaptation rules in a <b class=\"kw\">clearly-marked final section</b> immediately before the conversation history begins.","vi":"<b class=\"kw\">Tái cấu trúc system prompt</b> để đặt các quy tắc điều chỉnh theo trình độ vào một <b class=\"kw\">phần cuối được đánh dấu rõ ràng</b>, ngay trước khi lịch sử hội thoại bắt đầu."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Mô hình bỏ qua hướng dẫn thích ứng trình độ và “trôi” về mức trung bình vì các chỉ dẫn mô tả bằng lời dài dòng là <b>trừu tượng</b>, khó áp dụng nhất quán khi hội thoại dài ra. <b>Ví dụ few-shot</b> cho từng trình độ thể hiện cụ thể khác biệt về từ vựng, độ phức tạp, độ sâu giải thích — đây là cách hiệu quả nhất để tạo đầu ra nhất quán và giúp mô hình tổng quát hóa thay vì quay về mặc định. Đồng thời thay phần văn bản dài bằng ví dụ còn làm prompt gọn và rõ hơn.","elim":["<b>A.</b> Chèn nhắc nhở định kỳ chỉ là giải pháp chắp vá xử lý triệu chứng: nhắc lại cùng một chỉ dẫn trừu tượng không làm mô hình biết cụ thể câu trả lời ở mỗi trình độ trông ra sao.","<b>C.</b> Thêm một lời gọi API đánh giá rồi sinh lại sau mỗi phản hồi làm tăng gấp đôi chi phí và độ trễ, chỉ phát hiện lỗi sau khi xảy ra chứ không sửa nguyên nhân gốc.","<b>D.</b> Chỉ đổi vị trí phần quy tắc trong system prompt không giải quyết được việc chỉ dẫn trừu tượng khó áp dụng; ~4.000 token hội thoại cũng không phải là quá dài để vị trí trở thành yếu tố quyết định."]},"cite":"Hướng dẫn ôn tập — §6.1 Few-shot Prompting; Lĩnh vực 4.2"},{"id":"t1q85","n":85,"topic":1,"type":"mcq","stem":{"en":"The system routes documents with extraction confidence below 85% to human r
