<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCAR-F · Claude Certified Architect - Foundations</title>
<meta name="description" content="Bộ đề luyện thi CCAR-F.">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<script>
/* đặt theme trước khi vẽ để không nháy màu */
(function(){
  var th="dark";
  try{
    var d=JSON.parse(localStorage.getItem('examtrainer.CCAR-F')||"{}");
    if(d.theme) th=d.theme;
    else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches) th="light";
  }catch(e){}
  document.documentElement.setAttribute("data-theme",th);
})();
</script>
<style>
/* ============================================================
   Exam Trainer — bảng điều khiển + tờ đề in (tông ấm)
   ============================================================ */

:root{                      /* TỐI — mỗi màu chữ đều đo trên nền sáng nhất mà nó nằm lên */
  --shell:#171310;          /* khung ngoài            */
  --shell-2:#201A15;        /* cột trái / cột phải    */
  --shell-3:#2E251C;        /* nền nổi khi rê chuột   */
  --sunken:#100D0A;         /* ô nhập liệu — chìm     */
  --paper:#1C1712;          /* vùng đọc               */
  --paper-2:#252019;
  --ink:#F1EFEA;            /* ≥13.1:1 mọi nền        */
  --ink-2:#C6BCAA;          /* ≥ 8.0:1 — nhãn, chú thích */
  --ink-3:#ABA08B;          /* ≥ 5.8:1 — số đếm, gợi ý ô nhập */
  --rule:#3D3428;           /* kẻ trang trí           */
  --rule-2:#786853;         /* viền điều khiển ≥3:1   */
  --on-accent:#171310;      /* chữ nằm trên mảng màu đặc */
  --ok:#8FD98C;
  --ok-bg:rgba(143,217,140,.15);
  --bad:#FF9781;
  --bad-bg:rgba(255,151,129,.15);
  --flag:#F7C25A;
  --flag-bg:rgba(247,194,90,.17);
  --pick:#8ECBF0;
  --pick-bg:rgba(142,203,240,.15);
  --stamp:#FF9781;
  --focus:#F7C25A;
  --thumb:#5A4E3D;
  color-scheme:dark;
}
[data-theme="light"]{       /* SÁNG — cùng nguyên tắc, giấy ngà để bớt chói */
  --shell:#E9E3D5;
  --shell-2:#F2EDE2;
  --shell-3:#E7E1D2;
  --sunken:#FFFFFF;
  --paper:#FDFBF5;
  --paper-2:#F5F1E6;
  --ink:#201C16;            /* ≥13.0:1 */
  --ink-2:#463E35;          /* ≥ 8.0:1 */
  --ink-3:#5B5347;          /* ≥ 5.8:1 */
  --rule:#DED6C4;
  --rule-2:#8F8269;
  --on-accent:#FFFFFF;
  --ok:#256B42;
  --ok-bg:rgba(37,107,66,.10);
  --bad:#B32E1F;
  --bad-bg:rgba(179,46,31,.09);
  --flag:#7F5405;
  --flag-bg:rgba(127,84,5,.13);
  --pick:#175D91;
  --pick-bg:rgba(23,93,145,.09);
  --stamp:#B32E1F;
  --focus:#7F5405;
  --thumb:#B0A48D;
  color-scheme:light;
}
:root{
  --sans:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --top:52px;
  --gut:clamp(16px,1.8vw,26px);
  --pad:clamp(24px,2.6vw,46px);
  --perf:26px;
  --recpad:clamp(12px,1.2vw,20px);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
*{scrollbar-width:thin;scrollbar-color:var(--thumb) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent;border-left:1px solid var(--rule)}
::-webkit-scrollbar-thumb{background:var(--thumb);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
body{
  margin:0;background:var(--shell);color:var(--ink);
  font-family:var(--serif);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
b,strong{font-weight:600}
h1,h2,h3,h4{margin:0}
img{max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hide{display:none!important}
.grow{flex:1}

.lbl{
  font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-2);
}

/* ============================ TOP ============================ */
.top{
  position:sticky;top:0;z-index:60;height:var(--top);
  background:var(--shell-2);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:var(--gut);padding:0 var(--gut);
}
.mark{display:flex;align-items:baseline;gap:9px;flex:none}
.mark .w{font-family:var(--sans);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.mark .w em{font-style:normal;color:var(--stamp)}
.mark .s{font-family:var(--sans);font-size:12px;letter-spacing:.02em;color:var(--ink-2);white-space:nowrap}

.seg{display:flex;border:1px solid var(--rule-2);flex:none}
.seg button{
  background:transparent;border:0;border-right:1px solid var(--rule-2);
  font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-2);padding:6px 13px;cursor:pointer;line-height:1.45;
}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink);background:var(--shell-3)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-accent)}
.seg.mini button{padding:5px 9px;font-size:10px;letter-spacing:.1em}
.top .right{display:flex;gap:8px;align-items:center;flex:none}
.icb{
  background:transparent;border:1px solid var(--rule-2);color:var(--ink-2);
  width:29px;height:29px;display:grid;place-items:center;cursor:pointer;
  font-family:var(--sans);font-weight:700;font-size:12px;flex:none;
}
.icb:hover{color:var(--ink);border-color:var(--ink-3)}

/* ============================ GRID ============================ */
.app{
  display:grid;
  grid-template-columns:266px minmax(0,1fr) 304px;
  grid-template-areas:"rail main aside";
  align-items:stretch;min-height:calc(100vh - var(--top));
}
.rail{grid-area:rail;border-right:1px solid var(--rule);background:var(--shell-2)}
.main{grid-area:main;min-width:0;background:var(--paper);position:relative;min-height:calc(100vh - var(--top))}
.aside{grid-area:aside;border-left:1px solid var(--rule);background:var(--shell-2)}
.rail-in,.aside-in{
  position:sticky;top:var(--top);height:calc(100vh - var(--top));
  overflow-y:auto;overflow-x:hidden;padding:16px var(--gut) 40px;
}
@media(max-width:1319px){
  .app{grid-template-columns:244px minmax(0,1fr);grid-template-areas:"rail aside" "rail main";align-content:start}
  .aside{border-left:0;border-bottom:1px solid var(--rule)}
  .aside-in{position:static;height:auto;max-height:none;padding:12px var(--gut)}
  .aside .stack{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 26px;align-items:start}
}
@media(max-width:899px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"rail" "main" "aside"}
  .aside{border-top:1px solid var(--rule);border-bottom:0}
  .only-lg{display:none}
  .rail{border-right:0;border-bottom:1px solid var(--rule)}
  .rail-in{position:static;height:auto;max-height:none;padding:12px var(--gut) 18px}
  body:not(.rail-open) .rail-in{display:none}
  .rail-in .stack{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px 26px;align-items:start}
}
@media(min-width:900px){ .railtoggle{display:none} }
@media(max-width:899px){
  .top{height:auto;min-height:var(--top);flex-wrap:wrap;gap:8px 10px;padding:8px var(--gut)}
  .mark .s{display:none}
  .top .right{margin-left:auto}
  .seg button{padding:6px 9px;font-size:10px;letter-spacing:.07em}
  .seg.mini button{padding:5px 7px}
}
@media(max-width:640px){
  :root{--perf:14px}
  .paper::before,.paper::after{background-size:100% 20px}
}

/* ============================ CONTROLS ============================ */
.blk{margin-bottom:22px}
.blk > .lbl{display:block;margin-bottom:8px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}

.fld{
  width:100%;background:var(--sunken);border:1px solid var(--rule-2);color:var(--ink);
  font-family:var(--serif);font-size:14.5px;padding:8px 10px;
}
.fld::placeholder{color:var(--ink-3);opacity:1}
.fld:focus{outline:none;border-color:var(--stamp);box-shadow:inset 0 0 0 1px var(--stamp)}

/* select tự vẽ — không dùng mũi tên mặc định của hệ điều hành */
.sel{position:relative;display:block}
.sel select{
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  width:100%;background:var(--sunken);color:var(--ink);
  border:1px solid var(--rule-2);border-radius:0;
  padding:9px 42px 9px 12px;font-family:var(--mono);font-size:13.5px;line-height:1.35;
  cursor:pointer;
}
.sel select:hover{border-color:var(--ink-3)}
.sel select:focus{outline:none;border-color:var(--stamp);box-shadow:inset 0 0 0 1px var(--stamp)}
.sel .cap{
  position:absolute;top:1px;right:1px;bottom:1px;width:30px;
  border-left:1px solid var(--rule-2);background:var(--shell-3);
  display:grid;place-items:center;pointer-events:none;
}
.sel .cap::after{
  content:"";width:0;height:0;
  border-left:4.5px solid transparent;border-right:4.5px solid transparent;
  border-top:5.5px solid var(--ink-2);
}
.sel select:hover + .cap::after{border-top-color:var(--ink)}
.sel select:focus + .cap{background:var(--stamp);border-left-color:var(--stamp)}
.sel select:focus + .cap::after{border-top-color:var(--on-accent)}
.sel.on select{border-color:var(--pick);box-shadow:inset 0 0 0 1px var(--pick)}
.sel.on .cap{border-left-color:var(--pick)}

.tlist{display:grid;gap:1px}
.slist{display:grid;border-top:1px solid var(--rule)}
.srow{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;border-bottom:1px solid var(--rule);
  border-left:2px solid transparent;padding:8px 10px;
}
.srow:hover{background:var(--shell-3)}
.srow[aria-pressed="true"]{border-left-color:var(--stamp);background:var(--shell-3)}
.srow[aria-pressed="true"] .nm{color:var(--ink)}
.srow .dot{width:10px;height:10px;flex:none;position:relative;color:var(--ink-3)}
.srow[aria-pressed="true"] .dot{color:var(--ink)}
.srow .dot::before{content:"";position:absolute;inset:1px;border:1px solid currentColor}
.srow .dot.g{color:var(--ok)}   .srow .dot.g::before{background:currentColor}
.srow .dot.r{color:var(--bad)}  .srow .dot.r::before{background:currentColor}
.srow .dot.f{color:var(--flag)} .srow .dot.f::before{background:currentColor}
/* dấu hiệu của từng dạng câu, vẽ lại đúng hình dáng điều khiển tương ứng */
.srow .dot.m-mcq::before{box-shadow:inset 0 0 0 2px currentColor}
.srow .dot.m-yesno::before{border:0;background:linear-gradient(currentColor 0 34%,transparent 34% 66%,currentColor 66% 100%)}
.srow .dot.m-drop::before{border:0;background:currentColor;clip-path:polygon(0 22%,100% 22%,50% 86%)}
.srow .nm{flex:1;font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.03em;
  text-transform:uppercase;color:var(--ink-2)}
.srow .ct{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* nhóm nút dữ liệu — hàng đầy chiều rộng, thống nhất với các danh sách khác */
.vlist{display:grid;border-top:1px solid var(--rule)}
.vrow{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;border-bottom:1px solid var(--rule);padding:10px;
  font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);
}
.vrow:hover{background:var(--shell-3);color:var(--ink)}
.vrow svg{flex:none;width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7}
.vrow.danger{color:var(--bad)}
.vrow.danger:hover{background:var(--bad-bg)}
.trow{
  display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:center;
  background:transparent;border:0;border-left:2px solid transparent;
  padding:6px 8px;cursor:pointer;text-align:left;width:100%;min-width:0;
}
.trow:hover{background:var(--shell-3)}
.trow[aria-pressed="true"]{border-left-color:var(--stamp);background:var(--shell-3)}
.trow .nm{font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.trow .ct{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.meter{grid-column:1/-1;height:4px;background:var(--rule);display:flex;overflow:hidden}
.meter i{display:block;height:100%}
.meter .g{background:var(--ok)}
.meter .r{background:var(--bad)}

.act{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;background:transparent;color:var(--ink);
  border:1px solid var(--rule-2);padding:7px 13px;cursor:pointer;line-height:1.4;
}
.btn:hover{border-color:var(--ink);background:var(--shell-3)}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{border-color:var(--rule-2);background:transparent;color:var(--ink)}
.btn.solid{background:var(--ink);border-color:var(--ink);color:var(--on-accent)}
.btn.solid:hover:not(:disabled){filter:brightness(1.12)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:5px 10px;font-size:10px}

/* ============================ ASIDE ============================ */
.kv{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:3px 0}
.kv span{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.kv b{font-family:var(--mono);font-size:12.5px;font-weight:600}
.bigbar{height:8px;border:1px solid var(--rule-2);display:flex;margin:6px 0;overflow:hidden}
.bigbar i{display:block;height:100%}
.queue{display:grid;gap:2px;max-height:270px;overflow:auto}
.qbtn{
  display:flex;gap:8px;align-items:baseline;background:transparent;border:0;
  border-left:2px solid var(--rule-2);padding:5px 8px;text-align:left;cursor:pointer;width:100%;min-width:0;
}
.qbtn:hover{background:var(--shell-3)}
.qbtn.is-wrong{border-left-color:var(--bad)}
.qbtn.is-flag{border-left-color:var(--flag)}
.qbtn .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);flex:none}
.qbtn .t{min-width:0;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.keys{display:grid;gap:3px}
.keyrow{display:flex;gap:8px;align-items:center;font-family:var(--serif);font-size:12.5px;color:var(--ink-2)}
kbd{
  font-family:var(--mono);font-size:10px;background:var(--shell-3);border:1px solid var(--rule-2);
  border-bottom-width:2px;padding:1px 5px;color:var(--ink);min-width:18px;text-align:center;
}

/* ============================ PAPER ============================ */
.paper{position:relative;padding:0 var(--perf);min-height:100%}
.paper::before,.paper::after{
  content:"";position:absolute;top:0;bottom:0;width:var(--perf);
  background:var(--paper-2);pointer-events:none;
}
.paper::before{left:0;border-right:1px solid var(--rule);box-shadow:inset -4px 0 0 -3px var(--rule)}
.paper::after{right:0;border-left:1px solid var(--rule);box-shadow:inset 4px 0 0 -3px var(--rule)}
.sheet{padding:0 var(--pad) 64px}

.head{padding:30px 0 18px;border-bottom:2px solid var(--ink);display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.head h2{font-family:var(--sans);font-weight:700;font-size:clamp(22px,2.6vw,34px);letter-spacing:-.01em;text-transform:uppercase;line-height:1}
.head p{font-family:var(--serif);font-size:14.5px;color:var(--ink-2);margin:8px 0 0;max-width:62ch}
.head .r{margin-left:auto;text-align:right}

.rec{
  border-bottom:1px solid var(--rule);
  padding:22px var(--recpad) 24px;margin:0 calc(-1 * var(--recpad));
  scroll-margin-top:calc(var(--top) + 12px);
}
.rec.cur{background:var(--paper-2);box-shadow:inset 3px 0 0 var(--stamp)}
.rec.cur .idx{color:var(--stamp)}
.rechead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px;max-width:86ch}
.idx{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.05em}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.flagbtn{
  flex:none;width:26px;height:24px;display:grid;place-items:center;cursor:pointer;
  background:transparent;border:1px solid var(--rule-2);color:var(--ink-2);
}
.flagbtn svg{width:12px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9}
.flagbtn:hover{color:var(--flag);border-color:var(--flag)}
.flagbtn[aria-pressed="true"]{color:var(--flag);border-color:var(--flag);background:var(--flag-bg)}
.flagbtn[aria-pressed="true"] svg{fill:currentColor}
.tag{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid var(--rule-2);color:var(--ink-2);padding:2px 6px;white-space:nowrap;
}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.bad{color:var(--bad);border-color:var(--bad)}
.tag.flag{color:var(--flag);border-color:var(--flag)}
.tag.multi{color:var(--pick);border-color:var(--pick)}

.stem{font-family:var(--mono);font-size:14.5px;line-height:1.62;margin:0;max-width:78ch}
.gloss{
  display:block;font-family:var(--serif);font-size:14.5px;line-height:1.6;
  color:var(--ink-2);max-width:74ch;margin:4px 0 0;
}
.qbody{margin-top:16px}
.qimg{display:block;margin:14px 0 4px;border:1px solid var(--rule-2);max-width:min(100%,620px);cursor:zoom-in}

/* --- phương án nhiều lựa chọn --- */
.opts{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-width:86ch}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:transparent;border:1px solid transparent;color:var(--ink);
  padding:8px 10px;cursor:pointer;
}
.opt:hover{border-color:var(--rule-2)}
.opt .k{
  flex:none;width:22px;height:22px;display:grid;place-items:center;margin-top:1px;
  border:1px solid var(--rule-2);font-family:var(--mono);font-weight:600;font-size:11.5px;
}
.opt .tx{flex:1;min-width:0;font-family:var(--mono);font-size:13.5px;line-height:1.55}
.opt .tx .gloss{font-size:13.5px;margin-top:3px}
.opt .mk{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;white-space:nowrap;padding-top:5px;display:none;
}
.opt[data-pick="1"]{border-color:var(--pick);background:var(--pick-bg)}
.opt[data-pick="1"] .k{background:var(--pick);border-color:var(--pick);color:var(--on-accent)}
.opt[data-pick="1"] .mk-you{display:block;color:var(--pick)}
.rec[data-done="1"] .opt{cursor:default}
.rec[data-done="1"] .opt:hover{border-color:transparent}
.rec[data-done="1"] .opt[data-right="1"]{border-color:var(--ok);background:var(--ok-bg)}
.rec[data-done="1"] .opt[data-right="1"] .k{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.rec[data-done="1"] .opt[data-right="1"] .mk-ok{display:block;color:var(--ok)}
.rec[data-done="1"] .opt[data-right="1"] .mk-you{display:none}
.rec[data-done="1"] .opt[data-pick="1"][data-right="0"]{border-color:var(--bad);background:var(--bad-bg)}
.rec[data-done="1"] .opt[data-pick="1"][data-right="0"] .k{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.rec[data-done="1"] .opt[data-pick="1"][data-right="0"] .mk-you{display:block;color:var(--bad)}

/* --- dạng Có / Không theo dòng --- */
.ynlist{list-style:none;margin:0;padding:0;max-width:92ch;border-top:1px solid var(--rule)}
.yn{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:center;
  padding:12px 10px;border-bottom:1px solid var(--rule);
}
.yn .ynt{font-family:var(--mono);font-size:13.5px;line-height:1.55;min-width:0}
.yn .ynt .gloss{font-size:13.5px;margin-top:3px}
.ynb{display:flex;flex:none;border:1px solid var(--rule-2)}
.ynb button{
  background:transparent;border:0;border-right:1px solid var(--rule-2);
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-2);padding:6px 14px;cursor:pointer;min-width:64px;
}
.ynb button:last-child{border-right:0}
.ynb button:hover{background:var(--shell-3);color:var(--ink)}
.ynb button[aria-pressed="true"]{background:var(--pick);color:var(--on-accent)}
.rec[data-done="1"] .ynb button{cursor:default}
.rec[data-done="1"] .ynb button:hover{background:transparent;color:var(--ink-2)}
.rec[data-done="1"] .ynb button[aria-pressed="true"]{background:var(--bad);color:var(--on-accent)}
.rec[data-done="1"] .yn[data-right="1"] .ynb button[aria-pressed="true"]{background:var(--ok);color:var(--on-accent)}
.rec[data-done="1"] .yn[data-right="0"] .ynb button[data-correct="1"]{box-shadow:inset 0 0 0 2px var(--ok);color:var(--ok)}

/* --- dạng chọn từ danh sách --- */
.blanks{display:grid;gap:18px;max-width:78ch}
.blank .blabel{display:block;font-family:var(--mono);font-size:13px;line-height:1.55;margin-bottom:8px;color:var(--ink)}
.blank .blabel .gloss{font-size:13px;margin-top:3px}
.blank .ansline{
  font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  margin-top:7px;display:none;
}
.rec[data-done="1"] .blank[data-right="0"] .ansline{display:block}
.blank .ansline.ok{color:var(--ok)}
.blank .ansline.bad{color:var(--bad)}
.rec[data-done="1"] .sel select{pointer-events:none}
.rec[data-done="1"] .blank[data-right="1"] select{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.rec[data-done="1"] .blank[data-right="0"] select{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}

.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px;max-width:86ch}
.note{font-family:var(--serif);font-size:13.5px;color:var(--ink-2)}

/* --- khối đáp án --- */
.rev{display:none;margin-top:20px;border-top:1px solid var(--ink);padding-top:18px}
.rec[data-done="1"] .rev{display:block}
.revtop{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.stamp{
  border:2.5px solid var(--stamp);color:var(--stamp);padding:5px 13px 6px;
  transform:rotate(-2.2deg);box-shadow:inset 0 0 0 1px var(--stamp);
  display:flex;align-items:baseline;gap:10px;flex:none;max-width:100%;
}
.stamp .t{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.stamp .v{font-family:var(--sans);font-weight:700;font-size:26px;line-height:1;letter-spacing:.06em}
.stamp.txt .v{font-size:15px;letter-spacing:.02em;font-family:var(--mono);font-weight:600;line-height:1.35}
.verdict{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--bad)}
.conf{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid currentColor;padding:3px 8px;
}
.conf.h{color:var(--ok)}
.conf.m{color:var(--flag)}
.conf.l{color:var(--bad)}

.revgrid{display:grid;gap:20px 36px}
@media(min-width:1500px){ .revgrid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }
.sech{
  font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-2);display:flex;align-items:center;gap:10px;margin-bottom:8px;
}
.sech::after{content:"";flex:1;height:0;border-top:1px dotted var(--rule-2)}
.prose{font-family:var(--serif);font-size:15.5px;line-height:1.7;max-width:72ch;margin:0}
.prose b{box-shadow:inset 0 -2px 0 var(--flag)}
ul.elim{list-style:none;margin:0;padding:0;max-width:72ch}
ul.elim li{font-family:var(--serif);font-size:15px;line-height:1.65;padding-left:20px;position:relative;margin-bottom:6px}
ul.elim li::before{content:"\00D7";position:absolute;left:2px;top:-1px;font-family:var(--sans);font-weight:700;color:var(--bad);font-size:16px}
.cite{
  font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-top:16px;
  padding-top:10px;border-top:1px dotted var(--rule-2);max-width:78ch;word-break:break-word;
}
.notewrap{margin-top:20px;padding-top:16px;border-top:1px dotted var(--rule-2)}
.notewrap .lbl{display:block;margin-bottom:6px}
.notewrap textarea{
  display:block;width:100%;max-width:72ch;min-height:64px;resize:vertical;background:var(--sunken);
  border:1px solid var(--rule-2);color:var(--ink);font-family:var(--serif);font-size:14.5px;padding:9px 11px;
}
.notewrap textarea:focus{outline:none;border-color:var(--stamp)}

/* ============================ EXAM ============================ */
.panel{border:1px solid var(--rule-2);background:var(--paper-2);padding:24px var(--pad);margin-top:24px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px 24px;align-items:end}
.grid2 .lbl{min-height:15px}
.fldw{display:grid;gap:6px}
.timer{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:.06em}
.timer.low{color:var(--bad)}
.pal{display:flex;flex-wrap:wrap;gap:4px}
.pd{
  width:30px;height:28px;border:1px solid var(--rule-2);background:transparent;color:var(--ink-2);
  font-family:var(--mono);font-size:11px;cursor:pointer;position:relative;
}
.pd:hover{border-color:var(--ink-3);color:var(--ink)}
.pd.is-ans{border-color:var(--pick);color:var(--pick)}
.pd.is-flag::after{content:"";position:absolute;top:2px;right:2px;width:4px;height:4px;background:var(--flag)}
.pd.is-cur{background:var(--ink);border-color:var(--ink);color:var(--on-accent)}

.score{display:flex;gap:36px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .n b{font-family:var(--sans);font-weight:700;font-size:34px;line-height:1}
.ring .n span{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);letter-spacing:.1em;text-transform:uppercase}
.result-h{font-family:var(--sans);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase}
.result-h.ok{color:var(--ok)}
.result-h.bad{color:var(--flag)}
.figs{display:flex;gap:28px;flex-wrap:wrap;margin-top:12px}
.fig b{display:block;font-family:var(--mono);font-size:23px;font-weight:600}

/* ============================ TABLE ============================ */
.tw{overflow-x:auto;margin-top:12px}
.tw table{min-width:440px}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule)}
th{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);border-bottom-color:var(--rule-2)}
td:first-child{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.02em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.sbar{height:5px;background:var(--rule);display:flex;min-width:70px}
.sbar i{display:block;height:100%}

.empty{padding:64px 10px;text-align:center;font-family:var(--serif);font-size:14.5px;color:var(--ink-2)}
.empty b{display:block;font-family:var(--sans);font-size:18px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-bottom:8px}

/* ============================ OVERLAY ============================ */
.ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px}
.ov .box{background:var(--shell-2);border:1px solid var(--rule-2);max-width:520px;width:100%;padding:22px 24px;max-height:86vh;overflow:auto}
.ov h3{font-family:var(--sans);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.ov p{font-family:var(--serif);font-size:14.5px;color:var(--ink-2);margin:0 0 16px}
.ov.zoom{cursor:zoom-out}
.ov.zoom img{max-width:96vw;max-height:92vh;border:1px solid var(--rule-2)}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;
  background:var(--ink);color:var(--on-accent);font-family:var(--mono);font-size:12.5px;
  padding:9px 16px;border:1px solid var(--ink);
}

/* ============ RESPONSIVE OVERRIDES (phải nằm sau mọi component) ============ */
@media(max-width:640px){
  .yn{grid-template-columns:minmax(0,1fr);gap:12px}
  .ynb{justify-self:start}
  .ynb button{min-width:84px;padding:7px 16px}
  .stem,.opt .tx,.yn .ynt{font-size:13.5px}
  .revtop{gap:12px}
  .stamp{transform:none}
}

/* ============================ PRINT ============================ */
@media print{
  body{background:#fff;color:#000}
  .top,.rail,.aside,.bar,.notewrap,.ov,.toast{display:none!important}
  .app{display:block}
  .main{background:#fff}
  .paper{padding:0}
  .paper::before,.paper::after{display:none}
  .rec{break-inside:avoid;background:#fff!important}
  .rev{display:block!important}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

<script>
/* ============================================================
   Exam Trainer — engine
   Hỗ trợ 3 dạng câu: mcq · yesno · dropdown
   ============================================================ */
const DATA = {"meta":{"code":"CCAR-F","title":{"en":"Claude Certified Architect - Foundations"},"org":"Anthropic","pass":70},"topics":[{"n":1,"title":{"en":"Topic 1","vi":"Chủ đề 1"},"questions":[{"id":"t1q1","n":1,"topic":1,"type":"mcq","stem":{"en":"A developer asks the agent to investigate why a specific API endpoint intermittently returns 500 responses. The codebase has 200+ files and the developer doesn&#x27;t know which components are involved. The agent must trace the error through routing, middleware, business logic, and database layers. What task decomposition approach would be most effective?"},"options":[{"k":"A","t":{"en":"Run parallel worker agents on the file system of four layers, then combine their findings to reconstruct the complete error path."}},{"k":"B","t":{"en":"Have the agent dynamically generate investigation subtasks based on what it discovers at each step, adapting its exploration plan as new information about the error path emerges."}},{"k":"C","t":{"en":"Define a fixed sequence of investigation steps upfront—grep for error handlers, then examine middleware, then check database queries, then examine middleware-woven code."}},{"k":"D","t":{"en":"Have the agent first create a comprehensive plan mapping all code paths through documented components before beginning any exploration or code reading."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Điều tra lỗi 500 chập chờn trong codebase 200+ tệp khi chưa biết thành phần nào liên quan là bài toán <b>mở, không đoán trước được lộ trình</b>: mỗi tệp đọc được sẽ quyết định bước tiếp theo nên làm gì. Vì vậy cần <b>phân rã thích ứng động</b> — agent sinh các subtask điều tra dựa trên những gì vừa phát hiện (ví dụ thấy middleware nuốt exception thì lần theo nhánh đó) và điều chỉnh kế hoạch khi đường đi của lỗi qua routing → middleware → business logic → database lộ dần. Pipeline cố định chỉ phù hợp khi các bước đã biết trước.","elim":["<b>A.</b> Chia cứng theo bốn tầng và chạy worker song song giả định đã biết lỗi nằm ở đâu; các worker không thấy phát hiện của nhau nên khó lần ra một đường lỗi xuyên tầng, việc ghép kết quả sau cùng dễ đứt mạch nhân quả.","<b>C.</b> Chuỗi bước định sẵn không thích ứng với phát hiện mới; nếu nguyên nhân nằm ngoài kịch bản (ví dụ race condition ở connection pool) agent vẫn đi theo lộ trình cứng và bỏ lỡ.","<b>D.</b> Lập bản đồ toàn bộ code path trước khi đọc code là bất khả thi với 200+ tệp chưa biết, tốn context, và tài liệu có thể không phản ánh code thực — kế hoạch đó vẫn phải sửa liên tục khi điều tra."]},"cite":"Hướng dẫn ôn tập — §8.2 Phân rã thích ứng động (Dynamic Adaptive Decomposition); Lĩnh vực 1.6"},{"id":"t1q2","n":2,"topic":1,"type":"mcq","stem":{"en":"Your agent needs to insert a new helper function into the middle of a 150-line utility module, between two existing functions. The Edit tool fails because its old_string parameter cannot find unique text to match – the file has repetitive docstrings, variable names, and structural patterns. What&#x27;s the most reliable way to complete this insertion?"},"options":[{"k":"A","t":{"en":"Use Read to load the file, add the function at the appropriate location, then Write the updated file"}},{"k":"B","t":{"en":"Use Edit&#x27;s replace_all parameter to target a common pattern and embed the new function in the replacement text"}},{"k":"C","t":{"en":"Use Edit with an extremely long old_string capturing 30+ lines of context to guarantee uniqueness"}},{"k":"D","t":{"en":"Use Bash to append the function definition to the end of the file using heredoc syntax"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Khi <code>Edit</code> thất bại vì <code>old_string</code> không khớp được đoạn văn bản <b>duy nhất</b> (tệp có docstring, tên biến, cấu trúc lặp lại), phương án dự phòng chuẩn là <b>Read + Write</b>: dùng <code>Read</code> nạp toàn bộ tệp, chèn hàm mới vào đúng vị trí giữa hai hàm, rồi <code>Write</code> ghi lại toàn bộ nội dung. Với module chỉ 150 dòng, cách này rẻ, xác định và đảm bảo hàm nằm đúng chỗ.","elim":["<b>B.</b> <code>replace_all</code> thay thế MỌI chỗ khớp; với mẫu lặp lại, hàm mới sẽ bị chèn nhiều lần ở nhiều vị trí, làm hỏng module.","<b>C.</b> <code>old_string</code> dài 30+ dòng rất dễ lệch một ký tự hay khoảng trắng nên Edit vẫn có thể thất bại, và với cấu trúc lặp vẫn không bảo đảm duy nhất — mong manh, không phải cách đáng tin cậy nhất.","<b>D.</b> Nối vào cuối tệp bằng heredoc đặt hàm sai vị trí, trong khi yêu cầu là chèn vào giữa hai hàm hiện có."]},"cite":"Hướng dẫn ôn tập — §13.3 Phương án Dự phòng: Read + Write thay vì Edit; Lĩnh vực 2.5"},{"id":"t1q3","n":3,"topic":1,"type":"mcq","stem":{"en":"An engineer used Claude Code yesterday to investigate authentication flows in a legacy monolith, building up significant context over a 2-hour session. Today she wants to continue that specific investigation. She&#x27;s worked on three other codebases since then and knows the session was named &quot;auth-deep-dive&quot;. How should she resume?"},"options":[{"k":"A","t":{"en":"Use --resume auth-deep-dive to load that specific session by name"}},{"k":"B","t":{"en":"Use --session-id with the UUID from yesterday&#x27;s session transcript file"}},{"k":"C","t":{"en":"Use --continue to pick up where the most recent conversation left off"}},{"k":"D","t":{"en":"Start fresh and re-read the same files"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> <code>--resume &lt;session-name&gt;</code> nạp lại <b>đúng một phiên đã đặt tên</b> cùng toàn bộ context đã lưu. Kỹ sư biết tên phiên là “auth-deep-dive” và đã làm việc ở ba codebase khác kể từ đó, nên <code>claude --resume auth-deep-dive</code> là cách trực tiếp, chính xác nhất để quay lại cuộc điều tra 2 giờ hôm qua mà không mất context đã tích lũy.","elim":["<b>B.</b> <code>--session-id</code> dùng để chỉ định UUID cho một phiên, không phải cách tự nhiên để tiếp tục phiên đã đặt tên; lục UUID trong file transcript là thủ công và không cần thiết khi đã biết tên phiên.","<b>C.</b> <code>--continue</code> chỉ tiếp tục cuộc hội thoại gần nhất; sau khi làm việc với ba codebase khác, không có gì bảo đảm phiên gần nhất là “auth-deep-dive”.","<b>D.</b> Bắt đầu lại và đọc lại tệp vứt bỏ 2 giờ context đã xây dựng, trong khi phiên vẫn còn và có thể resume được."]},"cite":"Hướng dẫn ôn tập — §5.10 fork_session và Quản lý Session; Lĩnh vực 1.7"},{"id":"t1q4","n":4,"topic":1,"type":"mcq","stem":{"en":"An engineer&#x27;s exploration subagent spent 30 minutes analyzing a legacy payment system, reading 47 files and documenting data flows. The session was interrupted when the engineer&#x27;s connection dropped. While away, a teammate merged a PR that renamed two utility functions. The engineer wants to continue the same exploration. What&#x27;s the most effective approach?"},"options":[{"k":"A","t":{"en":"Resume the subagent from its previous transcript without mentioning the changes–the architecture understanding remains valid."}},{"k":"B","t":{"en":"Resume the subagent from its previous transcript and inform it about the renamed functions."}},{"k":"C","t":{"en":"Launch a fresh subagent and include the prior transcript in the initial prompt for context."}},{"k":"D","t":{"en":"Launch a fresh subagent with a summary of prior findings."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Hiểu biết kiến trúc và data flow từ 47 tệp vẫn <b>phần lớn còn giá trị</b> — thay đổi chỉ là hai hàm tiện ích bị đổi tên. Resume subagent từ transcript giữ lại 30 phút phân tích, và <b>thông báo cụ thể về các thay đổi</b> giúp nó cập nhật hoặc đọc lại có mục tiêu thay vì tiếp tục dựa vào tên hàm cũ đã lỗi thời. Đây là cân bằng tốt nhất giữa hiệu quả và độ chính xác khi resume.","elim":["<b>A.</b> Không báo về việc đổi tên khiến subagent tiếp tục tham chiếu tên hàm không còn tồn tại; kết quả tool trong transcript đã lỗi thời và dẫn tới kết luận sai.","<b>C.</b> Nhồi toàn bộ transcript cũ vào prompt của subagent mới tốn rất nhiều context, vẫn mang theo thông tin lỗi thời và cũng không báo về thay đổi — kém hơn resume trực tiếp.","<b>D.</b> Bản tóm tắt làm mất nhiều chi tiết data flow đã tích lũy; khởi động mới chỉ đáng khi context suy giảm nặng hoặc codebase đổi lớn, còn ở đây chỉ có hai hàm bị đổi tên."]},"cite":"Hướng dẫn ôn tập — §5.10 fork_session và Quản lý Session; Lĩnh vực 1.7"},{"id":"t1q5","n":5,"topic":1,"type":"mcq","stem":{"en":"Your agent has spent 25 minutes exploring a game engine&#x27;s rendering subsystem–reading shader code, buffer management, and frame synchronization logic. An engineer now asks it to understand how the physics engine integrates with rendering for collision debug overlays. You notice recent responses reference &quot;typical rendering patterns&quot; rather than the specific VulkanPipeline and FrameGraph classes it discovered earlier. What&#x27;s the most effective approach?"},"options":[{"k":"A","t":{"en":"Use /clear to reset context completely, then start fresh with physics exploration using file paths from the project&#x27;s CLAUDE.md."}},{"k":"B","t":{"en":"Summarize key rendering findings, then spawn a sub-agent for physics exploration with that summary in its initial context."}},{"k":"C","t":{"en":"Spawn a sub-agent to explore physics independently, then manually synthesize its findings with the rendering knowledge accumulated in the main conversation."}},{"k":"D","t":{"en":"Continue in the current context with more targeted prompts referencing the specific classes by name."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Việc agent nói về “typical rendering patterns” thay vì các lớp cụ thể <code>VulkanPipeline</code>, <code>FrameGraph</code> là dấu hiệu <b>context đã suy giảm</b> sau 25 phút khám phá. Cách hiệu quả: <b>tóm tắt các phát hiện then chốt về rendering</b> (giữ tên lớp, điểm tích hợp) rồi <b>spawn subagent</b> khám phá physics với bản tóm tắt đó trong context ban đầu — subagent có context sạch, đồng thời vẫn biết những gì cần để tìm điểm nối physics–rendering cho collision debug overlay.","elim":["<b>A.</b> <code>/clear</code> xóa sạch toàn bộ hiểu biết rendering, trong khi tác vụ overlay va chạm lại cần chính kiến thức đó; CLAUDE.md không chứa các phát hiện của phiên khám phá.","<b>C.</b> Subagent khám phá độc lập không biết gì về rendering nên khó tìm đúng điểm tích hợp; bước tổng hợp lại dựa vào context chính vốn đã suy giảm.","<b>D.</b> Tiếp tục trong context đã suy giảm và nạp thêm code physics chỉ làm vấn đề tệ hơn; nhắc tên lớp không khôi phục được các chi tiết đã bị mờ."]},"cite":"Hướng dẫn ôn tập — §11.5 Ủy quyền cho Subagent để Bảo vệ Context; Lĩnh vực 5.4"},{"id":"t1q6","n":6,"topic":1,"type":"mcq","stem":{"en":"An engineer asks the agent to find all callers of a function before removing it. The function is defined in a core library but is also exposed through wrapper modules that rename the function for domain-specific use (e.g., calculateTax in the library becomes computeOrderTax in the orders module). What exploration strategy will most reliably identify all callers?"},"options":[{"k":"A","t":{"en":"Read the library and wrapper modules to identify all exposed names for the function, then Grep for each name across the codebase."}},{"k":"B","t":{"en":"Use Grep to search for the function&#x27;s original name across the codebase."}},{"k":"C","t":{"en":"Use Grep to find all files that import from the library or wrapper modules, then read each file to check whether it uses the function."}},{"k":"D","t":{"en":"Search for the function name in project documentation to understand intended usage patterns and navigate to documented integration points."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Hàm được export lại qua các wrapper <b>đổi tên</b> (ví dụ <code>calculateTax</code> → <code>computeOrderTax</code>), nên grep một tên duy nhất chắc chắn bỏ sót. Cách đáng tin cậy là <b>đọc thư viện và các wrapper để liệt kê mọi tên được expose</b>, rồi <code>Grep</code> từng tên trên toàn codebase — đúng chiến lược điều tra tăng dần: Read để hiểu cấu trúc, rồi Grep tìm usage.","elim":["<b>B.</b> Chỉ grep tên gốc bỏ sót mọi caller dùng tên wrapper như <code>computeOrderTax</code>; xóa hàm sẽ làm hỏng các caller đó.","<b>C.</b> Thư viện lõi có thể được import ở rất nhiều nơi cho các hàm khác, nên đọc từng file import là tốn context lớn; và vẫn phải biết các tên alias mới nhận ra được cách dùng.","<b>D.</b> Tài liệu dự án thường không đầy đủ hoặc lỗi thời; không thể dựa vào nó để tìm TẤT CẢ caller trước khi xóa hàm."]},"cite":"Hướng dẫn ôn tập — §13.2 Chiến lược Điều tra Tăng dần; Lĩnh vực 2.5"},{"id":"t1q7","n":7,"topic":1,"type":"mcq","stem":{"en":"During testing, you observe that in extended exploration sessions (30+ minutes), the agent starts giving inconsistent answers about code structure it discussed earlier. Engineers report having to repeat context about modules they&#x27;ve already explored. What&#x27;s the most effective approach to address this?"},"options":[{"k":"A","t":{"en":"Implement automatic context clearing every 15 minutes to ensure the agent starts with fresh, uncontaminated context."}},{"k":"B","t":{"en":"Switch to a higher-capacity model tier to provide more context window space for accumulated exploration data."}},{"k":"C","t":{"en":"Have the agent maintain a scratchpad file that records key findings, referencing it for subsequent questions."}},{"k":"D","t":{"en":"Create summaries of all source files before exploration begins, loading only these compressed representations into context."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Trong phiên dài 30+ phút, các chi tiết khám phá sớm bị đẩy xa hoặc bị nén trong context, khiến câu trả lời mâu thuẫn. <b>Tệp scratchpad</b> lưu các phát hiện then chốt (lớp, quan hệ, vị trí tệp) <b>bên ngoài context</b>; agent tham chiếu lại khi trả lời thay vì dựa vào trí nhớ hội thoại đã suy giảm hay khám phá lại. Kiến thức này còn tồn tại qua <code>/compact</code> hoặc session mới.","elim":["<b>A.</b> Xóa context mỗi 15 phút phá hủy chính những gì đã khám phá, buộc kỹ sư lặp lại context nhiều hơn — làm trầm trọng đúng vấn đề đang gặp.","<b>B.</b> Context window lớn hơn không khắc phục suy giảm chú ý trên context dài, chỉ trì hoãn; vấn đề là tổ chức thông tin chứ không phải dung lượng.","<b>D.</b> Tóm tắt mọi tệp trước khi khám phá là tốn kém, phần lớn không liên quan đến câu hỏi thực tế, và bản nén làm mất chi tiết cần để trả lời chính xác."]},"cite":"Hướng dẫn ôn tập — §11.4 Tệp Scratchpad; Lĩnh vực 5.4"},{"id":"t1q8","n":8,"topic":1,"type":"mcq","stem":{"en":"After adding an MCP server with specialized code refactoring tools (extract_function, rename_variable, inline_function), you notice the agent still uses basic text manipulation via Write and Bash sed commands for refactoring tasks. The MCP server is connected and working. Examining the configuration, you find each MCP tool has a minimal description like &quot;extract_function: extracts a function from code.&quot; What&#x27;s the most effective way to improve adoption of the MCP refactoring tools?"},"options":[{"k":"A","t":{"en":"Accept this as expected behavior since simpler tools like sed are more predictable than specialized refactoring tools."}},{"k":"B","t":{"en":"Remove the Write tool from the agent&#x27;s configuration for refactoring sessions so it must use the MCP tools for code modifications."}},{"k":"C","t":{"en":"Enhance the MCP tool descriptions to explain when each tool is preferable to text manipulation and clarify expected inputs and outputs."}},{"k":"D","t":{"en":"Implement a request classifier that detects refactoring intent and automatically routes those requests to the MCP server before the agent processes them."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Claude chọn tool chủ yếu dựa trên <b>mô tả tool</b> mà nó thấy. Mô tả kiểu “extract_function: extracts a function from code” không nói khi nào nên dùng thay cho <code>Write</code>/<code>sed</code>, cũng không nêu đầu vào/đầu ra, nên agent quay về công cụ quen thuộc. <b>Mở rộng mô tả</b> — nêu rõ khi nào tool ưu việt hơn thao tác văn bản (refactor an toàn theo ngữ nghĩa, tự cập nhật tham chiếu), tham số và kết quả trả về — là cách trực tiếp, đúng gốc rễ để tăng mức sử dụng.","elim":["<b>A.</b> Refactor bằng sed dễ lỗi hơn công cụ hiểu cấu trúc code; nguyên nhân (mô tả sơ sài) hoàn toàn sửa được nên không thể chấp nhận như hành vi bình thường.","<b>B.</b> Gỡ <code>Write</code> là biện pháp thô bạo, làm mất khả năng ghi tệp cho nhu cầu chính đáng khác, và agent vẫn còn Bash sed — không xử lý gốc rễ.","<b>D.</b> Bộ phân loại định tuyến bên ngoài là over-engineering, bỏ qua khả năng chọn tool của agent và tự nó có thể phân loại sai; sửa mô tả tool đơn giản và hiệu quả hơn."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q9","n":9,"topic":1,"type":"mcq","stem":{"en":"An engineer asks the agent to investigate error handling in a legacy payment processing module spanning 15 files. After reading the first 8 files, the agent&#x27;s responses are becoming noticeably less accurate—it&#x27;s forgetting previously discovered code patterns and hasn&#x27;t yet located all test files or traced the complete data flow. What&#x27;s the most effective approach to complete this investigation?"},"options":[{"k":"A","t":{"en":"Use Grep to search for specific function names across remaining files, reducing the content loaded into context."}},{"k":"B","t":{"en":"Spawn a subagent to explore the remaining files, providing a summary of discovered patterns as its initial context."}},{"k":"C","t":{"en":"Document a summary of findings so far in a file, then start fresh with a new context using that summary as reference."}},{"k":"D","t":{"en":"Close the current context with /clear and start fresh, re-reading only the most critical files."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Độ chính xác giảm sau 8 tệp cho thấy <b>context đã quá tải</b>. Spawn <b>subagent</b> với context sạch để khám phá các tệp còn lại (tìm test, lần data flow), kèm <b>bản tóm tắt các mẫu đã phát hiện</b> làm context ban đầu: phần đọc tệp nặng nề diễn ra trong context riêng của subagent, nó chỉ trả về kết quả cô đọng, còn agent chính giữ được các phát hiện trước đó để tổng hợp.","elim":["<b>A.</b> Grep giảm lượng nạp nhưng không khắc phục context đã suy giảm; lần data flow và tìm test cần đọc hiểu chứ không chỉ khớp tên hàm.","<b>C.</b> Khởi động lại với bản tóm tắt làm agent chính mất toàn bộ chi tiết đã đọc, và nó vẫn phải tự đọc các tệp còn lại trong cùng một context nên sẽ lại suy giảm; subagent cô lập phần việc tốt hơn.","<b>D.</b> <code>/clear</code> xóa sạch phát hiện mà không lưu lại gì, buộc đọc lại tệp và lặp lại công việc đã làm."]},"cite":"Hướng dẫn ôn tập — §11.5 Ủy quyền cho Subagent để Bảo vệ Context; Lĩnh vực 5.4"},{"id":"t1q10","n":10,"topic":1,"type":"mcq","stem":{"en":"An engineer used the agent yesterday to analyze a legacy authentication module, identifying two distinct refactoring approaches: extracting a microservice versus refactoring in-place. Today, they want to explore both approaches in depth–having the agent propose specific code changes for each–before deciding which to implement. What&#x27;s the most effective way to structure this exploration?"},"options":[{"k":"A","t":{"en":"Start two fresh sessions, manually providing a summary of yesterday&#x27;s analysis findings to establish context."}},{"k":"B","t":{"en":"Resume yesterday&#x27;s session to explore the first approach, then start a new session for the second, manually recreating the original context."}},{"k":"C","t":{"en":"Use fork_session to create two branches from yesterday&#x27;s analysis, exploring one approach in each fork."}},{"k":"D","t":{"en":"Resume yesterday&#x27;s session and explore both approaches sequentially within the same conversation thread."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> <code>fork_session</code> tạo các <b>nhánh độc lập từ cùng một điểm context</b>: cả hai fork kế thừa toàn bộ phân tích hôm qua về module xác thực, sau đó phân kỳ — một nhánh đề xuất code cho hướng tách microservice, nhánh kia cho refactor tại chỗ. Mỗi hướng được khám phá sâu mà không ảnh hưởng nhau, và không phải dựng lại context thủ công.","elim":["<b>A.</b> Tóm tắt thủ công làm mất chi tiết phân tích hôm qua và tốn công, trong khi phiên gốc vẫn tồn tại để fork.","<b>B.</b> Phiên thứ hai phải dựng lại context thủ công nên có context kém hơn phiên thứ nhất — so sánh hai hướng không công bằng và tốn công.","<b>D.</b> Khám phá tuần tự trong cùng luồng khiến hướng thứ nhất ảnh hưởng (anchor) hướng thứ hai, đồng thời làm context phình to và chất lượng phần sau giảm."]},"cite":"Hướng dẫn ôn tập — §5.10 fork_session và Quản lý Session; Lĩnh vực 1.7"},{"id":"t1q11","n":11,"topic":1,"type":"mcq","stem":{"en":"Your agent has analyzed a complex service module–reading 23 source files, tracing request flows, and identifying error handling patterns. A developer wants to compare two testing strategies before committing to one: end-to-end tests with mocked external services vs. snapshot tests capturing expected outputs. They need to independently develop both approaches to evaluate trade-offs. How should you manage the sessions?"},"options":[{"k":"A","t":{"en":"Resume the analysis session with fork_session enabled, creating a separate branch for each testing strategy."}},{"k":"B","t":{"en":"Export the analysis session&#x27;s key findings to a file, then create two new sessions that reference this file."}},{"k":"C","t":{"en":"Continue in the original session, developing end-to-end tests first, then snapshot tests sequentially."}},{"k":"D","t":{"en":"Start two fresh sessions, having each re-read the relevant source files before beginning."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Cần phát triển <b>độc lập</b> hai chiến lược kiểm thử nhưng cả hai đều dựa trên cùng một phân tích (23 tệp, luồng request, mẫu xử lý lỗi). Resume phiên phân tích với <code>fork_session</code> tạo <b>mỗi chiến lược một nhánh</b>: cả hai kế thừa đầy đủ context đến điểm phân nhánh rồi phân kỳ, nên có thể so sánh trade-off công bằng mà không phải phân tích lại.","elim":["<b>B.</b> Xuất key findings ra tệp chỉ giữ bản tóm lược; hai phiên mới mất phần lớn context chi tiết về 23 tệp và luồng request.","<b>C.</b> Làm tuần tự trong cùng phiên khiến chiến lược sau bị ảnh hưởng bởi code và quyết định của chiến lược trước — không độc lập — và context phình to.","<b>D.</b> Hai phiên mới đọc lại toàn bộ tệp lặp lại công việc phân tích đã làm, tốn gấp đôi thời gian và token."]},"cite":"Hướng dẫn ôn tập — §5.10 fork_session và Quản lý Session; Lĩnh vực 1.7"},{"id":"t1q12","n":12,"topic":1,"type":"mcq","stem":{"en":"Your codebase exploration tool stores session IDs to allow engineers to continue investigations across work sessions. An engineer spent an hour yesterday analyzing a legacy authentication module, building context about its architecture and dependencies. They want to continue today. The session ID is valid, but version control shows 3 of the 12 files the agent previously read were modified overnight by a teammate&#x27;s merge. What approach best balances efficiency and accuracy?"},"options":[{"k":"A","t":{"en":"Resume the session and immediately have the agent re-read all 12 previously analyzed files"}},{"k":"B","t":{"en":"Start a fresh session to ensure the agent works with current codebase state without stale assumptions"}},{"k":"C","t":{"en":"Resume the session and inform the agent which specific files changed for targeted re-analysis"}},{"k":"D","t":{"en":"Resume the session without informing the agent about the changed files"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Chỉ 3/12 tệp thay đổi, nên phần lớn context hôm qua vẫn đúng. <b>Resume</b> giữ lại một giờ phân tích, và <b>báo rõ những tệp nào đã thay đổi</b> để agent <b>phân tích lại có mục tiêu</b> đúng 3 tệp đó, tránh dựa vào kết quả tool lỗi thời. Đây là điểm cân bằng giữa hiệu quả và độ chính xác.","elim":["<b>A.</b> Đọc lại cả 12 tệp lãng phí vì 9 tệp không đổi, và làm phình context không cần thiết.","<b>B.</b> Phiên mới vứt bỏ một giờ phân tích trong khi khoảng 75% vẫn còn hợp lệ — quá thận trọng, kém hiệu quả.","<b>D.</b> Không báo khiến agent tiếp tục tin vào nội dung cũ của 3 tệp đã bị sửa, dẫn đến kết luận sai."]},"cite":"Hướng dẫn ôn tập — §5.10 fork_session và Quản lý Session; Lĩnh vực 1.7"},{"id":"t1q13","n":13,"topic":1,"type":"mcq","stem":{"en":"An engineer asks the agent to understand how the caching layer works before adding a new cache invalidation trigger. After initial Grep searches, the agent has identified that caching logic spans 15 files including decorators, middleware, and service classes (~8,000 lines total). What&#x27;s the most effective next step for building understanding while managing context constraints?"},"options":[{"k":"A","t":{"en":"Use the Read tool to sequentially load all 15 files, building complete understanding across the full caching implementation."}},{"k":"B","t":{"en":"Analyze imports and class hierarchies to identify the base cache class, Read that file to understand the interface, then trace specific invalidation implementations."}},{"k":"C","t":{"en":"Use Grep to search for &quot;invalidate&quot; and &quot;expire&quot; patterns across all files, then Read only those specific line ranges with minimal surrounding context."}},{"k":"D","t":{"en":"Use Glob to find files matching common caching patterns (cache.py, caching/), prioritize the largest files by reading them first, then check smaller files for gaps."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> 15 tệp ~8.000 dòng — nạp tất cả sẽ chiếm phần lớn context. Cách hiệu quả là <b>điều tra tăng dần theo cấu trúc</b>: phân tích import và cây kế thừa để tìm <b>lớp cache cơ sở</b>, đọc nó để nắm <b>interface/hợp đồng chung</b>, rồi lần theo các implementation invalidation cụ thể. Hiểu khung kiến trúc trước rồi mới đi vào chi tiết liên quan tới trigger mới, nên chỉ nạp những gì thực sự cần.","elim":["<b>A.</b> Đọc tuần tự toàn bộ 8.000 dòng làm đầy context, gây suy giảm, và phần lớn nội dung không liên quan tới việc thêm một trigger.","<b>C.</b> Chỉ đọc vài dòng quanh “invalidate”/“expire” cho ra các mảnh rời rạc, thiếu hiểu biết về interface và luồng tổng thể, đồng thời bỏ sót logic dùng tên khác.","<b>D.</b> Kích thước tệp không phản ánh tầm quan trọng; đọc tệp lớn nhất trước là heuristic tùy tiện và tốn context."]},"cite":"Hướng dẫn ôn tập — §13.2 Chiến lược Điều tra Tăng dần; Lĩnh vực 5.4"},{"id":"t1q14","n":14,"topic":1,"type":"mcq","stem":{"en":"An engineer who just joined the team asks the agent to help them understand the authentication and authorization architecture before making security improvements. The codebase has 800+ files across multiple services. What exploration strategy will most effectively build understanding, given Claude built-in tools and context limits?"},"options":[{"k":"A","t":{"en":"Read all files containing &quot;auth&quot;, &quot;login&quot;, &quot;permission&quot;, or &quot;token&quot; in their content or filename."}},{"k":"B","t":{"en":"Read any CLAUDE.md and README files first, then ask the engineer to specify which 10-15 files are most important for understanding the auth system."}},{"k":"C","t":{"en":"Use Grep to find authentication entry points, read those files, then follow imports and function calls to map the auth flow incrementally."}},{"k":"D","t":{"en":"Launch parallel subagents to explore different services simultaneously, then synthesize their findings into an architectural overview."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Với 800+ tệp, không thể đọc hết. Chiến lược đúng là <b>điều tra tăng dần</b>: dùng <code>Grep</code> tìm <b>điểm vào xác thực</b> (middleware auth, route login, decorator phân quyền), đọc các tệp đó, rồi <b>lần theo import và lời gọi hàm</b> để vẽ dần luồng auth. Hiểu biết được xây theo quan hệ thực trong code và chỉ nạp các tệp liên quan, phù hợp giới hạn context.","elim":["<b>A.</b> Từ khóa phổ biến như “token”, “auth” xuất hiện ở hàng trăm tệp (kể cả token parser, OAuth client...), làm tràn context với nhiều kết quả nhiễu.","<b>B.</b> Đọc CLAUDE.md/README trước là hợp lý, nhưng bắt kỹ sư MỚI vào nhóm chỉ ra 10–15 tệp quan trọng là không thực tế — đó chính là điều họ đang cần agent giúp tìm hiểu.","<b>D.</b> Chia subagent theo service phân mảnh theo ranh giới tổ chức chứ không theo luồng auth xuyên service; tốn kém khi chưa biết phạm vi và khó ghép thành bức tranh luồng thống nhất."]},"cite":"Hướng dẫn ôn tập — §13.2 Chiến lược Điều tra Tăng dần; Lĩnh vực 2.5"},{"id":"t1q15","n":15,"topic":1,"type":"mcq","stem":{"en":"After integrating a local MCP server providing code analysis tools (analyze_dependencies, find_dead_code, calculate_complexity), you notice the agent continues to use Grep to inspect dependencies even when users explicitly ask about &quot;code dependencies&quot;. Tool definitions reveal: analyze_dependencies returns a dependency graph by analyzing imports. What&#x27;s the most effective approach to improve the agent&#x27;s selection of MCP tools?"},"options":[{"k":"A","t":{"en":"Split analyze_dependencies into granular tools: list_imports, detect_transitive_deps, identify_circular_deps to avoid overlap with Grep."}},{"k":"B","t":{"en":"Expand MCP tool descriptions and outputs–e.g., &quot;Builds dependency graph with list_imports, direct_circular_deps&quot;–to clearly distinguish dependencies and cycle analysis from Grep."}},{"k":"C","t":{"en":"Remove Grep from the available tools to eliminate functional overlap."}},{"k":"D","t":{"en":"Add routing questions to the system prompt specifying that dependency-related questions should use MCP tools rather than Grep."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Agent vẫn dùng <code>Grep</code> vì mô tả <code>analyze_dependencies</code> không cho thấy giá trị khác biệt so với tìm kiếm văn bản. <b>Mở rộng mô tả tool và mô tả đầu ra</b> (trả về dependency graph, phụ thuộc trực tiếp/bắc cầu, phát hiện vòng phụ thuộc) giúp Claude <b>phân biệt rõ</b> khi nào nên dùng tool phân tích thay vì Grep. Mô tả tool là tín hiệu chính để Claude chọn tool.","elim":["<b>A.</b> Tách thành nhiều tool nhỏ tăng số lượng tool cần chọn; nếu mô tả vẫn sơ sài thì vấn đề chọn tool vẫn còn — sự chồng chéo với Grep không phải nguyên nhân gốc.","<b>C.</b> Gỡ Grep loại bỏ công cụ tìm kiếm nội dung thiết yếu cho rất nhiều tác vụ khác chỉ để ép dùng một tool.","<b>D.</b> Quy tắc định tuyến trong system prompt là giải pháp vòng, kém tin cậy hơn sửa trực tiếp mô tả tool — nơi Claude thực sự đánh giá khả năng của từng tool."]},"cite":"Hướng dẫn ôn tập — §2.2 Định nghĩa Tool; Lĩnh vực 2.1"},{"id":"t1q16","n":16,"topic":1,"type":"mcq","stem":{"en":"Your extraction pipeline processes contracts that frequently include amendments. When a contract contains both original terms and later amendments (e.g., original clause specifies &quot;30-day payment terms&quot; while Amendment 1 changes this to &quot;45 days&quot;), the model inconsistently extracts one value or the other with no indication of which applies. What&#x27;s the most effective approach to improve extraction accuracy for documents with amendments?"},"options":[{"k":"A","t":{"en":"Add prompt instructions to always extract the most recent amendment value and ignore superseded original terms."}},{"k":"B","t":{"en":"Implement post-extraction validation using pattern matching to detect amendments and flag those extractions for manual review."}},{"k":"C","t":{"en":"Redesign the schema so amended fields capture multiple values, each with source location and effective date."}},{"k":"D","t":{"en":"Preprocess documents with a classifier that identifies and removes superseded sections before the main extraction step."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Hợp đồng thực sự chứa <b>nhiều giá trị hợp lệ cho cùng một trường theo thời gian</b>; schema chỉ cho một giá trị buộc model chọn tùy tiện. Thiết kế lại để trường bị sửa đổi lưu <b>nhiều giá trị, mỗi giá trị kèm vị trí nguồn và ngày hiệu lực</b> bảo toàn đầy đủ thông tin và provenance, để downstream xác định giá trị nào áp dụng tại thời điểm nào — thay vì mất dữ liệu một cách im lặng.","elim":["<b>A.</b> “Luôn lấy sửa đổi mới nhất” làm mất dấu vết điều khoản gốc và sai khi sửa đổi có ngày hiệu lực tương lai hoặc chỉ áp dụng một phần; không còn thông tin để kiểm chứng.","<b>B.</b> Chỉ gắn cờ review thủ công sau khi đã trích xuất không cải thiện độ chính xác của bản thân việc trích xuất, lại tăng tải cho con người.","<b>D.</b> Bộ phân loại xóa phần bị thay thế thêm một bước dễ sai, có thể xóa nhầm và làm mất lịch sử điều khoản cần cho kiểm toán."]},"cite":"Hướng dẫn ôn tập — §12.2 Xử lý Dữ liệu Xung đột; Lĩnh vực 4.3"},{"id":"t1q17","n":17,"topic":1,"type":"mcq","stem":{"en":"After deployment, you find that 12% of extractions contain semantic errors that pass JSON schema validation (e.g., a duration like &quot;30 minutes&quot; incorrectly placed in an ingredient quantity field). Human reviewers have capacity to check only 20% of extractions. Which approach most effectively allocates reviewer attention?"},"options":[{"k":"A","t":{"en":"Randomly sample 20% of extractions for review, using corrections to track accuracy and identify error patterns."}},{"k":"B","t":{"en":"Review all extractions from documents with formatting anomalies such as unusual layouts or mixed content types."}},{"k":"C","t":{"en":"Have the model output field-level confidence scores, then calibrate review thresholds using a labeled validation set."}},{"k":"D","t":{"en":"Prioritize review of all extractions where required fields are empty or explicitly marked as not found."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Lỗi ngữ nghĩa (như “30 minutes” nằm trong trường số lượng nguyên liệu) vượt qua schema validation, nên cần một tín hiệu chất lượng <b>ở cấp trường</b>. Cho model xuất <b>confidence score theo trường</b>, rồi <b>hiệu chỉnh ngưỡng bằng tập validation có nhãn</b> (vì confidence thô chưa chắc khớp độ chính xác thực), giúp dồn 20% năng lực review vào đúng những trích xuất có khả năng sai cao nhất.","elim":["<b>A.</b> Lấy mẫu ngẫu nhiên tốt cho đo lường độ chính xác nhưng không phân bổ theo rủi ro — chỉ bắt được khoảng 20% số lỗi.","<b>B.</b> Dị thường định dạng chỉ là một yếu tố rủi ro; lỗi đặt giá trị sai trường vẫn xảy ra ở tài liệu định dạng bình thường.","<b>D.</b> Trường trống/“not found” là lỗi thiếu dữ liệu, còn vấn đề ở đây là giá trị đã điền nhưng sai — tiêu chí này bỏ sót đúng loại lỗi cần bắt."]},"cite":"Hướng dẫn ôn tập — §9.4 Hiệu chỉnh độ tin cậy và giám sát của con người; Lĩnh vực 5.5"},{"id":"t1q18","n":18,"topic":1,"type":"mcq","stem":{"en":"Your extraction pipeline processes invoices and extracts line items, tax amounts, and grand totals. You discover that 8% of documents have extracted line item amounts that don&#x27;t sum to the extracted grand total—the downstream accounting system has been detecting mismatches. What&#x27;s the most effective improvement?"},"options":[{"k":"A","t":{"en":"Extract line items and totals independently, then use a separate validation model to reconcile discrepancies."}},{"k":"B","t":{"en":"Implement post-processing that automatically adjusts line item amounts when the extracted total doesn&#x27;t match the sum."}},{"k":"C","t":{"en":"Add few-shot examples to the system prompt where extracted line items correctly sum to demonstrate the desired extraction behavior."}},{"k":"D","t":{"en":"Add a calculated_total field where the model extracts line items independently, then validate totals alongside a is_total_consistent boolean flag for human review when values differ."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Đây là mẫu <b>tự kiểm tra (self-correction)</b> cho lỗi ngữ nghĩa: model trích xuất line items và tổng in trên hóa đơn độc lập, đồng thời tính <code>calculated_total</code> từ line items; cờ <code>is_total_consistent</code> cho biết hai giá trị có khớp không. Khi không khớp, bản ghi được <b>chuyển con người review</b> — lỗi được phát hiện ngay tại pipeline thay vì để hệ thống kế toán downstream bắt, và dữ liệu không bị sửa âm thầm.","elim":["<b>A.</b> Thêm một model thẩm định riêng tăng chi phí và độ phức tạp; việc “hòa giải” tự động cũng không biết giá trị nào mới đúng.","<b>B.</b> Tự động chỉnh line items cho khớp tổng là làm sai lệch dữ liệu — có khi chính tổng bị trích xuất sai; nó che giấu lỗi thay vì phát hiện.","<b>C.</b> Few-shot có thể giảm lỗi phần nào nhưng không có cơ chế phát hiện và gắn cờ các trường hợp vẫn sai."]},"cite":"Hướng dẫn ôn tập — §6.6 Tự sửa lỗi (Self-correction); Lĩnh vực 4.4"},{"id":"t1q19","n":19,"topic":1,"type":"mcq","stem":{"en":"Your pipeline uses a tool called extract_metadata with a JSON schema for paper details. During testing, the agent sometimes fails to call extract_metadata because it wants to provide direct answers. What&#x27;s the most reliable way to ensure metadata extraction always happens first?"},"options":[{"k":"A","t":{"en":"Set tool_choice to &quot;auto&quot; in the API call, combined with tools so that Claude always prioritizes metadata before any other tool calls."}},{"k":"B","t":{"en":"Set tool_choice to &quot;auto&quot; and reorder the tool definitions placing extract_metadata first since Claude prioritizes earlier-listed tools."}},{"k":"C","t":{"en":"Set tool_choice to type &quot;tool&quot;, name &quot;extract_metadata&quot; and process the enrichment requests in subsequent turns after receiving the extracted metadata."}},{"k":"D","t":{"en":"Set tool_choice to type &quot;any&quot; so Claude must use a tool, combined with system prompt instructions to call extract_metadata first."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Đặt <code>tool_choice</code> dạng <code>{\"type\": \"tool\", \"name\": \"extract_metadata\"}</code> <b>buộc Claude gọi đúng tool đó</b> ở lượt này — không thể trả lời trực tiếp hay gọi tool khác. Sau khi nhận metadata, các bước enrichment được xử lý ở các lượt tiếp theo. Đây là bảo đảm ở mức API, khác hẳn chỉ dẫn trong prompt vốn mang tính xác suất.","elim":["<b>A.</b> <code>auto</code> để model tự quyết có gọi tool hay không — chính là chế độ đang cho phép model trả lời trực tiếp, không bảo đảm gì.","<b>B.</b> Thứ tự định nghĩa tool không phải cơ chế ưu tiên được bảo đảm; với <code>auto</code> model vẫn có thể bỏ qua tool.","<b>D.</b> <code>any</code> buộc gọi MỘT tool nào đó nhưng không chỉ định tool nào; việc gọi <code>extract_metadata</code> trước vẫn chỉ dựa vào system prompt."]},"cite":"Hướng dẫn ôn tập — §2.3 Tham số tool_choice; Lĩnh vực 2.3"},{"id":"t1q20","n":20,"topic":1,"type":"mcq","stem":{"en":"After your daily batch of 10,000 documents completes, 300 documents (3%) failed with &quot;context_length_exceeded&quot; errors. The results file identifies each failure by custom_id. What&#x27;s the most cost-effective approach to process these failures?"},"options":[{"k":"A","t":{"en":"Resubmit only the 300 failed documents after chunking them into smaller pieces, then combine the partial extractions"}},{"k":"B","t":{"en":"Increase the max_tokens parameter for the 300 failed documents and resubmit them in a new batch"}},{"k":"C","t":{"en":"Reprocess the entire batch with prompt caching enabled to reduce the cost of retrying requests with identical system prompts"}},{"k":"D","t":{"en":"Resubmit the entire 10,000 document batch using a model tier with a larger context window"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> <code>context_length_exceeded</code> nghĩa là <b>đầu vào quá dài</b> so với context window. Dùng <code>custom_id</code> để xác định đúng 300 tài liệu lỗi, <b>chia nhỏ chúng thành các đoạn</b> vừa context, chỉ gửi lại những tài liệu này (vẫn có thể qua batch để hưởng giảm 50%) rồi gộp các kết quả từng phần. Không xử lý lại 9.700 tài liệu đã thành công.","elim":["<b>B.</b> <code>max_tokens</code> giới hạn ĐẦU RA; tăng nó không giải quyết đầu vào vượt context window, thậm chí còn làm tổng token yêu cầu lớn hơn.","<b>C.</b> Xử lý lại toàn bộ batch lãng phí 9.700 tài liệu đã thành công, và prompt caching không làm tài liệu ngắn đi nên 300 tài liệu vẫn lỗi.","<b>D.</b> Gửi lại toàn bộ 10.000 tài liệu cho một vấn đề chỉ 3% là cực kỳ tốn kém; model có context lớn hơn cũng chưa chắc đủ cho các tài liệu quá dài."]},"cite":"Hướng dẫn ôn tập — §7.4 Xử lý các thất bại trong Batch; Lĩnh vực 4.5"},{"id":"t1q21","n":21,"topic":1,"type":"mcq","stem":{"en":"Your extraction system parses e-commerce product descriptions to extract specifications like dimensions, weight, and materials into JSON. Despite having a well-defined schema, the model inconsistently extracts the &quot;materials&quot; field–sometimes returning &quot;cotton blend&quot;, other times &quot;Cotton/Polyester mix&quot;, and occasionally omitting the field when material information is clearly present in the source. What&#x27;s the most effective way to improve extraction consistency?"},"options":[{"k":"A","t":{"en":"Switch to a more capable model tier since inconsistent extraction indicates insufficient model capability"}},{"k":"B","t":{"en":"Add few-shot examples showing 2-3 complete input-output pairs with standardized material description formats"}},{"k":"C","t":{"en":"Set temperature to 0 to eliminate randomness and ensure deterministic outputs"}},{"k":"D","t":{"en":"Make the &quot;materials&quot; field required instead of optional in the schema to force the model to always extract a value"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>Đáp án B.</b> Schema định nghĩa cấu trúc nhưng không truyền đạt được <b>định dạng chuẩn hóa mong muốn</b> hay ranh giới khi nào phải trích xuất. <b>Few-shot 2–3 cặp input–output đầy đủ</b> cho model thấy cụ thể cách viết vật liệu thống nhất (ví dụ cùng một kiểu cho “cotton blend”/“Cotton/Polyester mix”) và cho thấy phải điền trường khi thông tin có mặt. Few-shot là kỹ thuật hiệu quả nhất để tăng tính nhất quán của đầu ra.","elim":["<b>A.</b> Sự bất nhất đến từ việc thiếu đặc tả định dạng, không phải năng lực model; model mạnh hơn vẫn không biết bạn muốn chuẩn nào.","<b>C.</b> <code>temperature</code> 0 giảm ngẫu nhiên nhưng không định nghĩa chuẩn định dạng; các mô tả nguồn khác nhau vẫn cho ra cách viết khác nhau.","<b>D.</b> Bắt buộc trường khiến model bịa giá trị khi sản phẩm thật sự không ghi vật liệu, và không giải quyết chuyện định dạng không thống nhất."]},"cite":"Hướng dẫn ôn tập — §6.1 Few-shot Prompting; Lĩnh vực 4.2"},{"id":"t1q22","n":22,"topic":1,"type":"mcq","stem":{"en":"Your system extracts event metadata (date, location, organizer, attendee_count) from news articles using a JSON schema with all nullable fields. During evaluation, you observe the model frequently generates plausible but incorrect values for fields not mentioned in the article–for example, outputting &quot;500&quot; for attendee_count when the source contains no attendance information. What&#x27;s the most effective way to reduce these false extractions?"},"options":[{"k":"A","t":{"en":"Make all schema fields required (non-nullable) with strict validation rules to ensure the model only outputs verifiable data."}},{"k":"B","t":{"en":"Upgrade to a more capable model tier with improved instruction-following to reduce hallucination tendencies."}},{"k":"C","t":{"en":"Add a post-processing step using a second LLM call to verify each extracted value exists in the source document."}},{"k":"D","t":{"en":"Add prompt instructions to return null for any field where information is not directly stated in the source."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>Đáp án D.</b> Schema đã cho phép null nhưng model không biết <b>khi nào</b> nên dùng null, nên điền giá trị “hợp lý” như “500”. Chỉ dẫn tường minh <b>trả về null cho mọi trường không được nêu trực tiếp trong nguồn</b> đặt ra tiêu chí rõ ràng và cho model một “lối thoát” hợp lệ thay vì hallucinate. Đây là cách rẻ, đúng gốc rễ.","elim":["<b>A.</b> Bắt buộc non-nullable làm vấn đề tệ hơn: model buộc phải điền giá trị ngay cả khi bài báo không có thông tin, tăng bịa đặt.","<b>B.</b> Model mạnh hơn vẫn có xu hướng điền giá trị khi không có tiêu chí rõ; vấn đề là thiếu chỉ dẫn chứ không phải năng lực.","<b>C.</b> Lời gọi LLM thứ hai tăng gấp đôi chi phí và độ trễ chỉ để bắt triệu chứng; nên ngăn ngay từ prompt trích xuất."]},"cite":"Hướng dẫn ôn tập — §2.4 JSON Schema cho Structured Output; Lĩnh vực 4.1"},{"id":"t1q23","n":23,"topic":1,"type":"mcq","stem":{"en":"After implementing tool use with strict schema definitions, JSON syntax errors are eliminated, but 5% of extractions still have valid JSON with empty arrays or null values for required fields like citations and methodology. Spot-checking reveals that source documents contain this information, but in varied formats–inline citations vs. bibliographies, methodology sections vs. details embedded in introductions. What&#x27;s the most effective way to address these failures?"},"options":[{"k":"A","t":{"en":"Build a regex-based post-processing layer that scans source documents for citation patterns and methodology keywords, populating empty fields when the model fails to extract."}},{"k":"B","t":{"en":"Modify your schema to make citations and methodology optional, and flag incomplete records for manual review rather than failing validation."}},{"k":"C","t":{"en":"Add few-shot examples demonstrating extractions from documents with varied structures–showing how to identify citations in different formats and locate methodology details across section types."}},{"k":"D","t":{"en":"Implement retry logic that re-sends requests when validation detects empty required fields."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Thông tin thực sự có trong nguồn nhưng ở <b>nhiều định dạng khác nhau</b> (trích dẫn nội dòng vs thư mục cuối bài; phương pháp ở mục riêng vs lồng trong phần giới thiệu), và model không nhận ra chúng. <b>Few-shot từ các tài liệu có cấu trúc đa dạng</b> dạy model cách nhận diện và định vị thông tin trong từng biến thể — giải quyết đúng gốc rễ là khả năng nhận diện, không chỉ xử lý triệu chứng.","elim":["<b>A.</b> Regex mong manh trước chính sự đa dạng định dạng đã làm model thất bại, và không thể nhận ra “phương pháp nằm trong phần giới thiệu” vốn cần hiểu ngữ nghĩa.","<b>B.</b> Biến trường thành optional che giấu lỗi và đẩy gánh nặng sang con người, trong khi thông tin thực sự có trong tài liệu.","<b>D.</b> Retry không kèm hướng dẫn mới về cách tìm thông tin ở định dạng lạ thường cho kết quả lặp lại; model thiếu cách nhận diện chứ không gặp lỗi ngẫu nhiên."]},"cite":"Hướng dẫn ôn tập — §6.1 Few-shot Prompting; Lĩnh vực 4.2"},{"id":"t1q24","n":24,"topic":1,"type":"mcq","stem":{"en":"Your extraction system implements automatic retries when validation fails. On each retry, the specific validation error is appended to the prompt. This retry-with-error-feedback approach resolves most failures within 2-3 attempts For which failure pattern would additional retries be LEAST effective?"},"options":[{"k":"A","t":{"en":"The model extracts citation counts as locale-formatted strings (&quot;1,234&quot;) when the schema requires integers"}},{"k":"B","t":{"en":"The model extracts keywords as a nested object organized by category when the schema requires a flat array of strings"}},{"k":"C","t":{"en":"The model extracts &quot;et al.&quot; for co-authors when the full list exists only in an external document not in the input"}},{"k":"D","t":{"en":"The model extracts dates as ISO 8601 datetime strings (&quot;2023-03-15T00:00:00Z&quot;) when the schema requires only the date portion (YYYY-MM-DD)"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>Đáp án C.</b> Retry-with-error-feedback hiệu quả khi lỗi là <b>định dạng hoặc cấu trúc</b> mà model có thể tự sửa bằng thông tin <b>đã có trong input</b>. Danh sách đồng tác giả đầy đủ chỉ nằm trong <b>tài liệu bên ngoài, không có trong input</b> — dù retry bao nhiêu lần, model cũng không thể tạo ra thông tin nó không có; cách đúng là đánh dấu thiếu hoặc cung cấp thêm nguồn.","elim":["<b>A.</b> Đổi “1,234” thành số nguyên 1234 là lỗi định dạng đơn giản; thông báo lỗi chỉ rõ yêu cầu integer nên retry sửa được dễ dàng.","<b>B.</b> Object lồng theo danh mục vs mảng phẳng là lỗi cấu trúc; dữ liệu đã có sẵn, phản hồi lỗi giúp model làm phẳng — retry hiệu quả.","<b>D.</b> Cắt ISO datetime về <code>YYYY-MM-DD</code> là chỉnh định dạng trực tiếp; retry kèm lỗi giải quyết ngay."]},"cite":"Hướng dẫn ôn tập — §6.5 Validation và Retry-with-Feedback; Lĩnh vực 4.4"},{"id":"t1q25","n":25,"topic":1,"type":"mcq","stem":{"en":"Your extraction pipeline processes restaurant menus and must output structured JSON with fields for item names, descriptions, prices, and dietary tags. Some menus use inconsistent formatting–prices as &quot;$12&quot; vs &quot;12.00&quot;, dietary info as icons vs text. What&#x27;s the most reliable approach?"},"options":[{"k":"A","t":{"en":"Define a strict output schema and include format normalization rules in your prompt."}},{"k":"B","t":{"en":"Use separate extraction calls for each field to ensure consistent handling of each type."}},{"k":"C","t":{"en":"Extract data as-is and normalize formats in post-processing code after Claude returns."}},{"k":"D","t":{"en":"Request multiple extraction attempts per document and select the most common format."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>Đáp án A.</b> Kết hợp <b>schema đầu ra chặt chẽ</b> (cấu trúc, kiểu dữ liệu: giá là số, dietary tags là danh sách chuẩn) với <b>quy tắc chuẩn hóa trong prompt</b> (ví dụ “$12” và “12.00” đều thành 12.00; biểu tượng lá thành “ve
